ough, diagnosed as acute bronchitis, and was prescribed amoxicillin. On examination, his tongue is swollen. He has difficulty speaking and points to his tongue as the cause of his inability to speak. On lung auscultation, wheezes are heard. No rash is noted. Which one of the following drugs can be the cause of this presentation?</p>", "options": [{"letter": "A", "text": "Metformin."}, {"letter": "B", "text": "Simvastatin."}, {"letter": "C", "text": "Amoxicillin."}, {"letter": "D", "text": "Ramipril."}, {"letter": "E", "text": "Chlorpropamide."}], "rationale": "<p>1. 题型识别：诊断 — 药物不良反应归因 2. 关键判断：舌肿胀 + 呼吸道受累 + <strong>无皮疹</strong> → 血管性水肿（非过敏性休克） 3. ACEI 是药物诱导血管性水肿的<strong>首要原因</strong>（因广泛处方）</p>\n<ul>\n<li>最常累及：唇、舌、面部、上气道；咽、喉、声门下区也有报道</li>\n<li>喉头水肿早期征象：声音嘶哑、吸气性喘鸣 → 可进展为气道梗阻（高达 10%）</li>\n<p>4. 排除：</p>\n<li>阿莫西林（C）：I 型超敏反应可有血管性水肿，但<strong>常伴皮疹和瘙痒</strong>——无皮疹瘙痒使其可能性降低；且已完成疗程</li>\n<li>氯磺丙脲（E）：磺脲类罕见血管性水肿</li>\n<li>二甲双胍（A）/他汀（B）：无关联</li>\n<p>5. 处理：<strong>永不再用 ACEI 类</strong>，换用 ARB（血管性水肿风险低得多但仍有） 6. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>皮疹/瘙痒排除 ACEI 血管性水肿</strong>：出现皮疹或瘙痒应考虑 ACEI 之外的其他病因——这是本病的标志性鉴别要点</li>\n<li><strong>可发生于用药多年后</strong>：ACEI 血管性水肿最常见于治疗最初几年，但<strong>用药多年后也可发生</strong>，患者可有多次发作才被识别</li>\n<li><strong>换 ARB 而非停药即可</strong>：发作后该患者<strong>永不再用 ACEI 类</strong>，常用做法是换 ARB（风险低、严重度低）</li>\n</ul>", "summary": "<p><strong>ACEI 诱导血管性水肿</strong>：</p>\n<ul>\n<li>最常见药物性血管性水肿病因</li>\n<li>最常累及唇、舌、面部、上气道；10% 可致气道梗阻</li>\n<li><strong>有皮疹/瘙痒则排除</strong></li>\n<li>少数累及肠道 → 急性腹痛伴腹泻</li>\n<li>发作后永不再用 ACEI；换 ARB（风险低、严重度低）</li>\n</ul>", "explanation": "<p>舌肿胀伴呼吸道受累、无皮疹，高度提示血管性水肿。ACE 抑制剂是药物诱导血管性水肿的首要原因。本例所用药物中<strong>雷米普利是 ACEI，最可能是病因</strong>。二甲双胍和氯磺丙脲不相关；他汀无血管性水肿关联；阿莫西林 I 型超敏反应常有皮疹和瘙痒，且已完成疗程，可能性低。</p>", "references": "<ul>\n<li>http://www.racgp.org.au/afp/2013/december/ace-inhi</li>\n<li>http://www.uptodate.com/contents/ace-inhibitor-ind</li>\n</ul>", "related": ["AMC-Q1215-Bradykinin-Angioedema", "_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": ["cough", "fever"], "search": "acei 血管性水肿 — 无皮疹的舌肿胀\nacei 血管性水肿 — 舌肿胀无皮疹\n a 61-year-old man is brought to your clinic by his wife with complaint of sudden-onset tongue swelling. he is diabetic and is on treatment with metformin and chlorpropramide, has hypercholesterolemia for which he takes simvastatin, and also suffers from hypertension that is controlled with ramipril. four weeks ago, he presented to his gp with complaints of fever and productive cough, diagnosed as acute bronchitis, and was prescribed amoxicillin. on examination, his tongue is swollen. he has difficulty speaking and points to his tongue as the cause of his inability to speak. on lung auscultation, wheezes are heard. no rash is noted. which one of the following drugs can be the cause of this presentation? \n 舌肿胀伴呼吸道受累、无皮疹，高度提示血管性水肿。ace 抑制剂是药物诱导血管性水肿的首要原因。本例所用药物中 雷米普利是 acei，最可能是病因 。二甲双胍和氯磺丙脲不相关；他汀无血管性水肿关联；阿莫西林 i 型超敏反应常有皮疹和瘙痒，且已完成疗程，可能性低。 "}, {"id": "AMC-Q0974", "type": "mcq", "qid": 974, "title": "转移性乳腺癌 — 预后最差的恶性肿瘤", "department": "General", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["恶性肿瘤预后 — 转移性乳腺癌预后最差"], "difficulty": 2, "correctAnswer": "D", "page": 1452, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0974-Metastatic-Breast-Cancer-Prognosis.md", "stem": "<p>Which one of the following malignancies is associated with <strong>poorest</strong> prognosis?</p>", "options": [{"letter": "A", "text": "Hodgkin lymphoma."}, {"letter": "B", "text": "Non-Hodgkin lymphoma."}, {"letter": "C", "text": "Testicular cancer."}, {"letter": "D", "text": "Metastatic breast cancer."}, {"letter": "E", "text": "Melanoma."}], "rationale": "<p>1. 题型识别：诊断 — 肿瘤预后比较 2. 关键数据对比（5年生存率）：</p>\n<ul>\n<li>睾丸癌：<strong>98%</strong>（最高）</li>\n<li>黑色素瘤：<strong>91%</strong></li>\n<li>霍奇金淋巴瘤：<strong>86%</strong></li>\n<li>非霍奇金淋巴瘤：<strong>69%</strong></li>\n<li>转移性乳腺癌：<strong>22%</strong>（最低）</li>\n<p>3. 注意区分：非转移性乳腺癌5年生存率89%，但<strong>转移性（IV期）仅22%</strong> 4. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>转移性 vs 非转移性乳腺癌</strong>：题目问\"转移性\"乳腺癌，不是所有乳腺癌（后者预后较好，89%）</li>\n<li><strong>霍奇金 vs 非霍奇金</strong>：霍奇金淋巴瘤预后优于非霍奇金（86% vs 69%）</li>\n</ul>", "summary": "<p><strong>常见癌症5年生存率</strong>（Murtagh's General Practice）：</p>\n<table class='md-table'>\n<thead><tr><th>癌症</th><th>5年生存率</th></tr></thead>\n<tbody>\n<tr><td>胰腺癌</td><td>5%</td></tr>\n<tr><td>肝癌</td><td>10%</td></tr>\n<tr><td>胃癌</td><td>25%</td></tr>\n<tr><td>卵巢癌</td><td>41%</td></tr>\n<tr><td>膀胱癌</td><td>51%</td></tr>\n<tr><td>结肠癌</td><td>63%</td></tr>\n<tr><td>非霍奇金淋巴瘤</td><td>69%</td></tr>\n<tr><td>子宫癌</td><td>84%</td></tr>\n<tr><td>霍奇金淋巴瘤</td><td>86%</td></tr>\n<tr><td>前列腺癌</td><td>89%</td></tr>\n<tr><td>乳腺癌</td><td>89%</td></tr>\n<tr><td>黑色素瘤</td><td>91%</td></tr>\n<tr><td>甲状腺癌</td><td>92%</td></tr>\n<tr><td>睾丸癌</td><td>98%</td></tr>\n</tbody>\n</table>", "explanation": "<p>转移性乳腺癌（IV期）的5年生存率约为22%，是选项中预后最差的。非转移性乳腺癌预后良好（89%），但IV期显著下降。睾丸癌预后极佳（98%），黑色素瘤（91%）和霍奇金淋巴瘤（86%）预后相对较好。</p>", "references": "<ul>\n<li>Murtagh's General Practice – McGraw Hill – 6th Edition – page 257</li>\n<li>http://www.cancer.org/cancer/breastcancer/detailed</li>\n<li>http://seer.cancer.gov/csr/1975_2013/results_merge</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "转移性乳腺癌 — 预后最差的恶性肿瘤\n恶性肿瘤预后 — 转移性乳腺癌预后最差\n which one of the following malignancies is associated with  poorest  prognosis? \n 转移性乳腺癌（iv期）的5年生存率约为22%，是选项中预后最差的。非转移性乳腺癌预后良好（89%），但iv期显著下降。睾丸癌预后极佳（98%），黑色素瘤（91%）和霍奇金淋巴瘤（86%）预后相对较好。 "}, {"id": "AMC-Q1014", "type": "mcq", "qid": 1014, "title": "ACEI 禁忌证 — 咳嗽不是禁忌（否定型）", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["ACEI 禁忌证 — 咳嗽不是（否定型）"], "difficulty": 2, "correctAnswer": "C", "page": 1423, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1014-ACEI-Contraindications.md", "stem": "<p>Which one of the following is not a contraindication to ACE inhibitor use?</p>", "options": [{"letter": "A", "text": "Bilateral renal artery stenosis."}, {"letter": "B", "text": "Pregnancy."}, {"letter": "C", "text": "Cough."}, {"letter": "D", "text": "Angioedema."}, {"letter": "E", "text": "Previous allergic reaction to ACE inhibitors."}], "rationale": "<p>1. 题型识别：否定型药理题 — 找<strong>不是</strong>禁忌证的选项 2. ACEI <strong>绝对禁忌证</strong>：</p>\n<ul>\n<li>任何原因血管性水肿病史（即使与 ACEI 无关）</li>\n<li>妊娠（对胎儿有害）</li>\n<li>双侧肾动脉狭窄</li>\n<li>既往对 ACEI 过敏反应</li>\n<p>3. <strong>相对禁忌</strong>：主动脉瓣狭窄、肥厚型心肌病 4. 干咳（C）：常见不良反应，<strong>不是禁忌</strong>——注意区分不良反应和禁忌证 5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>不良反应 vs 禁忌证</strong>：咳嗽是常见不良反应（可致停药）但不是禁忌——题目考的是这个区分</li>\n<li><strong>\"任何原因的血管性水肿\"</strong>：即使不是 ACEI 引起，有血管性水肿病史也是 ACEI 绝对禁忌</li>\n<li><strong>双侧肾动脉狭窄</strong>：ACEI 使入球小动脉扩张 → 肾灌注压下降 → 肾衰，是绝对禁忌</li>\n</ul>", "summary": "<p><strong>ACEI 禁忌证</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>项目</th></tr></thead>\n<tbody>\n<tr><td>绝对</td><td>血管性水肿病史（任何原因）、妊娠、双侧肾动脉狭窄、既往 ACEI 过敏反应</td></tr>\n<tr><td>相对</td><td>主动脉瓣狭窄、肥厚型心肌病</td></tr>\n</tbody>\n</table>\n<p><strong>ACEI 常见不良反应</strong>：干咳（最常见、非禁忌）、高钾血症、头晕、味觉丧失</p>", "explanation": "<p>ACEI 绝对禁忌证包括：任何原因的血管性水肿病史、妊娠（对胎儿有害）、双侧肾动脉狭窄、既往 ACEI 过敏反应。相对禁忌包括主动脉瓣狭窄和肥厚型心肌病。<strong>干咳是 ACEI 的常见不良反应</strong>（依从性差和停药的主要原因），但既有的咳嗽或 ACEI 诱导的咳嗽都不是禁忌证。</p>", "references": "<ul>\n<li>http://www.fpnotebook.com/cv/pharm/AcInhbtr.htm</li>\n</ul>", "related": ["AMC-Q0967-ACEI-Angioedema", "_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "acei 禁忌证 — 咳嗽不是禁忌（否定型）\nacei 禁忌证 — 咳嗽不是（否定型）\n which one of the following is not a contraindication to ace inhibitor use? \n acei 绝对禁忌证包括：任何原因的血管性水肿病史、妊娠（对胎儿有害）、双侧肾动脉狭窄、既往 acei 过敏反应。相对禁忌包括主动脉瓣狭窄和肥厚型心肌病。 干咳是 acei 的常见不良反应 （依从性差和停药的主要原因），但既有的咳嗽或 acei 诱导的咳嗽都不是禁忌证。 "}, {"id": "AMC-Q1215", "type": "mcq", "qid": 1215, "title": "缓激肽介导血管性水肿 — 雷米普利是病因", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["缓激肽介导血管性水肿 — ACEI 最常见触发"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1215-Bradykinin-Angioedema.md", "stem": "<p>A 52-year-old man presents to the emergency department with complaint of a swollen tongue after he had seafood 2 hours ago. His medical history is remarkable for diabetes mellitus for which he is taking metformin 500md 8-hourly, hypertension controlled on ramipril and indapamide, and hypercholesterolemia treated with atorvastatin 20mg daily. He mentions no itching. On examination, he has stable vital signs with no respiratory or abdominal symptoms. Which one of the following could be the most likely cause of this presentation?</p>", "options": [{"letter": "A", "text": "Anaphylaxis."}, {"letter": "B", "text": "C1 esterase inhibitor deficiency."}, {"letter": "C", "text": "Ramipril."}, {"letter": "D", "text": "Atorvastatin."}, {"letter": "E", "text": "Metformin."}], "rationale": "<p>1. 题型识别：诊断 — 血管性水肿分型 2. 关键判断：舌肿胀<strong>单独</strong>出现，无荨麻疹/瘙痒/呼吸道/循环症状 → <strong>缓激肽介导</strong>血管性水肿（非肥大细胞相关） 3. 缓激肽型特点：</p>\n<ul>\n<li>不伴过敏反应表现（荨麻疹、呼吸/循环症状、瘙痒）</li>\n<li>时间病程更长：24-36 小时发展，2-4 天缓解</li>\n<li>与触发因素无明确关系</li>\n<p>4. <strong>ACEI 是缓激肽介导血管性水肿最常见触发因素</strong> → 雷米普利（C） 5. 排除：</p>\n<li>过敏性休克（A）：海鲜 2 小时 + 无荨麻疹/循环/呼吸症状 → 可能性低</li>\n<li>C1 酯酶抑制剂缺乏（B）：获得性罕见综合征，多见于 >40 岁，但罕见性使其可能性较低</li>\n<li>他汀（D）/二甲双胍（E）：无血管性水肿关联</li>\n<p>6. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>\"吃了海鲜 2 小时\"是干扰</strong>：虽有时间相关，但无过敏反应的其他特征（荨麻疹、瘙痒、呼吸/循环症状）→ 指向缓激肽型而非肥大细胞型</li>\n<li><strong>缓激肽型无瘙痒</strong>：瘙痒是肥大细胞/组胺型特征</li>\n<li><strong>ARB 也可</strong>：氯沙坦、缬沙坦等 ARB 也能诱导，但关联不如 ACEI 强</li>\n<li><strong>C1-INH 缺乏</strong>：获得性血管性水肿（AAE）与 B 细胞淋巴增殖性疾病相关，表现类似但更罕见</li>\n</ul>", "summary": "<p><strong>血管性水肿三型</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>机制</th><th>特征</th></tr></thead>\n<tbody>\n<tr><td>肥大细胞相关</td><td>食物/昆虫叮咬过敏</td><td>常伴荨麻疹、潮红、瘙痒、支气管痉挛；数分钟发病，24-48h 缓解</td></tr>\n<tr><td>组胺相关</td><td>组胺依赖（特发性）</td><td>可孤立或伴荨麻疹，无呼吸/循环症状</td></tr>\n<tr><td><strong>缓激肽介导</strong></td><td>ACEI 最常见</td><td><strong>无荨麻疹/瘙痒/呼吸循环症状</strong>；24-36h 发展、2-4 天缓解；与触发无明确关系</td></tr>\n</tbody>\n</table>\n<p><strong>血管性水肿特点</strong>：</p>\n<ul>\n<li>起病数分钟-数小时，自发缓解数小时-数天</li>\n<li>不对称分布、不累及重力依赖区</li>\n<li>累及面、唇、喉、肠道（空肠最常见 → 绞痛、梗阻、腹水）</li>\n</ul>\n<p><strong>缓激肽型触发因素</strong>：ACEI（卡托普利、雷米普利、赖诺普利、依那普利、培哚普利）最常见；ARB 关联较弱</p>", "explanation": "<p>本例舌肿胀为血管性水肿的<strong>唯一表现</strong>，无过敏或过敏反应的其他症状 → 最可能是<strong>缓激肽介导的血管性水肿</strong>。ACEI（如雷米普利）是缓激肽介导血管性水肿最常见的触发因素。过敏反应因无荨麻疹、循环/呼吸症状和瘙痒而可能性低。获得性 C1 酯酶抑制剂缺乏虽可表现类似，但罕见性使其可能性较低。他汀和二甲双胍无血管性水肿关联。</p>", "references": "<ul>\n<li>https://emedicine.medscape.com/article/135208-overview</li>\n<li>https://www.uptodate.com/contents/ace-inhibitor-induced-angioedema</li>\n</ul>", "related": ["AMC-Q0967-ACEI-Angioedema", "_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "缓激肽介导血管性水肿 — 雷米普利是病因\n缓激肽介导血管性水肿 — acei 最常见触发\n a 52-year-old man presents to the emergency department with complaint of a swollen tongue after he had seafood 2 hours ago. his medical history is remarkable for diabetes mellitus for which he is taking metformin 500md 8-hourly, hypertension controlled on ramipril and indapamide, and hypercholesterolemia treated with atorvastatin 20mg daily. he mentions no itching. on examination, he has stable vital signs with no respiratory or abdominal symptoms. which one of the following could be the most likely cause of this presentation? \n 本例舌肿胀为血管性水肿的 唯一表现 ，无过敏或过敏反应的其他症状 → 最可能是 缓激肽介导的血管性水肿 。acei（如雷米普利）是缓激肽介导血管性水肿最常见的触发因素。过敏反应因无荨麻疹、循环/呼吸症状和瘙痒而可能性低。获得性 c1 酯酶抑制剂缺乏虽可表现类似，但罕见性使其可能性较低。他汀和二甲双胍无血管性水肿关联。 "}, {"id": "AMC-Q1221", "type": "mcq", "qid": 1221, "title": "罗格列酮 — 液体潴留致呼吸困难", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["罗格列酮 — 液体潴留致呼吸困难"], "difficulty": 2, "correctAnswer": "A", "page": 1428, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1221-Rosiglitazone-Heart-Failure.md", "stem": "<p>A 62-year-old man presents to your practice complaint of recent-onset shortness of breath which is brought up by physical activity. He is diabetic and takes metformin and rosiglitazone for treatment and also has hypertension controlled on enalapril and metoprolol. Recently, he has been started on amiodarone due to episodes of sustained ventricular tachycardia. Which one of the following medications is more likely have caused this clinical picture?</p>", "options": [{"letter": "A", "text": "Rosiglitazone."}, {"letter": "B", "text": "Metformin."}, {"letter": "C", "text": "Enalapril."}, {"letter": "D", "text": "Metoprolol."}, {"letter": "E", "text": "Amiodarone."}], "rationale": "<p>1. 题型识别：诊断 — 药物不良反应归因 2. 关键：近期劳力性呼吸困难，在糖尿病+多种药物背景下判断病因 3. 罗格列酮机制：噻唑烷二酮类 → 增加胰岛素敏感性；但可<strong>液体潴留 → 诱发/加重心衰</strong>（糖尿病患者本身有风险因素）</p>\n<ul>\n<li>估计 1-10% 患者出现：水肿、高血压、心衰、心肌缺血等</li>\n<p>4. 排除：</p>\n<li>二甲双胍（B）：低血糖、乳酸性酸中毒、腹痛等——无呼吸困难</li>\n<li>依那普利（C）：干咳、高钾等——无呼吸困难</li>\n<li>美托洛尔（D）：可加重<strong>已有</strong>心衰，但该患者无心衰</li>\n<li>胺碘酮（E）：肺毒性可致呼吸困难，但需<strong>数月-数年</strong>累积——刚用药不符合</li>\n<p>5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>胺碘酮肺毒性时间窗</strong>：需数月到数年累积剂量才达毒性——\"刚用\"排除</li>\n<li><strong>美托洛尔\"可加重心衰\"</strong>：β 阻滞剂只加重<strong>已有</strong>心衰，患者无心衰史 → 不符合</li>\n<li><strong>罗格列酮监测</strong>：用药期间监测液体潴留/心衰体征（快速体重增加、水肿、呼吸困难）；心功能恶化停药</li>\n</ul>", "summary": "<p><strong>罗格列酮（噻唑烷二酮类）</strong>：</p>\n<ul>\n<li>机制：增加胰岛素敏感性</li>\n<li>不良反应（1-10%）：<strong>水肿、高血压、心衰、心肌缺血</strong>、腹泻、上呼吸道感染</li>\n<li>体重增加（可能因液体过多）</li>\n<li>>10%：总胆固醇、LDL、HDL 升高</li>\n<li><strong>监测</strong>：体重快速增加、水肿、呼吸困难；心功能恶化即停药</li>\n</ul>\n<p><strong>胺碘酮肺毒性</strong>：</p>\n<ul>\n<li>最常见间质性肺炎；其他：机化性肺炎、ARDS、孤立肺结节</li>\n<li>50-75% 患者有无痰性咳嗽和呼吸困难</li>\n<li>需要<strong>数月-数年</strong>累积剂量</li>\n</ul>", "explanation": "<p>罗格列酮是噻唑烷二酮类口服降糖药，通过增加胰岛素敏感性起作用。<strong>液体潴留可发生于罗格列酮治疗</strong>，导致或加重心衰（此类患者常有糖尿病相关危险因素）。估计 1-10% 患者出现水肿、高血压、心衰和心肌缺血等不良反应。应监测液体潴留和心衰体征（快速体重增加、水肿、呼吸困难），心功能恶化时停药。二甲双胍、依那普利无呼吸困难不良反应；美托洛尔只加重已有心衰；胺碘酮肺毒性需长期累积。</p>", "references": "<ul>\n<li>Medscape – Rosiglitazone</li>\n<li>PubChem</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": ["dyspnea"], "search": "罗格列酮 — 液体潴留致呼吸困难\n罗格列酮 — 液体潴留致呼吸困难\n a 62-year-old man presents to your practice complaint of recent-onset shortness of breath which is brought up by physical activity. he is diabetic and takes metformin and rosiglitazone for treatment and also has hypertension controlled on enalapril and metoprolol. recently, he has been started on amiodarone due to episodes of sustained ventricular tachycardia. which one of the following medications is more likely have caused this clinical picture? \n 罗格列酮是噻唑烷二酮类口服降糖药，通过增加胰岛素敏感性起作用。 液体潴留可发生于罗格列酮治疗 ，导致或加重心衰（此类患者常有糖尿病相关危险因素）。估计 1-10% 患者出现水肿、高血压、心衰和心肌缺血等不良反应。应监测液体潴留和心衰体征（快速体重增加、水肿、呼吸困难），心功能恶化时停药。二甲双胍、依那普利无呼吸困难不良反应；美托洛尔只加重已有心衰；胺碘酮肺毒性需长期累积。 "}, {"id": "AMC-Q1251", "type": "mcq", "qid": 1251, "title": "对乙酰氨基酚过量 — 8 小时内采血 + NAC", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["对乙酰氨基酚过量 — 8 小时内查浓度 + NAC"], "difficulty": 3, "correctAnswer": "B", "page": 1430, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1251-Paracetamol-Overdose-NAC.md", "stem": "<p>Joan is 60-year old woman who is suffering migraine. The pain has been crushing and disabling despite medical therapy with maximum dose of paracetamol. Seven hours ago, in a desperate attempt she took 20 500mg paracetamol tablets to make the pain go away. She is now in the Emergency Department of the tertiary hospital you work in with complaints of right upper quadrant abdominal pain, nausea, and vomiting. She weighs 65 kilograms. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Give her intravenous N-acetyl cysteine immediately."}, {"letter": "B", "text": "Obtain a serum paracetamol level and give her N-acetyl cysteine."}, {"letter": "C", "text": "Do immediate gastric lavage and give her activated charcoal."}, {"letter": "D", "text": "Check liver function tests prior to decision making on giving N-acetyl cysteine."}, {"letter": "E", "text": "Refer the patient to toxicology registrar."}], "rationale": "<p>1. 题型识别：治疗 — 对乙酰氨基酚中毒 2. 毒性剂量判断：20 × 500mg = <strong>10g</strong>，8 小时内单次摄入 → 显著肝毒性风险（成人：单次 >10g 或 200mg/kg） 3. 时间窗：<strong>7 小时</strong>（<8 小时）→ NAC 不应延迟 >8 小时 4. 核心逻辑：7 小时就诊，血清浓度结果<strong>几乎不可能在 1 小时内出来</strong> → <strong>立即开始 NAC</strong>（浓度在安全范围内可安全停用，中毒范围则继续） 5. 排除：</p>\n<ul>\n<li>只给 NAC 不采血（A）：应<strong>先采血样</strong>再开始 NAC</li>\n<li>洗胃（C）：仅限<strong>1 小时内</strong>；活性炭仅限 <strong>2 小时内</strong></li>\n<li>先查肝功能再决定（D）：不是当前优先，其他措施先行</li>\n<li>转毒理科（E）：应立即行动，专家咨询可稍后</li>\n<p>6. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>\"立即 NAC 还是等浓度\"</strong>：<8 小时 → 不等结果，立即开始 NAC + 同时采血；>8 小时 → 按浓度决定</li>\n<li><strong>洗胃/活性炭时间窗</strong>：洗胃 <1h，活性炭 <2h——本例 7h 已无意义</li>\n<li><strong>毒性剂量</strong>：成人单次 >200mg/kg <strong>或 10g</strong>（取较低者）——Joan 10g 已达毒性线</li>\n</ul>", "summary": "<p><strong>对乙酰氨基酚肝毒性剂量（成人）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>场景</th><th>毒性剂量</th></tr></thead>\n<tbody>\n<tr><td>急性单次摄入（8h 内）</td><td>>200mg/kg 或 10g（取较低者）</td></tr>\n<tr><td>反复超治疗摄入（24h 内）</td><td>>200mg/kg 或 10g</td></tr>\n<tr><td>前 48h 内每 24h 期</td><td>>150mg/kg 或 6g</td></tr>\n<tr><td>>48h 摄入 + 肝损伤症状</td><td>>100mg/kg 或 4g</td></tr>\n</tbody>\n</table>\n<p><strong>处理流程</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>就诊时间</th><th>处理</th></tr></thead>\n<tbody>\n<tr><td><1 小时</td><td>洗胃</td></tr>\n<tr><td><2 小时</td><td>活性炭</td></tr>\n<tr><td><strong><8 小时</strong></td><td>采血清浓度 + <strong>立即 NAC</strong>（不等结果）</td></tr>\n<tr><td>>8 小时</td><td>按血清浓度判断</td></tr>\n</tbody>\n</table>\n<ul>\n<li>NAC 可安全停用：浓度在安全范围；继续：在中毒范围</li>\n</ul>", "explanation": "<p>Joan 8 小时内摄入至少 10g（500mg×20）对乙酰氨基酚，处于显著肝毒性风险。8 小时内就诊时，下一步是<strong>采血测血清对乙酰氨基酚浓度并立即开始 NAC</strong>——因为浓度结果几乎不可能在 8 小时内获得。若浓度在安全范围内可安全停用 NAC，中毒范围则继续。洗胃仅限 1 小时内、活性炭仅限 2 小时内。虽需评估肝损伤，但不是当前优先事项。</p>", "references": "<ul>\n<li>MJA – Summary statement: new guidelines for the management of paracetamol poisoning in Australia and New Zealand</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain", "nausea/vomiting"], "search": "对乙酰氨基酚过量 — 8 小时内采血 + nac\n对乙酰氨基酚过量 — 8 小时内查浓度 + nac\n joan is 60-year old woman who is suffering migraine. the pain has been crushing and disabling despite medical therapy with maximum dose of paracetamol. seven hours ago, in a desperate attempt she took 20 500mg paracetamol tablets to make the pain go away. she is now in the emergency department of the tertiary hospital you work in with complaints of right upper quadrant abdominal pain, nausea, and vomiting. she weighs 65 kilograms. which one of the following is the next best step in management? \n joan 8 小时内摄入至少 10g（500mg×20）对乙酰氨基酚，处于显著肝毒性风险。8 小时内就诊时，下一步是 采血测血清对乙酰氨基酚浓度并立即开始 nac ——因为浓度结果几乎不可能在 8 小时内获得。若浓度在安全范围内可安全停用 nac，中毒范围则继续。洗胃仅限 1 小时内、活性炭仅限 2 小时内。虽需评估肝损伤，但不是当前优先事项。 "}, {"id": "AMC-Q1504", "type": "mcq", "qid": 1504, "title": "噻嗪类低钾 — 麻痹性肠梗阻", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["噻嗪类低钾 — 麻痹性肠梗阻"], "difficulty": 3, "correctAnswer": "A", "page": 1438, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1504-Thiazide-Hypokalemia-Ileus.md", "stem": "<p>A 73-year-old woman presents to the Emergency Department with vomiting, abdominal pain, and abdominal distention. She has congestive heart failure (CHF) in the setting of long-standing hypertension. She had been taking carvedilol, ramipril, and atorvastatin until 10 days ago when she had digoxin and hydrochlorothiazide added to her medications for a tighter control of her rather poorly controlled hypertension and CHF. On examination, she has a blood pressure of 130/85 mmHg, an irregular pulse of 110 bpm in rate, respiratory rate of 22 breaths per minute, and temperature of 37.5°C. Her abdomen is distended but not tender. There is also no guarding or rigidity. Bowel sounds are absent. Which one of the following is the most likely cause of her abdominal distention?</p>", "options": [{"letter": "A", "text": "Hypokalemia."}, {"letter": "B", "text": "Digoxin toxicity."}, {"letter": "C", "text": "Hypocalcemia."}, {"letter": "D", "text": "Mesenteric ischemia."}, {"letter": "E", "text": "Hyperkalemia."}], "rationale": "<p>1. 题型识别：诊断 — 电解质紊乱的胃肠表现 2. 临床判断：呕吐 + 腹痛 + 腹胀，<strong>无压痛/肌紧张/强直 + 肠鸣音消失</strong> = 麻痹性肠梗阻（无机械性梗阻） 3. 关键时间线：10 天前加用氢氯噻嗪（+地高辛）→ 噻嗪类以<strong>低钾</strong>闻名 4. 机制链：噻嗪类 → 低钾 → 结肠壁麻痹 → 肠梗阻样表现 5. 排除：</p>\n<ul>\n<li>地高辛毒性（B）：GI 表现为厌食、恶心呕吐、腹痛腹泻——<strong>无腹胀</strong>；且地高辛毒性导致<strong>高钾</strong>（E）而非低钾</li>\n<li>低钙（C）：肌肉痉挛、麻木刺痛、CNS 症状——无此线索</li>\n<li>肠系膜缺血（D）：急性型腹痛 + 血性腹泻（尤其餐后）；慢性型餐后脐周/上腹痛 + 体重下降——腹胀不支持</li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"加地高辛+噻嗪\"双线索</strong>：噻嗪致低钾 → 低钾又<strong>增加地高辛毒性风险</strong>（B 是干扰）——但地高辛毒性 GI 表现无腹胀</li>\n<li><strong>地高辛毒性 = 高钾</strong>：低钾（噻嗪）加重地高辛毒性，而地高辛毒性本身导致高钾——方向别搞混</li>\n<li><strong>β 阻滞剂（卡维地洛）→ 高钾</strong>：β 阻滞剂更倾向高钾（损害钾向细胞内转运）——不是本题病因</li>\n</ul>", "summary": "<p><strong>噻嗪类利尿剂代谢异常</strong>：低钾、低钠、血糖升高、尿酸升高、高钙血症</p>\n<p><strong>麻痹性肠梗阻原因</strong>：</p>\n<ul>\n<li><strong>低钾</strong>（最常见代谢性原因之一）</li>\n<li>术后、感染、缺血、药物（阿片类、抗胆碱能）</li>\n</ul>\n<p><strong>高钙 vs 低钾</strong>：两者都有便秘，但高钙不引起肠梗阻样表现；高钙表现为食欲下降、恶心呕吐、便秘、多饮多尿、乏力、意识模糊</p>\n<p><strong>地高辛毒性 GI 表现</strong>：厌食、恶心呕吐、腹痛、腹泻（无腹胀）；地高辛毒性 ECG：PVC 最常见、双向性室速最特异</p>", "explanation": "<p>该患者表现为麻痹性肠梗阻——结肠壁麻痹导致无机械性梗阻的肠梗阻样表现。<strong>低钾是麻痹性肠梗阻的病因之一</strong>，本例在加用氢氯噻嗪和地高辛后出现，噻嗪类利尿剂以引起低钾著称。噻嗪诱导的低钾可加重地高辛毒性（地高辛毒性导致高钾），但地高辛毒性的 GI 表现为厌食、恶心、呕吐、腹痛和腹泻，<strong>无腹胀</strong>。低钙和肠系膜缺血无相应线索。</p>", "references": "<ul>\n<li>Medscape – Hypokalemia</li>\n<li>Medscape – Digital Toxicity</li>\n<li>AHA – Thiazides Effects and Adverse Effects</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain", "nausea/vomiting"], "search": "噻嗪类低钾 — 麻痹性肠梗阻\n噻嗪类低钾 — 麻痹性肠梗阻\n a 73-year-old woman presents to the emergency department with vomiting, abdominal pain, and abdominal distention. she has congestive heart failure (chf) in the setting of long-standing hypertension. she had been taking carvedilol, ramipril, and atorvastatin until 10 days ago when she had digoxin and hydrochlorothiazide added to her medications for a tighter control of her rather poorly controlled hypertension and chf. on examination, she has a blood pressure of 130/85 mmhg, an irregular pulse of 110 bpm in rate, respiratory rate of 22 breaths per minute, and temperature of 37.5°c. her abdomen is distended but not tender. there is also no guarding or rigidity. bowel sounds are absent. which one of the following is the most likely cause of her abdominal distention? \n 该患者表现为麻痹性肠梗阻——结肠壁麻痹导致无机械性梗阻的肠梗阻样表现。 低钾是麻痹性肠梗阻的病因之一 ，本例在加用氢氯噻嗪和地高辛后出现，噻嗪类利尿剂以引起低钾著称。噻嗪诱导的低钾可加重地高辛毒性（地高辛毒性导致高钾），但地高辛毒性的 gi 表现为厌食、恶心、呕吐、腹痛和腹泻， 无腹胀 。低钙和肠系膜缺血无相应线索。 "}, {"id": "AMC-Q1568", "type": "mcq", "qid": 1568, "title": "吲达帕胺低钠血症 — 噻嗪样利尿剂最常见", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["吲达帕胺低钠血症 — 噻嗪样利尿剂"], "difficulty": 3, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1568-Indapamide-Hyponatremia.md", "stem": "<p>A 72-year-old woman presents to the Emergency Department complaining of nausea and vomiting. Apparently, she visited the on-call GP a few days earlier and was prescribed clarithromycin for a respiratory tract infection. Past medical history of significance includes chronic obstructive pulmonary disease (COPD) for which she takes high-dose oral corticosteroid, tiotropium and oral theophylline, ischemic heart disease for which she takes ramipril, amlodipine and indapamide, and chronic kidney disease. On examination, she has a blood pressure of 135/70 mmHg and heart rate of 105 bpm that is irregularly irregular. There is also bilateral basal lung crackles consistent with mild left ventricular failure. Her laboratory results are as follows: Hemoglobin 11.4, WBC 7, Platelet 197, Serum sodium 128 mmol/L (135-46), Serum potassium 4.0, Creatinine 178 μmol/L. Which one of the following medication is most likely to have resulted in her presentation?</p>", "options": [{"letter": "A", "text": "Amlodipine."}, {"letter": "B", "text": "Indapamide."}, {"letter": "C", "text": "Ramipril."}, {"letter": "D", "text": "Theophylline."}, {"letter": "E", "text": "Tiotropium."}], "rationale": "<p>1. 题型识别：诊断 — 药物致电解质紊乱 2. 关键异常：<strong>血清钠 128 mmol/L（低钠血症）</strong> → 解释恶心呕吐 3. 低钠血症常见原因：利尿剂、腹泻、心衰、肝病、肾病、SIADH 4. 选项分析（多药均可致低钠，但概率不同）：</p>\n<ul>\n<li><strong>吲达帕胺（B）</strong>：噻嗪样利尿剂 → 以低钠血症<strong>非常知名</strong> → 最可能</li>\n<li>氨氯地平（A）：CCB 可增加尿钠排泄（低剂量即可），机制之一</li>\n<li>雷米普利（C）：ACEI 可致 SIADH → 低钠（老年人需监测）</li>\n<li>茶碱（D）：偶与低钠相关（噻嗪样作用/SIADH 刺激）</li>\n<li>噻托溴铵（E）：吸入抗胆碱能药，<strong>无低钠关联</strong></li>\n<p>5. 处理：停用吲达帕胺 + 密切监测，轻限液 + 每日称重 6. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>多个选项都能致低钠</strong>：氨氯地平、雷米普利、茶碱都可——但题目问\"最可能\"，噻嗪样利尿剂（吲达帕胺）是最知名、最常见的</li>\n<li><strong>别被其他异常带偏</strong>：肌酐 178 可解释为 CKD（既有诊断），不是新问题</li>\n<li><strong>心衰也致低钠</strong>：但选项里没有\"心衰\"——在药物选项中选最强关联</li>\n</ul>", "summary": "<p><strong>低钠血症常见原因</strong>：利尿剂、腹泻、心衰、肝病、肾病、SIADH</p>\n<p><strong>低钠血症症状</strong>：恶心呕吐、头痛、短期记忆障碍、意识模糊、嗜睡、乏力、食欲下降、易激惹、肌无力、痉挛、癫痫、意识下降/昏迷</p>\n<p><strong>药物致低钠</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>机制</th></tr></thead>\n<tbody>\n<tr><td><strong>吲达帕胺/噻嗪类</strong></td><td>利尿排钠 → <strong>最常见知名关联</strong></td></tr>\n<tr><td>氨氯地平（CCB）</td><td>尿钠排泄增加（可达 4 倍）</td></tr>\n<tr><td>雷米普利（ACEI）</td><td>SIADH → 低钠</td></tr>\n<tr><td>茶碱</td><td>噻嗪样作用/SIADH 刺激</td></tr>\n</tbody>\n</table>\n<p><strong>处理</strong>：停用吲达帕胺 + 密切监测；轻度限液 + 每日称重</p>", "explanation": "<p>该患者低钠血症（128 mmol/L）解释恶心呕吐。虽然氨氯地平、雷米普利、茶碱均可致低钠，但<strong>吲达帕胺（噻嗪样利尿剂）以低钠血症最为知名</strong>，是选项中最可能的病因。慢性肾病的肌酐升高是既有诊断。处理重点是停用吲达帕胺并密切监测，辅以轻度限液和每日称重。噻托溴铵（吸入抗胆碱能药）无低钠关联。</p>", "references": "<ul>\n<li>Therapeutic Guidelines</li>\n</ul>", "related": ["AMC-Q1504-Thiazide-Hypokalemia-Ileus", "_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": ["nausea/vomiting"], "search": "吲达帕胺低钠血症 — 噻嗪样利尿剂最常见\n吲达帕胺低钠血症 — 噻嗪样利尿剂\n a 72-year-old woman presents to the emergency department complaining of nausea and vomiting. apparently, she visited the on-call gp a few days earlier and was prescribed clarithromycin for a respiratory tract infection. past medical history of significance includes chronic obstructive pulmonary disease (copd) for which she takes high-dose oral corticosteroid, tiotropium and oral theophylline, ischemic heart disease for which she takes ramipril, amlodipine and indapamide, and chronic kidney disease. on examination, she has a blood pressure of 135/70 mmhg and heart rate of 105 bpm that is irregularly irregular. there is also bilateral basal lung crackles consistent with mild left ventricular failure. her laboratory results are as follows: hemoglobin 11.4, wbc 7, platelet 197, serum sodium 128 mmol/l (135-46), serum potassium 4.0, creatinine 178 μmol/l. which one of the following medication is most likely to have resulted in her presentation? \n 该患者低钠血症（128 mmol/l）解释恶心呕吐。虽然氨氯地平、雷米普利、茶碱均可致低钠，但 吲达帕胺（噻嗪样利尿剂）以低钠血症最为知名 ，是选项中最可能的病因。慢性肾病的肌酐升高是既有诊断。处理重点是停用吲达帕胺并密切监测，辅以轻度限液和每日称重。噻托溴铵（吸入抗胆碱能药）无低钠关联。 "}, {"id": "AMC-Q1694", "type": "mcq", "qid": 1694, "title": "晚期前列腺癌死亡 — 多器官衰竭为最主要死因", "department": "General", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["晚期前列腺癌死亡 — 多器官衰竭是最主要原因"], "difficulty": 2, "correctAnswer": "A", "page": 1454, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q1694-Prostate-Cancer-Sudden-Death.md", "stem": "<p>A 78-year-old man with advanced prostate cancer is found dead in his house. Which one of the following could be the <strong>most likely primary cause</strong> of his death?</p>", "options": [{"letter": "A", "text": "Multi-organ failure."}, {"letter": "B", "text": "Chronic renal failure."}, {"letter": "C", "text": "Urinary tract infection."}, {"letter": "D", "text": "Sepsis."}, {"letter": "E", "text": "Heart attack."}], "rationale": "<p>1. 题型识别：诊断 — 死因推断 2. 场景：78岁晚期前列腺癌，在家中突然死亡 3. 癌症相关猝死定义：能走动的患者状况突然改变并在一天内死亡 4. 多器官衰竭是癌症相关猝死最常见的原因 5. 排除：</p>\n<ul>\n<li>尿路感染（C）→ 可导致脓毒症（D）→ 最终导致多器官衰竭 — 但多器官衰竭是导致死亡的最终环节（根本死因）</li>\n<li>慢性肾衰竭（B）：不太可能导致突发死亡</li>\n<li>心脏病发作（E）：虽可能，但题目问\"最可能的<strong>原发</strong>死因\"即与疾病直接相关的原因</li>\n<p>6. 注：根本死因是启动致死事件链的疾病/事件，后果/并发症为次要死因</p>\n</ul>", "traps": "<ul>\n<li><strong>原发 vs 继发死因</strong>：败血症可能是致死链中的一环，但多器官衰竭才是导致死亡的最终环节（根本死因=癌症）</li>\n<li><strong>急性 vs 慢性肾衰竭</strong>：急性肾衰竭可致猝死（孤立或作为多器官衰竭一部分），慢性肾衰竭不太可能</li>\n</ul>", "summary": "<p><strong>晚期前列腺癌死亡统计</strong>：</p>\n<ul>\n<li>77.8%直接与前列腺癌相关</li>\n<li>5.5%来自其他癌症</li>\n<li>16.7%来自非癌症原因</li>\n</ul>\n<p><strong>非癌症死亡最常见原因</strong>：</p>\n<ul>\n<li>心血管疾病</li>\n<li>脑血管疾病</li>\n<li>肺部疾病（COPD、肺栓塞）</li>\n</ul>\n<p><strong>根本死因定义</strong>：启动致死事件链的疾病/情况/事件；后果/并发症通常视为次要死因</p>", "explanation": "<p>晚期前列腺癌患者中绝大多数死亡直接与癌症相关。癌症相关猝死最常见的原因是<strong>多器官衰竭</strong>。虽然尿路感染可导致脓毒症，但多器官衰竭作为脓毒症的最终结果导致死亡。心血管疾病等为非癌症死亡常见原因，但题目问最可能的原发（癌症直接相关）死因。</p>", "references": "<ul>\n<li>A study of 'sudden death' in end-stage cancer patients receiving home care</li>\n<li>The oncologist - What Do Prostate Cancer Patients Die Of?</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "晚期前列腺癌死亡 — 多器官衰竭为最主要死因\n晚期前列腺癌死亡 — 多器官衰竭是最主要原因\n a 78-year-old man with advanced prostate cancer is found dead in his house. which one of the following could be the  most likely primary cause  of his death? \n 晚期前列腺癌患者中绝大多数死亡直接与癌症相关。癌症相关猝死最常见的原因是 多器官衰竭 。虽然尿路感染可导致脓毒症，但多器官衰竭作为脓毒症的最终结果导致死亡。心血管疾病等为非癌症死亡常见原因，但题目问最可能的原发（癌症直接相关）死因。 "}, {"id": "AMC-Q0273", "type": "mcq", "qid": 273, "title": "围手术期 VTE 最高风险 — 心衰（HF 本身）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["prevention", "definition", "risk-factors"], "topic": ["Venous Thromboembolism", "VTE Risk Stratification", "Peri-operative", "Heart Failure", "Thrombophilia"], "difficulty": 3, "correctAnswer": "E", "page": 64, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "vte", "dvt", "prophylaxis", "heart-failure", "approach-prevention", "approach-definition", "approach-risk-factors"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0273-VTE-Risk-Heart-Failure.md", "stem": "<p>You are assessing the risk of thromboembolism in a 75-year-old woman, who is booked for elective surgical replacement of her left knee joint. Which one of the following, if present in history, is the most significant risk factor for thromboembolism during her peri-operative stay?</p>", "options": [{"letter": "A", "text": "History of colon resection due to toxic megacolon"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Stage II kidney disease"}, {"letter": "D", "text": "Transient ischemic attack with full recovery three years ago"}, {"letter": "E", "text": "Heart failure"}], "rationale": "<p>1. <strong>题型识别</strong>：VTE 风险因素评估 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>75 岁女性</li>\n<li>择期<strong>左膝关节置换术</strong>（骨科大手术，<strong>本身</strong>是 VTE 高风险）</li>\n<li>评估<strong>叠加</strong>风险因素</li>\n<p>3. <strong>AMC 围手术期 VTE 风险分层</strong>（必背）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>风险等级</th><th>内科</th><th>外科</th></tr></thead>\n<tbody>\n<tr><td><strong>高</strong></td><td>Stroke、<strong>Age > 75</strong>、<strong>CHF</strong>、Shock、Cancer、<strong>History of DVT/PE</strong>、Thrombophilia</td><td><strong>骨科（盆/髋/下肢）</strong>、<strong>大手术 + 年龄 > 60</strong>、大手术 + 40-60 + cancer/DVT/PE 史</td></tr>\n<tr><td>中</td><td>Immobilized + active disease</td><td>大手术 40-60 + 其他风险；小手术 > 60 / 40-60 + 风险</td></tr>\n<tr><td>低</td><td>—</td><td>大手术 < 40；小内科病；小手术 < 60</td></tr>\n</tbody>\n</table>\n<p>4. <strong>本例：本身就高风险</strong>（骨科大手术）—— 题问<strong>叠加因素</strong> 5. <strong>选项逐一分析</strong>：</p>\n<ul>\n<li>A (Colon resection due to toxic megacolon)：是\"大手术史\"—— 不算慢性风险</li>\n<li>B (IBS)：<strong>不是</strong> VTE 风险</li>\n<li>C (Stage II kidney disease)：<strong>轻度</strong>，<strong>不是</strong> 显著 VTE 风险</li>\n<li>D (TIA 3 年前已恢复)：TIA <strong>不</strong>致 VTE 风险（与动脉粥样硬化相关）</li>\n<li>E (Heart failure)：<strong>CHF 明确是 VTE 独立强风险</strong>（Venous stasis + 凝血激活 + 内皮功能障碍）</li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Cancer = 最高 VTE 风险\"陷阱</strong>：Cancer 确实高，但本例<strong>没问 cancer</strong>。</li>\n<li><strong>\"Thrombophilia = 最高\"陷阱</strong>：Thrombophilia 确实高，但<strong>无症状</strong>患者通常不筛查。</li>\n<li><strong>\"TIA = 卒中 = 高 VTE\"陷阱</strong>：错。TIA 是<strong>动脉</strong>事件，与 VTE 关系小。</li>\n<li><strong>\"CrCl 低 = 高 VTE\"陷阱</strong>：Stage II CKD 较轻，<strong>不</strong>显著增加 VTE 风险。</li>\n<li><strong>\"既往大手术史 = 高 VTE\"陷阱</strong>：既往<strong>已恢复</strong>的手术不增加 VTE 风险（除非近期）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p><strong>Peri-hospital risk assessment of a venous thromboembolic events (VTE)</strong> such as deep vein thrombosis or pulmonary embolism is stratified according to the following table:</p>\n<p><strong>Stratification of DVT/PE during hospital stay</strong>:</p>\n<table class='md-table'>\n<thead><tr><th>Risk</th><th>Medical</th><th>Surgical</th></tr></thead>\n<tbody>\n<tr><td><strong>High</strong></td><td>Stroke, Age > 75, <strong>CHF</strong>, Shock, Cancer, History of DVT/PE, Thrombophilia</td><td>Orthopedic surgery (pelvis, hip, lower limb); major surgery + age > 60; major surgery 40-60 + cancer or DVT/PE history or other risk factors</td></tr>\n<tr><td>Moderate</td><td>Immobilized patients with active disease</td><td>Major surgery 40-60 + other risk factors; minor surgery age > 60 or 40-60 + DVT/PE history or estrogen or other risks</td></tr>\n<tr><td>Low</td><td>—</td><td>Major surgery age < 40; minor medical illness; minor surgery age < 60</td></tr>\n</tbody>\n</table>\n<p><strong>Among the options, congestive heart failure and the surgery are of the highest risk for venous thromboembolism. None of the other options are risk factors for VTE.</strong></p>\n<p><strong>Why HF increases VTE risk</strong> (Virchow's triad):</p>\n<ul>\n<li><strong>Venous stasis</strong> (decreased cardiac output → venous congestion)</li>\n<li><strong>Endothelial dysfunction</strong> (low flow, inflammation)</li>\n<li><strong>Hypercoagulability</strong> (neurohormonal activation, increased clotting factors)</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ASH 围手术期 VTE 预防指南）</li>\n</ul>", "related": ["AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0275-DVT-Treatment-Heparin", "AMC-Q0279-DVT-Wells-Score-Doppler", "MOC-Haematology", "Topic-VTE-Prophylaxis"], "bodyHtml": "", "diseases": ["DVT", "VTE", "Heart Failure"], "complaints": [], "search": "围手术期 vte 最高风险 — 心衰（hf 本身）\nvenous thromboembolism vte risk stratification peri-operative heart failure thrombophilia\nprevention definition risk-factors\n you are assessing the risk of thromboembolism in a 75-year-old woman, who is booked for elective surgical replacement of her left knee joint. which one of the following, if present in history, is the most significant risk factor for thromboembolism during her peri-operative stay? \n correct answer is  e  \n  peri-hospital risk assessment of a venous thromboembolic events (vte)  such as deep vein thrombosis or pulmonary embolism is stratified according to the following table: \n  stratification of dvt/pe during hospital stay : \n \n   risk  medical  surgical   \n \n   high   stroke, age > 75,  chf , shock, cancer, history of dvt/pe, thrombophilia  orthopedic surgery (pelvis, hip, lower limb); major surgery + age > 60; major surgery 40-60 + cancer or dvt/pe history or other risk factors  \n  moderate  immobilized patients with active disease  major surgery 40-60 + other risk factors; minor surgery age > 60 or 40-60 + dvt/pe history or estrogen or other risks  \n  low  —  major surgery age   \n \n \n  among the options, congestive heart failure and the surgery are of the highest risk for venous thromboembolism. none of the other options are risk factors for vte.  \n  why hf increases vte risk  (virchow's triad): \n \n  venous stasis  (decreased cardiac output → venous congestion) \n  endothelial dysfunction  (low flow, inflammation) \n  hypercoagulability  (neurohormonal activation, increased clotting factors) \n "}, {"id": "AMC-Q0274", "type": "mcq", "qid": 274, "title": "DVT 诊断 — Duplex Doppler USG（不是 CT / MRI / 静脉造影 / D-dimer）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["investigation", "diagnosis", "definition"], "topic": ["DVT Diagnosis", "Duplex Doppler Ultrasonography", "Post-Surgical", "Venography Criterion Standard"], "difficulty": 3, "correctAnswer": "E", "page": 65, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "diagnosis", "doppler-ultrasound", "approach-investigation", "approach-diagnosis", "approach-definition"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0274-DVT-Diagnosis-Doppler-USG.md", "stem": "<p>Five days after surgical resection of a colonic tumor, a 73-year-old man develops pain, swelling and tenderness in his right calf. Physical examination reveals swelling of the ankle and the calf and tenderness over the gastrocnemius muscle. Which one of the following is the most appropriate diagnostic tool to establish the diagnosis?</p>", "options": [{"letter": "A", "text": "CT angiography of the leg"}, {"letter": "B", "text": "MRI of the leg"}, {"letter": "C", "text": "Conventional venography of the leg"}, {"letter": "D", "text": "Serum D-dimer"}, {"letter": "E", "text": "Duplex Doppler ultrasonography"}], "rationale": "<p>1. <strong>题型识别</strong>：疑似 DVT → 选确诊工具 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>73 岁、结肠癌术后 5 天</li>\n<li>典型 DVT 表现：小腿痛、肿、压痛（gastrocnemius 压痛）</li>\n<p>3. <strong>DVT 诊断路径</strong>（按 Wells 评分）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>Wells 评分</th><th>路径</th></tr></thead>\n<tbody>\n<tr><td><strong>< 2 (低)</strong></td><td><strong>D-dimer</strong> → 阴性排除；阳性 → USG</td></tr>\n<tr><td><strong>≥ 2 (高)</strong></td><td><strong>直接 USG</strong></td></tr>\n</tbody>\n</table>\n<p>4. <strong>本例 Wells 评分</strong>（按题干信息估）：</p>\n<ul>\n<li>Cancer（active）= 1</li>\n<li>局部压痛 = 1</li>\n<li>可能有 calf swelling、immobilization</li>\n<li>总分大概 <strong>≥ 2</strong> → 直接 USG</li>\n<p>5. <strong>选项逐一分析</strong>：</p>\n<li>A (CT angio)：看<strong>动脉</strong>（不是静脉）</li>\n<li>B (MRI)：可用但<strong>不首选</strong>（贵、慢、不普及）</li>\n<li>C (Venography)：<strong>金标准</strong>但<strong>有创</strong>、<strong>不</strong>用做首选</li>\n<li>D (D-dimer)：<strong>低 Wells 评分</strong>才用；术后 D-dimer 本来就高（特异性差）</li>\n<li>E (Duplex USG)：<strong>正确</strong>（无创、敏感度 > 90%、特异性 > 95%）</li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Venography 是金标准 = 首选\"陷阱</strong>：金标准 ≠ 首选。金标准<strong>有创</strong>，<strong>Duplex USG 是首选</strong>（无创、敏感度足够）。</li>\n<li><strong>\"D-dimer 是确诊\"陷阱</strong>：错。D-dimer 是<strong>排除</strong>用（阴性排除），<strong>阳性不确诊</strong>。术后 D-dimer 本来就高。</li>\n<li><strong>\"CT angio 看血栓\"陷阱</strong>：CT angio 是<strong>动脉</strong>检查（动脉粥样硬化 / 夹层 / 栓塞），<strong>不</strong>是静脉。</li>\n<li><strong>\"MRI 总比 USG 好\"陷阱</strong>：MRI 在 DVT 是<strong>二线</strong>（髂 / 腔静脉首选，孕妇首选），<strong>不</strong>是一线。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>With the clinical picture suggestive of deep vein thrombosis, <strong>Duplex Doppler ultrasonography should be used to confirm the diagnosis</strong>. Although pain, swelling, and tenderness are suggestive of DVT, <strong>but treatment should never be started solely on clinical basis</strong>.</p>\n<ul>\n<li>(Option A) <strong>CT angiography is used for visualization of clots in arteries, not veins</strong>.</li>\n<li>(Option B) <strong>MRI is being used increasingly for assessment of DVT</strong>, and probably is the preferred investigation for suspected <strong>caval and iliac venous thrombosis, particularly in pregnancy</strong>, but is expensive, time-consuming and not always available.</li>\n<li>(Option C) <strong>Conventional venography is the criterion standard for diagnosis of DVT, but is rarely used now</strong> because less invasive and convenient diagnostic modalities are widely available.</li>\n<li>(Option D) <strong>D-dimer assay, although sensitive, lacks specificity.</strong> Increased levels of D-dimer can be seen in several conditions, <strong>with post-surgery state as one</strong>. It is basically used to rule out DVT or PE in <strong>low-risk patients (Wells score < 2)</strong>. A positive test demands more specified evaluation, but a negative one excludes the possibility of DVT or PE.</li>\n</ul>\n<p><strong>Duplex USG accuracy for DVT</strong>:</p>\n<ul>\n<li>Sensitivity > 90% (femoral, popliteal)</li>\n<li>Specificity > 95%</li>\n<li>Less accurate for iliac or calf vein thromboses</li>\n</ul>", "references": "<ul>\n<li>AMC handbook multiple choice questions — page 173</li>\n<li>http://www.imagingpathways.health.wa.gov.au/index</li>\n<li>（待补：ASH 2024 DVT 诊断指南）</li>\n</ul>", "related": ["AMC-Q0273-VTE-Risk-Heart-Failure", "AMC-Q0275-DVT-Treatment-Heparin", "AMC-Q0279-DVT-Wells-Score-Doppler", "MOC-Haematology", "Topic-DVT-Diagnosis"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "dvt 诊断 — duplex doppler usg（不是 ct / mri / 静脉造影 / d-dimer）\ndvt diagnosis duplex doppler ultrasonography post-surgical venography criterion standard\ninvestigation diagnosis definition\n five days after surgical resection of a colonic tumor, a 73-year-old man develops pain, swelling and tenderness in his right calf. physical examination reveals swelling of the ankle and the calf and tenderness over the gastrocnemius muscle. which one of the following is the most appropriate diagnostic tool to establish the diagnosis? \n correct answer is  e  \n with the clinical picture suggestive of deep vein thrombosis,  duplex doppler ultrasonography should be used to confirm the diagnosis . although pain, swelling, and tenderness are suggestive of dvt,  but treatment should never be started solely on clinical basis . \n \n (option a)  ct angiography is used for visualization of clots in arteries, not veins . \n (option b)  mri is being used increasingly for assessment of dvt , and probably is the preferred investigation for suspected  caval and iliac venous thrombosis, particularly in pregnancy , but is expensive, time-consuming and not always available. \n (option c)  conventional venography is the criterion standard for diagnosis of dvt, but is rarely used now  because less invasive and convenient diagnostic modalities are widely available. \n (option d)  d-dimer assay, although sensitive, lacks specificity.  increased levels of d-dimer can be seen in several conditions,  with post-surgery state as one . it is basically used to rule out dvt or pe in  low-risk patients (wells score  . a positive test demands more specified evaluation, but a negative one excludes the possibility of dvt or pe. \n \n  duplex usg accuracy for dvt : \n \n sensitivity > 90% (femoral, popliteal) \n specificity > 95% \n less accurate for iliac or calf vein thromboses \n "}, {"id": "AMC-Q0275", "type": "mcq", "qid": 275, "title": "DVT 治疗 — Heparin 先（IV 或 LMWH）+ Warfarin 桥接 6 月", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "prevention", "complications"], "topic": ["DVT Treatment", "Heparin First", "Warfarin Bridge", "INR 2-3", "6 months", "Anticoagulation"], "difficulty": 3, "correctAnswer": "C", "page": 66, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "treatment", "heparin", "warfarin", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0275-DVT-Treatment-Heparin.md", "stem": "<p>A 73-year-old man presents with swelling of his left leg for the past three hours. Evaluation establishes the diagnosis of a deep vein thrombosis (DVT) in the left lower leg. A Doppler ultrasound reveals deep vein thrombosis in the calf as well as popliteal and femoral veins. His past medical history is negative for previous DVT. Which one of the following is the next best in management of this patient?</p>", "options": [{"letter": "A", "text": "Angiography"}, {"letter": "B", "text": "Angioplasty"}, {"letter": "C", "text": "Heparin"}, {"letter": "D", "text": "Warfarin"}, {"letter": "E", "text": "Aspirin"}], "rationale": "<p>1. <strong>题型识别</strong>：DVT 确诊 → 选起始治疗 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>73 岁、急性 DVT</li>\n<li>累及<strong>小腿 + 腘 + 股</strong>静脉（<strong>近端 DVT</strong>——高风险 → PE）</li>\n<li>无既往 DVT 史（<strong>首次发作</strong>、<strong>非复发</strong>）</li>\n<p>3. <strong>DVT 治疗路径</strong>：</p>\n<li><strong>第 1 步</strong>：<strong>Heparin</strong>（IV UFH 或 SC LMWH）—— 立即起效</li>\n<li><strong>第 2 步</strong>：24-48 h 内启动 <strong>Warfarin</strong></li>\n<li><strong>第 3 步</strong>：INR 达 2-3 后停 Heparin</li>\n<li><strong>第 4 步</strong>：Warfarin <strong>至少 6 月</strong>（首次、近端、无 cancer）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Angiography)：DVT <strong>不</strong>做动脉造影</li>\n<li>B (Angioplasty)：动脉用，<strong>不</strong>用于 DVT</li>\n<li>C (Heparin)：<strong>正确</strong>（一线）</li>\n<li>D (Warfarin alone)：错，warfarin 早期<strong>致凝</strong>（protein C/S ↓ 快）→ 需 heparin 桥接</li>\n<li>E (Aspirin)：<strong>抗血小板</strong>，<strong>不</strong>治 DVT</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Warfarin = 抗凝\"陷阱</strong>：Warfarin <strong>抗凝</strong>，但<strong>早期促凝</strong>（protein C/S 半衰期短）→ <strong>不能单用</strong>。</li>\n<li><strong>\"Aspirin 也抗血栓\"陷阱</strong>：Aspirin <strong>抗血小板</strong>（动脉血栓）；DVT 是<strong>静脉血栓</strong>→ 需<strong>抗凝</strong>。</li>\n<li><strong>\"Angioplasty 治一切\"陷阱</strong>：Angioplasty 是<strong>动脉</strong>介入治疗，<strong>不</strong>治 DVT。</li>\n<li><strong>\"DVT 不需急\"陷阱</strong>：错。<strong>近端 DVT（小腿以上）有 PE 风险</strong>→ 立即抗凝。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>All patients with DVT are initially managed by injectable heparin</strong> (either intravenous unfractionated or subcutaneous low molecular weight heparin). <strong>Warfarin can be started within 24-48 hours with close monitoring of INR</strong>. Once INR is in the therapeutic range of 2-3, heparin can be withheld. <strong>Warfarin should be continued for 6 months at least</strong>. Patients should see their GP on a regular basis for close monitoring of the INR.</p>\n<ul>\n<li>(Option A) DVT is the presence of clot in the deep veins. <strong>Arteriography evaluates arterial structure and thromboses within arteries</strong>.</li>\n<li>(Option B) Angioplasty is performed for revascularization in arterial problems with no role in DVT.</li>\n<li>(Option D) Warfarin is indicated in this patient <strong>after initial anticoagulation with heparin</strong>.</li>\n<li>(Option E) Antiplatelet therapy with aspirin or clopidogrel does not provide adequate anticoagulation for prevention of DVT.</li>\n</ul>\n<p><strong>DVT treatment duration</strong>:</p>\n<ul>\n<li><strong>First DVT, provoked</strong> (e.g., post-surgery): <strong>3 months</strong></li>\n<li><strong>First DVT, unprovoked</strong>: <strong>≥ 6 months</strong> (often longer)</li>\n<li><strong>Recurrent DVT</strong> or <strong>active cancer</strong>: <strong>indefinite / lifelong</strong></li>\n<li><strong>Catheter-associated</strong>: at least 3 months, remove catheter if possible</li>\n</ul>\n<p><strong>LMWH preferred over UFH in</strong>:</p>\n<ul>\n<li>Cancer-associated VTE</li>\n<li>Pregnancy</li>\n<li>Outpatient management (no need for infusion)</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ASH 2024 DVT 治疗指南）</li>\n</ul>", "related": ["AMC-Q0273-VTE-Risk-Heart-Failure", "AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0279-DVT-Wells-Score-Doppler", "AMC-QNA-P011-DVT-Pregnancy-LMWH", "MOC-Haematology", "Topic-DVT-Anticoagulation"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "dvt 治疗 — heparin 先（iv 或 lmwh）+ warfarin 桥接 6 月\ndvt treatment heparin first warfarin bridge inr 2-3 6 months anticoagulation\ntreatment prevention complications\n a 73-year-old man presents with swelling of his left leg for the past three hours. evaluation establishes the diagnosis of a deep vein thrombosis (dvt) in the left lower leg. a doppler ultrasound reveals deep vein thrombosis in the calf as well as popliteal and femoral veins. his past medical history is negative for previous dvt. which one of the following is the next best in management of this patient? \n correct answer is  c  \n  all patients with dvt are initially managed by injectable heparin  (either intravenous unfractionated or subcutaneous low molecular weight heparin).  warfarin can be started within 24-48 hours with close monitoring of inr . once inr is in the therapeutic range of 2-3, heparin can be withheld.  warfarin should be continued for 6 months at least . patients should see their gp on a regular basis for close monitoring of the inr. \n \n (option a) dvt is the presence of clot in the deep veins.  arteriography evaluates arterial structure and thromboses within arteries . \n (option b) angioplasty is performed for revascularization in arterial problems with no role in dvt. \n (option d) warfarin is indicated in this patient  after initial anticoagulation with heparin . \n (option e) antiplatelet therapy with aspirin or clopidogrel does not provide adequate anticoagulation for prevention of dvt. \n \n  dvt treatment duration : \n \n  first dvt, provoked  (e.g., post-surgery):  3 months  \n  first dvt, unprovoked :  ≥ 6 months  (often longer) \n  recurrent dvt  or  active cancer :  indefinite / lifelong  \n  catheter-associated : at least 3 months, remove catheter if possible \n \n  lmwh preferred over ufh in : \n \n cancer-associated vte \n pregnancy \n outpatient management (no need for infusion) \n "}, {"id": "AMC-Q0276", "type": "mcq", "qid": 276, "title": "静脉曲张溃疡 + ABI 0.7 — 弹力袜**不安全**", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "complications", "definition"], "topic": ["Venous Leg Ulcer", "Compression Stockings Contraindication", "ABI 0.7", "Diabetes", "Bisggard Regimen"], "difficulty": 3, "correctAnswer": "A", "page": 67, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "venous-ulcer", "compression-stockings", "dvt", "approach-treatment", "approach-complications", "approach-definition"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0276-Venous-Ulcer-Compression-Contra.md", "stem": "<p>An 82-year-old man presents to your office complaining of an ulcer over the medial side of his leg just above the internal malleolus. He mentions that the wound has been there for the past 6 months, and worsened recently. The examination confirms the diagnosis of a venous ulcer. The ipsilateral ankle-brachial index is 0.7. Which one of the following is correct regarding the management of this patient?</p>", "options": [{"letter": "A", "text": "Compression stockings are unsafe for this patient"}, {"letter": "B", "text": "Prescribe compression stockings and refer him to a vascular surgeon"}, {"letter": "C", "text": "Give antibiotics and review in two weeks"}, {"letter": "D", "text": "Check fasting glucose"}, {"letter": "E", "text": "Check HbA1C"}], "rationale": "<p>1. <strong>题型识别</strong>：静脉溃疡 + ABI 0.7 → 选安全治疗 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>82 岁</li>\n<li>溃疡在<strong>内踝上方内侧</strong>（经典<strong>静脉</strong>溃疡部位）</li>\n<li>6 月不愈（<strong>慢性</strong>）</li>\n<li><strong>ABI 0.7</strong>（<strong>< 0.8</strong> = 动脉供血不足）</li>\n<p>3. <strong>静脉溃疡 Bisggard 方案（4 联）</strong>： 1. 患者教育 2. <strong>抬高患肢</strong> 3. <strong>弹力压迫</strong>（核心） 4. 评估 4. <strong>弹力袜禁忌</strong>（重要！）：</p>\n<li><strong>ABI < 0.8</strong>（动脉供血不足）</li>\n<li><strong>糖尿病</strong>（常合并微血管病）</li>\n<li><strong>上述情况压迫 = 减少动脉灌注 → 加重缺血</strong></li>\n<p>5. <strong>本例</strong>：ABI 0.7 → 弹力袜<strong>不安全</strong>（会减少已不足的动脉血流） 6. <strong>选项排除</strong>：</p>\n<li>A (Compression unsafe)：<strong>正确</strong></li>\n<li>B (Compression + 外科)：错（不安全）</li>\n<li>C (Antibiotics)：无并发症的静脉溃疡<strong>不</strong>用抗生素</li>\n<li>D (Fasting glucose)：可考虑但<strong>非管理核心</strong></li>\n<li>E (HbA1C)：用于糖尿病<strong>监测</strong>（不是筛查）</li>\n<p>7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"静脉溃疡 = 弹力袜\"陷阱</strong>：通常对，但 <strong>ABI < 0.8 / 糖尿病禁忌</strong>。</li>\n<li><strong>\"糖尿病 = 测 HbA1C\"陷阱</strong>：HbA1C 是<strong>监测</strong>指标，<strong>不</strong>是筛查/诊断指标（筛查用 fasting glucose 或 OGTT）。</li>\n<li><strong>\"溃疡不愈 = 抗生素\"陷阱</strong>：无感染征象的<strong>慢性</strong>溃疡<strong>不</strong>用抗生素。</li>\n<li><strong>\"内踝上 = 动脉溃疡\"陷阱</strong>：错。<strong>内踝上方内侧 = 静脉溃疡</strong>（外踝 / 趾端 = 动脉溃疡）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p><strong>Venous leg ulcers are the most common chronic wounds seen in general practice.</strong> They account for 70-90% of chronic wounds. They tend to develop over the <strong>medial distal leg (just above the internal malleolus)</strong>, and are usually painful.</p>\n<p><strong>The most important risk factor for development of a venous ulcer is previous deep vein thrombosis (DVT)</strong> with consequent damage to venous structure and insufficiency.</p>\n<p><strong>Most venous ulcers respond adequately to a conservative management called Bisggard regimen.</strong> This regimen has four components: 1. Patient education 2. Elevation of the foot 3. <strong>Elastic compression</strong> 4. Evaluation</p>\n<p><strong>Elastic compression is considered for every patient UNLESS</strong>:</p>\n<ul>\n<li><strong>ABI is below 0.8</strong></li>\n<li>The patient is diabetic</li>\n</ul>\n<p>In the above situations, <strong>compression stocking causes more compromised arterial flow and makes the limb ischemia worse</strong>; therefore, specialist advice and close monitoring is strongly recommended.</p>\n<p><strong>Antibiotics are not indicated in uncomplicated venous ulcers.</strong> Diabetes is one of the most important predisposing factors in development of arterial ulcers. Although fasting glucose level may be considered for screening of diabetes, it is not a step in management here. <strong>HbA1C is used to monitor efficacy of or adherence to anti-hyperglycemic regimens, which is not the case here.</strong></p>\n<p><strong>Ulcer location by etiology</strong>:</p>\n<ul>\n<li><strong>Medial malleolus (gaiter area)</strong> → <strong>venous</strong> (most common)</li>\n<li><strong>Lateral malleolus, dorsum of foot, toes</strong> → <strong>arterial</strong></li>\n<li><strong>Pressure points (heel, malleoli)</strong> in immobilized → <strong>pressure</strong></li>\n</ul>", "references": "<ul>\n<li>http://www.racgp.org.au/afp/2012/may/venous-leg-ul</li>\n<li>http://www.racgp.org.au/afp/2014/september/managem</li>\n<li>http://www.awma.com.au/publications/2011_awma_vlug</li>\n<li>（待补：AWMA 静脉溃疡指南）</li>\n</ul>", "related": ["AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0271-PAD-Medical-Management", "AMC-Q0272-Critical-Limb-Ischemia-Referral", "MOC-Haematology", "Topic-Chronic-Wounds"], "bodyHtml": "", "diseases": ["DVT"], "complaints": [], "search": "静脉曲张溃疡 + abi 0.7 — 弹力袜**不安全**\nvenous leg ulcer compression stockings contraindication abi 0.7 diabetes bisggard regimen\ntreatment complications definition\n an 82-year-old man presents to your office complaining of an ulcer over the medial side of his leg just above the internal malleolus. he mentions that the wound has been there for the past 6 months, and worsened recently. the examination confirms the diagnosis of a venous ulcer. the ipsilateral ankle-brachial index is 0.7. which one of the following is correct regarding the management of this patient? \n correct answer is  a  \n  venous leg ulcers are the most common chronic wounds seen in general practice.  they account for 70-90% of chronic wounds. they tend to develop over the  medial distal leg (just above the internal malleolus) , and are usually painful. \n  the most important risk factor for development of a venous ulcer is previous deep vein thrombosis (dvt)  with consequent damage to venous structure and insufficiency. \n  most venous ulcers respond adequately to a conservative management called bisggard regimen.  this regimen has four components: 1. patient education 2. elevation of the foot 3.  elastic compression  4. evaluation \n  elastic compression is considered for every patient unless : \n \n  abi is below 0.8  \n the patient is diabetic \n \n in the above situations,  compression stocking causes more compromised arterial flow and makes the limb ischemia worse ; therefore, specialist advice and close monitoring is strongly recommended. \n  antibiotics are not indicated in uncomplicated venous ulcers.  diabetes is one of the most important predisposing factors in development of arterial ulcers. although fasting glucose level may be considered for screening of diabetes, it is not a step in management here.  hba1c is used to monitor efficacy of or adherence to anti-hyperglycemic regimens, which is not the case here.  \n  ulcer location by etiology : \n \n  medial malleolus (gaiter area)  →  venous  (most common) \n  lateral malleolus, dorsum of foot, toes  →  arterial  \n  pressure points (heel, malleoli)  in immobilized →  pressure  \n "}, {"id": "AMC-Q0279", "type": "mcq", "qid": 279, "title": "DVT + Wells 3 分（高）— 直接 Doppler（不先用 D-dimer）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["investigation", "diagnosis", "definition"], "topic": ["DVT", "Modified Wells Score", "High Probability", "Doppler Ultrasound", "Post-Orthopedic Surgery"], "difficulty": 4, "correctAnswer": "A", "page": 69, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "wells-score", "doppler-ultrasound", "approach-investigation", "approach-diagnosis", "approach-definition"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0279-DVT-Wells-Score-Doppler.md", "stem": "<p>A 79-year-old woman undergoes total hip replacement surgery. After 4 days, she develops a swollen right leg. The circumference of the right calf is 4 cm greater than that of the left leg. The right leg feels warm to touch and is slightly tender. Which one of the following is most appropriate diagnostic tool to use for a diagnosis?</p>", "options": [{"letter": "A", "text": "Duplex Doppler ultrasound"}, {"letter": "B", "text": "X-ray"}, {"letter": "C", "text": "Contrast venography"}, {"letter": "D", "text": "CT angiography"}, {"letter": "E", "text": "D-dimer assay"}], "rationale": "<p>1. <strong>题型识别</strong>：疑似 DVT + Wells 评分应用 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>79 岁、全髋置换术后 4 天（<strong>骨科术后 = VTE 高风险</strong>）</li>\n<li>患肢小腿围比健侧大 <strong>4 cm</strong>（> 3 cm = Wells 加分）</li>\n<li>患肢<strong>温热</strong> + 轻压痛</li>\n<p>3. <strong>Modified Wells Score for DVT</strong>（必背）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>临床特征</th><th>分</th></tr></thead>\n<tbody>\n<tr><td>Active cancer（6 月内治疗 / 姑息）</td><td>1</td></tr>\n<tr><td>Paralysis / paresis / 石膏固定</td><td>1</td></tr>\n<tr><td><strong>卧床 > 3 d / 大手术 12 周内</strong></td><td><strong>1</strong></td></tr>\n<tr><td>沿深静脉系统<strong>局部压痛</strong></td><td>1</td></tr>\n<tr><td><strong>整腿肿胀</strong></td><td>1</td></tr>\n<tr><td><strong>小腿围 > 健侧 3 cm</strong>（胫骨粗隆下 10 cm）</td><td><strong>1</strong></td></tr>\n<tr><td>患肢<strong>凹陷性水肿</strong></td><td>1</td></tr>\n<tr><td>浅表侧支（非曲张）</td><td>1</td></tr>\n<tr><td><strong>既往 DVT</strong></td><td>1</td></tr>\n<tr><td><strong>替代诊断 ≥ DVT 可能</strong></td><td>-2</td></tr>\n</tbody>\n</table>\n<ul>\n<li><strong>≥ 2：可能 DVT</strong></li>\n<li><strong>< 2：不太可能</strong></li>\n</ul>\n<p>4. <strong>本例评分</strong>：</p>\n<ul>\n<li>卧床 > 3 d（术后 4 d）= 1</li>\n<li>局部压痛 = 1</li>\n<li>小腿围 > 3 cm（4 cm）= 1</li>\n<li><strong>总计 = 3</strong>（<strong>高概率</strong>）</li>\n<p>5. <strong>处理路径</strong>：</p>\n<li><strong>Wells ≥ 2</strong> → <strong>直接 Doppler USG</strong></li>\n<li>Wells < 2 → 先 D-dimer，阴性排除</li>\n<p>6. <strong>选项排除</strong>：</p>\n<li>A (Doppler USG)：<strong>正确</strong></li>\n<li>B (X-ray)：看骨，<strong>不</strong>看血栓</li>\n<li>C (Venography)：金标准但<strong>有创</strong>，<strong>不</strong>是首选</li>\n<li>D (CT angio)：看<strong>动脉</strong>不是静脉</li>\n<li>E (D-dimer)：<strong>Wells 低</strong>才用；本例 Wells = 3（<strong>高</strong>）→ 不该先用</li>\n<p>7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"D-dimer 总先用\"陷阱</strong>：错。<strong>Wells ≥ 2 直接 USG</strong>（D-dimer 在术后本来高，假阳性多）。</li>\n<li><strong>\"X-ray 看钙化\"陷阱</strong>：X-ray 看骨/钙化，<strong>不</strong>看软组织血栓。</li>\n<li><strong>\"Venography 总做\"陷阱</strong>：<strong>有创</strong>，<strong>不</strong>首选。</li>\n<li><strong>\"CT angio 看一切\"陷阱</strong>：CT angio 是<strong>动脉</strong>检查。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>This patient has suspected diagnosis of <strong>deep vein thrombosis (DVT) and requires urgent Doppler ultrasound</strong> to establish the diagnosis. <strong>Doppler ultrasound is more than 90% sensitive and more than 95% specific for thromboses within the femoral and popliteal veins</strong>, but less accurate for iliac or calf vein thromboses.</p>\n<p><strong>D-dimer is used for assessment of patients with Wells score of < 2.</strong></p>\n<p>A patient with symptoms and signs consistent with DVT should be assessed and the clinical (pretest) probability of acute DVT established by using a validated scoring system. If the clinical probability of DVT is low (< 2), a D-dimer assay should be performed; otherwise, the next step would be Doppler Duplex sonography.</p>\n<p><strong>Modified Wells' Score for DVT</strong>:</p>\n<table class='md-table'>\n<thead><tr><th>Clinical characteristic</th><th>Score</th></tr></thead>\n<tbody>\n<tr><td>Active cancer (treatment ongoing, administered within previous 6 months or palliative)</td><td>1</td></tr>\n<tr><td>Paralysis, paresis or recent plaster immobilization of the lower extremities</td><td>1</td></tr>\n<tr><td><strong>Recently bedridden > 3 days or major surgery within previous 12 weeks requiring general or regional anesthesia</strong></td><td><strong>1</strong></td></tr>\n<tr><td>Localized tenderness along the distribution of the deep venous system</td><td>1</td></tr>\n<tr><td>Swelling of entire leg</td><td>1</td></tr>\n<tr><td><strong>Calf swelling > 3 cm larger than asymptomatic side</strong> (measured 10 cm below tibial tuberosity)</td><td><strong>1</strong></td></tr>\n<tr><td>Pitting edema confined to the symptomatic leg</td><td>1</td></tr>\n<tr><td>Collateral superficial veins (non-varicose)</td><td>1</td></tr>\n<tr><td>Previously documented DVT</td><td>1</td></tr>\n<tr><td>Alternative diagnosis at least as likely as DVT</td><td>-2</td></tr>\n</tbody>\n</table>\n<p><strong>A score of ≥ 2 indicates that the probability of DVT is likely; a score of < 2 indicates that the probability of DVT is unlikely.</strong></p>\n<p><strong>This patient has been bedridden for more than 3 days (1 point), has localized tenderness (1 point) and the circumference of the affected leg is more than 3 cm greater than the unaffected leg (1 point). With a Wells' score of 3, she has high probability diagnosis of DVT and needs Doppler ultrasonography of the leg as the next step.</strong></p>\n<ul>\n<li>If the Wells' score was < 2 the next best step would have been <strong>D-dimer assay</strong> (option E). A negative D-dimer test excludes DVT (and pulmonary embolism), but positive values is only suggestive of DVT and further investigations would be needed.</li>\n<li>Previously, <strong>contrast venography (option C) was the definitive test</strong> for the diagnosis of DVT but has been largely replaced by ultrasonography, which is noninvasive, more readily available; however, <strong>it still remains the gold-standard for diagnosis of DVT</strong> (not in practice). While a Doppler ultrasound can establish the diagnosis, <strong>there is no need for CT angiography (option D) unless accurate anatomical site of the thrombus is required for surgical intervention</strong> (very rarely indicated).</li>\n</ul>", "references": "<ul>\n<li>http://www.racgp.org.au/download/documents/AFP/201</li>\n<li>http://emedicine.medscape.com/article/1911303-work</li>\n<li>http://www.emedicine.medscape.com/article/1911303-</li>\n<li>（待补：ASH 2024 DVT 诊断指南）</li>\n</ul>", "related": ["AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0275-DVT-Treatment-Heparin", "AMC-Q0273-VTE-Risk-Heart-Failure", "MOC-Haematology", "Topic-Wells-Score"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "dvt + wells 3 分（高）— 直接 doppler（不先用 d-dimer）\ndvt modified wells score high probability doppler ultrasound post-orthopedic surgery\ninvestigation diagnosis definition\n a 79-year-old woman undergoes total hip replacement surgery. after 4 days, she develops a swollen right leg. the circumference of the right calf is 4 cm greater than that of the left leg. the right leg feels warm to touch and is slightly tender. which one of the following is most appropriate diagnostic tool to use for a diagnosis? \n correct answer is  a  \n this patient has suspected diagnosis of  deep vein thrombosis (dvt) and requires urgent doppler ultrasound  to establish the diagnosis.  doppler ultrasound is more than 90% sensitive and more than 95% specific for thromboses within the femoral and popliteal veins , but less accurate for iliac or calf vein thromboses. \n  d-dimer is used for assessment of patients with wells score of   \n a patient with symptoms and signs consistent with dvt should be assessed and the clinical (pretest) probability of acute dvt established by using a validated scoring system. if the clinical probability of dvt is low ( \n  modified wells' score for dvt : \n \n   clinical characteristic  score   \n \n  active cancer (treatment ongoing, administered within previous 6 months or palliative)  1  \n  paralysis, paresis or recent plaster immobilization of the lower extremities  1  \n   recently bedridden > 3 days or major surgery within previous 12 weeks requiring general or regional anesthesia    1   \n  localized tenderness along the distribution of the deep venous system  1  \n  swelling of entire leg  1  \n   calf swelling > 3 cm larger than asymptomatic side  (measured 10 cm below tibial tuberosity)   1   \n  pitting edema confined to the symptomatic leg  1  \n  collateral superficial veins (non-varicose)  1  \n  previously documented dvt  1  \n  alternative diagnosis at least as likely as dvt  -2  \n \n \n  a score of ≥ 2 indicates that the probability of dvt is likely; a score of   \n  this patient has been bedridden for more than 3 days (1 point), has localized tenderness (1 point) and the circumference of the affected leg is more than 3 cm greater than the unaffected leg (1 point). with a wells' score of 3, she has high probability diagnosis of dvt and needs doppler ultrasonography of the leg as the next step.  \n \n if the wells' score was  d-dimer assay  (option e). a negative d-dimer test excludes dvt (and pulmonary embolism), but positive values is only suggestive of dvt and further investigations would be needed. \n previously,  contrast venography (option c) was the definitive test  for the diagnosis of dvt but has been largely replaced by ultrasonography, which is noninvasive, more readily available; however,  it still remains the gold-standard for diagnosis of dvt  (not in practice). while a doppler ultrasound can establish the diagnosis,  there is no need for ct angiography (option d) unless accurate anatomical site of the thrombus is required for surgical intervention  (very rarely indicated). \n "}, {"id": "AMC-Q0500", "type": "mcq", "qid": 500, "title": "Trousseau 综合征 — 游走性血栓性静脉炎（胰腺癌相关）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": [], "topic": ["Trousseau 综合征 — 游走性血栓性静脉炎相关恶性肿瘤"], "difficulty": 2, "correctAnswer": "D", "page": 1404, "tags": [], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0500-Trousseau-Syndrome-Pancreatic-Cancer.md", "stem": "<p>A 68-year old woman presents with migratory superficial thrombophlebitis and recurrent deep vein thrombosis (DVT) of his lower extremities. Which one of the following malignancies is most likely to be the cause?</p>", "options": [{"letter": "A", "text": "Ovarian cancer."}, {"letter": "B", "text": "Endometrial cancer."}, {"letter": "C", "text": "Gastric cancer."}, {"letter": "D", "text": "Pancreatic cancer."}, {"letter": "E", "text": "Lung cancer."}], "rationale": "<p>1. 题型识别：诊断 — 副肿瘤综合征与恶性肿瘤的关联 2. 关键线索：<strong>游走性</strong>浅表血栓性静脉炎 + 复发性 DVT = Trousseau 综合征 3. Trousseau 综合征特点：常为隐匿性腺癌，可在肿瘤临床显现前数月到数年出现 4. 记忆：Trousseau 相关癌症发生率排序 → <strong>胰腺 24% > 肺 20% > 前列腺 13% > 胃 12% > 急性白血病 9% > 结肠 5%</strong> 5. 卵巢癌/子宫内膜癌也可致高凝状态和复发性 DVT，但 Trousseau 综合征极其罕见 6. 锁定答案：D</p>", "traps": "<ul>\n<li><strong>\"DVT + 癌症\"≠ Trousseau</strong>：Trousseau 的要点是<strong>游走性</strong>、<strong>多部位</strong>（手臂、胸部等非常见部位）的血栓性静脉炎</li>\n<li><strong>卵巢癌是干扰项</strong>：虽然可致高凝，但 Trousseau 综合征与其关联极罕见；选项 D 才是最高关联</li>\n<li><strong>隐藏癌症</strong>：Trousseau 可先于癌症诊断数月-数年，首次发作时肿瘤可能检测不到</li>\n</ul>", "summary": "<p><strong>Trousseau 综合征</strong>：</p>\n<ul>\n<li>定义：静脉血栓的变体，表现为<strong>游走性</strong>浅表血栓性静脉炎反复发作，常见于手臂、胸部等<strong>非常见部位</strong></li>\n<li>通常有<strong>隐匿性腺癌</strong>（occult adenocarcinoma）</li>\n<li>可先于癌症显现数月-数年</li>\n</ul>\n<p><strong>相关恶性肿瘤发生率</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>癌症</th><th>发生率</th></tr></thead>\n<tbody>\n<tr><td>胰腺癌</td><td>24%</td></tr>\n<tr><td>肺癌</td><td>20%</td></tr>\n<tr><td>前列腺癌</td><td>13%</td></tr>\n<tr><td>胃癌</td><td>12%</td></tr>\n<tr><td>急性白血病</td><td>9%</td></tr>\n<tr><td>结肠癌</td><td>5%</td></tr>\n</tbody>\n</table>", "explanation": "<p>该女性表现符合 Trousseau 综合征——以游走性浅表血栓性静脉炎为特征的静脉血栓变体。此综合征通常存在隐匿性肿瘤（多为腺癌），发作时可尚未被检测到。给定选项中，<strong>胰腺癌与 Trousseau 征关联最高（24%）</strong>。卵巢癌和子宫内膜癌虽可致高凝状态和复发性 DVT，但 Trousseau 综合征极其罕见。</p>", "references": "<ul>\n<li>Medscape – What are the signs and symptoms of migratory thrombophlebitis</li>\n<li>PubMed – Thrombophlebitis migrans in a man with pancreatic adenocarcinoma: a case report</li>\n</ul>", "related": ["_MOC-Haematology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "trousseau 综合征 — 游走性血栓性静脉炎（胰腺癌相关）\ntrousseau 综合征 — 游走性血栓性静脉炎相关恶性肿瘤\n a 68-year old woman presents with migratory superficial thrombophlebitis and recurrent deep vein thrombosis (dvt) of his lower extremities. which one of the following malignancies is most likely to be the cause? \n 该女性表现符合 trousseau 综合征——以游走性浅表血栓性静脉炎为特征的静脉血栓变体。此综合征通常存在隐匿性肿瘤（多为腺癌），发作时可尚未被检测到。给定选项中， 胰腺癌与 trousseau 征关联最高（24%） 。卵巢癌和子宫内膜癌虽可致高凝状态和复发性 dvt，但 trousseau 综合征极其罕见。 "}, {"id": "AMC-Q0779", "type": "mcq", "qid": 779, "title": "非霍奇金淋巴瘤 — 5 年生存 66% 最难治", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": [], "topic": ["非霍奇金淋巴瘤 — 最难治疗（5 年生存 66%）"], "difficulty": 2, "correctAnswer": "B", "page": 1447, "tags": [], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0779-NHL-Least-Treatable.md", "stem": "<p>Which one of the following malignancies is least treatable?</p>", "options": [{"letter": "A", "text": "Hodgkin lymphoma (HL)."}, {"letter": "B", "text": "Non-Hodgkin lymphoma (NHL)."}, {"letter": "C", "text": "Breast cancer."}, {"letter": "D", "text": "Testicular cancer."}, {"letter": "E", "text": "Choriocarcinoma."}], "rationale": "<p>1. 题型识别：预后 — 恶性肿瘤 5 年生存率比较 2. 5 年生存率对比：</p>\n<ul>\n<li>睾丸癌（D）：<strong>99%</strong></li>\n<li>乳腺癌（C）：87%</li>\n<li>霍奇金淋巴瘤（A）：82%</li>\n<li>绒毛膜癌（E）：>80%</li>\n<li><strong>NHL（B）：66%</strong> ← 最低</li>\n<p>3. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>HL vs NHL 生存率不同</strong>：霍奇金 82% vs 非霍奇金 66%——别混淆两个淋巴瘤</li>\n<li><strong>绒毛膜癌</strong>：虽然侵袭性，但化疗敏感（>80% 5 年生存）——\"最难治\"不等于\"侵袭性最强\"</li>\n<li><strong>睾丸癌 99%</strong>：最可治疗的实体瘤之一——化疗极敏感</li>\n</ul>", "summary": "<p><strong>常见恶性肿瘤 5 年生存率</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>癌症</th><th>5 年生存率</th></tr></thead>\n<tbody>\n<tr><td>睾丸癌</td><td>99%</td></tr>\n<tr><td>甲状腺癌</td><td>92%</td></tr>\n<tr><td>黑色素瘤</td><td>90%</td></tr>\n<tr><td>乳腺癌</td><td>87%</td></tr>\n<tr><td>子宫癌</td><td>84%</td></tr>\n<tr><td>前列腺癌</td><td>84%</td></tr>\n<tr><td>霍奇金淋巴瘤</td><td>82%</td></tr>\n<tr><td>绒毛膜癌</td><td>>80%</td></tr>\n<tr><td><strong>非霍奇金淋巴瘤</strong></td><td><strong>66%</strong></td></tr>\n<tr><td>结肠癌</td><td>63%</td></tr>\n<tr><td>膀胱癌</td><td>51%</td></tr>\n<tr><td>卵巢癌</td><td>41%</td></tr>\n<tr><td>胃癌</td><td>25%</td></tr>\n<tr><td>肺癌</td><td>11%</td></tr>\n<tr><td>肝癌</td><td>10%</td></tr>\n<tr><td>胰腺癌</td><td>5%</td></tr>\n</tbody>\n</table>", "explanation": "<p>选项中 NHL 以 5 年生存率 66% 成为最难治疗的恶性肿瘤。睾丸癌（99%）、甲状腺癌（92%）、乳腺癌（87%）、霍奇金淋巴瘤（82%）和绒毛膜癌（>80%）的生存率均显著高于 NHL。</p>", "references": "<ul>\n<li>Murtagh's General Practice – McGraw Hill – 6th Edition – page 257</li>\n<li>http://www.cancerresearchuk.org/about-cancer/type/</li>\n</ul>", "related": ["_MOC-Haematology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "非霍奇金淋巴瘤 — 5 年生存 66% 最难治\n非霍奇金淋巴瘤 — 最难治疗（5 年生存 66%）\n which one of the following malignancies is least treatable? \n 选项中 nhl 以 5 年生存率 66% 成为最难治疗的恶性肿瘤。睾丸癌（99%）、甲状腺癌（92%）、乳腺癌（87%）、霍奇金淋巴瘤（82%）和绒毛膜癌（>80%）的生存率均显著高于 nhl。 "}, {"id": "AMC-Q1210", "type": "mcq", "qid": 1210, "title": "华法林+胺碘酮 — 大腿血肿（药物相互作用）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": [], "topic": ["华法林+胺碘酮相互作用 — 大腿血肿"], "difficulty": 3, "correctAnswer": "D", "page": 1425, "tags": [], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q1210-Warfarin-Amiodarone-Hematoma.md", "stem": "<p>A 67-year-old man presents to your office complaining of a painful swollen right thigh. He has diabetes well controlled on metformin 500mg 12-hourly and hypertension for which he is taking losartan 25mg 12-hourly. He is also on simvastatin 20 mg/daily hypercholesterolemia. His recent medical history is significant for atrial fibrillation (AF) under treatment with warfarin. One week ago, he was started on amiodarone after he was diagnosed with ventricular tachycardia (VT). On physical examination, he has a blood pressure of 140/95mmHg, pulse rate of 98bpm and a temperature of 37.3°C. The left thigh is painful, swollen and slightly tender but not warm or red, and has a circumference 4 cm greater than that of the left thigh. Which one of the following could be the most likely cause of this presentation?</p>", "options": [{"letter": "A", "text": "Deep vein thrombosis (DVT)."}, {"letter": "B", "text": "Drug reaction."}, {"letter": "C", "text": "Cellulitis."}, {"letter": "D", "text": "A thigh hematoma."}, {"letter": "E", "text": "Rhabdomyolysis."}], "rationale": "<p>1. 题型识别：诊断 — 药物相互作用导致的并发症 2. 核心机制：<strong>胺碘酮抑制华法林的肝代谢</strong> → 华法林效应增强 → 出血倾向增加 3. 临床判断：大腿疼痛肿胀 + 周径增加 4cm，<strong>不红不热 + 体温正常</strong>：</p>\n<ul>\n<li>血肿（D）：抗凝过度常见结果 ✓</li>\n<li>蜂窝织炎（C）：应红、热、常发热——不符合</li>\n<li>DVT（A）：正在用华法林治疗 AF，虽不排除但可能性较低</li>\n<li>横纹肌溶解（E）：全身性表现，不引起局灶体征</li>\n<p>4. 鉴别\"药物反应 vs 药物相互作用\"：这是<strong>相互作用</strong>（一药增强另一药效应），非单药不良反应 5. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>药物反应 vs 药物相互作用</strong>：B 选项是\"drug reaction\"（单药不良反应），而本例是胺碘酮-华法林<strong>相互作用</strong></li>\n<li><strong>他汀+胺碘酮</strong>：胺碘酮也是 CYP3A4 强抑制剂——与他汀（辛伐他汀）合用增加肌病/横纹肌溶解风险，但横纹肌溶解为全身表现，无局灶体征</li>\n<li><strong>不红不热是关键</strong>：排除蜂窝织炎；发热（37.3°C 临界）不支持感染</li>\n</ul>", "summary": "<p><strong>华法林-胺碘酮相互作用</strong>：</p>\n<ul>\n<li>胺碘酮抑制华法林经肝代谢 → 华法林效应增强 → 出血倾向</li>\n<li>新加胺碘酮后需<strong>监测 INR 并调整华法林剂量</strong></li>\n</ul>\n<p><strong>大腿肿胀鉴别</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>诊断</th><th>关键特征</th></tr></thead>\n<tbody>\n<tr><td>血肿</td><td>肿胀 + 压痛，不红不热，抗凝背景</td></tr>\n<tr><td>蜂窝织炎</td><td>红、热、肿胀 + 常发热</td></tr>\n<tr><td>DVT</td><td>肿胀 + 压痛，可能单侧，抗凝治疗下少见</td></tr>\n<tr><td>横纹肌溶解</td><td>全身性（肌痛、肌红蛋白尿、高钾），无局灶体征</td></tr>\n</tbody>\n</table>", "explanation": "<p>华法林与胺碘酮的相互作用众所周知——胺碘酮通过肝途径<strong>减少华法林代谢</strong>，导致出血倾向增加。该患者新加胺碘酮，最可能是<strong>大腿血肿</strong>（抗凝过度患者出血的常见结果）。蜂窝织炎表现为红热肿胀且常伴发热；本例无发热、不红不热，可能性低。横纹肌溶解为全身性表现，不会引起局灶体征。</p>", "references": "<ul>\n<li>https://www.nzwcs.org.nz/images/publications/Pagan-Hunter_WPR_19-01.pdf</li>\n<li>https://www.racgp.org.au/download/documents/AFP/2010/July/201007tadros_warfain.pdf</li>\n</ul>", "related": ["AMC-Q1316-Warfarin-Amiodarone-INR", "_MOC-Haematology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "华法林+胺碘酮 — 大腿血肿（药物相互作用）\n华法林+胺碘酮相互作用 — 大腿血肿\n a 67-year-old man presents to your office complaining of a painful swollen right thigh. he has diabetes well controlled on metformin 500mg 12-hourly and hypertension for which he is taking losartan 25mg 12-hourly. he is also on simvastatin 20 mg/daily hypercholesterolemia. his recent medical history is significant for atrial fibrillation (af) under treatment with warfarin. one week ago, he was started on amiodarone after he was diagnosed with ventricular tachycardia (vt). on physical examination, he has a blood pressure of 140/95mmhg, pulse rate of 98bpm and a temperature of 37.3°c. the left thigh is painful, swollen and slightly tender but not warm or red, and has a circumference 4 cm greater than that of the left thigh. which one of the following could be the most likely cause of this presentation? \n 华法林与胺碘酮的相互作用众所周知——胺碘酮通过肝途径 减少华法林代谢 ，导致出血倾向增加。该患者新加胺碘酮，最可能是 大腿血肿 （抗凝过度患者出血的常见结果）。蜂窝织炎表现为红热肿胀且常伴发热；本例无发热、不红不热，可能性低。横纹肌溶解为全身性表现，不会引起局灶体征。 "}, {"id": "AMC-Q1316", "type": "mcq", "qid": 1316, "title": "华法林+胺碘酮大腿血肿 — 首选查 INR", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": [], "topic": ["华法林+胺碘酮血肿 — 首选查 INR"], "difficulty": 3, "correctAnswer": "C", "page": 1434, "tags": [], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q1316-Warfarin-Amiodarone-INR.md", "stem": "<p>A 69-year-old man presents to the emergency department with a painful swollen left thigh. His current medications include metformin 500 mg 8-hourly for diabetes, valsartan 80 mg daily for hypertension, atorvastatin 10mg daily for hypercholesterolemia, and warfarin 5mg daily for chronic atrial fibrillation. One week earlier, he was started on amiodarone after he was diagnosed with ventricular tachycardia (VT). On physical examination, he has a blood pressure of 138/87mmHg, pulse rate of 82 pm and a temperature of 36.6°C. The left thigh is painful, swollen and slightly tender but not warm or red. The affected leg circumference is 5 cm greater than the unaffected one. Which one of the following options is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Duplex Doppler ultrasound of the left leg."}, {"letter": "B", "text": "Blood culture."}, {"letter": "C", "text": "INR."}, {"letter": "D", "text": "Commencement of antibiotics."}, {"letter": "E", "text": "Decrease the dose
