  <script>
  // Global fallback for slash toggle — works even if IIFE crashes
  window._toggleSlash = function() {
    var btn = document.getElementById("slash-toggle");
    var body = document.body;
    if (!btn) return;
    body.classList.toggle("slash-mode");
    btn.classList.toggle("on");
    btn.querySelector(".toggle-dot");
    var isOn = body.classList.contains("slash-mode");
    // Try to find slash buttons and toggle them
    var cards = document.querySelectorAll(".card .slash-btn");
    cards.forEach(function(b) { b.style.display = isOn ? "block" : "none"; });
  };
  (function () {
    "use strict";

    // ----- Load embedded data -----
    var raw = document.getElementById("data").textContent;
    var DATA = JSON.parse(raw);
    var items = DATA.items;
    var stats = DATA.stats;
    var byId = {};
    items.forEach(function (it) { byId[it.id] = it; });

    // ----- State -----
    var state = {
      type: new Set(),
      subcategory: new Set(),
      disease: new Set(),
      complaint: new Set(),
      approach: new Set(),
      difficulty: new Set(),
      favorite: new Set(),  // contains "on" when filter is active
      q: "",
      sort: "qid"
    };

    // ----- Favorites (persisted in localStorage) -----
    // We persist just the set of favorited item IDs, not the filter
    // state. The filter chip's "on/off" state is per-session so a fresh
    // open shows everything by default.
    var FAV_STORAGE_KEY = "amc-mcq-favs-v1";
    function loadFavs() {
      try {
        var raw = localStorage.getItem(FAV_STORAGE_KEY);
        if (!raw) return new Set();
        var arr = JSON.parse(raw);
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (e) { return new Set(); }
    }
    function saveFavs(set) {
      try { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(Array.from(set))); }
      catch (e) { /* quota or private mode — silently degrade */ }
    }
    var favIds = loadFavs();
    function isFav(id) { return favIds.has(id); }
    function toggleFav(id) {
      if (favIds.has(id)) favIds.delete(id); else favIds.add(id);
      saveFavs(favIds);
      // Re-render only the bits that depend on fav state — the star
      // itself, the chip count, and the active-tag pill if filter on.
      syncStarButtons();
      refreshChipCounts();
      // The grid itself only changes if the favorite filter is active.
      if (state.favorite.size > 0) render();
    }
    function syncStarButtons() {
      document.querySelectorAll(".card .star").forEach(function (el) {
        var id = el.dataset.id;
        if (favIds.has(id)) el.classList.add("on");
        else el.classList.remove("on");
        el.textContent = favIds.has(id) ? "★" : "☆";
        el.title = favIds.has(id) ? "取消收藏" : "收藏";
      });
    }

    // ----- Render sidebar -----
    // Chips are created ONCE on init. After that, ``refreshChipCounts``
    // updates each chip's count + visibility in place based on the
    // current filter state, so the sidebar shows the count of items
    // that match every other active filter (faceted drill-down).
    function makeChip(field, value) {
      var c = document.createElement("span");
      c.className = "chip";
      c.dataset.field = field;
      c.dataset.value = String(value);
      c.innerHTML = '<span class="label"></span><span class="count"></span>';
      c.querySelector(".label").textContent = value;
      c.addEventListener("click", function () { toggleFilter(field, value); });
      return c;
    }

    function renderFilterGroup(field, values) {
      var host = document.getElementById("f-" + field);
      if (!host) return;  // group was removed (e.g. difficulty)
      host.innerHTML = "";
      values.forEach(function (v) { host.appendChild(makeChip(field, v)); });
    }

    // Return the list of values that ``it`` contributes to ``field``.
    function getFieldValues(it, field) {
      if (field === "difficulty") {
        return it.difficulty > 0 ? [it.difficulty] : [];
      }
      if (field === "type") {
        return [it.type === "mcq" ? "MCQ" : "Topic Review"];
      }
      if (field === "subcategory") return [it.subcategory];
      if (field === "approach")    return it.approach || [];
      if (field === "disease")     return it.diseases || [];
      if (field === "complaint")   return it.complaints || [];
      return [];
    }

    // Recompute every chip's count + visibility based on current state.
    // The count for a chip answers: "if I added this chip to my selection,
    // how many items would I see?" — i.e. the count of items that match
    // all OTHER active filters AND (have this chip's value OR already
    // match my current selection in the SAME field). This makes the
    // sidebar a proper faceted-search UI: counts stay meaningful as the
    // user drills down.
    //
    // Important: the SAME field's state is intentionally NOT applied
    // here (we re-apply it via the OR-with-current-selection step
    // below). Only the other 5 filter fields are AND-combined.
    function chipMatches(it, field, value) {
      if (field !== "type" && state.type.size > 0 && !state.type.has(it.type)) return false;
      if (field !== "subcategory" && state.subcategory.size > 0 && !state.subcategory.has(it.subcategory)) return false;
      if (field !== "disease") {
        if (state.disease.size > 0) {
          var hasDz = (it.diseases || []).some(function (d) { return state.disease.has(d); });
          if (!hasDz) return false;
        }
      }
      if (field !== "complaint") {
        if (state.complaint.size > 0) {
          var hasCc = (it.complaints || []).some(function (c) { return state.complaint.has(c); });
          if (!hasCc) return false;
        }
      }
      if (field !== "approach") {
        if (state.approach.size > 0) {
          var hasAp = (it.approach || []).some(function (a) { return state.approach.has(a); });
          if (!hasAp) return false;
        }
      }
      if (field !== "difficulty" && state.difficulty.size > 0 && !state.difficulty.has(it.difficulty)) return false;
      if (field !== "favorite" && state.favorite.size > 0 && !isFav(it.id)) return false;
      var q = state.q.trim().toLowerCase();
      if (q && it.search.indexOf(q) === -1) return false;

      // Within the same field, OR with the current selection (additive).
      // For "favorite" the field has a single value ("on") and the item
      // passes when it's in the favIds set.
      if (field === "favorite") return isFav(it.id);
      var itemValues = getFieldValues(it, field);
      if (itemValues.indexOf(value) >= 0) return true;
      if (state[field].size > 0) {
        for (var i = 0; i < itemValues.length; i++) {
          if (state[field].has(itemValues[i])) return true;
        }
      }
      return false;
    }

    function refreshChipCounts() {
      var fields = ["favorite", "type", "subcategory", "disease", "complaint", "approach", "difficulty"];
      fields.forEach(function (field) {
        // For each chip value in this field, count items that would
        // match if the chip were added to the current selection.
        var host = document.getElementById("f-" + field);
        if (!host) return;
        var chips = host.querySelectorAll(".chip");
        chips.forEach(function (chip) {
          var v = chip.dataset.value;
          var n = 0;
          for (var i = 0; i < items.length; i++) {
            if (chipMatches(items[i], field, v)) n++;
          }
          var key = (field === "type")
            ? normalizeTypeValue(v)
            : (field === "difficulty" ? parseInt(v, 10) : v);
          var isActive = state[field].has(key);
          chip.querySelector(".count").textContent = "(" + n + ")";
          // Hide if zero matches AND not currently selected (so the user
          // can always see and deselect what they've already picked).
          chip.style.display = (n === 0 && !isActive) ? "none" : "";
          if (n === 0 && !isActive) chip.classList.add("empty");
          else chip.classList.remove("empty");
        });
      });

      // Auto-expand groups that have active filters, show indicator dots
      document.querySelectorAll(".sidebar .group").forEach(function (g) {
        var field = g.querySelector("[data-group]");
        if (!field) return;
        var fId = field.dataset.group;
        if (!fId || fId === "favorite") return;
        var hasActive = state[fId] && state[fId].size > 0;
        if (hasActive) {
          g.classList.add("open", "has-active");
        } else {
          g.classList.remove("has-active");
        }
      });
    }

    function countField(field) {
      // Kept for legacy / debug. Counts against all items, ignoring state.
      var out = {};
      items.forEach(function (it) {
        getFieldValues(it, field).forEach(function (v) {
          out[v] = (out[v] || 0) + 1;
        });
      });
      return out;
    }

    var approachValues = Object.keys(stats.byApproach);
    var difficultyValues = [1, 2, 3, 4, 5];
    var subcategoryValues = Object.keys(stats.bySubcategory);
    var typeValues = ["MCQ", "Topic Review"];
    var diseaseValues = Object.keys(stats.byDisease || {});
    var complaintValues = Object.keys(stats.byComplaint || {});

    renderFilterGroup("type", typeValues);
    renderFilterGroup("subcategory", subcategoryValues);
    renderFilterGroup("disease", diseaseValues);
    renderFilterGroup("complaint", complaintValues);
    renderFilterGroup("approach", approachValues);
    renderFilterGroup("difficulty", difficultyValues);
    refreshChipCounts();

    // ----- Filter logic -----
    function toggleFilter(field, value) {
      var set = state[field];
      var key = (field === "type") ? normalizeTypeValue(value) : value;
      if (set.has(key)) set.delete(key); else set.add(key);
      render();
    }

    function normalizeTypeValue(v) {
      return v === "MCQ" ? "mcq" : "tr";
    }

    function clearGroup(field) {
      state[field].clear();
      render();
    }

    document.querySelectorAll(".clear").forEach(function (el) {
      el.addEventListener("click", function () { clearGroup(el.dataset.clear); });
    });

    // The favorite chip is hard-coded in HTML (only one value: "on"),
    // so bind its click manually instead of going through makeChip.
    var favChip = document.querySelector("#f-favorite .chip");
    if (favChip) {
      favChip.addEventListener("click", function () { toggleFilter("favorite", "on"); });
    }

    // ----- Active tag pills in toolbar -----
    function renderActiveTags() {
      var host = document.getElementById("active-tags");
      host.innerHTML = "";
      var groups = [
        ["favorite", "收藏"],
        ["type", "类型"],
        ["subcategory", "亚科"],
        ["disease", "疾病"],
        ["complaint", "主诉"],
        ["approach", "approach"],
        ["difficulty", "难度"]
      ];
      groups.forEach(function (g) {
        state[g[0]].forEach(function (v) {
          var pill = document.createElement("span");
          pill.className = "pill";
          pill.textContent = g[1] + ": " + v + "  ×";
          pill.style.cursor = "pointer";
          pill.addEventListener("click", function () { state[g[0]].delete(v); render(); });
          host.appendChild(pill);
        });
      });
    }

    // ----- Filter apply -----
    function applyFilters() {
      var q = state.q.trim().toLowerCase();
      return items.filter(function (it) {
        if (state.favorite.size > 0 && !isFav(it.id)) return false;
        if (state.type.size > 0 && !state.type.has(it.type)) return false;
        if (state.subcategory.size > 0 && !state.subcategory.has(it.subcategory)) return false;
        if (state.disease.size > 0) {
          var hasDz = (it.diseases || []).some(function (d) { return state.disease.has(d); });
          if (!hasDz) return false;
        }
        if (state.complaint.size > 0) {
          var hasCc = (it.complaints || []).some(function (c) { return state.complaint.has(c); });
          if (!hasCc) return false;
        }
        if (state.approach.size > 0) {
          var has = (it.approach || []).some(function (a) { return state.approach.has(a); });
          if (!has) return false;
        }
        if (state.difficulty.size > 0 && !state.difficulty.has(it.difficulty)) return false;
        if (q && it.search.indexOf(q) === -1) return false;
        return true;
      });
    }

    function sortItems(arr) {
      var key = state.sort;
      arr.sort(function (a, b) {
        if (key === "title") return a.title.localeCompare(b.title, "zh");
        if (key === "difficulty") return (a.difficulty || 0) - (b.difficulty || 0);
        if (key === "page") return (a.page || 0) - (b.page || 0);
        return (a.qid || 0) - (b.qid || 0);
      });
      return arr;
    }

    // ----- Card rendering -----
    function difficultyDots(d) {
      var s = '<span class="diff">';
      for (var i = 1; i <= 5; i++) {
        s += '<span class="d' + (i <= d ? " on" : "") + '"></span>';
      }
      return s + '</span>';
    }

    function tagPill(label, cls) {
      return '<span class="tag ' + (cls || "") + '">' + escapeHtml(label) + '</span>';
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderCard(it) {
      var card = document.createElement("div");
      card.className = "card";
      card.style.setProperty("--color", it.color);
      card.dataset.id = it.id;

      var metaBits = [];
      if (it.type === "mcq") {
        metaBits.push('<span>QID ' + (it.qid || "—") + '</span>');
      } else {
        metaBits.push('<span class="tr-tag">Topic Review</span>');
      }
      metaBits.push('<span>' + escapeHtml(it.subcategory) + '</span>');
      if (it.page) metaBits.push('<span>p.' + it.page + '</span>');
      if (it.difficulty) metaBits.push(difficultyDots(it.difficulty));

      var approachPills = (it.approach || []).slice(0, 4)
        .map(function (a) { return tagPill("approach-" + a); }).join("");
      var topicPills = (it.topic || []).slice(0, 3)
        .map(function (a) { return tagPill(a); }).join("");
      var diseasePills = (it.diseases || []).slice(0, 2)
        .map(function (a) { return tagPill("🩺 " + a, "disease-tag"); }).join("");
      var complaintPills = (it.complaints || []).slice(0, 2)
        .map(function (a) { return tagPill("💬 " + a, "complaint-tag"); }).join("");

      var stem = it.type === "mcq"
        ? stripHtml(it.stem)
        : stripHtml(it.stem || it.bodyHtml);

      // Star button — click toggles favorite, click on the rest of the
      // card still opens the modal.
      card.innerHTML =
        '<div class="qid-mono">' + escapeHtml(it.id) + '</div>' +
        '<button class="star" data-id="' + escapeHtml(it.id) + '" title="收藏" aria-label="收藏">☆</button>' +
        '<button class="slash-btn" data-id="' + escapeHtml(it.id) + '" title="斩掉此题">斩</button>' +
        '<div class="meta">' + metaBits.join(" · ") + '</div>' +
        '<div class="title">' + escapeHtml(it.title) + '</div>' +
        (stem ? '<div class="stem">' + escapeHtml(truncate(stem, 140)) + '</div>' : '') +
        '<div class="tag-row">' + topicPills + diseasePills + complaintPills + approachPills + '</div>';

      // Card click → modal
      card.addEventListener("click", function (e) {
        if (e.target.closest && e.target.closest(".star")) return;
        if (e.target.closest && e.target.closest(".slash-btn")) return;
        openModal(it.id);
      });
      // Star click → toggle fav
      var starEl = card.querySelector(".star");
      starEl.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleFav(it.id);
      });
      // Slash button click
      var slashEl = card.querySelector(".slash-btn");
      if (slashEl) {
        slashEl.addEventListener("click", function (e) {
          e.stopPropagation();
          e.preventDefault();
          slashItem(it.id);
        });
      }
      return card;
    }

    function stripHtml(s) {
      return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    }
    function truncate(s, n) {
      return s.length > n ? s.slice(0, n) + "…" : s;
    }

    // ----- Stats line -----
    function renderStats() {
      var s = stats;
      var line = [
        s.total + " 条笔记",
        s.byType.mcq + " MCQ",
        s.byType.tr + " Topic Review",
        Object.keys(s.bySubcategory).length + " 亚科"
      ].join(" · ");
      document.getElementById("stats-line").textContent = line + " · 生成于 " + s.generatedAt;
    }

    // ----- Main render -----
    function render() {
      // Update chip active states
      document.querySelectorAll(".chip").forEach(function (el) {
        var f = el.dataset.field;
        var v = el.dataset.value;
        var key = (f === "type") ? normalizeTypeValue(v) : (f === "difficulty" ? parseInt(v, 10) : v);
        if (state[f].has(key)) el.classList.add("active"); else el.classList.remove("active");
      });
      // Recompute context-sensitive chip counts + visibility
      refreshChipCounts();
      renderActiveTags();

      var filtered = sortItems(applyFilters());
      document.getElementById("result-count").innerHTML =
        '<strong>' + filtered.length + '</strong> / ' + items.length + ' 条';

      var grid = document.getElementById("grid");
      grid.innerHTML = "";
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1">没有匹配的笔记。试试清除一些筛选条件。</div>';
        return;
      }
      filtered.forEach(function (it) { grid.appendChild(renderCard(it)); });
      // Re-paint the star icons on freshly built cards so users see the
      // right state (filled vs empty) for items they previously favorited.
      syncStarButtons();
    }

    // ----- Modal -----
    var modalBack = document.getElementById("modal-back");
    var modalHead = document.getElementById("modal-head");
    var modalBody = document.getElementById("modal-body");

    function openModal(id) {
      var it = byId[id];
      if (!it) return;
      // Modal star button: sits next to the close button, mirrors card star.
      var starIcon = isFav(it.id) ? "★" : "☆";
      var head = '<h1>' + escapeHtml(it.title) + '</h1>' +
        '<button class="modal-star" data-id="' + escapeHtml(it.id) + '" title="收藏" aria-label="收藏">' + starIcon + '</button>' +
        '<div class="meta">' +
          (it.type === "mcq"
            ? '<span>QID ' + (it.qid || "—") + '</span>'
            : '<span class="tr-tag">Topic Review</span>') +
          '<span>' + escapeHtml(it.subcategory) + '</span>' +
          (it.page ? '<span>p.' + it.page + '</span>' : '') +
          (it.difficulty ? '<span>难度 ' + it.difficulty + '/5</span>' : '') +
        '</div>';
      modalHead.style.setProperty("--color", it.color);
      modalHead.innerHTML = head;
      // Wire up the modal star
      var modalStar = modalHead.querySelector(".modal-star");
      if (modalStar) {
        modalStar.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleFav(it.id);
          // Update the modal star + (if still open) keep the modal open
          var on = isFav(it.id);
          modalStar.textContent = on ? "★" : "☆";
          modalStar.classList.toggle("on", on);
        });
        if (isFav(it.id)) modalStar.classList.add("on");
      }

      var body = "";
      // Topic chips
      if ((it.topic || []).length) {
        body += '<section><div class="tag-row">' +
          it.topic.map(function (t) { return tagPill(t); }).join(" ") +
          (it.approach || []).map(function (a) { return tagPill("approach-" + a); }).join(" ") +
          '</div></section>';
      }

      if (it.type === "mcq") {
        if (it.stem) {
          body += '<section><h2>题干</h2>' + it.stem + '</section>';
        }
        if (it.options && it.options.length) {
          body += '<section><h2>选项</h2><div class="options">';
          it.options.forEach(function (o) {
            var isAns = (o.letter === it.correctAnswer);
            body += '<div class="opt' + (isAns ? ' correct' : '') + '">' +
              '<span class="letter">' + escapeHtml(o.letter) + '.</span>' +
              '<span>' + o.text + '</span>' +
              (isAns ? ' <span style="margin-left:auto;color:var(--correct-ink);font-size:11px">✓ 正确答案</span>' : '') +
              '</div>';
          });
          body += '</div></section>';
        } else if (it.type === "mcq") {
          // ECG-strip / image-based question
          body += '<section><h2>选项</h2>' +
            '<p style="color:var(--ink-3);font-size:12.5px">本题选项为图（心电图 / 影像 / 真题插图），请回到 PDF 原页对照。' +
            ' 正确答案：<strong style="color:var(--correct-ink)">' + escapeHtml(it.correctAnswer || '—') + '</strong></p></section>';
        }
        if (it.rationale) body += '<section><h2>解题思路</h2>' + it.rationale + '</section>';
        if (it.traps)     body += '<section><h2>陷阱</h2>' + it.traps + '</section>';
        if (it.summary)   body += '<section><h2>知识总结</h2>' + it.summary + '</section>';
        if (it.explanation) body += '<section><h2>解析</h2>' + it.explanation + '</section>';
        if (it.references)  body += '<section><h2>参考文献</h2><div class="refs">' + it.references + '</div></section>';
      } else {
        if (it.bodyHtml) body += '<section>' + it.bodyHtml + '</section>';
      }

      if ((it.related || []).length) {
        body += '<section><h2>关联笔记</h2><div class="related-list">';
        it.related.forEach(function (r) {
          var target = byId[r] || (function () {
            // try to match by partial file stem
            for (var k in byId) {
              if (byId[k].file && byId[k].file.indexOf(r) >= 0) return byId[k];
            }
            return null;
          })();
          if (target) {
            body += '<a data-jump="' + escapeHtml(target.id) + '">' + escapeHtml(target.title) + '</a>';
          } else {
            body += '<a style="opacity:.6" title="未找到对应笔记">' + escapeHtml(r) + '</a>';
          }
        });
        body += '</div></section>';
      }

      // Source path footer
      body += '<section style="margin-top:20px;color:var(--ink-3);font-size:11.5px">' +
        '<strong>源文件：</strong><code>' + escapeHtml(it.file) + '</code>' +
        '</section>';

      modalBody.innerHTML = body;

      // Wire up related-link clicks
      modalBody.querySelectorAll("a[data-jump]").forEach(function (a) {
        a.addEventListener("click", function (e) {
          e.preventDefault();
          openModal(a.dataset.jump);
        });
      });

      modalBack.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modalBack.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    modalBack.addEventListener("click", function (e) {
      if (e.target === modalBack) closeModal();
    });

    // ----- Search -----
    var searchInput = document.getElementById("search");
    var searchTimer = null;
    searchInput.addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.q = searchInput.value;
        render();
      }, 180);
    });

    // ----- Sort -----
    document.getElementById("sort").addEventListener("change", function (e) {
      state.sort = e.target.value;
      render();
    });

    // ----- Keyboard -----
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (modalBack.classList.contains("open")) closeModal();
        return;
      }
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
      }
      // j / k to navigate cards when modal closed
      if (!modalBack.classList.contains("open") &&
          document.activeElement !== searchInput &&
          (e.key === "j" || e.key === "k")) {
        var cards = Array.from(document.querySelectorAll(".card"));
        if (!cards.length) return;
        var cur = document.activeElement;
        var idx = cards.indexOf(cur);
        if (idx === -1) idx = 0;
        else idx = (e.key === "j") ? Math.min(idx + 1, cards.length - 1)
                                   : Math.max(idx - 1, 0);
        cards[idx].focus();
        cards[idx].scrollIntoView({ block: "nearest" });
        e.preventDefault();
      }
    });

    // Make cards focusable for keyboard nav
    var style = document.createElement("style");
    style.textContent = ".card:focus { outline: 2px solid var(--accent); outline-offset: 2px; }";
    document.head.appendChild(style);

    // ----- Boot -----
    renderStats();
    render();
    try { renderHeatmap(); } catch(e) {}
    // ===== Accordion sidebar =====
    document.querySelectorAll(".sidebar .group-header[data-group]").forEach(function (hdr) {
      hdr.addEventListener("click", function (e) {
        if (e.target.classList.contains("clear")) return;
        var group = hdr.parentElement;
        group.classList.toggle("open");
      });
    });

    // ===== Slash system =====
    var SLASH_KEY = "amc-mcq-slashed-v1";
    var slashMode = false;
    var slashedIds = new Set();
    var currentModalId = null;

    function loadSlashed() {
      try {
        var raw = localStorage.getItem(SLASH_KEY);
        if (!raw) { slashedIds = new Set(); return; }
        slashedIds = new Set(JSON.parse(raw));
      } catch(e) { slashedIds = new Set(); }
    }
    function saveSlashed() {
      try { localStorage.setItem(SLASH_KEY, JSON.stringify(Array.from(slashedIds))); } catch(e) {}
    }
    loadSlashed();
    function isSlashed(id) { return slashedIds.has(id); }
    function slashItem(id) {
      slashedIds.add(id);
      saveSlashed();
      var el = document.getElementById("card-" + id);
      if (el) {
        el.classList.add("slashed");
      } else {
        // If card not in DOM yet (first render after boot), just update progress + rebuild
      }
      updateProgress();
      recordDailyProgress(id);
      setTimeout(function() { render(); }, 350);
    }

    // ===== Daily progress tracking =====
    var PROGRESS_KEY = "amc-mcq-daily-progress-v1";
    function loadDailyProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
      catch(e) { return {}; }
    }
    var dailyProgress = loadDailyProgress();
    function saveDailyProgress() {
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(dailyProgress)); } catch(e) {}
    }
    function recordDailyProgress(id) {
      var it = byId[id];
      if (!it || !it.page) return;
      var today = new Date().toISOString().slice(0, 10);
      dailyProgress[today] = Math.max(dailyProgress[today] || 0, it.page);
      saveDailyProgress();
      renderHeatmap();
    }
    function renderHeatmap() {
      var host = document.getElementById("heatmap");
      if (!host) return;
      var now = new Date();
      var html = "";
      // Show last 5 weeks (35 days) + current partial week
      for (var w = 4; w >= 0; w--) {
        html += '<div class="hm-row">';
        for (var d = 6; d >= 0; d--) {
          var date = new Date(now);
          date.setDate(date.getDate() - (w * 7 + d));
          var key = date.toISOString().slice(0, 10);
          var page = dailyProgress[key] || 0;
          var cls = "hm-cell";
          if (page > 0) {
            if (page >= 1000) cls += " hm-l4";
            else if (page >= 500) cls += " hm-l3";
            else if (page >= 200) cls += " hm-l2";
            else cls += " hm-l1";
          }
          html += '<span class="' + cls + '" title="' + key + (page ? ' · \u5230 p.' + page : '') + '"></span>';
        }
        html += '</div>';
      }
      host.innerHTML = html;
    }
    function unslashAll() {
      slashedIds.clear();
      saveSlashed();
      document.querySelectorAll(".card.slashed").forEach(function(c) { c.classList.remove("slashed"); });
      updateProgress();
      render();
    }
    function filterInScope(it) {
      if (state.subcategory.size > 0 && !state.subcategory.has(it.subcategory)) return false;
      if (state.type.size > 0 && !state.type.has(it.type)) return false;
      if (state.difficulty.size > 0 && !state.difficulty.has(it.difficulty)) return false;
      if (state.approach.size > 0) {
        var hasAp = (it.approach || []).some(function(a) { return state.approach.has(a); });
        if (!hasAp) return false;
      }
      if (state.disease.size > 0) {
        var hasDz = (it.diseases || []).some(function(d) { return state.disease.has(d); });
        if (!hasDz) return false;
      }
      if (state.complaint.size > 0) {
        var hasCc = (it.complaints || []).some(function(c) { return state.complaint.has(c); });
        if (!hasCc) return false;
      }
      if (state.q) {
        var qq = state.q.toLowerCase();
        var haystack = (it.title + " " + (it.stem || "")).toLowerCase();
        if (haystack.indexOf(qq) < 0) return false;
      }
      return true;
    }
    function getSlashedInScope() {
      return items.filter(function(it) { return isSlashed(it.id) && filterInScope(it); });
    }
    function getVisibleForNav() {
      return items.filter(function(it) {
        if (!filterInScope(it)) return false;
        if (state.favorite.size > 0 && !isFav(it.id)) return false;
        if (slashMode && isSlashed(it.id)) return false;
        return true;
      });
    }

    function updateProgress() {
      if (!slashMode) return;
      var total = items.filter(function(it) { return filterInScope(it); }).length;
      var done = getSlashedInScope().length;
      var pct = total > 0 ? Math.round(done / total * 100) : 0;
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("progress-fill").classList.toggle("done", pct >= 100);
      document.getElementById("progress-label").textContent = done + "/" + total + " \u00b7 " + pct + "%";
    }

    // Slash toggle
    document.getElementById("slash-toggle").addEventListener("click", function() {
      slashMode = !slashMode;
      this.classList.toggle("on", slashMode);
      this.textContent = slashMode ? "\u2713 \u65a9\u9898" : "\u65a9\u9898";
      document.body.classList.toggle("slash-mode", slashMode);
      updateProgress();
      render();
      if (currentModalId && byId[currentModalId]) {
        openModal(currentModalId);
      }
    });

    // Reset button
    document.getElementById("progress-reset").addEventListener("click", function() {
      if (confirm("\u786e\u5b9a\u91cd\u7f6e\u5f53\u524d\u7b5b\u9009\u8303\u56f4\u5185\u7684\u6240\u6709\u65a9\u9898\u8fdb\u5ea6\uff1f")) {
        unslashAll();
      }
    });

    // Patch the original refreshChipCounts to also update progress
    var _origRefreshChipCounts = refreshChipCounts;
    refreshChipCounts = function() {
      _origRefreshChipCounts();
      if (slashMode) updateProgress();
    };

    // ===== Patch render: filter out slashed items when slashMode is on =====
    var _origApplyFilters = applyFilters;
    applyFilters = function() {
      var filtered = _origApplyFilters();
      if (slashMode) {
        filtered = filtered.filter(function(it) { return !isSlashed(it.id); });
      }
      return filtered;
    };

    // Patch render to trigger progress update
    var _origRender = render;
    render = function() {
      _origRender();
      if (slashMode) updateProgress();
    };

    // ===== Patch renderCard: mono QID, top stripe, slash button =====
    // ===== Patch renderCard: mono QID + slash button now built into original =====
    // No DOM patching needed — the original renderCard already creates all elements

    // ===== SELF-TEST MODAL =====
    var modalRevealed = false;

    // Replace openModal with self-test version
    var _origOpenModal = openModal;
    openModal = function(id) {
      currentModalId = id;
      modalRevealed = false;
      var it = byId[id];
      if (!it) return;

      var modalBack = document.getElementById("modal-back");
      var modalHead = document.getElementById("modal-head");
      var modalBody = document.getElementById("modal-body");
      var navBar = document.getElementById("modal-nav-bar");

      // HEAD
      var starIcon = isFav(it.id) ? "\u2605" : "\u2606";
      var favClass = isFav(it.id) ? " on" : "";
      var headHtml = '<button class="modal-star ' + favClass + '" id="modal-star-btn" title="\u6536\u85cf">' + starIcon + '</button>' +
        '<h1><span class="qid-mono" style="display:inline;margin-right:6px;">' + escapeHtml(it.id) + '</span>' + escapeHtml(it.title) + '</h1>' +
        '<div class="meta">' +
        '<span>' + escapeHtml(it.subcategory) + '</span>' +
        (it.difficulty ? '<span>\u96be\u5ea6 ' + it.difficulty + '/5</span>' : '') +
        '</div>';
      modalHead.style.setProperty("--color", it.color);
      modalHead.innerHTML = headHtml;

      // Star button
      var starBtn = modalHead.querySelector("#modal-star-btn");
      if (starBtn) {
        starBtn.addEventListener("click", function(e) {
          e.stopPropagation();
          toggleFav(it.id);
          var on = isFav(it.id);
          starBtn.textContent = on ? "\u2605" : "\u2606";
          starBtn.classList.toggle("on", on);
        });
      }

      // BODY — stem + clickable options + hidden explanation
      var bodyHtml = "";
      if (it.stem) {
        bodyHtml += '<div style="font-size:14px;color:var(--ink);margin-bottom:14px;line-height:1.65;">' + it.stem + '</div>';
      }
      if (it.type === "mcq" && it.options && it.options.length > 0) {
        bodyHtml += '<div class="options" id="modal-options">';
        it.options.forEach(function(o) {
          var isCorrect = o.letter === it.correctAnswer;
          bodyHtml += '<div class="opt" data-letter="' + escapeHtml(o.letter) + '" data-correct="' + isCorrect + '">' +
            '<span class="letter">' + escapeHtml(o.letter) + '.</span>' +
            '<span>' + escapeHtml(o.text) + '</span></div>';
        });
        bodyHtml += '</div>';
      }
      // For TR items, show body content directly
      if (it.type !== "mcq" && it.bodyHtml) {
        bodyHtml += '<section>' + it.bodyHtml + '</section>';
      }
      // Hidden explanation block (for MCQ self-test)
      bodyHtml += '<div class="explanation-block" id="modal-explanation">';
      bodyHtml += '<div id="modal-answer-bar" style="padding:10px 14px;border-radius:6px;margin:12px 0;display:none;font-size:13px;"></div>';
      if (it.rationale) bodyHtml += '<section><h2>\u89e3\u9898\u601d\u8def</h2>' + it.rationale + '</section>';
      if (it.traps) bodyHtml += '<section><h2>\u9677\u9631</h2>' + it.traps + '</section>';
      if (it.summary) bodyHtml += '<section><h2>\u77e5\u8bc6\u603b\u7ed3</h2>' + it.summary + '</section>';
      if (it.explanation) bodyHtml += '<section><h2>\u89e3\u6790</h2>' + it.explanation + '</section>';
      if (it.references) bodyHtml += '<section><h2>\u53c2\u8003\u6587\u732e</h2><div class="refs">' + it.references + '</div></section>';
      if ((it.related || []).length) {
        bodyHtml += '<section><h2>\u5173\u8054</h2><div class="related-list">';
        it.related.forEach(function(r) {
          bodyHtml += '<a href="#">' + escapeHtml(r) + '</a>';
        });
        bodyHtml += '</div></section>';
      }
      bodyHtml += '</div>';
      modalBody.innerHTML = bodyHtml;

      // Bind option clicks
      var opts = document.querySelectorAll("#modal-options .opt");
      opts.forEach(function(opt) {
        opt.addEventListener("click", function() {
          if (modalRevealed) return;
          modalRevealed = true;
          var isCorrect = opt.dataset.correct === "true";
          var answerLetter = (it.correctAnswer || "").toUpperCase();

          // Highlight all options
          opts.forEach(function(o) {
            o.classList.add("revealed");
            if (o.dataset.correct === "true") o.classList.add("correct");
            else if (o === opt && !isCorrect) o.classList.add("wrong");
          });

          // Answer bar
          var bar = document.getElementById("modal-answer-bar");
          bar.style.display = "block";
          if (isCorrect) {
            bar.style.background = "var(--correct-bg)";
            bar.innerHTML = '<strong style="color:var(--correct-ink);">\u2713 \u6b63\u786e\uff01</strong> \u7b54\u6848\uff1a' + answerLetter;
          } else {
            bar.style.background = "#fde8e8";
            bar.innerHTML = '<strong style="color:#c53030;">\u2717 \u9519\u8bef</strong> \u6b63\u786e\u7b54\u6848\uff1a' + answerLetter;
          }

          // Reveal explanation
          var exp = document.getElementById("modal-explanation");
          if (exp) exp.classList.add("revealed");

          // Enable slash button
          document.getElementById("nav-slash").disabled = false;
        });
      });

      // Nav bar state — for items without options (TR), slash is available immediately
      var visible = getVisibleForNav().map(function(x) { return x.id; });
      var idx = visible.indexOf(id);
      var hasNoOptions = !it.options || it.options.length === 0;
      document.getElementById("nav-prev").disabled = idx <= 0;
      document.getElementById("nav-next").disabled = idx < 0 || idx >= visible.length - 1;
      if (hasNoOptions) {
        modalRevealed = true;
        document.getElementById("nav-slash").disabled = false;
      } else {
        document.getElementById("nav-slash").disabled = true;
      }
      navBar.style.display = "flex";
      // Hide slash button when slash mode is off
      document.getElementById("nav-slash").style.display = slashMode ? "" : "none";

      modalBack.classList.add("open");
      document.body.style.overflow = "hidden";
    };

    function navigateModal(direction) {
      var visible = getVisibleForNav().map(function(x) { return x.id; });
      var idx = visible.indexOf(currentModalId);
      if (idx < 0) return;
      var nextIdx = idx + direction;
      if (nextIdx >= 0 && nextIdx < visible.length) {
        openModal(visible[nextIdx]);
      }
    }

    // Nav button handlers
    document.getElementById("nav-prev").addEventListener("click", function(e) { e.stopPropagation(); navigateModal(-1); });
    document.getElementById("nav-next").addEventListener("click", function(e) { e.stopPropagation(); navigateModal(1); });
    document.getElementById("nav-slash").addEventListener("click", function(e) {
      e.stopPropagation();
      if (!modalRevealed) return;
      slashItem(currentModalId);
      var visible = getVisibleForNav().map(function(x) { return x.id; });
      var idx = visible.indexOf(currentModalId);
      if (idx >= 0 && idx < visible.length) {
        openModal(visible[idx]);
      } else if (visible.length > 0) {
        openModal(visible[0]);
      } else {
        closeModal();
      }
    });

    // Keyboard navigation for modal
    document.addEventListener("keydown", function(e) {
      if (!document.getElementById("modal-back").classList.contains("open")) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); navigateModal(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); navigateModal(1); }
      if (e.key === "Escape") { e.preventDefault(); closeModal(); }
    });

    // Patch closeModal to reset state
    var _origCloseModal = closeModal;
    closeModal = function() {
      _origCloseModal();
      currentModalId = null;
      modalRevealed = false;
    };

    // ===== Patch card click to not reveal answer prematurely =====
    // Card click already uses openModal which we replaced above — this is fine.

    // ===== Sync slash button visibility on render =====
    // Slash button is added by renderCard, visibility controlled by .slash-mode CSS
    document.body.classList.toggle("slash-mode", slashMode);

  })();
</script>
