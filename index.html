r has brought her four-year-old son with complaint of nighttime bed wetting. according to her, he wets his bed 3-4 time a week at night despite achievement of daytime continence at the age of two years. he is otherwise asymptomatic. physical examination is unremarkable. which one of the following is the most appropriate management regarding this complaint? \n 根据 iccs 定义，遗尿症指 ≥5 岁儿童睡眠期间发生尿失禁。此患儿仅 4 岁，不满足遗尿症诊断标准，极有可能在 5 岁前自行解决。约 84% 儿童在 5 岁时实现完全夜间膀胱控制。 \n 遗尿报警器适用于年龄 ≥5 岁、液体摄入/如厕/奖励系统指导无效的患儿。去氨加压素是 ≥5 岁患儿的一线药物治疗（报警器替代选择）。阿米替林（三环类抗抑郁药）为三线治疗。超声检查仅在有临床指征（非单症状性或日间症状）时考虑。此 4 岁患儿目前无需任何检查或治疗。 "}, {"id": "AMC-Q1427", "type": "mcq", "qid": 1427, "title": "女童血性分泌物 — 阴道异物", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["女童血性分泌物 — 阴道异物（无瘙痒排除感染）"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1427-Vaginal-Foreign-Body.md", "stem": "<p>Concerned mother of a 6-year-old girl has brought her to your attention because she has frequently noticed blood-stained yellow discharge on her panties. She is otherwise healthy. There is no complaint of itching or urinary symptoms. The girl lives with her mother and birth father. On examination, the vitals are within normal ranges. On inspection, there is mild erythema of the vulva and perianal area and offensive blood-stained yellow discharge in the introitus. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Monilial vulvovaginitis."}, {"letter": "B", "text": "Vaginal foreign body."}, {"letter": "C", "text": "Atrophic vulvovaginitis."}, {"letter": "D", "text": "Sexual abuse."}, {"letter": "E", "text": "Threadworm infestation."}], "rationale": "<p>1. 题型识别：诊断 — 青春期前女童阴道分泌物的病因鉴别 2. 关键线索：血性黄色分泌物、恶臭、外阴轻度红斑、<strong>无瘙痒</strong>、无泌尿症状、与亲生父母同住 3. 鉴别排除：</p>\n<ul>\n<li>念珠菌外阴阴道炎（A）：<strong>瘙痒是突出症状</strong> → 缺失排除</li>\n<li>萎缩性外阴阴道炎（C）：青春期前雌激素低，但以稀薄分泌物为主，非血性 → 排除</li>\n<li>性虐待（D）：需有社会线索（非亲生父/行为改变/其他损伤）→ 本题信息不支持</li>\n<li>蛲虫（E）：<strong>瘙痒为主</strong>，搔抓可致出血，但无瘙痒 → 几乎可排除</li>\n<p>4. 锁定答案：血性恶臭分泌物 + 无瘙痒 → 阴道异物（B）</p>\n</ul>", "traps": "<ul>\n<li><strong>瘙痒缺失是关键</strong>：念珠菌和蛲虫都以瘙痒为核心症状；题中明确 \"no itching\" → 两者均可排除</li>\n<li><strong>性虐待过度警觉</strong>：与亲生父母同住、无行为改变、无其他损伤 → 不优先考虑性虐待</li>\n<li><strong>\"blood-stained\" 不等于 trauma/abuse</strong>：阴道异物是青春期前女童血性分泌物最常见原因之一</li>\n</ul>", "summary": "<p>青春期前女童阴道分泌物鉴别：</p>\n<ul>\n<li><strong>阴道异物</strong>：血性、恶臭、无瘙痒</li>\n<li><strong>念珠菌性外阴阴道炎</strong>：瘙痒突出、白色凝乳状分泌物</li>\n<li><strong>蛲虫感染</strong>：夜间肛周/外阴瘙痒为主、搔抓可致出血</li>\n<li><strong>萎缩性外阴阴道炎</strong>：青春期前生理性低雌激素、稀薄非血性分泌物</li>\n<li><strong>性虐待</strong>：需社会/行为线索、损伤证据</li>\n</ul>", "explanation": "<p>血性恶臭黄色分泌物 + 无瘙痒 → 阴道异物最可能。</p>\n<p>念珠菌外阴阴道炎以瘙痒为最突出症状。萎缩性外阴阴道炎为青春期前生理性低雌激素所致，分泌物稀薄非血性。性虐待需有社会/行为线索（非亲生父、行为改变、其他损伤），本患儿与亲生父母同住，无其他线索。蛲虫感染可致外阴阴道炎，瘙痒最突出，搔抓可致出血，但无瘙痒几乎可排除。</p>", "references": "<ul>\n<li>RCH – Prepubescent gynaecology</li>\n<li>Government of Western Australia - Child and Adolescent Health Service – Vulvovaginitis</li>\n<li>Australian Prescriber – Vulval disease in childhood</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "女童血性分泌物 — 阴道异物\n女童血性分泌物 — 阴道异物（无瘙痒排除感染）\n concerned mother of a 6-year-old girl has brought her to your attention because she has frequently noticed blood-stained yellow discharge on her panties. she is otherwise healthy. there is no complaint of itching or urinary symptoms. the girl lives with her mother and birth father. on examination, the vitals are within normal ranges. on inspection, there is mild erythema of the vulva and perianal area and offensive blood-stained yellow discharge in the introitus. which one of the following could be the most likely diagnosis? \n 血性恶臭黄色分泌物 + 无瘙痒 → 阴道异物最可能。 \n 念珠菌外阴阴道炎以瘙痒为最突出症状。萎缩性外阴阴道炎为青春期前生理性低雌激素所致，分泌物稀薄非血性。性虐待需有社会/行为线索（非亲生父、行为改变、其他损伤），本患儿与亲生父母同住，无其他线索。蛲虫感染可致外阴阴道炎，瘙痒最突出，搔抓可致出血，但无瘙痒几乎可排除。 "}, {"id": "AMC-Q1580", "type": "mcq", "qid": 1580, "title": "身高体重等比增高 — 筛查血糖", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["身高体重等比增高 → 筛查血糖（糖尿病）"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1580-Tall-Stature-Blood-Sugar.md", "stem": "<p>Tom, 10 years old, is brought to your clinic by his mother who is concerned about his height and weight. She says Tom has always been the biggest boy in his classes since he started school. On examination, his weight and height are on 96 and 97 percentile, respectively. Which one of the following would be the most important initial evaluation to consider?</p>", "options": [{"letter": "A", "text": "TSH."}, {"letter": "B", "text": "Urine cortisol level."}, {"letter": "C", "text": "Bone age."}, {"letter": "D", "text": "Blood sugar."}, {"letter": "E", "text": "MRI of the head."}], "rationale": "<p>1. 题型识别：检查选择 — 等比高大儿童的病因筛查 2. 关键线索：</p>\n<ul>\n<li>体重 96 百分位 + <strong>身高 97 百分位</strong> → 等比增高（不是超重/肥胖！）</li>\n<li>\"always been the biggest boy\" → 长期趋势，非近期突变</li>\n<p>3. 核心区分：</p>\n<li><strong>体重 >> 身高</strong> = 超重/肥胖 → 查 TSH（排除甲减）</li>\n<li><strong>身高 ≈ 体重</strong>（等比增高）→ 考虑内分泌/代谢原因 → <strong>首选血糖</strong>（筛查糖尿病）</li>\n<p>4. 排除：</p>\n<li>TSH（A）：适用于超重（体重>>身高），此患儿等比</li>\n<li>尿皮质醇（B）：Cushing 综合征（满月脸、向心性肥胖）时才考虑</li>\n<li>骨龄（C）：常用于矮身材评估</li>\n<li>头 MRI（E）：无颅内病变线索</li>\n<p>5. 锁定答案：血糖 → D</p>\n</ul>", "traps": "<ul>\n<li><strong>\"96%ile = 超重 → 查 TSH\"陷阱</strong>：身高也在 97 百分位 → 是等比增高，不是超重！需区分超重（体重>>身高）和等比增长</li>\n<li><strong>骨龄混淆</strong>：骨龄用于矮身材评估，不用于高大身材的初始筛查</li>\n<li><strong>垂体/内分泌过度联想</strong>：垂体性巨人症罕见，糖尿病是更常见的高大身材可治性病因</li>\n</ul>", "summary": "<p>儿童生长评估核心原则：</p>\n<ul>\n<li><strong>体重 >> 身高</strong> = 超重/肥胖 → TSH（排除甲减）</li>\n<li><strong>身高 ≈ 体重等比增高</strong> → 血糖（筛查糖尿病）</li>\n<li>骨龄 = 矮身材评估工具</li>\n<li>尿皮质醇 = Cushing 综合征评估</li>\n<li>头 MRI = 垂体病变评估</li>\n</ul>", "explanation": "<p>该男孩体重 96 百分位、身高 97 百分位，为等比增长。这与之前超重患儿不同（Q1397：体重 90 百分位、身高 50 百分位 = 超重 → TSH）。</p>\n<p>对于等比高大儿童，糖尿病是需要排除的重要可治性病因。血糖是最重要的初始评估。</p>\n<p>TSH 适用于超重（体重>>身高）而非等比高大儿童。尿皮质醇仅在 Cushing 综合征特征（满月脸、向心性肥胖等）时考虑。骨龄用于矮身材评估。头 MRI 无临床指征。</p>", "references": "<ul>\n<li>RACGP - Adolescent overweight and obesity</li>\n</ul>", "related": ["AMC-Q1397-Overweight-Child-TSH", "AMC-Q1312-Childhood-BMI-Obesity", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "身高体重等比增高 — 筛查血糖\n身高体重等比增高 → 筛查血糖（糖尿病）\n tom, 10 years old, is brought to your clinic by his mother who is concerned about his height and weight. she says tom has always been the biggest boy in his classes since he started school. on examination, his weight and height are on 96 and 97 percentile, respectively. which one of the following would be the most important initial evaluation to consider? \n 该男孩体重 96 百分位、身高 97 百分位，为等比增长。这与之前超重患儿不同（q1397：体重 90 百分位、身高 50 百分位 = 超重 → tsh）。 \n 对于等比高大儿童，糖尿病是需要排除的重要可治性病因。血糖是最重要的初始评估。 \n tsh 适用于超重（体重>>身高）而非等比高大儿童。尿皮质醇仅在 cushing 综合征特征（满月脸、向心性肥胖等）时考虑。骨龄用于矮身材评估。头 mri 无临床指征。 "}, {"id": "AMC-Q1029", "type": "mcq", "qid": 1029, "title": "AMC-Q1029 — Marfan syndrome in a 9-year-old boy", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Genetics", "approach": [], "topic": ["Marfan 综合征 — 心脏评估"], "difficulty": 3, "correctAnswer": "C", "page": 1334, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Genetics/AMC-Q1029-Marfan-Echo.md", "stem": "<p>A 9-year-old boy is brought to your attention by his parents because of poor exercise tolerance. He is a member of the school basketball team but recently, it has been hard for him to play because he becomes short of breath and tired soon after he starts playing. On examination, his height is at 97 percentile and weight at 3 percentile. Which one of the following is the most important step in management?</p>", "options": [{"letter": "A", "text": "Karyotyping"}, {"letter": "B", "text": "Bone scan"}, {"letter": "C", "text": "Cardiac ultrasound"}, {"letter": "D", "text": "Growth hormone test"}, {"letter": "E", "text": "CT scan"}], "rationale": "<ul>\n<li>临床线索：<strong>高瘦</strong>（97 百分位身高、3 百分位体重）+ <strong>运动不耐受</strong> → 高度提示 Marfan 综合征（MFS）</li>\n<li>MFS = 常染色体显性结缔组织病，<strong>FBN1 突变</strong>（90-93%），少数 TGFBR2（MFS2）</li>\n<li>三大系统：心血管、骨骼、视觉</li>\n<li><strong>心脏疾病是 MFS 致死的首位原因</strong></li>\n<li>临床怀疑 → 立即行<strong>超声心动图</strong>评估：</li>\n<li>主动脉根部扩张（最重要）</li>\n<li>二尖瓣脱垂</li>\n<li>各选项分析：</li>\n<li>A（核型分析）：用于 Turner/Klinefelter 等染色体病</li>\n<li>B（骨扫描）：骨折/转移灶</li>\n<li>D（生长激素）：用于矮小症</li>\n<li>E（CT 扫描）：超声已可诊断，无需 CT</li>\n</ul>", "traps": "<ul>\n<li>选 A（核型分析）— Marfan 是单基因病，<strong>不是染色体数目异常</strong></li>\n<li>选 D（生长激素）— 患儿是<strong>过高</strong>而非过矮，方向反了</li>\n</ul>", "summary": "<p><strong>Marfan syndrome 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>遗传</td><td>AD，<strong>FBN1</strong>（原纤维蛋白-1）</td></tr>\n<tr><td>表现</td><td>主动脉瘤/夹层、晶状体脱位、长骨过度生长</td></tr>\n<tr><td><strong>首要死因</strong></td><td><strong>心血管</strong>（主动脉瘤/夹层）</td></tr>\n<tr><td>首选检查</td><td><strong>超声心动图</strong>（评估主动脉根部）</td></tr>\n<tr><td>治疗</td><td>β 受体阻滞剂（首选，即使儿童）</td></tr>\n</tbody>\n</table>\n<p><strong>所有 MFS 患者需定期超声随访</strong>。</p>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Marfan 综合征（MFS）应在高瘦儿童的鉴别诊断中始终考虑</strong>。</p>\n<p>MFS 是一种常染色体显性结缔组织病，累及心血管、骨骼和视觉系统，以及皮肤、肺和硬脑膜。患病率至少为 1/5000。<strong>90-93% 的 MFS 由 FBN1 基因突变引起</strong>。少数由第二个基因 TGFBR2 突变引起，称为 MFS2。根据目前的统计，MFS2 占 MFS 病例的 10%。</p>\n<p>主要表现包括主动脉瘤和夹层、晶状体脱位和长骨过度生长。<strong>心脏病是 MFS 患者发病和死亡的首要原因</strong>。</p>\n<p>当基于临床怀疑 MFS 时，应进行<strong>超声心动图</strong>作为最合适的下一步管理，以评估主动脉根部扩张（最重要的）和二尖瓣脱垂——这些是 MFS 患者常见的状况。前者更常见且临床意义更大。</p>\n<p>所有确诊的个体都应进行系列超声心动图监测。频率应由心脏病专家根据个体情况调整。根据目前的证据，<strong>β 受体阻滞剂仍是主动脉扩张的一线治疗</strong>（除非有禁忌证，如哮喘患者），即使在儿童中也如此。</p>", "references": "<ul>\n<li>The Cardiac Society of Australia and New Zealand - Guidelines for the diagnosis and management of Marfan Syndrome</li>\n<li>UpToDate - Genetics, clinical features, and diagnosis of Marfan syndrome and related disorders</li>\n</ul>", "related": ["AMC-Q1030-Marfan-Murmur-AR"], "bodyHtml": "", "diseases": ["Marfan Syndrome"], "complaints": [], "search": "amc-q1029 — marfan syndrome in a 9-year-old boy\nmarfan 综合征 — 心脏评估\n a 9-year-old boy is brought to your attention by his parents because of poor exercise tolerance. he is a member of the school basketball team but recently, it has been hard for him to play because he becomes short of breath and tired soon after he starts playing. on examination, his height is at 97 percentile and weight at 3 percentile. which one of the following is the most important step in management? \n correct answer is  c  \n  marfan 综合征（mfs）应在高瘦儿童的鉴别诊断中始终考虑 。 \n mfs 是一种常染色体显性结缔组织病，累及心血管、骨骼和视觉系统，以及皮肤、肺和硬脑膜。患病率至少为 1/5000。 90-93% 的 mfs 由 fbn1 基因突变引起 。少数由第二个基因 tgfbr2 突变引起，称为 mfs2。根据目前的统计，mfs2 占 mfs 病例的 10%。 \n 主要表现包括主动脉瘤和夹层、晶状体脱位和长骨过度生长。 心脏病是 mfs 患者发病和死亡的首要原因 。 \n 当基于临床怀疑 mfs 时，应进行 超声心动图 作为最合适的下一步管理，以评估主动脉根部扩张（最重要的）和二尖瓣脱垂——这些是 mfs 患者常见的状况。前者更常见且临床意义更大。 \n 所有确诊的个体都应进行系列超声心动图监测。频率应由心脏病专家根据个体情况调整。根据目前的证据， β 受体阻滞剂仍是主动脉扩张的一线治疗 （除非有禁忌证，如哮喘患者），即使在儿童中也如此。 "}, {"id": "AMC-Q1030", "type": "mcq", "qid": 1030, "title": "AMC-Q1030 — Marfan syndrome cardiac murmur", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Genetics", "approach": [], "topic": ["Marfan 综合征 — 主动脉瓣返流杂音"], "difficulty": 3, "correctAnswer": "B", "page": 1335, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Genetics/AMC-Q1030-Marfan-Murmur-AR.md", "stem": "<p>A 14-year-old boy has clinically apparent Marfan syndrome. Which of the following cardiac murmurs would you expect to hear on cardiac auscultation?</p>", "options": [{"letter": "A", "text": "Midsystolic ejection murmur at the second right intercostal space"}, {"letter": "B", "text": "Decrescendo high-pitched diastolic murmur at the left sternal edge"}, {"letter": "C", "text": "Low-pitched rumbling diastolic murmur at the apex"}, {"letter": "D", "text": "Pansystolic murmur at the left sternal edge with no radiation"}, {"letter": "E", "text": "Continuous machinery murmur at the second left intercostal space"}], "rationale": "<ul>\n<li>MFS 最常见心脏表现：<strong>主动脉根部病变</strong> → 主动脉瘤样扩张 → <strong>主动脉瓣返流（AR）</strong></li>\n<li>AR 杂音特点：</li>\n<li><strong>舒张期</strong></li>\n<li><strong>渐弱型</strong>（decrescendo）</li>\n<li><strong>高频</strong></li>\n<li><strong>胸骨左缘最响</strong></li>\n<li>持续时间反映 AR 严重程度</li>\n<li>各选项杂音鉴别：</li>\n<li>A（第二肋间右缘收缩期喷射性）= 主动脉狭窄 / HOCM</li>\n<li>C（心尖部低调舒张期隆隆样）= 严重 AR 的 <strong>Austin-Flint 杂音</strong>（次要可能）</li>\n<li>D（胸骨左缘全收缩期无放射）= <strong>VSD</strong></li>\n<li>E（第二肋间左缘连续机器样）= <strong>PDA</strong></li>\n</ul>", "traps": "<ul>\n<li>选 A（AS/HOCM 杂音）— MFS 的核心问题不是流出道梗阻，而是<strong>返流</strong></li>\n<li>选 E（PDA）— PDA 与 MFS 无关</li>\n</ul>", "summary": "<p><strong>MFS 心脏表现谱</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>病变</th><th>杂音</th></tr></thead>\n<tbody>\n<tr><td><strong>主动脉根部扩张 + AR</strong>（最常见）</td><td>舒张期渐弱型高频杂音，胸骨左缘</td></tr>\n<tr><td>二尖瓣脱垂（MVP）</td><td>中-晚收缩期喀喇音 ± 收缩晚期杂音</td></tr>\n<tr><td>严重 AR 引起 Austin-Flint</td><td>心尖部舒张中期隆隆样杂音</td></tr>\n<tr><td>流量性收缩期杂音</td><td>因每搏量增加</td></tr>\n</tbody>\n</table>\n<p><strong>杂音 = 心血管结构改变的听诊线索</strong>；MFS 听到 AR 杂音 → 主动脉根部已扩张。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>主动脉根部病变是 Marfan 综合征（MFS）最常见的心脏表现</strong>。这导致动脉瘤样扩张、主动脉瓣返流（AR）和主动脉夹层。这些情况是 MFS 患者死亡和发病最常见的原因。</p>\n<p><strong>主动脉扩张见于约 50% 的 MFS 儿童和 60-80% 的 MFS 成人</strong>。AR 常存在。心脏检查时，最可能听到慢性 AR 引起的杂音。</p>\n<p><strong>AR 的杂音是舒张期渐弱型杂音，通常为高频音，在胸骨左缘最响</strong>。杂音的持续时间与 AR 的严重程度相关；杂音响度则不相关。</p>\n<p>MFS 合并 AR 的其他可能杂音包括：</p>\n<ul>\n<li><strong>Austin-Flint 杂音</strong>：在舒张期，血流通过关闭不全的主动脉瓣返流，冲击二尖瓣前叶，导致该瓣膜过早关闭。这在心尖部产生舒张中期隆隆样杂音。Austin-Flint 杂音见于严重 AR 的患者。</li>\n<li>由于每搏量增加，也可能存在功能性收缩期流量性杂音。</li>\n</ul>\n<p><strong>注</strong>——MFS 患者也可能有二尖瓣脱垂。二尖瓣脱垂的经典听诊发现是中-晚收缩期喀喇音，由于瓣叶脱垂入左心房导致二尖瓣装置紧张所致。该喀喇音可能伴有或不伴有心尖部的高调中-晚期收缩期杂音。</p>\n<ul>\n<li>（选项 A）第二右肋间的收缩中期喷射性杂音是主动脉狭窄和肥厚性梗阻性心肌病（HOCM）的特征。</li>\n<li>（选项 C）心尖部的低调隆隆样舒张中期杂音（Austin-Flint 杂音）也可见于 MFS 合并严重 AR 的患者。然而，这是较不常见的发现。</li>\n<li>（选项 D）胸骨左缘全收缩期杂音无放射是室间隔缺损（VSD）的特征。</li>\n<li>（选项 E）第二左肋间连续机器样杂音是动脉导管未闭（PDA）的特征。</li>\n</ul>", "references": "<ul>\n<li>The Cardiac Society of Australia and New Zealand - Guidelines for the diagnosis and management of Marfan Syndrome</li>\n<li>UpToDate - Genetics, clinical features, and diagnosis of Marfan syndrome and related disorders</li>\n<li>Medscape - Aortic Regurgitation</li>\n</ul>", "related": ["AMC-Q1029-Marfan-Echo"], "bodyHtml": "", "diseases": ["Marfan Syndrome"], "complaints": [], "search": "amc-q1030 — marfan syndrome cardiac murmur\nmarfan 综合征 — 主动脉瓣返流杂音\n a 14-year-old boy has clinically apparent marfan syndrome. which of the following cardiac murmurs would you expect to hear on cardiac auscultation? \n correct answer is  b  \n  主动脉根部病变是 marfan 综合征（mfs）最常见的心脏表现 。这导致动脉瘤样扩张、主动脉瓣返流（ar）和主动脉夹层。这些情况是 mfs 患者死亡和发病最常见的原因。 \n  主动脉扩张见于约 50% 的 mfs 儿童和 60-80% 的 mfs 成人 。ar 常存在。心脏检查时，最可能听到慢性 ar 引起的杂音。 \n  ar 的杂音是舒张期渐弱型杂音，通常为高频音，在胸骨左缘最响 。杂音的持续时间与 ar 的严重程度相关；杂音响度则不相关。 \n mfs 合并 ar 的其他可能杂音包括： \n \n  austin-flint 杂音 ：在舒张期，血流通过关闭不全的主动脉瓣返流，冲击二尖瓣前叶，导致该瓣膜过早关闭。这在心尖部产生舒张中期隆隆样杂音。austin-flint 杂音见于严重 ar 的患者。 \n 由于每搏量增加，也可能存在功能性收缩期流量性杂音。 \n \n  注 ——mfs 患者也可能有二尖瓣脱垂。二尖瓣脱垂的经典听诊发现是中-晚收缩期喀喇音，由于瓣叶脱垂入左心房导致二尖瓣装置紧张所致。该喀喇音可能伴有或不伴有心尖部的高调中-晚期收缩期杂音。 \n \n （选项 a）第二右肋间的收缩中期喷射性杂音是主动脉狭窄和肥厚性梗阻性心肌病（hocm）的特征。 \n （选项 c）心尖部的低调隆隆样舒张中期杂音（austin-flint 杂音）也可见于 mfs 合并严重 ar 的患者。然而，这是较不常见的发现。 \n （选项 d）胸骨左缘全收缩期杂音无放射是室间隔缺损（vsd）的特征。 \n （选项 e）第二左肋间连续机器样杂音是动脉导管未闭（pda）的特征。 \n "}, {"id": "AMC-Q0906", "type": "mcq", "qid": 906, "title": "儿童 ITP — 血小板 >20k、仅瘀点瘀斑、一般情况好 → 观察等待", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Haematology", "approach": ["treatment", "diagnosis"], "topic": ["Immune Thrombocytopenic Purpura", "Child", "Watchful Waiting", "Platelet >20k"], "difficulty": 3, "correctAnswer": "A", "page": 1318, "tags": ["mcq", "amc", "paediatrics", "haematology", "itp", "immune-thrombocytopenic-purpura", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Haematology/AMC-Q0906-ITP-Watchful-Waiting.md", "stem": "<p>A 5-year-old boy with generalized petechial rash and bruises. URTI 3 weeks ago. Otherwise healthy. Platelets 74,000/mm3, RBC/WBC normal. Most appropriate management?</p>", "options": [{"letter": "A", "text": "Strict bed rest."}, {"letter": "B", "text": "Intravenous immunoglobulin (IVIG)."}, {"letter": "C", "text": "Steroids."}, {"letter": "D", "text": "Antibiotics."}, {"letter": "E", "text": "Plasma exchange."}], "rationale": "<p>1. <strong>题型识别</strong>：儿童 URTI 后孤立血小板减少 + 瘀点瘀斑 → ITP。问\"处理\"。 2. <strong>ITP 本质</strong>：儿童 ITP 良性、病因不明；急性 ~90%，慢性 ~10%（>6 月，部分作者用 12 月）。 3. <strong>诊断</strong>：血小板减少 + 无其他异常（无苍白、LAD、肝脾大）；排除白血病等其他原因。 4. <strong>管理两派</strong>：观察等待 vs 药物，均未被证明更优。 5. <strong>观察等待指征</strong>（本例符合）：</p>\n<ul>\n<li>血小板 >20×10⁹/L，部分 <20k 也可门诊</li>\n<li>诊断明确，无苍白/肝脾大/LAD，仅孤立血小板减少</li>\n<li>无活动出血（仅瘀点瘀斑），无黏膜/胃肠/肾出血</li>\n<li>一般情况好，家庭监护可靠，数日内随访</li>\n<p>6. <strong>排除药物</strong>：</p>\n<li>B IVIG：仅危及生命出血时用。</li>\n<li>C 激素：若用药，口服激素一线；但本例 plt >20k、无出血，不需。</li>\n<li>D 抗生素：无作用。</li>\n<li>E 血浆置换：不用于 ITP。</li>\n<p>7. <strong>锁定 A</strong>（bed rest = 保护 + 观察；核心是观察等待）。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"见血小板减少就上激素/IVIG\"陷阱</strong>：错。儿童 ITP 多自限，>20k 且无出血 → 观察。</li>\n<li><strong>\"IVIG 一线\"陷阱</strong>：错。仅严重危及生命出血。</li>\n<li><strong>\"抗生素\"陷阱</strong>：错。ITP 非感染。</li>\n<li><strong>忽视白血病排除</strong>：诊断需排除白血病（有苍白/肝脾大/LAD 则警惕）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Isolated thrombocytopenia after URTI in otherwise healthy child → immune (idiopathic) thrombocytopenic purpura (ITP), benign. Acute ~90%, chronic ~10% (>6 months). Diagnosis by exclusion (no pallor, LAD, hepatosplenomegaly; exclude leukemia).</p>\n<p>Management controversial: watchful waiting vs pharmacologic; neither proven superior. Most with platelets >20×10⁹/L (some <20k) can be managed outpatient with no specific treatment if: certain diagnosis, no pallor/hepatosplenomegaly/LAD, isolated thrombocytopenia, no active bleeding beyond bruising/petechiae, otherwise well, safe home, follow-up in days.</p>\n<p>(B) IVIG reserved for life-threatening hemorrhage. (C) This child plt >20k, no hemorrhage, otherwise well → no pharmacologic treatment; if planned, oral steroids first-line. (D) Antibiotics no role. (E) Plasma exchange not an option.</p>", "references": "<ul>\n<li>RCH - Immune thrombocytopenic purpura</li>\n<li>UpToDate - Immune thrombocytopenia (ITP) in children: Management of chronic disease</li>\n<li>Medscape - Immune Thrombocytopenia (ITP)</li>\n</ul>", "related": ["AMC-Q1325-HSP-Nephritis", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["ITP"], "complaints": [], "search": "儿童 itp — 血小板 >20k、仅瘀点瘀斑、一般情况好 → 观察等待\nimmune thrombocytopenic purpura child watchful waiting platelet >20k\ntreatment diagnosis\n a 5-year-old boy with generalized petechial rash and bruises. urti 3 weeks ago. otherwise healthy. platelets 74,000/mm3, rbc/wbc normal. most appropriate management? \n correct answer is  a  \n isolated thrombocytopenia after urti in otherwise healthy child → immune (idiopathic) thrombocytopenic purpura (itp), benign. acute ~90%, chronic ~10% (>6 months). diagnosis by exclusion (no pallor, lad, hepatosplenomegaly; exclude leukemia). \n management controversial: watchful waiting vs pharmacologic; neither proven superior. most with platelets >20×10⁹/l (some  \n (b) ivig reserved for life-threatening hemorrhage. (c) this child plt >20k, no hemorrhage, otherwise well → no pharmacologic treatment; if planned, oral steroids first-line. (d) antibiotics no role. (e) plasma exchange not an option. "}, {"id": "AMC-Q0761", "type": "mcq", "qid": 761, "title": "Pertussis — 传染期已过（>21 天咳嗽）→ 不需停学", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Pertussis", "School Exclusion", "Infectious Period", "NHMRC Guidelines"], "difficulty": 3, "correctAnswer": "A", "page": 1301, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "whooping-cough", "school-exclusion", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0761-Pertussis-School-Exclusion.md", "stem": "<p>A 7-year-old boy is brought to your clinic with a 2-week history of paroxysms of cough and vomiting at the end of coughing episodes during school holidays. Cough is dry and is worse at night. His mother is worried whether he should go to school, which is going to start in 2 days. Which one of the following would be the most appropriate approach regarding this situation?</p>", "options": [{"letter": "A", "text": "No exclusion is required."}, {"letter": "B", "text": "Exclude from school."}, {"letter": "C", "text": "Exclude from the school and start antibiotics."}, {"letter": "D", "text": "The child can go to school after antibiotics are started."}, {"letter": "E", "text": "The decision depends on the child's immunization status."}], "rationale": "<p>1. <strong>题型识别</strong>：已确诊 pertussis（阵咳 + 咳末呕吐 + 夜重）→ 问\"停学 / 隔离决策\"。 2. <strong>Pertussis 三期</strong>：</p>\n<ul>\n<li>Catarrhal（卡他）1 周</li>\n<li>Paroxysmal（阵发）咳嗽成串</li>\n<li>Convalescence（恢复）</li>\n<p>3. <strong>传染期</strong>：自咳嗽起 <strong>21 天</strong>，或阵咳起 <strong>14 天</strong>（若日期明确）。本例阵咳已 2 周 → 处于传染期末尾。 4. <strong>停学规则（index case）</strong>：</p>\n<li>开始恰当抗生素后 <strong>5 天</strong>，或</li>\n<li>任一阵咳起 <strong>21 天</strong>，或</li>\n<li>阵咳起 <strong>14 天</strong>（若日期明确）</li>\n<li>本例开学在阵咳起 14 天后 → 已不传染 → <strong>无需停学</strong>。</li>\n<p>5. <strong>抗生素的局限</strong>：仅在 catarrhal / 早 paroxysmal 期（<14 天咳嗽）用才能缩短停学期；本例已 >14 天，抗生素不能改变停学判定。 6. <strong>疫苗状态的作用</strong>：只决定<strong>密切接触者（contacts）</strong>是否停学，<strong>不</strong>决定 index case。 7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有咳嗽 = 要停学\"陷阱</strong>：错。是否停学看<strong>传染期</strong>（21 天），不是\"还在咳\"。</li>\n<li><strong>\"抗生素能立刻复课\"陷阱</strong>：错。抗生素仅在前 14 天内用才缩短停学期。</li>\n<li><strong>\"看疫苗状态决定 index case\"陷阱</strong>：错。疫苗状态只用于 contacts 判定。</li>\n<li><strong>把 paroxysmal 期当成 still infectious</strong>：本例已到 21 天边界 → 不传染。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>临床符合 <strong>whooping cough (pertussis)，Bordetella pertussis</strong> 所致。潜伏期 7–14 天（可达 20 天），三期：Catarrhal → Paroxysmal → Convalescence。</p>\n<p>抗生素指征：catarrhal / 早 paroxysmal 期（可能减轻严重度）；咳嗽 <14 天（减轻传播、缩短停学期）；住院；并发症（肺炎、发绀、呼吸暂停）。</p>\n<p>Index case 停学：开始恰当抗生素后 5 天，或任一阵咳起 21 天，或阵咳起 14 天（若日期明确）。本例开学在阵咳起 14 天后 → 不传染 → 不需停学。</p>\n<p>若在前 14 天内就诊，抗生素可缩短停学期。阵咳已 14 天（catarrhal 期算 21 天）→ 已处传染期末尾。</p>\n<p>疫苗状态指导 <strong>密切接触者</strong>的停学，而非 index case。</p>", "references": "<ul>\n<li>RCH - Whooping cough (pertussis)</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n<li>RACGP - Pertussis Presentation, investigation and management</li>\n</ul>", "related": ["AMC-Q0762-Pertussis-Infant-Admission", "AMC-Q0763-Pertussis-Prophylaxis", "AMC-Q0764-Pertussis-Vaccine-Contraindication", "TR-Measles-Exclusion", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": ["cough", "nausea/vomiting"], "search": "pertussis — 传染期已过（>21 天咳嗽）→ 不需停学\npertussis school exclusion infectious period nhmrc guidelines\nprevention\n a 7-year-old boy is brought to your clinic with a 2-week history of paroxysms of cough and vomiting at the end of coughing episodes during school holidays. cough is dry and is worse at night. his mother is worried whether he should go to school, which is going to start in 2 days. which one of the following would be the most appropriate approach regarding this situation? \n correct answer is  a  \n 临床符合  whooping cough (pertussis)，bordetella pertussis  所致。潜伏期 7–14 天（可达 20 天），三期：catarrhal → paroxysmal → convalescence。 \n 抗生素指征：catarrhal / 早 paroxysmal 期（可能减轻严重度）；咳嗽  \n index case 停学：开始恰当抗生素后 5 天，或任一阵咳起 21 天，或阵咳起 14 天（若日期明确）。本例开学在阵咳起 14 天后 → 不传染 → 不需停学。 \n 若在前 14 天内就诊，抗生素可缩短停学期。阵咳已 14 天（catarrhal 期算 21 天）→ 已处传染期末尾。 \n 疫苗状态指导  密切接触者 的停学，而非 index case。 "}, {"id": "AMC-Q0762", "type": "mcq", "qid": 762, "title": "Pertussis — 婴儿 <6 月 → 住院观察（呼吸暂停/发绀风险）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["treatment", "diagnosis"], "topic": ["Pertussis", "Infant <6mo", "Admission", "Apnea", "Cyanosis"], "difficulty": 3, "correctAnswer": "C", "page": 1303, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "infant", "admission", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0762-Pertussis-Infant-Admission.md", "stem": "<p>A 5-month-old child is brought to your practice with a 10-day history of cough paroxysms followed by inspiratory whoop and vomiting. There is no cyanosis associated with bouts of cough, and the child is well between the attacks. Which one of the following is the most appropriate action now?</p>", "options": [{"letter": "A", "text": "Reassure."}, {"letter": "B", "text": "Prescribe a 5-day course of antibiotics and discharge the child home."}, {"letter": "C", "text": "Admit the child to the hospital for observation."}, {"letter": "D", "text": "Chemoprophylaxis of the household."}, {"letter": "E", "text": "Vaccinate the household."}], "rationale": "<p>1. <strong>题型识别</strong>：5 月龄婴儿 + 阵咳 + 吸气性 whoop + 咳末呕吐 → 典型 pertussis。问\"下一步最合适处理\"。 2. <strong>年龄是决策关键</strong>：<6 月龄婴儿是 pertussis 重症/死亡高危。 3. <strong>澳洲指南住院指征</strong>：</p>\n<ul>\n<li>婴儿 <strong><6 个月</strong></li>\n<li>任何有并发症者（呼吸暂停、发绀、肺炎、脑病）</li>\n<p>4. <strong>本例</strong>：5 月龄（<6 月）→ 直接满足住院标准，无论当前有无发绀。 5. <strong>抗生素的层次</strong>：住院后当然要抗生素（如 azithromycin），但<strong>住院优先于</strong>开药带回家。 6. <strong>Chemoprophylaxis</strong>：仅当家中有 <strong><6 月婴儿</strong> 或 <strong><3 剂疫苗</strong> 的接触者时才给；本例问的是 index case 的处理，不是家属。 7. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"well between attacks = 可放心\"陷阱</strong>：错。婴儿 <6 月随时可能呼吸暂停，必须监护。</li>\n<li><strong>\"开 5 天抗生素带回家\"陷阱</strong>：错。应先住院；抗生素是住院后的一部分。</li>\n<li><strong>\"给全家预防\"陷阱</strong>：错。预防用药看家属中的高危接触者，不是 blanket 给药。</li>\n<li><strong>\"补疫苗\"陷阱</strong>：错。急性期补疫苗对当前感染无益（可日后鼓励 catch-up）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>临床符合 pertussis（Bordetella pertussis）。婴儿表现可不典型（whoop 少、catarrhal 期短），更多表现为呛咳、喘息、发绀、呼吸暂停或非特异症状（喂养差、惊厥）。</p>\n<p><strong>澳洲指南住院标准</strong>：</p>\n<ul>\n<li>婴儿 <6 个月</li>\n<li>任何有并发症者（呼吸暂停、发绀、肺炎、脑病）</li>\n</ul>\n<p>本例 <6 月 → 收入院进一步处理。</p>\n<p>抗生素指征：catarrhal / 早 paroxysmal 期；咳嗽 <14 天；住院；并发症。住院后给 azithromycin。</p>\n<p>Chemoprophylaxis 仅当家中有 <6 月婴儿或 <3 剂疫苗的接触者（index case 除外）。catch-up 免疫可日后鼓励，但不是急性期处理。</p>", "references": "<ul>\n<li>RCH - Whooping cough (pertussis)</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n<li>RACGP - Pertussis Presentation, investigation and management</li>\n</ul>", "related": ["AMC-Q0761-Pertussis-School-Exclusion", "AMC-Q0763-Pertussis-Prophylaxis", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": ["cough", "nausea/vomiting"], "search": "pertussis — 婴儿 <6 月 → 住院观察（呼吸暂停/发绀风险）\npertussis infant <6mo admission apnea cyanosis\ntreatment diagnosis\n a 5-month-old child is brought to your practice with a 10-day history of cough paroxysms followed by inspiratory whoop and vomiting. there is no cyanosis associated with bouts of cough, and the child is well between the attacks. which one of the following is the most appropriate action now? \n correct answer is  c  \n 临床符合 pertussis（bordetella pertussis）。婴儿表现可不典型（whoop 少、catarrhal 期短），更多表现为呛咳、喘息、发绀、呼吸暂停或非特异症状（喂养差、惊厥）。 \n  澳洲指南住院标准 ： \n \n 婴儿  \n 任何有并发症者（呼吸暂停、发绀、肺炎、脑病） \n \n 本例  \n 抗生素指征：catarrhal / 早 paroxysmal 期；咳嗽  \n chemoprophylaxis 仅当家中有  "}, {"id": "AMC-Q0763", "type": "mcq", "qid": 763, "title": "Pertussis — 未免疫的密切接触 sibling → 尽快补种 dTpa", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention", "treatment"], "topic": ["Pertussis", "Post-exposure Prophylaxis", "Close Contacts", "Vaccination"], "difficulty": 4, "correctAnswer": "C", "page": 1305, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "chemoprophylaxis", "post-exposure-prophylaxis", "approach-prevention", "approach-treatment"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0763-Pertussis-Prophylaxis.md", "stem": "<p>A 7-month-old child is brought to your practice with paroxysmal cough and vomiting for 2 weeks and relative wellness in between paroxysms. You suspect he may have whooping cough (pertussis). He has already been started on azithromycin. He lives at home with his mother, father and older brothers, aged 3 and 5 years. Neither of his brothers have been immunized against pertussis. Which one of the following options is the most appropriate next action to take?</p>", "options": [{"letter": "A", "text": "Arrange to have the child admitted to hospital, and isolated immediately."}, {"letter": "B", "text": "Report the family to the child protection agency in your state for failing to immunize their children."}, {"letter": "C", "text": "Immediately vaccinate his brothers."}, {"letter": "D", "text": "Prescribe azithromycin for the whole family."}, {"letter": "E", "text": "Take no action."}], "rationale": "<p>1. <strong>题型识别</strong>：已用 azithromycin 的 7 月 pertussis 患儿 + 未免疫的 3 岁/5 岁兄弟 → 问\"下一步\"。 2. <strong>患儿本身</strong>：>6 月、无发绀/呼吸暂停/肺炎 → <strong>不需住院</strong>（排除 A）。 3. <strong>家长的选择权</strong>：是否疫苗由父母决定，不是向儿童保护机构举报的事由（排除 B）。 4. <strong>暴露后预防（PEP）指征</strong>（index case 传染期内，且首次接触在窗口内）：</p>\n<ul>\n<li>儿童：<strong><6 月</strong>；或 <strong><3 剂 pertussis 疫苗</strong>；或家有 <strong><6 月</strong> 成员；或同班日托有 <6 月婴儿</li>\n<li>成人：孕末月待产父母；产科/新生儿病房医护；<6 月婴儿日托工作者；家有 <6 月成员</li>\n<p>5. <strong>本例兄弟</strong>：3 岁、5 岁均未免疫（<3 剂）→ <strong>应给预防性抗生素</strong>。但选项 D（全家）错在把<strong>父母</strong>也包进去（父母不符合）。 6. <strong>无\"只给兄弟预防\"的干净选项</strong> → 立即给两个未免疫兄弟<strong>补种疫苗</strong>是最合适的替代（后续仍应 PEP）。 7. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"上报儿童保护\"陷阱</strong>：错。拒绝疫苗是父母权利，非举报事由。</li>\n<li><strong>\"全家预防\"陷阱</strong>：错。父母不符合 PEP 标准；且 blanket 给药不被推荐。</li>\n<li><strong>\"住院隔离患儿\"陷阱</strong>：错。患儿 >6 月、稳定，不需住院。</li>\n<li><strong>\"不处理\"陷阱</strong>：错。未免疫接触者需干预（补种 / PEP）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>患儿 >6 月、无严重并发症 → 不需住院。父母对疫苗的决定权受保护，不能因未接种而上报儿童保护机构；接种也不能强制。</p>\n<p>PEP 指征（index case 传染期内 + 首次接触在窗口内）：</p>\n<ul>\n<li>儿童：<6 月；或 <3 剂疫苗；或家有 <6 月成员；或日托同班有 <6 月婴儿</li>\n<li>成人：孕末月父母；产科/新生儿医护；<6 月婴儿日托者；家有 <6 月成员</li>\n</ul>\n<p>本例 3 岁、5 岁兄弟应给 PEP，但父母不应给。无\"仅兄弟预防\"选项时，立即给两未免疫兄弟补种是最合适替代。已接种成人若 10 年内未打含 pertussis 疫苗 → 加强 dTpa。</p>", "references": "<ul>\n<li>RCH - Whooping cough (pertussis)</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n<li>RACGP - Pertussis Presentation, investigation and management</li>\n</ul>", "related": ["AMC-Q0762-Pertussis-Infant-Admission", "AMC-Q0764-Pertussis-Vaccine-Contraindication", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": ["cough", "nausea/vomiting"], "search": "pertussis — 未免疫的密切接触 sibling → 尽快补种 dtpa\npertussis post-exposure prophylaxis close contacts vaccination\nprevention treatment\n a 7-month-old child is brought to your practice with paroxysmal cough and vomiting for 2 weeks and relative wellness in between paroxysms. you suspect he may have whooping cough (pertussis). he has already been started on azithromycin. he lives at home with his mother, father and older brothers, aged 3 and 5 years. neither of his brothers have been immunized against pertussis. which one of the following options is the most appropriate next action to take? \n correct answer is  c  \n 患儿 >6 月、无严重并发症 → 不需住院。父母对疫苗的决定权受保护，不能因未接种而上报儿童保护机构；接种也不能强制。 \n pep 指征（index case 传染期内 + 首次接触在窗口内）： \n \n 儿童： \n 成人：孕末月父母；产科/新生儿医护； \n \n 本例 3 岁、5 岁兄弟应给 pep，但父母不应给。无\"仅兄弟预防\"选项时，立即给两未免疫兄弟补种是最合适替代。已接种成人若 10 年内未打含 pertussis 疫苗 → 加强 dtpa。 "}, {"id": "AMC-Q0764", "type": "mcq", "qid": 764, "title": "Pertussis 疫苗 — 热性惊厥**不是**接种禁忌", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Pertussis Vaccine", "DTPa", "Contraindications", "Febrile Convulsion"], "difficulty": 3, "correctAnswer": "A", "page": 1307, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "vaccination", "dtpa", "contraindication", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0764-Pertussis-Vaccine-Contraindication.md", "stem": "<p>Which one of the following statements is correct about pertussis?</p>", "options": [{"letter": "A", "text": "Febrile convulsions are not a contraindication for vaccination against pertussis."}, {"letter": "B", "text": "DTPa cannot be given with another live virus-containing vaccine."}, {"letter": "C", "text": "Pertussis vaccine should not be given to a child with infantile convulsions."}, {"letter": "D", "text": "Erythromycin reduces the severity of the signs and symptoms."}, {"letter": "E", "text": "Prophylaxis is always indicated for the entire household."}], "rationale": "<p>1. <strong>题型识别</strong>：pertussis 疫苗相关\"正确陈述\"题（反向/选是题）。 2. <strong>热性惊厥 vs 疫苗</strong>：DTPa 后 48h 内热性惊厥极少见；6 月龄内（完成基础针）更少见。有既往史者后续剂次风险略增，但<strong>退热预防可最小化</strong> → 仍推荐。 3. <strong>同时接种</strong>：同日接种活+灭活疫苗<strong>不</strong>降低抗体、不增不良反应 → DTPa 可与活病毒疫苗同用（B 错）。 4. <strong>婴儿痉挛/癫痫</strong>：含 pertussis 疫苗<strong>不</strong>引起；活动/进展性神经疾病患儿也可安全接种（C 错）。 5. <strong>抗生素（红霉素）</strong>：<strong>不</strong>减轻症状严重度，只缩短传染期、降低传播（D 错）。 6. <strong>全家预防</strong>：常规不推荐（除非符合高危标准）（E 错）。 7. <strong>锁定 A</strong>。</p>", "traps": "<ul>\n<li><strong>\"热性惊厥 = 禁忌\"陷阱</strong>：错。是常见误解；仍推荐接种 + 退热预防。</li>\n<li><strong>\"活疫苗不能同用\"陷阱</strong>：错。同日接种活+灭活安全。</li>\n<li><strong>\"抗生素治病\"陷阱</strong>：错。红霉素缩短传染期，不减轻症状。</li>\n<li><strong>\"全家都预防\"陷阱</strong>：错。仅高危接触者。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>热性惊厥在 DTPa 后 48h 内极少见，6 月龄内更少。有既往史者后续剂次风险略增，但退热措施可最小化 → 仍推荐。</p>\n<p>(B) 同日接种常用活+灭活疫苗不降低抗体、不增不良反应；同时接种提高按时全程接种率 → DTPa 可与活病毒疫苗同用。 (C) 含 pertussis 疫苗不引起婴儿痉挛/癫痫；活动/进展性神经疾病患儿也可安全接种。 (D) 抗生素不减轻症状严重度，但缩短传染期、降低传播。 (E) 因 index case 就诊延迟、成本与副作用，常规不推荐全家 PEP；但新生儿高危时推荐。</p>", "references": "<ul>\n<li>Australian Immunisation Handbook - Pertussis (whooping cough)</li>\n<li>CDC - Immunology and Vaccine-Preventable Diseases – Pink Book – General Recommendations</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n</ul>", "related": ["AMC-Q0763-Pertussis-Prophylaxis", "AMC-Q0761-Pertussis-School-Exclusion", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": [], "search": "pertussis 疫苗 — 热性惊厥**不是**接种禁忌\npertussis vaccine dtpa contraindications febrile convulsion\nprevention\n which one of the following statements is correct about pertussis? \n correct answer is  a  \n 热性惊厥在 dtpa 后 48h 内极少见，6 月龄内更少。有既往史者后续剂次风险略增，但退热措施可最小化 → 仍推荐。 \n (b) 同日接种常用活+灭活疫苗不降低抗体、不增不良反应；同时接种提高按时全程接种率 → dtpa 可与活病毒疫苗同用。 (c) 含 pertussis 疫苗不引起婴儿痉挛/癫痫；活动/进展性神经疾病患儿也可安全接种。 (d) 抗生素不减轻症状严重度，但缩短传染期、降低传播。 (e) 因 index case 就诊延迟、成本与副作用，常规不推荐全家 pep；但新生儿高危时推荐。 "}, {"id": "AMC-Q0924", "type": "mcq", "qid": 924, "title": "Measles — 出疹 4 天后停学；本例出疹已 7 天 → 无需停学", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Measles", "School Exclusion", "4 days after rash", "Contacts"], "difficulty": 3, "correctAnswer": "A", "page": 1320, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "measles", "school-exclusion", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0924-Measles-School-Exclusion.md", "stem": "<p>A mother brings her 7-year-old son 6 days after eruption of a generalized rash found to be measles. She asks if he must be excluded from school. All classmates are fully vaccinated against measles. Most appropriate advice?</p>", "options": [{"letter": "A", "text": "No exclusion is required."}, {"letter": "B", "text": "Exclusion for 4 days."}, {"letter": "C", "text": "Exclusion until the rash completely disappears."}, {"letter": "D", "text": "Exclusion only if an immunocompromised child is in the class."}, {"letter": "E", "text": "Exclusion for 6 days."}], "rationale": "<p>1. <strong>题型识别</strong>：麻疹患儿出疹后问停学 → 考停学时限（出疹后 4 天）。 2. <strong>停学规则</strong>：确诊病例停学至<strong>出疹后 4 天</strong>。 3. <strong>本例</strong>：出疹 7 天前 → 早已过 4 天 → 不传染 → 无需停学。 4. <strong>接触者规则</strong>（本题同学均接种）：</p>\n<ul>\n<li>已免疫接触者 → 不需停学。</li>\n<li>未免疫接触者 → 停学至 index case 出疹后 14 天，除非接触后 72h 内接种 MMR。</li>\n<p>5. <strong>选项排除</strong>：B/C/E 都要求某种停学，但本例已超期；D 把停学挂在特定同学，错误。 6. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有麻疹 = 必须停学\"陷阱</strong>：错。看时限——出疹后 4 天；本例已过。</li>\n<li><strong>\"出疹消失才复课\"陷阱</strong>：错。只需出疹后 4 天，不必等疹退。</li>\n<li><strong>\"看同学是否免疫决定 index case\"陷阱</strong>：错。index case 的停学看自身出疹时间，与同学无关。</li>\n<li><strong>混淆 pertussis 与 measles 时限</strong>：pertussis 21 天，measles 4 天，不同。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Measles is highly infective; all suspected/probable/confirmed cases excluded from school until 4 days after rash onset. This child's rash erupted 7 days ago → no longer infective → no exclusion.</p>\n<p>TOPIC REVIEW: Contacts of a known measles case in childcare: immunized contacts need no exclusion; non-immunized contacts excluded until 14 days after the infected child's rash, unless MMR within 72h of contact.</p>", "references": "<ul>\n<li>Australian Government, Department of Health – Measles - National guidelines for public health units</li>\n</ul>", "related": ["TR-Measles-Exclusion", "AMC-Q0761-Pertussis-School-Exclusion", "AMC-Q1349-Chickenpox-School-Exclusion", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Measles"], "complaints": [], "search": "measles — 出疹 4 天后停学；本例出疹已 7 天 → 无需停学\nmeasles school exclusion 4 days after rash contacts\nprevention\n a mother brings her 7-year-old son 6 days after eruption of a generalized rash found to be measles. she asks if he must be excluded from school. all classmates are fully vaccinated against measles. most appropriate advice? \n correct answer is  a  \n measles is highly infective; all suspected/probable/confirmed cases excluded from school until 4 days after rash onset. this child's rash erupted 7 days ago → no longer infective → no exclusion. \n topic review: contacts of a known measles case in childcare: immunized contacts need no exclusion; non-immunized contacts excluded until 14 days after the infected child's rash, unless mmr within 72h of contact. "}, {"id": "AMC-Q1066", "type": "mcq", "qid": 1066, "title": "AMC-Q1066 — Roseola infantum (exanthem subitum)", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["幼儿急疹"], "difficulty": 2, "correctAnswer": "E", "page": 1338, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1066-Roseola-Infantum.md", "stem": "<p>Kyle, 5 months old, is brought to your practice by his mother for evaluation. He has had a runny nose and a fever of 40°C for the past 48 hours, but otherwise quite active and healthy. Today, Kyle's temperature dropped to normal but he developed a maculopapular rash on his trunk. He is still in good health. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Measles"}, {"letter": "B", "text": "Chicken pox"}, {"letter": "C", "text": "Erythema infectiosum"}, {"letter": "D", "text": "Rubella"}, {"letter": "E", "text": "Roseola infantum"}], "rationale": "<ul>\n<li>经典表现：<strong>3-5 天高热（40°C）后热退疹出</strong> → 幼儿急疹</li>\n<li>病因：<strong>HHV-6</strong>（最常见），少数 HHV-7、肠道病毒、腺病毒、副流感</li>\n<li>年龄：<strong>6-18 个月</strong>（本例 5 个月，接近）</li>\n<li>皮疹特点：</li>\n<li>颈/躯干首发 → 面部、四肢</li>\n<li>斑疹或斑丘疹</li>\n<li>通常无瘙痒</li>\n<li>持续 1-2 天</li>\n<li>鉴别诊断：</li>\n<li><strong>麻疹</strong>（A）：高热 + 咳嗽 + 卡他 + 结膜炎 + 科氏斑，<strong>发热全程出疹</strong></li>\n<li><strong>水痘</strong>（B）：<strong>瘙痒性水疱</strong>，\"玫瑰花瓣上的露珠\"</li>\n<li><strong>传染性红斑</strong>（C，第五病）：\"掌拍颊\"，低热</li>\n<li><strong>风疹</strong>（D）：耳后/枕后淋巴结肿大 + 疹速出速退</li>\n</ul>", "traps": "<ul>\n<li>选 A（麻疹）— 麻疹<strong>发热全程</strong>出疹，且伴明显卡他症状</li>\n<li>选 C（传染性红斑）— 那是\"掌拍颊\"皮疹，幼儿急疹是热退后躯干</li>\n</ul>", "summary": "<p><strong>幼儿急疹 vs 麻疹 vs 风疹</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>幼儿急疹</th><th>麻疹</th><th>风疹</th></tr></thead>\n<tbody>\n<tr><td>病原</td><td>HHV-6</td><td>麻疹病毒</td><td>风疹病毒</td></tr>\n<tr><td>年龄</td><td>6-18 mo</td><td>6 mo-5 yr</td><td>青少年</td></tr>\n<tr><td>发热与疹关系</td><td><strong>热退疹出</strong></td><td>高热全程出疹</td><td>出疹时常有低热</td></tr>\n<tr><td>皮疹顺序</td><td>颈/躯干 → 全身</td><td>耳后 → 面部 → 全身</td><td>面部 → 全身</td></tr>\n<tr><td>其他</td><td>良性自限</td><td>卡他、结膜、Koplik 斑</td><td>耳后/枕后淋巴结</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：高热 + 鼓胀囟门见于 26% 的幼儿急疹，可被误认为脑膜炎；高热可致热惊厥。</p>", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>该场景是幼儿急疹的典型表现。幼儿急疹，也称为 exanthem subitum、第六病和三日热，是一种最常由人类疱疹病毒 6（HHV-6）引起的临床综合征。其他原因包括人类疱疹病毒 7（HHV-7）、肠道病毒（柯萨奇病毒 A 和 B、埃可病毒）、腺病毒和副流感病毒 1 型。</p>\n<p>这是婴儿（多为 6-18 个月）的临床综合征，特征是 3-5 天通常高达 40°C（或更高）的高热。然后发热骤然消退，随后出现皮疹。</p>\n<p>幼儿急疹的典型皮疹是斑疹或斑丘疹，从颈部和躯干开始，扩散到面部和四肢。偶尔出现水疱。皮疹通常不瘙痒。皮疹持续 1-2 天，但偶尔可能在 2-4 小时内来去。在因高热接受抗生素治疗的儿童中，皮疹的出现可能与药物过敏混淆。诊断几乎完全是临床性的。该病程良性，自发消退。<strong>可发生热惊厥</strong>。</p>\n<p><strong>淋巴结肿大和鼓膜充血常见</strong>。在发热期，该病可能与中耳炎混淆。<strong>高热伴囟门膨隆见于多达 26% 的婴儿</strong>，可能误认为脑膜炎。</p>\n<p>在 80 例幼儿急疹患儿的一个系列中，相关表现包括：</p>\n<ul>\n<li>淋巴结肿大 — 98%</li>\n<li>鼓膜充血 — 93%</li>\n<li>易激惹 — 92%</li>\n<li>Nagayama 斑 — 87%</li>\n<li>厌食 — 80%</li>\n<li>上呼吸道症状 — 25%</li>\n<li>腹泻 — 15%</li>\n<li>咳嗽 — 11%</li>\n</ul>", "references": "<ul>\n<li>UpToDate - Roseola infantum</li>\n</ul>", "related": ["AMC-Q0924-Measles-School-Exclusion", "TR-Roseola-vs-Measles"], "bodyHtml": "", "diseases": ["Roseola"], "complaints": ["fever", "rash"], "search": "amc-q1066 — roseola infantum (exanthem subitum)\n幼儿急疹\n kyle, 5 months old, is brought to your practice by his mother for evaluation. he has had a runny nose and a fever of 40°c for the past 48 hours, but otherwise quite active and healthy. today, kyle's temperature dropped to normal but he developed a maculopapular rash on his trunk. he is still in good health. which one of the following is the most likely diagnosis? \n correct answer is  e  \n 该场景是幼儿急疹的典型表现。幼儿急疹，也称为 exanthem subitum、第六病和三日热，是一种最常由人类疱疹病毒 6（hhv-6）引起的临床综合征。其他原因包括人类疱疹病毒 7（hhv-7）、肠道病毒（柯萨奇病毒 a 和 b、埃可病毒）、腺病毒和副流感病毒 1 型。 \n 这是婴儿（多为 6-18 个月）的临床综合征，特征是 3-5 天通常高达 40°c（或更高）的高热。然后发热骤然消退，随后出现皮疹。 \n 幼儿急疹的典型皮疹是斑疹或斑丘疹，从颈部和躯干开始，扩散到面部和四肢。偶尔出现水疱。皮疹通常不瘙痒。皮疹持续 1-2 天，但偶尔可能在 2-4 小时内来去。在因高热接受抗生素治疗的儿童中，皮疹的出现可能与药物过敏混淆。诊断几乎完全是临床性的。该病程良性，自发消退。 可发生热惊厥 。 \n  淋巴结肿大和鼓膜充血常见 。在发热期，该病可能与中耳炎混淆。 高热伴囟门膨隆见于多达 26% 的婴儿 ，可能误认为脑膜炎。 \n 在 80 例幼儿急疹患儿的一个系列中，相关表现包括： \n \n 淋巴结肿大 — 98% \n 鼓膜充血 — 93% \n 易激惹 — 92% \n nagayama 斑 — 87% \n 厌食 — 80% \n 上呼吸道症状 — 25% \n 腹泻 — 15% \n 咳嗽 — 11% \n "}, {"id": "AMC-Q1145", "type": "mcq", "qid": 1145, "title": "AMC-Q1145 — Hand, foot and mouth disease", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["手足口病"], "difficulty": 2, "correctAnswer": "C", "page": 1344, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1145-Hand-Foot-Mouth.md", "stem": "<p>A 3-year-old girl is brought to your practice by her mother with complaint of multiple painful small oral ulcers. The child refuses to eat because of the pain. On examination, the child is found to have a temperature of 38°C. Similar ulcers are noted on her hand and feet. Which one of the following is the causative organism?</p>", "options": [{"letter": "A", "text": "Herpes simplex virus (HSV)"}, {"letter": "B", "text": "Group B streptococcus (GBS)"}, {"letter": "C", "text": "Coxsackie A virus"}, {"letter": "D", "text": "Adenovirus"}, {"letter": "E", "text": "Coronavirus"}], "rationale": "<ul>\n<li>经典三联征：<strong>口腔溃疡 + 手足皮疹 + 发热</strong> → <strong>手足口病（HFM）</strong></li>\n<li>病原：<strong>柯萨奇 A 病毒</strong>（肠道病毒属）</li>\n<li>病程：</li>\n<li>潜伏期 3-5 天</li>\n<li>前驱：低热、头痛、不适</li>\n<li>1-2 天后出疹：红斑 → 灰色水疱（红晕围绕）</li>\n<li><strong>黏膜浅溃疡</strong>（颊黏膜、牙龈、舌）</li>\n<li><strong>手足外侧缘</strong>皮疹</li>\n<li>臀部和生殖器也可累及</li>\n<li>3-5 天自愈，无瘢痕</li>\n<li>传染期：水疱消失前；病毒可经唾液、粪便持续分泌</li>\n<li>鉴别：</li>\n<li><strong>HSV</strong>（A）：单纯疱疹，唇/口周水疱，<strong>不累及手足</strong></li>\n<li><strong>GBS</strong>（B）：细菌，不引起手足口病</li>\n<li><strong>腺病毒</strong>（D）：咽结膜热</li>\n<li><strong>冠状病毒</strong>（E）：COVID-19 / 普通感冒</li>\n</ul>", "traps": "<ul>\n<li>选 A（HSV）— HSV 病变在<strong>口周/口内</strong>，<strong>不会</strong>累及手足</li>\n<li>选 B（GBS）— 细菌，不是病毒性皮疹病因</li>\n</ul>", "summary": "<p><strong>HFM 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>病原</td><td><strong>柯萨奇 A 病毒</strong>（最常见 A16）</td></tr>\n<tr><td>年龄</td><td>多见 < 5 岁</td></tr>\n<tr><td>病程</td><td>自限，3-5 天自愈</td></tr>\n<tr><td>皮疹</td><td>灰水疱 + 红晕；手/足/口；偶累及臀、生殖器</td></tr>\n<tr><td>治疗</td><td>对症；保证入量（口腔疼痛可拒食）</td></tr>\n<tr><td>传染期</td><td>水疱消失前；唾液/粪便中可长期排毒</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：HFM 大多数为轻症；但 <strong>EV71</strong> 型可引起重症脑膜炎/脑干脑炎，亚太地区需警惕。</p>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>口腔、手和足部溃疡的临床表现高度提示<strong>手足口病（HFM disease）</strong>。这种常为自限性的轻度病毒感染由<strong>柯萨奇 A 病毒</strong>引起。<strong>该病潜伏期为 3-5 天</strong>。</p>\n<p>病程以轻度的前驱症状（低热、头痛、不适）开始，1-2 天后出现皮疹。皮疹始于红斑性斑疹，进展为周围充血的灰色水疱。这些水疱在颊黏膜、牙龈和舌上形成浅溃疡。手和足（特别是外侧缘）也受累。在臀部和生殖器上出现皮疹并不少见。</p>\n<p><strong>皮疹在 3-5 天内消退，无瘢痕</strong>。儿童在水疱消失前具有传染性，但病毒可分泌到唾液和粪便中。</p>", "references": "<ul>\n<li>UpToDate - Hand, foot, and mouth disease</li>\n</ul>", "related": ["AMC-Q1275-Chickenpox-School-Exclusion"], "bodyHtml": "", "diseases": ["HFM Disease"], "complaints": [], "search": "amc-q1145 — hand, foot and mouth disease\n手足口病\n a 3-year-old girl is brought to your practice by her mother with complaint of multiple painful small oral ulcers. the child refuses to eat because of the pain. on examination, the child is found to have a temperature of 38°c. similar ulcers are noted on her hand and feet. which one of the following is the causative organism? \n correct answer is  c  \n 口腔、手和足部溃疡的临床表现高度提示 手足口病（hfm disease） 。这种常为自限性的轻度病毒感染由 柯萨奇 a 病毒 引起。 该病潜伏期为 3-5 天 。 \n 病程以轻度的前驱症状（低热、头痛、不适）开始，1-2 天后出现皮疹。皮疹始于红斑性斑疹，进展为周围充血的灰色水疱。这些水疱在颊黏膜、牙龈和舌上形成浅溃疡。手和足（特别是外侧缘）也受累。在臀部和生殖器上出现皮疹并不少见。 \n  皮疹在 3-5 天内消退，无瘢痕 。儿童在水疱消失前具有传染性，但病毒可分泌到唾液和粪便中。 "}, {"id": "AMC-Q1275", "type": "mcq", "qid": 1275, "title": "AMC-Q1275 — Chickenpox school exclusion", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["水痘 — 返校标准"], "difficulty": 2, "correctAnswer": "A", "page": 1349, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1275-Chickenpox-School-Exclusion.md", "stem": "<p>A 7-year-old boy presents with a generalized rash illustrated in the following photograph. The rash developed after 24 hours of mild malaise and fever. When can he go back to school?</p>", "options": [{"letter": "A", "text": "After the resolution of the blisters"}, {"letter": "B", "text": "After 2 days"}, {"letter": "C", "text": "After 5 days"}, {"letter": "D", "text": "No exclusion is required"}, {"letter": "E", "text": "After clearance of the rash"}], "rationale": "<ul>\n<li>皮疹特征：<strong>同时存在各阶段皮损</strong>（斑疹、丘疹、水疱、结痂）→ 典型水痘</li>\n<li><strong>水痘返校标准</strong>：</li>\n<li><strong>所有水疱结痂干燥</strong>后</li>\n<li>通常从出疹起 <strong>5 天</strong></li>\n<li>免疫过的儿童可能更快</li>\n<li>各选项分析：</li>\n<li>B（2 天）— 太早</li>\n<li>C（5 天）— 大致正确时间，但更准确是\"水疱干燥\"为标准</li>\n<li>D（无需排除）— <strong>错误</strong>，水痘传染性强</li>\n<li>E（皮疹完全清除）— <strong>不必等痂脱落</strong>，痂已不传染</li>\n</ul>", "traps": "<ul>\n<li>选 D — 水痘传染性<strong>极强</strong>，必须排除</li>\n<li>选 E — 等痂脱落太严，痂本身不传染</li>\n</ul>", "summary": "<p><strong>儿童常见传染病返校标准</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>返校时间</th></tr></thead>\n<tbody>\n<tr><td><strong>水痘</strong></td><td><strong>所有水疱结痂干燥</strong></td></tr>\n<tr><td>麻疹</td><td>出疹后 4 天</td></tr>\n<tr><td>风疹</td><td>出疹后 7 天（或症状消失）</td></tr>\n<tr><td>百日咳</td><td>抗生素治疗 5 天后</td></tr>\n<tr><td>腮腺炎</td><td>腺肿消退</td></tr>\n<tr><td>HFM</td><td>水疱消失</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：水痘出疹呈\"<strong>向心性分布</strong>\"（躯干 > 四肢），同部位可见<strong>各阶段皮损并存</strong>（\"四世同堂\"）是特征。</p>", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>该照片显示不同阶段的水疱、斑疹和丘疹。其中一些水疱完整，一些未覆盖，一些已干燥。<strong>结合病史，这是水痘的高度特征性表现</strong>。</p>\n<p><strong>水痘儿童应被排除在学校或其他日托环境之外，直到所有水疱干燥</strong>。这通常从出疹起 5 天，但在以前免疫过的儿童中可能更短。</p>\n<p>干燥的水疱需要更多时间才能清除，在此期间儿童不具有传染性。因此，等待皮疹完全清除是不必要的。</p>", "references": "<ul>\n<li>Victorian Department of Health - School exclusion table</li>\n</ul>", "related": ["AMC-Q0924-Measles-School-Exclusion", "AMC-Q1145-Hand-Foot-Mouth"], "bodyHtml": "", "diseases": ["Chickenpox"], "complaints": ["fever"], "search": "amc-q1275 — chickenpox school exclusion\n水痘 — 返校标准\n a 7-year-old boy presents with a generalized rash illustrated in the following photograph. the rash developed after 24 hours of mild malaise and fever. when can he go back to school? \n correct answer is  a  \n 该照片显示不同阶段的水疱、斑疹和丘疹。其中一些水疱完整，一些未覆盖，一些已干燥。 结合病史，这是水痘的高度特征性表现 。 \n  水痘儿童应被排除在学校或其他日托环境之外，直到所有水疱干燥 。这通常从出疹起 5 天，但在以前免疫过的儿童中可能更短。 \n 干燥的水疱需要更多时间才能清除，在此期间儿童不具有传染性。因此，等待皮疹完全清除是不必要的。 "}, {"id": "AMC-Q1401", "type": "mcq", "qid": 1401, "title": "诺如病毒胃肠炎 — 最常见非细菌性胃肠炎", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["诺如病毒胃肠炎 — 非细菌性胃肠炎最常见病原"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1401-Norovirus-Gastroenteritis.md", "stem": "<p>A 3-year-old child is brought to your office by his mother with complaints of diarrhea and colicky abdominal pains for the past three days. Which one of the following can be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Giardiasis."}, {"letter": "B", "text": "Norovirus gastroenteritis."}, {"letter": "C", "text": "Perforated appendicitis."}, {"letter": "D", "text": "Staphylococcal gastroenteritis."}, {"letter": "E", "text": "Shigellosis."}], "rationale": "<p>1. 题型识别：诊断 — 儿童急性腹泻的病原学鉴别 2. 关键线索：3 岁、腹泻 + 腹部绞痛 3 天、无特殊暴露史 3. 流行病学：诺如病毒 = 全球最常见非细菌性胃肠炎病原 4. 鉴别排除：</p>\n<ul>\n<li>贾第虫（A）：徒步者/饮用生水史 + 恶臭脂肪便 + 潜伏期 7-14 天</li>\n<li>阑尾穿孔（C）：全身中毒 + 腹膜炎体征</li>\n<li>金葡菌胃肠炎（D）：恶心呕吐更突出、腹泻较少</li>\n<li>志贺菌（E）：高热 + 腹痛 + <strong>血性黏液便</strong> + 里急后重</li>\n<p>5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>贾第虫混淆</strong>：腹泻 + 腹部绞痛可见于贾第虫，但贾第虫需要饮用生水史、潜伏期 7-14 天、恶臭脂肪便（脂肪泻 70%），与本题不符</li>\n<li><strong>志贺菌</strong>：典型为高热 + 血性黏液便 + 里急后重，与题中单纯腹泻腹痛不符</li>\n<li><strong>\"最常见的\"即答案</strong>：腹泻鉴别诊断宽泛，在没有特殊线索时选最常见病因</li>\n</ul>", "summary": "<p><strong>诺如病毒</strong>：</p>\n<ul>\n<li>工业化国家非细菌性胃肠炎暴发的 95% 病因</li>\n<li>全球所有胃肠炎暴发的 50%</li>\n<li>传播：粪-口（主要）、污染食物（沙拉/冰/水/水果/烘焙品/冷肉）、少数气溶胶/接触/污染物</li>\n<li>潜伏期：24-48h（可早至 12h）</li>\n<li>临床表现：恶心、呕吐、腹泻（<strong>非炎症性</strong>，无血无黏液）、腹部绞痛 / 次常见：头痛、低热、寒战、肌痛、乏力</li>\n<li>诊断：暴发场景外不需检查；确诊用粪便 PCR</li>\n<li>治疗：对症支持</li>\n</ul>", "explanation": "<p>选项中诺如病毒胃肠炎为最可能诊断。诺如病毒是全球主要人类病原体，估计占工业化国家（如澳大利亚）非细菌性胃肠炎暴发的 95%，占全球所有胃肠炎暴发的 50%。所有年龄段均易感。</p>\n<p>贾第虫病需考虑徒步者/露营者或饮用生水史，潜伏期 7-14 天、恶臭脂肪便（70%）、腹胀、体重下降。阑尾穿孔临床表现完全不同（全身中毒 + 腹膜炎体征）。金葡菌胃肠炎以恶心呕吐更突出、腹泻较少。志贺菌感染典型表现为高热、腹部绞痛、<strong>血性黏液便</strong>和里急后重。</p>", "references": "<ul>\n<li>SA Health - Norovirus infection - including symptoms, treatment and prevention</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain"], "search": "诺如病毒胃肠炎 — 最常见非细菌性胃肠炎\n诺如病毒胃肠炎 — 非细菌性胃肠炎最常见病原\n a 3-year-old child is brought to your office by his mother with complaints of diarrhea and colicky abdominal pains for the past three days. which one of the following can be the most likely diagnosis? \n 选项中诺如病毒胃肠炎为最可能诊断。诺如病毒是全球主要人类病原体，估计占工业化国家（如澳大利亚）非细菌性胃肠炎暴发的 95%，占全球所有胃肠炎暴发的 50%。所有年龄段均易感。 \n 贾第虫病需考虑徒步者/露营者或饮用生水史，潜伏期 7-14 天、恶臭脂肪便（70%）、腹胀、体重下降。阑尾穿孔临床表现完全不同（全身中毒 + 腹膜炎体征）。金葡菌胃肠炎以恶心呕吐更突出、腹泻较少。志贺菌感染典型表现为高热、腹部绞痛、 血性黏液便 和里急后重。 "}, {"id": "AMC-Q1274", "type": "mcq", "qid": 1274, "title": "AMC-Q1274 — ODD pharmacological treatment", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Mental-Health", "approach": [], "topic": ["对立违抗性障碍 (ODD) — 药物治疗"], "difficulty": 3, "correctAnswer": "D", "page": 1347, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Mental-Health/AMC-Q1274-ODD-Risperidone.md", "stem": "<p>A 15-year-old boy is brought by his parents for his behavioral problems. According to the parents, he has had marked aggressiveness with several fights and arguments with the school staff, anger outbursts, and being uneasy to control. He seemingly is not obedient at home and defies his parents and the home rules. Parents say that they have fights over every simple issue at home. They, however, deny any act of vandalism, cruelty towards animals or people, or drug use. He has declined school performance. On examination, he has a normal attention span and does not appear hyperactive. If pharmacological intervention is required, which one of the following is most likely to benefit him?</p>", "options": [{"letter": "A", "text": "Carbamazepine"}, {"letter": "B", "text": "Sodium valproate"}, {"letter": "C", "text": "SSRIs"}, {"letter": "D", "text": "Risperidone"}, {"letter": "E", "text": "Olanzapine"}], "rationale": "<ul>\n<li>临床表现：</li>\n<li><strong>对立违抗性障碍（ODD）</strong>：对权威人物的对抗、敌对、违拗行为 ≥ 6 个月</li>\n<li>关键排除：没有破坏行为、动物/人的残忍行为、药物使用 → <strong>不是品行障碍（CD）</strong></li>\n<li>注意力正常、不过动 → <strong>不是 ADHD</strong></li>\n<li>ODD 治疗：</li>\n<li><strong>一线：行为治疗 + 家庭治疗</strong></li>\n<li>药物治疗：用于<strong>严重攻击行为</strong>或合并 ADHD 时</li>\n<li><strong>伴严重攻击</strong>：<strong>利培酮（risperidone）</strong> ± 精神兴奋剂</li>\n<li>ADHD 共病：精神兴奋剂或 atomoxetine</li>\n<li>各选项分析：</li>\n<li>A（卡马西平）：无证据</li>\n<li>B（丙戊酸钠）：二线情绪稳定剂</li>\n<li>C（SSRIs）：二线抗抑郁</li>\n<li>D（利培酮）：<strong>唯一对 ODD 严重攻击有效的选项</strong></li>\n<li>E（奥氮平）：二线</li>\n</ul>", "traps": "<ul>\n<li>选 A/B（情绪稳定剂）— 这是 ODD 严重攻击的二线</li>\n<li>选 C（SSRIs）— 用于合并焦虑/抑郁，不是 ODD 攻击的主线</li>\n<li>选 E（奥氮平）— 二线，不如利培酮循证强</li>\n</ul>", "summary": "<p><strong>ODD 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>表现</td><td>对权威的对抗/敌对/违拗 ≥ 6 月；无严重违法/残忍</td></tr>\n<tr><td>共病</td><td>ADHD、焦虑、学习障碍、语言障碍</td></tr>\n<tr><td>进展</td><td><strong>60% ODD → 品行障碍（CD）</strong></td></tr>\n<tr><td>治疗</td><td>行为治疗 + 家庭治疗（首选）</td></tr>\n<tr><td>药物（严重攻击）</td><td><strong>利培酮</strong> ± 精神兴奋剂</td></tr>\n<tr><td>ADHD 共病</td><td>精神兴奋剂 / atomoxetine</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：ODD 是品行障碍的\"前奏\"，<strong>早期干预</strong> 防进展到 CD/犯罪/精神疾病。</p>", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>临床表现和儿童年龄主要符合对立违抗性障碍（ODD）作为诊断。</p>\n<p><strong>ODD 是一种儿童和青少年的破坏性行为障碍</strong>，特征是对权威人物的对抗性和争论性行为和态度模式。这种模式通常被父母简单地视为固执、情绪化和意志坚强。然而，在 ODD 中，这种行为比被认为是正常的要极端得多。有趣的是，<strong>ODD 的发生频率远高于儿童发育不同阶段常出现的固执、抱怨和叛逆</strong>。</p>\n<p>ODD 表现为持续的、极端的消极、对抗和敌对行为，导致社会、学校和家庭生活至少 6 个月的破坏。症状可能早在学龄前晚期就出现。</p>\n<p><strong>ODD 儿童常将愤怒和怨恨指向父母、老师和其他权威人物</strong>；然而，他们也可能与同伴有这些问题。他们经常不合作、报复性强且易怒。他们通常违抗规则、有愤怒爆发、因自己的错误责怪他人、寻求报复并故意打扰他人。ODD 症状可能针对一个人或许多人，可能只在家中、学校发生，或在多种环境中发生。</p>\n<p>由于儿童不太可能理解自己有问题，治疗通常由父母发起。<strong>仔细的病史很重要，因为许多其他儿童疾病可能与 ODD 有一些共同特征</strong>。此外，ODD 可能与其他精神疾病共存，如焦虑障碍、ADHD、学习障碍和语言障碍。</p>\n<p><strong>重要的是区分行为模式异常是由于 ODD 还是仅仅是对暂时情况的反应</strong>。</p>\n<p><strong>国际疾病分类第 10 版（ICD-10）将 ODD 归类为品行障碍的轻度形式</strong>。据估计，高达 60% 的 ODD 患者将发展为品行障碍。</p>\n<p><strong>在早期阶段治疗是必要的，以防止其发展为更严重的品行障碍（最重要的）、精神健康障碍或犯罪行为</strong>。治疗需要行为治疗、家庭治疗和偶尔药物的组合。</p>\n<p>在 50% 以上的 ADHD 患者中，ODD 也是临床表现的一部分。有强有力证据表明 ODD 和 ADHD 重叠，许多用于治疗 ADHD 的药物也可能对 ODD 治疗有效。一些研究报告了兴奋剂或阿托莫西汀在治疗与 ADHD 共病的 ODD 中的积极作用。<strong>有严重攻击行为的 ODD 和品行障碍患者可能对利培酮反应良好，伴或不伴兴奋剂</strong>。</p>\n<p>情绪调节剂、α2 激动剂和抗抑郁药也可能在 ODD 及其共病治疗中具有二线作用。</p>\n<p><strong>在所给选项中，利培酮是唯一在考虑药物治疗时可以使用的选项</strong>。</p>\n<p>情绪稳定剂如丙戊酸钠（选项 B）或奥氮平（选项 A），以及抗抑郁药如 SSRIs（选项 C）是二线选择。</p>\n<p><strong>没有证据支持卡马西平（选项 E）作为 ODD 的药物治疗</strong>。</p>", "references": "<ul>\n<li>Medscape - Oppositional Defiant Disorder</li>\n<li>PubMed - Psychopharmacological treatment of oppositional defiant disorder</li>\n</ul>", "related": ["AMC-Q1286-Encopresis-ODD", "TR-ODD-Management"], "bodyHtml": "", "diseases": ["ODD"], "complaints": [], "search": "amc-q1274 — odd pharmacological treatment\n对立违抗性障碍 (odd) — 药物治疗\n a 15-year-old boy is brought by his parents for his behavioral problems. according to the parents, he has had marked aggressiveness with several fights and arguments with the school staff, anger outbursts, and being uneasy to control. he seemingly is not obedient at home and defies his parents and the home rules. parents say that they have fights over every simple issue at home. they, however, deny any act of vandalism, cruelty towards animals or people, or drug use. he has declined school performance. on examination, he has a normal attention span and does not appear hyperactive. if pharmacological intervention is required, which one of the following is most likely to benefit him? \n correct answer is  d  \n 临床表现和儿童年龄主要符合对立违抗性障碍（odd）作为诊断。 \n  odd 是一种儿童和青少年的破坏性行为障碍 ，特征是对权威人物的对抗性和争论性行为和态度模式。这种模式通常被父母简单地视为固执、情绪化和意志坚强。然而，在 odd 中，这种行为比被认为是正常的要极端得多。有趣的是， odd 的发生频率远高于儿童发育不同阶段常出现的固执、抱怨和叛逆 。 \n odd 表现为持续的、极端的消极、对抗和敌对行为，导致社会、学校和家庭生活至少 6 个月的破坏。症状可能早在学龄前晚期就出现。 \n  odd 儿童常将愤怒和怨恨指向父母、老师和其他权威人物 ；然而，他们也可能与同伴有这些问题。他们经常不合作、报复性强且易怒。他们通常违抗规则、有愤怒爆发、因自己的错误责怪他人、寻求报复并故意打扰他人。odd 症状可能针对一个人或许多人，可能只在家中、学校发生，或在多种环境中发生。 \n 由于儿童不太可能理解自己有问题，治疗通常由父母发起。 仔细的病史很重要，因为许多其他儿童疾病可能与 odd 有一些共同特征 。此外，odd 可能与其他精神疾病共存，如焦虑障碍、adhd、学习障碍和语言障碍。 \n  重要的是区分行为模式异常是由于 odd 还是仅仅是对暂时情况的反应 。 \n  国际疾病分类第 10 版（icd-10）将 odd 归类为品行障碍的轻度形式 。据估计，高达 60% 的 odd 患者将发展为品行障碍。 \n  在早期阶段治疗是必要的，以防止其发展为更严重的品行障碍（最重要的）、精神健康障碍或犯罪行为 。治疗需要行为治疗、家庭治疗和偶尔药物的组合。 \n 在 50% 以上的 adhd 患者中，odd 也是临床表现的一部分。有强有力证据表明 odd 和 adhd 重叠，许多用于治疗 adhd 的药物也可能对 odd 治疗有效。一些研究报告了兴奋剂或阿托莫西汀在治疗与 adhd 共病的 odd 中的积极作用。 有严重攻击行为的 odd 和品行障碍患者可能对利培酮反应良好，伴或不伴兴奋剂 。 \n 情绪调节剂、α2 激动剂和抗抑郁药也可能在 odd 及其共病治疗中具有二线作用。 \n  在所给选项中，利培酮是唯一在考虑药物治疗时可以使用的选项 。 \n 情绪稳定剂如丙戊酸钠（选项 b）或奥氮平（选项 a），以及抗抑郁药如 ssris（选项 c）是二线选择。 \n  没有证据支持卡马西平（选项 e）作为 odd 的药物治疗 。 "}, {"id": "AMC-Q1286", "type": "mcq", "qid": 1286, "title": "AMC-Q1286 — Encopresis in a 7-year-old girl", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Mental-Health", "approach": [], "topic": ["遗粪症 — 鉴别诊断"], "difficulty": 3, "correctAnswer": "B", "page": 1350, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Mental-Health/AMC-Q1286-Encopresis-ODD.md", "stem": "<p>The parents of a 7-year-old girl have brought her to you for assessment because she frequently soils her underwear. In the past 2 months, they have received calls from her school about her problems there. She is easily irritated and becomes angry and aggressive with her classmates and other children at school. At home, they found her soiled underwear hidden. She becomes angry, cries, and fights with her older brother when he calls her 'smelly'. This happens several times a week. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Conduct disorder"}, {"letter": "B", "text": "Oppositional defiant disorder"}, {"letter": "C", "text": "Regression"}, {"letter": "D", "text": "Delayed developmental milestones"}, {"letter": "E", "text": "Depression"}], "rationale": "<ul>\n<li>临床表现：</li>\n<li>反复遗粪（内衣污染）+ 隐藏污物 + 易激惹 + 攻击行为 + 生气</li>\n<li><strong>无暴力、严重违法、破坏行为</strong> → <strong>不是品行障碍</strong></li>\n<li>攻击、违拗、敌对 ≥ 6 个月（虽题目未明确时长，但模式符合）</li>\n<li>遗粪症分两型：</li>\n<li><strong>便秘 + 溢出型</strong>（多见）：治疗便秘即可</li>\n<li><strong>无便秘型</strong>（少见）：常与 <strong>ODD/品行障碍</strong> 共病</li>\n<li>关键鉴别：</li>\n<li>A（品行障碍）：<strong>无严重违法/破坏/残忍</strong> → 不支持</li>\n<li>C（退行）：无近期应激事件（如亲人离世、性虐待）</li>\n<li>D（发育迟滞）：其他发育里程碑正常</li>\n<li>E（抑郁）：无情绪低落、睡眠食欲改变</li>\n</ul>", "traps": "<ul>\n<li>选 A（品行障碍）— 缺少严重违法/动物残忍</li>\n<li>选 C（退行）— 没有近期应激源</li>\n<li>选 E（抑郁）— 没有抑郁核心症状</li>\n</ul>", "summary": "<p><strong>遗粪症（Encopresis）分型</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>特征</th><th>治疗</th></tr></thead>\n<tbody>\n<tr><td><strong>便秘 + 溢出型</strong>（多见）</td><td>< 3 次/周排便，粪泄漏</td><td>通便 + 行为治疗</td></tr>\n<tr><td><strong>无便秘型</strong>（少见）</td><td>粪质正常，间歇性污粪</td><td>处理 ODD/CD 基础病</td></tr>\n</tbody>\n</table>\n<p><strong>遗粪症流行病学</strong>：</p>\n<ul>\n<li>1-4% 学龄儿童</li>\n<li>男 > 女</li>\n<li>3% 精神科患儿合并</li>\n</ul>\n<p><strong>警示</strong>：<strong>无便秘型遗粪 = 警惕 ODD/CD 等精神共病</strong>，需治疗基础精神疾病。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>该场景提示遗粪症。然而，该诊断的完整诊断标准不确定（场景中缺乏症状的频率和持续时间）。</p>\n<p><strong>遗粪症是指 4 岁以上儿童每月超过一次将成形、半成形或液体粪便排到厕所以外的地方，持续至少 3 个月</strong>。如果儿童从未有控制能力，该病称为原发性遗粪症，而继发性遗粪症是以前有控制能力的儿童的大便失禁。<strong>遗粪症报告见于 1-4% 的学龄儿童</strong>。<strong>遗粪症在男孩中比女孩更常见</strong>。</p>\n<p>遗粪症有两种不同类型：</p>\n<p><strong>伴便秘和溢出性失禁</strong>：伴便秘和溢出性失禁类型的儿童每周排便少于 3 次。由于便秘，每次排便时只有部分总粪便被排空。其余粪便的一部分漏出，通常在儿童日常活动中发生。一旦便秘解决，遗粪症通常不再存在。</p>\n<p><strong>不伴便秘和溢出性失禁</strong>：在此类型中，无便秘，儿童粪便稠度正常。与便秘和溢出相关的病例不同，此类型的污粪是间歇性的。粪便可能排放到显著位置（例如作为对抗行为），或者是肛门自我刺激（例如各种形式的自慰）的无意结果。<strong>不伴便秘和溢出性失禁的遗粪症比第一种类型的遗粪症少见，且常与对立违抗性障碍和品行障碍相关</strong>。据估计，3% 的有精神问题的儿童可能有遗粪症。</p>\n<p><strong>具有攻击性、愤怒爆发以及易怒和易激惹，对立违抗性障碍是遗粪症和该诊断的最可能的根本原因</strong>。<strong>该女孩没有暴力、严重违法或破坏行为的历史，提示品行障碍（选项 A）</strong>。</p>\n<ul>\n<li>（选项 C）退行是一种防御机制，其特征是个性退回到较早的发展阶段并采取更幼稚的姿态。在儿童中，退行表现为回到他们已经长大的行为。想要奶瓶或奶嘴、发脾气、抱怨、攻击、吮拇指和婴儿语都是例子。遗尿（尿床）或遗粪症可能发生。<strong>退行通常由应激性生活事件触发，如丧亲、父母分离或性虐待</strong>。在缺乏这种病史的情况下，退行作为诊断不太可能。此外，该儿童的行为模式更符合对立违抗性障碍。</li>\n<li>（选项 E）遗粪症不太可能是由一个在其他发育里程碑上已完成的女孩的发育迟缓引起的。</li>\n<li>（选项 E）抑郁和遗粪症之间没有强相关性。此外，没有其他症状如情绪低落、悲伤或睡眠模式和食欲改变提示抑郁作为诊断。</li>\n</ul>", "references": "<ul>\n<li>Mental Help - Elimination Disorders: Encopresis</li>\n<li>Science Direct - Encopresis</li>\n</ul>", "related": ["AMC-Q1274-ODD-Risperidone"], "bodyHtml": "", "diseases": ["Encopresis"], "complaints": ["encopresis symptom"], "search": "amc-q1286 — encopresis in a 7-year-old girl\n遗粪症 — 鉴别诊断\n the parents of a 7-year-old girl have brought her to you for assessment because she frequently soils her underwear. in the past 2 months, they have received calls from her school about her problems there. she is easily irritated and becomes angry and aggressive with her classmates and other children at school. at home, they found her soiled underwear hidden. she becomes angry, cries, and fights with her older brother when he calls her 'smelly'. this happens several times a week. which one of the following is the most likely diagnosis? \n correct answer is  b  \n 该场景提示遗粪症。然而，该诊断的完整诊断标准不确定（场景中缺乏症状的频率和持续时间）。 \n  遗粪症是指 4 岁以上儿童每月超过一次将成形、半成形或液体粪便排到厕所以外的地方，持续至少 3 个月 。如果儿童从未有控制能力，该病称为原发性遗粪症，而继发性遗粪症是以前有控制能力的儿童的大便失禁。 遗粪症报告见于 1-4% 的学龄儿童 。 遗粪症在男孩中比女孩更常见 。 \n 遗粪症有两种不同类型： \n  伴便秘和溢出性失禁 ：伴便秘和溢出性失禁类型的儿童每周排便少于 3 次。由于便秘，每次排便时只有部分总粪便被排空。其余粪便的一部分漏出，通常在儿童日常活动中发生。一旦便秘解决，遗粪症通常不再存在。 \n  不伴便秘和溢出性失禁 ：在此类型中，无便秘，儿童粪便稠度正常。与便秘和溢出相关的病例不同，此类型的污粪是间歇性的。粪便可能排放到显著位置（例如作为对抗行为），或者是肛门自我刺激（例如各种形式的自慰）的无意结果。 不伴便秘和溢出性失禁的遗粪症比第一种类型的遗粪症少见，且常与对立违抗性障碍和品行障碍相关 。据估计，3% 的有精神问题的儿童可能有遗粪症。 \n  具有攻击性、愤怒爆发以及易怒和易激惹，对立违抗性障碍是遗粪症和该诊断的最可能的根本原因 。 该女孩没有暴力、严重违法或破坏行为的历史，提示品行障碍（选项 a） 。 \n \n （选项 c）退行是一种防御机制，其特征是个性退回到较早的发展阶段并采取更幼稚的姿态。在儿童中，退行表现为回到他们已经长大的行为。想要奶瓶或奶嘴、发脾气、抱怨、攻击、吮拇指和婴儿语都是例子。遗尿（尿床）或遗粪症可能发生。 退行通常由应激性生活事件触发，如丧亲、父母分离或性虐待 。在缺乏这种病史的情况下，退行作为诊断不太可能。此外，该儿童的行为模式更符合对立违抗性障碍。 \n （选项 e）遗粪症不太可能是由一个在其他发育里程碑上已完成的女孩的发育迟缓引起的。 \n （选项 e）抑郁和遗粪症之间没有强相关性。此外，没有其他症状如情绪低落、悲伤或睡眠模式和食欲改变提示抑郁作为诊断。 \n "}, {"id": "AMC-Q1300", "type": "mcq", "qid": 1300, "title": "自闭症谱系障碍 — 三联征诊断", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Mental-Health", "approach": [], "topic": ["自闭症谱系障碍 — 社交 + 沟通 + 刻板行为 三联征"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Mental-Health/AMC-Q1300-Autism-Diagnosis.md", "stem": "<p>A five-year-old boy is brought for evaluation by his parents concerning unusual behavior. He loves Popeye cartoon and always remembers when it is shown on TV. At that time he turns on the TV. He becomes distraught and irritated if he misses the cartoon. He has a goldfish and spends several hours staring at it with curiosity and fascination. His favorite toy is wooden building blocks that he uses to make towers, break them and build them again. He did not say his first word until the age of 2.5 years and could not use a communicative phrase at the age of 3 years. He does not play with his peers and is not interested in making friends. During the examination, he adamantly avoids eye contact. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Asperger syndrome."}, {"letter": "B", "text": "Autism."}, {"letter": "C", "text": "Mental retardation."}, {"letter": "D", "text": "Delayed developmental milestones."}, {"letter": "E", "text": "Obsessive-compulsive disorder."}], "rationale": "<p>1. 题型识别：诊断 — 儿童行为/发育异常的精神科鉴别 2. 关键线索（三联征均在 ≤3 岁前出现）：</p>\n<ul>\n<li><strong>社交损害</strong>：不跟同龄人玩、没兴趣交朋友、坚决回避目光接触</li>\n<li><strong>沟通损害</strong>：2.5 岁才会说第一个词、3 岁不能用沟通性短语</li>\n<li><strong>限制性/重复性行为</strong>：Popeye 仪式性观看、金鱼长时间凝视、积木重复塔→推到→再塔</li>\n<p>3. 鉴别排除：</p>\n<li>Asperger（A）：<strong>语言发育正常</strong>，此患儿有明显语言延迟 → 排除</li>\n<li>智力障碍（C）/ 发育延迟（D）：是特征/条件而非诊断</li>\n<li>OCD（E）：有仪式性行为但无语言延迟和社交损害 → 排除</li>\n<p>4. 锁定答案：典型自闭症三联征 → B</p>\n</ul>", "traps": "<ul>\n<li><strong>Asperger 陷阱</strong>：Asperger（高功能自闭症）与典型自闭症最关键的鉴别点是<strong>语言发育正常</strong>。此患儿 2.5 岁才会说第一个词 → 排除 Asperger</li>\n<li><strong>OCD 陷阱</strong>：仪式性行为可见于 OCD，但 OCD 不伴有语言延迟和社交损害</li>\n<li><strong>\"delay\" vs \"impairment\"</strong>：自闭症是语言<strong>损害</strong>（impaired）而非<strong>延迟</strong>（delayed）；delay 暗示将来会追上，自闭症不会</li>\n</ul>", "summary": "<p>自闭症诊断<strong>三联征</strong>（3 岁前出现）： 1. <strong>社交互动质量损害</strong>（≥2 项）：缺乏对他人感受的觉察 / 缺乏模仿 / 异常社交游戏 / 回避目光接触 / 缺乏交友能力 2. <strong>沟通损害</strong>（≥1 项）：咿呀学语缺失 / 非语言交流异常 / 言语形式或内容异常 / 无法维持对话 3. <strong>限制性/重复性行为</strong>（≥1 项）：刻板动作 / 持久不寻常的专注和仪式 / 对环境变化极度痛苦 / 缺乏想象性游戏</p>\n<p>行为问题：发脾气、多动、破坏性、冒险行为。</p>\n<p>发病率：至少 4/10000，男:女 = 4:1。约 30% 自闭症患儿智力正常。</p>", "explanation": "<p>该患儿表现出典型的自闭症障碍特征：</p>\n<ul>\n<li>持续的仪式性行为和执着（看 Popeye 动画片、积木和金鱼）</li>\n<li>语言发育延迟（2.5 岁说第一个词）</li>\n<li>社交沟通障碍（不跟同龄人玩、回避目光接触）</li>\n</ul>\n<p>Asperger 综合征（高功能自闭症）虽然与自闭症共享许多特征，但 Asperger 患儿的<strong>语言发育和智力正常</strong>。本患儿有明显的语言发育延迟，因此 Asperger 可排除。</p>\n<p>智力障碍和发育延迟是自闭症中常见的特征/条件，而非独立诊断。OCD 虽然有仪式性行为模式，但不伴有本患儿呈现的语言延迟、刻板行为和社交沟通障碍。</p>", "references": "<ul>\n<li>Medscape - Autism Spectrum Disorder</li>\n<li>UpToDate - Autism spectrum disorder: Evaluation and diagnosis</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "自闭症谱系障碍 — 三联征诊断\n自闭症谱系障碍 — 社交 + 沟通 + 刻板行为 三联征\n a five-year-old boy is brought for evaluation by his parents concerning unusual behavior. he loves popeye cartoon and always remembers when it is shown on tv. at that time he turns on the tv. he becomes distraught and irritated if he misses the cartoon. he has a goldfish and spends several hours staring at it with curiosity and fascination. his favorite toy is wooden building blocks that he uses to make towers, break them and build them again. he did not say his first word until the age of 2.5 years and could not use a communicative phrase at the age of 3 years. he does not play with his peers and is not interested in making friends. during the examination, he adamantly avoids eye contact. which one of the following is the most likely diagnosis? \n 该患儿表现出典型的自闭症障碍特征： \n \n 持续的仪式性行为和执着（看 popeye 动画片、积木和金鱼） \n 语言发育延迟（2.5 岁说第一个词） \n 社交沟通障碍（不跟同龄人玩、回避目光接触） \n \n asperger 综合征（高功能自闭症）虽然与自闭症共享许多特征，但 asperger 患儿的 语言发育和智力正常 。本患儿有明显的语言发育延迟，因此 asperger 可排除。 \n 智力障碍和发育延迟是自闭症中常见的特征/条件，而非独立诊断。ocd 虽然有仪式性行为模式，但不伴有本患儿呈现的语言延迟、刻板行为和社交沟通障碍。 "}, {"id": "AMC-Q0111", "type": "mcq", "qid": 111, "title": "纯母乳喂养儿 — 最易缺的是维生素 K（出生时肌注预防）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Neonatology", "approach": ["diagnosis", "prevention"], "topic": ["Vitamin K Deficiency", "Breastfeeding", "Newborn", "IM at birth"], "difficulty": 2, "correctAnswer": "E", "page": 1309, "tags": ["mcq", "amc", "paediatrics", "neonatology", "vitamin-k", "breastfeeding", "newborn", "hemorrhagic-disease-of-newborn", "approach-diagnosis", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Neonatology/AMC-Q0111-Vitamin-K-Deficiency.md", "stem": "<p>A fully breast-fed baby of a mother on a healthy, balanced diet could have the deficiency of which one of the following vitamins?</p>", "options": [{"letter": "A", "text": "Vitamin A."}, {"letter": "B", "text": "Vitamin B complex."}, {"letter": "C", "text": "Vitamin C."}, {"letter": "D", "text": "Vitamin D."}, {"letter": "E", "text": "Vitamin K."}], "rationale": "<p>1. <strong>题型识别</strong>：纯母乳喂养儿\"最可能缺哪种维生素\" → 考母乳营养成分短板。 2. <strong>母乳 Vit K 不足</strong>：母乳 Vit K 含量低；足月儿肠道菌群未建立、自身合成少 → 需出生时肌注。 3. <strong>其他维生素</strong>：A、B 族、C、D 在健康母乳中通常充足（Vit D 也偏低但非本题答案；题目强调\"出生时肌注\"的语境指向 K）。 4. <strong>不补的后果</strong>：Vit K 缺乏 → 晚发/早发出血，尤其是<strong>颅内出血</strong>；早产儿、母用抗癫痫药者更高危。 5. <strong>锁定 E</strong>。</p>", "traps": "<ul>\n<li><strong>\"母乳最缺 Vit D\"陷阱</strong>：Vit D 也偏低，但本题考点是\"出生时肌注预防出血\" → K。</li>\n<li><strong>忽略肌注语境</strong>：题干\"as this vitamin is given intramuscularly at birth\"暗示 K（新生儿常规肌注 Vit K）。</li>\n<li><strong>Vit C/B 充足</strong>：母乳喂养通常充足，非缺乏项。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Breast milk lacks or has insufficient vitamin K, but as this vitamin is given intramuscularly at birth, there is no more need for supplementation. Without supplementation at birth, the baby may suffer vitamin K deficiency and develop severe complications such as intracranial hemorrhage. Vitamin K deficiency is more common among premature babies and those whose mothers have been on antiepileptic drugs.</p>", "references": "<ul>\n<li>PubMed - Are breastfed infants vitamin K deficient?</li>\n</ul>", "related": ["AMC-Q1331-Breastfeeding-Failure-Frequency", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Vitamin K Deficiency", "Breastfeeding Issues"], "complaints": [], "search": "纯母乳喂养儿 — 最易缺的是维生素 k（出生时肌注预防）\nvitamin k deficiency breastfeeding newborn im at birth\ndiagnosis prevention\n a fully breast-fed baby of a mother on a healthy, balanced diet could have the deficiency of which one of the following vitamins? \n correct answer is  e  \n breast milk lacks or has insufficient vitamin k, but as this vitamin is given intramuscularly at birth, there is no more need for supplementation. without supplementation at birth, the baby may suffer vitamin k deficiency and develop severe complications such as intracranial hemorrhage. vitamin k deficiency is more common among premature babies and those whose mothers have been on antiepileptic drugs. "}, {"id": "AMC-Q0996", "type": "mcq", "qid": 996, "title": "AMC-Q0996 — Most common cause of failure to breastfeed", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Neonatology", "approach": [], "topic": ["母乳喂养失败"], "difficulty": 2, "correctAnswer": "B", "page": 1331, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Neonatology/AMC-Q0996-Breastfeeding-Failure-Frequency.md", "stem": "<p>Which one of the following is the most common cause of failure to breastfeed?</p>", "options": [{"letter": "A", "text": "Exhaustion of the mother"}, {"letter": "B", "text": "Reduced frequency of breastfeeding"}, {"letter": "C", "text": "A reduction in the time the baby feeds at each session"}, {"letter": "D", "text": "Maternal dehydration"}, {"letter": "E", "text": "Nipple problems"}], "rationale": "<ul>\n<li>母乳喂养推荐纯母乳 6 个月（EBF6），许多母亲在 6 个月前就停止</li>\n<li>停止最常见的原因是 <strong>\"奶水不足\"</strong> 感或摄入不足</li>\n<li><strong>奶水摄入不足的最常见原因是不恰当的早期喂养习惯</strong>：</li>\n<li>喂奶不频繁</li>\n<li>含乳不良</li>\n<li>母婴分离</li>\n<li>使用配方奶补充</li>\n<li>频率不足 → 乳汁产量下降 → 形成恶性循环</li>\n<li>母体疲惫（A）会间接导致频率下降；减少单次喂奶时间（C）影响较小；母体脱水（D）和乳头问题（E）较少见</li>\n</ul>", "traps": "<ul>\n<li>把\"母体疲惫\"或\"乳头问题\"误选为最常见 — 这些是次要原因</li>\n<li>真正的核心机制是 <strong>频率 → 泌乳量</strong> 的正反馈被打断</li>\n</ul>", "summary": "<table class='md-table'>\n<thead><tr><th>因素</th><th>角色</th></tr></thead>\n<tbody>\n<tr><td><strong>频率不足</strong></td><td><strong>最常见</strong>，破坏供需</td></tr>\n<tr><td>含乳不良</td><td>婴儿无法有效吸出</td></tr>\n<tr><td>母婴分离</td><td>同上</td></tr>\n<tr><td>配方奶补充</td><td>减少吸吮刺激</td></tr>\n<tr><td>母体疲惫</td><td>间接影响频率</td></tr>\n<tr><td>乳头问题</td><td>物理性，但较少见</td></tr>\n</tbody>\n</table>\n<p><strong>关键点</strong>：早开奶、勤吸吮 = 充足泌乳的黄金法则。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>母乳喂养对婴儿和母亲的好处已经得到充分证实。澳大利亚相关机构广泛采纳了纯母乳喂养 6 个月（EBF6）的推荐。</p>\n<p><strong>对婴儿的好处</strong>：增加疾病抵抗力，降低胃肠炎、复发性中耳炎、肺炎的发病率；降低 SIDS、结肠炎、高血压、肥胖、高脂血症、特应性疾病和糖尿病的发病率，IQ 更高。</p>\n<p><strong>对母亲的好处</strong>：排卵延迟，乳腺癌和卵巢癌风险降低，母乳喂养的亲密关系。</p>\n<p>对许多女性来说，母乳喂养的困难导致在推荐的 6 个月之前过早停止母乳喂养。</p>\n<p><strong>奶水摄入不足或对奶水产量不足的感知是过早停止母乳喂养的最常见原因</strong>。奶水摄入不足可能由于婴儿未能吸出乳汁或乳汁产量不足。</p>\n<p><strong>不恰当的早期喂养习惯是奶水摄入不足的最常见原因</strong>，包括：喂奶不频繁、含乳不良、母婴分离、使用配方奶补充。</p>\n<p>其他较不常见的原因包括婴儿的口部运动或神经异常以及乳房排空不良。</p>\n<p>在所给选项中，<strong>减少母乳喂养频率是乳汁产量下降的最常见原因</strong>。喂奶不频繁时，乳汁产量减少，导致母亲的乳汁产量和婴儿的摄入量都不足。</p>\n<ul>\n<li>（选项 A）母体疲惫可导致母乳喂养频率减少，最终导致泌乳失败。</li>\n<li>（选项 C）每次喂奶时含乳时间减少对乳汁产量的负面影响没有减少喂奶频率那么大。</li>\n<li>（选项 D）母体脱水可能与乳汁产量减少有关，但不如喂奶不频繁常见。</li>\n<li>（选项 E）乳头问题可妨碍适当和充分的母乳喂养，但喂奶不频繁仍是母乳喂养失败的最常见原因。</li>\n</ul>", "references": "<ul>\n<li>UpToDate - Common problems of breastfeeding and weaning</li>\n<li>Infant and Young Child Feeding</li>\n</ul>", "related": ["TR-Breastfeeding-Failure", "AMC-Q0111-Vitamin-K-Deficiency"], "bodyHtml": "", "diseases": ["Breastfeeding Issues"], "complaints": [], "search": "amc-q0996 — most common cause of failure to breastfeed\n母乳喂养失败\n which one of the following is the most common cause of failure to breastfeed? \n correct answer is  b  \n 母乳喂养对婴儿和母亲的好处已经得到充分证实。澳大利亚相关机构广泛采纳了纯母乳喂养 6 个月（ebf6）的推荐。 \n  对婴儿的好处 ：增加疾病抵抗力，降低胃肠炎、复发性中耳炎、肺炎的发病率；降低 sids、结肠炎、高血压、肥胖、高脂血症、特应性疾病和糖尿病的发病率，iq 更高。 \n  对母亲的好处 ：排卵延迟，乳腺癌和卵巢癌风险降低，母乳喂养的亲密关系。 \n 对许多女性来说，母乳喂养的困难导致在推荐的 6 个月之前过早停止母乳喂养。 \n  奶水摄入不足或对奶水产量不足的感知是过早停止母乳喂养的最常见原因 。奶水摄入不足可能由于婴儿未能吸出乳汁或乳汁产量不足。 \n  不恰当的早期喂养习惯是奶水摄入不足的最常见原因 ，包括：喂奶不频繁、含乳不良、母婴分离、使用配方奶补充。 \n 其他较不常见的原因包括婴儿的口部运动或神经异常以及乳房排空不良。 \n 在所给选项中， 减少母乳喂养频率是乳汁产量下降的最常见原因 。喂奶不频繁时，乳汁产量减少，导致母亲的乳汁产量和婴儿的摄入量都不足。 \n \n （选项 a）母体疲惫可导致母乳喂养频率减少，最终导致泌乳失败。 \n （选项 c）每次喂奶时含乳时间减少对乳汁产量的负面影响没有减少喂奶频率那么大。 \n （选项 d）母体脱水可能与乳汁产量减少有关，但不如喂奶不频繁常见。 \n （选项 e）乳头问题可妨碍适当和充分的母乳喂养，但喂奶不频繁仍是母乳喂养失败的最常见原因。 \n "}, {"id": "AMC-Q0115", "type": "mcq", "qid": 115, "title": "幼儿 UTI 的非特异性表现", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["幼儿 UTI 的非特异性表现 — 发热 + 腹痛 + 呕吐"], "difficulty": 2, "correctAnswer": "A", "page": 1358, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0115-Pediatric-UTI-Presentation.md", "stem": "<p>A 4-year-old girl is brought to you by her kindergarten teacher. She states that the child has not been well since this morning, vomited once, and complained of central abdominal pain. On examination, the child looks unwell and has a temperature of 39°C. Which one of the following would be most expected in this child?</p>", "options": [{"letter": "A", "text": "Numerous pus cells on urine microscopy."}, {"letter": "B", "text": "Inflamed ear drums."}, {"letter": "C", "text": "Neck stiffness."}, {"letter": "D", "text": "Inflamed tonsils."}, {"letter": "E", "text": "Localized tenderness over the right iliac fossa."}], "rationale": "<p>1. 题型识别：诊断 — 幼儿发热+腹痛的非特异性表现的鉴别 2. 关键线索：4 岁、今晨起病、呕吐 1 次、中央腹痛、T 39°C、看起来不适 3. 鉴别排除：</p>\n<ul>\n<li>中耳炎（B）：不伴腹痛 → 排除</li>\n<li>脑膜炎（C）：颈强直可伴发热和不适，但腹痛不典型 → 不太可能</li>\n<li>扁桃体炎（D）：不伴腹痛 → 排除</li>\n<li>阑尾炎（E）：中央腹痛→转移至右髂窝、呕吐，但 39°C 高热除非穿孔。今晨起病时间太短，不可能穿孔 → 排除</li>\n<p>4. 锁定答案：非特异表现 + 高热 → 幼儿 UTI（尿检大量白细胞）→ A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"UTI 必须有尿路症状\"陷阱</strong>：年龄越小，UTI 症状越模糊和非特异性。幼儿可以仅表现为发热、呕吐、腹痛</li>\n<li><strong>阑尾炎高热陷阱</strong>：单纯阑尾炎不常引起 39°C 高热；高热提示穿孔，但起病仅数小时不可能穿孔</li>\n<li><strong>腹痛 + 发热的鉴别陷阱</strong>：中耳炎/扁桃体炎引起发热但不伴腹痛；阑尾炎/UTI 两者均可，但高热 + 非特异性表现偏向 UTI</li>\n</ul>", "summary": "<p>幼儿 UTI 的表现特征：<strong>年龄越小，症状越非特异</strong>。幼儿可不出现典型尿频/尿急/排尿困难，而是以发热、呕吐、腹痛等非特异表现为主。对此类患儿，尿检大量白细胞是最常见和最预期的发现。</p>", "explanation": "<p>幼儿发生 UTI 时不出现典型泌尿系统症状（尿频、尿急、排尿困难）并不罕见。事实上，<strong>年龄越小，症状越模糊和非特异</strong>。</p>\n<ul>\n<li><strong>中耳炎</strong>：鼓膜充血，但不伴有腹痛</li>\n<li><strong>脑膜炎</strong>：可出现颈强直，伴发热和不适，但腹痛不典型</li>\n<li><strong>扁桃体炎</strong>：可致患儿不适和发热，但不引起腹痛</li>\n<li><strong>阑尾炎</strong>：中央腹痛、呕吐和右髂窝压痛，但不常引起 39°C 高热（除非穿孔）。今晨起病，此时间不足以发生穿孔</li>\n</ul>\n<p>因此，此患儿最可能的病因是 UTI，尿检预期发现大量白细胞（脓细胞）。</p>", "references": "<ul>\n<li>RCH - Urinary tract infection</li>\n<li>Medscape - Pediatric Urinary Tract Infection</li>\n</ul>", "related": ["AMC-Q1296-DMSA-Renal-Scarring", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain"], "search": "幼儿 uti 的非特异性表现\n幼儿 uti 的非特异性表现 — 发热 + 腹痛 + 呕吐\n a 4-year-old girl is brought to you by her kindergarten teacher. she states that the child has not been well since this morning, vomited once, and complained of central abdominal pain. on examination, the child looks unwell and has a temperature of 39°c. which one of the following would be most expected in this child? \n 幼儿发生 uti 时不出现典型泌尿系统症状（尿频、尿急、排尿困难）并不罕见。事实上， 年龄越小，症状越模糊和非特异 。 \n \n  中耳炎 ：鼓膜充血，但不伴有腹痛 \n  脑膜炎 ：可出现颈强直，伴发热和不适，但腹痛不典型 \n  扁桃体炎 ：可致患儿不适和发热，但不引起腹痛 \n  阑尾炎 ：中央腹痛、呕吐和右髂窝压痛，但不常引起 39°c 高热（除非穿孔）。今晨起病，此时间不足以发生穿孔 \n \n 因此，此患儿最可能的病因是 uti，尿检预期发现大量白细胞（脓细胞）。 "}, {"id": "AMC-Q0116", "type": "mcq", "qid": 116, "title": "儿童 UTI 住院指征 — <2 月龄必须住院", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["儿童 UTI 住院指征 — <2 月龄婴儿"], "difficulty": 2, "correctAnswer": "D", "page": 1378, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0116-UTI-Hospital-Admission.md", "stem": "<p>For which one of the following children with urinary tract infection (UTI) hospital admission is indicated?</p>", "options": [{"letter": "A", "text": "An infant younger than 12 months of age."}, {"letter": "B", "text": "A 6-year old male child with family history of urinary tract infection."}, {"letter": "C", "text": "A 5-year old female child with family history of urinary tract infection."}, {"letter": "D", "text": "An infant younger than 2 months of age."}, {"letter": "E", "text": "A 2-year old child with allergy to penicillin."}], "rationale": "<p>1. 题型识别：管理决策 — UTI 住院 vs 门诊治疗 2. 核心规则：RCH 指南 — <strong><2 月龄</strong>发热性 UTI 婴儿必须收入院 3. 排除选项：</p>\n<ul>\n<li><12 月龄（A）：太大，不是所有 <12 月龄都需要住院</li>\n<li>家族史（B/C）：不构成住院指征</li>\n<li>青霉素过敏（E）：可以换用替代抗生素，不构成住院指征</li>\n<p>4. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong><12 月龄 vs <2 月龄</strong>：A（<12 月龄）和 D（<2 月龄）之间选更严格的阈值。RCH 指南的关键年龄切点是 <strong>2 个月</strong>而非 12 个月</li>\n<li><strong>家族史 ≠ 住院指征</strong>：B/C 虽有 UTI 家族史，但这不影响住院决策</li>\n<li><strong>青霉素过敏 ≠ 住院指征</strong>：可换用替代口服/静脉抗生素</li>\n</ul>", "summary": "<p>RCH 儿童 UTI 住院指征：</p>\n<ul>\n<li><strong><2 月龄</strong>发热性 UTI → 必须住院</li>\n<li>其他住院考虑因素：临床中毒表现、无法耐受口服、复杂性 UTI、免疫功能低下</li>\n</ul>", "explanation": "<p>根据皇家儿童医院（RCH）指南，以下 UTI 患儿应收入院：</p>\n<ul>\n<li>临床中毒或败血症表现</li>\n<li><strong><2 月龄</strong>发热性 UTI 婴儿</li>\n<li>免疫功能低下</li>\n<li>呕吐/无法耐受口服抗生素</li>\n<li>无可靠的随访条件</li>\n</ul>", "references": "<ul>\n<li>RCH - Urinary tract infection</li>\n<li>Medscape
