inent on the right side and is felt in the thighs behind the knee and in the calves. The pain occurs intermittently and more often in late evening and in the night and sometimes wakes him up. Caleb had an upper respiratory tract infection 10 days ago presenting with sore throat, mild fever and runny nose. He is otherwise healthy and has had no serious medical problem to date. His vaccination is up to date. On physical examination, the only remarkable finding is mildly-tender cervical lymphadenopathy. Hip, knee, and ankle joints of the right leg are normal with no swelling, warmth, or tenderness, and have preserved range of motion. He walks normally without limp. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Perthes disease."}, {"letter": "B", "text": "Slipped capital femoral epiphysis (SCFE)."}, {"letter": "C", "text": "Growing pains."}, {"letter": "D", "text": "Transient tenosynovitis."}, {"letter": "E", "text": "Septic arthritis of the hip."}], "rationale": "<p>1. 题型识别：诊断 — 儿童下肢痛的鉴别 2. 关键线索（典型生长痛）：</p>\n<ul>\n<li>7 岁（2-12 岁好发，学龄前高峰）</li>\n<li><strong>双侧</strong>（80% 双侧）</li>\n<li>部位：大腿、小腿、膝后</li>\n<li><strong>间歇性</strong>、傍晚/夜间加重、可夜间痛醒</li>\n<li><strong>体格检查正常</strong>：关节无肿胀/发热/压痛、ROM 保留、无跛行</li>\n<p>3. 鉴别排除：</p>\n<li>Perthes 病（A）：持续性髋痛 + 跛行 + ROM 受限 → 本患儿正常</li>\n<li>SCFE（B）：10-14 岁肥胖男孩、跛行 + 髋 ROM 受限 → 不符</li>\n<li>一过性滑膜炎（D）：跛行 + 髋 ROM 轻度受限（尤内旋）→ 正常 ROM + 无跛行排除</li>\n<li>化脓性关节炎（E）：中毒貌 + 发热 + ROM 受限 + 拒绝负重 → 排除</li>\n<p>4. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>URTI 史诱导向一过性滑膜炎</strong>：前驱病毒感染 1-2 周是一过性滑膜炎的典型特征，但本患儿<strong>无跛行 + ROM 正常</strong>可排除</li>\n<li><strong>疼痛 ≠ 关节病变</strong>：生长痛的疼痛在肌肉而非关节，体格检查正常</li>\n<li><strong>\"单侧 20% 也可为生长痛\"但需警惕</strong>：双侧更典型；单侧时应优先排除其他诊断</li>\n</ul>", "summary": "<p><strong>生长痛（Growing Pains）</strong>：</p>\n<ul>\n<li>发病率：2-12 岁儿童的 20-30%，学龄前为高峰</li>\n<li>病因：与过度体力活动相关（非真正的\"生长\"所致）</li>\n<li>本质：<strong>排除性诊断</strong></li>\n<li>诊断标准：无全身症状（发热/乏力/食欲改变）、无关节体征（肿胀/压痛/发热/发红）、无病史或体检提示其他病因</li>\n<li>疼痛特征：大腿/小腿/膝后、间歇性、傍晚/夜间、晨起消失、80% 双侧</li>\n<li>治疗：保守（热敷、按摩、OTC 止痛药）</li>\n</ul>\n<p><strong>一过性滑膜炎（Transient tenosynovitis / Irritable hip）</strong>：</p>\n<ul>\n<li>学龄前儿童跛行最常见原因（3-8 岁）</li>\n<li>前驱病毒感染 1-2 周</li>\n<li>可带痛行走但 ROM（尤其<strong>内旋</strong>）轻度受限</li>\n<li>无发热</li>\n</ul>", "explanation": "<p>该患儿为典型生长痛表现：7 岁、双侧下肢痛（大腿/小腿/膝后）、间歇性、傍晚/夜间加重并可痛醒、体格检查正常、无跛行。</p>\n<p>Perthes 病表现为持续性髋痛 + 跛行 + ROM 受限。SCFE 多见于 10-14 岁肥胖男孩伴跛行和髋 ROM 受限。一过性滑膜炎虽有前驱病毒感染且年龄区间相符，但通常伴有跛行和髋内旋轻度受限，本患儿 ROM 正常 + 无跛行可排除。化脓性关节炎有中毒貌、发热、关节 ROM 受限和拒绝负重。</p>", "references": "<ul>\n<li>UpToDate – Growing pain</li>\n<li>Sports Health - Growing pains</li>\n<li>RCH - The limping or non-weight bearing child</li>\n</ul>", "related": ["AMC-Q1496-Perthes-Disease", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["leg pain/swelling", "fever", "limp"], "search": "生长痛 — 排除性诊断\n生长痛 — 双侧、间歇性、傍晚/夜间、正常体格检查\n caleb, 7 years old, is brought to your clinic by his mother with complaint of bilateral leg pain for the last couple of days. the pain is more prominent on the right side and is felt in the thighs behind the knee and in the calves. the pain occurs intermittently and more often in late evening and in the night and sometimes wakes him up. caleb had an upper respiratory tract infection 10 days ago presenting with sore throat, mild fever and runny nose. he is otherwise healthy and has had no serious medical problem to date. his vaccination is up to date. on physical examination, the only remarkable finding is mildly-tender cervical lymphadenopathy. hip, knee, and ankle joints of the right leg are normal with no swelling, warmth, or tenderness, and have preserved range of motion. he walks normally without limp. which one of the following could be the most likely diagnosis? \n 该患儿为典型生长痛表现：7 岁、双侧下肢痛（大腿/小腿/膝后）、间歇性、傍晚/夜间加重并可痛醒、体格检查正常、无跛行。 \n perthes 病表现为持续性髋痛 + 跛行 + rom 受限。scfe 多见于 10-14 岁肥胖男孩伴跛行和髋 rom 受限。一过性滑膜炎虽有前驱病毒感染且年龄区间相符，但通常伴有跛行和髋内旋轻度受限，本患儿 rom 正常 + 无跛行可排除。化脓性关节炎有中毒貌、发热、关节 rom 受限和拒绝负重。 "}, {"id": "AMC-Q0765", "type": "mcq", "qid": 765, "title": "儿童持续性（慢性）咳嗽 — 最常见原因是哮喘", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["diagnosis", "differential"], "topic": ["Chronic Cough", "Children", "Asthma", "Differential"], "difficulty": 2, "correctAnswer": "B", "page": 1310, "tags": ["mcq", "amc", "paediatrics", "respiratory", "chronic-cough", "asthma", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q0765-Persistent-Cough-Children.md", "stem": "<p>Which one of the following is the most common cause of persistent cough in children?</p>", "options": [{"letter": "A", "text": "Post-viral cough."}, {"letter": "B", "text": "Asthma."}, {"letter": "C", "text": "Post-pertussis."}, {"letter": "D", "text": "Gastro-esophageal reflux disease (GERD)."}, {"letter": "E", "text": "Passive smoking."}], "rationale": "<p>1. <strong>题型识别</strong>：\"儿童持续性咳嗽最常见原因\" → 考咳嗽病程分层 + 各层最常见病因。 2. <strong>病程定义</strong>：</p>\n<ul>\n<li>急性：<3 周</li>\n<li>亚急性：3–8 周</li>\n<li>慢性/持续性：>8 周</li>\n<p>3. <strong>哮喘</strong>：儿童慢性咳嗽<strong>最常见</strong>；成人中仅次于慢性支气管炎。 4. <strong>Post-viral cough</strong>：儿童<strong>急性/亚急性</strong>（非慢性）咳嗽最常见。 5. <strong>其他儿童慢性咳嗽原因</strong>：持续性细菌性支气管炎、慢性化脓性肺病/支扩、异物、GERD、上呼吸道咳嗽综合征（旧称鼻后滴漏）、post-pertussis、咳嗽受体高敏、习惯性（心因性）咳嗽、耳源性咳嗽。 6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"post-viral 最常见\"陷阱</strong>：它是急性/亚急性最常见，不是慢性。</li>\n<li><strong>把\"persistent\"等同于\"急性\"</strong>：persistent = 慢性（>8 周）→ 哮喘。</li>\n<li><strong>GERD/被动吸烟</strong>：是原因但不最常见。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>By duration, cough is defined as acute (<3 weeks), subacute (3-8 weeks) and chronic or persistent (>8 weeks). Asthma is the most common cause of persistent (chronic) cough in children and the second most common cause in adults (after chronic bronchitis). Post-viral cough is the most common cause of acute and subacute (not chronic) cough in children.</p>\n<p>Other causes of persistent cough in children: persistent bacterial bronchitis, chronic suppurative lung disease and bronchiectasis, foreign body, GERD, upper respiratory cough syndrome (postnasal drip), post-pertussis cough, increased cough receptor sensitivity, habit (psychogenic) cough, otogenic cough.</p>", "references": "<ul>\n<li>UpToDate - Causes of chronic cough in children</li>\n<li>UpToDate - Evaluation of subacute and chronic cough in adults</li>\n<li>Murtagh's General Practice – 6th Edition – page 469</li>\n</ul>", "related": ["AMC-Q1312-Croup-Oral-Steroids", "AMC-Q1329-Wheezing-Child-Admit", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Childhood Asthma"], "complaints": ["cough"], "search": "儿童持续性（慢性）咳嗽 — 最常见原因是哮喘\nchronic cough children asthma differential\ndiagnosis differential\n which one of the following is the most common cause of persistent cough in children? \n correct answer is  b  \n by duration, cough is defined as acute ( 8 weeks). asthma is the most common cause of persistent (chronic) cough in children and the second most common cause in adults (after chronic bronchitis). post-viral cough is the most common cause of acute and subacute (not chronic) cough in children. \n other causes of persistent cough in children: persistent bacterial bronchitis, chronic suppurative lung disease and bronchiectasis, foreign body, gerd, upper respiratory cough syndrome (postnasal drip), post-pertussis cough, increased cough receptor sensitivity, habit (psychogenic) cough, otogenic cough. "}, {"id": "AMC-Q0856", "type": "mcq", "qid": 856, "title": "Croup（中度）— 首选单剂口服激素（地塞米松/泼尼松龙）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["treatment", "diagnosis"], "topic": ["Croup", "Moderate Croup", "Oral Steroids", "Dexamethasone", "Prednisolone"], "difficulty": 3, "correctAnswer": "D", "page": 1312, "tags": ["mcq", "amc", "paediatrics", "respiratory", "croup", "stridor", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q0856-Croup-Oral-Steroids.md", "stem": "<p>A 2-year-old boy is brought to the Emergency Department at 11 pm with a harsh barking cough. He is febrile (39°C), RR 32/min, with inspiratory stridor and scattered crackles bilaterally. He is easily irritated but can be consoled by parents. Which is most important to give him first?</p>", "options": [{"letter": "A", "text": "Intravenous prednisolone."}, {"letter": "B", "text": "Nebulized adrenaline."}, {"letter": "C", "text": "Nebulized salbutamol."}, {"letter": "D", "text": "Oral steroids."}, {"letter": "E", "text": "Antibiotics."}], "rationale": "<p>1. <strong>题型识别</strong>：2 岁 + 犬吠样咳 + 吸气性喘鸣 + 发热 → croup（喉气管支气管炎）。 2. <strong>Croup 谱系</strong>：laryngitis / laryngotracheitis / laryngotracheobronchitis（经典 croup）/ bacterial tracheitis / spasmodic croup。最常见 6–36 月龄，副流感病毒 1 型最多。 3. <strong>严重度分层</strong>：</p>\n<ul>\n<li>轻度：安静时无误鸣，玩耍如常</li>\n<li>中度：安静时持续喘鸣、胸壁回缩、激惹但可安抚</li>\n<li>重度：疲倦、烦躁、意识障碍、发绀、弛缓</li>\n<p>4. <strong>本例</strong>：喘鸣 + 可安抚的激惹 → <strong>中度</strong>。 5. <strong>处理</strong>：</p>\n<li>中度–重度：单剂<strong>皮质激素</strong>。地塞米松 0.3 mg/kg 口服（一线）或泼尼松龙 1 mg/kg 口服或布地奈德 2 mg 雾化。</li>\n<li>重度/明显气道梗阻/疲劳：住院 + 肾上腺素 1% 雾化 + 地塞米松 0.6 mg/kg。</li>\n<p>6. <strong>选项排除</strong>：</p>\n<li>A（IV 激素）：croup 不常规 IV。</li>\n<li>B（雾化肾上腺素）：<strong>重度</strong>才用。</li>\n<li>C（沙丁胺醇）：croup 无效。</li>\n<li>E（抗生素）：仅细菌性气管炎时才用，气道优先。</li>\n<p>7. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"雾化肾上腺素首选\"陷阱</strong>：错。仅重度 croup 用；中度用口服激素。</li>\n<li><strong>\"沙丁胺醇治喘鸣\"陷阱</strong>：错。croup 是上气道梗阻，支气管舒张剂无效。</li>\n<li><strong>\"IV 激素\"陷阱</strong>：错。口服/经肠优先。</li>\n<li><strong>\"有 crackles = 下呼吸道 → 抗生素\"陷阱</strong>：错。croup 可延伸致下呼吸道体征；气道优先。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>Age, fever, harsh cough and especially stridor → croup until proven otherwise. Croup = laryngotracheobronchitis (viral, parainfluenza type 1 most common), seen 6–36 months.</p>\n<p>Severity: Mild (happy, no stridor at rest) / Moderate (stridor at rest, retractions, consolable) / Severe (exhausted, cyanosis, decreased LOC).</p>\n<p>Management: moderate–severe → single dose corticosteroid: dexamethasone 0.3 mg/kg PO (first-line), or prednisolone 1 mg/kg PO, or budesonide 2 mg neb. Severe/obstruction/fatigue → admit + nebulized adrenaline 0.05 ml/kg + dexamethasone 0.6 mg/kg.</p>\n<p>This child: stridor + irritable but consolable → moderate croup → oral dexamethasone/prednisolone. (A) IV steroids not indicated. (B) Adrenaline reserved for severe. (C) Bronchodilators no role. (E) Antibiotics only if bacterial tracheitis; airway first.</p>", "references": "<ul>\n<li>UpToDate - Croup: clinical features, evaluation and diagnosis</li>\n<li>RCH - Croup (Laryngotracheobronchitis)</li>\n</ul>", "related": ["AMC-Q0765-Persistent-Cough-Children", "AMC-Q1329-Wheezing-Child-Admit", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Croup"], "complaints": ["cough"], "search": "croup（中度）— 首选单剂口服激素（地塞米松/泼尼松龙）\ncroup moderate croup oral steroids dexamethasone prednisolone\ntreatment diagnosis\n a 2-year-old boy is brought to the emergency department at 11 pm with a harsh barking cough. he is febrile (39°c), rr 32/min, with inspiratory stridor and scattered crackles bilaterally. he is easily irritated but can be consoled by parents. which is most important to give him first? \n correct answer is  d  \n age, fever, harsh cough and especially stridor → croup until proven otherwise. croup = laryngotracheobronchitis (viral, parainfluenza type 1 most common), seen 6–36 months. \n severity: mild (happy, no stridor at rest) / moderate (stridor at rest, retractions, consolable) / severe (exhausted, cyanosis, decreased loc). \n management: moderate–severe → single dose corticosteroid: dexamethasone 0.3 mg/kg po (first-line), or prednisolone 1 mg/kg po, or budesonide 2 mg neb. severe/obstruction/fatigue → admit + nebulized adrenaline 0.05 ml/kg + dexamethasone 0.6 mg/kg. \n this child: stridor + irritable but consolable → moderate croup → oral dexamethasone/prednisolone. (a) iv steroids not indicated. (b) adrenaline reserved for severe. (c) bronchodilators no role. (e) antibiotics only if bacterial tracheitis; airway first. "}, {"id": "AMC-Q0980", "type": "mcq", "qid": 980, "title": "喘息儿童 — 先保证氧合（住院 + 给氧），再考虑沙丁胺醇", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["treatment", "diagnosis"], "topic": ["Wheezing Child", "Admit + Oxygen", "Asthma", "First episode"], "difficulty": 3, "correctAnswer": "C", "page": 1329, "tags": ["mcq", "amc", "paediatrics", "respiratory", "wheezing", "asthma", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q0980-Wheezing-Child-Admit.md", "stem": "<p>An 18-month boy with wheezing and cough starting 24h ago. RR 35/min. Bilateral wheeze, mildly diminished L chest breath sounds. FHx asthma + allergy. Most appropriate next step?</p>", "options": [{"letter": "A", "text": "Nebulized salbutamol 4-hourly."}, {"letter": "B", "text": "Amoxicillin."}, {"letter": "C", "text": "Admission and administration of oxygen."}, {"letter": "D", "text": "Chest physiotherapy."}, {"letter": "E", "text": "Chest X-ray (CXR)."}], "rationale": "<p>1. <strong>题型识别</strong>：18 月喘息 + 咳嗽 + 双侧喘鸣 + 左胸呼吸音减弱 + 哮喘/过敏家族史 → 考喘息处理顺序。 2. <strong>喘息线索</strong>：</p>\n<ul>\n<li>喂养相关 → 反流</li>\n<li>咳 + 喘 → 哮喘</li>\n<li>体位（仰卧）→ 喉软骨软化</li>\n<li>发热 → 感染</li>\n<li>突发单侧 → 异物</li>\n<p>3. <strong>哮喘</strong>：<5 岁阵发性喘息最常见（此龄避免确诊\"哮喘\"，用喘息综合征等）；本例家族史强。 4. <strong>但左胸呼吸音减弱</strong> → 疑肺/胸膜腔集合 → 需入院详查；<strong>氧合第一</strong>。 5. <strong>处理层次</strong>：</p>\n<li>先保证氧合（给氧 + 入院）。</li>\n<li>后沙丁胺醇试验（诊断+治疗兼顾，年龄小用雾化）。</li>\n<li>抗生素仅疑肺炎后；胸物理无效；CXR 用于不响应/反复喘息者。</li>\n<p>6. <strong>锁定 C</strong>（氧合优先，A 在其后）。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"喘息 = 立即沙丁胺醇\"陷阱</strong>：错。先保证氧合；bronchodilator 在氧合后。</li>\n<li><strong>\"左胸音弱 = 肺炎 → 抗生素\"陷阱</strong>：错。先评估氧合 + 鉴别（积液/异物），抗生素非首选。</li>\n<li><strong>\"CXR 必做\"陷阱</strong>：错。首程喘息疑哮喘可不做；用于不响应/反复。</li>\n<li><strong>\"胸物理\"陷阱</strong>：错。此时无价值。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Wheezing DDx: feeding→reflux, cough→asthma, positional→laryngomalacia, fever→infection, sudden unilateral→FB. Asthma = most common episodic wheezing <5yo (definite dx avoided at this age). This child: sudden bilateral wheeze + diminished L breath sounds (possible collection) → admit and investigate; adequate oxygenation comes first regardless of diagnosis. (A) Salbutamol trial after oxygenation (diagnostic + therapeutic; nebulized in this age). (B) Amoxicillin later if pneumonia. (D) Chest physio little value. (E) CXR if unresponsive/recurrent wheezing.</p>", "references": "<ul>\n<li>RACGP – AFP – The wheezing child: an algorithm</li>\n<li>AAFP - The Diagnosis of Wheezing in Children</li>\n</ul>", "related": ["TR-Wheezing-Child", "AMC-Q0856-Croup-Oral-Steroids", "AMC-Q0765-Persistent-Cough-Children", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Childhood Asthma"], "complaints": ["wheezing", "cough"], "search": "喘息儿童 — 先保证氧合（住院 + 给氧），再考虑沙丁胺醇\nwheezing child admit + oxygen asthma first episode\ntreatment diagnosis\n an 18-month boy with wheezing and cough starting 24h ago. rr 35/min. bilateral wheeze, mildly diminished l chest breath sounds. fhx asthma + allergy. most appropriate next step? \n correct answer is  c  \n wheezing ddx: feeding→reflux, cough→asthma, positional→laryngomalacia, fever→infection, sudden unilateral→fb. asthma = most common episodic wheezing  "}, {"id": "AMC-Q1548", "type": "mcq", "qid": 1548, "title": "幼儿咳嗽 + 喘息 — 病毒感染诱发的哮喘", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": [], "topic": ["幼儿咳嗽 + 喘息 — 病毒感染诱发喘息（哮喘）"], "difficulty": 3, "correctAnswer": "D", "page": 1385, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q1548-Toddler-Wheeze-Asthma.md", "stem": "<p>A 20-month-old male infant is brought to the Emergency Department, by his parents, with complaints of cough and shortness of breath. On examination, there is bilateral wheezing over lung fields on auscultation. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Bronchiolitis."}, {"letter": "B", "text": "Croup."}, {"letter": "C", "text": "Epiglottitis."}, {"letter": "D", "text": "Asthma."}, {"letter": "E", "text": "Foreign body aspiration."}], "rationale": "<p>1. 题型识别：诊断 — 幼儿急性喘息性疾病的鉴别 2. 关键线索：20 月龄、咳嗽 + 呼吸困难、双侧喘息 3. 幼儿喘息最常见病因：</p>\n<ul>\n<li>异物吸入</li>\n<li>病毒感染（= 病毒诱发喘息 / 哮喘）</li>\n<p>4. 鉴别排除：</p>\n<li>细支气管炎（A）：多见于 <12 月龄婴儿，喘息 + 湿啰音，RSV 最常见 → 20 月龄偏大</li>\n<li>Croup（B）：犬吠样咳嗽 + 吸气性喘鸣，不是喘息 → 排除</li>\n<li>会厌炎（C）：中毒貌 + 流涎 + 吞咽困难 + 喘鸣，不是喘息 → 排除</li>\n<li>异物吸入（E）：单侧喘息更典型，双侧双侧喘息偏病毒感染</li>\n<p>5. 锁定答案：病毒感染诱发喘息（哮喘）→ D</p>\n</ul>", "traps": "<ul>\n<li><strong>年龄陷阱</strong>：20 月龄偏大，细支气管炎多见于 <12 月龄</li>\n<li><strong>\"哮喘\"在幼儿中的定义</strong>：澳大利亚指南将幼儿病毒感染诱发喘息归类为\"哮喘\"，不要因传统观念（\"2 岁以下不诊断哮喘\"）排除</li>\n<li><strong>双侧 vs 单侧喘息</strong>：异物吸入更常见单侧喘息</li>\n</ul>", "summary": "<p>幼儿喘息流行病学：约 20% 婴儿有喘息，至少 40% <6 岁儿童至少有一次喘息发作。</p>\n<p>幼儿喘息最常见原因（澳大利亚指南）：</p>\n<ul>\n<li><strong>异物吸入</strong></li>\n<li><strong>病毒感染</strong>（病毒诱发喘息 = 哮喘）</li>\n</ul>\n<p>鉴别要点：</p>\n<ul>\n<li>细支气管炎：<12 月龄、RSV、喘息 + 湿啰音</li>\n<li>Croup：犬吠样咳嗽 + 吸气性喘鸣</li>\n<li>会厌炎：中毒貌 + 流涎 + 吞咽困难 + 喘鸣</li>\n<li>异物吸入：单侧喘息、突发、有明确窒息史</li>\n</ul>", "explanation": "<p>喘息是幼儿常见表现。约 20% 婴儿在婴儿期出现喘息，至少 40% <6 岁儿童至少有一次喘息发作。</p>\n<p>根据澳大利亚儿科指南，幼儿咳嗽和喘息最常见原因为异物吸入和病毒感染。病毒感染引起的喘息被称为\"哮喘\"。</p>\n<p>细支气管炎多见于 <12 月龄婴儿（RSV 为最常见病因）。Croup 以犬吠样咳嗽和吸气性喘鸣为特征，非喘息。会厌炎患儿通常呈中毒貌和痛苦面容，咳嗽和喘息并非其特征。</p>", "references": "<ul>\n<li>RACGP – AFP – The wheezing child: an algorithm</li>\n<li>RCH – Acute upper airway obstruction</li>\n</ul>", "related": ["AMC-Q1564-Acute-Epiglottitis", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["dyspnea", "wheezing", "cough"], "search": "幼儿咳嗽 + 喘息 — 病毒感染诱发的哮喘\n幼儿咳嗽 + 喘息 — 病毒感染诱发喘息（哮喘）\n a 20-month-old male infant is brought to the emergency department, by his parents, with complaints of cough and shortness of breath. on examination, there is bilateral wheezing over lung fields on auscultation. which one of the following could be the most likely diagnosis? \n 喘息是幼儿常见表现。约 20% 婴儿在婴儿期出现喘息，至少 40%  \n 根据澳大利亚儿科指南，幼儿咳嗽和喘息最常见原因为异物吸入和病毒感染。病毒感染引起的喘息被称为\"哮喘\"。 \n 细支气管炎多见于  "}, {"id": "AMC-Q1564", "type": "mcq", "qid": 1564, "title": "急性会厌炎 — 三脚架姿势 + 流涎 + 喘鸣", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": [], "topic": ["急性会厌炎 — 三脚架姿势 + 流涎 + 呼气性喘鸣 + 颈过伸"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q1564-Acute-Epiglottitis.md", "stem": "<p>Kim, 3 years old, is brought to the Emergency Department by her parents reporting that their daughter is not feeling well at all. According to them, she developed a fever this morning and started to refuse food and crying and throwing it out when she was fed. A short while later she became miserable and inconsolable, started drooling, and her breath became noisy. On examination, she has a pulse rate of 140 bpm, respiratory rate of 34 breaths per minute with expiratory stridor, and a fever of 39.1°C. She maintains her neck extended. Lungs are clear on auscultation. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Croup."}, {"letter": "B", "text": "Acute bronchiolitis."}, {"letter": "C", "text": "Retropharyngeal abscess."}, {"letter": "D", "text": "Acute epiglottitis."}, {"letter": "E", "text": "Bacterial pharyngitis."}], "rationale": "<p>1. 题型识别：诊断 — 儿童急性上气道梗阻的鉴别 2. 关键线索（会厌炎经典表现）：</p>\n<ul>\n<li><strong>急性起病</strong>（今晨开始）</li>\n<li>高热 39.1°C</li>\n<li><strong>拒绝进食</strong> + 哭闹时吐出食物（吞咽困难/吞咽痛）</li>\n<li><strong>流涎</strong></li>\n<li><strong>呼气性喘鸣</strong>（晚期出现，凶兆）</li>\n<li><strong>颈过伸</strong>（保持气道开放）</li>\n<li>三脚架姿势（tripod position）</li>\n<p>3. 鉴别排除：</p>\n<li>Croup（A）：犬吠样咳嗽 + <strong>吸气性</strong>喘鸣、无流涎、前驱病毒症状 → 排除</li>\n<li>细支气管炎（B）：<12 月龄、喘息 + 湿啰音 → 排除</li>\n<li>咽后脓肿（C）：表现相似，但通常有前驱细菌性上呼吸道感染病史 → 急性起病无前驱史 = 不太可能</li>\n<li>细菌性咽炎（E）：无三脚架姿势、无颈过伸、极少流涎 → 排除</li>\n<p>4. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>Croup 与会厌炎的关键区分</strong>：Croup = 犬吠样咳嗽 + 吸气性喘鸣 + 前驱病毒症状；会厌炎 = 流涎 + 吞咽困难 + 呼气性喘鸣 + 中毒貌</li>\n<li><strong>咽后脓肿与会厌炎</strong>：表现相似，但咽后脓肿通常有前驱细菌性上呼吸道感染史，会厌炎为急性暴发性起病</li>\n<li><strong>呼气性喘鸣 ≠ 哮喘</strong>：上气道梗阻晚期可出现呼气性喘鸣，为凶兆</li>\n</ul>", "summary": "<p><strong>急性会厌炎</strong>经典表现：</p>\n<ul>\n<li>急性起病 + 高热</li>\n<li>流涎（drooling）+ 吞咽困难/吞咽痛</li>\n<li>声音低沉或含混（\"hot potato voice\"）</li>\n<li>三脚架姿势（tripod position）— 坐位前倾、双手撑膝、颈过伸 → 维持气道通畅</li>\n<li>起初双肺听诊清晰，晚期出现呼气性喘鸣（凶兆）</li>\n</ul>\n<p><strong>Croup vs 会厌炎</strong>：</p>\n<table class='md-table'>\n<thead><tr><th></th><th>Croup</th><th>会厌炎</th></tr></thead>\n<tbody>\n<tr><td>病因</td><td>病毒（RSV 最常见）</td><td>细菌（Hib）</td></tr>\n<tr><td>咳嗽</td><td>犬吠样</td><td>无</td></tr>\n<tr><td>喘鸣</td><td>吸气性</td><td>晚期呼气性</td></tr>\n<tr><td>流涎</td><td>无</td><td><strong>有</strong></td></tr>\n<tr><td>吞咽困难</td><td>无</td><td><strong>有</strong></td></tr>\n<tr><td>发热</td><td>轻微或无</td><td><strong>高热</strong></td></tr>\n<tr><td>前驱症状</td><td>有（流涕、喷嚏）</td><td>无</td></tr>\n</tbody>\n</table>", "explanation": "<p>该患儿表现为典型急性会厌炎：急性起病、高热、拒绝进食（吞咽困难/吞咽痛）、流涎、呼气性喘鸣、颈过伸。与嘴里含着热食不敢咽下的表现一致。</p>\n<p>Croup 以犬吠样咳嗽和吸气性喘鸣为特征，发热轻微，无流涎和吞咽困难。咽后脓肿与会厌炎表现相似，但本患儿为急性起病无前驱细菌性上呼吸道感染史，因此咽后脓肿可能性较小。细菌性咽炎不会引起三脚架姿势、颈过伸和呼气性喘鸣，极少流涎。</p>", "references": "<ul>\n<li>RACGP – I can't breathe</li>\n<li>RCH – Acute upper airway obstruction</li>\n</ul>", "related": ["AMC-Q1548-Toddler-Wheeze-Asthma", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["fever"], "search": "急性会厌炎 — 三脚架姿势 + 流涎 + 喘鸣\n急性会厌炎 — 三脚架姿势 + 流涎 + 呼气性喘鸣 + 颈过伸\n kim, 3 years old, is brought to the emergency department by her parents reporting that their daughter is not feeling well at all. according to them, she developed a fever this morning and started to refuse food and crying and throwing it out when she was fed. a short while later she became miserable and inconsolable, started drooling, and her breath became noisy. on examination, she has a pulse rate of 140 bpm, respiratory rate of 34 breaths per minute with expiratory stridor, and a fever of 39.1°c. she maintains her neck extended. lungs are clear on auscultation. which one of the following could be the most likely diagnosis? \n 该患儿表现为典型急性会厌炎：急性起病、高热、拒绝进食（吞咽困难/吞咽痛）、流涎、呼气性喘鸣、颈过伸。与嘴里含着热食不敢咽下的表现一致。 \n croup 以犬吠样咳嗽和吸气性喘鸣为特征，发热轻微，无流涎和吞咽困难。咽后脓肿与会厌炎表现相似，但本患儿为急性起病无前驱细菌性上呼吸道感染史，因此咽后脓肿可能性较小。细菌性咽炎不会引起三脚架姿势、颈过伸和呼气性喘鸣，极少流涎。 "}, {"id": "AMC-Q0112", "type": "mcq", "qid": 112, "title": "Henoch-Schönlein 紫癜（HSP）— 已知并发症是肾炎（IgA 肾病）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Rheumatology", "approach": ["diagnosis", "complications"], "topic": ["Henoch-Schonlein Purpura", "HSP", "Nephritis", "Purpura", "Arthritis"], "difficulty": 3, "correctAnswer": "C", "page": 1325, "tags": ["mcq", "amc", "paediatrics", "rheumatology", "hsp", "henoch-schonlein", "vasculitis", "nephritis", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Rheumatology/AMC-Q0112-HSP-Nephritis.md", "stem": "<p>A 6-year-old girl with 4-day bilateral knee/ankle pain. Temp 37.6°C. Joints tender, no swelling/inflammation/synovial thickening; full ROM. Palpable purpuric rash on legs/buttocks + ecchymoses around ankles. FBC/U&E/LFT normal, ESR 10. Known complication of her condition?</p>", "options": [{"letter": "A", "text": "Pleurisy."}, {"letter": "B", "text": "Fasciitis."}, {"letter": "C", "text": "Nephritis."}, {"letter": "D", "text": "Thrombocytopenia."}, {"letter": "E", "text": "Diabetes mellitus."}], "rationale": "<p>1. <strong>题型识别</strong>：儿童紫癜 + 关节痛 + 无血小板减少 → 考 HSP 及其并发症。 2. <strong>HSP 本质</strong>：急性免疫介导血管炎，病因不明。特征：关节痛（非关节炎）、非血小板减少性紫癜（血管性/白细胞碎裂性）、典型分布于腿/臀。 3. <strong>其他表现</strong>：痉挛性腹痛、黑便、关节肿（踝）、肾炎。关节痛/腹痛可持 2–4 周。 4. <strong>肾炎</strong>：组织学同 IgA 肾病；小部分发生；故 <strong>所有 HSP 做尿检</strong>，血尿 → 长期随访。 5. <strong>排除</strong>：A 胸膜炎、B 筋膜炎、E 糖尿病均非 HSP 并发症。D 血小板减少：HSP 紫癜是<strong>非</strong>血小板减少性（ platelet 正常），故不是并发症。 6. <strong>锁定 C</strong>。</p>", "traps": "<ul>\n<li><strong>\"紫癜 = 血小板减少\"陷阱</strong>：错。HSP 紫癜是<strong>非</strong>血小板减少性（血管性），platelet 正常。</li>\n<li><strong>\"关节炎 = 肿胀\"陷阱</strong>：错。HSP 是关节痛（arthralgia）非关节炎（arthritis），无肿胀/积液。</li>\n<li><strong>忽略肾炎</strong>：HSP 最需警惕的并发症是肾（IgA 肾病），要查尿。</li>\n<li><strong>与 ITP 混淆</strong>：ITP 是血小板减少性紫癜；HSP 血小板正常 + 有肾/关节/腹表现。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Highly suggestive of Henöch-Schönlein purpura (HSP, anaphylactoid purpura): acute immune-mediated vasculitis. Arthralgia (not arthritis), non-thrombocytopenic purpura (vascular, leukoclastic) over legs/buttocks. Also colicky abdominal pain, melena, ankle swelling, nephritis. Arthralgia/abdominal pain persist 2–4 weeks. Nephritis histologically = IgA nephropathy; may occur in a small percentage → all HSP get urinalysis; hematuria → long-term follow-up.</p>", "references": "<ul>\n<li>Medscape - Henoch-Schonlein Purpura</li>\n<li>RCH - Henoch-Schonlein purpura</li>\n</ul>", "related": ["AMC-Q0906-ITP-Watchful-Waiting", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["HSP"], "complaints": [], "search": "henoch-schönlein 紫癜（hsp）— 已知并发症是肾炎（iga 肾病）\nhenoch-schonlein purpura hsp nephritis purpura arthritis\ndiagnosis complications\n a 6-year-old girl with 4-day bilateral knee/ankle pain. temp 37.6°c. joints tender, no swelling/inflammation/synovial thickening; full rom. palpable purpuric rash on legs/buttocks + ecchymoses around ankles. fbc/u&e/lft normal, esr 10. known complication of her condition? \n correct answer is  c  \n highly suggestive of henöch-schönlein purpura (hsp, anaphylactoid purpura): acute immune-mediated vasculitis. arthralgia (not arthritis), non-thrombocytopenic purpura (vascular, leukoclastic) over legs/buttocks. also colicky abdominal pain, melena, ankle swelling, nephritis. arthralgia/abdominal pain persist 2–4 weeks. nephritis histologically = iga nephropathy; may occur in a small percentage → all hsp get urinalysis; hematuria → long-term follow-up. "}, {"id": "AMC-Q1443", "type": "mcq", "qid": 1443, "title": "急性风湿热 — 边缘性红斑 + 游走性关节炎 + 咽痛史 → 咽拭子", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Rheumatology", "approach": [], "topic": ["急性风湿热 — 边缘性红斑 + 游走性关节炎 → 下一步咽拭子"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Rheumatology/AMC-Q1443-Acute-Rheumatic-Fever-Throat-Swab.md", "stem": "<p>Parents of a 12-year-old girl has brought her to a clinic after they noticed a rash on her back. She had sore throat 3 weeks ago which subsided gradually in a course of days. Last week she had a very painful left wrist pain that improved after 2 days before she develops pain in her right knee. Today, she has a painful right ankle. On physical examination, she looks ill and has a temperature of 38.1°C. Examination of the musculoskeletal system is notable for a painful, slightly hot and swollen right ankle with decreased range of motion due to pain. There is a rash on her back which is shown in the following photograph. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Echocardiography."}, {"letter": "B", "text": "Blood culture."}, {"letter": "C", "text": "ESR."}, {"letter": "D", "text": "Throat swab."}, {"letter": "E", "text": "Full blood examination (FBE)."}], "rationale": "<p>1. 题型识别：诊断检查 — ARF 的确诊路径 2. 关键线索：</p>\n<ul>\n<li>3 周前咽痛史 → GAS 前驱感染潜伏期</li>\n<li>游走性多关节炎（左腕→右膝→右踝）→ 典型 ARF 特征</li>\n<li>背部皮疹照片 → 边缘性红斑（erythema marginatum）— ARF 主要标准之一</li>\n<li>T 38.1°C、看起来不适</li>\n<p>3. ARF 诊断以临床为主（Jones 标准），无特异性实验室检查；确认前驱 GAS 感染是诊断关键 4. 排除选项：</p>\n<li>超声心动图（A）：确认心脏炎（主要标准）但不是\"next step\"</li>\n<li>血培养（B）：GAS 血培养阳性率低，非必需</li>\n<li>ESR/CRP（C）：已满足临床诊断标准，加做无额外收益</li>\n<li>FBE（E）：ARF 中通常正常或非特异性</li>\n<p>5. 锁定答案：咽拭子确认 GAS → D</p>\n</ul>", "traps": "<ul>\n<li><strong>\"心脏炎需超声心动图\"陷阱</strong>：超声心动图是评估 ARF 心脏受累的重要检查（包括亚临床瓣膜病），但 \"next step in management\" 问的是诊断确认步骤 — 咽拭子确认前驱 GAS</li>\n<li><strong>ESR/CRP 不是诊断性检查</strong>：已充分满足临床诊断标准时，加测 ESR/CRP 无额外诊断价值</li>\n<li><strong>血培养混淆</strong>：GAS 咽炎后 ARF 中血培养阳性率低，非必需</li>\n</ul>", "summary": "<p><strong>急性风湿热（ARF）</strong> Jones 标准（澳大利亚 2012 修订版）：</p>\n<table class='md-table'>\n<thead><tr><th></th><th>高风险人群</th><th>其他人群</th></tr></thead>\n<tbody>\n<tr><td><strong>主要标准</strong></td><td>心脏炎（含亚临床）/ 多关节炎或无菌性单关节炎或多关节痛 / Sydenham 舞蹈症 / 边缘性红斑 / 皮下结节</td><td>心脏炎 / <strong>多关节炎</strong>（仅多关节） / Sydenham 舞蹈症 / 边缘性红斑 / 皮下结节</td></tr>\n<tr><td><strong>次要标准</strong></td><td>发热 / 多关节痛或无菌性单关节炎 / ESR≥30 或 CRP≥30 / PR 间期延长</td><td>发热 / 多关节痛 / ESR≥30 或 CRP≥30 / PR 间期延长</td></tr>\n</tbody>\n</table>\n<p>诊断需：2 项主要标准 或 1 项主要 + 2 项次要 + <strong>前驱 GAS 感染证据</strong>。</p>\n<p>咽拭子是确认前驱 GAS 感染的首选方法。过度诊断导致不必要长期治疗，漏诊导致心脏损伤和过早死亡。</p>", "explanation": "<p>皮疹照片显示边界清晰的亮红色和粉色斑疹 — 边缘性红斑（erythema marginatum）。皮疹 + 游走性关节痛/关节炎（一关节受累→好转→另一关节受累）+ 3 周前咽痛史 = 高度提示 ARF。</p>\n<p>ARF 主要发生于儿童期，继发于 A 族链球菌（GAS）感染。诊断主要通过临床（Jones 标准），无特异性实验室检查。咽拭子可提供前驱 GAS 感染的充分线索。</p>\n<p>超声心动图可评估心脏炎（包括亚临床风湿性瓣膜病），但并非\"next step\"。ESR/CRP 在已满足临床诊断标准时无额外收益。FBE 通常正常或非特异性。血培养非必需。</p>", "references": "<ul>\n<li>RACGP - The Australian guideline for prevention, diagnosis and management of acute rheumatic fever and rheumatic heart disease</li>\n<li>RACGP – Rheumatic Fever</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性风湿热 — 边缘性红斑 + 游走性关节炎 + 咽痛史 → 咽拭子\n急性风湿热 — 边缘性红斑 + 游走性关节炎 → 下一步咽拭子\n parents of a 12-year-old girl has brought her to a clinic after they noticed a rash on her back. she had sore throat 3 weeks ago which subsided gradually in a course of days. last week she had a very painful left wrist pain that improved after 2 days before she develops pain in her right knee. today, she has a painful right ankle. on physical examination, she looks ill and has a temperature of 38.1°c. examination of the musculoskeletal system is notable for a painful, slightly hot and swollen right ankle with decreased range of motion due to pain. there is a rash on her back which is shown in the following photograph. which one of the following is the most appropriate next step in management? \n 皮疹照片显示边界清晰的亮红色和粉色斑疹 — 边缘性红斑（erythema marginatum）。皮疹 + 游走性关节痛/关节炎（一关节受累→好转→另一关节受累）+ 3 周前咽痛史 = 高度提示 arf。 \n arf 主要发生于儿童期，继发于 a 族链球菌（gas）感染。诊断主要通过临床（jones 标准），无特异性实验室检查。咽拭子可提供前驱 gas 感染的充分线索。 \n 超声心动图可评估心脏炎（包括亚临床风湿性瓣膜病），但并非\"next step\"。esr/crp 在已满足临床诊断标准时无额外收益。fbe 通常正常或非特异性。血培养非必需。 "}, {"id": "AMC-Q0063", "type": "mcq", "qid": 63, "title": "命令性幻听的急诊管理 — 首先确保安全，呼叫医院安保", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["命令性幻听的管理 — 首先呼叫医院安保"], "difficulty": 3, "correctAnswer": "A", "page": 1459, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0063-Command-Hallucinations-Security.md", "stem": "<p>An 82-year-old man male presents to the emergency department with a knife in his hand. He claims that he hears voices saying his neighbors want to kill him and he should kill them before they kill him. You, as the attending physician, manage to verbally de-escalate him and convince him to surrender his knife. Which one of the following would be the <strong>next best step</strong> in management?</p>", "options": [{"letter": "A", "text": "Call the hospital security."}, {"letter": "B", "text": "Call the police."}, {"letter": "C", "text": "Call his family to help you with dealing with him."}, {"letter": "D", "text": "Calm him down and talk to him."}, {"letter": "E", "text": "Offer him tea and biscuit."}], "rationale": "<p>1. 题型识别：治疗 — 急诊管理优先级 2. 识别诊断：<strong>急性精神病 + 命令性幻听</strong>（伤害他人的命令） 3. 命令性幻听 = 随时可能发生暴力的高风险 4. 优先顺序：<strong>安全 > 信息收集 > 沟通</strong> 5. 排除：</p>\n<ul>\n<li>报警（B）：适用于社区场景，医疗场所应呼叫安保</li>\n<li>联系家人（C）：可用于获取病史，但安全第一</li>\n<li>安抚聊天（D）：已成功口头降级，下一步是确保持续安全</li>\n<li>茶和饼干（E）：建立融洽关系在有安全保障后进行</li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"已交出刀=安全\"</strong>误区：命令性幻听患者即使暂时平静，仍可能随时再次暴力</li>\n<li><strong>警察 vs 安保</strong>：在医疗场所内应呼叫<strong>医院安保</strong>（非警察）；在社区场景则呼叫警察</li>\n<li><strong>安全 vs 沟通</strong>：安抚、了解病史均在安全保障之后</li>\n</ul>", "summary": "<p><strong>命令性幻听（Command Hallucinations）</strong>：</p>\n<ul>\n<li>是指听到命令其伤害自己或他人的声音</li>\n<li>任何有命令性幻听的患者 = <strong>随时可能发生暴力的高风险</strong></li>\n<li>管理原则：</li>\n<p>1. <strong>安全第一</strong>：呼叫医院安保 2. 口头降级/药物镇静 3. 获取辅助信息（家人/警察/病历） 4. 建立融洽关系（茶和饼干等）</p>\n</ul>\n<p><strong>场所差异</strong>：</p>\n<ul>\n<li>医疗场所 → 医院安保</li>\n<li>社区 → 警察</li>\n</ul>", "explanation": "<p>该患者表现为典型的急性精神病和命令性幻听。虽然表面上患者愿意交出刀具，但命令性幻听仍可能使他对自己或他人构成风险。在此情况下，呼叫医院安保是下一步最佳管理措施，确保你和工作人员的安全。报警适用于社区场景。联系家人可提供病史信息，但安全优先。口头降级和建立融洽关系在安全保障后进行。</p>", "references": "<ul>\n<li>http://www0.health.nsw.gov.au/policies/pd/2015/pdf</li>\n<li>Therapeutic Guidelines - Psychotropic</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "命令性幻听的急诊管理 — 首先确保安全，呼叫医院安保\n命令性幻听的管理 — 首先呼叫医院安保\n an 82-year-old man male presents to the emergency department with a knife in his hand. he claims that he hears voices saying his neighbors want to kill him and he should kill them before they kill him. you, as the attending physician, manage to verbally de-escalate him and convince him to surrender his knife. which one of the following would be the  next best step  in management? \n 该患者表现为典型的急性精神病和命令性幻听。虽然表面上患者愿意交出刀具，但命令性幻听仍可能使他对自己或他人构成风险。在此情况下，呼叫医院安保是下一步最佳管理措施，确保你和工作人员的安全。报警适用于社区场景。联系家人可提供病史信息，但安全优先。口头降级和建立融洽关系在安全保障后进行。 "}, {"id": "AMC-Q0066", "type": "mcq", "qid": 66, "title": "急性躁狂 — 锂盐为治疗首选", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["急性躁狂 — 锂盐为治疗首选"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0066-Acute-Mania-Lithium.md", "stem": "<p>A 24-year-old woman presents with elevated mood, pressured speech, agitation and flight of ideas over the past 2 weeks. There is no history of drug abuse in the past. The patient is fully cooperative. Which one of the following is the drug of choice in this situation?</p>", "options": [{"letter": "A", "text": "Sodium valproate."}, {"letter": "B", "text": "Lithium."}, {"letter": "C", "text": "Carbamazepine."}, {"letter": "D", "text": "Haloperidol."}, {"letter": "E", "text": "Quetiapine."}], "rationale": "<p>1. 题型识别：治疗 — 药物选择（drug of choice） 2. 诊断：24岁女性，情绪高涨、言语压力、激越、意念飘忽2周，无药物滥用史 → <strong>急性躁狂</strong>（双相I型） 3. 双相I型特征（DSM）：</p>\n<ul>\n<li>持续≥1周的异常情绪高涨</li>\n<li>自尊膨胀/夸大、注意力分散、活动过度、言语压力、精神运动激越、意念飘忽、性活动增加、目标导向活动增加</li>\n<p>4. 治疗选择：</p>\n<li><strong>锂盐：急性治疗与维持治疗的首选（drug of choice）</strong></li>\n<li>抗精神病药（奥氮平、喹硫平、利培酮、阿立哌唑）：可单用或与锂合用</li>\n<li>丙戊酸钠（A）：与不典型抗精神病药联合为特定患者的替代</li>\n<li>氟哌啶醇（D）：用于需要镇静的急性躁狂；不合作+急性激越 → IM氟哌啶醇最佳初始处理</li>\n<li>卡马西平（C）：证据显示急性躁狂中不如锂或非典型抗精神病药</li>\n<p>5. 本例患者完全配合 → 首选锂盐 6. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>不配合/激越 → 氟哌啶醇</strong>：只有急性激越、不配合、需镇静时才首选IM氟哌啶醇；本例完全配合</li>\n<li><strong>卡马西平证据弱</strong>：急性躁狂中卡马西平疗效证据不如锂盐/非典型抗精神病药</li>\n<li><strong>锂盐=急性+维持</strong>：锂对躁狂急性发作和长期维持都有效</li>\n</ul>", "summary": "<p><strong>双相I型障碍 (Bipolar I Disorder)</strong>：</p>\n<ul>\n<li>躁狂症状持续≥1周</li>\n<li>症状足够显著以引起功能受损或痛苦</li>\n</ul>\n<p><strong>躁狂特征</strong>：</p>\n<ul>\n<li>持续异常情绪高涨（≥1周）</li>\n<li>自尊增加/夸大</li>\n<li>注意力分散</li>\n<li>过度参与活动</li>\n<li>比平时更健谈（言语压力）</li>\n<li>精神运动激越</li>\n<li>意念飘忽（flight of ideas）</li>\n<li>性活动增加</li>\n<li>目标导向活动增加</li>\n</ul>\n<p><strong>急性躁狂治疗</strong>：</p>\n<ul>\n<li><strong>锂盐：首选</strong>（急性+维持）</li>\n<li>抗精神病药（奥氮平、喹硫平、利培酮、阿立哌唑）：单用或联合</li>\n<li>丙戊酸钠+不典型抗精神病药：特定患者的替代方案</li>\n<li>氟哌啶醇：需镇静的急性躁狂（尤其不配合/急性激越 → IM）</li>\n<li>卡马西平：疗效证据不如锂/非典型抗精神病药</li>\n</ul>", "explanation": "<p>该患者的临床病史符合急性躁狂，可能为双相I型障碍。双相I型是一种以至少一周躁狂症状为特征的心境障碍，症状应足够显著以引起功能上的明显受损或痛苦。双相障碍的特征性表现包括：持续至少一周的异常情绪高涨、自尊增加与夸大、注意力分散、过度参与活动、比平时更健谈（言语压力）、精神运动激越、意念飘忽、性活动增加以及目标导向活动增加。在给定选项中，锂盐是急性治疗和维持治疗的首选。奥氮平、喹硫平（E）、利培酮和阿立哌唑等抗精神病药可与锂盐联合或单用于急性躁狂。丙戊酸钠（A）与不典型抗精神病药联合是特定患者的替代方案。氟哌啶醇（D）用于需要镇静的急性躁狂患者——若患者不合作且急性激越，肌注氟哌啶醇是最佳初始处理。卡马西平（C）及一些其他抗惊厥药可用作心境稳定剂，但证据显示其在双相障碍急性躁狂管理中不如锂盐或非典型抗精神病药有效。</p>", "references": "<ul>\n<li>International Journal of Bipolar Disorder</li>\n<li>Therapeutic Guidelines - Psychotropic; available from http://tg.org.au</li>\n</ul>", "related": ["AMC-Q0992-Acute-Mania-First-Trimester-Lithium", "AMC-Q0993-Acute-Mania-Third-Trimester-Lithium", "AMC-Q1001-Hypomania-Olanzapine", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性躁狂 — 锂盐为治疗首选\n急性躁狂 — 锂盐为治疗首选\n a 24-year-old woman presents with elevated mood, pressured speech, agitation and flight of ideas over the past 2 weeks. there is no history of drug abuse in the past. the patient is fully cooperative. which one of the following is the drug of choice in this situation? \n 该患者的临床病史符合急性躁狂，可能为双相i型障碍。双相i型是一种以至少一周躁狂症状为特征的心境障碍，症状应足够显著以引起功能上的明显受损或痛苦。双相障碍的特征性表现包括：持续至少一周的异常情绪高涨、自尊增加与夸大、注意力分散、过度参与活动、比平时更健谈（言语压力）、精神运动激越、意念飘忽、性活动增加以及目标导向活动增加。在给定选项中，锂盐是急性治疗和维持治疗的首选。奥氮平、喹硫平（e）、利培酮和阿立哌唑等抗精神病药可与锂盐联合或单用于急性躁狂。丙戊酸钠（a）与不典型抗精神病药联合是特定患者的替代方案。氟哌啶醇（d）用于需要镇静的急性躁狂患者——若患者不合作且急性激越，肌注氟哌啶醇是最佳初始处理。卡马西平（c）及一些其他抗惊厥药可用作心境稳定剂，但证据显示其在双相障碍急性躁狂管理中不如锂盐或非典型抗精神病药有效。 "}, {"id": "AMC-Q0128", "type": "mcq", "qid": 128, "title": "惊恐发作 — 解释、安抚和支持为治疗基石", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["惊恐发作的管理 — 解释、安抚和支持是基石"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0128-Panic-Attack-Reassurance.md", "stem": "<p>A 20-year-old girl presents with history of episodes of trembling, palpitation, shortness of breath, and sweating. Each episode lasts for 5 minutes and then gradually resolves. She has no history of heart disease, and is not on any regular medication. She denies any use of illicit drugs. Which one of the following would be the <strong>best course of action</strong> for management?</p>", "options": [{"letter": "A", "text": "Reassurance, explanation, and support."}, {"letter": "B", "text": "Selective serotonin reuptake inhibitors."}, {"letter": "C", "text": "Breathing in and out of a paper bag when attacks develop."}, {"letter": "D", "text": "Tricyclic antidepressants."}, {"letter": "E", "text": "Referral to a psychiatrist."}], "rationale": "<p>1. 题型识别：治疗 — 管理策略选择 2. 识别诊断：典型<strong>惊恐发作</strong>（发作性颤抖、心悸、气短、出汗，持续5分钟） 3. 惊恐发作的诊断需≥4项症状（共13项） 4. 管理原则：<strong>解释+安抚+支持</strong>是基石 5. 排除：</p>\n<ul>\n<li>SSRIs（B）/TCAs（D）：用于<strong>惊恐障碍</strong>（非单纯的惊恐发作），作为CBT的补充</li>\n<li>纸袋呼吸（C）：仅在过度换气时有帮助，是后续可教授的技巧</li>\n<li>转诊精神科（E）：诊断明确无需转诊</li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>惊恐发作 vs 惊恐障碍</strong>：惊恐发作是症状事件，惊恐障碍是疾病诊断。SSRIs/TCAs用于后者而非前者</li>\n<li><strong>纸袋呼吸是最佳答案？</strong>：纸袋呼吸仅适用于过度换气时，不是所有惊恐发作的首选</li>\n</ul>", "summary": "<p><strong>惊恐发作（Panic Attack）诊断标准</strong>（需≥4项）： 1. 心悸、心跳加速 2. 出汗 3. 颤抖 4. 气短或窒息感 5. 哽噎感 6. 胸痛或不适 7. 恶心或腹部不适 8. 头晕、站立不稳 9. 现实解体或人格解体 10. 害怕失控或发疯 11. 害怕死亡 12. 麻木或刺痛感 13. 寒战或潮热</p>\n<p><strong>管理</strong>：</p>\n<ul>\n<li><strong>基石</strong>：解释、安抚、支持</li>\n<li>残留焦虑：可考虑苯二氮䓬类</li>\n<li>惊恐<strong>障碍</strong>：SSRIs/TCAs + CBT（CBT为一线）</li>\n</ul>", "explanation": "<p>该患者具有典型的惊恐发作表现。治疗基石是解释病情、安抚患者并支持其理解情况。对于惊恐发作后的残留焦虑可考虑苯二氮䓬类。SSRIs和TCAs已作为惊恐障碍（非惊恐发作）的药物治疗，是CBT等非药物治疗的补充。纸袋呼吸对过度换气时有帮助。诊断明确时无需转诊精神科。</p>", "references": "<ul>\n<li>RACGP - Managing panic disorder in general practice</li>\n<li>Medscape - Panic Disorder</li>\n<li>Therapeutic Guidelines - Psychotropic</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["dyspnea", "palpitations", "diaphoresis"], "search": "惊恐发作 — 解释、安抚和支持为治疗基石\n惊恐发作的管理 — 解释、安抚和支持是基石\n a 20-year-old girl presents with history of episodes of trembling, palpitation, shortness of breath, and sweating. each episode lasts for 5 minutes and then gradually resolves. she has no history of heart disease, and is not on any regular medication. she denies any use of illicit drugs. which one of the following would be the  best course of action  for management? \n 该患者具有典型的惊恐发作表现。治疗基石是解释病情、安抚患者并支持其理解情况。对于惊恐发作后的残留焦虑可考虑苯二氮䓬类。ssris和tcas已作为惊恐障碍（非惊恐发作）的药物治疗，是cbt等非药物治疗的补充。纸袋呼吸对过度换气时有帮助。诊断明确时无需转诊精神科。 "}, {"id": "AMC-Q0508", "type": "mcq", "qid": 508, "title": "精神病性抑郁 — 抗抑郁治疗应持续3-5年", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["精神病性抑郁 — 抗抑郁治疗应持续3-5年"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0508-Depression-Psychotic-Treatment-Duration.md", "stem": "<p>A 17-year-old girl is diagnosed with major depression associated with psychotic features. She is planned to be started on selective serotonin reuptake inhibitors (SSRIs). For how long, should the treatment be continued?</p>\n<p>(A second question follows: Q508 — a 27-year-old man with major depression after attempted suicide, on sertraline — how long? Answer: <strong>D. Five years</strong> / 3-5 years)</p>", "options": [{"letter": "A", "text": "Six months."}, {"letter": "B", "text": "One year."}, {"letter": "C", "text": "Five years."}, {"letter": "D", "text": "Life-long."}, {"letter": "E", "text": "Two years."}], "rationale": "<p>1. 题型识别：治疗 — 治疗时程判断 2. 标准治疗时长：大多数抑郁患者 <strong>6个月至12个月</strong> 3. <strong>延长至3-5年</strong> 的指征：</p>\n<ul>\n<li>5年内2次抑郁发作</li>\n<li>≥3次既往发作</li>\n<li><strong>精神病性特征的抑郁</strong> ← 本题</li>\n<li><strong>严重自杀企图</strong> ← Q508第二问</li>\n<p>4. 17岁女性：精神病性特征 → 需3-5年 5. 27岁男性：自杀企图 → 需3-5年 6. 3-5年后重新评估 → 部分可能需要终身</p>\n</ul>", "traps": "<ul>\n<li><strong>标准6-12月 vs 延长3-5年</strong>：精神病性特征和自杀企图都是延长治疗的指征，易误选标准时长</li>\n<li><strong>终身治疗</strong>：非一线推荐，在3-5年后重新评估时才考虑</li>\n</ul>", "summary": "<p><strong>抗抑郁治疗时程</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>情况</th><th>治疗时长</th></tr></thead>\n<tbody>\n<tr><td>标准（首次发作、无并发症）</td><td>6-12个月</td></tr>\n<tr><td><strong>需延长至3-5年</strong></td><td></td></tr>\n<tr><td>5年内2次抑郁发作</td><td></td></tr>\n<tr><td>≥3次既往发作</td><td></td></tr>\n<tr><td>严重精神病性抑郁</td><td></td></tr>\n<tr><td>严重自杀企图</td><td></td></tr>\n<tr><td>3-5年后</td><td>重新评估 → 部分可能终身治疗</td></tr>\n</tbody>\n</table>", "explanation": "<p>大多数抑郁患者药物治疗应持续至少6个月至理想12个月。但在某些情况下治疗需延长至3-5年：5年内2次发作、3次既往发作、精神病性特征抑郁、严重自杀企图。3-5年后重新评估是否需要继续，部分患者可能需要终身抗抑郁治疗。17岁精神病性抑郁和27岁自杀企图患者均应接受3-5年治疗。</p>", "references": "<ul>\n<li>Therapeutic Guidelines - Psychotropic</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "精神病性抑郁 — 抗抑郁治疗应持续3-5年\n精神病性抑郁 — 抗抑郁治疗应持续3-5年\n a 17-year-old girl is diagnosed with major depression associated with psychotic features. she is planned to be started on selective serotonin reuptake inhibitors (ssris). for how long, should the treatment be continued? \n (a second question follows: q508 — a 27-year-old man with major depression after attempted suicide, on sertraline — how long? answer:  d. five years  / 3-5 years) \n 大多数抑郁患者药物治疗应持续至少6个月至理想12个月。但在某些情况下治疗需延长至3-5年：5年内2次发作、3次既往发作、精神病性特征抑郁、严重自杀企图。3-5年后重新评估是否需要继续，部分患者可能需要终身抗抑郁治疗。17岁精神病性抑郁和27岁自杀企图患者均应接受3-5年治疗。 "}, {"id": "AMC-Q0512", "type": "mcq", "qid": 512, "title": "自杀风险因素 — 询问自杀意念不增加自杀风险", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["自杀风险评估 — 询问自杀意念不增加自杀风险"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0512-Suicide-Risk-Not-Increased.md", "stem": "<p>Which one of the following does <strong>not</strong> increase the risk of suicide?</p>", "options": [{"letter": "A", "text": "Alcohol abuse."}, {"letter": "B", "text": "Poor social support."}, {"letter": "C", "text": "Inquiring the patient about suicidal ideation."}, {"letter": "D", "text": "Conduct disorder."}, {"letter": "E", "text": "Schizophrenia."}], "rationale": "<p>1. 题型识别：诊断 — 否定题（NOT） 2. 已知自杀风险因素：</p>\n<ul>\n<li>精神疾病：>90%自杀未遂者有精神疾病；精神分裂症（E）增加风险3-12倍</li>\n<li>酒精滥用（A）：显著增加风险</li>\n<li>社会支持差（B）：增加风险</li>\n<li>品行障碍（D）：儿童品行障碍与成年自杀风险增加相关</li>\n<p>3. <strong>询问自杀意念（C）</strong>：不仅不增加风险，而且是<strong>评估自杀风险的必要步骤</strong> 4. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>恐惧\"提示自杀\"</strong>：许多临床医生担心询问自杀会\"植入\"念头——不会！直接询问是必要且安全的</li>\n<li><strong>否定题</strong>：\"not\"容易看漏</li>\n</ul>", "summary": "<p><strong>自杀风险因素</strong>：</p>\n<ul>\n<li><strong>精神疾病</strong>：最强预测因素之一；精神疾病患者自杀率比一般人群高3-12倍</li>\n<li><strong>绝望和冲动性</strong>：绝望与自杀强烈相关，冲动性与实施自杀行为相关</li>\n<li><strong>既往自杀企图/威胁</strong>：最有力的单一预测因素，再次尝试风险高5-6倍</li>\n<li><strong>人口学因素</strong>：</li>\n<li>年龄增长风险增加（但年轻人尝试更多）</li>\n<li>女性尝试多4倍，男性成功多3倍</li>\n<li>85岁以上白人男性、年轻黑人男性风险最高</li>\n<li><strong>婚姻状况</strong>：从未结婚 > 丧偶/分居/离婚 > 已婚无子女 > 已婚有子女</li>\n<li><strong>职业</strong>：失业、非技术工人风险更高</li>\n<li><strong>躯体疾病</strong>：慢性疼痛、近期手术、慢性/终末期疾病</li>\n<li><strong>童年不良经历</strong>：虐待、品行障碍</li>\n<li><strong>家族史</strong>：一级亲属自杀 → 风险增加6倍</li>\n<li><strong>其他</strong>：武器可及性、农村居住、LGBTQ+、低智商</li>\n</ul>\n<p><strong>询问不增加风险</strong>：直接询问自杀意念是评估的必要部分。</p>", "explanation": "<p>多种因素与自杀风险增加相关。精神疾病是自杀的强预测因素，90%以上自杀未遂者和95%自杀成功者都有精神疾病诊断。酒精滥用、社会支持差、品行障碍和精神分裂症均增加风险。询问患者自杀意念不增加风险——直接询问是自杀风险评估的重要组成部分。</p>", "references": "<ul>\n<li>http://www.health.vic.gov.au/mentalhealth/suicide/</li>\n<li>http://www.uptodate.com/contents/suicidal-ideation</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "自杀风险因素 — 询问自杀意念不增加自杀风险\n自杀风险评估 — 询问自杀意念不增加自杀风险\n which one of the following does  not  increase the risk of suicide? \n 多种因素与自杀风险增加相关。精神疾病是自杀的强预测因素，90%以上自杀未遂者和95%自杀成功者都有精神疾病诊断。酒精滥用、社会支持差、品行障碍和精神分裂症均增加风险。询问患者自杀意念不增加风险——直接询问是自杀风险评估的重要组成部分。 "}, {"id": "AMC-Q0513", "type": "mcq", "qid": 513, "title": "抑郁风险因素 — 高社会经济地位是保护因素", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["抑郁风险因素 — 高社会经济地位不增加抑郁风险"], "difficulty": 2, "correctAnswer": "A", "page": 1479, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0513-Depression-Risk-Not-Increased.md", "stem": "<p>Which one of the following will <strong>not</strong> increase the risk of depression?</p>", "options": [{"letter": "A", "text": "High socioeconomic status."}, {"letter": "B", "text": "Elderly male with cognitive decline."}, {"letter": "C", "text": "Unemployment."}, {"letter": "D", "text": "Family history of depression."}, {"letter": "E", "text": "Substance misuse."}], "rationale": "<p>1. 题型识别：诊断 — 否定题（NOT） 2. 已知抑郁风险因素：</p>\n<ul>\n<li>家族史（D）：强风险因素</li>\n<li>失业（C）：边缘化、无家可归、难民身份均增加风险</li>\n<li>物质滥用（E）：吸烟、酒精、药物使用均增加风险</li>\n<li>老年认知下降（B）：慢性疾病、认知衰退增加风险</li>\n<p>3. <strong>高社会经济地位（A）</strong>：是保护因素，降低抑郁风险 4. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>保护因素 vs 风险因素</strong>：高社会经济地位降低风险，低社会经济地位增加风险</li>\n<li><strong>否定题</strong>：\"not\"容易看漏</li>\n</ul>", "summary": "<p><strong>抑郁风险因素</strong>：</p>\n<ul>\n<li>家族史（强风险因素）</li>\n<li>慢性疾病（包括认知下降）</li>\n<li>共存精神疾病（焦虑、人格障碍等）</li>\n<li>躯体疾病、躯体或智力残疾</li>\n<li>低自尊、身体形象扭曲、社交无能</li>\n<li>青春期进入青春期/求学/进入职场过渡期</li>\n<li>跨文化压力、语言障碍、文化不认可精神健康问题</li>\n<li>家庭暴力、贫困、家庭不和、虐待</li>\n<li>丧亲、分离、离婚、创伤</li>\n<li>吸烟、酒精、药物使用</li>\n<li>边缘化、无家可归、难民身份、寄养、失业</li>\n</ul>\n<p><strong>保护因素</strong>：</p>\n<ul>\n<li>高社会经济地位</li>\n<li>良好社会支持</li>\n<li>健康生活方式</li>\n</ul>", "explanation": "<p>高社会经济地位是抑郁症的保护因素，而非风险因素。老年男性认知下降、失业、抑郁家族史和物质滥用均是抑郁的已知风险因素。抑郁风险因素包括生物、心理和社会多方面。</p>", "references": "<ul>\n<li>https://www.nhmrc.gov.au/_files_nhmrc/publications</li>\n<li>http://psychcentral.com/lib/risk-factors-for-depre</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "抑郁风险因素 — 高社会经济地位是保护因素\n抑郁风险因素 — 高社会经济地位不增加抑郁风险\n which one of the following will  not  increase the risk of depression? \n 高社会经济地位是抑郁症的保护因素，而非风险因素。老年男性认知下降、失业、抑郁家族史和物质滥用均是抑郁的已知风险因素。抑郁风险因素包括生物、心理和社会多方面。 "}, {"id": "AMC-Q0517", "type": "mcq", "qid": 517, "title": "双相抑郁 vs 单相抑郁 — 食欲减退在双相抑郁中较少见", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["双相抑郁 vs 单相抑郁 — 食欲减退在双相抑郁中较少见"], "difficulty": 2, "correctAnswer": "C", "page": 1480, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0517-Bipolar-vs-Unipolar-Depression.md", "stem": "<p>A 24-year-old woman presents with history of low mood, psychomotor retardation, decreased appetite and decreased sleep for the past 2 weeks. She has family history of bipolar disorder. Which one of the following is <strong>less common</strong> in bipolar depression than unipolar depression?</p>", "options": [{"letter": "A", "text": "Psychomotor retardation."}, {"letter": "B", "text": "Hypersomnia."}, {"letter": "C", "text": "Decreased appetite."}, {"letter": "D", "text": "Positive family history of bipolar disorder."}, {"letter": "E", "text": "Delusions and hallucinations."}], "rationale": "<p>1. 题型识别：诊断 — 鉴别特征比较 2. 该患者已有多项提示双相的特征：</p>\n<ul>\n<li>精神运动迟滞 → 双相较常见</li>\n<li>双相障碍家族史 → 双相较常见</li>\n<li>起病年龄<25岁 → 双相较常见</li>\n<p>3. <strong>双相抑郁更常见的特征</strong>（相比单相）：</p>\n<li>精神运动迟滞（A）— 更常见</li>\n<li>睡眠增加/嗜睡（B）— 更常见</li>\n<li>食欲增加/多食 — 题干未列出</li>\n<li>早发起病（<25岁）</li>\n<li>妄想和幻觉（E）— 更常见</li>\n<li>双相家族史（D）— 更常见</li>\n<p>4. <strong>双相抑郁较少见的特征</strong>：</p>\n<li>睡眠减少 — 单相更常见</li>\n<li>食欲减退（C）— 单相更常见</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>精神运动迟滞方向</strong>：在双相抑郁的抑郁期中<strong>更常见</strong>，而非更少见——注意这只是在抑郁期的特征，不是躁狂期</li>\n<li><strong>食欲增加 vs 减少</strong>：双相抑郁典型是多吃多睡（非典型特征），单相是少吃少睡（典型特征）</li>\n</ul>", "summary": "<p><strong>双相抑郁 vs 单相抑郁特征对比</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>双相抑郁</th><th>单相抑郁</th></tr></thead>\n<tbody>\n<tr><td>精神运动迟滞</td><td><strong>更常见</strong></td><td>较少</td></tr>\n<tr><td>食欲增加（多食）</td><td><strong>更常见</strong></td><td>较少</td></tr>\n<tr><td>食欲减退</td><td>较少</td><td><strong>更常见</strong></td></tr>\n<tr><td>睡眠增加（嗜睡）</td><td><strong>更常见</strong></td><td>较少</td></tr>\n<tr><td>睡眠减少</td><td>较少</td><td><strong>更常见</strong></td></tr>\n<tr><td>早发起病（<25岁）</td><td><strong>更常见</strong></td><td>不一定</td></tr>\n<tr><td>妄想和幻觉</td><td><strong>更常见</strong></td><td>较少</td></tr>\n<tr><td>双相家族史</td><td><strong>更常见</strong></td><td>不一定</td></tr>\n</tbody>\n</table>\n<p>关键：识别双相抑郁的特征很重要，因为初始表现为抑郁的双相患者易被误诊为单相抑郁。</p>", "explanation": "<p>精神运动迟滞、食欲增加/多食、睡眠增加/嗜睡、早发起病（<25岁）、妄想幻觉和双相家族史在双相抑郁中比单相抑郁中更常见。识别这些特征对可能诊断为双相障碍的初始表现为抑郁的患者非常重要。本例患者有双相家族史、精神运动迟滞和早发起病，均支持双相抑郁。食欲减退和睡眠减少在双相抑郁中较少见，更常见于单相抑郁。</p>", "references": "<ul>\n<li>http://ajp.psychiatryonline.org/doi/10.1176/appi.a</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "双相抑郁 vs 单相抑郁 — 食欲减退在双相抑郁中较少见\n双相抑郁 vs 单相抑郁 — 食欲减退在双相抑郁中较少见\n a 24-year-old woman presents with history of low mood, psychomotor retardation, decreased appetite and decreased sleep for the past 2 weeks. she has family history of bipolar disorder. which one of the following is  less common  in bipolar depression than unipolar depression? \n 精神运动迟滞、食欲增加/多食、睡眠增加/嗜睡、早发起病（ "}, {"id": "AMC-Q0565", "type": "mcq", "qid": 565, "title": "产后抑郁风险因素 — 择期剖宫产不增加风险", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["产后抑郁风险因素 — 择期剖宫产不增加风险"], "difficulty": 2, "correctAnswer": "E", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0565-Postpartum-Depression-Risk.md", "stem": "<p>Which of the following does <strong>not</strong> increase the risk of postpartum depression?</p>", "options": [{"letter": "A", "text": "Adverse life events."}, {"letter": "B", "text": "Lack of social support."}, {"letter": "C", "text": "Past history of depression."}, {"letter": "D", "text": "Emergency cesarean section."}, {"letter": "E", "text": "Elective cesarean section."}], "rationale": "<p>1. 题型识别：诊断 — 否定题（NOT） 2. 产后抑郁风险因素分类：</p>\n<ul>\n<li><strong>心理</strong>：产前焦虑/抑郁、既往抑郁史（C）、家族史、严重婴儿忧郁、内疚/完美主义人格</li>\n<li><strong>社会</strong>：缺乏情感和实际支持（B）、家庭暴力、近期多重压力事件（A）、低社会经济地位、非计划妊娠</li>\n<li><strong>生物/医学</strong>：严重妊娠或分娩并发症包括<strong>紧急剖宫产</strong>（D）、新生儿死亡、围产期睡眠剥夺</li>\n<p>3. <strong>择期剖宫产（E）</strong>：不增加产后抑郁风险 4. 锁定答案：E</p>\n</ul>", "traps": "<ul>\n<li><strong>紧急 vs 择期剖宫产</strong>：紧急剖宫产作为严重分娩并发症属风险因素，择期剖宫产不是</li>\n<li><strong>否定题</strong>：\"not\"容易看漏</li>\n</ul>", "summary": "<p><strong>产后抑郁风险因素</strong>：</p>\n<p><strong>心理因素</strong>：</p>\n<ul>\n<li>产前焦虑、抑郁或情绪波动</li>\n<li>既往焦虑/抑郁史（尤其围产期发生）</li>\n<li>焦虑/抑郁/酒精滥用家族史（尤其一级亲属）</li>\n<li>严重婴儿忧郁</li>\n<li>内疚倾向、完美主义、低自尊</li>\n<li>EPDS（爱丁堡产后抑郁量表）≥12</li>\n</ul>\n<p><strong>社会因素</strong>：</p>\n<ul>\n<li>伴侣/他人缺乏情感和实际支持</li>\n<li>家庭暴力、创伤/虐待史（包括儿童期性虐待）</li>\n<li>近期多重压力生活事件</li>\n<li>低社会经济地位、失业</li>\n<li>非计划或非意愿妊娠</li>\n<li>初产或已有多个子女</li>\n</ul>\n<p><strong>生物/医学因素</strong>：</p>\n<ul>\n<li>近期停用精神药物</li>\n<li>严重妊娠或分娩并发症（<strong>包括紧急剖宫产</strong>）</li>\n<li>新生儿死亡、躯体健康差</li>\n<li>围产期睡眠剥夺</li>\n<li>新生儿医疗问题</li>\n</ul>\n<p><strong>择期剖宫产不增加风险</strong></p>", "explanation": "<p>产后抑郁最常见于产后1-8周。风险因素包括心理、社会和生物/医学多方面。紧急剖宫产属于严重分娩并发症而增加风险，但择期剖宫产不增加产后抑郁风险。不良生活事件、缺乏社会支持、既往抑郁史均显著增加风险。</p>", "references": "<ul>\n<li>Medscape - Postpartum Depression</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "产后抑郁风险因素 — 择期剖宫产不增加风险\n产后抑郁风险因素 — 择期剖宫产不增加风险\n which of the following does  not  increase the risk of postpartum depression? \n 产后抑郁最常见于产后1-8周。风险因素包括心理、社会和生物/医学多方面。紧急剖宫产属于严重分娩并发症而增加风险，但择期剖宫产不增加产后抑郁风险。不良生活事件、缺乏社会支持、既往抑郁史均显著增加风险。 "}, {"id": "AMC-Q0687", "type": "mcq", "qid": 687, "title": "多发梗死性痴呆 — 进行性记忆下降+局灶神经体征", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["多发梗死性痴呆 — 进行性记忆下降+局灶神经体征+偏瘫"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0687-Multi-Infarct-Dementia.md", "stem": "<p>A 76-year-old man is brought to your clinic by his son because of progressive decline in memory for the past 18 months, as well as weakness of his upper and lower limbs and deterioration of motor function. On examination, right hemiparesis is evident. Which one of the following could be the <strong>most likely diagnosis</strong>?</p>", "options": [{"letter": "A", "text": "Alzheimer's disease."}, {"letter": "B", "text": "Lewy body dementia."}, {"letter": "C", "text": "Multi-infarct dementia."}, {"letter": "D", "text": "Parkinson's disease."}, {"letter": "E", "text": "Pick's disease."}], "rationale": "<p>1. 题型识别：诊断 — 痴呆鉴别诊断 2. 关键线索：</p>\n<ul>\n<li>进行性记忆下降18个月</li>\n<li>上下肢无力+运动功能恶化</li>\n<li><strong>右侧偏瘫</strong> → 局灶神经体征</li>\n<p>3. 局灶运动神经体征是血管性痴呆的特征：</p>\n<li>阿尔茨海默病（A）：无运动/感觉障碍（晚期才出现）</li>\n<li>路易体痴呆（B）：帕金森症（震颤、肌强直）非偏瘫</li>\n<li>帕金森病（D）：震颤+锥体外系症状，<strong>非偏瘫</strong></li>\n<li>皮克病/FTD（E）：人格改变为主，非偏瘫</li>\n<li>多发梗死性痴呆（C）：阶梯式进展+局灶脑血管事件+<strong>偏瘫</strong> → 完全匹配</li>\n<p>4. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>帕金森痴呆 vs 血管性痴呆</strong>：帕金森有运动障碍（震颤、肌强直、步态异常），但偏瘫非其特征</li>\n<li><strong>FTD也有运动症状</strong>：但FTD以人格改变为首发且早期出现，记忆后受累</li>\n</ul>", "summary": "<p><strong>痴呆病因鉴别</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>首发/特征性症状</th><th>运动体征</th></tr></thead>\n<tbody>\n<tr><td><strong>Alzheimer</strong></td><td>记忆和视空间障碍</td><td>无（晚期才出现）</td></tr>\n<tr><td><strong>血管性（多发梗死）</strong></td><td>阶梯式进展+局灶体征</td><td><strong>偏瘫</strong>、局灶运动障碍</td></tr>\n<tr><td><strong>路易体</strong></td><td>波动意识+帕金森症+幻视</td><td>锥体外系征（震颤/肌强直）</td></tr>\n<tr><td><strong>FTD/皮克病</strong></td><td>人格改变+脱抑制</td><td>晚期可能累及</td></tr>\n<tr><td><strong>帕金森痴呆</strong></td><td>步态异常+震颤+肌强直+小写症</td><td>锥体外系征</td></tr>\n<tr><td><strong>NPH</strong></td><td>步态异常→记忆↓→尿失禁</td><td>步态异常</td></tr>\n<tr><td><strong>CJD</strong></td><td>快速进展+肌阵挛</td><td>肌阵挛</td></tr>\n</tbody>\n</table>\n<p><strong>血管性痴呆</strong>：</p>\n<ul>\n<li>第二常见痴呆类型（10%）</li>\n<li>分为多发梗死性（阶梯式进展）和Binswanger病（皮质下白质，缓慢进展）</li>\n</ul>", "explanation": "<p>临床表现最符合多发梗死性痴呆——仅次于阿尔茨海默病的最常见痴呆原因（占10%）。阿尔茨海默病、路易体痴呆和皮克病均不伴局灶运动障碍。帕金森痴呆伴震颤和锥体外系症状，偏瘫非其特征。多发梗死性痴呆典型表现为阶梯式进展伴多次脑血管事件，Binswanger病则累及皮质下白质呈缓慢进展。</p>", "references": "<ul>\n<li>Medscape - Dementia Pathology</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["weakness"], "search": "多发梗死性痴呆 — 进行性记忆下降+局灶神经体征\n多发梗死性痴呆 — 进行性记忆下降+局灶神经体征+偏瘫\n a 76-year-old man is brought to your clinic by his son because of progressive decline in memory for the past 18 months, as well as weakness of his upper and lower limbs and deterioration of motor function. on examination, right hemiparesis is evident. which one of the following could be the  most likely diagnosis ? \n 临床表现最符合多发梗死性痴呆——仅次于阿尔茨海默病的最常见痴呆原因（占10%）。阿尔茨海默病、路易体痴呆和皮克病均不伴局灶运动障碍。帕金森痴呆伴震颤和锥体外系症状，偏瘫非其特征。多发梗死性痴呆典型表现为阶梯式进展伴多次脑血管事件，binswanger病则累及皮质下白质呈缓慢进展。 "}, {"id": "AMC-Q0788b", "type": "mcq", "qid": 788, "title": "离题言语（Tangentiality）— 思维形式障碍的特征", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["离题言语（Tangentiality）— 精神病性障碍的表现"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0788-Tangentiality-Psychosis.md", "stem": "<p>During assessment of a 32-year-old woman, she says 'Oh well, my food! My food is cheese, cheese is in the air, air is blue, and I came by bus'. Which one of the following can be the <strong>most likely condition</strong> she is suffering from?</p>", "options": [{"letter": "A", "text": "Schizophrenia."}, {"letter": "B", "text": "Depression."}, {"letter": "C", "text": "Dissociation."}, {"letter": "D", "text": "Psychosis."}, {"letter": "E", "text": "Adjustment disorder."}], "rationale": "<p>1. 题型识别：诊断 — 症状对应的疾病类别 2. 分析言语：\"食物→奶酪→空气中→蓝色→坐公交车\" — 各句通过提示词连接但与初始主题无关 3. 这是<strong>离题言语（Tangentiality）</strong>：一个想法通过一个词或短语连接到下一个，想法偏离到不同主题 4. 表现离题的疾病：短暂精神病性、精神分裂症样、分裂情感障碍、精神分裂症 5. <strong>Psychosis（D）</strong>是涵盖所有上述障碍的<strong>广义诊断</strong> → 最佳答案 6. 精神分裂症（A）也是精神病，但D更全面（因为离题也可见于其他精神病性障碍） 7. 锁定答案：D</p>", "traps": "<ul>\n<li><strong>精神分裂症 vs 精神病</strong>：离题/脱轨在多种精神病性障碍中可见，Psychosis是更全面的诊断</li>\n<li><strong>离题 vs 脱轨</strong>：离题有提示词连接各句，脱轨完全无连接</li>\n</ul>", "summary": "<p><strong>思维形式障碍分类</strong>：</p>\n<p><strong>脱轨（Derailment/Loosening of Association）</strong>：</p>\n<ul>\n<li>各句之间完全无连接</li>\n<li>例：\"第二天我要出门...我掌控了，我在头发上用了漂白剂...\"</li>\n</ul>\n<p><strong>离题（Tangentiality）</strong>：</p>\n<ul>\n<li>各句之间有连接提示词，但偏离到不同主题，不回到起点</li>\n<li>例：\"有人渗透了我的案件副本。我们得侦察（CASE）这个地点（JOINT）。我不相信关节（JOINT），但它们确实把身体连接在一起。\"</li>\n</ul>\n<p><strong>精神病性障碍中可见的思维形式障碍</strong>：</p>\n<ul>\n<li>脱轨/思维松散</li>\n<li>离题</li>\n<li>言语内容贫乏（poverty of content of speech）</li>\n<li>思维阻断（thought blocking）</li>\n</ul>", "explanation": "<p>该案例描述了典型的离题言语——一个想法通过一个词或短语连接到下一个，想法偏离到不同主题。脱轨、思维松散、言语内容贫乏和思维阻断是精神病和精神病性障碍中思维内容紊乱的特征。短暂精神病性障碍、精神分裂症样障碍、分裂情感障碍和精神分裂症均可表现为离题/脱轨。Psychosis（精神病）是涵盖所有这些障碍的广义诊断。</p>", "references": "<ul>\n<li>Frontier Psychiatrist - Formal thought disorder</li>\n<li>Doctors Lounge - Formal thought disorders</li>\n<li>Medscape - History and Mental Status Examination</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "离题言语（tangentiality）— 思维形式障碍的特征\n离题言语（tangentiality）— 精神病性障碍的表现\n during assessment of a 32-year-old woman, she says 'oh well, my food! my food is cheese, cheese is in the air, air is blue, and i came by bus'. which one of the following can be the  most likely condition  she is suffering from? \n 该案例描述了典型的离题言语——一个想法通过一个词或短语连接到下一个，想法偏离到不同主题。脱轨、思维松散、言语内容贫乏和思维阻断是精神病和精神病性障碍中思维内容紊乱的特征。短暂精神病性障碍、精神分裂症样障碍、分裂情感障碍和精神分裂症均可表现为离题/脱轨。psychosis（精神病）是涵盖所有这些障碍的广义诊断。 "}, {"id": "AMC-Q0801", "type": "mcq", "qid": 801, "title": "酒精依赖筛查 — 晨起强制性饮酒（Eye-Opener）指向酒精依赖", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["酒精依赖筛查 — 晨起强制性饮酒（Eye-Opener）是CAGE的关键项"], "difficulty": 2, "correctAnswer": "A", "page": 1490, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0801-Alcohol-Dependence-Eye-Opener.md", "stem": "<p>An alcoholic man is brought to your clinic because of alcohol intoxication. He is successfully resuscitated. Which one of the following conditions in the history will direct you towards <strong>alcohol dependence</strong> in this patient?</p>", "options": [{"letter": "A", "text": "Any compulsory alcohol drinking first thing in the morning."}, {"letter": "B", "text": "He drinks when he is anxious."}, {"letter": "C", "text": "He drinks socially."}, {"letter": "D", "text": "He drinks when he is driving."}, {"letter": "E", "text": "He drinks more than 4 standard drinks in one single session."}], "rationale": "<p>1. 题型识别：诊断 — 危险信号识别 2. CAGE问卷4题对应4个选项维度：</p>\n<ul>\n<li><strong>C</strong>ut down：是否曾觉得需要减少饮酒？</li>\n<li><strong>A</strong>nnoyed：是否因别人问饮酒而恼怒？</li>\n<li><strong>G</strong>uilty：是否对饮酒感到内疚？</li>\n<li><strong>E</strong>ye-opener：是否早上第一件事就喝酒？</li>\n<p>3. 任何一项阳性 → 指向<strong>酒精依赖</strong> → 需详细评估 4. 选项A（晨起强制性饮酒）= Eye-opener → <strong>最特异指向酒精依赖</strong> 5. 其他选项：</p>\n<li>B：焦虑时饮酒 ≠ 酒精依赖（可能是应对方式）</li>\n<li>C：社交饮酒 ≠ 酒精依赖</li>\n<li>D：驾车饮酒很危险但≠依赖诊断</li>\n<li>E：单次>4标准杯是高危饮酒但不等于依赖</li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>高危饮酒 vs 酒精依赖</strong>：单次饮酒量（E）反映高危饮酒模式，但CAGE中的Eye-opener才是依赖的更强指征</li>\n<li><strong>社交/情绪饮酒</strong>：可能是有害饮酒但不一定达到依赖</li>\n</ul>", "summary": "<p><strong>CAGE问卷（4题）</strong>： 1. <strong>C</strong>UT down：是否觉得需要<strong>减少</strong>饮酒？ 2. <strong>A</strong>NNOYED：是否因别人询问饮酒而感到<strong>恼怒</strong>？ 3. <strong>G</strong>UILTY：是否对饮酒感到<strong>内疚</strong>？ 4. <strong>E</strong>YE-OPENER：是否早上第一件事就是喝酒（<strong>晨饮</strong>）？</p>\n<ul>\n<li>任何一项阳性 → 指向酒精依赖 → 需详细评估</li>\n</ul>\n<p><strong>AUDIT问卷</strong>：</p>\n<ul>\n<li>10题，总分40分</li>\n<li>≥8分提示酒精依赖</li>\n<li>假阳性/假阴性结果极少</li>\n</ul>", "explanation": "<p>GP中有筛查工具评估酒精依赖可能性，CAGE和AUDIT是最常用的两种。CAGE问卷由4个问题组成，任一阳性均提示酒精依赖。AUDIT问卷由10个问题组成，总分40分，≥8分提示酒精依赖。选项中，晨起强制性饮酒（Eye-opener）是酒精依赖的强指征。其他选项可见于酒精依赖者，但无助于确定依赖的诊断可能性。</p>", "references": "<ul>\n<li>http://www.australianprescriber.com/magazine/25/3/</li>\n<li>http://www.health.nt.gov.au/library/scripts/object</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "酒精依赖筛查 — 晨起强制性饮酒（eye-opener）指向酒精依赖\n酒精依赖筛查 — 晨起强制性饮酒（eye-opener）是cage的关键项\n an alcoholic man is brought to your clinic because of alcohol intoxication. he is successfully resuscitated. which one of the following conditions in the history will direct you towards  alcohol dependence  in this patient? \n gp中有筛查工具评估酒精依赖可能性，cage和audit是最常用的两种。cage问卷由4个问题组成，任一阳性均提示酒精依赖。audit问卷由10个问题组成，总分40分，≥8分提示酒精依赖。选项中，晨起强制性饮酒（eye-opener）是酒精依赖的强指征。其他选项可见于酒精依赖者，但无助于确定依赖的诊断可能性。 "}, {"id": "AMC-Q0813", "type": "mcq", "qid": 813, "title": "产后急性精神病 — 首先查尿毒物筛查排除物质诱导", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["产后急性精神病 — 首先查尿毒物筛查排除物质诱导"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0813-Postpartum-Psychosis-Urine-Drug-Screen.md", "stem": "<p>Jane, 32 years, gave birth to her child 3 days ago and has been in the ward since. On the second day, she went to the nurses and told them that she is very worried and afraid about her child and needs to keep her safe in the room. Last night she was seen walking around and moving objects whole night. She took an insecticide and sprayed on the floor to get rid of imaginary bugs. On examination, she is agitated with a heart rate of 110 bpm, respiratory rate of 22 breaths per minute and temperature of 37.5°C. Which one of the following is <strong>most important initial step</strong> in management?</p>", "options": [{"letter": "A", "text": "Blood culture."}, {"letter": "B", "text": "Full blood count (FBC)."}, {"letter": "C", "text": "Urine drug screen."}, {"letter": "D", "text": "CT scan of the head."}, {"letter": "E", "text": "Urine analysis (UA)."}], "rationale": "<p>1. 题型识别：治疗 — 急症初始评估优先级 2. 场景：产后3天 + 担心孩子 + 喷洒杀虫剂杀\"想象虫子\" + 激越 + 心率110 + 呼吸22 + 体温37.5 3. 鉴别诊断：</p>\n<ul>\n<li>物质诱导的精神病性障碍</li>\n<li>短暂精神病性障碍</li>\n<li><strong>产后精神病</strong>（产后2周内最常见）</li>\n<p>4. 但症状出现在<strong>产后早期（2-3天）</strong>→ 虽然可能，但对产后精神病来说<strong>早得有点不寻常</strong> 5. 更常见的病因应先排除：<strong>物质中毒</strong> 6. 体温37.5 → 不太可能是感染 → 排除血培养/FBC/UA 7. 无颅内病理提示 → 排除CT 8. 锁定答案：C（尿毒物筛查）</p>\n</ul>", "traps": "<ul>\n<li><strong>产后精神病=立即诊断？</strong>：虽然需考虑产后精神病，但更常见的物质诱导病因应先排除，尤其症状出现如此之早</li>\n<li><strong>感染排查</strong>：体温37.5°C不是感染的强证据，不作为优先级</li>\n<li><strong>产后精神病</strong>：罕见但重要；最常见在产后2周内出现，幻觉和妄想为主</li>\n</ul>", "summary": "<p><strong>产后急性精神病鉴别</strong>： 1. <strong>物质诱导的精神病性障碍</strong>（中毒/戒断）— 最常见，优先排除 2. 短暂精神病性障碍 3. <strong>产后精神病</strong> — 罕见但重要（产后2周内最常见）</p>\n<p><strong>产后精神病特征</strong>：</p>\n<ul>\n<li>幻觉和妄想（通常在）</li>\n<li>思维紊乱和/或怪异行为</li>\n<li>最常见在产后<strong>2周内</strong>出现</li>\n</ul>\n<p><strong>初始检查</strong>：尿毒物筛查（排除物质诱导后考虑产后精神病）</p>", "explanation": "<p>此案例符合产后早期急性精神病发作。需考虑和排除几种可能：物质诱导的精神病性障碍、短暂精神病性障碍和产后精神病。考虑到症状出现时间（产后很快）和体格检查发现，物质中毒应首先排除。为此，尿毒物筛查是最适当措施。产后精神病最多见于产后2周内，虽然有此诊断可能，但更常见病因应先排除。体温37.5不太可能为感染过程。</p>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/294416-worku</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "产后急性精神病 — 首先查尿毒物筛查排除物质诱导\n产后急性精神病 — 首先查尿毒物筛查排除物质诱导\n jane, 32 years, gave birth to her child 3 days ago and has been in the ward since. on the second day, she went to the nurses and told them that she is very worried and afraid about her child and needs to keep her safe in the room. last night she was seen walking around and moving objects whole night. she took an insecticide and sprayed on the floor to get rid of imaginary bugs. on examination, she is agitated with a heart rate of 110 bpm, respiratory rate of 22 breaths per minute and temperature of 37.5°c. which one of the following is  most important initial step  in management? \n 此案例符合产后早期急性精神病发作。需考虑和排除几种可能：物质诱导的精神病性障碍、短暂精神病性障碍和产后精神病。考虑到症状出现时间（产后很快）和体格检查发现，物质中毒应首先排除。为此，尿毒物筛查是最适当措施。产后精神病最多见于产后2周内，虽然有此诊断可能，但更常见病因应先排除。体温37.5不太可能为感染过程。 "}, {"id": "AMC-Q0822", "type": "mcq", "qid": 822, "title": "脱轨（Derailment）— 各句之间完全无连接", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["思维形式障碍 — 脱轨（Derailment/Loosening of Association）"], "difficulty": 3, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0822-Derailment-Thought-Disorder.md", "stem": "<p>A 23-year-old woman is referred to you for psychiatric assessment. When you ask her what she thinks to be her problem, she answers: \"Oh, isn't it a long story? The train always runs on rails; the birds keep flying up the hills and I have to remember to count my chickens before they hatch.\" At the end she does <strong>not</strong> come back to answer the question you asked. Which one of the following is the <strong>most likely thought disorder</strong> she has?</p>", "options": [{"letter": "A", "text": "Derailment."}, {"letter": "B", "text": "Flight of ideas."}, {"letter": "C", "text": "Pressured speech."}, {"letter": "D", "text": "Circumstantiality."}, {"letter": "E", "text": "Word salad."}], "rationale": "<p>1. 题型识别：诊断 — 思维形式障碍识别 2. 分析患者言语：</p>\n<ul>\n<li>\"是不是故事很长？\" → \"火车总是在轨道上跑\" → \"鸟儿飞上山\" → \"记住在鸡蛋孵化前数小鸡\"</li>\n<li><strong>各句之间完全无逻辑连接</strong></li>\n<li><strong>最终未回答问题</strong></li>\n<p>3. 各选项对比：</p>\n<li><strong>脱轨（A）</strong>：无连接+不回起点 → <strong>完美匹配</strong></li>\n<li>思维奔逸（B）：言语过多+快速切换+主观思维加速感 → 不匹配</li>\n<li>言语急促（C）：快速激动地说话，难以打断 → 不匹配</li>\n<li>赘述（D）：绕弯但<strong>最终回到主题</strong> → 不匹配（她没有回来）</li>\n<li>语词杂拌（E）：词语无意义堆砌 → 仍有一定结构</li>\n<p>4. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>脱轨 vs 离题</strong>：脱轨各句无连接，离题有连接提示词但偏离主题（离题是较温和的形式）</li>\n<li><strong>脱轨 vs 赘述</strong>：关键区别 — 赘述最终回到起点，脱轨永不回来</li>\n<li><strong>脱轨 vs 语词杂拌</strong>：语词杂拌完全无结构和意义，脱轨中单个句子可能还有意义但互不关联</li>\n</ul>", "summary": "<p><strong>思维形式障碍对比（完整版）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>特征</th><th>回主题？</th><th>连接性</th></tr></thead>\n<tbody>\n<tr><td><strong>脱轨（Derailment）</strong></td><td>各句无连接，不回主题</td><td>否</td><td>无</td></tr>\n<tr><td><strong>离题（Tangentiality）</strong></td><td>有提示词连接的温和脱轨</td><td>否</td><td>有提示词</td></tr>\n<tr><td><strong>赘述（Circumstantiality）</strong></td><td>绕弯但回主题</td><td>是</td><td>有，以上句为线索</td></tr>\n<tr><td><strong>思维奔逸（Flight of ideas）</strong></td><td>言语过多，快速切换，主观思维加速</td><td>否</td><td>有但过度</td></tr>\n<tr><td><strong>言语急促（Pressured speech）</strong></td><td>快速激动，难以打断</td><td>不定</td><td>—</td></tr>\n<tr><td><strong>语词杂拌（Word salad）</strong></td><td>词语无意义堆砌，无结构</td><td>—</td><td>乱</td></tr>\n</tbody>\n</table>\n<p><strong>真实案例对比</strong>：</p>\n<ul>\n<li>脱轨：\"第二天我出门你知道，我掌控了。就像我把漂白剂弄头发上了...\"</li>\n<li>离题：\"有人渗透了我的案件。我们得侦察（CASE）这个地点（JOINT）。我不相信关节（JOINT），但它们把身体连在一起。\"（大写词为连接提示）</li>\n</ul>", "explanation": "<p>患者言语模式以脱轨（思维松散）为特征——一句与下一句之间无连接。其中一句话说完后，另一句与前一句无关的话接着出现。离题是较温和的脱轨形式，连续句子之间有连接提示。思维奔逸特征为言语过多和快速切换，有主观思维加速感。言语急促是快速激动说话，难以打断。赘述绕弯但最终回到主题。语词杂拌是词语无意义堆砌。</p>", "references": "<ul>\n<li>Frontier Psychiatrist - Formal thought disorder</li>\n<li>Doctors Lounge - Formal thought disorders</li>\n<li>Medscape - History and Mental Status Examination</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "脱轨（derailment）— 各句之间完全无连接\n思维形式障碍 — 脱轨（derailment/loosening of association）\n a 23-year-old woman is referred to you for psychiatric assessment. when you ask her what she thinks to be her problem, she answers: \"oh, isn't it a long story? the train always runs on rails; the birds keep flying up the hills and i have to remember to count my chickens before they hatch.\" at the end she does  not  come back to answer the question you asked. which one of the following is the  most likely thought disorder  she has? \n 患者言语模式以脱轨（思维松散）为特征——一句与下一句之间无连接。其中一句话说完后，另一句与前一句无关的话接着出现。离题是较温和的脱轨形式，连续句子之间有连接提示。思维奔逸特征为言语过多和快速切换，有主观思维加速感。言语急促是快速激动说话，难以打断。赘述绕弯但最终回到主题。语词杂拌是词语无意义堆砌。 "}, {"id": "AMC-Q0848", "type": "mcq", "qid": 848, "title": "激越患者精神科评估 — 首先获取辅助信息", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["激越患者的精神科评估 — 首先获取辅助信息"], "difficulty": 3, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0848-Homeless-Agitation-Collateral.md", "stem": "<p>A 47-year-old homeless man is brought to the Emergency Department by the police after he was found agitated and fearful in the streets while carrying a bag full of rubbish. He says to you, as the treating doctor, that he was caught by special military forces because he did not return the DVDs to a shop that belongs to the Jewish brotherhood. He also mentions that he has been followed by demons because he has not done his prayers. He does not seem to be drunk but looks exhausted and agitated. Which one of the following options is the <strong>most appropriate next step</strong> in management of this patient?</p>", "options": [{"letter": "A", "text": "Admit him to psychiatric unit for evaluation and treatment."}, {"letter": "B", "text": "Ask the police about him."}, {"letter": "C", "text": "Arrange urgent parenteral antipsychotics."}, {"letter": "D", "text": "Arrange admission to general ward for assessment of his medical status."}, {"letter": "E", "text": "Perform a urinary toxicology screen."}], "rationale": "<p>1. 题型识别：治疗 — 精神科评估优先级 2. 临床表现：无家可归者 + 激越 + 恐惧 + 偏执妄想（特种部队因未还DVD抓他）+ 宗教妄想（因没祷告被恶魔跟踪）+ 不醉酒但疲惫 3. 精神科激越评估步骤：</p>\n<ul>\n<li><strong>降级</strong>（口头 + 必要时药物）</li>\n<li>视觉观察（面试前）</li>\n<li><strong>收集辅助信息</strong>（家人/警察/急救员/病历）← 最高优先级</li>\n<li>正式精神科评估</li>\n<p>4. 选项分析：</p>\n<li>警察询问（B）：获取辅助信息，是该场景下<strong>最高优先级</strong></li>\n<li>住院（A/D）：确定无急性躯体问题后考虑</li>\n<li>抗精神病药（C）：口头降级失败后使用</li>\n<li>尿毒物筛查（E）：辅助检查，可随后进行</li>\n<p>5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>\"直接收住院\"的直觉</strong>：应先获取更多信息（警察的观察），再决定收住何处</li>\n<li><strong>辅助信息优先级</strong>：在精神科评估中，收集辅助信息与降级同等重要</li>\n<li><strong>不要跳过谵妄筛查</strong>：后续需排除谵妄（意识水平改变+注意力问题）</li>\n</ul>", "summary": "<p><strong>激越患者精神科评估步骤</strong>： 1. <strong>降级</strong>：口头降级；必要时药物降级（镇静） 2. <strong>视觉观察</strong>：面试前直接观察患者的口头和非口头互动 3. <strong>收集辅助信息（最高优先级）</strong>：</p>\n<ul>\n<li>降级进行中 → 另一成员获取口头报告</li>\n<li>来源：家人、急救员、<strong>警察</strong>、病历</li>\n<li>电子病历检查（可用时）</li>\n<p>4. <strong>谵妄评估</strong>：</p>\n<li>排除谵妄（常被漏诊）</li>\n<li>谵妄 = 意识水平改变 + 注意力问题 + 可能视幻觉</li>\n<li>如激越伴上述症状 + 药物/躯体疾病 → 推定诊断=谵妄</li>\n<p>5. <strong>自杀/自伤风险评估</strong> 6. <strong>物质中毒/戒断可能</strong> 7. 一般躯体状况评估 8. 详细精神科评估</p>\n</ul>", "explanation": "<p>精神科评估激越患者包括降级、视觉观察和收集辅助信息。在降级进行的同时，另一团队成员可获取家人、急救员或警察的口头报告，或查阅随患者带来的书面材料。病历也是重要信息来源。选项中，询问警察具有最高优先级，可提供进一步管理所需的额外信息。确定无急性躯体问题后，再决定住院和精神科评估。抗精神病药在口头降级失败后使用。</p>", "references": "<ul>\n<li>WestJM - Psychiatric Evaluation of the Agitated Patient: Consensus Statement of the American Association for Emergency Psychiatry Project BETA Psychiatric Evaluation Workgroup</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "激越患者精神科评估 — 首先获取辅助信息\n激越患者的精神科评估 — 首先获取辅助信息\n a 47-year-old homeless man is brought to the emergency department by the police after he was found agitated and fearful in the streets while carrying a bag full of rubbish. he says to you, as the treating doctor, that he was caught by special military forces because he did not return the dvds to a shop that belongs to the jewish brotherhood. he also mentions that he has been followed by demons because he has not done his prayers. he does not seem to be drunk but looks exhausted and agitated. which one of the following options is the  most appropriate next step  in management of this patient? \n 精神科评估激越患者包括降级、视觉观察和收集辅助信息。在降级进行的同时，另一团队成员可获取家人、急救员或警察的口头报告，或查阅随患者带来的书面材料。病历也是重要信息来源。选项中，询问警察具有最高优先级，可提供进一步管理所需的额外信息。确定无急性躯体问题后，再决定住院和精神科评估。抗精神病药在口头降级失败后使用。 "}, {"id": "AMC-Q0853", "type": "mcq", "qid": 853, "title": "勃起功能障碍 — PDE5抑制剂（西地那非）为一线治疗", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["勃起功能障碍 — PDE5抑制剂（西地那非）为一线治疗"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0853-Erectile-Dysfunction-Sildenafil.md", "stem": "<p>A 35-year-old man presents to your practice with complaint of impotence for the past few months. He smokes 20 cigarettes and regularly drinks 3-4 glasses of wine a day. He is marrying his fiancee in one month. Which one of the following would be the <strong>most appropriate management</strong> option for him at this stage?</p>", "options": [{"letter": "A", "text": "Cessation of smoking."}, {"letter": "B", "text": "Cessation of alcohol drinking."}, {"letter": "C", "text": "Referral for psychotherapy."}, {"letter": "D", "text": "Prescribe sildenafil."}, {"letter": "E", "text": "Prescribe clomipramine."}], "rationale": "<p>1. 题型识别：治疗 — 一线治疗选择 2. 场景：35岁男性，阳痿数月，吸烟+饮酒，一个月后结婚 3. 勃起功能障碍管理原则：</p>\n<ul>\n<li><strong>一线治疗</strong>：PDE5抑制剂（西地那非等），无论病因</li>\n<li>二线（难治性）：PDE5抑制剂 + PGE1注射</li>\n<p>4. 生活方式改善（A/B）应当考虑但<strong>不是一线治疗</strong> 5. 心理治疗（C）：纯心因性ED不常见，多因素病因不需仅心理治疗 6. 氯米帕明（E）：三环类抗抑郁药，可<strong>引起</strong>性功能障碍而非治疗 7. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>戒烟戒酒 vs 用药</strong>：生活方式改变是好建议，但不是一线治疗——患者一个月后结婚，需要快速有效的解决方案</li>\n<li><strong>心理治疗</strong>：纯心因性ED罕见，多数有多因素病因（器质+心理+生活方式），药物治疗是一线</li>\n<li><strong>氯米帕明方向</strong>：TCA可<strong>导致</strong>性功能障碍，不是治疗</li>\n</ul>", "summary": "<p><strong>勃起功能障碍（ED）/ 阳痿（Impotence）</strong>：</p>\n<ul>\n<li>定义：无法达到或维持足够满意性表现的勃起</li>\n<li>病因：通常多因素（器质+生理+内分泌+心因性）</li>\n<li><strong>分两类</strong>：器质性（为主）和心因性（单纯心因性罕见）</li>\n</ul>\n<p><strong>相关疾病</strong>（几乎任何疾病都可能影响勃起功能）：</p>\n<ul>\n<li>糖尿病、高血压（关联最强）、冠心病</li>\n<li>神经系统疾病、内分泌疾病</li>\n<li>良性前列腺增生、睡眠呼吸暂停、COPD、抑郁</li>\n</ul>\n<p><strong>评估</strong>：</p>\n<ul>\n<li>性史、病史、心理社会史</li>\n<li>体格检查（泌尿生殖、血管、神经系统）</li>\n<li>血压、外周脉搏、感觉、生殖器和前列腺状态、睾丸大小、阴茎异常</li>\n</ul>\n<p><strong>管理（一线治疗）</strong>：</p>\n<ul>\n<li><strong>口服PDE5抑制剂</strong>：西地那非、伐地那非、他达拉非、阿伐那非</li>\n<li>难治性：PDE5抑制剂+PGE1注射</li>\n<li>其他：性咨询（无器质性原因时）、外部真空装置、手术</li>\n</ul>", "explanation": "<p>除非有禁忌证，口服PDE5抑制剂如西地那非是勃起功能障碍的一线治疗，无论病因如何。生活方式改善（控制体重、运动、戒烟减酒）应被考虑但非一线治疗。虽然心理因素常被提及为影响因素，但纯心因性ED实际上不常见；多数器质病因患者也有相关心因性成分。PDE5抑制剂为难治性患者也可联合PGE1注射使用。</p>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/444220-overv</li>\n<li>https://www.andrologyaustralia.org/wp-content/uplo</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "勃起功能障碍 — pde5抑制剂（西地那非）为一线治疗\n勃起功能障碍 — pde5抑制剂（西地那非）为一线治疗\n a 35-year-old man presents to your practice with complaint of impotence for the past few months. he smokes 20 cigarettes and regularly drinks 3-4 glasses of wine a day. he is marrying his fiancee in one month. which one of the following would be the  most appropriate management  option for him at this stage? \n 除非有禁忌证，口服pde5抑制剂如西地那非是勃起功能障碍的一线治疗，无论病因如何。生活方式改善（控制体重、运动、戒烟减酒）应被考虑但非一线治疗。虽然心理因素常被提及为影响因素，但纯心因性ed实际上不常见；多数器质病因患者也有相关心因性成分。pde5抑制剂为难治性患者也可联合pge1注射使用。 "}, {"id": "AMC-Q0857", "type": "mcq", "qid": 857, "title": "精神分裂症 — 青少年期前驱期 + 幻觉", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["精神分裂症 — 青少年期前驱期（阴性症状2年）+ 幻觉，病程>6个月"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0857-Schizophrenia-Adolescent.md", "stem": "<p>A 17-year-old boy is brought to your office by his mother for evaluation. History reveals that he had always been a good student until the age 15 when his grades began dropping. His mother has also noticed that he has stopped socializing with friends and begun spending more time alone in his room. He dropped the school earlier this year due to poor school performance. His mother reports that he has been trying to home-school him, but he does not seem interested in learning. Days go before he takes bath and he does not seem to care about his appearance. What concerns the mother most and has led her to bringing him to see a psychiatrist is the fact that for the past 2 months, she has overheard him having what sounds like conversations with someone imaginary in his room. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Major depressive disorder."}, {"letter": "B", "text": "Substance abuse disorder."}, {"letter": "C", "text": "Schizophrenia."}, {"letter": "D", "text": "Brief psychotic disorder."}, {"letter": "E", "text": "Schizophreniform disorder."}], "rationale": "<p>1. 题型识别：诊断 2. 关键症状：</p>\n<ul>\n<li><strong>幻觉</strong>：与想象中的人交谈（幻听）</li>\n<li><strong>阴性症状</strong>：缺乏动力、孤僻、自我照顾差，持续约2年</li>\n<li>社会/职业功能障碍：成绩下降、辍学</li>\n<p>3. 精神分裂症诊断标准：</p>\n<li>≥2项核心症状（幻觉、妄想、言语紊乱、行为紊乱、阴性症状）</li>\n<li>症状引起显著社会或职业功能损害</li>\n<li>症状持续≥6个月</li>\n<li>排除其他精神病性障碍及物质/躯体病因</li>\n<p>4. 鉴别：</p>\n<li>重性抑郁（A）：无抑郁发作史；先有2年阴性症状后有阳性症状，支持分裂症</li>\n<li>物质滥用（B）：无任何提示，青少年与父母同住2年不被察觉不似</li>\n<li>短暂精神病性障碍（D）：<1个月，恢复至病前功能</li>\n<li>分裂样精神障碍（E）：≤6个月</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>前驱期误诊为抑郁</strong>：长期阴性症状（成绩下降、社交退缩）易被误认为抑郁症——精神
