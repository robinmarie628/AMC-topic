- Pediatric Urinary Tract Infection</li>\n</ul>", "related": ["AMC-Q0115-Pediatric-UTI-Presentation", "AMC-Q1296-DMSA-Renal-Scarring", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "儿童 uti 住院指征 — <2 月龄必须住院\n儿童 uti 住院指征 — <2 月龄婴儿\n for which one of the following children with urinary tract infection (uti) hospital admission is indicated? \n 根据皇家儿童医院（rch）指南，以下 uti 患儿应收入院： \n \n 临床中毒或败血症表现 \n   发热性 uti 婴儿 \n 免疫功能低下 \n 呕吐/无法耐受口服抗生素 \n 无可靠的随访条件 \n "}, {"id": "AMC-Q0962", "type": "mcq", "qid": 962, "title": "儿童间歇性腹痛 + 侧腹疼 + 尿检阴性 → UPJ 梗阻；查超声（疼痛时）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": ["diagnosis", "investigation"], "topic": ["UPJ Obstruction", "Hydronephrosis", "Ultrasound during pain", "Flank pain"], "difficulty": 4, "correctAnswer": "E", "page": 1321, "tags": ["mcq", "amc", "paediatrics", "nephrology", "upj-obstruction", "hydronephrosis", "ultrasound", "approach-diagnosis", "approach-investigation"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0962-UPJ-Obstruction-Ultrasound.md", "stem": "<p>A 5-year-old boy with intermittent abdominal pain and vomiting usually lasting 12 hours. Last episode in left flank. Urinalysis and culture negative. Which investigation is most likely to reveal the cause?</p>", "options": [{"letter": "A", "text": "Plain abdominal films."}, {"letter": "B", "text": "Small intestine barium meal and follow-through."}, {"letter": "C", "text": "Serum creatinine and BUN."}, {"letter": "D", "text": "Serum electrolytes."}, {"letter": "E", "text": "Ultrasound scan during a painful episode."}], "rationale": "<p>1. <strong>题型识别</strong>：5 岁间歇性腹痛 + 呕吐 + 侧腹疼 + 尿检阴性 → 考肾积水/UPJ 梗阻的诊断检查。 2. <strong>间歇性腹痛 DDx</strong>：功能性（最多）、腹型偏头痛、IBS、肠系膜淋巴结炎、便秘；少见：肾积水、肠套叠、IBD、胰腺/肝胆、UTI、脾大、吞气、肿瘤、感染等。 3. <strong>定位肾源</strong>：侧腹疼 + 尿检/培养阴性 → 排除 UTI；结石可能低 → 考虑 UPJ 梗阻致肾积水。 4. <strong>UPJ 梗阻</strong>：小儿肾积水最常见原因（1/1000–2000 新生儿）。年长儿周期性侧腹疼 + 呕吐 = UPJ 间歇性扭结；不缓解 → 严重肾积水。 5. <strong>检查</strong>：超声是肾积水/UPJ 初始选择；<strong>间歇性</strong> → 疼痛发作时超声最易显影。 6. <strong>排除</strong>：</p>\n<ul>\n<li>A/B：腹平片/钡剂用于疑肠套叠（但 <2 岁、无侧腹疼，不符）。</li>\n<li>C/D：Cr/BUN/电解质评估肾功能，诊断价值低。</li>\n<p>7. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"腹痛 = 胃肠 → 钡剂\"陷阱</strong>：错。侧腹疼 + 尿检阴性指向肾，不是肠套叠。</li>\n<li><strong>\"查肾功能（Cr/BUN）\"陷阱</strong>：错。诊断价值低，不定位。</li>\n<li><strong>\"任何时间超声都行\"陷阱</strong>：错。间歇性 → <strong>疼痛时</strong>超声才易显影。</li>\n<li><strong>忽略 40% 功能性</strong>：但本例有侧腹疼 + 阴性尿检，非单纯功能性。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Intermittent abdominal pain: ~40% no cause found (functional). Other causes include abdominal migraine, IBS, mesenteric lymphadenitis, constipation; less common: hydronephrosis, intussusception, IBD, pancreatic/hepatic, UTI, splenomegaly, aerophagia, tumors, infections. Flank pain + negative UA makes UTI/stone unlikely → UPJ obstruction (hydronephrosis) likely. UPJ obstruction = most common cause pediatric hydronephrosis (1/1000–2000 newborns). Older children: periodic flank pain + vomiting from intermittent kinking; severe hydronephrosis if unresolved. Ultrasonography is initial for hydronephrosis/UPJ; sonography during painful attack most likely delineates. (A/B) X-ray/barium if intussusception (but <2yo, no flank pain). (C/D) electrolytes/Cr/BUN little diagnostic value.</p>", "references": "<ul>\n<li>Medscape - Pediatric Ureteropelvic Junction Obstruction</li>\n<li>Medscape - Hydronephrosis and Hydroureter</li>\n<li>UpToDate - Clinical manifestations and diagnosis of urinary tract obstruction and hydronephrosis</li>\n</ul>", "related": ["AMC-Q0964-UPJ-Obstruction-Mass", "AMC-Q0963-Wilms-Tumor", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["UPJ Obstruction"], "complaints": ["abdominal pain", "nausea/vomiting"], "search": "儿童间歇性腹痛 + 侧腹疼 + 尿检阴性 → upj 梗阻；查超声（疼痛时）\nupj obstruction hydronephrosis ultrasound during pain flank pain\ndiagnosis investigation\n a 5-year-old boy with intermittent abdominal pain and vomiting usually lasting 12 hours. last episode in left flank. urinalysis and culture negative. which investigation is most likely to reveal the cause? \n correct answer is  e  \n intermittent abdominal pain: ~40% no cause found (functional). other causes include abdominal migraine, ibs, mesenteric lymphadenitis, constipation; less common: hydronephrosis, intussusception, ibd, pancreatic/hepatic, uti, splenomegaly, aerophagia, tumors, infections. flank pain + negative ua makes uti/stone unlikely → upj obstruction (hydronephrosis) likely. upj obstruction = most common cause pediatric hydronephrosis (1/1000–2000 newborns). older children: periodic flank pain + vomiting from intermittent kinking; severe hydronephrosis if unresolved. ultrasonography is initial for hydronephrosis/upj; sonography during painful attack most likely delineates. (a/b) x-ray/barium if intussusception (but  "}, {"id": "AMC-Q0964", "type": "mcq", "qid": 964, "title": "复发性侧腹痛 + 呕吐 + 压痛 RUQ 包块 → UPJ 梗阻（vs Wilms 无痛）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": ["diagnosis", "differential"], "topic": ["UPJ Obstruction", "Recurrent flank pain", "Tender mass", "Hydronephrosis"], "difficulty": 3, "correctAnswer": "C", "page": 1326, "tags": ["mcq", "amc", "paediatrics", "nephrology", "upj-obstruction", "hydronephrosis", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0964-UPJ-Obstruction-Mass.md", "stem": "<p>A 4-year-old with intermittent RUQ and right flank pain for 2 years. Episodes with vomiting, lasting 3h. Well between. This time 12h. Mass palpated RUQ, tender. Most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Wilms tumor."}, {"letter": "B", "text": "Neuroblastoma."}, {"letter": "C", "text": "Ureteropelvic junction obstruction."}, {"letter": "D", "text": "Vesicoureteral reflux (VUR)."}, {"letter": "E", "text": "Pyelonephritis."}], "rationale": "<p>1. <strong>题型识别</strong>：4 岁反复侧腹痛 + 呕吐 + 压痛包块 → 考 UPJ 梗阻 vs 腹部肿瘤。 2. <strong>UPJ 梗阻</strong>：小儿肾积水最常见原因（1/1000–2000）。年长儿周期性侧腹疼 + 呕吐（UPJ 间歇性扭结）；不缓解 → 严重肾积水/肾盂扩张 → 侧腹疼甚至压痛。 3. <strong>鉴别</strong>：</p>\n<ul>\n<li>A Wilms：光滑硬、无痛、不过中线 → 本例<strong>压痛</strong>不符。</li>\n<li>B Neuroblastoma：<2 岁更多，硬不规则、无痛、可过中线；年龄 + 压痛不符。</li>\n<li>D/E：pyelonephritis / VUR 不引起可触及包块。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"无痛包块 = Wilms\"陷阱</strong>：错。本例包块<strong>压痛</strong>，Wilms 无痛，故偏 UPJ（积水扩张可压痛）。</li>\n<li><strong>\"神经母细胞瘤\"陷阱</strong>：错。<2 岁、硬不规则、过中线；不符。</li>\n<li><strong>\"发热 + 压痛 = 感染\"陷阱</strong>：错。pyelonephritis 无包块。</li>\n<li><strong>压痛的意义</strong>：UPJ 梗阻严重肾积水时包块可压痛，是区分 Wilms 的关键。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Intermittent abdominal pain has diverse causes. UPJ obstruction = most common pediatric hydronephrosis (1/1000–2000 newborns). Older children: periodic flank pain + vomiting from intermittent kinking; if unresolved → severe hydronephrosis, pelvic distention → flank pain or tenderness. (A) Wilms: smooth firm NON-tender mass not crossing midline → less likely (mass here tender). (B) Neuroblastoma: most common extracranial malignant tumor, <2yo, hard irregular non-tender, may cross midline. (D/E) VUR/pyelonephritis don't cause palpable mass.</p>", "references": "<ul>\n<li>Medscape - Pediatric Ureteropelvic Junction Obstruction</li>\n<li>Medscape - Hydronephrosis and Hydroureter</li>\n<li>UpToDate - Clinical manifestations and diagnosis of urinary tract obstruction and hydronephrosis</li>\n<li>AAFP - Recognition of Common Childhood Malignancies</li>\n</ul>", "related": ["AMC-Q0962-UPJ-Obstruction-Ultrasound", "AMC-Q0963-Wilms-Tumor", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Wilms Tumor", "UPJ Obstruction"], "complaints": ["nausea/vomiting"], "search": "复发性侧腹痛 + 呕吐 + 压痛 ruq 包块 → upj 梗阻（vs wilms 无痛）\nupj obstruction recurrent flank pain tender mass hydronephrosis\ndiagnosis differential\n a 4-year-old with intermittent ruq and right flank pain for 2 years. episodes with vomiting, lasting 3h. well between. this time 12h. mass palpated ruq, tender. most likely diagnosis? \n correct answer is  c  \n intermittent abdominal pain has diverse causes. upj obstruction = most common pediatric hydronephrosis (1/1000–2000 newborns). older children: periodic flank pain + vomiting from intermittent kinking; if unresolved → severe hydronephrosis, pelvic distention → flank pain or tenderness. (a) wilms: smooth firm non-tender mass not crossing midline → less likely (mass here tender). (b) neuroblastoma: most common extracranial malignant tumor,  "}, {"id": "AMC-Q1296", "type": "mcq", "qid": 1296, "title": "反复 UTI 患儿 — DMSA 评估肾瘢痕", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["反复 UTI 患儿 — DMSA 肾静态显像评估肾瘢痕"], "difficulty": 3, "correctAnswer": "A", "page": 1355, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q1296-DMSA-Renal-Scarring.md", "stem": "<p>You order an ultrasound scan for a 9-year-old girl, who has been brought for treatment of urinary tract infection for the second time this year. On the ultrasound, the right kidney is reported smaller than the left beyond the normal discrepancy. Which one of the following is the most appropriate investigation to consider for assessment of renal status?</p>", "options": [{"letter": "A", "text": "DMSA."}, {"letter": "B", "text": "DTPA scintigraphy."}, {"letter": "C", "text": "Urea and electrolytes."}, {"letter": "D", "text": "Abdominal CT scan."}, {"letter": "E", "text": "Urine culture."}], "rationale": "<p>1. 题型识别：检查选择 — 反复 UTI + 超声提示一侧肾缩小 → 需评估肾实质损伤（肾瘢痕） 2. 关键线索：复发性 UTI、超声一侧肾缩小 > 正常差异范围 3. 鉴别排除：</p>\n<ul>\n<li>DTPA（B）：可评估肾功能但 DMSA 仍是金标准 / U&E（C）：反映肾排泄功能而非肾实质 / CT（D）：解剖结构，不评估功能 / 尿培养（E）：判断感染存在与否，不评估肾功能</li>\n<p>4. 锁定答案：DMSA 是肾瘢痕金标准 → A</p>\n</ul>", "traps": "<ul>\n<li><strong>DTPA 混淆</strong>：DTPA 也可评估肾功能和瘢痕，速度快、辐射少，但 DMSA 仍为金标准 — 考试中选金标准</li>\n<li><strong>U&E 正常不代表肾正常</strong>：单侧肾严重损伤而另一侧代偿时，尿素和肌酐可在正常范围</li>\n<li><strong>超声 ≠ 功能评估</strong>：超声只看形态/大小，不评估肾功能</li>\n</ul>", "summary": "<p><strong>DMSA 扫描</strong>是诊断肾瘢痕的金标准。DMSA 适应证：</p>\n<ul>\n<li>临床怀疑肾损伤</li>\n<li>肾功能下降</li>\n<li>怀疑 VUR（膀胱输尿管反流）</li>\n<li>年长已排尿训练的儿童超声提示梗阻性尿路病</li>\n</ul>\n<p>反复 UTI + 超声一侧肾缩小 → <strong>首选 DMSA</strong>。</p>", "explanation": "<ul>\n<li><strong>A. DMSA</strong>：二巯基丁二酸肾静态显像，是诊断肾瘢痕的金标准，适用于反复 UTI 导致可能的肾损伤</li>\n<li><strong>B. DTPA</strong>：DTPA 肾动态显像（Tc99 标记），也能提供肾功能和瘢痕信息，比 DMSA 更快、辐射更少，但 DMSA 仍是金标准</li>\n<li><strong>C. 尿素和肌酐</strong>：升高提示肾功能受损，但不反映肾脏本身功能。正常值也不能排除单侧肾损伤（对侧代偿）</li>\n<li><strong>D. 腹部 CT</strong>：可视化肾脏及周围结构，但无法评估肾功能</li>\n<li><strong>E. 尿培养</strong>：显示感染存在与否，不提供肾功能信息</li>\n</ul>", "references": "<ul>\n<li>RACGP - Paediatric urinary tract infections: Diagnosis and treatment</li>\n</ul>", "related": ["AMC-Q0115-Pediatric-UTI-Presentation", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "反复 uti 患儿 — dmsa 评估肾瘢痕\n反复 uti 患儿 — dmsa 肾静态显像评估肾瘢痕\n you order an ultrasound scan for a 9-year-old girl, who has been brought for treatment of urinary tract infection for the second time this year. on the ultrasound, the right kidney is reported smaller than the left beyond the normal discrepancy. which one of the following is the most appropriate investigation to consider for assessment of renal status? \n \n  a. dmsa ：二巯基丁二酸肾静态显像，是诊断肾瘢痕的金标准，适用于反复 uti 导致可能的肾损伤 \n  b. dtpa ：dtpa 肾动态显像（tc99 标记），也能提供肾功能和瘢痕信息，比 dmsa 更快、辐射更少，但 dmsa 仍是金标准 \n  c. 尿素和肌酐 ：升高提示肾功能受损，但不反映肾脏本身功能。正常值也不能排除单侧肾损伤（对侧代偿） \n  d. 腹部 ct ：可视化肾脏及周围结构，但无法评估肾功能 \n  e. 尿培养 ：显示感染存在与否，不提供肾功能信息 \n "}, {"id": "AMC-Q1399", "type": "mcq", "qid": 1399, "title": "无症状持续性蛋白尿 — 下一步完整尿液检查", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["无症状持续性蛋白尿 — 下一步完整尿液检查"], "difficulty": 3, "correctAnswer": "C", "page": 1366, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q1399-Persistent-Proteinuria-Urinalysis.md", "stem": "<p>An 8-year-old boy is found to have persistent proteinuria of 2+ on dipstick urine. There is no hematuria. Physical examination including blood pressure is unremarkable. Which one of the following is the next best investigation to consider for this boy?</p>", "options": [{"letter": "A", "text": "Renal biopsy."}, {"letter": "B", "text": "12-hour urine protein."}, {"letter": "C", "text": "Urine examination."}, {"letter": "D", "text": "C3 and C4 level measurement."}, {"letter": "E", "text": "Ultrasonography."}], "rationale": "<p>1. 题型识别：检查顺序 — 无症状持续性蛋白尿的诊断路径 2. 关键线索：尿试纸 2+ 蛋白、无血尿、体格检查/血压正常 3. 蛋白尿确诊路径：</p>\n<ul>\n<li>连续两次尿试纸（间隔 1-2 天）确认蛋白尿 → ✓ 已确认持续性</li>\n<li>下一步：完整尿液检查（urinalysis）— 评估尿沉渣、血尿、红细胞管型、脓尿、脂尿</li>\n<li>再下一步：尿蛋白/肌酐比值（首次晨尿）</li>\n<p>4. 排除选项：</p>\n<li>肾活检（A）：儿童无症状蛋白尿中不常规推荐</li>\n<li>12h 尿蛋白（B）：蛋白定量用 24h 而非 12h</li>\n<li>C3/C4（D）/ 超声（E）：根据临床情境选择，非下一步必做</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>跳过 urinalysis 直接做定量</strong>：确认持续性后应先用完整尿检评估尿沉渣，而非直接做 24h 蛋白定量</li>\n<li><strong>12h vs 24h</strong>：蛋白定量用 <strong>24 小时</strong>尿收集，选项 B 的 12h 是错的</li>\n<li><strong>过早肾活检</strong>：无症状持续性蛋白尿中肾活检有争议，不常规推荐</li>\n</ul>", "summary": "<p>蛋白尿诊断路径： 1. <strong>确认</strong>：两次连续尿试纸（间隔 1-2 天）均阳性 2. <strong>尿检（urinalysis）</strong>：中段尿，评估尿沉渣、血尿、红细胞管型、脓尿、脂尿 3. <strong>实验室</strong>：肾功能（BUN/Cr）、电解质、胆固醇、白蛋白、总蛋白 4. <strong>定量</strong>：首次晨尿蛋白/肌酐比值（估算 24h 蛋白排泄量） 5. <strong>进一步</strong>（按需）：肾超声、补体 C3/C4、ANA、链球菌酶、乙肝/丙肝/HIV 血清学 6. <strong>VCUG</strong>：超声异常伴瘢痕或发热性 UTI 史时考虑</p>", "explanation": "<p>蛋白尿定义为尿试纸检测蛋白 ≥1+。确诊需连续两次尿试纸或尿检（间隔 1-2 天）均显示蛋白尿。</p>\n<p>若试纸蛋白尿持续存在，下一步最佳为对诊室获取的中段尿样本进行完整尿液检查（urinalysis），以更准确评估尿液情况。尿检可评估尿沉渣及肾小球/实质病变的其他征象（血尿、红细胞管型、脓尿、脂尿）。</p>\n<p>肾活检在无症状持续性蛋白尿患儿中的作用有争议，不常规推荐。蛋白定量使用 24 小时尿液收集（非 12 小时）。C3/C4、超声等根据临床情况选择。</p>", "references": "<ul>\n<li>The Royal Children's Hospital (RCH) - Proteinuria</li>\n<li>UpToDate - Evaluation of proteinuria in children</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "无症状持续性蛋白尿 — 下一步完整尿液检查\n无症状持续性蛋白尿 — 下一步完整尿液检查\n an 8-year-old boy is found to have persistent proteinuria of 2+ on dipstick urine. there is no hematuria. physical examination including blood pressure is unremarkable. which one of the following is the next best investigation to consider for this boy? \n 蛋白尿定义为尿试纸检测蛋白 ≥1+。确诊需连续两次尿试纸或尿检（间隔 1-2 天）均显示蛋白尿。 \n 若试纸蛋白尿持续存在，下一步最佳为对诊室获取的中段尿样本进行完整尿液检查（urinalysis），以更准确评估尿液情况。尿检可评估尿沉渣及肾小球/实质病变的其他征象（血尿、红细胞管型、脓尿、脂尿）。 \n 肾活检在无症状持续性蛋白尿患儿中的作用有争议，不常规推荐。蛋白定量使用 24 小时尿液收集（非 12 小时）。c3/c4、超声等根据临床情况选择。 "}, {"id": "AMC-Q0887", "type": "mcq", "qid": 887, "title": "Retinoblastoma — 初始检查选超声（钙化），避免 CT/活检", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Oncology", "approach": ["diagnosis", "imaging"], "topic": ["Retinoblastoma", "Leukocoria", "Initial Investigation", "Ultrasound", "Calcification"], "difficulty": 3, "correctAnswer": "B", "page": 1315, "tags": ["mcq", "amc", "paediatrics", "oncology", "retinoblastoma", "leukocoria", "approach-diagnosis", "approach-imaging"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Oncology/AMC-Q0887-Retinoblastoma-Ultrasound.md", "stem": "<p>A 4-year-old girl presents with proptosis of her left eye and a white cornea noticed yesterday. Suspecting retinoblastoma, which is the most appropriate initial diagnostic test?</p>", "options": [{"letter": "A", "text": "MRI."}, {"letter": "B", "text": "Ultrasound."}, {"letter": "C", "text": "CT scan."}, {"letter": "D", "text": "X-ray."}, {"letter": "E", "text": "Biopsy."}], "rationale": "<p>1. <strong>题型识别</strong>：儿童白瞳/突眼疑 retinoblastoma → 问\"初始检查\"。 2. <strong>Retinoblastoma 要点</strong>：最常见儿童眼内肿瘤；leukocoria 最常见，斜视第二；可有视力下降、眼炎、玻璃体出血、青光眼、突眼等；5–10% 家族史（RB1）。 3. <strong>诊断路径</strong>：散瞳间接眼底检查（全麻下）→  chalky 白灰视网膜肿块。超声便宜可及，特征 = 眼内钙化。 4. <strong>MRI 角色</strong>：在 PE + 眼底 + 超声确立诊断<strong>后</strong>，用于术前评估、视神经受累、三侧性 RB 等。 5. <strong>避免 CT/X-ray</strong>：遗传型 RB1 突变，CT/X-ray 增二次恶性肿瘤风险。 6. <strong>活检 无用</strong>：诊断不靠活检。 7. <strong>锁定 B</strong>。</p>", "traps": "<ul>\n<li><strong>\"MRI 最准 = 首选\"陷阱</strong>：错。MRI 是确立后分期用，初始是眼底 + 超声。</li>\n<li><strong>\"CT 评估大小\"陷阱</strong>：错。CT 增 RB1 二次癌风险，不推荐。</li>\n<li><strong>\"活检确诊\"陷阱</strong>：错。RB 不靠活检。</li>\n<li><strong>把 leukocoria 当炎症</strong>：白瞳是 RB 题眼，不是普通结膜炎。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>Retinoblastoma = most common intraocular tumor in children. Leukocoria (white cornea / cat's eye) most common sign, strabismus second. Diagnosis by dilated indirect ophthalmoscopy under anesthesia; chalky white-grey retinal mass. Ultrasonography cheap/available, characteristic = intraocular calcification.</p>\n<p>(A) MRI emergent after PE + fundus + US for staging/extension/trilateral RB, not initial. (C/D) CT/x-ray discouraged — hereditary RB1 raises secondary malignancy risk. (E) Biopsy no role.</p>", "references": "<ul>\n<li>Guidelines for imaging retinoblastoma: imaging principles and MRI standardization</li>\n<li>UpToDate - Overview of retinoblastoma</li>\n</ul>", "related": ["AMC-Q1323-Wilms-Tumor", "AMC-Q1328-Neuroblastoma", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Retinoblastoma"], "complaints": [], "search": "retinoblastoma — 初始检查选超声（钙化），避免 ct/活检\nretinoblastoma leukocoria initial investigation ultrasound calcification\ndiagnosis imaging\n a 4-year-old girl presents with proptosis of her left eye and a white cornea noticed yesterday. suspecting retinoblastoma, which is the most appropriate initial diagnostic test? \n correct answer is  b  \n retinoblastoma = most common intraocular tumor in children. leukocoria (white cornea / cat's eye) most common sign, strabismus second. diagnosis by dilated indirect ophthalmoscopy under anesthesia; chalky white-grey retinal mass. ultrasonography cheap/available, characteristic = intraocular calcification. \n (a) mri emergent after pe + fundus + us for staging/extension/trilateral rb, not initial. (c/d) ct/x-ray discouraged — hereditary rb1 raises secondary malignancy risk. (e) biopsy no role. "}, {"id": "AMC-Q0963", "type": "mcq", "qid": 963, "title": "Wilms 瘤 — 2–3 岁、光滑硬、无痛、不过中线的腹部包块", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Oncology", "approach": ["diagnosis", "differential"], "topic": ["Wilms Tumor", "Nephroblastoma", "RUQ mass", "Non-tender", "2-3yo"], "difficulty": 3, "correctAnswer": "C", "page": 1323, "tags": ["mcq", "amc", "paediatrics", "oncology", "wilms-tumor", "nephroblastoma", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Oncology/AMC-Q0963-Wilms-Tumor.md", "stem": "<p>A 4-year-old boy with intermittent abdominal pain (max 2–3h, then subsides). Asymptomatic between. This time pain lasted 12h. Afebrile. A mass is palpated in RUQ, not tender. Most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Hepatoblastoma."}, {"letter": "B", "text": "Neuroblastoma."}, {"letter": "C", "text": "Wilms tumor."}, {"letter": "D", "text": "Pyelonephritis."}, {"letter": "E", "text": "Pancreatic tumor."}], "rationale": "<p>1. <strong>题型识别</strong>：4 岁 + 间歇性腹痛 + RUQ <strong>无痛</strong>包块 → 考儿童腹部肿瘤鉴别（Wilms vs neuroblastoma）。 2. <strong>Wilms tumor</strong>：</p>\n<ul>\n<li>最常见儿童腹腔内恶性肿瘤，诊断高峰 2–3 岁。</li>\n<li>多散发，少数家族史；WT1（11 号染色体）突变 ~20%。</li>\n<li>表现：腹部包块/肿胀（25–40% 腹痛，12–25% 血尿，25% 高血压——肾动脉受压→肾素）。</li>\n<li>体征：光滑硬、无痛、不过中线的可触及包块。</li>\n<p>3. <strong>鉴别</strong>：</p>\n<li>A Hepatoblastoma：罕见肝恶性，多无症状，晚期 40% 骨松（与本案不符）。</li>\n<li>B Neuroblastoma：<2 岁更多，硬、不规则、可过中线；本案 4 岁 + 光滑不过中线不符。</li>\n<li>D Pyelonephritis：CVA 压痛但无包块，常发热。</li>\n<li>E Pancreatic tumor：儿童极罕见。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"neuroblastoma 更常见\"陷阱</strong>：错。NB 是颅外实体瘤最多，但 Wilms 是腹腔内最多，且本案年龄/体征偏 Wilms。</li>\n<li><strong>\"包块痛 = 感染\"陷阱</strong>：错。pyelonephritis 有发热/CVA 压痛，无包块。</li>\n<li><strong>忽略高血压线索</strong>：Wilms 可高血压（肾素），是题眼之一。</li>\n<li><strong>过中线 vs 不过中线</strong>：NB 可过中线，Wilms 不过。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Wilms tumor (nephroblastoma) = most common intra-abdominal tumor of childhood, often diagnosed at 2–3 years. Sporadic; WT1 on chr 11 mutated in ~20%. Presents with abdominal mass/swelling, often pain (25–40%), hematuria (12–25%), fever, hypertension (25%, renal artery compression → renin). Smooth firm non-tender mass not crossing midline. (A) Hepatoblastoma rare hepatic, asymptomatic, osteopenia. (B) Neuroblastoma <2yo, hard irregular non-tender, can cross midline. (D) Pyelonephritis CVA tenderness, no mass, fever. (E) Pancreatic tumors extremely rare in children.</p>", "references": "<ul>\n<li>Medscape - Pediatric Ureteropelvic Junction Obstruction</li>\n<li>Medscape - Hydronephrosis and Hydroureter</li>\n<li>UpToDate - Clinical manifestations and diagnosis of urinary tract obstruction and hydronephrosis</li>\n</ul>", "related": ["AMC-Q0969-Neuroblastoma", "AMC-Q0962-UPJ-Obstruction-Ultrasound", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Wilms Tumor"], "complaints": ["abdominal pain"], "search": "wilms 瘤 — 2–3 岁、光滑硬、无痛、不过中线的腹部包块\nwilms tumor nephroblastoma ruq mass non-tender 2-3yo\ndiagnosis differential\n a 4-year-old boy with intermittent abdominal pain (max 2–3h, then subsides). asymptomatic between. this time pain lasted 12h. afebrile. a mass is palpated in ruq, not tender. most likely diagnosis? \n correct answer is  c  \n wilms tumor (nephroblastoma) = most common intra-abdominal tumor of childhood, often diagnosed at 2–3 years. sporadic; wt1 on chr 11 mutated in ~20%. presents with abdominal mass/swelling, often pain (25–40%), hematuria (12–25%), fever, hypertension (25%, renal artery compression → renin). smooth firm non-tender mass not crossing midline. (a) hepatoblastoma rare hepatic, asymptomatic, osteopenia. (b) neuroblastoma  "}, {"id": "AMC-Q0969", "type": "mcq", "qid": 969, "title": "<1 岁婴儿无痛腹部包块 → 神经母细胞瘤（vs Wilms 2–3 岁）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Oncology", "approach": ["diagnosis", "differential"], "topic": ["Neuroblastoma", "6mo", "Left hypochondrium", "Non-tender hard mass"], "difficulty": 3, "correctAnswer": "B", "page": 1328, "tags": ["mcq", "amc", "paediatrics", "oncology", "neuroblastoma", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Oncology/AMC-Q0969-Neuroblastoma.md", "stem": "<p>Mother of a 6-month-old boy finds a hard mass in the left hypochondrium while bathing. Non-tender. Most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Wilms tumor."}, {"letter": "B", "text": "Neuroblastoma."}, {"letter": "C", "text": "Polycystic kidney disease."}, {"letter": "D", "text": "Ureteropelvic junction obstruction."}, {"letter": "E", "text": "Hepatoblastoma."}], "rationale": "<p>1. <strong>题型识别</strong>：6 月龄婴儿洗澡时发现无痛硬包块 → 考 Wilms vs neuroblastoma。 2. <strong>Wilms</strong>：最常见腹腔内恶性瘤，诊断高峰 3.5 岁；<1 岁较少。 3. <strong>Neuroblastoma</strong>：</p>\n<ul>\n<li>最常见<strong>颅外</strong>恶性实体瘤；初发多 <strong><2 岁</strong>。</li>\n<li>2/3 腹腔内，其中 2/3 源于肾上腺。</li>\n<li>可触及无痛包块；常在洗澡/拥抱时发现。</li>\n<p>4. <strong>本例</strong>：6 月龄（<1 岁）→ neuroblastoma 远多于 Wilms。 5. <strong>鉴别</strong>：</p>\n<li>A：6 月龄 Wilms 较少。</li>\n<li>C：多囊肾包块不硬。</li>\n<li>D：UPJ 梗阻无硬包块（扩张肾不硬）。</li>\n<li>E：hepatoblastoma 不在左侧、非硬。</li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"腹部包块 = Wilms\"陷阱</strong>：错。Wilms 高峰 3.5 岁；<1 岁偏 neuroblastoma。</li>\n<li><strong>\"<1 岁 = 不可能肿瘤\"陷阱</strong>：错。neuroblastoma 常 <2 岁。</li>\n<li><strong>忽略部位</strong>：NB 2/3 源于肾上腺（可单侧腹/侧腹）；Wilms 不过中线但年龄不符。</li>\n<li><strong>硬 vs 光滑</strong>：NB 硬不规则，Wilms 光滑；但本题关键是年龄。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>Child with abdominal mass → consider (1) Wilms (nephroblastoma), (2) neuroblastoma. Wilms median dx 3.5yo, less likely <1yo. Neuroblastoma = most common extracranial malignant tumor of childhood, presents <2yo, 2/3 intra-abdominal (2/3 adrenal). Non-tender palpable mass; often found during bathing/hugging. Given age (6mo) → neuroblastoma more likely than Wilms. (A) Less likely at 6mo. (C) Polycystic kidney mass not hard. (D) UPJ obstruction no hard mass. (E) Hepatoblastoma not left-sided hard.</p>", "references": "<ul>\n<li>Medscape - Pediatric Neuroblastoma</li>\n<li>AAFP - Recognition of Common Childhood Malignancies</li>\n<li>UpToDate - Presentation and diagnosis of neuroblastoma</li>\n</ul>", "related": ["AMC-Q0963-Wilms-Tumor", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Wilms Tumor", "Neuroblastoma"], "complaints": [], "search": "<1 岁婴儿无痛腹部包块 → 神经母细胞瘤（vs wilms 2–3 岁）\nneuroblastoma 6mo left hypochondrium non-tender hard mass\ndiagnosis differential\n mother of a 6-month-old boy finds a hard mass in the left hypochondrium while bathing. non-tender. most likely diagnosis? \n correct answer is  b  \n child with abdominal mass → consider (1) wilms (nephroblastoma), (2) neuroblastoma. wilms median dx 3.5yo, less likely  "}, {"id": "AMC-Q0113", "type": "mcq", "qid": 113, "title": "AMC-Q0113 — SCFE in a 13-year-old boy", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Orthopaedics", "approach": [], "topic": ["股骨头骨骺滑脱 (SCFE)"], "difficulty": 3, "correctAnswer": "D", "page": 1340, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Orthopaedics/AMC-Q0113-SCFE.md", "stem": "<p>A 13-year-old boy presents to his general practitioner, accompanied by his mother, complaining of poorly localized pain in his knee for the past 6 weeks. His mother has observed a limp for the same period of time. He walks with his foot externally rotated. Examination of the knee is normal. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Osteochondritis dissecans of the knee"}, {"letter": "B", "text": "Perthes disease of the hip"}, {"letter": "C", "text": "Undiagnosed congenital dislocation of the hip"}, {"letter": "D", "text": "Slipped capital femoral epiphysis (SCFE)"}, {"letter": "E", "text": "Osgood-Schlatter osteochondritis of the knee"}], "rationale": "<ul>\n<li>关键三联征：<strong>青少年 + 膝痛 + 髋部病变</strong>（膝痛是<strong>髋部牵涉痛</strong>）</li>\n<li>典型表现：</li>\n<li>10-15 岁青少年（多见超重男孩）</li>\n<li>髋僵硬 → 跛行</li>\n<li><strong>膝痛</strong>（股神经前皮支分布到膝，<strong>牵涉痛</strong>）</li>\n<li>髋屈曲时<strong>外旋</strong></li>\n<li>行走时<strong>足外旋</strong></li>\n<li>内旋受限最明显</li>\n<li>关键警示：<strong>任何青少年跛行或膝痛都必须做双髋 X 线</strong>（AP + 蛙式位），否则漏诊</li>\n<li>各选项分析：</li>\n<li>A（膝剥脱性骨软骨炎）：膝痛 + 肿胀，<strong>髋正常</strong></li>\n<li>B（Perthes 病）：4-10 岁，<strong>年龄不符</strong></li>\n<li>C（先髋脱位）：<strong>应早发病</strong>，不会到 13 岁才出现</li>\n<li>E（Osgood-Schlatter）：<strong>胫骨结节</strong>局部压痛，髋无碍</li>\n</ul>", "traps": "<ul>\n<li>看到\"膝痛\"就只看膝 — 漏掉髋部牵涉痛，漏诊 SCFE</li>\n<li>选 B（Perthes）— 4-10 岁才是 Perthes，10-15 岁是 SCFE</li>\n<li>选 E（Osgood-Schlatter）— 该病局部压痛在胫骨结节，不影响髋</li>\n</ul>", "summary": "<p><strong>SCFE 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>年龄</td><td>10-15 岁青少年</td></tr>\n<tr><td>高危</td><td>肥胖、内分泌病（甲减）</td></tr>\n<tr><td>双侧</td><td>20% 病例</td></tr>\n<tr><td>关键症状</td><td><strong>膝痛</strong>（牵涉痛） + 跛行 + 足外旋</td></tr>\n<tr><td>检查</td><td><strong>双髋 X 线</strong>（AP + 蛙式位）</td></tr>\n<tr><td>并发症</td><td><strong>股骨头缺血性坏死</strong>（即使治疗仍可发生）</td></tr>\n<tr><td>治疗</td><td>立即<strong>停止负重</strong> + 紧急转诊；急性滑脱用牵引轻柔复位，避免手法复位（防 AVN）</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：延误诊断 → 滑脱加重 → AVN 风险激增。\"青春期 + 膝痛 + 跛行\" = 髋部 X 线必须做。</p>", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>所描述的临床表现以及患者的年龄提示股骨头骨骺滑脱（SCFE）为最可能的诊断</strong>。</p>\n<p>SCFE 更常见于 10-15 岁的青少年。典型病例是超重的青春期前男孩。该病 20% 病例为双侧。</p>\n<p>SCFE 表现为：</p>\n<ul>\n<li>髋部活动时跛行和易激惹</li>\n<li>膝痛——由受累髋部牵涉</li>\n<li>髋屈曲时髋部外旋。行走时髋部通常处于外旋位</li>\n<li>多数活动受限，特别是内旋</li>\n</ul>\n<p><strong>首发症状是休息后可缓解的髋部僵硬</strong>。随后出现跛行和髋部疼痛，沿大腿前内侧放射至膝部。早期髋部检查既无疼痛也无活动受限。在更晚期，髋部活动变得疼痛，屈曲、外展和内旋减少。受累腿行走时外旋。</p>\n<p><strong>SCFE 最重要的方面是尽管经过专业治疗，仍有大量患者发生股骨头缺血性坏死</strong>。因此，在发生严重滑脱之前诊断该病很重要。这需要早期检查和转诊。</p>\n<p><strong>任何有跛行或膝痛的青少年都应进行双髋 X 线检查（AP 和蛙式位）</strong>。否则，这一重要情况将被遗漏。</p>\n<p>最重要的管理原则包括：</p>\n<ul>\n<li>停止负重并紧急转诊</li>\n<li>急性滑脱时，通过牵引轻柔复位比手法复位更好，可预防晚期股骨头缺血性坏死</li>\n<li>复位后进行钉内固定</li>\n</ul>\n<ul>\n<li>（选项 A）剥脱性骨软骨炎的特征是骨软骨碎片从关节面分离。其下骨骼血管正常。膝痛和肿胀是该病的临床特征。髋部不受累。</li>\n<li>（选项 B）Legg-Calvé-Perthes 病（Perthes 病）是髋关节的一种暂时性疾病，特征是股骨头血供减少及随后的缺血性坏死。结果，股骨头塌陷，区域发炎和受刺激。Legg-Calvé-Perthes 病导致髋关节变得疼痛和僵硬。受影响的儿童通常在 4-10 岁之间，体格活跃且年龄偏小。</li>\n<li>（选项 C）先天性髋关节脱位在该年龄仍无症状的可能性极小。最近起病使该诊断不太可能。</li>\n<li>（选项 E）Osgood-Schlatter 病见于青春期前儿童，特征是胫骨粗隆局部疼痛，偶尔累及髌腱。该病的病理生理学是髌腱对未成熟胫骨粗隆的反复牵拉作用。查体时胫骨粗隆常有压痛。髋部活动不痛也不受限。</li>\n</ul>", "references": "<ul>\n<li>RCH - Slipped upper femoral epiphysis (SUFE)</li>\n<li>RACGP – AFP - Slipped upper femoral epiphysis in children</li>\n</ul>", "related": ["TR-SCFEs-Diagnosis", "AMC-Q0112-HSP-Nephritis"], "bodyHtml": "", "diseases": ["SCFE"], "complaints": ["limp"], "search": "amc-q0113 — scfe in a 13-year-old boy\n股骨头骨骺滑脱 (scfe)\n a 13-year-old boy presents to his general practitioner, accompanied by his mother, complaining of poorly localized pain in his knee for the past 6 weeks. his mother has observed a limp for the same period of time. he walks with his foot externally rotated. examination of the knee is normal. which one of the following is the most likely diagnosis? \n correct answer is  d  \n  所描述的临床表现以及患者的年龄提示股骨头骨骺滑脱（scfe）为最可能的诊断 。 \n scfe 更常见于 10-15 岁的青少年。典型病例是超重的青春期前男孩。该病 20% 病例为双侧。 \n scfe 表现为： \n \n 髋部活动时跛行和易激惹 \n 膝痛——由受累髋部牵涉 \n 髋屈曲时髋部外旋。行走时髋部通常处于外旋位 \n 多数活动受限，特别是内旋 \n \n  首发症状是休息后可缓解的髋部僵硬 。随后出现跛行和髋部疼痛，沿大腿前内侧放射至膝部。早期髋部检查既无疼痛也无活动受限。在更晚期，髋部活动变得疼痛，屈曲、外展和内旋减少。受累腿行走时外旋。 \n  scfe 最重要的方面是尽管经过专业治疗，仍有大量患者发生股骨头缺血性坏死 。因此，在发生严重滑脱之前诊断该病很重要。这需要早期检查和转诊。 \n  任何有跛行或膝痛的青少年都应进行双髋 x 线检查（ap 和蛙式位） 。否则，这一重要情况将被遗漏。 \n 最重要的管理原则包括： \n \n 停止负重并紧急转诊 \n 急性滑脱时，通过牵引轻柔复位比手法复位更好，可预防晚期股骨头缺血性坏死 \n 复位后进行钉内固定 \n \n \n （选项 a）剥脱性骨软骨炎的特征是骨软骨碎片从关节面分离。其下骨骼血管正常。膝痛和肿胀是该病的临床特征。髋部不受累。 \n （选项 b）legg-calvé-perthes 病（perthes 病）是髋关节的一种暂时性疾病，特征是股骨头血供减少及随后的缺血性坏死。结果，股骨头塌陷，区域发炎和受刺激。legg-calvé-perthes 病导致髋关节变得疼痛和僵硬。受影响的儿童通常在 4-10 岁之间，体格活跃且年龄偏小。 \n （选项 c）先天性髋关节脱位在该年龄仍无症状的可能性极小。最近起病使该诊断不太可能。 \n （选项 e）osgood-schlatter 病见于青春期前儿童，特征是胫骨粗隆局部疼痛，偶尔累及髌腱。该病的病理生理学是髌腱对未成熟胫骨粗隆的反复牵拉作用。查体时胫骨粗隆常有压痛。髋部活动不痛也不受限。 \n "}, {"id": "AMC-Q1496", "type": "mcq", "qid": 1496, "title": "Perthes 病 — 股骨头缺血坏死", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Orthopaedics", "approach": [], "topic": ["Perthes 病 — 连续 X 线评估进展，外展内旋受限"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Orthopaedics/AMC-Q1496-Perthes-Disease.md", "stem": "<p>Which one of the following statements is correct about Perthes disease?</p>", "options": [{"letter": "A", "text": "Hip mobility is reduced especially abduction and external rotation."}, {"letter": "B", "text": "Ultrasound is the modality of choice to make a diagnosis."}, {"letter": "C", "text": "Progress is evaluated with serial radiological examination."}, {"letter": "D", "text": "Osteotomy is the treatment of choice."}, {"letter": "E", "text": "The inflammatory markers such as WBC, ESR and CRP are usually raised."}], "rationale": "<p>1. 题型识别：定义 — Perthes 病的正确陈述 2. 核心知识：</p>\n<ul>\n<li>Perthes 病 = 股骨头近端缺血性坏死（AVN）</li>\n<li>髋关节活动受限最严重的是<strong>外展和内旋</strong>（非外旋）→ A 错</li>\n<li>影像学首选 = <strong>X 线</strong>（非超声）→ B 错</li>\n<li>治疗首选 = <strong>保守治疗</strong>（支具/夹板），截骨术为备选 → D 错</li>\n<li>炎症标志物 = <strong>通常阴性</strong>（非炎症性疾病）→ E 错</li>\n<p>3. 锁定答案：连续 X 线评估进展 → C 对</p>\n</ul>", "traps": "<ul>\n<li><strong>外展内旋 vs 外展外旋</strong>：最容易记混！Perthes 病最严重受限的是<strong>外展 + 内旋</strong>（不是外旋）</li>\n<li><strong>超声 vs X 线</strong>：Perthes 病首选 X 线诊断和评估，不是超声</li>\n<li><strong>截骨术是第一选择？</strong>：保守治疗（支具如 Scottish Rite brace）优先；截骨术不加速愈合，而是使股骨头再骨化更球形</li>\n<li><strong>炎症标志物升高？</strong>：Perthes 病非炎症性疾病 → WBC/ESR/CRP 通常阴性。若阳性需考虑化脓性关节炎/类风湿等鉴别</li>\n</ul>", "summary": "<p><strong>Legg-Calvé-Perthes 病</strong>：</p>\n<ul>\n<li>本质：股骨头近端缺血性坏死（AVN），因血供中断</li>\n<li>最严重受限：<strong>外展 + 内旋</strong>（不是外旋）</li>\n<li>影像学：<strong>X 线</strong>为首选诊断和进展评估方法</li>\n<li>5 个影像学分期：骨骺生长停止 → 软骨下骨折 → 吸收 → 再骨化 → 愈合/残留期（全程 12-40 个月）</li>\n<li>治疗：保守为主（不负重 + 支具如 Scottish Rite brace）；截骨术取决于年龄和严重程度</li>\n<li>炎症标志物：通常<strong>阴性</strong>（阳性提示替代诊断如化脓性关节炎、类风湿、滑膜炎）</li>\n<li>一旦怀疑 → 紧急转诊骨科</li>\n</ul>", "explanation": "<p>Perthes 病为股骨头近端缺血性坏死。髋关节活动受限最严重的是<strong>外展和内旋</strong>（非外旋）。影像学首选 X 线（非超声）。治疗以保守为主（不负重 + 支具外展内旋位），截骨术为备选方案。炎症标志物（WBC/ESR/CRP）通常阴性，阳性指向替代诊断。</p>", "references": "<ul>\n<li>UpToDate – Approach to hip pain in childhood</li>\n<li>Medscape - Legg-Calve-Perthes Disease</li>\n<li>RACGP – Check (Unit 493 April 2013)</li>\n<li>Murtagh's General Practice – 7th Edition – Pages 745, 746</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "perthes 病 — 股骨头缺血坏死\nperthes 病 — 连续 x 线评估进展，外展内旋受限\n which one of the following statements is correct about perthes disease? \n perthes 病为股骨头近端缺血性坏死。髋关节活动受限最严重的是 外展和内旋 （非外旋）。影像学首选 x 线（非超声）。治疗以保守为主（不负重 + 支具外展内旋位），截骨术为备选方案。炎症标志物（wbc/esr/crp）通常阴性，阳性指向替代诊断。 "}, {"id": "AMC-Q1566", "type": "mcq", "qid": 1566, "title": "生长痛 — 排除性诊断", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Orthopaedics", "approach": [], "topic": ["生长痛 — 双侧、间歇性、傍晚/夜间、正常体格检查"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Orthopaedics/AMC-Q1566-Growing-Pains.md", "stem": "<p>Caleb, 7 years old, is brought to your clinic by his mother with complaint of bilateral leg pain for the last couple of days. The pain is more prominent on the right side and is felt in the thighs behind the knee and in the calves. The pain occurs intermittently and more often in late evening and in the night and sometimes wakes him up. Caleb had an upper respiratory tract infection 10 days ago presenting with sore throat, mild fever and runny nose. He is otherwise healthy and has had no serious medical problem to date. His vaccination is up to date. On physical examination, the only remarkable finding is mildly-tender cervical lymphadenopathy. Hip, knee, and ankle joints of the right leg are normal with no swelling, warmth, or tenderness, and have preserved range of motion. He walks normally without limp. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Perthes disease."}, {"letter": "B", "text": "Slipped capital femoral epiphysis (SCFE)."}, {"letter": "C", "text": "Growing pains."}, {"letter": "D", "text": "Transient tenosynovitis."}, {"letter": "E", "text": "Septic arthritis of the hip."}], "rationale": "<p>1. 题型识别：诊断 — 儿童下肢痛的鉴别 2. 关键线索（典型生长痛）：</p>\n<ul>\n<li>7 岁（2-12 岁好发，学龄前高峰）</li>\n<li><strong>双侧</strong>（80% 双侧）</li>\n<li>部位：大腿、小腿、膝后</li>\n<li><strong>间歇性</strong>、傍晚/夜间加重、可夜间痛醒</li>\n<li><strong>体格检查正常</strong>：关节无肿胀/发热/压痛、ROM 保留、无跛行</li>\n<p>3. 鉴别排除：</p>\n<li>Perthes 病（A）：持续性髋痛 + 跛行 + ROM 受限 → 本患儿正常</li>\n<li>SCFE（B）：10-14 岁肥胖男孩、跛行 + 髋 ROM 受限 → 不符</li>\n<li>一过性滑膜炎（D）：跛行 + 髋 ROM 轻度受限（尤内旋）→ 正常 ROM + 无跛行排除</li>\n<li>化脓性关节炎（E）：中毒貌 + 发热 + ROM 受限 + 拒绝负重 → 排除</li>\n<p>4. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>URTI 史诱导向一过性滑膜炎</strong>：前驱病毒感染 1-2 周是一过性滑膜炎的典型特征，但本患儿<strong>无跛行 + ROM 正常</strong>可排除</li>\n<li><strong>疼痛 ≠ 关节病变</strong>：生长痛的疼痛在肌肉而非关节，体格检查正常</li>\n<li><strong>\"单侧 20% 也可为生长痛\"但需警惕</strong>：双侧更典型；单侧时应优先排除其他诊断</li>\n</ul>", "summary": "<p><strong>生长痛（Growing Pains）</strong>：</p>\n<ul>\n<li>发病率：2-12 岁儿童的 20-30%，学龄前为高峰</li>\n<li>病因：与过度体力活动相关（非真正的\"生长\"所致）</li>\n<li>本质：<strong>排除性诊断</strong></li>\n<li>诊断标准：无全身症状（发热/乏力/食欲改变）、无关节体征（肿胀/压痛/发热/发红）、无病史或体检提示其他病因</li>\n<li>疼痛特征：大腿/小腿/膝后、间歇性、傍晚/夜间、晨起消失、80% 双侧</li>\n<li>治疗：保守（热敷、按摩、OTC 止痛药）</li>\n</ul>\n<p><strong>一过性滑膜炎（Transient tenosynovitis / Irritable hip）</strong>：</p>\n<ul>\n<li>学龄前儿童跛行最常见原因（3-8 岁）</li>\n<li>前驱病毒感染 1-2 周</li>\n<li>可带痛行走但 ROM（尤其<strong>内旋</strong>）轻度受限</li>\n<li>无发热</li>\n</ul>", "explanation": "<p>该患儿为典型生长痛表现：7 岁、双侧下肢痛（大腿/小腿/膝后）、间歇性、傍晚/夜间加重并可痛醒、体格检查正常、无跛行。</p>\n<p>Perthes 病表现为持续性髋痛 + 跛行 + ROM 受限。SCFE 多见于 10-14 岁肥胖男孩伴跛行和髋 ROM 受限。一过性滑膜炎虽有前驱病毒感染且年龄区间相符，但通常伴有跛行和髋内旋轻度受限，本患儿 ROM 正常 + 无跛行可排除。化脓性关节炎有中毒貌、发热、关节 ROM 受限和拒绝负重。</p>", "references": "<ul>\n<li>UpToDate – Growing pain</li>\n<li>Sports Health - Growing pains</li>\n<li>RCH - The limping or non-weight bearing child</li>\n</ul>", "related": ["AMC-Q1496-Perthes-Disease", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["leg pain/swelling", "fever", "limp"], "search": "生长痛 — 排除性诊断\n生长痛 — 双侧、间歇性、傍晚/夜间、正常体格检查\n caleb, 7 years old, is brought to your clinic by his mother with complaint of bilateral leg pain for the last couple of days. the pain is more prominent on the right side and is felt in the thighs behind the knee and in the calves. the pain occurs intermittently and more often in late evening and in the night and sometimes wakes him up. caleb had an upper respiratory tract infection 10 days ago presenting with sore throat, mild fever and runny nose. he is otherwise healthy and has had no serious medical problem to date. his vaccination is up to date. on physical examination, the only remarkable finding is mildly-tender cervical lymphadenopathy. hip, knee, and ankle joints of the right leg are normal with no swelling, warmth, or tenderness, and have preserved range of motion. he walks normally without limp. which one of the following could be the most likely diagnosis? \n 该患儿为典型生长痛表现：7 岁、双侧下肢痛（大腿/小腿/膝后）、间歇性、傍晚/夜间加重并可痛醒、体格检查正常、无跛行。 \n perthes 病表现为持续性髋痛 + 跛行 + rom 受限。scfe 多见于 10-14 岁肥胖男孩伴跛行和髋 rom 受限。一过性滑膜炎虽有前驱病毒感染且年龄区间相符，但通常伴有跛行和髋内旋轻度受限，本患儿 rom 正常 + 无跛行可排除。化脓性关节炎有中毒貌、发热、关节 rom 受限和拒绝负重。 "}, {"id": "AMC-Q0765", "type": "mcq", "qid": 765, "title": "儿童持续性（慢性）咳嗽 — 最常见原因是哮喘", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["diagnosis", "differential"], "topic": ["Chronic Cough", "Children", "Asthma", "Differential"], "difficulty": 2, "correctAnswer": "B", "page": 1310, "tags": ["mcq", "amc", "paediatrics", "respiratory", "chronic-cough", "asthma", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q0765-Persistent-Cough-Children.md", "stem": "<p>Which one of the following is the most common cause of persistent cough in children?</p>", "options": [{"letter": "A", "text": "Post-viral cough."}, {"letter": "B", "text": "Asthma."}, {"letter": "C", "text": "Post-pertussis."}, {"letter": "D", "text": "Gastro-esophageal reflux disease (GERD)."}, {"letter": "E", "text": "Passive smoking."}], "rationale": "<p>1. <strong>题型识别</strong>：\"儿童持续性咳嗽最常见原因\" → 考咳嗽病程分层 + 各层最常见病因。 2. <strong>病程定义</strong>：</p>\n<ul>\n<li>急性：<3 周</li>\n<li>亚急性：3–8 周</li>\n<li>慢性/持续性：>8 周</li>\n<p>3. <strong>哮喘</strong>：儿童慢性咳嗽<strong>最常见</strong>；成人中仅次于慢性支气管炎。 4. <strong>Post-viral cough</strong>：儿童<strong>急性/亚急性</strong>（非慢性）咳嗽最常见。 5. <strong>其他儿童慢性咳嗽原因</strong>：持续性细菌性支气管炎、慢性化脓性肺病/支扩、异物、GERD、上呼吸道咳嗽综合征（旧称鼻后滴漏）、post-pertussis、咳嗽受体高敏、习惯性（心因性）咳嗽、耳源性咳嗽。 6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"post-viral 最常见\"陷阱</strong>：它是急性/亚急性最常见，不是慢性。</li>\n<li><strong>把\"persistent\"等同于\"急性\"</strong>：persistent = 慢性（>8 周）→ 哮喘。</li>\n<li><strong>GERD/被动吸烟</strong>：是原因但不最常见。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>By duration, cough is defined as acute (<3 weeks), subacute (3-8 weeks) and chronic or persistent (>8 weeks). Asthma is the most common cause of persistent (chronic) cough in children and the second most common cause in adults (after chronic bronchitis). Post-viral cough is the most common cause of acute and subacute (not chronic) cough in children.</p>\n<p>Other causes of persistent cough in children: persistent bacterial bronchitis, chronic suppurative lung disease and bronchiectasis, foreign body, GERD, upper respiratory cough syndrome (postnasal drip), post-pertussis cough, increased cough receptor sensitivity, habit (psychogenic) cough, otogenic cough.</p>", "references": "<ul>\n<li>UpToDate - Causes of chronic cough in children</li>\n<li>UpToDate - Evaluation of subacute and chronic cough in adults</li>\n<li>Murtagh's General Practice – 6th Edition – page 469</li>\n</ul>", "related": ["AMC-Q1312-Croup-Oral-Steroids", "AMC-Q1329-Wheezing-Child-Admit", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Childhood Asthma"], "complaints": ["cough"], "search": "儿童持续性（慢性）咳嗽 — 最常见原因是哮喘\nchronic cough children asthma differential\ndiagnosis differential\n which one of the following is the most common cause of persistent cough in children? \n correct answer is  b  \n by duration, cough is defined as acute ( 8 weeks). asthma is the most common cause of persistent (chronic) cough in children and the second most common cause in adults (after chronic bronchitis). post-viral cough is the most common cause of acute and subacute (not chronic) cough in children. \n other causes of persistent cough in children: persistent bacterial bronchitis, chronic suppurative lung disease and bronchiectasis, foreign body, gerd, upper respiratory cough syndrome (postnasal drip), post-pertussis cough, increased cough receptor sensitivity, habit (psychogenic) cough, otogenic cough. "}, {"id": "AMC-Q0856", "type": "mcq", "qid": 856, "title": "Croup（中度）— 首选单剂口服激素（地塞米松/泼尼松龙）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["treatment", "diagnosis"], "topic": ["Croup", "Moderate Croup", "Oral Steroids", "Dexamethasone", "Prednisolone"], "difficulty": 3, "correctAnswer": "D", "page": 1312, "tags": ["mcq", "amc", "paediatrics", "respiratory", "croup", "stridor", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q0856-Croup-Oral-Steroids.md", "stem": "<p>A 2-year-old boy is brought to the Emergency Department at 11 pm with a harsh barking cough. He is febrile (39°C), RR 32/min, with inspiratory stridor and scattered crackles bilaterally. He is easily irritated but can be consoled by parents. Which is most important to give him first?</p>", "options": [{"letter": "A", "text": "Intravenous prednisolone."}, {"letter": "B", "text": "Nebulized adrenaline."}, {"letter": "C", "text": "Nebulized salbutamol."}, {"letter": "D", "text": "Oral steroids."}, {"letter": "E", "text": "Antibiotics."}], "rationale": "<p>1. <strong>题型识别</strong>：2 岁 + 犬吠样咳 + 吸气性喘鸣 + 发热 → croup（喉气管支气管炎）。 2. <strong>Croup 谱系</strong>：laryngitis / laryngotracheitis / laryngotracheobronchitis（经典 croup）/ bacterial tracheitis / spasmodic croup。最常见 6–36 月龄，副流感病毒 1 型最多。 3. <strong>严重度分层</strong>：</p>\n<ul>\n<li>轻度：安静时无误鸣，玩耍如常</li>\n<li>中度：安静时持续喘鸣、胸壁回缩、激惹但可安抚</li>\n<li>重度：疲倦、烦躁、意识障碍、发绀、弛缓</li>\n<p>4. <strong>本例</strong>：喘鸣 + 可安抚的激惹 → <strong>中度</strong>。 5. <strong>处理</strong>：</p>\n<li>中度–重度：单剂<strong>皮质激素</strong>。地塞米松 0.3 mg/kg 口服（一线）或泼尼松龙 1 mg/kg 口服或布地奈德 2 mg 雾化。</li>\n<li>重度/明显气道梗阻/疲劳：住院 + 肾上腺素 1% 雾化 + 地塞米松 0.6 mg/kg。</li>\n<p>6. <strong>选项排除</strong>：</p>\n<li>A（IV 激素）：croup 不常规 IV。</li>\n<li>B（雾化肾上腺素）：<strong>重度</strong>才用。</li>\n<li>C（沙丁胺醇）：croup 无效。</li>\n<li>E（抗生素）：仅细菌性气管炎时才用，气道优先。</li>\n<p>7. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"雾化肾上腺素首选\"陷阱</strong>：错。仅重度 croup 用；中度用口服激素。</li>\n<li><strong>\"沙丁胺醇治喘鸣\"陷阱</strong>：错。croup 是上气道梗阻，支气管舒张剂无效。</li>\n<li><strong>\"IV 激素\"陷阱</strong>：错。口服/经肠优先。</li>\n<li><strong>\"有 crackles = 下呼吸道 → 抗生素\"陷阱</strong>：错。croup 可延伸致下呼吸道体征；气道优先。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>Age, fever, harsh cough and especially stridor → croup until proven otherwise. Croup = laryngotracheobronchitis (viral, parainfluenza type 1 most common), seen 6–36 months.</p>\n<p>Severity: Mild (happy, no stridor at rest) / Moderate (stridor at rest, retractions, consolable) / Severe (exhausted, cyanosis, decreased LOC).</p>\n<p>Management: moderate–severe → single dose corticosteroid: dexamethasone 0.3 mg/kg PO (first-line), or prednisolone 1 mg/kg PO, or budesonide 2 mg neb. Severe/obstruction/fatigue → admit + nebulized adrenaline 0.05 ml/kg + dexamethasone 0.6 mg/kg.</p>\n<p>This child: stridor + irritable but consolable → moderate croup → oral dexamethasone/prednisolone. (A) IV steroids not indicated. (B) Adrenaline reserved for severe. (C) Bronchodilators no role. (E) Antibiotics only if bacterial tracheitis; airway first.</p>", "references": "<ul>\n<li>UpToDate - Croup: clinical features, evaluation and diagnosis</li>\n<li>RCH - Croup (Laryngotracheobronchitis)</li>\n</ul>", "related": ["AMC-Q0765-Persistent-Cough-Children", "AMC-Q1329-Wheezing-Child-Admit", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Croup"], "complaints": ["cough"], "search": "croup（中度）— 首选单剂口服激素（地塞米松/泼尼松龙）\ncroup moderate croup oral steroids dexamethasone prednisolone\ntreatment diagnosis\n a 2-year-old boy is brought to the emergency department at 11 pm with a harsh barking cough. he is febrile (39°c), rr 32/min, with inspiratory stridor and scattered crackles bilaterally. he is easily irritated but can be consoled by parents. which is most important to give him first? \n correct answer is  d  \n age, fever, harsh cough and especially stridor → croup until proven otherwise. croup = laryngotracheobronchitis (viral, parainfluenza type 1 most common), seen 6–36 months. \n severity: mild (happy, no stridor at rest) / moderate (stridor at rest, retractions, consolable) / severe (exhausted, cyanosis, decreased loc). \n management: moderate–severe → single dose corticosteroid: dexamethasone 0.3 mg/kg po (first-line), or prednisolone 1 mg/kg po, or budesonide 2 mg neb. severe/obstruction/fatigue → admit + nebulized adrenaline 0.05 ml/kg + dexamethasone 0.6 mg/kg. \n this child: stridor + irritable but consolable → moderate croup → oral dexamethasone/prednisolone. (a) iv steroids not indicated. (b) adrenaline reserved for severe. (c) bronchodilators no role. (e) antibiotics only if bacterial tracheitis; airway first. "}, {"id": "AMC-Q0980", "type": "mcq", "qid": 980, "title": "喘息儿童 — 先保证氧合（住院 + 给氧），再考虑沙丁胺醇", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["treatment", "diagnosis"], "topic": ["Wheezing Child", "Admit + Oxygen", "Asthma", "First episode"], "difficulty": 3, "correctAnswer": "C", "page": 1329, "tags": ["mcq", "amc", "paediatrics", "respiratory", "wheezing", "asthma", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q0980-Wheezing-Child-Admit.md", "stem": "<p>An 18-month boy with wheezing and cough starting 24h ago. RR 35/min. Bilateral wheeze, mildly diminished L chest breath sounds. FHx asthma + allergy. Most appropriate next step?</p>", "options": [{"letter": "A", "text": "Nebulized salbutamol 4-hourly."}, {"letter": "B", "text": "Amoxicillin."}, {"letter": "C", "text": "Admission and administration of oxygen."}, {"letter": "D", "text": "Chest physiotherapy."}, {"letter": "E", "text": "Chest X-ray (CXR)."}], "rationale": "<p>1. <strong>题型识别</strong>：18 月喘息 + 咳嗽 + 双侧喘鸣 + 左胸呼吸音减弱 + 哮喘/过敏家族史 → 考喘息处理顺序。 2. <strong>喘息线索</strong>：</p>\n<ul>\n<li>喂养相关 → 反流</li>\n<li>咳 + 喘 → 哮喘</li>\n<li>体位（仰卧）→ 喉软骨软化</li>\n<li>发热 → 感染</li>\n<li>突发单侧 → 异物</li>\n<p>3. <strong>哮喘</strong>：<5 岁阵发性喘息最常见（此龄避免确诊\"哮喘\"，用喘息综合征等）；本例家族史强。 4. <strong>但左胸呼吸音减弱</strong> → 疑肺/胸膜腔集合 → 需入院详查；<strong>氧合第一</strong>。 5. <strong>处理层次</strong>：</p>\n<li>先保证氧合（给氧 + 入院）。</li>\n<li>后沙丁胺醇试验（诊断+治疗兼顾，年龄小用雾化）。</li>\n<li>抗生素仅疑肺炎后；胸物理无效；CXR 用于不响应/反复喘息者。</li>\n<p>6. <strong>锁定 C</strong>（氧合优先，A 在其后）。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"喘息 = 立即沙丁胺醇\"陷阱</strong>：错。先保证氧合；bronchodilator 在氧合后。</li>\n<li><strong>\"左胸音弱 = 肺炎 → 抗生素\"陷阱</strong>：错。先评估氧合 + 鉴别（积液/异物），抗生素非首选。</li>\n<li><strong>\"CXR 必做\"陷阱</strong>：错。首程喘息疑哮喘可不做；用于不响应/反复。</li>\n<li><strong>\"胸物理\"陷阱</strong>：错。此时无价值。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Wheezing DDx: feeding→reflux, cough→asthma, positional→laryngomalacia, fever→infection, sudden unilateral→FB. Asthma = most common episodic wheezing <5yo (definite dx avoided at this age). This child: sudden bilateral wheeze + diminished L breath sounds (possible collection) → admit and investigate; adequate oxygenation comes first regardless of diagnosis. (A) Salbutamol trial after oxygenation (diagnostic + therapeutic; nebulized in this age). (B) Amoxicillin later if pneumonia. (D) Chest physio little value. (E) CXR if unresponsive/recurrent wheezing.</p>", "references": "<ul>\n<li>RACGP – AFP – The wheezing child: an algorithm</li>\n<li>AAFP - The Diagnosis of Wheezing in Children</li>\n</ul>", "related": ["TR-Wheezing-Child", "AMC-Q0856-Croup-Oral-Steroids", "AMC-Q0765-Persistent-Cough-Children", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Childhood Asthma"], "complaints": ["wheezing", "cough"], "search": "喘息儿童 — 先保证氧合（住院 + 给氧），再考虑沙丁胺醇\nwheezing child admit + oxygen asthma first episode\ntreatment diagnosis\n an 18-month boy with wheezing and cough starting 24h ago. rr 35/min. bilateral wheeze, mildly diminished l chest breath sounds. fhx asthma + allergy. most appropriate next step? \n correct answer is  c  \n wheezing ddx: feeding→reflux, cough→asthma, positional→laryngomalacia, fever→infection, sudden unilateral→fb. asthma = most common episodic wheezing  "}, {"id": "AMC-Q1548", "type": "mcq", "qid": 1548, "title": "幼儿咳嗽 + 喘息 — 病毒感染诱发的哮喘", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": [], "topic": ["幼儿咳嗽 + 喘息 — 病毒感染诱发喘息（哮喘）"], "difficulty": 3, "correctAnswer": "D", "page": 1385, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q1548-Toddler-Wheeze-Asthma.md", "stem": "<p>A 20-month-old male infant is brought to the Emergency Department, by his parents, with complaints of cough and shortness of breath. On examination, there is bilateral wheezing over lung fields on auscultation. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Bronchiolitis."}, {"letter": "B", "text": "Croup."}, {"letter": "C", "text": "Epiglottitis."}, {"letter": "D", "text": "Asthma."}, {"letter": "E", "text": "Foreign body aspiration."}], "rationale": "<p>1. 题型识别：诊断 — 幼儿急性喘息性疾病的鉴别 2. 关键线索：20 月龄、咳嗽 + 呼吸困难、双侧喘息 3. 幼儿喘息最常见病因：</p>\n<ul>\n<li>异物吸入</li>\n<li>病毒感染（= 病毒诱发喘息 / 哮喘）</li>\n<p>4. 鉴别排除：</p>\n<li>细支气管炎（A）：多见于 <12 月龄婴儿，喘息 + 湿啰音，RSV 最常见 → 20 月龄偏大</li>\n<li>Croup（B）：犬吠样咳嗽 + 吸气性喘鸣，不是喘息 → 排除</li>\n<li>会厌炎（C）：中毒貌 + 流涎 + 吞咽困难 + 喘鸣，不是喘息 → 排除</li>\n<li>异物吸入（E）：单侧喘息更典型，双侧双侧喘息偏病毒感染</li>\n<p>5. 锁定答案：病毒感染诱发喘息（哮喘）→ D</p>\n</ul>", "traps": "<ul>\n<li><strong>年龄陷阱</strong>：20 月龄偏大，细支气管炎多见于 <12 月龄</li>\n<li><strong>\"哮喘\"在幼儿中的定义</strong>：澳大利亚指南将幼儿病毒感染诱发喘息归类为\"哮喘\"，不要因传统观念（\"2 岁以下不诊断哮喘\"）排除</li>\n<li><strong>双侧 vs 单侧喘息</strong>：异物吸入更常见单侧喘息</li>\n</ul>", "summary": "<p>幼儿喘息流行病学：约 20% 婴儿有喘息，至少 40% <6 岁儿童至少有一次喘息发作。</p>\n<p>幼儿喘息最常见原因（澳大利亚指南）：</p>\n<ul>\n<li><strong>异物吸入</strong></li>\n<li><strong>病毒感染</strong>（病毒诱发喘息 = 哮喘）</li>\n</ul>\n<p>鉴别要点：</p>\n<ul>\n<li>细支气管炎：<12 月龄、RSV、喘息 + 湿啰音</li>\n<li>Croup：犬吠样咳嗽 + 吸气性喘鸣</li>\n<li>会厌炎：中毒貌 + 流涎 + 吞咽困难 + 喘鸣</li>\n<li>异物吸入：单侧喘息、突发、有明确窒息史</li>\n</ul>", "explanation": "<p>喘息是幼儿常见表现。约 20% 婴儿在婴儿期出现喘息，至少 40% <6 岁儿童至少有一次喘息发作。</p>\n<p>根据澳大利亚儿科指南，幼儿咳嗽和喘息最常见原因为异物吸入和病毒感染。病毒感染引起的喘息被称为\"哮喘\"。</p>\n<p>细支气管炎多见于 <12 月龄婴儿（RSV 为最常见病因）。Croup 以犬吠样咳嗽和吸气性喘鸣为特征，非喘息。会厌炎患儿通常呈中毒貌和痛苦面容，咳嗽和喘息并非其特征。</p>", "references": "<ul>\n<li>RACGP – AFP – The wheezing child: an algorithm</li>\n<li>RCH – Acute upper airway obstruction</li>\n</ul>", "related": ["AMC-Q1564-Acute-Epiglottitis", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["dyspnea", "wheezing", "cough"], "search": "幼儿咳嗽 + 喘息 — 病毒感染诱发的哮喘\n幼儿咳嗽 + 喘息 — 病毒感染诱发喘息（哮喘）\n a 20-month-old male infant is brought to the emergency department, by his parents, with complaints of cough and shortness of breath. on examination, there is bilateral wheezing over lung fields on auscultation. which one of the following could be the most likely diagnosis? \n 喘息是幼儿常见表现。约 20% 婴儿在婴儿期出现喘息，至少 40%  \n 根据澳大利亚儿科指南，幼儿咳嗽和喘息最常见原因为异物吸入和病毒感染。病毒感染引起的喘息被称为\"哮喘\"。 \n 细支气管炎多见于  "}, {"id": "AMC-Q1564", "type": "mcq", "qid": 1564, "title": "急性会厌炎 — 三脚架姿势 + 流涎 + 喘鸣", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": [], "topic": ["急性会厌炎 — 三脚架姿势 + 流涎 + 呼气性喘鸣 + 颈过伸"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Respiratory/AMC-Q1564-Acute-Epiglottitis.md", "stem": "<p>Kim, 3 years old, is brought to the Emergency Department by her parents reporting that their daughter is not feeling well at all. According to them, she developed a fever this morning and started to refuse food and crying and throwing it out when she was fed. A short while later she became miserable and inconsolable, started drooling, and her breath became noisy. On examination, she has a pulse rate of 140 bpm, respiratory rate of 34 breaths per minute with expiratory stridor, and a fever of 39.1°C. She maintains her neck extended. Lungs are clear on auscultation. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Croup."}, {"letter": "B", "text": "Acute bronchiolitis."}, {"letter": "C", "text": "Retropharyngeal abscess."}, {"letter": "D", "text": "Acute epiglottitis."}, {"letter": "E", "text": "Bacterial pharyngitis."}], "rationale": "<p>1. 题型识别：诊断 — 儿童急性上气道梗阻的鉴别 2. 关键线索（会厌炎经典表现）：</p>\n<ul>\n<li><strong>急性起病</strong>（今晨开始）</li>\n<li>高热 39.1°C</li>\n<li><strong>拒绝进食</strong> + 哭闹时吐出食物（吞咽困难/吞咽痛）</li>\n<li><strong>流涎</strong></li>\n<li><strong>呼气性喘鸣</strong>（晚期出现，凶兆）</li>\n<li><strong>颈过伸</strong>（保持气道开放）</li>\n<li>三脚架姿势（tripod position）</li>\n<p>3. 鉴别排除：</p>\n<li>Croup（A）：犬吠样咳嗽 + <strong>吸气性</strong>喘鸣、无流涎、前驱病毒症状 → 排除</li>\n<li>细支气管炎（B）：<12 月龄、喘息 + 湿啰音 → 排除</li>\n<li>咽后脓肿（C）：表现相似，但通常有前驱细菌性上呼吸道感染病史 → 急性起病无前驱史 = 不太可能</li>\n<li>细菌性咽炎（E）：无三脚架姿势、无颈过伸、极少流涎 → 排除</li>\n<p>4. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>Croup 与会厌炎的关键区分</strong>：Croup = 犬吠样咳嗽 + 吸气性喘鸣 + 前驱病毒症状；会厌炎 = 流涎 + 吞咽困难 + 呼气性喘鸣 + 中毒貌</li>\n<li><strong>咽后脓肿与会厌炎</strong>：表现相似，但咽后脓肿通常有前驱细菌性上呼吸道感染史，会厌炎为急性暴发性起病</li>\n<li><strong>呼气性喘鸣 ≠ 哮喘</strong>：上气道梗阻晚期可出现呼气性喘鸣，为凶兆</li>\n</ul>", "summary": "<p><strong>急性会厌炎</strong>经典表现：</p>\n<ul>\n<li>急性起病 + 高热</li>\n<li>流涎（drooling）+ 吞咽困难/吞咽痛</li>\n<li>声音低沉或含混（\"hot potato voice\"）</li>\n<li>三脚架姿势（tripod position）— 坐位前倾、双手撑膝、颈过伸 → 维持气道通畅</li>\n<li>起初双肺听诊清晰，晚期出现呼气性喘鸣（凶兆）</li>\n</ul>\n<p><strong>Croup vs 会厌炎</strong>：</p>\n<table class='md-table'>\n<thead><tr><th></th><th>Croup</th><th>会厌炎</th></tr></thead>\n<tbody>\n<tr><td>病因</td><td>病毒（RSV 最常见）</td><td>细菌（Hib）</td></tr>\n<tr><td>咳嗽</td><td>犬吠样</td><td>无</td></tr>\n<tr><td>喘鸣</td><td>吸气性</td><td>晚期呼气性</td></tr>\n<tr><td>流涎</td><td>无</td><td><strong>有</strong></td></tr>\n<tr><td>吞咽困难</td><td>无</td><td><strong>有</strong></td></tr>\n<tr><td>发热</td><td>轻微或无</td><td><strong>高热</strong></td></tr>\n<tr><td>前驱症状</td><td>有（流涕、喷嚏）</td><td>无</td></tr>\n</tbody>\n</table>", "explanation": "<p>该患儿表现为典型急性会厌炎：急性起病、高热、拒绝进食（吞咽困难/吞咽痛）、流涎、呼气性喘鸣、颈过伸。与嘴里含着热食不敢咽下的表现一致。</p>\n<p>Croup 以犬吠样咳嗽和吸气性喘鸣为特征，发热轻微，无流涎和吞咽困难。咽后脓肿与会厌炎表现相似，但本患儿为急性起病无前驱细菌性上呼吸道感染史，因此咽后脓肿可能性较小。细菌性咽炎不会引起三脚架姿势、颈过伸和呼气性喘鸣，极少流涎。</p>", "references": "<ul>\n<li>RACGP – I can't breathe</li>\n<li>RCH – Acute upper airway obstruction</li>\n</ul>", "related": ["AMC-Q1548-Toddler-Wheeze-Asthma", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["fever"], "search": "急性会厌炎 — 三脚架姿势 + 流涎 + 喘鸣\n急性会厌炎 — 三脚架姿势 + 流涎 + 呼气性喘鸣 + 颈过伸\n kim, 3 years old, is brought to the emergency department by her parents reporting that their daughter is not feeling well at all. according to them, she developed a fever this morning and started to refuse food and crying and throwing it out when she was fed. a short while later she became miserable and inconsolable, started drooling, and her breath became noisy. on examination, she has a pulse rate of 140 bpm, respiratory rate of 34 breaths per minute with expiratory stridor, and a fever of 39.1°c. she maintains her neck extended. lungs are clear on auscultation. which one of the following could be the most likely diagnosis? \n 该患儿表现为典型急性会厌炎：急性起病、高热、拒绝进食（吞咽困难/吞咽痛）、流涎、呼气性喘鸣、颈过伸。与嘴里含着热食不敢咽下的表现一致。 \n croup 以犬吠样咳嗽和吸气性喘鸣为特征，发热轻微，无流涎和吞咽困难。咽后脓肿与会厌炎表现相似，但本患儿为急性起病无前驱细菌性上呼吸道感染史，因此咽后脓肿可能性较小。细菌性咽炎不会引起三脚架姿势、颈过伸和呼气性喘鸣，极少流涎。 "}, {"id": "AMC-Q0112", "type": "mcq", "qid": 112, "title": "Henoch-Schönlein 紫癜（HSP）— 已知并发症是肾炎（IgA 肾病）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Rheumatology", "approach": ["diagnosis", "complications"], "topic": ["Henoch-Schonlein Purpura", "HSP", "Nephritis", "Purpura", "Arthritis"], "difficulty": 3, "correctAnswer": "C", "page": 1325, "tags": ["mcq", "amc", "paediatrics", "rheumatology", "hsp", "henoch-schonlein", "vasculitis", "nephritis", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Rheumatology/AMC-Q0112-HSP-Nephritis.md", "stem": "<p>A 6-year-old girl with 4-day bilateral knee/ankle pain. Temp 37.6°C. Joints tender, no swelling/inflammation/synovial thickening; full ROM. Palpable purpuric rash on legs/buttocks + ecchymoses around ankles. FBC/U&E/LFT normal, ESR 10. Known complication of her condition?</p>", "options": [{"letter": "A", "text": "Pleurisy."}, {"letter": "B", "text": "Fasciitis."}, {"letter": "C", "text": "Nephritis."}, {"letter": "D", "text": "Thrombocytopenia."}, {"letter": "E", "text": "Diabetes mellitus."}], "rationale": "<p>1. <strong>题型识别</strong>：儿童紫癜 + 关节痛 + 无血小板减少 → 考 HSP 及其并发症。 2. <strong>HSP 本质</strong>：急性免疫介导血管炎，病因不明。特征：关节痛（非关节炎）、非血小板减少性紫癜（血管性/白细胞碎裂性）、典型分布于腿/臀。 3. <strong>其他表现</strong>：痉挛性腹痛、黑便、关节肿（踝）、肾炎。关节痛/腹痛可持 2–4 周。 4. <strong>肾炎</strong>：组织学同 IgA 肾病；小部分发生；故 <strong>所有 HSP 做尿检</strong>，血尿 → 长期随访。 5. <strong>排除</strong>：A 胸膜炎、B 筋膜炎、E 糖尿病均非 HSP 并发症。D 血小板减少：HSP 紫癜是<strong>非</strong>血小板减少性（ platelet 正常），故不是并发症。 6. <strong>锁定 C</strong>。</p>", "traps": "<ul>\n<li><strong>\"紫癜 = 血小板减少\"陷阱</strong>：错。HSP 紫癜是<strong>非</strong>血小板减少性（血管性），platelet 正常。</li>\n<li><strong>\"关节炎 = 肿胀\"陷阱</strong>：错。HSP 是关节痛（arthralgia）非关节炎（arthritis），无肿胀/积液。</li>\n<li><strong>忽略肾炎</strong>：HSP 最需警惕的并发症是肾（IgA 肾病），要查尿。</li>\n<li><strong>与 ITP 混淆</strong>：ITP 是血小板减少性紫癜；HSP 血小板正常 + 有肾/关节/腹表现。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Highly suggestive of Henöch-Schönlein purpura (HSP, anaphylactoid purpura): acute immune-mediated vasculitis. Arthralgia (not arthritis), non-thrombocytopenic purpura (vascular, leukoclastic) over legs/buttocks. Also colicky abdominal pain, melena, ankle swelling, nephritis. Arthralgia/abdominal pain persist 2–4 weeks. Nephritis histologically = IgA nephropathy; may occur in a small percentage → all HSP get urinalysis; hematuria → long-term follow-up.</p>", "references": "<ul>\n<li>Medscape - Henoch-Schonlein Purpura</li>\n<li>RCH - Henoch-Schonlein purpura</li>\n</ul>", "related": ["AMC-Q0906-ITP-Watchful-Waiting", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["HSP"], "complaints": [], "search": "henoch-schönlein 紫癜（hsp）— 已知并发症是肾炎（iga 肾病）\nhenoch-schonlein purpura hsp nephritis purpura arthritis\ndiagnosis complications\n a 6-year-old girl with 4-day bilateral knee/ankle pain. temp 37.6°c. joints tender, no swelling/inflammation/synovial thickening; full rom. palpable purpuric rash on legs/buttocks + ecchymoses around ankles. fbc/u&e/lft normal, esr 10. known complication of her condition? \n correct answer is  c  \n highly suggestive of henöch-schönlein purpura (hsp, anaphylactoid purpura): acute immune-mediated vasculitis. arthralgia (not arthritis), non-thrombocytopenic purpura (vascular, leukoclastic) over legs/buttocks. also colicky abdominal pain, melena, ankle swelling, nephritis. arthralgia/abdominal pain persist 2–4 weeks. nephritis histologically = iga nephropathy; may occur in a small percentage → all hsp get urinalysis; hematuria → long-term follow-up. "}, {"id": "AMC-Q1443", "type": "mcq", "qid": 1443, "title": "急性风湿热 — 边缘性红斑 + 游走性关节炎 + 咽痛史 → 咽拭子", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Rheumatology", "approach": [], "topic": ["急性风湿热 — 边缘性红斑 + 游走性关节炎 → 下一步咽拭子"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Rheumatology/AMC-Q1443-Acute-Rheumatic-Fever-Throat-Swab.md", "stem": "<p>Parents of a 12-year-old girl has brought her to a clinic after they noticed a rash on her back. She had sore throat 3 weeks ago which subsided gradually in a course of days. Last week she had a very painful left wrist pain that improved after 2 days before she develops pain in her right knee. Today, she has a painful right ankle. On physical examination, she looks ill and has a temperature of 38.1°C. Examination of the musculoskeletal system is notable for a painful, slightly hot and swollen right ankle with decreased range of motion due to pain. There is a rash on her back which is shown in the following photograph. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Echocardiography."}, {"letter": "B", "text": "Blood culture."}, {"letter": "C", "text": "ESR."}, {"letter": "D", "text": "Throat swab."}, {"letter": "E", "text": "Full blood examination (FBE)."}], "rationale": "<p>1. 题型识别：诊断检查 — ARF 的确诊路径 2. 关键线索：</p>\n<ul>\n<li>3 周前咽痛史 → GAS 前驱感染潜伏期</li>\n<li>游走性多关节炎（左腕→右膝→右踝）→ 典型 ARF 特征</li>\n<li>背部皮疹照片 → 边缘性红斑（erythema marginatum）— ARF 主要标准之一</li>\n<li>T 38.1°C、看起来不适</li>\n<p>3. ARF 诊断以临床为主（Jones 标准），无特异性实验室检查；确认前驱 GAS 感染是诊断关键 4. 排除选项：</p>\n<li>超声心动图（A）：确认心脏炎（主要标准）但不是\"next step\"</li>\n<li>血培养（B）：GAS 血培养阳性率低，非必需</li>\n<li>ESR/CRP（C）：已满足临床诊断标准，加做无额外收益</li>\n<li>FBE（E）：ARF 中通常正常或非特异性</li>\n<p>5. 锁定答案：咽拭子确认 GAS → D</p>\n</ul>", "traps": "<ul>\n<li><strong>\"心脏炎需超声心动图\"陷阱</strong>：超声心动图是评估 ARF 心脏受累的重要检查（包括亚临床瓣膜病），但 \"next step in management\" 问的是诊断确认步骤 — 咽拭子确认前驱 GAS</li>\n<li><strong>ESR/CRP 不是诊断性检查</strong>：已充分满足临床诊断标准时，加测 ESR/CRP 无额外诊断价值</li>\n<li><strong>血培养混淆</strong>：GAS 咽炎后 ARF 中血培养阳性率低，非必需</li>\n</ul>", "summary": "<p><strong>急性风湿热（ARF）</strong> Jones 标准（澳大利亚 2012 修订版）：</p>\n<table class='md-table'>\n<thead><tr><th></th><th>高风险人群</th><th>其他人群</th></tr></thead>\n<tbody>\n<tr><td><strong>主要标准</strong></td><td>心脏炎（含亚临床）/ 多关节炎或无菌性单关节炎或多关节痛 / Sydenham 舞蹈症 / 边缘性红斑 / 皮下结节</td><td>心脏炎 / <strong>多关节炎</strong>（仅多关节） / Sydenham 舞蹈症 / 边缘性红斑 / 皮下结节</td></tr>\n<tr><td><strong>次要标准</strong></td><td>发热 / 多关节痛或无菌性单关节炎 / ESR≥30 或 CRP≥30 / PR 间期延长</td><td>发热 / 多关节痛 / ESR≥30 或 CRP≥30 / PR 间期延长</td></tr>\n</tbody>\n</table>\n<p>诊断需：2 项主要标准 或 1 项主要 + 2 项次要 + <strong>前驱 GAS 感染证据</strong>。</p>\n<p>咽拭子是确认前驱 GAS 感染的首选方法。过度诊断导致不必要长期治疗，漏诊导致心脏损伤和过早死亡。</p>", "explanation": "<p>皮疹照片显示边界清晰的亮红色和粉色斑疹 — 边缘性红斑（erythema marginatum）。皮疹 + 游走性关节痛/关节炎（一关节受累→好转→另一关节受累）+ 3 周前咽痛史 = 高度提示 ARF。</p>\n<p>ARF 主要发生于儿童期，继发于 A 族链球菌（GAS）感染。诊断主要通过临床（Jones 标准），无特异性实验室检查。咽拭子可提供前驱 GAS 感染的充分线索。</p>\n<p>超声心动图可评估心脏炎（包括亚临床风湿性瓣膜病），但并非\"next step\"。ESR/CRP 在已满足临床诊断标准时无额外收益。FBE 通常正常或非特异性。血培养非必需。</p>", "references": "<ul>\n<li>RACGP - The Australian guideline for prevention, diagnosis and management of acute rheumatic fever and rheumatic heart disease</li>\n<li>RACGP – Rheumatic Fever</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性风湿热 — 边缘性红斑 + 游走性关节炎 + 咽痛史 → 咽拭子\n急性风湿热 — 边缘性红斑 + 游走性关节炎 → 下一步咽拭子\n parents of a 12-year-old girl has brought her to a clinic after they noticed a rash on her back. she had sore throat 3 weeks ago which subsided gradually in a course of days. last week she had a very painful left wrist pain that improved after 2 days before she develops pain in her right knee. today, she has a painful right ankle. on physical examination, she looks ill and has a temperature of 38.1°c. examination of the musculoskeletal system is notable for a painful, slightly hot and swollen right ankle with decreased range of motion due to pain. there is a rash on her back which is shown in the following photograph. which one of the following is the most appropriate next step in management? \n 皮疹照片显示边界清晰的亮红色和粉色斑疹 — 边缘性红斑（erythema marginatum）。皮疹 + 游走性关节痛/关节炎（一关节受累→好转→另一关节受累）+ 3 周前咽痛史 = 高度提示 arf。 \n arf 主要发生于儿童期，继发于 a 族链球菌（gas）感染。诊断主要通过临床（jones 标准），无特异性实验室检查。咽拭子可提供前驱 gas 感染的充分线索。 \n 超声心动图可评估心脏炎（包括亚临床风湿性瓣膜病），但并非\"next step\"。esr/crp 在已满足临床诊断标准时无额外收益。fbe 通常正常或非特异性。血培养非必需。 "}], "stats": {"total": 126, "bySubcategory": {"Paediatrics": 61, "Cardiology": 56, "Haematology": 8, "General": 1}, "byApproach": {"diagnosis": 52, "treatment": 40, "definition": 28, "complications": 24, "prevention": 21, "investigation": 17, "differential": 16, "physical-exam": 14, "imaging": 1, "prognosis": 1, "risk-factors": 1}, "byDifficulty": {"0": 5, "1": 1, "2": 38, "3": 65, "4": 16, "5": 1}, "byType": {"mcq": 121, "tr": 5}, "byDisease": {"AAA": 8, "DVT": 7, "Heart Failure": 7, "STEMI": 7, "Acute Limb Ischemia": 4, "Pertussis": 4, "Syncope": 4, "VT": 4, "ACS": 3, "AF": 3, "Childhood Asthma": 3, "Stable Angina": 3, "Wilms Tumor": 3, "AV Block (1°)": 2, "AV Block (2°)": 2, "Aortic Stenosis": 2, "Breastfeeding Issues": 2, "Marfan Syndrome": 2, "Measles": 2, "NSTEMI": 2, "PAD": 2, "PSVT": 2, "Pericarditis": 2, "Pulmonary Edema": 2, "Pyloric Stenosis": 2, "Sensorineural Hearing Loss": 2, "UPJ Obstruction": 2, "VTE": 2, "AV Block (3°)": 1, "Anal Fissure": 1, "Aortic
