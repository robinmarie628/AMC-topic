<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMC MCQ Vault · Dashboard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cabin@5/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/jetbrains-mono.min.css">
<style>
  /* ================================================================
     Clean Clinical Design Tokens
     ----------------------------------------------------------------
     High-contrast, readable palette for exam review. Cool whites,
     charcoal text, deep teal accent. No warm undertones.
     Motion:  Emil Kowalski's ease-out cubic-bezier(0.23, 1, 0.32, 1)
              applied to all transitions. Active states use scale(.97).
     ================================================================ */
  :root {
    /* Surfaces — clean cool stack */
    --bg:         #e8f0f7;   /* page bg — light blue */
    --surface:    #ffffff;   /* cards, modal, topbar */
    --surface-2:  #eef1f4;   /* nested wells, code, hover */
    --surface-3:  #e2e6ea;   /* deepest well, chip hover */

    /* Ink — crisp charcoal */
    --ink:        #1a1d23;   /* primary text */
    --ink-2:      #4a5058;   /* secondary text */
    --ink-3:      #848b94;   /* tertiary / meta */

    /* Lines — clean gray */
    --line:       #dcdfe3;
    --line-2:     #c4c9cf;

    /* Accents — clinical teal + blue */
    --accent:        #0d7377;   /* deep teal */
    --accent-soft:   #e0f0f1;   /* chip active bg */
    --accent-line:   #8cc9cc;   /* chip active border */
    --accent-ink:    #0d7377;
    --star-on:       #e8a838;   /* warm amber */
    --star-hover:    #d4951c;   /* deeper amber */
    --correct-bg:    #e6f4ea;   /* correct option — sage/emerald */
    --correct-line:  #a3d4ad;
    --correct-ink:   #1e7a3e;

    /* Shadows — neutral gray */
    --shadow-sm:  0 1px 3px rgba(0,0,0,.06);
    --shadow:     0 2px 8px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
    --shadow-lg:  0 20px 60px rgba(0,0,0,.15);

    /* Geometry */
    --radius:    8px;
    --radius-sm: 5px;
    --radius-lg: 12px;

    /* Motion */
    --ease-out:   cubic-bezier(0.23, 1, 0.32, 1);
    --ease-quick: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Cabin', -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  a { color: var(--accent); text-decoration: none; transition: color 180ms var(--ease-out); }
  a:hover { color: #095457; text-decoration: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

  /* ===== Top bar — clean white, sharp ===== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .topbar .brand {
    font-weight: 700; font-size: 16px; letter-spacing: -.01em;
    color: var(--ink);
  }
  .topbar .brand .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; vertical-align: middle;
  }
  .topbar .stats { color: var(--ink-3); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .search { flex: 0 1 380px; position: relative; }
  .search input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface-2);
    font-size: 13px; color: var(--ink);
    transition: border-color 180ms var(--ease-out),
                background 180ms var(--ease-out),
                box-shadow 180ms var(--ease-out);
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.10);
  }
  /* ===== Progress bar in topbar ===== */
  .progress-wrap { display: none; align-items: center; gap: 8px; flex: 0 1 240px; }
  .slash-mode .progress-wrap { display: flex; }
  .progress-bar {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--surface-3); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 2px;
    background: var(--accent);
    transition: width 350ms var(--ease-out);
  }
  .progress-bar .fill.done { background: #34c759; }
  .progress-label { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .progress-reset {
    font-size: 10.5px; color: var(--ink-3); cursor: pointer;
    border: 0; background: none; padding: 0;
    transition: color 150ms var(--ease-out);
  }
  .progress-reset:hover { color: var(--accent); }

  /* Slash toggle in topbar */
  .slash-toggle {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px 3px 8px; border-radius: 12px;
    background: var(--surface-2); border: 0;
    font-size: 11px; color: var(--ink-2); cursor: pointer;
    transition: background 200ms var(--ease-out), color 200ms var(--ease-out);
    white-space: nowrap; flex-shrink: 0;
  }
  .slash-toggle:hover { background: var(--surface-3); }
  .slash-toggle.on { background: var(--accent-soft); color: var(--accent-ink); }
  .slash-toggle .toggle-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink-3); transition: background 200ms var(--ease-out);
  }
  .slash-toggle.on .toggle-dot { background: var(--accent); }

  .search::before {
    content: "\1F50D"; position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%); font-size: 13px; opacity: .45;
  }

  /* ===== Layout ===== */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 53px);
  }
  aside.sidebar {
    border-right: 1px solid var(--line);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);
    padding: 12px 0 16px;
    overflow-y: auto;
  }
  main.content {
    padding: 20px 24px 80px;
    overflow-y: auto;
  }

  /* ===== Sidebar filter groups — accordion ===== */
  .group { margin-bottom: 0; }
  .group:not(:last-child) { border-bottom: 1px solid var(--line); }
  .group-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: pointer; user-select: none;
    transition: background 150ms var(--ease-out);
  }
  .group-header:hover { background: var(--surface-2); }
  .group-header h3 {
    font-size: 12px; font-weight: 600;
    color: var(--ink-2);
    margin: 0; display: flex; align-items: center; gap: 6px;
    text-transform: none; letter-spacing: 0;
  }
  .group-header h3 .active-dot {
    display: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  .group.has-active .group-header h3 .active-dot { display: inline-block; }
  .group-header .arrow {
    font-size: 10px; color: var(--ink-3);
    transition: transform 200ms var(--ease-out);
    flex-shrink: 0;
  }
  .group.open .group-header .arrow { transform: rotate(90deg); }
  .group .chip-wrap {
    max-height: 0; overflow: hidden;
    transition: max-height 350ms var(--ease-out);
  }
  .group.open .chip-wrap { max-height: 600px; overflow-y: auto; }
  .group.fav-group .chip-wrap { max-height: none; overflow: visible; }
  .group.fav-group .group-header { cursor: default; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 14px 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid transparent;
    color: var(--ink-2);
    font-size: 11.5px; cursor: pointer; user-select: none;
    transition: background 150ms var(--ease-out),
                border-color 150ms var(--ease-out),
                color 150ms var(--ease-out),
                transform 120ms var(--ease-out);
  }
  .chip:hover {
    background: var(--surface-3);
    color: var(--ink);
  }
  .chip:active { transform: scale(.97); }
  .chip .count { color: var(--ink-3); font-size: 10.5px; }
  .chip.active {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    color: var(--accent-ink);
    font-weight: 500;
  }
  .chip.active .count { color: var(--accent-ink); }
  .chip.empty { opacity: .30; pointer-events: none; }

  .group .clear {
    font-size: 10.5px; color: var(--ink-3);
    cursor: pointer; background: none; border: 0;
    transition: color 150ms var(--ease-out);
    padding: 0 2px; margin-left: 8px;
  }
  .group .clear:hover { color: var(--accent); }

  /* ===== Toolbar above grid ===== */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .toolbar .result-count { color: var(--ink-2); font-size: 13px; }
  .toolbar .result-count strong { color: var(--ink); font-weight: 600; }
  .toolbar .active-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .toolbar .pill {
    background: var(--accent-soft); color: var(--accent-ink);
    padding: 3px 10px; border-radius: 999px; font-size: 11.5px;
    border: 1px solid var(--accent-line);
    font-weight: 500;
  }
  .toolbar .spacer { flex: 1; }
  .sort {
    border: 1px solid var(--line); background: var(--surface);
    padding: 5px 9px; border-radius: var(--radius-sm);
    font-size: 12px; color: var(--ink-2);
    transition: border-color 150ms var(--ease-out);
  }
  .sort:hover { border-color: var(--line-2); }

  /* ===== Card grid ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .card {
    background: rgba(255,255,255,0.94);  /* fallback */
    background: color-mix(in srgb, var(--color, #888) 5%, #fff);
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px 16px;
    cursor: pointer;
    transition: transform 200ms var(--ease-out),
                box-shadow 200ms var(--ease-out),
                border-color 200ms var(--ease-out),
                opacity 200ms var(--ease-out);
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--color, #888); border-radius: 3px 3px 0 0;
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-color: var(--line-2);
    background: rgba(255,255,255,0.96);  /* fallback */
    background: color-mix(in srgb, var(--color, #888) 9%, #fff);
  }
  .card:active { transform: scale(.99); }
  .card.slashed {
    transform: scale(0.9); opacity: 0; pointer-events: none;
    max-height: 0; padding: 0; margin: 0; border: 0; overflow: hidden;
    transition: transform 300ms cubic-bezier(0.23, 1, 0.32, 1),
                opacity 250ms ease-out,
                max-height 0ms 300ms, padding 0ms 300ms, margin 0ms 300ms;
  }

  /* ===== Star / favorite button — amber ===== */
  .star {
    position: absolute; top: 10px; right: 12px;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    color: var(--ink-3); cursor: pointer; user-select: none;
    background: transparent; border: 0; padding: 0;
    border-radius: 50%;
    transition: transform 180ms var(--ease-out),
                color 150ms var(--ease-out);
  }
  .star:hover { color: var(--star-hover); transform: scale(1.15); }
  .star:active { transform: scale(.92); }
  .star.on { color: var(--star-on); }
  .card .title { padding-right: 28px; }

  /* ===== Star inside modal head ===== */
  .modal-star {
    position: absolute; top: 16px; right: 56px;
    background: transparent; border: 0; padding: 0;
    font-size: 20px; line-height: 1; color: var(--ink-3);
    cursor: pointer; user-select: none;
    transition: color 180ms var(--ease-out),
                transform 180ms var(--ease-out);
  }
  .modal-star:hover { color: var(--star-hover); transform: scale(1.15); }
  .modal-star:active { transform: scale(.92); }
  .modal-star.on { color: var(--star-on); }

  .card .qid-mono {
    font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 10px; color: var(--ink-3); font-weight: 500;
    letter-spacing: 0.02em; margin-bottom: 2px;
  }
  .card .title {
    font-weight: 500; font-size: 14px; line-height: 1.35;
    color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    font-size: 11px; color: var(--ink-3);
    margin-top: auto;
  }
  .card .tag-row { display: flex; flex-wrap: wrap; gap: 3px; }
  .card .tag {
    font-size: 10px;
    padding: 2px 6px; border-radius: 3px;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid transparent;
  }
  /* Tag colour variants — clean, readable */
  .card .tr-tag       { background: #e0f0f1; color: #0d7377; border-color: #bfdfe0; }
  .card .disease-tag  { background: #fde8e8; color: #c53030; border-color: #fbb; }
  .card .complaint-tag{ background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .card .stem {
    font-size: 12.5px; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.55;
  }
  .card .slash-btn {
    position: absolute; bottom: 10px; right: 12px;
    padding: 3px 12px; border-radius: 5px;
    background: #fff; color: var(--ink-2);
    font-size: 11px; cursor: pointer;
    border: 0.5px solid var(--line);
    transition: background 150ms var(--ease-out),
                color 150ms var(--ease-out),
                border-color 150ms var(--ease-out),
                transform 100ms var(--ease-out);
    display: none;
  }
  .slash-mode .card .slash-btn { display: block; }
  .card .slash-btn:hover {
    background: #fde8e8; color: #c53030; border-color: #fbb;
  }
  .card .slash-btn:active { transform: scale(.92); }
  .empty {
    padding: 80px 0; text-align: center; color: var(--ink-3);
    font-size: 13px;
  }

  /* ===== Difficulty dots ===== */
  .diff { display: inline-flex; gap: 2px; align-items: center; }
  .diff .d {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line-2);
    transition: background 180ms var(--ease-out);
  }
  .diff .d.on { background: var(--accent); }

  /* ===== Modal ===== */
  .modal-back {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 48px 16px; overflow-y: auto;
    animation: fadeIn 200ms var(--ease-out);
  }
  .modal-back.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 820px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: slideUp 280ms var(--ease-out);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal .head {
    padding: 20px 26px 16px;
    border-bottom: 1px solid var(--line);
    border-left: 5px solid var(--color, #888);
  }
  .modal .head h1 { margin: 0 0 6px; font-size: 18px; line-height: 1.35; font-weight: 700; }
  .modal .head .meta { color: var(--ink-3); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .modal .body { padding: 20px 26px 26px; }
  .modal .body section { margin-bottom: 18px; }
  .modal .body h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-3); border-bottom: 1px solid var(--line);
    padding-bottom: 5px; margin: 20px 0 10px; font-weight: 600;
  }
  .modal .body h3 { font-size: 14.5px; color: var(--ink); margin: 16px 0 8px; font-weight: 600; }
  .modal .body p { margin: 7px 0; }
  .modal .body ul { padding-left: 24px; margin: 7px 0; }
  .modal .body li { margin: 3px 0; }
  .modal .body blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    margin: 8px 0; padding: 8px 14px;
    color: var(--ink-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .modal .body code {
    background: var(--surface-2); padding: 2px 6px; border-radius: 4px;
    font-size: 12.5px;
  }
  .modal .body .refs {
    color: var(--ink-2); font-size: 12.5px;
  }
  .modal .body .refs ul {
    list-style: disc; padding-left: 22px; margin: 6px 0;
  }
  .modal .body .refs li { margin: 4px 0; line-height: 1.55; }
  .modal .body table.md-table {
    border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12.5px;
  }
  .modal .body table.md-table th, .modal .body table.md-table td {
    border: 1px solid var(--line); padding: 6px 10px;
    text-align: left; vertical-align: top;
  }
  .modal .body table.md-table th { background: var(--surface-2); font-weight: 600; }
  .modal .options { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .modal .options .opt {
    display: flex; gap: 10px; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface-2);
    transition: background 180ms var(--ease-out), border-color 180ms var(--ease-out);
  }
  .modal .options .opt {
    cursor: pointer;
  }
  .modal .options .opt:hover:not(.revealed) {
    background: var(--surface-3);
  }
  .modal .options .opt.correct.revealed {
    background: var(--correct-bg);
    border-color: var(--correct-line);
    font-weight: 500;
  }
  .modal .options .opt.wrong.revealed {
    background: #fde8e8;
    border-color: #fbb;
  }
  .modal .options .opt .letter {
    font-weight: 700; color: var(--ink-2); min-width: 20px;
  }
  .modal .options .opt.correct.revealed .letter { color: var(--correct-ink); }
  .modal .options .opt.wrong.revealed .letter { color: #c53030; }
  .modal .body .explanation-block { display: none; }
  .modal .body .explanation-block.revealed { display: block; }
  .modal .nav-bar {
    display: flex; gap: 8px; padding-top: 12px;
    border-top: 0.5px solid var(--line); margin-top: 12px;
  }
  .modal .nav-btn {
    flex: 1; padding: 8px 0; border-radius: var(--radius-sm);
    font-size: 12px; cursor: pointer; border: 0;
    transition: background 150ms var(--ease-out),
                color 150ms var(--ease-out),
                transform 100ms var(--ease-out);
    font-family: inherit;
  }
  .modal .nav-btn:active { transform: scale(.96); }
  .modal .nav-btn.prev { background: var(--surface-2); color: var(--ink-2); }
  .modal .nav-btn.prev:hover { background: var(--surface-3); }
  .modal .nav-btn.next { background: var(--accent); color: #fff; font-weight: 500; }
  .modal .nav-btn.next:hover { background: #095457; }
  .modal .nav-btn.slash { background: #fde8e8; color: #c53030; font-weight: 500; }
  .modal .nav-btn.slash:hover { background: #fcd5d5; }
  .modal .nav-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .modal .related-list a {
    display: inline-block; margin: 3px 5px 3px 0; padding: 3px 10px;
    background: var(--accent-soft); color: var(--accent-ink);
    border: 1px solid var(--accent-line);
    border-radius: 999px; font-size: 11.5px; cursor: pointer;
    transition: background 150ms var(--ease-out), transform 120ms var(--ease-out);
  }
  .modal .related-list a:hover { background: #cce8ea; text-decoration: none; }
  .modal .related-list a:active { transform: scale(.97); }

  .close-btn {
    position: absolute; top: 12px; right: 16px;
    background: transparent; border: 0; font-size: 22px;
    color: var(--ink-3); cursor: pointer; line-height: 1;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: color 150ms var(--ease-out), background 150ms var(--ease-out), transform 120ms var(--ease-out);
  }
  .close-btn:hover { color: var(--ink); background: var(--surface-2); }
  .close-btn:active { transform: scale(.92); }

  .kbar {
    position: fixed; bottom: 14px; right: 18px;
    background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 5px 10px;
    font-size: 11px; color: var(--ink-3); box-shadow: var(--shadow-sm);
  }
  .kbar kbd {
    background: var(--surface-2); border: 1px solid var(--line-2);
    border-radius: 4px; padding: 1px 5px; font-size: 10px;
    color: var(--ink-2); font-family: inherit;
  }

  /* ===== Heatmap ===== */
  .heatmap { padding: 12px 14px 8px; border-top: 0.5px solid var(--line); margin-top: 8px; }
  .heatmap-title { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-bottom: 6px; }
  .hm-row { display: flex; gap: 3px; margin-bottom: 3px; }
  .hm-cell {
    width: 14px; height: 14px; border-radius: 3px;
    background: var(--surface-2);
    transition: background 200ms var(--ease-out);
  }

  <script type="application/json" id="data">{"items": [{"id": "AMC-Q0017", "type": "mcq", "qid": 17, "title": "ACS 定义 — UA + NSTEMI + STEMI（不是 stable angina）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "differential", "diagnosis"], "topic": ["Acute Coronary Syndrome", "ACS Definition", "Unstable Angina", "NSTEMI", "STEMI", "Spectrum"], "difficulty": 2, "correctAnswer": "B", "page": 40, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "acs", "acute-coronary-syndrome", "unstable-angina", "nstemi", "stemi", "approach-definition", "approach-differential", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0017-ACS-Definition.md", "stem": "<p>By definition, which one of the following best describes the condition termed as acute coronary syndrome?</p>", "options": [{"letter": "A", "text": "Non-ST elevation myocardial infarction and ST elevation myocardial infarction immediately following cardiac surgery"}, {"letter": "B", "text": "Unstable angina, non-ST elevation myocardial infarction and ST elevation myocardial infarction"}, {"letter": "C", "text": "Stable angina, unstable angina and non-ST elevation myocardial infarction"}, {"letter": "D", "text": "Stable angina, unstable angina and ST elevation myocardial infarction"}, {"letter": "E", "text": "Unstable angina"}], "rationale": "<p>1. <strong>题型识别</strong>：概念定义题 → 考 ACS 的<strong>谱</strong> 2. <strong>ACS 三联</strong>：</p>\n<ul>\n<li><strong>Unstable Angina (UA)</strong>：缺血症状但<strong>无心肌坏死</strong>（肌钙蛋白不高）</li>\n<li><strong>NSTEMI</strong>：缺血 + 心肌坏死（肌钙蛋白高）+ <strong>无 ST 抬高</strong></li>\n<li><strong>STEMI</strong>：缺血 + 心肌坏死 + <strong>ST 抬高</strong></li>\n<p>3. <strong>关键鉴别</strong>：</p>\n<li><strong>stable angina = 不属于 ACS</strong>（可预测的劳力性胸痛，休息可缓解）</li>\n<li><strong>post-cardiac-surgery MI = 不属于 ACS</strong>（机制不同，是手术并发症）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A：错（post-surgery MI 不算 ACS）</li>\n<li>B：<strong>正确</strong>（UA + NSTEMI + STEMI）</li>\n<li>C：错（包含 stable angina，且缺 STEMI）</li>\n<li>D：错（包含 stable angina，且缺 NSTEMI）</li>\n<li>E：不完整（只 UA，缺 NSTEMI 和 STEMI）</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"ACS = 任何 MI\"陷阱</strong>：错。ACS 是<strong>急性</strong>临床综合征，stable angina 是<strong>慢性</strong>。post-surgery MI 是<strong>并发症</strong>不是综合征。</li>\n<li><strong>\"ACS = STEMI\"陷阱</strong>：错。STEMI 是 ACS 的一种，<strong>NSTEMI 和 UA 也是</strong>。</li>\n<li><strong>\"三选一\"陷阱</strong>：题问\"best describes\"——ACS 是<strong>三个</strong>的总称，不是其中之一。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Acute coronary syndrome</strong> consists of:</p>\n<ul>\n<li><strong>Unstable angina (UA)</strong></li>\n<li><strong>Non-ST elevation myocardial infarction (NSTEMI)</strong></li>\n<li><strong>ST elevation myocardial infarction (STEMI)</strong></li>\n</ul>\n<p>They all present with similar clinical symptoms. The differentiation depends on:</p>\n<ul>\n<li>ECG changes (ST elevation vs not)</li>\n<li>Cardiac biomarkers (troponin)</li>\n</ul>\n<p><strong>Why NOT stable angina</strong>: Stable angina is predictable, exertion-related, and does NOT represent an acute coronary event.</p>\n<p><strong>Why NOT post-surgery MI</strong>: A peri-operative MI has a different mechanism (plaque rupture under stress, supply-demand mismatch) and is classified as a procedural complication, not ACS.</p>", "references": "<ul>\n<li>Mayo Clinic Proceedings — Acute Coronary Syndromes: Diagnosis and Management, Part I</li>\n<li>UpToDate — Acute coronary syndrome: Terminology and classification</li>\n<li>（待补：ESC ACS 指南 2020/2023）</li>\n</ul>", "related": ["AMC-Q0224-Thrombolytics-Contraindications", "AMC-Q0225-Inferior-STEMI-Reperfusion", "AMC-Q0231-Anterolateral-STEMI-PCI", "AMC-Q0249-Post-NSTEMI-VT", "MOC-Cardiology", "Topic-ACS-Pathway"], "bodyHtml": "", "diseases": ["ACS", "NSTEMI", "STEMI", "Unstable Angina", "Stable Angina"], "complaints": [], "search": "acs 定义 — ua + nstemi + stemi（不是 stable angina）\nacute coronary syndrome acs definition unstable angina nstemi stemi spectrum\ndefinition differential diagnosis\n by definition, which one of the following best describes the condition termed as acute coronary syndrome? \n correct answer is  b  \n  acute coronary syndrome  consists of: \n \n  unstable angina (ua)  \n  non-st elevation myocardial infarction (nstemi)  \n  st elevation myocardial infarction (stemi)  \n \n they all present with similar clinical symptoms. the differentiation depends on: \n \n ecg changes (st elevation vs not) \n cardiac biomarkers (troponin) \n \n  why not stable angina : stable angina is predictable, exertion-related, and does not represent an acute coronary event. \n  why not post-surgery mi : a peri-operative mi has a different mechanism (plaque rupture under stress, supply-demand mismatch) and is classified as a procedural complication, not acs. "}, {"id": "AMC-Q0018", "type": "mcq", "qid": 18, "title": "ACS 最常见病因 — 斑块破裂 + 急性血栓形成", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "complications", "prevention"], "topic": ["Acute Coronary Syndrome", "Etiology", "Atherosclerosis", "Plaque Rupture", "Thrombosis", "Epidemiology"], "difficulty": 2, "correctAnswer": "B", "page": 51, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "acs", "atherosclerosis", "plaque-rupture", "thrombosis", "approach-definition", "approach-complications", "approach-prevention"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0018-ACS-Most-Common-Cause.md", "stem": "<p>Which one of the following is the most common cause of acute coronary syndrome?</p>", "options": [{"letter": "A", "text": "Cocaine toxicity and consequent coronary artery vasospasm"}, {"letter": "B", "text": "Acute thrombosis"}, {"letter": "C", "text": "Chest trauma"}, {"letter": "D", "text": "Arterial inflammation"}, {"letter": "E", "text": "Anxiety"}], "rationale": "<p>1. <strong>题型识别</strong>：ACS 的<strong>最常见病因</strong>（病因学 / 病理生理） 2. <strong>ACS 病理生理链</strong>：</p>\n<ul>\n<li>慢性：<strong>动脉粥样硬化</strong>（基础病变）</li>\n<li>急性诱因：<strong>斑块破裂</strong>（fibrous cap 破裂）</li>\n<li>急性事件：<strong>血小板聚集 + 血栓形成</strong> → 冠脉闭塞</li>\n<p>3. <strong>关键区分</strong>：</p>\n<li>动脉粥样硬化 = <strong>基础</strong>（慢性过程）</li>\n<li>斑块破裂 = <strong>触发</strong></li>\n<li>急性血栓 = <strong>最常见</strong>直接原因（题问\"cause\"）</li>\n<p>4. <strong>其他选项</strong>：</p>\n<li>A (Cocaine)：可致冠脉痉挛和 ACS，但<strong>罕见</strong></li>\n<li>C (Chest trauma)：可致冠脉夹层，<strong>罕见</strong></li>\n<li>D (Arterial inflammation)：可致血管炎（如 Kawasaki），<strong>罕见</strong></li>\n<li>E (Anxiety)：<strong>不是</strong> ACS 病因</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"动脉粥样硬化 = ACS 病因\"陷阱</strong>：错。动脉粥样硬化是<strong>基础病变</strong>，ACS 的<strong>直接病因是急性血栓</strong>（斑块破裂后）。</li>\n<li><strong>\"冠脉痉挛 = ACS 病因\"陷阱</strong>：冠脉痉挛是 ACS <strong>少数</strong>原因（Cocaine、Prinzmetal）。</li>\n<li><strong>\"焦虑 = ACS\"陷阱</strong>：焦虑是<strong>症状</strong>（可达心绞痛样胸痛），<strong>不是</strong>病理病因。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Atherosclerotic changes of coronary arteries</strong> remain the <strong>most common cause of ischemic heart disease</strong>. The most common cause of <strong>acute coronary syndrome</strong> is <strong>acute rupture of an atheroma followed by platelet aggregation and thrombus formation</strong>. Although other options can lead to acute coronary syndrome, they are far less common.</p>\n<p><strong>Pathophysiology cascade</strong>: 1. Chronic atherosclerosis (lipid-laden plaque with thin fibrous cap) 2. Plaque rupture or erosion (trigger) 3. Platelet adhesion and aggregation 4. <strong>Thrombus formation</strong> ← ACS direct cause 5. Coronary occlusion → ischemia → ACS spectrum (UA/NSTEMI/STEMI)</p>", "references": "<ul>\n<li>Medscape — Acute Coronary Syndrome</li>\n<li>（待补：2023 ESC ACS 指南）</li>\n</ul>", "related": ["AMC-Q0017-ACS-Definition", "AMC-Q0224-Thrombolytics-Contraindications", "AMC-Q0225-Inferior-STEMI-Reperfusion", "MOC-Cardiology", "Topic-Atherosclerosis-Pathophysiology"], "bodyHtml": "", "diseases": ["ACS"], "complaints": [], "search": "acs 最常见病因 — 斑块破裂 + 急性血栓形成\nacute coronary syndrome etiology atherosclerosis plaque rupture thrombosis epidemiology\ndefinition complications prevention\n which one of the following is the most common cause of acute coronary syndrome? \n correct answer is  b  \n  atherosclerotic changes of coronary arteries  remain the  most common cause of ischemic heart disease . the most common cause of  acute coronary syndrome  is  acute rupture of an atheroma followed by platelet aggregation and thrombus formation . although other options can lead to acute coronary syndrome, they are far less common. \n  pathophysiology cascade : 1. chronic atherosclerosis (lipid-laden plaque with thin fibrous cap) 2. plaque rupture or erosion (trigger) 3. platelet adhesion and aggregation 4.  thrombus formation  ← acs direct cause 5. coronary occlusion → ischemia → acs spectrum (ua/nstemi/stemi) "}, {"id": "AMC-Q0021", "type": "mcq", "qid": 21, "title": "运动诱发 + 年轻 + 突发心悸 → PSVT（不是 VT/AF/AVB）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "differential", "definition"], "topic": ["PSVT", "Exercise-induced", "Young Healthy Patient", "Regular Pulse", "Supraventricular Tachycardia"], "difficulty": 3, "correctAnswer": "D", "page": 63, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "psvt", "svt", "exercise", "approach-diagnosis", "approach-differential", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0021-Exercise-PSVT.md", "stem": "<p>A 28-year-old man develops rapid palpitations and mild light-headedness following a 20 km run. He denies any cardiac disease and mentions that he had a similar episode 3 months ago for which he underwent cardiovascular examination by another doctor but everything was normal. On examination, he has regular but rapid pulse of 180 bpm. Which one of the following rhythm strips would be expected for him?</p>\n<ul>\n<li>A.</li>\n<li>B.</li>\n<li>C.</li>\n<li>D.</li>\n<li>E.</li>\n</ul>", "options": [], "rationale": "<p>1. <strong>题型识别</strong>：年轻健康人 + 运动诱发 + 规则心动过速 → 心律失常鉴别 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>28 岁男性</li>\n<li><strong>无已知心脏病</strong></li>\n<li>3 月前有类似发作（<strong>复发性</strong>）</li>\n<li>运动（20 km 跑）<strong>诱发</strong></li>\n<li>规则 180 bpm</li>\n<p>3. <strong>关键鉴别</strong>（按节律）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>心律失常</th><th>规则性</th><th>频率</th><th>年龄</th><th>触发</th></tr></thead>\n<tbody>\n<tr><td><strong>PSVT</strong></td><td><strong>规则</strong></td><td>150-250</td><td><strong>年轻</strong></td><td>运动 / 儿茶酚胺</td></tr>\n<tr><td>VT</td><td>规则</td><td>100-250</td><td>通常年长 + 心脏病</td><td>—</td></tr>\n<tr><td>AF</td><td><strong>不规则</strong></td><td>100-180</td><td>通常年长</td><td>—</td></tr>\n<tr><td>AFL</td><td>规则</td><td>75-150（2:1 阻滞 150）</td><td>通常年长</td><td>—</td></tr>\n<tr><td>三度 AVB</td><td>规则（室性逸搏）</td><td>30-50</td><td>任何</td><td>—</td></tr>\n</tbody>\n</table>\n<p>4. <strong>本例</strong>：<strong>年轻 + 规则 + 180 bpm + 运动诱发</strong> → <strong>PSVT</strong> 5. <strong>选项排除</strong>：</p>\n<ul>\n<li>A (VT)：无心脏病 + 28 岁 → 不太像 VT</li>\n<li>B (AF)：AF 是不规则脉</li>\n<li>C (AFL)：AFL 在年长者多见</li>\n<li>D (PSVT)：<strong>正确</strong></li>\n<li>E (三度 AVB)：慢心率，不是 180 bpm</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"180 bpm = VT\"陷阱</strong>：错。<strong>180 bpm 在年轻 + 规则 = PSVT</strong>；<strong>VT 在心脏病基础上</strong>。</li>\n<li><strong>\"运动 = 心脏缺血\"陷阱</strong>：运动诱发心悸在<strong>年轻人 = SVT 触发</strong>（儿茶酚胺敏感），<strong>不</strong>是缺血。</li>\n<li><strong>\"AFL 跟 AF 类似\"陷阱</strong>：AFL 心房率 250-350，但<strong>2:1 房室传导</strong>后心室率 150——本例 180 bpm 偏 PSVT 范围。</li>\n<li><strong>\"三度 AVB 突发\"陷阱</strong>：三度 AVB 不会 180 bpm（心室率 30-50）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>An arrhythmia induced by exercise in a young, otherwise healthy person, presenting with a <strong>rapid regular pulse</strong> is very likely to be a <strong>paroxysmal supraventricular tachycardia (PSVT)</strong>.</p>\n<ul>\n<li>(Option A) The presence of <strong>ventricular tachycardia</strong> in the absence of an underlying cardiac disease is <strong>unlikely</strong>.</li>\n<li>(Option B) <strong>Atrial fibrillation</strong> presents with <strong>irregular pulse</strong>.</li>\n<li>(Option C) <strong>Atrial flutter</strong> is unlikely.</li>\n<li>(Option E) <strong>Complete heart block</strong> is unlikely.</li>\n</ul>\n<p><strong>PSVT clinical features</strong>:</p>\n<ul>\n<li>Young patients (typically 20-40 years)</li>\n<li><strong>Regular</strong> rapid pulse</li>\n<li>Triggered by exercise, stress, caffeine, alcohol</li>\n<li><strong>Abrupt onset and offset</strong> (paroxysmal)</li>\n<li>Usually <strong>narrow QRS</strong></li>\n<li>Can be self-terminated with vagal maneuvers</li>\n</ul>\n<p><strong>Common mechanisms</strong>: AV nodal reentry tachycardia (AVNRT, most common), AV reentry tachycardia (AVRT, e.g., WPW)</p>", "references": "<ul>\n<li>MJA — Supraventricular tachycardia</li>\n<li>Medscape — Paroxysmal Supraventricular Tachycardia</li>\n<li>（待补：ESC SVT 指南）</li>\n</ul>", "related": ["AMC-Q0244-PSVT-Verapamil", "AMC-Q0242-WPW-Pediatric-Bradycardia", "AMC-Q0245-AF-HF-Metoprolol", "MOC-Cardiology", "Topic-SVT-Management"], "bodyHtml": "", "diseases": ["PSVT", "VT"], "complaints": ["dizziness", "palpitations"], "search": "运动诱发 + 年轻 + 突发心悸 → psvt（不是 vt/af/avb）\npsvt exercise-induced young healthy patient regular pulse supraventricular tachycardia\ndiagnosis differential definition\n a 28-year-old man develops rapid palpitations and mild light-headedness following a 20 km run. he denies any cardiac disease and mentions that he had a similar episode 3 months ago for which he underwent cardiovascular examination by another doctor but everything was normal. on examination, he has regular but rapid pulse of 180 bpm. which one of the following rhythm strips would be expected for him? \n \n a. \n b. \n c. \n d. \n e. \n \n correct answer is  d  \n an arrhythmia induced by exercise in a young, otherwise healthy person, presenting with a  rapid regular pulse  is very likely to be a  paroxysmal supraventricular tachycardia (psvt) . \n \n (option a) the presence of  ventricular tachycardia  in the absence of an underlying cardiac disease is  unlikely . \n (option b)  atrial fibrillation  presents with  irregular pulse . \n (option c)  atrial flutter  is unlikely. \n (option e)  complete heart block  is unlikely. \n \n  psvt clinical features : \n \n young patients (typically 20-40 years) \n  regular  rapid pulse \n triggered by exercise, stress, caffeine, alcohol \n  abrupt onset and offset  (paroxysmal) \n usually  narrow qrs  \n can be self-terminated with vagal maneuvers \n \n  common mechanisms : av nodal reentry tachycardia (avnrt, most common), av reentry tachycardia (avrt, e.g., wpw) "}, {"id": "AMC-Q0025", "type": "mcq", "qid": 25, "title": "PCI 后 DAPT 时长 — Drug-Eluting Stent 的 12 个月", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "prevention"], "topic": ["Acute Coronary Syndrome", "STEMI", "PCI", "Dual Antiplatelet Therapy", "Drug-Eluting Stent"], "difficulty": 3, "correctAnswer": "D", "page": 2, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "ACS", "pharmacology", "approach-treatment", "approach-prevention"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0025-PCI-Antiplatelet-Duration.md", "stem": "<p>After percutaneous coronary intervention (PCI) in a patient with ST segment elevation myocardial infarction (STEMI), which one of the following is the recommended period for antiplatelet therapy?</p>", "options": [{"letter": "A", "text": "Two weeks"}, {"letter": "B", "text": "Four weeks"}, {"letter": "C", "text": "Six weeks"}, {"letter": "D", "text": "12 months"}, {"letter": "E", "text": "Lifelong"}], "rationale": "<p>1. <strong>题型识别</strong>：临床实践 / 治疗指南题。 2. <strong>拆解题目关键概念</strong>：</p>\n<ul>\n<li>患者：STEMI</li>\n<li>操作：PCI → 必然置入支架</li>\n<li>任务：antiplatelet therapy 推荐时长</li>\n<p>3. <strong>支架类型区分</strong>：</p>\n<li>Bare-metal stent (BMS)：DAPT 通常 1-3 个月</li>\n<li><strong>Drug-eluting stent (DES)</strong>：DAPT <strong>至少 12 个月</strong> ← 现代主流</li>\n<p>4. <strong>DAPT 组成</strong>：阿司匹林（终身）+ P2Y12 抑制剂之一：</p>\n<li>Clopidogrel</li>\n<li>Prasugrel</li>\n<li>Ticagrelor</li>\n<p>5. <strong>时长梯度</strong>：2w < 4w < 6w < 12m < Lifelong。</p>\n<li>2-6 weeks → 太短（裸金属后过渡期也不够）</li>\n<li>12 months → DES 标准</li>\n<li>Lifelong → 阿司匹林部分（不算 DAPT）→</li>\n<li>选 <strong>D</strong></li>\n</ul>", "traps": "<ul>\n<li><strong>混支架类型</strong>：BMS 的 1-3 个月 vs DES 的 12 个月，是 AMC 高频对比点。本题是 STEMI/PCI → 默认 DES。</li>\n<li><strong>\"Lifelong\"陷阱</strong>：阿司匹林部分确实是 lifelong，但 <em>DAPT</em> 是 12 个月；学生答 E 时把\"阿司匹林\"和\"DAPT\"混淆。</li>\n<li><strong>数字梯度记忆</strong>：如果记住 \"12 months for DES\"，梯度题立刻锁定，2w/4w/6w 都是干扰项。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>In nearly all patients in whom intra-coronary <strong>drug-eluting stent</strong> is placed, <strong>dual antiplatelet therapy (DAPT)</strong> is indicated for <strong>at least 12 months</strong>.</p>\n<p>DAPT = aspirin + one of:</p>\n<ul>\n<li><strong>Clopidogrel</strong></li>\n<li><strong>Prasugrel</strong></li>\n<li><strong>Ticagrelor</strong></li>\n</ul>", "references": "<ul>\n<li>RACGP - AFP - Dual antiplatelet therapy</li>\n<li>(待补：ACS guideline 链接)</li>\n</ul>", "related": ["AMC-Q0026-Heart-Failure-Prognosis", "AMC-Q0028-Pulmonary-Edema-Presentation", "MOC-Cardiology", "Topic-DAPT-Post-PCI"], "bodyHtml": "", "diseases": ["ACS", "STEMI"], "complaints": [], "search": "pci 后 dapt 时长 — drug-eluting stent 的 12 个月\nacute coronary syndrome stemi pci dual antiplatelet therapy drug-eluting stent\ntreatment prevention\n after percutaneous coronary intervention (pci) in a patient with st segment elevation myocardial infarction (stemi), which one of the following is the recommended period for antiplatelet therapy? \n correct answer is  d  \n in nearly all patients in whom intra-coronary  drug-eluting stent  is placed,  dual antiplatelet therapy (dapt)  is indicated for  at least 12 months . \n dapt = aspirin + one of: \n \n  clopidogrel  \n  prasugrel  \n  ticagrelor  \n "}, {"id": "AMC-Q0026", "type": "mcq", "qid": 26, "title": "心衰预后 — JVP & S3 为何不是诊断而是预测？", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["prognosis", "physical-exam", "diagnosis"], "topic": ["Systolic Heart Failure", "Prognostic Indicators", "Physical Examination"], "difficulty": 2, "correctAnswer": "A", "page": 3, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "heart-failure", "approach-prognosis", "approach-physical-exam", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0026-Heart-Failure-Prognosis.md", "stem": "<p>Which one of the following is of <strong>predictive value</strong> for prognosis of a patient with systolic heart failure?</p>", "options": [{"letter": "A", "text": "Jugular venous pressure"}, {"letter": "B", "text": "Peripheral edema"}, {"letter": "C", "text": "Shortness of breath"}, {"letter": "D", "text": "Orthopnea"}, {"letter": "E", "text": "Chest pain"}], "rationale": "<p>1. <strong>题型识别</strong>：区分 \"diagnostic value\"（用于诊断）vs \"<strong>predictive</strong> / prognostic value\"（用于预测结局）。 2. <strong>核心思路</strong>：心衰诊断靠临床症状 + 体征 + 影像。<strong>预后预测</strong>靠的是：</p>\n<ul>\n<li><strong>血流动力学指标</strong>：JVP 升高（提示前负荷升高 / 右心衰）</li>\n<li><strong>第三心音 S3</strong>：左室舒张末压升高 + 心室顺应性下降</li>\n<p>3. <strong>逐项排除</strong>：</p>\n<li>A JVP → <strong>prognostic</strong> ✔</li>\n<li>B Peripheral edema → 诊断依据（晚期体征）</li>\n<li>C SOB → 诊断依据（NYHA 关键症状）</li>\n<li>D Orthopnea → 诊断依据（典型左心衰）</li>\n<li>E Chest pain → 非心衰特异性（鉴别诊断价值）</li>\n<p>4. <strong>锁定答案 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>Diagnostic vs Prognostic 混淆</strong>：题目问 \"predictive\" — 错把 B/C/D 当 prognostic 选。</li>\n<li><strong>JVP vs 其他静脉压</strong>：JVP 是 bedside 体征，预测价值高于 CVP（有创监测）—— AMC 偏向考 <em>床旁指标</em>。</li>\n<li><strong>S3 单独出现</strong>：S3 未列选项，但要点是\"JVP 和 S3 是 prognostic 双雄\"。题只考了 JVP 但概念记住\"两个一起\"。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Prognosis of systolic heart failure can be predicted by <strong>jugular venous pressure (JVP)</strong> and the <strong>third heart sound (S3)</strong>. Increased JVP or the presence of S3 sound indicates <strong>poor prognosis</strong>.</p>\n<p><strong>Other options (B/C/D/E) are of <em>diagnostic</em>, not <em>predictive</em> value.</strong></p>", "references": "<ul>\n<li>http://www.uptodate.com/contents/prognosis-of-heart-failure</li>\n</ul>", "related": ["AMC-Q0025-PCI-Antiplatelet-Duration", "AMC-Q0028-Pulmonary-Edema-Presentation", "AMC-Q0029-Pulmonary-Edema-Management", "MOC-Cardiology", "Topic-Heart-Failure-Bedside-Prognosis"], "bodyHtml": "", "diseases": ["Heart Failure"], "complaints": [], "search": "心衰预后 — jvp & s3 为何不是诊断而是预测？\nsystolic heart failure prognostic indicators physical examination\nprognosis physical-exam diagnosis\n which one of the following is of  predictive value  for prognosis of a patient with systolic heart failure? \n correct answer is  a  \n prognosis of systolic heart failure can be predicted by  jugular venous pressure (jvp)  and the  third heart sound (s3) . increased jvp or the presence of s3 sound indicates  poor prognosis . \n  other options (b/c/d/e) are of  diagnostic , not  predictive  value.  "}, {"id": "AMC-Q0028", "type": "mcq", "qid": 28, "title": "Acute Pulmonary Edema — 急性失代偿心衰的诊断识别", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "physical-exam"], "topic": ["Acute Decompensated Heart Failure", "Acute Pulmonary Edema", "Clinical Reasoning", "Diagnostic Reasoning"], "difficulty": 3, "correctAnswer": "B", "page": 4, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "heart-failure", "pulmonary-edema", "approach-diagnosis", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0028-Pulmonary-Edema-Presentation.md", "stem": "<p>You are called to see a 50-year-old Aboriginal woman with a history of congestive heart failure, who has developed <strong>severe dyspnea</strong> and is in <strong>respiratory distress</strong>.</p>\n<p>On examination:</p>\n<ul>\n<li>Pale and sweaty</li>\n<li>BP 110/75 mmHg</li>\n<li><strong>Pulse 120 bpm</strong></li>\n<li><strong>RR 26 /min</strong></li>\n<li>Chest auscultation: <strong>bilateral crackles</strong></li>\n<li>CXR: <strong>bilateral whiteout of lungs</strong> from lower lobes up to mid-lung fields</li>\n<li>ECG: no abnormality</li>\n<li>Troponin: normal on arrival <strong>and 8 hours later</strong></li>\n</ul>\n<p>Which one of the following is the <strong>most likely diagnosis</strong>?</p>", "options": [{"letter": "A", "text": "Acute right heart failure"}, {"letter": "B", "text": "Acute pulmonary edema"}, {"letter": "C", "text": "Pleural effusion"}, {"letter": "D", "text": "Acute myocardial infarction"}, {"letter": "E", "text": "Pulmonary embolism"}], "rationale": "<p>1. <strong>题型识别</strong>：给出完整病史 + 检查 → \"最可能诊断\" = 综合临床推理。 2. <strong>关键线索汇总</strong>：</p>\n<ul>\n<li>已知 CHF（基线水平升高）</li>\n<li><strong>Severe acute dyspnea</strong> —— 急性发作</li>\n<li>双肺 crackles —— 肺泡液体</li>\n<li>CXR 双侧 whiteout —— 肺水肿征</li>\n<li>心动过速 120（失代偿）</li>\n<li><strong>Troponin 阴性、ECG 阴性 → 排除 MI</strong></li>\n<p>3. <strong>DDx 排除路径</strong>：</p>\n<li><strong>A 急性右心衰</strong>：以踝水肿、颈静脉怒张、肝大为主；本题没有 → 排除</li>\n<li><strong>B 急性肺水肿</strong>：✔ CHF 病史 + 急性气促 + 双肺啰音 + CXR 白肺</li>\n<li><strong>C 胸腔积液</strong>：进展慢，通常不急性；即便急性也得数小时-数天</li>\n<li><strong>D AMI</strong>：典型会有 ECG 改变 / 肌钙蛋白升高 → 双重排除</li>\n<li><strong>E PE</strong>：可能，但 <em>第二位</em> DDx。PE 经典三联：呼吸困难 + 呼吸急促 + 心动过速；可有胸膜痛、肩峰痛。ECG 可正常或 S1Q3T3、窦速、V1-V3 T 倒置、右束支。</li>\n<p>4. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>PE 陷阱</strong>：PE 表现与肺水肿部分重叠，但 PE 的 CXR 通常 <em>正常</em> 或 <em>局部灌注缺失</em>，不会 <em>双侧 whiteout</em>。本题 CXR 是 whiteout，强烈支持肺水肿而非 PE。</li>\n<li><strong>MI 陷阱</strong>：MI + 心衰都可急性呼吸困难，但本题 troponin 双阴 + ECG 阴 → 排除 MI。</li>\n<li><strong>Pleural effusion 陷阱</strong>：双侧胸腔积液可以引起呼吸困难，但 <em>急性 severe</em> 表现 + CXR 是 <em>whiteout</em>（肺泡填充影），不是 <em>积液影</em>（肋膈角变钝 / 层状影）→ 鉴别靠 CXR 解读。</li>\n<li><strong>临床推理 ≠ 单点匹配</strong>：任何单项都不能确诊；三件套（病史 + 急性发作 + 双肺啰音 + CXR 表现）一起才支持 acute pulmonary edema。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Acute pulmonary edema</strong> presents with:</p>\n<ul>\n<li>Dyspnea</li>\n<li><strong>Bibasilar coarse crackles</strong></li>\n<li>Tachycardia</li>\n<li>Pallor and cold limbs (hypoperfusion)</li>\n</ul>\n<p><strong>Background of CHF</strong> strongly supports pulmonary edema as the most likely diagnosis.</p>\n<p><strong>排除项分析</strong>：</p>\n<ul>\n<li><strong>(A) Acute right heart failure</strong> — ankle edema, raised JVP, hepatomegaly. 本题除肺充血外没有右心衰表现 → 排除。</li>\n<li><strong>(C) Pleural effusion</strong> — slowly progressive; hours-to-days even when acute → 不符合急性 severe dyspnea。</li>\n<li><strong>(D) Acute MI</strong> — 必有 ECG 改变 + cardiac enzymes 升高 → 已通过 troponin 双时点和 ECG 排除。</li>\n<li><strong>(E) Massive PE</strong> — <strong>第二位 DDx</strong>。表现：呼吸困难 + 呼吸急促 + 心动过速三联；可有胸膜痛/肩峰痛；ECG 可正常或 S1Q3T3、窦速、V1-V3 T 倒置、RBBB。</li>\n</ul>", "references": "<ul>\n<li>http://www.heartfoundation.org.au/SiteCollectionDo</li>\n<li>（待补：acute pulmonary edema 鉴别诊断专题）</li>\n</ul>", "related": ["AMC-Q0026-Heart-Failure-Prognosis", "AMC-Q0029-Pulmonary-Edema-Management", "MOC-Cardiology", "Topic-Heart-Failure-Acute-Decompensation"], "bodyHtml": "", "diseases": ["Heart Failure", "Pulmonary Edema"], "complaints": ["dyspnea"], "search": "acute pulmonary edema — 急性失代偿心衰的诊断识别\nacute decompensated heart failure acute pulmonary edema clinical reasoning diagnostic reasoning\ndiagnosis physical-exam\n you are called to see a 50-year-old aboriginal woman with a history of congestive heart failure, who has developed  severe dyspnea  and is in  respiratory distress . \n on examination: \n \n pale and sweaty \n bp 110/75 mmhg \n  pulse 120 bpm  \n  rr 26 /min  \n chest auscultation:  bilateral crackles  \n cxr:  bilateral whiteout of lungs  from lower lobes up to mid-lung fields \n ecg: no abnormality \n troponin: normal on arrival  and 8 hours later  \n \n which one of the following is the  most likely diagnosis ? \n correct answer is  b  \n  acute pulmonary edema  presents with: \n \n dyspnea \n  bibasilar coarse crackles  \n tachycardia \n pallor and cold limbs (hypoperfusion) \n \n  background of chf  strongly supports pulmonary edema as the most likely diagnosis. \n  排除项分析 ： \n \n  (a) acute right heart failure  — ankle edema, raised jvp, hepatomegaly. 本题除肺充血外没有右心衰表现 → 排除。 \n  (c) pleural effusion  — slowly progressive; hours-to-days even when acute → 不符合急性 severe dyspnea。 \n  (d) acute mi  — 必有 ecg 改变 + cardiac enzymes 升高 → 已通过 troponin 双时点和 ecg 排除。 \n  (e) massive pe  —  第二位 ddx 。表现：呼吸困难 + 呼吸急促 + 心动过速三联；可有胸膜痛/肩峰痛；ecg 可正常或 s1q3t3、窦速、v1-v3 t 倒置、rbbb。 \n "}, {"id": "AMC-Q0029", "type": "mcq", "qid": 29, "title": "Acute Pulmonary Edema Management — 哪些不能用？", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment"], "topic": ["Acute Pulmonary Edema Management", "Pharmacotherapy", "Non-invasive Ventilation"], "difficulty": 3, "correctAnswer": "D", "page": 5, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pharmacology", "pulmonary-edema", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0029-Pulmonary-Edema-Management.md", "stem": "<p>Which one of the following is <strong>not indicated</strong> in management of pulmonary edema?</p>", "options": [{"letter": "A", "text": "Continuous positive airway pressure (CPAP)"}, {"letter": "B", "text": "Bilevel positive airway pressure (BiPAP)"}, {"letter": "C", "text": "Glyceryl trinitrate"}, {"letter": "D", "text": "Oral frusemide"}, {"letter": "E", "text": "Morphine"}], "rationale": "<p>1. <strong>题型识别</strong>：否定型（\"is <strong>not</strong> indicated\"）+ 用药途径选择题。 2. <strong>回忆急性肺水肿管理框架</strong>：</p>\n<ul>\n<li><strong>氧疗</strong>：高流量 10-15 L/min（Hudson + reservoir）</li>\n<li><strong>利尿</strong>：<strong>IV frusemide</strong>（减前负荷）</li>\n<li><strong>血管扩张</strong>：GTN（减前负荷，需滴定保持 SBP > 100）</li>\n<li><strong>吗啡</strong>：减交感张力 → 血管扩张 → 减前负荷</li>\n<li><strong>无创通气</strong>：CPAP / BiPAP（减轻肺泡水肿）</li>\n<p>3. <strong>逐项匹配</strong>：</p>\n<li>A CPAP ✔ 适用</li>\n<li>B BiPAP ✔ 适用</li>\n<li>C GTN ✔ 适用</li>\n<li><strong>D 口服呋塞米 ✘</strong> —— 起效慢、不适合急性</li>\n<li>E Morphine ✔ 适用</li>\n<p>4. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>口服 vs 静脉 陷阱</strong>：frusemide 本身是好药，但 <em>口服</em> 急性期用是错的。</li>\n<li><strong>吗啡适用性陷阱</strong>：吗啡曾是肺水肿常用，但 <em>现代证据</em> 对其轻度保留（hemodynamic、apnea 风险）。AMC 仍按\"传统有效\"算 <em>indicated</em> → 答非所问。</li>\n<li><strong>CPAP/BiPAP 区别</strong>：两者都可，但 BiPAP 备用于 CPAP 不耐受者；AMC 通常都算正确选项。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Acute pulmonary edema management</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>干预</th><th>机制 / 用途</th></tr></thead>\n<tbody>\n<tr><td><strong>Oxygen 10-15 L/min</strong></td><td>Hudson mask + reservoir；后转 nasal 2-6 L/min</td></tr>\n<tr><td><strong>IV frusemide</strong> ★</td><td>减容量超负荷，<strong>急性期核心</strong></td></tr>\n<tr><td><strong>GTN</strong></td><td>减前负荷；滴定保持 SBP > 100 mmHg</td></tr>\n<tr><td><strong>Morphine</strong></td><td>减交感张力 → 血管扩张 → 减前负荷</td></tr>\n<tr><td><strong>CPAP / BiPAP</strong></td><td>无创通气减肺泡水肿 + 静脉回流</td></tr>\n</tbody>\n</table>\n<p>关键点：<strong>Oral</strong> frusemide 起效慢，急性期无效，故 <em>not indicated</em>。</p>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>http://www.racgp.org.au/download/documents/AFP/201</li>\n<li>https://www.mja.com.au/journal/2011/194/8/2011-upd</li>\n</ul>", "related": ["AMC-Q0028-Pulmonary-Edema-Presentation", "AMC-Q0026-Heart-Failure-Prognosis", "MOC-Cardiology", "Topic-Acute-Pulmonary-Edema-Management"], "bodyHtml": "", "diseases": ["Pulmonary Edema"], "complaints": ["edema"], "search": "acute pulmonary edema management — 哪些不能用？\nacute pulmonary edema management pharmacotherapy non-invasive ventilation\ntreatment\n which one of the following is  not indicated  in management of pulmonary edema? \n correct answer is  d  \n  acute pulmonary edema management ： \n \n   干预  机制 / 用途   \n \n   oxygen 10-15 l/min   hudson mask + reservoir；后转 nasal 2-6 l/min  \n   iv frusemide  ★  减容量超负荷， 急性期核心   \n   gtn   减前负荷；滴定保持 sbp > 100 mmhg  \n   morphine   减交感张力 → 血管扩张 → 减前负荷  \n   cpap / bipap   无创通气减肺泡水肿 + 静脉回流  \n \n \n 关键点： oral  frusemide 起效慢，急性期无效，故  not indicated 。 "}, {"id": "AMC-Q0222", "type": "mcq", "qid": 222, "title": "一度房室传导阻滞 — 无症状的处理（Reassurance）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "physical-exam"], "topic": ["First-Degree AV Block", "ECG Interpretation", "Reassurance"], "difficulty": 2, "correctAnswer": "C", "page": 12, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "ecg", "arrhythmia", "av-block", "approach-diagnosis", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0222-First-Degree-AVB-Reassure.md", "stem": "<p>A 76-year-old man comes to your clinic for a routine health check-up. He has blood pressure of 110/90 mmHg and a pulse rate of 92 bpm. He is on no medications except daily multivitamins. As a part of evaluation, an ECG is obtained which is shown in the following photograph. Which one the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Aspirin"}, {"letter": "B", "text": "Warfarin"}, {"letter": "C", "text": "Reassurance"}, {"letter": "D", "text": "Metoprolol"}, {"letter": "E", "text": "Atropine"}], "rationale": "<p>1. <strong>题型识别</strong>：ECG 判读 + 处理。关键句是\"routine health check-up\"和\"no medications except daily multivitamins\" → 无症状背景。 2. <strong>ECG 特征（一度 AVB）</strong>：</p>\n<ul>\n<li>PR 间期 > 200 ms (0.2 s)</li>\n<li>每个 P 波后都有 QRS</li>\n<li>QRS 时限正常</li>\n<p>3. <strong>病因</strong>：</p>\n<li>老年 AV 结纤维化 / 退行性变（<strong>最常见</strong>）</li>\n<li>药物：地高辛、β-阻滞剂、钙通道阻滞剂</li>\n<li>迷走张力增高</li>\n<p>4. <strong>处理路径</strong>：</p>\n<li>无症状 → <strong>Reassurance</strong></li>\n<li>有症状（头晕、气短、胸痛）→ 阿托品 → 必要时起搏器</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A、B：抗血小板 / 抗凝与本病无关</li>\n<li>D：β-阻滞剂会<strong>加重</strong>AVB</li>\n<li>E：阿托品用于症状性心动过缓 / 高阶阻滞</li>\n<p>6. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"治疗 = 干预\"陷阱</strong>：一度 AVB 大多良性，无症状 = 不治疗。<strong>没症状 = 不动手</strong>。</li>\n<li><strong>\"用阿托品保驾\"陷阱</strong>：阿托品用在有症状的心动过缓、窦缓、高阶阻滞；无症状不用。</li>\n<li><strong>老年 = 病理性 = 干预</strong>：错误。<strong>老年 AV 结纤维化是最常见原因，但本身不需治疗</strong>。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The ECG shows a sinus rhythm with <strong>increased PR interval</strong> characteristic of <strong>first-degree atrioventricular block</strong>. Common causes:</p>\n<ul>\n<li><strong>Age-related fibrosis and degeneration of AV node</strong> — most common</li>\n<li>Drugs: digoxin, beta blockers, calcium channel blockers</li>\n<li>Increased vagal tone</li>\n</ul>\n<p><strong>ECG criteria for 1st-degree AVB</strong>:</p>\n<ul>\n<li>PR interval > 200 ms (0.2 s)</li>\n<li>Normal QRS complexes (duration and spacing)</li>\n<li>P wave before every QRS</li>\n</ul>\n<p>This is common in the elderly due to age-related fibrotic changes of the cardiac conductive system. <strong>Asymptomatic patients do not need treatment and must be reassured</strong>. With symptoms (dizziness, shortness of breath, chest pain) → atropine or pacemaker (if unresponsive to atropine).</p>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：UpToDate / ACC-AHA 传导阻滞章节）</li>\n</ul>", "related": ["AMC-Q0223-Unstable-VT-Cardioversion", "AMC-Q0228-Mobitz-II-IV-Pacemaker", "TR-Second-Degree-AV-Block", "MOC-Cardiology", "Topic-AV-Block-Spectrum"], "bodyHtml": "", "diseases": ["AV Block (1°)"], "complaints": [], "search": "一度房室传导阻滞 — 无症状的处理（reassurance）\nfirst-degree av block ecg interpretation reassurance\ndiagnosis physical-exam\n a 76-year-old man comes to your clinic for a routine health check-up. he has blood pressure of 110/90 mmhg and a pulse rate of 92 bpm. he is on no medications except daily multivitamins. as a part of evaluation, an ecg is obtained which is shown in the following photograph. which one the following is the next best step in management? \n correct answer is  c  \n the ecg shows a sinus rhythm with  increased pr interval  characteristic of  first-degree atrioventricular block . common causes: \n \n  age-related fibrosis and degeneration of av node  — most common \n drugs: digoxin, beta blockers, calcium channel blockers \n increased vagal tone \n \n  ecg criteria for 1st-degree avb : \n \n pr interval > 200 ms (0.2 s) \n normal qrs complexes (duration and spacing) \n p wave before every qrs \n \n this is common in the elderly due to age-related fibrotic changes of the cardiac conductive system.  asymptomatic patients do not need treatment and must be reassured . with symptoms (dizziness, shortness of breath, chest pain) → atropine or pacemaker (if unresponsive to atropine). "}, {"id": "AMC-Q0223", "type": "mcq", "qid": 223, "title": "不稳定室速（VT）— 同步电复律", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "complications"], "topic": ["Ventricular Tachycardia", "Unstable", "Synchronized Cardioversion", "ACLS"], "difficulty": 3, "correctAnswer": "B", "page": 13, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "vt", "arrhythmia", "emergency", "cardioversion", "approach-treatment", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0223-Unstable-VT-Cardioversion.md", "stem": "<p>A 79-year-old man collapses on the floor while waiting in the Emergency Department and becomes unresponsive. He has a blood pressure of 84/47 mmHg and rapid and barely perceptible pulse. Cardiopulmonary resuscitation is started immediately. The rhythm, obtained by defibrillator is shown in the accompanying photograph. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Continue CPR until the patient regains consciousness"}, {"letter": "B", "text": "Cardioversion"}, {"letter": "C", "text": "Amiodarone infusion"}, {"letter": "D", "text": "Intravenous adrenaline"}, {"letter": "E", "text": "Defibrillation"}], "rationale": "<p>1. <strong>题型识别</strong>：心跳骤停背景 + 拿到 rhythm → 区分 VT（有 / 无脉搏）→ 选对干预。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>79 岁老年</li>\n<li>倒地、无反应</li>\n<li>BP 84/47（低）、脉搏\"rapid and barely perceptible\" → <strong>有脉搏</strong>（虽然微弱）</li>\n<li>拿到 rhythm（VT）</li>\n<p>3. <strong>ACLS 路径</strong>：</p>\n<li>VT + <strong>有脉搏</strong> + 血流动力学不稳 → <strong>同步电复律</strong></li>\n<li>VT + <strong>无脉搏</strong>（即 pulseless VT）→ <strong>除颤</strong></li>\n<li>血流动力学稳定 VT → 抗心律失常药（胺碘酮等）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A：光 CPR 不处理心律 = 没用</li>\n<li>C：胺碘酮用于 <em>稳定</em> VT；本例血流动力学不稳</li>\n<li>D：肾上腺素用于 asystole 或 VF 两次电击失败后</li>\n<li>E：除颤用于 <em>无脉 VT / VF</em>；本例<strong>有脉搏</strong>（虽然 barely perceptible）→ 用同步电复律，不是除颤</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"barely perceptible pulse = no pulse\" 陷阱</strong>：barely perceptible ≠ absent。题目用\"barely perceptible\"暗示有脉搏，要选 cardioversion。</li>\n<li><strong>Cardioversion vs Defibrillation 时机</strong>：</li>\n<li>同步电复律（cardioversion）= R 波同步触发，<strong>有脉搏时用</strong></li>\n<li>除颤（defibrillation）= 非同步，<strong>无脉搏时用</strong>（VF / pulseless VT）</li>\n<li><strong>胺碘酮位置</strong>：血流动力学<strong>稳定</strong>的 VT / SVT 转复；不稳定 → 先电。</li>\n<li><strong>Adrenaline 时机</strong>：asystole、PEA、VF 2 次电击失败后；<strong>不是</strong> VT 一线。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The first step in management of a collapsed patient is <strong>calling for help</strong> and <strong>starting CPR</strong> (chest compression + ventilation). Once the defibrillator is available, obtain the cardiac rhythm via the paddles. The rhythm is characteristic of <strong>ventricular tachycardia (VT)</strong>. In patients with <strong>hemodynamic instability</strong>, the next best step is:</p>\n<ul>\n<li><strong>Synchronized cardioversion</strong> if the patient has a pulse</li>\n<li><strong>Defibrillation</strong> if no pulse is detected</li>\n</ul>\n<p><strong>Hemodynamic instability signs</strong>:</p>\n<ul>\n<li>Chest pain</li>\n<li>Dyspnea</li>\n<li>Hypotension</li>\n<li>Perfusion-related confusion</li>\n<li>Collapse / unresponsiveness</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Continue CPR): CPR alone won't convert VT.</li>\n<li><strong>C</strong> (Amiodarone): Anti-arrhythmic drugs used for <em>hemodynamically stable</em> VT.</li>\n<li><strong>D</strong> (Adrenaline): First-line in asystole, or in VF after 2 failed DC shocks.</li>\n<li><strong>E</strong> (Defibrillation): Used for <em>pulseless VT / VF</em>. This patient has a pulse (barely perceptible).</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ARC / ANZCOR ALS2 指南）</li>\n</ul>", "related": ["AMC-Q0222-First-Degree-AVB-Reassure", "AMC-Q0224-Thrombolytics-Contraindications", "AMC-Q0228-Mobitz-II-IV-Pacemaker", "MOC-Cardiology", "Topic-ACLS-Arrhythmias"], "bodyHtml": "", "diseases": ["VT"], "complaints": ["syncope/collapse"], "search": "不稳定室速（vt）— 同步电复律\nventricular tachycardia unstable synchronized cardioversion acls\ntreatment diagnosis complications\n a 79-year-old man collapses on the floor while waiting in the emergency department and becomes unresponsive. he has a blood pressure of 84/47 mmhg and rapid and barely perceptible pulse. cardiopulmonary resuscitation is started immediately. the rhythm, obtained by defibrillator is shown in the accompanying photograph. which one of the following is the next best step in management? \n correct answer is  b  \n the first step in management of a collapsed patient is  calling for help  and  starting cpr  (chest compression + ventilation). once the defibrillator is available, obtain the cardiac rhythm via the paddles. the rhythm is characteristic of  ventricular tachycardia (vt) . in patients with  hemodynamic instability , the next best step is: \n \n  synchronized cardioversion  if the patient has a pulse \n  defibrillation  if no pulse is detected \n \n  hemodynamic instability signs : \n \n chest pain \n dyspnea \n hypotension \n perfusion-related confusion \n collapse / unresponsiveness \n \n  why not the others : \n \n  a  (continue cpr): cpr alone won't convert vt. \n  c  (amiodarone): anti-arrhythmic drugs used for  hemodynamically stable  vt. \n  d  (adrenaline): first-line in asystole, or in vf after 2 failed dc shocks. \n  e  (defibrillation): used for  pulseless vt / vf . this patient has a pulse (barely perceptible). \n "}, {"id": "AMC-Q0224", "type": "mcq", "qid": 224, "title": "STEMI 溶栓禁忌 — 月经过多*不是*绝对禁忌", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "prevention", "complications"], "topic": ["STEMI", "Thrombolytics", "Absolute Contraindications", "Fibrinolysis"], "difficulty": 3, "correctAnswer": "C", "page": 14, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "stemi", "thrombolysis", "contraindications", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0224-Thrombolytics-Contraindications.md", "stem": "<p>Which one of the following is NOT a contraindication to thrombolytics use in a patient with ST elevation myocardial infarction?</p>", "options": [{"letter": "A", "text": "Ischemic stroke in the past 3 months"}, {"letter": "B", "text": "Hemorrhagic stroke in the past 10 years"}, {"letter": "C", "text": "Heavy menstrual bleeding"}, {"letter": "D", "text": "Coagulation disorders"}, {"letter": "E", "text": "Gastrointestinal bleeding within the past 4 weeks"}], "rationale": "<p>1. <strong>题型识别</strong>：否定题（\"NOT\"）→ 找<strong>最不可能禁忌</strong>的那一项。漏读 NOT → 全错。 2. <strong>绝对禁忌清单</strong>（必须背）：</p>\n<ul>\n<li>既往颅内出血 (ICH)</li>\n<li>已知脑血管结构异常</li>\n<li>已知颅内恶性肿瘤</li>\n<li>3 个月内缺血性卒中</li>\n<li>怀疑主动脉夹层</li>\n<li>活动性出血或出血倾向（<strong>menses 除外</strong>）</li>\n<li>3 个月内严重闭合性头 / 面部外伤</li>\n<li>2-3 个月内颅内 / 椎管手术</li>\n<li>严重未控制高血压</li>\n<li>链激酶既往 6 个月内用过</li>\n<p>3. <strong>逐项核对</strong>：</p>\n<li>A：3 个月内缺血性卒中 → <strong>绝对禁忌</strong> ✓</li>\n<li>B：10 年前脑出血 → <strong>绝对禁忌</strong> ✓</li>\n<li>C：月经过多 → <strong>不是绝对禁忌</strong>（指南明确排除）← 答案</li>\n<li>D：凝血障碍 → <strong>绝对禁忌</strong>（活动性出血或出血倾向）✓</li>\n<li>E：4 周内 GI 出血 → 介于绝对和相对之间（\"recent internal bleeding 2-4 weeks\" 列入相对禁忌）</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"NOT\"陷阱</strong>：题问\"哪个<em>不是</em>禁忌\" → 选最安全的那个。漏读 NOT = 选 A 或 B。</li>\n<li><strong>\"月经过多 = 出血\" 表面逻辑陷阱</strong>：直觉上\"月经过多\"像出血，但指南明确说\"active bleeding excluding menses\"。AMC 反复考这个例外。</li>\n<li><strong>GI 出血\"4 周内\"边界</strong>：相对禁忌（2-4 weeks），但题目里列了 → 不能选 E。</li>\n<li><strong>Hemorrhagic stroke 时间窗</strong>：任意时间都是绝对禁忌（不像 ischemic 限制 3 个月）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Absolute contraindications for fibrinolytic use in STEMI</strong>:</p>\n<ul>\n<li>Prior intracranial hemorrhage (ICH)</li>\n<li>Known structural cerebral vascular lesion</li>\n<li>Known malignant intracranial neoplasm</li>\n<li>Ischemic stroke within 3 months</li>\n<li>Suspected aortic dissection</li>\n<li><strong>Active bleeding or bleeding diathesis (excluding menses)</strong> ← 关键例外</li>\n<li>Significant closed head or facial trauma within 3 months</li>\n<li>Intracranial or intraspinal surgery within 2-3 months</li>\n<li>Severe uncontrolled hypertension (unresponsive to emergency therapy)</li>\n<li>For streptokinase: prior treatment within previous 6 months</li>\n</ul>\n<p><strong>Relative contraindications</strong>:</p>\n<ul>\n<li>Chronic, severe, poorly controlled hypertension</li>\n<li>Significant hypertension on presentation (SBP > 180 or DBP > 110 mmHg)</li>\n<li>Traumatic or prolonged (>10 min) CPR or major surgery < 3 weeks</li>\n<li>History of prior ischemic stroke <em>not</em> within last 3 months</li>\n<li>Dementia</li>\n<li>Recent (2-4 weeks) internal bleeding</li>\n<li>Noncompressible vascular punctures</li>\n<li>Pregnancy</li>\n<li>Active peptic ulcer</li>\n<li>Current anticoagulant use with INR > 1.7 or PT > 15 s</li>\n</ul>\n<p>Of the given options, only <strong>heavy menstrual bleeding is not an absolute contraindication</strong> to thrombolytic therapy.</p>", "references": "<ul>\n<li>Medscape — Thrombolytic Therapy for Acute Myocardial Infarction</li>\n<li>Queensland Government — Thrombolysis for STEMI Clinical Pathway</li>\n<li>（待补：ANZCOR / Cardiac Society of ANZ STEMI 指南）</li>\n</ul>", "related": ["AMC-Q0225-Inferior-STEMI-Reperfusion", "AMC-Q0223-Unstable-VT-Cardioversion", "MOC-Cardiology", "Topic-STEMI-Reperfusion"], "bodyHtml": "", "diseases": ["STEMI"], "complaints": [], "search": "stemi 溶栓禁忌 — 月经过多*不是*绝对禁忌\nstemi thrombolytics absolute contraindications fibrinolysis\ntreatment prevention complications\n which one of the following is not a contraindication to thrombolytics use in a patient with st elevation myocardial infarction? \n correct answer is  c  \n  absolute contraindications for fibrinolytic use in stemi : \n \n prior intracranial hemorrhage (ich) \n known structural cerebral vascular lesion \n known malignant intracranial neoplasm \n ischemic stroke within 3 months \n suspected aortic dissection \n  active bleeding or bleeding diathesis (excluding menses)  ← 关键例外 \n significant closed head or facial trauma within 3 months \n intracranial or intraspinal surgery within 2-3 months \n severe uncontrolled hypertension (unresponsive to emergency therapy) \n for streptokinase: prior treatment within previous 6 months \n \n  relative contraindications : \n \n chronic, severe, poorly controlled hypertension \n significant hypertension on presentation (sbp > 180 or dbp > 110 mmhg) \n traumatic or prolonged (>10 min) cpr or major surgery  \n history of prior ischemic stroke  not  within last 3 months \n dementia \n recent (2-4 weeks) internal bleeding \n noncompressible vascular punctures \n pregnancy \n active peptic ulcer \n current anticoagulant use with inr > 1.7 or pt > 15 s \n \n of the given options, only  heavy menstrual bleeding is not an absolute contraindication  to thrombolytic therapy. "}, {"id": "AMC-Q0225", "type": "mcq", "qid": 225, "title": "下壁 STEMI — 立即再灌注（不等肌钙蛋白）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "complications"], "topic": ["Inferior STEMI", "Reperfusion", "PCI", "Thrombolysis", "ECG"], "difficulty": 3, "correctAnswer": "B", "page": 16, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "stemi", "inferior", "pci", "approach-treatment", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0225-Inferior-STEMI-Reperfusion.md", "stem": "<p>A 50-year-old man presents to the Emergency Department with chest pain felt behind the sternum radiating to his jaw. A 12-lead ECG strip is obtained and is as the following photograph. You give him aspirin and sublingual nitroglycerine and start him on supplemental oxygen by nasal cannula. A troponin level is ordered which comes back negative. Which one of the following is the next best step in management of this patient?</p>", "options": [{"letter": "A", "text": "Repeat troponin in 8 hours"}, {"letter": "B", "text": "Immediate reperfusion therapy"}, {"letter": "C", "text": "Repeat the ECG in 6 hours"}, {"letter": "D", "text": "Start him on beta blockers"}, {"letter": "E", "text": "Serial ECGs"}], "rationale": "<p>1. <strong>题型识别</strong>：STEMI 急救。题眼是 ECG 的 ST 抬高（II, III, aVF = 下壁导联）。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>胸骨后疼痛 → 颌部放射（典型缺血）</li>\n<li>ECG：II, III, aVF ST 抬高 → <strong>下壁 STEMI</strong></li>\n<li>已给 aspirin / SL nitro / O2（标准初始处理）</li>\n<li>Troponin 阴性</li>\n<p>3. <strong>关键决策点</strong>：</p>\n<li>ST 抬高 ≥ 1 mm，两个连续导联 + 胸痛 → STEMI 诊断确立</li>\n<li><strong>不需要等肌钙蛋白</strong>（肌钙蛋白在 STEMI 早期可能阴性）</li>\n<p>4. <strong>再灌注路径</strong>：</p>\n<li><strong>PCI 优先</strong>（90 min 内 door-to-balloon）</li>\n<li>不能 PCI / 延迟 → 溶栓（无禁忌时）</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A：等 8 h 肌钙蛋白 → 错过再灌注时间窗，致死亡</li>\n<li>C：等 6 h 复查 ECG → 同上</li>\n<li>D：β-阻滞剂有用但<strong>不是第一步</strong>（再灌注优先）</li>\n<li>E：series ECG 有用但<strong>不是第一步</strong></li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Troponin 阴性 = 不是 MI\"陷阱</strong>：STEMI 早期（< 3-6 h）肌钙蛋白可阴性。<strong>ST 抬高 + 临床 = 诊断</strong>。肌钙蛋白只用于 NSTEMI 诊断。</li>\n<li><strong>\"等结果再处理\"陷阱</strong>：心电图已确诊 → 不等任何检查。</li>\n<li><strong>β-阻滞剂陷阱</strong>：β-阻滞剂降低死亡率，但<strong>没有</strong>再灌注重要。PCI / 溶栓永远在 β-阻滞剂之前。</li>\n<li><strong>\"sublingual NTG 已用 + O2 已用\"陷阱</strong>：这些是 <em>辅助</em> 措施，<strong>不替代</strong>再灌注。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>With <strong>ST elevation in leads II, III, and aVF</strong> on ECG, this patient has sustained an <strong>inferior ST-elevation myocardial infarction (STEMI)</strong>. The next best step is either:</p>\n<ul>\n<li><strong>Immediate PCI</strong> (preferred)</li>\n<li><strong>Thrombolytic therapy</strong> if not contraindicated and PCI unavailable</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Repeat troponin in 8 h): Even with negative troponin, ST elevation of > 1 mm in two contiguous leads + chest pain makes the diagnosis certain. With chest pain and ECG changes, no troponin is needed to guide management — <strong>reperfusion should have been performed even without waiting for the result</strong>.</li>\n<li><strong>C</strong> (Repeat ECG in 6 h): Patient has acute inferior MI; waiting 6 h is definitely wrong.</li>\n<li><strong>D, E</strong> (Beta blockers, serial ECGs): Both are useful but neither takes precedence over PCI.</li>\n</ul>", "references": "<ul>\n<li>Australian Prescriber — Management of acute coronary syndromes</li>\n<li>Medscape — Acute coronary syndrome</li>\n<li>（待补：ANZCOR / CSANZ STEMI 指南）</li>\n</ul>", "related": ["AMC-Q0025-PCI-Antiplatelet-Duration", "AMC-Q0224-Thrombolytics-Contraindications", "AMC-QNA-P015-Stable-Angina-Stress-Test", "MOC-Cardiology", "Topic-STEMI-Reperfusion"], "bodyHtml": "", "diseases": ["STEMI"], "complaints": ["chest pain"], "search": "下壁 stemi — 立即再灌注（不等肌钙蛋白）\ninferior stemi reperfusion pci thrombolysis ecg\ntreatment diagnosis complications\n a 50-year-old man presents to the emergency department with chest pain felt behind the sternum radiating to his jaw. a 12-lead ecg strip is obtained and is as the following photograph. you give him aspirin and sublingual nitroglycerine and start him on supplemental oxygen by nasal cannula. a troponin level is ordered which comes back negative. which one of the following is the next best step in management of this patient? \n correct answer is  b  \n with  st elevation in leads ii, iii, and avf  on ecg, this patient has sustained an  inferior st-elevation myocardial infarction (stemi) . the next best step is either: \n \n  immediate pci  (preferred) \n  thrombolytic therapy  if not contraindicated and pci unavailable \n \n  why not the others : \n \n  a  (repeat troponin in 8 h): even with negative troponin, st elevation of > 1 mm in two contiguous leads + chest pain makes the diagnosis certain. with chest pain and ecg changes, no troponin is needed to guide management —  reperfusion should have been performed even without waiting for the result . \n  c  (repeat ecg in 6 h): patient has acute inferior mi; waiting 6 h is definitely wrong. \n  d, e  (beta blockers, serial ecgs): both are useful but neither takes precedence over pci. \n "}, {"id": "AMC-Q0226", "type": "mcq", "qid": 226, "title": "缩窄性心包炎（TB）— Kussmaul 征", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "differential", "physical-exam"], "topic": ["Constrictive Pericarditis", "Kussmaul Sign", "Tuberculosis", "Right Heart Failure"], "difficulty": 4, "correctAnswer": "D", "page": 17, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pericarditis", "tb", "kussmaul", "jvp", "approach-diagnosis", "approach-differential", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0226-Constrictive-Pericarditis-TB.md", "stem": "<p>A 60-year-old man presents with complaints of increasing tiredness and abdominal distention for the past four months. His past medical history is remarkable for smoking 20 cigarettes a day for the past 20 years. On examination, there is bilateral ankle edema and ascites. The liver is palpated 3 cm below the costal margin. His jugular pulse is noted to drop on expiration and rise on inspiration. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Cardiac tamponade"}, {"letter": "B", "text": "Budd-Chiari syndrome"}, {"letter": "C", "text": "Superior vena cava obstruction"}, {"letter": "D", "text": "Constrictive pericarditis due to TB in the past"}, {"letter": "E", "text": "Hepatic cirrhosis"}], "rationale": "<p>1. <strong>题型识别</strong>：体征描述 + 鉴别诊断 → 找唯一能解释 <strong>Kussmaul 征</strong> + <strong>右心衰体征</strong>的选项。 2. <strong>Kussmaul 征定义</strong>：</p>\n<ul>\n<li><strong>正常生理</strong>：JVP 吸气时降、呼气时升（胸腔内压变化）</li>\n<li><strong>Kussmaul 征（病理）</strong>：<strong>反向</strong>——JVP 吸气时升、呼气时降</li>\n<li>见于：限制型心肌病、缩窄性心包炎、心包填塞</li>\n<p>3. <strong>临床线索整合</strong>：</p>\n<li>老年男性、4 月疲劳 + 腹胀</li>\n<li>双踝水肿 + ascites + 肝大 3 cm → <strong>右心衰</strong> 体征</li>\n<li>吸烟 20/d × 20y → 干扰项</li>\n<li>Kussmaul 征 → 三选一：限制型心肌病、缩窄性心包炎、心包填塞</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (tamponade)：急性表现（低血压、奇脉），本例 4 月慢性病程</li>\n<li>B (Budd-Chiari)：肝静脉血栓 → 门脉高压（但 JVP 正常，<strong>无</strong> Kussmaul）</li>\n<li>C (SVC 阻塞)：面部水肿、<strong>无</strong> 踝肿、JVP 升高但<strong>无搏动</strong></li>\n<li>E (肝硬化)：肝通常<strong>缩小</strong>（非肿大），有腹水 / 踝肿但<strong>无</strong> Kussmaul</li>\n<p>5. <strong>锁定 D</strong>（结合 TB 病史 → 心包缩窄最常见原因之一）。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"肝大\"陷阱</strong>：肝硬化 → 肝<strong>缩小</strong>（本例肝大 3 cm 反向）。肝大 + ascites + 踝肿 → 右心衰（心源性肝淤血）。</li>\n<li><strong>SVC 阻塞 = JVP 高陷阱</strong>：SVC 阻塞 JVP 升高但<strong>无搏动</strong>；本例 JVP 有搏动（\"drop\" / \"rise\"）。</li>\n<li><strong>Budd-Chiari 陷阱</strong>：可致 portal HTN，但 JVP <strong>正常</strong>。Kussmaul 征是心包 / 心肌病特征。</li>\n<li><strong>\"急性 vs 慢性\" 鉴别</strong>：tamponade 急性（数小时-数天）；constrictive 慢性（数月-数年）→ 4 月病程符合 constrictive。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Drop of jugular pulse on inspiration and its rising during expiration is the normal physiologic response</strong>. <strong>Reversal</strong> — JVP drops on <strong>expiration</strong> and rises on <strong>inspiration</strong> — is the pathological sign called <strong>Kussmaul sign</strong>.</p>\n<p><strong>Kussmaul sign is seen in</strong>:</p>\n<ul>\n<li>Restrictive cardiomyopathy</li>\n<li>Constrictive pericarditis</li>\n<li>Cardiac tamponade</li>\n</ul>\n<p>Of the given options, only <strong>constrictive pericarditis due to TB infection</strong> can present with Kussmaul sign.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>C</strong> (SVC obstruction): Leads to facial edema (not ankle edema). JVP is raised but <strong>non-pulsatile</strong>.</li>\n<li><strong>B</strong> (Budd-Chiari): Thrombus in hepatic vein → portal HTN. May present with fatigue, RUQ pain, mild jaundice, hepatosplenomegaly, but <strong>JVP remains normal</strong> (no pulsation).</li>\n<li><strong>E</strong> (Hepatic cirrhosis): Liver is usually <strong>shrinked</strong> (not enlarged). Fatigue, edema, ascites are common, but <strong>Kussmaul sign is not a feature</strong>.</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/157096-clini</li>\n<li>（待补：Mayo / Braunwald 心包疾病章节）</li>\n</ul>", "related": ["AMC-Q0227-Pericarditis-vs-PE", "AMC-Q0028-Pulmonary-Edema-Presentation", "MOC-Cardiology", "Topic-Pericardial-Diseases"], "bodyHtml": "", "diseases": ["Heart Failure", "Pericarditis"], "complaints": ["fatigue", "abdominal pain", "edema"], "search": "缩窄性心包炎（tb）— kussmaul 征\nconstrictive pericarditis kussmaul sign tuberculosis right heart failure\ndiagnosis differential physical-exam\n a 60-year-old man presents with complaints of increasing tiredness and abdominal distention for the past four months. hi
