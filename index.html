strong>缩小</strong>（本例肝大 3 cm 反向）。肝大 + ascites + 踝肿 → 右心衰（心源性肝淤血）。</li>\n<li><strong>SVC 阻塞 = JVP 高陷阱</strong>：SVC 阻塞 JVP 升高但<strong>无搏动</strong>；本例 JVP 有搏动（\"drop\" / \"rise\"）。</li>\n<li><strong>Budd-Chiari 陷阱</strong>：可致 portal HTN，但 JVP <strong>正常</strong>。Kussmaul 征是心包 / 心肌病特征。</li>\n<li><strong>\"急性 vs 慢性\" 鉴别</strong>：tamponade 急性（数小时-数天）；constrictive 慢性（数月-数年）→ 4 月病程符合 constrictive。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Drop of jugular pulse on inspiration and its rising during expiration is the normal physiologic response</strong>. <strong>Reversal</strong> — JVP drops on <strong>expiration</strong> and rises on <strong>inspiration</strong> — is the pathological sign called <strong>Kussmaul sign</strong>.</p>\n<p><strong>Kussmaul sign is seen in</strong>:</p>\n<ul>\n<li>Restrictive cardiomyopathy</li>\n<li>Constrictive pericarditis</li>\n<li>Cardiac tamponade</li>\n</ul>\n<p>Of the given options, only <strong>constrictive pericarditis due to TB infection</strong> can present with Kussmaul sign.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>C</strong> (SVC obstruction): Leads to facial edema (not ankle edema). JVP is raised but <strong>non-pulsatile</strong>.</li>\n<li><strong>B</strong> (Budd-Chiari): Thrombus in hepatic vein → portal HTN. May present with fatigue, RUQ pain, mild jaundice, hepatosplenomegaly, but <strong>JVP remains normal</strong> (no pulsation).</li>\n<li><strong>E</strong> (Hepatic cirrhosis): Liver is usually <strong>shrinked</strong> (not enlarged). Fatigue, edema, ascites are common, but <strong>Kussmaul sign is not a feature</strong>.</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/157096-clini</li>\n<li>（待补：Mayo / Braunwald 心包疾病章节）</li>\n</ul>", "related": ["AMC-Q0227-Pericarditis-vs-PE", "AMC-Q0028-Pulmonary-Edema-Presentation", "MOC-Cardiology", "Topic-Pericardial-Diseases"], "bodyHtml": "", "diseases": ["Heart Failure", "Pericarditis"], "complaints": ["fatigue", "abdominal pain", "edema"], "search": "缩窄性心包炎（tb）— kussmaul 征\nconstrictive pericarditis kussmaul sign tuberculosis right heart failure\ndiagnosis differential physical-exam\n a 60-year-old man presents with complaints of increasing tiredness and abdominal distention for the past four months. his past medical history is remarkable for smoking 20 cigarettes a day for the past 20 years. on examination, there is bilateral ankle edema and ascites. the liver is palpated 3 cm below the costal margin. his jugular pulse is noted to drop on expiration and rise on inspiration. which one of the following is the most likely diagnosis? \n correct answer is  d  \n  drop of jugular pulse on inspiration and its rising during expiration is the normal physiologic response .  reversal  — jvp drops on  expiration  and rises on  inspiration  — is the pathological sign called  kussmaul sign . \n  kussmaul sign is seen in : \n \n restrictive cardiomyopathy \n constrictive pericarditis \n cardiac tamponade \n \n of the given options, only  constrictive pericarditis due to tb infection  can present with kussmaul sign. \n  why not the others : \n \n  c  (svc obstruction): leads to facial edema (not ankle edema). jvp is raised but  non-pulsatile . \n  b  (budd-chiari): thrombus in hepatic vein → portal htn. may present with fatigue, ruq pain, mild jaundice, hepatosplenomegaly, but  jvp remains normal  (no pulsation). \n  e  (hepatic cirrhosis): liver is usually  shrinked  (not enlarged). fatigue, edema, ascites are common, but  kussmaul sign is not a feature . \n "}, {"id": "AMC-Q0227", "type": "mcq", "qid": 227, "title": "急性心包炎 vs 肺栓塞 — 胸痛鉴别", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["differential", "diagnosis", "physical-exam"], "topic": ["Acute Pericarditis", "Pulmonary Embolism", "Pleuritic Chest Pain", "ECG", "Differential"], "difficulty": 3, "correctAnswer": "E", "page": 18, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pericarditis", "pe", "chest-pain", "ecg", "approach-differential", "approach-diagnosis", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0227-Pericarditis-vs-PE.md", "stem": "<p>A 30-year-old man presents to the emergency department with chest pain that has started this morning and worsened over time. He mentions that deep breathing increases the pain intensity. On examination, pleuritic chest pain and a temperature of 38°C is noted. The BP is 140/85 mmHg and the pulse 100 bpm. He takes shallow breaths in a rate of 20/min. The rest of physical examination is inconclusive. A 12-lead ECG is obtained and is shown. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Myocardial ischemia"}, {"letter": "B", "text": "Pulmonary embolism"}, {"letter": "C", "text": "Infectious endocarditis"}, {"letter": "D", "text": "Acute myocardial infarction"}, {"letter": "E", "text": "Pericarditis"}], "rationale": "<p>1. <strong>题型识别</strong>：年轻男性 + pleuritic 胸痛 + 发热 + ECG → 在 PE vs pericarditis 之间鉴别（两者都有 pleuritic pain + ECG 异常）。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>30 岁（年轻）</li>\n<li>晨起始、加重的胸痛</li>\n<li><strong>深呼吸加重</strong>（pleuritic）</li>\n<li><strong>T 38°C</strong>（发热）</li>\n<li>RR 20/min 偏快（pleuritic → 浅快呼吸代偿）</li>\n<li>ECG：<strong>弥漫性 ST 抬高</strong>（胸前 + 肢体导联都抬高）= pericarditis 标志</li>\n<p>3. <strong>pericarditis ECG 标志</strong>：</p>\n<li><strong>弥漫性</strong> ST 抬高（不局限某冠脉供区）</li>\n<li>PR 段压低</li>\n<li>Spodick 征（下行 TP 段压低）</li>\n<p>4. <strong>PE ECG 标志</strong>（不同）：</p>\n<li>窦速（最常见）</li>\n<li>S1Q3T3</li>\n<li>胸前导联 T 倒置</li>\n<li>右束支阻滞</li>\n<li><strong>不会</strong>有弥漫性 ST 抬高</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (心肌缺血)：年轻人 + pleuritic + 发热，不符合</li>\n<li>B (PE)：临床可似，但 ECG 不符</li>\n<li>C (IE)：应有心脏杂音 + 发热，本例 PE 不符</li>\n<li>D (AMI)：ST 抬高只在该冠脉导联组（如 II/III/aVF 下壁），<strong>不弥漫</strong></li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"PE vs 心包炎\"陷阱</strong>：两者都可有 pleuritic 痛、年轻患者、ECG 改变。鉴别靠 <strong>ECG 形态</strong>：</li>\n<li>PE：S1Q3T3、T 倒置、右束支</li>\n<li>Pericarditis：<strong>弥漫</strong>ST 抬高</li>\n<li><strong>\"AMI 也可以 ST 抬高\"陷阱</strong>：AMI ST 抬高局限特定冠脉分布（下壁 / 前壁 / 侧壁），<strong>不弥漫</strong>。</li>\n<li><strong>\"发热 = 感染\"陷阱</strong>：心包炎也常伴低热（炎症性），不一定是感染性心内膜炎。</li>\n<li><strong>\"年轻人 = PE\"陷阱</strong>：PE 在年轻健康人罕见，多见术后 / 制动 / 肿瘤 / 妊娠 / 避孕药。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>The clinical picture of <strong>pleuritic chest pain</strong> (worsened with breathing), mildly elevated respiratory rate, and borderline pulse rate can be either <strong>pericarditis or pulmonary embolism</strong>, but <strong>diffuse ST elevation in precordial and limb leads</strong> favors <strong>pericarditis</strong> as the most likely diagnosis.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Myocardial ischemia): Nature of pain and ST segment elevation pattern makes this less likely.</li>\n<li><strong>B</strong> (PE): Can present similarly, but <strong>ECG changes are not consistent</strong> (no diffuse ST elevation).</li>\n<li><strong>C</strong> (Infectious endocarditis): Presents with <strong>murmur and fever</strong>. ST changes here are characteristic of pericarditis; IE does not cause such ECG abnormality.</li>\n<li><strong>D</strong> (Acute MI): Causes ST elevation in <strong>specific lead groups</strong> (depending on coronary artery territory). The <strong>pleuritic nature</strong> of the chest pain is against MI.</li>\n</ul>", "references": "<ul>\n<li>http://www.racgp.org.au/download/documents/AFP/201</li>\n<li>http://www.australiandoctor.com.au/cmspages/getfil</li>\n<li>（待补：ESC 2015 心包疾病指南）</li>\n</ul>", "related": ["AMC-Q0226-Constrictive-Pericarditis-TB", "AMC-Q0028-Pulmonary-Edema-Presentation", "AMC-Q0223-Unstable-VT-Cardioversion", "MOC-Cardiology", "Topic-Pericardial-Diseases"], "bodyHtml": "", "diseases": ["PE", "Pericarditis"], "complaints": ["chest pain"], "search": "急性心包炎 vs 肺栓塞 — 胸痛鉴别\nacute pericarditis pulmonary embolism pleuritic chest pain ecg differential\ndifferential diagnosis physical-exam\n a 30-year-old man presents to the emergency department with chest pain that has started this morning and worsened over time. he mentions that deep breathing increases the pain intensity. on examination, pleuritic chest pain and a temperature of 38°c is noted. the bp is 140/85 mmhg and the pulse 100 bpm. he takes shallow breaths in a rate of 20/min. the rest of physical examination is inconclusive. a 12-lead ecg is obtained and is shown. which one of the following is the most likely diagnosis? \n correct answer is  e  \n the clinical picture of  pleuritic chest pain  (worsened with breathing), mildly elevated respiratory rate, and borderline pulse rate can be either  pericarditis or pulmonary embolism , but  diffuse st elevation in precordial and limb leads  favors  pericarditis  as the most likely diagnosis. \n  why not the others : \n \n  a  (myocardial ischemia): nature of pain and st segment elevation pattern makes this less likely. \n  b  (pe): can present similarly, but  ecg changes are not consistent  (no diffuse st elevation). \n  c  (infectious endocarditis): presents with  murmur and fever . st changes here are characteristic of pericarditis; ie does not cause such ecg abnormality. \n  d  (acute mi): causes st elevation in  specific lead groups  (depending on coronary artery territory). the  pleuritic nature  of the chest pain is against mi. \n "}, {"id": "AMC-Q0228", "type": "mcq", "qid": 228, "title": "Mobitz II 二度 AVB — 临时起搏器（阿托品失败后）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "physical-exam"], "topic": ["Mobitz II AV Block", "Second-Degree AV Block", "Temporary Pacemaker", "Bradycardia"], "difficulty": 3, "correctAnswer": "C", "page": 19, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "av-block", "mobitz", "bradycardia", "pacemaker", "approach-treatment", "approach-diagnosis", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0228-Mobitz-II-IV-Pacemaker.md", "stem": "<p>A 70-year-old man is brought to the Emergency Department because of light-headedness for the past 4 hours. On examination, he is found to have bradycardia with an irregular pulse of 45 bpm and a blood pressure of 85/60 mmHg. Atropine is used as the treatment of symptomatic bradycardia but the pulse rate remains the same and the lightheadedness persists. An ECG strip is obtained which is shown in the following photograph. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Metoprolol"}, {"letter": "B", "text": "Dopamine"}, {"letter": "C", "text": "Intravenous pacemaker"}, {"letter": "D", "text": "Permanent pacemaker"}, {"letter": "E", "text": "Adrenaline"}], "rationale": "<p>1. <strong>题型识别</strong>：症状性心动过缓 + 阿托品失败 + ECG 提示 Mobitz II → 临时起搏。 2. <strong>ECG 关键特征（Mobitz II）</strong>：</p>\n<ul>\n<li><strong>PR 间期恒定</strong>（不像 Mobitz I 逐渐延长）</li>\n<li>突然一个 P 波后<strong>无 QRS</strong>（脱落）</li>\n<li>脱落后的 PR = 脱落前的 PR</li>\n<li>间歇 = 2× 窦性周期长度</li>\n<p>3. <strong>临床线索</strong>：</p>\n<li>老年男性</li>\n<li>4 h 头昏（症状性）</li>\n<li>心动过缓 45 bpm、不规则</li>\n<li>BP 85/60（低）</li>\n<li><strong>阿托品无效</strong>（关键）</li>\n<p>4. <strong>处理路径</strong>：</p>\n<li>症状性 AVB → 初始临时起搏（percutaneous / IV 起搏器，ED 常备）</li>\n<li>无起搏器 → 阿托品（已用，无效）</li>\n<li><strong>Mobitz II = 临时起搏指征</strong></li>\n<p>5. <strong>临时起搏指征</strong>：</p>\n<li>Asystole 病史</li>\n<li><strong>Mobitz II AVB</strong></li>\n<li>完全性 AVB</li>\n<li>心室停搏 > 3 s</li>\n<p>6. <strong>选项排除</strong>：</p>\n<li>A：Metoprolol 加重阻滞 = 致命错</li>\n<li>B：多巴胺用于增强心肌收缩 / 升压，不治心动过缓</li>\n<li>D：永久起搏是<strong>之后</strong>的明确治疗，不在急性期</li>\n<li>E：肾上腺素可在等起搏器时维持心率，但<strong>首选起搏器</strong></li>\n<p>7. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"阿托品 = 万能\"陷阱</strong>：阿托品对 Mobitz II <strong>常常无效</strong>（因为阻滞部位在 His-Purkinje 系统，不是 AV 结）。题里\"remains the same\"是提示。</li>\n<li><strong>\"永久起搏器直接上\"陷阱</strong>：急性期先用临时，稳定后再考虑永久。</li>\n<li><strong>Metoprolol 致命陷阱</strong>：β-阻滞剂会让 AVB 更严重。</li>\n<li><strong>\"心率慢 = 多巴胺\"陷阱</strong>：多巴胺升压但<strong>不直接</strong>治 AVB。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The rather <strong>constant PR intervals</strong>, and <strong>P waves not followed by a QRS complex</strong> seen on ECG is characteristic of <strong>Mobitz II AV block</strong>.</p>\n<p><strong>Symptomatic AV block</strong> should be initially treated with <strong>temporary pacing</strong>. Percutaneous or intravenous pacemakers are often available in the ED and can be applied. If not, atropine is used instead.</p>\n<p><strong>Indications for temporary pacing</strong>:</p>\n<ul>\n<li>History of asystole</li>\n<li><strong>Mobitz II AV block</strong></li>\n<li>Complete heart block</li>\n<li>Ventricular standstill > 3 seconds</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Metoprolol): Can dramatically worsen the condition.</li>\n<li><strong>B</strong> (Dopamine): Increases cardiac contractility and vascular tone; <strong>not used for symptomatic bradycardia</strong>.</li>\n<li><strong>D</strong> (Permanent pacemaker): Definitive treatment, considered <strong>after</strong> initial temporary pacing.</li>\n<li><strong>E</strong> (Adrenaline infusion): Sometimes indicated to maintain heart rate <strong>after atropine, while waiting for pacemaker insertion</strong>.</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>Medscape — Second-Degree Atrioventricular Block</li>\n<li>（待补：ACC/AHA/HRS 2008 缓慢性心律失常指南）</li>\n</ul>", "related": ["AMC-Q0222-First-Degree-AVB-Reassure", "AMC-Q0223-Unstable-VT-Cardioversion", "TR-Second-Degree-AV-Block", "MOC-Cardiology", "Topic-AV-Block-Spectrum"], "bodyHtml": "", "diseases": ["AV Block (2°)"], "complaints": ["dizziness"], "search": "mobitz ii 二度 avb — 临时起搏器（阿托品失败后）\nmobitz ii av block second-degree av block temporary pacemaker bradycardia\ntreatment diagnosis physical-exam\n a 70-year-old man is brought to the emergency department because of light-headedness for the past 4 hours. on examination, he is found to have bradycardia with an irregular pulse of 45 bpm and a blood pressure of 85/60 mmhg. atropine is used as the treatment of symptomatic bradycardia but the pulse rate remains the same and the lightheadedness persists. an ecg strip is obtained which is shown in the following photograph. which one of the following is the next best step in management? \n correct answer is  c  \n the rather  constant pr intervals , and  p waves not followed by a qrs complex  seen on ecg is characteristic of  mobitz ii av block . \n  symptomatic av block  should be initially treated with  temporary pacing . percutaneous or intravenous pacemakers are often available in the ed and can be applied. if not, atropine is used instead. \n  indications for temporary pacing : \n \n history of asystole \n  mobitz ii av block  \n complete heart block \n ventricular standstill > 3 seconds \n \n  why not the others : \n \n  a  (metoprolol): can dramatically worsen the condition. \n  b  (dopamine): increases cardiac contractility and vascular tone;  not used for symptomatic bradycardia . \n  d  (permanent pacemaker): definitive treatment, considered  after  initial temporary pacing. \n  e  (adrenaline infusion): sometimes indicated to maintain heart rate  after atropine, while waiting for pacemaker insertion . \n "}, {"id": "AMC-Q0228", "type": "mcq", "qid": 228, "title": "三环类抗抑郁药中毒 — QRS 增宽最常见", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["三环类抗抑郁药中毒 — QRS 增宽最常见"], "difficulty": 2, "correctAnswer": "B", "page": 1436, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0228-TCA-QRS-Widening.md", "stem": "<p>Which one of the following is the most common pathologic ECG abnormality in intoxication with amitriptyline?</p>", "options": [{"letter": "A", "text": "Ventricular tachycardia."}, {"letter": "B", "text": "Widening of QRS complexes."}, {"letter": "C", "text": "Prolongation of QT interval."}, {"letter": "D", "text": "Prolongation of PR interval."}, {"letter": "E", "text": "Premature ventricular contractions."}], "rationale": "<p>1. 题型识别：诊断 — 药物中毒的 ECG 特征 2. TCA 中毒 ECG 异常：</p>\n<ul>\n<li><strong>QRS 增宽：最突出的病理性异常</strong>（未治疗 → VT/VF）</li>\n<li>QT 和/或 PR 延长（PR>200ms → 一度 AV 阻滞）</li>\n<li>VT/VF：约 4%，TCA 中毒最常见死因</li>\n<li><strong>窦性心动过速</strong>：抗胆碱能效应，TCA 中毒最常见的<strong>良性</strong> ECG 发现</li>\n<p>3. 排除：</p>\n<li>PVC（E）：是<strong>地高辛</strong>中毒最常见的 ECG 异常</li>\n<li>VT（A）：只占 4%，是死亡原因而非最常见病理性异常</li>\n<p>4. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>\"最常见病理性\" vs \"最常见总体\"</strong>：窦性心动过速最常见但良性；QRS 增宽是最常见的<strong>病理性</strong>异常</li>\n<li><strong>PVC 是地高辛的</strong>：地高辛中毒最常见 ECG 异常是 PVC——别把两者混淆</li>\n<li><strong>风险分层数字</strong>：QRS >100ms → 30% 癫痫风险；QRS >160ms → 50% 严重心律失常风险</li>\n</ul>", "summary": "<p><strong>TCA 中毒 ECG 异常</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>异常</th><th>特点</th></tr></thead>\n<tbody>\n<tr><td><strong>QRS 增宽</strong></td><td><strong>最常见的病理性异常</strong></td></tr>\n<tr><td>QT/PR 延长</td><td>PR>200ms → 一度 AV 阻滞</td></tr>\n<tr><td>VT/VF</td><td>约 4%，最常见死因</td></tr>\n<tr><td>窦性心动过速</td><td>抗胆碱能效应，最常见良性发现</td></tr>\n</tbody>\n</table>\n<p><strong>风险分层</strong>：</p>\n<ul>\n<li>QRS >100ms → 30% 癫痫风险</li>\n<li>QRS >160ms → 50% 严重心律失常风险</li>\n</ul>\n<p><strong>地高辛中毒</strong>：PVC 最常见；双向性室速最特异</p>", "explanation": "<p>QRS 增宽可能是 TCA 中毒最突出的病理性 ECG 异常，未治疗可进展为 VT 和 VF。其他异常包括 QT 和/或 PR 延长（PR>200ms 可致一度 AV 阻滞）、VT/VF（约 4%，最常见死因）以及抗胆碱能效应导致的窦性心动过速（最常见良性发现）。QRS >100ms 与 30% 癫痫风险相关，QRS >160ms 与 50% 严重心律失常风险相关。PVC 是地高辛中毒最常见 ECG 异常。</p>", "references": "<ul>\n<li>UpToDate – Tricyclic antidepressant poisoning</li>\n</ul>", "related": ["_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "三环类抗抑郁药中毒 — qrs 增宽最常见\n三环类抗抑郁药中毒 — qrs 增宽最常见\n which one of the following is the most common pathologic ecg abnormality in intoxication with amitriptyline? \n qrs 增宽可能是 tca 中毒最突出的病理性 ecg 异常，未治疗可进展为 vt 和 vf。其他异常包括 qt 和/或 pr 延长（pr>200ms 可致一度 av 阻滞）、vt/vf（约 4%，最常见死因）以及抗胆碱能效应导致的窦性心动过速（最常见良性发现）。qrs >100ms 与 30% 癫痫风险相关，qrs >160ms 与 50% 严重心律失常风险相关。pvc 是地高辛中毒最常见 ecg 异常。 "}, {"id": "AMC-Q0230", "type": "mcq", "qid": 230, "title": "下壁 STEMI 院前最常见死因 — 心室颤动 (VF)", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["complications", "diagnosis"], "topic": ["Inferior STEMI", "Pre-hospital Mortality", "Ventricular Fibrillation", "Sudden Cardiac Death"], "difficulty": 3, "correctAnswer": "B", "page": 21, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "stemi", "vf", "scd", "approach-complications", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0230-STEMI-Prehospital-Mortality.md", "stem": "<p>A 47-year-old man has developed central chest pain one hour ago. On examination in the Emergency Department he is sweating profusely, has a BP of 90/60 mmHg and a pulse rate of 50 bpm. An ECG shows 2-mm ST elevation in leads II, III, and aVF. Which one of the following is the most common cause of death in pre-hospital setting in this condition?</p>", "options": [{"letter": "A", "text": "Ventricular tachycardia"}, {"letter": "B", "text": "Ventricular fibrillation"}, {"letter": "C", "text": "Bradycardia"}, {"letter": "D", "text": "Asystole"}, {"letter": "E", "text": "Hypotension"}], "rationale": "<p>1. <strong>题型识别</strong>：临床背景（典型下壁 STEMI）+ 流行病学问（\"最常见死因\"）→ 考 STEMI 早期致死机制。 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>47 岁男性、急性胸痛 1 h</li>\n<li>大汗、BP 90/60、HR 50（下壁 MI 常见迷走张力亢进）</li>\n<li>ECG：II, III, aVF ST 抬高 2 mm → <strong>下壁 STEMI</strong></li>\n<p>3. <strong>STEMI 院前死亡谱</strong>：</p>\n<li>25-35% 急性 MI 在院前 SCD</li>\n<li><strong>最常见机制 = VF</strong></li>\n<li>VT 是 MI 早期最常见的<strong>心律失常</strong>（但不是最常见的死因）</li>\n<p>4. <strong>关键区分</strong>：</p>\n<li><strong>最常见心律失常</strong>（VT）≠ <strong>最常见致死机制</strong>（VF）→ 题眼是\"死因\"不是\"心律失常\"</li>\n<p>5. <strong>时间分布</strong>：</p>\n<li>大多数 VF 发生在 MI 后 24 h 内</li>\n<li><strong>一半发生在 1 h 内</strong>（黄金 1 小时）</li>\n<p>6. <strong>临床实践</strong>：</p>\n<li>怀疑 STEMI 患者转运途中<strong>连接除颤器</strong>备用</li>\n<p>7. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"最常见心律失常 = 最常见死因\"陷阱</strong>：VT 是 MI 早期最常见心律失常，但<strong>致死最多的是 VF</strong>。题问\"cause of death\"必须区分。</li>\n<li><strong>\"Bradycardia = 死因\"陷阱</strong>：本例 HR 50 看似心动过缓可能致死，但 STEMI 急性期<strong>快速性心律失常</strong>（VT/VF）才是头号杀手，缓慢性是后期或下壁 MI 特殊问题。</li>\n<li><strong>Asystole 陷阱</strong>：asystole 是终末事件，多由 VF 失治进展而来，不是首发。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The clinical and ECG findings are characteristic of <strong>inferior ST-elevation myocardial infarction (STEMI)</strong>.</p>\n<p>Of all patients experiencing acute myocardial infarction (usually STEMI), <strong>25-35% will die of sudden cardiac death (SCD) before receiving medical attention</strong>, most often from <strong>ventricular fibrillation</strong>.</p>\n<p><strong>Important distinction</strong>: <strong>Ventricular tachycardia is the most common arrhythmia early in MI</strong>, but <strong>VF is the most common cause of pre-hospital death</strong>.</p>\n<p><strong>Time distribution of VF</strong>:</p>\n<ul>\n<li>Most VFs occur in the first 24 hours post-MI</li>\n<li><strong>Half occur within the first hour</strong> (the \"golden hour\")</li>\n<li>Patients suspected of STEMI should be connected to a defibrillator on the way to the hospital</li>\n</ul>", "references": "<ul>\n<li>ResearchGate — The clinical challenge of preventing sudden cardiac death immediately after acute ST-elevation myocardial infarction</li>\n<li>（待补：AHA / ESC STEMI 指南 SCD 章节）</li>\n</ul>", "related": ["AMC-Q0225-Inferior-STEMI-Reperfusion", "AMC-Q0223-Unstable-VT-Cardioversion", "AMC-Q0224-Thrombolytics-Contraindications", "MOC-Cardiology", "Topic-SCD-After-MI"], "bodyHtml": "", "diseases": ["STEMI"], "complaints": ["chest pain", "diaphoresis"], "search": "下壁 stemi 院前最常见死因 — 心室颤动 (vf)\ninferior stemi pre-hospital mortality ventricular fibrillation sudden cardiac death\ncomplications diagnosis\n a 47-year-old man has developed central chest pain one hour ago. on examination in the emergency department he is sweating profusely, has a bp of 90/60 mmhg and a pulse rate of 50 bpm. an ecg shows 2-mm st elevation in leads ii, iii, and avf. which one of the following is the most common cause of death in pre-hospital setting in this condition? \n correct answer is  b  \n the clinical and ecg findings are characteristic of  inferior st-elevation myocardial infarction (stemi) . \n of all patients experiencing acute myocardial infarction (usually stemi),  25-35% will die of sudden cardiac death (scd) before receiving medical attention , most often from  ventricular fibrillation . \n  important distinction :  ventricular tachycardia is the most common arrhythmia early in mi , but  vf is the most common cause of pre-hospital death . \n  time distribution of vf : \n \n most vfs occur in the first 24 hours post-mi \n  half occur within the first hour  (the \"golden hour\") \n patients suspected of stemi should be connected to a defibrillator on the way to the hospital \n "}, {"id": "AMC-Q0231", "type": "mcq", "qid": 231, "title": "前侧壁 STEMI — 三级医院里首选 PCI / 心导管", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis"], "topic": ["Anterolateral STEMI", "Reperfusion", "PCI", "Fibrinolysis", "Tertiary Hospital"], "difficulty": 3, "correctAnswer": "D", "page": 22, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "stemi", "anterolateral", "pci", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0231-Anterolateral-STEMI-PCI.md", "stem": "<p>A 59-year-old man is brought to the emergency department of a tertiary hospital with compressing chest pain that has started 30 minutes ago. The pain is central in location and radiates to his jaw and left arm. A 12-lead ECG is obtained and is as follows. Which one of the following is the most appropriate management of this patient?</p>", "options": [{"letter": "A", "text": "Fibrinolytic therapy"}, {"letter": "B", "text": "Morphine"}, {"letter": "C", "text": "Aspirin"}, {"letter": "D", "text": "Cardiac catheterization"}, {"letter": "E", "text": "Rescue angioplasty"}], "rationale": "<p>1. <strong>题型识别</strong>：STEMI 处理路径题。关键条件：起病 30 min + <strong>三级医院</strong>（有 PCI 团队）。 2. <strong>ECG 关键发现</strong>：</p>\n<ul>\n<li>I, aVL, V5, V6 ST 抬高 → <strong>侧壁</strong></li>\n<li>V3, V4 ST 抬高 → <strong>前壁</strong></li>\n<li>合并 = <strong>前侧壁 STEMI</strong></li>\n<p>3. <strong>再灌注策略</strong>：</p>\n<li>起病 < 12 h + 有 PCI 条件 → <strong>PCI 优先</strong>（door-to-balloon < 90 min）</li>\n<li>不能 PCI → 溶栓</li>\n<p>4. <strong>选项映射</strong>：</p>\n<li>A (Fibrinolytic)：PCI 不能做时的备选</li>\n<li>B (Morphine)：辅助镇痛</li>\n<li>C (Aspirin)：辅助抗血小板</li>\n<li>D (Cardiac catheterization)：= 心导管，泛指含 PCI、球囊、支架 → <strong>首选</strong></li>\n<li>E (Rescue angioplasty)：<strong>溶栓失败后</strong>的补救，不是一线</li>\n<p>5. <strong>关键陷阱提示</strong>：</p>\n<li>题目问\"most appropriate management\"是<strong>整体最优</strong>步骤，不是\"next step\"</li>\n<li>题干说\"if the question asked about the next step\"，阿司匹林才是</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Aspirin / Morphine 也对\"陷阱</strong>：题问\"most appropriate management\"（最优管理）→ PCI > 药物。<strong>Aspirin 是 next step</strong>（题干明说），不是 management。</li>\n<li><strong>\"Cardiac catheterization vs PCI\"陷阱</strong>：心导管是<strong>总称</strong>，包含 PCI、球囊、支架。本题 D 涵盖更广。</li>\n<li><strong>\"Rescue PCI = PCI\"陷阱</strong>：Rescue PCI 专指溶栓失败后的补救 PCI，不是初始选择。</li>\n<li><strong>\"三级医院 = 直接溶栓\"陷阱</strong>：有 PCI 能力 = 走 PCI 路径。溶栓只在无 PCI 条件时。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>The history is highly suggestive of angina pectoris. ECG shows:</p>\n<ul>\n<li><strong>ST elevation in I, aVL, V5, V6</strong> → <strong>lateral wall</strong></li>\n<li><strong>ST elevation in V3, V4</strong> → <strong>anterior wall</strong></li>\n<li>Combined: <strong>anterolateral STEMI</strong></li>\n</ul>\n<p><strong>Management of STEMI</strong>: Emergency reperfusion therapy by either fibrinolytics or PCI if presentation is within 12 hours of chest pain onset.</p>\n<p><strong>Why D</strong>:</p>\n<ul>\n<li>Patient is in a <strong>tertiary hospital</strong> → PCI is the <strong>preferred method</strong> of reperfusion</li>\n<li>Proper facilities and experienced cardiac interventionist → PCI can be performed <strong>within 90 minutes</strong> of presentation</li>\n<li><strong>Cardiac catheterization is a general term</strong> that includes angioplasty, PCI, and balloon angioplasty</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Fibrinolytics): Preferred only if PCI cannot be performed and no major bleeding risk</li>\n<li><strong>B, C</strong> (Morphine, Aspirin): Important steps for any acute coronary syndrome, but can be given while patient is being transferred to catheterization lab. Aspirin would be the answer only if the question asked about \"the next step\"</li>\n<li><strong>E</strong> (Rescue angioplasty): Emergency angiographic intervention <strong>after fibrinolytics fail</strong></li>\n</ul>", "references": "<ul>\n<li>MJA — Guidelines for the management of acute coronary syndromes</li>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>Medscape — Acute Coronary Syndrome</li>\n<li>（待补：CSANZ / ANZCOR STEMI 指南）</li>\n</ul>", "related": ["AMC-Q0225-Inferior-STEMI-Reperfusion", "AMC-Q0224-Thrombolytics-Contraindications", "AMC-Q0025-PCI-Antiplatelet-Duration", "AMC-Q0230-STEMI-Prehospital-Mortality", "MOC-Cardiology", "Topic-STEMI-Reperfusion"], "bodyHtml": "", "diseases": ["STEMI"], "complaints": ["chest pain"], "search": "前侧壁 stemi — 三级医院里首选 pci / 心导管\nanterolateral stemi reperfusion pci fibrinolysis tertiary hospital\ntreatment diagnosis\n a 59-year-old man is brought to the emergency department of a tertiary hospital with compressing chest pain that has started 30 minutes ago. the pain is central in location and radiates to his jaw and left arm. a 12-lead ecg is obtained and is as follows. which one of the following is the most appropriate management of this patient? \n correct answer is  d  \n the history is highly suggestive of angina pectoris. ecg shows: \n \n  st elevation in i, avl, v5, v6  →  lateral wall  \n  st elevation in v3, v4  →  anterior wall  \n combined:  anterolateral stemi  \n \n  management of stemi : emergency reperfusion therapy by either fibrinolytics or pci if presentation is within 12 hours of chest pain onset. \n  why d : \n \n patient is in a  tertiary hospital  → pci is the  preferred method  of reperfusion \n proper facilities and experienced cardiac interventionist → pci can be performed  within 90 minutes  of presentation \n  cardiac catheterization is a general term  that includes angioplasty, pci, and balloon angioplasty \n \n  why not the others : \n \n  a  (fibrinolytics): preferred only if pci cannot be performed and no major bleeding risk \n  b, c  (morphine, aspirin): important steps for any acute coronary syndrome, but can be given while patient is being transferred to catheterization lab. aspirin would be the answer only if the question asked about \"the next step\" \n  e  (rescue angioplasty): emergency angiographic intervention  after fibrinolytics fail  \n "}, {"id": "AMC-Q0232", "type": "mcq", "qid": 232, "title": "替罗非班禁忌证 — NSTEMI 是适应证（否定型）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["替罗非班禁忌证 — NSTEMI 不是（否定型）"], "difficulty": 3, "correctAnswer": "A", "page": 1444, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0232-Tirofiban-Contraindications.md", "stem": "<p>A 70-year-old man presents to the Emergency Department for an ongoing central chest pain that started about 1 hour ago. He has the history of recurrent chest pains that are brought on with exertion and relieved with rest, and type II diabetes mellitus. Further assessment establishes the diagnosis of unstable angina. You start him on aspirin, clopidogrel, heparin, and glyceryl trinitrate. The on-call cardiologist advises that you start him on tirofiban as well if it is not contraindicated. Which one of the following is not a contraindication for tirofiban?</p>", "options": [{"letter": "A", "text": "Non-ST elevation myocardial infarction (NSTEMI)."}, {"letter": "B", "text": "Acute pericarditis."}, {"letter": "C", "text": "Vasculitis."}, {"letter": "D", "text": "Aortic dissection."}, {"letter": "E", "text": "History of intracranial neoplasm."}], "rationale": "<p>1. 题型识别：否定型药理题 — 找<strong>不是</strong>禁忌证的选项 2. 替罗非班/阿昔单抗机制：GP IIb/IIIa 抑制剂 → 阻止纤维蛋白原与血小板受体结合 3. 适应证：不稳定心绞痛 / <strong>NSTEMI</strong>，尤其计划早期心导管检查时 4. 禁忌证：</p>\n<ul>\n<li><strong>30 天内卒中史</strong>或任何出血性卒中史</li>\n<li>已知颅内疾病（肿瘤、AVM、动脉瘤）</li>\n<li>活动性或近期（30 天内）临床意义出血（如 GI 出血）</li>\n<li>恶性高血压</li>\n<li><strong>6 周内</strong>创伤或大手术</li>\n<li>血小板减少（<100,000/mm³）、血小板功能异常</li>\n<li>凝血障碍（PT >1.3× 或 INR >1.5）</li>\n<li>严重肝衰竭</li>\n<p>5. 不推荐情形还包括：急性心包炎、活动性/已知血管炎史、疑似主动脉夹层、活动性消化性溃疡（3 个月内）、未控制高血压（>180/110）等 6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>急性心包炎（B）/血管炎（C）/主动脉夹层（D）都是\"不推荐\"</strong>：注意题干的\"contraindication\"涵盖\"not recommended\"列表</li>\n<li><strong>颅内肿瘤（E）</strong>：已知颅内疾病是明确禁忌</li>\n<li><strong>NSTEMI 反向</strong>：题目背景患者是不稳定心绞痛（已给阿司匹林/氯吡格雷/肝素/GTN）→ 替罗非班可选；NSTEMI 同为其适应证</li>\n</ul>", "summary": "<p><strong>GP IIb/IIIa 抑制剂（替罗非班、阿昔单抗）</strong>：</p>\n<ul>\n<li>机制：占据 GP IIb/IIIa 受体，阻止纤维蛋白原与血小板结合</li>\n<li>适应证：不稳定心绞痛 / NSTEMI（尤其计划早期心导管检查）</li>\n</ul>\n<p><strong>禁忌证（重点记忆）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>细节</th></tr></thead>\n<tbody>\n<tr><td>卒中</td><td>30 天内卒中或任何出血性卒中史</td></tr>\n<tr><td>颅内疾病</td><td>肿瘤、AVM、动脉瘤</td></tr>\n<tr><td>出血</td><td>活动性或 30 天内临床意义出血（GI 出血）</td></tr>\n<tr><td>血压</td><td>恶性高血压</td></tr>\n<tr><td>创伤/手术</td><td>6 周内</td></tr>\n<tr><td>血小板</td><td><100,000/mm³ 或功能异常</td></tr>\n<tr><td>凝血</td><td>PT >1.3× 或 INR >1.5</td></tr>\n<tr><td>肝</td><td>严重肝衰竭</td></tr>\n</tbody>\n</table>\n<p><strong>不推荐</strong>：急性心包炎、血管炎、疑似主动脉夹层、3 个月内活动性消化性溃疡、未控制高血压（>180/110）、出血性视网膜病、便潜血/血尿、溶栓治疗、合用具出血风险药物</p>", "explanation": "<p>替罗非班和阿昔单抗是糖蛋白 IIb/IIIa 抑制剂，通过占据 GP IIIa/IIb 受体阻止纤维蛋白原与血小板结合。可用于不稳定心绞痛或 NSTEMI（尤其计划早期心导管检查时）。<strong>NSTEMI 是替罗非班的适应证，不是禁忌证</strong>。其余选项（急性心包炎、血管炎、主动脉夹层、颅内肿瘤史）均属于禁忌或不推荐情形。</p>", "references": "<ul>\n<li>EMC – Tirofiban 50 micrograms/ml solution for infusion</li>\n</ul>", "related": ["_MOC-Cardiology"], "bodyHtml": "", "diseases": ["NSTEMI", "STEMI"], "complaints": ["chest pain"], "search": "替罗非班禁忌证 — nstemi 是适应证（否定型）\n替罗非班禁忌证 — nstemi 不是（否定型）\n a 70-year-old man presents to the emergency department for an ongoing central chest pain that started about 1 hour ago. he has the history of recurrent chest pains that are brought on with exertion and relieved with rest, and type ii diabetes mellitus. further assessment establishes the diagnosis of unstable angina. you start him on aspirin, clopidogrel, heparin, and glyceryl trinitrate. the on-call cardiologist advises that you start him on tirofiban as well if it is not contraindicated. which one of the following is not a contraindication for tirofiban? \n 替罗非班和阿昔单抗是糖蛋白 iib/iiia 抑制剂，通过占据 gp iiia/iib 受体阻止纤维蛋白原与血小板结合。可用于不稳定心绞痛或 nstemi（尤其计划早期心导管检查时）。 nstemi 是替罗非班的适应证，不是禁忌证 。其余选项（急性心包炎、血管炎、主动脉夹层、颅内肿瘤史）均属于禁忌或不推荐情形。 "}, {"id": "AMC-Q0233", "type": "mcq", "qid": 233, "title": "失代偿 HF 重启治疗 — 首选 ACEI（不是 BB、不是三联同时）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "prevention"], "topic": ["Decompensated Heart Failure", "ACE Inhibitor", "First-line", "Euvolemia", "Beta Blocker Timing"], "difficulty": 3, "correctAnswer": "A", "page": 23, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "heart-failure", "ace-inhibitor", "pharmacotherapy", "approach-treatment", "approach-prevention"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0233-Decompensated-HF-ACEI.md", "stem": "<p>Steven is a 65-year-old man, who is a known case of congestive heart failure. He had been stable on enalapril, metoprolol and digoxin until three weeks ago when his wife passed away from breast cancer. Since then, he stopped taking his medication. Today, he is brought to the emergency department by his son, with complaints of shortness of breath, night coughs and ankle edema. On examination, he has a blood pressure of 90/75 mmHg, heart rate of 68 bpm, and respiratory rate of 26 breaths per minute. On auscultation, an S3 gallop is noted, but there is no crackle. You decide to start him on medication again. Which one of the following would be the best option to start with?</p>", "options": [{"letter": "A", "text": "Start him on enalapril"}, {"letter": "B", "text": "Start him on metoprolol"}, {"letter": "C", "text": "Start him on digoxin"}, {"letter": "D", "text": "Start him on enalapril, digoxin and metoprolol at the same time"}, {"letter": "E", "text": "Start him on enalapril and metoprolol"}], "rationale": "<p>1. <strong>题型识别</strong>：失代偿 HF 起始用药。关键是\"哪个先\"+\"哪个对\"。 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>既往稳定用药 = enalapril + metoprolol + digoxin</li>\n<li>3 周自行停药 → 失代偿</li>\n<li><strong>S3 奔马律</strong>（容量超负荷）</li>\n<li>踝肿（高容量）</li>\n<li><strong>夜咳</strong>（轻度肺淤血）</li>\n<li>但<strong>无 crackle</strong>（尚未到急性肺水肿）</li>\n<li>BP 90/75（偏低，但能接受）</li>\n<p>3. <strong>HF 治疗核心原则</strong>：</p>\n<li><strong>ACEI 是所有等级 HF 的一线</strong>，改善预后（降低死亡率）</li>\n<li><strong>利尿剂</strong>控制充血症状（但本例无 crackle，且题未给利尿剂选项）</li>\n<li><strong>BB 仅在 euvolemic + 稳定时</strong>加</li>\n<li><strong>Digoxin</strong> 用于：房颤合并 HF；窦律但 ACEI/利尿剂控制不佳；EF < 35%</li>\n<p>4. <strong>本例为何不能 BB 起步</strong>：</p>\n<li>S3 + 踝肿 = 仍有高容量（<strong>非 euvolemic</strong>）</li>\n<li>BB 起步会<strong>负性肌力</strong> → 加重失代偿</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>B：BB 在非 euvolemic 时错</li>\n<li>C：Digoxin 不是一线，EF 未明且本例主要是容量问题</li>\n<li>D：三联同时上 = 失代偿期过激</li>\n<li>E：enalapril + metoprolol 同时 = BB 起步时机不对</li>\n<p>6. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"BB 是 HF 一线 = 现在上\"陷阱</strong>：BB 是 HF 长期预后药物，但<strong>必须 euvolemic + 稳定</strong>才能加。失代偿期不启动。</li>\n<li><strong>\"三联同时更全面\"陷阱</strong>：同时上三种药，BB 在高容量时反而<strong>负性肌力恶化</strong>。</li>\n<li><strong>\"Digoxin 改善症状 = 首选\"陷阱</strong>：Digoxin 只在特定场景（房颤、控制不佳、EF<35%）。</li>\n<li><strong>\"S3 = 收缩功能差 = Digoxin\"陷阱</strong>：S3 是<strong>容量超负荷</strong>的体征，不是\"加 Digoxin\"的指征。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>The case describes a patient with congestive cardiac failure, controlled on three medications, who has decompensated due to <strong>drug withdrawal</strong>.</p>\n<p><strong>Based on physical findings</strong>:</p>\n<ul>\n<li>No pulmonary edema (no basal crackles)</li>\n<li>S3 gallop + ankle edema = hypervolemia (not yet euvolemic)</li>\n</ul>\n<p><strong>HF pharmacotherapy principles</strong>:</p>\n<ul>\n<li><strong>ACE inhibitors (e.g. enalapril)</strong> improve prognosis in <strong>all grades</strong> of heart failure → <strong>initial therapy in all patients</strong></li>\n<li><strong>ARBs</strong> (e.g. losartan) when ACE inhibitors cannot be tolerated</li>\n<li><strong>Diuretics</strong> added to ACE inhibitors to control congestive symptoms</li>\n<li><strong>Beta blockers</strong>: Only when patient is <strong>stable and euvolemic</strong></li>\n<li>As this patient has S3 gallop and ankle edema (signs of hypervolemia), <strong>any options suggesting beta blockers as initial treatment are incorrect</strong></li>\n</ul>\n<p><strong>Digoxin</strong> is used in HF if:</p>\n<ul>\n<li>HF caused by atrial fibrillation (often with BB if euvolemic)</li>\n<li>Sinus rhythm but ACEI/diuretics not adequate</li>\n<li>Significantly decreased EF (<35%)</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular; http://www.tg.org.au</li>\n<li>（待补：ESC 2021 HF 指南 / NHFA CSANZ HF 指南）</li>\n</ul>", "related": ["AMC-Q0234-Diastolic-HF-BB-CCB", "AMC-Q0026-Heart-Failure-Prognosis", "AMC-Q0029-Pulmonary-Edema-Management", "MOC-Cardiology", "Topic-HF-Pharmacotherapy"], "bodyHtml": "", "diseases": ["Heart Failure"], "complaints": ["dyspnea", "cough", "edema"], "search": "失代偿 hf 重启治疗 — 首选 acei（不是 bb、不是三联同时）\ndecompensated heart failure ace inhibitor first-line euvolemia beta blocker timing\ntreatment prevention\n steven is a 65-year-old man, who is a known case of congestive heart failure. he had been stable on enalapril, metoprolol and digoxin until three weeks ago when his wife passed away from breast cancer. since then, he stopped taking his medication. today, he is brought to the emergency department by his son, with complaints of shortness of breath, night coughs and ankle edema. on examination, he has a blood pressure of 90/75 mmhg, heart rate of 68 bpm, and respiratory rate of 26 breaths per minute. on auscultation, an s3 gallop is noted, but there is no crackle. you decide to start him on medication again. which one of the following would be the best option to start with? \n correct answer is  a  \n the case describes a patient with congestive cardiac failure, controlled on three medications, who has decompensated due to  drug withdrawal . \n  based on physical findings : \n \n no pulmonary edema (no basal crackles) \n s3 gallop + ankle edema = hypervolemia (not yet euvolemic) \n \n  hf pharmacotherapy principles : \n \n  ace inhibitors (e.g. enalapril)  improve prognosis in  all grades  of heart failure →  initial therapy in all patients  \n  arbs  (e.g. losartan) when ace inhibitors cannot be tolerated \n  diuretics  added to ace inhibitors to control congestive symptoms \n  beta blockers : only when patient is  stable and euvolemic  \n as this patient has s3 gallop and ankle edema (signs of hypervolemia),  any options suggesting beta blockers as initial treatment are incorrect  \n \n  digoxin  is used in hf if: \n \n hf caused by atrial fibrillation (often with bb if euvolemic) \n sinus rhythm but acei/diuretics not adequate \n significantly decreased ef ( \n "}, {"id": "AMC-Q0234", "type": "mcq", "qid": 234, "title": "舒张性心衰（HFpEF）— BB + CCB 是基石", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "definition"], "topic": ["Diastolic Heart Failure", "HFpEF", "Beta Blocker", "Calcium Channel Blocker", "Treatment Mainstay"], "difficulty": 4, "correctAnswer": "B", "page": 24, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "hfpef", "diastolic-dysfunction", "beta-blocker", "ccb", "approach-treatment", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0234-Diastolic-HF-BB-CCB.md", "stem": "<p>Which one of the following drug groups is the mainstay of therapy in diastolic heart failure?</p>", "options": [{"letter": "A", "text": "ACE inhibitors and beta blockers"}, {"letter": "B", "text": "Beta blockers and calcium channel blockers"}, {"letter": "C", "text": "Calcium channel blockers and diuretics"}, {"letter": "D", "text": "Angiotensin receptor blockers and beta blockers"}, {"letter": "E", "text": "Beta blockers and diuretics"}], "rationale": "<p>1. <strong>题型识别</strong>：HF 治疗基石题。区分<strong>收缩性</strong>（HFrEF，EF 降低，ACEI/BB/MRA/ARNI 改善预后）vs <strong>舒张性</strong>（HFpEF，EF 保留）。 2. <strong>舒张性 HF 病理</strong>：</p>\n<ul>\n<li>LV 顺应性下降 → 舒张期充盈受限 → 舒张末压升高 → 肺淤血</li>\n<li>EF 正常或升高</li>\n<p>3. <strong>治疗目标</strong>：</p>\n<li><strong>降低心率</strong> → 延长舒张期 → 增加 LV 充盈时间</li>\n<li>→ BB（首选）+ CCB（二线 / 联用）</li>\n<p>4. <strong>避免</strong>：</p>\n<li><strong>利尿剂</strong>：降低前负荷 → 进一步降低心输出量（除非有肺淤血 / 容量过负荷）</li>\n<li><strong>血管扩张剂 / 硝酸酯</strong>：降低静脉回流 → 降低心输出量</li>\n<li><strong>动脉扩张剂（hydralazine）</strong>：可能引起动态 LVOT 梗阻</li>\n<li><strong>Digoxin / 强心药</strong>：EF 正常 → 无作用（除非合并房颤）</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A：ACEI 在 HFpEF <strong>无预后改善证据</strong>（虽然对基础病有用）</li>\n<li>C：CCB 对，但利尿剂应避免</li>\n<li>D：ARB 同 ACEI，无明确改善 HFpEF 预后证据</li>\n<li>E：BB 对，但利尿剂应避免</li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"收缩性 HF = HF\"陷阱</strong>：HF 不止收缩性。HFpEF 治法完全不同（BB + CCB 而非 ACEI）。</li>\n<li><strong>\"利尿剂 = HF 通用\"陷阱</strong>：利尿剂在 HFpEF 应避免，除非容量过负荷。</li>\n<li><strong>\"ACEI / ARB 改善 HF = 改善 HFpEF\"陷阱</strong>：两者对 HFpEF 预后<strong>无直接改善</strong>证据，但可用于基础病（高血压、糖尿病肾病）。</li>\n<li><strong>\"EF 保留 = 不严重\"陷阱</strong>：HFpEF 同样有高死亡率，只是治法不同。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Diastolic dysfunction</strong> = decreased compliance of the left ventricle during diastole → decreased cardiac output. Most common cause = <strong>hypertrophied LV</strong> from chronic hypertension. Most common in <strong>elderly women</strong>. Other causes: restrictive cardiomyopathy, constrictive pericarditis. Pericardial tamponade = acute diastolic dysfunction. <strong>EF remains normal or even increases</strong>.</p>\n<p><strong>Mainstay of pharmacotherapy in HFpEF</strong>:</p>\n<ul>\n<li><strong>Cardioselective beta blockers</strong> (atenolol, carvedilol, metoprolol) — slow HR → give ventricles more time to fill</li>\n<li><strong>Calcium channel blockers</strong> — same purpose; second-line or added to BB later</li>\n</ul>\n<p><strong>Drugs to avoid in diastolic dysfunction</strong>:</p>\n<ul>\n<li><strong>Diuretics</strong> — decrease already-prone-to-decrease cardiac output (only if pulmonary congestion / edema)</li>\n<li><strong>Vasodilators (nitrates)</strong> — decrease venous return → decrease cardiac output</li>\n<li><strong>Arterial vasodilators (hydralazine)</strong> — may cause dynamic LVOT obstruction</li>\n<li><strong>Digoxin and inotropes</strong> — no role (EF normal). Exception: coexisting AF (but not first-line)</li>\n</ul>\n<p><strong>Why not ACEI/ARB</strong>:</p>\n<ul>\n<li><strong>A, D</strong>: No clear evidence supports ACEI/ARB therapy for <strong>directly</strong> improving morbidity/mortality or diastolic function in HFpEF. May be useful for underlying disease (e.g., HTN, CKD) but not as HFpEF treatment.</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular; http://tg.org.au</li>\n<li>UpToDate — Treatment and prognosis of diastolic heart failure</li>\n<li>（待补：ESC 2021 HF 指南 HFpEF 章节）</li>\n</ul>", "related": ["AMC-Q0233-Decompensated-HF-ACEI", "AMC-Q0026-Heart-Failure-Prognosis", "MOC-Cardiology", "Topic-HF-Systolic-vs-Diastolic"], "bodyHtml": "", "diseases": ["Heart Failure"], "complaints": [], "search": "舒张性心衰（hfpef）— bb + ccb 是基石\ndiastolic heart failure hfpef beta blocker calcium channel blocker treatment mainstay\ntreatment definition\n which one of the following drug groups is the mainstay of therapy in diastolic heart failure? \n correct answer is  b  \n  diastolic dysfunction  = decreased compliance of the left ventricle during diastole → decreased cardiac output. most common cause =  hypertrophied lv  from chronic hypertension. most common in  elderly women . other causes: restrictive cardiomyopathy, constrictive pericarditis. pericardial tamponade = acute diastolic dysfunction.  ef remains normal or even increases . \n  mainstay of pharmacotherapy in hfpef : \n \n  cardioselective beta blockers  (atenolol, carvedilol, metoprolol) — slow hr → give ventricles more time to fill \n  calcium channel blockers  — same purpose; second-line or added to bb later \n \n  drugs to avoid in diastolic dysfunction : \n \n  diuretics  — decrease already-prone-to-decrease cardiac output (only if pulmonary congestion / edema) \n  vasodilators (nitrates)  — decrease venous return → decrease cardiac output \n  arterial vasodilators (hydralazine)  — may cause dynamic lvot obstruction \n  digoxin and inotropes  — no role (ef normal). exception: coexisting af (but not first-line) \n \n  why not acei/arb : \n \n  a, d : no clear evidence supports acei/arb therapy for  directly  improving morbidity/mortality or diastolic function in hfpef. may be useful for underlying disease (e.g., htn, ckd) but not as hfpef treatment. \n "}, {"id": "AMC-Q0235", "type": "mcq", "qid": 235, "title": "年轻运动员 + 父猝死 — HOCM，超声心动图确诊", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "investigation", "physical-exam"], "topic": ["Hypertrophic Obstructive Cardiomyopathy", "HOCM", "Sudden Cardiac Death", "Young Athlete", "Echocardiography"], "difficulty": 4, "correctAnswer": "E", "page": 25, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "hocm", "sudden-death", "syncope", "echocardiography", "approach-diagnosis", "approach-investigation", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0235-HOCM-ECHO-Diagnosis.md", "stem": "<p>An 17-year-old girl sustained sudden loss of consciousness and collapsed while playing basketball at school. She is now in the emergency department. She mentions that her father died suddenly at the age of 37 years. Which one of the following investigations is most likely to establish the diagnosis of the underlying cause of her collapse?</p>", "options": [{"letter": "A", "text": "ECG"}, {"letter": "B", "text": "Cardiac biomarkers"}, {"letter": "C", "text": "Angiography"}, {"letter": "D", "text": "Chest X-ray"}, {"letter": "E", "text": "Echocardiography"}], "rationale": "<p>1. <strong>题型识别</strong>：年轻 + 运动 syncope + 家族猝死史 → 病因学检查选择。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>17 岁女性</li>\n<li>运动中（打篮球）突发意识丧失</li>\n<li>父 37 岁猝死</li>\n<p>3. <strong>鉴别诊断</strong>：</p>\n<li>HOCM（最常见年轻运动员 SCD 原因）</li>\n<li>长 QT 综合征、Brugada、ARVC 等遗传性心律失常</li>\n<li>冠脉畸形</li>\n<li>主动脉夹层、马凡综合征</li>\n<p>4. <strong>检查选择</strong>：</p>\n<li><strong>ECG</strong>：可显示 LVH、深而窄的 Q 波（\"dagger-like\"），但<strong>不能确诊</strong>结构性异常</li>\n<li><strong>Cardiac biomarkers</strong>：急性事件可能升高，但不诊断病因</li>\n<li><strong>Angiography</strong>：用于冠脉病变，年轻运动员冠脉畸形可查，但本例不首选</li>\n<li><strong>CXR</strong>：可能心影增大，但特异性差</li>\n<li><strong>ECHO</strong> ✅：<strong>最佳工具</strong>显示结构性心脏异常（瓣膜、心肌病）</li>\n<p>5. <strong>ECHO 在 HOCM 的优势</strong>：</p>\n<li>直接看室间隔肥厚</li>\n<li>SAM 征（systolic anterior motion of mitral valve）</li>\n<li>LVOT 压力阶差</li>\n<li>可评估梗阻严重程度</li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"ECG 是心脏检查第一线\"陷阱</strong>：ECG 是筛查工具，但<strong>确诊结构异常</strong>用 ECHO。</li>\n<li><strong>\"Cardiac biomarkers = MI\"陷阱</strong>：17 岁运动员，急性 MI 罕见，且 biomarkers 不诊断病因。</li>\n<li><strong>\"Angiography = 心脏金标准\"陷阱</strong>：angiography 看冠脉，不看心肌。</li>\n<li><strong>\"家族猝死 = 心律失常\"陷阱</strong>：长 QT / Brugada 也是家族性，但本例<strong>运动中</strong>晕厥（不是静息 / 夜间）→ HOCM 倾向更大。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Sudden loss of consciousness in a <strong>young person while on exertion</strong> is most likely due to either:</p>\n<ul>\n<li><strong>Arrhythmia</strong></li>\n<li><strong>Hypertrophic obstructive cardiomyopathy (HOCM)</strong></li>\n</ul>\n<p>With a <strong>positive family history of sudden death at young age</strong>, HOCM is the most likely diagnosis.</p>\n<p><strong>CXR, ECG, echocardiography</strong> are all part of the workup, but <strong>echocardiography is more likely to establish the diagnosis of HOCM</strong>.</p>\n<p><strong>Why E (ECHO)</strong>:</p>\n<ul>\n<li><strong>Best tool for detecting structural cardiac abnormalities</strong> (valvular lesions, cardiomyopathies)</li>\n<li>Directly visualizes:</li>\n<li><strong>Asymmetric septal hypertrophy</strong></li>\n<li><strong>SAM (systolic anterior motion) of mitral valve</strong></li>\n<li><strong>LVOT obstruction</strong></li>\n<li>Gradient across the LVOT</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (ECG): Shows LVH, \"dagger-like\" Q waves, but doesn't confirm structural abnormality</li>\n<li><strong>B</strong> (Biomarkers): Detects acute injury, not the cause</li>\n<li><strong>C</strong> (Angiography): For coronary artery disease</li>\n<li><strong>D</strong> (CXR): May show cardiomegaly but non-specific</li>\n</ul>", "references": "<ul>\n<li>http://www.csanz.edu.au/wp-content/uploads/2014/01</li>\n<li>（待补：ESC 2014 / 2022 HCM 指南、AHA/ACC 2020 HCM 指南）</li>\n</ul>", "related": ["AMC-Q0223-Unstable-VT-Cardioversion", "MOC-Cardiology", "Topic-Cardiomyopathies"], "bodyHtml": "", "diseases": ["HOCM", "Syncope"], "complaints": ["syncope/collapse"], "search": "年轻运动员 + 父猝死 — hocm，超声心动图确诊\nhypertrophic obstructive cardiomyopathy hocm sudden cardiac death young athlete echocardiography\ndiagnosis investigation physical-exam\n an 17-year-old girl sustained sudden loss of consciousness and collapsed while playing basketball at school. she is now in the emergency department. she mentions that her father died suddenly at the age of 37 years. which one of the following investigations is most likely to establish the diagnosis of the underlying cause of her collapse? \n correct answer is  e  \n sudden loss of consciousness in a  young person while on exertion  is most likely due to either: \n \n  arrhythmia  \n  hypertrophic obstructive cardiomyopathy (hocm)  \n \n with a  positive family history of sudden death at young age , hocm is the most likely diagnosis. \n  cxr, ecg, echocardiography  are all part of the workup, but  echocardiography is more likely to establish the diagnosis of hocm . \n  why e (echo) : \n \n  best tool for detecting structural cardiac abnormalities  (valvular lesions, cardiomyopathies) \n directly visualizes: \n  asymmetric septal hypertrophy  \n  sam (systolic anterior motion) of mitral valve  \n  lvot obstruction  \n gradient across the lvot \n \n  why not the others : \n \n  a  (ecg): shows lvh, \"dagger-like\" q waves, but doesn't confirm structural abnormality \n  b  (biomarkers): detects acute injury, not the cause \n  c  (angiography): for coronary artery disease \n  d  (cxr): may show cardiomegaly but non-specific \n "}, {"id": "AMC-Q0237", "type": "mcq", "qid": 237, "title": "妊娠期最麻烦的心脏病变 — 二尖瓣狭窄 (MS)", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["complications", "prevention", "definition"], "topic": ["Pregnancy", "Cardiac Lesion", "Mitral Stenosis", "Hemodynamics", "Volume Overload"], "difficulty": 3, "correctAnswer": "A", "page": 26, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pregnancy", "mitral-stenosis", "hemodynamics", "approach-complications", "approach-prevention", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0237-Pregnancy-MS-Complications.md", "stem": "<p>Patients with a variety of cardiac conditions may require special care in pregnancy. Which one of the following cardiac lesions is most likely to cause problems during pregnancy?</p>", "options": [{"letter": "A", "text": "Mitral stenosis"}, {"letter": "B", "text": "Tricuspid regurgitation"}, {"letter": "C", "text": "Mitral regurgitation"}, {"letter": "D", "text": "Aortic regurgitation"}, {"letter": "E", "text": "Ventricular septal defect"}], "rationale": "<p>1. <strong>题型识别</strong>：妊娠 + 心脏病变 = 找<strong>最不能耐受血容量增加</strong>的病变。 2. <strong>妊娠期血流动力学变化</strong>：</p>\n<ul>\n<li>血浆容量 ↑ 50%</li>\n<li>心输出量 ↑ 30-50%</li>\n<li>心率 ↑</li>\n<li><strong>全身血管阻力 ↓</strong>（孕激素介导）</li>\n<p>3. <strong>MS 病理生理</strong>：</p>\n<li>LV 充盈依赖足够时间通过狭窄的 MV</li>\n<li>妊娠 → HR ↑ → 舒张期缩短 → LV 充盈更差 → 左房压急剧升高 → 肺淤血 → 肺水肿</li>\n<li>同时血浆容量 ↑ 50% → 流经 MV 的血量 ↑ → 跨瓣压差 ↑（压力阶差 ∝ 流量²）</li>\n<p>4. <strong>其它选项为什么没事</strong>：</p>\n<li>B (TR)：右心瓣膜，<strong>SVR ↓ 减少反流量</strong> → 耐受好</li>\n<li>C (MR)：左心瓣膜，但 <strong>SVR ↓</strong>（后负荷 ↓）→ 反流量 ↓ → 耐受好</li>\n<li>D (AR)：同 MR，<strong>SVR ↓</strong> → 反流量 ↓ → 耐受好</li>\n<li>E (VSD)：左→右分流，<strong>SVR ↓</strong> → 分流量 ↓ → 耐受好</li>\n<p>5. <strong>核心规律</strong>：</p>\n<li><strong>SVR ↓ → 反流 / 分流 / 后负荷依赖的病变</strong> 都耐受更好</li>\n<li><strong>MS 是狭窄</strong>（机械梗阻）+ <strong>不能从 SVR ↓ 中获益</strong> → 最差</li>\n<p>6. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"左心瓣膜都比右心麻烦\"陷阱</strong>：错。MR/AR 在妊娠 SVR ↓ 时反流减轻。<strong>狭窄（机械梗阻）才麻烦</strong>。</li>\n<li><strong>\"MS 是常见病 = 题考的是它\"陷阱</strong>：要从机制推理，不要凭印象。</li>\n<li><strong>\"VSD = 严重 = 不能妊娠\"陷阱</strong>：VSD 在妊娠 SVR ↓ 时反而<strong>分流减少</strong>，耐受好。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Among the given options, <strong>mitral stenosis (MS)</strong> is most likely to complicate a pregnancy.</p>\n<p><strong>Pathophysiology</strong>:</p>\n<ul>\n<li>Plasma volume increases by <strong>50%</strong> during pregnancy</li>\n<li>→ More pronounced left atrial congestion</li>\n<li>→ Backflow to the lungs</li>\n<li>→ Pulmonary congestion and its typical presentation: fatigue, dyspnea, orthopnea, PND, pulmonary edema</li>\n</ul>\n<p><strong>Why other lesions are well-tolerated</strong>:</p>\n<ul>\n<li><strong>Decreased peripheral vascular resistance (SVR)</strong> in pregnancy causes accumulation of blood in the periphery</li>\n<li>This eliminates part of the workload the heart would have undergone if all that blood returned for recirculation</li>\n<li>→ Regurgitant lesions (TR, MR, AR) and shunt lesions (VSD) are <strong>better tolerated</strong> because decreased SVR <strong>reduces regurgitant volume / shunt volume</strong></li>\n</ul>\n<p><strong>Key principle</strong>:</p>\n<ul>\n<li>MS is a <strong>mechanical obstruction</strong> (cannot benefit from SVR reduction)</li>\n<li>All regurgitant / shunt lesions benefit from SVR ↓ in pregnancy</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/155724-clini</li>\n<li>（待补：ESC 2018 妊娠期心血管疾病管理指南）</li>\n</ul>", "related": ["AMC-QNA-P011-DVT-Pregnancy-LMWH", "AMC-Q0233-Decompensated-HF-ACEI", "MOC-Cardiology", "Topic-Cardiac-Disease-in-Pregnancy"], "bodyHtml": "", "diseases": ["Mitral Stenosis"], "complaints": [], "search": "妊娠期最麻烦的心脏病变 — 二尖瓣狭窄 (ms)\npregnancy cardiac lesion mitral stenosis hemodynamics volume overload\ncomplications prevention definition\n patients with a variety of cardiac conditions may require special care in pregnancy. which one of the following cardiac lesions is most likely to cause problems during pregnancy? \n correct answer is  a  \n among the given options,  mitral stenosis (ms)  is most likely to complicate a pregnancy. \n  pathophysiology : \n \n plasma volume increases by  50%  during pregnancy \n → more pronounced left atrial congestion \n → backflow to the lungs \n → pulmonary congestion and its typical presentation: fatigue, dyspnea, orthopnea, pnd, pulmonary edema \n \n  why other lesions are well-tolerated : \n \n  decreased peripheral vascular resistance (svr)  in pregnancy causes accumulation of blood in the periphery \n this eliminates part of the workload the heart would have undergone if all that blood returned for recirculation \n → regurgitant lesions (tr, mr, ar) and shunt lesions (vsd) are  better tolerated  because decreased svr  reduces regurgitant volume / shunt volume  \n \n  key principle : \n \n ms is a  mechanical obstruction  (cannot benefit from svr reduction) \n all regurgitant / shunt lesions benefit from svr ↓ in pregnancy \n "}, {"id": "AMC-Q0238", "type": "mcq", "qid": 238, "title": "二尖瓣脱垂（MVP）— 流行病学（人群 10%，女性多见）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "diagnosis", "physical-exam"], "topic": ["Mitral Valve Prolapse", "MVP", "Epidemiology", "Mid-Systolic Click", "Late Systolic Murmur"], "difficulty": 3, "correctAnswer": "C", "page": 28, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "mitral-valve-prolapse", "mvp", "epidemiology", "approach-definition", "approach-diagnosis", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0238-MVP-Epidemiology.md", "stem": "<p>A 25-year-old woman comes to your practice with complaints of 'skipped heart beats'. On examination, she has a blood pressure of 110/85 mmHg and pulse of 88 bpm. Heart auscultation is remarkable for a <strong>mid-systolic click</strong> followed by a <strong>late systolic murmur</strong>. Echocardiography shows mitral valve prolapse (MVP). Which one of the following is correct about her condition?</p>", "options": [{"letter": "A", "text": "MVP is more common in men"}, {"letter": "B", "text": "Prophylaxis against infectious endocarditis is recommended"}, {"letter": "C", "text": "MVP is present in up to 10% of population"}, {"letter": "D", "text": "Risk of pulmonary embolism is high"}, {"letter": "E", "text": "Ventricular arrhythmias do not occur"}], "rationale": "<p>1. <strong>题型识别</strong>：MVP 知识题。考<strong>流行病学</strong>和<strong>临床细节</strong>。 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>25 岁女性（<strong>MVP 更常见于女性</strong>）</li>\n<li>\"Skipped heart beats\"（心悸）</li>\n<li><strong>Mid-systolic click + late systolic murmur</strong>（MVP 特征性听诊）</li>\n<li>Echo 证实</li>\n<p>3. <strong>MVP 知识要点</strong>：</p>\n<li>发生率 <strong>~10%</strong>（最常见瓣膜异常）</li>\n<li><strong>女性多见</strong>（A 错）</li>\n<li>多无症状；可有<strong>心悸、气短</strong>、偶有胸痛</li>\n<li><strong>IE 抗生素预防不再推荐</strong>（2007 AHA 指南）— B 错</li>\n<li>MVP → 房性扩张 → 血液淤滞 → 系统性血栓栓塞（<strong>非 PE</strong>）— D 错</li>\n<li><strong>室上性、室性心律失常均可见</strong>（罕见但存在）— E 错</li>\n<p>4. <strong>逐项排除</strong>：</p>\n<li>A：MVP 女 > 男</li>\n<li>B：2007 后不再推荐（除非 MVP + 反流）</li>\n<li>C：✔ 10%</li>\n<li>D：MVP → 左房扩张 → 系统栓塞（脑卒中），<strong>不</strong>是 PE</li>\n<li>E：可发生室性心律失常（罕见）</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"男性多见\"反向陷阱</strong>：MVP <strong>女 > 男</strong>。</li>\n<li><strong>\"瓣膜病 = IE 预防\"陷阱</strong>：2007 AHA 指南后，<strong>单纯 MVP 不再需要 IE 预防</strong>。只有合并反流 / 高危情况才考虑。</li>\n<li><strong>\"房性扩张 → PE\"陷阱</strong>：左房扩张 → 系统性栓塞（脑卒中、TIA），<strong>不</strong>是肺栓塞（PE 来自右心/下肢深静脉）。</li>\n<li><strong>\"无症状 = 不发生心律失常\"陷阱</strong>：MVP 罕见但可发生室性心律失常。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Mitral valve prolapse</strong>:</p>\n<ul>\n<li>Seen in up to <strong>10% of population</strong> → most common valvular abnormality</li>\n<li><strong>More common in women</strong></li>\n<li>Often asymptomatic; may present with <strong>palpitations, shortness of breath</strong>, rarely chest pain or severe complications</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (more common in men): <strong>Wrong</strong> — more common in women than men.</li>\n<li><strong>B</strong> (IE prophylaxis recommended): <strong>No longer recommended</strong> for valvular lesions per 2007 AHA guideline. Prophylaxis indications include: bicuspid aortic valve, acquired aortic or mitral valve disease (including MVP <strong>with regurgitation</strong>), HCM with latent or resting obstruction.</li>\n<li><strong>D</strong> (high PE risk): If MVP leads to <strong>atrial enlargement and blood stagnation</strong>, there is increased risk of <strong>systemic thromboembolism</strong>; however, risk of <strong>pulmonary embolism is extremely low</strong>.</li>\n<li><strong>E</strong> (ventricular arrhythmias do not occur): <strong>Rarely</strong>, supraventricular and ventricular tachyarrhythmias are found in patients with MVP.</li>\n</ul>", "references": "<ul>\n<li>Medscape — Mitral Valve Prolapse</li>\n<li>AHA 2007 — Prevention of Infective Endocarditis</li>\n<li>（待补：ACC/AHA 2020 瓣膜病指南）</li>\n</ul>", "related": ["AMC-Q0239-Aortic-Stenosis-Cardiac-Output", "MOC-Cardiology", "Topic-Valvular-Diseases"], "bodyHtml": "", "diseases": [], "complaints": ["palpitations"], "search": "二尖瓣脱垂（mvp）— 流行病学（人群 10%，女性多见）\nmitral valve prolapse mvp epidemiology mid-systolic click late systolic murmur\ndefinition diagnosis physical-exam\n a 25-year-old woman comes to your practice with complaints of 'skipped heart beats'. on examination, she has a blood pressure of 110/85 mmhg and pulse of 88 bpm. heart auscultation is remarkable for a  mid-systolic click  followed by a  late systolic murmur . echocardiography shows mitral valve prolapse (mvp). which one of the following is correct about her condition? \n correct answer is  c  \n  mitral valve prolapse : \n \n seen in up to  10% of population  → most common valvular abnormality \n  more common in women  \n often asymptomatic; may present with  palpitations, shortness of breath , rarely chest pain or severe complications \n \n  why not the others : \n \n  a  (more common in men):  wrong  — more common in women than men. \n  b  (ie prophylaxis recommended):  no longer recommended  for valvular lesions per 2007 aha guideline. prophylaxis indications include: bicuspid aortic valve, acquired aortic or mitral valve disease (including mvp  with regurgitation ), hcm with latent or resting obstruction. \n  d  (high pe risk): if mvp leads to  atrial enlargement and blood stagnation , there is increased risk of  systemic thromboembolism ; however, risk of  pulmonary embolism is extremely low . \n  e  (ventricular arrhythmias do not occur):  rarely , supraventricular and ventricular tachyarrhythmias are found in patients with mvp. \n "}, {"id": "AMC-Q0239", "type": "mcq", "qid": 239, "title": "主动脉狭窄 55 mmHg 压差 — 需心输出量定手术指征", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis", "treatment"], "topic": ["Aortic Stenosis", "Pressure Gradient", "Cardiac Output", "Surgical Threshold"], "difficulty": 4, "correctAnswer": "D", "page": 29, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aortic-stenosis", "hemodynamics", "valve-replacement", "approach-investigation", "approach-diagnosis", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0239-Aortic-Stenosis-Cardiac-Output.md", "stem": "<p>A patient with aortic stenosis has undergone cardiac catheterization. You are told that the aortic systolic gradient is 55 mmHg. Which one of the following additional piece of information is necessary to determine the significance of the gradient?</p>", "options": [{"letter": "A", "text": "Presence of coronary artery disease"}, {"letter": "B", "text": "Left ventricular ejection fraction"}, {"letter": "C", "text": "Left ventricular end-diastolic pressure"}, {"letter": "D", "text": "Cardiac output"}, {"letter": "E", "text": "Left atrial pressure"}], "rationale": "<p>1. <strong>题型识别</strong>：血流动力学解读题。给一个数（55 mmHg）→ 问<strong>还需要什么信息</strong>才能下决策。 2. <strong>基础物理</strong>：</p>\n<ul>\n<li>跨瓣压差 ∝ CO²（简化的 Bernoulli 方程：ΔP = 4v²，v 与 CO 相关）</li>\n<li>CO 下降 → 即使狭窄严重，<strong>压差也可能不很高</strong></li>\n<li>反之，CO 正常 + 压差 55 → 真严重狭窄</li>\n<p>3. <strong>临床场景</strong>：</p>\n<li>AS 患者可能因 LV 失代偿而<strong>低心排</strong></li>\n<li>此时 55 mmHg 压差可能<strong>低估</strong>实际狭窄程度</li>\n<li>需要 CO 来校正</li>\n<p>4. <strong>决策阈值</strong>：</p>\n<li>即使 CO 正常，<strong>>50 mmHg 压差</strong>就考虑手术</li>\n<li>CO 下降时这个阈值要重新评估</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (CAD)：合并 CAD 影响手术决策，但<strong>不</strong>直接解读压差</li>\n<li>B (LVEF)：影响预后，但<strong>压差判断核心是 CO</strong>（EF 低 CO 不一定低）</li>\n<li>C (LVEDP)：反映 LV 充盈压，对症状评估有用</li>\n<li>E (LAP)：反映左房压，对肺淤血评估有用</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"压差 = 严重度\"陷阱</strong>：压差 ∝ CO²。<strong>低 CO → 压差小 ≠ 狭窄轻</strong>。必须看 CO。</li>\n<li><strong>\"EF = CO\"陷阱</strong>：EF 是 EF，CO 是 CO。EF 正常 + CO 正常 = 不同情况。</li>\n<li><strong>\"压差 > 50 mmHg = 必须手术\"陷阱</strong>：单看压差阈值不够，要结合 CO、症状、EF 综合判断。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>An aortic systolic gradient of <strong>55 mmHg</strong> means that during systole, the pressure in the aorta is 55 mmHg lower than in the LV. <strong>Normal gradient is < 10 mmHg</strong>.</p>\n<p><strong>With aortic stenosis</strong>:</p>\n<ul>\n<li>Cardiac output is <strong>diminished</strong> because the stenotic valve impedes blood outflow</li>\n<li>Therefore, <strong>cardiac output is the determinant</strong> of whether immediate surgical valve replacement should be considered</li>\n</ul>\n<p><strong>Important principle</strong>:</p>\n<ul>\n<li>Pressure gradient ∝ CO² (simplified Bernoulli: ΔP = 4v²)</li>\n<li><strong>Low CO → low gradient → may underestimate stenosis severity</strong></li>\n<li>Need CO to correctly interpret any given gradient</li>\n</ul>\n<p><strong>Surgical threshold</strong>:</p>\n<ul>\n<li>Even with <strong>normal CO</strong>, a gradient > 50 mmHg warrants surgical valve replacement</li>\n<li>With low CO, the threshold is harder to interpret → need additional data (valve area calculation via Gorlin formula, dobutamine stress echo)</li>\n</ul>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (CAD): Affects surgical planning but not gradient interpretation</li>\n<li><strong>B</strong> (LVEF): Affects prognosis; CO is more direct for gradient interpretation</li>\n<li><strong>C</strong> (LVEDP): Reflects LV filling pressure</li>\n<li><strong>E</strong> (LAP): Reflects LA pressure / pulmonary congestion risk</li>\n</ul>", "references": "<ul>\n<li>AMC Handbook of Multiple Choice Questions — page 435</li>\n<li>Medscape — Aortic Stenosis</li>\n<li>（待补：ACC/AHA 2020 瓣膜病指南）</li>\n</ul>", "related": ["AMC-Q0237-Pregnancy-MS-Complications", "AMC-Q0238-MVP-Epidemiology", "MOC-Cardiology", "Topic-Valvular-Diseases"], "bodyHtml": "", "diseases": ["Aortic Stenosis"], "complaints": [], "search": "主动脉狭窄 55 mmhg 压差 — 需心输出量定手术指征\naortic stenosis pressure gradient cardiac output surgical threshold\ninvestigation diagnosis treatment\n a patient with aortic stenosis has undergone cardiac catheterization. you are told that the aortic systolic gradient is 55 mmhg. which one of the following additional piece of information is necessary to determine the significance of the gradient? \n correct answer is  d  \n an aortic systolic gradient of  55 mmhg  means that during systole, the pressure in the aorta is 55 mmhg lower than in the lv.  normal gradient is  . \n  with aortic stenosis : \n \n cardiac output is  diminished  because the stenotic valve impedes blood outflow \n therefore,  cardiac output is the determinant  of whether immediate surgical valve replacement should be considered \n \n  important principle : \n \n pressure gradient ∝ co² (simplified bernoulli: δp = 4v²) \n  low co → low gradient → may underestimate stenosis severity  \n need co to correctly interpret any given gradient \n \n  surgical threshold : \n \n even with  normal co , a gradient > 50 mmhg warrants surgical valve replacement \n with low co, the threshold is harder to interpret → need additional data (valve area calculation via gorlin formula, dobutamine stress echo) \n \n  why not the others : \n \n  a  (cad): affects surgical planning but not gradient interpretation \n  b  (lvef): affects prognosis; co is more direct for gradient interpretation \n  c  (lvedp): reflects lv filling pressure \n  e  (lap): reflects la pressure / pulmonary congestion risk \n "}, {"id": "AMC-Q0240", "type": "mcq", "qid": 240, "title": "症状性窦缓 — 阿托品是一线", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "physical-exam"], "topic": ["Symptomatic Sinus Bradycardia", "Atropine", "First-line", "Pacing Threshold"], "difficulty": 2, "correctAnswer": "B", "page": 30, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "bradycardia", "atropine", "pacemaker", "approach-treatment", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0240-Sinus-Bradycardia-Atropine.md", "stem": "<p>A 39-year-old woman presents with dizziness after she left the gym. An ECG is obtained and is as the accompanying photograph. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Reassurance"}, {"letter": "B", "text": "Intravenous atropine"}, {"letter": "C", "text": "Transcutaneous pacemaker"}, {"letter": "D", "text": "Intravenous pacemaker"}, {"letter": "E", "text": "Adrenaline"}], "rationale": "<p>1. <strong>题型识别</strong>：缓慢性心律失常处理。关键判断 = <strong>有无症状</strong>。 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>39 岁女性、健身后头晕</li>\n<li>ECG：窦性心动过缓 50 bpm</li>\n<li><strong>症状 = 头晕</strong>（症状性）</li>\n<p>3. <strong>缓慢性心律失常处理算法</strong>：</p>\n<li><strong>无症状</strong> → 观察 / 安抗</li>\n<li><strong>有症状</strong> → 药物 + 起搏</li>\n<li><strong>一线：IV 阿托品 500-600 mcg</strong>（每 3-5 min 重复，最多 3 mg）</li>\n<li>二线：IV 肾上腺素 2-10 mcg/min</li>\n<li>三线：起搏器</li>\n<p>4. <strong>起搏器阈值</strong>（才考虑起搏）：</p>\n<li>药物无效</li>\n<li>高度阻滞（II 型 Mobitz、三度）</li>\n<li>脉搏 < 40</li>\n<li>心室停搏 > 3 s</li>\n<li>近期 asystole 史</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Reassurance)：有症状 = 不能只安抗</li>\n<li>C (Transcutaneous pacer)：未到阈值</li>\n<li>D (IV pacer)：未到阈值（且需专科会诊）</li>\n<li>E (Adrenaline)：二线</li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"无症状\"陷阱</strong>：题说\"dizziness\"（头晕）= 有症状 → 不可只安抗。</li>\n<li><strong>\"心率慢 = 起搏\"陷阱</strong>：先药物（阿托品），无效才起搏。</li>\n<li><strong>\"阿托品 = 万能\"陷阱</strong>：阿托品对<strong>窦缓</strong>和<strong>AV 结水平阻滞</strong>有效；对 Mobitz II 常无效（题库高频陷阱）。</li>\n<li><strong>\"Adrenaline 是一线\"陷阱</strong>：Adrenaline 是<strong>二线</strong>。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The rhythm strip shows <strong>sinus bradycardia</strong> with a rate of <strong>50 bpm</strong>.</p>\n<p><strong>Asymptomatic bradycardias</strong> are usually left alone. If symptomatic, symptoms can include:</p>\n<ul>\n<li>Pre-syncope or syncope (faint)</li>\n<li>Shortness of breath</li>\n<li>Lightheadedness (dizziness)</li>\n<li>Chest pain</li>\n</ul>\n<p><strong>Management of symptomatic bradycardia</strong>:</p>\n<p><strong>Medical management</strong>:</p>\n<ul>\n<li><strong>Atropine (IV 500-600 mcg, repeat every 3-5 min up to 3 mg)</strong> — best initial management</li>\n<li><strong>Adrenaline (IV infusion 2-10 mcg/min)</strong> to maintain satisfactory heart rate — second-line</li>\n<li>Pacemaker insertion</li>\n</ul>\n<p><strong>Consider pacemaker for</strong>:</p>\n<ul>\n<li>Patients who do not respond adequately to medical therapy</li>\n<li>Patients at risk of asystole:</li>\n<li>History of recent asystole</li>\n<li>Mobitz II AV block on ECG</li>\n<li>3rd degree AV block on ECG</li>\n<li>Pulse < 40 bpm</li>\n<li>Ventricular standstill > 3 seconds</li>\n<li>Initial pacing is <strong>percutaneous (transcutaneous) in the ED</strong></li>\n<li>IV pacemaker insertion needs specialist referral</li>\n<li>Permanent pacing is followed electively if needed</li>\n</ul>\n<p><strong>This patient should be given atropine as the best initial management.</strong></p>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>Medscape — Sinus Bradycardia</li>\n<li>（待补：ANZCOR / ARC ALS 指南）</li>\n</ul>", "related": ["AMC-Q0222-First-Degree-AVB-Reassure", "AMC-Q0228-Mobitz-II-IV-Pacemaker", "TR-Second-Degree-AV-Block", "MOC-Cardiology", "Topic-Bradyarrhythmia-Management"], "bodyHtml": "", "diseases": [], "complaints": ["dizziness"], "search": "症状性窦缓 — 阿托品是一线\nsymptomatic sinus bradycardia atropine first-line pacing threshold\ntreatment physical-exam\n a 39-year-old woman presents with dizziness after she left the gym. an ecg is obtained and is as the accompanying photograph. which one of the following is the next best step in management? \n correct answer is  b  \n the rhythm strip shows  sinus bradycardia  with a rate of  50 bpm . \n  asymptomatic bradycardias  are usually left alone. if symptomatic, symptoms can include: \n \n pre-syncope or syncope (faint) \n shortness of breath \n lightheadedness (dizziness) \n chest pain \n \n  management of symptomatic bradycardia : \n  medical management : \n \n  atropine (iv 500-600 mcg, repeat every 3-5 min up to 3 mg)  — best initial management \n  adrenaline (iv infusion 2-10 mcg/min)  to maintain satisfactory heart rate — second-line \n pacemaker insertion \n \n  consider pacemaker for : \n \n patients who do not respond adequately to medical therapy \n patients at risk of asystole: \n history of recent asystole \n mobitz ii av block on ecg \n 3rd degree av block on ecg \n pulse  \n ventricular standstill > 3 seconds \n initial pacing is  percutaneous (transcutaneous) in the ed  \n iv pacemaker insertion needs specialist referral \n permanent pacing is followed electively if needed \n \n  this patient should be given atropine as the best initial management.  "}, {"id": "AMC-Q0241", "type": "mcq", "qid": 241, "title": "三度房室传导阻滞 — 立即经皮起搏（不要先阿托品）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "complications"], "topic": ["Third-Degree AV Block", "Complete Heart Block", "Transcutaneous Pacemaker", "Atropine", "Emergency Pacing"], "difficulty": 4, "correctAnswer": "C", "page": 32, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "av-block", "complete-heart-block", "pacemaker", "approach-treatment", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0241-Third-Degree-AVB-Pacing.md", "stem": "<p>A 70-year-old man presents to the Emergency Department with chest discomfort, shortness of breath and pre-syncope. An ECG is obtained and is as follows. Which one of the following is the most appropriate immediate management of this patient?</p>", "options": [{"letter": "A", "text": "Atropine"}, {"letter": "B", "text": "Adrenaline"}, {"letter": "C", "text": "Transcutaneous pacemaker"}, {"letter": "D", "text": "Synchronized DC cardioversion"}, {"letter": "E", "text": "Intravenous fluids"}], "rationale": "<p>1. <strong>题型识别</strong>：70 岁男性 + 胸痛 + 呼吸困难 + pre-syncope + ECG = 三度 AVB → 缓慢性心律失常急救 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>老年人、典型 Adams-Stokes 征（脑供血不足）</li>\n<li>ECG：P 波与 QRS 完全无关，PP 规则、RR 规则、PR 不固定 → <strong>三度 AVB</strong></li>\n<p>3. <strong>三度 AVB 急救算法</strong>（与一般窦缓不同）：</p>\n<li><strong>阿托品对窦缓 / 房室结水平阻滞有效</strong></li>\n<li><strong>阿托品对三度 AVB（希氏束以下）常无效</strong>（因为阻滞在房室结远端，迷走张力干预不到）</li>\n<li>急救 = <strong>立即经皮起搏</strong>（transcutaneous pacing）</li>\n<li>阿托品：起搏来不及前的<strong>桥接</strong>用药</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Atropine)：在三度 AVB 价值有限，不是\"最适 immediate\"</li>\n<li>B (Adrenaline)：缓慢性心律失常的二线，且心率慢不到危极不用</li>\n<li>C (Transcutaneous pacemaker)：<strong>正确</strong>（立即起搏）</li>\n<li>D (Synchronized DC cardioversion)：用于<strong>快速性</strong>心律失常（VT/AF），不是缓慢性</li>\n<li>E (IV fluids)：容量不足时才考虑，不是首选</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"症状性心动过缓 = 阿托品\"陷阱</strong>：一般窦缓是这样，但<strong>三度 AVB 是例外</strong>——阿托品无效，<strong>立即起搏</strong>。</li>\n<li><strong>\"Cardioversion 万能\"陷阱</strong>：cardioversion 是给<strong>快速性</strong>心律失常的（VT、AF、AFL、PSVT），缓慢性不能用。</li>\n<li><strong>\"IV fluids = 急救\"陷阱</strong>：容量不足才用，否则会加重心衰（本例已有呼吸困难）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The ECG is suggestive of <strong>third-degree (complete) heart block</strong>.</p>\n<p>Although <strong>atropine is used as first-line therapy for symptomatic bradycardias</strong>, in <strong>complete heart block emergency rescue transcutaneous pacemaker is the management of choice</strong>. Atropine should be given if emergency pacing cannot be done immediately.</p>\n<p><strong>Key teaching point</strong>:</p>\n<ul>\n<li>Atropine works on the AV node (parasympathetic blocker)</li>\n<li>In <strong>infra-nodal block</strong> (Mobitz II, 3rd-degree), the escape rhythm is below the AV node and <strong>does not respond to atropine</strong></li>\n<li><strong>Pacemaker is the definitive emergency treatment</strong></li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ANZCOR / ARC ALS 缓慢性心律失常章节）</li>\n</ul>", "related": ["AMC-Q0222-First-Degree-AVB-Reassure", "AMC-Q0228-Mobitz-II-IV-Pacemaker", "AMC-Q0240-Sinus-Bradycardia-Atropine", "TR-Second-Degree-AV-Block", "MOC-Cardiology", "Topic-Bradyarrhythmia-Management"], "bodyHtml": "", "diseases": ["AV Block (3°)"], "complaints": ["dyspnea", "syncope/collapse", "chest pain", "dizziness"], "search": "三度房室传导阻滞 — 立即经皮起搏（不要先阿托品）\nthird-degree av block complete heart block transcutaneous pacemaker atropine emergency pacing\ntreatment diagnosis complications\n a 70-year-old man presents to the emergency department with chest discomfort, shortness of breath and pre-syncope. an ecg is obtained and is as follows. which one of the following is the most appropriate immediate management of this patient? \n correct answer is  c  \n the ecg is suggestive of  third-degree (complete) heart block . \n although  atropine is used as first-line therapy for symptomatic bradycardias , in  complete heart block emergency rescue transcutaneous pacemaker is the management of choice . atropine should be given if emergency pacing cannot be done immediately. \n  key teaching point : \n \n atropine works on the av node (parasympathetic bl
