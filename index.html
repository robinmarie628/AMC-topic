 of warfarin."}], "rationale": "<p>1. 题型识别：检查 — 抗凝相关出血的评估 2. 鉴别诊断（大腿肿胀）：</p>\n<ul>\n<li><strong>血肿</strong>（首选）：胺碘酮-华法林相互作用 → 出血倾向</li>\n<li>DVT：正在抗凝治疗，可能性较低但不排除</li>\n<li>蜂窝织炎：无发热、不红不热 → 可能性低</li>\n<p>3. 首选检查：<strong>INR</strong>——高于治疗范围（2-3）使血肿诊断更确定（但出血也可发生在治疗范围内） 4. 排除：</p>\n<li>双功能多普勒超声（A）：排除 DVT 或评估血肿可稍后考虑</li>\n<li>血培养/抗生素（B/D）：针对蜂窝织炎——无发热红热，不适用</li>\n<li>减量华法林（E）：<strong>仅当 INR 高于治疗范围时</strong>才考虑</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>\"出血也可在治疗范围内 INR\"</strong>：INR 升高使诊断更确定，但治疗范围内甚至低于治疗范围发生出血并不少见——别因此否定血肿</li>\n<li><strong>先查 INR 再决定是否减量</strong>：是否减量/停药取决于 INR 结果，不可先行动</li>\n<li><strong>与 Q1210 对比</strong>：上题问\"最可能的病因\"（血肿），本题问\"下一步检查\"（INR）——同一场景的两个角度</li>\n</ul>", "summary": "<p><strong>胺碘酮-华法林相互作用</strong>：</p>\n<ul>\n<li>胺碘酮抑制华法林肝代谢 → 华法林效应增强 → INR 升高 → 出血风险</li>\n<li>新加胺碘酮后 1 周内应监测 INR 并调整华法林</li>\n</ul>\n<p><strong>大腿肿胀评估流程</strong>： 1. 病史 + 查体（温度、红、热、发热） 2. <strong>INR</strong>（抗凝背景）→ 血肿首选 3. 超声（排除 DVT / 评估血肿） 4. 感染证据（发热/红热）→ 血培养 + 抗生素</p>", "explanation": "<p>该患者新加胺碘酮（抑制华法林代谢）→ 出血倾向增加 → 大腿血肿是最可能诊断。无发热、不红不热使蜂窝织炎可能性低；抗凝治疗中 DVT 可能但较低。<strong>测量 INR 是评估血肿最合适的初始步骤</strong>——高于治疗范围（2-3）使诊断更确定，但出血也可能发生在治疗或亚治疗范围内。若 INR 高于治疗范围，才考虑减量或停用华法林。</p>", "references": "<ul>\n<li>https://www.nzwcs.org.nz/images/publications/Pagan-Hunter_WPR_19-01.pdf</li>\n<li>https://www.racgp.org.au/download/documents/AFP/2010/July/201007tadros_warfain.pdf</li>\n</ul>", "related": ["AMC-Q1210-Warfarin-Amiodarone-Hematoma", "_MOC-Haematology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "华法林+胺碘酮大腿血肿 — 首选查 inr\n华法林+胺碘酮血肿 — 首选查 inr\n a 69-year-old man presents to the emergency department with a painful swollen left thigh. his current medications include metformin 500 mg 8-hourly for diabetes, valsartan 80 mg daily for hypertension, atorvastatin 10mg daily for hypercholesterolemia, and warfarin 5mg daily for chronic atrial fibrillation. one week earlier, he was started on amiodarone after he was diagnosed with ventricular tachycardia (vt). on physical examination, he has a blood pressure of 138/87mmhg, pulse rate of 82 pm and a temperature of 36.6°c. the left thigh is painful, swollen and slightly tender but not warm or red. the affected leg circumference is 5 cm greater than the unaffected one. which one of the following options is the most appropriate next step in management? \n 该患者新加胺碘酮（抑制华法林代谢）→ 出血倾向增加 → 大腿血肿是最可能诊断。无发热、不红不热使蜂窝织炎可能性低；抗凝治疗中 dvt 可能但较低。 测量 inr 是评估血肿最合适的初始步骤 ——高于治疗范围（2-3）使诊断更确定，但出血也可能发生在治疗或亚治疗范围内。若 inr 高于治疗范围，才考虑减量或停用华法林。 "}, {"id": "AMC-QNA-P009", "type": "mcq", "qid": 0, "title": "DVT 后管理 — Caval Filter 适用什么情况？", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "prevention", "complications"], "topic": ["Deep Vein Thrombosis", "Anticoagulation", "Inferior Vena Cava Filter", "Contraindications to Anticoagulation"], "difficulty": 4, "correctAnswer": "E", "page": 9, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "anticoagulation", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-QNA-P009-DVT-Management-With-IVC-Filter.md", "stem": "<p><strong>John, 35 years old</strong>, presents to the emergency department with <strong>pain and swelling of his left thigh</strong> since this morning. Investigations establish the diagnosis of <strong>deep venous thrombosis (DVT)</strong> for which he is started on <strong>heparin in hospital</strong>.</p>\n<p>He has <strong>diabetes</strong> and <strong>hypertension</strong>, and his wife mentions he is very busy and distracted and <strong>always forgets to take the drugs</strong> he is prescribed for his hypertension and diabetes.</p>\n<p>Which one of the following options would be the <strong>most appropriate management</strong> for him after the course of heparin is completed?</p>", "options": [{"letter": "A", "text": "No more treatment is needed"}, {"letter": "B", "text": "Warfarin for 6 months"}, {"letter": "C", "text": "Aspirin for 6 months"}, {"letter": "D", "text": "Surgical intervention"}, {"letter": "E", "text": "Caval filter"}], "rationale": "<p>1. <strong>题型识别</strong>：诊断已明（DVT，已用 heparin 急性处理）→ 问\"heparin 完成后\"的长期策略。 2. <strong>标准 DVT 管理路径</strong>：</p>\n<ul>\n<li><strong>急性</strong>：UFH 或 LMWH → Warfarin 重叠 5d，INR > 2 连两次后停肝素</li>\n<li><strong>长期</strong>：Warfarin ≥ 3 个月（按再发风险调整）</li>\n<p>3. <strong>本题关键差异化线索</strong>：妻子说他\"总忘记吃药\" → <strong>依从性差 → 不能可靠 long-term 抗凝</strong> 4. <strong>IVC filter 适用情境</strong>（interpretation 来源 explanation）：</p>\n<li><strong>抗凝禁忌</strong>：出血性卒中、近期神经手术/大手术、大创伤、活动出血、颅内肿瘤、出血体质、妊娠、易跌倒</li>\n<li><strong>抗凝依从性差</strong>：本题情境 ✔</li>\n<li><strong>抗凝失败</strong>：抗凝过程中复发</li>\n<p>5. <strong>逐项匹配</strong>：</p>\n<li>A 不治 → ✘ 标准必须 ≥ 3 月抗凝</li>\n<li>B Warfarin 6m → 标准，但是患者依从性差 → 风险高</li>\n<li>C Aspirin → ✘ DVT 后抗血小板不等于抗凝</li>\n<li>D 手术 → ✘ 极特殊例外，不在此题适用</li>\n<li><strong>E IVC filter → ✔</strong> 因为 <em>无法可靠抗凝</em></li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"标准答案\"陷阱</strong>：看到 DVT 直觉选 Warfarin，但 <em>忽略依从性</em> 提示 → 错选 B。</li>\n<li><strong>抗凝禁忌清单容易漏</strong>：出血体质、近期手术、怀孕、易跌倒都算禁忌。</li>\n<li><strong>IVC filter ≠ 治愈 DVT</strong>：它仅 <em>防 PE</em>，DVT 本身仍可能进展，需随访。</li>\n<li><strong>Aspirin ≠ Anticoagulant</strong>：抗血小板不等于抗凝 → 不能替代 Warfarin。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p><strong>Treatment of DVT starts</strong>: 1. <strong>UFH or LMWH</strong> 2. Warfarin 同日（或 48h 内）启动 3. Heparin 在 INR > 2 连两次后停 4. <strong>Warfarin 持续 ≥ 3 个月</strong></p>\n<p><strong>Caval filters</strong> = systemic anticoagulation 的替代，适用于：</p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>具体条件</th></tr></thead>\n<tbody>\n<tr><td><strong>抗凝禁忌</strong></td><td>出血性卒中、近期神经/大手术、大或多发创伤、活动出血、颅内肿瘤、出血体质（ITP、血友病）、<strong>妊娠</strong>、易跌倒（卒中后、PD）</td></tr>\n<tr><td><strong>抗凝依从差</strong></td><td><strong>本题情境</strong></td></tr>\n<tr><td><strong>抗凝并发症</strong></td><td>抗凝中出血</td></tr>\n<tr><td><strong>抗凝失败</strong></td><td>充分抗凝仍发 PE</td></tr>\n</tbody>\n</table>\n<p><strong>Pre-heparin labs</strong> (出血 / 易栓筛查)：</p>\n<ul>\n<li>APTT、INR、Platelet count</li>\n<li>Thrombophilia screen：APC resistance、homocysteine、prothrombin G20210A、ATIII、protein C、protein S、lupus anticoagulant、anticardiolipin Ab</li>\n</ul>\n<p><strong>临床注意点</strong>：</p>\n<ul>\n<li>33% 患者在\"充分抗凝\"中仍发 PE</li>\n<li>IVC filter 是预防 PE，DVT 仍需处理</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/419796-overv</li>\n<li>http://www.ncbi.nlm.nih.gov/pubmed/22698970</li>\n</ul>", "related": ["AMC-QNA-P006-Orthostatic-Hypotension", "TR-DVT-Prophylaxis-Indications", "Topic-Anticoagulation-Management", "Topic-IVC-Filter-Indications"], "bodyHtml": "", "diseases": ["DVT"], "complaints": [], "search": "dvt 后管理 — caval filter 适用什么情况？\ndeep vein thrombosis anticoagulation inferior vena cava filter contraindications to anticoagulation\ntreatment prevention complications\n  john, 35 years old , presents to the emergency department with  pain and swelling of his left thigh  since this morning. investigations establish the diagnosis of  deep venous thrombosis (dvt)  for which he is started on  heparin in hospital . \n he has  diabetes  and  hypertension , and his wife mentions he is very busy and distracted and  always forgets to take the drugs  he is prescribed for his hypertension and diabetes. \n which one of the following options would be the  most appropriate management  for him after the course of heparin is completed? \n correct answer is  e  \n  treatment of dvt starts : 1.  ufh or lmwh  2. warfarin 同日（或 48h 内）启动 3. heparin 在 inr > 2 连两次后停 4.  warfarin 持续 ≥ 3 个月  \n  caval filters  = systemic anticoagulation 的替代，适用于： \n \n   类别  具体条件   \n \n   抗凝禁忌   出血性卒中、近期神经/大手术、大或多发创伤、活动出血、颅内肿瘤、出血体质（itp、血友病）、 妊娠 、易跌倒（卒中后、pd）  \n   抗凝依从差    本题情境   \n   抗凝并发症   抗凝中出血  \n   抗凝失败   充分抗凝仍发 pe  \n \n \n  pre-heparin labs  (出血 / 易栓筛查)： \n \n aptt、inr、platelet count \n thrombophilia screen：apc resistance、homocysteine、prothrombin g20210a、atiii、protein c、protein s、lupus anticoagulant、anticardiolipin ab \n \n  临床注意点 ： \n \n 33% 患者在\"充分抗凝\"中仍发 pe \n ivc filter 是预防 pe，dvt 仍需处理 \n "}, {"id": "AMC-QNA-P011", "type": "mcq", "qid": 11, "title": "孕妇 DVT — 治疗性 LMWH", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "prevention", "complications"], "topic": ["DVT", "Pregnancy", "Anticoagulation", "LMWH", "Warfarin Embryopathy"], "difficulty": 4, "correctAnswer": "A", "page": 11, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "pregnancy", "anticoagulation", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-QNA-P011-DVT-Pregnancy-LMWH.md", "stem": "<p>A 32-year-old pregnant woman presents to the Emergency Department at 32 weeks pregnancy with right calf swelling and tenderness which is diagnosed as deep vein thrombosis (DVT). Which one of the following is the most appropriate management?</p>", "options": [{"letter": "A", "text": "Therapeutic dose of low molecular weight heparin for 3 months"}, {"letter": "B", "text": "Prophylactic dose of low molecular weight heparin for 3 months"}, {"letter": "C", "text": "No treatment is needed"}, {"letter": "D", "text": "Termination of pregnancy"}, {"letter": "E", "text": "Start her on warfarin and continue for 6 months with strict INR monitoring"}], "rationale": "<p>1. <strong>题型识别</strong>：妊娠期 + 抗凝药选择 → 排除题（哪一项最合适）。 2. <strong>临床关键信息</strong>：</p>\n<ul>\n<li>32 周孕妇</li>\n<li>确诊 DVT</li>\n<p>3. <strong>治疗路径</strong>：</p>\n<li>妊娠期 DVT → 治疗剂量 LMWH（皮下注射）</li>\n<li>持续到分娩（约 8 周）+ 产后 6 周 ≥ 14 周</li>\n<li>总疗程 ≥ 3 个月（12 周）= 选项 A</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>B：预防剂量不够（已有 DVT 需治疗）</li>\n<li>C：DVT 不治 → PE 致死</li>\n<li>D：终止妊娠 — 无医学指征</li>\n<li>E：Warfarin 妊娠期<strong>致畸</strong>（6-13 周暴露 → 5% 胎儿 warfarin 综合征）</li>\n<p>5. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>E 看似合理但致命</strong>：Warfarin 6 个月 + INR 监测是 <em>非妊娠</em> DVT 的标准方案，但<strong>妊娠期绝对禁忌</strong>。容易中招因为其它抗凝细节（3 个月、INR 监测）都对。</li>\n<li><strong>A vs B</strong>：治疗剂量（1 mg/kg bid）vs 预防剂量（enoxaparin 40 mg qd）差 10 倍。已有血栓 → 治疗剂量。</li>\n<li><strong>产后处理</strong>：3 个月治疗期结束后，可考虑改预防剂量再 3 个月（解释里提到）。</li>\n<li><strong>PE 患者例外</strong>：血流动力学不稳的 PE → 起始用未分级肝素（UH），稳定后切换 LMWH。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Current guidelines recommend that pregnant women with deep vein thrombosis (DVT) should be started on <strong>therapeutic dose of subcutaneous low molecular weight heparin (LMWH)</strong> for the remainder of their pregnancy and at least 6 weeks postpartum. A minimum of 3 months (12 weeks) of treatment with therapeutic dose must be provided.</p>\n<ul>\n<li><strong>PE 患者</strong>（无论是否妊娠）：起始用未分级肝素（UH），稳定后切 LMWH。</li>\n<li><strong>近端 DVT / PE</strong>：疗程最少 6 个月。</li>\n<li>本例 32 周起病，剩约 8 周孕期 + 6 周产后 = 14 周治疗，产后另加 3 个月预防剂量。</li>\n</ul>\n<p><strong>Warfarin 妊娠期禁忌</strong>：</p>\n<ul>\n<li><strong>Warfarin embryopathy (fetal warfarin syndrome / DiSala syndrome)</strong> 发生于孕 6-13 周暴露</li>\n<li>5% 胎儿受累</li>\n<li>表现：</li>\n<li>鼻梁发育不全（hypoplasia of nasal bridge）、鼻尖深沟</li>\n<li>喉软骨软化病（laryngomalacia）</li>\n<li>鸡胸（pectus carinatum）</li>\n<li>乳头间距过宽</li>\n<li>先天性心脏病</li>\n<li>脑室扩大、胼胝体发育不全</li>\n<li>点状骨骺（stippled epiphyses）</li>\n<li>短指（brachydactyly）、甲发育不全</li>\n<li>重度智力低下、耳聋、肌张力低、喂养困难</li>\n<li>低出生体重、生长迟缓</li>\n<li>孕中 / 晚期暴露：额外 5% 胎儿脑出血风险</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular (Per Page 11 PDF)</li>\n<li>（待补：ASH/ACOG 妊娠期 VTE 指南链接）</li>\n</ul>", "related": ["AMC-QNA-P009-DVT-Management-With-IVC-Filter", "TR-DVT-Prophylaxis-Indications", "MOC-Haematology", "Topic-VTE-in-Pregnancy"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "孕妇 dvt — 治疗性 lmwh\ndvt pregnancy anticoagulation lmwh warfarin embryopathy\ntreatment prevention complications\n a 32-year-old pregnant woman presents to the emergency department at 32 weeks pregnancy with right calf swelling and tenderness which is diagnosed as deep vein thrombosis (dvt). which one of the following is the most appropriate management? \n correct answer is  a  \n current guidelines recommend that pregnant women with deep vein thrombosis (dvt) should be started on  therapeutic dose of subcutaneous low molecular weight heparin (lmwh)  for the remainder of their pregnancy and at least 6 weeks postpartum. a minimum of 3 months (12 weeks) of treatment with therapeutic dose must be provided. \n \n  pe 患者 （无论是否妊娠）：起始用未分级肝素（uh），稳定后切 lmwh。 \n  近端 dvt / pe ：疗程最少 6 个月。 \n 本例 32 周起病，剩约 8 周孕期 + 6 周产后 = 14 周治疗，产后另加 3 个月预防剂量。 \n \n  warfarin 妊娠期禁忌 ： \n \n  warfarin embryopathy (fetal warfarin syndrome / disala syndrome)  发生于孕 6-13 周暴露 \n 5% 胎儿受累 \n 表现： \n 鼻梁发育不全（hypoplasia of nasal bridge）、鼻尖深沟 \n 喉软骨软化病（laryngomalacia） \n 鸡胸（pectus carinatum） \n 乳头间距过宽 \n 先天性心脏病 \n 脑室扩大、胼胝体发育不全 \n 点状骨骺（stippled epiphyses） \n 短指（brachydactyly）、甲发育不全 \n 重度智力低下、耳聋、肌张力低、喂养困难 \n 低出生体重、生长迟缓 \n 孕中 / 晚期暴露：额外 5% 胎儿脑出血风险 \n "}, {"id": "TR-Lipid-Profile-Cardiovascular-Drugs", "type": "tr", "qid": 0, "title": "心血管药物对血脂谱的影响 (Effects of Cardiovascular Drugs on Lipid Profile)", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["心血管药物对血脂谱的影响"], "difficulty": 0, "correctAnswer": "", "page": 1435, "tags": [], "cssclass": "tr-cardiology", "color": "#e05a6e", "file": "02-Topic-Reviews/Cardiology/TR-Lipid-Profile-Cardiovascular-Drugs.md", "stem": "<p># 心血管药物对血脂谱的影响 (Effects of Cardiovascular Drugs on Lipid Profile)</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": ["AMC-Q1405-Hydrochlorothiazide-Lipid-Profile", "_MOC-Cardiology"], "bodyHtml": "<h3>完整表格</h3>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>对血脂谱的影响</th></tr></thead>\n<tbody>\n<tr><td>非选择性 β 阻滞剂（普萘洛尔）</td><td>↑TG、↓LDL</td></tr>\n<tr><td>选择性 β1 阻滞剂（阿替洛尔、美托洛尔）</td><td>↑TG</td></tr>\n<tr><td><strong>氢氯噻嗪</strong></td><td>↑TG、↑总胆固醇、<strong>↓HDL</strong>（糖尿病患者或长期使用）</td></tr>\n<tr><td>吲达帕胺</td><td>↑LDL</td></tr>\n<tr><td>氯噻酮</td><td>↑LDL</td></tr>\n<tr><td>奥利司他</td><td>↓HDL</td></tr>\n<tr><td>胆汁酸螯合剂</td><td>↑TG</td></tr>\n<tr><td>Omega-3</td><td>严重高甘油三酯血症患者 ↑LDL</td></tr>\n<tr><td>贝特类（吉非贝齐）</td><td>高甘油三酯血症患者 ↑LDL</td></tr>\n<tr><td>别嘌醇</td><td>↑TG、↑总胆固醇、↑LDL、↑HDL（3 个月后）</td></tr>\n<tr><td>ACEI</td><td>不一致：↓TG、↓总胆固醇、↓LDL、↑HDL</td></tr>\n<tr><td><strong>CCB</strong></td><td><strong>无影响</strong></td></tr>\n</tbody>\n</table>\n<h3>关键记忆点</h3>\n<ul>\n<li><strong>氢氯噻嗪剂量依赖</strong>：6.25-12mg/天无影响；25mg/天仅 ↑TG；<strong>>25mg/天</strong> → ↑总胆固醇 + ↑TG + ↓HDL（尤其糖尿病）</li>\n<li><strong>CCB 不碰血脂</strong>：唯一\"完全无影响\"的大类</li>\n<li><strong>β 阻滞剂</strong>：都 ↑TG；非选择性的还 ↓LDL</li>\n<li><strong>别嘌醇</strong>：血脂四项都可能升（HDL 3 个月后才升）——与噻嗪类鉴别时看 HDL 方向</li>\n<li><strong>参考范围</strong>：总胆固醇 <4 mmol/L；HDL 男 1-1.3、女 1.3-1.5 mmol/L</li>\n</ul>", "diseases": [], "complaints": [], "search": "心血管药物对血脂谱的影响 (effects of cardiovascular drugs on lipid profile)\n心血管药物对血脂谱的影响\n # 心血管药物对血脂谱的影响 (effects of cardiovascular drugs on lipid profile) \n 完整表格 \n \n   药物  对血脂谱的影响   \n \n  非选择性 β 阻滞剂（普萘洛尔）  ↑tg、↓ldl  \n  选择性 β1 阻滞剂（阿替洛尔、美托洛尔）  ↑tg  \n   氢氯噻嗪   ↑tg、↑总胆固醇、 ↓hdl （糖尿病患者或长期使用）  \n  吲达帕胺  ↑ldl  \n  氯噻酮  ↑ldl  \n  奥利司他  ↓hdl  \n  胆汁酸螯合剂  ↑tg  \n  omega-3  严重高甘油三酯血症患者 ↑ldl  \n  贝特类（吉非贝齐）  高甘油三酯血症患者 ↑ldl  \n  别嘌醇  ↑tg、↑总胆固醇、↑ldl、↑hdl（3 个月后）  \n  acei  不一致：↓tg、↓总胆固醇、↓ldl、↑hdl  \n   ccb    无影响   \n \n \n 关键记忆点 \n \n  氢氯噻嗪剂量依赖 ：6.25-12mg/天无影响；25mg/天仅 ↑tg； >25mg/天  → ↑总胆固醇 + ↑tg + ↓hdl（尤其糖尿病） \n  ccb 不碰血脂 ：唯一\"完全无影响\"的大类 \n  β 阻滞剂 ：都 ↑tg；非选择性的还 ↓ldl \n  别嘌醇 ：血脂四项都可能升（hdl 3 个月后才升）——与噻嗪类鉴别时看 hdl 方向 \n  参考范围 ：总胆固醇  \n "}, {"id": "TR-Second-Degree-AV-Block", "type": "tr", "qid": 0, "title": "二度房室传导阻滞（Mobitz I & II）— 知识总结", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis", "physical-exam"], "topic": ["Second-Degree (Mobitz) Heart Block — 二度房室传导阻滞"], "difficulty": 0, "correctAnswer": "", "page": 0, "tags": ["topic-review", "amc", "cardiology", "av-block", "mobitz", "wenckebach", "ecg", "approach-investigation", "approach-diagnosis", "approach-physical-exam"], "cssclass": "tr-cardiology", "color": "#e05a6e", "file": "02-Topic-Reviews/Cardiology/TR-Second-Degree-AV-Block.md", "stem": "<p><strong>二度 AVB</strong> = 部分 P 波不下传（间断性 P 后无 QRS）。分两型，机制、ECG、预后、治疗<strong>完全不同</strong>。</p>\n<ul>\n<li><strong>Mobitz I (Wenckebach)</strong>：PR 逐渐延长直至脱落 → 多为 AV 结病变、良性</li>\n<li><strong>Mobitz II</strong>：PR 恒定、突发脱落 → His-Purkinje 系统病变、可进展为三度 → 高危</li>\n</ul>\n<hr>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p><strong>二度 AVB</strong> = 部分 P 波不下传（间断性 P 后无 QRS）。分两型，机制、ECG、预后、治疗<strong>完全不同</strong>。</p>\n<ul>\n<li><strong>Mobitz I (Wenckebach)</strong>：PR 逐渐延长直至脱落 → 多为 AV 结病变、良性</li>\n<li><strong>Mobitz II</strong>：PR 恒定、突发脱落 → His-Purkinje 系统病变、可进展为三度 → 高危</li>\n</ul>\n<hr>\n<h3>Mobitz I (Wenckebach) — ECG 特征</h3>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>说明</th></tr></thead>\n<tbody>\n<tr><td>PR 间期</td><td>逐搏<strong>逐渐延长</strong>直到 P 后无 QRS</td></tr>\n<tr><td>PR 增量</td><td>第一个增量最大，后续增量递减</td></tr>\n<tr><td>脱落后 PR</td><td><strong>缩短</strong>（回到基线，重新开始循环）</td></tr>\n<tr><td>漏搏间歇</td><td>< 漏搏前两个 RR 之和（典型的\"短长\"特征）</td></tr>\n<tr><td>长序列 (>6:5)</td><td>增量可能极微小直到最后一个 P 突然大脱漏</td></tr>\n<tr><td>关键诊断要点</td><td><strong>脱落后 PR 缩短</strong>（regardless of periodicity 典型与否）</td></tr>\n<tr><td>R-R 关系</td><td>R-R 随 PR 延长而<strong>缩短</strong>（反直觉）</td></tr>\n<tr><td>逸搏</td><td>可有 junctional escape beats 伴 non-conducted P</td></tr>\n</tbody>\n</table>\n<hr>\n<h3>Mobitz II — ECG 特征</h3>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>说明</th></tr></thead>\n<tbody>\n<tr><td>PR 间期</td><td><strong>恒定</strong>（多个连续下传 P 的 PR 相同）</td></tr>\n<tr><td>脱落</td><td>突然一个 P 后<strong>无 QRS</strong></td></tr>\n<tr><td>脱落后 PR</td><td>与脱落前 PR <strong>相同</strong>（不像 Mobitz I 重置）</td></tr>\n<tr><td>漏搏间歇</td><td><strong>= 2× 窦性周期</strong>（精确双倍）</td></tr>\n<tr><td>QRS</td><td>常<strong>宽</strong>（阻滞在 His 以下）</td></tr>\n<tr><td>高危</td><td>可突然进展为<strong>完全性 AVB / 心脏停搏</strong></td></tr>\n</tbody>\n</table>\n<p>⚠️ Mobitz I vs II 的核心鉴别：<strong>PR 是否恒定</strong>。 恒定 → Mobitz II（高危） 渐变 → Mobitz I（多良性）</p>\n<hr>\n<h3>临床意义 / 处理</h3>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>临床意义</th><th>处理</th></tr></thead>\n<tbody>\n<tr><td><strong>Mobitz I</strong></td><td>多为 AV 结病变，迷走张力、缺血、药物（BB、CCB、地高辛）、下壁 MI</td><td>多数无需起搏；停用可疑药物；处理基础病</td></tr>\n<tr><td><strong>Mobitz II</strong></td><td>多为 His-Purkinje 系统病变，前壁 MI、传导系统退行性变</td><td><strong>临时起搏指征</strong>；之后<strong>永久起搏</strong></td></tr>\n</tbody>\n</table>\n<p><strong>临时起搏指征</strong>：</p>\n<ul>\n<li>Asystole 病史</li>\n<li><strong>Mobitz II AVB</strong></li>\n<li>完全性 AVB</li>\n<li>心室停搏 > 3 s</li>\n<li>症状性窦缓 / 窦停，阿托品失败后</li>\n</ul>\n<hr>\n<h3>阿托品位置</h3>\n<ul>\n<li>AV 结水平阻滞（如 Mobitz I）→ 阿托品可改善</li>\n<li>His-Purkinje 水平阻滞（Mobitz II）→ <strong>阿托品常无效</strong>（题中典型表述：\"atropine used but pulse remains the same\"）</li>\n<li>阿托品无效后 → 升级到临时起搏</li>\n</ul>\n<hr>\n<h3>常见考点（高频）</h3>\n<ul>\n<li><strong>\"PR 是否恒定\" → I vs II 鉴别核心</strong></li>\n<li>Mobitz II 几乎<strong>都需要</strong>起搏（临时 → 永久）</li>\n<li>Mobitz I 大多<strong>无需</strong>起搏</li>\n<li>漏搏间歇<strong>精确 2× 窦性周期</strong> = Mobitz II 标志</li>\n<li>漏搏间歇<strong>< 2× 窦性周期</strong> = Mobitz I（PR 增量递减）</li>\n<li>宽 QRS + 恒定 PR + 突发脱落 = Mobitz II（典型\"高危组合\"）</li>\n</ul>\n<hr>", "diseases": ["AV Block (2°)"], "complaints": [], "search": "二度房室传导阻滞（mobitz i & ii）— 知识总结\nsecond-degree (mobitz) heart block — 二度房室传导阻滞\ninvestigation diagnosis physical-exam\n  二度 avb  = 部分 p 波不下传（间断性 p 后无 qrs）。分两型，机制、ecg、预后、治疗 完全不同 。 \n \n  mobitz i (wenckebach) ：pr 逐渐延长直至脱落 → 多为 av 结病变、良性 \n  mobitz ii ：pr 恒定、突发脱落 → his-purkinje 系统病变、可进展为三度 → 高危 \n \n \n 概要 \n  二度 avb  = 部分 p 波不下传（间断性 p 后无 qrs）。分两型，机制、ecg、预后、治疗 完全不同 。 \n \n  mobitz i (wenckebach) ：pr 逐渐延长直至脱落 → 多为 av 结病变、良性 \n  mobitz ii ：pr 恒定、突发脱落 → his-purkinje 系统病变、可进展为三度 → 高危 \n \n \n mobitz i (wenckebach) — ecg 特征 \n \n   特征  说明   \n \n  pr 间期  逐搏 逐渐延长 直到 p 后无 qrs  \n  pr 增量  第一个增量最大，后续增量递减  \n  脱落后 pr   缩短 （回到基线，重新开始循环）  \n  漏搏间歇    \n  长序列 (>6:5)  增量可能极微小直到最后一个 p 突然大脱漏  \n  关键诊断要点   脱落后 pr 缩短 （regardless of periodicity 典型与否）  \n  r-r 关系  r-r 随 pr 延长而 缩短 （反直觉）  \n  逸搏  可有 junctional escape beats 伴 non-conducted p  \n \n \n \n mobitz ii — ecg 特征 \n \n   特征  说明   \n \n  pr 间期   恒定 （多个连续下传 p 的 pr 相同）  \n  脱落  突然一个 p 后 无 qrs   \n  脱落后 pr  与脱落前 pr  相同 （不像 mobitz i 重置）  \n  漏搏间歇   = 2× 窦性周期 （精确双倍）  \n  qrs  常 宽 （阻滞在 his 以下）  \n  高危  可突然进展为 完全性 avb / 心脏停搏   \n \n \n ⚠️ mobitz i vs ii 的核心鉴别： pr 是否恒定 。 恒定 → mobitz ii（高危） 渐变 → mobitz i（多良性） \n \n 临床意义 / 处理 \n \n   类型  临床意义  处理   \n \n   mobitz i   多为 av 结病变，迷走张力、缺血、药物（bb、ccb、地高辛）、下壁 mi  多数无需起搏；停用可疑药物；处理基础病  \n   mobitz ii   多为 his-purkinje 系统病变，前壁 mi、传导系统退行性变   临时起搏指征 ；之后 永久起搏   \n \n \n  临时起搏指征 ： \n \n asystole 病史 \n  mobitz ii avb  \n 完全性 avb \n 心室停搏 > 3 s \n 症状性窦缓 / 窦停，阿托品失败后 \n \n \n 阿托品位置 \n \n av 结水平阻滞（如 mobitz i）→ 阿托品可改善 \n his-purkinje 水平阻滞（mobitz ii）→  阿托品常无效 （题中典型表述：\"atropine used but pulse remains the same\"） \n 阿托品无效后 → 升级到临时起搏 \n \n \n 常见考点（高频） \n \n  \"pr 是否恒定\" → i vs ii 鉴别核心  \n mobitz ii 几乎 都需要 起搏（临时 → 永久） \n mobitz i 大多 无需 起搏 \n 漏搏间歇 精确 2× 窦性周期  = mobitz ii 标志 \n 漏搏间歇   = mobitz i（pr 增量递减） \n 宽 qrs + 恒定 pr + 突发脱落 = mobitz ii（典型\"高危组合\"） \n \n "}, {"id": "TR-Tilt-Table-Test", "type": "tr", "qid": 0, "title": "Tilt Table Test (倾斜试验) — 知识总结", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation"], "topic": ["Tilt Table Test — 倾斜试验 / Syncope 评估"], "difficulty": 0, "correctAnswer": "", "page": 7, "tags": ["topic-review", "amc", "cardiology", "syncope", "autonomic", "approach-investigation"], "cssclass": "tr-cardiology", "color": "#e05a6e", "file": "02-Topic-Reviews/Cardiology/TR-Tilt-Table-Test.md", "stem": "<p>Tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射，<strong>重现</strong> 患者症状 + 体征。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p>Tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射，<strong>重现</strong> 患者症状 + 体征。</p>\n<h3>原理</h3>\n<ul>\n<li>平卧位 → 60-80° 直立，监测 BP + HR + ECG + 症状</li>\n<li>持续 45 min</li>\n<li>可加 isoproterenol 等药物激发</li>\n<li>灵敏度 30-80%（依 protocol），假阳性 10-15%</li>\n</ul>\n<h3>反应模式 / 判读</h3>\n<table class='md-table'>\n<thead><tr><th>反应模式</th><th>提示病因</th></tr></thead>\n<tbody>\n<tr><td><strong>HR ↓ + BP ↓</strong></td><td><strong>Vasovagal / neurocardiogenic syncope</strong>（典型）</td></tr>\n<tr><td><strong>仅 HR ↓</strong></td><td>Cardioinhibitory type</td></tr>\n<tr><td><strong>仅 BP ↓</strong></td><td>Vasodepressor type</td></tr>\n<tr><td><strong>BP 缓慢下降，HR 几乎不变</strong></td><td><strong>Dysautonomic pattern</strong>（自主神经功能不全）</td></tr>\n<tr><td><strong>HR ↑ > 30 bpm，BP 几乎不变</strong></td><td><strong>POTS</strong>（Postural Orthostatic Tachycardia Syndrome）</td></tr>\n<tr><td><strong>报告 syncope，无血流动力学改变</strong></td><td><strong>Psychogenic syncope</strong></td></tr>\n</tbody>\n</table>\n<p>阳性判读：出现 syncope / presyncope + 与症状一致的 HR/BP 变化。<strong>单纯心率翻倍不算阳性</strong>。</p>\n<h3>相对禁忌</h3>\n<ul>\n<li><strong>Severe aortic / mitral stenosis</strong></li>\n<li><strong>Hypertrophic cardiomyopathy</strong></li>\n<li><strong>Severe CAD</strong></li>\n</ul>\n<p>Isoproterenol 禁忌在 HCM / 严重 CAD 中使用。</p>\n<h3>临床要点</h3>\n<ul>\n<li><strong>阳性 + 临床表现</strong> ⇒ Vasovagal syncope 可能性大</li>\n<li><strong>阴性</strong> <em>不</em> 排除 vasovagal（灵敏度有限）</li>\n<li><strong>不是诊断心律失常性 syncope 的可靠工具</strong> — 心律失常性需另查 Holter/EP</li>\n<li>评估 POTS 时是核心检查</li>\n</ul>\n<h3>共识管理（一线 → 二线）</h3>\n<table class='md-table'>\n<thead><tr><th>阶</th><th>措施</th></tr></thead>\n<tbody>\n<tr><td><strong>一</strong></td><td>↑ 钠 + 水摄入；physical counterpressure；起身缓慢</td></tr>\n<tr><td><strong>二</strong></td><td>Fludrocortisone（盐皮质激素 → 保钠扩容）</td></tr>\n<tr><td><strong>特殊</strong></td><td>Midodrine、pyridostigmine（autonomic failure）</td></tr>\n</tbody>\n</table>\n<h3>常见考点（高频）</h3>\n<ul>\n<li>直立性低血压 BP 标准：SBP ↓ ≥ 20 / DBP ↓ ≥ 10 mmHg</li>\n<li>Tilt test 不诊断 <em>心律失常</em> syncopes</li>\n<li>HCM + tilt test + isoproterenol → 风险高</li>\n<li>慢性直立性低血压病因：age、drugs、autonomic dysfunction</li>\n</ul>", "diseases": ["Syncope"], "complaints": [], "search": "tilt table test (倾斜试验) — 知识总结\ntilt table test — 倾斜试验 / syncope 评估\ninvestigation\n tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射， 重现  患者症状 + 体征。 \n 概要 \n tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射， 重现  患者症状 + 体征。 \n 原理 \n \n 平卧位 → 60-80° 直立，监测 bp + hr + ecg + 症状 \n 持续 45 min \n 可加 isoproterenol 等药物激发 \n 灵敏度 30-80%（依 protocol），假阳性 10-15% \n \n 反应模式 / 判读 \n \n   反应模式  提示病因   \n \n   hr ↓ + bp ↓    vasovagal / neurocardiogenic syncope （典型）  \n   仅 hr ↓   cardioinhibitory type  \n   仅 bp ↓   vasodepressor type  \n   bp 缓慢下降，hr 几乎不变    dysautonomic pattern （自主神经功能不全）  \n   hr ↑ > 30 bpm，bp 几乎不变    pots （postural orthostatic tachycardia syndrome）  \n   报告 syncope，无血流动力学改变    psychogenic syncope   \n \n \n 阳性判读：出现 syncope / presyncope + 与症状一致的 hr/bp 变化。 单纯心率翻倍不算阳性 。 \n 相对禁忌 \n \n  severe aortic / mitral stenosis  \n  hypertrophic cardiomyopathy  \n  severe cad  \n \n isoproterenol 禁忌在 hcm / 严重 cad 中使用。 \n 临床要点 \n \n  阳性 + 临床表现  ⇒ vasovagal syncope 可能性大 \n  阴性   不  排除 vasovagal（灵敏度有限） \n  不是诊断心律失常性 syncope 的可靠工具  — 心律失常性需另查 holter/ep \n 评估 pots 时是核心检查 \n \n 共识管理（一线 → 二线） \n \n   阶  措施   \n \n   一   ↑ 钠 + 水摄入；physical counterpressure；起身缓慢  \n   二   fludrocortisone（盐皮质激素 → 保钠扩容）  \n   特殊   midodrine、pyridostigmine（autonomic failure）  \n \n \n 常见考点（高频） \n \n 直立性低血压 bp 标准：sbp ↓ ≥ 20 / dbp ↓ ≥ 10 mmhg \n tilt test 不诊断  心律失常  syncopes \n hcm + tilt test + isoproterenol → 风险高 \n 慢性直立性低血压病因：age、drugs、autonomic dysfunction \n "}, {"id": "TR-DRESS-Syndrome", "type": "tr", "qid": 0, "title": "DRESS 综合征 (Drug Reaction with Eosinophilia and Systemic Symptoms)", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["DRESS 综合征 — 药物超敏反应"], "difficulty": 0, "correctAnswer": "", "page": 0, "tags": [], "cssclass": "tr-general", "color": "#5e7a8e", "file": "02-Topic-Reviews/General/TR-DRESS-Syndrome.md", "stem": "<p># DRESS 综合征 (Drug Reaction with Eosinophilia and Systemic Symptoms)</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": ["AMC-Q0865-Lamotrigine-Rash", "_MOC-General"], "bodyHtml": "<h3>定义</h3>\n<p>DRESS 是罕见、潜在致命的药物诱导超敏反应，包括：</p>\n<ul>\n<li>皮疹</li>\n<li>血液学异常（<strong>嗜酸性粒细胞增多</strong>、不典型淋巴细胞增多）</li>\n<li>淋巴结肿大</li>\n<li>内脏器官受累（肝、肾、肺等）</li>\n</ul>\n<h3>特点</h3>\n<ul>\n<li><strong>长潜伏期</strong>：药物暴露到发病 2-8 周</li>\n<li><strong>病程长、易复发</strong>：即使停用致病药物仍频繁复发</li>\n<li>常与潜伏人类疱疹病毒（HHV）再激活相关</li>\n</ul>\n<h3>最常见致病药物</h3>\n<p>1. <strong>卡马西平</strong> 2. <strong>拉莫三嗪</strong> 3. <strong>苯妥英</strong> 4. <strong>苯巴比妥</strong> 5. <strong>别嘌醇</strong></p>\n<p>少见：磺胺类（特别是柳氮磺吡啶）、氨苯砜、米诺环素、万古霉素</p>\n<h3>全身症状</h3>\n<ul>\n<li>发热（38-40°C）</li>\n<li>不适</li>\n<li>淋巴结肿大（30-60%）——轻度增大（1-2cm）、多处、有压痛</li>\n<li>内脏受累相关症状</li>\n</ul>\n<h3>内脏受累</h3>\n<p><strong>至少一个内脏器官受累见于 90% 患者</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>器官</th><th>频率</th></tr></thead>\n<tbody>\n<tr><td>肝</td><td>60-80%</td></tr>\n<tr><td>肾</td><td>10-30%</td></tr>\n<tr><td>肺</td><td>—</td></tr>\n<tr><td>心（嗜酸性心肌炎、心包炎）</td><td>—</td></tr>\n<tr><td>胃肠道（腹泻、黏膜糜烂、出血）</td><td>—</td></tr>\n<tr><td>胰腺（胰腺炎）</td><td>—</td></tr>\n<tr><td>甲状腺（自身免疫性甲状腺炎，常晚期出现）</td><td>—</td></tr>\n<tr><td>脑（脑炎、脑膜炎）</td><td>—</td></tr>\n<tr><td>肌肉（肌炎、CK 升高）</td><td>—</td></tr>\n<tr><td>周围神经（多神经炎）</td><td>—</td></tr>\n<tr><td>眼（葡萄膜炎）</td><td>—</td></tr>\n</tbody>\n</table>\n<h3>关键数字</h3>\n<ul>\n<li>潜伏期：<strong>2-8 周</strong></li>\n<li>内脏受累：<strong>90%</strong> 至少一个器官</li>\n<li>肝脏受累：<strong>60-80%</strong></li>\n<li>肾脏受累：10-30%</li>\n<li>淋巴结肿大：30-60%</li>\n</ul>", "diseases": ["STEMI"], "complaints": [], "search": "dress 综合征 (drug reaction with eosinophilia and systemic symptoms)\ndress 综合征 — 药物超敏反应\n # dress 综合征 (drug reaction with eosinophilia and systemic symptoms) \n 定义 \n dress 是罕见、潜在致命的药物诱导超敏反应，包括： \n \n 皮疹 \n 血液学异常（ 嗜酸性粒细胞增多 、不典型淋巴细胞增多） \n 淋巴结肿大 \n 内脏器官受累（肝、肾、肺等） \n \n 特点 \n \n  长潜伏期 ：药物暴露到发病 2-8 周 \n  病程长、易复发 ：即使停用致病药物仍频繁复发 \n 常与潜伏人类疱疹病毒（hhv）再激活相关 \n \n 最常见致病药物 \n 1.  卡马西平  2.  拉莫三嗪  3.  苯妥英  4.  苯巴比妥  5.  别嘌醇  \n 少见：磺胺类（特别是柳氮磺吡啶）、氨苯砜、米诺环素、万古霉素 \n 全身症状 \n \n 发热（38-40°c） \n 不适 \n 淋巴结肿大（30-60%）——轻度增大（1-2cm）、多处、有压痛 \n 内脏受累相关症状 \n \n 内脏受累 \n  至少一个内脏器官受累见于 90% 患者 ： \n \n   器官  频率   \n \n  肝  60-80%  \n  肾  10-30%  \n  肺  —  \n  心（嗜酸性心肌炎、心包炎）  —  \n  胃肠道（腹泻、黏膜糜烂、出血）  —  \n  胰腺（胰腺炎）  —  \n  甲状腺（自身免疫性甲状腺炎，常晚期出现）  —  \n  脑（脑炎、脑膜炎）  —  \n  肌肉（肌炎、ck 升高）  —  \n  周围神经（多神经炎）  —  \n  眼（葡萄膜炎）  —  \n \n \n 关键数字 \n \n 潜伏期： 2-8 周  \n 内脏受累： 90%  至少一个器官 \n 肝脏受累： 60-80%  \n 肾脏受累：10-30% \n 淋巴结肿大：30-60% \n "}, {"id": "TR-DVT-Prophylaxis-Indications", "type": "tr", "qid": 0, "title": "VTE Prophylaxis 高危人群 + 抗凝替代 — 知识总结", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["prevention"], "topic": ["VTE Prophylaxis Indications — 高危人群 / 抗凝禁忌"], "difficulty": 0, "correctAnswer": "", "page": 10, "tags": ["topic-review", "amc", "haematology", "VTE", "prophylaxis", "approach-prevention"], "cssclass": "tr-haematology", "color": "#9b3d62", "file": "02-Topic-Reviews/Haematology/TR-DVT-Prophylaxis-Indications.md", "stem": "<p><!-- category-banner: tr-haematology --> 💉 <strong>Haematology (Topic Review)</strong> · CSS class: <code>tr-haematology</code></p>\n<p>考点类型（approach）：<strong>预防</strong></p>\n<p>颜色通过 <code>category-colors.css</code> 着色（<code>Settings → Appearance → CSS snippets</code> 启用）。 # VTE Prophylaxis 高危人群 + 抗凝替代 — 知识总结</p>\n<p>适用上下文：识别高 VTE 风险患者（cancer、trauma）；理解 <em>抗凝禁忌 / 依从性差</em> 时的替代方案（IVC filter）。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>高 VTE 风险人群（要点）</h3>\n<p>### 患者群体</p>\n<ul>\n<li><strong>Cancer 患者</strong>（尤其活动期 / 化疗）</li>\n<li><strong>Trauma 患者</strong>，包括：</li>\n<li>严重头部创伤 + 长期机械通气</li>\n<li>主要腹部/盆腔穿通性静脉伤</li>\n<li>脊髓损伤（伴或不伴瘫痪）</li>\n<li>严重头部创伤 + 多发下肢骨折</li>\n<li>骨盆骨折（伴或不伴下肢骨折）</li>\n</ul>\n<p>### 风险因素汇总</p>\n<ul>\n<li><strong>既往 VTE</strong></li>\n<li>长期制动 / ICU 长期卧床</li>\n<li>大手术（特别 orthopedic、neuro、oncology）</li>\n<li>高凝状态（cancer、thrombophilia）</li>\n<li>妊娠 / 产褥期</li>\n<li>OCP / HRT</li>\n</ul>\n<h3>抗凝禁忌（这些情况下考虑替代）</h3>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>具体</th></tr></thead>\n<tbody>\n<tr><td>神经</td><td>出血性卒中、近期神经手术</td></tr>\n<tr><td>外科</td><td>近期大手术</td></tr>\n<tr><td>创伤</td><td>大/多发创伤</td></tr>\n<tr><td>出血</td><td>活动性 GI 出血 / 血尿 / 胆道出血</td></tr>\n<tr><td>颅内</td><td>肿瘤（原发或转移）</td></tr>\n<tr><td>血液</td><td>出血体质（ITP、血友病）</td></tr>\n<tr><td>其他</td><td><strong>妊娠</strong>、易跌倒（PD、卒中后）、<strong>依从性差</strong></td></tr>\n</tbody>\n</table>\n<h3>替代方案：IVC Filter</h3>\n<p>### 核心适应证（AMC 高频）</p>\n<p>1. <strong>DVT or PE</strong> 患者存在 <em>抗凝禁忌</em> 2. 抗凝过程中 <em>出现并发症</em>（出血） 3. 充分抗凝后 <em>失败（仍发 PE）</em> 4. 患者 <em>依从性差</em>（无法可靠 long-term 抗凝） ← Q09 命中此点</p>\n<p>### 注意点</p>\n<ul>\n<li>IVC filter 是 <strong>预防 PE</strong>，<strong>不治疗 DVT 本体</strong></li>\n<li>仍需随访 DVT 是否进展</li>\n<li>临时 filter 可取出；永久 filter 长期并发症</li>\n</ul>\n<h3>标准化疗路径</h3>\n<table class='md-table'>\n<thead><tr><th>阶</th><th>措施</th></tr></thead>\n<tbody>\n<tr><td>急性</td><td>UFH 或 LMWH</td></tr>\n<tr><td>桥接</td><td>同日内启动 Warfarin</td></tr>\n<tr><td>维持</td><td>Heparin 至 INR > 2 连两次后停</td></tr>\n<tr><td>长程</td><td>Warfarin ≥ 3 个月（按再发风险）</td></tr>\n</tbody>\n</table>\n<h3>常见考点（AMC 高频对比）</h3>\n<table class='md-table'>\n<thead><tr><th>题眼</th><th>默认</th></tr></thead>\n<tbody>\n<tr><td>DVT 后 standard</td><td>Warfarin 3-6m</td></tr>\n<tr><td>抗凝禁忌时</td><td>IVC filter</td></tr>\n<tr><td>Cancer + DVT</td><td>LMWH 长程 / DOAC</td></tr>\n<tr><td>妊娠 + DVT</td><td>LMWH（<strong>不</strong>用 Warfarin = 致畸）</td></tr>\n<tr><td>易跌倒患者</td><td>IVC filter 或密切随访</td></tr>\n</tbody>\n</table>", "diseases": ["VTE"], "complaints": [], "search": "vte prophylaxis 高危人群 + 抗凝替代 — 知识总结\nvte prophylaxis indications — 高危人群 / 抗凝禁忌\nprevention\n   💉  haematology (topic review)  · css class:  tr-haematology  \n 考点类型（approach）： 预防  \n 颜色通过  category-colors.css  着色（ settings → appearance → css snippets  启用）。 # vte prophylaxis 高危人群 + 抗凝替代 — 知识总结 \n 适用上下文：识别高 vte 风险患者（cancer、trauma）；理解  抗凝禁忌 / 依从性差  时的替代方案（ivc filter）。 \n 高 vte 风险人群（要点） \n ### 患者群体 \n \n  cancer 患者 （尤其活动期 / 化疗） \n  trauma 患者 ，包括： \n 严重头部创伤 + 长期机械通气 \n 主要腹部/盆腔穿通性静脉伤 \n 脊髓损伤（伴或不伴瘫痪） \n 严重头部创伤 + 多发下肢骨折 \n 骨盆骨折（伴或不伴下肢骨折） \n \n ### 风险因素汇总 \n \n  既往 vte  \n 长期制动 / icu 长期卧床 \n 大手术（特别 orthopedic、neuro、oncology） \n 高凝状态（cancer、thrombophilia） \n 妊娠 / 产褥期 \n ocp / hrt \n \n 抗凝禁忌（这些情况下考虑替代） \n \n   类别  具体   \n \n  神经  出血性卒中、近期神经手术  \n  外科  近期大手术  \n  创伤  大/多发创伤  \n  出血  活动性 gi 出血 / 血尿 / 胆道出血  \n  颅内  肿瘤（原发或转移）  \n  血液  出血体质（itp、血友病）  \n  其他   妊娠 、易跌倒（pd、卒中后）、 依从性差   \n \n \n 替代方案：ivc filter \n ### 核心适应证（amc 高频） \n 1.  dvt or pe  患者存在  抗凝禁忌  2. 抗凝过程中  出现并发症 （出血） 3. 充分抗凝后  失败（仍发 pe）  4. 患者  依从性差 （无法可靠 long-term 抗凝） ← q09 命中此点 \n ### 注意点 \n \n ivc filter 是  预防 pe ， 不治疗 dvt 本体  \n 仍需随访 dvt 是否进展 \n 临时 filter 可取出；永久 filter 长期并发症 \n \n 标准化疗路径 \n \n   阶  措施   \n \n  急性  ufh 或 lmwh  \n  桥接  同日内启动 warfarin  \n  维持  heparin 至 inr > 2 连两次后停  \n  长程  warfarin ≥ 3 个月（按再发风险）  \n \n \n 常见考点（amc 高频对比） \n \n   题眼  默认   \n \n  dvt 后 standard  warfarin 3-6m  \n  抗凝禁忌时  ivc filter  \n  cancer + dvt  lmwh 长程 / doac  \n  妊娠 + dvt  lmwh（ 不 用 warfarin = 致畸）  \n  易跌倒患者  ivc filter 或密切随访  \n \n "}, {"id": "TR-Anorexia-Nervosa", "type": "tr", "qid": 0, "title": "神经性厌食 (Anorexia Nervosa) — 并发症综述", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["神经性厌食 — 并发症综述（蛋白-热量营养不良、阴性体征）"], "difficulty": 0, "correctAnswer": "", "page": 0, "tags": [], "cssclass": "tr-mental-health", "color": "#bc8c2e", "file": "02-Topic-Reviews/Mental-Health/TR-Anorexia-Nervosa.md", "stem": "<p># 神经性厌食 (Anorexia Nervosa) — 并发症综述</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": ["AMC-Q0893-Anorexia-Bradycardia", "AMC-Q0886-Anorexia-Basic-Investigations", "AMC-Q0889-Anorexia-Risk-Factor-Sexual-Abuse", "AMC-Q0892-Anorexia-Vertebral-Compression-Fracture", "AMC-Q0894-Anorexia-FSH-LH", "_MOC-Mental-Health"], "bodyHtml": "<h3>概述</h3>\n<p>神经性厌食以长期饥饿与营养不良为基础，并发症累及全身多个器官系统。多数临床表现源于<strong>蛋白-热量营养不良</strong>（protein-calorie malnutrition）及雌激素缺乏。基础检查与DXA指征见 Q886，评估细节见 Q894。</p>\n<h3>内分泌 / 代谢</h3>\n<ul>\n<li>月经功能障碍：月经初潮延迟、继发性闭经</li>\n<li>生长与发育延迟</li>\n<li>第二性征退缩/发育不良</li>\n<li>代谢率下降、静息能量消耗降低</li>\n<li>食欲与口渴调节障碍</li>\n<li>甲状旁腺激素（PTH）水平低</li>\n<li>肝功能升高（LFT）</li>\n<li>贫血、低血糖、白细胞计数降低</li>\n<li><strong>蛋白-热量营养不良</strong></li>\n<li>维生素、矿物质及必需脂肪酸缺乏</li>\n<li>酮尿（ketonuria）</li>\n<li><strong>冷不耐受</strong>（cold intolerance）</li>\n<li>免疫功能受抑</li>\n<li>乳房萎缩</li>\n</ul>\n<h3>肌肉骨骼</h3>\n<ul>\n<li>骨量下降（decreased bone mass）</li>\n<li>骨量减少（osteopenia）</li>\n<li>应力性骨折（stress fractures）</li>\n<li>骨质疏松（osteoporosis）→ 椎体压缩骨折（最常见部位）</li>\n<li>肌肉量减少</li>\n</ul>\n<h3>心血管</h3>\n<ul>\n<li>心律失常、心电图异常</li>\n<li><strong>心动过缓</strong>（HR<60bpm，静息时常见40-49bpm）</li>\n<li>低血压、体位性低血压</li>\n<li>左心室质量与每搏输出量下降</li>\n<li>充血性心力衰竭（CHF）</li>\n<li>心脏骤停（<strong>心脏问题是首位死因</strong>）</li>\n</ul>\n<h3>胃肠道</h3>\n<ul>\n<li>腮腺及颌下腺肥大（常见于暴食/清除型）</li>\n<li>胃排空延迟</li>\n<li>便秘/顽固性便秘</li>\n<li>肠鸣音减弱</li>\n<li>餐后不适、小餐后腹胀</li>\n</ul>\n<h3>精神神经</h3>\n<ul>\n<li>抑郁、焦虑</li>\n<li>结构性脑异常/脑组织丢失</li>\n<li>注意力受损、缺乏自知力</li>\n<li>睡眠障碍</li>\n</ul>\n<h3>皮肤及其他</h3>\n<ul>\n<li>肢端发绀（acrocyanosis）</li>\n<li><strong>毳毛（lanugo）</strong>：细软体毛（≠多毛症hirsutism）</li>\n<li>皮肤干燥脱屑（xerosis）</li>\n<li>脆发、脱发</li>\n<li>胼胝状指节（calloused knuckles，暴食/清除型催吐诱导）</li>\n<li>牙釉质侵蚀（暴食/清除型）</li>\n</ul>\n<h3>阴性体征 (Negative Signs)</h3>\n<ul>\n<li>眼底及视野正常（Normal fundi / visual fields）</li>\n<li>无器官肿大（No organomegaly）</li>\n<li>无淋巴结肿大（No lymphadenopathy）</li>\n</ul>\n<p>阴性体征提示：若出现眼底异常、器官肿大或淋巴结肿大，应怀疑进食障碍以外的病因。</p>\n<h3>关键要点</h3>\n<p>1. 静息心动过缓（40-49bpm）是最常见体征 2. 椎体是骨质疏松性病理性骨折最常见部位 3. 毳毛（lanugo）≠ 多毛症（hirsutism） 4. 冷不耐受（非热不耐受） 5. 心脏并发症是厌食症首要死因</p>", "diseases": [], "complaints": [], "search": "神经性厌食 (anorexia nervosa) — 并发症综述\n神经性厌食 — 并发症综述（蛋白-热量营养不良、阴性体征）\n # 神经性厌食 (anorexia nervosa) — 并发症综述 \n 概述 \n 神经性厌食以长期饥饿与营养不良为基础，并发症累及全身多个器官系统。多数临床表现源于 蛋白-热量营养不良 （protein-calorie malnutrition）及雌激素缺乏。基础检查与dxa指征见 q886，评估细节见 q894。 \n 内分泌 / 代谢 \n \n 月经功能障碍：月经初潮延迟、继发性闭经 \n 生长与发育延迟 \n 第二性征退缩/发育不良 \n 代谢率下降、静息能量消耗降低 \n 食欲与口渴调节障碍 \n 甲状旁腺激素（pth）水平低 \n 肝功能升高（lft） \n 贫血、低血糖、白细胞计数降低 \n  蛋白-热量营养不良  \n 维生素、矿物质及必需脂肪酸缺乏 \n 酮尿（ketonuria） \n  冷不耐受 （cold intolerance） \n 免疫功能受抑 \n 乳房萎缩 \n \n 肌肉骨骼 \n \n 骨量下降（decreased bone mass） \n 骨量减少（osteopenia） \n 应力性骨折（stress fractures） \n 骨质疏松（osteoporosis）→ 椎体压缩骨折（最常见部位） \n 肌肉量减少 \n \n 心血管 \n \n 心律失常、心电图异常 \n  心动过缓 （hr \n 低血压、体位性低血压 \n 左心室质量与每搏输出量下降 \n 充血性心力衰竭（chf） \n 心脏骤停（ 心脏问题是首位死因 ） \n \n 胃肠道 \n \n 腮腺及颌下腺肥大（常见于暴食/清除型） \n 胃排空延迟 \n 便秘/顽固性便秘 \n 肠鸣音减弱 \n 餐后不适、小餐后腹胀 \n \n 精神神经 \n \n 抑郁、焦虑 \n 结构性脑异常/脑组织丢失 \n 注意力受损、缺乏自知力 \n 睡眠障碍 \n \n 皮肤及其他 \n \n 肢端发绀（acrocyanosis） \n  毳毛（lanugo） ：细软体毛（≠多毛症hirsutism） \n 皮肤干燥脱屑（xerosis） \n 脆发、脱发 \n 胼胝状指节（calloused knuckles，暴食/清除型催吐诱导） \n 牙釉质侵蚀（暴食/清除型） \n \n 阴性体征 (negative signs) \n \n 眼底及视野正常（normal fundi / visual fields） \n 无器官肿大（no organomegaly） \n 无淋巴结肿大（no lymphadenopathy） \n \n 阴性体征提示：若出现眼底异常、器官肿大或淋巴结肿大，应怀疑进食障碍以外的病因。 \n 关键要点 \n 1. 静息心动过缓（40-49bpm）是最常见体征 2. 椎体是骨质疏松性病理性骨折最常见部位 3. 毳毛（lanugo）≠ 多毛症（hirsutism） 4. 冷不耐受（非热不耐受） 5. 心脏并发症是厌食症首要死因 "}, {"id": "TR-Cross-Dressing-Transvestitism", "type": "tr", "qid": 0, "title": "异装 / 异装障碍 — 与易性癖和性别焦虑的鉴别", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["异装/异装障碍 — 与易性癖和性别焦虑的鉴别"], "difficulty": 2, "correctAnswer": "", "page": 1462, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "02-Topic-Reviews/Mental-Health/TR-Cross-Dressing-Transvestitism.md", "stem": "<p># 异装 / 异装障碍 — 与易性癖和性别焦虑的鉴别</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": ["AMC-Q1728-Gender-Dysphoria-Cross-Dressing", "_MOC-Mental-Health"], "bodyHtml": "<h3>摘要 (Summary)</h3>\n<p>异装（Cross-dressing）定义为典型的异性恋男性穿着女性服装。异装与易性癖或同性恋之间无相关性。异装者仅在部分时间以女性身份着装，享受体验自我的男性和女性两面。与之相反，跨性别者（transgender）全天候以认同的性别生活。</p>\n<h3>核心内容 (Core Content)</h3>\n<p>### 异装（Cross-dressing）</p>\n<ul>\n<li>典型的异性恋男性穿着女性服装</li>\n<li>与易性癖/同性恋<strong>无关联</strong></li>\n<li>选择仅在某些时间穿女装</li>\n<li>享受体验自我的男性和女性两面</li>\n</ul>\n<p>### 异装障碍（Transvestic Disorder, DSM-5）</p>\n<ul>\n<li>DSM-5将异装视为精神障碍的条件：异装或其想法<strong>总是/经常伴随性兴奋</strong></li>\n<li>异装 vs 异装障碍的关键区别：后者与<strong>性唤起</strong>相关</li>\n<li><strong>异装不等于异装障碍</strong>——仅当伴随性兴奋时才符合精神障碍诊断</li>\n</ul>\n<p>### 易性癖 / 跨性别（Transgender）</p>\n<ul>\n<li>性别认同与出生性别不同的儿童 = 跨性别或性别多样化</li>\n<li>跨性别是非医学术语，描述性别认同或性别表达与出生性别不同的人</li>\n<li><strong>不是所有跨性别者都有性别焦虑</strong>——这一区别很重要</li>\n<li>性别焦虑和/或\"出柜\"可发生在任何年龄</li>\n</ul>\n<p>### 性别焦虑（Gender Dysphoria）</p>\n<ul>\n<li>因性别认同与出生性别不同而感到痛苦</li>\n<li>痛苦可能影响学校或家庭生活</li>\n<li>感觉\"被困在异性身体中\"</li>\n<li>在儿童青少年中非阶段性</li>\n</ul>\n<p>### 性别确认（Gender Affirmation）的多个领域</p>\n<p>跨性别者可能追求以下一个或多个领域的性别确认：</p>\n<p>1. <strong>社会确认</strong>：改变姓名和代词 2. <strong>法律确认</strong>：更改政府签发的文件上的性别标记 3. <strong>医学确认</strong>：青春期抑制或性别确认激素治疗 4. <strong>手术确认</strong>：阴道成形术、面部女性化手术、乳房增大术、男性胸部重建术等</p>\n<p><strong>注意</strong>：不是所有跨性别者都希望所有领域的确认——这是高度个人化的决定。</p>\n<h3>关键鉴别 (Key Differentiation)</h3>\n<table class='md-table'>\n<thead><tr><th>概念</th><th>定义</th><th>关键特征</th></tr></thead>\n<tbody>\n<tr><td>异装（Cross-dressing）</td><td>异性恋男性穿女装</td><td>仅部分时间，享受男女两面</td></tr>\n<tr><td>异装障碍（Transvestic disorder）</td><td>异装伴随性兴奋</td><td>DSM-5精神障碍诊断</td></tr>\n<tr><td>跨性别（Transgender）</td><td>性别认同≠出生性别</td><td>全天候以认同性别生活</td></tr>\n<tr><td>性别焦虑（Gender dysphoria）</td><td>因性别认同差异而痛苦</td><td>影响功能，感觉困在异性身体中</td></tr>\n</tbody>\n</table>\n<h3>正常发育 (Normal Development)</h3>\n<ul>\n<li>儿童和青少年尝试性别角色实验是正常的</li>\n<li>大多数儿童最终对出生性别感到舒适</li>\n<li>约6-7岁起，儿童开始理解性别跨时间和情境的恒定性</li>\n<li>15岁时的异装行为不是正常发育的一部分</li>\n</ul>\n<h3>参考文献 (References)</h3>\n<ul>\n<li>RCH - Gender dysphoria</li>\n<li>American Psychiatric Association - Gender Dysphoria</li>\n<li>RACGP - AFP: Gender dysphoria</li>\n</ul>", "diseases": [], "complaints": [], "search": "异装 / 异装障碍 — 与易性癖和性别焦虑的鉴别\n异装/异装障碍 — 与易性癖和性别焦虑的鉴别\n # 异装 / 异装障碍 — 与易性癖和性别焦虑的鉴别 \n 摘要 (summary) \n 异装（cross-dressing）定义为典型的异性恋男性穿着女性服装。异装与易性癖或同性恋之间无相关性。异装者仅在部分时间以女性身份着装，享受体验自我的男性和女性两面。与之相反，跨性别者（transgender）全天候以认同的性别生活。 \n 核心内容 (core content) \n ### 异装（cross-dressing） \n \n 典型的异性恋男性穿着女性服装 \n 与易性癖/同性恋 无关联  \n 选择仅在某些时间穿女装 \n 享受体验自我的男性和女性两面 \n \n ### 异装障碍（transvestic disorder, dsm-5） \n \n dsm-5将异装视为精神障碍的条件：异装或其想法 总是/经常伴随性兴奋  \n 异装 vs 异装障碍的关键区别：后者与 性唤起 相关 \n  异装不等于异装障碍 ——仅当伴随性兴奋时才符合精神障碍诊断 \n \n ### 易性癖 / 跨性别（transgender） \n \n 性别认同与出生性别不同的儿童 = 跨性别或性别多样化 \n 跨性别是非医学术语，描述性别认同或性别表达与出生性别不同的人 \n  不是所有跨性别者都有性别焦虑 ——这一区别很重要 \n 性别焦虑和/或\"出柜\"可发生在任何年龄 \n \n ### 性别焦虑（gender dysphoria） \n \n 因性别认同与出生性别不同而感到痛苦 \n 痛苦可能影响学校或家庭生活 \n 感觉\"被困在异性身体中\" \n 在儿童青少年中非阶段性 \n \n ### 性别确认（gender affirmation）的多个领域 \n 跨性别者可能追求以下一个或多个领域的性别确认： \n 1.  社会确认 ：改变姓名和代词 2.  法律确认 ：更改政府签发的文件上的性别标记 3.  医学确认 ：青春期抑制或性别确认激素治疗 4.  手术确认 ：阴道成形术、面部女性化手术、乳房增大术、男性胸部重建术等 \n  注意 ：不是所有跨性别者都希望所有领域的确认——这是高度个人化的决定。 \n 关键鉴别 (key differentiation) \n \n   概念  定义  关键特征   \n \n  异装（cross-dressing）  异性恋男性穿女装  仅部分时间，享受男女两面  \n  异装障碍（transvestic disorder）  异装伴随性兴奋  dsm-5精神障碍诊断  \n  跨性别（transgender）  性别认同≠出生性别  全天候以认同性别生活  \n  性别焦虑（gender dysphoria）  因性别认同差异而痛苦  影响功能，感觉困在异性身体中  \n \n \n 正常发育 (normal development) \n \n 儿童和青少年尝试性别角色实验是正常的 \n 大多数儿童最终对出生性别感到舒适 \n 约6-7岁起，儿童开始理解性别跨时间和情境的恒定性 \n 15岁时的异装行为不是正常发育的一部分 \n \n 参考文献 (references) \n \n rch - gender dysphoria \n american psychiatric association - gender dysphoria \n racgp - afp: gender dysphoria \n "}, {"id": "TR-Serotonin-Syndrome-Management", "type": "tr", "qid": 0, "title": "血清素综合征的管理 (Serotonin Syndrome Management)", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["血清素综合征 — 管理流程"], "difficulty": 0, "correctAnswer": "", "page": 0, "tags": [], "cssclass": "tr-mental-health", "color": "#bc8c2e", "file": "02-Topic-Reviews/Mental-Health/TR-Serotonin-Syndrome-Management.md", "stem": "<p># 血清素综合征的管理 (Serotonin Syndrome Management)</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": ["AMC-QNA-P1402-Serotonin-Syndrome-SSRIs", "_MOC-Mental-Health"], "bodyHtml": "<h3>总原则</h3>\n<p>细致支持性治疗是主旋律（mainstay of therapy）：</p>\n<p>1. <strong>立即停用所有血清素能药物</strong>，并注意不再无意给予任何诱发药物 2. 中重度血清素症状 → <strong>住院</strong>；高热 → <strong>ICU</strong> 3. 静脉补液维持满意的尿量 4. 定期监测体温、脉搏、血压、尿量 5. 高热时积极降温：凉水喷洒、冰袋，甚至<strong>肌松 + 机械通气</strong> 6. 苯二氮卓类：控制癫痫发作和肌肉过度活动 7. 高血压通常不需要特异性治疗</p>\n<h3>特异性治疗：赛庚啶 (Cyproheptadine)</h3>\n<ul>\n<li>中重度血清素综合征<strong>一线药物</strong>：初始 <strong>4-8mg 口服</strong></li>\n<li>需要时 2 小时后可重复</li>\n<li>若总量 16mg 后仍无反应 → <strong>停用赛庚啶</strong></li>\n<li>若有反应 → 可继续分次给药，<strong>最高 32mg/日</strong>（如 8mg q6h）</li>\n</ul>\n<h3>其他药物</h3>\n<ul>\n<li>氯丙嗪、普萘洛尔也被提及，但不良反应更多</li>\n<li>需要镇静时，氯丙嗪比常规镇静药更合适；但因可致低血压，<strong>必须充分补液</strong></li>\n</ul>\n<h3>关键数字</h3>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>数值</th></tr></thead>\n<tbody>\n<tr><td>赛庚啶初始剂量</td><td>4-8mg 口服</td></tr>\n<tr><td>2 小时后重复</td><td>可</td></tr>\n<tr><td>无效上限</td><td>总量 16mg 后停用</td></tr>\n<tr><td>有效后维持</td><td>分次至 32mg/日</td></tr>\n</tbody>\n</table>", "diseases": [], "complaints": [], "search": "血清素综合征的管理 (serotonin syndrome management)\n血清素综合征 — 管理流程\n # 血清素综合征的管理 (serotonin syndrome management) \n 总原则 \n 细致支持性治疗是主旋律（mainstay of therapy）： \n 1.  立即停用所有血清素能药物 ，并注意不再无意给予任何诱发药物 2. 中重度血清素症状 →  住院 ；高热 →  icu  3. 静脉补液维持满意的尿量 4. 定期监测体温、脉搏、血压、尿量 5. 高热时积极降温：凉水喷洒、冰袋，甚至 肌松 + 机械通气  6. 苯二氮卓类：控制癫痫发作和肌肉过度活动 7. 高血压通常不需要特异性治疗 \n 特异性治疗：赛庚啶 (cyproheptadine) \n \n 中重度血清素综合征 一线药物 ：初始  4-8mg 口服  \n 需要时 2 小时后可重复 \n 若总量 16mg 后仍无反应 →  停用赛庚啶  \n 若有反应 → 可继续分次给药， 最高 32mg/日 （如 8mg q6h） \n \n 其他药物 \n \n 氯丙嗪、普萘洛尔也被提及，但不良反应更多 \n 需要镇静时，氯丙嗪比常规镇静药更合适；但因可致低血压， 必须充分补液  \n \n 关键数字 \n \n   项目  数值   \n \n  赛庚啶初始剂量  4-8mg 口服  \n  2 小时后重复  可  \n  无效上限  总量 16mg 后停用  \n  有效后维持  分次至 32mg/日  \n \n "}, {"id": "TR-Measles-Exclusion", "type": "tr", "qid": 0, "title": "Measles 停学与接触者管理 — 知识总结", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Measles 停学与接触者管理 — 出疹后 4 天 / 未免疫接触者 14 天"], "difficulty": 0, "correctAnswer": "", "page": 1320, "tags": ["topic-review", "amc", "paediatrics", "infectious-disease", "measles", "school-exclusion", "contact-tracing", "approach-prevention"], "cssclass": "tr-paediatrics", "color": "#2d8f96", "file": "02-Topic-Reviews/Paediatrics/TR-Measles-Exclusion.md", "stem": "<p>麻疹传染性极强。管理核心是 <strong>index case 停学时限</strong> 与 <strong>接触者追踪隔离</strong>，尤其在日托/学校场景。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p>麻疹传染性极强。管理核心是 <strong>index case 停学时限</strong> 与 <strong>接触者追踪隔离</strong>，尤其在日托/学校场景。</p>\n<h3>关键知识点</h3>\n<p>### Index case（确诊病例）停学</p>\n<ul>\n<li>停学至 <strong>出疹后 4 天</strong>（rash onset + 4 days）。</li>\n<li>无论是否接种疫苗，只要确诊/疑似/可能，均停学。</li>\n</ul>\n<p>### 接触者（contacts）停学（日托/学校场景）</p>\n<ul>\n<li><strong>已免疫接触者</strong>：不需停学。</li>\n<li><strong>未免疫接触者</strong>：停学至 <strong>index case 出疹后 14 天</strong>；除非在接触后 <strong>72 小时内接种 MMR</strong>。</li>\n</ul>\n<p>### 示例推演</p>\n<ul>\n<li>John 3 天前出疹（index case）→ 本人停学至出疹后 4 天（即明天）。</li>\n<li>Ana（接触者）：曾患麻疹 → 已免疫 → 不停学。</li>\n<li>Josh（接触者）：全程接种 → 不停学。</li>\n<li>Alan / Mary（接触者）：未接种 → 自今日起停学 11 天（John 出疹后 14 天）。</li>\n</ul>\n<h3>表 / 对照 / 速记</h3>\n<table class='md-table'>\n<thead><tr><th>场景</th><th>停学时限</th></tr></thead>\n<tbody>\n<tr><td>Index case</td><td>出疹后 4 天</td></tr>\n<tr><td>已免疫接触者</td><td>不停学</td></tr>\n<tr><td>未免疫接触者</td><td>index 出疹后 14 天（或接触 72h 内 MMR 可免）</td></tr>\n</tbody>\n</table>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>停学/隔离时限（index）</th></tr></thead>\n<tbody>\n<tr><td>Measles</td><td>出疹后 4 天</td></tr>\n<tr><td>Pertussis</td><td>抗生素后 5 天 / 阵咳起 21 天（或 14 天）</td></tr>\n<tr><td>Chickenpox</td><td>所有水疱结痂（约出疹 5 天）</td></tr>\n</tbody>\n</table>\n<h3>临床要点</h3>\n<ul>\n<li>麻疹停学看\"出疹后 4 天\"，不是\"疹退\"。</li>\n<li>接触者是否停学取决于<strong>其自身免疫状态</strong>，不是 index case。</li>\n<li>未免疫接触者 72h 内 MMR 可截断隔离。</li>\n</ul>\n<h3>常见考点</h3>\n<ul>\n<li>出疹已 >4 天 → 无需停学（题眼常给\"出疹 6–7 天\"）。</li>\n<li>同学全程接种 → 接触者不停学。</li>\n<li>与 pertussis / chickenpox 时限区分（见上表）。</li>\n</ul>", "diseases": ["Measles"], "complaints": [], "search": "measles 停学与接触者管理 — 知识总结\nmeasles 停学与接触者管理 — 出疹后 4 天 / 未免疫接触者 14 天\nprevention\n 麻疹传染性极强。管理核心是  index case 停学时限  与  接触者追踪隔离 ，尤其在日托/学校场景。 \n 概要 \n 麻疹传染性极强。管理核心是  index case 停学时限  与  接触者追踪隔离 ，尤其在日托/学校场景。 \n 关键知识点 \n ### index case（确诊病例）停学 \n \n 停学至  出疹后 4 天 （rash onset + 4 days）。 \n 无论是否接种疫苗，只要确诊/疑似/可能，均停学。 \n \n ### 接触者（contacts）停学（日托/学校场景） \n \n  已免疫接触者 ：不需停学。 \n  未免疫接触者 ：停学至  index case 出疹后 14 天 ；除非在接触后  72 小时内接种 mmr 。 \n \n ### 示例推演 \n \n john 3 天前出疹（index case）→ 本人停学至出疹后 4 天（即明天）。 \n ana（接触者）：曾患麻疹 → 已免疫 → 不停学。 \n josh（接触者）：全程接种 → 不停学。 \n alan / mary（接触者）：未接种 → 自今日起停学 11 天（john 出疹后 14 天）。 \n \n 表 / 对照 / 速记 \n \n   场景  停学时限   \n \n  index case  出疹后 4 天  \n  已免疫接触者  不停学  \n  未免疫接触者  index 出疹后 14 天（或接触 72h 内 mmr 可免）  \n \n \n \n   疾病  停学/隔离时限（index）   \n \n  measles  出疹后 4 天  \n  pertussis  抗生素后 5 天 / 阵咳起 21 天（或 14 天）  \n  chickenpox  所有水疱结痂（约出疹 5 天）  \n \n \n 临床要点 \n \n 麻疹停学看\"出疹后 4 天\"，不是\"疹退\"。 \n 接触者是否停学取决于 其自身免疫状态 ，不是 index case。 \n 未免疫接触者 72h 内 mmr 可截断隔离。 \n \n 常见考点 \n \n 出疹已 >4 天 → 无需停学（题眼常给\"出疹 6–7 天\"）。 \n 同学全程接种 → 接触者不停学。 \n 与 pertussis / chickenpox 时限区分（见上表）。 \n "}, {"id": "TR-Paediatric-Neck-Masses", "type": "tr", "qid": 1544, "title": "儿童颈部肿块 — 评估与处理路径", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["儿童颈部肿块 — 评估与处理路径"], "difficulty": 0, "correctAnswer": "null", "page": 1384, "tags": [], "cssclass": "tr-paediatrics", "color": "#2d8f96", "file": "02-Topic-Reviews/Paediatrics/TR-Paediatric-Neck-Masses-Approach.md", "stem": "<p># 儿童颈部肿块 — 评估与处理路径</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": ["AMC-QNA-P1382-Paediatric-Neck-Mass", "AMC-Q1423-Thyroglossal-Duct-Cyst-Complication", "_MOC-Paediatrics"], "bodyHtml": "<h3>临床路径</h3>\n<p>儿童颈部肿块目前无统一的标准化处理流程，管理依赖临床判断和对红旗征的警惕。</p>\n<p>### 推荐处理策略</p>\n<p>1. <strong>观察等待（watchful waiting）</strong>：最长 6 周</p>\n<ul>\n<li>适用于怀疑反应性淋巴结炎者</li>\n<li>特征：双侧淋巴结肿大、无恶性肿瘤或深部脓肿的红旗征</li>\n</ul>\n<p>2. <strong>经验性抗生素</strong>（有争议但被广泛接受）：</p>\n<ul>\n<li>适用于怀疑化脓性淋巴结炎者</li>\n<li>特征：淋巴结肿伴明显红斑和压痛、不对称淋巴结肿大、全身症状</li>\n</ul>\n<p>3. <strong>进一步评估指征</strong>：</p>\n<ul>\n<li>抗生素治疗后症状无改善</li>\n<li>肿块持续 >4 周（部分指南建议 >6 周）</li>\n<li>出现红旗征</li>\n</ul>\n<p>### 红旗征（Red Flags）</p>\n<ul>\n<li>锁骨上淋巴结肿大</li>\n<li>固定、质硬的淋巴结</li>\n<li>快速增大</li>\n<li>>2 cm</li>\n<li>纵隔或肺门淋巴结肿大</li>\n<li>全身症状（发热、盗汗、体重下降）</li>\n<li>提示潜在恶性肿瘤</li>\n</ul>\n<p>### 影像学</p>\n<ul>\n<li><strong>首选</strong>：颈部超声</li>\n<li>胸片：有红旗征时（疑诊 TB、恶性肿瘤分期）</li>\n</ul>\n<h3>参考文献 (References)</h3>\n<ul>\n<li>RACGP – AJGP - Paediatric neck lumps: An approach for the primary physician</li>\n<li>AAFP - Evaluation and Management of Neck Masses in Children</li>\n</ul>", "diseases": [], "complaints": [], "search": "儿童颈部肿块 — 评估与处理路径\n儿童颈部肿块 — 评估与处理路径\n # 儿童颈部肿块 — 评估与处理路径 \n 临床路径 \n 儿童颈部肿块目前无统一的标准化处理流程，管理依赖临床判断和对红旗征的警惕。 \n ### 推荐处理策略 \n 1.  观察等待（watchful waiting） ：最长 6 周 \n \n 适用于怀疑反应性淋巴结炎者 \n 特征：双侧淋巴结肿大、无恶性肿瘤或深部脓肿的红旗征 \n \n 2.  经验性抗生素 （有争议但被广泛接受）： \n \n 适用于怀疑化脓性淋巴结炎者 \n 特征：淋巴结肿伴明显红斑和压痛、不对称淋巴结肿大、全身症状 \n \n 3.  进一步评估指征 ： \n \n 抗生素治疗后症状无改善 \n 肿块持续 >4 周（部分指南建议 >6 周） \n 出现红旗征 \n \n ### 红旗征（red flags） \n \n 锁骨上淋巴结肿大 \n 固定、质硬的淋巴结 \n 快速增大 \n >2 cm \n 纵隔或肺门淋巴结肿大 \n 全身症状（发热、盗汗、体重下降） \n 提示潜在恶性肿瘤 \n \n ### 影像学 \n \n  首选 ：颈部超声 \n 胸片：有红旗征时（疑诊 tb、恶性肿瘤分期） \n \n 参考文献 (references) \n \n racgp – ajgp - paediatric neck lumps: an approach for the primary physician \n aafp - evaluation and management of neck masses in children \n "}, {"id": "TR-Wheezing-Child", "type": "tr", "qid": 0, "title": "儿童喘息（Wheezing）— 知识总结", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["diagnosis"], "topic": ["Wheezing in Children — 原因谱 / 处理层次（氧合优先）"], "difficulty": 0, "correctAnswer": "", "page": 1330, "tags": ["topic-review", "amc", "paediatrics", "respiratory", "wheezing", "asthma", "approach-diagnosis"], "cssclass": "tr-paediatrics", "color": "#2d8f96", "file": "02-Topic-Reviews/Paediatrics/TR-Wheezing-Child.md", "stem": "<p>Wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；URTI 尤其是小婴儿也可致 wheeze。处理核心是<strong>先保证氧合</strong>，再诊断性治疗。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p>Wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；URTI 尤其是小婴儿也可致 wheeze。处理核心是<strong>先保证氧合</strong>，再诊断性治疗。</p>\n<h3>关键知识点</h3>\n<p>### 喘息线索（定向）</p>\n<ul>\n<li>喂养相关 → 反流（GERD）</li>\n<li>咳 + 喘 → 哮喘</li>\n<li>体位（仰卧）→ 喉软骨软化（laryngomalacia）</li>\n<li>发热 → 感染</li>\n<li>突发单侧 → 异物吸入（foreign body）</li>\n</ul>\n<p>### 年龄线索</p>\n<ul>\n<li><12 月：bronchiolitis 最常见</li>\n<li><5 岁：asthma 最常见阵发性喘息（此龄避免确诊\"哮喘\"，用 wheeze syndrome / viral wheeze）</li>\n<li>早发喘息 → 先天问题</li>\n</ul>\n<h3>表 / 对照 / 速记</h3>\n<table class='md-table'>\n<thead><tr><th>频率</th><th>原因</th></tr></thead>\n<tbody>\n<tr><td>常见</td><td>过敏、哮喘/反应性气道病、GERD、感染（肺炎/支气营炎/支气管炎/URI）、OSA</td></tr>\n<tr><td>少见</td><td>支气管肺发育不良、异物吸入</td></tr>\n<tr><td>罕见</td><td>先天性血管异常、CHF、CF、BO、免疫缺陷、纵隔肿瘤、气管支气管畸形、PCD、肿瘤、声带功能障碍</td></tr>\n</tbody>\n</table>\n<p>### 处理层次（关键） 1. <strong>保证氧合</strong>（给氧 + 必要时入院）——先于一切 2. 沙丁胺醇试验（年龄小用雾化；诊断 + 治疗兼顾，响应支持哮喘） 3. 抗生素仅疑肺炎后 4. 胸物理价值有限 5. CXR：不响应/反复喘息者</p>\n<h3>临床要点</h3>\n<ul>\n<li>Wheeze 是任何段呼吸道狭窄，不只下呼吸道。</li>\n<li><5 岁喘息多病毒性的，避免过早贴\"哮喘\"标签。</li>\n<li>突发单侧 wheeze → 高度疑异物。</li>\n<li>处理顺序：氧合 > 支气舒张剂 > 抗感染检查。</li>\n</ul>\n<h3>常见考点</h3>\n<ul>\n<li>哮喘 = <5 岁阵发性喘息最常见。</li>\n<li>突发单侧 wheeze = 异物。</li>\n<li>处理首步是氧合，不是立即支气舒张剂。</li>\n<li>首程喘息疑哮喘可不做 CXR。</li>\n</ul>", "diseases": ["Childhood Asthma"], "complaints": [], "search": "儿童喘息（wheezing）— 知识总结\nwheezing in children — 原因谱 / 处理层次（氧合优先）\ndiagnosis\n wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；urti 尤其是小婴儿也可致 wheeze。处理核心是 先保证氧合 ，再诊断性治疗。 \n 概要 \n wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；urti 尤其是小婴儿也可致 wheeze。处理核心是 先保证氧合 ，再诊断性治疗。 \n 关键知识点 \n ### 喘息线索（定向） \n \n 喂养相关 → 反流（gerd） \n 咳 + 喘 → 哮喘 \n 体位（仰卧）→ 喉软骨软化（laryngomalacia） \n 发热 → 感染 \n 突发单侧 → 异物吸入（foreign body） \n \n ### 年龄线索 \n \n  \n  \n 早发喘息 → 先天问题 \n \n 表 / 对照 / 速记 \n \n   频率  原因   \n \n  常见  过敏、哮喘/反应性气道病、gerd、感染（肺炎/支气营炎/支气管炎/uri）、osa  \n  少见  支气管肺发育不良、异物吸入  \n  罕见  先天性血管异常、chf、cf、bo、免疫缺陷、纵隔肿瘤、气管支气管畸形、pcd、肿瘤、声带功能障碍  \n \n \n ### 处理层次（关键） 1.  保证氧合 （给氧 + 必要时入院）——先于一切 2. 沙丁胺醇试验（年龄小用雾化；诊断 + 治疗兼顾，响应支持哮喘） 3. 抗生素仅疑肺炎后 4. 胸物理价值有限 5. cxr：不响应/反复喘息者 \n 临床要点 \n \n wheeze 是任何段呼吸道狭窄，不只下呼吸道。 \n  \n 突发单侧 wheeze → 高度疑异物。 \n 处理顺序：氧合 > 支气舒张剂 > 抗感染检查。 \n \n 常见考点 \n \n 哮喘 =  \n 突发单侧 wheeze = 异物。 \n 处理首步是氧合，不是立即支气舒张剂。 \n 首程喘息疑哮喘可不做 cxr。 \n "}, {"id": "AMC-Q1122", "type": "mcq", "qid": 1122, "title": "AMC-Q1122 — Vertigo in a 4-year-old boy", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["儿童眩晕 — 排查严重病因"], "difficulty": 3, "correctAnswer": "B", "page": 1342, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1122-Vertigo-Children-CNS-Workup.md", "stem": "<p>A 4-year-old boy is brought to your practice by his parents because of what they think to be vertigo. The boy suddenly starts feeling that the world is spinning around him. Each episode lasts for about one to two minutes, while the child is fully conscious. This has happened once a month for the past three months. His past medical history is unremarkable. He has had no headache, nausea, or vomiting before, during, or after the attacks. Physical examination including ear exam is normal. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Reassure the parents as this is very likely to be benign paroxysmal positional vertigo (BPPV)"}, {"letter": "B", "text": "EEG and CT scan of the head"}, {"letter": "C", "text": "Audiology and ENT referral"}, {"letter": "D", "text": "MRI of the head"}, {"letter": "E", "text": "Psychiatric assessment"}], "rationale": "<ul>\n<li>关键认知：<strong>儿童眩晕与成人不同</strong> — 儿童眩晕往往有严重病因</li>\n<li>儿童眩晕首要排查：</li>\n<li><strong>脑肿瘤</strong>（如髓母细胞瘤）</li>\n<li><strong>颞叶癫痫</strong></li>\n<li>短阵（1-2 分钟）、反复发作、伴意识保持 → 符合<strong>颞叶癫痫</strong>特征</li>\n<li>耳科检查正常 → 排除外周前庭病变</li>\n<li>下一步：先做 <strong>EEG（排查癫痫）+ CT 头部（排查占位）</strong>作为筛查</li>\n<li>各选项分析：</li>\n<li>A（安抚 + BPPV）— BPPV 罕见于儿童，是<strong>排除诊断</strong></li>\n<li>C（听力学 + ENT）— 用于外周病因，但 CNS 病因未排除</li>\n<li>D（MRI）— 更敏感但<strong>贵且需镇静</strong>，常作为 CT 后补充</li>\n<li>E（精神科）— 患儿表现不支持</li>\n</ul>", "traps": "<ul>\n<li>选 A — 把儿童眩晕当作 BPPV 草率安抚，会漏掉脑肿瘤</li>\n<li>选 D（MRI 直接上）— MRI 需镇静；先 EEG + CT 是更高效的筛查组合</li>\n</ul>", "summary": "<p><strong>儿童眩晕病因谱</strong>（按严重度排）：</p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>病因</th></tr></thead>\n<tbody>\n<tr><td><strong>CNS 严重病因（先排除）</strong></td><td>脑肿瘤（髓母细胞瘤）、颞叶癫痫、CNS 感染</td></tr>\n<tr><td>创伤</td><td>颞部外伤</td></tr>\n<tr><td>中耳病变</td><td>中耳炎</td></tr>\n<tr><td>药物/毒物</td><td>处方药、酒精、违禁药</td></tr>\n<tr><td>偏头痛相关</td><td>BPPV（儿童偏头痛变异型）</td></tr>\n<tr><td>其他</td><td>迷路炎</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：儿童眩晕 ≠ 成人眩晕。<strong>先排除脑肿瘤和癫痫</strong>，再考虑良性病因。</p>\n<p><strong>BPPV in childhood</strong> often precedes migraine in adulthood。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>虽然患者可能混淆头晕和眩晕，但儿童描述的旋转感很可能为真正的眩晕而非头晕。<strong>与成人不同，儿童眩晕常由严重原因引起，如脑肿瘤（例如髓母细胞瘤）或颞叶癫痫</strong>。</p>\n<p>在每个有眩晕的儿童中，应排除癫痫和 CNS 肿瘤作为最合适的下一步管理，且必须考虑早期转诊专科评估。</p>\n<p>除癫痫和 CNS 肿瘤外，以下情况也可引起儿童眩晕：</p>\n<ul>\n<li>CNS 感染</li>\n<li>创伤，特别是颞部创伤</li>\n<li>中耳感染</li>\n<li>处方药</li>\n<li>酒精和其他违禁药物</li>\n<li>BPPV（罕见）</li>\n<li>迷路炎</li>\n</ul>\n<ul>\n<li>（选项 A）儿童 BPPV 被认为是儿童偏头痛变异型，临床表现与该场景相似。然而，BPPV 在儿童中罕见，是一种排除性诊断，只有在排除其他原因后才能作出。<strong>虽然 CNS 肿瘤是更常见和严重的诊断，但基于匆忙的 BPPV 诊断安抚父母是不合适的</strong>。</li>\n</ul>\n<p><strong>注</strong>——儿童期 BPPV 通常先于成年期偏头痛出现。</p>\n<ul>\n<li>（选项 C）一般来说，神经科转诊（而非 ENT 转诊）是合适且安全的选择，因为 CNS 肿瘤和癫痫是儿童这种表现的主要鉴别诊断。听力学评估和 ENT 转诊在 CNS 相关原因被安全排除后才是合适的。</li>\n<li>（选项 D）如果在初步 CT 扫描评估期间怀疑 CNS 肿瘤，可考虑稍后进行 MRI。</li>\n<li>（选项 E）该儿童似乎没有精神问题，精神科评估不是合适的初始管理选择。</li>\n</ul>", "references": "<ul>\n<li>John Murtagh - Murtagh's General Practice – McGraw Hill – 6th Edition – page 530</li>\n<li>ILAE - Epilepsy Imitators</li>\n</ul>", "related": ["AMC-Q1211-Congenital-Sensorineural-Deafness"], "bodyHtml": "", "diseases": ["Childhood Vertigo"], "complaints": ["headache", "nausea/vomiting"], "search": "amc-q1122 — vertigo in a 4-year-old boy\n儿童眩晕 — 排查严重病因\n a 4-year-old boy is brought to your practice by his parents because of what they think to be vertigo. the boy suddenly starts feeling that the world is spinning around him. each episode lasts for about one to two minutes, while the child is fully conscious. this has happened once a month for the past three months. his past medical history is unremarkable. he has had no headache, nausea, or vomiting before, during, or after the attacks. physical examination including ear exam is normal. which one of the following is the most appropriate next step in management? \n correct answer is  b  \n 虽然患者可能混淆头晕和眩晕，但儿童描述的旋转感很可能为真正的眩晕而非头晕。 与成人不同，儿童眩晕常由严重原因引起，如脑肿瘤（例如髓母细胞瘤）或颞叶癫痫 。 \n 在每个有眩晕的儿童中，应排除癫痫和 cns 肿瘤作为最合适的下一步管理，且必须考虑早期转诊专科评估。 \n 除癫痫和 cns 肿瘤外，以下情况也可引起儿童眩晕： \n \n cns 感染 \n 创伤，特别是颞部创伤 \n 中耳感染 \n 处方药 \n 酒精和其他违禁药物 \n bppv（罕见） \n 迷路炎 \n \n \n （选项 a）儿童 bppv 被认为是儿童偏头痛变异型，临床表现与该场景相似。然而，bppv 在儿童中罕见，是一种排除性诊断，只有在排除其他原因后才能作出。 虽然 cns 肿瘤是更常见和严重的诊断，但基于匆忙的 bppv 诊断安抚父母是不合适的 。 \n \n  注 ——儿童期 bppv 通常先于成年期偏头痛出现。 \n \n （选项 c）一般来说，神经科转诊（而非 ent 转诊）是合适且安全的选择，因为 cns 肿瘤和癫痫是儿童这种表现的主要鉴别诊断。听力学评估和 ent 转诊在 cns 相关原因被安全排除后才是合适的。 \n （选项 d）如果在初步 ct 扫描评估期间怀疑 cns 肿瘤，可考虑稍后进行 mri。 \n （选项 e）该儿童似乎没有精神问题，精神科评估不是合适的初始管理选择。 \n "}, {"id": "AMC-Q1211", "type": "mcq", "qid": 1211, "title": "AMC-Q1211 — Rinne/Weber interpretation in a child", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["听力检查 — Rinne/Weber 解读"], "difficulty": 3, "correctAnswer": "C", "page": 1345, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1211-Congenital-Sensorineural-Deafness.md", "stem": "<p>A 10-year-old boy is referred to your clinic from his school for assessment of probable hearing deficit because he has difficulty in hearing resulting in dropped school performance. You carry out a Rinne test that is positive in both ears. A Weber test shows no lateralization; however, he has symmetrical decreased hearing threshold. Which one of the following options could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Presbycusis"}, {"letter": "B", "text": "Otosclerosis"}, {"letter": "C", "text": "Congenital sensorineural deafness"}, {"letter": "D", "text": "Chronic perforation of the tympanic membrane"}, {"letter": "E", "text": "Chronic secretory otitis media with effusion"}], "rationale": "<ul>\n<li>关键检查解读：</li>\n<li><strong>Rinne 阳性（正常）= AC > BC</strong>（气导 > 骨导），<strong>排除传导性聋</strong></li>\n<li><strong>Weber 无偏侧</strong>= 两侧听力相等（或双侧均减退但对称）</li>\n<li>综合：<strong>对称性感音神经性聋</strong></li>\n<li>排除分析：</li>\n<li>A（老年性聋）— 患儿 10 岁，<strong>年龄不符</strong></li>\n<li>B（耳硬化症）— 早期即<strong>传导性聋</strong>（Rinne 阴性）</li>\n<li>D（鼓膜穿孔）— <strong>传导性聋</strong></li>\n<li>E（分泌性中耳炎）— <strong>传导性聋</strong></li>\n<li>10 岁 + 对称性感音神经性聋 → <strong>先天性聋</strong>（孤立或综合征型）</li>\n</ul>", "traps": "<ul>\n<li>选 B（耳硬化症）— Rinne 阳性已<strong>排除传导性聋</strong></li>\n<li>选 A（老年性聋）— 儿童不会有 presbycusis</li>\n</ul>", "summary": "<p><strong>Rinne & Weber 解读</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>临床情况</th><th>Rinne</th><th>Weber</th><th>类型</th></tr></thead>\n<tbody>\n<tr><td>正常</td><td>双侧 AC>BC</td><td>无偏侧</td><td>—</td></tr>\n<tr><td>右侧传导性聋</td><td>右侧 BC>AC</td><td>偏向<strong>右</strong></td><td>传导性</td></tr>\n<tr><td>右侧感音神经性聋</td><td>右侧 AC>BC</td><td>偏向<strong>左</strong>（健侧）</td><td>感音神经性</td></tr>\n<tr><td><strong>双侧对称性感音神经性聋</strong></td><td><strong>双侧 AC>BC</strong>（阳性）</td><td><strong>无偏侧</strong></td><td>感音神经性</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：</p>\n<ul>\n<li><strong>感音神经性聋 + 儿童</strong> → 考虑<strong>先天性</strong>（孤立/综合征型，如 Waardenburg、Usher）</li>\n<li>Weber 无偏侧 ≠ 正常；可能为双侧对称性聋</li>\n<li>Rinne/Weber 是<strong>筛查</strong>，<strong>不是</strong>正式听力测试替代</li>\n</ul>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>在临床实践中常看到主诉听力损失的患者。能够区分听力损失原因所在部位是很有用的。这有助于指导进一步检查、调查和管理的需要。Rinne 试验和 Weber 试验用于鉴别传导性聋（中耳和外耳原因）和感音神经性聋（由耳蜗或第 8 对脑神经——或其中枢连接——损伤引起）。<strong>这些试验总是同时进行</strong>。Rinne 试验先做。</p>\n<p>外耳的功能是收集来自空气的声音振动并将其聚焦到鼓膜上。这些振动然后通过中耳腔的听骨链（锤骨、砧骨和镫骨）传递。镫骨通过卵圆窗（fenestra ovalis）将这些振动传递到耳蜗。声音也可以通过颅骨传递到耳蜗。耳蜗中的毛细胞将物理振动转化为动作电位，通过前庭蜗（听觉）神经中的神经传递到脑干进行进一步处理。</p>\n<p>Rinne 和 Weber 试验用于快速筛查传导性与感音神经性听力损失。Rinne 试验用于评估单耳听力损失（单侧听力损失），比较气导和通过乳突的骨导声音感知。因此，筛查传导性听力损失的存在。</p>\n<p>对于 Rinne 试验，将振动的音叉（通常 512 Hz）最初放置在每只耳后方的乳突上，直到听不到声音，以患者示意表示。然后立即将音叉放在耳朵外侧，让患者报告振动声音何时听不到。<strong>正常或 Rinne 阳性是当耳外听到的声音（气导或 AC）比耳后乳突上的声音（骨导或 BC）更大</strong>。因此，AC > BC；这是临床上正常或阳性 Rinne 结果的报告方式。在传导性听力损失中，骨导优于气导或 BC > AC，Rinne 阴性。</p>\n<p>在 Weber 试验中，将振动的音叉（通常 256 Hz 或 512 Hz）放在前额中部，或鼻上唇上方，或头顶部，与患者的耳朵等距。然后要求患者报告哪只耳朵听到的声音更大。<strong>Weber 试验结果是正常（阳性）当患者报告两侧听到的声音相同</strong>。偏侧（一侧听得更好）是由于感音神经性或传导性问题。<strong>在感音神经性听力损失患者中，正常耳比患耳听得更好</strong>。在传导性听力损失患者中，声音偏向患侧。</p>\n<p><strong>注——对称性听力损失的患者也有阳性（正常）Weber 试验结果，因为双耳受累相等且尽管存在听力损失但不发生偏侧</strong>。</p>\n<p>这两个试验的结果进行比较以定位和表征任何检测到的听力损失的性质。然而，这些试验是筛查试验，不能替代正式的听力测定。</p>\n<p><strong>该男孩双耳阳性（正常）Rinne 试验排除传导性损害</strong>。Weber 试验双耳也阳性表明没有偏侧。<strong>基于这些发现，慢性鼓膜穿孔（选项 D）、慢性分泌性中耳炎（选项 E）和耳硬化症（选项 B）从鉴别诊断中排除</strong>。该男孩应该有影响双耳相等的听力问题。</p>\n<p><strong>注</strong>——耳硬化症是一种以镫骨与砧骨融合为特征的疾病，导致传导性听力损失。该病在年轻成人中更常见。该男孩 Rinne 试验正常，所以这种情况不太可能是其听力损失的原因。</p>\n<p><strong>老年性聋（选项 A）是衰老个体感音神经性听力损失的最常见原因</strong>。10 岁男孩不太可能有老年性聋。</p>\n<p><strong>基于检查结果和儿童年龄，先天性感音神经性聋（孤立或与综合征相关）可能是最可能的诊断</strong>。</p>", "references": "<ul>\n<li>Medscape - Hearing Impairment</li>\n<li>Medscape - Genetic Sensorineural Hearing Loss</li>\n</ul>", "related": ["AMC-Q1122-Vertigo-Children-CNS-Workup"], "bodyHtml": "", "diseases": ["Sensorineural Hearing Loss"], "complaints": [], "search": "amc-q1211 — rinne/weber interpretation in a child\n听力检查 — rinne/weber 解读\n a 10-year-old boy is referred to your clinic from his school for assessment of probable hearing deficit because he has difficulty in hearing resulting in dropped school performance. you carry out a rinne test that is positive in both ears. a weber test shows no lateralization; however, he has symmetrical decreased hearing threshold. which one of the following options could be the most likely diagnosis? \n correct answer is  c  \n 在临床实践中常看到主诉听力损失的患者。能够区分听力损失原因所在部位是很有用的。这有助于指导进一步检查、调查和管理的需要。rinne 试验和 weber 试验用于鉴别传导性聋（中耳和外耳原因）和感音神经性聋（由耳蜗或第 8 对脑神经——或其中枢连接——损伤引起）。 这些试验总是同时进行 。rinne 试验先做。 \n 外耳的功能是收集来自空气的声音振动并将其聚焦到鼓膜上。这些振动然后通过中耳腔的听骨链（锤骨、砧骨和镫骨）传递。镫骨通过卵圆窗（fenestra ovalis）将这些振动传递到耳蜗。声音也可以通过颅骨传递到耳蜗。耳蜗中的毛细胞将物理振动转化为动作电位，通过前庭蜗（听觉）神经中的神经传递到脑干进行进一步处理。 \n rinne 和 weber 试验用于快速筛查传导性与感音神经性听力损失。rinne 试验用于评估单耳听力损失（单侧听力损失），比较气导和通过乳突的骨导声音感知。因此，筛查传导性听力损失的存在。 \n 对于 rinne 试验，将振动的音叉（通常 512 hz）最初放置在每只耳后方的乳突上，直到听不到声音，以患者示意表示。然后立即将音叉放在耳朵外侧，让患者报告振动声音何时听不到。 正常或 rinne 阳性是当耳外听到的声音（气导或 ac）比耳后乳突上的声音（骨导或 bc）更大 。因此，ac > bc；这是临床上正常或阳性 rinne 结果的报告方式。在传导性听力损失中，骨导优于气导或 bc > ac，rinne 阴性。 \n 在 weber 试验中，将振动的音叉（通常 256 hz 或 512 hz）放在前额中部，或鼻上唇上方，或头顶部，与患者的耳朵等距。然后要求患者报告哪只耳朵听到的声音更大。 weber 试验结果是正常（阳性）当患者报告两侧听到的声音相同 。偏侧（一侧听得更好）是由于感音神经性或传导性问题。 在感音神经性听力损失患者中，正常耳比患耳听得更好 。在传导性听力损失患者中，声音偏向患侧。 \n  注——对称性听力损失的患者也有阳性（正常）weber 试验结果，因为双耳受累相等且尽管存在听力损失但不发生偏侧 。 \n 这两个试验的结果进行比较以定位和表征任何检测到的听力损失的性质。然而，这些试验是筛查试验，不能替代正式的听力测定。 \n  该男孩双耳阳性（正常）rinne 试验排除传导性损害 。weber 试验双耳也阳性表明没有偏侧。 基于这些发现，慢性鼓膜穿孔（选项 d）、慢性分泌性中耳炎（选项 e）和耳硬化症（选项 b）从鉴别诊断中排除 。该男孩应该有影响双耳相等的听力问题。 \n  注 ——耳硬化症是一种以镫骨与砧骨融合为特征的疾病，导致传导性听力损失。该病在年轻成人中更常见。该男孩 rinne 试验正常，所以这种情况不太可能是其听力损失的原因。 \n  老年性聋（选项 a）是衰老个体感音神经性听力损失的最常见原因 。10 岁男孩不太可能有老年性聋。 \n  基于检查结果和儿童年龄，先天性感音神经性聋（孤立或与综合征相关）可能是最可能的诊断 。 "}, {"id": "AMC-Q1337", "type": "mcq", "qid": 1337, "title": "急性乳突炎 — AOM 最常见化脓性并发症", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["急性中耳炎并发症 — 急性乳突炎最常见致病菌"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1337-Acute-Mastoiditis-Pathogen.md", "stem": "<p>Rachel, 5 years old, is brought to your GP clinic by her mother because of pain and redness in the back of her left ear. According to the mother, Rachel developed fever and left ear ache one week ago, for which he was seen by another GP and started on paracetamol and amoxicillin. She was feeling better for the first 4 days but spiked a fever again and developed a painful red swelling behind her left ear. On examination, she has a warm, red, and tender swelling behind the left ear shown in the accompanying photograph. Which one of the following could be the most likely pathogenic factor for this presentation?</p>", "options": [{"letter": "A", "text": "Staphylococcus aureus."}, {"letter": "B", "text": "Streptococcus pneumoniae."}, {"letter": "C", "text": "Hemophilus influenzae."}, {"letter": "D", "text": "Moraxella catarrhalis."}, {"letter": "E", "text": "Streptococcus viridans."}], "rationale": "<p>1. 题型识别：并发症 — AOM 治疗过程中出现耳后红肿热痛 2. 关键线索：</p>\n<ul>\n<li>1 周前耳痛 + 发热，口服阿莫西林</li>\n<li>前 4 天好转 → 再次发热 + 耳后红肿热痛</li>\n<li>体格检查：左耳后温暖、红肿、压痛</li>\n<li>= AOM → 急性乳突炎（acute mastoiditis）</li>\n<p>3. 致病菌谱 = AOM 致病菌：肺炎链球菌 > 50%，流感嗜血杆菌第二 4. 锁定答案：最常见的致病菌 → B（肺炎链球菌）</p>\n</ul>", "traps": "<ul>\n<li><strong>金葡菌混淆</strong>：耳后红肿 + 抗生素部分有效 + 复发 → 容易想成金葡菌感染或脓肿。但 AOM 并发症的致病菌谱与 AOM 一致</li>\n<li><strong>流感嗜血杆菌</strong>：第二常见 ≠ 最常见，题干问 \"most likely\"</li>\n</ul>", "summary": "<p><strong>急性乳突炎</strong>（acute mastoiditis）：</p>\n<ul>\n<li>AOM 最常见的化脓性并发症</li>\n<li>可导致颅内并发症，需高度重视</li>\n<li>诊断：耳后炎性体征（红斑、水肿、压痛、波动感）+ 耳廓/外耳道水肿 + AOM 体征</li>\n<li>治疗：静脉抗生素（氟氯西林 + 三代头孢）+ 紧急 ENT 会诊，部分需手术</li>\n<li>致病菌：<strong>肺炎链球菌 > 50%</strong>，流感嗜血杆菌第二</li>\n</ul>", "explanation": "<p>1 周前单侧耳痛 + 发热病史，后出现耳后红肿压痛 — 最可能诊断为急性中耳炎并发急性乳突炎。急性乳突炎虽然罕见，但是 AOM 最常见的化脓性并发症。</p>\n<p>致病菌谱与 AOM 一致：肺炎链球菌最常见（>50% 病例），流感嗜血杆菌第二常见。金葡菌、卡他莫拉菌和草绿色链球菌在 AOM 和急性乳突炎中较少见。</p>", "references": "<ul>\n<li>(Refer to acute mastoiditis and AOM guidelines)</li>\n</ul>", "related": ["AMC-Q1343-AOM-Causative-Organism", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["fever"], "search": "急性乳突炎 — aom 最常见化脓性并发症\n急性中耳炎并发症 — 急性乳突炎最常见致病菌\n rachel, 5 years old, is brought to your gp clinic by her mother because of pain and redness in the back of her left ear. according to the mother, rachel developed fever and left ear ache one week ago, for which he was seen by another gp and started on paracetamol and amoxicillin. she was feeling better for the first 4 days but spiked a fever again and developed a painful red swelling behind her left ear. on examination, she has a warm, red, and tender swelling behind the left ear shown in the accompanying photograph. which one of the following could be the most likely pathogenic factor for this presentation? \n 1 周前单侧耳痛 + 发热病史，后出现耳后红肿压痛 — 最可能诊断为急性中耳炎并发急性乳突炎。急性乳突炎虽然罕见，但是 aom 最常见的化脓性并发症。 \n 致病菌谱与 aom 一致：肺炎链球菌最常见（>50% 病例），流感嗜血杆菌第二常见。金葡菌、卡他莫拉菌和草绿色链球菌在 aom 和急性乳突炎中较少见。 "}, {"id": "AMC-Q1343", "type": "mcq", "qid": 1343, "title": "AOM 最常见致病菌 — 肺炎链球菌", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["急性中耳炎最常见致病菌 — 肺炎链球菌"], "difficulty": 1, "correctAnswer": "B", "page": 1363, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1343-AOM-Causative-Organism.md", "stem": "<p>A 5-year-old child is brought to your practice by his parents with complaints of fever and ear pain. On examination, he is in mild distress and has a fever of 38.3°C. Otoscopic examination reveals a red bulging tympanic membrane on the right side with decreased mobility. Which one of the following is more likely to have caused this presentation?</p>", "options": [{"letter": "A", "text": "Hemophilus influenza."}, {"letter": "B", "text": "Streptococcus pneumoniae."}, {"letter": "C", "text": "Pseudomonas aeruginosa."}, {"letter": "D", "text": "RSV virus."}, {"letter": "E", "text": "Moraxella catarrhalis."}], "rationale": "<p>1. 题型识别：病因学 — AOM 的致病菌 2. 关键线索：红色膨隆鼓膜 + 活动度下降 → 典型 AOM 3. AOM 细菌学（>6 周龄）：</p>\n<ul>\n<li>肺炎链球菌 → 最常见</li>\n<li>流感嗜血杆菌 → 第二常见</li>\n<li>卡他莫拉菌、化脓性链球菌 → 其次</li>\n<p>4. RSV 在新生儿中可引起中耳炎，但肺炎链球菌仍是该年龄段最常见的病因 5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>RSV 陷阱</strong>：RSV 与新生儿肺炎/细支气管炎/中耳炎相关，但肺炎链球菌仍是该年龄段 AOM 最常见病因 — 别被年龄误导</li>\n<li><strong>流感嗜血杆菌</strong>：第二常见 ≠ 最常见</li>\n</ul>", "summary": "<p>AOM 典型体征：红色膨隆鼓膜 + 活动度下降。</p>\n<p>6 周龄儿童 AOM 最常见致病菌：<strong>肺炎链球菌</strong> > 流感嗜血杆菌 > 卡他莫拉菌 > 化脓性链球菌。其他：金葡菌、草绿色链球菌、铜绿假单胞菌。</p>\n<p>RSV 在新生儿中可引起中耳炎，但肺炎链球菌仍最常见。</p>", "explanation": "<p>红色膨隆鼓膜伴活动度下降是急性中耳炎（AOM）的经典体征。>6 周龄儿童 AOM 绝大多数由细菌引起，肺炎链球菌是各年龄段儿童 AOM 和侵袭性细菌感染最常见的病原体，其次是流感嗜血杆菌。</p>\n<p>RSV 主要在新生儿中为致病因素，与该年龄段的肺炎、细支气管炎和中耳炎相关，但即使在这一年龄段，肺炎链球菌仍是 AOM 最常见的病原体。</p>", "references": "<ul>\n<li>Therapeutic Guidelines - Antibiotics</li>\n<li>Medscape - Acute Otitis Media</li>\n</ul>", "related": ["AMC-Q1337-Acute-Mastoiditis-Pathogen", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["fever"], "search": "aom 最常见致病菌 — 肺炎链球菌\n急性中耳炎最常见致病菌 — 肺炎链球菌\n a 5-year-old child is brought to your practice by his parents with complaints of fever and ear pain. on examination, he is in mild distress and has a fever of 38.3°c. otoscopic examination reveals a red bulging tympanic membrane on the right side with decreased mobility. which one of the following is more likely to have caused this presentation? \n 红色膨隆鼓膜伴活动度下降是急性中耳炎（aom）的经典体征。>6 周龄儿童 aom 绝大多数由细菌引起，肺炎链球菌是各年龄段儿童 aom 和侵袭性细菌感染最常见的病原体，其次是流感嗜血杆菌。 \n rsv 主要在新生儿中为致病因素，与该年龄段的肺炎、细支气管炎和中耳炎相关，但即使在这一年龄段，肺炎链球菌仍是 aom 最常见的病原体。 "}, {"id": "AMC-Q1423", "type": "mcq", "qid": 1423, "title": "甲状舌管囊肿并发症 — 感染最常见", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["甲状舌管囊肿最常见并发症 — 感染"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1423-Thyroglossal-Duct-Cyst-Complication.md", "stem": "<p>A 6-year-old girl is brought to your general practice by her mother, who is concerned about a neck mass in her daughter. The mass is shown in the following photograph. The child is otherwise healthy. On examination, there is a non-tender neck mass in the midline moving with swallowing and tongue protrusion. The rest of the physical examination is unremarkable. Which one of the following could be the most likely complication of this neck mass?</p>", "options": [{"letter": "A", "text": "Infection."}, {"letter": "B", "text": "Malignancy."}, {"letter": "C", "text": "Fistula formation."}, {"letter": "D", "text": "Overgrowth and compression of underlying structures."}, {"letter": "E", "text": "Rupture."}], "rationale": "<p>1. 题型识别：并发症 — 甲状舌管囊肿的自然史 2. 关键线索：中线颈部肿块 + 随吞咽和伸舌移动 → <strong>甲状舌管囊肿</strong>（thyroglossal duct cyst, TDC） 3. TDC 并发症排序：</p>\n<ul>\n<li><strong>感染</strong> → 最常见（红肿热痛）</li>\n<li>恶变 → ≈1%（乳头状癌 > 滤泡-乳头状 > 鳞状细胞癌）</li>\n<li>压迫 → 增大压迫下方结构（气道梗阻需重点关注）</li>\n<li>破裂 + 瘘管形成</li>\n<p>4. 锁定答案：感染 → A</p>\n</ul>", "traps": "<ul>\n<li><strong>恶变混淆</strong>：恶变是第二常见并发症，≈1%，易被过度关注；但考试问 \"most likely\" 应选感染</li>\n<li><strong>\"non-tender\" 不代表不会感染</strong>：目前 non-tender 是因为未感染；感染后才会出现红肿热痛</li>\n</ul>", "summary": "<p><strong>甲状舌管囊肿（TDC）</strong>：胚胎期甲状舌管未完全退化形成的先天性中线颈部囊性病变。</p>\n<ul>\n<li>典型体征：中线肿块，<strong>随吞咽和伸舌移动</strong></li>\n<li>并发症排序：<strong>感染 > 恶变（≈1%，乳头状癌最常见）> 增大压迫（可致气道梗阻）> 破裂/瘘管形成</strong></li>\n</ul>", "explanation": "<p>甲状舌管囊肿可出现并发症，包括感染、恶变、增大压迫下方结构和破裂/瘘管形成。其中<strong>感染最常见</strong>，表现为红肿热痛。</p>\n<p>恶变约占 TDC 患者的 1%，乳头状癌最常见，其次为滤泡-乳头状癌和鳞状细胞癌。囊肿增大压迫下方结构可导致气道梗阻。</p>", "references": "<ul>\n<li>Medscape – Thyroglossal Duct Cyst Imaging</li>\n<li>PubMed - Thyroglossal Duct Cyst—More Than Just an Embryological Remnant</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "甲状舌管囊肿并发症 — 感染最常见\n甲状舌管囊肿最常见并发症 — 感染\n a 6-year-old girl is brought to your general practice by her mother, who is concerned about a neck mass in her daughter. the mass is shown in the following photograph. the child is otherwise healthy. on examination, there is a non-tender neck mass in the midline moving with swallowing and tongue protrusion. the rest of the physical examination is unremarkable. which one of the following could be the most likely complication of this neck mass? \n 甲状舌管囊肿可出现并发症，包括感染、恶变、增大压迫下方结构和破裂/瘘管形成。其中 感染最常见 ，表现为红肿热痛。 \n 恶变约占 tdc 患者的 1%，乳头状癌最常见，其次为滤泡-乳头状癌和鳞状细胞癌。囊肿增大压迫下方结构可导致气道梗阻。 "}, {"id": "AMC-Q1572", "type": "mcq", "qid": 1572, "title": "后三角区无痛性淋巴结 — FNAC 排除恶性肿瘤", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["后三角区淋巴结 + 红旗征 → FNAC 排除恶性肿瘤"], "difficulty": 3, "correctAnswer": "E", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1572-Posterior-Triangle-LN-FNA.md", "stem": "<p>A 5-year-old boy is presented to your practice with headache and vomiting for the past 6 weeks. On examination, he has a temperature of 37.8°C. A non-tender lymph node is palpated in the posterior triangle of the neck. Which one of the following is the investigation to consider at this stage?</p>", "options": [{"letter": "A", "text": "Blood culture."}, {"letter": "B", "text": "CT scan of the head."}, {"letter": "C", "text": "Urine culture."}, {"letter": "D", "text": "Lumbar puncture."}, {"letter": "E", "text": "Fine needle aspiration of the lymph node."}], "rationale": "<p>1. 题型识别：检查选择 — 儿童颈部淋巴结肿大的危险信号评估 2. 关键线索：</p>\n<ul>\n<li><strong>后三角区</strong>淋巴结 → 恶性肿瘤关联性更高</li>\n<li><strong>无痛性</strong>（non-tender）→ 非反应性</li>\n<li>头痛 + 呕吐 6 周 + 低热 → 全身性疾病线索</li>\n<li>无明确前驱病毒/细菌感染史</li>\n<p>3. 危险信号（Red flags）：</p>\n<li>后三角区/锁骨上淋巴结</li>\n<li>无痛性、固定、质硬、不规则</li>\n<li>快速增大、>2 cm</li>\n<li>全身症状</li>\n<p>4. 鉴别排除：血培养（A）/ 腰穿（D）→ 无急性感染/脑膜炎证据；CT 头（B）→ 无颅内压升高/局灶神经体征；尿培养（C）→ 无泌尿道症状 5. 锁定答案：超声引导 FNAC → E</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有头痛呕吐就查头 CT\"</strong>：无颅内压升高或局灶神经体征时，头 CT 非首选</li>\n<li><strong>反应性 vs 恶性淋巴结</strong>：反应性通常有压痛、双侧、前驱感染史；<strong>后三角区 + 无痛性</strong>应高度警惕恶性</li>\n<li><strong>观察等待 6 周</strong>：适用于高度疑似反应性淋巴结（近期感染史 + 压痛），不适用于有红旗征者</li>\n</ul>", "summary": "<p>儿童颈部淋巴结红旗征：</p>\n<ul>\n<li>后三角区或锁骨上淋巴结</li>\n<li>无痛性、质硬、不规则、固定</li>\n<li>>2 cm 或快速增大</li>\n<li>全身症状（发热、盗汗、体重下降）</li>\n</ul>\n<p>后三角区淋巴结 + 红旗征 → <strong>超声引导 FNAC</strong>（高灵敏度和特异度，但有创伤和不充分取样风险）。</p>", "explanation": "<p>该患儿有轻度发热但不确定是否持续。后三角区触及淋巴结但不清楚是否已存在 >6 周。头痛和呕吐本身非红旗征，但结合无痛性后三角区淋巴结肿大，整体临床图景指向潜在恶性疾病。后三角区淋巴结肿大与恶性肿瘤的关联性更高。</p>\n<p>因此，超声引导下细针穿刺抽吸（FNAC）是最合适的首选检查。虽然 FNAC 有创伤且存在组织取样不充分的风险，但被认为具有高灵敏度和特异度。</p>", "references": "<ul>\n<li>RACGP – AJGP - Paediatric neck lumps: An approach for the primary physician</li>\n<li>AAFP - Evaluation and Management of Neck Masses in Children</li>\n</ul>", "related": ["AMC-QNA-P1382-Paediatric-Neck-Mass", "TR-Paediatric-Neck-Masses-Approach", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["headache", "nausea/vomiting"], "search": "后三角区无痛性淋巴结 — fnac 排除恶性肿瘤\n后三角区淋巴结 + 红旗征 → fnac 排除恶性肿瘤\n a 5-year-old boy is presented to your practice with headache and vomiting for the past 6 weeks. on examination, he has a temperature of 37.8°c. a non-tender lymph node is palpated in the posterior triangle of the neck. which one of the following is the investigation to consider at this stage? \n 该患儿有轻度发热但不确定是否持续。后三角区触及淋巴结但不清楚是否已存在 >6 周。头痛和呕吐本身非红旗征，但结合无痛性后三角区淋巴结肿大，整体临床图景指向潜在恶性疾病。后三角区淋巴结肿大与恶性肿瘤的关联性更高。 \n 因此，超声引导下细针穿刺抽吸（fnac）是最合适的首选检查。虽然 fnac 有创伤且存在组织取样不充分的风险，但被认为具有高灵敏度和特异度。 "}, {"id": "AMC-Q1616", "type": "mcq", "qid": 1616, "title": "慢性化脓性中耳炎 — 铜绿假单胞菌的局部治疗", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["慢性化脓性中耳炎 — 铜绿假单胞菌 → 环丙沙星滴耳液"], "difficulty": 2, "correctAnswer": "C", "page": 1397, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1616-CSOM-Ciprofloxacin.md", "stem": "<p>A 6-year-old Indigenous boy presents to your practice in a rural area with purulent left ear discharge for the past 2 months. History and physical examination establish a diagnosis of chronic suppurative otitis media. Culture of the ear discharge is positive for pseudomonas aeruginosa. After ear toileting, which one of the following is the most appropriate treatment option to consider for this child?</p>", "options": [{"letter": "A", "text": "Oral Amoxicillin."}, {"letter": "B", "text": "Oral Augmentin."}, {"letter": "C", "text": "Ciprofloxacin ear drop."}, {"letter": "D", "text": "Paramycetin with steroid ear drops."}, {"letter": "E", "text": "Gentamycin ear drops."}], "rationale": "<p>1. 题型识别：治疗 — CSOM 的抗生素选择 2. 关键线索：</p>\n<ul>\n<li>慢性化脓性中耳炎（CSOM）</li>\n<li>耳分泌物培养：<strong>铜绿假单胞菌</strong></li>\n<li>耳道清洁（ear toileting）已完成</li>\n<p>3. 治疗原则：</p>\n<li>CSOM 以<strong>局部抗生素</strong>治疗为主（非口服）</li>\n<li>铜绿假单胞菌 → 氟喹诺酮类（<strong>环丙沙星</strong>滴耳液）</li>\n<p>4. 排除：</p>\n<li>口服阿莫西林/奥格门汀（A/B）：全身抗生素对 CSOM 效果有限，且无法覆盖假单胞菌</li>\n<li>庆大霉素滴耳液（E）：曾使用但<strong>听觉和前庭毒性</strong>风险使其不再是首选</li>\n<li>巴龙霉素+激素（D）：不针对假单胞菌</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>口服抗生素 vs 局部</strong>：CSOM 以<strong>局部抗生素</strong>为主（耳道清洁后滴耳），不是口服</li>\n<li><strong>庆大霉素毒性</strong>：氨基糖苷类滴耳液有听觉和前庭毒性风险，已非首选</li>\n<li><strong>假单胞菌的抗生素选择</strong>：阿莫西林/奥格门汀不覆盖假单胞菌</li>\n</ul>", "summary": "<p><strong>慢性化脓性中耳炎（CSOM）</strong>治疗： 1. <strong>耳道清洁</strong>（ear toileting）— 基础步骤 2. <strong>局部抗生素</strong>（滴耳液）— 主要治疗</p>\n<ul>\n<li>铜绿假单胞菌 → <strong>环丙沙星滴耳液</strong>（氟喹诺酮类）</li>\n<li>庆大霉素滴耳液因耳毒性风险已非首选</li>\n<p>3. 口服抗生素效果有限，不作为主要治疗</p>\n</ul>", "explanation": "<p>CSOM 是中耳通过鼓膜穿孔持续感染 >2 周。耳分泌物培养为铜绿假单胞菌。耳道清洁后，环丙沙星滴耳液是最合适的局部抗生素治疗。</p>\n<p>口服阿莫西林/奥格门汀不覆盖假单胞菌，且全身抗生素对 CSOM 效果有限。氨基糖苷类滴耳液（庆大霉素）曾用于 CSOM，但出于安全性顾虑（听觉和前庭毒性风险），现已非首选。</p>", "references": "<ul>\n<li>Therapeutic Guideline – Antibiotics</li>\n</ul>", "related": ["AMC-Q1337-Acute-Mastoiditis-Pathogen", "AMC-Q1618-Acute-Mastoiditis-Culture", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "慢性化脓性中耳炎 — 铜绿假单胞菌的局部治疗\n慢性化脓性中耳炎 — 铜绿假单胞菌 → 环丙沙星滴耳液\n a 6-year-old indigenous boy presents to your practice in a rural area with purulent left ear discharge for the past 2 months. history and physical examination establish a diagnosis of chronic suppurative otitis media. culture of the ear discharge is positive for pseudomonas aeruginosa. after ear toileting, which one of the following is the most appropriate treatment option to consider for this child? \n csom 是中耳通过鼓膜穿孔持续感染 >2 周。耳分泌物培养为铜绿假单胞菌。耳道清洁后，环丙沙星滴耳液是最合适的局部抗生素治疗。 \n 口服阿莫西林/奥格门汀不覆盖假单胞菌，且全身抗生素对 csom 效果有限。氨基糖苷类滴耳液（庆大霉素）曾用于 csom，但出于安全性顾虑（听觉和前庭毒性风险），现已非首选。 "}, {"id": "AMC-Q1618", "type": "mcq", "qid": 1618, "title": "急性乳突炎 — 第一步取培养标本", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["急性乳突炎 — 第一步取分泌物培养"], "difficulty": 2, "correctAnswer": "A", "page": 1398, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1618-Acute-Mastoiditis-Culture.md", "stem": "<p>An 8-year-old boy is brought to the Emergency Department with right ear pain and purulent discharge since yesterday and a red swelling behind the right ear since this morning. He has the history of chronic bilateral
