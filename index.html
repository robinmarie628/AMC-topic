非符合高危标准）（E 错）。 7. <strong>锁定 A</strong>。</p>", "traps": "<ul>\n<li><strong>\"热性惊厥 = 禁忌\"陷阱</strong>：错。是常见误解；仍推荐接种 + 退热预防。</li>\n<li><strong>\"活疫苗不能同用\"陷阱</strong>：错。同日接种活+灭活安全。</li>\n<li><strong>\"抗生素治病\"陷阱</strong>：错。红霉素缩短传染期，不减轻症状。</li>\n<li><strong>\"全家都预防\"陷阱</strong>：错。仅高危接触者。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>热性惊厥在 DTPa 后 48h 内极少见，6 月龄内更少。有既往史者后续剂次风险略增，但退热措施可最小化 → 仍推荐。</p>\n<p>(B) 同日接种常用活+灭活疫苗不降低抗体、不增不良反应；同时接种提高按时全程接种率 → DTPa 可与活病毒疫苗同用。 (C) 含 pertussis 疫苗不引起婴儿痉挛/癫痫；活动/进展性神经疾病患儿也可安全接种。 (D) 抗生素不减轻症状严重度，但缩短传染期、降低传播。 (E) 因 index case 就诊延迟、成本与副作用，常规不推荐全家 PEP；但新生儿高危时推荐。</p>", "references": "<ul>\n<li>Australian Immunisation Handbook - Pertussis (whooping cough)</li>\n<li>CDC - Immunology and Vaccine-Preventable Diseases – Pink Book – General Recommendations</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n</ul>", "related": ["AMC-Q0763-Pertussis-Prophylaxis", "AMC-Q0761-Pertussis-School-Exclusion", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": [], "search": "pertussis 疫苗 — 热性惊厥**不是**接种禁忌\npertussis vaccine dtpa contraindications febrile convulsion\nprevention\n which one of the following statements is correct about pertussis? \n correct answer is  a  \n 热性惊厥在 dtpa 后 48h 内极少见，6 月龄内更少。有既往史者后续剂次风险略增，但退热措施可最小化 → 仍推荐。 \n (b) 同日接种常用活+灭活疫苗不降低抗体、不增不良反应；同时接种提高按时全程接种率 → dtpa 可与活病毒疫苗同用。 (c) 含 pertussis 疫苗不引起婴儿痉挛/癫痫；活动/进展性神经疾病患儿也可安全接种。 (d) 抗生素不减轻症状严重度，但缩短传染期、降低传播。 (e) 因 index case 就诊延迟、成本与副作用，常规不推荐全家 pep；但新生儿高危时推荐。 "}, {"id": "AMC-Q0924", "type": "mcq", "qid": 924, "title": "Measles — 出疹 4 天后停学；本例出疹已 7 天 → 无需停学", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Measles", "School Exclusion", "4 days after rash", "Contacts"], "difficulty": 3, "correctAnswer": "A", "page": 1320, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "measles", "school-exclusion", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0924-Measles-School-Exclusion.md", "stem": "<p>A mother brings her 7-year-old son 6 days after eruption of a generalized rash found to be measles. She asks if he must be excluded from school. All classmates are fully vaccinated against measles. Most appropriate advice?</p>", "options": [{"letter": "A", "text": "No exclusion is required."}, {"letter": "B", "text": "Exclusion for 4 days."}, {"letter": "C", "text": "Exclusion until the rash completely disappears."}, {"letter": "D", "text": "Exclusion only if an immunocompromised child is in the class."}, {"letter": "E", "text": "Exclusion for 6 days."}], "rationale": "<p>1. <strong>题型识别</strong>：麻疹患儿出疹后问停学 → 考停学时限（出疹后 4 天）。 2. <strong>停学规则</strong>：确诊病例停学至<strong>出疹后 4 天</strong>。 3. <strong>本例</strong>：出疹 7 天前 → 早已过 4 天 → 不传染 → 无需停学。 4. <strong>接触者规则</strong>（本题同学均接种）：</p>\n<ul>\n<li>已免疫接触者 → 不需停学。</li>\n<li>未免疫接触者 → 停学至 index case 出疹后 14 天，除非接触后 72h 内接种 MMR。</li>\n<p>5. <strong>选项排除</strong>：B/C/E 都要求某种停学，但本例已超期；D 把停学挂在特定同学，错误。 6. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有麻疹 = 必须停学\"陷阱</strong>：错。看时限——出疹后 4 天；本例已过。</li>\n<li><strong>\"出疹消失才复课\"陷阱</strong>：错。只需出疹后 4 天，不必等疹退。</li>\n<li><strong>\"看同学是否免疫决定 index case\"陷阱</strong>：错。index case 的停学看自身出疹时间，与同学无关。</li>\n<li><strong>混淆 pertussis 与 measles 时限</strong>：pertussis 21 天，measles 4 天，不同。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Measles is highly infective; all suspected/probable/confirmed cases excluded from school until 4 days after rash onset. This child's rash erupted 7 days ago → no longer infective → no exclusion.</p>\n<p>TOPIC REVIEW: Contacts of a known measles case in childcare: immunized contacts need no exclusion; non-immunized contacts excluded until 14 days after the infected child's rash, unless MMR within 72h of contact.</p>", "references": "<ul>\n<li>Australian Government, Department of Health – Measles - National guidelines for public health units</li>\n</ul>", "related": ["TR-Measles-Exclusion", "AMC-Q0761-Pertussis-School-Exclusion", "AMC-Q1349-Chickenpox-School-Exclusion", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Measles"], "complaints": [], "search": "measles — 出疹 4 天后停学；本例出疹已 7 天 → 无需停学\nmeasles school exclusion 4 days after rash contacts\nprevention\n a mother brings her 7-year-old son 6 days after eruption of a generalized rash found to be measles. she asks if he must be excluded from school. all classmates are fully vaccinated against measles. most appropriate advice? \n correct answer is  a  \n measles is highly infective; all suspected/probable/confirmed cases excluded from school until 4 days after rash onset. this child's rash erupted 7 days ago → no longer infective → no exclusion. \n topic review: contacts of a known measles case in childcare: immunized contacts need no exclusion; non-immunized contacts excluded until 14 days after the infected child's rash, unless mmr within 72h of contact. "}, {"id": "AMC-Q1066", "type": "mcq", "qid": 1066, "title": "AMC-Q1066 — Roseola infantum (exanthem subitum)", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["幼儿急疹"], "difficulty": 2, "correctAnswer": "E", "page": 1338, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1066-Roseola-Infantum.md", "stem": "<p>Kyle, 5 months old, is brought to your practice by his mother for evaluation. He has had a runny nose and a fever of 40°C for the past 48 hours, but otherwise quite active and healthy. Today, Kyle's temperature dropped to normal but he developed a maculopapular rash on his trunk. He is still in good health. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Measles"}, {"letter": "B", "text": "Chicken pox"}, {"letter": "C", "text": "Erythema infectiosum"}, {"letter": "D", "text": "Rubella"}, {"letter": "E", "text": "Roseola infantum"}], "rationale": "<ul>\n<li>经典表现：<strong>3-5 天高热（40°C）后热退疹出</strong> → 幼儿急疹</li>\n<li>病因：<strong>HHV-6</strong>（最常见），少数 HHV-7、肠道病毒、腺病毒、副流感</li>\n<li>年龄：<strong>6-18 个月</strong>（本例 5 个月，接近）</li>\n<li>皮疹特点：</li>\n<li>颈/躯干首发 → 面部、四肢</li>\n<li>斑疹或斑丘疹</li>\n<li>通常无瘙痒</li>\n<li>持续 1-2 天</li>\n<li>鉴别诊断：</li>\n<li><strong>麻疹</strong>（A）：高热 + 咳嗽 + 卡他 + 结膜炎 + 科氏斑，<strong>发热全程出疹</strong></li>\n<li><strong>水痘</strong>（B）：<strong>瘙痒性水疱</strong>，\"玫瑰花瓣上的露珠\"</li>\n<li><strong>传染性红斑</strong>（C，第五病）：\"掌拍颊\"，低热</li>\n<li><strong>风疹</strong>（D）：耳后/枕后淋巴结肿大 + 疹速出速退</li>\n</ul>", "traps": "<ul>\n<li>选 A（麻疹）— 麻疹<strong>发热全程</strong>出疹，且伴明显卡他症状</li>\n<li>选 C（传染性红斑）— 那是\"掌拍颊\"皮疹，幼儿急疹是热退后躯干</li>\n</ul>", "summary": "<p><strong>幼儿急疹 vs 麻疹 vs 风疹</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>幼儿急疹</th><th>麻疹</th><th>风疹</th></tr></thead>\n<tbody>\n<tr><td>病原</td><td>HHV-6</td><td>麻疹病毒</td><td>风疹病毒</td></tr>\n<tr><td>年龄</td><td>6-18 mo</td><td>6 mo-5 yr</td><td>青少年</td></tr>\n<tr><td>发热与疹关系</td><td><strong>热退疹出</strong></td><td>高热全程出疹</td><td>出疹时常有低热</td></tr>\n<tr><td>皮疹顺序</td><td>颈/躯干 → 全身</td><td>耳后 → 面部 → 全身</td><td>面部 → 全身</td></tr>\n<tr><td>其他</td><td>良性自限</td><td>卡他、结膜、Koplik 斑</td><td>耳后/枕后淋巴结</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：高热 + 鼓胀囟门见于 26% 的幼儿急疹，可被误认为脑膜炎；高热可致热惊厥。</p>", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>该场景是幼儿急疹的典型表现。幼儿急疹，也称为 exanthem subitum、第六病和三日热，是一种最常由人类疱疹病毒 6（HHV-6）引起的临床综合征。其他原因包括人类疱疹病毒 7（HHV-7）、肠道病毒（柯萨奇病毒 A 和 B、埃可病毒）、腺病毒和副流感病毒 1 型。</p>\n<p>这是婴儿（多为 6-18 个月）的临床综合征，特征是 3-5 天通常高达 40°C（或更高）的高热。然后发热骤然消退，随后出现皮疹。</p>\n<p>幼儿急疹的典型皮疹是斑疹或斑丘疹，从颈部和躯干开始，扩散到面部和四肢。偶尔出现水疱。皮疹通常不瘙痒。皮疹持续 1-2 天，但偶尔可能在 2-4 小时内来去。在因高热接受抗生素治疗的儿童中，皮疹的出现可能与药物过敏混淆。诊断几乎完全是临床性的。该病程良性，自发消退。<strong>可发生热惊厥</strong>。</p>\n<p><strong>淋巴结肿大和鼓膜充血常见</strong>。在发热期，该病可能与中耳炎混淆。<strong>高热伴囟门膨隆见于多达 26% 的婴儿</strong>，可能误认为脑膜炎。</p>\n<p>在 80 例幼儿急疹患儿的一个系列中，相关表现包括：</p>\n<ul>\n<li>淋巴结肿大 — 98%</li>\n<li>鼓膜充血 — 93%</li>\n<li>易激惹 — 92%</li>\n<li>Nagayama 斑 — 87%</li>\n<li>厌食 — 80%</li>\n<li>上呼吸道症状 — 25%</li>\n<li>腹泻 — 15%</li>\n<li>咳嗽 — 11%</li>\n</ul>", "references": "<ul>\n<li>UpToDate - Roseola infantum</li>\n</ul>", "related": ["AMC-Q0924-Measles-School-Exclusion", "TR-Roseola-vs-Measles"], "bodyHtml": "", "diseases": ["Roseola"], "complaints": ["fever", "rash"], "search": "amc-q1066 — roseola infantum (exanthem subitum)\n幼儿急疹\n kyle, 5 months old, is brought to your practice by his mother for evaluation. he has had a runny nose and a fever of 40°c for the past 48 hours, but otherwise quite active and healthy. today, kyle's temperature dropped to normal but he developed a maculopapular rash on his trunk. he is still in good health. which one of the following is the most likely diagnosis? \n correct answer is  e  \n 该场景是幼儿急疹的典型表现。幼儿急疹，也称为 exanthem subitum、第六病和三日热，是一种最常由人类疱疹病毒 6（hhv-6）引起的临床综合征。其他原因包括人类疱疹病毒 7（hhv-7）、肠道病毒（柯萨奇病毒 a 和 b、埃可病毒）、腺病毒和副流感病毒 1 型。 \n 这是婴儿（多为 6-18 个月）的临床综合征，特征是 3-5 天通常高达 40°c（或更高）的高热。然后发热骤然消退，随后出现皮疹。 \n 幼儿急疹的典型皮疹是斑疹或斑丘疹，从颈部和躯干开始，扩散到面部和四肢。偶尔出现水疱。皮疹通常不瘙痒。皮疹持续 1-2 天，但偶尔可能在 2-4 小时内来去。在因高热接受抗生素治疗的儿童中，皮疹的出现可能与药物过敏混淆。诊断几乎完全是临床性的。该病程良性，自发消退。 可发生热惊厥 。 \n  淋巴结肿大和鼓膜充血常见 。在发热期，该病可能与中耳炎混淆。 高热伴囟门膨隆见于多达 26% 的婴儿 ，可能误认为脑膜炎。 \n 在 80 例幼儿急疹患儿的一个系列中，相关表现包括： \n \n 淋巴结肿大 — 98% \n 鼓膜充血 — 93% \n 易激惹 — 92% \n nagayama 斑 — 87% \n 厌食 — 80% \n 上呼吸道症状 — 25% \n 腹泻 — 15% \n 咳嗽 — 11% \n "}, {"id": "AMC-Q1145", "type": "mcq", "qid": 1145, "title": "AMC-Q1145 — Hand, foot and mouth disease", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["手足口病"], "difficulty": 2, "correctAnswer": "C", "page": 1344, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1145-Hand-Foot-Mouth.md", "stem": "<p>A 3-year-old girl is brought to your practice by her mother with complaint of multiple painful small oral ulcers. The child refuses to eat because of the pain. On examination, the child is found to have a temperature of 38°C. Similar ulcers are noted on her hand and feet. Which one of the following is the causative organism?</p>", "options": [{"letter": "A", "text": "Herpes simplex virus (HSV)"}, {"letter": "B", "text": "Group B streptococcus (GBS)"}, {"letter": "C", "text": "Coxsackie A virus"}, {"letter": "D", "text": "Adenovirus"}, {"letter": "E", "text": "Coronavirus"}], "rationale": "<ul>\n<li>经典三联征：<strong>口腔溃疡 + 手足皮疹 + 发热</strong> → <strong>手足口病（HFM）</strong></li>\n<li>病原：<strong>柯萨奇 A 病毒</strong>（肠道病毒属）</li>\n<li>病程：</li>\n<li>潜伏期 3-5 天</li>\n<li>前驱：低热、头痛、不适</li>\n<li>1-2 天后出疹：红斑 → 灰色水疱（红晕围绕）</li>\n<li><strong>黏膜浅溃疡</strong>（颊黏膜、牙龈、舌）</li>\n<li><strong>手足外侧缘</strong>皮疹</li>\n<li>臀部和生殖器也可累及</li>\n<li>3-5 天自愈，无瘢痕</li>\n<li>传染期：水疱消失前；病毒可经唾液、粪便持续分泌</li>\n<li>鉴别：</li>\n<li><strong>HSV</strong>（A）：单纯疱疹，唇/口周水疱，<strong>不累及手足</strong></li>\n<li><strong>GBS</strong>（B）：细菌，不引起手足口病</li>\n<li><strong>腺病毒</strong>（D）：咽结膜热</li>\n<li><strong>冠状病毒</strong>（E）：COVID-19 / 普通感冒</li>\n</ul>", "traps": "<ul>\n<li>选 A（HSV）— HSV 病变在<strong>口周/口内</strong>，<strong>不会</strong>累及手足</li>\n<li>选 B（GBS）— 细菌，不是病毒性皮疹病因</li>\n</ul>", "summary": "<p><strong>HFM 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>病原</td><td><strong>柯萨奇 A 病毒</strong>（最常见 A16）</td></tr>\n<tr><td>年龄</td><td>多见 < 5 岁</td></tr>\n<tr><td>病程</td><td>自限，3-5 天自愈</td></tr>\n<tr><td>皮疹</td><td>灰水疱 + 红晕；手/足/口；偶累及臀、生殖器</td></tr>\n<tr><td>治疗</td><td>对症；保证入量（口腔疼痛可拒食）</td></tr>\n<tr><td>传染期</td><td>水疱消失前；唾液/粪便中可长期排毒</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：HFM 大多数为轻症；但 <strong>EV71</strong> 型可引起重症脑膜炎/脑干脑炎，亚太地区需警惕。</p>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>口腔、手和足部溃疡的临床表现高度提示<strong>手足口病（HFM disease）</strong>。这种常为自限性的轻度病毒感染由<strong>柯萨奇 A 病毒</strong>引起。<strong>该病潜伏期为 3-5 天</strong>。</p>\n<p>病程以轻度的前驱症状（低热、头痛、不适）开始，1-2 天后出现皮疹。皮疹始于红斑性斑疹，进展为周围充血的灰色水疱。这些水疱在颊黏膜、牙龈和舌上形成浅溃疡。手和足（特别是外侧缘）也受累。在臀部和生殖器上出现皮疹并不少见。</p>\n<p><strong>皮疹在 3-5 天内消退，无瘢痕</strong>。儿童在水疱消失前具有传染性，但病毒可分泌到唾液和粪便中。</p>", "references": "<ul>\n<li>UpToDate - Hand, foot, and mouth disease</li>\n</ul>", "related": ["AMC-Q1275-Chickenpox-School-Exclusion"], "bodyHtml": "", "diseases": ["HFM Disease"], "complaints": [], "search": "amc-q1145 — hand, foot and mouth disease\n手足口病\n a 3-year-old girl is brought to your practice by her mother with complaint of multiple painful small oral ulcers. the child refuses to eat because of the pain. on examination, the child is found to have a temperature of 38°c. similar ulcers are noted on her hand and feet. which one of the following is the causative organism? \n correct answer is  c  \n 口腔、手和足部溃疡的临床表现高度提示 手足口病（hfm disease） 。这种常为自限性的轻度病毒感染由 柯萨奇 a 病毒 引起。 该病潜伏期为 3-5 天 。 \n 病程以轻度的前驱症状（低热、头痛、不适）开始，1-2 天后出现皮疹。皮疹始于红斑性斑疹，进展为周围充血的灰色水疱。这些水疱在颊黏膜、牙龈和舌上形成浅溃疡。手和足（特别是外侧缘）也受累。在臀部和生殖器上出现皮疹并不少见。 \n  皮疹在 3-5 天内消退，无瘢痕 。儿童在水疱消失前具有传染性，但病毒可分泌到唾液和粪便中。 "}, {"id": "AMC-Q1275", "type": "mcq", "qid": 1275, "title": "AMC-Q1275 — Chickenpox school exclusion", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["水痘 — 返校标准"], "difficulty": 2, "correctAnswer": "A", "page": 1349, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1275-Chickenpox-School-Exclusion.md", "stem": "<p>A 7-year-old boy presents with a generalized rash illustrated in the following photograph. The rash developed after 24 hours of mild malaise and fever. When can he go back to school?</p>", "options": [{"letter": "A", "text": "After the resolution of the blisters"}, {"letter": "B", "text": "After 2 days"}, {"letter": "C", "text": "After 5 days"}, {"letter": "D", "text": "No exclusion is required"}, {"letter": "E", "text": "After clearance of the rash"}], "rationale": "<ul>\n<li>皮疹特征：<strong>同时存在各阶段皮损</strong>（斑疹、丘疹、水疱、结痂）→ 典型水痘</li>\n<li><strong>水痘返校标准</strong>：</li>\n<li><strong>所有水疱结痂干燥</strong>后</li>\n<li>通常从出疹起 <strong>5 天</strong></li>\n<li>免疫过的儿童可能更快</li>\n<li>各选项分析：</li>\n<li>B（2 天）— 太早</li>\n<li>C（5 天）— 大致正确时间，但更准确是\"水疱干燥\"为标准</li>\n<li>D（无需排除）— <strong>错误</strong>，水痘传染性强</li>\n<li>E（皮疹完全清除）— <strong>不必等痂脱落</strong>，痂已不传染</li>\n</ul>", "traps": "<ul>\n<li>选 D — 水痘传染性<strong>极强</strong>，必须排除</li>\n<li>选 E — 等痂脱落太严，痂本身不传染</li>\n</ul>", "summary": "<p><strong>儿童常见传染病返校标准</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>返校时间</th></tr></thead>\n<tbody>\n<tr><td><strong>水痘</strong></td><td><strong>所有水疱结痂干燥</strong></td></tr>\n<tr><td>麻疹</td><td>出疹后 4 天</td></tr>\n<tr><td>风疹</td><td>出疹后 7 天（或症状消失）</td></tr>\n<tr><td>百日咳</td><td>抗生素治疗 5 天后</td></tr>\n<tr><td>腮腺炎</td><td>腺肿消退</td></tr>\n<tr><td>HFM</td><td>水疱消失</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：水痘出疹呈\"<strong>向心性分布</strong>\"（躯干 > 四肢），同部位可见<strong>各阶段皮损并存</strong>（\"四世同堂\"）是特征。</p>", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>该照片显示不同阶段的水疱、斑疹和丘疹。其中一些水疱完整，一些未覆盖，一些已干燥。<strong>结合病史，这是水痘的高度特征性表现</strong>。</p>\n<p><strong>水痘儿童应被排除在学校或其他日托环境之外，直到所有水疱干燥</strong>。这通常从出疹起 5 天，但在以前免疫过的儿童中可能更短。</p>\n<p>干燥的水疱需要更多时间才能清除，在此期间儿童不具有传染性。因此，等待皮疹完全清除是不必要的。</p>", "references": "<ul>\n<li>Victorian Department of Health - School exclusion table</li>\n</ul>", "related": ["AMC-Q0924-Measles-School-Exclusion", "AMC-Q1145-Hand-Foot-Mouth"], "bodyHtml": "", "diseases": ["Chickenpox"], "complaints": ["fever"], "search": "amc-q1275 — chickenpox school exclusion\n水痘 — 返校标准\n a 7-year-old boy presents with a generalized rash illustrated in the following photograph. the rash developed after 24 hours of mild malaise and fever. when can he go back to school? \n correct answer is  a  \n 该照片显示不同阶段的水疱、斑疹和丘疹。其中一些水疱完整，一些未覆盖，一些已干燥。 结合病史，这是水痘的高度特征性表现 。 \n  水痘儿童应被排除在学校或其他日托环境之外，直到所有水疱干燥 。这通常从出疹起 5 天，但在以前免疫过的儿童中可能更短。 \n 干燥的水疱需要更多时间才能清除，在此期间儿童不具有传染性。因此，等待皮疹完全清除是不必要的。 "}, {"id": "AMC-Q1401", "type": "mcq", "qid": 1401, "title": "诺如病毒胃肠炎 — 最常见非细菌性胃肠炎", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": [], "topic": ["诺如病毒胃肠炎 — 非细菌性胃肠炎最常见病原"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q1401-Norovirus-Gastroenteritis.md", "stem": "<p>A 3-year-old child is brought to your office by his mother with complaints of diarrhea and colicky abdominal pains for the past three days. Which one of the following can be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Giardiasis."}, {"letter": "B", "text": "Norovirus gastroenteritis."}, {"letter": "C", "text": "Perforated appendicitis."}, {"letter": "D", "text": "Staphylococcal gastroenteritis."}, {"letter": "E", "text": "Shigellosis."}], "rationale": "<p>1. 题型识别：诊断 — 儿童急性腹泻的病原学鉴别 2. 关键线索：3 岁、腹泻 + 腹部绞痛 3 天、无特殊暴露史 3. 流行病学：诺如病毒 = 全球最常见非细菌性胃肠炎病原 4. 鉴别排除：</p>\n<ul>\n<li>贾第虫（A）：徒步者/饮用生水史 + 恶臭脂肪便 + 潜伏期 7-14 天</li>\n<li>阑尾穿孔（C）：全身中毒 + 腹膜炎体征</li>\n<li>金葡菌胃肠炎（D）：恶心呕吐更突出、腹泻较少</li>\n<li>志贺菌（E）：高热 + 腹痛 + <strong>血性黏液便</strong> + 里急后重</li>\n<p>5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>贾第虫混淆</strong>：腹泻 + 腹部绞痛可见于贾第虫，但贾第虫需要饮用生水史、潜伏期 7-14 天、恶臭脂肪便（脂肪泻 70%），与本题不符</li>\n<li><strong>志贺菌</strong>：典型为高热 + 血性黏液便 + 里急后重，与题中单纯腹泻腹痛不符</li>\n<li><strong>\"最常见的\"即答案</strong>：腹泻鉴别诊断宽泛，在没有特殊线索时选最常见病因</li>\n</ul>", "summary": "<p><strong>诺如病毒</strong>：</p>\n<ul>\n<li>工业化国家非细菌性胃肠炎暴发的 95% 病因</li>\n<li>全球所有胃肠炎暴发的 50%</li>\n<li>传播：粪-口（主要）、污染食物（沙拉/冰/水/水果/烘焙品/冷肉）、少数气溶胶/接触/污染物</li>\n<li>潜伏期：24-48h（可早至 12h）</li>\n<li>临床表现：恶心、呕吐、腹泻（<strong>非炎症性</strong>，无血无黏液）、腹部绞痛 / 次常见：头痛、低热、寒战、肌痛、乏力</li>\n<li>诊断：暴发场景外不需检查；确诊用粪便 PCR</li>\n<li>治疗：对症支持</li>\n</ul>", "explanation": "<p>选项中诺如病毒胃肠炎为最可能诊断。诺如病毒是全球主要人类病原体，估计占工业化国家（如澳大利亚）非细菌性胃肠炎暴发的 95%，占全球所有胃肠炎暴发的 50%。所有年龄段均易感。</p>\n<p>贾第虫病需考虑徒步者/露营者或饮用生水史，潜伏期 7-14 天、恶臭脂肪便（70%）、腹胀、体重下降。阑尾穿孔临床表现完全不同（全身中毒 + 腹膜炎体征）。金葡菌胃肠炎以恶心呕吐更突出、腹泻较少。志贺菌感染典型表现为高热、腹部绞痛、<strong>血性黏液便</strong>和里急后重。</p>", "references": "<ul>\n<li>SA Health - Norovirus infection - including symptoms, treatment and prevention</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain"], "search": "诺如病毒胃肠炎 — 最常见非细菌性胃肠炎\n诺如病毒胃肠炎 — 非细菌性胃肠炎最常见病原\n a 3-year-old child is brought to your office by his mother with complaints of diarrhea and colicky abdominal pains for the past three days. which one of the following can be the most likely diagnosis? \n 选项中诺如病毒胃肠炎为最可能诊断。诺如病毒是全球主要人类病原体，估计占工业化国家（如澳大利亚）非细菌性胃肠炎暴发的 95%，占全球所有胃肠炎暴发的 50%。所有年龄段均易感。 \n 贾第虫病需考虑徒步者/露营者或饮用生水史，潜伏期 7-14 天、恶臭脂肪便（70%）、腹胀、体重下降。阑尾穿孔临床表现完全不同（全身中毒 + 腹膜炎体征）。金葡菌胃肠炎以恶心呕吐更突出、腹泻较少。志贺菌感染典型表现为高热、腹部绞痛、 血性黏液便 和里急后重。 "}, {"id": "AMC-Q1274", "type": "mcq", "qid": 1274, "title": "AMC-Q1274 — ODD pharmacological treatment", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Mental-Health", "approach": [], "topic": ["对立违抗性障碍 (ODD) — 药物治疗"], "difficulty": 3, "correctAnswer": "D", "page": 1347, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Mental-Health/AMC-Q1274-ODD-Risperidone.md", "stem": "<p>A 15-year-old boy is brought by his parents for his behavioral problems. According to the parents, he has had marked aggressiveness with several fights and arguments with the school staff, anger outbursts, and being uneasy to control. He seemingly is not obedient at home and defies his parents and the home rules. Parents say that they have fights over every simple issue at home. They, however, deny any act of vandalism, cruelty towards animals or people, or drug use. He has declined school performance. On examination, he has a normal attention span and does not appear hyperactive. If pharmacological intervention is required, which one of the following is most likely to benefit him?</p>", "options": [{"letter": "A", "text": "Carbamazepine"}, {"letter": "B", "text": "Sodium valproate"}, {"letter": "C", "text": "SSRIs"}, {"letter": "D", "text": "Risperidone"}, {"letter": "E", "text": "Olanzapine"}], "rationale": "<ul>\n<li>临床表现：</li>\n<li><strong>对立违抗性障碍（ODD）</strong>：对权威人物的对抗、敌对、违拗行为 ≥ 6 个月</li>\n<li>关键排除：没有破坏行为、动物/人的残忍行为、药物使用 → <strong>不是品行障碍（CD）</strong></li>\n<li>注意力正常、不过动 → <strong>不是 ADHD</strong></li>\n<li>ODD 治疗：</li>\n<li><strong>一线：行为治疗 + 家庭治疗</strong></li>\n<li>药物治疗：用于<strong>严重攻击行为</strong>或合并 ADHD 时</li>\n<li><strong>伴严重攻击</strong>：<strong>利培酮（risperidone）</strong> ± 精神兴奋剂</li>\n<li>ADHD 共病：精神兴奋剂或 atomoxetine</li>\n<li>各选项分析：</li>\n<li>A（卡马西平）：无证据</li>\n<li>B（丙戊酸钠）：二线情绪稳定剂</li>\n<li>C（SSRIs）：二线抗抑郁</li>\n<li>D（利培酮）：<strong>唯一对 ODD 严重攻击有效的选项</strong></li>\n<li>E（奥氮平）：二线</li>\n</ul>", "traps": "<ul>\n<li>选 A/B（情绪稳定剂）— 这是 ODD 严重攻击的二线</li>\n<li>选 C（SSRIs）— 用于合并焦虑/抑郁，不是 ODD 攻击的主线</li>\n<li>选 E（奥氮平）— 二线，不如利培酮循证强</li>\n</ul>", "summary": "<p><strong>ODD 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>表现</td><td>对权威的对抗/敌对/违拗 ≥ 6 月；无严重违法/残忍</td></tr>\n<tr><td>共病</td><td>ADHD、焦虑、学习障碍、语言障碍</td></tr>\n<tr><td>进展</td><td><strong>60% ODD → 品行障碍（CD）</strong></td></tr>\n<tr><td>治疗</td><td>行为治疗 + 家庭治疗（首选）</td></tr>\n<tr><td>药物（严重攻击）</td><td><strong>利培酮</strong> ± 精神兴奋剂</td></tr>\n<tr><td>ADHD 共病</td><td>精神兴奋剂 / atomoxetine</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：ODD 是品行障碍的\"前奏\"，<strong>早期干预</strong> 防进展到 CD/犯罪/精神疾病。</p>", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>临床表现和儿童年龄主要符合对立违抗性障碍（ODD）作为诊断。</p>\n<p><strong>ODD 是一种儿童和青少年的破坏性行为障碍</strong>，特征是对权威人物的对抗性和争论性行为和态度模式。这种模式通常被父母简单地视为固执、情绪化和意志坚强。然而，在 ODD 中，这种行为比被认为是正常的要极端得多。有趣的是，<strong>ODD 的发生频率远高于儿童发育不同阶段常出现的固执、抱怨和叛逆</strong>。</p>\n<p>ODD 表现为持续的、极端的消极、对抗和敌对行为，导致社会、学校和家庭生活至少 6 个月的破坏。症状可能早在学龄前晚期就出现。</p>\n<p><strong>ODD 儿童常将愤怒和怨恨指向父母、老师和其他权威人物</strong>；然而，他们也可能与同伴有这些问题。他们经常不合作、报复性强且易怒。他们通常违抗规则、有愤怒爆发、因自己的错误责怪他人、寻求报复并故意打扰他人。ODD 症状可能针对一个人或许多人，可能只在家中、学校发生，或在多种环境中发生。</p>\n<p>由于儿童不太可能理解自己有问题，治疗通常由父母发起。<strong>仔细的病史很重要，因为许多其他儿童疾病可能与 ODD 有一些共同特征</strong>。此外，ODD 可能与其他精神疾病共存，如焦虑障碍、ADHD、学习障碍和语言障碍。</p>\n<p><strong>重要的是区分行为模式异常是由于 ODD 还是仅仅是对暂时情况的反应</strong>。</p>\n<p><strong>国际疾病分类第 10 版（ICD-10）将 ODD 归类为品行障碍的轻度形式</strong>。据估计，高达 60% 的 ODD 患者将发展为品行障碍。</p>\n<p><strong>在早期阶段治疗是必要的，以防止其发展为更严重的品行障碍（最重要的）、精神健康障碍或犯罪行为</strong>。治疗需要行为治疗、家庭治疗和偶尔药物的组合。</p>\n<p>在 50% 以上的 ADHD 患者中，ODD 也是临床表现的一部分。有强有力证据表明 ODD 和 ADHD 重叠，许多用于治疗 ADHD 的药物也可能对 ODD 治疗有效。一些研究报告了兴奋剂或阿托莫西汀在治疗与 ADHD 共病的 ODD 中的积极作用。<strong>有严重攻击行为的 ODD 和品行障碍患者可能对利培酮反应良好，伴或不伴兴奋剂</strong>。</p>\n<p>情绪调节剂、α2 激动剂和抗抑郁药也可能在 ODD 及其共病治疗中具有二线作用。</p>\n<p><strong>在所给选项中，利培酮是唯一在考虑药物治疗时可以使用的选项</strong>。</p>\n<p>情绪稳定剂如丙戊酸钠（选项 B）或奥氮平（选项 A），以及抗抑郁药如 SSRIs（选项 C）是二线选择。</p>\n<p><strong>没有证据支持卡马西平（选项 E）作为 ODD 的药物治疗</strong>。</p>", "references": "<ul>\n<li>Medscape - Oppositional Defiant Disorder</li>\n<li>PubMed - Psychopharmacological treatment of oppositional defiant disorder</li>\n</ul>", "related": ["AMC-Q1286-Encopresis-ODD", "TR-ODD-Management"], "bodyHtml": "", "diseases": ["ODD"], "complaints": [], "search": "amc-q1274 — odd pharmacological treatment\n对立违抗性障碍 (odd) — 药物治疗\n a 15-year-old boy is brought by his parents for his behavioral problems. according to the parents, he has had marked aggressiveness with several fights and arguments with the school staff, anger outbursts, and being uneasy to control. he seemingly is not obedient at home and defies his parents and the home rules. parents say that they have fights over every simple issue at home. they, however, deny any act of vandalism, cruelty towards animals or people, or drug use. he has declined school performance. on examination, he has a normal attention span and does not appear hyperactive. if pharmacological intervention is required, which one of the following is most likely to benefit him? \n correct answer is  d  \n 临床表现和儿童年龄主要符合对立违抗性障碍（odd）作为诊断。 \n  odd 是一种儿童和青少年的破坏性行为障碍 ，特征是对权威人物的对抗性和争论性行为和态度模式。这种模式通常被父母简单地视为固执、情绪化和意志坚强。然而，在 odd 中，这种行为比被认为是正常的要极端得多。有趣的是， odd 的发生频率远高于儿童发育不同阶段常出现的固执、抱怨和叛逆 。 \n odd 表现为持续的、极端的消极、对抗和敌对行为，导致社会、学校和家庭生活至少 6 个月的破坏。症状可能早在学龄前晚期就出现。 \n  odd 儿童常将愤怒和怨恨指向父母、老师和其他权威人物 ；然而，他们也可能与同伴有这些问题。他们经常不合作、报复性强且易怒。他们通常违抗规则、有愤怒爆发、因自己的错误责怪他人、寻求报复并故意打扰他人。odd 症状可能针对一个人或许多人，可能只在家中、学校发生，或在多种环境中发生。 \n 由于儿童不太可能理解自己有问题，治疗通常由父母发起。 仔细的病史很重要，因为许多其他儿童疾病可能与 odd 有一些共同特征 。此外，odd 可能与其他精神疾病共存，如焦虑障碍、adhd、学习障碍和语言障碍。 \n  重要的是区分行为模式异常是由于 odd 还是仅仅是对暂时情况的反应 。 \n  国际疾病分类第 10 版（icd-10）将 odd 归类为品行障碍的轻度形式 。据估计，高达 60% 的 odd 患者将发展为品行障碍。 \n  在早期阶段治疗是必要的，以防止其发展为更严重的品行障碍（最重要的）、精神健康障碍或犯罪行为 。治疗需要行为治疗、家庭治疗和偶尔药物的组合。 \n 在 50% 以上的 adhd 患者中，odd 也是临床表现的一部分。有强有力证据表明 odd 和 adhd 重叠，许多用于治疗 adhd 的药物也可能对 odd 治疗有效。一些研究报告了兴奋剂或阿托莫西汀在治疗与 adhd 共病的 odd 中的积极作用。 有严重攻击行为的 odd 和品行障碍患者可能对利培酮反应良好，伴或不伴兴奋剂 。 \n 情绪调节剂、α2 激动剂和抗抑郁药也可能在 odd 及其共病治疗中具有二线作用。 \n  在所给选项中，利培酮是唯一在考虑药物治疗时可以使用的选项 。 \n 情绪稳定剂如丙戊酸钠（选项 b）或奥氮平（选项 a），以及抗抑郁药如 ssris（选项 c）是二线选择。 \n  没有证据支持卡马西平（选项 e）作为 odd 的药物治疗 。 "}, {"id": "AMC-Q1286", "type": "mcq", "qid": 1286, "title": "AMC-Q1286 — Encopresis in a 7-year-old girl", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Mental-Health", "approach": [], "topic": ["遗粪症 — 鉴别诊断"], "difficulty": 3, "correctAnswer": "B", "page": 1350, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Mental-Health/AMC-Q1286-Encopresis-ODD.md", "stem": "<p>The parents of a 7-year-old girl have brought her to you for assessment because she frequently soils her underwear. In the past 2 months, they have received calls from her school about her problems there. She is easily irritated and becomes angry and aggressive with her classmates and other children at school. At home, they found her soiled underwear hidden. She becomes angry, cries, and fights with her older brother when he calls her 'smelly'. This happens several times a week. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Conduct disorder"}, {"letter": "B", "text": "Oppositional defiant disorder"}, {"letter": "C", "text": "Regression"}, {"letter": "D", "text": "Delayed developmental milestones"}, {"letter": "E", "text": "Depression"}], "rationale": "<ul>\n<li>临床表现：</li>\n<li>反复遗粪（内衣污染）+ 隐藏污物 + 易激惹 + 攻击行为 + 生气</li>\n<li><strong>无暴力、严重违法、破坏行为</strong> → <strong>不是品行障碍</strong></li>\n<li>攻击、违拗、敌对 ≥ 6 个月（虽题目未明确时长，但模式符合）</li>\n<li>遗粪症分两型：</li>\n<li><strong>便秘 + 溢出型</strong>（多见）：治疗便秘即可</li>\n<li><strong>无便秘型</strong>（少见）：常与 <strong>ODD/品行障碍</strong> 共病</li>\n<li>关键鉴别：</li>\n<li>A（品行障碍）：<strong>无严重违法/破坏/残忍</strong> → 不支持</li>\n<li>C（退行）：无近期应激事件（如亲人离世、性虐待）</li>\n<li>D（发育迟滞）：其他发育里程碑正常</li>\n<li>E（抑郁）：无情绪低落、睡眠食欲改变</li>\n</ul>", "traps": "<ul>\n<li>选 A（品行障碍）— 缺少严重违法/动物残忍</li>\n<li>选 C（退行）— 没有近期应激源</li>\n<li>选 E（抑郁）— 没有抑郁核心症状</li>\n</ul>", "summary": "<p><strong>遗粪症（Encopresis）分型</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>特征</th><th>治疗</th></tr></thead>\n<tbody>\n<tr><td><strong>便秘 + 溢出型</strong>（多见）</td><td>< 3 次/周排便，粪泄漏</td><td>通便 + 行为治疗</td></tr>\n<tr><td><strong>无便秘型</strong>（少见）</td><td>粪质正常，间歇性污粪</td><td>处理 ODD/CD 基础病</td></tr>\n</tbody>\n</table>\n<p><strong>遗粪症流行病学</strong>：</p>\n<ul>\n<li>1-4% 学龄儿童</li>\n<li>男 > 女</li>\n<li>3% 精神科患儿合并</li>\n</ul>\n<p><strong>警示</strong>：<strong>无便秘型遗粪 = 警惕 ODD/CD 等精神共病</strong>，需治疗基础精神疾病。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>该场景提示遗粪症。然而，该诊断的完整诊断标准不确定（场景中缺乏症状的频率和持续时间）。</p>\n<p><strong>遗粪症是指 4 岁以上儿童每月超过一次将成形、半成形或液体粪便排到厕所以外的地方，持续至少 3 个月</strong>。如果儿童从未有控制能力，该病称为原发性遗粪症，而继发性遗粪症是以前有控制能力的儿童的大便失禁。<strong>遗粪症报告见于 1-4% 的学龄儿童</strong>。<strong>遗粪症在男孩中比女孩更常见</strong>。</p>\n<p>遗粪症有两种不同类型：</p>\n<p><strong>伴便秘和溢出性失禁</strong>：伴便秘和溢出性失禁类型的儿童每周排便少于 3 次。由于便秘，每次排便时只有部分总粪便被排空。其余粪便的一部分漏出，通常在儿童日常活动中发生。一旦便秘解决，遗粪症通常不再存在。</p>\n<p><strong>不伴便秘和溢出性失禁</strong>：在此类型中，无便秘，儿童粪便稠度正常。与便秘和溢出相关的病例不同，此类型的污粪是间歇性的。粪便可能排放到显著位置（例如作为对抗行为），或者是肛门自我刺激（例如各种形式的自慰）的无意结果。<strong>不伴便秘和溢出性失禁的遗粪症比第一种类型的遗粪症少见，且常与对立违抗性障碍和品行障碍相关</strong>。据估计，3% 的有精神问题的儿童可能有遗粪症。</p>\n<p><strong>具有攻击性、愤怒爆发以及易怒和易激惹，对立违抗性障碍是遗粪症和该诊断的最可能的根本原因</strong>。<strong>该女孩没有暴力、严重违法或破坏行为的历史，提示品行障碍（选项 A）</strong>。</p>\n<ul>\n<li>（选项 C）退行是一种防御机制，其特征是个性退回到较早的发展阶段并采取更幼稚的姿态。在儿童中，退行表现为回到他们已经长大的行为。想要奶瓶或奶嘴、发脾气、抱怨、攻击、吮拇指和婴儿语都是例子。遗尿（尿床）或遗粪症可能发生。<strong>退行通常由应激性生活事件触发，如丧亲、父母分离或性虐待</strong>。在缺乏这种病史的情况下，退行作为诊断不太可能。此外，该儿童的行为模式更符合对立违抗性障碍。</li>\n<li>（选项 E）遗粪症不太可能是由一个在其他发育里程碑上已完成的女孩的发育迟缓引起的。</li>\n<li>（选项 E）抑郁和遗粪症之间没有强相关性。此外，没有其他症状如情绪低落、悲伤或睡眠模式和食欲改变提示抑郁作为诊断。</li>\n</ul>", "references": "<ul>\n<li>Mental Help - Elimination Disorders: Encopresis</li>\n<li>Science Direct - Encopresis</li>\n</ul>", "related": ["AMC-Q1274-ODD-Risperidone"], "bodyHtml": "", "diseases": ["Encopresis"], "complaints": ["encopresis symptom"], "search": "amc-q1286 — encopresis in a 7-year-old girl\n遗粪症 — 鉴别诊断\n the parents of a 7-year-old girl have brought her to you for assessment because she frequently soils her underwear. in the past 2 months, they have received calls from her school about her problems there. she is easily irritated and becomes angry and aggressive with her classmates and other children at school. at home, they found her soiled underwear hidden. she becomes angry, cries, and fights with her older brother when he calls her 'smelly'. this happens several times a week. which one of the following is the most likely diagnosis? \n correct answer is  b  \n 该场景提示遗粪症。然而，该诊断的完整诊断标准不确定（场景中缺乏症状的频率和持续时间）。 \n  遗粪症是指 4 岁以上儿童每月超过一次将成形、半成形或液体粪便排到厕所以外的地方，持续至少 3 个月 。如果儿童从未有控制能力，该病称为原发性遗粪症，而继发性遗粪症是以前有控制能力的儿童的大便失禁。 遗粪症报告见于 1-4% 的学龄儿童 。 遗粪症在男孩中比女孩更常见 。 \n 遗粪症有两种不同类型： \n  伴便秘和溢出性失禁 ：伴便秘和溢出性失禁类型的儿童每周排便少于 3 次。由于便秘，每次排便时只有部分总粪便被排空。其余粪便的一部分漏出，通常在儿童日常活动中发生。一旦便秘解决，遗粪症通常不再存在。 \n  不伴便秘和溢出性失禁 ：在此类型中，无便秘，儿童粪便稠度正常。与便秘和溢出相关的病例不同，此类型的污粪是间歇性的。粪便可能排放到显著位置（例如作为对抗行为），或者是肛门自我刺激（例如各种形式的自慰）的无意结果。 不伴便秘和溢出性失禁的遗粪症比第一种类型的遗粪症少见，且常与对立违抗性障碍和品行障碍相关 。据估计，3% 的有精神问题的儿童可能有遗粪症。 \n  具有攻击性、愤怒爆发以及易怒和易激惹，对立违抗性障碍是遗粪症和该诊断的最可能的根本原因 。 该女孩没有暴力、严重违法或破坏行为的历史，提示品行障碍（选项 a） 。 \n \n （选项 c）退行是一种防御机制，其特征是个性退回到较早的发展阶段并采取更幼稚的姿态。在儿童中，退行表现为回到他们已经长大的行为。想要奶瓶或奶嘴、发脾气、抱怨、攻击、吮拇指和婴儿语都是例子。遗尿（尿床）或遗粪症可能发生。 退行通常由应激性生活事件触发，如丧亲、父母分离或性虐待 。在缺乏这种病史的情况下，退行作为诊断不太可能。此外，该儿童的行为模式更符合对立违抗性障碍。 \n （选项 e）遗粪症不太可能是由一个在其他发育里程碑上已完成的女孩的发育迟缓引起的。 \n （选项 e）抑郁和遗粪症之间没有强相关性。此外，没有其他症状如情绪低落、悲伤或睡眠模式和食欲改变提示抑郁作为诊断。 \n "}, {"id": "AMC-Q1300", "type": "mcq", "qid": 1300, "title": "自闭症谱系障碍 — 三联征诊断", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Mental-Health", "approach": [], "topic": ["自闭症谱系障碍 — 社交 + 沟通 + 刻板行为 三联征"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Mental-Health/AMC-Q1300-Autism-Diagnosis.md", "stem": "<p>A five-year-old boy is brought for evaluation by his parents concerning unusual behavior. He loves Popeye cartoon and always remembers when it is shown on TV. At that time he turns on the TV. He becomes distraught and irritated if he misses the cartoon. He has a goldfish and spends several hours staring at it with curiosity and fascination. His favorite toy is wooden building blocks that he uses to make towers, break them and build them again. He did not say his first word until the age of 2.5 years and could not use a communicative phrase at the age of 3 years. He does not play with his peers and is not interested in making friends. During the examination, he adamantly avoids eye contact. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Asperger syndrome."}, {"letter": "B", "text": "Autism."}, {"letter": "C", "text": "Mental retardation."}, {"letter": "D", "text": "Delayed developmental milestones."}, {"letter": "E", "text": "Obsessive-compulsive disorder."}], "rationale": "<p>1. 题型识别：诊断 — 儿童行为/发育异常的精神科鉴别 2. 关键线索（三联征均在 ≤3 岁前出现）：</p>\n<ul>\n<li><strong>社交损害</strong>：不跟同龄人玩、没兴趣交朋友、坚决回避目光接触</li>\n<li><strong>沟通损害</strong>：2.5 岁才会说第一个词、3 岁不能用沟通性短语</li>\n<li><strong>限制性/重复性行为</strong>：Popeye 仪式性观看、金鱼长时间凝视、积木重复塔→推到→再塔</li>\n<p>3. 鉴别排除：</p>\n<li>Asperger（A）：<strong>语言发育正常</strong>，此患儿有明显语言延迟 → 排除</li>\n<li>智力障碍（C）/ 发育延迟（D）：是特征/条件而非诊断</li>\n<li>OCD（E）：有仪式性行为但无语言延迟和社交损害 → 排除</li>\n<p>4. 锁定答案：典型自闭症三联征 → B</p>\n</ul>", "traps": "<ul>\n<li><strong>Asperger 陷阱</strong>：Asperger（高功能自闭症）与典型自闭症最关键的鉴别点是<strong>语言发育正常</strong>。此患儿 2.5 岁才会说第一个词 → 排除 Asperger</li>\n<li><strong>OCD 陷阱</strong>：仪式性行为可见于 OCD，但 OCD 不伴有语言延迟和社交损害</li>\n<li><strong>\"delay\" vs \"impairment\"</strong>：自闭症是语言<strong>损害</strong>（impaired）而非<strong>延迟</strong>（delayed）；delay 暗示将来会追上，自闭症不会</li>\n</ul>", "summary": "<p>自闭症诊断<strong>三联征</strong>（3 岁前出现）： 1. <strong>社交互动质量损害</strong>（≥2 项）：缺乏对他人感受的觉察 / 缺乏模仿 / 异常社交游戏 / 回避目光接触 / 缺乏交友能力 2. <strong>沟通损害</strong>（≥1 项）：咿呀学语缺失 / 非语言交流异常 / 言语形式或内容异常 / 无法维持对话 3. <strong>限制性/重复性行为</strong>（≥1 项）：刻板动作 / 持久不寻常的专注和仪式 / 对环境变化极度痛苦 / 缺乏想象性游戏</p>\n<p>行为问题：发脾气、多动、破坏性、冒险行为。</p>\n<p>发病率：至少 4/10000，男:女 = 4:1。约 30% 自闭症患儿智力正常。</p>", "explanation": "<p>该患儿表现出典型的自闭症障碍特征：</p>\n<ul>\n<li>持续的仪式性行为和执着（看 Popeye 动画片、积木和金鱼）</li>\n<li>语言发育延迟（2.5 岁说第一个词）</li>\n<li>社交沟通障碍（不跟同龄人玩、回避目光接触）</li>\n</ul>\n<p>Asperger 综合征（高功能自闭症）虽然与自闭症共享许多特征，但 Asperger 患儿的<strong>语言发育和智力正常</strong>。本患儿有明显的语言发育延迟，因此 Asperger 可排除。</p>\n<p>智力障碍和发育延迟是自闭症中常见的特征/条件，而非独立诊断。OCD 虽然有仪式性行为模式，但不伴有本患儿呈现的语言延迟、刻板行为和社交沟通障碍。</p>", "references": "<ul>\n<li>Medscape - Autism Spectrum Disorder</li>\n<li>UpToDate - Autism spectrum disorder: Evaluation and diagnosis</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "自闭症谱系障碍 — 三联征诊断\n自闭症谱系障碍 — 社交 + 沟通 + 刻板行为 三联征\n a five-year-old boy is brought for evaluation by his parents concerning unusual behavior. he loves popeye cartoon and always remembers when it is shown on tv. at that time he turns on the tv. he becomes distraught and irritated if he misses the cartoon. he has a goldfish and spends several hours staring at it with curiosity and fascination. his favorite toy is wooden building blocks that he uses to make towers, break them and build them again. he did not say his first word until the age of 2.5 years and could not use a communicative phrase at the age of 3 years. he does not play with his peers and is not interested in making friends. during the examination, he adamantly avoids eye contact. which one of the following is the most likely diagnosis? \n 该患儿表现出典型的自闭症障碍特征： \n \n 持续的仪式性行为和执着（看 popeye 动画片、积木和金鱼） \n 语言发育延迟（2.5 岁说第一个词） \n 社交沟通障碍（不跟同龄人玩、回避目光接触） \n \n asperger 综合征（高功能自闭症）虽然与自闭症共享许多特征，但 asperger 患儿的 语言发育和智力正常 。本患儿有明显的语言发育延迟，因此 asperger 可排除。 \n 智力障碍和发育延迟是自闭症中常见的特征/条件，而非独立诊断。ocd 虽然有仪式性行为模式，但不伴有本患儿呈现的语言延迟、刻板行为和社交沟通障碍。 "}, {"id": "AMC-Q0111", "type": "mcq", "qid": 111, "title": "纯母乳喂养儿 — 最易缺的是维生素 K（出生时肌注预防）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Neonatology", "approach": ["diagnosis", "prevention"], "topic": ["Vitamin K Deficiency", "Breastfeeding", "Newborn", "IM at birth"], "difficulty": 2, "correctAnswer": "E", "page": 1309, "tags": ["mcq", "amc", "paediatrics", "neonatology", "vitamin-k", "breastfeeding", "newborn", "hemorrhagic-disease-of-newborn", "approach-diagnosis", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Neonatology/AMC-Q0111-Vitamin-K-Deficiency.md", "stem": "<p>A fully breast-fed baby of a mother on a healthy, balanced diet could have the deficiency of which one of the following vitamins?</p>", "options": [{"letter": "A", "text": "Vitamin A."}, {"letter": "B", "text": "Vitamin B complex."}, {"letter": "C", "text": "Vitamin C."}, {"letter": "D", "text": "Vitamin D."}, {"letter": "E", "text": "Vitamin K."}], "rationale": "<p>1. <strong>题型识别</strong>：纯母乳喂养儿\"最可能缺哪种维生素\" → 考母乳营养成分短板。 2. <strong>母乳 Vit K 不足</strong>：母乳 Vit K 含量低；足月儿肠道菌群未建立、自身合成少 → 需出生时肌注。 3. <strong>其他维生素</strong>：A、B 族、C、D 在健康母乳中通常充足（Vit D 也偏低但非本题答案；题目强调\"出生时肌注\"的语境指向 K）。 4. <strong>不补的后果</strong>：Vit K 缺乏 → 晚发/早发出血，尤其是<strong>颅内出血</strong>；早产儿、母用抗癫痫药者更高危。 5. <strong>锁定 E</strong>。</p>", "traps": "<ul>\n<li><strong>\"母乳最缺 Vit D\"陷阱</strong>：Vit D 也偏低，但本题考点是\"出生时肌注预防出血\" → K。</li>\n<li><strong>忽略肌注语境</strong>：题干\"as this vitamin is given intramuscularly at birth\"暗示 K（新生儿常规肌注 Vit K）。</li>\n<li><strong>Vit C/B 充足</strong>：母乳喂养通常充足，非缺乏项。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Breast milk lacks or has insufficient vitamin K, but as this vitamin is given intramuscularly at birth, there is no more need for supplementation. Without supplementation at birth, the baby may suffer vitamin K deficiency and develop severe complications such as intracranial hemorrhage. Vitamin K deficiency is more common among premature babies and those whose mothers have been on antiepileptic drugs.</p>", "references": "<ul>\n<li>PubMed - Are breastfed infants vitamin K deficient?</li>\n</ul>", "related": ["AMC-Q1331-Breastfeeding-Failure-Frequency", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Vitamin K Deficiency", "Breastfeeding Issues"], "complaints": [], "search": "纯母乳喂养儿 — 最易缺的是维生素 k（出生时肌注预防）\nvitamin k deficiency breastfeeding newborn im at birth\ndiagnosis prevention\n a fully breast-fed baby of a mother on a healthy, balanced diet could have the deficiency of which one of the following vitamins? \n correct answer is  e  \n breast milk lacks or has insufficient vitamin k, but as this vitamin is given intramuscularly at birth, there is no more need for supplementation. without supplementation at birth, the baby may suffer vitamin k deficiency and develop severe complications such as intracranial hemorrhage. vitamin k deficiency is more common among premature babies and those whose mothers have been on antiepileptic drugs. "}, {"id": "AMC-Q0996", "type": "mcq", "qid": 996, "title": "AMC-Q0996 — Most common cause of failure to breastfeed", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Neonatology", "approach": [], "topic": ["母乳喂养失败"], "difficulty": 2, "correctAnswer": "B", "page": 1331, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Neonatology/AMC-Q0996-Breastfeeding-Failure-Frequency.md", "stem": "<p>Which one of the following is the most common cause of failure to breastfeed?</p>", "options": [{"letter": "A", "text": "Exhaustion of the mother"}, {"letter": "B", "text": "Reduced frequency of breastfeeding"}, {"letter": "C", "text": "A reduction in the time the baby feeds at each session"}, {"letter": "D", "text": "Maternal dehydration"}, {"letter": "E", "text": "Nipple problems"}], "rationale": "<ul>\n<li>母乳喂养推荐纯母乳 6 个月（EBF6），许多母亲在 6 个月前就停止</li>\n<li>停止最常见的原因是 <strong>\"奶水不足\"</strong> 感或摄入不足</li>\n<li><strong>奶水摄入不足的最常见原因是不恰当的早期喂养习惯</strong>：</li>\n<li>喂奶不频繁</li>\n<li>含乳不良</li>\n<li>母婴分离</li>\n<li>使用配方奶补充</li>\n<li>频率不足 → 乳汁产量下降 → 形成恶性循环</li>\n<li>母体疲惫（A）会间接导致频率下降；减少单次喂奶时间（C）影响较小；母体脱水（D）和乳头问题（E）较少见</li>\n</ul>", "traps": "<ul>\n<li>把\"母体疲惫\"或\"乳头问题\"误选为最常见 — 这些是次要原因</li>\n<li>真正的核心机制是 <strong>频率 → 泌乳量</strong> 的正反馈被打断</li>\n</ul>", "summary": "<table class='md-table'>\n<thead><tr><th>因素</th><th>角色</th></tr></thead>\n<tbody>\n<tr><td><strong>频率不足</strong></td><td><strong>最常见</strong>，破坏供需</td></tr>\n<tr><td>含乳不良</td><td>婴儿无法有效吸出</td></tr>\n<tr><td>母婴分离</td><td>同上</td></tr>\n<tr><td>配方奶补充</td><td>减少吸吮刺激</td></tr>\n<tr><td>母体疲惫</td><td>间接影响频率</td></tr>\n<tr><td>乳头问题</td><td>物理性，但较少见</td></tr>\n</tbody>\n</table>\n<p><strong>关键点</strong>：早开奶、勤吸吮 = 充足泌乳的黄金法则。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>母乳喂养对婴儿和母亲的好处已经得到充分证实。澳大利亚相关机构广泛采纳了纯母乳喂养 6 个月（EBF6）的推荐。</p>\n<p><strong>对婴儿的好处</strong>：增加疾病抵抗力，降低胃肠炎、复发性中耳炎、肺炎的发病率；降低 SIDS、结肠炎、高血压、肥胖、高脂血症、特应性疾病和糖尿病的发病率，IQ 更高。</p>\n<p><strong>对母亲的好处</strong>：排卵延迟，乳腺癌和卵巢癌风险降低，母乳喂养的亲密关系。</p>\n<p>对许多女性来说，母乳喂养的困难导致在推荐的 6 个月之前过早停止母乳喂养。</p>\n<p><strong>奶水摄入不足或对奶水产量不足的感知是过早停止母乳喂养的最常见原因</strong>。奶水摄入不足可能由于婴儿未能吸出乳汁或乳汁产量不足。</p>\n<p><strong>不恰当的早期喂养习惯是奶水摄入不足的最常见原因</strong>，包括：喂奶不频繁、含乳不良、母婴分离、使用配方奶补充。</p>\n<p>其他较不常见的原因包括婴儿的口部运动或神经异常以及乳房排空不良。</p>\n<p>在所给选项中，<strong>减少母乳喂养频率是乳汁产量下降的最常见原因</strong>。喂奶不频繁时，乳汁产量减少，导致母亲的乳汁产量和婴儿的摄入量都不足。</p>\n<ul>\n<li>（选项 A）母体疲惫可导致母乳喂养频率减少，最终导致泌乳失败。</li>\n<li>（选项 C）每次喂奶时含乳时间减少对乳汁产量的负面影响没有减少喂奶频率那么大。</li>\n<li>（选项 D）母体脱水可能与乳汁产量减少有关，但不如喂奶不频繁常见。</li>\n<li>（选项 E）乳头问题可妨碍适当和充分的母乳喂养，但喂奶不频繁仍是母乳喂养失败的最常见原因。</li>\n</ul>", "references": "<ul>\n<li>UpToDate - Common problems of breastfeeding and weaning</li>\n<li>Infant and Young Child Feeding</li>\n</ul>", "related": ["TR-Breastfeeding-Failure", "AMC-Q0111-Vitamin-K-Deficiency"], "bodyHtml": "", "diseases": ["Breastfeeding Issues"], "complaints": [], "search": "amc-q0996 — most common cause of failure to breastfeed\n母乳喂养失败\n which one of the following is the most common cause of failure to breastfeed? \n correct answer is  b  \n 母乳喂养对婴儿和母亲的好处已经得到充分证实。澳大利亚相关机构广泛采纳了纯母乳喂养 6 个月（ebf6）的推荐。 \n  对婴儿的好处 ：增加疾病抵抗力，降低胃肠炎、复发性中耳炎、肺炎的发病率；降低 sids、结肠炎、高血压、肥胖、高脂血症、特应性疾病和糖尿病的发病率，iq 更高。 \n  对母亲的好处 ：排卵延迟，乳腺癌和卵巢癌风险降低，母乳喂养的亲密关系。 \n 对许多女性来说，母乳喂养的困难导致在推荐的 6 个月之前过早停止母乳喂养。 \n  奶水摄入不足或对奶水产量不足的感知是过早停止母乳喂养的最常见原因 。奶水摄入不足可能由于婴儿未能吸出乳汁或乳汁产量不足。 \n  不恰当的早期喂养习惯是奶水摄入不足的最常见原因 ，包括：喂奶不频繁、含乳不良、母婴分离、使用配方奶补充。 \n 其他较不常见的原因包括婴儿的口部运动或神经异常以及乳房排空不良。 \n 在所给选项中， 减少母乳喂养频率是乳汁产量下降的最常见原因 。喂奶不频繁时，乳汁产量减少，导致母亲的乳汁产量和婴儿的摄入量都不足。 \n \n （选项 a）母体疲惫可导致母乳喂养频率减少，最终导致泌乳失败。 \n （选项 c）每次喂奶时含乳时间减少对乳汁产量的负面影响没有减少喂奶频率那么大。 \n （选项 d）母体脱水可能与乳汁产量减少有关，但不如喂奶不频繁常见。 \n （选项 e）乳头问题可妨碍适当和充分的母乳喂养，但喂奶不频繁仍是母乳喂养失败的最常见原因。 \n "}, {"id": "AMC-Q0115", "type": "mcq", "qid": 115, "title": "幼儿 UTI 的非特异性表现", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["幼儿 UTI 的非特异性表现 — 发热 + 腹痛 + 呕吐"], "difficulty": 2, "correctAnswer": "A", "page": 1358, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0115-Pediatric-UTI-Presentation.md", "stem": "<p>A 4-year-old girl is brought to you by her kindergarten teacher. She states that the child has not been well since this morning, vomited once, and complained of central abdominal pain. On examination, the child looks unwell and has a temperature of 39°C. Which one of the following would be most expected in this child?</p>", "options": [{"letter": "A", "text": "Numerous pus cells on urine microscopy."}, {"letter": "B", "text": "Inflamed ear drums."}, {"letter": "C", "text": "Neck stiffness."}, {"letter": "D", "text": "Inflamed tonsils."}, {"letter": "E", "text": "Localized tenderness over the right iliac fossa."}], "rationale": "<p>1. 题型识别：诊断 — 幼儿发热+腹痛的非特异性表现的鉴别 2. 关键线索：4 岁、今晨起病、呕吐 1 次、中央腹痛、T 39°C、看起来不适 3. 鉴别排除：</p>\n<ul>\n<li>中耳炎（B）：不伴腹痛 → 排除</li>\n<li>脑膜炎（C）：颈强直可伴发热和不适，但腹痛不典型 → 不太可能</li>\n<li>扁桃体炎（D）：不伴腹痛 → 排除</li>\n<li>阑尾炎（E）：中央腹痛→转移至右髂窝、呕吐，但 39°C 高热除非穿孔。今晨起病时间太短，不可能穿孔 → 排除</li>\n<p>4. 锁定答案：非特异表现 + 高热 → 幼儿 UTI（尿检大量白细胞）→ A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"UTI 必须有尿路症状\"陷阱</strong>：年龄越小，UTI 症状越模糊和非特异性。幼儿可以仅表现为发热、呕吐、腹痛</li>\n<li><strong>阑尾炎高热陷阱</strong>：单纯阑尾炎不常引起 39°C 高热；高热提示穿孔，但起病仅数小时不可能穿孔</li>\n<li><strong>腹痛 + 发热的鉴别陷阱</strong>：中耳炎/扁桃体炎引起发热但不伴腹痛；阑尾炎/UTI 两者均可，但高热 + 非特异性表现偏向 UTI</li>\n</ul>", "summary": "<p>幼儿 UTI 的表现特征：<strong>年龄越小，症状越非特异</strong>。幼儿可不出现典型尿频/尿急/排尿困难，而是以发热、呕吐、腹痛等非特异表现为主。对此类患儿，尿检大量白细胞是最常见和最预期的发现。</p>", "explanation": "<p>幼儿发生 UTI 时不出现典型泌尿系统症状（尿频、尿急、排尿困难）并不罕见。事实上，<strong>年龄越小，症状越模糊和非特异</strong>。</p>\n<ul>\n<li><strong>中耳炎</strong>：鼓膜充血，但不伴有腹痛</li>\n<li><strong>脑膜炎</strong>：可出现颈强直，伴发热和不适，但腹痛不典型</li>\n<li><strong>扁桃体炎</strong>：可致患儿不适和发热，但不引起腹痛</li>\n<li><strong>阑尾炎</strong>：中央腹痛、呕吐和右髂窝压痛，但不常引起 39°C 高热（除非穿孔）。今晨起病，此时间不足以发生穿孔</li>\n</ul>\n<p>因此，此患儿最可能的病因是 UTI，尿检预期发现大量白细胞（脓细胞）。</p>", "references": "<ul>\n<li>RCH - Urinary tract infection</li>\n<li>Medscape - Pediatric Urinary Tract Infection</li>\n</ul>", "related": ["AMC-Q1296-DMSA-Renal-Scarring", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain"], "search": "幼儿 uti 的非特异性表现\n幼儿 uti 的非特异性表现 — 发热 + 腹痛 + 呕吐\n a 4-year-old girl is brought to you by her kindergarten teacher. she states that the child has not been well since this morning, vomited once, and complained of central abdominal pain. on examination, the child looks unwell and has a temperature of 39°c. which one of the following would be most expected in this child? \n 幼儿发生 uti 时不出现典型泌尿系统症状（尿频、尿急、排尿困难）并不罕见。事实上， 年龄越小，症状越模糊和非特异 。 \n \n  中耳炎 ：鼓膜充血，但不伴有腹痛 \n  脑膜炎 ：可出现颈强直，伴发热和不适，但腹痛不典型 \n  扁桃体炎 ：可致患儿不适和发热，但不引起腹痛 \n  阑尾炎 ：中央腹痛、呕吐和右髂窝压痛，但不常引起 39°c 高热（除非穿孔）。今晨起病，此时间不足以发生穿孔 \n \n 因此，此患儿最可能的病因是 uti，尿检预期发现大量白细胞（脓细胞）。 "}, {"id": "AMC-Q0116", "type": "mcq", "qid": 116, "title": "儿童 UTI 住院指征 — <2 月龄必须住院", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["儿童 UTI 住院指征 — <2 月龄婴儿"], "difficulty": 2, "correctAnswer": "D", "page": 1378, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0116-UTI-Hospital-Admission.md", "stem": "<p>For which one of the following children with urinary tract infection (UTI) hospital admission is indicated?</p>", "options": [{"letter": "A", "text": "An infant younger than 12 months of age."}, {"letter": "B", "text": "A 6-year old male child with family history of urinary tract infection."}, {"letter": "C", "text": "A 5-year old female child with family history of urinary tract infection."}, {"letter": "D", "text": "An infant younger than 2 months of age."}, {"letter": "E", "text": "A 2-year old child with allergy to penicillin."}], "rationale": "<p>1. 题型识别：管理决策 — UTI 住院 vs 门诊治疗 2. 核心规则：RCH 指南 — <strong><2 月龄</strong>发热性 UTI 婴儿必须收入院 3. 排除选项：</p>\n<ul>\n<li><12 月龄（A）：太大，不是所有 <12 月龄都需要住院</li>\n<li>家族史（B/C）：不构成住院指征</li>\n<li>青霉素过敏（E）：可以换用替代抗生素，不构成住院指征</li>\n<p>4. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong><12 月龄 vs <2 月龄</strong>：A（<12 月龄）和 D（<2 月龄）之间选更严格的阈值。RCH 指南的关键年龄切点是 <strong>2 个月</strong>而非 12 个月</li>\n<li><strong>家族史 ≠ 住院指征</strong>：B/C 虽有 UTI 家族史，但这不影响住院决策</li>\n<li><strong>青霉素过敏 ≠ 住院指征</strong>：可换用替代口服/静脉抗生素</li>\n</ul>", "summary": "<p>RCH 儿童 UTI 住院指征：</p>\n<ul>\n<li><strong><2 月龄</strong>发热性 UTI → 必须住院</li>\n<li>其他住院考虑因素：临床中毒表现、无法耐受口服、复杂性 UTI、免疫功能低下</li>\n</ul>", "explanation": "<p>根据皇家儿童医院（RCH）指南，以下 UTI 患儿应收入院：</p>\n<ul>\n<li>临床中毒或败血症表现</li>\n<li><strong><2 月龄</strong>发热性 UTI 婴儿</li>\n<li>免疫功能低下</li>\n<li>呕吐/无法耐受口服抗生素</li>\n<li>无可靠的随访条件</li>\n</ul>", "references": "<ul>\n<li>RCH - Urinary tract infection</li>\n<li>Medscape - Pediatric Urinary Tract Infection</li>\n</ul>", "related": ["AMC-Q0115-Pediatric-UTI-Presentation", "AMC-Q1296-DMSA-Renal-Scarring", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "儿童 uti 住院指征 — <2 月龄必须住院\n儿童 uti 住院指征 — <2 月龄婴儿\n for which one of the following children with urinary tract infection (uti) hospital admission is indicated? \n 根据皇家儿童医院（rch）指南，以下 uti 患儿应收入院： \n \n 临床中毒或败血症表现 \n   发热性 uti 婴儿 \n 免疫功能低下 \n 呕吐/无法耐受口服抗生素 \n 无可靠的随访条件 \n "}, {"id": "AMC-Q0962", "type": "mcq", "qid": 962, "title": "儿童间歇性腹痛 + 侧腹疼 + 尿检阴性 → UPJ 梗阻；查超声（疼痛时）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": ["diagnosis", "investigation"], "topic": ["UPJ Obstruction", "Hydronephrosis", "Ultrasound during pain", "Flank pain"], "difficulty": 4, "correctAnswer": "E", "page": 1321, "tags": ["mcq", "amc", "paediatrics", "nephrology", "upj-obstruction", "hydronephrosis", "ultrasound", "approach-diagnosis", "approach-investigation"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0962-UPJ-Obstruction-Ultrasound.md", "stem": "<p>A 5-year-old boy with intermittent abdominal pain and vomiting usually lasting 12 hours. Last episode in left flank. Urinalysis and culture negative. Which investigation is most likely to reveal the cause?</p>", "options": [{"letter": "A", "text": "Plain abdominal films."}, {"letter": "B", "text": "Small intestine barium meal and follow-through."}, {"letter": "C", "text": "Serum creatinine and BUN."}, {"letter": "D", "text": "Serum electrolytes."}, {"letter": "E", "text": "Ultrasound scan during a painful episode."}], "rationale": "<p>1. <strong>题型识别</strong>：5 岁间歇性腹痛 + 呕吐 + 侧腹疼 + 尿检阴性 → 考肾积水/UPJ 梗阻的诊断检查。 2. <strong>间歇性腹痛 DDx</strong>：功能性（最多）、腹型偏头痛、IBS、肠系膜淋巴结炎、便秘；少见：肾积水、肠套叠、IBD、胰腺/肝胆、UTI、脾大、吞气、肿瘤、感染等。 3. <strong>定位肾源</strong>：侧腹疼 + 尿检/培养阴性 → 排除 UTI；结石可能低 → 考虑 UPJ 梗阻致肾积水。 4. <strong>UPJ 梗阻</strong>：小儿肾积水最常见原因（1/1000–2000 新生儿）。年长儿周期性侧腹疼 + 呕吐 = UPJ 间歇性扭结；不缓解 → 严重肾积水。 5. <strong>检查</strong>：超声是肾积水/UPJ 初始选择；<strong>间歇性</strong> → 疼痛发作时超声最易显影。 6. <strong>排除</strong>：</p>\n<ul>\n<li>A/B：腹平片/钡剂用于疑肠套叠（但 <2 岁、无侧腹疼，不符）。</li>\n<li>C/D：Cr/BUN/电解质评估肾功能，诊断价值低。</li>\n<p>7. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"腹痛 = 胃肠 → 钡剂\"陷阱</strong>：错。侧腹疼 + 尿检阴性指向肾，不是肠套叠。</li>\n<li><strong>\"查肾功能（Cr/BUN）\"陷阱</strong>：错。诊断价值低，不定位。</li>\n<li><strong>\"任何时间超声都行\"陷阱</strong>：错。间歇性 → <strong>疼痛时</strong>超声才易显影。</li>\n<li><strong>忽略 40% 功能性</strong>：但本例有侧腹疼 + 阴性尿检，非单纯功能性。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Intermittent abdominal pain: ~40% no cause found (functional). Other causes include abdominal migraine, IBS, mesenteric lymphadenitis, constipation; less common: hydronephrosis, intussusception, IBD, pancreatic/hepatic, UTI, splenomegaly, aerophagia, tumors, infections. Flank pain + negative UA makes UTI/stone unlikely → UPJ obstruction (hydronephrosis) likely. UPJ obstruction = most common cause pediatric hydronephrosis (1/1000–2000 newborns). Older children: periodic flank pain + vomiting from intermittent kinking; severe hydronephrosis if unresolved. Ultrasonography is initial for hydronephrosis/UPJ; sonography during painful attack most likely delineates. (A/B) X-ray/barium if intussusception (but <2yo, no flank pain). (C/D) electrolytes/Cr/BUN little diagnostic value.</p>", "references": "<ul>\n<li>Medscape - Pediatric Ureteropelvic Junction Obstruction</li>\n<li>Medscape - Hydronephrosis and Hydroureter</li>\n<li>UpToDate - Clinical manifestations and diagnosis of urinary tract obstruction and hydronephrosis</li>\n</ul>", "related": ["AMC-Q0964-UPJ-Obstruction-Mass", "AMC-Q0963-Wilms-Tumor", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["UPJ Obstruction"], "complaints": ["abdominal pain", "nausea/vomiting"], "search": "儿童间歇性腹痛 + 侧腹疼 + 尿检阴性 → upj 梗阻；查超声（疼痛时）\nupj obstruction hydronephrosis ultrasound during pain flank pain\ndiagnosis investigation\n a 5-year-old boy with intermittent abdominal pain and vomiting usually lasting 12 hours. last episode in left flank. urinalysis and culture negative. which investigation is most likely to reveal the cause? \n correct answer is  e  \n intermittent abdominal pain: ~40% no cause found (functional). other causes include abdominal migraine, ibs, mesenteric lymphadenitis, constipation; less common: hydronephrosis, intussusception, ibd, pancreatic/hepatic, uti, splenomegaly, aerophagia, tumors, infections. flank pain + negative ua makes uti/stone unlikely → upj obstruction (hydronephrosis) likely. upj obstruction = most common cause pediatric hydronephrosis (1/1000–2000 newborns). older children: periodic flank pain + vomiting from intermittent kinking; severe hydronephrosis if unresolved. ultrasonography is initial for hydronephrosis/upj; sonography during painful attack most likely delineates. (a/b) x-ray/barium if intussusception (but  "}, {"id": "AMC-Q0964", "type": "mcq", "qid": 964, "title": "复发性侧腹痛 + 呕吐 + 压痛 RUQ 包块 → UPJ 梗阻（vs Wilms 无痛）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": ["diagnosis", "differential"], "topic": ["UPJ Obstruction", "Recurrent flank pain", "Tender mass", "Hydronephrosis"], "difficulty": 3, "correctAnswer": "C", "page": 1326, "tags": ["mcq", "amc", "paediatrics", "nephrology", "upj-obstruction", "hydronephrosis", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q0964-UPJ-Obstruction-Mass.md", "stem": "<p>A 4-year-old with intermittent RUQ and right flank pain for 2 years. Episodes with vomiting, lasting 3h. Well between. This time 12h. Mass palpated RUQ, tender. Most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Wilms tumor."}, {"letter": "B", "text": "Neuroblastoma."}, {"letter": "C", "text": "Ureteropelvic junction obstruction."}, {"letter": "D", "text": "Vesicoureteral reflux (VUR)."}, {"letter": "E", "text": "Pyelonephritis."}], "rationale": "<p>1. <strong>题型识别</strong>：4 岁反复侧腹痛 + 呕吐 + 压痛包块 → 考 UPJ 梗阻 vs 腹部肿瘤。 2. <strong>UPJ 梗阻</strong>：小儿肾积水最常见原因（1/1000–2000）。年长儿周期性侧腹疼 + 呕吐（UPJ 间歇性扭结）；不缓解 → 严重肾积水/肾盂扩张 → 侧腹疼甚至压痛。 3. <strong>鉴别</strong>：</p>\n<ul>\n<li>A Wilms：光滑硬、无痛、不过中线 → 本例<strong>压痛</strong>不符。</li>\n<li>B Neuroblastoma：<2 岁更多，硬不规则、无痛、可过中线；年龄 + 压痛不符。</li>\n<li>D/E：pyelonephritis / VUR 不引起可触及包块。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"无痛包块 = Wilms\"陷阱</strong>：错。本例包块<strong>压痛</strong>，Wilms 无痛，故偏 UPJ（积水扩张可压痛）。</li>\n<li><strong>\"神经母细胞瘤\"陷阱</strong>：错。<2 岁、硬不规则、过中线；不符。</li>\n<li><strong>\"发热 + 压痛 = 感染\"陷阱</strong>：错。pyelonephritis 无包块。</li>\n<li><strong>压痛的意义</strong>：UPJ 梗阻严重肾积水时包块可压痛，是区分 Wilms 的关键。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Intermittent abdominal pain has diverse causes. UPJ obstruction = most common pediatric hydronephrosis (1/1000–2000 newborns). Older children: periodic flank pain + vomiting from intermittent kinking; if unresolved → severe hydronephrosis, pelvic distention → flank pain or tenderness. (A) Wilms: smooth firm NON-tender mass not crossing midline → less likely (mass here tender). (B) Neuroblastoma: most common extracranial malignant tumor, <2yo, hard irregular non-tender, may cross midline. (D/E) VUR/pyelonephritis don't cause palpable mass.</p>", "references": "<ul>\n<li>Medscape - Pediatric Ureteropelvic Junction Obstruction</li>\n<li>Medscape - Hydronephrosis and Hydroureter</li>\n<li>UpToDate - Clinical manifestations and diagnosis of urinary tract obstruction and hydronephrosis</li>\n<li>AAFP - Recognition of Common Childhood Malignancies</li>\n</ul>", "related": ["AMC-Q0962-UPJ-Obstruction-Ultrasound", "AMC-Q0963-Wilms-Tumor", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Wilms Tumor", "UPJ Obstruction"], "complaints": ["nausea/vomiting"], "search": "复发性侧腹痛 + 呕吐 + 压痛 ruq 包块 → upj 梗阻（vs wilms 无痛）\nupj obstruction recurrent flank pain tender mass hydronephrosis\ndiagnosis differential\n a 4-year-old with intermittent ruq and right flank pain for 2 years. episodes with vomiting, lasting 3h. well between. this time 12h. mass palpated ruq, tender. most likely diagnosis? \n correct answer is  c  \n intermittent abdominal pain has diverse causes. upj obstruction = most common pediatric hydronephrosis (1/1000–2000 newborns). older children: periodic flank pain + vomiting from intermittent kinking; if unresolved → severe hydronephrosis, pelvic distention → flank pain or tenderness. (a) wilms: smooth firm non-tender mass not crossing midline → less likely (mass here tender). (b) neuroblastoma: most common extracranial malignant tumor,  "}, {"id": "AMC-Q1296", "type": "mcq", "qid": 1296, "title": "反复 UTI 患儿 — DMSA 评估肾瘢痕", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["反复 UTI 患儿 — DMSA 肾静态显像评估肾瘢痕"], "difficulty": 3, "correctAnswer": "A", "page": 1355, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q1296-DMSA-Renal-Scarring.md", "stem": "<p>You order an ultrasound scan for a 9-year-old girl, who has been brought for treatment of urinary tract infection for the second time this year. On the ultrasound, the right kidney is reported smaller than the left beyond the normal discrepancy. Which one of the following is the most appropriate investigation to consider for assessment of renal status?</p>", "options": [{"letter": "A", "text": "DMSA."}, {"letter": "B", "text": "DTPA scintigraphy."}, {"letter": "C", "text": "Urea and electrolytes."}, {"letter": "D", "text": "Abdominal CT scan."}, {"letter": "E", "text": "Urine culture."}], "rationale": "<p>1. 题型识别：检查选择 — 反复 UTI + 超声提示一侧肾缩小 → 需评估肾实质损伤（肾瘢痕） 2. 关键线索：复发性 UTI、超声一侧肾缩小 > 正常差异范围 3. 鉴别排除：</p>\n<ul>\n<li>DTPA（B）：可评估肾功能但 DMSA 仍是金标准 / U&E（C）：反映肾排泄功能而非肾实质 / CT（D）：解剖结构，不评估功能 / 尿培养（E）：判断感染存在与否，不评估肾功能</li>\n<p>4. 锁定答案：DMSA 是肾瘢痕金标准 → A</p>\n</ul>", "traps": "<ul>\n<li><strong>DTPA 混淆</strong>：DTPA 也可评估肾功能和瘢痕，速度快、辐射少，但 DMSA 仍为金标准 — 考试中选金标准</li>\n<li><strong>U&E 正常不代表肾正常</strong>：单侧肾严重损伤而另一侧代偿时，尿素和肌酐可在正常范围</li>\n<li><strong>超声 ≠ 功能评估</strong>：超声只看形态/大小，不评估肾功能</li>\n</ul>", "summary": "<p><strong>DMSA 扫描</strong>是诊断肾瘢痕的金标准。DMSA 适应证：</p>\n<ul>\n<li>临床怀疑肾损伤</li>\n<li>肾功能下降</li>\n<li>怀疑 VUR（膀胱输尿管反流）</li>\n<li>年长已排尿训练的儿童超声提示梗阻性尿路病</li>\n</ul>\n<p>反复 UTI + 超声一侧肾缩小 → <strong>首选 DMSA</strong>。</p>", "explanation": "<ul>\n<li><strong>A. DMSA</strong>：二巯基丁二酸肾静态显像，是诊断肾瘢痕的金标准，适用于反复 UTI 导致可能的肾损伤</li>\n<li><strong>B. DTPA</strong>：DTPA 肾动态显像（Tc99 标记），也能提供肾功能和瘢痕信息，比 DMSA 更快、辐射更少，但 DMSA 仍是金标准</li>\n<li><strong>C. 尿素和肌酐</strong>：升高提示肾功能受损，但不反映肾脏本身功能。正常值也不能排除单侧肾损伤（对侧代偿）</li>\n<li><strong>D. 腹部 CT</strong>：可视化肾脏及周围结构，但无法评估肾功能</li>\n<li><strong>E. 尿培养</strong>：显示感染存在与否，不提供肾功能信息</li>\n</ul>", "references": "<ul>\n<li>RACGP - Paediatric urinary tract infections: Diagnosis and treatment</li>\n</ul>", "related": ["AMC-Q0115-Pediatric-UTI-Presentation", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "反复 uti 患儿 — dmsa 评估肾瘢痕\n反复 uti 患儿 — dmsa 肾静态显像评估肾瘢痕\n you order an ultrasound scan for a 9-year-old girl, who has been brought for treatment of urinary tract infection for the second time this year. on the ultrasound, the right kidney is reported smaller than the left beyond the normal discrepancy. which one of the following is the most appropriate investigation to consider for assessment of renal status? \n \n  a. dmsa ：二巯基丁二酸肾静态显像，是诊断肾瘢痕的金标准，适用于反复 uti 导致可能的肾损伤 \n  b. dtpa ：dtpa 肾动态显像（tc99 标记），也能提供肾功能和瘢痕信息，比 dmsa 更快、辐射更少，但 dmsa 仍是金标准 \n  c. 尿素和肌酐 ：升高提示肾功能受损，但不反映肾脏本身功能。正常值也不能排除单侧肾损伤（对侧代偿） \n  d. 腹部 ct ：可视化肾脏及周围结构，但无法评估肾功能 \n  e. 尿培养 ：显示感染存在与否，不提供肾功能信息 \n "}, {"id": "AMC-Q1399", "type": "mcq", "qid": 1399, "title": "无症状持续性蛋白尿 — 下一步完整尿液检查", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Nephrology", "approach": [], "topic": ["无症状持续性蛋白尿 — 下一步完整尿液检查"], "difficulty": 3, "correctAnswer": "C", "page": 1366, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Nephrology/AMC-Q1399-Persistent-Proteinuria-Urinalysis.md", "stem": "<p>An 8-year-old boy is found to have persistent proteinuria of 2+ on dipstick urine. There is no hematuria. Physical examination including blood pressure is unremarkable. Which one of the following is the next best investigation to consider for this boy?</p>", "options": [{"letter": "A", "text": "Renal biopsy."}, {"letter": "B", "text": "12-hour urine protein."}, {"letter": "C", "text": "Urine examination."}, {"letter": "D", "text": "C3 and C4 level measurement."}, {"letter": "E", "text": "Ultrasonography."}], "rationale": "<p>1. 题型识别：检查顺序 — 无症状持续性蛋白尿的诊断路径 2. 关键线索：尿试纸 2+ 蛋白、无血尿、体格检查/血压正常 3. 蛋白尿确诊路径：</p>\n<ul>\n<li>连续两次尿试纸（间隔 1-2 天）确认蛋白尿 → ✓ 已确认持续性</li>\n<li>下一步：完整尿液检查（urinalysis）— 评估尿沉渣、血尿、红细胞管型、脓尿、脂尿</li>\n<li>再下一步：尿蛋白/肌酐比值（首次晨尿）</li>\n<p>4. 排除选项：</p>\n<li>肾活检（A）：儿童无症状蛋白尿中不常规推荐</li>\n<li>12h 尿蛋白（B）：蛋白定量用 24h 而非 12h</li>\n<li>C3/C4（D）/ 超声（E）：根据临床情境选择，非下一步必做</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>跳过 urinalysis 直接做定量</strong>：确认持续性后应先用完整尿检评估尿沉渣，而非直接做 24h 蛋白定量</li>\n<li><strong>12h vs 24h</strong>：蛋白定量用 <strong>24 小时</strong>尿收集，选项 B 的 12h 是错的</li>\n<li><strong>过早肾活检</strong>：无症状持续性蛋白尿中肾活检有争议，不常规推荐</li>\n</ul>", "summary": "<p>蛋白尿诊断路径： 1. <strong>确认</strong>：两次连续尿试纸（间隔 1-2 天）均阳性 2. <strong>尿检（urinalysis）</strong>：中段尿，评估尿沉渣、血尿、红细胞管型、脓尿、脂尿 3. <strong>实验室</strong>：肾功能（BUN/Cr）、电解质、胆固醇、白蛋白、总蛋白 4. <strong>定量</strong>：首次晨尿蛋白/肌酐比值（估算 24h 蛋白排泄量） 5. <strong>进一步</strong>（按需）：肾超声、补体 C3/C4、ANA、链球菌酶、乙肝/丙肝/HIV 血清学 6. <strong>VCUG</strong>：超声异常伴瘢痕或发热性 UTI 史时考虑</p>", "explanation": "<p>蛋白尿定义为尿试纸检测蛋白 ≥1+。确诊需连续两次尿试纸或尿检（间隔 1-2 天）均显示蛋白尿。</p>\n<p>若试纸蛋白尿持续存在，下一步最佳为对诊室获取的中段尿样本进行完整尿液检查（urinalysis），以更准确评估尿液情况。尿检可评估尿沉渣及肾小球/实质病变的其他征象（血尿、红细胞管型、脓尿、脂尿）。</p>\n<p>肾活检在无症状持续性蛋白尿患儿中的作用有争议，不常规推荐。蛋白定量使用 24 小时尿液收集（非 12 小时）。C3/C4、超声等根据临床情况选择。</p>", "references": "<ul>\n<li>The Royal Children's Hospital (RCH) - Proteinuria</li>\n<li>UpToDate - Evaluation of proteinuria in children</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "无症状持续性蛋白尿 — 下一步完整尿液检查\n无症状持续性蛋白尿 — 下一步完整尿液检查\n an 8-year-old boy is found to have persistent proteinuria of 2+ on dipstick urine. there is no hematuria. physical examination including blood pressure is unremarkable. which one of the following is the next best investigation to consider for this boy? \n 蛋白尿定义为尿试纸检测蛋白 ≥1+。确诊需连续两次尿试纸或尿检（间隔 1-2 天）均显示蛋白尿。 \n 若试纸蛋白尿持续存在，下一步最佳为对诊室获取的中段尿样本进行完整尿液检查（urinalysis），以更准确评估尿液情况。尿检可评估尿沉渣及肾小球/实质病变的其他征象（血尿、红细胞管型、脓尿、脂尿）。 \n 肾活检在无症状持续性蛋白尿患儿中的作用有争议，不常规推荐。蛋白定量使用 24 小时尿液收集（非 12 小时）。c3/c4、超声等根据临床情况选择。 "}, {"id": "AMC-Q0887", "type": "mcq", "qid": 887, "title": "Retinoblastoma — 初始检查选超声（钙化），避免 CT/活检", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Oncology", "approach": ["diagnosis", "imaging"], "topic": ["Retinoblastoma", "Leukocoria", "Initial Investigation", "Ultrasound", "Calcification"], "difficulty": 3, "correctAnswer": "B", "page": 1315, "tags": ["mcq", "amc", "paediatrics", "oncology", "retinoblastoma", "leukocoria", "approach-diagnosis", "approach-imaging"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Oncology/AMC-Q0887-Retinoblastoma-Ultrasound.md", "stem": "<p>A 4-year-old girl presents with proptosis of her left eye and a white cornea noticed yesterday. Suspecting retinoblastoma, which is the most appropriate initial diagnostic test?</p>", "options": [{"letter": "A", "text": "MRI."}, {"letter": "B", "text": "Ultrasound."}, {"letter": "C", "text": "CT scan."}, {"letter": "D", "text": "X-ray."}, {"letter": "E", "text": "Biopsy."}], "rationale": "<p>1. <strong>题型识别</strong>：儿童白瞳/突眼疑 retinoblastoma → 问\"初始检查\"。 2. <strong>Retinoblastoma 要点</strong>：最常见儿童眼内肿瘤；leukocoria 最常见，斜视第二；可有视力下降、眼炎、玻璃体出血、青光眼、突眼等；5–10% 家族史（RB1）。 3. <strong>诊断路径</strong>：散瞳间接眼底检查（全麻下）→  chalky 白灰视网膜肿块。超声便宜可及，特征 = 眼内钙化。 4. <strong>MRI 角色</strong>：在 PE + 眼底 + 超声确立诊断<strong>后</strong>，用于术前评估、视神经受累、三侧性 RB 等。 5. <strong>避免 CT/X-ray</strong>：遗传型 RB1 突变，CT/X-ray 增二次恶性肿瘤风险。 6. <strong>活检 无用</strong>：诊断不靠活检。 7. <strong>锁定 B</strong>。</p>", "traps": "<ul>\n<li><strong>\"MRI 最准 = 首选\"陷阱</strong>：错。MRI 是确立后分期用，初始是眼底 + 超声。</li>\n<li><strong>\"CT 评估大小\"陷阱</strong>：错。CT 增 RB1 二次癌风险，不推荐。</li>\n<li><strong>\"活检确诊\"陷阱</strong>：错。RB 不靠活检。</li>\n<li><strong>把 leukocoria 当炎症</strong>：白瞳是 RB 题眼，不是普通结膜炎。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>Retinoblastoma = most common intraocular tumor in children. Leukocoria (white cornea / cat's eye) most common sign, strabismus second. Diagnosis by dilated indirect ophthalmoscopy under anesthesia; chalky white-grey retinal mass. Ultrasonography cheap/available, characteristic = intraocular calcification.</p>\n<p>(A) MRI emergent after PE + fundus + US for staging/extension/trilateral RB, not initial. (C/D) CT/x-ray discouraged — hereditary RB1 raises secondary malignancy risk. (E) Biopsy no role.</p>", "references": "<ul>\n<li>Guidelines for imaging retinoblastoma: imaging principles and MRI standardization</li>\n<li>UpToDate - Overview of retinoblastoma</li>\n</ul>", "related": ["AMC-Q1323-Wilms-Tumor", "AMC-Q1328-Neuroblastoma", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Retinoblastoma"], "complaints": [], "search": "retinoblastoma — 初始检查选超声（钙化），避免 ct/活检\nretinoblastoma leukocoria initial investigation ultrasound calcification\ndiagnosis imaging\n a 4-year-old girl presents with proptosis of her left eye and a white cornea noticed yesterday. suspecting retinoblastoma, which is the most appropriate initial diagnostic test? \n correct answer is  b  \n retinoblastoma = most common intraocular tumor in children. leukocoria (white cornea / cat's eye) most common sign, strabismus second. diagnosis by dilated indirect ophthalmoscopy under anesthesia; chalky white-grey retinal mass. ultrasonography cheap/available, characteristic = intraocular calcification. \n (a) mri emergent after pe + fundus + us for staging/extension/trilateral rb, not initial. (c/d) ct/x-ray discouraged — hereditary rb1 raises secondary malignancy risk. (e) biopsy no role. "}, {"id": "AMC-Q0963", "type": "mcq", "qid": 963, "title": "Wilms 瘤 — 2–3 岁、光滑硬、无痛、不过中线的腹部包块", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Oncology", "approach": ["diagnosis", "differential"], "topic": ["Wilms Tumor", "Nephroblastoma", "RUQ mass", "Non-tender", "2-3yo"], "difficulty": 3, "correctAnswer": "C", "page": 1323, "tags": ["mcq", "amc", "paediatrics", "oncology", "wilms-tumor", "nephroblastoma", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Oncology/AMC-Q0963-Wilms-Tumor.md", "stem": "<p>A 4-year-old boy with intermittent abdominal pain (max 2–3h, then subsides). Asymptomatic between. This time pain lasted 12h. Afebrile. A mass is palpated in RUQ, not tender. Most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Hepatoblastoma."}, {"letter": "B", "text": "Neuroblastoma."}, {"letter": "C", "text": "Wilms tumor."}, {"letter": "D", "text": "Pyelonephritis."}, {"letter": "E", "text": "Pancreatic tumor."}], "rationale": "<p>1. <strong>题型识别</strong>：4 岁 + 间歇性腹痛 + RUQ <strong>无痛</strong>包块 → 考儿童腹部肿瘤鉴别（Wilms vs neuroblastoma）。 2. <strong>Wilms tumor</strong>：</p>\n<ul>\n<li>最常见儿童腹腔内恶性肿瘤，诊断高峰 2–3 岁。</li>\n<li>多散发，少数家族史；WT1（11 号染色体）突变 ~20%。</li>\n<li>表现：腹部包块/肿胀（25–40% 腹痛，12–25% 血尿，25% 高血压——肾动脉受压→肾素）。</li>\n<li>体征：光滑硬、无痛、不过中线的可触及包块。</li>\n<p>3. <strong>鉴别</strong>：</p>\n<li>A Hepatoblastoma：罕见肝恶性，多无症状，晚期 40% 骨松（与本案不符）。</li>\n<li>B Neuroblastoma：<2 岁更多，硬、不规则、可过中线；本案 4 岁 + 光滑不过中线不符。</li>\n<li>D Pyelonephritis：CVA 压痛但无包块，常发热。</li>\n<li>E Pancreatic tumor：儿童极罕见。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"neuroblastoma 更常见\"陷阱</strong>：错。NB 是颅外实体瘤最多，但 Wilms 是腹腔内最多，且本案年龄/体征偏 Wilms。</li>\n<li><strong>\"包块痛 = 感染\"陷阱</strong>：错。pyelonephritis 有发热/CVA 压痛，无包块。</li>\n<li><strong>忽略高血压线索</strong>：Wilms 可高血压（肾素），是题眼之一。</li>\n<li><strong>过中线 vs 不过中线</strong>：NB 可过中线，Wilms 不过。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Wilms tumor (nephroblastoma) = most common intra-abdominal tumor of childhood, often diagnosed at 2–3 years. Sporadic; WT1 on chr 11 mutated in ~20%. Presents with abdominal mass/swelling, often pain (25–40%), hematuria (12–25%), fever, hypertension (25%, renal artery compression → renin). Smooth firm non-tender mass not crossing midline. (A) Hepatoblastoma rare hepatic, asymptomatic, osteopenia. (B) Neuroblastoma <2yo, hard irregular non-tender, can cross midline. (D) Pyelonephritis CVA tenderness, no mass, fever. (E) Pancreatic tumors extremely rare in children.</p>", "references": "<ul>\n<li>Medscape - Pediatric Ureteropelvic Junction Obstruction</li>\n<li>Medscape - Hydronephrosis and Hydroureter</li>\n<li>UpToDate - Clinical manifestations and diagnosis of urinary tract obstruction and hydronephrosis</li>\n</ul>", "related": ["AMC-Q0969-Neuroblastoma", "AMC-Q0962-UPJ-Obstruction-Ultrasound", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Wilms Tumor"], "complaints": ["abdominal pain"], "search": "wilms 瘤 — 2–3 岁、光滑硬、无痛、不过中线的腹部包块\nwilms tumor nephroblastoma ruq mass non-tender 2-3yo\ndiagnosis differential\n a 4-year-old boy with intermittent abdominal pain (max 2–3h, then subsides). asymptomatic between. this time pain lasted 12h. afebrile. a mass is palpated in ruq, not tender. most likely diagnosis? \n correct answer is  c  \n wilms tumor (nephroblastoma) = most common intra-abdominal tumor of childhood, often diagnosed at 2–3 years. sporadic; wt1 on chr 11 mutated in ~20%. presents with abdominal mass/swelling, often pain (25–40%), hematuria (12–25%), fever, hypertension (25%, renal artery compression → renin). smooth firm non-tender mass not crossing midline. (a) hepatoblastoma rare hepatic, asymptomatic, osteopenia. (b) neuroblastoma  "}, {"id": "AMC-Q0969", "type": "mcq", "qid": 969, "title": "<1 岁婴儿无痛腹部包块 → 神经母细胞瘤（vs Wilms 2–3 岁）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Oncology", "approach": ["diagnosis", "differential"], "topic": ["Neuroblastoma", "6mo", "Left hypochondrium", "Non-tender hard mass"], "difficulty": 3, "correctAnswer": "B", "page": 1328, "tags": ["mcq", "amc", "paediatrics", "oncology", "neuroblastoma", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Oncology/AMC-Q0969-Neuroblastoma.md", "stem": "<p>Mother of a 6-month-old boy finds a hard mass in the left hypochondrium while bathing. Non-tender. Most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Wilms tumor."}, {"letter": "B", "text": "Neuroblastoma."}, {"letter": "C", "text": "Polycystic kidney disease."}, {"letter": "D", "text": "Ureteropelvic junction obstruction."}, {"letter": "E", "text": "Hepatoblastoma."}], "rationale": "<p>1. <strong>题型识别</strong>：6 月龄婴儿洗澡时发现无痛硬包块 → 考 Wilms vs neuroblastoma。 2. <strong>Wilms</strong>：最常见腹腔内恶性瘤，诊断高峰 3.5 岁；<1 岁较少。 3. <strong>Neuroblastoma</strong>：</p>\n<ul>\n<li>最常见<strong>颅外</strong>恶性实体瘤；初发多 <strong><2 岁</strong>。</li>\n<li>2/3 腹腔内，其中 2/3 源于肾上腺。</li>\n<li>可触及无痛包块；常在洗澡/拥抱时发现。</li>\n<p>4. <strong>本例</strong>：6 月龄（<1 岁）→ neuroblastoma 远多于 Wilms。 5. <strong>鉴别</strong>：</p>\n<li>A：6 月龄 Wilms 较少。</li>\n<li>C：多囊肾包块不硬。</li>\n<li>D：UPJ 梗阻无硬包块（扩张肾不硬）。</li>\n<li>E：hepatoblastoma 不在左侧、非硬。</li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"腹部包块 = Wilms\"陷阱</strong>：错。Wilms 高峰 3.5 岁；<1 岁偏 neuroblastoma。</li>\n<li><strong>\"<1 岁 = 不可能肿瘤\"陷阱</strong>：错。neuroblastoma 常 <2 岁。</li>\n<li><strong>忽略部位</strong>：NB 2/3 源于肾上腺（可单侧腹/侧腹）；Wilms 不过中线但年龄不符。</li>\n<li><strong>硬 vs 光滑</strong>：NB 硬不规则，Wilms 光滑；但本题关键是年龄。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>Child with abdominal mass → consider (1) Wilms (nephroblastoma), (2) neuroblastoma. Wilms median dx 3.5yo, less likely <1yo. Neuroblastoma = most common extracranial malignant tumor of childhood, presents <2yo, 2/3 intra-abdominal (2/3 adrenal). Non-tender palpable mass; often found during bathing/hugging. Given age (6mo) → neuroblastoma more likely than Wilms. (A) Less likely at 6mo. (C) Polycystic kidney mass not hard. (D) UPJ obstruction no hard mass. (E) Hepatoblastoma not left-sided hard.</p>", "references": "<ul>\n<li>Medscape - Pediatric Neuroblastoma</li>\n<li>AAFP - Recognition of Common Childhood Malignancies</li>\n<li>UpToDate - Presentation and diagnosis of neuroblastoma</li>\n</ul>", "related": ["AMC-Q0963-Wilms-Tumor", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Wilms Tumor", "Neuroblastoma"], "complaints": [], "search": "<1 岁婴儿无痛腹部包块 → 神经母细胞瘤（vs wilms 2–3 岁）\nneuroblastoma 6mo left hypochondrium non-tender hard mass\ndiagnosis differential\n mother of a 6-month-old boy finds a hard mass in the left hypochondrium while bathing. non-tender. most likely diagnosis? \n correct answer is  b  \n child with abdominal mass → consider (1) wilms (nephroblastoma), (2) neuroblastoma. wilms median dx 3.5yo, less likely  "}, {"id": "AMC-Q0113", "type": "mcq", "qid": 113, "title": "AMC-Q0113 — SCFE in a 13-year-old boy", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Orthopaedics", "approach": [], "topic": ["股骨头骨骺滑脱 (SCFE)"], "difficulty": 3, "correctAnswer": "D", "page": 1340, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Orthopaedics/AMC-Q0113-SCFE.md", "stem": "<p>A 13-year-old boy presents to his general practitioner, accompanied by his mother, complaining of poorly localized pain in his knee for the past 6 weeks. His mother has observed a limp for the same period of time. He walks with his foot externally rotated. Examination of the knee is normal. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Osteochondritis dissecans of the knee"}, {"letter": "B", "text": "Perthes disease of the hip"}, {"letter": "C", "text": "Undiagnosed congenital dislocation of the hip"}, {"letter": "D", "text": "Slipped capital femoral epiphysis (SCFE)"}, {"letter": "E", "text": "Osgood-Schlatter osteochondritis of the knee"}], "rationale": "<ul>\n<li>关键三联征：<strong>青少年 + 膝痛 + 髋部病变</strong>（膝痛是<strong>髋部牵涉痛</strong>）</li>\n<li>典型表现：</li>\n<li>10-15 岁青少年（多见超重男孩）</li>\n<li>髋僵硬 → 跛行</li>\n<li><strong>膝痛</strong>（股神经前皮支分布到膝，<strong>牵涉痛</strong>）</li>\n<li>髋屈曲时<strong>外旋</strong></li>\n<li>行走时<strong>足外旋</strong></li>\n<li>内旋受限最明显</li>\n<li>关键警示：<strong>任何青少年跛行或膝痛都必须做双髋 X 线</strong>（AP + 蛙式位），否则漏诊</li>\n<li>各选项分析：</li>\n<li>A（膝剥脱性骨软骨炎）：膝痛 + 肿胀，<strong>髋正常</strong></li>\n<li>B（Perthes 病）：4-10 岁，<strong>年龄不符</strong></li>\n<li>C（先髋脱位）：<strong>应早发病</strong>，不会到 13 岁才出现</li>\n<li>E（Osgood-Schlatter）：<strong>胫骨结节</strong>局部压痛，髋无碍</li>\n</ul>", "traps": "<ul>\n<li>看到\"膝痛\"就只看膝 — 漏掉髋部牵涉痛，漏诊 SCFE</li>\n<li>选 B（Perthes）— 4-10 岁才是 Perthes，10-15 岁是 SCFE</li>\n<li>选 E（Osgood-Schlatter）— 该病局部压痛在胫骨结节，不影响髋</li>\n</ul>", "summary": "<p><strong>SCFE 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>年龄</td><td>10-15 岁青少年</td></tr>\n<tr><td>高危</td><td>肥胖、内分泌病（甲减）</td></tr>\n<tr><td>双侧</td><td>20% 病例</td></tr>\n<tr><td>关键症状</td><td><strong>膝痛</strong>（牵涉痛） + 跛行 + 足外旋</td></tr>\n<tr><td>检查</td><td><strong>双髋 X 线</strong>（AP + 蛙式位）</td></tr>\n<tr><td>并发症</td><td><strong>股骨头缺血性坏死</strong>（即使治疗仍可发生）</td></tr>\n<tr><td>治疗</td><td>立即<strong>停止负重</strong> + 紧急转诊；急性滑脱用牵引轻柔复位，避免手法复位（防 AVN）</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：延误诊断 → 滑脱加重 → AVN 风险激增。\"青春期 + 膝痛 + 跛行\" = 髋部 X 线必须做。</p>", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>所描述的临床表现以及患者的年龄提示股骨头骨骺滑脱（SCFE）为最可能的诊断</strong>。</p>\n<p>SCFE 更常见于 10-15 岁的青少年。典型病例是超重的青春期前男孩。该病 20% 病例为双侧。</p>\n<p>SCFE 表现为：</p>\n<ul>\n<li>髋部活动时跛行和易激惹</li>\n<li>膝痛——由受累髋部牵涉</li>\n<li>髋屈曲时髋部外旋。行走时髋部通常处于外旋位</li>\n<li>多数活动受限，特别是内旋</li>\n</ul>\n<p><strong>首发症状是休息后可缓解的髋部僵硬</strong>。随后出现跛行和髋部疼痛，沿大腿前内侧放射至膝部。早期髋部检查既无疼痛也无活动受限。在更晚期，髋部活动变得疼痛，屈曲、外展和内旋减少。受累腿行走时外旋。</p>\n<p><strong>SCFE 最重要的方面是尽管经过专业治疗，仍有大量患者发生股骨头缺血性坏死</strong>。因此，在发生严重滑脱之前诊断该病很重要。这需要早期检查和转诊。</p>\n<p><strong>任何有跛行或膝痛的青少年都应进行双髋 X 线检查（AP 和蛙式位）</strong>。否则，这一重要情况将被遗漏。</p>\n<p>最重要的管理原则包括：</p>\n<ul>\n<li>停止负重并紧急转诊</li>\n<li>急性滑脱时，通过牵引轻柔复位比手法复位更好，可预防晚期股骨头缺血性坏死</li>\n<li>复位后进行钉内固定</li>\n</ul>\n<ul>\n<li>（选项 A）剥脱性骨软骨炎的特征是骨软骨碎片从关节面分离。其下骨骼血管正常。膝痛和肿胀是该病的临床特征。髋部不受累。</li>\n<li>（选项 B）Legg-Calvé-Perthes 病（Perthes 病）是髋关节的一种暂时性疾病，特征是股骨头血供减少及随后的缺血性坏死。结果，股骨头塌陷，区域发炎和受刺激。Legg-Calvé-Perthes 病导致髋关节变得疼痛和僵硬。受影响的儿童通常在 4-10 岁之间，体格活跃且年龄偏小。</li>\n<li>（选项 C）先天性髋关节脱位在该年龄仍无症状的可能性极小。最近起病使该诊断不太可能。</li>\n<li>（选项 E）Osgood-Schlatter 病见于青春期前儿童，特征是胫骨粗隆局部疼痛，偶尔累及髌腱。该病的病理生理学是髌腱对未成熟胫骨粗隆的反复牵拉作用。查体时胫骨粗隆常有压痛。髋部活动不痛也不受限。</li>\n</ul>", "references": "<ul>\n<li>RCH - Slipped upper femoral epiphysis (SUFE)</li>\n<li>RACGP – AFP - Slipped upper femoral epiphysis in children</li>\n</ul>", "related": ["TR-SCFEs-Diagnosis", "AMC-Q0112-HSP-Nephritis"], "bodyHtml": "", "diseases": ["SCFE"], "complaints": ["limp"], "search": "amc-q0113 — scfe in a 13-year-old boy\n股骨头骨骺滑脱 (scfe)\n a 13-year-old boy presents to his general practitioner, accompanied by his mother, complaining of poorly localized pain in his knee for the past 6 weeks. his mother has observed a limp for the same period of time. he walks with his foot externally rotated. examination of the knee is normal. which one of the following is the most likely diagnosis? \n correct answer is  d  \n  所描述的临床表现以及患者的年龄提示股骨头骨骺滑脱（scfe）为最可能的诊断 。 \n scfe 更常见于 10-15 岁的青少年。典型病例是超重的青春期前男孩。该病 20% 病例为双侧。 \n scfe 表现为： \n \n 髋部活动时跛行和易激惹 \n 膝痛——由受累髋部牵涉 \n 髋屈曲时髋部外旋。行走时髋部通常处于外旋位 \n 多数活动受限，特别是内旋 \n \n  首发症状是休息后可缓解的髋部僵硬 。随后出现跛行和髋部疼痛，沿大腿前内侧放射至膝部。早期髋部检查既无疼痛也无活动受限。在更晚期，髋部活动变得疼痛，屈曲、外展和内旋减少。受累腿行走时外旋。 \n  scfe 最重要的方面是尽管经过专业治疗，仍有大量患者发生股骨头缺血性坏死 。因此，在发生严重滑脱之前诊断该病很重要。这需要早期检查和转诊。 \n  任何有跛行或膝痛的青少年都应进行双髋 x 线检查（ap 和蛙式位） 。否则，这一重要情况将被遗漏。 \n 最重要的管理原则包括： \n \n 停止负重并紧急转诊 \n 急性滑脱时，通过牵引轻柔复位比手法复位更好，可预防晚期股骨头缺血性坏死 \n 复位后进行钉内固定 \n \n \n （选项 a）剥脱性骨软骨炎的特征是骨软骨碎片从关节面分离。其下骨骼血管正常。膝痛和肿胀是该病的临床特征。髋部不受累。 \n （选项 b）legg-calvé-perthes 病（perthes 病）是髋关节的一种暂时性疾病，特征是股骨头血供减少及随后的缺血性坏死。结果，股骨头塌陷，区域发炎和受刺激。legg-calvé-perthes 病导致髋关节变得疼痛和僵硬。受影响的儿童通常在 4-10 岁之间，体格活跃且年龄偏小。 \n （选项 c）先天性髋关节脱位在该年龄仍无症状的可能性极小。最近起病使该诊断不太可能。 \n （选项 e）osgood-schlatter 病见于青春期前儿童，特征是胫骨粗隆局部疼痛，偶尔累及髌腱。该病的病理生理学是髌腱对未成熟胫骨粗隆的反复牵拉作用。查体时胫骨粗隆常有压痛。髋部活动不痛也不受限。 \n "}, {"id": "AMC-Q1496", "type": "mcq", "qid": 1496, "title": "Perthes 病 — 股骨头缺血坏死", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Orthopaedics", "approach": [], "topic": ["Perthes 病 — 连续 X 线评估进展，外展内旋受限"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Orthopaedics/AMC-Q1496-Perthes-Disease.md", "stem": "<p>Which one of the following statements is correct about Perthes disease?</p>", "options": [{"letter": "A", "text": "Hip mobility is reduced especially abduction and external rotation."}, {"letter": "B", "text": "Ultrasound is the modality of choice to make a diagnosis."}, {"letter": "C", "text": "Progress is evaluated with serial radiological examination."}, {"letter": "D", "text": "Osteotomy is the treatment of choice."}, {"letter": "E", "text": "The inflammatory markers such as WBC, ESR and CRP are usually raised."}], "rationale": "<p>1. 题型识别：定义 — Perthes 病的正确陈述 2. 核心知识：</p>\n<ul>\n<li>Perthes 病 = 股骨头近端缺血性坏死（AVN）</li>\n<li>髋关节活动受限最严重的是<strong>外展和内旋</strong>（非外旋）→ A 错</li>\n<li>影像学首选 = <strong>X 线</strong>（非超声）→ B 错</li>\n<li>治疗首选 = <strong>保守治疗</strong>（支具/夹板），截骨术为备选 → D 错</li>\n<li>炎症标志物 = <strong>通常阴性</strong>（非炎症性疾病）→ E 错</li>\n<p>3. 锁定答案：连续 X 线评估进展 → C 对</p>\n</ul>", "traps": "<ul>\n<li><strong>外展内旋 vs 外展外旋</strong>：最容易记混！Perthes 病最严重受限的是<strong>外展 + 内旋</strong>（不是外旋）</li>\n<li><strong>超声 vs X 线</strong>：Perthes 病首选 X 线诊断和评估，不是超声</li>\n<li><strong>截骨术是第一选择？</strong>：保守治疗（支具如 Scottish Rite brace）优先；截骨术不加速愈合，而是使股骨头再骨化更球形</li>\n<li><strong>炎症标志物升高？</strong>：Perthes 病非炎症性疾病 → WBC/ESR/CRP 通常阴性。若阳性需考虑化脓性关节炎/类风湿等鉴别</li>\n</ul>", "summary": "<p><strong>Legg-Calvé-Perthes 病</strong>：</p>\n<ul>\n<li>本质：股骨头近端缺血性坏死（AVN），因血供中断</li>\n<li>最严重受限：<strong>外展 + 内旋</strong>（不是外旋）</li>\n<li>影像学：<strong>X 线</strong>为首选诊断和进展评估方法</li>\n<li>5 个影像学分期：骨骺生长停止 → 软骨下骨折 → 吸收 → 再骨化 → 愈合/残留期（全程 12-40 个月）</li>\n<li>治疗：保守为主（不负重 + 支具如 Scottish Rite brace）；截骨术取决于年龄和严重程度</li>\n<li>炎症标志物：通常<strong>阴性</strong>（阳性提示替代诊断如化脓性关节炎、类风湿、滑膜炎）</li>\n<li>一旦怀疑 → 紧急转诊骨科</li>\n</ul>", "explanation": "<p>Perthes 病为股骨头近端缺血性坏死。髋关节活动受限最严重的是<strong>外展和内旋</strong>（非外旋）。影像学首选 X 线（非超声）。治疗以保守为主（不负重 + 支具外展内旋位），截骨术为备选方案。炎症标志物（WBC/ESR/CRP）通常阴性，阳性指向替代诊断。</p>", "references": "<ul>\n<li>UpToDate – Approach to hip pain in childhood</li>\n<li>Medscape - Legg-Calve-Perthes Disease</li>\n<li>RACGP – Check (Unit 493 April 2013)</li>\n<li>Murtagh's General Practice – 7th Edition – Pages 745, 746</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "perthes 病 — 股骨头缺血坏死\nperthes 病 — 连续 x 线评估进展，外展内旋受限\n which one of the following statements is correct about perthes disease? \n perthes 病为股骨头近端缺血性坏死。髋关节活动受限最严重的是 外展和内旋 （非外旋）。影像学首选 x 线（非超声）。治疗以保守为主（不负重 + 支具外展内旋位），截骨术为备选方案。炎症标志物（wbc/esr/crp）通常阴性，阳性指向替代诊断。 "}, {"id": "AMC-Q1566", "type": "mcq", "qid": 1566, "title": "生长痛 — 排除性诊断", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Orthopaedics", "approach": [], "topic": ["生长痛 — 双侧、间歇性、傍晚/夜间、正常体格检查"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Orthopaedics/AMC-Q1566-Growing-Pains.md", "stem": "<p>Caleb, 7 years old, is brought to your clinic by his mother with complaint of bilateral leg pain for the last couple of days. The pain is more prom
