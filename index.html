t of PSVTs</strong> is performing maneuvers that suppress conductivity in the <strong>atrioventricular (AV) node</strong> such as Valsalva maneuvers, immersion of the face in cold water, etc. If non-medical measures failed, preferred medical management is with <strong>intravenous adenosine (preferred) or verapamil as the first-line medications</strong>.</p>\n<ul>\n<li>(Option A) <strong>Digoxin is no more recommended</strong> for management of PSVT.</li>\n<li>(Options B and C) <strong>Quinidine and flecainide</strong> are antiarrhythmic drugs, but not used for management of PSVT.</li>\n<li>(Option E) <strong>Beta blockers</strong> such as metoprolol, propranolol and atenolol are <strong>second-line drugs</strong>.</li>\n</ul>", "references": "<ul>\n<li>AMC Handbook of Multiple Choice Questions — page 433</li>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ESC SVT 指南）</li>\n</ul>", "related": ["Topic-SVT-Management", "MOC-Cardiology", "AMC-Q0242-WPW-Pediatric-Bradycardia", "Topic-Tachyarrhythmia-Differential"], "bodyHtml": "", "diseases": ["PSVT", "VT"], "complaints": ["palpitations", "dizziness", "diaphoresis"], "search": "psvt 急性发作 — verapamil 有效\nparoxysmal supraventricular tachycardia psvt verapamil valsalva adenosine first-line\ntreatment diagnosis definition\n a 28-year-old man has had several episodes of palpitations associated with mild dizziness and sweating over the past year. these attacks occur usually after exercise and last between 10 and 20 minutes, and often stop after he immerse his face in cold water. he now presents with an attack that has been going on for 2 hours. his ecg is shown in the following picture. which one of the following medications is most likely to be effective? \n correct answer is  d  \n the rhythm strip shows  paroxysmal supraventricular tachycardia (psvt)  at a rate of almost 180 bpm. the mechanism of psvts is either a re-entry circuit or automatic focus involving the atria. \n the  best initial step in management of psvts  is performing maneuvers that suppress conductivity in the  atrioventricular (av) node  such as valsalva maneuvers, immersion of the face in cold water, etc. if non-medical measures failed, preferred medical management is with  intravenous adenosine (preferred) or verapamil as the first-line medications . \n \n (option a)  digoxin is no more recommended  for management of psvt. \n (options b and c)  quinidine and flecainide  are antiarrhythmic drugs, but not used for management of psvt. \n (option e)  beta blockers  such as metoprolol, propranolol and atenolol are  second-line drugs . \n "}, {"id": "AMC-Q0245", "type": "mcq", "qid": 245, "title": "AF + HF（非失代偿）— Metoprolol 控率 + 同时治 HF", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "complications", "prevention"], "topic": ["Atrial Fibrillation", "Heart Failure", "Rate Control", "Metoprolol", "Decompensation", "Beta Blocker Contraindication"], "difficulty": 4, "correctAnswer": "B", "page": 35, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "atrial-fibrillation", "heart-failure", "metoprolol", "beta-blocker", "approach-treatment", "approach-complications", "approach-prevention"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0245-AF-HF-Metoprolol.md", "stem": "<p>A 78-year-old man presents to your clinic with a 3-week history of palpitation. On examination, he has a blood pressure of 135/80 mmHg and heart rate of 115 bpm and irregular. ECG reveals atrial fibrillation (AF). An echocardiography is arranged that shows an ejection fraction (EF) of 38%. Which one of the following is the most appropriate treatment option for him?</p>", "options": [{"letter": "A", "text": "Electrical cardioversion"}, {"letter": "B", "text": "Metoprolol"}, {"letter": "C", "text": "Digoxin"}, {"letter": "D", "text": "Flecainide"}, {"letter": "E", "text": "Verapamil"}], "rationale": "<p>1. <strong>题型识别</strong>：AF + HF + HR 115 → 控率治疗选择 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>78 岁、AF（不规则脉 + ECG 确认）</li>\n<li>HR 115（快速心室率）</li>\n<li>EF 38% → <strong>HFrEF</strong></li>\n<li><strong>关键判断</strong>：HF 是否<strong>失代偿</strong>？病史/查体<strong>无</strong>急性失代偿证据（无端坐呼吸、肺水肿、外周水肿加重等）</li>\n<p>3. <strong>AF + HF 处理</strong>：</p>\n<li>控率 vs 节律：目前指南推荐<strong>控率优先</strong>（尤其 HF 患者）</li>\n<li>控率一线：<strong>BB</strong>（metoprolol、atenolol、carvedilol、bisoprolol）——<strong>既控率又治 HF</strong>，一举两得</li>\n<li>控率二线：BB + 地高辛</li>\n<li>控率三线：胺碘酮</li>\n<p>4. <strong>BB 禁忌（必须排除）</strong>：</p>\n<li>HR < 60</li>\n<li>症状性低血压</li>\n<li><strong>失代偿 HF</strong>（关键陷阱）</li>\n<li>周围低灌注</li>\n<li>PR > 0.24s</li>\n<li>二度 / 三度 AVB</li>\n<li>哮喘 / 反应性气道病</li>\n<li>休息时肢体缺血</li>\n<li><strong>EF 38% 单独不构成禁忌</strong>——BB 治 HFrEF 是基石</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Electrical cardioversion)：仅 4 种情况：活动缺血、器官低灌注、严重 HF 表现、预激综合征伴极快心率。本例<strong>无任何一项</strong>。</li>\n<li>B (Metoprolol)：<strong>正确</strong>（BB 控率 + 治 HF）</li>\n<li>C (Digoxin)：失代偿 HF 首选；本例<strong>非失代偿</strong> → 不用</li>\n<li>D (Flecainide)：节律控制药，可致心律失常，<strong>HF 不用</strong></li>\n<li>E (Verapamil)：非二氢吡啶 CCB，<strong>HF 避免用</strong>（负性肌力）</li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"EF 低 = 不用 BB\"陷阱</strong>：错。HFrEF（EF ≤ 40%）<strong>正是 BB 适应证</strong>。只有\"急性失代偿\"才是 BB 禁忌。</li>\n<li><strong>\"Digoxin = AF 控率一线\"陷阱</strong>：Digoxin 在 AF + 失代偿 HF 才是首选；非失代偿时 BB 优于 digoxin。</li>\n<li><strong>\"Verapamil 可控率\"陷阱</strong>：Verapamil <strong>HF 禁用</strong>（加重负性肌力）。</li>\n<li><strong>\"EF 38% 算失代偿\"陷阱</strong>：EF 38% = HFrEF，是<strong>慢性稳定</strong>的 HF。失代偿是临床状态（症状性肺水肿、外周水肿等），不是 EF 数字。</li>\n<li><strong>\"Cardioversion 急救\"陷阱</strong>：Cardioversion 是<strong>急诊</strong>处理 4 个特定情况，不是 AF 首选。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The main goals of treatment of patients with AF who also have heart failure are <strong>control of symptoms and prevention of arterial thromboembolism</strong>.</p>\n<p>Similar to the general population either <strong>rate control or rhythm control</strong> are mainstay of therapy. Previously, rhythm control was considered the superior method for treatment of AF in patients with heart failure; however, recent data has challenged this approach. Currently, <strong>rate control is the most appropriate initial management in patients with AF and symptoms related to rapid ventricular response</strong>.</p>\n<p>Based on current evidence, <strong>cardiac-selective beta blockers (metoprolol, atenolol, carvedilol, bisoprolol) are preferred options</strong> to use for rate control in patients with AF and heart failure because they are also recommended for treatment of heart failure itself.</p>\n<p><strong>NOTE</strong> — Initiation or increase of beta blocker is <strong>contraindicated in patients with decompensated heart failure</strong>. If such patients need rate, <strong>digoxin is the recommended agent</strong>.</p>\n<p><strong>This patient has both AF and heart failure; however, there is no finding in history or on examination to indicate that his heart failure is decompensated.</strong> A reduced ejection fraction of 38% alone is not a contraindication for beta blockers.</p>", "references": "<ul>\n<li>Medscape — Management of Atrial Fibrillation in Patients With Heart Failure</li>\n<li>UpToDate — The management of atrial fibrillation in patients with heart failure</li>\n<li>AHA Journals — Atrial Fibrillation and Acute Decompensated Heart Failure</li>\n<li>RACGP — Management of atrial fibrillation</li>\n</ul>", "related": ["AMC-Q0233-Decompensated-HF-ACEI", "AMC-Q0246-AF-Thyroxine-Metoprolol", "AMC-Q0234-Diastolic-HF-BB-CCB", "Topic-AF-Management", "MOC-Cardiology", "Topic-HF-With-AF"], "bodyHtml": "", "diseases": ["Heart Failure", "AF"], "complaints": ["palpitations"], "search": "af + hf（非失代偿）— metoprolol 控率 + 同时治 hf\natrial fibrillation heart failure rate control metoprolol decompensation beta blocker contraindication\ntreatment complications prevention\n a 78-year-old man presents to your clinic with a 3-week history of palpitation. on examination, he has a blood pressure of 135/80 mmhg and heart rate of 115 bpm and irregular. ecg reveals atrial fibrillation (af). an echocardiography is arranged that shows an ejection fraction (ef) of 38%. which one of the following is the most appropriate treatment option for him? \n correct answer is  b  \n the main goals of treatment of patients with af who also have heart failure are  control of symptoms and prevention of arterial thromboembolism . \n similar to the general population either  rate control or rhythm control  are mainstay of therapy. previously, rhythm control was considered the superior method for treatment of af in patients with heart failure; however, recent data has challenged this approach. currently,  rate control is the most appropriate initial management in patients with af and symptoms related to rapid ventricular response . \n based on current evidence,  cardiac-selective beta blockers (metoprolol, atenolol, carvedilol, bisoprolol) are preferred options  to use for rate control in patients with af and heart failure because they are also recommended for treatment of heart failure itself. \n  note  — initiation or increase of beta blocker is  contraindicated in patients with decompensated heart failure . if such patients need rate,  digoxin is the recommended agent . \n  this patient has both af and heart failure; however, there is no finding in history or on examination to indicate that his heart failure is decompensated.  a reduced ejection fraction of 38% alone is not a contraindication for beta blockers. "}, {"id": "AMC-Q0246", "type": "mcq", "qid": 246, "title": "AF + 甲状腺素用药 — 先控率（Metoprolol），再查 TSH", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "definition"], "topic": ["Atrial Fibrillation", "Hyperthyroidism", "Thyroxine", "Metoprolol", "Rate Control First", "TSH Workup"], "difficulty": 3, "correctAnswer": "B", "page": 37, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "atrial-fibrillation", "hyperthyroidism", "metoprolol", "approach-treatment", "approach-diagnosis", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0246-AF-Thyroxine-Metoprolol.md", "stem": "<p>A 65-year-old man presents to the emergency department with complaints of palpitation for the past 3 days which is worse today. He is on thyroxin 50 mcg for hypothyroidism. On examination, he has a blood pressure of 140/90 mmHg and an irregular pulse. An ECG is obtained and is as shown in the picture. Which one of the following would be the next step in management?</p>", "options": [{"letter": "A", "text": "Stop thyroxin"}, {"letter": "B", "text": "Start him on metoprolol"}, {"letter": "C", "text": "Arrange for measuring plasma TSH level"}, {"letter": "D", "text": "Give him intravenous atropine"}, {"letter": "E", "text": "Place a percutaneous pacemaker"}], "rationale": "<p>1. <strong>题型识别</strong>：AF 急性发作（心悸 3 天）+ 用 thyroxin → 怀疑甲亢诱发的 AF 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>65 岁男性、AF（不规则脉 + ECG）</li>\n<li>正在用 thyroxin 50 mcg</li>\n<li><strong>关键问题</strong>：thyroxin 过量可致医源性甲亢 → 诱发 AF</li>\n<p>3. <strong>AF 处理顺序</strong>：</p>\n<li><strong>第一步：控率 / 节律治疗</strong>（症状性 AF）</li>\n<li><strong>第二步</strong>：查可逆原因（TSH、ECHO、电解质、酒精等）</li>\n<li><strong>第三步</strong>：抗凝评估（>48h 或原因不明）</li>\n<p>4. <strong>选项分析</strong>：</p>\n<li>A (Stop thyroxin)：停药后<strong>数天</strong>才起效，<strong>不能立刻缓解</strong>症状</li>\n<li>B (Metoprolol)：<strong>正确</strong>——立即控制心率 + 抗交感</li>\n<li>C (TSH level)：应该查，但要<strong>先治后查</strong>（治疗不耽误查）</li>\n<li>D (Atropine)：错误——<strong>AF 是快心率</strong>，阿托品治缓</li>\n<li>E (Pacemaker)：错误——AF 不是起搏适应证</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"查因 = 第一步\"陷阱</strong>：AF 急性发作必须<strong>先稳定心率/节律</strong>，再查因。题问\"next step in management\"——是行动而非检查。</li>\n<li><strong>\"停 thyroxin 立刻好\"陷阱</strong>：thyroxin 半衰期长（T4 ~ 7 天），停药<strong>不会立即</strong>缓解。<strong>先 BB 控率最直接</strong>。</li>\n<li><strong>\"BB 治甲亢 = 禁忌\"陷阱</strong>：<strong>非选择性 BB</strong>（propranolol）反而是甲亢辅助治疗（抑制外周 T4 → T3 转换）。心脏选择性 BB（metoprolol）也安全。</li>\n<li><strong>\"AF = 起搏器\"陷阱</strong>：起搏器是<strong>缓慢性</strong>心律失常的器械治疗，AF（快心率）用不上。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The clinical findings of palpitation and irregular pulse in conjunction with ECG establish the diagnosis of <strong>atrial fibrillation (AF)</strong>.</p>\n<p>AF may be idiopathic or due to a variety of conditions, with chronic hypertension being the most common cause. <strong>Hyperthyroidism is another etiology for AF</strong>. For every patient with AF, TSH should be measured and an echocardiography performed, but <strong>these steps are considered once the patient is started on appropriate treatment</strong>. For patients with symptomatic AF, treatment either with <strong>rate control (preferred) with metoprolol or calcium channel blockers</strong> or rhythm control should be started immediately.</p>\n<p><strong>Considering anticoagulation</strong> for prevention of thromboembolic events is another important step for AF with more than 48-hour duration or of unknown duration. <strong>Investigation for reversible causes</strong> of AF is considered once the patient is given appropriate initial management.</p>\n<p>A TSH level below the normal lower limit is associated with an increased risk of AF, as is hyperthyroid state associated with excess doses of thyroxin. Even in the presence of increased levels of T4 in the plasma due to excess thyroxin, <strong>stopping the thyroxin (option A) will not lead to rapid improvement of symptoms</strong>.</p>", "references": "<ul>\n<li>RACGP — Management of atrial fibrillation</li>\n<li>Medscape — Atrial Fibrillation</li>\n<li>（待补：ATA 甲亢指南）</li>\n</ul>", "related": ["AMC-Q0245-AF-HF-Metoprolol", "AMC-Q0244-PSVT-Verapamil", "Topic-Thyrotoxic-AF", "MOC-Cardiology", "Topic-Secondary-AF"], "bodyHtml": "", "diseases": ["AF"], "complaints": ["palpitations"], "search": "af + 甲状腺素用药 — 先控率（metoprolol），再查 tsh\natrial fibrillation hyperthyroidism thyroxine metoprolol rate control first tsh workup\ntreatment diagnosis definition\n a 65-year-old man presents to the emergency department with complaints of palpitation for the past 3 days which is worse today. he is on thyroxin 50 mcg for hypothyroidism. on examination, he has a blood pressure of 140/90 mmhg and an irregular pulse. an ecg is obtained and is as shown in the picture. which one of the following would be the next step in management? \n correct answer is  b  \n the clinical findings of palpitation and irregular pulse in conjunction with ecg establish the diagnosis of  atrial fibrillation (af) . \n af may be idiopathic or due to a variety of conditions, with chronic hypertension being the most common cause.  hyperthyroidism is another etiology for af . for every patient with af, tsh should be measured and an echocardiography performed, but  these steps are considered once the patient is started on appropriate treatment . for patients with symptomatic af, treatment either with  rate control (preferred) with metoprolol or calcium channel blockers  or rhythm control should be started immediately. \n  considering anticoagulation  for prevention of thromboembolic events is another important step for af with more than 48-hour duration or of unknown duration.  investigation for reversible causes  of af is considered once the patient is given appropriate initial management. \n a tsh level below the normal lower limit is associated with an increased risk of af, as is hyperthyroid state associated with excess doses of thyroxin. even in the presence of increased levels of t4 in the plasma due to excess thyroxin,  stopping the thyroxin (option a) will not lead to rapid improvement of symptoms . "}, {"id": "AMC-Q0248", "type": "mcq", "qid": 248, "title": "AS 患者晕厥 — 不能只归因于 AS，要 ECG + 监测找心律失常", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis", "complications"], "topic": ["Syncope", "Aortic Stenosis", "ECG", "Cardiac Monitoring", "Arrhythmia", "Don't Anchor on AS"], "difficulty": 3, "correctAnswer": "B", "page": 38, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "syncope", "aortic-stenosis", "ecg", "monitoring", "approach-investigation", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0248-AS-Syncope-Monitoring.md", "stem": "<p>A 69-year-old man just had a syncopal episode in the background history of aortic valve stenosis. He is now in the Emergency Department. Which one of the following is the most immediate management?</p>", "options": [{"letter": "A", "text": "Electrocardiography"}, {"letter": "B", "text": "Electrocardiography and cardiac monitoring"}, {"letter": "C", "text": "Chest X-ray"}, {"letter": "D", "text": "Emergency echocardiography"}, {"letter": "E", "text": "Stress test"}], "rationale": "<p>1. <strong>题型识别</strong>：老年 + 已知 AS + 晕厥 → 不能直接归因于 AS 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>69 岁、AS 病史</li>\n<li><strong>晕厥</strong>（一过性意识丧失）</li>\n<p>3. <strong>AS 致晕厥机制</strong>：</p>\n<li>AS = 固定梗阻 → 活动时心输出量不能相应增加 → 脑供血不足 → 晕厥</li>\n<li>但<strong>老年 + 心脏基础病</strong> = 心律失常（VT、VF、完全性 AVB）高风险</li>\n<p>4. <strong>晕厥处理思路</strong>：</p>\n<li><strong>不能锚定一个诊断</strong>（anchoring bias）</li>\n<li>即使有 AS 病史，仍要<strong>查心律失常</strong></li>\n<li>单 ECG：<strong>可能漏掉</strong>一过性心律失常（如间歇性 AVB、NSVT）</li>\n<li><strong>ECG + 持续监测</strong>：捕捉一过性事件</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (ECG alone)：不够——可能漏掉发作性心律失常</li>\n<li>B (ECG + monitoring)：<strong>正确</strong></li>\n<li>C (CXR)：对结构性心脏病诊断有限，<strong>不揭示心律失常</strong></li>\n<li>D (Emergency ECHO)：AS 诊断已明确；ECHO 看结构、不看节律；非紧急</li>\n<li>E (Stress test)：AS 患者可诱发心肌缺血，<strong>危险</strong></li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"已知 AS = 晕厥原因明确\"陷阱</strong>：anchoring bias。<strong>心律失常仍是首要排除项</strong>。</li>\n<li><strong>\"ECG = 查心律失常的终极手段\"陷阱</strong>：<strong>单次 ECG 阴性不代表没心律失常</strong>。间歇性 AVB、NSVT、pause 只有监测能抓到。</li>\n<li><strong>\"ECHO 紧急 = 必做\"陷阱</strong>：ECHO 评估<strong>结构</strong>，不评估<strong>节律</strong>。已诊断 AS 的患者做 ECHO 不揭示晕厥原因。</li>\n<li><strong>\"Stress test 查晕厥\"陷阱</strong>：Stress test 查<strong>诱发缺血</strong>，对 AS 患者<strong>危险</strong>（可致恶性心律失常）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>Every patient over the age of 65 with an underlying cardiac disease is at risk of developing fatal arrhythmias such as complete heart block, ventricular tachyarrhythmias, etc. <strong>Although aortic stenosis is frequently associated with episodes of loss of consciousness and falls due to decreased perfusion on activity, the patient's condition should not be merely attributed to this pathophysiology.</strong> An ECG should be obtained and the patient placed on cardiac monitoring for detection of potential arrhythmias that might have not been present when the ECG was taken.</p>\n<ul>\n<li>(Option A) <strong>ECG alone may miss the causative arrhythmia</strong> if it is transient.</li>\n<li>(Option C) Chest X-ray is not useful in detecting physiologic or structural heart anomalies.</li>\n<li>(Option D) Echocardiography may be considered later for additional pieces of information but not urgently. <strong>It has no role in detecting an arrhythmia</strong>.</li>\n<li>(Option E) Stress test is not helpful for detection of an arrhythmia. <strong>It can cause myocardial ischemia in this patient due to aortic stenosis</strong>.</li>\n</ul>", "references": "<ul>\n<li>RACGP — Dizziness and loss of consciousness</li>\n<li>Medscape — Syncope</li>\n<li>（待补：ESC 晕厥指南 2018）</li>\n</ul>", "related": ["AMC-Q0239-Aortic-Stenosis-Cardiac-Output", "AMC-Q0241-Third-Degree-AVB-Pacing", "Topic-Syncope-Workup", "MOC-Cardiology", "Topic-Cardiac-Syncope"], "bodyHtml": "", "diseases": ["Aortic Stenosis", "Syncope"], "complaints": [], "search": "as 患者晕厥 — 不能只归因于 as，要 ecg + 监测找心律失常\nsyncope aortic stenosis ecg cardiac monitoring arrhythmia don't anchor on as\ninvestigation diagnosis complications\n a 69-year-old man just had a syncopal episode in the background history of aortic valve stenosis. he is now in the emergency department. which one of the following is the most immediate management? \n correct answer is  b  \n every patient over the age of 65 with an underlying cardiac disease is at risk of developing fatal arrhythmias such as complete heart block, ventricular tachyarrhythmias, etc.  although aortic stenosis is frequently associated with episodes of loss of consciousness and falls due to decreased perfusion on activity, the patient's condition should not be merely attributed to this pathophysiology.  an ecg should be obtained and the patient placed on cardiac monitoring for detection of potential arrhythmias that might have not been present when the ecg was taken. \n \n (option a)  ecg alone may miss the causative arrhythmia  if it is transient. \n (option c) chest x-ray is not useful in detecting physiologic or structural heart anomalies. \n (option d) echocardiography may be considered later for additional pieces of information but not urgently.  it has no role in detecting an arrhythmia . \n (option e) stress test is not helpful for detection of an arrhythmia.  it can cause myocardial ischemia in this patient due to aortic stenosis . \n "}, {"id": "AMC-Q0249", "type": "mcq", "qid": 249, "title": "NSTEMI 后 24h — 最危险的心律失常是 VT", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "complications", "physical-exam"], "topic": ["NSTEMI", "Ventricular Tachycardia", "Post-MI Arrhythmia", "Biventricular Failure", "Rhythm Recognition"], "difficulty": 3, "correctAnswer": "A", "page": 39, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "nstemi", "vt", "ventricular-tachycardia", "post-mi", "approach-diagnosis", "approach-complications", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0249-Post-NSTEMI-VT.md", "stem": "<p>A 62-year-old woman is seen in the ward 24 hours after a non-ST segment elevation myocardial infarction (NSTEMI). She complains of light-headedness. The radial pulse is difficult to feel, blood pressure is 90/60 mmHg, heart sounds are muffled, and there is evidence of biventricular cardiac failure. Which one of the following rhythm strips would be of most concern in this situation?</p>\n<ul>\n<li>A.</li>\n<li>B.</li>\n<li>C.</li>\n<li>D.</li>\n<li>E.</li>\n</ul>", "options": [], "rationale": "<p>1. <strong>题型识别</strong>：MI 后早期心律失常识别（读图题，选项是 5 个 rhythm strips） 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>62 岁女性、NSTEMI 后 <strong>24 小时</strong>（关键时间窗）</li>\n<li>主诉：头晕</li>\n<li>查体：脉弱、BP 90/60（休克倾向）、<strong>心音低钝</strong>（提示心包积液？or 心输出量低）、<strong>双心衰</strong></li>\n<p>3. <strong>MI 后 24 h 心律失常谱</strong>：</p>\n<li><strong>VT</strong>（室性心动过速）= MI 后 24h <strong>最常见</strong>心律失常</li>\n<li><strong>VF</strong>（室颤）= 致死性，但<strong>会立即意识丧失</strong>——本例\"complains of light-headedness\"（还能说话）→ 排除 VF</li>\n<li>心房颤动、加速性室性自主心律等</li>\n<p>4. <strong>关键鉴别</strong>：</p>\n<li><strong>VT</strong> → 有脉搏（弱）、能说话（虽头晕）→ 符合本例</li>\n<li><strong>VF</strong> → 无脉搏、<strong>无意识</strong> → 不符</li>\n<li><strong>Asystole / 心脏停搏</strong> → 死亡 → 不符</li>\n<p>5. <strong>临床背景解读</strong>：</p>\n<li>心音低钝：可能心包积液（Dressler 综合征极早期？）or 心输出量极低</li>\n<li>双心衰 + 休克：<strong>泵衰竭 + 心律失常</strong>的混合</li>\n<p>6. <strong>选项识别</strong>：A 是 VT（宽 QRS 心动过速、有 P 波分离） 7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"MI 后 24h = VF 最危险\"陷阱</strong>：VF 是<strong>最致命</strong>的，但<strong>VT 是最常见</strong>的。题问\"of most concern\"指临床危险度（结合病人还能说话），<strong>VT 是要立即处理的危险心律失常</strong>。</li>\n<li><strong>\"VF = 无脉\"陷阱</strong>：VF <strong>一定</strong>无意识。病人在 complain（还能主诉）→ 不是 VF。</li>\n<li><strong>\"心音低钝 = 心包填塞\"陷阱</strong>：可能是心包积液，也可能是心输出量极低（VT 致休克时心音也低钝）。关键看<strong>节律</strong>。</li>\n<li><strong>\"NSTEMI ≠ 室性心律失常\"陷阱</strong>：错。<strong>NSTEMI 也可致 VT/VF</strong>，只是没有 ST 抬高。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>The clinical picture of <strong>weak pulses, tachycardia and lightheadedness</strong> are suggestive of a <strong>tachyarrhythmia of ventricular origin</strong>, i.e. <strong>ventricular tachycardia (VT) or ventricular fibrillation (VF)</strong>. The latter is always associated with <strong>loss of consciousness</strong>; therefore, cannot be considered in this woman.</p>\n<p>The only rhythm strip consistent with the clinical picture is <strong>option A, which shows VT</strong>. <strong>VT is the most common arrhythmia occurring after myocardial infarction (MI)</strong>. They are in particular common in the first 24 hours post-MI.</p>\n<p><strong>Key teaching points</strong>:</p>\n<ul>\n<li>VT is the <strong>most common post-MI arrhythmia</strong> (especially in first 24 h)</li>\n<li>VF is the most <strong>lethal</strong>, but VF patients are pulseless and unconscious</li>\n<li>Distinguish by <strong>clinical + ECG</strong>: weak pulse + can speak = VT (not VF)</li>\n</ul>", "references": "<ul>\n<li>ACC/AHA/ESC Practice Guidelines</li>\n<li>Medscape — Ventricular Tachycardia</li>\n<li>（待补：AHA STEMI/NSTEMI 指南 心律失常章节）</li>\n</ul>", "related": ["AMC-Q0230-STEMI-Prehospital-Mortality", "AMC-Q0223-Unstable-VT-Cardioversion", "AMC-Q0244-PSVT-Verapamil", "MOC-Cardiology", "Topic-Post-MI-Arrhythmia"], "bodyHtml": "", "diseases": ["NSTEMI", "STEMI", "VT"], "complaints": ["dizziness"], "search": "nstemi 后 24h — 最危险的心律失常是 vt\nnstemi ventricular tachycardia post-mi arrhythmia biventricular failure rhythm recognition\ndiagnosis complications physical-exam\n a 62-year-old woman is seen in the ward 24 hours after a non-st segment elevation myocardial infarction (nstemi). she complains of light-headedness. the radial pulse is difficult to feel, blood pressure is 90/60 mmhg, heart sounds are muffled, and there is evidence of biventricular cardiac failure. which one of the following rhythm strips would be of most concern in this situation? \n \n a. \n b. \n c. \n d. \n e. \n \n correct answer is  a  \n the clinical picture of  weak pulses, tachycardia and lightheadedness  are suggestive of a  tachyarrhythmia of ventricular origin , i.e.  ventricular tachycardia (vt) or ventricular fibrillation (vf) . the latter is always associated with  loss of consciousness ; therefore, cannot be considered in this woman. \n the only rhythm strip consistent with the clinical picture is  option a, which shows vt .  vt is the most common arrhythmia occurring after myocardial infarction (mi) . they are in particular common in the first 24 hours post-mi. \n  key teaching points : \n \n vt is the  most common post-mi arrhythmia  (especially in first 24 h) \n vf is the most  lethal , but vf patients are pulseless and unconscious \n distinguish by  clinical + ecg : weak pulse + can speak = vt (not vf) \n "}, {"id": "AMC-Q0250", "type": "mcq", "qid": 250, "title": "QT 延长的 NOT-cause — 高钙血症（反而 QT 缩短）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "differential", "complications"], "topic": ["QT Prolongation", "Long QT Syndrome", "Acquired", "Hypercalcemia", "Drug-induced", "Electrolyte"], "difficulty": 3, "correctAnswer": "B", "page": 41, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "qt-prolongation", "torsades", "electrolytes", "approach-definition", "approach-differential", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0250-QT-Prolongation-Hypercalcemia.md", "stem": "<p>Which one of the following is not associated with prolongation of QT interval?</p>", "options": [{"letter": "A", "text": "Hypothyroidism"}, {"letter": "B", "text": "Hypercalcemia"}, {"letter": "C", "text": "Haloperidol"}, {"letter": "D", "text": "Sotalol"}, {"letter": "E", "text": "Methadone"}], "rationale": "<p>1. <strong>题型识别</strong>：长 QT 综合征的<strong>反向题</strong>（找 NOT）。 2. <strong>长 QT 三大类原因</strong>：</p>\n<ul>\n<li><strong>遗传性</strong>（罕见）：Romano-Ward、Jervell-Lange-Nielsen</li>\n<li><strong>电解质 / 代谢</strong>：低<strong>钙</strong>、低钾、低镁</li>\n<li><strong>药物</strong>：抗心律失常、抗生素、抗精神病、阿片类</li>\n<p>3. <strong>关键反向</strong>：</p>\n<li>钙与 QT 是<strong>反向</strong>关系</li>\n<li><strong>高钙 = QT 短</strong>（<strong>不</strong>延长）← 这就是 NOT</li>\n<li><strong>低钙 = QT 延长</strong>（会延长）</li>\n<p>4. <strong>选项逐一分析</strong>：</p>\n<li>A (Hypothyroidism)：<strong>延长</strong> QT（甲减本身 + 影响电解质）</li>\n<li>B (Hypercalcemia)：<strong>缩短</strong> QT → <strong>NOT</strong></li>\n<li>C (Haloperidol)：<strong>延长</strong> QT（典型抗精神病致 TdP）</li>\n<li>D (Sotalol)：<strong>延长</strong> QT（III 类抗心律失常 + K 通道阻滞）</li>\n<li>E (Methadone)：<strong>延长</strong> QT（阿片类致 TdP）</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"低钙 = QT 短\"陷阱</strong>：记反了。<strong>低钙延长 QT</strong>（与 K、Mg 类似）。</li>\n<li><strong>\"高钙 = QT 延长\"陷阱</strong>：同上记反。<strong>高钙缩短 QT</strong>。</li>\n<li><strong>\"Haloperidol 治精神分裂不涉及心\"陷阱</strong>：所有抗精神病都有 QT 风险。</li>\n<li><strong>\"Methadone 镇痛不涉及心\"陷阱</strong>：阿片类中 methadone 是 QT 延长最显著的（levomethadyl 也是）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>The following is a list of conditions that can cause QT prolongation</strong>:</p>\n<ul>\n<li><strong>Hereditary syndromes</strong> (rare)</li>\n<li><strong>Electrolyte / metabolic abnormalities</strong>: hypocalcemia, hypokalemia, hypomagnesemia</li>\n<li><strong>Intrinsic cardiac disease</strong></li>\n<li><strong>Medications</strong>:</li>\n<li><strong>Antiarrhythmics</strong>: amiodarone, disopyramide, dofetilide, ibutilide, procainamide, quinidine, sotalol</li>\n<li><strong>Antihistamines</strong>: astemizole, terfenadine</li>\n<li><strong>Antibiotics</strong>: clarithromycin, erythromycin, pentamidine, sparfloxacin</li>\n<li><strong>Anti-malarials</strong>: chloroquine, halofantrine</li>\n<li><strong>Anti-psychotics</strong>: chlorpromazine, haloperidol, mesoridazine, pimozide, thioridazine</li>\n<li><strong>GI drugs</strong>: cisapride, domperidone</li>\n<li><strong>Opiate agonists</strong>: methadone, levomethadyl</li>\n<li><strong>Other</strong>: arsenic trioxide, bepridil, droperidol, probucol</li>\n<li><strong>CNS disorders</strong>, <strong>systemic illnesses</strong>, <strong>MI</strong></li>\n</ul>\n<p><strong>Hypercalcemia is associated with shortening of QT interval and does not cause QT interval prolongation.</strong></p>", "references": "<ul>\n<li>UpToDate — Acquired long QT syndrome</li>\n<li>（待补：AHA/ACC 2010 Inpatient ECG 监测指南）</li>\n</ul>", "related": ["AMC-Q0241-Third-Degree-AVB-Pacing", "AMC-Q0244-PSVT-Verapamil", "MOC-Cardiology", "Topic-Drug-Induced-Long-QT"], "bodyHtml": "", "diseases": ["QT Prolongation"], "complaints": [], "search": "qt 延长的 not-cause — 高钙血症（反而 qt 缩短）\nqt prolongation long qt syndrome acquired hypercalcemia drug-induced electrolyte\ndefinition differential complications\n which one of the following is not associated with prolongation of qt interval? \n correct answer is  b  \n  the following is a list of conditions that can cause qt prolongation : \n \n  hereditary syndromes  (rare) \n  electrolyte / metabolic abnormalities : hypocalcemia, hypokalemia, hypomagnesemia \n  intrinsic cardiac disease  \n  medications : \n  antiarrhythmics : amiodarone, disopyramide, dofetilide, ibutilide, procainamide, quinidine, sotalol \n  antihistamines : astemizole, terfenadine \n  antibiotics : clarithromycin, erythromycin, pentamidine, sparfloxacin \n  anti-malarials : chloroquine, halofantrine \n  anti-psychotics : chlorpromazine, haloperidol, mesoridazine, pimozide, thioridazine \n  gi drugs : cisapride, domperidone \n  opiate agonists : methadone, levomethadyl \n  other : arsenic trioxide, bepridil, droperidol, probucol \n  cns disorders ,  systemic illnesses ,  mi  \n \n  hypercalcemia is associated with shortening of qt interval and does not cause qt interval prolongation.  "}, {"id": "AMC-Q0252", "type": "mcq", "qid": 252, "title": "疑似 AAA — 床旁超声是诊断第一步", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis", "physical-exam"], "topic": ["Abdominal Aortic Aneurysm", "AAA", "Diagnosis", "Bedside Ultrasonography", "Pulsatile Mass", "Bruit"], "difficulty": 3, "correctAnswer": "B", "page": 42, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "aortic-aneurysm", "ultrasound", "approach-investigation", "approach-diagnosis", "approach-physical-exam"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0252-AAA-Bedside-Ultrasound.md", "stem": "<p>A 60-year-old man presents to the Emergency Department with complaint of vague abdominal pain. On examination, there is mild abdominal tenderness in the epigastric area with a vaguely palpated abdominal mass. On auscultation, a bruit is heard over the mass. Which one of the following is the next step in management?</p>", "options": [{"letter": "A", "text": "Aortogram"}, {"letter": "B", "text": "Emergency bedside ultrasonography"}, {"letter": "C", "text": "Non-contrast abdominal CT scan"}, {"letter": "D", "text": "Erect and supine abdominal X-rays"}, {"letter": "E", "text": "Immediate transfer of the patient to the operating room"}], "rationale": "<p>1. <strong>题型识别</strong>：老年 + 腹部搏动性包块 + 血管杂音 + 上腹痛 → <strong>高度怀疑 AAA</strong> 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>60 岁男性（AAA 危险人群）</li>\n<li>上腹部轻压痛</li>\n<li><strong>可触及腹部包块</strong> + <strong>杂音</strong>（血管杂音 = 动脉病变）</li>\n<p>3. <strong>AAA 诊断路径</strong>：</p>\n<li>体格检查：<strong>敏感性中等</strong>（肥胖者/小 AAA 漏诊）</li>\n<li><strong>床旁 USG</strong>：高敏感度（~100%）、无创、快速 → <strong>首选</strong></li>\n<li>CT 血管造影（CTA）：诊断+术前规划</li>\n<li><strong>非增强 CT / X-ray</strong>：对 AAA 诊断<strong>无用</strong></li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Aortogram)：有创、术中用，<strong>不</strong>是初始诊断</li>\n<li>B (Bedside USG)：<strong>正确</strong></li>\n<li>C (Non-contrast CT)：<strong>不能</strong>诊断 AAA</li>\n<li>D (X-rays)：<strong>不能</strong>诊断 AAA</li>\n<li>E (OT)：未确诊，不能直接开刀</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"CTA 准确 = 首选\"陷阱</strong>：CTA 是 AAA 诊断金标准，但<strong>急诊</strong>首选是床旁 USG（更快、可在床旁做）。CTA 用于术前规划。</li>\n<li><strong>\"Non-contrast CT 也能看\"陷阱</strong>：<strong>非增强</strong> CT 看不出血管结构，对 AAA 没用。<strong>增强 CTA</strong> 才行。</li>\n<li><strong>\"X-ray 看动脉瘤\"陷阱</strong>：X-ray 看钙化影<strong>偶尔</strong>显示 AAA 轮廓，但<strong>诊断 AAA 不可靠</strong>。</li>\n<li><strong>\"Aortogram 是诊断金标准\"陷阱</strong>：传统 DSA 确实是金标准，但<strong>有创</strong>，不作为初筛首选。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The findings are consistent with provisional diagnosis of <strong>abdominal aortic aneurysm (AAA)</strong>. Physical examination is only moderately sensitive for diagnosis; therefore, a <strong>bedside ultrasonography for confirming the diagnosis of AAA</strong> is the next best step in management. <strong>Ultrasonography is the preferred diagnostic method for AAAs with high accuracy</strong>.</p>\n<ul>\n<li><strong>Spiral CT scan</strong> gives visualization of the aneurysm and surrounding structures. It is only indicated <strong>prior to elective surgical repair</strong>. It is never used to make a diagnosis of AAA.</li>\n<li><strong>CT angiography</strong> with IV contrast can be used for assessment, but <strong>non-contrast CT and abdominal X-rays are of no use to diagnose AAA</strong>.</li>\n</ul>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：AHA/ACC 腹主动脉瘤指南）</li>\n</ul>", "related": ["AMC-Q0254-AAA-Surveillance-Ultrasound", "AMC-Q0259-Ruptured-AAA-Bedside-USG", "MOC-Cardiology", "Topic-AAA-Diagnosis-Mgmt"], "bodyHtml": "", "diseases": ["AAA"], "complaints": ["abdominal pain"], "search": "疑似 aaa — 床旁超声是诊断第一步\nabdominal aortic aneurysm aaa diagnosis bedside ultrasonography pulsatile mass bruit\ninvestigation diagnosis physical-exam\n a 60-year-old man presents to the emergency department with complaint of vague abdominal pain. on examination, there is mild abdominal tenderness in the epigastric area with a vaguely palpated abdominal mass. on auscultation, a bruit is heard over the mass. which one of the following is the next step in management? \n correct answer is  b  \n the findings are consistent with provisional diagnosis of  abdominal aortic aneurysm (aaa) . physical examination is only moderately sensitive for diagnosis; therefore, a  bedside ultrasonography for confirming the diagnosis of aaa  is the next best step in management.  ultrasonography is the preferred diagnostic method for aaas with high accuracy . \n \n  spiral ct scan  gives visualization of the aneurysm and surrounding structures. it is only indicated  prior to elective surgical repair . it is never used to make a diagnosis of aaa. \n  ct angiography  with iv contrast can be used for assessment, but  non-contrast ct and abdominal x-rays are of no use to diagnose aaa . \n "}, {"id": "AMC-Q0254", "type": "mcq", "qid": 254, "title": "4.2 cm AAA 监测 — USG 最佳（CT 仅用于术前规划）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "treatment", "definition"], "topic": ["AAA", "Surveillance", "Monitoring", "Ultrasound vs CT Angiography", "Size Threshold"], "difficulty": 2, "correctAnswer": "C", "page": 43, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "surveillance", "ultrasound", "approach-investigation", "approach-treatment", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0254-AAA-Surveillance-Ultrasound.md", "stem": "<p>A 55-year-old man with history of smoking and hypertension has been diagnosed with a 4.2 cm abdominal aortic aneurysm (AAA). Which one of the following is the investigation of choice for monitoring and surveillance of his AAA?</p>", "options": [{"letter": "A", "text": "MRI angiography"}, {"letter": "B", "text": "CT angiography"}, {"letter": "C", "text": "Ultrasonography"}, {"letter": "D", "text": "Digital subtraction angiography"}, {"letter": "E", "text": "Non-contrast abdominal CT scan"}], "rationale": "<p>1. <strong>题型识别</strong>：已知 4.2 cm AAA → 选监测方法 2. <strong>AAA 监测方式对比</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>方式</th><th>适用</th></tr></thead>\n<tbody>\n<tr><td><strong>Ultrasonography</strong></td><td><strong>首选</strong>（筛查+监测）：无创、便宜、敏感度 ~100%</td></tr>\n<tr><td>CT angiography</td><td>术前规划</td></tr>\n<tr><td>MRI angiography</td><td>CT 替代（肾功能不全/造影剂过敏）</td></tr>\n<tr><td>DSA</td><td>治疗中（同步介入）</td></tr>\n<tr><td>Non-contrast CT</td><td><strong>无用</strong>（看不清血管）</td></tr>\n</tbody>\n</table>\n<p>3. <strong>关键判断</strong>：</p>\n<ul>\n<li>4.2 cm AAA <strong>无症状</strong> → 不需手术 → 监测</li>\n<li>监测方式 = <strong>USG</strong>（无创、可重复、准确）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (MRA)：可用但贵，<strong>非首选</strong></li>\n<li>B (CTA)：仅术前</li>\n<li>C (USG)：<strong>正确</strong></li>\n<li>D (DSA)：有创，不用于监测</li>\n<li>E (Non-contrast CT)：<strong>对 AAA 诊断无用</strong></li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"CTA 准确 = 监测首选\"陷阱</strong>：CTA 是术前规划工具，<strong>不是</strong>监测工具（贵 + 辐射 + 造影剂）。</li>\n<li><strong>\"MRI 比 CT 好\"陷阱</strong>：MRI 不比 CT 适合 AAA 监测（贵、慢、不普及）。</li>\n<li><strong>\"DSA 金标准 = 监测\"陷阱</strong>：DSA 是治疗性造影（介入时用），<strong>不</strong>是监测工具。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Ultrasonography is the most accurate and the best investigation</strong> for diagnosing, screening, and surveillance of aortic abdominal aneurysms. Ultrasonography is a noninvasive and readily available test with approximately <strong>100% sensitivity and specificity</strong>.</p>\n<p><strong>CT angiography is performed if elective surgical correction is planned, once the diagnosis is made by ultrasonography.</strong></p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：USPSTF AAA 筛查建议）</li>\n</ul>", "related": ["AMC-Q0252-AAA-Bedside-Ultrasound", "AMC-Q0256-AAA-3-8cm-24mo", "AMC-Q0258-AAA-Repair-Indication", "MOC-Cardiology"], "bodyHtml": "", "diseases": ["AAA"], "complaints": [], "search": "4.2 cm aaa 监测 — usg 最佳（ct 仅用于术前规划）\naaa surveillance monitoring ultrasound vs ct angiography size threshold\ninvestigation treatment definition\n a 55-year-old man with history of smoking and hypertension has been diagnosed with a 4.2 cm abdominal aortic aneurysm (aaa). which one of the following is the investigation of choice for monitoring and surveillance of his aaa? \n correct answer is  c  \n  ultrasonography is the most accurate and the best investigation  for diagnosing, screening, and surveillance of aortic abdominal aneurysms. ultrasonography is a noninvasive and readily available test with approximately  100% sensitivity and specificity . \n  ct angiography is performed if elective surgical correction is planned, once the diagnosis is made by ultrasonography.  "}, {"id": "AMC-Q0255", "type": "mcq", "qid": 255, "title": "AAA 家族史 — 需 USG 筛查（不是安慰）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "prevention", "definition"], "topic": ["AAA Screening", "Family History", "First-Degree Relative", "Risk", "Ultrasound"], "difficulty": 2, "correctAnswer": "B", "page": 44, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "screening", "family-history", "approach-investigation", "approach-prevention", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0255-AAA-Family-Screening.md", "stem": "<p>A 55-year-old man presents with concerns about developing abdominal aortic aneurysm (AAA), as his father was diagnosed with the same disease at the age of 57 years. He has smoked 20 cigarettes a day for the past 15 years. On examination, he has a blood pressure of 130/75 mmHg. Which one of the following is the best advice to give?</p>", "options": [{"letter": "A", "text": "Reassure as AAA has no genetic predisposition"}, {"letter": "B", "text": "Arrange for regular screening with ultrasonography"}, {"letter": "C", "text": "Order a CT angiogram"}, {"letter": "D", "text": "Start him on aspirin"}, {"letter": "E", "text": "Start him on anti-hypertensive medications"}], "rationale": "<p>1. <strong>题型识别</strong>：AAA 危险因素 + 家族史 → 筛查决策 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>55 岁男性（年龄 + 性别都是 AAA 风险）</li>\n<li>父亲 57 岁 AAA（一级亲属）</li>\n<li>吸烟 20 支/天 × 15 年（<strong>最强可改变风险</strong>）</li>\n<li>血压 130/75（正常）</li>\n<p>3. <strong>AAA 危险因素</strong>：</p>\n<li><strong>年龄</strong>（最强）> 65</li>\n<li>男性</li>\n<li><strong>家族史</strong>（一级亲属 +20%）</li>\n<li><strong>吸烟</strong>（最强可改变）</li>\n<li>高胆固醇</li>\n<li>糖尿病</li>\n<li>慢性高血压</li>\n<p>4. <strong>筛查原则</strong>：</p>\n<li>有家族史 / 吸烟者 → 提前筛查</li>\n<li><strong>USG 筛查</strong>（敏感度 ~100%）</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Reassurance)：错！AAA <strong>有遗传倾向</strong></li>\n<li>B (Regular USG screening)：<strong>正确</strong></li>\n<li>C (CTA)：<strong>不</strong>用于筛查（贵、辐射、造影剂）</li>\n<li>D (Aspirin)：<strong>不</strong>预防 AAA</li>\n<li>E (Anti-HTN)：<strong>血压正常</strong>（130/75 mmHg），不需治疗</li>\n<p>6. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"AAA = 无遗传\"陷阱</strong>：错。AAA 有<strong>家族聚集性</strong>（一级亲属 +20%）。</li>\n<li><strong>\"Aspirin 防血管病\"陷阱</strong>：Aspirin 防<strong>动脉粥样硬化事件</strong>（MI、卒中），<strong>不</strong>直接预防 AAA。</li>\n<li><strong>\"CTA 是筛查\"陷阱</strong>：CTA 不筛查（贵、辐射、造影剂），<strong>USG</strong> 才是。</li>\n<li><strong>\"血压 130/75 = 正常\"陷阱</strong>：本例<strong>不需要</strong>降压治疗（< 140/90），抗高血压药<strong>无预防 AAA 的指征</strong>。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Patients with a first-degree relative with abdominal aortic aneurysm (AAA) have a 20% increased risk of developing AAA</strong> compared to normal population; for this reason, he needs to be screened for AAA. Screening is performed with <strong>ultrasonography</strong> as the best investigation with very high index of sensitivity and specificity.</p>\n<p><strong>NOTE</strong> — Advancing age is the most common risk factor for AAA. Other risk factors include <strong>male gender, family history, smoking, hypercholesterolemia, diabetes mellitus, and chronic hypertension</strong>.</p>\n<ul>\n<li>(Option A) Reassurance is inappropriate because he has <strong>increased risk of AAA due to the family history</strong>.</li>\n<li>(Option C) CT angiogram is indicated once the surgical repair is planned.</li>\n<li>(Option D) Aspirin is used neither for prophylaxis, nor treatment of AAA.</li>\n<li>(Option E) Anti-hypertensive medications are of no benefit because the patient is normotensive.</li>\n</ul>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：USPSTF AAA 筛查建议 2019）</li>\n</ul>", "related": ["AMC-Q0252-AAA-Bedside-Ultrasound", "AMC-Q0254-AAA-Surveillance-Ultrasound", "MOC-Cardiology", "Topic-AAA-Screening"], "bodyHtml": "", "diseases": ["AAA", "AV Block (1°)"], "complaints": [], "search": "aaa 家族史 — 需 usg 筛查（不是安慰）\naaa screening family history first-degree relative risk ultrasound\ninvestigation prevention definition\n a 55-year-old man presents with concerns about developing abdominal aortic aneurysm (aaa), as his father was diagnosed with the same disease at the age of 57 years. he has smoked 20 cigarettes a day for the past 15 years. on examination, he has a blood pressure of 130/75 mmhg. which one of the following is the best advice to give? \n correct answer is  b  \n  patients with a first-degree relative with abdominal aortic aneurysm (aaa) have a 20% increased risk of developing aaa  compared to normal population; for this reason, he needs to be screened for aaa. screening is performed with  ultrasonography  as the best investigation with very high index of sensitivity and specificity. \n  note  — advancing age is the most common risk factor for aaa. other risk factors include  male gender, family history, smoking, hypercholesterolemia, diabetes mellitus, and chronic hypertension . \n \n (option a) reassurance is inappropriate because he has  increased risk of aaa due to the family history . \n (option c) ct angiogram is indicated once the surgical repair is planned. \n (option d) aspirin is used neither for prophylaxis, nor treatment of aaa. \n (option e) anti-hypertensive medications are of no benefit because the patient is normotensive. \n "}, {"id": "AMC-Q0256", "type": "mcq", "qid": 256, "title": "3.8 cm AAA — USG 每 24 月监测", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "definition", "treatment"], "topic": ["AAA Surveillance Interval", "Size-based", "3.8 cm", "Ultrasound", "24 months"], "difficulty": 2, "correctAnswer": "C", "page": 45, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "surveillance", "interval", "approach-investigation", "approach-definition", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0256-AAA-3-8cm-24mo.md", "stem": "<p>A 65-year-old man presents with history of two episodes of abdominal pain after meals. As a part of workup plan, an abdominal ultrasonography is performed, which showed gallstones in the gallbladder and a 3.8 cm abdominal aortic aneurysm (AAA). Which one of the following is the recommended management of this asymptomatic AAA?</p>", "options": [{"letter": "A", "text": "Ultrasonography every 12 months"}, {"letter": "B", "text": "CT scan every 12 months"}, {"letter": "C", "text": "Ultrasonography every 24 months"}, {"letter": "D", "text": "CT scan every 24 months"}, {"letter": "E", "text": "CT scan or ultrasonography every 12 months"}], "rationale": "<p>1. <strong>题型识别</strong>：无症状 AAA + 直径 → 监测间隔 2. <strong>AAA 监测间隔表</strong>（必背）：</p>\n<table class='md-table'>\n<thead><tr><th>AAA 直径 (cm)</th><th>监测间隔 (月)</th></tr></thead>\n<tbody>\n<tr><td>3-3.9</td><td><strong>24</strong></td></tr>\n<tr><td>4-4.5</td><td>12</td></tr>\n<tr><td>4.6-5</td><td>6</td></tr>\n<tr><td>> 5</td><td>3</td></tr>\n</tbody>\n</table>\n<p>3. <strong>本例</strong>：3.8 cm → 落在 3-3.9 区间 → <strong>USG 每 24 月</strong> 4. <strong>选项排除</strong>：</p>\n<ul>\n<li>A (USG 12mo)：4-4.5 cm 才是 12 月</li>\n<li>B (CT 12mo)：监测用 USG，不是 CT</li>\n<li>C (USG 24mo)：<strong>正确</strong></li>\n<li>D (CT 24mo)：监测方式错</li>\n<li>E (CT or USG 12mo)：间隔错 + 方式错</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"间隔数字记混\"陷阱</strong>：3-3.9 → 24；4-4.5 → 12；4.6-5 → 6；> 5 → 3。<strong>记反或记错</strong>直接错题。</li>\n<li><strong>\"CT 也是监测\"陷阱</strong>：<strong>CT 仅用于术前</strong>规划，<strong>不</strong>用于监测（贵、辐射、造影剂）。</li>\n<li><strong>\"无症状 = 不用管\"陷阱</strong>：无症状 AAA 仍要<strong>定期监测</strong>（防扩张到手术阈值）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Ultrasonography is the preferred method for screening and surveillance of asymptomatic AAA.</strong> The screening intervals depend on the size of the AAA and are according to the following table:</p>\n<table class='md-table'>\n<thead><tr><th>AAA diameter (cm)</th><th>Surveillance interval (months)</th></tr></thead>\n<tbody>\n<tr><td>3-3.9</td><td>24</td></tr>\n<tr><td>4-4.5</td><td>12</td></tr>\n<tr><td>4.6-5</td><td>6</td></tr>\n<tr><td>> 5</td><td>3</td></tr>\n</tbody>\n</table>\n<p>Given the size of the AAA (3.8 cm), it should be monitored every 24 months with ultrasonography.</p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：2018 ASA 腹主动脉瘤指南）</li>\n</ul>", "related": ["AMC-Q0254-AAA-Surveillance-Ultrasound", "AMC-Q0257-AAA-4-5cm-12mo", "AMC-Q0258-AAA-Repair-Indication", "MOC-Cardiology"], "bodyHtml": "", "diseases": ["AAA"], "complaints": ["abdominal pain"], "search": "3.8 cm aaa — usg 每 24 月监测\naaa surveillance interval size-based 3.8 cm ultrasound 24 months\ninvestigation definition treatment\n a 65-year-old man presents with history of two episodes of abdominal pain after meals. as a part of workup plan, an abdominal ultrasonography is performed, which showed gallstones in the gallbladder and a 3.8 cm abdominal aortic aneurysm (aaa). which one of the following is the recommended management of this asymptomatic aaa? \n correct answer is  c  \n  ultrasonography is the preferred method for screening and surveillance of asymptomatic aaa.  the screening intervals depend on the size of the aaa and are according to the following table: \n \n   aaa diameter (cm)  surveillance interval (months)   \n \n  3-3.9  24  \n  4-4.5  12  \n  4.6-5  6  \n  > 5  3  \n \n \n given the size of the aaa (3.8 cm), it should be monitored every 24 months with ultrasonography. "}, {"id": "AMC-Q0257", "type": "mcq", "qid": 257, "title": "4.5 cm AAA（偶然发现）— USG 每 12 月", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "definition"], "topic": ["AAA Surveillance", "Incidental Finding", "4.5 cm", "Ultrasound", "12 months"], "difficulty": 2, "correctAnswer": "C", "page": 46, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "surveillance", "incidental", "approach-investigation", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0257-AAA-4-5cm-12mo.md", "stem": "<p>Abdominal ultrasonography of a 68-year-old man for renal colic reveals an abdominal aortic aneurysm 4.5 cm in size as a chance finding. Which one of the following is the most appropriate management of his aneurysm?</p>", "options": [{"letter": "A", "text": "Refer him for elective surgical repair of the aneurysm"}, {"letter": "B", "text": "Repeat sonography in 6 months"}, {"letter": "C", "text": "Repeat sonography in 12 months"}, {"letter": "D", "text": "Repeat sonography in 24 months"}, {"letter": "E", "text": "Arrange for CT angiography"}], "rationale": "<p>1. <strong>题型识别</strong>：偶然发现 AAA 4.5 cm → 选监测间隔 2. <strong>AAA 监测间隔表</strong>（必背）：</p>\n<table class='md-table'>\n<thead><tr><th>AAA 直径 (cm)</th><th>监测间隔 (月)</th></tr></thead>\n<tbody>\n<tr><td>3-3.9</td><td>24</td></tr>\n<tr><td><strong>4-4.5</strong></td><td><strong>12</strong></td></tr>\n<tr><td>4.6-5</td><td>6</td></tr>\n<tr><td>> 5</td><td>3</td></tr>\n</tbody>\n</table>\n<p>3. <strong>本例</strong>：4.5 cm → 4-4.5 区间 → <strong>USG 12 月</strong> 4. <strong>选项排除</strong>：</p>\n<ul>\n<li>A (Elective repair)：4.5 cm <strong>未达手术阈值</strong>（男 5.5 cm、女 5.0 cm）</li>\n<li>B (6 mo)：4.6-5 cm 才是 6 月</li>\n<li>C (12 mo)：<strong>正确</strong></li>\n<li>D (24 mo)：3-3.9 cm 才是 24 月</li>\n<li>E (CT angio)：未达手术阈值，<strong>不</strong>需 CTA</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"边界值 = 上一档\"陷阱</strong>：4.5 cm 是 <strong>4-4.5 区间</strong>的<strong>上限</strong>，仍是 12 月，不是 4.6-5 区间。4.6 cm 才是 6 月。</li>\n<li><strong>\"未达手术阈值 = 不监测\"陷阱</strong>：监测是持续的（直到手术或死亡）。</li>\n<li><strong>\"偶然发现 = 紧急\"陷阱</strong>：偶然发现的小 AAA <strong>不需紧急处理</strong>，按直径常规监测。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Ultrasonography is the preferred method for screening and surveillance of asymptomatic AAA.</strong> Recommended screening intervals for an asymptomatic AAA depends on the size of the aneurysm:</p>\n<table class='md-table'>\n<thead><tr><th>AAA diameter (cm)</th><th>Surveillance interval (months)</th></tr></thead>\n<tbody>\n<tr><td>3-3.9</td><td>24</td></tr>\n<tr><td><strong>4-4.5</strong></td><td><strong>12</strong></td></tr>\n<tr><td>4.6-5</td><td>6</td></tr>\n<tr><td>> 5</td><td>3</td></tr>\n</tbody>\n</table>\n<p>Given the size of the AAA (4.5 cm), it should be monitored every 12 months with ultrasonography.</p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：2018 ASA 腹主动脉瘤指南）</li>\n</ul>", "related": ["AMC-Q0256-AAA-3-8cm-24mo", "AMC-Q0254-AAA-Surveillance-Ultrasound", "AMC-Q0258-AAA-Repair-Indication", "MOC-Cardiology"], "bodyHtml": "", "diseases": ["AAA"], "complaints": [], "search": "4.5 cm aaa（偶然发现）— usg 每 12 月\naaa surveillance incidental finding 4.5 cm ultrasound 12 months\ninvestigation definition\n abdominal ultrasonography of a 68-year-old man for renal colic reveals an abdominal aortic aneurysm 4.5 cm in size as a chance finding. which one of the following is the most appropriate management of his aneurysm? \n correct answer is  c  \n  ultrasonography is the preferred method for screening and surveillance of asymptomatic aaa.  recommended screening intervals for an asymptomatic aaa depends on the size of the aneurysm: \n \n   aaa diameter (cm)  surveillance interval (months)   \n \n  3-3.9  24  \n   4-4.5    12   \n  4.6-5  6  \n  > 5  3  \n \n \n given the size of the aaa (4.5 cm), it should be monitored every 12 months with ultrasonography. "}, {"id": "AMC-Q0258", "type": "mcq", "qid": 258, "title": "AAA 手术指征 — NOT：男性 5.0 cm（应是 5.5 cm）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "definition", "differential"], "topic": ["AAA Surgical Repair Indication", "Size Threshold", "Male vs Female", "Growth Rate", "Symptomatic"], "difficulty": 3, "correctAnswer": "A", "page": 47, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "surgical-repair", "threshold", "approach-treatment", "approach-definition", "approach-differential"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0258-AAA-Repair-Indication.md", "stem": "<p>Which one of the following is <strong>not an indication</strong> for surgical repair of an abdominal aortic aneurysm (AAA)?</p>", "options": [{"letter": "A", "text": "AAA more than 5.0 cm in a male patient"}, {"letter": "B", "text": "AAA more than 5.0 cm in a female patient"}, {"letter": "C", "text": "AAA growth more than 1.0 cm/year"}, {"letter": "D", "text": "AAA with back pain"}, {"letter": "E", "text": "AAA with distal thromboembolism"}], "rationale": "<p>1. <strong>题型识别</strong>：AAA 手术指征的<strong>反向题</strong>（找 NOT）。 2. <strong>AAA 手术指征（必背）</strong>：</p>\n<ul>\n<li><strong>无症状 AAA</strong>：</li>\n<li><strong>男性 > 5.5 cm</strong></li>\n<li><strong>女性 > 5.0 cm</strong></li>\n<li>胸主动脉瘤 > 6.0 cm</li>\n<li>增长速度 <strong>> 1.0 cm/年</strong></li>\n<li><strong>有症状</strong>（腹痛/背痛、远端血栓栓塞）</li>\n<p>3. <strong>关键鉴别</strong>：</p>\n<li>男 5.5 vs 女 5.0</li>\n<li>这是<strong>性别差异</strong>（女性动脉直径小，相同直径风险更高）</li>\n<p>4. <strong>选项逐一分析</strong>：</p>\n<li>A (> 5.0 cm in MALE)：<strong>错</strong>（男性阈值 5.5 cm）← NOT</li>\n<li>B (> 5.0 cm in FEMALE)：<strong>对</strong>（女性阈值 5.0 cm）</li>\n<li>C (Growth > 1.0 cm/year)：<strong>对</strong>（增长过快）</li>\n<li>D (AAA with back pain)：<strong>对</strong>（症状性 = 手术）</li>\n<li>E (AAA with distal thromboembolism)：<strong>对</strong>（症状性 = 手术）</li>\n<p>5. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"男 5.5 vs 女 5.0\"陷阱</strong>：<strong>记反</strong>直接错题。</li>\n<li><strong>\"5.0 cm 都得做\"陷阱</strong>：错。<strong>要看性别</strong>。</li>\n<li><strong>\"无症状 = 不做\"陷阱</strong>：错。<strong>无症状也要看尺寸</strong>。</li>\n<li><strong>\"有症状 = 都得做\"陷阱</strong>：对。<strong>有症状的 AAA 不论大小</strong>都建议手术（破裂风险高）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p><strong>Indications for surgical repair of an aortic aneurysm</strong>:</p>\n<ul>\n<li><strong>Asymptomatic AAA > 5.5 cm in men</strong></li>\n<li><strong>Asymptomatic AAA > 5.0 cm in women</strong></li>\n<li>Thoracic aortic aneurysm > 6.0 cm</li>\n<li><strong>Growth > 1.0 cm/year</strong></li>\n<li><strong>Symptomatic AAA</strong> (abdominal/back pain, distal thromboembolism)</li>\n</ul>\n<p>An asymptomatic aortic aneurysm of 5.0 cm in a male is <strong>not an indication</strong> for surgical repair.</p>\n<p><strong>Why the gender difference</strong>: Women have smaller native aortic diameters, so the same absolute aneurysm diameter represents a greater relative dilation in women. The threshold is therefore lower.</p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：2018 ASA / 2020 SVS 腹主动脉瘤指南）</li>\n</ul>", "related": ["AMC-Q0256-AAA-3-8cm-24mo", "AMC-Q0257-AAA-4-5cm-12mo", "AMC-Q0259-Ruptured-AAA-Bedside-USG", "MOC-Cardiology", "Topic-AAA-Surgical-Threshold"], "bodyHtml": "", "diseases": ["AAA"], "complaints": [], "search": "aaa 手术指征 — not：男性 5.0 cm（应是 5.5 cm）\naaa surgical repair indication size threshold male vs female growth rate symptomatic\ntreatment definition differential\n which one of the following is  not an indication  for surgical repair of an abdominal aortic aneurysm (aaa)? \n correct answer is  a  \n  indications for surgical repair of an aortic aneurysm : \n \n  asymptomatic aaa > 5.5 cm in men  \n  asymptomatic aaa > 5.0 cm in women  \n thoracic aortic aneurysm > 6.0 cm \n  growth > 1.0 cm/year  \n  symptomatic aaa  (abdominal/back pain, distal thromboembolism) \n \n an asymptomatic aortic aneurysm of 5.0 cm in a male is  not an indication  for surgical repair. \n  why the gender difference : women have smaller native aortic diameters, so the same absolute aneurysm diameter represents a greater relative dilation in women. the threshold is therefore lower. "}, {"id": "AMC-Q0259", "type": "mcq", "qid": 259, "title": "破裂 AAA — 床旁 USG 确诊（不是直接进 OT）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis", "treatment"], "topic": ["Ruptured AAA", "Diagnosis", "Bedside Ultrasonography", "Resuscitation", "Emergent Surgery"], "difficulty": 4, "correctAnswer": "E", "page": 48, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "ruptured", "emergency", "ultrasound", "approach-investigation", "approach-diagnosis", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0259-Ruptured-AAA-Bedside-USG.md", "stem": "<p>A 72-year-old man comes to the emergency department complaining of epigastric pain that radiates to his lower back. While waiting for further evaluation in the emergency department, he suddenly collapses. Physical examination shows a blood pressure of 80/50 mmHg and pulse of 110 bpm. He is pale, cold, and sweaty. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Take the patient to the operating theatre immediately"}, {"letter": "B", "text": "Arrange for CT angiography"}, {"letter": "C", "text": "Non-contrast abdominal CT scan"}, {"letter": "D", "text": "ECG"}, {"letter": "E", "text": "Bedside ultrasonography"}], "rationale": "<p>1. <strong>题型识别</strong>：老年 + 上腹痛放射背 + 突然虚脱 + 休克 = <strong>破裂 AAA 经典三联</strong> 2. <strong>破裂 AAA 三联</strong>：</p>\n<ul>\n<li>腹痛 / 背痛</li>\n<li>低血压 / 休克</li>\n<li>搏动性腹部包块（不一定能触及——休克时不易摸到）</li>\n<p>3. <strong>关键决策</strong>：</p>\n<li>高度怀疑破裂 → <strong>不能延误</strong></li>\n<li>但<strong>不能盲目送 OT</strong>（未确诊、需联系血管外科、需复苏稳定）</li>\n<li><strong>床旁 USG</strong> = 床旁 5 分钟可做、敏感度高、确诊 AAA</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Immediate OT)：<strong>未确诊</strong> + <strong>未联系外科</strong> + <strong>未复苏</strong> → 错</li>\n<li>B (CT angiography)：<strong>不稳定的破裂 AAA</strong> 经不起 CT 折腾（耗时长）</li>\n<li>C (Non-contrast CT)：<strong>不能</strong>显示血管</li>\n<li>D (ECG)：术前要做，但<strong>不</strong>是破裂 AAA 的诊断</li>\n<li>E (Bedside USG)：<strong>正确</strong>——快速、无创、床旁可做</li>\n<p>5. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"诊断明确 = 直接 OT\"陷阱</strong>：破裂 AAA 高度怀疑但<strong>仍要确诊</strong>（避免不必要的手术风险）。床旁 USG 是最佳快速确诊工具。</li>\n<li><strong>\"CT 准确 = 破裂 AAA 也用 CT\"陷阱</strong>：稳定的 AAA 用 CTA；<strong>不稳定的破裂 AAA</strong> 病情不允许做 CT（耗时）。</li>\n<li><strong>\"ECG 排除心源\"陷阱</strong>：ECG 在破裂 AAA <strong>术前</strong>要做（排除 MI），但<strong>不</strong>是破裂 AAA 的<strong>诊断</strong>工具。</li>\n<li><strong>\"复苏 vs 诊断 = 二选一\"陷阱</strong>：错。<strong>同时进行</strong>——一边复苏，一边床旁 USG。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>The location of the pain and its radiation to the lower back, followed by signs of shock is consistent with a <strong>ruptured abdominal aortic aneurysm</strong> as the most likely provisional diagnosis.</p>\n<p><strong>Before emergent transfer of the patient for surgery (option A), vascular surgeon should be contacted, and the diagnosis should be confirmed with bedside ultrasonography</strong> as the most readily available with acceptable sensitivity and specificity. <strong>In the meanwhile, resuscitative measures</strong> such as intravenous access, fluid administration, and supplemental oxygen should be taken in the emergency department.</p>\n<ul>\n<li>An <strong>ECG (option D)</strong> must be obtained pre-operatively but <strong>not the priority as the first step</strong> in management.</li>\n<li>Other diagnostic measures such as <strong>CT angiography (option B) or non-contrast CT scan (option C)</strong> are <strong>unnecessary and does not change the management plan</strong>.</li>\n</ul>\n<p><strong>Key teaching points</strong>: 1. Suspected ruptured AAA → <strong>bedside USG</strong> (not CT) 2. Call vascular surgery early 3. Permissive hypotension (don't over-resuscitate before surgery — too much fluid disrupts clot) 4. Type & crossmatch, large-bore IV access</p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：2020 SVS 破裂 AAA 指南）</li>\n</ul>", "related": ["AMC-Q0252-AAA-Bedside-Ultrasound", "AMC-Q0260-Ruptured-AAA-Mortality", "MOC-Cardiology", "Topic-Ruptured-AAA"], "bodyHtml": "", "diseases": ["AAA"], "complaints": ["syncope/collapse", "epigastric pain"], "search": "破裂 aaa — 床旁 usg 确诊（不是直接进 ot）\nruptured aaa diagnosis bedside ultrasonography resuscitation emergent surgery\ninvestigation diagnosis treatment\n a 72-year-old man comes to the emergency department complaining of epigastric pain that radiates to his lower back. while waiting for further evaluation in the emergency department, he suddenly collapses. physical examination shows a blood pressure of 80/50 mmhg and pulse of 110 bpm. he is pale, cold, and sweaty. which one of the following is the next best step in management? \n correct answer is  e  \n the location of the pain and its radiation to the lower back, followed by signs of shock is consistent with a  ruptured abdominal aortic aneurysm  as the most likely provisional diagnosis. \n  before emergent transfer of the patient for surgery (option a), vascular surgeon should be contacted, and the diagnosis should be confirmed with bedside ultrasonography  as the most readily available with acceptable sensitivity and specificity.  in the meanwhile, resuscitative measures  such as intravenous access, fluid administration, and supplemental oxygen should be taken in the emergency department. \n \n an  ecg (option d)  must be obtained pre-operatively but  not the priority as the first step  in management. \n other diagnostic measures such as  ct angiography (option b) or non-contrast ct scan (option c)  are  unnecessary and does not change the management plan . \n \n  key teaching points : 1. suspected ruptured aaa →  bedside usg  (not ct) 2. call vascular surgery early 3. permissive hypotension (don't over-resuscitate before surgery — too much fluid disrupts clot) 4. type & crossmatch, large-bore iv access "}, {"id": "AMC-Q0260", "type": "mcq", "qid": 260, "title": "破裂 AAA 死亡率 — 80-90%（不是 100%）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "complications", "treatment"], "topic": ["Ruptured AAA", "Mortality", "Overall Mortality", "Surgical Risk", "Patient Counseling"], "difficulty": 2, "correctAnswer": "D", "page": 49, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aaa", "ruptured", "mortality", "approach-definition", "approach-complications", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0260-Ruptured-AAA-Mortality.md", "stem": "<p>You are called to see a 58-year-old patient, who has presented with complaints of weakness and shortness of breath. A blood test reveals hemoglobin of 85 g/L (120-160). As a part of the workup for finding the cause of his anemia, an abdominal CT scan is performed showing a 10.5 cm infra-renal abdominal aortic aneurysm as an incidental finding. You tell the patient that he needs surgery for treatment of his aneurysm. He wants to know how dangerous it could be if he does not have the surgery. Which one of the following is the mortality rate of a ruptured abdominal aortic aneurysm?</p>", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "25%"}, {"letter": "C", "text": "50%"}, {"letter": "D", "text": "80%"}, {"letter": "E", "text": "100%"}], "rationale": "<p>1. <strong>题型识别</strong>：破裂 AAA 的<strong>数字题</strong> 2. <strong>关键数字</strong>：</p>\n<ul>\n<li>破裂 AAA 总死亡率 = <strong>80-90%</strong></li>\n<li>包含：<strong>院前死亡</strong> + <strong>术后死亡</strong></li>\n<p>3. <strong>为什么不是 100%</strong>：</p>\n<li>腹膜后破裂（retroperitoneal rupture）—— 出血暂时受腹膜后间隙压迫 → 短暂稳定窗口 → 可手术</li>\n<li>腹腔内破裂（intraperitoneal）—— 通常快速致死</li>\n<p>4. <strong>本例背景</strong>：</p>\n<li>10.5 cm AAA（巨大型，<strong>远超</strong>手术阈值 5.5 cm）</li>\n<li>合并贫血（Hb 85）—— 提示可能已有<strong>慢性渗血</strong>或破裂先兆</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (10%)：远低估</li>\n<li>B (25%)：低估</li>\n<li>C (50%)：低估</li>\n<li>D (80%)：<strong>正确</strong></li>\n<li>E (100%)：错（不是必死，少数抢救成功）</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"破裂 = 必死\"陷阱</strong>：错。<strong>80-90%</strong>（不是 100%），有抢救窗口。</li>\n<li><strong>\"数字 = 50%\"陷阱</strong>：50% 是一些心脏急症的数字（如院外 CA 抢救成功率），<strong>不是</strong>破裂 AAA。</li>\n<li><strong>\"手术死亡率\"陷阱</strong>：题问的是<strong>破裂 AAA 总体死亡率</strong>（包含院前+术后），不是<strong>手术死亡率</strong>（择期 AAA 手术死亡率 ~5%，急诊手术 ~50%）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Rupture of an AAA into the peritoneal cavity is often usually rapidly fatal</strong>, whereas, <strong>retroperitoneal rupture often stabilizes transiently</strong> providing a window of opportunity for life-saving surgical intervention and repair. Collectively, <strong>a ruptured AAA is catastrophic and carries a mortality risk of 80-90%</strong>.</p>\n<p><strong>Distinction worth noting</strong>:</p>\n<ul>\n<li><strong>Ruptured AAA overall mortality</strong>: <strong>80-90%</strong> (this question)</li>\n<li><strong>Elective AAA surgical mortality</strong>: ~5% (planned repair)</li>\n<li><strong>Emergency AAA surgical mortality</strong>: ~50% (but selected survivors)</li>\n</ul>\n<p><strong>Clinical pearl</strong>: A 10.5 cm AAA is <strong>well above</strong> the surgical threshold (5.5 cm in men, 5.0 cm in women) and has a <strong>very high annual rupture risk</strong>. Surgical repair is strongly recommended <strong>before</strong> rupture occurs.</p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：2020 SVS 腹主动脉瘤指南）</li>\n</ul>", "related": ["AMC-Q0258-AAA-Repair-Indication", "AMC-Q0259-Ruptured-AAA-Bedside-USG", "MOC-Cardiology", "Topic-AAA-Prognosis"], "bodyHtml": "", "diseases": ["AAA"], "complaints": ["dyspnea", "weakness"], "search": "破裂 aaa 死亡率 — 80-90%（不是 100%）\nruptured aaa mortality overall mortality surgical risk patient counseling\ndefinition complications treatment\n you are called to see a 58-year-old patient, who has presented with complaints of weakness and shortness of breath. a blood test reveals hemoglobin of 85 g/l (120-160). as a part of the workup for finding the cause of his anemia, an abdominal ct scan is performed showing a 10.5 cm infra-renal abdominal aortic aneurysm as an incidental finding. you tell the patient that he needs surgery for treatment of his aneurysm. he wants to know how dangerous it could be if he does not have the surgery. which one of the following is the mortality rate of a ruptured abdominal aortic aneurysm? \n correct answer is  d  \n  rupture of an aaa into the peritoneal cavity is often usually rapidly fatal , whereas,  retroperitoneal rupture often stabilizes transiently  providing a window of opportunity for life-saving surgical intervention and repair. collectively,  a ruptured aaa is catastrophic and carries a mortality risk of 80-90% . \n  distinction worth noting : \n \n  ruptured aaa overall mortality :  80-90%  (this question) \n  elective aaa surgical mortality : ~5% (planned repair) \n  emergency aaa surgical mortality : ~50% (but selected survivors) \n \n  clinical pearl : a 10.5 cm aaa is  well above  the surgical threshold (5.5 cm in men, 5.0 cm in women) and has a  very high annual rupture risk . surgical repair is strongly recommended  before  rupture occurs. "}, {"id": "AMC-Q0261", "type": "mcq", "qid": 261, "title": "A 型主动脉夹层 — Morphine + BB + TEE（绝对禁溶栓 / 抗凝）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "complications"], "topic": ["Aortic Dissection", "Type A vs B", "Management", "Beta Blocker", "Pain Control", "TEE", "CT Angiography"], "difficulty": 5, "correctAnswer": "C", "page": 50, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aortic-dissection", "type-a", "beta-blocker", "tees", "approach-treatment", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0261-Aortic-Dissection-Type-A.md", "stem": "<p>A 72-year-old man is brought to emergency department with ambulance after he sustained a sudden severe chest pain radiating to his back. On auscultation there is a diastolic murmur best heard over the left sternal border in the second intercostal space. ECG shows ST elevation in leads II, III and aVF. A CXR is remarkable for a widened mediastinum. Which one of the following is the most appropriate management?</p>", "options": [{"letter": "A", "text": "Give alteplase"}, {"letter": "B", "text": "Give aspirin, intravenous morphine, and beta blockers"}, {"letter": "C", "text": "Give morphine and beta blockers and arrange for emergency trans-esophageal sonography"}, {"letter": "D", "text": "Refer the patient to cardiology clinic"}, {"letter": "E", "text": "Arrange for emergency angiography"}], "rationale": "<p>1. <strong>题型识别</strong>：突发胸痛放射背 + 主动脉瓣反流杂音 + 下壁 STEMI + 纵隔增宽 → <strong>A 型主动脉夹层</strong> 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>72 岁 + 突发撕裂样胸痛<strong>放射背</strong>（夹层经典）</li>\n<li>胸骨左缘第 2 肋间<strong>舒张期杂音</strong> = <strong>主动脉瓣反流</strong>（夹层累及升主动脉根部）</li>\n<li>ECG：II, III, aVF ST 抬高 = <strong>下壁 STEMI</strong>（夹层累及右冠状动脉开口）</li>\n<li>CXR：<strong>纵隔增宽</strong>（夹层典型）</li>\n<p>3. <strong>A 型 vs B 型夹层</strong>：</p>\n<li><strong>A 型</strong>（Stanford）：累及升主动脉 → <strong>手术</strong></li>\n<li><strong>B 型</strong>：仅降主动脉 → 药物控制</li>\n<li>本例：累及升主动脉（主动脉瓣反流 + 冠脉受累）→ <strong>A 型</strong></li>\n<p>4. <strong>A 型夹层处理</strong>：</p>\n<li><strong>吗啡</strong>：镇痛（部分降压作用）</li>\n<li><strong>β 受体阻滞剂</strong>（艾司洛尔、拉贝洛尔）：<strong>降心率到 60 bpm</strong>、降 SBP < 120 mmHg（<strong>减低剪切力</strong>，防夹层扩展）——<strong>首选</strong></li>\n<li><strong>TEE / CTA</strong>：确诊 + 评估范围</li>\n<li><strong>绝对禁忌</strong>：溶栓、抗凝、抗血小板（→ 致夹层扩展 / 出血）</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Alteplase)：<strong>绝对禁忌</strong>（溶栓致死）</li>\n<li>B (Aspirin + 吗啡 + BB)：<strong>Aspirin 禁忌</strong>（抗血小板加重夹层出血）</li>\n<li>C (吗啡 + BB + TEE)：<strong>正确</strong></li>\n<li>D (Cardiology clinic)：<strong>患者是急症</strong>，不能门诊转诊</li>\n<li>E (Emergency angiography)：CTA 可用，但 TEE 更快（床旁、可在 ICU/ED 做）—— TEE 不可用时 CTA 替代</li>\n<p>6. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"STEMI = 溶栓\"陷阱</strong>：本例 ECG 是下壁 STEMI，但<strong>真因是夹层累及右冠</strong>（不是冠脉血栓）。<strong>溶栓致死</strong>。</li>\n<li><strong>\"Aspirin 是 ACS 标配\"陷阱</strong>：本例<strong>不是 ACS</strong>，是<strong>夹层</strong>。Aspirin / 抗凝 / 抗血小板<strong>全部禁忌</strong>（加重夹层出血）。</li>\n<li><strong>\"BB 治 MI\"陷阱</strong>：BB 在本例<strong>不是治 MI</strong>——是<strong>降心率、减剪切力、防夹层扩展</strong>。</li>\n<li><strong>\"Angiography = 确诊金标准\"陷阱</strong>：TEE（食道超声）更快、<strong>床旁</strong>可做、不需造影剂。CTA 是 TEE 不可用时的替代。</li>\n<li><strong>\"Type B = 不急\"陷阱</strong>：Type A 是真急症，Type B 可药物。本例是 Type A，<strong>必须手术</strong>。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The clinical findings of <strong>abrupt chest pain radiating to back</strong> and a <strong>widened mediastinum on CXR</strong> are consistent with diagnosis <strong>aortic dissection</strong>. The <strong>diastolic murmur</strong> signifies involvement of the proximal aorta resulting in <strong>aortic regurgitation</strong> and decreased blood flow to the <strong>coronary arteries</strong> and a consequent <strong>myocardial infarction (MI)</strong>.</p>\n<p><strong>Critical contraindications</strong>:</p>\n<ul>\n<li><strong>Thrombolytics (e.g. alteplase) (option A) are absolutely contraindicated</strong> when aortic dissection is suspected.</li>\n<li><strong>Aspirin (option B), clopidogrel and other anticoagulation medications are contraindicated</strong> as well due to increased risk of deterioration of the dissection.</li>\n</ul>\n<p><strong>The cornerstone of initial therapy</strong>:</p>\n<ul>\n<li><strong>Morphine for pain control</strong> (and its partial effect on lowering blood pressure)</li>\n<li><strong>Beta blockers</strong> to maintain the systolic blood pressure below 120 mmHg</li>\n<li><strong>Trans-esophageal sonography (TEE)</strong> to confirm the diagnosis emergently</li>\n</ul>\n<p><strong>Angiography using CT angiogram (CTA) (option E)</strong> is the preferred method <strong>if TEE is not available</strong>.</p>\n<p><strong>Stanford classification</strong>:</p>\n<ul>\n<li><strong>Type A</strong> (ascending aorta involved) → <strong>surgical emergency</strong></li>\n<li><strong>Type B</strong> (descending only) → medical management</li>\n</ul>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC186140</li>\n<li>http://www.ecinsw.com.au/aortic-dissection</li>\n<li>（待补：2022 ACC/AHA 主动脉疾病指南）</li>\n</ul>", "related": ["AMC-Q0259-Ruptured-AAA-Bedside-USG", "AMC-Q0248-AS-Syncope-Monitoring", "AMC-Q0224-Thrombolytics-Contraindications", "MOC-Cardiology", "Topic-Aortic-Dissection"], "bodyHtml": "", "diseases": ["Aortic Dissection"], "complaints": ["chest pain"], "search": "a 型主动脉夹层 — morphine + bb + tee（绝对禁溶栓 / 抗凝）\naortic dissection type a vs b management beta blocker pain control tee ct angiography\ntreatment diagnosis complications\n a 72-year-old man is brought to emergency department with ambulance after he sustained a sudden severe chest pain radiating to his back. on auscultation there is a diastolic murmur best heard over the left sternal border in the second intercostal space. ecg shows st elevation in leads ii, iii and avf. a cxr is remarkable for a widened mediastinum. which one of the following is the most appropriate management? \n correct answer is  c  \n the clinical findings of  abrupt chest pain radiating to back  and a  widened mediastinum on cxr  are consistent with diagnosis  aortic dissection . the  diastolic murmur  signifies involvement of the proximal aorta resulting in  aortic regurgitation  and decreased blood flow to the  coronary arteries  and a consequent  myocardial infarction (mi) . \n  critical contraindications : \n \n  thrombolytics (e.g. alteplase) (option a) are absolutely contraindicated  when aortic dissection is suspected. \n  aspirin (option b), clopidogrel and other anticoagulation medications are contraindicated  as well due to increased risk of deterioration of the dissection. \n \n  the cornerstone of initial therapy : \n \n  morphine for pain control  (and its partial effect on lowering blood pressure) \n  beta blockers  to maintain the systolic blood pressure below 120 mmhg \n  trans-esophageal sonography (tee)  to confirm the diagnosis emergently \n \n  angiography using ct angiogram (cta) (option e)  is the preferred method  if tee is not available . \n  stanford classification : \n \n  type a  (ascending aorta involved) →  surgical emergency  \n  type b  (descending only) → medical management \n "}, {"id": "AMC-Q0262", "type": "mcq", "qid": 262, "title": "急性肢体缺血最常见原因 — 血栓形成（不是栓塞）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "differential", "complications"], "topic": ["Acute Limb Ischemia", "Etiology", "Thrombosis vs Embolism", "Atrial Fibrillation", "Epidemiology"], "difficulty": 3, "correctAnswer": "B", "page": 52, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "limb-ischemia", "thrombosis", "embolism", "approach-definition", "approach-differential", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0262-Limb-Ischemia-Thrombosis.md", "stem": "<p>Which one of the following is the most common cause of acute limb ischemia?</p>", "options": [{"letter": "A", "text": "Congestive heart failure"}, {"letter": "B", "text": "Thrombosis"}, {"letter": "C", "te
