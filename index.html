特别 orthopedic、neuro、oncology） \n 高凝状态（cancer、thrombophilia） \n 妊娠 / 产褥期 \n ocp / hrt \n \n 抗凝禁忌（这些情况下考虑替代） \n \n   类别  具体   \n \n  神经  出血性卒中、近期神经手术  \n  外科  近期大手术  \n  创伤  大/多发创伤  \n  出血  活动性 gi 出血 / 血尿 / 胆道出血  \n  颅内  肿瘤（原发或转移）  \n  血液  出血体质（itp、血友病）  \n  其他   妊娠 、易跌倒（pd、卒中后）、 依从性差   \n \n \n 替代方案：ivc filter \n ### 核心适应证（amc 高频） \n 1.  dvt or pe  患者存在  抗凝禁忌  2. 抗凝过程中  出现并发症 （出血） 3. 充分抗凝后  失败（仍发 pe）  4. 患者  依从性差 （无法可靠 long-term 抗凝） ← q09 命中此点 \n ### 注意点 \n \n ivc filter 是  预防 pe ， 不治疗 dvt 本体  \n 仍需随访 dvt 是否进展 \n 临时 filter 可取出；永久 filter 长期并发症 \n \n 标准化疗路径 \n \n   阶  措施   \n \n  急性  ufh 或 lmwh  \n  桥接  同日内启动 warfarin  \n  维持  heparin 至 inr > 2 连两次后停  \n  长程  warfarin ≥ 3 个月（按再发风险）  \n \n \n 常见考点（amc 高频对比） \n \n   题眼  默认   \n \n  dvt 后 standard  warfarin 3-6m  \n  抗凝禁忌时  ivc filter  \n  cancer + dvt  lmwh 长程 / doac  \n  妊娠 + dvt  lmwh（ 不 用 warfarin = 致畸）  \n  易跌倒患者  ivc filter 或密切随访  \n \n "}, {"id": "TR-Measles-Exclusion", "type": "tr", "qid": 0, "title": "Measles 停学与接触者管理 — 知识总结", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Measles 停学与接触者管理 — 出疹后 4 天 / 未免疫接触者 14 天"], "difficulty": 0, "correctAnswer": "", "page": 1320, "tags": ["topic-review", "amc", "paediatrics", "infectious-disease", "measles", "school-exclusion", "contact-tracing", "approach-prevention"], "cssclass": "tr-paediatrics", "color": "#2d8f96", "file": "02-Topic-Reviews/Paediatrics/TR-Measles-Exclusion.md", "stem": "<p>麻疹传染性极强。管理核心是 <strong>index case 停学时限</strong> 与 <strong>接触者追踪隔离</strong>，尤其在日托/学校场景。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p>麻疹传染性极强。管理核心是 <strong>index case 停学时限</strong> 与 <strong>接触者追踪隔离</strong>，尤其在日托/学校场景。</p>\n<h3>关键知识点</h3>\n<p>### Index case（确诊病例）停学</p>\n<ul>\n<li>停学至 <strong>出疹后 4 天</strong>（rash onset + 4 days）。</li>\n<li>无论是否接种疫苗，只要确诊/疑似/可能，均停学。</li>\n</ul>\n<p>### 接触者（contacts）停学（日托/学校场景）</p>\n<ul>\n<li><strong>已免疫接触者</strong>：不需停学。</li>\n<li><strong>未免疫接触者</strong>：停学至 <strong>index case 出疹后 14 天</strong>；除非在接触后 <strong>72 小时内接种 MMR</strong>。</li>\n</ul>\n<p>### 示例推演</p>\n<ul>\n<li>John 3 天前出疹（index case）→ 本人停学至出疹后 4 天（即明天）。</li>\n<li>Ana（接触者）：曾患麻疹 → 已免疫 → 不停学。</li>\n<li>Josh（接触者）：全程接种 → 不停学。</li>\n<li>Alan / Mary（接触者）：未接种 → 自今日起停学 11 天（John 出疹后 14 天）。</li>\n</ul>\n<h3>表 / 对照 / 速记</h3>\n<table class='md-table'>\n<thead><tr><th>场景</th><th>停学时限</th></tr></thead>\n<tbody>\n<tr><td>Index case</td><td>出疹后 4 天</td></tr>\n<tr><td>已免疫接触者</td><td>不停学</td></tr>\n<tr><td>未免疫接触者</td><td>index 出疹后 14 天（或接触 72h 内 MMR 可免）</td></tr>\n</tbody>\n</table>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>停学/隔离时限（index）</th></tr></thead>\n<tbody>\n<tr><td>Measles</td><td>出疹后 4 天</td></tr>\n<tr><td>Pertussis</td><td>抗生素后 5 天 / 阵咳起 21 天（或 14 天）</td></tr>\n<tr><td>Chickenpox</td><td>所有水疱结痂（约出疹 5 天）</td></tr>\n</tbody>\n</table>\n<h3>临床要点</h3>\n<ul>\n<li>麻疹停学看\"出疹后 4 天\"，不是\"疹退\"。</li>\n<li>接触者是否停学取决于<strong>其自身免疫状态</strong>，不是 index case。</li>\n<li>未免疫接触者 72h 内 MMR 可截断隔离。</li>\n</ul>\n<h3>常见考点</h3>\n<ul>\n<li>出疹已 >4 天 → 无需停学（题眼常给\"出疹 6–7 天\"）。</li>\n<li>同学全程接种 → 接触者不停学。</li>\n<li>与 pertussis / chickenpox 时限区分（见上表）。</li>\n</ul>", "diseases": ["Measles"], "complaints": [], "search": "measles 停学与接触者管理 — 知识总结\nmeasles 停学与接触者管理 — 出疹后 4 天 / 未免疫接触者 14 天\nprevention\n 麻疹传染性极强。管理核心是  index case 停学时限  与  接触者追踪隔离 ，尤其在日托/学校场景。 \n 概要 \n 麻疹传染性极强。管理核心是  index case 停学时限  与  接触者追踪隔离 ，尤其在日托/学校场景。 \n 关键知识点 \n ### index case（确诊病例）停学 \n \n 停学至  出疹后 4 天 （rash onset + 4 days）。 \n 无论是否接种疫苗，只要确诊/疑似/可能，均停学。 \n \n ### 接触者（contacts）停学（日托/学校场景） \n \n  已免疫接触者 ：不需停学。 \n  未免疫接触者 ：停学至  index case 出疹后 14 天 ；除非在接触后  72 小时内接种 mmr 。 \n \n ### 示例推演 \n \n john 3 天前出疹（index case）→ 本人停学至出疹后 4 天（即明天）。 \n ana（接触者）：曾患麻疹 → 已免疫 → 不停学。 \n josh（接触者）：全程接种 → 不停学。 \n alan / mary（接触者）：未接种 → 自今日起停学 11 天（john 出疹后 14 天）。 \n \n 表 / 对照 / 速记 \n \n   场景  停学时限   \n \n  index case  出疹后 4 天  \n  已免疫接触者  不停学  \n  未免疫接触者  index 出疹后 14 天（或接触 72h 内 mmr 可免）  \n \n \n \n   疾病  停学/隔离时限（index）   \n \n  measles  出疹后 4 天  \n  pertussis  抗生素后 5 天 / 阵咳起 21 天（或 14 天）  \n  chickenpox  所有水疱结痂（约出疹 5 天）  \n \n \n 临床要点 \n \n 麻疹停学看\"出疹后 4 天\"，不是\"疹退\"。 \n 接触者是否停学取决于 其自身免疫状态 ，不是 index case。 \n 未免疫接触者 72h 内 mmr 可截断隔离。 \n \n 常见考点 \n \n 出疹已 >4 天 → 无需停学（题眼常给\"出疹 6–7 天\"）。 \n 同学全程接种 → 接触者不停学。 \n 与 pertussis / chickenpox 时限区分（见上表）。 \n "}, {"id": "TR-Wheezing-Child", "type": "tr", "qid": 0, "title": "儿童喘息（Wheezing）— 知识总结", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Respiratory", "approach": ["diagnosis"], "topic": ["Wheezing in Children — 原因谱 / 处理层次（氧合优先）"], "difficulty": 0, "correctAnswer": "", "page": 1330, "tags": ["topic-review", "amc", "paediatrics", "respiratory", "wheezing", "asthma", "approach-diagnosis"], "cssclass": "tr-paediatrics", "color": "#2d8f96", "file": "02-Topic-Reviews/Paediatrics/TR-Wheezing-Child.md", "stem": "<p>Wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；URTI 尤其是小婴儿也可致 wheeze。处理核心是<strong>先保证氧合</strong>，再诊断性治疗。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p>Wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；URTI 尤其是小婴儿也可致 wheeze。处理核心是<strong>先保证氧合</strong>，再诊断性治疗。</p>\n<h3>关键知识点</h3>\n<p>### 喘息线索（定向）</p>\n<ul>\n<li>喂养相关 → 反流（GERD）</li>\n<li>咳 + 喘 → 哮喘</li>\n<li>体位（仰卧）→ 喉软骨软化（laryngomalacia）</li>\n<li>发热 → 感染</li>\n<li>突发单侧 → 异物吸入（foreign body）</li>\n</ul>\n<p>### 年龄线索</p>\n<ul>\n<li><12 月：bronchiolitis 最常见</li>\n<li><5 岁：asthma 最常见阵发性喘息（此龄避免确诊\"哮喘\"，用 wheeze syndrome / viral wheeze）</li>\n<li>早发喘息 → 先天问题</li>\n</ul>\n<h3>表 / 对照 / 速记</h3>\n<table class='md-table'>\n<thead><tr><th>频率</th><th>原因</th></tr></thead>\n<tbody>\n<tr><td>常见</td><td>过敏、哮喘/反应性气道病、GERD、感染（肺炎/支气营炎/支气管炎/URI）、OSA</td></tr>\n<tr><td>少见</td><td>支气管肺发育不良、异物吸入</td></tr>\n<tr><td>罕见</td><td>先天性血管异常、CHF、CF、BO、免疫缺陷、纵隔肿瘤、气管支气管畸形、PCD、肿瘤、声带功能障碍</td></tr>\n</tbody>\n</table>\n<p>### 处理层次（关键） 1. <strong>保证氧合</strong>（给氧 + 必要时入院）——先于一切 2. 沙丁胺醇试验（年龄小用雾化；诊断 + 治疗兼顾，响应支持哮喘） 3. 抗生素仅疑肺炎后 4. 胸物理价值有限 5. CXR：不响应/反复喘息者</p>\n<h3>临床要点</h3>\n<ul>\n<li>Wheeze 是任何段呼吸道狭窄，不只下呼吸道。</li>\n<li><5 岁喘息多病毒性的，避免过早贴\"哮喘\"标签。</li>\n<li>突发单侧 wheeze → 高度疑异物。</li>\n<li>处理顺序：氧合 > 支气舒张剂 > 抗感染检查。</li>\n</ul>\n<h3>常见考点</h3>\n<ul>\n<li>哮喘 = <5 岁阵发性喘息最常见。</li>\n<li>突发单侧 wheeze = 异物。</li>\n<li>处理首步是氧合，不是立即支气舒张剂。</li>\n<li>首程喘息疑哮喘可不做 CXR。</li>\n</ul>", "diseases": ["Childhood Asthma"], "complaints": [], "search": "儿童喘息（wheezing）— 知识总结\nwheezing in children — 原因谱 / 处理层次（氧合优先）\ndiagnosis\n wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；urti 尤其是小婴儿也可致 wheeze。处理核心是 先保证氧合 ，再诊断性治疗。 \n 概要 \n wheeze = 任何段呼吸道明显狭窄所致（不仅下呼吸道）；urti 尤其是小婴儿也可致 wheeze。处理核心是 先保证氧合 ，再诊断性治疗。 \n 关键知识点 \n ### 喘息线索（定向） \n \n 喂养相关 → 反流（gerd） \n 咳 + 喘 → 哮喘 \n 体位（仰卧）→ 喉软骨软化（laryngomalacia） \n 发热 → 感染 \n 突发单侧 → 异物吸入（foreign body） \n \n ### 年龄线索 \n \n  \n  \n 早发喘息 → 先天问题 \n \n 表 / 对照 / 速记 \n \n   频率  原因   \n \n  常见  过敏、哮喘/反应性气道病、gerd、感染（肺炎/支气营炎/支气管炎/uri）、osa  \n  少见  支气管肺发育不良、异物吸入  \n  罕见  先天性血管异常、chf、cf、bo、免疫缺陷、纵隔肿瘤、气管支气管畸形、pcd、肿瘤、声带功能障碍  \n \n \n ### 处理层次（关键） 1.  保证氧合 （给氧 + 必要时入院）——先于一切 2. 沙丁胺醇试验（年龄小用雾化；诊断 + 治疗兼顾，响应支持哮喘） 3. 抗生素仅疑肺炎后 4. 胸物理价值有限 5. cxr：不响应/反复喘息者 \n 临床要点 \n \n wheeze 是任何段呼吸道狭窄，不只下呼吸道。 \n  \n 突发单侧 wheeze → 高度疑异物。 \n 处理顺序：氧合 > 支气舒张剂 > 抗感染检查。 \n \n 常见考点 \n \n 哮喘 =  \n 突发单侧 wheeze = 异物。 \n 处理首步是氧合，不是立即支气舒张剂。 \n 首程喘息疑哮喘可不做 cxr。 \n "}, {"id": "AMC-Q1122", "type": "mcq", "qid": 1122, "title": "AMC-Q1122 — Vertigo in a 4-year-old boy", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["儿童眩晕 — 排查严重病因"], "difficulty": 3, "correctAnswer": "B", "page": 1342, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1122-Vertigo-Children-CNS-Workup.md", "stem": "<p>A 4-year-old boy is brought to your practice by his parents because of what they think to be vertigo. The boy suddenly starts feeling that the world is spinning around him. Each episode lasts for about one to two minutes, while the child is fully conscious. This has happened once a month for the past three months. His past medical history is unremarkable. He has had no headache, nausea, or vomiting before, during, or after the attacks. Physical examination including ear exam is normal. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Reassure the parents as this is very likely to be benign paroxysmal positional vertigo (BPPV)"}, {"letter": "B", "text": "EEG and CT scan of the head"}, {"letter": "C", "text": "Audiology and ENT referral"}, {"letter": "D", "text": "MRI of the head"}, {"letter": "E", "text": "Psychiatric assessment"}], "rationale": "<ul>\n<li>关键认知：<strong>儿童眩晕与成人不同</strong> — 儿童眩晕往往有严重病因</li>\n<li>儿童眩晕首要排查：</li>\n<li><strong>脑肿瘤</strong>（如髓母细胞瘤）</li>\n<li><strong>颞叶癫痫</strong></li>\n<li>短阵（1-2 分钟）、反复发作、伴意识保持 → 符合<strong>颞叶癫痫</strong>特征</li>\n<li>耳科检查正常 → 排除外周前庭病变</li>\n<li>下一步：先做 <strong>EEG（排查癫痫）+ CT 头部（排查占位）</strong>作为筛查</li>\n<li>各选项分析：</li>\n<li>A（安抚 + BPPV）— BPPV 罕见于儿童，是<strong>排除诊断</strong></li>\n<li>C（听力学 + ENT）— 用于外周病因，但 CNS 病因未排除</li>\n<li>D（MRI）— 更敏感但<strong>贵且需镇静</strong>，常作为 CT 后补充</li>\n<li>E（精神科）— 患儿表现不支持</li>\n</ul>", "traps": "<ul>\n<li>选 A — 把儿童眩晕当作 BPPV 草率安抚，会漏掉脑肿瘤</li>\n<li>选 D（MRI 直接上）— MRI 需镇静；先 EEG + CT 是更高效的筛查组合</li>\n</ul>", "summary": "<p><strong>儿童眩晕病因谱</strong>（按严重度排）：</p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>病因</th></tr></thead>\n<tbody>\n<tr><td><strong>CNS 严重病因（先排除）</strong></td><td>脑肿瘤（髓母细胞瘤）、颞叶癫痫、CNS 感染</td></tr>\n<tr><td>创伤</td><td>颞部外伤</td></tr>\n<tr><td>中耳病变</td><td>中耳炎</td></tr>\n<tr><td>药物/毒物</td><td>处方药、酒精、违禁药</td></tr>\n<tr><td>偏头痛相关</td><td>BPPV（儿童偏头痛变异型）</td></tr>\n<tr><td>其他</td><td>迷路炎</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：儿童眩晕 ≠ 成人眩晕。<strong>先排除脑肿瘤和癫痫</strong>，再考虑良性病因。</p>\n<p><strong>BPPV in childhood</strong> often precedes migraine in adulthood。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>虽然患者可能混淆头晕和眩晕，但儿童描述的旋转感很可能为真正的眩晕而非头晕。<strong>与成人不同，儿童眩晕常由严重原因引起，如脑肿瘤（例如髓母细胞瘤）或颞叶癫痫</strong>。</p>\n<p>在每个有眩晕的儿童中，应排除癫痫和 CNS 肿瘤作为最合适的下一步管理，且必须考虑早期转诊专科评估。</p>\n<p>除癫痫和 CNS 肿瘤外，以下情况也可引起儿童眩晕：</p>\n<ul>\n<li>CNS 感染</li>\n<li>创伤，特别是颞部创伤</li>\n<li>中耳感染</li>\n<li>处方药</li>\n<li>酒精和其他违禁药物</li>\n<li>BPPV（罕见）</li>\n<li>迷路炎</li>\n</ul>\n<ul>\n<li>（选项 A）儿童 BPPV 被认为是儿童偏头痛变异型，临床表现与该场景相似。然而，BPPV 在儿童中罕见，是一种排除性诊断，只有在排除其他原因后才能作出。<strong>虽然 CNS 肿瘤是更常见和严重的诊断，但基于匆忙的 BPPV 诊断安抚父母是不合适的</strong>。</li>\n</ul>\n<p><strong>注</strong>——儿童期 BPPV 通常先于成年期偏头痛出现。</p>\n<ul>\n<li>（选项 C）一般来说，神经科转诊（而非 ENT 转诊）是合适且安全的选择，因为 CNS 肿瘤和癫痫是儿童这种表现的主要鉴别诊断。听力学评估和 ENT 转诊在 CNS 相关原因被安全排除后才是合适的。</li>\n<li>（选项 D）如果在初步 CT 扫描评估期间怀疑 CNS 肿瘤，可考虑稍后进行 MRI。</li>\n<li>（选项 E）该儿童似乎没有精神问题，精神科评估不是合适的初始管理选择。</li>\n</ul>", "references": "<ul>\n<li>John Murtagh - Murtagh's General Practice – McGraw Hill – 6th Edition – page 530</li>\n<li>ILAE - Epilepsy Imitators</li>\n</ul>", "related": ["AMC-Q1211-Congenital-Sensorineural-Deafness"], "bodyHtml": "", "diseases": ["Childhood Vertigo"], "complaints": ["headache", "nausea/vomiting"], "search": "amc-q1122 — vertigo in a 4-year-old boy\n儿童眩晕 — 排查严重病因\n a 4-year-old boy is brought to your practice by his parents because of what they think to be vertigo. the boy suddenly starts feeling that the world is spinning around him. each episode lasts for about one to two minutes, while the child is fully conscious. this has happened once a month for the past three months. his past medical history is unremarkable. he has had no headache, nausea, or vomiting before, during, or after the attacks. physical examination including ear exam is normal. which one of the following is the most appropriate next step in management? \n correct answer is  b  \n 虽然患者可能混淆头晕和眩晕，但儿童描述的旋转感很可能为真正的眩晕而非头晕。 与成人不同，儿童眩晕常由严重原因引起，如脑肿瘤（例如髓母细胞瘤）或颞叶癫痫 。 \n 在每个有眩晕的儿童中，应排除癫痫和 cns 肿瘤作为最合适的下一步管理，且必须考虑早期转诊专科评估。 \n 除癫痫和 cns 肿瘤外，以下情况也可引起儿童眩晕： \n \n cns 感染 \n 创伤，特别是颞部创伤 \n 中耳感染 \n 处方药 \n 酒精和其他违禁药物 \n bppv（罕见） \n 迷路炎 \n \n \n （选项 a）儿童 bppv 被认为是儿童偏头痛变异型，临床表现与该场景相似。然而，bppv 在儿童中罕见，是一种排除性诊断，只有在排除其他原因后才能作出。 虽然 cns 肿瘤是更常见和严重的诊断，但基于匆忙的 bppv 诊断安抚父母是不合适的 。 \n \n  注 ——儿童期 bppv 通常先于成年期偏头痛出现。 \n \n （选项 c）一般来说，神经科转诊（而非 ent 转诊）是合适且安全的选择，因为 cns 肿瘤和癫痫是儿童这种表现的主要鉴别诊断。听力学评估和 ent 转诊在 cns 相关原因被安全排除后才是合适的。 \n （选项 d）如果在初步 ct 扫描评估期间怀疑 cns 肿瘤，可考虑稍后进行 mri。 \n （选项 e）该儿童似乎没有精神问题，精神科评估不是合适的初始管理选择。 \n "}, {"id": "AMC-Q1211", "type": "mcq", "qid": 1211, "title": "AMC-Q1211 — Rinne/Weber interpretation in a child", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["听力检查 — Rinne/Weber 解读"], "difficulty": 3, "correctAnswer": "C", "page": 1345, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1211-Congenital-Sensorineural-Deafness.md", "stem": "<p>A 10-year-old boy is referred to your clinic from his school for assessment of probable hearing deficit because he has difficulty in hearing resulting in dropped school performance. You carry out a Rinne test that is positive in both ears. A Weber test shows no lateralization; however, he has symmetrical decreased hearing threshold. Which one of the following options could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Presbycusis"}, {"letter": "B", "text": "Otosclerosis"}, {"letter": "C", "text": "Congenital sensorineural deafness"}, {"letter": "D", "text": "Chronic perforation of the tympanic membrane"}, {"letter": "E", "text": "Chronic secretory otitis media with effusion"}], "rationale": "<ul>\n<li>关键检查解读：</li>\n<li><strong>Rinne 阳性（正常）= AC > BC</strong>（气导 > 骨导），<strong>排除传导性聋</strong></li>\n<li><strong>Weber 无偏侧</strong>= 两侧听力相等（或双侧均减退但对称）</li>\n<li>综合：<strong>对称性感音神经性聋</strong></li>\n<li>排除分析：</li>\n<li>A（老年性聋）— 患儿 10 岁，<strong>年龄不符</strong></li>\n<li>B（耳硬化症）— 早期即<strong>传导性聋</strong>（Rinne 阴性）</li>\n<li>D（鼓膜穿孔）— <strong>传导性聋</strong></li>\n<li>E（分泌性中耳炎）— <strong>传导性聋</strong></li>\n<li>10 岁 + 对称性感音神经性聋 → <strong>先天性聋</strong>（孤立或综合征型）</li>\n</ul>", "traps": "<ul>\n<li>选 B（耳硬化症）— Rinne 阳性已<strong>排除传导性聋</strong></li>\n<li>选 A（老年性聋）— 儿童不会有 presbycusis</li>\n</ul>", "summary": "<p><strong>Rinne & Weber 解读</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>临床情况</th><th>Rinne</th><th>Weber</th><th>类型</th></tr></thead>\n<tbody>\n<tr><td>正常</td><td>双侧 AC>BC</td><td>无偏侧</td><td>—</td></tr>\n<tr><td>右侧传导性聋</td><td>右侧 BC>AC</td><td>偏向<strong>右</strong></td><td>传导性</td></tr>\n<tr><td>右侧感音神经性聋</td><td>右侧 AC>BC</td><td>偏向<strong>左</strong>（健侧）</td><td>感音神经性</td></tr>\n<tr><td><strong>双侧对称性感音神经性聋</strong></td><td><strong>双侧 AC>BC</strong>（阳性）</td><td><strong>无偏侧</strong></td><td>感音神经性</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：</p>\n<ul>\n<li><strong>感音神经性聋 + 儿童</strong> → 考虑<strong>先天性</strong>（孤立/综合征型，如 Waardenburg、Usher）</li>\n<li>Weber 无偏侧 ≠ 正常；可能为双侧对称性聋</li>\n<li>Rinne/Weber 是<strong>筛查</strong>，<strong>不是</strong>正式听力测试替代</li>\n</ul>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>在临床实践中常看到主诉听力损失的患者。能够区分听力损失原因所在部位是很有用的。这有助于指导进一步检查、调查和管理的需要。Rinne 试验和 Weber 试验用于鉴别传导性聋（中耳和外耳原因）和感音神经性聋（由耳蜗或第 8 对脑神经——或其中枢连接——损伤引起）。<strong>这些试验总是同时进行</strong>。Rinne 试验先做。</p>\n<p>外耳的功能是收集来自空气的声音振动并将其聚焦到鼓膜上。这些振动然后通过中耳腔的听骨链（锤骨、砧骨和镫骨）传递。镫骨通过卵圆窗（fenestra ovalis）将这些振动传递到耳蜗。声音也可以通过颅骨传递到耳蜗。耳蜗中的毛细胞将物理振动转化为动作电位，通过前庭蜗（听觉）神经中的神经传递到脑干进行进一步处理。</p>\n<p>Rinne 和 Weber 试验用于快速筛查传导性与感音神经性听力损失。Rinne 试验用于评估单耳听力损失（单侧听力损失），比较气导和通过乳突的骨导声音感知。因此，筛查传导性听力损失的存在。</p>\n<p>对于 Rinne 试验，将振动的音叉（通常 512 Hz）最初放置在每只耳后方的乳突上，直到听不到声音，以患者示意表示。然后立即将音叉放在耳朵外侧，让患者报告振动声音何时听不到。<strong>正常或 Rinne 阳性是当耳外听到的声音（气导或 AC）比耳后乳突上的声音（骨导或 BC）更大</strong>。因此，AC > BC；这是临床上正常或阳性 Rinne 结果的报告方式。在传导性听力损失中，骨导优于气导或 BC > AC，Rinne 阴性。</p>\n<p>在 Weber 试验中，将振动的音叉（通常 256 Hz 或 512 Hz）放在前额中部，或鼻上唇上方，或头顶部，与患者的耳朵等距。然后要求患者报告哪只耳朵听到的声音更大。<strong>Weber 试验结果是正常（阳性）当患者报告两侧听到的声音相同</strong>。偏侧（一侧听得更好）是由于感音神经性或传导性问题。<strong>在感音神经性听力损失患者中，正常耳比患耳听得更好</strong>。在传导性听力损失患者中，声音偏向患侧。</p>\n<p><strong>注——对称性听力损失的患者也有阳性（正常）Weber 试验结果，因为双耳受累相等且尽管存在听力损失但不发生偏侧</strong>。</p>\n<p>这两个试验的结果进行比较以定位和表征任何检测到的听力损失的性质。然而，这些试验是筛查试验，不能替代正式的听力测定。</p>\n<p><strong>该男孩双耳阳性（正常）Rinne 试验排除传导性损害</strong>。Weber 试验双耳也阳性表明没有偏侧。<strong>基于这些发现，慢性鼓膜穿孔（选项 D）、慢性分泌性中耳炎（选项 E）和耳硬化症（选项 B）从鉴别诊断中排除</strong>。该男孩应该有影响双耳相等的听力问题。</p>\n<p><strong>注</strong>——耳硬化症是一种以镫骨与砧骨融合为特征的疾病，导致传导性听力损失。该病在年轻成人中更常见。该男孩 Rinne 试验正常，所以这种情况不太可能是其听力损失的原因。</p>\n<p><strong>老年性聋（选项 A）是衰老个体感音神经性听力损失的最常见原因</strong>。10 岁男孩不太可能有老年性聋。</p>\n<p><strong>基于检查结果和儿童年龄，先天性感音神经性聋（孤立或与综合征相关）可能是最可能的诊断</strong>。</p>", "references": "<ul>\n<li>Medscape - Hearing Impairment</li>\n<li>Medscape - Genetic Sensorineural Hearing Loss</li>\n</ul>", "related": ["AMC-Q1122-Vertigo-Children-CNS-Workup"], "bodyHtml": "", "diseases": ["Sensorineural Hearing Loss"], "complaints": [], "search": "amc-q1211 — rinne/weber interpretation in a child\n听力检查 — rinne/weber 解读\n a 10-year-old boy is referred to your clinic from his school for assessment of probable hearing deficit because he has difficulty in hearing resulting in dropped school performance. you carry out a rinne test that is positive in both ears. a weber test shows no lateralization; however, he has symmetrical decreased hearing threshold. which one of the following options could be the most likely diagnosis? \n correct answer is  c  \n 在临床实践中常看到主诉听力损失的患者。能够区分听力损失原因所在部位是很有用的。这有助于指导进一步检查、调查和管理的需要。rinne 试验和 weber 试验用于鉴别传导性聋（中耳和外耳原因）和感音神经性聋（由耳蜗或第 8 对脑神经——或其中枢连接——损伤引起）。 这些试验总是同时进行 。rinne 试验先做。 \n 外耳的功能是收集来自空气的声音振动并将其聚焦到鼓膜上。这些振动然后通过中耳腔的听骨链（锤骨、砧骨和镫骨）传递。镫骨通过卵圆窗（fenestra ovalis）将这些振动传递到耳蜗。声音也可以通过颅骨传递到耳蜗。耳蜗中的毛细胞将物理振动转化为动作电位，通过前庭蜗（听觉）神经中的神经传递到脑干进行进一步处理。 \n rinne 和 weber 试验用于快速筛查传导性与感音神经性听力损失。rinne 试验用于评估单耳听力损失（单侧听力损失），比较气导和通过乳突的骨导声音感知。因此，筛查传导性听力损失的存在。 \n 对于 rinne 试验，将振动的音叉（通常 512 hz）最初放置在每只耳后方的乳突上，直到听不到声音，以患者示意表示。然后立即将音叉放在耳朵外侧，让患者报告振动声音何时听不到。 正常或 rinne 阳性是当耳外听到的声音（气导或 ac）比耳后乳突上的声音（骨导或 bc）更大 。因此，ac > bc；这是临床上正常或阳性 rinne 结果的报告方式。在传导性听力损失中，骨导优于气导或 bc > ac，rinne 阴性。 \n 在 weber 试验中，将振动的音叉（通常 256 hz 或 512 hz）放在前额中部，或鼻上唇上方，或头顶部，与患者的耳朵等距。然后要求患者报告哪只耳朵听到的声音更大。 weber 试验结果是正常（阳性）当患者报告两侧听到的声音相同 。偏侧（一侧听得更好）是由于感音神经性或传导性问题。 在感音神经性听力损失患者中，正常耳比患耳听得更好 。在传导性听力损失患者中，声音偏向患侧。 \n  注——对称性听力损失的患者也有阳性（正常）weber 试验结果，因为双耳受累相等且尽管存在听力损失但不发生偏侧 。 \n 这两个试验的结果进行比较以定位和表征任何检测到的听力损失的性质。然而，这些试验是筛查试验，不能替代正式的听力测定。 \n  该男孩双耳阳性（正常）rinne 试验排除传导性损害 。weber 试验双耳也阳性表明没有偏侧。 基于这些发现，慢性鼓膜穿孔（选项 d）、慢性分泌性中耳炎（选项 e）和耳硬化症（选项 b）从鉴别诊断中排除 。该男孩应该有影响双耳相等的听力问题。 \n  注 ——耳硬化症是一种以镫骨与砧骨融合为特征的疾病，导致传导性听力损失。该病在年轻成人中更常见。该男孩 rinne 试验正常，所以这种情况不太可能是其听力损失的原因。 \n  老年性聋（选项 a）是衰老个体感音神经性听力损失的最常见原因 。10 岁男孩不太可能有老年性聋。 \n  基于检查结果和儿童年龄，先天性感音神经性聋（孤立或与综合征相关）可能是最可能的诊断 。 "}, {"id": "AMC-Q1337", "type": "mcq", "qid": 1337, "title": "急性乳突炎 — AOM 最常见化脓性并发症", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["急性中耳炎并发症 — 急性乳突炎最常见致病菌"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1337-Acute-Mastoiditis-Pathogen.md", "stem": "<p>Rachel, 5 years old, is brought to your GP clinic by her mother because of pain and redness in the back of her left ear. According to the mother, Rachel developed fever and left ear ache one week ago, for which he was seen by another GP and started on paracetamol and amoxicillin. She was feeling better for the first 4 days but spiked a fever again and developed a painful red swelling behind her left ear. On examination, she has a warm, red, and tender swelling behind the left ear shown in the accompanying photograph. Which one of the following could be the most likely pathogenic factor for this presentation?</p>", "options": [{"letter": "A", "text": "Staphylococcus aureus."}, {"letter": "B", "text": "Streptococcus pneumoniae."}, {"letter": "C", "text": "Hemophilus influenzae."}, {"letter": "D", "text": "Moraxella catarrhalis."}, {"letter": "E", "text": "Streptococcus viridans."}], "rationale": "<p>1. 题型识别：并发症 — AOM 治疗过程中出现耳后红肿热痛 2. 关键线索：</p>\n<ul>\n<li>1 周前耳痛 + 发热，口服阿莫西林</li>\n<li>前 4 天好转 → 再次发热 + 耳后红肿热痛</li>\n<li>体格检查：左耳后温暖、红肿、压痛</li>\n<li>= AOM → 急性乳突炎（acute mastoiditis）</li>\n<p>3. 致病菌谱 = AOM 致病菌：肺炎链球菌 > 50%，流感嗜血杆菌第二 4. 锁定答案：最常见的致病菌 → B（肺炎链球菌）</p>\n</ul>", "traps": "<ul>\n<li><strong>金葡菌混淆</strong>：耳后红肿 + 抗生素部分有效 + 复发 → 容易想成金葡菌感染或脓肿。但 AOM 并发症的致病菌谱与 AOM 一致</li>\n<li><strong>流感嗜血杆菌</strong>：第二常见 ≠ 最常见，题干问 \"most likely\"</li>\n</ul>", "summary": "<p><strong>急性乳突炎</strong>（acute mastoiditis）：</p>\n<ul>\n<li>AOM 最常见的化脓性并发症</li>\n<li>可导致颅内并发症，需高度重视</li>\n<li>诊断：耳后炎性体征（红斑、水肿、压痛、波动感）+ 耳廓/外耳道水肿 + AOM 体征</li>\n<li>治疗：静脉抗生素（氟氯西林 + 三代头孢）+ 紧急 ENT 会诊，部分需手术</li>\n<li>致病菌：<strong>肺炎链球菌 > 50%</strong>，流感嗜血杆菌第二</li>\n</ul>", "explanation": "<p>1 周前单侧耳痛 + 发热病史，后出现耳后红肿压痛 — 最可能诊断为急性中耳炎并发急性乳突炎。急性乳突炎虽然罕见，但是 AOM 最常见的化脓性并发症。</p>\n<p>致病菌谱与 AOM 一致：肺炎链球菌最常见（>50% 病例），流感嗜血杆菌第二常见。金葡菌、卡他莫拉菌和草绿色链球菌在 AOM 和急性乳突炎中较少见。</p>", "references": "<ul>\n<li>(Refer to acute mastoiditis and AOM guidelines)</li>\n</ul>", "related": ["AMC-Q1343-AOM-Causative-Organism", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["fever"], "search": "急性乳突炎 — aom 最常见化脓性并发症\n急性中耳炎并发症 — 急性乳突炎最常见致病菌\n rachel, 5 years old, is brought to your gp clinic by her mother because of pain and redness in the back of her left ear. according to the mother, rachel developed fever and left ear ache one week ago, for which he was seen by another gp and started on paracetamol and amoxicillin. she was feeling better for the first 4 days but spiked a fever again and developed a painful red swelling behind her left ear. on examination, she has a warm, red, and tender swelling behind the left ear shown in the accompanying photograph. which one of the following could be the most likely pathogenic factor for this presentation? \n 1 周前单侧耳痛 + 发热病史，后出现耳后红肿压痛 — 最可能诊断为急性中耳炎并发急性乳突炎。急性乳突炎虽然罕见，但是 aom 最常见的化脓性并发症。 \n 致病菌谱与 aom 一致：肺炎链球菌最常见（>50% 病例），流感嗜血杆菌第二常见。金葡菌、卡他莫拉菌和草绿色链球菌在 aom 和急性乳突炎中较少见。 "}, {"id": "AMC-Q1343", "type": "mcq", "qid": 1343, "title": "AOM 最常见致病菌 — 肺炎链球菌", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["急性中耳炎最常见致病菌 — 肺炎链球菌"], "difficulty": 1, "correctAnswer": "B", "page": 1363, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1343-AOM-Causative-Organism.md", "stem": "<p>A 5-year-old child is brought to your practice by his parents with complaints of fever and ear pain. On examination, he is in mild distress and has a fever of 38.3°C. Otoscopic examination reveals a red bulging tympanic membrane on the right side with decreased mobility. Which one of the following is more likely to have caused this presentation?</p>", "options": [{"letter": "A", "text": "Hemophilus influenza."}, {"letter": "B", "text": "Streptococcus pneumoniae."}, {"letter": "C", "text": "Pseudomonas aeruginosa."}, {"letter": "D", "text": "RSV virus."}, {"letter": "E", "text": "Moraxella catarrhalis."}], "rationale": "<p>1. 题型识别：病因学 — AOM 的致病菌 2. 关键线索：红色膨隆鼓膜 + 活动度下降 → 典型 AOM 3. AOM 细菌学（>6 周龄）：</p>\n<ul>\n<li>肺炎链球菌 → 最常见</li>\n<li>流感嗜血杆菌 → 第二常见</li>\n<li>卡他莫拉菌、化脓性链球菌 → 其次</li>\n<p>4. RSV 在新生儿中可引起中耳炎，但肺炎链球菌仍是该年龄段最常见的病因 5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>RSV 陷阱</strong>：RSV 与新生儿肺炎/细支气管炎/中耳炎相关，但肺炎链球菌仍是该年龄段 AOM 最常见病因 — 别被年龄误导</li>\n<li><strong>流感嗜血杆菌</strong>：第二常见 ≠ 最常见</li>\n</ul>", "summary": "<p>AOM 典型体征：红色膨隆鼓膜 + 活动度下降。</p>\n<p>6 周龄儿童 AOM 最常见致病菌：<strong>肺炎链球菌</strong> > 流感嗜血杆菌 > 卡他莫拉菌 > 化脓性链球菌。其他：金葡菌、草绿色链球菌、铜绿假单胞菌。</p>\n<p>RSV 在新生儿中可引起中耳炎，但肺炎链球菌仍最常见。</p>", "explanation": "<p>红色膨隆鼓膜伴活动度下降是急性中耳炎（AOM）的经典体征。>6 周龄儿童 AOM 绝大多数由细菌引起，肺炎链球菌是各年龄段儿童 AOM 和侵袭性细菌感染最常见的病原体，其次是流感嗜血杆菌。</p>\n<p>RSV 主要在新生儿中为致病因素，与该年龄段的肺炎、细支气管炎和中耳炎相关，但即使在这一年龄段，肺炎链球菌仍是 AOM 最常见的病原体。</p>", "references": "<ul>\n<li>Therapeutic Guidelines - Antibiotics</li>\n<li>Medscape - Acute Otitis Media</li>\n</ul>", "related": ["AMC-Q1337-Acute-Mastoiditis-Pathogen", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["fever"], "search": "aom 最常见致病菌 — 肺炎链球菌\n急性中耳炎最常见致病菌 — 肺炎链球菌\n a 5-year-old child is brought to your practice by his parents with complaints of fever and ear pain. on examination, he is in mild distress and has a fever of 38.3°c. otoscopic examination reveals a red bulging tympanic membrane on the right side with decreased mobility. which one of the following is more likely to have caused this presentation? \n 红色膨隆鼓膜伴活动度下降是急性中耳炎（aom）的经典体征。>6 周龄儿童 aom 绝大多数由细菌引起，肺炎链球菌是各年龄段儿童 aom 和侵袭性细菌感染最常见的病原体，其次是流感嗜血杆菌。 \n rsv 主要在新生儿中为致病因素，与该年龄段的肺炎、细支气管炎和中耳炎相关，但即使在这一年龄段，肺炎链球菌仍是 aom 最常见的病原体。 "}, {"id": "AMC-Q1423", "type": "mcq", "qid": 1423, "title": "甲状舌管囊肿并发症 — 感染最常见", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["甲状舌管囊肿最常见并发症 — 感染"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1423-Thyroglossal-Duct-Cyst-Complication.md", "stem": "<p>A 6-year-old girl is brought to your general practice by her mother, who is concerned about a neck mass in her daughter. The mass is shown in the following photograph. The child is otherwise healthy. On examination, there is a non-tender neck mass in the midline moving with swallowing and tongue protrusion. The rest of the physical examination is unremarkable. Which one of the following could be the most likely complication of this neck mass?</p>", "options": [{"letter": "A", "text": "Infection."}, {"letter": "B", "text": "Malignancy."}, {"letter": "C", "text": "Fistula formation."}, {"letter": "D", "text": "Overgrowth and compression of underlying structures."}, {"letter": "E", "text": "Rupture."}], "rationale": "<p>1. 题型识别：并发症 — 甲状舌管囊肿的自然史 2. 关键线索：中线颈部肿块 + 随吞咽和伸舌移动 → <strong>甲状舌管囊肿</strong>（thyroglossal duct cyst, TDC） 3. TDC 并发症排序：</p>\n<ul>\n<li><strong>感染</strong> → 最常见（红肿热痛）</li>\n<li>恶变 → ≈1%（乳头状癌 > 滤泡-乳头状 > 鳞状细胞癌）</li>\n<li>压迫 → 增大压迫下方结构（气道梗阻需重点关注）</li>\n<li>破裂 + 瘘管形成</li>\n<p>4. 锁定答案：感染 → A</p>\n</ul>", "traps": "<ul>\n<li><strong>恶变混淆</strong>：恶变是第二常见并发症，≈1%，易被过度关注；但考试问 \"most likely\" 应选感染</li>\n<li><strong>\"non-tender\" 不代表不会感染</strong>：目前 non-tender 是因为未感染；感染后才会出现红肿热痛</li>\n</ul>", "summary": "<p><strong>甲状舌管囊肿（TDC）</strong>：胚胎期甲状舌管未完全退化形成的先天性中线颈部囊性病变。</p>\n<ul>\n<li>典型体征：中线肿块，<strong>随吞咽和伸舌移动</strong></li>\n<li>并发症排序：<strong>感染 > 恶变（≈1%，乳头状癌最常见）> 增大压迫（可致气道梗阻）> 破裂/瘘管形成</strong></li>\n</ul>", "explanation": "<p>甲状舌管囊肿可出现并发症，包括感染、恶变、增大压迫下方结构和破裂/瘘管形成。其中<strong>感染最常见</strong>，表现为红肿热痛。</p>\n<p>恶变约占 TDC 患者的 1%，乳头状癌最常见，其次为滤泡-乳头状癌和鳞状细胞癌。囊肿增大压迫下方结构可导致气道梗阻。</p>", "references": "<ul>\n<li>Medscape – Thyroglossal Duct Cyst Imaging</li>\n<li>PubMed - Thyroglossal Duct Cyst—More Than Just an Embryological Remnant</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "甲状舌管囊肿并发症 — 感染最常见\n甲状舌管囊肿最常见并发症 — 感染\n a 6-year-old girl is brought to your general practice by her mother, who is concerned about a neck mass in her daughter. the mass is shown in the following photograph. the child is otherwise healthy. on examination, there is a non-tender neck mass in the midline moving with swallowing and tongue protrusion. the rest of the physical examination is unremarkable. which one of the following could be the most likely complication of this neck mass? \n 甲状舌管囊肿可出现并发症，包括感染、恶变、增大压迫下方结构和破裂/瘘管形成。其中 感染最常见 ，表现为红肿热痛。 \n 恶变约占 tdc 患者的 1%，乳头状癌最常见，其次为滤泡-乳头状癌和鳞状细胞癌。囊肿增大压迫下方结构可导致气道梗阻。 "}, {"id": "AMC-Q1572", "type": "mcq", "qid": 1572, "title": "后三角区无痛性淋巴结 — FNAC 排除恶性肿瘤", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["后三角区淋巴结 + 红旗征 → FNAC 排除恶性肿瘤"], "difficulty": 3, "correctAnswer": "E", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1572-Posterior-Triangle-LN-FNA.md", "stem": "<p>A 5-year-old boy is presented to your practice with headache and vomiting for the past 6 weeks. On examination, he has a temperature of 37.8°C. A non-tender lymph node is palpated in the posterior triangle of the neck. Which one of the following is the investigation to consider at this stage?</p>", "options": [{"letter": "A", "text": "Blood culture."}, {"letter": "B", "text": "CT scan of the head."}, {"letter": "C", "text": "Urine culture."}, {"letter": "D", "text": "Lumbar puncture."}, {"letter": "E", "text": "Fine needle aspiration of the lymph node."}], "rationale": "<p>1. 题型识别：检查选择 — 儿童颈部淋巴结肿大的危险信号评估 2. 关键线索：</p>\n<ul>\n<li><strong>后三角区</strong>淋巴结 → 恶性肿瘤关联性更高</li>\n<li><strong>无痛性</strong>（non-tender）→ 非反应性</li>\n<li>头痛 + 呕吐 6 周 + 低热 → 全身性疾病线索</li>\n<li>无明确前驱病毒/细菌感染史</li>\n<p>3. 危险信号（Red flags）：</p>\n<li>后三角区/锁骨上淋巴结</li>\n<li>无痛性、固定、质硬、不规则</li>\n<li>快速增大、>2 cm</li>\n<li>全身症状</li>\n<p>4. 鉴别排除：血培养（A）/ 腰穿（D）→ 无急性感染/脑膜炎证据；CT 头（B）→ 无颅内压升高/局灶神经体征；尿培养（C）→ 无泌尿道症状 5. 锁定答案：超声引导 FNAC → E</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有头痛呕吐就查头 CT\"</strong>：无颅内压升高或局灶神经体征时，头 CT 非首选</li>\n<li><strong>反应性 vs 恶性淋巴结</strong>：反应性通常有压痛、双侧、前驱感染史；<strong>后三角区 + 无痛性</strong>应高度警惕恶性</li>\n<li><strong>观察等待 6 周</strong>：适用于高度疑似反应性淋巴结（近期感染史 + 压痛），不适用于有红旗征者</li>\n</ul>", "summary": "<p>儿童颈部淋巴结红旗征：</p>\n<ul>\n<li>后三角区或锁骨上淋巴结</li>\n<li>无痛性、质硬、不规则、固定</li>\n<li>>2 cm 或快速增大</li>\n<li>全身症状（发热、盗汗、体重下降）</li>\n</ul>\n<p>后三角区淋巴结 + 红旗征 → <strong>超声引导 FNAC</strong>（高灵敏度和特异度，但有创伤和不充分取样风险）。</p>", "explanation": "<p>该患儿有轻度发热但不确定是否持续。后三角区触及淋巴结但不清楚是否已存在 >6 周。头痛和呕吐本身非红旗征，但结合无痛性后三角区淋巴结肿大，整体临床图景指向潜在恶性疾病。后三角区淋巴结肿大与恶性肿瘤的关联性更高。</p>\n<p>因此，超声引导下细针穿刺抽吸（FNAC）是最合适的首选检查。虽然 FNAC 有创伤且存在组织取样不充分的风险，但被认为具有高灵敏度和特异度。</p>", "references": "<ul>\n<li>RACGP – AJGP - Paediatric neck lumps: An approach for the primary physician</li>\n<li>AAFP - Evaluation and Management of Neck Masses in Children</li>\n</ul>", "related": ["AMC-QNA-P1382-Paediatric-Neck-Mass", "TR-Paediatric-Neck-Masses-Approach", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": ["headache", "nausea/vomiting"], "search": "后三角区无痛性淋巴结 — fnac 排除恶性肿瘤\n后三角区淋巴结 + 红旗征 → fnac 排除恶性肿瘤\n a 5-year-old boy is presented to your practice with headache and vomiting for the past 6 weeks. on examination, he has a temperature of 37.8°c. a non-tender lymph node is palpated in the posterior triangle of the neck. which one of the following is the investigation to consider at this stage? \n 该患儿有轻度发热但不确定是否持续。后三角区触及淋巴结但不清楚是否已存在 >6 周。头痛和呕吐本身非红旗征，但结合无痛性后三角区淋巴结肿大，整体临床图景指向潜在恶性疾病。后三角区淋巴结肿大与恶性肿瘤的关联性更高。 \n 因此，超声引导下细针穿刺抽吸（fnac）是最合适的首选检查。虽然 fnac 有创伤且存在组织取样不充分的风险，但被认为具有高灵敏度和特异度。 "}, {"id": "AMC-Q1616", "type": "mcq", "qid": 1616, "title": "慢性化脓性中耳炎 — 铜绿假单胞菌的局部治疗", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["慢性化脓性中耳炎 — 铜绿假单胞菌 → 环丙沙星滴耳液"], "difficulty": 2, "correctAnswer": "C", "page": 1397, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1616-CSOM-Ciprofloxacin.md", "stem": "<p>A 6-year-old Indigenous boy presents to your practice in a rural area with purulent left ear discharge for the past 2 months. History and physical examination establish a diagnosis of chronic suppurative otitis media. Culture of the ear discharge is positive for pseudomonas aeruginosa. After ear toileting, which one of the following is the most appropriate treatment option to consider for this child?</p>", "options": [{"letter": "A", "text": "Oral Amoxicillin."}, {"letter": "B", "text": "Oral Augmentin."}, {"letter": "C", "text": "Ciprofloxacin ear drop."}, {"letter": "D", "text": "Paramycetin with steroid ear drops."}, {"letter": "E", "text": "Gentamycin ear drops."}], "rationale": "<p>1. 题型识别：治疗 — CSOM 的抗生素选择 2. 关键线索：</p>\n<ul>\n<li>慢性化脓性中耳炎（CSOM）</li>\n<li>耳分泌物培养：<strong>铜绿假单胞菌</strong></li>\n<li>耳道清洁（ear toileting）已完成</li>\n<p>3. 治疗原则：</p>\n<li>CSOM 以<strong>局部抗生素</strong>治疗为主（非口服）</li>\n<li>铜绿假单胞菌 → 氟喹诺酮类（<strong>环丙沙星</strong>滴耳液）</li>\n<p>4. 排除：</p>\n<li>口服阿莫西林/奥格门汀（A/B）：全身抗生素对 CSOM 效果有限，且无法覆盖假单胞菌</li>\n<li>庆大霉素滴耳液（E）：曾使用但<strong>听觉和前庭毒性</strong>风险使其不再是首选</li>\n<li>巴龙霉素+激素（D）：不针对假单胞菌</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>口服抗生素 vs 局部</strong>：CSOM 以<strong>局部抗生素</strong>为主（耳道清洁后滴耳），不是口服</li>\n<li><strong>庆大霉素毒性</strong>：氨基糖苷类滴耳液有听觉和前庭毒性风险，已非首选</li>\n<li><strong>假单胞菌的抗生素选择</strong>：阿莫西林/奥格门汀不覆盖假单胞菌</li>\n</ul>", "summary": "<p><strong>慢性化脓性中耳炎（CSOM）</strong>治疗： 1. <strong>耳道清洁</strong>（ear toileting）— 基础步骤 2. <strong>局部抗生素</strong>（滴耳液）— 主要治疗</p>\n<ul>\n<li>铜绿假单胞菌 → <strong>环丙沙星滴耳液</strong>（氟喹诺酮类）</li>\n<li>庆大霉素滴耳液因耳毒性风险已非首选</li>\n<p>3. 口服抗生素效果有限，不作为主要治疗</p>\n</ul>", "explanation": "<p>CSOM 是中耳通过鼓膜穿孔持续感染 >2 周。耳分泌物培养为铜绿假单胞菌。耳道清洁后，环丙沙星滴耳液是最合适的局部抗生素治疗。</p>\n<p>口服阿莫西林/奥格门汀不覆盖假单胞菌，且全身抗生素对 CSOM 效果有限。氨基糖苷类滴耳液（庆大霉素）曾用于 CSOM，但出于安全性顾虑（听觉和前庭毒性风险），现已非首选。</p>", "references": "<ul>\n<li>Therapeutic Guideline – Antibiotics</li>\n</ul>", "related": ["AMC-Q1337-Acute-Mastoiditis-Pathogen", "AMC-Q1618-Acute-Mastoiditis-Culture", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "慢性化脓性中耳炎 — 铜绿假单胞菌的局部治疗\n慢性化脓性中耳炎 — 铜绿假单胞菌 → 环丙沙星滴耳液\n a 6-year-old indigenous boy presents to your practice in a rural area with purulent left ear discharge for the past 2 months. history and physical examination establish a diagnosis of chronic suppurative otitis media. culture of the ear discharge is positive for pseudomonas aeruginosa. after ear toileting, which one of the following is the most appropriate treatment option to consider for this child? \n csom 是中耳通过鼓膜穿孔持续感染 >2 周。耳分泌物培养为铜绿假单胞菌。耳道清洁后，环丙沙星滴耳液是最合适的局部抗生素治疗。 \n 口服阿莫西林/奥格门汀不覆盖假单胞菌，且全身抗生素对 csom 效果有限。氨基糖苷类滴耳液（庆大霉素）曾用于 csom，但出于安全性顾虑（听觉和前庭毒性风险），现已非首选。 "}, {"id": "AMC-Q1618", "type": "mcq", "qid": 1618, "title": "急性乳突炎 — 第一步取培养标本", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["急性乳突炎 — 第一步取分泌物培养"], "difficulty": 2, "correctAnswer": "A", "page": 1398, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1618-Acute-Mastoiditis-Culture.md", "stem": "<p>An 8-year-old boy is brought to the Emergency Department with right ear pain and purulent discharge since yesterday and a red swelling behind the right ear since this morning. He has the history of chronic bilateral otitis media for which he underwent bilateral grommet procedure. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Take samples for culture."}, {"letter": "B", "text": "Hearing assessment."}, {"letter": "C", "text": "Antibiotics."}, {"letter": "D", "text": "CT scanning of the temporal bone."}, {"letter": "E", "text": "Involvement of an ENT consultant."}], "rationale": "<p>1. 题型识别：管理顺序 — 急性乳突炎的初始处理 2. 关键线索：</p>\n<ul>\n<li>右耳疼痛 + <strong>脓性分泌物</strong> + 耳后红肿 = 急性乳突炎</li>\n<li>慢性双侧中耳炎 + <strong>双侧 grommets 置入史</strong></li>\n<li>今晨新出现耳后红肿</li>\n<p>3. 处理顺序：</p>\n<li><strong>第一步</strong>：取分泌物/脓液培养 → 明确致病菌（慢性中耳炎背景菌谱不同）</li>\n<li>第二步：根据培养结果选用敏感抗生素</li>\n<li>第三步：ENT 会诊</li>\n<li>影像学（CT）根据需要</li>\n<p>4. 排除：听力评估（B）→ 非急性期优先；在未取培养前盲目用抗生素（C）→ 不当；CT（D）→ 非第一步 5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有脓就用抗生素\"陷阱</strong>：在慢性中耳炎/术后背景下，应<strong>先取培养</strong>再给抗生素，避免经验性用药覆盖不足</li>\n<li><strong>ENT 会诊 vs 取培养的顺序</strong>：ENT 会诊重要但取培养是第一步操作</li>\n<li><strong>急性乳突炎 vs 慢性乳突炎</strong>：急性乳突炎与 AOM 相关；慢性乳突炎与 CSOM/胆脂瘤相关</li>\n</ul>", "summary": "<p><strong>急性乳突炎（Acute Mastoiditis）</strong>：</p>\n<ul>\n<li>AOM 最常见的化脓性并发症（虽罕见但需高度重视）</li>\n<li>临床表现：耳后炎性体征（红斑、水肿、压痛、波动感）</li>\n<li>与 AOM 相关</li>\n</ul>\n<p><strong>慢性乳突炎</strong>：与 CSOM 相关，尤其与胆脂瘤形成相关。</p>\n<p>处理原则：<strong>取培养 → 根据药敏用抗生素 → ENT 会诊</strong>。</p>", "explanation": "<p>该患儿为典型急性乳突炎表现：慢性双侧中耳炎 + grommets 置入史，新出现耳痛、脓性分泌物和耳后红肿。在慢性中耳炎/术后背景下的乳突炎，致病菌谱可能与典型 AOM 不同，因此<strong>第一步取分泌物培养</strong>至关重要，以指导后续靶向抗生素治疗。</p>\n<p>急性乳突炎虽罕见，却是 AOM 最常见的化脓性并发症，可致颅内并发症。慢性乳突炎多与 CSOM 和胆脂瘤相关。</p>", "references": "<ul>\n<li>RCH - Acute otitis media</li>\n</ul>", "related": ["AMC-Q1337-Acute-Mastoiditis-Pathogen", "AMC-Q1616-CSOM-Ciprofloxacin", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性乳突炎 — 第一步取培养标本\n急性乳突炎 — 第一步取分泌物培养\n an 8-year-old boy is brought to the emergency department with right ear pain and purulent discharge since yesterday and a red swelling behind the right ear since this morning. he has the history of chronic bilateral otitis media for which he underwent bilateral grommet procedure. which one of the following is the most appropriate next step in management? \n 该患儿为典型急性乳突炎表现：慢性双侧中耳炎 + grommets 置入史，新出现耳痛、脓性分泌物和耳后红肿。在慢性中耳炎/术后背景下的乳突炎，致病菌谱可能与典型 aom 不同，因此 第一步取分泌物培养 至关重要，以指导后续靶向抗生素治疗。 \n 急性乳突炎虽罕见，却是 aom 最常见的化脓性并发症，可致颅内并发症。慢性乳突炎多与 csom 和胆脂瘤相关。 "}, {"id": "AMC-Q1620", "type": "mcq", "qid": 1620, "title": "音叉试验 — 单侧感音神经性聋", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["音叉试验 — Rinne 双侧阳性 + Weber 偏左 = 右侧感音神经性聋 → 听神经瘤"], "difficulty": 4, "correctAnswer": "E", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1620-Rinne-Weber-Acoustic-Neuroma.md", "stem": "<p>Raymond, 9 years of age, is brought to your GP clinic with right sided hearing impairment. A Rinne test shows that air conduction is better than bone conduction in both ears. Weber test indicates localization to the left ear. If the following options, which one justifies these findings?</p>", "options": [{"letter": "A", "text": "Acute otitis media."}, {"letter": "B", "text": "Acute otitis externa."}, {"letter": "C", "text": "Glue ear."}, {"letter": "D", "text": "Otosclerosis."}, {"letter": "E", "text": "Acoustic neuroma."}], "rationale": "<p>1. 题型识别：体格检查解读 — Rinne + Weber 试验定位听力损失类型 2. 音叉试验解读：</p>\n<ul>\n<li><strong>Rinne 试验</strong>（512 Hz）：AC > BC 双侧 = 双侧阳性 → <strong>排除传导性聋</strong></li>\n<li><strong>Weber 试验</strong>（256/512 Hz）：偏左 → 右耳听不到 = 右侧感音神经性聋</li>\n<p>3. 整合：Rinne 阴性 = 传导性 → 排除 A/B/C/D（AOM、外耳道炎、胶耳、耳硬化症均为传导性） 4. 单侧感音神经性聋 → <strong>听神经瘤</strong>（直至证明非此） 5. 锁定答案：E</p>\n</ul>", "traps": "<ul>\n<li><strong>Rinne 阳性/阴性 记反</strong>：AC>BC = Rinne <strong>阳性</strong>（正常）= 非传导性；BC>AC = Rinne <strong>阴性</strong> = 传导性聋</li>\n<li><strong>Weber 偏健侧 vs 偏患侧</strong>：感音神经性 → 偏<strong>健侧</strong>；传导性 → 偏<strong>患侧</strong></li>\n<li><strong>传导性病因多</strong>：A/B/C/D 均为传导性听力损失病因，Rinne 阳性已全部排除</li>\n<li><strong>儿童听神经瘤罕见但不可忽略</strong>：单侧感音神经性聋均应假定由听神经瘤引起，直至证明非此</li>\n</ul>", "summary": "<p><strong>Rinne 试验</strong>（512 Hz 音叉）：</p>\n<ul>\n<li>先放乳突（骨导 BC）→ 听不到后立即放耳前（气导 AC）</li>\n<li>AC > BC = <strong>Rinne 阳性</strong>（正常或感音神经性聋）</li>\n<li>BC > AC = <strong>Rinne 阴性</strong>（传导性聋）</li>\n</ul>\n<p><strong>Weber 试验</strong>（256/512 Hz 音叉）：</p>\n<ul>\n<li>放前额正中/上唇上方/头顶</li>\n<li>正常 = 双侧等响</li>\n<li>偏患侧 = <strong>传导性聋</strong></li>\n<li>偏健侧 = <strong>感音神经性聋</strong></li>\n</ul>\n<p><strong>听神经瘤</strong>：</p>\n<ul>\n<li>桥小脑角肿瘤的 80%（其余 20% 主要为脑膜瘤）</li>\n<li>施万细胞鞘起源（前庭或耳蜗神经）</li>\n<li>最常见的首发症状：<strong>单侧听力损失</strong></li>\n<li>任何单侧感音神经性聋均应假定为听神经瘤，直至证明非此</li>\n</ul>", "explanation": "<p>Rinne 试验示双侧 AC>BC（阳性），排除传导性听力损失。因此 AOM、外耳道炎、胶耳（分泌性中耳炎）和耳硬化症（影响听骨链）均不能解释此患儿的听力损失。</p>\n<p>Weber 试验偏左侧。结合 Rinne 阳性结果，提示右侧感音神经性听力损失。选项中仅听神经瘤可合理解释此表现。</p>\n<p>听神经瘤占桥小脑角肿瘤约 80%，首发症状多为单侧听力损失。肿瘤通过两种机制导致听力损失：直接损伤耳蜗神经或中断耳蜗血供。</p>", "references": "<ul>\n<li>RACGP – Ear examination</li>\n<li>Medscape – Acoustic Neuroma</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Sensorineural Hearing Loss"], "complaints": [], "search": "音叉试验 — 单侧感音神经性聋\n音叉试验 — rinne 双侧阳性 + weber 偏左 = 右侧感音神经性聋 → 听神经瘤\n raymond, 9 years of age, is brought to your gp clinic with right sided hearing impairment. a rinne test shows that air conduction is better than bone conduction in both ears. weber test indicates localization to the left ear. if the following options, which one justifies these findings? \n rinne 试验示双侧 ac>bc（阳性），排除传导性听力损失。因此 aom、外耳道炎、胶耳（分泌性中耳炎）和耳硬化症（影响听骨链）均不能解释此患儿的听力损失。 \n weber 试验偏左侧。结合 rinne 阳性结果，提示右侧感音神经性听力损失。选项中仅听神经瘤可合理解释此表现。 \n 听神经瘤占桥小脑角肿瘤约 80%，首发症状多为单侧听力损失。肿瘤通过两种机制导致听力损失：直接损伤耳蜗神经或中断耳蜗血供。 "}, {"id": "AMC-QNA-P1382", "type": "mcq", "qid": 0, "title": "儿童颈部肿块 — 超声为首选检查", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["儿童颈部肿块 — 超声为首选影像学检查"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-QNA-P1382-Paediatric-Neck-Mass.md", "stem": "<p>The mother of a four-year-old female child has brought her to you after she noticed a mass in her neck while giving her a bath. The mass is 2x1.5 cm in size, located in the anterior triangle of the neck, and not tender. The child is otherwise healthy and has no other concerning feature on physical examination. Which one of the following would be the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Excision of the mass."}, {"letter": "B", "text": "Fine needle aspiration cytology (FNAC)."}, {"letter": "C", "text": "Reassurance."}, {"letter": "D", "text": "Ultrasonography of the neck."}, {"letter": "E", "text": "Chest X-ray."}], "rationale": "<p>1. 题型识别：管理 — 儿童无症状颈部肿块的初始评估 2. 关键线索：4 岁、前三角区、无压痛、2×1.5 cm、无其他异常体征 3. 颈部肿块评估原则：</p>\n<ul>\n<li>非紧急肿块的首选影像学检查 = <strong>超声</strong></li>\n<li>超声可区分囊性/实性、评估大小、定位、与周围结构关系</li>\n<p>4. 排除选项：</p>\n<li>切除（A）：过早，需先明确性质</li>\n<li>FNAC（B）：超声后可考虑，非第一步</li>\n<li>Reassurance（C）：肿块持续 >6 周需进一步评估</li>\n<li>胸片（E）：除非有红旗征（TB、恶性肿瘤分期），否则无额外价值</li>\n<p>5. 锁定答案：超声 → D</p>\n</ul>", "traps": "<ul>\n<li><strong>直接 reassurance</strong>：无症状 ≠ 可 reassurance；肿块持续 >4-6 周需评估</li>\n<li><strong>直接切除/FNAC</strong>：影像学评估应先于侵入性操作</li>\n<li><strong>胸片滥用</strong>：常规颈部肿块不需要胸片</li>\n</ul>", "summary": "<p>儿童颈部肿块评估：</p>\n<ul>\n<li>中线肿块 → 先天性（甲状舌管囊肿、皮样囊肿）</li>\n<li>侧方肿块 → 淋巴结病（前/后三角区）</li>\n<li>快速增大 → 紧急转诊（气道风险/脓肿）</li>\n<li>缓慢增大（数月-数年）→ 良性肿瘤或先天性畸形</li>\n<li>炎症性 → 通常 4 周内消退；持续 >6 周需进一步评估</li>\n<li><strong>首选影像学 = 超声</strong></li>\n</ul>", "explanation": "<p>儿童颈部肿块是 GP 常见就诊原因。超声是首选影像学检查，可区分囊性和实性病变，评估大小，定位及与周围结构关系。该患儿无反应性淋巴结病的支持依据（无前驱病毒感染、无压痛等），因此 reassurance 不恰当。无红旗征时胸片无额外诊断价值。</p>", "references": "<ul>\n<li>RACGP – AJGP - Paediatric neck lumps: An approach for the primary physician</li>\n<li>AAFP - Evaluation and Management of Neck Masses in Children</li>\n</ul>", "related": ["TR-Paediatric-Neck-Masses-Approach", "AMC-Q1423-Thyroglossal-Duct-Cyst-Complication", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "儿童颈部肿块 — 超声为首选检查\n儿童颈部肿块 — 超声为首选影像学检查\n the mother of a four-year-old female child has brought her to you after she noticed a mass in her neck while giving her a bath. the mass is 2x1.5 cm in size, located in the anterior triangle of the neck, and not tender. the child is otherwise healthy and has no other concerning feature on physical examination. which one of the following would be the most appropriate next step in management? \n 儿童颈部肿块是 gp 常见就诊原因。超声是首选影像学检查，可区分囊性和实性病变，评估大小，定位及与周围结构关系。该患儿无反应性淋巴结病的支持依据（无前驱病毒感染、无压痛等），因此 reassurance 不恰当。无红旗征时胸片无额外诊断价值。 "}, {"id": "AMC-Q0815", "type": "mcq", "qid": 815, "title": "Cow's Milk Protein Allergy — 配方奶后血便 + 湿疹 + 特应质家族史", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": ["diagnosis", "differential"], "topic": ["Cow's Milk Protein Allergy", "Bloody Diarrhea", "Eczema", "Atopy", "Formula"], "difficulty": 3, "correctAnswer": "E", "page": 1311, "tags": ["mcq", "amc", "paediatrics", "gastroenterology", "cows-milk-protein-allergy", "cmPa", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q0815-Cows-Milk-Protein-Allergy.md", "stem": "<p>A mother brings her 3-week-old male baby with loose bloody bowel motions starting 2 days after formula milk was introduced. The mother is lactose-intolerant and avoids dairy. The baby is mildly dehydrated with an eczematous rash on his right cheek, afebrile. Family history: atopy (asthma, eczema) in father and older sister. Mother worries he has the same milk allergy. Which is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Lactose intolerance."}, {"letter": "B", "text": "Gastroenteritis."}, {"letter": "C", "text": "Galactosemia."}, {"letter": "D", "text": "Fructose intolerance."}, {"letter": "E", "text": "Cow's milk protein intolerance."}], "rationale": "<p>1. <strong>题型识别</strong>：婴儿配方奶引入后血便 + 湿疹 + 特应质 → 考 CMPA vs 乳糖不耐受。 2. <strong>CMPA 机制</strong>：对一种/多种牛奶蛋白的<strong>免疫</strong>反应（IgE 或非 IgE）。这把它与乳糖不耐受（非免疫不良反应）区分开。 3. <strong>临床线索</strong>：</p>\n<ul>\n<li>配方奶引入后短期内血便</li>\n<li>湿疹（atopic diathesis 表现）</li>\n<li>特应质家族史（哮喘、湿疹）</li>\n<li>母亲即使避 dairy，母乳中少量牛奶蛋白也可触发</li>\n<p>4. <strong>IgE vs 非 IgE</strong>：IgE 型可在进食后数分钟发生（荨麻疹、血管性水肿、呕吐、AD 急性发作）；其余约 42% 为迟发（AD 或胃肠症状）。 5. <strong>排除其他选项</strong>：乳糖不耐受无免疫基础、无湿疹关联；胃肠炎、半乳糖血症、果糖不耐受均不符合。 6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"母亲避 dairy = 不会过敏\"陷阱</strong>：错。母乳中微量牛奶蛋白即可触发 CMPA。</li>\n<li><strong>\"血便 = 乳糖不耐受\"陷阱</strong>：错。乳糖不耐受非免疫、无血便/湿疹特征。</li>\n<li><strong>\"湿疹 = 皮肤问题无关\"陷阱</strong>：错。湿疹是 CMPA 的 atopic 表现，是题眼。</li>\n<li><strong>混淆 CMPA 与 lactose intolerance</strong>：核心区别是<strong>免疫</strong> vs 非免疫。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Onset of bloody diarrhea shortly after introduction of formula, presence of eczema, and family history of atopy makes cow's milk protein allergy (intolerance) (CMPA) the most likely diagnosis with high certainty. CMPA results from an immunological reaction to one or more milk proteins; this distinguishes it from lactose intolerance. CMPA may be IgE or non-IgE associated; IgE cases may be atopic manifestation, with early urticaria/angioedema/vomiting/AD flare, and ~42% later GI/AD reactions. Even small amounts of cow's milk in breast milk of dairy-consuming mothers may trigger the condition.</p>", "references": "<ul>\n<li>MJA - Guidelines for the use of infant formulas to treat cows milk protein allergy: an Australian consensus panel opinion</li>\n<li>BMJ - Guidelines for the diagnosis and management of cow's milk protein allergy in infants</li>\n</ul>", "related": ["AMC-Q1337-Pyloric-Stenosis-Metabolic", "AMC-Q1331-Breastfeeding-Failure-Frequency", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["CMPA"], "complaints": [], "search": "cow's milk protein allergy — 配方奶后血便 + 湿疹 + 特应质家族史\ncow's milk protein allergy bloody diarrhea eczema atopy formula\ndiagnosis differential\n a mother brings her 3-week-old male baby with loose bloody bowel motions starting 2 days after formula milk was introduced. the mother is lactose-intolerant and avoids dairy. the baby is mildly dehydrated with an eczematous rash on his right cheek, afebrile. family history: atopy (asthma, eczema) in father and older sister. mother worries he has the same milk allergy. which is the most likely diagnosis? \n correct answer is  e  \n onset of bloody diarrhea shortly after introduction of formula, presence of eczema, and family history of atopy makes cow's milk protein allergy (intolerance) (cmpa) the most likely diagnosis with high certainty. cmpa results from an immunological reaction to one or more milk proteins; this distinguishes it from lactose intolerance. cmpa may be ige or non-ige associated; ige cases may be atopic manifestation, with early urticaria/angioedema/vomiting/ad flare, and ~42% later gi/ad reactions. even small amounts of cow's milk in breast milk of dairy-consuming mothers may trigger the condition. "}, {"id": "AMC-Q0904", "type": "mcq", "qid": 904, "title": "儿童**痛性**直肠出血 — 最常见是肛裂（便秘相关）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": ["diagnosis", "differential"], "topic": ["Anal Fissure", "Painful Rectal Bleeding", "Children", "Constipation"], "difficulty": 2, "correctAnswer": "C", "page": 1316, "tags": ["mcq", "amc", "paediatrics", "gastroenterology", "anal-fissure", "rectal-bleeding", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q0904-Anal-Fissure-Painful-Bleeding.md", "stem": "<p>Which one of the following is the most common cause of painful rectal bleeding in children?</p>", "options": [{"letter": "A", "text": "Intussusception."}, {"letter": "B", "text": "Gastroenteritis."}, {"letter": "C", "text": "Anal fissure."}, {"letter": "D", "text": "Meckel's diverticulum."}, {"letter": "E", "text": "Hemorrhoids."}], "rationale": "<p>1. <strong>题型识别</strong>：\"儿童痛性直肠出血最常见原因\" → 考便血鉴别（痛 vs 不痛）。 2. <strong>肛裂</strong>：硬便通过 + 便秘所致；便表面/尿布上鲜血红；<strong>排便痛</strong>。 3. <strong>鉴别</strong>：</p>\n<ul>\n<li>Intussusception：腹痛 + 血便，但<strong>不</strong>以排便痛为特征，也不如肛裂常见。</li>\n<li>Gastroenteritis / juvenile polyps：2–5 岁儿童便血最常见，但<strong>不</strong>伴排便痛。</li>\n<li>Meckel's：可大量便血 + 中腹腹痛，更少见。</li>\n<li>Hemorrhoids：儿童少见，也不伴痛。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"痛 = intussusception\"陷阱</strong>：错。肠套叠痛不限于排便，且不如肛裂常见。</li>\n<li><strong>\"不痛的血便 = 肛裂\"陷阱</strong>：错。肛裂必痛；不痛血便指向 Meckel's/息肉。</li>\n<li><strong>\"hemorrhoids 儿童常见\"陷阱</strong>：错。儿童罕见。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Anal fissure is the most common cause of painful rectal bleeding in childhood, usually from hard stool + constipation; bright blood on stool surface/nappy. (A) Intussusception associated with abdominal pain + bleeding, not painful defecation, less common. (B) Gastroenteritis and juvenile polyps most common causes of rectal bleeding in 2–5yo but not associated with painful defecation. (D) Meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (E) Hemorrhoids neither painful nor common in childhood.</p>", "references": "<ul>\n<li>Medscape - Pediatric Lower GI Bleeding</li>\n<li>UpToDate - Lower gastrointestinal bleeding in children: Causes and diagnostic approach</li>\n<li>AMC Handbook of Multiple Choice Questions – page 126</li>\n</ul>", "related": ["AMC-Q0905-Juvenile-Polyp-Bleeding", "AMC-Q0815-Cows-Milk-Protein-Allergy", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Anal Fissure"], "complaints": ["bleeding"], "search": "儿童**痛性**直肠出血 — 最常见是肛裂（便秘相关）\nanal fissure painful rectal bleeding children constipation\ndiagnosis differential\n which one of the following is the most common cause of painful rectal bleeding in children? \n correct answer is  c  \n anal fissure is the most common cause of painful rectal bleeding in childhood, usually from hard stool + constipation; bright blood on stool surface/nappy. (a) intussusception associated with abdominal pain + bleeding, not painful defecation, less common. (b) gastroenteritis and juvenile polyps most common causes of rectal bleeding in 2–5yo but not associated with painful defecation. (d) meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (e) hemorrhoids neither painful nor common in childhood. "}, {"id": "AMC-Q0905", "type": "mcq", "qid": 905, "title": "儿童**无痛**大量血便（2–8 岁）→ Juvenile colonic polyp", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": ["diagnosis", "differential"], "topic": ["Juvenile Colonic Polyp", "Painless Rectal Bleeding", "2-8yo", "Hamartoma"], "difficulty": 2, "correctAnswer": "C", "page": 1317, "tags": ["mcq", "amc", "paediatrics", "gastroenterology", "juvenile-polyp", "rectal-bleeding", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q0905-Juvenile-Polyp-Bleeding.md", "stem": "<p>A 7-year-old boy passed a large bloody stool this morning. No pain. Which is the most likely cause?</p>", "options": [{"letter": "A", "text": "Meckel's diverticulum."}, {"letter": "B", "text": "Duodenal ulcer."}, {"letter": "C", "text": "Colon polyp."}, {"letter": "D", "text": "Diverticulitis of the colon."}, {"letter": "E", "text": "Intussusception."}], "rationale": "<p>1. <strong>题型识别</strong>：7 岁 + 大量无痛血便 → 考儿童无痛便血鉴别。 2. <strong>Juvenile polyp</strong>：2–8 岁（高峰 3–4），良性错构瘤；<strong>无痛</strong>直肠出血；少数因息肉牵拉有下腹痛；>60% 可触及。 3. <strong>鉴别</strong>：</p>\n<ul>\n<li>Meckel's：可大量出血 + 中腹腹痛，发病更早、更少。</li>\n<li>Duodenal ulcer：更多黑便/呕血，非大量直肠出血。</li>\n<li>Diverticulitis / intussusception：此龄少见，且肠套叠常痛。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"大量血便 = Meckel's\"陷阱</strong>：错。Meckel's 可大量但更早期、伴腹痛、较少。</li>\n<li><strong>\"溃疡 = 直肠大量血\"陷阱</strong>：错。十二指肠溃疡主黑便/呕血。</li>\n<li><strong>\"intussusception 不痛\"陷阱</strong>：错。肠套叠常痛，且此龄不典型。</li>\n<li><strong>痛 vs 不痛</strong>：本题强调无痛 → 息肉。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Large painless bloody stool in a 7-year-old → juvenile colonic polyp. Benign hamartomas, age 2–8 (peak 3–4). Present with painless rectal bleeding; >60% have palpable polyp on rectal exam. (A) Meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (B) Duodenal ulcer → melena/hematemesis. (D/E) Diverticular disease and intussusception uncommon at this age; intussusception often painful.</p>", "references": "<ul>\n<li>Medscape - Pediatric Gastrointestinal Bleeding</li>\n<li>Canadian Journal of Gastroenterology - Colonic polyps in children and adolescents</li>\n</ul>", "related": ["AMC-Q0904-Anal-Fissure-Painful-Bleeding", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Juvenile Polyp"], "complaints": [], "search": "儿童**无痛**大量血便（2–8 岁）→ juvenile colonic polyp\njuvenile colonic polyp painless rectal bleeding 2-8yo hamartoma\ndiagnosis differential\n a 7-year-old boy passed a large bloody stool this morning. no pain. which is the most likely cause? \n correct answer is  c  \n large painless bloody stool in a 7-year-old → juvenile colonic polyp. benign hamartomas, age 2–8 (peak 3–4). present with painless rectal bleeding; >60% have palpable polyp on rectal exam. (a) meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (b) duodenal ulcer → melena/hematemesis. (d/e) diverticular disease and intussusception uncommon at this age; intussusception often painful. "}, {"id": "AMC-Q1042", "type": "mcq", "qid": 1042, "title": "AMC-Q1042 — Pyloric stenosis metabolic profile", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": [], "topic": ["肥厚性幽门狭窄 — 代谢紊乱"], "difficulty": 3, "correctAnswer": "D", "page": 1337, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q1042-Pyloric-Stenosis-Metabolic.md", "stem": "<p>A 5-week-old female infant is brought to your office by her parents because of 'feeding problems'. Parents tell you that their child has been vomiting after many of her feeds for the past week or so. They mention that this is a new problem, and she was previously quite healthy. For the first time, the baby's vomit was projectile and forceful last night. On examination, a mass is palpated in the epigastric area. Which one of the following is the most likely metabolic profile in this infant?</p>", "options": [{"letter": "A", "text": "Increased pH, increased K, increased Cl, increased pCO2, and increased HCO3"}, {"letter": "B", "text": "Decreased pH, decreased K, decreased Cl, increased pCO2, and decreased HCO3"}, {"letter": "C", "text": "Increased pH, increased K, decreased Cl, increased pCO2, and decreased HCO3"}, {"letter": "D", "text": "Increased pH, decreased K, decreased Cl, increased pCO2, and increased HCO3"}, {"letter": "E", "text": "Increased pH, decreased K, decreased Cl, decreased pCO2, and decreased HCO3"}], "rationale": "<ul>\n<li>典型 IHPS（婴儿肥厚性幽门狭窄）：3-6 周、餐后立即非胆汁性喷射性呕吐、上腹\"橄榄样\"肿块</li>\n<li>胃液富含 HCl 和 K⁺ → 持续呕吐丢失 → <strong>低氯低钾性代谢性碱中毒</strong></li>\n<li>代谢性碱中毒 → 呼吸代偿（呼吸变浅）→ <strong>呼吸性酸中毒</strong> → <strong>pCO2 升高</strong></li>\n<li>总结：<strong>pH↑, K↓, Cl↓, HCO3↑, pCO2↑</strong></li>\n</ul>\n<table class='md-table'>\n<thead><tr><th>指标</th><th>变化</th><th>机制</th></tr></thead>\n<tbody>\n<tr><td>pH ↑</td><td>代谢性碱中毒</td><td>丢失 H⁺、Cl⁻</td></tr>\n<tr><td>K ↓</td><td>低钾</td><td>丢失 K⁺，碱中毒促 K⁺ 内流</td></tr>\n<tr><td>Cl ↓</td><td>低氯</td><td>丢失 HCl</td></tr>\n<tr><td>HCO3 ↑</td><td>代碱</td><td>失去 H⁺ 后 HCO3⁻ 相对过剩</td></tr>\n<tr><td>pCO2 ↑</td><td>代偿性呼酸</td><td>呼吸浅慢，CO2 潴留</td></tr>\n</tbody>\n</table>", "traps": "<ul>\n<li>选 C（pH↑, K↑）— 错误：呕吐丢 K⁺，不是 K⁺ 升高</li>\n<li>选 E（pH↑, pCO2↓）— 错误：代谢性碱中毒应<strong>代偿性</strong>通气下降，pCO2 <strong>升高</strong></li>\n</ul>", "summary": "<p><strong>肥厚性幽门狭窄（IHPS）要点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>发病年龄</td><td>3-6 周（高峰 4-8 周）</td></tr>\n<tr><td>性别</td><td>男:女 = 4-6:1</td></tr>\n<tr><td>呕吐特点</td><td>非胆汁性、餐后立即、进行性加重、<strong>喷射性</strong>、\"饥饿呕吐者\"</td></tr>\n<tr><td>体征</td><td>右上腹\"橄榄样\"肿块（呕吐后更易触及）</td></tr>\n<tr><td>代谢</td><td><strong>低氯低钾性代谢性碱中毒 + 呼吸性酸中毒代偿</strong></td></tr>\n<tr><td>治疗</td><td>手术（Ramstedt 幽门肌切开术）</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：不要被低氯低钾性代碱的口诀（pH↑, K↓, Cl⁻, HCO3↑）误导而忘记 pCO2 也升高。</p>", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>该场景描述了婴儿肥厚性幽门狭窄（IHPS）的典型表现。<strong>IHPS 在男孩中比女孩更常见（4:1 至 6:1）</strong>。</p>\n<p>IHPS 典型表现为 3-6 周龄婴儿餐后立即非胆汁性喷射性呕吐。呕吐后，婴儿立即要求再吃（\"饥饿呕吐者\"）。</p>\n<p>查体时，婴儿脱水，在右上腹腹直肌外侧缘可触及\"橄榄样\"肿块。肿块在呕吐后最容易触及。</p>\n<p><strong>胃液富含盐酸和钾</strong>。通过呕吐丢失胃液导致<strong>低氯性代谢性碱中毒</strong>。起初钾正常，但随着呕吐持续出现低钾血症。代谢性碱中毒与 HCO3 增加相关。为代偿代谢性碱中毒，发生呼吸性酸中毒，伴 CO2 动脉压（pCO2）增加。</p>\n<p>基于以上，<strong>长期呕吐患者预期的代谢表现将是 pH 增加（代谢性碱中毒）、血钾和氯降低、HCO3 和 pCO2 增加</strong>。</p>", "references": "<ul>\n<li>RCH - Pyloric stenosis</li>\n<li>Medscape - Pediatric Hypertrophic Pyloric Stenosis</li>\n<li>UpToDate - Infantile hypertrophic pyloric stenosis</li>\n</ul>", "related": ["AMC-Q1118-Pyloric-Stenosis-Vomiting-Timing"], "bodyHtml": "", "diseases": ["Pyloric Stenosis"], "complaints": ["feeding difficulty", "nausea/vomiting"], "search": "amc-q1042 — pyloric stenosis metabolic profile\n肥厚性幽门狭窄 — 代谢紊乱\n a 5-week-old female infant is brought to your office by her parents because of 'feeding problems'. parents tell you that their child has been vomiting after many of her feeds for the past week or so. they mention that this is a new problem, and she was previously quite healthy. for the first time, the baby's vomit was projectile and forceful last night. on examination, a mass is palpated in the epigastric area. which one of the following is the most likely metabolic profile in this infant? \n correct answer is  d  \n 该场景描述了婴儿肥厚性幽门狭窄（ihps）的典型表现。 ihps 在男孩中比女孩更常见（4:1 至 6:1） 。 \n ihps 典型表现为 3-6 周龄婴儿餐后立即非胆汁性喷射性呕吐。呕吐后，婴儿立即要求再吃（\"饥饿呕吐者\"）。 \n 查体时，婴儿脱水，在右上腹腹直肌外侧缘可触及\"橄榄样\"肿块。肿块在呕吐后最容易触及。 \n  胃液富含盐酸和钾 。通过呕吐丢失胃液导致 低氯性代谢性碱中毒 。起初钾正常，但随着呕吐持续出现低钾血症。代谢性碱中毒与 hco3 增加相关。为代偿代谢性碱中毒，发生呼吸性酸中毒，伴 co2 动脉压（pco2）增加。 \n 基于以上， 长期呕吐患者预期的代谢表现将是 ph 增加（代谢性碱中毒）、血钾和氯降低、hco3 和 pco2 增加 。 "}, {"id": "AMC-Q1118", "type": "mcq", "qid": 1118, "title": "AMC-Q1118 — Pyloric stenosis — characteristic vomiting timing", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": [], "topic": ["肥厚性幽门狭窄 — 呕吐时间"], "difficulty": 2, "correctAnswer": "C", "page": 1339, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q1118-Pyloric-Stenosis-Vomiting-Timing.md", "stem": "<p>Which one of the following is suggestive of hypertrophic pyloric stenosis?</p>", "options": [{"letter": "A", "text": "Vomiting after 1 hour of feeding"}, {"letter": "B", "text": "Vomiting immediately after feeding"}, {"letter": "C", "text": "Vomiting after few minutes of feeding"}, {"letter": "D", "text": "Bilious vomiting"}, {"letter": "E", "text": "Vomiting after 2 hours of feeding"}], "rationale": "<ul>\n<li>HPS（肥厚性幽门狭窄）呕吐时间特点：</li>\n<li>出现时间：2-9 周龄（典型 4-8 周）</li>\n<li><strong>餐后数分钟内</strong>（最典型，30 分钟内）</li>\n<li>起初不频繁，渐变为几乎每餐都吐</li>\n<li>强度进行性加重 → 特征性<strong>喷射性</strong>呕吐</li>\n<li>关键鉴别：</li>\n<li><strong>非胆汁性</strong>（胃出口梗阻，胆汁不返流）</li>\n<li>偶尔有少量咖啡渣样物或鲜血</li>\n<li>患儿通常不发热、貌似不病，\"饥饿呕吐者\"（吐后仍要吃）</li>\n<li>各选项分析：</li>\n<li>A（1 小时后）：不典型</li>\n<li>B（餐后立即）：太快，不符合\"几分钟后\"的典型</li>\n<li>D（<strong>胆汁性</strong>）：<strong>不符合</strong> — 梗阻在胃出口，胆汁不返流；胆汁性呕吐要警惕肠梗阻！</li>\n<li>E（2 小时后）：太晚</li>\n</ul>", "traps": "<ul>\n<li>选 D（胆汁性）— 这是<strong>最关键陷阱</strong>；HPS = <strong>非胆汁性</strong>呕吐</li>\n<li>选 B — \"立即\"是过饱/胃食管返流，HPS 是<strong>几分钟后</strong></li>\n</ul>", "summary": "<p><strong>新生儿呕吐鉴别（按胆汁性分）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>病因</th><th>呕吐时间</th><th>胆汁性</th></tr></thead>\n<tbody>\n<tr><td><strong>肥厚性幽门狭窄</strong></td><td>餐后<strong>数分钟</strong></td><td><strong>否</strong></td></tr>\n<tr><td>胃食管返流</td><td>餐后立即</td><td>否</td></tr>\n<tr><td>先天性十二指肠闭锁</td><td>餐后</td><td><strong>是</strong></td></tr>\n<tr><td>空肠/回肠闭锁</td><td>餐后</td><td>是</td></tr>\n<tr><td>肠旋转不良/中肠扭转</td><td>餐后</td><td>是（急症！）</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：<strong>胆汁性呕吐 + 新生儿 = 警惕肠梗阻/中肠扭转 → 急症手术评估</strong>。</p>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>肥厚性幽门狭窄（HPS）由幽门环形肌进行性增厚引起</strong>。这导致胃出口狭窄。该病通常在 2-4 周至 6-9 周龄之间发病。</p>\n<p>HPS 的易感因素：</p>\n<ul>\n<li>男性</li>\n<li>第一胎</li>\n<li>白人</li>\n<li>父母 HPS 病史（母亲患病时更高）</li>\n</ul>\n<p>HPS 最初典型表现为 2-9 周龄（通常 4-8 周龄）的非血性、非胆汁性呕吐。最初呕吐可能不频繁，但数天后变为更可预测，几乎在每次喂奶时都发生。</p>\n<p><strong>呕吐发生在餐后第一小时内，但典型时间是最初几分钟内（最多 30 分钟）</strong>。呕吐强度增加直至出现典型的病理性喷射性呕吐。</p>\n<p>偶尔可观察到少量鲜血或咖啡渣样物的少量呕血。患者通常不显病容或发热。<strong>疾病早期的婴儿仍然饥饿，呕吐后用力吸吮</strong>（饥饿呕吐者）。</p>\n<p>诊断长期延迟可导致脱水、体重不增、营养不良、代谢改变和嗜睡。父母常报告尝试多种不同的婴儿配方奶，因为他们（或其医生）认为呕吐是由于不耐受所致。</p>", "references": "<ul>\n<li>RCH - Pyloric stenosis</li>\n<li>Medscape - Pediatric Hypertrophic Pyloric Stenosis</li>\n<li>Kidshealth - Pyloric Stenosis</li>\n</ul>", "related": ["AMC-Q1042-Pyloric-Stenosis-Metabolic"], "bodyHtml": "", "diseases": ["Pyloric Stenosis"], "complaints": [], "search": "amc-q1118 — pyloric stenosis — characteristic vomiting timing\n肥厚性幽门狭窄 — 呕吐时间\n which one of the following is suggestive of hypertrophic pyloric stenosis? \n correct answer is  c  \n  肥厚性幽门狭窄（hps）由幽门环形肌进行性增厚引起 。这导致胃出口狭窄。该病通常在 2-4 周至 6-9 周龄之间发病。 \n hps 的易感因素： \n \n 男性 \n 第一胎 \n 白人 \n 父母 hps 病史（母亲患病时更高） \n \n hps 最初典型表现为 2-9 周龄（通常 4-8 周龄）的非血性、非胆汁性呕吐。最初呕吐可能不频繁，但数天后变为更可预测，几乎在每次喂奶时都发生。 \n  呕吐发生在餐后第一小时内，但典型时间是最初几分钟内（最多 30 分钟） 。呕吐强度增加直至出现典型的病理性喷射性呕吐。 \n 偶尔可观察到少量鲜血或咖啡渣样物的少量呕血。患者通常不显病容或发热。 疾病早期的婴儿仍然饥饿，呕吐后用力吸吮 （饥饿呕吐者）。 \n 诊断长期延迟可导致脱水、体重不增、营养不良、代谢改变和嗜睡。父母常报告尝试多种不同的婴儿配方奶，因为他们（或其医生）认为呕吐是由于不耐受所致。 "}, {"id": "AMC-Q1008", "type": "mcq", "qid": 1008, "title": "AMC-Q1008 — Labial adhesion in a 10-year-old girl", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["阴唇粘连"], "difficulty": 2, "correctAnswer": "A", "page": 1333, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1008-Labial-Adhesion-Reassurance.md", "stem": "<p>A 10-year-old girl is being assessed in your clinic with complaints of labial fusion. She has the past history of vulvovaginitis which has been successfully treated. The child reports no voiding difficulties. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Reassurance"}, {"letter": "B", "text": "Surgical separation of adhesions"}, {"letter": "C", "text": "Encourage good hygiene"}, {"letter": "D", "text": "Antibiotics"}, {"letter": "E", "text": "Manual separation of adhesions"}], "rationale": "<ul>\n<li><strong>阴唇粘连</strong>（labial agglutination）= 两侧小阴唇内侧缘粘连</li>\n<li>病因：青春期前阴道黏膜薄（正常生理）+ 局部刺激（如外阴阴道炎）</li>\n<li><strong>是正常变异</strong>，<strong>青春期后会自发消退</strong></li>\n<li>关键判断：<strong>无症状（能正常排尿）→ 不需任何治疗，仅需安抚</strong></li>\n<li>治疗仅在出现泌尿道症状时考虑</li>\n<li>各选项分析：</li>\n<li>B（手术分离）：复发率高，不推荐</li>\n<li>C（良好卫生）：建议但对治疗粘连无效</li>\n<li>D（抗生素）：无用</li>\n<li>E（手法分离）：儿童痛苦，复发率高，不推荐</li>\n</ul>", "traps": "<ul>\n<li>一看到\"粘连\"就想到\"分离\" — 错误，<strong>无症状不处理</strong></li>\n<li>区分：手术/手法分离 → 仅在有泌尿道症状时</li>\n</ul>", "summary": "<p><strong>Labial adhesion 管理阶梯</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>情况</th><th>处理</th></tr></thead>\n<tbody>\n<tr><td><strong>无症状</strong>（如本例）</td><td><strong>观察 + 安抚</strong></td></tr>\n<tr><td>排尿困难</td><td>短期外用雌激素软膏（少数用）</td></tr>\n<tr><td>严重病例</td><td>极少需要手术分离（复发率极高）</td></tr>\n</tbody>\n</table>\n<p><strong>关键点</strong>：阴唇粘连是青春期前正常变异，多数自发消退。<strong>不要过度干预</strong>。</p>", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>阴唇粘连（labial agglutination）发生于两侧小阴唇内侧缘粘连，常有外阴阴道炎的背景病史。这可能由于阴道黏膜薄（青春期前的正常状态）和轻微刺激（如外阴阴道炎）共同作用所致。</p>\n<p><strong>这是一种正常变异，在儿童期晚期会自发消退</strong>。只要儿童能够容易地排尿，除了安抚之外不需要任何治疗。</p>\n<ul>\n<li>（选项 B）手术分离粘连后涂抹凡士林和/或雌激素软膏可用于有泌尿道症状的儿童。然而，由于复发率高，一般不推荐这种方法。</li>\n<li>（选项 C）虽然鼓励良好的卫生是一个好建议，但对治疗该病无效。</li>\n<li>（选项 D）抗生素在阴唇粘连的管理中没有作用。</li>\n<li>（选项 E）手法分离粘连会让儿童感到痛苦，且复发风险高，不推荐。</li>\n</ul>", "references": "<ul>\n<li>RCH - Prepubescent gynaecology</li>\n</ul>", "related": ["TR-Labial-Adhesion"], "bodyHtml": "", "diseases": ["Labial Adhesion"], "complaints": [], "search": "amc-q1008 — labial adhesion in a 10-year-old girl\n阴唇粘连\n a 10-year-old girl is being assessed in your clinic with complaints of labial fusion. she has the past history of vulvovaginitis which has been successfully treated. the child reports no voiding difficulties. which one of the following is the most appropriate next step in management? \n correct answer is  a  \n 阴唇粘连（labial agglutination）发生于两侧小阴唇内侧缘粘连，常有外阴阴道炎的背景病史。这可能由于阴道黏膜薄（青春期前的正常状态）和轻微刺激（如外阴阴道炎）共同作用所致。 \n  这是一种正常变异，在儿童期晚期会自发消退 。只要儿童能够容易地排尿，除了安抚之外不需要任何治疗。 \n \n （选项 b）手术分离粘连后涂抹凡士林和/或雌激素软膏可用于有泌尿道症状的儿童。然而，由于复发率高，一般不推荐这种方法。 \n （选项 c）虽然鼓励良好的卫生是一个好建议，但对治疗该病无效。 \n （选项 d）抗生素在阴唇粘连的管理中没有作用。 \n （选项 e）手法分离粘连会让儿童感到痛苦，且复发风险高，不推荐。 \n "}, {"id": "AMC-Q1287", "type": "mcq", "qid": 1287, "title": "24 月龄发育里程碑", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["24 月龄语言发育里程碑 — 代词和介词"], "difficulty": 2, "correctAnswer": "A", "page": 1352, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1287-24-Month-Development-Milestones.md", "stem": "<p>A 24-month female child is brought for assessment of development. Which one of the following is expected to develop at this age?</p>", "options": [{"letter": "A", "text": "Knowing two pronouns."}, {"letter": "B", "text": "Naming four colors."}, {"letter": "C", "text": "Knowing her age."}, {"letter": "D", "text": "Knowing her family name."}, {"letter": "E", "text": "Speaking in full sentences."}], "rationale": "<p>1. 题型识别：发育里程碑 — 各年龄段的正常发育范围 2. 关键线索：24 月龄（2 岁）女性幼儿 3. 鉴别排除：</p>\n<ul>\n<li>命名颜色（B）：3-5 岁 / 知道年龄（C）：5 岁后 / 知道姓氏（D）：约 4 岁 / 完整句子（E）：3-5 岁</li>\n<p>4. 锁定答案：24 月龄能掌握代词和介词 → A</p>\n</ul>", "traps": "<ul>\n<li><strong>年龄陷阱</strong>：选项 B-E 都是正常发育里程碑，但对应更高年龄段（3-5 岁），易与 2 岁混淆</li>\n<li><strong>\"知道年龄\"</strong>：常识觉得 2 岁该知道年龄了，但实际里程碑在 5 岁后</li>\n</ul>", "summary": "<p>24 月龄（2 岁）语言发育里程碑：说名字、说多个单词（主要是名词）、开始使用 1-2 个词的短句（如 \"want milk\"）。掌握代词和介词是该年龄段可达成的里程碑。</p>", "explanation": "<p>各选项对应年龄：</p>\n<ul>\n<li><strong>A. 知道两个代词</strong>：24 月龄可达成的语言发育里程碑</li>\n<li><strong>B. 命名四种颜色</strong>：3-5 岁之间获得的能力，对这个孩子来说太早</li>\n<li><strong>C. 知道自己的年龄</strong>：通常在 5 岁之后获得的能力</li>\n<li><strong>D. 知道家族姓氏</strong>：约 4 岁的预期能力；如果 5 岁时还不能说出家族姓氏应考虑评估</li>\n<li><strong>E. 说完整句子</strong>：3-5 岁间正常达成的语言发育里程碑，24 月龄不预期</li>\n</ul>", "references": "<ul>\n<li>Developmental milestones and the Early Years Learning Framework and the National Quality Standards</li>\n</ul>", "related": ["AMC-Q1288-14-Month-Normal-Development", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "24 月龄发育里程碑\n24 月龄语言发育里程碑 — 代词和介词\n a 24-month female child is brought for assessment of development. which one of the following is expected to develop at this age? \n 各选项对应年龄： \n \n  a. 知道两个代词 ：24 月龄可达成的语言发育里程碑 \n  b. 命名四种颜色 ：3-5 岁之间获得的能力，对这个孩子来说太早 \n  c. 知道自己的年龄 ：通常在 5 岁之后获得的能力 \n  d. 知道家族姓氏 ：约 4 岁的预期能力；如果 5 岁时还不能说出家族姓氏应考虑评估 \n  e. 说完整句子 ：3-5 岁间正常达成的语言发育里程碑，24 月龄不预期 \n "}, {"id": "AMC-Q1288", "type": "mcq", "qid": 1288, "title": "14 月龄发育正常 — 语言迟缓的判断时机", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["14 月龄发育正常 — 语言迟缓的判断时机"], "difficulty": 2, "correctAnswer": "C", "page": 1353, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1288-14-Month-Normal-Development.md", "stem": "<p>Parents of a 14-month-old boy has brought him for evaluation because they think their baby lags behind language development milestones because he does not speak any words and only babbles. He is the outcome of an uneventful pregnancy and was born through an uncomplicated vaginal delivery. He has not had any medical problems to date except few episodes of upper respiratory tract infections. He started rolling over at the age of 4 months, can sit without support from the age of 8 months and has started unaided walking recently. He transfers objects from one hand to the other and plays and enjoys peak-a-boo. Which one of the following this child have?</p>", "options": [{"letter": "A", "text": "Language delay."}, {"letter": "B", "text": "Social delay."}, {"letter": "C", "text": "Normal development."}, {"letter": "D", "text": "Fine motor delay."}, {"letter": "E", "text": "Gross motor delay."}], "rationale": "<p>1. 题型识别：发育评估 — 判断是否为发育迟缓 2. 关键线索：</p>\n<ul>\n<li>翻身 4 月龄（正常 0-4 月龄）✓</li>\n<li>独立坐 8 月龄（正常 8-12 月龄）✓</li>\n<li>独立行走近 14 月龄（正常 1-2 岁）✓</li>\n<li>物体换手（正常 8-12 月龄）✓</li>\n<li>躲猫猫（正常 4-8 月龄）✓</li>\n<li>仅咿呀学语无词（14 月龄，正常）</li>\n<p>3. 鉴别排除：所有运动里程碑均正常 → 排除 D/E；躲猫猫 = 社交/认知正常 → 排除 B；14 月龄仅咿呀学语仍在正常范围 → 排除 A 4. 锁定答案：全面发育正常 → C</p>\n</ul>", "traps": "<ul>\n<li><strong>家长焦虑陷阱</strong>：家长担心 ≠ 实际发育迟缓；14 月龄仅咿呀学语属正常</li>\n<li><strong>里程碑年龄范围宽</strong>：1-2 岁语言里程碑很宽泛（说名字 → 多词 → 短句），不应过早下\"delay\"判断</li>\n<li><strong>\"delay\" 与 \"impairment\" 混淆</strong>：delay 暗示将来可能追上，此时并非病态</li>\n</ul>", "summary": "<p>发育里程碑五大领域：Physical / Social / Emotional / Cognitive / Language。</p>\n<p>1-2 岁语言预期：说名字 → 说多个词（主要是命名词）→ 开始使用 1-2 词短句（如 \"want milk\"）。14 月龄仅咿呀学语属正常范围。语言迟缓需在 <strong>24 月龄后</strong>仍仅咿呀学语才考虑。</p>", "explanation": "<p>该患儿所有运动里程碑均在正常范围：</p>\n<ul>\n<li>翻身 4 月龄（正常 0-4 月龄）</li>\n<li>独立坐 8 月龄（正常 8-12 月龄）</li>\n<li>物体换手（正常 8-12 月龄）</li>\n<li>独立行走（正常 1-2 岁）</li>\n<li>躲猫猫（正常 4-8 月龄，认知里程碑）</li>\n</ul>\n<p>无精细运动（D）或粗大运动（E）迟缓。无社交迟缓证据（B）。关于语言，1-2 岁预期：说名字 → 多词 → 开始使用 1-2 词短句。14 月龄仍有充足时间达成这些里程碑。语言迟缓需在 24 月龄后仍只咿呀学语才需关注。</p>", "references": "<ul>\n<li>Developmental milestones and the Early Years Learning Framework and the National Quality Standards</li>\n</ul>", "related": ["AMC-Q1287-24-Month-Development-Milestones", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "14 月龄发育正常 — 语言迟缓的判断时机\n14 月龄发育正常 — 语言迟缓的判断时机\n parents of a 14-month-old boy has brought him for evaluation because they think their baby lags behind language development milestones because he does not speak any words and only babbles. he is the outcome of an uneventful pregnancy and was born through an uncomplicated vaginal delivery. he has not had any medical problems to date except few episodes of upper respiratory tract infections. he started rolling over at the age of 4 months, can sit without support from the age of 8 months and has started unaided walking recently. he transfers objects from one hand to the other and plays and enjoys peak-a-boo. which one of the following this child have? \n 该患儿所有运动里程碑均在正常范围： \n \n 翻身 4 月龄（正常 0-4 月龄） \n 独立坐 8 月龄（正常 8-12 月龄） \n 物体换手（正常 8-12 月龄） \n 独立行走（正常 1-2 岁） \n 躲猫猫（正常 4-8 月龄，认知里程碑） \n \n 无精细运动（d）或粗大运动（e）迟缓。无社交迟缓证据（b）。关于语言，1-2 岁预期：说名字 → 多词 → 开始使用 1-2 词短句。14 月龄仍有充足时间达成这些里程碑。语言迟缓需在 24 月龄后仍只咿呀学语才需关注。 "}, {"id": "AMC-Q1312", "type": "mcq", "qid": 1312, "title": "儿童 BMI 评估 — 必须使用性别特异性百分位图", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["儿童 BMI 百分位评估 — 必须使用性别特异性百分位图"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1312-Childhood-BMI-Obesity.md", "stem": "<p>A 7-year-old boy weighs 30 kg and has a body mass index of 19.5 kg/m². Which one of the following is correct regarding his weight and BMI (use the following chart for calculation)?</p>", "options": [{"letter": "A", "text": "He is underweight."}, {"letter": "B", "text": "He is overweight."}, {"letter": "C", "text": "He has normal weight."}, {"letter": "D", "text": "He is obese."}, {"letter": "E", "text": "BMI is not applicable in children."}], "rationale": "<p>1. 题型识别：定义/分类 — 儿童体重状态评估工具选择 2. 关键线索：7 岁男孩、30 kg、BMI 19.5 kg/m² 3. 核心原则：<strong>儿童 BMI 非固定数值</strong>，必须按性别特异性 BMI 百分位图解读</p>\n<ul>\n<li>同一 BMI 值在不同年龄段含义不同：17 岁男生 BMI 20 = 正常，6 岁男生 BMI 20 = 肥胖</li>\n<p>4. 假选项排除：</p>\n<li>BMI 在儿童中<strong>适用</strong>（E 错），但需用百分位图而非固定阈值</li>\n<li>按本题提供的图表，19.5 在 7 岁男生的肥胖区域</li>\n<p>5. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>成人 BMI 思维陷阱</strong>：成人 BMI 19.5 是正常偏低，惯性思维会选\"正常\"或\"偏瘦\"；但<strong>儿童 BMI 必须用百分位图</strong></li>\n<li><strong>过度解读\"underweight\"</strong>：30 kg、7 岁听起来\"偏重\"→ 不会选 underweight（A），但容易选 normal（C）或 overweight（B）</li>\n<li><strong>\"BMI not applicable\"</strong>：BMI 绝对适用于儿童，只是解读方式不同（用百分位图而非固定阈值）</li>\n</ul>", "summary": "<p>儿童（2-18 岁）BMI 评估核心原则：</p>\n<ul>\n<li>由于身体成分随正常生长和青春期阶段变化，<strong>儿童 BMI 不是固定标准</strong></li>\n<li>BMI = 体重 (kg) / 身高² (m²)</li>\n<li>必须将 BMI 值<strong>绘制在性别特异性 BMI 百分位图上</strong>判断落入哪个区域</li>\n<li>同一 BMI 值（如 20 kg/m²）：17 岁男生 = 正常，6 岁男生 = 肥胖</li>\n</ul>", "explanation": "<p>由于身体成分随正常生长和青春期阶段变化，儿童 BMI 不是一个像成人那样的固定标准。儿童（2-18 岁）BMI 解读<strong>必须</strong>绘制在性别特异性 BMI 百分位图上。</p>\n<ul>\n<li>一名 17 岁男孩 BMI 20 kg/m² 在正常范围内</li>\n<li>一名 6 岁男孩同一 BMI 值则为肥胖</li>\n</ul>\n<p>此患儿的 BMI 在性别特异性 BMI 百分位图上落入\"肥胖\"区域（参考图表）。</p>\n<p>若配合性别特异性百分位图使用，BMI 在儿童中的评估效能与成人相同。</p>", "references": "<ul>\n<li>RACGP - Adolescent overweight and obesity</li>\n<li>NHMRC - Clinical Practice Guidelines for the management of overweight and obesity</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "儿童 bmi 评估 — 必须使用性别特异性百分位图\n儿童 bmi 百分位评估 — 必须使用性别特异性百分位图\n a 7-year-old boy weighs 30 kg and has a body mass index of 19.5 kg/m². which one of the following is correct regarding his weight and bmi (use the following chart for calculation)? \n 由于身体成分随正常生长和青春期阶段变化，儿童 bmi 不是一个像成人那样的固定标准。儿童（2-18 岁）bmi 解读 必须 绘制在性别特异性 bmi 百分位图上。 \n \n 一名 17 岁男孩 bmi 20 kg/m² 在正常范围内 \n 一名 6 岁男孩同一 bmi 值则为肥胖 \n \n 此患儿的 bmi 在性别特异性 bmi 百分位图上落入\"肥胖\"区域（参考图表）。 \n 若配合性别特异性百分位图使用，bmi 在儿童中的评估效能与成人相同。 "}, {"id": "AMC-Q1397", "type": "mcq", "qid": 1397, "title": "超重儿童的初始检查 — TSH 排除甲减", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["超重儿童 — TSH 筛查排除甲状腺功能减退"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1397-Overweight-Child-TSH.md", "stem": "<p>Parents of an 11-year-old boy have brought him to your clinic for assessment because they believe he is obese. On examination, his weight and height are on 90 and 50 percentiles for sex- and age-matched growth charts respectively. Which one of the following is the most appropriate investigation to consider for him?</p>", "options": [{"letter": "A", "text": "GH."}, {"letter": "B", "text": "FSH and LH."}, {"letter": "C", "text": "TSH."}, {"letter": "D", "text": "Bone age."}, {"letter": "E", "text": "Reassure he has normal growth and investigation is required."}], "rationale": "<p>1. 题型识别：检查选择 — 超重儿童的病因筛查 2. 关键线索：体重 90 百分位 + 身高 50 百分位 → <strong>超重</strong>（BMI >85 百分位） 3. 继发性肥胖的鉴别：甲减是最需要考虑的可治疗性病因</p>\n<ul>\n<li>GH（A）：矮身材才需评估，此患儿身高正常（50 百分位）</li>\n<li>FSH/LH（B）：青春期延迟才需评估</li>\n<li>骨龄（D）：矮身材的初始评估，不适用于超重</li>\n<li>仅 reassurance（E）：超重不能单纯 reassurance，需排查继发原因</li>\n<p>4. 锁定答案：TSH → C</p>\n</ul>", "traps": "<ul>\n<li><strong>\"身高正常就不用查\"陷阱</strong>：身高 50 百分位看起来正常，但不能因此 reassurance（E）；超重需要排查继发原因</li>\n<li><strong>GH 混淆</strong>：矮身材才查 GH，此患儿身高正常</li>\n<li><strong>骨龄混淆</strong>：骨龄用于矮身材评估，不用于超重</li>\n</ul>", "summary": "<p>儿童超重/肥胖评估要点：</p>\n<ul>\n<li>BMI 必须用性别特异性百分位图（US-CDC: >85 百分位超重, >95 百分位肥胖）</li>\n<li>儿童期超重肥胖持续到成年的风险随年龄和父母肥胖而增加</li>\n<li><strong>父母体重是儿童体重的最强预测因素之一</strong></li>\n<li>超重/肥胖患儿需排除继发性原因：<strong>TSH（筛查甲减）</strong></li>\n<li>临床评估还包括：青春期阶段、合并症指标（血压升高、关节痛、胰岛素抵抗等）</li>\n</ul>", "explanation": "<p>该男孩体重 90 百分位、身高 50 百分位 → 按 US-CDC 标准为超重（>85 百分位）。超重/肥胖儿童的初始评估需通过病史和临床评估确定当前健康问题和未来疾病风险。</p>\n<p>在选项中，TSH 是排除甲状腺功能减退（作为超重的潜在原因）的合适检查。</p>\n<p>GH 和 FSH/LH 仅在有特定临床线索时考虑（如矮身材需评估 GH，青春期延迟需查 FSH/LH）。骨龄通常用于矮身材的初始评估。此男孩已超重，不能单纯 reassurance。</p>", "references": "<ul>\n<li>RACGP - Adolescent overweight and obesity</li>\n<li>NHMRC - Clinical Practice Guidelines for the management of overweight and obesity</li>\n</ul>", "related": ["AMC-Q1312-Childhood-BMI-Obesity", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "超重儿童的初始检查 — tsh 排除甲减\n超重儿童 — tsh 筛查排除甲状腺功能减退\n parents of an 11-year-old boy have brought him to your clinic for assessment because they believe he is obese. on examination, his weight and height are on 90 and 50 percentiles for sex- and age-matched growth charts respectively. which one of the following is the most appropriate investigation to consider for him? \n 该男孩体重 90 百分位、身高 50 百分位 → 按 us-cdc 标准为超重（>85 百分位）。超重/肥胖儿童的初始评估需通过病史和临床评估确定当前健康问题和未来疾病风险。 \n 在选项中，tsh 是排除甲状腺功能减退（作为超重的潜在原因）的合适检查。 \n gh 和 fsh/lh 仅在有特定临床线索时考虑（如矮身材需评估 gh，青春期延迟需查 fsh/lh）。骨龄通常用于矮身材的初始评估。此男孩已超重，不能单纯 reassurance。 "}, {"id": "AMC-Q1411", "type": "mcq", "qid": 1411, "title": "4 岁夜间遗尿 — 正常发育，等待自愈", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["4 岁夜间遗尿 — 未达遗尿症诊断年龄，等待自愈"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1411-Four-Year-Old-Bedwetting.md", "stem": "<p>A mother has brought her four-year-old son with complaint of nighttime bed wetting. According to her, he wets his bed 3-4 time a week at night despite achievement of daytime continence at the age of two years. He is otherwise asymptomatic. Physical examination is unremarkable. Which one of the following is the most appropriate management regarding this complaint?</p>", "options": [{"letter": "A", "text": "Bed wetting alarms."}, {"letter": "B", "text": "Nasal desmopressin."}, {"letter": "C", "text": "Amitriptyline."}, {"letter": "D", "text": "Waiting for spontaneous resolution."}, {"letter": "E", "text": "Ultrasonography of the bladder, ureters and kidneys."}], "rationale": "<p>1. 题型识别：管理决策 — 夜间遗尿的治疗时机 2. 关键线索：</p>\n<ul>\n<li>4 岁男孩</li>\n<li>每周 3-4 次夜间遗尿</li>\n<li>2 岁时已实现日间排尿控制（单症状性）</li>\n<li>体格检查正常</li>\n<p>3. 核心规则：<strong>ICCS 遗尿症诊断标准 = ≥5 岁</strong></p>\n<li>4 岁未达标 → 不是疾病，是正常发育过程</li>\n<li>≈84% 儿童在 5 岁时实现完全夜间膀胱控制</li>\n<p>4. 排除选项：</p>\n<li>遗尿报警器/去氨加压素/阿米替林 → 均为 ≥5 岁确诊遗尿症后才考虑</li>\n<li>超声检查 → 无临床指征</li>\n<p>5. 锁定答案：等待自愈 → D</p>\n</ul>", "traps": "<ul>\n<li><strong>\"已日间控制 + 仍在遗尿 = 必须治疗\"陷阱</strong>：日间控制早（2 岁）≠ 夜间也该早控制。夜间控制比日间晚是正常现象</li>\n<li><strong>家长焦虑陷阱</strong>：家长抱怨 ≠ 疾病；4 岁夜间遗尿是正常发育阶段</li>\n<li><strong>年龄阈值陷阱</strong>：遗尿症诊断年龄为 ≥5 岁，4 岁不满足</li>\n</ul>", "summary": "<p><strong>遗尿症（enuresis）</strong> ICCS 定义：≥5 岁儿童睡眠期间间歇性尿失禁。</p>\n<ul>\n<li><strong>单症状性</strong>：仅夜间遗尿，日间正常</li>\n<li><strong>非单症状性</strong>：夜间遗尿 + 日间症状（尿流异常/尿急/排尿困难/滴沥）</li>\n</ul>\n<p>治疗层级（≥5 岁确诊后）： 1. 一线：遗尿报警器（条件反射训练）+ 液体摄入/如厕/奖励系统指导 2. 二线：去氨加压素（合成加压素类似物）— 适合追求短期快速改善或报警器失败/不适合者 3. 三线：三环类抗抑郁药（阿米替林）— 报警器 + 去氨加压素均失败后</p>\n<p><strong>≈84% 儿童在 5 岁时实现完全夜间膀胱控制</strong>。4 岁遗尿 = 正常，等待自愈。</p>", "explanation": "<p>根据 ICCS 定义，遗尿症指 ≥5 岁儿童睡眠期间发生尿失禁。此患儿仅 4 岁，不满足遗尿症诊断标准，极有可能在 5 岁前自行解决。约 84% 儿童在 5 岁时实现完全夜间膀胱控制。</p>\n<p>遗尿报警器适用于年龄 ≥5 岁、液体摄入/如厕/奖励系统指导无效的患儿。去氨加压素是 ≥5 岁患儿的一线药物治疗（报警器替代选择）。阿米替林（三环类抗抑郁药）为三线治疗。超声检查仅在有临床指征（非单症状性或日间症状）时考虑。此 4 岁患儿目前无需任何检查或治疗。</p>", "references": "<ul>\n<li>The Royal Children's Hospital (RCH) - Enuresis - Bed wetting and Monosymptomatic Enuresis</li>\n<li>RACGP - Behavioural interventions including alarms: bedwetting (enuresis)</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "4 岁夜间遗尿 — 正常发育，等待自愈\n4 岁夜间遗尿 — 未达遗尿症诊断年龄，等待自愈\n a mothe
