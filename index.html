 otitis media for which he underwent bilateral grommet procedure. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Take samples for culture."}, {"letter": "B", "text": "Hearing assessment."}, {"letter": "C", "text": "Antibiotics."}, {"letter": "D", "text": "CT scanning of the temporal bone."}, {"letter": "E", "text": "Involvement of an ENT consultant."}], "rationale": "<p>1. 题型识别：管理顺序 — 急性乳突炎的初始处理 2. 关键线索：</p>\n<ul>\n<li>右耳疼痛 + <strong>脓性分泌物</strong> + 耳后红肿 = 急性乳突炎</li>\n<li>慢性双侧中耳炎 + <strong>双侧 grommets 置入史</strong></li>\n<li>今晨新出现耳后红肿</li>\n<p>3. 处理顺序：</p>\n<li><strong>第一步</strong>：取分泌物/脓液培养 → 明确致病菌（慢性中耳炎背景菌谱不同）</li>\n<li>第二步：根据培养结果选用敏感抗生素</li>\n<li>第三步：ENT 会诊</li>\n<li>影像学（CT）根据需要</li>\n<p>4. 排除：听力评估（B）→ 非急性期优先；在未取培养前盲目用抗生素（C）→ 不当；CT（D）→ 非第一步 5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有脓就用抗生素\"陷阱</strong>：在慢性中耳炎/术后背景下，应<strong>先取培养</strong>再给抗生素，避免经验性用药覆盖不足</li>\n<li><strong>ENT 会诊 vs 取培养的顺序</strong>：ENT 会诊重要但取培养是第一步操作</li>\n<li><strong>急性乳突炎 vs 慢性乳突炎</strong>：急性乳突炎与 AOM 相关；慢性乳突炎与 CSOM/胆脂瘤相关</li>\n</ul>", "summary": "<p><strong>急性乳突炎（Acute Mastoiditis）</strong>：</p>\n<ul>\n<li>AOM 最常见的化脓性并发症（虽罕见但需高度重视）</li>\n<li>临床表现：耳后炎性体征（红斑、水肿、压痛、波动感）</li>\n<li>与 AOM 相关</li>\n</ul>\n<p><strong>慢性乳突炎</strong>：与 CSOM 相关，尤其与胆脂瘤形成相关。</p>\n<p>处理原则：<strong>取培养 → 根据药敏用抗生素 → ENT 会诊</strong>。</p>", "explanation": "<p>该患儿为典型急性乳突炎表现：慢性双侧中耳炎 + grommets 置入史，新出现耳痛、脓性分泌物和耳后红肿。在慢性中耳炎/术后背景下的乳突炎，致病菌谱可能与典型 AOM 不同，因此<strong>第一步取分泌物培养</strong>至关重要，以指导后续靶向抗生素治疗。</p>\n<p>急性乳突炎虽罕见，却是 AOM 最常见的化脓性并发症，可致颅内并发症。慢性乳突炎多与 CSOM 和胆脂瘤相关。</p>", "references": "<ul>\n<li>RCH - Acute otitis media</li>\n</ul>", "related": ["AMC-Q1337-Acute-Mastoiditis-Pathogen", "AMC-Q1616-CSOM-Ciprofloxacin", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性乳突炎 — 第一步取培养标本\n急性乳突炎 — 第一步取分泌物培养\n an 8-year-old boy is brought to the emergency department with right ear pain and purulent discharge since yesterday and a red swelling behind the right ear since this morning. he has the history of chronic bilateral otitis media for which he underwent bilateral grommet procedure. which one of the following is the most appropriate next step in management? \n 该患儿为典型急性乳突炎表现：慢性双侧中耳炎 + grommets 置入史，新出现耳痛、脓性分泌物和耳后红肿。在慢性中耳炎/术后背景下的乳突炎，致病菌谱可能与典型 aom 不同，因此 第一步取分泌物培养 至关重要，以指导后续靶向抗生素治疗。 \n 急性乳突炎虽罕见，却是 aom 最常见的化脓性并发症，可致颅内并发症。慢性乳突炎多与 csom 和胆脂瘤相关。 "}, {"id": "AMC-Q1620", "type": "mcq", "qid": 1620, "title": "音叉试验 — 单侧感音神经性聋", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["音叉试验 — Rinne 双侧阳性 + Weber 偏左 = 右侧感音神经性聋 → 听神经瘤"], "difficulty": 4, "correctAnswer": "E", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-Q1620-Rinne-Weber-Acoustic-Neuroma.md", "stem": "<p>Raymond, 9 years of age, is brought to your GP clinic with right sided hearing impairment. A Rinne test shows that air conduction is better than bone conduction in both ears. Weber test indicates localization to the left ear. If the following options, which one justifies these findings?</p>", "options": [{"letter": "A", "text": "Acute otitis media."}, {"letter": "B", "text": "Acute otitis externa."}, {"letter": "C", "text": "Glue ear."}, {"letter": "D", "text": "Otosclerosis."}, {"letter": "E", "text": "Acoustic neuroma."}], "rationale": "<p>1. 题型识别：体格检查解读 — Rinne + Weber 试验定位听力损失类型 2. 音叉试验解读：</p>\n<ul>\n<li><strong>Rinne 试验</strong>（512 Hz）：AC > BC 双侧 = 双侧阳性 → <strong>排除传导性聋</strong></li>\n<li><strong>Weber 试验</strong>（256/512 Hz）：偏左 → 右耳听不到 = 右侧感音神经性聋</li>\n<p>3. 整合：Rinne 阴性 = 传导性 → 排除 A/B/C/D（AOM、外耳道炎、胶耳、耳硬化症均为传导性） 4. 单侧感音神经性聋 → <strong>听神经瘤</strong>（直至证明非此） 5. 锁定答案：E</p>\n</ul>", "traps": "<ul>\n<li><strong>Rinne 阳性/阴性 记反</strong>：AC>BC = Rinne <strong>阳性</strong>（正常）= 非传导性；BC>AC = Rinne <strong>阴性</strong> = 传导性聋</li>\n<li><strong>Weber 偏健侧 vs 偏患侧</strong>：感音神经性 → 偏<strong>健侧</strong>；传导性 → 偏<strong>患侧</strong></li>\n<li><strong>传导性病因多</strong>：A/B/C/D 均为传导性听力损失病因，Rinne 阳性已全部排除</li>\n<li><strong>儿童听神经瘤罕见但不可忽略</strong>：单侧感音神经性聋均应假定由听神经瘤引起，直至证明非此</li>\n</ul>", "summary": "<p><strong>Rinne 试验</strong>（512 Hz 音叉）：</p>\n<ul>\n<li>先放乳突（骨导 BC）→ 听不到后立即放耳前（气导 AC）</li>\n<li>AC > BC = <strong>Rinne 阳性</strong>（正常或感音神经性聋）</li>\n<li>BC > AC = <strong>Rinne 阴性</strong>（传导性聋）</li>\n</ul>\n<p><strong>Weber 试验</strong>（256/512 Hz 音叉）：</p>\n<ul>\n<li>放前额正中/上唇上方/头顶</li>\n<li>正常 = 双侧等响</li>\n<li>偏患侧 = <strong>传导性聋</strong></li>\n<li>偏健侧 = <strong>感音神经性聋</strong></li>\n</ul>\n<p><strong>听神经瘤</strong>：</p>\n<ul>\n<li>桥小脑角肿瘤的 80%（其余 20% 主要为脑膜瘤）</li>\n<li>施万细胞鞘起源（前庭或耳蜗神经）</li>\n<li>最常见的首发症状：<strong>单侧听力损失</strong></li>\n<li>任何单侧感音神经性聋均应假定为听神经瘤，直至证明非此</li>\n</ul>", "explanation": "<p>Rinne 试验示双侧 AC>BC（阳性），排除传导性听力损失。因此 AOM、外耳道炎、胶耳（分泌性中耳炎）和耳硬化症（影响听骨链）均不能解释此患儿的听力损失。</p>\n<p>Weber 试验偏左侧。结合 Rinne 阳性结果，提示右侧感音神经性听力损失。选项中仅听神经瘤可合理解释此表现。</p>\n<p>听神经瘤占桥小脑角肿瘤约 80%，首发症状多为单侧听力损失。肿瘤通过两种机制导致听力损失：直接损伤耳蜗神经或中断耳蜗血供。</p>", "references": "<ul>\n<li>RACGP – Ear examination</li>\n<li>Medscape – Acoustic Neuroma</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Sensorineural Hearing Loss"], "complaints": [], "search": "音叉试验 — 单侧感音神经性聋\n音叉试验 — rinne 双侧阳性 + weber 偏左 = 右侧感音神经性聋 → 听神经瘤\n raymond, 9 years of age, is brought to your gp clinic with right sided hearing impairment. a rinne test shows that air conduction is better than bone conduction in both ears. weber test indicates localization to the left ear. if the following options, which one justifies these findings? \n rinne 试验示双侧 ac>bc（阳性），排除传导性听力损失。因此 aom、外耳道炎、胶耳（分泌性中耳炎）和耳硬化症（影响听骨链）均不能解释此患儿的听力损失。 \n weber 试验偏左侧。结合 rinne 阳性结果，提示右侧感音神经性听力损失。选项中仅听神经瘤可合理解释此表现。 \n 听神经瘤占桥小脑角肿瘤约 80%，首发症状多为单侧听力损失。肿瘤通过两种机制导致听力损失：直接损伤耳蜗神经或中断耳蜗血供。 "}, {"id": "AMC-QNA-P1382", "type": "mcq", "qid": 0, "title": "儿童颈部肿块 — 超声为首选检查", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "ENT", "approach": [], "topic": ["儿童颈部肿块 — 超声为首选影像学检查"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/ENT/AMC-QNA-P1382-Paediatric-Neck-Mass.md", "stem": "<p>The mother of a four-year-old female child has brought her to you after she noticed a mass in her neck while giving her a bath. The mass is 2x1.5 cm in size, located in the anterior triangle of the neck, and not tender. The child is otherwise healthy and has no other concerning feature on physical examination. Which one of the following would be the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Excision of the mass."}, {"letter": "B", "text": "Fine needle aspiration cytology (FNAC)."}, {"letter": "C", "text": "Reassurance."}, {"letter": "D", "text": "Ultrasonography of the neck."}, {"letter": "E", "text": "Chest X-ray."}], "rationale": "<p>1. 题型识别：管理 — 儿童无症状颈部肿块的初始评估 2. 关键线索：4 岁、前三角区、无压痛、2×1.5 cm、无其他异常体征 3. 颈部肿块评估原则：</p>\n<ul>\n<li>非紧急肿块的首选影像学检查 = <strong>超声</strong></li>\n<li>超声可区分囊性/实性、评估大小、定位、与周围结构关系</li>\n<p>4. 排除选项：</p>\n<li>切除（A）：过早，需先明确性质</li>\n<li>FNAC（B）：超声后可考虑，非第一步</li>\n<li>Reassurance（C）：肿块持续 >6 周需进一步评估</li>\n<li>胸片（E）：除非有红旗征（TB、恶性肿瘤分期），否则无额外价值</li>\n<p>5. 锁定答案：超声 → D</p>\n</ul>", "traps": "<ul>\n<li><strong>直接 reassurance</strong>：无症状 ≠ 可 reassurance；肿块持续 >4-6 周需评估</li>\n<li><strong>直接切除/FNAC</strong>：影像学评估应先于侵入性操作</li>\n<li><strong>胸片滥用</strong>：常规颈部肿块不需要胸片</li>\n</ul>", "summary": "<p>儿童颈部肿块评估：</p>\n<ul>\n<li>中线肿块 → 先天性（甲状舌管囊肿、皮样囊肿）</li>\n<li>侧方肿块 → 淋巴结病（前/后三角区）</li>\n<li>快速增大 → 紧急转诊（气道风险/脓肿）</li>\n<li>缓慢增大（数月-数年）→ 良性肿瘤或先天性畸形</li>\n<li>炎症性 → 通常 4 周内消退；持续 >6 周需进一步评估</li>\n<li><strong>首选影像学 = 超声</strong></li>\n</ul>", "explanation": "<p>儿童颈部肿块是 GP 常见就诊原因。超声是首选影像学检查，可区分囊性和实性病变，评估大小，定位及与周围结构关系。该患儿无反应性淋巴结病的支持依据（无前驱病毒感染、无压痛等），因此 reassurance 不恰当。无红旗征时胸片无额外诊断价值。</p>", "references": "<ul>\n<li>RACGP – AJGP - Paediatric neck lumps: An approach for the primary physician</li>\n<li>AAFP - Evaluation and Management of Neck Masses in Children</li>\n</ul>", "related": ["TR-Paediatric-Neck-Masses-Approach", "AMC-Q1423-Thyroglossal-Duct-Cyst-Complication", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "儿童颈部肿块 — 超声为首选检查\n儿童颈部肿块 — 超声为首选影像学检查\n the mother of a four-year-old female child has brought her to you after she noticed a mass in her neck while giving her a bath. the mass is 2x1.5 cm in size, located in the anterior triangle of the neck, and not tender. the child is otherwise healthy and has no other concerning feature on physical examination. which one of the following would be the most appropriate next step in management? \n 儿童颈部肿块是 gp 常见就诊原因。超声是首选影像学检查，可区分囊性和实性病变，评估大小，定位及与周围结构关系。该患儿无反应性淋巴结病的支持依据（无前驱病毒感染、无压痛等），因此 reassurance 不恰当。无红旗征时胸片无额外诊断价值。 "}, {"id": "AMC-Q0815", "type": "mcq", "qid": 815, "title": "Cow's Milk Protein Allergy — 配方奶后血便 + 湿疹 + 特应质家族史", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": ["diagnosis", "differential"], "topic": ["Cow's Milk Protein Allergy", "Bloody Diarrhea", "Eczema", "Atopy", "Formula"], "difficulty": 3, "correctAnswer": "E", "page": 1311, "tags": ["mcq", "amc", "paediatrics", "gastroenterology", "cows-milk-protein-allergy", "cmPa", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q0815-Cows-Milk-Protein-Allergy.md", "stem": "<p>A mother brings her 3-week-old male baby with loose bloody bowel motions starting 2 days after formula milk was introduced. The mother is lactose-intolerant and avoids dairy. The baby is mildly dehydrated with an eczematous rash on his right cheek, afebrile. Family history: atopy (asthma, eczema) in father and older sister. Mother worries he has the same milk allergy. Which is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Lactose intolerance."}, {"letter": "B", "text": "Gastroenteritis."}, {"letter": "C", "text": "Galactosemia."}, {"letter": "D", "text": "Fructose intolerance."}, {"letter": "E", "text": "Cow's milk protein intolerance."}], "rationale": "<p>1. <strong>题型识别</strong>：婴儿配方奶引入后血便 + 湿疹 + 特应质 → 考 CMPA vs 乳糖不耐受。 2. <strong>CMPA 机制</strong>：对一种/多种牛奶蛋白的<strong>免疫</strong>反应（IgE 或非 IgE）。这把它与乳糖不耐受（非免疫不良反应）区分开。 3. <strong>临床线索</strong>：</p>\n<ul>\n<li>配方奶引入后短期内血便</li>\n<li>湿疹（atopic diathesis 表现）</li>\n<li>特应质家族史（哮喘、湿疹）</li>\n<li>母亲即使避 dairy，母乳中少量牛奶蛋白也可触发</li>\n<p>4. <strong>IgE vs 非 IgE</strong>：IgE 型可在进食后数分钟发生（荨麻疹、血管性水肿、呕吐、AD 急性发作）；其余约 42% 为迟发（AD 或胃肠症状）。 5. <strong>排除其他选项</strong>：乳糖不耐受无免疫基础、无湿疹关联；胃肠炎、半乳糖血症、果糖不耐受均不符合。 6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"母亲避 dairy = 不会过敏\"陷阱</strong>：错。母乳中微量牛奶蛋白即可触发 CMPA。</li>\n<li><strong>\"血便 = 乳糖不耐受\"陷阱</strong>：错。乳糖不耐受非免疫、无血便/湿疹特征。</li>\n<li><strong>\"湿疹 = 皮肤问题无关\"陷阱</strong>：错。湿疹是 CMPA 的 atopic 表现，是题眼。</li>\n<li><strong>混淆 CMPA 与 lactose intolerance</strong>：核心区别是<strong>免疫</strong> vs 非免疫。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>Onset of bloody diarrhea shortly after introduction of formula, presence of eczema, and family history of atopy makes cow's milk protein allergy (intolerance) (CMPA) the most likely diagnosis with high certainty. CMPA results from an immunological reaction to one or more milk proteins; this distinguishes it from lactose intolerance. CMPA may be IgE or non-IgE associated; IgE cases may be atopic manifestation, with early urticaria/angioedema/vomiting/AD flare, and ~42% later GI/AD reactions. Even small amounts of cow's milk in breast milk of dairy-consuming mothers may trigger the condition.</p>", "references": "<ul>\n<li>MJA - Guidelines for the use of infant formulas to treat cows milk protein allergy: an Australian consensus panel opinion</li>\n<li>BMJ - Guidelines for the diagnosis and management of cow's milk protein allergy in infants</li>\n</ul>", "related": ["AMC-Q1337-Pyloric-Stenosis-Metabolic", "AMC-Q1331-Breastfeeding-Failure-Frequency", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["CMPA"], "complaints": [], "search": "cow's milk protein allergy — 配方奶后血便 + 湿疹 + 特应质家族史\ncow's milk protein allergy bloody diarrhea eczema atopy formula\ndiagnosis differential\n a mother brings her 3-week-old male baby with loose bloody bowel motions starting 2 days after formula milk was introduced. the mother is lactose-intolerant and avoids dairy. the baby is mildly dehydrated with an eczematous rash on his right cheek, afebrile. family history: atopy (asthma, eczema) in father and older sister. mother worries he has the same milk allergy. which is the most likely diagnosis? \n correct answer is  e  \n onset of bloody diarrhea shortly after introduction of formula, presence of eczema, and family history of atopy makes cow's milk protein allergy (intolerance) (cmpa) the most likely diagnosis with high certainty. cmpa results from an immunological reaction to one or more milk proteins; this distinguishes it from lactose intolerance. cmpa may be ige or non-ige associated; ige cases may be atopic manifestation, with early urticaria/angioedema/vomiting/ad flare, and ~42% later gi/ad reactions. even small amounts of cow's milk in breast milk of dairy-consuming mothers may trigger the condition. "}, {"id": "AMC-Q0904", "type": "mcq", "qid": 904, "title": "儿童**痛性**直肠出血 — 最常见是肛裂（便秘相关）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": ["diagnosis", "differential"], "topic": ["Anal Fissure", "Painful Rectal Bleeding", "Children", "Constipation"], "difficulty": 2, "correctAnswer": "C", "page": 1316, "tags": ["mcq", "amc", "paediatrics", "gastroenterology", "anal-fissure", "rectal-bleeding", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q0904-Anal-Fissure-Painful-Bleeding.md", "stem": "<p>Which one of the following is the most common cause of painful rectal bleeding in children?</p>", "options": [{"letter": "A", "text": "Intussusception."}, {"letter": "B", "text": "Gastroenteritis."}, {"letter": "C", "text": "Anal fissure."}, {"letter": "D", "text": "Meckel's diverticulum."}, {"letter": "E", "text": "Hemorrhoids."}], "rationale": "<p>1. <strong>题型识别</strong>：\"儿童痛性直肠出血最常见原因\" → 考便血鉴别（痛 vs 不痛）。 2. <strong>肛裂</strong>：硬便通过 + 便秘所致；便表面/尿布上鲜血红；<strong>排便痛</strong>。 3. <strong>鉴别</strong>：</p>\n<ul>\n<li>Intussusception：腹痛 + 血便，但<strong>不</strong>以排便痛为特征，也不如肛裂常见。</li>\n<li>Gastroenteritis / juvenile polyps：2–5 岁儿童便血最常见，但<strong>不</strong>伴排便痛。</li>\n<li>Meckel's：可大量便血 + 中腹腹痛，更少见。</li>\n<li>Hemorrhoids：儿童少见，也不伴痛。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"痛 = intussusception\"陷阱</strong>：错。肠套叠痛不限于排便，且不如肛裂常见。</li>\n<li><strong>\"不痛的血便 = 肛裂\"陷阱</strong>：错。肛裂必痛；不痛血便指向 Meckel's/息肉。</li>\n<li><strong>\"hemorrhoids 儿童常见\"陷阱</strong>：错。儿童罕见。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Anal fissure is the most common cause of painful rectal bleeding in childhood, usually from hard stool + constipation; bright blood on stool surface/nappy. (A) Intussusception associated with abdominal pain + bleeding, not painful defecation, less common. (B) Gastroenteritis and juvenile polyps most common causes of rectal bleeding in 2–5yo but not associated with painful defecation. (D) Meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (E) Hemorrhoids neither painful nor common in childhood.</p>", "references": "<ul>\n<li>Medscape - Pediatric Lower GI Bleeding</li>\n<li>UpToDate - Lower gastrointestinal bleeding in children: Causes and diagnostic approach</li>\n<li>AMC Handbook of Multiple Choice Questions – page 126</li>\n</ul>", "related": ["AMC-Q0905-Juvenile-Polyp-Bleeding", "AMC-Q0815-Cows-Milk-Protein-Allergy", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Anal Fissure"], "complaints": ["bleeding"], "search": "儿童**痛性**直肠出血 — 最常见是肛裂（便秘相关）\nanal fissure painful rectal bleeding children constipation\ndiagnosis differential\n which one of the following is the most common cause of painful rectal bleeding in children? \n correct answer is  c  \n anal fissure is the most common cause of painful rectal bleeding in childhood, usually from hard stool + constipation; bright blood on stool surface/nappy. (a) intussusception associated with abdominal pain + bleeding, not painful defecation, less common. (b) gastroenteritis and juvenile polyps most common causes of rectal bleeding in 2–5yo but not associated with painful defecation. (d) meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (e) hemorrhoids neither painful nor common in childhood. "}, {"id": "AMC-Q0905", "type": "mcq", "qid": 905, "title": "儿童**无痛**大量血便（2–8 岁）→ Juvenile colonic polyp", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": ["diagnosis", "differential"], "topic": ["Juvenile Colonic Polyp", "Painless Rectal Bleeding", "2-8yo", "Hamartoma"], "difficulty": 2, "correctAnswer": "C", "page": 1317, "tags": ["mcq", "amc", "paediatrics", "gastroenterology", "juvenile-polyp", "rectal-bleeding", "approach-diagnosis", "approach-differential"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q0905-Juvenile-Polyp-Bleeding.md", "stem": "<p>A 7-year-old boy passed a large bloody stool this morning. No pain. Which is the most likely cause?</p>", "options": [{"letter": "A", "text": "Meckel's diverticulum."}, {"letter": "B", "text": "Duodenal ulcer."}, {"letter": "C", "text": "Colon polyp."}, {"letter": "D", "text": "Diverticulitis of the colon."}, {"letter": "E", "text": "Intussusception."}], "rationale": "<p>1. <strong>题型识别</strong>：7 岁 + 大量无痛血便 → 考儿童无痛便血鉴别。 2. <strong>Juvenile polyp</strong>：2–8 岁（高峰 3–4），良性错构瘤；<strong>无痛</strong>直肠出血；少数因息肉牵拉有下腹痛；>60% 可触及。 3. <strong>鉴别</strong>：</p>\n<ul>\n<li>Meckel's：可大量出血 + 中腹腹痛，发病更早、更少。</li>\n<li>Duodenal ulcer：更多黑便/呕血，非大量直肠出血。</li>\n<li>Diverticulitis / intussusception：此龄少见，且肠套叠常痛。</li>\n<p>4. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"大量血便 = Meckel's\"陷阱</strong>：错。Meckel's 可大量但更早期、伴腹痛、较少。</li>\n<li><strong>\"溃疡 = 直肠大量血\"陷阱</strong>：错。十二指肠溃疡主黑便/呕血。</li>\n<li><strong>\"intussusception 不痛\"陷阱</strong>：错。肠套叠常痛，且此龄不典型。</li>\n<li><strong>痛 vs 不痛</strong>：本题强调无痛 → 息肉。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Large painless bloody stool in a 7-year-old → juvenile colonic polyp. Benign hamartomas, age 2–8 (peak 3–4). Present with painless rectal bleeding; >60% have palpable polyp on rectal exam. (A) Meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (B) Duodenal ulcer → melena/hematemesis. (D/E) Diverticular disease and intussusception uncommon at this age; intussusception often painful.</p>", "references": "<ul>\n<li>Medscape - Pediatric Gastrointestinal Bleeding</li>\n<li>Canadian Journal of Gastroenterology - Colonic polyps in children and adolescents</li>\n</ul>", "related": ["AMC-Q0904-Anal-Fissure-Painful-Bleeding", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Juvenile Polyp"], "complaints": [], "search": "儿童**无痛**大量血便（2–8 岁）→ juvenile colonic polyp\njuvenile colonic polyp painless rectal bleeding 2-8yo hamartoma\ndiagnosis differential\n a 7-year-old boy passed a large bloody stool this morning. no pain. which is the most likely cause? \n correct answer is  c  \n large painless bloody stool in a 7-year-old → juvenile colonic polyp. benign hamartomas, age 2–8 (peak 3–4). present with painless rectal bleeding; >60% have palpable polyp on rectal exam. (a) meckel's can cause massive bleeding + central abdominal pain, earlier age, less common. (b) duodenal ulcer → melena/hematemesis. (d/e) diverticular disease and intussusception uncommon at this age; intussusception often painful. "}, {"id": "AMC-Q1042", "type": "mcq", "qid": 1042, "title": "AMC-Q1042 — Pyloric stenosis metabolic profile", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": [], "topic": ["肥厚性幽门狭窄 — 代谢紊乱"], "difficulty": 3, "correctAnswer": "D", "page": 1337, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q1042-Pyloric-Stenosis-Metabolic.md", "stem": "<p>A 5-week-old female infant is brought to your office by her parents because of 'feeding problems'. Parents tell you that their child has been vomiting after many of her feeds for the past week or so. They mention that this is a new problem, and she was previously quite healthy. For the first time, the baby's vomit was projectile and forceful last night. On examination, a mass is palpated in the epigastric area. Which one of the following is the most likely metabolic profile in this infant?</p>", "options": [{"letter": "A", "text": "Increased pH, increased K, increased Cl, increased pCO2, and increased HCO3"}, {"letter": "B", "text": "Decreased pH, decreased K, decreased Cl, increased pCO2, and decreased HCO3"}, {"letter": "C", "text": "Increased pH, increased K, decreased Cl, increased pCO2, and decreased HCO3"}, {"letter": "D", "text": "Increased pH, decreased K, decreased Cl, increased pCO2, and increased HCO3"}, {"letter": "E", "text": "Increased pH, decreased K, decreased Cl, decreased pCO2, and decreased HCO3"}], "rationale": "<ul>\n<li>典型 IHPS（婴儿肥厚性幽门狭窄）：3-6 周、餐后立即非胆汁性喷射性呕吐、上腹\"橄榄样\"肿块</li>\n<li>胃液富含 HCl 和 K⁺ → 持续呕吐丢失 → <strong>低氯低钾性代谢性碱中毒</strong></li>\n<li>代谢性碱中毒 → 呼吸代偿（呼吸变浅）→ <strong>呼吸性酸中毒</strong> → <strong>pCO2 升高</strong></li>\n<li>总结：<strong>pH↑, K↓, Cl↓, HCO3↑, pCO2↑</strong></li>\n</ul>\n<table class='md-table'>\n<thead><tr><th>指标</th><th>变化</th><th>机制</th></tr></thead>\n<tbody>\n<tr><td>pH ↑</td><td>代谢性碱中毒</td><td>丢失 H⁺、Cl⁻</td></tr>\n<tr><td>K ↓</td><td>低钾</td><td>丢失 K⁺，碱中毒促 K⁺ 内流</td></tr>\n<tr><td>Cl ↓</td><td>低氯</td><td>丢失 HCl</td></tr>\n<tr><td>HCO3 ↑</td><td>代碱</td><td>失去 H⁺ 后 HCO3⁻ 相对过剩</td></tr>\n<tr><td>pCO2 ↑</td><td>代偿性呼酸</td><td>呼吸浅慢，CO2 潴留</td></tr>\n</tbody>\n</table>", "traps": "<ul>\n<li>选 C（pH↑, K↑）— 错误：呕吐丢 K⁺，不是 K⁺ 升高</li>\n<li>选 E（pH↑, pCO2↓）— 错误：代谢性碱中毒应<strong>代偿性</strong>通气下降，pCO2 <strong>升高</strong></li>\n</ul>", "summary": "<p><strong>肥厚性幽门狭窄（IHPS）要点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>发病年龄</td><td>3-6 周（高峰 4-8 周）</td></tr>\n<tr><td>性别</td><td>男:女 = 4-6:1</td></tr>\n<tr><td>呕吐特点</td><td>非胆汁性、餐后立即、进行性加重、<strong>喷射性</strong>、\"饥饿呕吐者\"</td></tr>\n<tr><td>体征</td><td>右上腹\"橄榄样\"肿块（呕吐后更易触及）</td></tr>\n<tr><td>代谢</td><td><strong>低氯低钾性代谢性碱中毒 + 呼吸性酸中毒代偿</strong></td></tr>\n<tr><td>治疗</td><td>手术（Ramstedt 幽门肌切开术）</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：不要被低氯低钾性代碱的口诀（pH↑, K↓, Cl⁻, HCO3↑）误导而忘记 pCO2 也升高。</p>", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>该场景描述了婴儿肥厚性幽门狭窄（IHPS）的典型表现。<strong>IHPS 在男孩中比女孩更常见（4:1 至 6:1）</strong>。</p>\n<p>IHPS 典型表现为 3-6 周龄婴儿餐后立即非胆汁性喷射性呕吐。呕吐后，婴儿立即要求再吃（\"饥饿呕吐者\"）。</p>\n<p>查体时，婴儿脱水，在右上腹腹直肌外侧缘可触及\"橄榄样\"肿块。肿块在呕吐后最容易触及。</p>\n<p><strong>胃液富含盐酸和钾</strong>。通过呕吐丢失胃液导致<strong>低氯性代谢性碱中毒</strong>。起初钾正常，但随着呕吐持续出现低钾血症。代谢性碱中毒与 HCO3 增加相关。为代偿代谢性碱中毒，发生呼吸性酸中毒，伴 CO2 动脉压（pCO2）增加。</p>\n<p>基于以上，<strong>长期呕吐患者预期的代谢表现将是 pH 增加（代谢性碱中毒）、血钾和氯降低、HCO3 和 pCO2 增加</strong>。</p>", "references": "<ul>\n<li>RCH - Pyloric stenosis</li>\n<li>Medscape - Pediatric Hypertrophic Pyloric Stenosis</li>\n<li>UpToDate - Infantile hypertrophic pyloric stenosis</li>\n</ul>", "related": ["AMC-Q1118-Pyloric-Stenosis-Vomiting-Timing"], "bodyHtml": "", "diseases": ["Pyloric Stenosis"], "complaints": ["feeding difficulty", "nausea/vomiting"], "search": "amc-q1042 — pyloric stenosis metabolic profile\n肥厚性幽门狭窄 — 代谢紊乱\n a 5-week-old female infant is brought to your office by her parents because of 'feeding problems'. parents tell you that their child has been vomiting after many of her feeds for the past week or so. they mention that this is a new problem, and she was previously quite healthy. for the first time, the baby's vomit was projectile and forceful last night. on examination, a mass is palpated in the epigastric area. which one of the following is the most likely metabolic profile in this infant? \n correct answer is  d  \n 该场景描述了婴儿肥厚性幽门狭窄（ihps）的典型表现。 ihps 在男孩中比女孩更常见（4:1 至 6:1） 。 \n ihps 典型表现为 3-6 周龄婴儿餐后立即非胆汁性喷射性呕吐。呕吐后，婴儿立即要求再吃（\"饥饿呕吐者\"）。 \n 查体时，婴儿脱水，在右上腹腹直肌外侧缘可触及\"橄榄样\"肿块。肿块在呕吐后最容易触及。 \n  胃液富含盐酸和钾 。通过呕吐丢失胃液导致 低氯性代谢性碱中毒 。起初钾正常，但随着呕吐持续出现低钾血症。代谢性碱中毒与 hco3 增加相关。为代偿代谢性碱中毒，发生呼吸性酸中毒，伴 co2 动脉压（pco2）增加。 \n 基于以上， 长期呕吐患者预期的代谢表现将是 ph 增加（代谢性碱中毒）、血钾和氯降低、hco3 和 pco2 增加 。 "}, {"id": "AMC-Q1118", "type": "mcq", "qid": 1118, "title": "AMC-Q1118 — Pyloric stenosis — characteristic vomiting timing", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Gastroenterology", "approach": [], "topic": ["肥厚性幽门狭窄 — 呕吐时间"], "difficulty": 2, "correctAnswer": "C", "page": 1339, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Gastroenterology/AMC-Q1118-Pyloric-Stenosis-Vomiting-Timing.md", "stem": "<p>Which one of the following is suggestive of hypertrophic pyloric stenosis?</p>", "options": [{"letter": "A", "text": "Vomiting after 1 hour of feeding"}, {"letter": "B", "text": "Vomiting immediately after feeding"}, {"letter": "C", "text": "Vomiting after few minutes of feeding"}, {"letter": "D", "text": "Bilious vomiting"}, {"letter": "E", "text": "Vomiting after 2 hours of feeding"}], "rationale": "<ul>\n<li>HPS（肥厚性幽门狭窄）呕吐时间特点：</li>\n<li>出现时间：2-9 周龄（典型 4-8 周）</li>\n<li><strong>餐后数分钟内</strong>（最典型，30 分钟内）</li>\n<li>起初不频繁，渐变为几乎每餐都吐</li>\n<li>强度进行性加重 → 特征性<strong>喷射性</strong>呕吐</li>\n<li>关键鉴别：</li>\n<li><strong>非胆汁性</strong>（胃出口梗阻，胆汁不返流）</li>\n<li>偶尔有少量咖啡渣样物或鲜血</li>\n<li>患儿通常不发热、貌似不病，\"饥饿呕吐者\"（吐后仍要吃）</li>\n<li>各选项分析：</li>\n<li>A（1 小时后）：不典型</li>\n<li>B（餐后立即）：太快，不符合\"几分钟后\"的典型</li>\n<li>D（<strong>胆汁性</strong>）：<strong>不符合</strong> — 梗阻在胃出口，胆汁不返流；胆汁性呕吐要警惕肠梗阻！</li>\n<li>E（2 小时后）：太晚</li>\n</ul>", "traps": "<ul>\n<li>选 D（胆汁性）— 这是<strong>最关键陷阱</strong>；HPS = <strong>非胆汁性</strong>呕吐</li>\n<li>选 B — \"立即\"是过饱/胃食管返流，HPS 是<strong>几分钟后</strong></li>\n</ul>", "summary": "<p><strong>新生儿呕吐鉴别（按胆汁性分）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>病因</th><th>呕吐时间</th><th>胆汁性</th></tr></thead>\n<tbody>\n<tr><td><strong>肥厚性幽门狭窄</strong></td><td>餐后<strong>数分钟</strong></td><td><strong>否</strong></td></tr>\n<tr><td>胃食管返流</td><td>餐后立即</td><td>否</td></tr>\n<tr><td>先天性十二指肠闭锁</td><td>餐后</td><td><strong>是</strong></td></tr>\n<tr><td>空肠/回肠闭锁</td><td>餐后</td><td>是</td></tr>\n<tr><td>肠旋转不良/中肠扭转</td><td>餐后</td><td>是（急症！）</td></tr>\n</tbody>\n</table>\n<p><strong>警示</strong>：<strong>胆汁性呕吐 + 新生儿 = 警惕肠梗阻/中肠扭转 → 急症手术评估</strong>。</p>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>肥厚性幽门狭窄（HPS）由幽门环形肌进行性增厚引起</strong>。这导致胃出口狭窄。该病通常在 2-4 周至 6-9 周龄之间发病。</p>\n<p>HPS 的易感因素：</p>\n<ul>\n<li>男性</li>\n<li>第一胎</li>\n<li>白人</li>\n<li>父母 HPS 病史（母亲患病时更高）</li>\n</ul>\n<p>HPS 最初典型表现为 2-9 周龄（通常 4-8 周龄）的非血性、非胆汁性呕吐。最初呕吐可能不频繁，但数天后变为更可预测，几乎在每次喂奶时都发生。</p>\n<p><strong>呕吐发生在餐后第一小时内，但典型时间是最初几分钟内（最多 30 分钟）</strong>。呕吐强度增加直至出现典型的病理性喷射性呕吐。</p>\n<p>偶尔可观察到少量鲜血或咖啡渣样物的少量呕血。患者通常不显病容或发热。<strong>疾病早期的婴儿仍然饥饿，呕吐后用力吸吮</strong>（饥饿呕吐者）。</p>\n<p>诊断长期延迟可导致脱水、体重不增、营养不良、代谢改变和嗜睡。父母常报告尝试多种不同的婴儿配方奶，因为他们（或其医生）认为呕吐是由于不耐受所致。</p>", "references": "<ul>\n<li>RCH - Pyloric stenosis</li>\n<li>Medscape - Pediatric Hypertrophic Pyloric Stenosis</li>\n<li>Kidshealth - Pyloric Stenosis</li>\n</ul>", "related": ["AMC-Q1042-Pyloric-Stenosis-Metabolic"], "bodyHtml": "", "diseases": ["Pyloric Stenosis"], "complaints": [], "search": "amc-q1118 — pyloric stenosis — characteristic vomiting timing\n肥厚性幽门狭窄 — 呕吐时间\n which one of the following is suggestive of hypertrophic pyloric stenosis? \n correct answer is  c  \n  肥厚性幽门狭窄（hps）由幽门环形肌进行性增厚引起 。这导致胃出口狭窄。该病通常在 2-4 周至 6-9 周龄之间发病。 \n hps 的易感因素： \n \n 男性 \n 第一胎 \n 白人 \n 父母 hps 病史（母亲患病时更高） \n \n hps 最初典型表现为 2-9 周龄（通常 4-8 周龄）的非血性、非胆汁性呕吐。最初呕吐可能不频繁，但数天后变为更可预测，几乎在每次喂奶时都发生。 \n  呕吐发生在餐后第一小时内，但典型时间是最初几分钟内（最多 30 分钟） 。呕吐强度增加直至出现典型的病理性喷射性呕吐。 \n 偶尔可观察到少量鲜血或咖啡渣样物的少量呕血。患者通常不显病容或发热。 疾病早期的婴儿仍然饥饿，呕吐后用力吸吮 （饥饿呕吐者）。 \n 诊断长期延迟可导致脱水、体重不增、营养不良、代谢改变和嗜睡。父母常报告尝试多种不同的婴儿配方奶，因为他们（或其医生）认为呕吐是由于不耐受所致。 "}, {"id": "AMC-Q1008", "type": "mcq", "qid": 1008, "title": "AMC-Q1008 — Labial adhesion in a 10-year-old girl", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["阴唇粘连"], "difficulty": 2, "correctAnswer": "A", "page": 1333, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1008-Labial-Adhesion-Reassurance.md", "stem": "<p>A 10-year-old girl is being assessed in your clinic with complaints of labial fusion. She has the past history of vulvovaginitis which has been successfully treated. The child reports no voiding difficulties. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Reassurance"}, {"letter": "B", "text": "Surgical separation of adhesions"}, {"letter": "C", "text": "Encourage good hygiene"}, {"letter": "D", "text": "Antibiotics"}, {"letter": "E", "text": "Manual separation of adhesions"}], "rationale": "<ul>\n<li><strong>阴唇粘连</strong>（labial agglutination）= 两侧小阴唇内侧缘粘连</li>\n<li>病因：青春期前阴道黏膜薄（正常生理）+ 局部刺激（如外阴阴道炎）</li>\n<li><strong>是正常变异</strong>，<strong>青春期后会自发消退</strong></li>\n<li>关键判断：<strong>无症状（能正常排尿）→ 不需任何治疗，仅需安抚</strong></li>\n<li>治疗仅在出现泌尿道症状时考虑</li>\n<li>各选项分析：</li>\n<li>B（手术分离）：复发率高，不推荐</li>\n<li>C（良好卫生）：建议但对治疗粘连无效</li>\n<li>D（抗生素）：无用</li>\n<li>E（手法分离）：儿童痛苦，复发率高，不推荐</li>\n</ul>", "traps": "<ul>\n<li>一看到\"粘连\"就想到\"分离\" — 错误，<strong>无症状不处理</strong></li>\n<li>区分：手术/手法分离 → 仅在有泌尿道症状时</li>\n</ul>", "summary": "<p><strong>Labial adhesion 管理阶梯</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>情况</th><th>处理</th></tr></thead>\n<tbody>\n<tr><td><strong>无症状</strong>（如本例）</td><td><strong>观察 + 安抚</strong></td></tr>\n<tr><td>排尿困难</td><td>短期外用雌激素软膏（少数用）</td></tr>\n<tr><td>严重病例</td><td>极少需要手术分离（复发率极高）</td></tr>\n</tbody>\n</table>\n<p><strong>关键点</strong>：阴唇粘连是青春期前正常变异，多数自发消退。<strong>不要过度干预</strong>。</p>", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>阴唇粘连（labial agglutination）发生于两侧小阴唇内侧缘粘连，常有外阴阴道炎的背景病史。这可能由于阴道黏膜薄（青春期前的正常状态）和轻微刺激（如外阴阴道炎）共同作用所致。</p>\n<p><strong>这是一种正常变异，在儿童期晚期会自发消退</strong>。只要儿童能够容易地排尿，除了安抚之外不需要任何治疗。</p>\n<ul>\n<li>（选项 B）手术分离粘连后涂抹凡士林和/或雌激素软膏可用于有泌尿道症状的儿童。然而，由于复发率高，一般不推荐这种方法。</li>\n<li>（选项 C）虽然鼓励良好的卫生是一个好建议，但对治疗该病无效。</li>\n<li>（选项 D）抗生素在阴唇粘连的管理中没有作用。</li>\n<li>（选项 E）手法分离粘连会让儿童感到痛苦，且复发风险高，不推荐。</li>\n</ul>", "references": "<ul>\n<li>RCH - Prepubescent gynaecology</li>\n</ul>", "related": ["TR-Labial-Adhesion"], "bodyHtml": "", "diseases": ["Labial Adhesion"], "complaints": [], "search": "amc-q1008 — labial adhesion in a 10-year-old girl\n阴唇粘连\n a 10-year-old girl is being assessed in your clinic with complaints of labial fusion. she has the past history of vulvovaginitis which has been successfully treated. the child reports no voiding difficulties. which one of the following is the most appropriate next step in management? \n correct answer is  a  \n 阴唇粘连（labial agglutination）发生于两侧小阴唇内侧缘粘连，常有外阴阴道炎的背景病史。这可能由于阴道黏膜薄（青春期前的正常状态）和轻微刺激（如外阴阴道炎）共同作用所致。 \n  这是一种正常变异，在儿童期晚期会自发消退 。只要儿童能够容易地排尿，除了安抚之外不需要任何治疗。 \n \n （选项 b）手术分离粘连后涂抹凡士林和/或雌激素软膏可用于有泌尿道症状的儿童。然而，由于复发率高，一般不推荐这种方法。 \n （选项 c）虽然鼓励良好的卫生是一个好建议，但对治疗该病无效。 \n （选项 d）抗生素在阴唇粘连的管理中没有作用。 \n （选项 e）手法分离粘连会让儿童感到痛苦，且复发风险高，不推荐。 \n "}, {"id": "AMC-Q1287", "type": "mcq", "qid": 1287, "title": "24 月龄发育里程碑", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["24 月龄语言发育里程碑 — 代词和介词"], "difficulty": 2, "correctAnswer": "A", "page": 1352, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1287-24-Month-Development-Milestones.md", "stem": "<p>A 24-month female child is brought for assessment of development. Which one of the following is expected to develop at this age?</p>", "options": [{"letter": "A", "text": "Knowing two pronouns."}, {"letter": "B", "text": "Naming four colors."}, {"letter": "C", "text": "Knowing her age."}, {"letter": "D", "text": "Knowing her family name."}, {"letter": "E", "text": "Speaking in full sentences."}], "rationale": "<p>1. 题型识别：发育里程碑 — 各年龄段的正常发育范围 2. 关键线索：24 月龄（2 岁）女性幼儿 3. 鉴别排除：</p>\n<ul>\n<li>命名颜色（B）：3-5 岁 / 知道年龄（C）：5 岁后 / 知道姓氏（D）：约 4 岁 / 完整句子（E）：3-5 岁</li>\n<p>4. 锁定答案：24 月龄能掌握代词和介词 → A</p>\n</ul>", "traps": "<ul>\n<li><strong>年龄陷阱</strong>：选项 B-E 都是正常发育里程碑，但对应更高年龄段（3-5 岁），易与 2 岁混淆</li>\n<li><strong>\"知道年龄\"</strong>：常识觉得 2 岁该知道年龄了，但实际里程碑在 5 岁后</li>\n</ul>", "summary": "<p>24 月龄（2 岁）语言发育里程碑：说名字、说多个单词（主要是名词）、开始使用 1-2 个词的短句（如 \"want milk\"）。掌握代词和介词是该年龄段可达成的里程碑。</p>", "explanation": "<p>各选项对应年龄：</p>\n<ul>\n<li><strong>A. 知道两个代词</strong>：24 月龄可达成的语言发育里程碑</li>\n<li><strong>B. 命名四种颜色</strong>：3-5 岁之间获得的能力，对这个孩子来说太早</li>\n<li><strong>C. 知道自己的年龄</strong>：通常在 5 岁之后获得的能力</li>\n<li><strong>D. 知道家族姓氏</strong>：约 4 岁的预期能力；如果 5 岁时还不能说出家族姓氏应考虑评估</li>\n<li><strong>E. 说完整句子</strong>：3-5 岁间正常达成的语言发育里程碑，24 月龄不预期</li>\n</ul>", "references": "<ul>\n<li>Developmental milestones and the Early Years Learning Framework and the National Quality Standards</li>\n</ul>", "related": ["AMC-Q1288-14-Month-Normal-Development", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "24 月龄发育里程碑\n24 月龄语言发育里程碑 — 代词和介词\n a 24-month female child is brought for assessment of development. which one of the following is expected to develop at this age? \n 各选项对应年龄： \n \n  a. 知道两个代词 ：24 月龄可达成的语言发育里程碑 \n  b. 命名四种颜色 ：3-5 岁之间获得的能力，对这个孩子来说太早 \n  c. 知道自己的年龄 ：通常在 5 岁之后获得的能力 \n  d. 知道家族姓氏 ：约 4 岁的预期能力；如果 5 岁时还不能说出家族姓氏应考虑评估 \n  e. 说完整句子 ：3-5 岁间正常达成的语言发育里程碑，24 月龄不预期 \n "}, {"id": "AMC-Q1288", "type": "mcq", "qid": 1288, "title": "14 月龄发育正常 — 语言迟缓的判断时机", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["14 月龄发育正常 — 语言迟缓的判断时机"], "difficulty": 2, "correctAnswer": "C", "page": 1353, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1288-14-Month-Normal-Development.md", "stem": "<p>Parents of a 14-month-old boy has brought him for evaluation because they think their baby lags behind language development milestones because he does not speak any words and only babbles. He is the outcome of an uneventful pregnancy and was born through an uncomplicated vaginal delivery. He has not had any medical problems to date except few episodes of upper respiratory tract infections. He started rolling over at the age of 4 months, can sit without support from the age of 8 months and has started unaided walking recently. He transfers objects from one hand to the other and plays and enjoys peak-a-boo. Which one of the following this child have?</p>", "options": [{"letter": "A", "text": "Language delay."}, {"letter": "B", "text": "Social delay."}, {"letter": "C", "text": "Normal development."}, {"letter": "D", "text": "Fine motor delay."}, {"letter": "E", "text": "Gross motor delay."}], "rationale": "<p>1. 题型识别：发育评估 — 判断是否为发育迟缓 2. 关键线索：</p>\n<ul>\n<li>翻身 4 月龄（正常 0-4 月龄）✓</li>\n<li>独立坐 8 月龄（正常 8-12 月龄）✓</li>\n<li>独立行走近 14 月龄（正常 1-2 岁）✓</li>\n<li>物体换手（正常 8-12 月龄）✓</li>\n<li>躲猫猫（正常 4-8 月龄）✓</li>\n<li>仅咿呀学语无词（14 月龄，正常）</li>\n<p>3. 鉴别排除：所有运动里程碑均正常 → 排除 D/E；躲猫猫 = 社交/认知正常 → 排除 B；14 月龄仅咿呀学语仍在正常范围 → 排除 A 4. 锁定答案：全面发育正常 → C</p>\n</ul>", "traps": "<ul>\n<li><strong>家长焦虑陷阱</strong>：家长担心 ≠ 实际发育迟缓；14 月龄仅咿呀学语属正常</li>\n<li><strong>里程碑年龄范围宽</strong>：1-2 岁语言里程碑很宽泛（说名字 → 多词 → 短句），不应过早下\"delay\"判断</li>\n<li><strong>\"delay\" 与 \"impairment\" 混淆</strong>：delay 暗示将来可能追上，此时并非病态</li>\n</ul>", "summary": "<p>发育里程碑五大领域：Physical / Social / Emotional / Cognitive / Language。</p>\n<p>1-2 岁语言预期：说名字 → 说多个词（主要是命名词）→ 开始使用 1-2 词短句（如 \"want milk\"）。14 月龄仅咿呀学语属正常范围。语言迟缓需在 <strong>24 月龄后</strong>仍仅咿呀学语才考虑。</p>", "explanation": "<p>该患儿所有运动里程碑均在正常范围：</p>\n<ul>\n<li>翻身 4 月龄（正常 0-4 月龄）</li>\n<li>独立坐 8 月龄（正常 8-12 月龄）</li>\n<li>物体换手（正常 8-12 月龄）</li>\n<li>独立行走（正常 1-2 岁）</li>\n<li>躲猫猫（正常 4-8 月龄，认知里程碑）</li>\n</ul>\n<p>无精细运动（D）或粗大运动（E）迟缓。无社交迟缓证据（B）。关于语言，1-2 岁预期：说名字 → 多词 → 开始使用 1-2 词短句。14 月龄仍有充足时间达成这些里程碑。语言迟缓需在 24 月龄后仍只咿呀学语才需关注。</p>", "references": "<ul>\n<li>Developmental milestones and the Early Years Learning Framework and the National Quality Standards</li>\n</ul>", "related": ["AMC-Q1287-24-Month-Development-Milestones", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "14 月龄发育正常 — 语言迟缓的判断时机\n14 月龄发育正常 — 语言迟缓的判断时机\n parents of a 14-month-old boy has brought him for evaluation because they think their baby lags behind language development milestones because he does not speak any words and only babbles. he is the outcome of an uneventful pregnancy and was born through an uncomplicated vaginal delivery. he has not had any medical problems to date except few episodes of upper respiratory tract infections. he started rolling over at the age of 4 months, can sit without support from the age of 8 months and has started unaided walking recently. he transfers objects from one hand to the other and plays and enjoys peak-a-boo. which one of the following this child have? \n 该患儿所有运动里程碑均在正常范围： \n \n 翻身 4 月龄（正常 0-4 月龄） \n 独立坐 8 月龄（正常 8-12 月龄） \n 物体换手（正常 8-12 月龄） \n 独立行走（正常 1-2 岁） \n 躲猫猫（正常 4-8 月龄，认知里程碑） \n \n 无精细运动（d）或粗大运动（e）迟缓。无社交迟缓证据（b）。关于语言，1-2 岁预期：说名字 → 多词 → 开始使用 1-2 词短句。14 月龄仍有充足时间达成这些里程碑。语言迟缓需在 24 月龄后仍只咿呀学语才需关注。 "}, {"id": "AMC-Q1312", "type": "mcq", "qid": 1312, "title": "儿童 BMI 评估 — 必须使用性别特异性百分位图", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["儿童 BMI 百分位评估 — 必须使用性别特异性百分位图"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1312-Childhood-BMI-Obesity.md", "stem": "<p>A 7-year-old boy weighs 30 kg and has a body mass index of 19.5 kg/m². Which one of the following is correct regarding his weight and BMI (use the following chart for calculation)?</p>", "options": [{"letter": "A", "text": "He is underweight."}, {"letter": "B", "text": "He is overweight."}, {"letter": "C", "text": "He has normal weight."}, {"letter": "D", "text": "He is obese."}, {"letter": "E", "text": "BMI is not applicable in children."}], "rationale": "<p>1. 题型识别：定义/分类 — 儿童体重状态评估工具选择 2. 关键线索：7 岁男孩、30 kg、BMI 19.5 kg/m² 3. 核心原则：<strong>儿童 BMI 非固定数值</strong>，必须按性别特异性 BMI 百分位图解读</p>\n<ul>\n<li>同一 BMI 值在不同年龄段含义不同：17 岁男生 BMI 20 = 正常，6 岁男生 BMI 20 = 肥胖</li>\n<p>4. 假选项排除：</p>\n<li>BMI 在儿童中<strong>适用</strong>（E 错），但需用百分位图而非固定阈值</li>\n<li>按本题提供的图表，19.5 在 7 岁男生的肥胖区域</li>\n<p>5. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>成人 BMI 思维陷阱</strong>：成人 BMI 19.5 是正常偏低，惯性思维会选\"正常\"或\"偏瘦\"；但<strong>儿童 BMI 必须用百分位图</strong></li>\n<li><strong>过度解读\"underweight\"</strong>：30 kg、7 岁听起来\"偏重\"→ 不会选 underweight（A），但容易选 normal（C）或 overweight（B）</li>\n<li><strong>\"BMI not applicable\"</strong>：BMI 绝对适用于儿童，只是解读方式不同（用百分位图而非固定阈值）</li>\n</ul>", "summary": "<p>儿童（2-18 岁）BMI 评估核心原则：</p>\n<ul>\n<li>由于身体成分随正常生长和青春期阶段变化，<strong>儿童 BMI 不是固定标准</strong></li>\n<li>BMI = 体重 (kg) / 身高² (m²)</li>\n<li>必须将 BMI 值<strong>绘制在性别特异性 BMI 百分位图上</strong>判断落入哪个区域</li>\n<li>同一 BMI 值（如 20 kg/m²）：17 岁男生 = 正常，6 岁男生 = 肥胖</li>\n</ul>", "explanation": "<p>由于身体成分随正常生长和青春期阶段变化，儿童 BMI 不是一个像成人那样的固定标准。儿童（2-18 岁）BMI 解读<strong>必须</strong>绘制在性别特异性 BMI 百分位图上。</p>\n<ul>\n<li>一名 17 岁男孩 BMI 20 kg/m² 在正常范围内</li>\n<li>一名 6 岁男孩同一 BMI 值则为肥胖</li>\n</ul>\n<p>此患儿的 BMI 在性别特异性 BMI 百分位图上落入\"肥胖\"区域（参考图表）。</p>\n<p>若配合性别特异性百分位图使用，BMI 在儿童中的评估效能与成人相同。</p>", "references": "<ul>\n<li>RACGP - Adolescent overweight and obesity</li>\n<li>NHMRC - Clinical Practice Guidelines for the management of overweight and obesity</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "儿童 bmi 评估 — 必须使用性别特异性百分位图\n儿童 bmi 百分位评估 — 必须使用性别特异性百分位图\n a 7-year-old boy weighs 30 kg and has a body mass index of 19.5 kg/m². which one of the following is correct regarding his weight and bmi (use the following chart for calculation)? \n 由于身体成分随正常生长和青春期阶段变化，儿童 bmi 不是一个像成人那样的固定标准。儿童（2-18 岁）bmi 解读 必须 绘制在性别特异性 bmi 百分位图上。 \n \n 一名 17 岁男孩 bmi 20 kg/m² 在正常范围内 \n 一名 6 岁男孩同一 bmi 值则为肥胖 \n \n 此患儿的 bmi 在性别特异性 bmi 百分位图上落入\"肥胖\"区域（参考图表）。 \n 若配合性别特异性百分位图使用，bmi 在儿童中的评估效能与成人相同。 "}, {"id": "AMC-Q1397", "type": "mcq", "qid": 1397, "title": "超重儿童的初始检查 — TSH 排除甲减", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["超重儿童 — TSH 筛查排除甲状腺功能减退"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1397-Overweight-Child-TSH.md", "stem": "<p>Parents of an 11-year-old boy have brought him to your clinic for assessment because they believe he is obese. On examination, his weight and height are on 90 and 50 percentiles for sex- and age-matched growth charts respectively. Which one of the following is the most appropriate investigation to consider for him?</p>", "options": [{"letter": "A", "text": "GH."}, {"letter": "B", "text": "FSH and LH."}, {"letter": "C", "text": "TSH."}, {"letter": "D", "text": "Bone age."}, {"letter": "E", "text": "Reassure he has normal growth and investigation is required."}], "rationale": "<p>1. 题型识别：检查选择 — 超重儿童的病因筛查 2. 关键线索：体重 90 百分位 + 身高 50 百分位 → <strong>超重</strong>（BMI >85 百分位） 3. 继发性肥胖的鉴别：甲减是最需要考虑的可治疗性病因</p>\n<ul>\n<li>GH（A）：矮身材才需评估，此患儿身高正常（50 百分位）</li>\n<li>FSH/LH（B）：青春期延迟才需评估</li>\n<li>骨龄（D）：矮身材的初始评估，不适用于超重</li>\n<li>仅 reassurance（E）：超重不能单纯 reassurance，需排查继发原因</li>\n<p>4. 锁定答案：TSH → C</p>\n</ul>", "traps": "<ul>\n<li><strong>\"身高正常就不用查\"陷阱</strong>：身高 50 百分位看起来正常，但不能因此 reassurance（E）；超重需要排查继发原因</li>\n<li><strong>GH 混淆</strong>：矮身材才查 GH，此患儿身高正常</li>\n<li><strong>骨龄混淆</strong>：骨龄用于矮身材评估，不用于超重</li>\n</ul>", "summary": "<p>儿童超重/肥胖评估要点：</p>\n<ul>\n<li>BMI 必须用性别特异性百分位图（US-CDC: >85 百分位超重, >95 百分位肥胖）</li>\n<li>儿童期超重肥胖持续到成年的风险随年龄和父母肥胖而增加</li>\n<li><strong>父母体重是儿童体重的最强预测因素之一</strong></li>\n<li>超重/肥胖患儿需排除继发性原因：<strong>TSH（筛查甲减）</strong></li>\n<li>临床评估还包括：青春期阶段、合并症指标（血压升高、关节痛、胰岛素抵抗等）</li>\n</ul>", "explanation": "<p>该男孩体重 90 百分位、身高 50 百分位 → 按 US-CDC 标准为超重（>85 百分位）。超重/肥胖儿童的初始评估需通过病史和临床评估确定当前健康问题和未来疾病风险。</p>\n<p>在选项中，TSH 是排除甲状腺功能减退（作为超重的潜在原因）的合适检查。</p>\n<p>GH 和 FSH/LH 仅在有特定临床线索时考虑（如矮身材需评估 GH，青春期延迟需查 FSH/LH）。骨龄通常用于矮身材的初始评估。此男孩已超重，不能单纯 reassurance。</p>", "references": "<ul>\n<li>RACGP - Adolescent overweight and obesity</li>\n<li>NHMRC - Clinical Practice Guidelines for the management of overweight and obesity</li>\n</ul>", "related": ["AMC-Q1312-Childhood-BMI-Obesity", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "超重儿童的初始检查 — tsh 排除甲减\n超重儿童 — tsh 筛查排除甲状腺功能减退\n parents of an 11-year-old boy have brought him to your clinic for assessment because they believe he is obese. on examination, his weight and height are on 90 and 50 percentiles for sex- and age-matched growth charts respectively. which one of the following is the most appropriate investigation to consider for him? \n 该男孩体重 90 百分位、身高 50 百分位 → 按 us-cdc 标准为超重（>85 百分位）。超重/肥胖儿童的初始评估需通过病史和临床评估确定当前健康问题和未来疾病风险。 \n 在选项中，tsh 是排除甲状腺功能减退（作为超重的潜在原因）的合适检查。 \n gh 和 fsh/lh 仅在有特定临床线索时考虑（如矮身材需评估 gh，青春期延迟需查 fsh/lh）。骨龄通常用于矮身材的初始评估。此男孩已超重，不能单纯 reassurance。 "}, {"id": "AMC-Q1411", "type": "mcq", "qid": 1411, "title": "4 岁夜间遗尿 — 正常发育，等待自愈", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["4 岁夜间遗尿 — 未达遗尿症诊断年龄，等待自愈"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1411-Four-Year-Old-Bedwetting.md", "stem": "<p>A mother has brought her four-year-old son with complaint of nighttime bed wetting. According to her, he wets his bed 3-4 time a week at night despite achievement of daytime continence at the age of two years. He is otherwise asymptomatic. Physical examination is unremarkable. Which one of the following is the most appropriate management regarding this complaint?</p>", "options": [{"letter": "A", "text": "Bed wetting alarms."}, {"letter": "B", "text": "Nasal desmopressin."}, {"letter": "C", "text": "Amitriptyline."}, {"letter": "D", "text": "Waiting for spontaneous resolution."}, {"letter": "E", "text": "Ultrasonography of the bladder, ureters and kidneys."}], "rationale": "<p>1. 题型识别：管理决策 — 夜间遗尿的治疗时机 2. 关键线索：</p>\n<ul>\n<li>4 岁男孩</li>\n<li>每周 3-4 次夜间遗尿</li>\n<li>2 岁时已实现日间排尿控制（单症状性）</li>\n<li>体格检查正常</li>\n<p>3. 核心规则：<strong>ICCS 遗尿症诊断标准 = ≥5 岁</strong></p>\n<li>4 岁未达标 → 不是疾病，是正常发育过程</li>\n<li>≈84% 儿童在 5 岁时实现完全夜间膀胱控制</li>\n<p>4. 排除选项：</p>\n<li>遗尿报警器/去氨加压素/阿米替林 → 均为 ≥5 岁确诊遗尿症后才考虑</li>\n<li>超声检查 → 无临床指征</li>\n<p>5. 锁定答案：等待自愈 → D</p>\n</ul>", "traps": "<ul>\n<li><strong>\"已日间控制 + 仍在遗尿 = 必须治疗\"陷阱</strong>：日间控制早（2 岁）≠ 夜间也该早控制。夜间控制比日间晚是正常现象</li>\n<li><strong>家长焦虑陷阱</strong>：家长抱怨 ≠ 疾病；4 岁夜间遗尿是正常发育阶段</li>\n<li><strong>年龄阈值陷阱</strong>：遗尿症诊断年龄为 ≥5 岁，4 岁不满足</li>\n</ul>", "summary": "<p><strong>遗尿症（enuresis）</strong> ICCS 定义：≥5 岁儿童睡眠期间间歇性尿失禁。</p>\n<ul>\n<li><strong>单症状性</strong>：仅夜间遗尿，日间正常</li>\n<li><strong>非单症状性</strong>：夜间遗尿 + 日间症状（尿流异常/尿急/排尿困难/滴沥）</li>\n</ul>\n<p>治疗层级（≥5 岁确诊后）： 1. 一线：遗尿报警器（条件反射训练）+ 液体摄入/如厕/奖励系统指导 2. 二线：去氨加压素（合成加压素类似物）— 适合追求短期快速改善或报警器失败/不适合者 3. 三线：三环类抗抑郁药（阿米替林）— 报警器 + 去氨加压素均失败后</p>\n<p><strong>≈84% 儿童在 5 岁时实现完全夜间膀胱控制</strong>。4 岁遗尿 = 正常，等待自愈。</p>", "explanation": "<p>根据 ICCS 定义，遗尿症指 ≥5 岁儿童睡眠期间发生尿失禁。此患儿仅 4 岁，不满足遗尿症诊断标准，极有可能在 5 岁前自行解决。约 84% 儿童在 5 岁时实现完全夜间膀胱控制。</p>\n<p>遗尿报警器适用于年龄 ≥5 岁、液体摄入/如厕/奖励系统指导无效的患儿。去氨加压素是 ≥5 岁患儿的一线药物治疗（报警器替代选择）。阿米替林（三环类抗抑郁药）为三线治疗。超声检查仅在有临床指征（非单症状性或日间症状）时考虑。此 4 岁患儿目前无需任何检查或治疗。</p>", "references": "<ul>\n<li>The Royal Children's Hospital (RCH) - Enuresis - Bed wetting and Monosymptomatic Enuresis</li>\n<li>RACGP - Behavioural interventions including alarms: bedwetting (enuresis)</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "4 岁夜间遗尿 — 正常发育，等待自愈\n4 岁夜间遗尿 — 未达遗尿症诊断年龄，等待自愈\n a mother has brought her four-year-old son with complaint of nighttime bed wetting. according to her, he wets his bed 3-4 time a week at night despite achievement of daytime continence at the age of two years. he is otherwise asymptomatic. physical examination is unremarkable. which one of the following is the most appropriate management regarding this complaint? \n 根据 iccs 定义，遗尿症指 ≥5 岁儿童睡眠期间发生尿失禁。此患儿仅 4 岁，不满足遗尿症诊断标准，极有可能在 5 岁前自行解决。约 84% 儿童在 5 岁时实现完全夜间膀胱控制。 \n 遗尿报警器适用于年龄 ≥5 岁、液体摄入/如厕/奖励系统指导无效的患儿。去氨加压素是 ≥5 岁患儿的一线药物治疗（报警器替代选择）。阿米替林（三环类抗抑郁药）为三线治疗。超声检查仅在有临床指征（非单症状性或日间症状）时考虑。此 4 岁患儿目前无需任何检查或治疗。 "}, {"id": "AMC-Q1427", "type": "mcq", "qid": 1427, "title": "女童血性分泌物 — 阴道异物", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["女童血性分泌物 — 阴道异物（无瘙痒排除感染）"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1427-Vaginal-Foreign-Body.md", "stem": "<p>Concerned mother of a 6-year-old girl has brought her to your attention because she has frequently noticed blood-stained yellow discharge on her panties. She is otherwise healthy. There is no complaint of itching or urinary symptoms. The girl lives with her mother and birth father. On examination, the vitals are within normal ranges. On inspection, there is mild erythema of the vulva and perianal area and offensive blood-stained yellow discharge in the introitus. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Monilial vulvovaginitis."}, {"letter": "B", "text": "Vaginal foreign body."}, {"letter": "C", "text": "Atrophic vulvovaginitis."}, {"letter": "D", "text": "Sexual abuse."}, {"letter": "E", "text": "Threadworm infestation."}], "rationale": "<p>1. 题型识别：诊断 — 青春期前女童阴道分泌物的病因鉴别 2. 关键线索：血性黄色分泌物、恶臭、外阴轻度红斑、<strong>无瘙痒</strong>、无泌尿症状、与亲生父母同住 3. 鉴别排除：</p>\n<ul>\n<li>念珠菌外阴阴道炎（A）：<strong>瘙痒是突出症状</strong> → 缺失排除</li>\n<li>萎缩性外阴阴道炎（C）：青春期前雌激素低，但以稀薄分泌物为主，非血性 → 排除</li>\n<li>性虐待（D）：需有社会线索（非亲生父/行为改变/其他损伤）→ 本题信息不支持</li>\n<li>蛲虫（E）：<strong>瘙痒为主</strong>，搔抓可致出血，但无瘙痒 → 几乎可排除</li>\n<p>4. 锁定答案：血性恶臭分泌物 + 无瘙痒 → 阴道异物（B）</p>\n</ul>", "traps": "<ul>\n<li><strong>瘙痒缺失是关键</strong>：念珠菌和蛲虫都以瘙痒为核心症状；题中明确 \"no itching\" → 两者均可排除</li>\n<li><strong>性虐待过度警觉</strong>：与亲生父母同住、无行为改变、无其他损伤 → 不优先考虑性虐待</li>\n<li><strong>\"blood-stained\" 不等于 trauma/abuse</strong>：阴道异物是青春期前女童血性分泌物最常见原因之一</li>\n</ul>", "summary": "<p>青春期前女童阴道分泌物鉴别：</p>\n<ul>\n<li><strong>阴道异物</strong>：血性、恶臭、无瘙痒</li>\n<li><strong>念珠菌性外阴阴道炎</strong>：瘙痒突出、白色凝乳状分泌物</li>\n<li><strong>蛲虫感染</strong>：夜间肛周/外阴瘙痒为主、搔抓可致出血</li>\n<li><strong>萎缩性外阴阴道炎</strong>：青春期前生理性低雌激素、稀薄非血性分泌物</li>\n<li><strong>性虐待</strong>：需社会/行为线索、损伤证据</li>\n</ul>", "explanation": "<p>血性恶臭黄色分泌物 + 无瘙痒 → 阴道异物最可能。</p>\n<p>念珠菌外阴阴道炎以瘙痒为最突出症状。萎缩性外阴阴道炎为青春期前生理性低雌激素所致，分泌物稀薄非血性。性虐待需有社会/行为线索（非亲生父、行为改变、其他损伤），本患儿与亲生父母同住，无其他线索。蛲虫感染可致外阴阴道炎，瘙痒最突出，搔抓可致出血，但无瘙痒几乎可排除。</p>", "references": "<ul>\n<li>RCH – Prepubescent gynaecology</li>\n<li>Government of Western Australia - Child and Adolescent Health Service – Vulvovaginitis</li>\n<li>Australian Prescriber – Vulval disease in childhood</li>\n</ul>", "related": ["_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "女童血性分泌物 — 阴道异物\n女童血性分泌物 — 阴道异物（无瘙痒排除感染）\n concerned mother of a 6-year-old girl has brought her to your attention because she has frequently noticed blood-stained yellow discharge on her panties. she is otherwise healthy. there is no complaint of itching or urinary symptoms. the girl lives with her mother and birth father. on examination, the vitals are within normal ranges. on inspection, there is mild erythema of the vulva and perianal area and offensive blood-stained yellow discharge in the introitus. which one of the following could be the most likely diagnosis? \n 血性恶臭黄色分泌物 + 无瘙痒 → 阴道异物最可能。 \n 念珠菌外阴阴道炎以瘙痒为最突出症状。萎缩性外阴阴道炎为青春期前生理性低雌激素所致，分泌物稀薄非血性。性虐待需有社会/行为线索（非亲生父、行为改变、其他损伤），本患儿与亲生父母同住，无其他线索。蛲虫感染可致外阴阴道炎，瘙痒最突出，搔抓可致出血，但无瘙痒几乎可排除。 "}, {"id": "AMC-Q1580", "type": "mcq", "qid": 1580, "title": "身高体重等比增高 — 筛查血糖", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "General", "approach": [], "topic": ["身高体重等比增高 → 筛查血糖（糖尿病）"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/General/AMC-Q1580-Tall-Stature-Blood-Sugar.md", "stem": "<p>Tom, 10 years old, is brought to your clinic by his mother who is concerned about his height and weight. She says Tom has always been the biggest boy in his classes since he started school. On examination, his weight and height are on 96 and 97 percentile, respectively. Which one of the following would be the most important initial evaluation to consider?</p>", "options": [{"letter": "A", "text": "TSH."}, {"letter": "B", "text": "Urine cortisol level."}, {"letter": "C", "text": "Bone age."}, {"letter": "D", "text": "Blood sugar."}, {"letter": "E", "text": "MRI of the head."}], "rationale": "<p>1. 题型识别：检查选择 — 等比高大儿童的病因筛查 2. 关键线索：</p>\n<ul>\n<li>体重 96 百分位 + <strong>身高 97 百分位</strong> → 等比增高（不是超重/肥胖！）</li>\n<li>\"always been the biggest boy\" → 长期趋势，非近期突变</li>\n<p>3. 核心区分：</p>\n<li><strong>体重 >> 身高</strong> = 超重/肥胖 → 查 TSH（排除甲减）</li>\n<li><strong>身高 ≈ 体重</strong>（等比增高）→ 考虑内分泌/代谢原因 → <strong>首选血糖</strong>（筛查糖尿病）</li>\n<p>4. 排除：</p>\n<li>TSH（A）：适用于超重（体重>>身高），此患儿等比</li>\n<li>尿皮质醇（B）：Cushing 综合征（满月脸、向心性肥胖）时才考虑</li>\n<li>骨龄（C）：常用于矮身材评估</li>\n<li>头 MRI（E）：无颅内病变线索</li>\n<p>5. 锁定答案：血糖 → D</p>\n</ul>", "traps": "<ul>\n<li><strong>\"96%ile = 超重 → 查 TSH\"陷阱</strong>：身高也在 97 百分位 → 是等比增高，不是超重！需区分超重（体重>>身高）和等比增长</li>\n<li><strong>骨龄混淆</strong>：骨龄用于矮身材评估，不用于高大身材的初始筛查</li>\n<li><strong>垂体/内分泌过度联想</strong>：垂体性巨人症罕见，糖尿病是更常见的高大身材可治性病因</li>\n</ul>", "summary": "<p>儿童生长评估核心原则：</p>\n<ul>\n<li><strong>体重 >> 身高</strong> = 超重/肥胖 → TSH（排除甲减）</li>\n<li><strong>身高 ≈ 体重等比增高</strong> → 血糖（筛查糖尿病）</li>\n<li>骨龄 = 矮身材评估工具</li>\n<li>尿皮质醇 = Cushing 综合征评估</li>\n<li>头 MRI = 垂体病变评估</li>\n</ul>", "explanation": "<p>该男孩体重 96 百分位、身高 97 百分位，为等比增长。这与之前超重患儿不同（Q1397：体重 90 百分位、身高 50 百分位 = 超重 → TSH）。</p>\n<p>对于等比高大儿童，糖尿病是需要排除的重要可治性病因。血糖是最重要的初始评估。</p>\n<p>TSH 适用于超重（体重>>身高）而非等比高大儿童。尿皮质醇仅在 Cushing 综合征特征（满月脸、向心性肥胖等）时考虑。骨龄用于矮身材评估。头 MRI 无临床指征。</p>", "references": "<ul>\n<li>RACGP - Adolescent overweight and obesity</li>\n</ul>", "related": ["AMC-Q1397-Overweight-Child-TSH", "AMC-Q1312-Childhood-BMI-Obesity", "_MOC-Paediatrics"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "身高体重等比增高 — 筛查血糖\n身高体重等比增高 → 筛查血糖（糖尿病）\n tom, 10 years old, is brought to your clinic by his mother who is concerned about his height and weight. she says tom has always been the biggest boy in his classes since he started school. on examination, his weight and height are on 96 and 97 percentile, respectively. which one of the following would be the most important initial evaluation to consider? \n 该男孩体重 96 百分位、身高 97 百分位，为等比增长。这与之前超重患儿不同（q1397：体重 90 百分位、身高 50 百分位 = 超重 → tsh）。 \n 对于等比高大儿童，糖尿病是需要排除的重要可治性病因。血糖是最重要的初始评估。 \n tsh 适用于超重（体重>>身高）而非等比高大儿童。尿皮质醇仅在 cushing 综合征特征（满月脸、向心性肥胖等）时考虑。骨龄用于矮身材评估。头 mri 无临床指征。 "}, {"id": "AMC-Q1029", "type": "mcq", "qid": 1029, "title": "AMC-Q1029 — Marfan syndrome in a 9-year-old boy", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Genetics", "approach": [], "topic": ["Marfan 综合征 — 心脏评估"], "difficulty": 3, "correctAnswer": "C", "page": 1334, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Genetics/AMC-Q1029-Marfan-Echo.md", "stem": "<p>A 9-year-old boy is brought to your attention by his parents because of poor exercise tolerance. He is a member of the school basketball team but recently, it has been hard for him to play because he becomes short of breath and tired soon after he starts playing. On examination, his height is at 97 percentile and weight at 3 percentile. Which one of the following is the most important step in management?</p>", "options": [{"letter": "A", "text": "Karyotyping"}, {"letter": "B", "text": "Bone scan"}, {"letter": "C", "text": "Cardiac ultrasound"}, {"letter": "D", "text": "Growth hormone test"}, {"letter": "E", "text": "CT scan"}], "rationale": "<ul>\n<li>临床线索：<strong>高瘦</strong>（97 百分位身高、3 百分位体重）+ <strong>运动不耐受</strong> → 高度提示 Marfan 综合征（MFS）</li>\n<li>MFS = 常染色体显性结缔组织病，<strong>FBN1 突变</strong>（90-93%），少数 TGFBR2（MFS2）</li>\n<li>三大系统：心血管、骨骼、视觉</li>\n<li><strong>心脏疾病是 MFS 致死的首位原因</strong></li>\n<li>临床怀疑 → 立即行<strong>超声心动图</strong>评估：</li>\n<li>主动脉根部扩张（最重要）</li>\n<li>二尖瓣脱垂</li>\n<li>各选项分析：</li>\n<li>A（核型分析）：用于 Turner/Klinefelter 等染色体病</li>\n<li>B（骨扫描）：骨折/转移灶</li>\n<li>D（生长激素）：用于矮小症</li>\n<li>E（CT 扫描）：超声已可诊断，无需 CT</li>\n</ul>", "traps": "<ul>\n<li>选 A（核型分析）— Marfan 是单基因病，<strong>不是染色体数目异常</strong></li>\n<li>选 D（生长激素）— 患儿是<strong>过高</strong>而非过矮，方向反了</li>\n</ul>", "summary": "<p><strong>Marfan syndrome 关键点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tbody>\n<tr><td>遗传</td><td>AD，<strong>FBN1</strong>（原纤维蛋白-1）</td></tr>\n<tr><td>表现</td><td>主动脉瘤/夹层、晶状体脱位、长骨过度生长</td></tr>\n<tr><td><strong>首要死因</strong></td><td><strong>心血管</strong>（主动脉瘤/夹层）</td></tr>\n<tr><td>首选检查</td><td><strong>超声心动图</strong>（评估主动脉根部）</td></tr>\n<tr><td>治疗</td><td>β 受体阻滞剂（首选，即使儿童）</td></tr>\n</tbody>\n</table>\n<p><strong>所有 MFS 患者需定期超声随访</strong>。</p>", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Marfan 综合征（MFS）应在高瘦儿童的鉴别诊断中始终考虑</strong>。</p>\n<p>MFS 是一种常染色体显性结缔组织病，累及心血管、骨骼和视觉系统，以及皮肤、肺和硬脑膜。患病率至少为 1/5000。<strong>90-93% 的 MFS 由 FBN1 基因突变引起</strong>。少数由第二个基因 TGFBR2 突变引起，称为 MFS2。根据目前的统计，MFS2 占 MFS 病例的 10%。</p>\n<p>主要表现包括主动脉瘤和夹层、晶状体脱位和长骨过度生长。<strong>心脏病是 MFS 患者发病和死亡的首要原因</strong>。</p>\n<p>当基于临床怀疑 MFS 时，应进行<strong>超声心动图</strong>作为最合适的下一步管理，以评估主动脉根部扩张（最重要的）和二尖瓣脱垂——这些是 MFS 患者常见的状况。前者更常见且临床意义更大。</p>\n<p>所有确诊的个体都应进行系列超声心动图监测。频率应由心脏病专家根据个体情况调整。根据目前的证据，<strong>β 受体阻滞剂仍是主动脉扩张的一线治疗</strong>（除非有禁忌证，如哮喘患者），即使在儿童中也如此。</p>", "references": "<ul>\n<li>The Cardiac Society of Australia and New Zealand - Guidelines for the diagnosis and management of Marfan Syndrome</li>\n<li>UpToDate - Genetics, clinical features, and diagnosis of Marfan syndrome and related disorders</li>\n</ul>", "related": ["AMC-Q1030-Marfan-Murmur-AR"], "bodyHtml": "", "diseases": ["Marfan Syndrome"], "complaints": [], "search": "amc-q1029 — marfan syndrome in a 9-year-old boy\nmarfan 综合征 — 心脏评估\n a 9-year-old boy is brought to your attention by his parents because of poor exercise tolerance. he is a member of the school basketball team but recently, it has been hard for him to play because he becomes short of breath and tired soon after he starts playing. on examination, his height is at 97 percentile and weight at 3 percentile. which one of the following is the most important step in management? \n correct answer is  c  \n  marfan 综合征（mfs）应在高瘦儿童的鉴别诊断中始终考虑 。 \n mfs 是一种常染色体显性结缔组织病，累及心血管、骨骼和视觉系统，以及皮肤、肺和硬脑膜。患病率至少为 1/5000。 90-93% 的 mfs 由 fbn1 基因突变引起 。少数由第二个基因 tgfbr2 突变引起，称为 mfs2。根据目前的统计，mfs2 占 mfs 病例的 10%。 \n 主要表现包括主动脉瘤和夹层、晶状体脱位和长骨过度生长。 心脏病是 mfs 患者发病和死亡的首要原因 。 \n 当基于临床怀疑 mfs 时，应进行 超声心动图 作为最合适的下一步管理，以评估主动脉根部扩张（最重要的）和二尖瓣脱垂——这些是 mfs 患者常见的状况。前者更常见且临床意义更大。 \n 所有确诊的个体都应进行系列超声心动图监测。频率应由心脏病专家根据个体情况调整。根据目前的证据， β 受体阻滞剂仍是主动脉扩张的一线治疗 （除非有禁忌证，如哮喘患者），即使在儿童中也如此。 "}, {"id": "AMC-Q1030", "type": "mcq", "qid": 1030, "title": "AMC-Q1030 — Marfan syndrome cardiac murmur", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Genetics", "approach": [], "topic": ["Marfan 综合征 — 主动脉瓣返流杂音"], "difficulty": 3, "correctAnswer": "B", "page": 1335, "tags": [], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Genetics/AMC-Q1030-Marfan-Murmur-AR.md", "stem": "<p>A 14-year-old boy has clinically apparent Marfan syndrome. Which of the following cardiac murmurs would you expect to hear on cardiac auscultation?</p>", "options": [{"letter": "A", "text": "Midsystolic ejection murmur at the second right intercostal space"}, {"letter": "B", "text": "Decrescendo high-pitched diastolic murmur at the left sternal edge"}, {"letter": "C", "text": "Low-pitched rumbling diastolic murmur at the apex"}, {"letter": "D", "text": "Pansystolic murmur at the left sternal edge with no radiation"}, {"letter": "E", "text": "Continuous machinery murmur at the second left intercostal space"}], "rationale": "<ul>\n<li>MFS 最常见心脏表现：<strong>主动脉根部病变</strong> → 主动脉瘤样扩张 → <strong>主动脉瓣返流（AR）</strong></li>\n<li>AR 杂音特点：</li>\n<li><strong>舒张期</strong></li>\n<li><strong>渐弱型</strong>（decrescendo）</li>\n<li><strong>高频</strong></li>\n<li><strong>胸骨左缘最响</strong></li>\n<li>持续时间反映 AR 严重程度</li>\n<li>各选项杂音鉴别：</li>\n<li>A（第二肋间右缘收缩期喷射性）= 主动脉狭窄 / HOCM</li>\n<li>C（心尖部低调舒张期隆隆样）= 严重 AR 的 <strong>Austin-Flint 杂音</strong>（次要可能）</li>\n<li>D（胸骨左缘全收缩期无放射）= <strong>VSD</strong></li>\n<li>E（第二肋间左缘连续机器样）= <strong>PDA</strong></li>\n</ul>", "traps": "<ul>\n<li>选 A（AS/HOCM 杂音）— MFS 的核心问题不是流出道梗阻，而是<strong>返流</strong></li>\n<li>选 E（PDA）— PDA 与 MFS 无关</li>\n</ul>", "summary": "<p><strong>MFS 心脏表现谱</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>病变</th><th>杂音</th></tr></thead>\n<tbody>\n<tr><td><strong>主动脉根部扩张 + AR</strong>（最常见）</td><td>舒张期渐弱型高频杂音，胸骨左缘</td></tr>\n<tr><td>二尖瓣脱垂（MVP）</td><td>中-晚收缩期喀喇音 ± 收缩晚期杂音</td></tr>\n<tr><td>严重 AR 引起 Austin-Flint</td><td>心尖部舒张中期隆隆样杂音</td></tr>\n<tr><td>流量性收缩期杂音</td><td>因每搏量增加</td></tr>\n</tbody>\n</table>\n<p><strong>杂音 = 心血管结构改变的听诊线索</strong>；MFS 听到 AR 杂音 → 主动脉根部已扩张。</p>", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>主动脉根部病变是 Marfan 综合征（MFS）最常见的心脏表现</strong>。这导致动脉瘤样扩张、主动脉瓣返流（AR）和主动脉夹层。这些情况是 MFS 患者死亡和发病最常见的原因。</p>\n<p><strong>主动脉扩张见于约 50% 的 MFS 儿童和 60-80% 的 MFS 成人</strong>。AR 常存在。心脏检查时，最可能听到慢性 AR 引起的杂音。</p>\n<p><strong>AR 的杂音是舒张期渐弱型杂音，通常为高频音，在胸骨左缘最响</strong>。杂音的持续时间与 AR 的严重程度相关；杂音响度则不相关。</p>\n<p>MFS 合并 AR 的其他可能杂音包括：</p>\n<ul>\n<li><strong>Austin-Flint 杂音</strong>：在舒张期，血流通过关闭不全的主动脉瓣返流，冲击二尖瓣前叶，导致该瓣膜过早关闭。这在心尖部产生舒张中期隆隆样杂音。Austin-Flint 杂音见于严重 AR 的患者。</li>\n<li>由于每搏量增加，也可能存在功能性收缩期流量性杂音。</li>\n</ul>\n<p><strong>注</strong>——MFS 患者也可能有二尖瓣脱垂。二尖瓣脱垂的经典听诊发现是中-晚收缩期喀喇音，由于瓣叶脱垂入左心房导致二尖瓣装置紧张所致。该喀喇音可能伴有或不伴有心尖部的高调中-晚期收缩期杂音。</p>\n<ul>\n<li>（选项 A）第二右肋间的收缩中期喷射性杂音是主动脉狭窄和肥厚性梗阻性心肌病（HOCM）的特征。</li>\n<li>（选项 C）心尖部的低调隆隆样舒张中期杂音（Austin-Flint 杂音）也可见于 MFS 合并严重 AR 的患者。然而，这是较不常见的发现。</li>\n<li>（选项 D）胸骨左缘全收缩期杂音无放射是室间隔缺损（VSD）的特征。</li>\n<li>（选项 E）第二左肋间连续机器样杂音是动脉导管未闭（PDA）的特征。</li>\n</ul>", "references": "<ul>\n<li>The Cardiac Society of Australia and New Zealand - Guidelines for the diagnosis and management of Marfan Syndrome</li>\n<li>UpToDate - Genetics, clinical features, and diagnosis of Marfan syndrome and related disorders</li>\n<li>Medscape - Aortic Regurgitation</li>\n</ul>", "related": ["AMC-Q1029-Marfan-Echo"], "bodyHtml": "", "diseases": ["Marfan Syndrome"], "complaints": [], "search": "amc-q1030 — marfan syndrome cardiac murmur\nmarfan 综合征 — 主动脉瓣返流杂音\n a 14-year-old boy has clinically apparent marfan syndrome. which of the following cardiac murmurs would you expect to hear on cardiac auscultation? \n correct answer is  b  \n  主动脉根部病变是 marfan 综合征（mfs）最常见的心脏表现 。这导致动脉瘤样扩张、主动脉瓣返流（ar）和主动脉夹层。这些情况是 mfs 患者死亡和发病最常见的原因。 \n  主动脉扩张见于约 50% 的 mfs 儿童和 60-80% 的 mfs 成人 。ar 常存在。心脏检查时，最可能听到慢性 ar 引起的杂音。 \n  ar 的杂音是舒张期渐弱型杂音，通常为高频音，在胸骨左缘最响 。杂音的持续时间与 ar 的严重程度相关；杂音响度则不相关。 \n mfs 合并 ar 的其他可能杂音包括： \n \n  austin-flint 杂音 ：在舒张期，血流通过关闭不全的主动脉瓣返流，冲击二尖瓣前叶，导致该瓣膜过早关闭。这在心尖部产生舒张中期隆隆样杂音。austin-flint 杂音见于严重 ar 的患者。 \n 由于每搏量增加，也可能存在功能性收缩期流量性杂音。 \n \n  注 ——mfs 患者也可能有二尖瓣脱垂。二尖瓣脱垂的经典听诊发现是中-晚收缩期喀喇音，由于瓣叶脱垂入左心房导致二尖瓣装置紧张所致。该喀喇音可能伴有或不伴有心尖部的高调中-晚期收缩期杂音。 \n \n （选项 a）第二右肋间的收缩中期喷射性杂音是主动脉狭窄和肥厚性梗阻性心肌病（hocm）的特征。 \n （选项 c）心尖部的低调隆隆样舒张中期杂音（austin-flint 杂音）也可见于 mfs 合并严重 ar 的患者。然而，这是较不常见的发现。 \n （选项 d）胸骨左缘全收缩期杂音无放射是室间隔缺损（vsd）的特征。 \n （选项 e）第二左肋间连续机器样杂音是动脉导管未闭（pda）的特征。 \n "}, {"id": "AMC-Q0906", "type": "mcq", "qid": 906, "title": "儿童 ITP — 血小板 >20k、仅瘀点瘀斑、一般情况好 → 观察等待", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Haematology", "approach": ["treatment", "diagnosis"], "topic": ["Immune Thrombocytopenic Purpura", "Child", "Watchful Waiting", "Platelet >20k"], "difficulty": 3, "correctAnswer": "A", "page": 1318, "tags": ["mcq", "amc", "paediatrics", "haematology", "itp", "immune-thrombocytopenic-purpura", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Haematology/AMC-Q0906-ITP-Watchful-Waiting.md", "stem": "<p>A 5-year-old boy with generalized petechial rash and bruises. URTI 3 weeks ago. Otherwise healthy. Platelets 74,000/mm3, RBC/WBC normal. Most appropriate management?</p>", "options": [{"letter": "A", "text": "Strict bed rest."}, {"letter": "B", "text": "Intravenous immunoglobulin (IVIG)."}, {"letter": "C", "text": "Steroids."}, {"letter": "D", "text": "Antibiotics."}, {"letter": "E", "text": "Plasma exchange."}], "rationale": "<p>1. <strong>题型识别</strong>：儿童 URTI 后孤立血小板减少 + 瘀点瘀斑 → ITP。问\"处理\"。 2. <strong>ITP 本质</strong>：儿童 ITP 良性、病因不明；急性 ~90%，慢性 ~10%（>6 月，部分作者用 12 月）。 3. <strong>诊断</strong>：血小板减少 + 无其他异常（无苍白、LAD、肝脾大）；排除白血病等其他原因。 4. <strong>管理两派</strong>：观察等待 vs 药物，均未被证明更优。 5. <strong>观察等待指征</strong>（本例符合）：</p>\n<ul>\n<li>血小板 >20×10⁹/L，部分 <20k 也可门诊</li>\n<li>诊断明确，无苍白/肝脾大/LAD，仅孤立血小板减少</li>\n<li>无活动出血（仅瘀点瘀斑），无黏膜/胃肠/肾出血</li>\n<li>一般情况好，家庭监护可靠，数日内随访</li>\n<p>6. <strong>排除药物</strong>：</p>\n<li>B IVIG：仅危及生命出血时用。</li>\n<li>C 激素：若用药，口服激素一线；但本例 plt >20k、无出血，不需。</li>\n<li>D 抗生素：无作用。</li>\n<li>E 血浆置换：不用于 ITP。</li>\n<p>7. <strong>锁定 A</strong>（bed rest = 保护 + 观察；核心是观察等待）。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"见血小板减少就上激素/IVIG\"陷阱</strong>：错。儿童 ITP 多自限，>20k 且无出血 → 观察。</li>\n<li><strong>\"IVIG 一线\"陷阱</strong>：错。仅严重危及生命出血。</li>\n<li><strong>\"抗生素\"陷阱</strong>：错。ITP 非感染。</li>\n<li><strong>忽视白血病排除</strong>：诊断需排除白血病（有苍白/肝脾大/LAD 则警惕）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Isolated thrombocytopenia after URTI in otherwise healthy child → immune (idiopathic) thrombocytopenic purpura (ITP), benign. Acute ~90%, chronic ~10% (>6 months). Diagnosis by exclusion (no pallor, LAD, hepatosplenomegaly; exclude leukemia).</p>\n<p>Management controversial: watchful waiting vs pharmacologic; neither proven superior. Most with platelets >20×10⁹/L (some <20k) can be managed outpatient with no specific treatment if: certain diagnosis, no pallor/hepatosplenomegaly/LAD, isolated thrombocytopenia, no active bleeding beyond bruising/petechiae, otherwise well, safe home, follow-up in days.</p>\n<p>(B) IVIG reserved for life-threatening hemorrhage. (C) This child plt >20k, no hemorrhage, otherwise well → no pharmacologic treatment; if planned, oral steroids first-line. (D) Antibiotics no role. (E) Plasma exchange not an option.</p>", "references": "<ul>\n<li>RCH - Immune thrombocytopenic purpura</li>\n<li>UpToDate - Immune thrombocytopenia (ITP) in children: Management of chronic disease</li>\n<li>Medscape - Immune Thrombocytopenia (ITP)</li>\n</ul>", "related": ["AMC-Q1325-HSP-Nephritis", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["ITP"], "complaints": [], "search": "儿童 itp — 血小板 >20k、仅瘀点瘀斑、一般情况好 → 观察等待\nimmune thrombocytopenic purpura child watchful waiting platelet >20k\ntreatment diagnosis\n a 5-year-old boy with generalized petechial rash and bruises. urti 3 weeks ago. otherwise healthy. platelets 74,000/mm3, rbc/wbc normal. most appropriate management? \n correct answer is  a  \n isolated thrombocytopenia after urti in otherwise healthy child → immune (idiopathic) thrombocytopenic purpura (itp), benign. acute ~90%, chronic ~10% (>6 months). diagnosis by exclusion (no pallor, lad, hepatosplenomegaly; exclude leukemia). \n management controversial: watchful waiting vs pharmacologic; neither proven superior. most with platelets >20×10⁹/l (some  \n (b) ivig reserved for life-threatening hemorrhage. (c) this child plt >20k, no hemorrhage, otherwise well → no pharmacologic treatment; if planned, oral steroids first-line. (d) antibiotics no role. (e) plasma exchange not an option. "}, {"id": "AMC-Q0761", "type": "mcq", "qid": 761, "title": "Pertussis — 传染期已过（>21 天咳嗽）→ 不需停学", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Pertussis", "School Exclusion", "Infectious Period", "NHMRC Guidelines"], "difficulty": 3, "correctAnswer": "A", "page": 1301, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "whooping-cough", "school-exclusion", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0761-Pertussis-School-Exclusion.md", "stem": "<p>A 7-year-old boy is brought to your clinic with a 2-week history of paroxysms of cough and vomiting at the end of coughing episodes during school holidays. Cough is dry and is worse at night. His mother is worried whether he should go to school, which is going to start in 2 days. Which one of the following would be the most appropriate approach regarding this situation?</p>", "options": [{"letter": "A", "text": "No exclusion is required."}, {"letter": "B", "text": "Exclude from school."}, {"letter": "C", "text": "Exclude from the school and start antibiotics."}, {"letter": "D", "text": "The child can go to school after antibiotics are started."}, {"letter": "E", "text": "The decision depends on the child's immunization status."}], "rationale": "<p>1. <strong>题型识别</strong>：已确诊 pertussis（阵咳 + 咳末呕吐 + 夜重）→ 问\"停学 / 隔离决策\"。 2. <strong>Pertussis 三期</strong>：</p>\n<ul>\n<li>Catarrhal（卡他）1 周</li>\n<li>Paroxysmal（阵发）咳嗽成串</li>\n<li>Convalescence（恢复）</li>\n<p>3. <strong>传染期</strong>：自咳嗽起 <strong>21 天</strong>，或阵咳起 <strong>14 天</strong>（若日期明确）。本例阵咳已 2 周 → 处于传染期末尾。 4. <strong>停学规则（index case）</strong>：</p>\n<li>开始恰当抗生素后 <strong>5 天</strong>，或</li>\n<li>任一阵咳起 <strong>21 天</strong>，或</li>\n<li>阵咳起 <strong>14 天</strong>（若日期明确）</li>\n<li>本例开学在阵咳起 14 天后 → 已不传染 → <strong>无需停学</strong>。</li>\n<p>5. <strong>抗生素的局限</strong>：仅在 catarrhal / 早 paroxysmal 期（<14 天咳嗽）用才能缩短停学期；本例已 >14 天，抗生素不能改变停学判定。 6. <strong>疫苗状态的作用</strong>：只决定<strong>密切接触者（contacts）</strong>是否停学，<strong>不</strong>决定 index case。 7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"有咳嗽 = 要停学\"陷阱</strong>：错。是否停学看<strong>传染期</strong>（21 天），不是\"还在咳\"。</li>\n<li><strong>\"抗生素能立刻复课\"陷阱</strong>：错。抗生素仅在前 14 天内用才缩短停学期。</li>\n<li><strong>\"看疫苗状态决定 index case\"陷阱</strong>：错。疫苗状态只用于 contacts 判定。</li>\n<li><strong>把 paroxysmal 期当成 still infectious</strong>：本例已到 21 天边界 → 不传染。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>临床符合 <strong>whooping cough (pertussis)，Bordetella pertussis</strong> 所致。潜伏期 7–14 天（可达 20 天），三期：Catarrhal → Paroxysmal → Convalescence。</p>\n<p>抗生素指征：catarrhal / 早 paroxysmal 期（可能减轻严重度）；咳嗽 <14 天（减轻传播、缩短停学期）；住院；并发症（肺炎、发绀、呼吸暂停）。</p>\n<p>Index case 停学：开始恰当抗生素后 5 天，或任一阵咳起 21 天，或阵咳起 14 天（若日期明确）。本例开学在阵咳起 14 天后 → 不传染 → 不需停学。</p>\n<p>若在前 14 天内就诊，抗生素可缩短停学期。阵咳已 14 天（catarrhal 期算 21 天）→ 已处传染期末尾。</p>\n<p>疫苗状态指导 <strong>密切接触者</strong>的停学，而非 index case。</p>", "references": "<ul>\n<li>RCH - Whooping cough (pertussis)</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n<li>RACGP - Pertussis Presentation, investigation and management</li>\n</ul>", "related": ["AMC-Q0762-Pertussis-Infant-Admission", "AMC-Q0763-Pertussis-Prophylaxis", "AMC-Q0764-Pertussis-Vaccine-Contraindication", "TR-Measles-Exclusion", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": ["cough", "nausea/vomiting"], "search": "pertussis — 传染期已过（>21 天咳嗽）→ 不需停学\npertussis school exclusion infectious period nhmrc guidelines\nprevention\n a 7-year-old boy is brought to your clinic with a 2-week history of paroxysms of cough and vomiting at the end of coughing episodes during school holidays. cough is dry and is worse at night. his mother is worried whether he should go to school, which is going to start in 2 days. which one of the following would be the most appropriate approach regarding this situation? \n correct answer is  a  \n 临床符合  whooping cough (pertussis)，bordetella pertussis  所致。潜伏期 7–14 天（可达 20 天），三期：catarrhal → paroxysmal → convalescence。 \n 抗生素指征：catarrhal / 早 paroxysmal 期（可能减轻严重度）；咳嗽  \n index case 停学：开始恰当抗生素后 5 天，或任一阵咳起 21 天，或阵咳起 14 天（若日期明确）。本例开学在阵咳起 14 天后 → 不传染 → 不需停学。 \n 若在前 14 天内就诊，抗生素可缩短停学期。阵咳已 14 天（catarrhal 期算 21 天）→ 已处传染期末尾。 \n 疫苗状态指导  密切接触者 的停学，而非 index case。 "}, {"id": "AMC-Q0762", "type": "mcq", "qid": 762, "title": "Pertussis — 婴儿 <6 月 → 住院观察（呼吸暂停/发绀风险）", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["treatment", "diagnosis"], "topic": ["Pertussis", "Infant <6mo", "Admission", "Apnea", "Cyanosis"], "difficulty": 3, "correctAnswer": "C", "page": 1303, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "infant", "admission", "approach-treatment", "approach-diagnosis"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0762-Pertussis-Infant-Admission.md", "stem": "<p>A 5-month-old child is brought to your practice with a 10-day history of cough paroxysms followed by inspiratory whoop and vomiting. There is no cyanosis associated with bouts of cough, and the child is well between the attacks. Which one of the following is the most appropriate action now?</p>", "options": [{"letter": "A", "text": "Reassure."}, {"letter": "B", "text": "Prescribe a 5-day course of antibiotics and discharge the child home."}, {"letter": "C", "text": "Admit the child to the hospital for observation."}, {"letter": "D", "text": "Chemoprophylaxis of the household."}, {"letter": "E", "text": "Vaccinate the household."}], "rationale": "<p>1. <strong>题型识别</strong>：5 月龄婴儿 + 阵咳 + 吸气性 whoop + 咳末呕吐 → 典型 pertussis。问\"下一步最合适处理\"。 2. <strong>年龄是决策关键</strong>：<6 月龄婴儿是 pertussis 重症/死亡高危。 3. <strong>澳洲指南住院指征</strong>：</p>\n<ul>\n<li>婴儿 <strong><6 个月</strong></li>\n<li>任何有并发症者（呼吸暂停、发绀、肺炎、脑病）</li>\n<p>4. <strong>本例</strong>：5 月龄（<6 月）→ 直接满足住院标准，无论当前有无发绀。 5. <strong>抗生素的层次</strong>：住院后当然要抗生素（如 azithromycin），但<strong>住院优先于</strong>开药带回家。 6. <strong>Chemoprophylaxis</strong>：仅当家中有 <strong><6 月婴儿</strong> 或 <strong><3 剂疫苗</strong> 的接触者时才给；本例问的是 index case 的处理，不是家属。 7. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"well between attacks = 可放心\"陷阱</strong>：错。婴儿 <6 月随时可能呼吸暂停，必须监护。</li>\n<li><strong>\"开 5 天抗生素带回家\"陷阱</strong>：错。应先住院；抗生素是住院后的一部分。</li>\n<li><strong>\"给全家预防\"陷阱</strong>：错。预防用药看家属中的高危接触者，不是 blanket 给药。</li>\n<li><strong>\"补疫苗\"陷阱</strong>：错。急性期补疫苗对当前感染无益（可日后鼓励 catch-up）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>临床符合 pertussis（Bordetella pertussis）。婴儿表现可不典型（whoop 少、catarrhal 期短），更多表现为呛咳、喘息、发绀、呼吸暂停或非特异症状（喂养差、惊厥）。</p>\n<p><strong>澳洲指南住院标准</strong>：</p>\n<ul>\n<li>婴儿 <6 个月</li>\n<li>任何有并发症者（呼吸暂停、发绀、肺炎、脑病）</li>\n</ul>\n<p>本例 <6 月 → 收入院进一步处理。</p>\n<p>抗生素指征：catarrhal / 早 paroxysmal 期；咳嗽 <14 天；住院；并发症。住院后给 azithromycin。</p>\n<p>Chemoprophylaxis 仅当家中有 <6 月婴儿或 <3 剂疫苗的接触者（index case 除外）。catch-up 免疫可日后鼓励，但不是急性期处理。</p>", "references": "<ul>\n<li>RCH - Whooping cough (pertussis)</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n<li>RACGP - Pertussis Presentation, investigation and management</li>\n</ul>", "related": ["AMC-Q0761-Pertussis-School-Exclusion", "AMC-Q0763-Pertussis-Prophylaxis", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": ["cough", "nausea/vomiting"], "search": "pertussis — 婴儿 <6 月 → 住院观察（呼吸暂停/发绀风险）\npertussis infant <6mo admission apnea cyanosis\ntreatment diagnosis\n a 5-month-old child is brought to your practice with a 10-day history of cough paroxysms followed by inspiratory whoop and vomiting. there is no cyanosis associated with bouts of cough, and the child is well between the attacks. which one of the following is the most appropriate action now? \n correct answer is  c  \n 临床符合 pertussis（bordetella pertussis）。婴儿表现可不典型（whoop 少、catarrhal 期短），更多表现为呛咳、喘息、发绀、呼吸暂停或非特异症状（喂养差、惊厥）。 \n  澳洲指南住院标准 ： \n \n 婴儿  \n 任何有并发症者（呼吸暂停、发绀、肺炎、脑病） \n \n 本例  \n 抗生素指征：catarrhal / 早 paroxysmal 期；咳嗽  \n chemoprophylaxis 仅当家中有  "}, {"id": "AMC-Q0763", "type": "mcq", "qid": 763, "title": "Pertussis — 未免疫的密切接触 sibling → 尽快补种 dTpa", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention", "treatment"], "topic": ["Pertussis", "Post-exposure Prophylaxis", "Close Contacts", "Vaccination"], "difficulty": 4, "correctAnswer": "C", "page": 1305, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "chemoprophylaxis", "post-exposure-prophylaxis", "approach-prevention", "approach-treatment"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0763-Pertussis-Prophylaxis.md", "stem": "<p>A 7-month-old child is brought to your practice with paroxysmal cough and vomiting for 2 weeks and relative wellness in between paroxysms. You suspect he may have whooping cough (pertussis). He has already been started on azithromycin. He lives at home with his mother, father and older brothers, aged 3 and 5 years. Neither of his brothers have been immunized against pertussis. Which one of the following options is the most appropriate next action to take?</p>", "options": [{"letter": "A", "text": "Arrange to have the child admitted to hospital, and isolated immediately."}, {"letter": "B", "text": "Report the family to the child protection agency in your state for failing to immunize their children."}, {"letter": "C", "text": "Immediately vaccinate his brothers."}, {"letter": "D", "text": "Prescribe azithromycin for the whole family."}, {"letter": "E", "text": "Take no action."}], "rationale": "<p>1. <strong>题型识别</strong>：已用 azithromycin 的 7 月 pertussis 患儿 + 未免疫的 3 岁/5 岁兄弟 → 问\"下一步\"。 2. <strong>患儿本身</strong>：>6 月、无发绀/呼吸暂停/肺炎 → <strong>不需住院</strong>（排除 A）。 3. <strong>家长的选择权</strong>：是否疫苗由父母决定，不是向儿童保护机构举报的事由（排除 B）。 4. <strong>暴露后预防（PEP）指征</strong>（index case 传染期内，且首次接触在窗口内）：</p>\n<ul>\n<li>儿童：<strong><6 月</strong>；或 <strong><3 剂 pertussis 疫苗</strong>；或家有 <strong><6 月</strong> 成员；或同班日托有 <6 月婴儿</li>\n<li>成人：孕末月待产父母；产科/新生儿病房医护；<6 月婴儿日托工作者；家有 <6 月成员</li>\n<p>5. <strong>本例兄弟</strong>：3 岁、5 岁均未免疫（<3 剂）→ <strong>应给预防性抗生素</strong>。但选项 D（全家）错在把<strong>父母</strong>也包进去（父母不符合）。 6. <strong>无\"只给兄弟预防\"的干净选项</strong> → 立即给两个未免疫兄弟<strong>补种疫苗</strong>是最合适的替代（后续仍应 PEP）。 7. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"上报儿童保护\"陷阱</strong>：错。拒绝疫苗是父母权利，非举报事由。</li>\n<li><strong>\"全家预防\"陷阱</strong>：错。父母不符合 PEP 标准；且 blanket 给药不被推荐。</li>\n<li><strong>\"住院隔离患儿\"陷阱</strong>：错。患儿 >6 月、稳定，不需住院。</li>\n<li><strong>\"不处理\"陷阱</strong>：错。未免疫接触者需干预（补种 / PEP）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>患儿 >6 月、无严重并发症 → 不需住院。父母对疫苗的决定权受保护，不能因未接种而上报儿童保护机构；接种也不能强制。</p>\n<p>PEP 指征（index case 传染期内 + 首次接触在窗口内）：</p>\n<ul>\n<li>儿童：<6 月；或 <3 剂疫苗；或家有 <6 月成员；或日托同班有 <6 月婴儿</li>\n<li>成人：孕末月父母；产科/新生儿医护；<6 月婴儿日托者；家有 <6 月成员</li>\n</ul>\n<p>本例 3 岁、5 岁兄弟应给 PEP，但父母不应给。无\"仅兄弟预防\"选项时，立即给两未免疫兄弟补种是最合适替代。已接种成人若 10 年内未打含 pertussis 疫苗 → 加强 dTpa。</p>", "references": "<ul>\n<li>RCH - Whooping cough (pertussis)</li>\n<li>CDNA National Guidelines for Public Health Units - Pertussis</li>\n<li>RACGP - Pertussis Presentation, investigation and management</li>\n</ul>", "related": ["AMC-Q0762-Pertussis-Infant-Admission", "AMC-Q0764-Pertussis-Vaccine-Contraindication", "MOC-Paediatrics"], "bodyHtml": "", "diseases": ["Pertussis"], "complaints": ["cough", "nausea/vomiting"], "search": "pertussis — 未免疫的密切接触 sibling → 尽快补种 dtpa\npertussis post-exposure prophylaxis close contacts vaccination\nprevention treatment\n a 7-month-old child is brought to your practice with paroxysmal cough and vomiting for 2 weeks and relative wellness in between paroxysms. you suspect he may have whooping cough (pertussis). he has already been started on azithromycin. he lives at home with his mother, father and older brothers, aged 3 and 5 years. neither of his brothers have been immunized against pertussis. which one of the following options is the most appropriate next action to take? \n correct answer is  c  \n 患儿 >6 月、无严重并发症 → 不需住院。父母对疫苗的决定权受保护，不能因未接种而上报儿童保护机构；接种也不能强制。 \n pep 指征（index case 传染期内 + 首次接触在窗口内）： \n \n 儿童： \n 成人：孕末月父母；产科/新生儿医护； \n \n 本例 3 岁、5 岁兄弟应给 pep，但父母不应给。无\"仅兄弟预防\"选项时，立即给两未免疫兄弟补种是最合适替代。已接种成人若 10 年内未打含 pertussis 疫苗 → 加强 dtpa。 "}, {"id": "AMC-Q0764", "type": "mcq", "qid": 764, "title": "Pertussis 疫苗 — 热性惊厥**不是**接种禁忌", "department": "Paediatrics", "subcategory": "Paediatrics", "rawSubcategory": "Infectious-Disease", "approach": ["prevention"], "topic": ["Pertussis Vaccine", "DTPa", "Contraindications", "Febrile Convulsion"], "difficulty": 3, "correctAnswer": "A", "page": 1307, "tags": ["mcq", "amc", "paediatrics", "infectious-disease", "pertussis", "vaccination", "dtpa", "contraindication", "approach-prevention"], "cssclass": "mcq-paediatrics", "color": "#2d8f96", "file": "03-Paediatrics/Infectious-Disease/AMC-Q0764-Pertussis-Vaccine-Contraindication.md", "stem": "<p>Which one of the following statements is correct about pertussis?</p>", "options": [{"letter": "A", "text": "Febrile convulsions are not a contraindication for vaccination against pertussis."}, {"letter": "B", "text": "DTPa cannot be given with another live virus-containing vaccine."}, {"letter": "C", "text": "Pertussis vaccine should not be given to a child with infantile convulsions."}, {"letter": "D", "text": "Erythromycin reduces the severity of the signs and symptoms."}, {"letter": "E", "text": "Prophylaxis is always indicated for the entire household."}], "rationale": "<p>1. <strong>题型识别</strong>：pertussis 疫苗相关\"正确陈述\"题（反向/选是题）。 2. <strong>热性惊厥 vs 疫苗</strong>：DTPa 后 48h 内热性惊厥极少见；6 月龄内（完成基础针）更少见。有既往史者后续剂次风险略增，但<strong>退热预防可最小化</strong> → 仍推荐。 3. <strong>同时接种</strong>：同日接种活+灭活疫苗<strong>不</strong>降低抗体、不增不良反应 → DTPa 可与活病毒疫苗同用（B 错）。 4. <strong>婴儿痉挛/癫痫</strong>：含 pertussis 疫苗<strong>不</strong>引起；活动/进展性神经疾病患儿也可安全接种（C 错）。 5. <strong>抗生素（红霉素）</strong>：<strong>不</strong>减轻症状严重度，只缩短传染期、降低传播（D 错）。 6. <strong>全家预防</strong>：常规不推荐（除
