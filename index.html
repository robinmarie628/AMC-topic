分裂症常以阴性症状起病，后出现阳性症状</li>\n<li><strong>病程决定诊断</strong>：>6个月=精神分裂症；≤6个月=分裂样精神障碍；<1个月=短暂精神病性障碍</li>\n<li><strong>\"与想象中的人对话\"是幻听</strong>：言语性听觉幻觉的强提示，不是正常自言自语</li>\n</ul>", "summary": "<p><strong>精神分裂症 (Schizophrenia)</strong>：</p>\n<ul>\n<li>核心症状：幻觉（多为幻听）、妄想、言语紊乱、行为紊乱、阴性症状</li>\n<li>前驱期：常以阴性症状和社会功能下降起病，持续数月-数年（本例2年）</li>\n<li>诊断：≥2项核心症状 + 显著功能损害 + ≥6个月病程 + 排除其他病因</li>\n<li>阴性症状：情感平淡、意志缺乏、社交退缩、言语贫乏、自我照顾差</li>\n</ul>\n<p><strong>鉴别诊断（按病程）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>病程</th><th>关键特点</th></tr></thead>\n<tbody>\n<tr><td>短暂精神病性障碍</td><td><1个月</td><td>完全恢复至病前功能</td></tr>\n<tr><td>分裂样精神障碍</td><td>≤6个月</td><td>症状类似分裂症但更短</td></tr>\n<tr><td>精神分裂症</td><td>≥6个月</td><td>显著功能损害</td></tr>\n</tbody>\n</table>", "explanation": "<p>患者的\"与想象中的人对话\"代表幻觉；缺乏动力、孤僻、自我照顾差是持续2年以上的阴性症状。病程超过6个月，且有明显的社会或职业功能障碍（学业差、辍学），符合精神分裂症的诊断标准。重性抑郁（A）可在重性抑郁发作背景下出现精神病性症状，但本例先有2年阴性症状后有阳性症状，更支持精神分裂症。躯体或物质相关病因（B）在场景中无任何提示，且与父母同住的青少年物质滥用2年不被察觉不太可能。短暂精神病性障碍（D）的鉴别要点是症状<1个月并最终恢复至病前功能。分裂样精神障碍（E）症状不超过6个月。</p>", "references": "<ul>\n<li>RANZCP - clinical practice guidelines for the management of schizophrenia and related disorders</li>\n<li>UpToDate - Schizophrenia in adults: Clinical manifestations, course, assessment, and diagnosis</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "精神分裂症 — 青少年期前驱期 + 幻觉\n精神分裂症 — 青少年期前驱期（阴性症状2年）+ 幻觉，病程>6个月\n a 17-year-old boy is brought to your office by his mother for evaluation. history reveals that he had always been a good student until the age 15 when his grades began dropping. his mother has also noticed that he has stopped socializing with friends and begun spending more time alone in his room. he dropped the school earlier this year due to poor school performance. his mother reports that he has been trying to home-school him, but he does not seem interested in learning. days go before he takes bath and he does not seem to care about his appearance. what concerns the mother most and has led her to bringing him to see a psychiatrist is the fact that for the past 2 months, she has overheard him having what sounds like conversations with someone imaginary in his room. which one of the following could be the most likely diagnosis? \n 患者的\"与想象中的人对话\"代表幻觉；缺乏动力、孤僻、自我照顾差是持续2年以上的阴性症状。病程超过6个月，且有明显的社会或职业功能障碍（学业差、辍学），符合精神分裂症的诊断标准。重性抑郁（a）可在重性抑郁发作背景下出现精神病性症状，但本例先有2年阴性症状后有阳性症状，更支持精神分裂症。躯体或物质相关病因（b）在场景中无任何提示，且与父母同住的青少年物质滥用2年不被察觉不太可能。短暂精神病性障碍（d）的鉴别要点是症状 "}, {"id": "AMC-Q0877", "type": "mcq", "qid": 877, "title": "ECT — 逆行性遗忘 (Retrograde Amnesia)", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["ECT — 认知副作用：逆行性遗忘（retrograde amnesia）"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0877-ECT-Retrograde-Amnesia.md", "stem": "<p>A 50-year-old man presents to your practice, significantly concerned about amnesia. He relates that he has been to a place for work for the first time with one of his colleagues. He thought that this is his first time he had ever visited that place but his colleague was surprised and told him that he had visited this place before and wondered why he could not remember. His past medical history is significant for electroconvulsive therapy (ECT) sessions due to major depression with last session being 3 months ago. Which one of the following in the history best justifies his presenting complaint?</p>", "options": [{"letter": "A", "text": "History of dementia in his cousin."}, {"letter": "B", "text": "History of depression."}, {"letter": "C", "text": "Previous ECT sessions."}, {"letter": "D", "text": "De javu."}, {"letter": "E", "text": "Relapse of his major depression."}], "rationale": "<p>1. 题型识别：病史判断 — 哪种病史最能解释遗忘症状 2. 症状解读：忘记曾去过的地方 = <strong>逆行性遗忘</strong>（忘记近期记忆） 3. ECT认知副作用三型：</p>\n<ul>\n<li>急性意识混乱：术后10-30分钟消退</li>\n<li>顺行性遗忘：疗程期间发生，疗程结束后2周内恢复</li>\n<li><strong>逆行性遗忘</strong>：忘记疗程期间及疗程前数周-数月的事件，恢复最慢，最令人焦虑</li>\n<p>4. 证据：系统综述显示51-79%的ECT患者报告某种记忆丧失 5. 排除：痴呆（A）患者年轻、表亲痴呆意义不大；抑郁史本身（B）或抑郁复发（E）不能解释遗忘；似曾相识（D，déjà vu）是\"对陌生事物熟悉\"，与本例相反 6. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>déjà vu方向</strong>：déjà vu是对陌生环境的熟悉感（\"来过\"其实没来过）；本例是真实去过却忘记——逆行性遗忘</li>\n<li><strong>ECT vs 抑郁</strong>：抑郁本身可伴认知症状，但遗忘已发生事件的模式与ECT的逆行性遗忘高度吻合</li>\n<li><strong>双侧ECT更严重</strong>：双侧电极放置的逆行性遗忘比右侧单侧更明显</li>\n</ul>", "summary": "<p><strong>ECT认知副作用（三型）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>表现</th><th>恢复</th></tr></thead>\n<tbody>\n<tr><td>急性意识混乱</td><td>发作+麻醉所致</td><td>术后10-30分钟</td></tr>\n<tr><td>顺行性遗忘</td><td>难以保留新信息</td><td>疗程结束后~2周内</td></tr>\n<tr><td>逆行性遗忘</td><td>忘记疗程期间及之前数周-数月事件</td><td>最慢，部分可能恢复</td></tr>\n</tbody>\n</table>\n<p><strong>关键要点</strong>：</p>\n<ul>\n<li>最焦虑、最可怕的副作用是<strong>逆行性遗忘</strong></li>\n<li>对公共/世界事件知识的遗忘比个人记忆更持久</li>\n<li>双侧ECT > 右侧单侧</li>\n<li>ECT指征：精神病性抑郁、强烈自杀观念、其他治疗无效、既往ECT有效</li>\n<li>51-79%的患者报告某种程度的记忆丧失</li>\n</ul>", "explanation": "<p>在给定选项中，既往ECT是最合适且最能解释该男子当前问题的病史——即忘记过去事件（逆行性遗忘）。ECT是多种精神疾病的治疗选择，最常见指征为精神病性特征的重性抑郁、强烈自杀观念、对其它治疗无反应及既往对ECT反应良好。多数患者在ECT疗程期间及之后会报告一些认知副作用。逆行性遗忘定义为忘记近期记忆，是ECT最令人焦虑和恐惧的认知效应，受累记忆为ECT疗程期间及之前数周至数月的事件。双侧ECT较右侧单侧造成更多逆行性遗忘。既往ECT的逆行性遗忘比顺行性遗忘恢复更慢，部分记忆可能恢复而部分不能。痴呆（A）通常先以定向障碍起病（先是对地点），但该男子年纪尚轻，且表亲患痴呆并非重要危险因素。抑郁史（B）或抑郁复发（E）均不能解释遗忘。déjà vu（D）是对陌生事物的熟悉感，与本例相反。</p>", "references": "<ul>\n<li>SA Health - Electroconvulsive Therapy Policy Guideline</li>\n<li>Overview of electroconvulsive therapy (ECT) for adults</li>\n<li>NSW Health - Electroconvulsive Therapy: ECT Minimum Standard of Practice in NSW</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "ect — 逆行性遗忘 (retrograde amnesia)\nect — 认知副作用：逆行性遗忘（retrograde amnesia）\n a 50-year-old man presents to your practice, significantly concerned about amnesia. he relates that he has been to a place for work for the first time with one of his colleagues. he thought that this is his first time he had ever visited that place but his colleague was surprised and told him that he had visited this place before and wondered why he could not remember. his past medical history is significant for electroconvulsive therapy (ect) sessions due to major depression with last session being 3 months ago. which one of the following in the history best justifies his presenting complaint? \n 在给定选项中，既往ect是最合适且最能解释该男子当前问题的病史——即忘记过去事件（逆行性遗忘）。ect是多种精神疾病的治疗选择，最常见指征为精神病性特征的重性抑郁、强烈自杀观念、对其它治疗无反应及既往对ect反应良好。多数患者在ect疗程期间及之后会报告一些认知副作用。逆行性遗忘定义为忘记近期记忆，是ect最令人焦虑和恐惧的认知效应，受累记忆为ect疗程期间及之前数周至数月的事件。双侧ect较右侧单侧造成更多逆行性遗忘。既往ect的逆行性遗忘比顺行性遗忘恢复更慢，部分记忆可能恢复而部分不能。痴呆（a）通常先以定向障碍起病（先是对地点），但该男子年纪尚轻，且表亲患痴呆并非重要危险因素。抑郁史（b）或抑郁复发（e）均不能解释遗忘。déjà vu（d）是对陌生事物的熟悉感，与本例相反。 "}, {"id": "AMC-Q0886", "type": "mcq", "qid": 886, "title": "神经性厌食 — 基础检查 (DXA 非基础检查)", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["神经性厌食 — 基础检查（DXA非基础检查，病程>6个月才做）"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0886-Anorexia-Basic-Investigations.md", "stem": "<p>Which one of the following is not considered a basic investigation for patients with anorexia nervosa?</p>", "options": [{"letter": "A", "text": "Electrolytes."}, {"letter": "B", "text": "Urinalysis."}, {"letter": "C", "text": "Liver function tests."}, {"letter": "D", "text": "DXA scan."}, {"letter": "E", "text": "Electrocardiogram (ECG)."}], "rationale": "<p>1. 题型识别：NOT型 — 哪项<strong>不是</strong>神经性厌食的基础检查 2. 神经性厌食基础基线检查：</p>\n<ul>\n<li>体格+精神状态评估</li>\n<li>全血检查（FBE）+ ESR</li>\n<li>代谢全套（Na, K, BUN, Cl, BS, HCO₃）</li>\n<li><strong>尿常规</strong>（酮体、比重）</li>\n<li><strong>肝功能</strong>（LFTs）</li>\n<li><strong>电解质</strong></li>\n<li>妊娠试验（育龄期）</li>\n<li><strong>心电图（ECG）</strong></li>\n<p>3. 特殊规则：BMI<14 kg/m² 的厌食患者需<strong>超声心动图</strong>；病程>6个月需<strong>DXA骨扫描</strong> 4. 理由：DXA用于评估骨质疏松/骨量减少，是<strong>随访评估</strong>而非基线检查 5. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>DXA不是基线检查</strong>：虽然有指征，但条件是\"病程>6个月\"，且放在病程管理后段，不属于基础检查</li>\n<li><strong>ECG是基础检查</strong>：心脏问题是厌食症首位死因，所有患者都应做ECG；BMI<14才加做超声心动图</li>\n<li><strong>不能只记住\"查什么\"</strong>：要区分基线（所有患者）+ 特定指征（DXA、超声心动图）</li>\n</ul>", "summary": "<p><strong>神经性厌食（AN）</strong>：</p>\n<ul>\n<li>特征：不能维持正常体重、恐惧体重增加、体像扭曲、不切实际地自评过重</li>\n<li>两型：限制型（严格节食）；暴食/清除型（呕吐、泻药、利尿剂、灌肠）</li>\n</ul>\n<p><strong>基础检查（所有患者）</strong>：</p>\n<ul>\n<li>体格检查+精神状态评估</li>\n<li>FBE（全血）+ ESR</li>\n<li>代谢全套：Na, K, BUN, Cl, BS, HCO₃</li>\n<li>尿常规：酮体、比重（反映脱水/禁食）</li>\n<li>肝功能（LFTs）</li>\n<li>妊娠试验（育龄期）</li>\n<li><strong>ECG</strong>（心脏问题是首位死因）</li>\n</ul>\n<p><strong>特定指征检查</strong>：</p>\n<ul>\n<li>BMI<14 kg/m² → 超声心动图（Echocardiography）</li>\n<li>病程>6个月 → <strong>DXA骨扫描</strong>（评估骨量减少/骨质疏松）</li>\n</ul>\n<p><strong>临床特征（营养缺乏相关）</strong>：低体温、肢端发绀、静息心动过缓（40-49bpm）、低血压、体位性低血压、肌肉量减少、低血糖、低甲状旁腺激素、LFT升高、白细胞降低</p>", "explanation": "<p>进食障碍为临床诊断，无确定性诊断性检查；但因饥饿对多器官系统的负面影响，每位厌食患者都应做基线检查：体格与精神状态评估、全血（FBE）与ESR、代谢全套（电解质）、尿常规（酮体与比重）、肝功能、妊娠试验（育龄期）、心电图。脱水与液体摄入增多均可致电解质失衡，影响心脏传导系统和中枢神经系统，故电解质（A）应查；心脏问题是厌食症首要死因，ECG（E）必须作为重要基础评估，BMI<14需超声心动图；尿常规（B）反映水化状态，酮尿提示饥饿；长期饥饿损害肝功能，故LFT（C）为基础检查。厌食与贪食患者可有中枢性性腺功能减退和雌激素缺乏，导致骨量减少与骨质疏松，病程>6个月的厌食患者应行DXA骨扫描（D），但该检查<strong>不属于基础基线检查</strong>，可在管理后期进行。</p>", "references": "<ul>\n<li>RACGP - GP Learning - Eating disorders: a quick guide</li>\n<li>Medscape - Anorexia Nervosa</li>\n<li>UpToDate - Anorexia nervosa in adults and adolescents: Medical complications and their management</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "神经性厌食 — 基础检查 (dxa 非基础检查)\n神经性厌食 — 基础检查（dxa非基础检查，病程>6个月才做）\n which one of the following is not considered a basic investigation for patients with anorexia nervosa? \n 进食障碍为临床诊断，无确定性诊断性检查；但因饥饿对多器官系统的负面影响，每位厌食患者都应做基线检查：体格与精神状态评估、全血（fbe）与esr、代谢全套（电解质）、尿常规（酮体与比重）、肝功能、妊娠试验（育龄期）、心电图。脱水与液体摄入增多均可致电解质失衡，影响心脏传导系统和中枢神经系统，故电解质（a）应查；心脏问题是厌食症首要死因，ecg（e）必须作为重要基础评估，bmi 6个月的厌食患者应行dxa骨扫描（d），但该检查 不属于基础基线检查 ，可在管理后期进行。 "}, {"id": "AMC-Q0888", "type": "mcq", "qid": 888, "title": "躁狂 vs 轻躁狂 — 鉴别要点", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["躁狂 vs 轻躁狂 — 鉴别要点（情绪高涨不能区分二者）"], "difficulty": 3, "correctAnswer": "E", "page": 1506, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0888-Mania-vs-Hypomania.md", "stem": "<p>Which one of the following features does not help to differentiate mania from hypomania?</p>", "options": [{"letter": "A", "text": "Delusions."}, {"letter": "B", "text": "Hallucinations."}, {"letter": "C", "text": "Functional impairment."}, {"letter": "D", "text": "Need for hospitalization."}, {"letter": "E", "text": "Elevated mood."}], "rationale": "<p>1. 题型识别：NOT型 — 哪项特征<strong>不能</strong>区分躁狂与轻躁狂 2. 对比表：</p>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>躁狂 (Mania)</th><th>轻躁狂 (Hypomania)</th></tr></thead>\n<tbody>\n<tr><td>病程</td><td>≥7天</td><td>≥4天</td></tr>\n<tr><td>功能损害</td><td>显著</td><td>无</td></tr>\n<tr><td>妄想/幻觉</td><td>有</td><td>无</td></tr>\n<tr><td>需住院</td><td>常需要</td><td>通常不需要</td></tr>\n<tr><td><strong>情绪高涨</strong></td><td><strong>有</strong></td><td><strong>有</strong></td></tr>\n</tbody>\n</table>\n<p>3. 情绪高涨是躁狂与轻躁狂的<strong>共同核心症状</strong>，无鉴别价值 4. 躁狂 vs 轻躁狂正是双相I型与II型的分类依据 5. 锁定答案：E</p>", "traps": "<ul>\n<li><strong>共同点误当鉴别点</strong>：情绪高涨（expansive/irritable mood）是二者的共同特征——凡是两者都有的特征就不能区分</li>\n<li><strong>病程数字</strong>：躁狂≥7天 vs 轻躁狂≥4天</li>\n<li><strong>分类意义</strong>：躁狂→双相I型；轻躁狂→双相II型</li>\n</ul>", "summary": "<p><strong>躁狂 vs 轻躁狂对照</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>维度</th><th>躁狂 (Mania)</th><th>轻躁狂 (Hypomania)</th></tr></thead>\n<tbody>\n<tr><td>持续时间</td><td>至少7天</td><td>至少4天</td></tr>\n<tr><td>功能损害</td><td>显著</td><td>无明显损害</td></tr>\n<tr><td>精神病性症状（妄想/幻觉）</td><td>可有</td><td>无</td></tr>\n<tr><td>住院需求</td><td>常需要</td><td>通常不需要</td></tr>\n<tr><td>情绪高涨</td><td>有</td><td>有（不能鉴别）</td></tr>\n</tbody>\n</table>\n<p><strong>双相分类</strong>：</p>\n<ul>\n<li>双相I型 = 有躁狂发作</li>\n<li>双相II型 = 仅有轻躁狂（无躁狂）</li>\n</ul>", "explanation": "<p>躁狂与轻躁狂的鉴别要点总结如下：躁狂症状至少持续7天，有显著功能损害，可出现妄想和幻觉，常需要住院；轻躁狂症状至少持续4天，无明显功能损害，无妄想幻觉，通常不需住院。而<strong>情绪高涨在躁狂与轻躁狂中均可见</strong>，不能用于鉴别二者。躁狂与轻躁狂正是双相障碍分类为I型与II型的依据：有躁狂发作者为双相I型，仅有轻躁狂者为双相II型。</p>", "references": "<ul>\n<li>RACGP - AFP - Bipolar disorder (2013)</li>\n<li>UpToDate - Bipolar disorder in adults: Clinical features</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "躁狂 vs 轻躁狂 — 鉴别要点\n躁狂 vs 轻躁狂 — 鉴别要点（情绪高涨不能区分二者）\n which one of the following features does not help to differentiate mania from hypomania? \n 躁狂与轻躁狂的鉴别要点总结如下：躁狂症状至少持续7天，有显著功能损害，可出现妄想和幻觉，常需要住院；轻躁狂症状至少持续4天，无明显功能损害，无妄想幻觉，通常不需住院。而 情绪高涨在躁狂与轻躁狂中均可见 ，不能用于鉴别二者。躁狂与轻躁狂正是双相障碍分类为i型与ii型的依据：有躁狂发作者为双相i型，仅有轻躁狂者为双相ii型。 "}, {"id": "AMC-Q0889", "type": "mcq", "qid": 889, "title": "神经性厌食 — 最重要的危险因素（童年性虐待）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["神经性厌食 — 最重要的危险因素（童年性虐待）"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0889-Anorexia-Risk-Factor-Sexual-Abuse.md", "stem": "<p>Which one of the following is the most important risk factor for developing anorexia nervosa?</p>", "options": [{"letter": "A", "text": "Alcohol abuse."}, {"letter": "B", "text": "Childhood sexual abuse."}, {"letter": "C", "text": "Family history of obesity."}, {"letter": "D", "text": "Family history of athleticism."}, {"letter": "E", "text": "History of substance abuse."}], "rationale": "<p>1. 题型识别：病因/危险因素 — \"最重要\" 2. 进食障碍危险因素：</p>\n<ul>\n<li>遗传因素（同卵双生子共病率高于异卵）</li>\n<li>家庭困扰</li>\n<li><strong>性虐待（最重要）</strong></li>\n<li>节食史</li>\n<li>追求纤瘦与体重社会压力</li>\n<li>强调苗条的运动/艺术项目（跑步、芭蕾、滑冰、体操）</li>\n<p>3. 数据：贪食症患者中童年性虐待史占47-50%；厌食症中关联较弱但仍有23-27% 4. 排除：肥胖家族史（C）与贪食相关；\"瘦/精英运动\"家族史（D）与厌食相关——但均不如性虐待重要；物质滥用（E）是进食障碍的<strong>后果</strong>而非病因；酒精滥用（A）不增加风险 5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>方向混淆</strong>：物质滥用是厌食/贪食的<strong>后果</strong>（用于减重），不是潜在病因</li>\n<li><strong>特异性 vs 强度</strong>：肥胖/苗条家族史虽与特定进食障碍相关，但诱发强度远低于童年性虐待</li>\n<li><strong>酒精不相关</strong>：酒精滥用并不增加厌食/贪食风险</li>\n</ul>", "summary": "<p><strong>进食障碍的危险因素</strong>：</p>\n<ul>\n<li>遗传：单卵双生一致性>异卵双生</li>\n<li>家庭困扰：高期望、沟通不良、家庭矛盾等</li>\n<li><strong>童年性虐待（最重要）</strong></li>\n<li>节食史</li>\n<li>对纤瘦身材的执念与社会体重压力</li>\n<li>强调苗条的运动/艺术活动（跑步、芭蕾、滑冰、体操）</li>\n</ul>\n<p><strong>儿童期性虐待与进食障碍</strong>：</p>\n<ul>\n<li>性虐待破坏自我边界，使内在的饥饿/疲劳/性感受难以识别</li>\n<li>受害者用食物缓解与饥饿无关的各种紧张状态</li>\n<li>部分受害者刻意变胖或变瘦以\"去性化\"自己；另一部分追求\"完美身体\"以重获控制感</li>\n<li>贪食症患者中童年性虐待史47-50%；厌食症23-27%（关联较贪食弱但仍重要）</li>\n<li>贪食症中童年受虐史与抑郁、焦虑、边缘型人格障碍共病相关</li>\n</ul>", "explanation": "<p>在所有选项中，性虐待是贪食症、厌食症及其他进食障碍，以及物质滥用、抑郁和焦虑等其他精神疾病的最重要危险因素。性虐待显著破坏自我边界，使饥饿、疲劳或性欲等内在感受难以识别，受害者可能转向食物来缓解各种与饥饿无关的紧张状态。多项研究发现童年创伤（如性虐待）是贪食症起病及心理治疗中断的危险因素。遗传因素在进食障碍中均增加遗传度和家族史频率：家族史中的\"瘦/精英运动\"（D）与厌食症相关，而贪食障碍与个人或家族肥胖史（C）相关——但这些特异性危险因素不如儿童期性虐待更能触发进食障碍。物质滥用（E）用于减重在厌食/贪食患者中常见，却是疾病的<strong>后果</strong>而非病因。酒精滥用（A）似乎不增加厌食/贪食风险。</p>", "references": "<ul>\n<li>RANZCP - Clinical practice guidelines for the treatment of eating disorders</li>\n<li>PubMed - Childhood sexual abuse and eating disorders in females: findings from the Victorian Adolescent Health Cohort Study</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "神经性厌食 — 最重要的危险因素（童年性虐待）\n神经性厌食 — 最重要的危险因素（童年性虐待）\n which one of the following is the most important risk factor for developing anorexia nervosa? \n 在所有选项中，性虐待是贪食症、厌食症及其他进食障碍，以及物质滥用、抑郁和焦虑等其他精神疾病的最重要危险因素。性虐待显著破坏自我边界，使饥饿、疲劳或性欲等内在感受难以识别，受害者可能转向食物来缓解各种与饥饿无关的紧张状态。多项研究发现童年创伤（如性虐待）是贪食症起病及心理治疗中断的危险因素。遗传因素在进食障碍中均增加遗传度和家族史频率：家族史中的\"瘦/精英运动\"（d）与厌食症相关，而贪食障碍与个人或家族肥胖史（c）相关——但这些特异性危险因素不如儿童期性虐待更能触发进食障碍。物质滥用（e）用于减重在厌食/贪食患者中常见，却是疾病的 后果 而非病因。酒精滥用（a）似乎不增加厌食/贪食风险。 "}, {"id": "AMC-Q0891", "type": "mcq", "qid": 891, "title": "正常悲伤反应 — 短期苯二氮卓类", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["正常悲伤反应 — 短期苯二氮卓类缓解失眠与焦虑"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0891-Grief-Reaction-Temazepam.md", "stem": "<p>A 67-year-old woman comes to your GP clinic 6 weeks after her husband passed away due to prostate cancer. She is sad and tearful and complains that she cannot sleep at night and is also afraid of the dark. She mentions similar feelings 32 years ago after she had a still birth. Which one of the following will help with prompt relief of her symptoms?</p>", "options": [{"letter": "A", "text": "Venlafaxine."}, {"letter": "B", "text": "Electroconvulsive therapy (ECT)."}, {"letter": "C", "text": "Olanzapine."}, {"letter": "D", "text": "Temazepam."}, {"letter": "E", "text": "Citalopram."}], "rationale": "<p>1. 题型识别：治疗 — 悲伤反应的药物选择 2. 场景：67岁女性，丈夫去世6周，悲伤、哭泣、失眠、怕黑 → <strong>正常悲伤反应</strong> 3. 正常悲伤特点：</p>\n<ul>\n<li>悲伤、绝望、哭泣、睡眠/食欲减少</li>\n<li>可出现亡者幻觉（视/听），患者可能担心自己\"疯了\"</li>\n<li>2个月内恢复社会功能；症状可波动长达1年</li>\n<p>4. 处理：常规支持（家庭、社会、宗教）足够；药物极少需要，但<strong>明显失眠和焦虑时可短期（<7天）苯二氮卓类</strong> 5. 排除：</p>\n<li>奥氮平（C）：无精神病性症状，不需要抗精神病药</li>\n<li>文拉法辛（A）/西酞普兰（E）：抗抑郁药用于复杂性悲伤或合并重性抑郁——本例不是</li>\n<li>ECT（B）：仅在极少数复杂性悲伤反应中选择性使用</li>\n<p>6. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>悲伤≠抑郁</strong>：正常悲伤无需抗抑郁药；区分复杂性悲伤/合并重性抑郁才需</li>\n<li><strong>疗程控制</strong>：苯二氮卓类仅短期<7天</li>\n<li><strong>\"怕黑\"与幻觉</strong>：对亡者的视/听幻觉在正常悲伤中常见，不代表精神病性障碍，勿用抗精神病药</li>\n</ul>", "summary": "<p><strong>正常悲伤反应 (Normal Grief Reaction)</strong>：</p>\n<ul>\n<li>常见表现：悲伤、绝望、哭泣、睡眠/食欲下降、兴趣减退</li>\n<li>对逝者的视/听幻觉常见，可致恐惧\"自己疯了\"</li>\n<li>内疚与羞耻不常见但可能存在</li>\n<li>自杀风险通常不是问题</li>\n<li>2个月内恢复正常社会功能；症状可波动持续长达1年</li>\n</ul>\n<p><strong>处理</strong>：</p>\n<ul>\n<li>常规支持（家庭、社会、宗教）通常足够</li>\n<li>药物治疗很少需要</li>\n<li><strong>明显失眠/焦虑</strong> → 短期（<7天）苯二氮卓类（如替马西泮）</li>\n<li>抗抑郁药：复杂性悲伤或合并重性抑郁时</li>\n<li>ECT：极少数选择性复杂悲伤</li>\n</ul>\n<p><strong>鉴别</strong>：</p>\n<ul>\n<li>复杂性悲伤/重性抑郁 → 抗抑郁药</li>\n<li>精神病性特征 → 抗精神病药</li>\n<li>正常悲伤 → 支持 + 短期苯二氮卓类</li>\n</ul>", "explanation": "<p>鉴于症状及其持续时间，正常悲伤反应是该女性问题最可能的解释。悲伤、绝望、哭泣、睡眠减少、食欲减少和兴趣下降都是正常悲伤反应的常见表现；对逝者的视/听觉幻觉常见，可能使丧亲者担心自己\"要疯了\"。正常悲伤患者通常在2个月内恢复正常社会功能，但症状可波动持续长达一年。常规支持（家庭、社会、宗教）通常足以帮助患者度过悲伤。虽然药物通常很少需要，但在指征明确时（过度失眠和焦虑），抗焦虑药和催眠药可提供快速缓解——短期（<7天）苯二氮卓类可用于失眠和焦虑。患者无精神病性特征，无需奥氮平（C）。抗抑郁药如文拉法辛（A）和西酞普兰（E）可能适用于复杂性悲伤或合并重性抑郁的悲伤，本例均不是。ECT（B）极少数情况下可用于选择性复杂悲伤反应。</p>", "references": "<ul>\n<li>UpToDate - Bereavement and grief in adults: Clinical features</li>\n<li>Medscape - What are the DSM-5 criteria for diagnosis of major depressive disorder</li>\n<li>RACGP - AFP - Psychological triage in general practice</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "正常悲伤反应 — 短期苯二氮卓类\n正常悲伤反应 — 短期苯二氮卓类缓解失眠与焦虑\n a 67-year-old woman comes to your gp clinic 6 weeks after her husband passed away due to prostate cancer. she is sad and tearful and complains that she cannot sleep at night and is also afraid of the dark. she mentions similar feelings 32 years ago after she had a still birth. which one of the following will help with prompt relief of her symptoms? \n 鉴于症状及其持续时间，正常悲伤反应是该女性问题最可能的解释。悲伤、绝望、哭泣、睡眠减少、食欲减少和兴趣下降都是正常悲伤反应的常见表现；对逝者的视/听觉幻觉常见，可能使丧亲者担心自己\"要疯了\"。正常悲伤患者通常在2个月内恢复正常社会功能，但症状可波动持续长达一年。常规支持（家庭、社会、宗教）通常足以帮助患者度过悲伤。虽然药物通常很少需要，但在指征明确时（过度失眠和焦虑），抗焦虑药和催眠药可提供快速缓解——短期（ "}, {"id": "AMC-Q0892", "type": "mcq", "qid": 892, "title": "神经性厌食 — 骨质疏松致椎体压缩骨折", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["神经性厌食 — 骨质疏松致椎体压缩骨折"], "difficulty": 3, "correctAnswer": "A", "page": 1515, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0892-Anorexia-Vertebral-Compression-Fracture.md", "stem": "<p>A 32-year-old woman presents to your practice with complaint of back pain, felt between her shoulder blades. Her past medical history is remarkable for anorexia nervosa for 16 years. On examination, she is severely emaciated, weighs 38 kg and has a body mass index (BMI) of 14 kg/m². Palpation of the interscapular region elicits tenderness over the vertebral column. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Vertebral compression fracture."}, {"letter": "B", "text": "Pneumonia."}, {"letter": "C", "text": "Pulmonary embolism."}, {"letter": "D", "text": "Pericardial effusion."}, {"letter": "E", "text": "Metastatic bone lesion."}], "rationale": "<p>1. 题型识别：诊断 — 背痛伴局部压痛 2. 关键线索：</p>\n<ul>\n<li>16年神经性厌食史</li>\n<li>严重消瘦，BMI 14 kg/m²</li>\n<li>肩胛间区背痛，椎体区域<strong>压痛</strong></li>\n<p>3. 病理机制：厌食 → 营养不良 + 雌激素缺乏 → 骨量减少/骨质疏松 → 椎体病理性骨折 4. 椎体是骨质疏松所致病理性骨折最常见的部位 5. 排除：</p>\n<li>肺炎（B）/肺栓塞（C）/心包积液（D）：可牵涉性背痛但<strong>无压痛</strong></li>\n<li>转移性骨病变（E）：可引起病理性骨折，但本例有明确的厌食危险因素、无原发恶性肿瘤线索</li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>牵涉痛 vs 局部痛</strong>：肺炎/PE/心包积液为牵涉性背痛，无脊柱压痛；骨折有局部压痛</li>\n<li><strong>BMI 14 = 严重营养不良</strong>：明显增加骨质疏松风险</li>\n<li><strong>转移性骨病</strong>：无恶性肿瘤线索时，优先考虑厌食相关的骨质疏松性骨折</li>\n</ul>", "summary": "<p><strong>厌食症骨并发症</strong>：</p>\n<ul>\n<li>长期厌食（>6个月）→ 骨量减少（osteopenia）/骨质疏松（osteoporosis）</li>\n<li>机制：营养不良 + 雌激素缺乏（中枢性性腺功能减退）</li>\n<li><strong>椎体是骨质疏松性病理性骨折最常见部位</strong></li>\n<li>治疗：成功治疗厌食症并获得充分体重增加后骨密度可改善</li>\n</ul>\n<p><strong>关键数字</strong>：</p>\n<ul>\n<li>BMI < 14 kg/m² → 需超声心动图</li>\n<li>病程 > 6个月 → 需DXA骨扫描</li>\n</ul>\n<p><strong>骨质疏松性骨折的鉴别</strong>：</p>\n<ul>\n<li>压缩性骨折：局部椎体压痛</li>\n<li>牵涉性疼痛（肺炎、肺栓塞、心包积液）：背痛但无脊柱压痛</li>\n</ul>", "explanation": "<p>患有长期厌食症（>6个月）的患者因营养不良和雌激素缺乏所致的骨量减少与骨质疏松，病理性骨折风险显著增加。骨量减少和骨质疏松是长期厌食症的并发症，通常在厌食症成功治疗并获得足够体重增加后得到改善。椎体是骨质疏松性病理性骨折最常见的部位。本患者患长期厌食症，胸椎区域的疼痛和压痛使压缩性骨折成为最可能的诊断。肺炎（B）、肺栓塞（C）和心包积液（D）可导致背部牵涉痛，但不会有压痛。转移性骨病变（E）可致病理性骨折，但一方面有厌食症这一显著危险因素，另一方面无潜在原发恶性肿瘤的线索，因此转移性骨病可能性较小。</p>", "references": "<ul>\n<li>Eating Disorders: Treatment and management of anorexia nervosa</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "神经性厌食 — 骨质疏松致椎体压缩骨折\n神经性厌食 — 骨质疏松致椎体压缩骨折\n a 32-year-old woman presents to your practice with complaint of back pain, felt between her shoulder blades. her past medical history is remarkable for anorexia nervosa for 16 years. on examination, she is severely emaciated, weighs 38 kg and has a body mass index (bmi) of 14 kg/m². palpation of the interscapular region elicits tenderness over the vertebral column. which one of the following could be the most likely diagnosis? \n 患有长期厌食症（>6个月）的患者因营养不良和雌激素缺乏所致的骨量减少与骨质疏松，病理性骨折风险显著增加。骨量减少和骨质疏松是长期厌食症的并发症，通常在厌食症成功治疗并获得足够体重增加后得到改善。椎体是骨质疏松性病理性骨折最常见的部位。本患者患长期厌食症，胸椎区域的疼痛和压痛使压缩性骨折成为最可能的诊断。肺炎（b）、肺栓塞（c）和心包积液（d）可导致背部牵涉痛，但不会有压痛。转移性骨病变（e）可致病理性骨折，但一方面有厌食症这一显著危险因素，另一方面无潜在原发恶性肿瘤的线索，因此转移性骨病可能性较小。 "}, {"id": "AMC-Q0893", "type": "mcq", "qid": 893, "title": "神经性厌食 — 常见体征（心动过缓）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["神经性厌食 — 常见体征（心动过缓）"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0893-Anorexia-Bradycardia.md", "stem": "<p>Which one of the following is a common feature seen in anorexia nervosa?</p>", "options": [{"letter": "A", "text": "Bradycardia."}, {"letter": "B", "text": "Normally-developed secondary sexual characteristics."}, {"letter": "C", "text": "Calloused knuckles."}, {"letter": "D", "text": "Hirsutism."}, {"letter": "E", "text": "Heat intolerance."}], "rationale": "<p>1. 题型识别：临床特征 — 常见体征 2. 各选项分析：</p>\n<ul>\n<li><strong>心动过缓（A）</strong>：最常见，静息心率常40-49bpm ✓</li>\n<li>第二性征发育正常（B）：厌食症患者第二性征常缺失或发育不良（取决于起病时间）✗</li>\n<li>胼胝状指节（C）：仅见于暴食/清除型（催吐诱导），不如心动过缓常见 ✗</li>\n<li>多毛症（D）：不是厌食特征；厌食患者是<strong>毳毛（lanugo）</strong>——细软毛发，与多毛不同 ✗</li>\n<li>热不耐受（E）：厌食症是<strong>冷不耐受</strong>（但不伴寒战）✗</li>\n<p>3. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>Hirsutism vs Lanugo</strong>：多毛症（雄激素相关粗毛）≠ 毳毛（营养不良时覆盖躯体的细软胎毛）</li>\n<li><strong>冷不耐受方向</strong>：厌食是怕冷（冷不耐受），不是热不耐受</li>\n<li><strong>胼胝状指节条件性出现</strong>：仅催吐型有（Russell征），限制型无</li>\n</ul>", "summary": "<p><strong>神经性厌食的常见临床特征</strong>：</p>\n<ul>\n<li>低体温、肢端发绀</li>\n<li><strong>静息心动过缓</strong>（HR常40-49bpm）</li>\n<li>低血压、体位性低血压</li>\n<li>肌肉量减少、低血糖、低甲状旁腺激素、LFT升高、白细胞降低</li>\n</ul>\n<p><strong>与选项相关的特征</strong>：</p>\n<ul>\n<li>第二性征：常缺失或发育不良（取决于起病年龄）</li>\n<li>胼胝状指节：暴食/清除型（催吐诱导）可见</li>\n<li>毳毛（lanugo）：细软体毛（非多毛症）</li>\n<li><strong>冷不耐受</strong>（非热不耐受，且不伴寒战）</li>\n</ul>\n<p><strong>并发症系统列表（详见TR-Anorexia-Nervosa）</strong>：</p>\n<ul>\n<li>内分泌/代谢：月经功能障碍、继发闭经、生长发育迟缓、低PTH、LFT升高、贫血、低血糖</li>\n<li>心血管：心律失常、心动过缓、低血压、CHF、心脏骤停</li>\n<li>胃肠道：腮腺/颌下腺肥大、胃排空延迟、便秘</li>\n<li>皮肤：肢端发绀、毳毛、皮肤干燥、脆发、脱发</li>\n</ul>", "explanation": "<p>在选项中，心动过缓是神经性厌食患者最常见的发现。厌食症患者第二性征（B）常缺失或发育不良，取决于疾病起病时间。胼胝状指节（C）见于暴食/清除亚型厌食症（频繁催吐作为代偿手段），但不如心动过缓常见。多毛症（D）不是厌食症特征；这类患者出现的是毳毛（覆盖身体的细软毛发），与多毛症不同。冷不耐受（而非热不耐受，E）是厌食症的特征，但不伴寒战。</p>", "references": "<ul>\n<li>Medscape - Anorexia Nervosa</li>\n<li>UpToDate - Anorexia nervosa in adults: Clinical features, course of illness, assessment, and diagnosis</li>\n</ul>", "related": ["TR-Anorexia-Nervosa", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "神经性厌食 — 常见体征（心动过缓）\n神经性厌食 — 常见体征（心动过缓）\n which one of the following is a common feature seen in anorexia nervosa? \n 在选项中，心动过缓是神经性厌食患者最常见的发现。厌食症患者第二性征（b）常缺失或发育不良，取决于疾病起病时间。胼胝状指节（c）见于暴食/清除亚型厌食症（频繁催吐作为代偿手段），但不如心动过缓常见。多毛症（d）不是厌食症特征；这类患者出现的是毳毛（覆盖身体的细软毛发），与多毛症不同。冷不耐受（而非热不耐受，e）是厌食症的特征，但不伴寒战。 "}, {"id": "AMC-Q0894", "type": "mcq", "qid": 894, "title": "神经性厌食 — 评估检查（FSH/LH）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["神经性厌食 — 评估检查（FSH/LH非必需，诊断明确时）"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0894-Anorexia-FSH-LH.md", "stem": "<p>A 19-year-old woman with a two-year history of anorexia nervosa is brought for assessment. She is extremely thin, weighs 37.5 kg and has a body mass index of 15 kg/m². Her menses started at 14 years of age, but stopped one year ago. Which one of the following investigations is not indicated in this patient?</p>", "options": [{"letter": "A", "text": "Liver function tests (LFTs)."}, {"letter": "B", "text": "Electrocardiogram."}, {"letter": "C", "text": "Serum gonadotropins (FSH and LH)."}, {"letter": "D", "text": "Electrolytes."}, {"letter": "E", "text": "DXA scan."}], "rationale": "<p>1. 题型识别：NOT型 — 哪项检查<strong>不</strong>适用于本患者 2. 厌食症检查清单（每例患者均考虑）：</p>\n<ul>\n<li>电解质（D）、BUN、肌酐、血糖、钙磷镁、硫胺素、白蛋白</li>\n<li>肝功能（A）（AST, ALT, ALP）</li>\n<li>INR、CBC+分类、ESR、TSH</li>\n<li>心电图（B）</li>\n<li>尿常规（比重）</li>\n<li>DXA（E）：病程>6个月者均需（本例2年 → 应做）</li>\n<li>BMI<14 → 超声心动图</li>\n<p>3. FSH/LH（C）：诊断明确时<strong>无诊断价值</strong>；闭经=营养不良+雌激素缺乏所致（垂体性性腺功能减退） 4. FSH/LH仅用于：诊断无法通过体格检查+病史确定，需排除卵巢衰竭等闭经原因 5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>闭经≠需要查性激素</strong>：厌食症闭经是营养不良的继发表现，诊断明确时无需FSH/LH</li>\n<li><strong>DXA要做</strong>：病程2年>6个月，DXA有指征（骨量减少/骨质疏松评估）</li>\n<li><strong>FSH/LH的时机</strong>：仅在诊断不清、排除卵巢衰竭（原发性卵巢衰竭）或其他闭经原因时使用</li>\n</ul>", "summary": "<p><strong>厌食症评估检查（每例患者）</strong>：</p>\n<ul>\n<li>电解质、BUN、肌酐、血糖、钙磷镁</li>\n<li>硫胺素（thiamine）</li>\n<li>白蛋白</li>\n<li>肝功能（AST, ALT, ALP）</li>\n<li>INR、CBC+分类、ESR、TSH</li>\n<li>心电图（ECG）</li>\n<li>尿常规（比重）</li>\n<li><strong>DXA</strong>：病程>6个月者</li>\n</ul>\n<p><strong>BMI<14 kg/m²</strong> → 超声心动图</p>\n<p><strong>FSH/LH 何时测</strong>：</p>\n<ul>\n<li>仅当厌食症诊断不能通过体格检查和病史确立</li>\n<li>需排除其他闭经原因：卵巢衰竭、PCOS、垂体泌乳素瘤、妊娠等</li>\n</ul>\n<p><strong>闭经的鉴别诊断（厌食诊断不清时）</strong>：</p>\n<ul>\n<li>肿瘤、慢性感染（结核、AIDS）、未控制糖尿病、甲亢</li>\n<li>吸收不良综合征（乳糜泻）、炎症性肠病</li>\n<li>妊娠、原发性卵巢衰竭、多囊卵巢综合征、垂体泌乳素瘤</li>\n</ul>", "explanation": "<p>每例厌食症患者都应考虑的检查包括：血清电解质、BUN、肌酐、血糖、钙磷镁、硫胺素、白蛋白、肝功能（AST/ALT/ALP）、INR、CBC+分类、ESR、TSH、心电图、尿常规比重。DXA扫描也适用于所有病程>6个月的厌食症患者——本例病程2年，应行DXA评估骨量减少或骨质疏松。BMI<14 kg/m²的厌食症患者应行超声心动图。当厌食症诊断明确（存在消瘦+自我诱导饥饿+对体重增加的强烈恐惧）时，FSH和LH无诊断价值，闭经是潜在营养不良和雌激素缺乏（垂体性性腺功能减退）的结果。只有当通过体格检查和病史不能确诊厌食症，并考虑卵巢衰竭等其他闭经原因时，才需要测量FSH/LH。</p>", "references": "<ul>\n<li>RANZCP - Clinical practice guidelines for the treatment of eating disorders</li>\n<li>UpToDate - Anorexia nervosa in adults: Clinical features, course of illness, assessment, and diagnosis</li>\n</ul>", "related": ["TR-Anorexia-Nervosa", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "神经性厌食 — 评估检查（fsh/lh）\n神经性厌食 — 评估检查（fsh/lh非必需，诊断明确时）\n a 19-year-old woman with a two-year history of anorexia nervosa is brought for assessment. she is extremely thin, weighs 37.5 kg and has a body mass index of 15 kg/m². her menses started at 14 years of age, but stopped one year ago. which one of the following investigations is not indicated in this patient? \n 每例厌食症患者都应考虑的检查包括：血清电解质、bun、肌酐、血糖、钙磷镁、硫胺素、白蛋白、肝功能（ast/alt/alp）、inr、cbc+分类、esr、tsh、心电图、尿常规比重。dxa扫描也适用于所有病程>6个月的厌食症患者——本例病程2年，应行dxa评估骨量减少或骨质疏松。bmi "}, {"id": "AMC-Q0903", "type": "mcq", "qid": 903, "title": "酒精戒断综合征 — 肝病患者的药物选择", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["酒精戒断综合征 — 肝病患者选用短效苯二氮卓类（劳拉西泮）"], "difficulty": 3, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0903-Alcohol-Withdrawal-Liver-Disease.md", "stem": "<p>A 57-year-old man, who is a chronic alcohol user, is admitted to the hospital after he was found out to have developed chronic liver disease. Three days after the admission, he progressively becomes aggressive and starts to shout at the ward staff and threatening them. Which one of the following is the most appropriate medication to give him?</p>", "options": [{"letter": "A", "text": "Diazepam."}, {"letter": "B", "text": "Lorazepam."}, {"letter": "C", "text": "Haloperidol."}, {"letter": "D", "text": "Olanzapine."}, {"letter": "E", "text": "Droperidol."}], "rationale": "<p>1. 题型识别：治疗 — 酒精戒断 + 慢性肝病 2. 诊断：慢性酒精使用 + 入院3天后（末次饮酒后6-24小时起病）出现攻击、喊叫、威胁 → 酒精戒断综合征 3. 一线治疗：苯二氮卓类</p>\n<ul>\n<li>地西泮10-20mg口服每2小时一次，直至症状缓解或达120mg/日上限</li>\n<p>4. <strong>严重肝病</strong> → 地西泮经肝脏氧化产生活性代谢物，可蓄积导致过度镇静和呼吸抑制</p>\n<li>改用<strong>劳拉西泮或奥沙西泮</strong>（代谢几乎不受年龄和肝病影响，无活性代谢物）</li>\n<p>5. 氟哌啶醇/氟哌利多：仅用于苯二氮卓类治疗后仍持续的精神病性特征或激越 6. 注意：苯二氮卓类（及较小程度的氟哌啶醇、氟哌利多）可能加重肝性脑病 7. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>地西泮并非首选</strong>：无肝病时地西泮是一线；但本例有慢性肝病，地西泮活性代谢物（去甲地西泮等）会蓄积</li>\n<li><strong>短效 vs 长效</strong>：肝病/老年人 → 劳拉西泮、奥沙西泮（无活性代谢物）；普通患者 → 地西泮</li>\n<li><strong>抗精神病药不是一线</strong>：氟哌啶醇/氟哌利多仅在BZD无效的持续激越/精神病性特征时使用，且可能加重肝性脑病</li>\n</ul>", "summary": "<p><strong>酒精戒断综合征（AWS）</strong>：</p>\n<ul>\n<li>表现：震颤、出汗、恶心呕吐、焦虑、激越、头痛、腹泻、心动过速、谵妄、知觉障碍、高血压；偶有癫痫发作</li>\n<li>起病：末次饮酒后6-24小时；通常持续72小时，可长达数周</li>\n<li>约50%仅有一次癫痫发作</li>\n</ul>\n<p><strong>治疗</strong>：</p>\n<ul>\n<li>一线：<strong>苯二氮卓类</strong>（地西泮10-20mg PO q2h，至症状缓解或达120mg/日）</li>\n<li><strong>肝病/老年人</strong>：劳拉西泮、奥沙西泮（短效、无活性代谢物）</li>\n<li>持续性激越/精神病性特征：氟哌啶醇、氟哌利多（BZD治疗无效时）</li>\n<li>警示：苯二氮卓类及氟哌啶醇/氟哌利多可能加重肝性脑病</li>\n</ul>\n<p><strong>药代动力学</strong>：</p>\n<ul>\n<li>地西泮：肝脏氧化 → 活性代谢物 → 葡萄糖醛酸化；肝病/老年人氧化减少 → 蓄积、过度镇静、呼吸抑制</li>\n<li>劳拉西泮/奥沙西泮：代谢几乎不受年龄和肝病影响 → 肝病/老年人最安全</li>\n</ul>", "explanation": "<p>鉴于该患者的慢性酒精使用史，其表现最可能为酒精戒断综合征（AWS）。AWS特征包括震颤、出汗、恶心呕吐、焦虑、激越、头痛、腹泻、心动过速、谵妄、知觉障碍和高血压，偶有癫痫发作，约50%仅有一次癫痫发作。临床表现于末次饮酒后6-24小时开始，通常持续72小时，但可能持续数周。需要药物治疗时，苯二氮卓类是一线选择：地西泮10-20mg口服每2小时一次，直至症状消退或达每日120mg上限。然而，在严重肝病患者中，应使用无活性代谢物的短效苯二氮卓类（如劳拉西泮或奥沙西泮）替代地西泮——地西泮经肝脏氧化产生活性代谢物，随后发生葡萄糖醛酸化，肝病患者氧化作用降低导致药物蓄积，引起过度镇静和呼吸抑制。劳拉西泮和奥沙西泮的代谢几乎不受年龄和肝病影响，是治疗老年人和肝病患者AWS的最安全选择。氟哌啶醇和氟哌利多仅在苯二氮卓类治疗后仍持续存在精神病性特征或激越时使用。苯二氮卓类及（较小程度的）氟哌啶醇/氟哌利多可能加重肝性脑病。</p>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pubmed/8700792</li>\n<li>Therapeutic Guidelines – Psychotropics; available from http://tg.org.au</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "酒精戒断综合征 — 肝病患者的药物选择\n酒精戒断综合征 — 肝病患者选用短效苯二氮卓类（劳拉西泮）\n a 57-year-old man, who is a chronic alcohol user, is admitted to the hospital after he was found out to have developed chronic liver disease. three days after the admission, he progressively becomes aggressive and starts to shout at the ward staff and threatening them. which one of the following is the most appropriate medication to give him? \n 鉴于该患者的慢性酒精使用史，其表现最可能为酒精戒断综合征（aws）。aws特征包括震颤、出汗、恶心呕吐、焦虑、激越、头痛、腹泻、心动过速、谵妄、知觉障碍和高血压，偶有癫痫发作，约50%仅有一次癫痫发作。临床表现于末次饮酒后6-24小时开始，通常持续72小时，但可能持续数周。需要药物治疗时，苯二氮卓类是一线选择：地西泮10-20mg口服每2小时一次，直至症状消退或达每日120mg上限。然而，在严重肝病患者中，应使用无活性代谢物的短效苯二氮卓类（如劳拉西泮或奥沙西泮）替代地西泮——地西泮经肝脏氧化产生活性代谢物，随后发生葡萄糖醛酸化，肝病患者氧化作用降低导致药物蓄积，引起过度镇静和呼吸抑制。劳拉西泮和奥沙西泮的代谢几乎不受年龄和肝病影响，是治疗老年人和肝病患者aws的最安全选择。氟哌啶醇和氟哌利多仅在苯二氮卓类治疗后仍持续存在精神病性特征或激越时使用。苯二氮卓类及（较小程度的）氟哌啶醇/氟哌利多可能加重肝性脑病。 "}, {"id": "AMC-Q0915", "type": "mcq", "qid": 915, "title": "谵妄 — 透析患者拒绝治疗（定向力障碍）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["谵妄 — 透析患者拒绝治疗（发热+腹痛 → 感染 → 谵妄，定向力障碍）"], "difficulty": 3, "correctAnswer": "A", "page": 1523, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0915-Dialysis-Delirium-Disorientation.md", "stem": "<p>A 73-year-old woman with end-stage renal disease (ESRD), who has been well-controlled on routine peritoneal dialysis, and has been coping well thus far, suddenly declines to have her dialysis session today. On examination, she is found to have a temperature of 38.3°C and mild tenderness in upper abdomen. Which one of the following could be the most likely additional finding in this patient?</p>", "options": [{"letter": "A", "text": "Disorientation."}, {"letter": "B", "text": "Depressed mood."}, {"letter": "C", "text": "Blunted affect."}, {"letter": "D", "text": "Delusions."}, {"letter": "E", "text": "Hypervigilance."}], "rationale": "<p>1. 题型识别：诊断 — 附加体征推断 2. 场景解读：</p>\n<ul>\n<li>ESRD腹膜透析患者，一直配合良好</li>\n<li><strong>突然</strong>拒绝透析（行为改变）</li>\n<li>发热38.3°C + 上腹压痛 → 感染线索</li>\n<p>3. 推理：</p>\n<li>突然行为改变 + 感染征象 → <strong>谵妄</strong></li>\n<li>谵妄的核心特征是<strong>定向力障碍</strong>（时间、地点、人物）</li>\n<p>4. 排除：</p>\n<li>抑郁（B）：虽常见于ESRD/透析患者，也是治疗退出主因，但<strong>突然</strong>拒治+发热+压痛不支持</li>\n<li>情感迟钝（C）、妄想（D）、警觉过度（E）：属精神病性精神障碍特征，起病通常更隐匿</li>\n<p>5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"拒绝治疗\"≠单纯抑郁</strong>：ESRD患者抑郁常见且是治疗退出主因，但急性发热/腹痛提示感染性谵妄优先</li>\n<li><strong>谵妄=急性起病+波动性+定向力障碍</strong>：抓住\"突然\"二字</li>\n<li><strong>精神病性特征的方向</strong>：谵妄也可有幻觉/妄想，但此处问的是\"最可能附加发现\"——定向力障碍最核心</li>\n</ul>", "summary": "<p><strong>谵妄 (Delirium)</strong>：</p>\n<ul>\n<li>急性起病、波动性病程</li>\n<li>核心特征：意识水平改变 + <strong>定向力障碍</strong> + 注意力缺陷</li>\n<li>常见诱因：感染（尤其老年人）、药物、代谢紊乱</li>\n<li>处理：治疗诱因 + 对症处理</li>\n</ul>\n<p><strong>ESRD/透析患者的心理精神问题</strong>：</p>\n<ul>\n<li>抑郁常见，是治疗退出（withdrawal）的主要原因</li>\n<li>但<strong>急性</strong>行为改变 + 感染征象 → 首先考虑谵妄</li>\n</ul>\n<p><strong>鉴别：精神病性障碍 vs 谵妄</strong>：</p>\n<ul>\n<li>精神病性障碍（情感迟钝、妄想、警觉过度）：通常隐匿起病</li>\n<li>谵妄：急性起病、波动、定向力障碍、常伴感染/代谢诱因</li>\n</ul>", "explanation": "<p>抑郁在ESRD和透析患者中常见，是这类患者治疗退出（withdrawal）的主要原因。然而，突然拒绝治疗同时伴有发热和腹痛，与抑郁作为拒治原因不符。发热是指向感染的线索，腹痛亦然。感染可引起谵妄，尤其在老年人中。若谵妄是该表现的根本原因，检查时应存在定向力障碍。抑郁心境（B）对于一个一直应对良好却突然拒绝治疗的患者不太可能。情感迟钝（C）、妄想（D）和警觉过度（E）是精神病性精神障碍的预期特征；此类障碍通常起病更隐匿，因此在本场景中可能性较小。</p>", "references": "<ul>\n<li>UpToDate - Psychiatric illness in dialysis patients</li>\n<li>Indian Journal of Nephrology - Psychiatric issues in renal failure and dialysis</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "谵妄 — 透析患者拒绝治疗（定向力障碍）\n谵妄 — 透析患者拒绝治疗（发热+腹痛 → 感染 → 谵妄，定向力障碍）\n a 73-year-old woman with end-stage renal disease (esrd), who has been well-controlled on routine peritoneal dialysis, and has been coping well thus far, suddenly declines to have her dialysis session today. on examination, she is found to have a temperature of 38.3°c and mild tenderness in upper abdomen. which one of the following could be the most likely additional finding in this patient? \n 抑郁在esrd和透析患者中常见，是这类患者治疗退出（withdrawal）的主要原因。然而，突然拒绝治疗同时伴有发热和腹痛，与抑郁作为拒治原因不符。发热是指向感染的线索，腹痛亦然。感染可引起谵妄，尤其在老年人中。若谵妄是该表现的根本原因，检查时应存在定向力障碍。抑郁心境（b）对于一个一直应对良好却突然拒绝治疗的患者不太可能。情感迟钝（c）、妄想（d）和警觉过度（e）是精神病性精神障碍的预期特征；此类障碍通常起病更隐匿，因此在本场景中可能性较小。 "}, {"id": "AMC-Q0931", "type": "mcq", "qid": 931, "title": "SSRI相关勃起功能障碍 — 西地那非为标准治疗", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["SSRI相关勃起功能障碍 — PDE5抑制剂（西地那非）为标准治疗"], "difficulty": 2, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0931-SSRI-Erectile-Dysfunction-Sildenafil.md", "stem": "<p>A 37-year-old man presents to your practice with complaint of erectile dysfunction. A few months ago, he found out that her wife had an extramarital affair and developed low mood. After 5 weeks, he went to see a doctor and was diagnosed with depression and prescribed sertraline. Recently, he has started a new relationship but is experiencing erectile dysfunction. Which one of the following would be the most appropriate option for management of his current problem?</p>", "options": [{"letter": "A", "text": "Stop sertraline."}, {"letter": "B", "text": "Switch to fluoxetine."}, {"letter": "C", "text": "Switch to fluvoxamine."}, {"letter": "D", "text": "Prescribe sildenafil."}, {"letter": "E", "text": "Prescribe clomipramine."}], "rationale": "<p>1. 题型识别：治疗 — SSRI相关性功能障碍 2. 病因判断：舍曲林（SSRI）已知最常见的不良反应之一是性功能障碍（性欲减退、延迟射精、勃起功能障碍、射精疼痛） 3. 处理策略（药物相关时）：</p>\n<ul>\n<li>减量</li>\n<li><strong>换用不同类别的药物</strong>（如安非他酮、米氮平、萘法唑酮——对性功能影响最小）</li>\n<li>药物假期（drug holidays）</li>\n<li><strong>开具PDE5抑制剂（西地那非/他达拉非）——已成为男性标准治疗</strong></li>\n<p>4. 排除：</p>\n<li>停用舍曲林（A）：可致抑郁复发</li>\n<li>换用其他SSRI（B/C）：氟西汀、氟伏沙明同样有性功能障碍副作用</li>\n<li>氯米帕明（E）：低剂量用于早泄；TCA也可致性功能障碍</li>\n<p>5. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>换SSRI无意义</strong>：所有SSRI（氟西汀、氟伏沙明、帕罗西汀等）均可致性功能障碍</li>\n<li><strong>标准治疗是PDE5抑制剂</strong>：而非停用抗抑郁药</li>\n<li><strong>换药方向</strong>：要换就换对性功能影响最小的药物（安非他酮、米氮平、萘法唑酮），而非换另一种SSRI</li>\n</ul>", "summary": "<p><strong>与性功能障碍相关的药物类别</strong>：</p>\n<ul>\n<li>降压药、抗精神病药、抗抑郁药、消遣性药物</li>\n</ul>\n<p><strong>SSRI性功能障碍副作用</strong>：</p>\n<ul>\n<li>性欲减退</li>\n<li>延迟射精（此作用被用于治疗早泄）</li>\n<li>勃起功能障碍</li>\n<li>射精疼痛</li>\n</ul>\n<p><strong>处理策略（药物相关时）</strong>：</p>\n<ul>\n<li>减量</li>\n<li>换用不同类别的药物（安非他酮、米氮平、萘法唑酮——对性功能影响极小）</li>\n<li>药物假期（drug holidays）</li>\n<li><strong>PDE5抑制剂（西地那非、他达拉非）——男性标准治疗</strong></li>\n<li>女性：可增加润滑</li>\n</ul>\n<p><strong>注意</strong>：氯米帕明（低剂量）用于早泄治疗，可能加重延迟射精。</p>", "explanation": "<p>许多药物能产生性功能障碍，患者报告的性功能问题包括性欲减退、勃起或射精问题以及女性润滑减少。最常见的药物类别包括降压药、抗精神病药、抗抑郁药和消遣性药物。舍曲林、氟西汀、帕罗西汀、氟伏沙明、西酞普兰等SSRI均以其性功能障碍不良反应而闻名，这是导致不依从的最突出不良反应之一。问题可能由药物以外的其他因素引起，而患者却坚信是药物所致，且药物与心理效应之间可能存在不可识别的作用。若认为性功能障碍是药物所致，可尝试多种策略：减量、换用不同类别的药物、药物假期。然而，在性交前开具磷酸二酯酶5型抑制剂（如西地那非或他达拉非）已成为男性患者的标准治疗。换用氟西汀、氟伏沙明等其他SSRI不太可能解决问题，因为这类药物同样与性功能障碍相关。低剂量氯米帕明已被证明对早泄有效，但西地那非仍是多数患者的标准治疗。对服用SSRI出现性副作用的抑郁症患者，可换用萘法唑酮、安非他酮或米氮平，这些药物对性功能影响极小（如果有的话）。</p>", "references": "<ul>\n<li>PubMed - Sildenafil in the Treatment of SSRI-Induced Sexual Dysfunction: A Pilot Study</li>\n<li>PubMed - Antidepressant-associated sexual dysfunction: impact, effects, and treatment</li>\n<li>RACGP - Much more than prescribing a pill – Assessment and treatment of erectile dysfunction by the general practitioner</li>\n</ul>", "related": ["AMC-Q0853-Erectile-Dysfunction-Sildenafil", "AMC-Q0932-Delayed-Ejaculation-Sildenafil", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "ssri相关勃起功能障碍 — 西地那非为标准治疗\nssri相关勃起功能障碍 — pde5抑制剂（西地那非）为标准治疗\n a 37-year-old man presents to your practice with complaint of erectile dysfunction. a few months ago, he found out that her wife had an extramarital affair and developed low mood. after 5 weeks, he went to see a doctor and was diagnosed with depression and prescribed sertraline. recently, he has started a new relationship but is experiencing erectile dysfunction. which one of the following would be the most appropriate option for management of his current problem? \n 许多药物能产生性功能障碍，患者报告的性功能问题包括性欲减退、勃起或射精问题以及女性润滑减少。最常见的药物类别包括降压药、抗精神病药、抗抑郁药和消遣性药物。舍曲林、氟西汀、帕罗西汀、氟伏沙明、西酞普兰等ssri均以其性功能障碍不良反应而闻名，这是导致不依从的最突出不良反应之一。问题可能由药物以外的其他因素引起，而患者却坚信是药物所致，且药物与心理效应之间可能存在不可识别的作用。若认为性功能障碍是药物所致，可尝试多种策略：减量、换用不同类别的药物、药物假期。然而，在性交前开具磷酸二酯酶5型抑制剂（如西地那非或他达拉非）已成为男性患者的标准治疗。换用氟西汀、氟伏沙明等其他ssri不太可能解决问题，因为这类药物同样与性功能障碍相关。低剂量氯米帕明已被证明对早泄有效，但西地那非仍是多数患者的标准治疗。对服用ssri出现性副作用的抑郁症患者，可换用萘法唑酮、安非他酮或米氮平，这些药物对性功能影响极小（如果有的话）。 "}, {"id": "AMC-Q0932", "type": "mcq", "qid": 932, "title": "延迟射精（SSRI相关）— 西地那非为标准处理", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["延迟射精（SSRI相关）— 西地那非为标准处理"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0932-Delayed-Ejaculation-Sildenafil.md", "stem": "<p>A 48-year-old man presents with complaint of significantly delayed ejaculation for the past 2 months. He has the history of major depression, for which he is on sertraline. Four months ago, the dose of sertraline was increased to 100mg, daily, after he felt that his previously well controlled symptoms are returning. At present, he is stable and symptom free. Which one of the following would be the most appropriate management option regarding his ejaculation problem?</p>", "options": [{"letter": "A", "text": "Switch to fluoxetine."}, {"letter": "B", "text": "Stop sertraline."}, {"letter": "C", "text": "Advise sildenafil in anticipation of intercourse."}, {"letter": "D", "text": "Reduce the dose of sertraline."}, {"letter": "E", "text": "Prescribe clomipramine."}], "rationale": "<p>1. 题型识别：治疗 — SSRI相关延迟射精 2. 背景：舍曲林加量至100mg后抑郁控制、症状消失；4个月后出现明显延迟射精 3. SSRI性功能障碍处理策略：</p>\n<ul>\n<li>药物假期</li>\n<li>减量</li>\n<li>换用对性功能影响最小的抗抑郁药（安非他酮、米氮平、萘法唑酮）</li>\n<li><strong>PDE5抑制剂（西地那非/他达拉非）——标准处理</strong></li>\n<li>CBT</li>\n<p>4. 排除：</p>\n<li>换氟西汀（A）：同为SSRI，仍可致性功能障碍</li>\n<li>停舍曲林（B）：导致刚控制的抑郁复发</li>\n<li>减量（D）：刚因加量而控制，减量极易复发</li>\n<li>氯米帕明（E）：用于治疗早泄，会加重延迟射精</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>减量/停药→复发</strong>：患者刚刚因加量控制症状，减量或停药都会导致复发</li>\n<li><strong>换SSRI无效</strong>：所有SSRI都有性功能障碍风险</li>\n<li><strong>氯米帕明方向</strong>：氯米帕明用于早泄，会加重延迟射精</li>\n</ul>", "summary": "<p><strong>SSRI性功能障碍</strong>：</p>\n<ul>\n<li>性欲减退、延迟射精（用于治疗早泄）、勃起功能障碍、射精疼痛</li>\n</ul>\n<p><strong>处理策略</strong>：</p>\n<ul>\n<li>药物假期（drug holidays）</li>\n<li>剂量减少</li>\n<li>换用对性功能影响最小的抗抑郁药（安非他酮、米氮平、萘法唑酮）</li>\n<li><strong>PDE5抑制剂（西地那非、他达拉非）——性交前使用，已成标准</strong></li>\n<li>认知行为疗法（CBT）</li>\n</ul>\n<p><strong>要点</strong>：</p>\n<ul>\n<li>换用其他SSRI（氟西汀、氟伏沙明、帕罗西汀）不太可能解决问题</li>\n<li>氯米帕明（TCA）用于早泄治疗，会加重延迟射精</li>\n<li>减量/停药有抑郁复发风险</li>\n</ul>", "explanation": "<p>舍曲林、氟西汀、帕罗西汀、氟伏沙明、西酞普兰等SSRI均以其性功能障碍不良反应而闻名，这是患者治疗不依从的最突出原因之一。报告的不良结局包括性欲减退、延迟射精（此作用被用于治疗早泄）、勃起功能障碍和射精疼痛。应对SSRI性副作用的策略包括：药物假期、减量、换用对性功能影响最小或无影响的抗抑郁药（安非他酮、米氮平或萘法唑酮）、使用PDE5抑制剂（西地那非或他达拉非）以及认知行为疗法。其中，性交前使用PDE5抑制剂（如西地那非）已成为标准处理。换用氟西汀、氟伏沙明、帕罗西汀等其他SSRI（A）不太可能解决问题。停用舍曲林（B）会导致刚获控制的抑郁复发。减少目前舍曲林剂量（D）对刚因加量控制住抑郁症状的患者极可能导致复发，故不合适。氯米帕明（E）是用于治疗早泄的三环类抗抑郁药，加用氯米帕明会恶化延迟射精。</p>", "references": "<ul>\n<li>http://www.australianprescriber.com/magazine/36/2/</li>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC181091</li>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC310869</li>\n</ul>", "related": ["AMC-Q0931-SSRI-Erectile-Dysfunction-Sildenafil", "AMC-Q0853-Erectile-Dysfunction-Sildenafil", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "延迟射精（ssri相关）— 西地那非为标准处理\n延迟射精（ssri相关）— 西地那非为标准处理\n a 48-year-old man presents with complaint of significantly delayed ejaculation for the past 2 months. he has the history of major depression, for which he is on sertraline. four months ago, the dose of sertraline was increased to 100mg, daily, after he felt that his previously well controlled symptoms are returning. at present, he is stable and symptom free. which one of the following would be the most appropriate management option regarding his ejaculation problem? \n 舍曲林、氟西汀、帕罗西汀、氟伏沙明、西酞普兰等ssri均以其性功能障碍不良反应而闻名，这是患者治疗不依从的最突出原因之一。报告的不良结局包括性欲减退、延迟射精（此作用被用于治疗早泄）、勃起功能障碍和射精疼痛。应对ssri性副作用的策略包括：药物假期、减量、换用对性功能影响最小或无影响的抗抑郁药（安非他酮、米氮平或萘法唑酮）、使用pde5抑制剂（西地那非或他达拉非）以及认知行为疗法。其中，性交前使用pde5抑制剂（如西地那非）已成为标准处理。换用氟西汀、氟伏沙明、帕罗西汀等其他ssri（a）不太可能解决问题。停用舍曲林（b）会导致刚获控制的抑郁复发。减少目前舍曲林剂量（d）对刚因加量控制住抑郁症状的患者极可能导致复发，故不合适。氯米帕明（e）是用于治疗早泄的三环类抗抑郁药，加用氯米帕明会恶化延迟射精。 "}, {"id": "AMC-Q0941", "type": "mcq", "qid": 941, "title": "精神分裂症 — 荒谬妄想 + 幻听", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["精神分裂症 — 荒谬妄想 + 幻听（行为紊乱）"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0941-Schizophrenia-Delusions-Hallucinations.md", "stem": "<p>A 32-year-old is brought to the emergency department after she was arrested by the police in a shopping mall. She is dressed in colorful dresses. According to the police, she was shouting at everyone in the mall. She was claiming in an excited manner that her mother was virgin and married God. In the emergency department and during the interview she keeps saying that she hears the voice of God, and that she is planning to become pregnant from him. Which one of the following is the most likely cause to her presentation?</p>", "options": [{"letter": "A", "text": "Antisocial personality disorder."}, {"letter": "B", "text": "Opium abuse."}, {"letter": "C", "text": "Alcohol intoxication."}, {"letter": "D", "text": "Schizophrenia."}, {"letter": "E", "text": "Borderline personality disorder."}], "rationale": "<p>1. 题型识别：诊断 — 行为/言语异常的原因 2. 关键证据：</p>\n<ul>\n<li><strong>荒谬妄想</strong>：坚信母亲嫁给上帝、自己将怀上上帝的孩子（强烈持有的错误信念）</li>\n<li><strong>幻听</strong>：在急诊室不断听到上帝的声音</li>\n<p>3. 妄想+幻听并存 = 精神病性发作 → 精神分裂症 4. 排除：</p>\n<li>反社会人格障碍（A）：表现为持续反社会/犯罪行为、无视规则、缺乏悔意——无妄想或幻觉</li>\n<li>鸦片滥用（B）：与妄想或幻觉无关</li>\n<li>急性酒精中毒（C）：言语含糊、眼球震颤、行为失控、共济失调、记忆受损、昏迷——幻觉妄想非典型表现</li>\n<li>边缘型人格障碍（E）：情绪不稳、冲动、关系不稳、自伤——受压时可出现精神病性症状，使用分裂防御机制，但本例核心是荒谬妄想+幻听</li>\n<p>5. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>BPD也可\"变精神病\"</strong>：边缘型人格在压力下可出现短暂精神病性症状，但本场景有持续的荒谬妄想+幻听，指向精神分裂症</li>\n<li><strong>酒精中毒不产生幻觉妄想</strong>：急性酒精中毒表现以神经学体征为主</li>\n<li><strong>鸦片无精神病性症状</strong>：鸦片滥用不伴妄想或幻觉</li>\n</ul>", "summary": "<p><strong>精神分裂症核心症状</strong>：</p>\n<ul>\n<li>幻觉（多为幻听）</li>\n<li>妄想（常为荒谬/怪异性）</li>\n<li>言语紊乱、行为紊乱、阴性症状</li>\n</ul>\n<p><strong>鉴别诊断</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>关键特征</th></tr></thead>\n<tbody>\n<tr><td>反社会人格障碍</td><td>反社会行为、缺乏悔意、欺骗性——无妄想/幻觉</td></tr>\n<tr><td>鸦片滥用</td><td>不伴妄想或幻觉</td></tr>\n<tr><td>急性酒精中毒</td><td>言语含糊、眼震、共济失调、意识受损——幻觉/妄想非典型</td></tr>\n<tr><td>边缘型人格障碍</td><td>情绪不稳、冲动、自伤；压力下可有短暂精神病性症状</td></tr>\n<tr><td>精神分裂症</td><td><strong>荒谬妄想 + 幻听</strong></td></tr>\n</tbody>\n</table>\n<p><strong>边缘型人格障碍特征</strong>：</p>\n<ul>\n<li>情感不稳、情绪波动、显著冲动</li>\n<li>不稳定关系、反复自杀行为、自伤</li>\n<li>空虚无聊感、身份紊乱、不恰当愤怒</li>\n<li>防御机制：分裂（splitting）</li>\n</ul>", "explanation": "<p>本案例有两个具有诊断意义的关键点。第一是妄想性思维内容：患者强烈持有荒谬的错误信念——她的母亲嫁给了上帝，而她计划怀上上帝的孩子。第二是幻听的存在：她不断声称听到上帝的声音。这两者合在一起使精神病性发作成为最可能的诊断，在给定选项中只有精神分裂症能代表这一诊断。反社会人格障碍（A）以持续反社会或犯罪行为、不能遵守社会规则、冲动、无视他人权利、攻击性、缺乏悔意和欺骗性为特征，无妄想或幻觉。鸦片滥用（B）不伴妄想或幻觉。急性酒精中毒（C）根据严重程度有不同表现，可包括言语含糊、眼震、行为失控、共济失调、步态不稳、记忆受损、木僵甚至昏迷，幻觉和妄想并非典型表现。边缘型人格障碍（E）常以情感不稳、情绪波动、显著冲动、不稳定关系、反复自杀行为和自伤、长期空虚无聊、身份紊乱和不恰当愤怒为特征，受压时可出现精神病性症状，并主要以分裂作为防御机制。</p>", "references": "<ul>\n<li>http://www.uptodate.com/contents/schizophrenia-cli</li>\n<li>http://psychcentral.com/disorders/borderline-perso</li>\n<li>http://psychcentral.com/disorders/antisocial-perso</li>\n</ul>", "related": ["AMC-Q0857-Schizophrenia-Adolescent", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "精神分裂症 — 荒谬妄想 + 幻听\n精神分裂症 — 荒谬妄想 + 幻听（行为紊乱）\n a 32-year-old is brought to the emergency department after she was arrested by the police in a shopping mall. she is dressed in colorful dresses. according to the police, she was shouting at everyone in the mall. she was claiming in an excited manner that her mother was virgin and married god. in the emergency department and during the interview she keeps saying that she hears the voice of god, and that she is planning to become pregnant from him. which one of the following is the most likely cause to her presentation? \n 本案例有两个具有诊断意义的关键点。第一是妄想性思维内容：患者强烈持有荒谬的错误信念——她的母亲嫁给了上帝，而她计划怀上上帝的孩子。第二是幻听的存在：她不断声称听到上帝的声音。这两者合在一起使精神病性发作成为最可能的诊断，在给定选项中只有精神分裂症能代表这一诊断。反社会人格障碍（a）以持续反社会或犯罪行为、不能遵守社会规则、冲动、无视他人权利、攻击性、缺乏悔意和欺骗性为特征，无妄想或幻觉。鸦片滥用（b）不伴妄想或幻觉。急性酒精中毒（c）根据严重程度有不同表现，可包括言语含糊、眼震、行为失控、共济失调、步态不稳、记忆受损、木僵甚至昏迷，幻觉和妄想并非典型表现。边缘型人格障碍（e）常以情感不稳、情绪波动、显著冲动、不稳定关系、反复自杀行为和自伤、长期空虚无聊、身份紊乱和不恰当愤怒为特征，受压时可出现精神病性症状，并主要以分裂作为防御机制。 "}, {"id": "AMC-Q0942", "type": "mcq", "qid": 942, "title": "表演型人格障碍 — 诱惑性、戏剧化", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["表演型人格障碍 — 诱惑性、戏剧化、寻求关注"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0942-Histrionic-Personality-Disorder.md", "stem": "<p>A nurse calls you to see a 33-year-old woman, who has just been admitted to the general ward and apparently is making trouble by arguing with the nursing staff. When you step into her room and she sees you, she says seductively: 'Oh, my lovely doctor. I am sure you are a gentleman and understand my needs. I want a private room with classy and beautiful furniture. I can't eat hospital foods because they are rubbish. I need to order French dishes as they are my favorite. I need access to my makeup artist, and I want my little dog here for comfort. I am sure you are brilliant and know what I am talking about. You are the one who understands me. These idiot nurses don't'. Which of the following conditions is most likely to be present in this woman?</p>", "options": [{"letter": "A", "text": "Narcissistic personality disorder."}, {"letter": "B", "text": "Histrionic personality disorder."}, {"letter": "C", "text": "Schizophrenia."}, {"letter": "D", "text": "Hallucinations."}, {"letter": "E", "text": "Schizotypal personality disorder."}], "rationale": "<p>1. 题型识别：诊断 — 人格特征识别 2. 关键行为：</p>\n<ul>\n<li><strong>诱惑性</strong>：对医生说\"lovely doctor\"</li>\n<li>过度恭维初次见面者（\"你是天才、只有你懂我\"）</li>\n<li><strong>自我中心/自我戏剧化</strong>：要求私人病房、法国菜、化妆师、宠物狗</li>\n<li>黑白分裂（splitting）：医生好/护士蠢</li>\n<p>3. 表演型人格特征：</p>\n<li>情绪化（emotionalism）</li>\n<li>寻求关注、不自在当不是关注中心</li>\n<li>不断寻求认可/关注、自我戏剧化、戏剧性（如同舞台表演）</li>\n<li>显著自我中心或不恰当场合的性诱惑</li>\n<li>用外表吸引注意、情感表达浅表且迅速转换、言语过分印象主义缺乏细节</li>\n<p>4. 排除：</p>\n<li>自恋型（A）：虽自我中心类似夸大，但自恋型伴有居高临下（condescending）行为；本例同时寻求关注中心+迷人 → 更符合表演型</li>\n<li>精神分裂症（C）：无荒谬妄想和幻觉</li>\n<li>幻觉（D）：人格障碍患者不出现幻觉</li>\n<li>分裂型人格（E）：难以建立/维持亲密关系、认知/知觉扭曲、怪异行为，关注\"特殊意义\"解读和超自然现象</li>\n<p>5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>自恋 vs 表演</strong>：自恋型=夸大+居高临下+缺乏共情；表演型=寻求关注+戏剧化+性诱惑。本例同时\"迷人\"且\"求关注中心\"</li>\n<li><strong>分裂防御≠BPD专属</strong>：分裂常与BPD相关，但其他行为模式不吻合</li>\n<li><strong>人格障碍不幻觉</strong>：选项D\"幻觉\"不是人格障碍的特征</li>\n</ul>", "summary": "<p><strong>表演型人格障碍 (Histrionic Personality Disorder)</strong>：</p>\n<ul>\n<li>情绪化：倾向于以情绪方式看待事物</li>\n<li>寻求关注；不是关注中心时感到不自在</li>\n<li>行为：不断寻求认可/关注、自我戏剧化、戏剧性（如舞台表演）、显著自我中心、不恰当场合的性诱惑</li>\n<li>对初识者具有魅力（热情、激情、开放、轻佻）</li>\n<li>交谈自我中心；用外表吸引注意；情感表达浅表且迅速转换；言语过分印象主义、缺乏细节</li>\n</ul>\n<p><strong>鉴别</strong>：</p>\n<ul>\n<li>自恋型：夸大、居高临下、缺乏共情、嫉妒、人际剥削</li>\n<li>边缘型：情绪不稳、冲动、自伤、害怕被抛弃（分裂防御机制为主）</li>\n<li>分裂型：亲密关系困难、认知/知觉扭曲、怪异、过度迷信/关注超自然</li>\n</ul>", "explanation": "<p>该女性的行为模式最可能由表演型人格障碍所致。显著发现是诱惑性和试图迷人、对初次见面者过度恭维、以及自我中心和自我戏剧化。表演型人格障碍个体表现出情绪化，是寻求关注者，在不是关注中心时感到不自在。行为可包括不断寻求认可或关注、自我戏剧化、戏剧性（如同在舞台上表演）以及显著自我中心或在社交、职业、专业关系等不恰当场合的性诱惑。他们可能活泼而戏剧化，以激情、热情、表面开放或轻佻迷住新认识的人。她同时使用分裂防御机制（一切非黑即白）；虽然分裂常见于边缘型人格障碍，但其他行为发现与BPD诊断不符。本例虽有明显自我中心（类似自恋型的夸大），但自恋型伴随居高临下的行为，而这位女性同时寻求成为关注中心并试图迷人，这使表演型人格障碍更可能。人格障碍患者不出现幻觉（D）。精神分裂症（C）以荒谬妄想和幻觉为特征（多为幻听），本例均无。分裂型人格障碍（E）以建立和维持亲密关系困难为特征，可有认知或知觉扭曲以及日常行为怪异。</p>", "references": "<ul>\n<li>Psych Central - What Is Histrionic Personality Disorder? Symptoms, Treatments, and More</li>\n<li>Psych Central - Narcissistic Personality Disorder: Symptoms, Causes, and Treatment</li>\n<li>Psych Central - Schizotypal Personality Disorder: Symptoms, Causes, and Treatment</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "表演型人格障碍 — 诱惑性、戏剧化\n表演型人格障碍 — 诱惑性、戏剧化、寻求关注\n a nurse calls you to see a 33-year-old woman, who has just been admitted to the general ward and apparently is making trouble by arguing with the nursing staff. when you step into her room and she sees you, she says seductively: 'oh, my lovely doctor. i am sure you are a gentleman and understand my needs. i want a private room with classy and beautiful furniture. i can't eat hospital foods because they are rubbish. i need to order french dishes as they are my favorite. i need access to my makeup artist, and i want my little dog here for comfort. i am sure you are brilliant and know what i am talking about. you are the one who understands me. these idiot nurses don't'. which of the following conditions is most likely to be present in this woman? \n 该女性的行为模式最可能由表演型人格障碍所致。显著发现是诱惑性和试图迷人、对初次见面者过度恭维、以及自我中心和自我戏剧化。表演型人格障碍个体表现出情绪化，是寻求关注者，在不是关注中心时感到不自在。行为可包括不断寻求认可或关注、自我戏剧化、戏剧性（如同在舞台上表演）以及显著自我中心或在社交、职业、专业关系等不恰当场合的性诱惑。他们可能活泼而戏剧化，以激情、热情、表面开放或轻佻迷住新认识的人。她同时使用分裂防御机制（一切非黑即白）；虽然分裂常见于边缘型人格障碍，但其他行为发现与bpd诊断不符。本例虽有明显自我中心（类似自恋型的夸大），但自恋型伴随居高临下的行为，而这位女性同时寻求成为关注中心并试图迷人，这使表演型人格障碍更可能。人格障碍患者不出现幻觉（d）。精神分裂症（c）以荒谬妄想和幻觉为特征（多为幻听），本例均无。分裂型人格障碍（e）以建立和维持亲密关系困难为特征，可有认知或知觉扭曲以及日常行为怪异。 "}, {"id": "AMC-Q0943", "type": "mcq", "qid": 943, "title": "边缘型人格障碍 — 害怕被抛弃", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["边缘型人格障碍 — 害怕被抛弃、疯狂避免被遗弃"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0943-Borderline-Personality-Disorder.md", "stem": "<p>A 27-year-old woman is about to get discharged from the hospital where she was admitted 2 weeks ago due to a psychological breakdown. When you tell her about the discharge plan, she says: 'doctor, you cannot discharge me. If you do, I will hurt myself and you will be responsible for that. Doctor Barkley knows me very well'. Which one of the following best describes the underlying cause of her behavior?</p>", "options": [{"letter": "A", "text": "Narcissistic personality disorder."}, {"letter": "B", "text": "Histrionic personality disorder."}, {"letter": "C", "text": "Borderline personality disorder."}, {"letter": "D", "text": "Factitious disorder."}, {"letter": "E", "text": "Malingering."}], "rationale": "<p>1. 题型识别：诊断 — 行为背后的人格障碍 2. 核心线索：</p>\n<ul>\n<li>出院 = 被抛弃</li>\n<li><strong>疯狂努力避免想象中的被遗弃</strong>：以自伤威胁阻止出院</li>\n<p>3. BPD关键特征：</p>\n<li>对被抛弃的过度恐惧</li>\n<li>无法耐受独处、需要他人在身边</li>\n<li>为避免想象中的遗弃做出疯狂努力（如冲动行为：自残、自杀行为）</li>\n<p>4. 排除：</p>\n<li>自恋型（A）：自我重要感、夸大、需要过度崇拜、缺乏共情、人际剥削</li>\n<li>表演型（B）：多彩夸张行为、浅表情感、性诱惑、需为关注中心</li>\n<li>做作性障碍（D）：有意识地产生症状以承担\"病人角色\"，动机在潜意识层面——本例未产生任何症状</li>\n<li>诈病（E）：有意识产生症状，但意图明确获益（金钱、逃避工作等）——本例无</li>\n<p>5. 注意：依赖型人格（DPD）也可有被遗弃担忧，但不是选项；>50%的BPD患者同时符合DPD标准 6. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>DPD vs BPD</strong>：DPD害怕被遗弃且黏人，但通常避免冲突、缺乏观点；BPD的疯狂避免遗弃常伴冲动/自伤行为</li>\n<li><strong>做作性障碍 vs 诈病</strong>：二者都有意识产生症状；区别在动机——病人角色（潜意识）vs 外在获益（意识）</li>\n<li><strong>本例未\"产生\"症状</strong>：只是威胁自伤，故非做作性障碍/诈病</li>\n</ul>", "summary": "<p><strong>边缘型人格障碍 (BPD)</strong>：</p>\n<ul>\n<li>对被遗弃的过度恐惧，无法耐受独处</li>\n<li>疯狂努力避免想象中的遗弃（可表现为自残、自杀行为等冲动行为）</li>\n<li>关系不稳定、冲动、情感不稳、自伤、空虚感、身份紊乱、不恰当愤怒</li>\n</ul>\n<p><strong>鉴别诊断</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>疾病</th><th>关键特征</th></tr></thead>\n<tbody>\n<tr><td>自恋型</td><td>自我重要感、夸大、需过度崇拜、缺乏共情、人际剥削</td></tr>\n<tr><td>表演型</td><td>夸张行为、浅表情感、性诱惑、需为关注中心</td></tr>\n<tr><td>做作性障碍</td><td>有意识产生症状以扮演病人角色（动机在潜意识）</td></tr>\n<tr><td>诈病</td><td>有意识产生症状以获取外在获益（金钱、免工作等）</td></tr>\n</tbody>\n</table>\n<p><strong>依赖型人格障碍 (DPD)</strong>：</p>\n<ul>\n<li>沉迷于被照顾的需要、黏人行为、不现实地担忧被遗弃</li>\n<li>缺乏观点、独处困难；>50%的BPD患者也符合DPD标准</li>\n</ul>", "explanation": "<p>在选项中，边缘型人格障碍（BPD）是对本场景的最佳解释。对被遗弃的过度恐惧是BPD的关键特征之一，这些被遗弃恐惧与无法耐受独处及需要他人在周围相关。患者会疯狂努力避免想象中的遗弃，其中一些努力包括自残或自杀行为等冲动行为。对这位女性而言，出院意味着被抛弃，她正竭尽全力阻止它。自恋型人格障碍（A）以自我重要感、夸大、对成功幻想沉迷为特征，认为自己特殊、需要过度崇拜、受批评时愤怒、缺乏共情、嫉妒他人且人际上剥削。表演型人格障碍（B）以多彩夸张行为和浅表情感为特征，用外表吸引注意、性诱惑、不是关注中心时不适。做作性障碍（D）以有意识地产生医学或精神障碍的症状体征为特征，主要目的是扮演病人角色并最终住院，动机对患者不明确且在潜意识层面——本患者未产生任何症状。诈病（E）也是有意识地产生症状，但与做作性障碍不同，有明确获益（金钱、逃避工作、免费食宿等）——本患者同样未产生任何症状。</p>", "references": "<ul>\n<li>Psych Central - Symptoms of Borderline Personality Disorder (BPD)</li>\n<li>Psych Central - Narcissistic Personality Disorder: Symptoms, Causes, and Treatment</li>\n<li>Psych Central - What Is Histrionic Personality Disorder? Symptoms, Treatments, and More</li>\n<li>Very Well Mind - The Link Between Borderline and Dependent Personality Disorders</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "边缘型人格障碍 — 害怕被抛弃\n边缘型人格障碍 — 害怕被抛弃、疯狂避免被遗弃\n a 27-year-old woman is about to get discharged from the hospital where she was admitted 2 weeks ago due to a psychological breakdown. when you tell her about the discharge plan, she says: 'doctor, you cannot discharge me. if you do, i will hurt myself and you will be responsible for that. doctor barkley knows me very well'. which one of the following best describes the underlying cause of her behavior? \n 在选项中，边缘型人格障碍（bpd）是对本场景的最佳解释。对被遗弃的过度恐惧是bpd的关键特征之一，这些被遗弃恐惧与无法耐受独处及需要他人在周围相关。患者会疯狂努力避免想象中的遗弃，其中一些努力包括自残或自杀行为等冲动行为。对这位女性而言，出院意味着被抛弃，她正竭尽全力阻止它。自恋型人格障碍（a）以自我重要感、夸大、对成功幻想沉迷为特征，认为自己特殊、需要过度崇拜、受批评时愤怒、缺乏共情、嫉妒他人且人际上剥削。表演型人格障碍（b）以多彩夸张行为和浅表情感为特征，用外表吸引注意、性诱惑、不是关注中心时不适。做作性障碍（d）以有意识地产生医学或精神障碍的症状体征为特征，主要目的是扮演病人角色并最终住院，动机对患者不明确且在潜意识层面——本患者未产生任何症状。诈病（e）也是有意识地产生症状，但与做作性障碍不同，有明确获益（金钱、逃避工作、免费食宿等）——本患者同样未产生任何症状。 "}, {"id": "AMC-Q0970", "type": "mcq", "qid": 970, "title": "围产期心理健康 — 婴儿难安抚反复就诊时先评估母亲情绪", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["围产期心理健康 — 婴儿难安抚反复就诊时先评估母亲情绪"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0970-Perinatal-Mental-Health-Screening.md", "stem": "<p>A 32-year-old woman has brought her 10-week-old male infant to your attention for consultation for the fifth time since his birth. She complains that the baby is crying too much, is irritable, and very hard to console. On examination, he looks well with a weight on 90 percentile. The rest of exam is unremarkable. Which one of the following is the most important thing to look for in history or clinical findings?</p>", "options": [{"letter": "A", "text": "Mood."}, {"letter": "B", "text": "Marital conflicts with her husband."}, {"letter": "C", "text": "Weight."}, {"letter": "D", "text": "Previous attitude."}, {"letter": "E", "text": "Financial issues."}], "rationale": "<p>1. 题型识别：筛查/评估 — 最重要需查找的病史或临床发现 2. 场景：10周婴儿第5次就诊，主诉婴儿哭闹过多、易激惹、难以安抚；婴儿体检正常（体重90百分位） 3. 关键推理：</p>\n<ul>\n<li>婴儿健康 → 问题可能在<strong>母亲</strong></li>\n<li>许多产后女性不认为自己抑郁/焦虑，而因\"其他原因\"（如难以安抚的婴儿）就诊</li>\n<li><strong>围产期心理健康障碍</strong>影响1/5澳大利亚足月婴儿母亲，抑郁和焦虑最常见</li>\n<p>4. 处理：常规询问情绪、焦虑及应对情况；必要时用EPDS（爱丁堡产后抑郁量表）筛查 5. 排除：</p>\n<li>婚姻冲突（B）、经济问题（E）：如有指征也应询问，但情绪问题是<strong>优先</strong>的</li>\n<li>既往态度（D）：既往抑郁/焦虑史是复发风险因素，但当前状况更重要</li>\n<li>体重（C）：抑郁可有体重变化，但非核心；婴儿体重正常</li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"难以安抚的婴儿\"≠婴儿问题</strong>：反复此类就诊可能提示母亲产后抑郁/焦虑</li>\n<li><strong>情绪优先于婚姻/经济</strong>：这些可能是诱因或加重因素，但情绪/焦虑评估优先</li>\n<li><strong>频繁就诊是信号</strong>：频繁拜访GP或产科医生可提示潜在抑郁</li>\n</ul>", "summary": "<p><strong>围产期心理健康障碍</strong>：</p>\n<ul>\n<li>1/5澳大利亚足月婴儿母亲患病，抑郁和焦虑最常见</li>\n<li>产后忧郁（postpartum blues）常见但良性自限</li>\n<li>其他：产后精神病、产后强迫观念</li>\n<li>精神问题对母婴均有生理和心理风险</li>\n</ul>\n<p><strong>筛查要点</strong>：</p>\n<ul>\n<li>产后女性常以\"其他原因\"就诊（如婴儿难以安抚/哭闹）</li>\n<li>应常规询问：情绪、焦虑、应对情况</li>\n<li>必要时使用<strong>爱丁堡产后抑郁量表（EPDS）</strong></li>\n</ul>\n<p><strong>精神问题的常见体征/症状（指导问诊）</strong>：</p>\n<ul>\n<li>大多数时间情绪低落/易激惹/焦虑、情绪波动</li>\n<li>兴趣/愉悦/动力丧失</li>\n<li>思维清晰度、注意力、记忆、决策问题</li>\n<li>消极想法（死亡、灾难）、自杀意念或计划</li>\n<li>无价值感/内疚、低自尊</li>\n<li>体重或食欲异常改变、睡眠显著改变</li>\n<li>显著疲劳或精力丧失、精神运动迟缓或激越</li>\n<li>过度焦虑、恐慌、担忧或反刍</li>\n<li>回避（人、地方、事物、活动）</li>\n<li>滥用酒精或其他物质</li>\n<li>非常异常的行为或思维：精神病性症状</li>\n</ul>", "explanation": "<p>1/5的澳大利亚足月婴儿母亲患有围产期心理健康障碍，其中抑郁和焦虑最常见。产后忧郁很常见，但通常良性且自限。产后精神病和产后强迫观念是其他可遇见的疾病。精神问题对母亲和婴儿都构成生理和心理风险，因此在围产期检查这些疾病的存在至关重要。抑郁和焦虑在产后期常见，与不良的养育和依恋及不良结局相关。有趣的是，许多产后女性不会将自己识别为抑郁或焦虑，而是可能因\"其他\"原因就诊，如难以安抚或不安定的婴儿（如本例）。在这种情况下，GP或儿童健康护士等医疗专业人员应常规询问情绪、焦虑及女性应对情况，必要时使用爱丁堡产后抑郁量表（EPDS）问卷作为筛查工具。婚姻冲突、来自丈夫或伴侣的支持或其他可能触发或加重心理崩溃的问题应在有指征时审慎询问，但探查情绪问题、焦虑或其他精神问题优先于这些事项。既往态度是评估中另一个重要点——曾有抑郁或焦虑史的女性复发风险更高，但当前状况更重要。体重变化在抑郁中可见，但也可能是生理性或由其他医学状况所致。</p>", "references": "<ul>\n<li>RACGP - Theme - Perinatal Depression</li>\n<li>Medscape - Postpartum Depression</li>\n</ul>", "related": ["AMC-Q0971-Postpartum-Obsessions", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "围产期心理健康 — 婴儿难安抚反复就诊时先评估母亲情绪\n围产期心理健康 — 婴儿难安抚反复就诊时先评估母亲情绪\n a 32-year-old woman has brought her 10-week-old male infant to your attention for consultation for the fifth time since his birth. she complains that the baby is crying too much, is irritable, and very hard to console. on examination, he looks well with a weight on 90 percentile. the rest of exam is unremarkable. which one of the following is the most important thing to look for in history or clinical findings? \n 1/5的澳大利亚足月婴儿母亲患有围产期心理健康障碍，其中抑郁和焦虑最常见。产后忧郁很常见，但通常良性且自限。产后精神病和产后强迫观念是其他可遇见的疾病。精神问题对母亲和婴儿都构成生理和心理风险，因此在围产期检查这些疾病的存在至关重要。抑郁和焦虑在产后期常见，与不良的养育和依恋及不良结局相关。有趣的是，许多产后女性不会将自己识别为抑郁或焦虑，而是可能因\"其他\"原因就诊，如难以安抚或不安定的婴儿（如本例）。在这种情况下，gp或儿童健康护士等医疗专业人员应常规询问情绪、焦虑及女性应对情况，必要时使用爱丁堡产后抑郁量表（epds）问卷作为筛查工具。婚姻冲突、来自丈夫或伴侣的支持或其他可能触发或加重心理崩溃的问题应在有指征时审慎询问，但探查情绪问题、焦虑或其他精神问题优先于这些事项。既往态度是评估中另一个重要点——曾有抑郁或焦虑史的女性复发风险更高，但当前状况更重要。体重变化在抑郁中可见，但也可能是生理性或由其他医学状况所致。 "}, {"id": "AMC-Q0971", "type": "mcq", "qid": 971, "title": "产后强迫观念 — 伤害婴儿的侵入性想法", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["产后强迫观念 — 伤害婴儿的侵入性想法（产后OCD）"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0971-Postpartum-Obsessions.md", "stem": "<p>A 28-year-old woman presents 3 months after giving birth to her daughter. She is concerned about her 'silly' thoughts of harming her baby. This has led her to avoid her baby and keeping her away from her. When you ask her to give you an example of how she is afraid of harm to the baby, she says 'I am afraid my baby would fall off my hand if I lift her'. Which one of the following could be the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Postpartum depression."}, {"letter": "B", "text": "Postpartum blues."}, {"letter": "C", "text": "Postpartum obsession."}, {"letter": "D", "text": "Postpartum psychosis."}, {"letter": "E", "text": "Overvalued ideas."}], "rationale": "<p>1. 题型识别：诊断 — 产后心理障碍鉴别 2. 关键线索：</p>\n<ul>\n<li>产后3个月</li>\n<li><strong>\"愚蠢\"的想法</strong>：担心伤害婴儿（害怕把婴儿从手上掉落）</li>\n<li>因此<strong>回避</strong>婴儿（行为回避=强迫行为）</li>\n<li><strong>有洞察力</strong>：认为想法\"愚蠢\"/不合理</li>\n<p>3. 产后强迫观念（产后OCD）特点：</p>\n<li>孕期/产后新发OCD、复发或慢性OCD加重</li>\n<li>强迫思维/意象：伤害婴儿（掉到地板、溺死、扔出窗外、挤压头骨、微波炉）、污染恐惧</li>\n<li>强迫行为：反复检查、过度清洗/换尿布、回避触摸婴儿</li>\n<li>患者通常<strong>有洞察力</strong>，识别想法为侵入性和不恰当</li>\n<p>4. 排除：</p>\n<li>产后抑郁（A）：核心是情绪症状，非侵入性伤害想法</li>\n<li>产后忧郁（B）：良性自限，产后头几天</li>\n<li>产后精神病（D）：想法固定/被相信为真实（罕见进展）</li>\n<li>超价观念（E）：非典型表述</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>洞察力</strong>：OCD患者对强迫观念有洞察力（\"silly\"），这是区分产后精神病（相信想法真实）的关键</li>\n<li><strong>\"怕伤害婴儿\"不一定是产后抑郁</strong>：产后抑郁以情绪、兴趣、睡眠为核心</li>\n<li><strong>产后忧郁 vs 强迫</strong>：产后忧郁发生于产后头几天、良性自限</li>\n<li><strong>行为回避是强迫行为</strong>：避免接触婴儿、回避刀具等</li>\n</ul>", "summary": "<p><strong>产后强迫观念（Postpartum Obsessions / 产后OCD）</strong>：</p>\n<ul>\n<li>孕期或产后女性OCD风险增加（新发、复发或加重）</li>\n<li>强迫思维/意象集中在怀孕或婴儿：</li>\n<li>产后常见：伤害婴儿的想法或意象（掉到地上、浴缸溺亡、扔出窗外、挤压头骨、微波炉）、污染恐惧</li>\n<li>产前常见：胎儿死亡或污染恐惧</li>\n<li>强迫行为：反复超声检查（产前）、<strong>回避触摸婴儿</strong>、反复清洗/换尿布</li>\n<li><strong>患者有洞察力</strong>：识别为侵入性和不恰当；严重长期可类似固定妄想性思维；极罕见进展为精神病</li>\n</ul>\n<p><strong>鉴别表（妊娠/产后）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>阶段</th><th>强迫观念</th><th>相关强迫行为</th></tr></thead>\n<tbody>\n<tr><td>妊娠</td><td>害怕胎儿死亡</td><td>检查胎动</td></tr>\n<tr><td>妊娠</td><td>害怕用有毒物质污染胎儿</td><td>过度清洗/清洁</td></tr>\n<tr><td>妊娠</td><td>对胎儿的攻击性强迫</td><td>—</td></tr>\n<tr><td>产后</td><td>害怕故意或意外伤害婴儿（包括性虐待）</td><td>回避行为（避免刀具、婴儿）</td></tr>\n<tr><td>产后</td><td>对婴儿猝死综合征的强烈恐惧</td><td>—</td></tr>\n<tr><td>产后</td><td>害怕污染婴儿</td><td>过度清洗/清洁</td></tr>\n<tr><td>产后</td><td>害怕对育儿技巧的批评</td><td>—</td></tr>\n</tbody>\n</table>\n<p><strong>注意</strong>：针对婴儿的攻击性强迫导致有害行为的可能性被认为非常小。</p>", "explanation": "<p>病史完全符合产后强迫观念这一最可能的诊断。女性在妊娠期间或之后患强迫症（OCD）的风险增加，包括新发OCD、复发OCD或慢性OCD加重。强迫思维和行为常集中在怀孕或婴儿上。产后常见的强迫性想法或心理意象包括伤害婴儿的想法以及污染婴儿的恐惧，例如把婴儿掉到地板上、在浴缸里淹死婴儿、把婴儿扔出窗外、压碎婴儿头骨、用微波炉加热婴儿等。强迫行为可包括母亲反复要求超声检查胎儿健康，或之后回避触摸婴儿、反复清洗或换尿布。根据定义，OCD患者对其强迫观念有洞察力，将其识别为侵入性和不恰当（正如这位女性将其想法描述为\"silly\"）；但其洞察程度可能不同。当严重的强迫性想法持续很长时间时，可类似固定的妄想性思维；极少数情况下，这些想法可进展为精神病，患者相信这些想法是真实的。对婴儿的攻击性强迫导致伤害行为的可能性尚不清楚，但一般认为非常小。</p>", "references": "<ul>\n<li>http://www.kemh.health.wa.gov.au/brochures/health_</li>\n<li>http://www.uptodate.com/contents/obsessive-compuls</li>\n</ul>", "related": ["AMC-Q0970-Perinatal-Mental-Health-Screening", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "产后强迫观念 — 伤害婴儿的侵入性想法\n产后强迫观念 — 伤害婴儿的侵入性想法（产后ocd）\n a 28-year-old woman presents 3 months after giving birth to her daughter. she is concerned about her 'silly' thoughts of harming her baby. this has led her to avoid her baby and keeping her away from her. when you ask her to give you an example of how she is afraid of harm to the baby, she says 'i am afraid my baby would fall off my hand if i lift her'. which one of the following could be the most likely diagnosis? \n 病史完全符合产后强迫观念这一最可能的诊断。女性在妊娠期间或之后患强迫症（ocd）的风险增加，包括新发ocd、复发ocd或慢性ocd加重。强迫思维和行为常集中在怀孕或婴儿上。产后常见的强迫性想法或心理意象包括伤害婴儿的想法以及污染婴儿的恐惧，例如把婴儿掉到地板上、在浴缸里淹死婴儿、把婴儿扔出窗外、压碎婴儿头骨、用微波炉加热婴儿等。强迫行为可包括母亲反复要求超声检查胎儿健康，或之后回避触摸婴儿、反复清洗或换尿布。根据定义，ocd患者对其强迫观念有洞察力，将其识别为侵入性和不恰当（正如这位女性将其想法描述为\"silly\"）；但其洞察程度可能不同。当严重的强迫性想法持续很长时间时，可类似固定的妄想性思维；极少数情况下，这些想法可进展为精神病，患者相信这些想法是真实的。对婴儿的攻击性强迫导致伤害行为的可能性尚不清楚，但一般认为非常小。 "}, {"id": "AMC-Q0992", "type": "mcq", "qid": 992, "title": "急性躁狂发作 — 治疗首选（锂盐）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["急性躁狂发作治疗首选"], "difficulty": 2, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0992-Acute-Mania-Lithium.md", "stem": "<p>Which one of the following is the treatment of choice for an acute manic episode of bipolar disorder?</p>", "options": [{"letter": "A", "text": "Carbamazepine."}, {"letter": "B", "text": "Lithium."}, {"letter": "C", "text": "Clozapine."}, {"letter": "D", "text": "Sodium valproate."}, {"letter": "E", "text": "Lamotrigine."}], "rationale": "<p>1. 急性躁狂一线治疗：锂盐（经典首选） 2. 备选：丙戊酸盐（钠）、非典型抗精神病药（奥氮平/喹硫平） 3. 卡马西平/拉莫三嗪更多用于预防或特殊情形 4. 锁定答案：B</p>", "traps": "<ul>\n<li>拉莫三嗪（E）是<strong>预防抑郁</strong>更优，急性躁狂效果差</li>\n<li>治疗需监测血锂浓度（0.6-1.2 mmol/L）</li>\n</ul>", "summary": "<ul>\n<li>急性躁狂首选：锂盐 / 丙戊酸盐 / 非典型抗精神病药</li>\n<li>拉莫三嗪：抑郁预防优先</li>\n<li>卡马西平：混合型/快速循环备选</li>\n</ul>", "explanation": "<p>锂盐是急性躁狂发作的经典治疗首选。</p>", "references": "<ul>\n<li>Therapeutic Guidelines – Psychotropic</li>\n</ul>", "related": ["AMC-Q0993-Acute-Mania-Treatment-Pregnancy", "AMC-Q0994-Acute-Mania-Breastfeeding", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性躁狂发作 — 治疗首选（锂盐）\n急性躁狂发作治疗首选\n which one of the following is the treatment of choice for an acute manic episode of bipolar disorder? \n 锂盐是急性躁狂发作的经典治疗首选。 "}, {"id": "AMC-Q0993", "type": "mcq", "qid": 993, "title": "急性躁狂 — 孕期治疗首选（锂盐仍为优选）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["急性躁狂治疗 — 孕期锂盐使用"], "difficulty": 3, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0993-Acute-Mania-Pregnancy-Lithium.md", "stem": "<p>Which one of the following is the treatment of choice for an acute manic episode of bipolar disorder?</p>", "options": [{"letter": "A", "text": "Carbamazepine."}, {"letter": "B", "text": "Lithium."}, {"letter": "C", "text": "Clozapine."}, {"letter": "D", "text": "Sodium valproate."}, {"letter": "E", "text": "Lamotrigine."}], "rationale": "<p>1. 急性躁狂治疗：锂盐经典首选 2. 孕期考虑：</p>\n<ul>\n<li>锂盐：早孕期与胎儿心血管畸形（Epstein 畸形）、面中部缺陷相关，但<strong>母体获益远超风险</strong></li>\n<li>早孕期暴露 → 16-20 周超声 + 超声心动图排除胎儿畸形</li>\n<li>二三孕期（心脏形成已完成）更安全，可安全恢复</li>\n<li><strong>孕晚期锂需求增加，但分娩前减量 25%</strong>（防新生儿\"软婴综合征\"），产后恢复原量</li>\n<p>3. 排除：卡马西平急性躁狂疗效差；丙戊酸致畸显著；氯氮平/拉莫三嗪非首选 4. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>丙戊酸在孕期禁用</strong>：显著致畸（神经管缺陷）——见选项 D</li>\n<li><strong>锂盐并非绝对禁用</strong>：母体获益>风险，重点在孕早期后监测</li>\n<li><strong>分娩前减量 25%</strong>：防新生儿毒性（软婴综合征：肌张力低下、发绀、吸吮差）</li>\n</ul>", "summary": "<p><strong>孕期锂盐要点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>时间</th><th>要点</th></tr></thead>\n<tbody>\n<tr><td>早孕期</td><td>胎儿心血管畸形（Epstein）、面中部缺陷风险↑；母体获益>风险</td></tr>\n<tr><td>早孕期暴露后</td><td>16-20 周超声 + 超声心动图</td></tr>\n<tr><td>二三孕期</td><td>心脏形成已完成，更安全，可恢复使用</td></tr>\n<tr><td>孕晚期</td><td>锂需求增加</td></tr>\n<tr><td>分娩前</td><td><strong>减量 25%</strong> → 防新生儿毒性（软婴综合征）</td></tr>\n<tr><td>产后</td><td>恢复原量</td></tr>\n</tbody>\n</table>", "explanation": "<p>锂盐是急性躁狂的经典治疗，孕期仍为优选。早孕期暴露与 Epstein 畸形等风险相关，但母体获益远超风险；16-20 周应做胎儿超声和超声心动图。二三孕期更安全。分娩前减量 25% 防新生儿软婴综合征。卡马西平急性躁狂疗效差，丙戊酸致畸显著。</p>", "references": "<ul>\n<li>Therapeutic Guidelines – Psychotropic</li>\n</ul>", "related": ["AMC-Q0992-Acute-Mania-Lithium", "AMC-Q0994-Acute-Mania-Breastfeeding", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性躁狂 — 孕期治疗首选（锂盐仍为优选）\n急性躁狂治疗 — 孕期锂盐使用\n which one of the following is the treatment of choice for an acute manic episode of bipolar disorder? \n 锂盐是急性躁狂的经典治疗，孕期仍为优选。早孕期暴露与 epstein 畸形等风险相关，但母体获益远超风险；16-20 周应做胎儿超声和超声心动图。二三孕期更安全。分娩前减量 25% 防新生儿软婴综合征。卡马西平急性躁狂疗效差，丙戊酸致畸显著。 "}, {"id": "AMC-Q0994", "type": "mcq", "qid": 994, "title": "急性躁狂 — 哺乳期治疗首选（丙戊酸钠）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["急性躁狂治疗 — 哺乳期用丙戊酸钠"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q0994-Acute-Mania-Breastfeeding-Valproate.md", "stem": "<p>Which one of the following is the treatment of choice for an acute manic episode of bipolar disorder in a breastfeeding woman?</p>", "options": [{"letter": "A", "text": "Carbamazepine."}, {"letter": "B", "text": "Lithium."}, {"letter": "C", "text": "Clozapine."}, {"letter": "D", "text": "Sodium valproate."}, {"letter": "E", "text": "Lamotrigine."}], "rationale": "<p>1. 产后是双相障碍复发高危期（前 3-6 个月复发率 20-50%，未治疗可达 70%） 2. 哺乳期药物选择：<strong>丙戊酸钠</strong>进入乳汁量少，为哺乳期急性躁狂首选 3. 锂盐（B）：<strong>大量进入乳汁</strong> → 哺乳期不首选 4. 排除：氯氮平（C）骨髓抑制风险非首选；拉莫三嗪（E）预防抑郁为主；卡马西平（A）急性躁狂疗效差 5. 锁定答案：D</p>", "traps": "<ul>\n<li><strong>孕期 vs 哺乳期首选不同</strong>：孕期锂盐优选（Q993），哺乳期丙戊酸钠优选——注意题干\"breastfeeding\"</li>\n<li><strong>丙戊酸有精神病性特征时效果差</strong>：若躁狂伴幻觉/妄想，丙戊酸无效（需非典型抗精神病药）</li>\n<li><strong>氟哌啶醇/利培酮/奥氮平</strong>：近期证明对急性躁狂比锂盐和心境稳定剂更有效（伴 EPS/代谢副作用）</li>\n</ul>", "summary": "<p><strong>产后双相复发</strong>：前 3-6 个月复发率 20-50%；未治疗可达 70%；可发生于晚孕期或产后数天至数周</p>\n<p><strong>哺乳期躁狂首选</strong>：丙戊酸钠（入乳汁少）</p>\n<p><strong>急性躁狂药物对比</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>要点</th></tr></thead>\n<tbody>\n<tr><td>丙戊酸钠</td><td>哺乳期首选；伴精神病性特征时效果差</td></tr>\n<tr><td>锂盐</td><td>经典首选；哺乳期入乳汁多</td></tr>\n<tr><td>氟哌啶醇/利培酮/奥氮平</td><td>急性躁狂比锂盐/心境稳定剂更有效；EPS/体重↑代谢问题</td></tr>\n<tr><td>卡马西平</td><td>急性躁狂疗效差</td></tr>\n<tr><td>拉莫三嗪</td><td>抑郁预防为主</td></tr>\n</tbody>\n</table>", "explanation": "<p>产后是双相障碍复发高危期。哺乳期急性躁狂首选<strong>丙戊酸钠</strong>（入乳汁少）。锂盐虽经典但大量进入乳汁。氟哌啶醇、利培酮、奥氮平近证对急性躁狂更有效，但有 EPS 和代谢不良反应。若躁狂伴精神病性特征，丙戊酸钠效果差。</p>", "references": "<ul>\n<li>Therapeutic Guidelines – Psychotropic</li>\n</ul>", "related": ["AMC-Q0992-Acute-Mania-Lithium", "AMC-Q0993-Acute-Mania-Pregnancy-Lithium", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "急性躁狂 — 哺乳期治疗首选（丙戊酸钠）\n急性躁狂治疗 — 哺乳期用丙戊酸钠\n which one of the following is the treatment of choice for an acute manic episode of bipolar disorder in a breastfeeding woman? \n 产后是双相障碍复发高危期。哺乳期急性躁狂首选 丙戊酸钠 （入乳汁少）。锂盐虽经典但大量进入乳汁。氟哌啶醇、利培酮、奥氮平近证对急性躁狂更有效，但有 eps 和代谢不良反应。若躁狂伴精神病性特征，丙戊酸钠效果差。 "}, {"id": "AMC-Q1000", "type": "mcq", "qid": 1000, "title": "轻躁狂 — 过度清洁 + 易激惹（躁狂发作特征）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["轻躁狂 vs 躁狂 — 轻躁狂诊断"], "difficulty": 3, "correctAnswer": "B", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1000-Hypomania-Cleaning-Irritability.md", "stem": "<p>A man brings his wife to your practice for your opinion, because she has started excessive cleaning of the house and alcohol drinking. She has a lot of fights with him and flirts with his friends. During consultation, she is initially flirtatious, but then becomes angry and starts talking to you very rudely. According to her husband, 4 days ago she was quite normal. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Obsessive compulsive disorder."}, {"letter": "B", "text": "Hypomania."}, {"letter": "C", "text": "Histrionic personality disorder."}, {"letter": "D", "text": "Passive-aggressive personality disorder."}, {"letter": "E", "text": "Mania."}], "rationale": "<p>1. 关键时间线：<strong>4 天前完全正常</strong> → 急性行为改变，排除人格障碍（长期稳定模式） 2. 症状：过度清洁、饮酒、与人争吵、调情、易激惹 → 躁狂发作特征（活动增加 + 易激惹） 3. 轻躁狂 vs 躁狂：轻躁狂无显著社会/职业功能损害、无精神病性症状、不需住院 4. 排除：</p>\n<ul>\n<li>OCD（A）：强迫思维/仪式，非突发社交行为改变</li>\n<li>表演型人格（C）：<strong>长期稳定模式</strong>，非 4 天突发</li>\n<li>躁狂（E）：更严重，常有精神病性特征/住院需求</li>\n<p>5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>急性发作 vs 人格障碍</strong>：4 天前正常 → 排除人格障碍（终身模式）</li>\n<li><strong>轻躁狂 vs 躁狂</strong>：题干无精神病性特征、无严重功能损害 → 轻躁狂</li>\n<li>过度清洁 ≠ OCD：躁狂可有目标导向活动增加，非强迫</li>\n</ul>", "summary": "<p><strong>轻躁狂特征</strong>（DSM）：</p>\n<ul>\n<li>持续 ≥4 天的心境高涨/易激惹 + 活动或精力增加</li>\n<li>3 项以上症状：自尊膨胀、睡眠需求减少、话多、思维奔逸、注意力分散、目标导向活动增加（如过度清洁）、冒险行为</li>\n<li><strong>无显著功能损害、无精神病性特征、不需住院</strong></li>\n</ul>\n<p><strong>与躁狂鉴别</strong>：严重度（功能损害 + 精神病性特征 + 住院需求）</p>", "explanation": "<p>该患者 4 天前正常，突发过度清洁、饮酒、争吵、调情和易激惹——符合躁狂发作特征。由于无显著功能损害和精神病性特征，诊断为<strong>轻躁狂</strong>。人格障碍（表演型等）是长期稳定模式，无法解释急性发作。</p>", "references": "<ul>\n<li>Therapeutic Guidelines – Psychotropic</li>\n</ul>", "related": ["AMC-Q1001-Hypomania-Management-Olanzapine", "AMC-Q0888-Mania-vs-Hypomania", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "轻躁狂 — 过度清洁 + 易激惹（躁狂发作特征）\n轻躁狂 vs 躁狂 — 轻躁狂诊断\n a man brings his wife to your practice for your opinion, because she has started excessive cleaning of the house and alcohol drinking. she has a lot of fights with him and flirts with his friends. during consultation, she is initially flirtatious, but then becomes angry and starts talking to you very rudely. according to her husband, 4 days ago she was quite normal. which one of the following is the most likely diagnosis? \n 该患者 4 天前正常，突发过度清洁、饮酒、争吵、调情和易激惹——符合躁狂发作特征。由于无显著功能损害和精神病性特征，诊断为 轻躁狂 。人格障碍（表演型等）是长期稳定模式，无法解释急性发作。 "}, {"id": "AMC-Q1001", "type": "mcq", "qid": 1001, "title": "轻躁狂管理 — 奥氮平首选", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["轻躁狂管理 — 奥氮平"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1001-Hypomania-Olanzapine.md", "stem": "<p>A man brings his wife to your practice for consultation, because in the past 5 days has been excessively cleaning the house and drinking alcohol. She has a lot of fights with him and flirts with his friends. During consultation, she initially is flirtatious, but then becomes angry and starts talking to you very rudely. According to her husband, she was previously quite normal. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Lithium."}, {"letter": "B", "text": "Lamotrigine."}, {"letter": "C", "text": "Olanzapine."}, {"letter": "D", "text": "Carbamazepine."}, {"letter": "E", "text": "Diazepam."}], "rationale": "<p>1. 诊断：轻躁狂（5 天突发过度清洁、易激惹、调情） 2. 急性躁狂/轻躁狂管理首选：<strong>非典型抗精神病药（奥氮平）</strong>——起效快，急性期优于心境稳定剂 3. 排除：</p>\n<ul>\n<li>锂盐（A）：急性期起效慢（1-2 周），更多用于维持或配合</li>\n<li>拉莫三嗪（B）：<strong>预防抑郁</strong>为主，急性躁狂无效</li>\n<li>卡马西平（D）：急性躁狂疗效差</li>\n<li>地西泮（E）：仅辅助镇静</li>\n<p>4. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>奥氮平 vs 锂盐</strong>：急性躁狂首选奥氮平（起效快）；锂盐是经典但起效慢</li>\n<li><strong>拉莫三嗪方向性</strong>：对躁狂无效，双相<strong>抑郁</strong>预防/急性期更优</li>\n<li><strong>用药选择看阶段</strong>：急性躁狂（奥氮平/锂/丙戊酸）≠ 维持期 ≠ 抑郁期</li>\n</ul>", "summary": "<p><strong>急性躁狂/轻躁狂管理</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>角色</th></tr></thead>\n<tbody>\n<tr><td><strong>奥氮平（非典型抗精神病药）</strong></td><td><strong>急性期首选（起效快）</strong></td></tr>\n<tr><td>锂盐</td><td>经典，起效慢；维持期重要</td></tr>\n<tr><td>丙戊酸钠</td><td>备选；哺乳期首选</td></tr>\n<tr><td>拉莫三嗪</td><td>抑郁预防/急性抑郁</td></tr>\n<tr><td>卡马西平</td><td>急性躁狂疗效差</td></tr>\n</tbody>\n</table>", "explanation": "<p>该患者为轻躁狂发作。急性躁狂/轻躁狂管理首选<strong>奥氮平等非典型抗精神病药</strong>（起效快）。锂盐经典但急性期起效慢，拉莫三嗪主要用于预防抑郁，卡马西平急性躁狂疗效差，地西泮仅辅助。</p>", "references": "<ul>\n<li>Therapeutic Guidelines – Psychotropic</li>\n</ul>", "related": ["AMC-Q1000-Hypomania-Cleaning-Irritability", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "轻躁狂管理 — 奥氮平首选\n轻躁狂管理 — 奥氮平\n a man brings his wife to your practice for consultation, because in the past 5 days has been excessively cleaning the house and drinking alcohol. she has a lot of fights with him and flirts with his friends. during consultation, she initially is flirtatious, but then becomes angry and starts talking to you very rudely. according to her husband, she was previously quite normal. which one of the following is the next best step in management? \n 该患者为轻躁狂发作。急性躁狂/轻躁狂管理首选 奥氮平等非典型抗精神病药 （起效快）。锂盐经典但急性期起效慢，拉莫三嗪主要用于预防抑郁，卡马西平急性躁狂疗效差，地西泮仅辅助。 "}, {"id": "AMC-Q1151", "type": "mcq", "qid": 1151, "title": "额颞叶痴呆 — 早期社会失礼行为，记忆相对保留", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["额颞叶痴呆 — 早期社会失礼行为，记忆相对保留"], "difficulty": 3, "correctAnswer": "D", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1151-Frontotemporal-Dementia.md", "stem": "<p>Accompanied by his wife, a 63-year-old man presents to your practice for consultation. She is concerned about her husband because he has been recently behaving childish and bizarre. Last week he was dismissed from his job as a manager in a local restaurant, because of treating rude to customers and shouting at his colleagues. He does not shave, bathe or change his clothes as he did before and is disheveled and unkempt all the time. She denies any falls, gait abnormalities, or hallucinations in her husband. His memory is not significantly affected. Which one of the following could be the <strong>most likely diagnosis</strong>?</p>", "options": [{"letter": "A", "text": "Depression."}, {"letter": "B", "text": "Alzheimer disease."}, {"letter": "C", "text": "Lewy body dementia."}, {"letter": "D", "text": "Frontotemporal dementia."}, {"letter": "E", "text": "Schizophrenia."}], "rationale": "<p>1. 题型识别：诊断 — 痴呆鉴别 2. 关键线索：</p>\n<ul>\n<li>63岁男性 → 典型FTD发病年龄（50末-60初）<
