/li>\n<li><strong>幼稚、怪异行为 + 社会失礼</strong>（对顾客粗鲁、吼叫同事）</li>\n<li>不修边幅、不注重个人卫生</li>\n<li><strong>记忆未显著受影响</strong> ← 关键排除点</li>\n<li>无跌倒、步态异常、幻觉</li>\n<p>3. 对比各痴呆类型：</p>\n<li>阿尔茨海默病（B）：<strong>健忘为首发症状</strong>，社会礼仪保留至晚期</li>\n<li>路易体痴呆（C）：波动认知+帕金森症+幻觉+反复跌倒 → 均缺失</li>\n<li>FTD（D）：<strong>社会失礼最早出现，记忆后受影响</strong> → 完全匹配</li>\n<li>抑郁/假性痴呆（A）：病史短突然起病，罕见脱抑制</li>\n<li>精神分裂症（E）：此年龄起病不常见，缺少幻觉妄想</li>\n<p>4. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>记忆好=不是痴呆</strong>误区：FTD早期记忆可相对保留，痴呆不只是健忘</li>\n<li><strong>行为怪异=精神病</strong>：老年人首次出现行为/人格改变，优先考虑痴呆（尤其FTD）而非晚发精神分裂症</li>\n</ul>", "summary": "<p><strong>额颞叶痴呆（Frontotemporal Dementia, FTD/Pick Disease）</strong>：</p>\n<ul>\n<li>病因：额叶和/或颞叶局灶性变性</li>\n<li><strong>典型发病年龄</strong>：50末-60初</li>\n<li><strong>核心特征</strong>：</li>\n<li>早期：人格和社交行为改变、语言问题 → 进展为全面痴呆</li>\n<li>脱抑制和社会失礼（最早出现）</li>\n<li>启动和计划受损</li>\n<li>记忆障碍在后期出现</li>\n<li>晚期可出现锥体外系或运动神经元受累</li>\n</ul>\n<p><strong>痴呆类型鉴别要点</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>首发症状</th><th>记忆</th><th>其他特征</th></tr></thead>\n<tbody>\n<tr><td>Alzheimer</td><td>健忘</td><td>早受累</td><td>社会礼仪保留至晚期</td></tr>\n<tr><td>血管性</td><td>阶梯式进展+局灶体征</td><td>不定</td><td>局灶运动/感觉障碍</td></tr>\n<tr><td>路易体</td><td>波动认知+帕金森症</td><td>后受累</td><td>幻视、反复跌倒</td></tr>\n<tr><td>FTD</td><td>人格改变/社会失礼</td><td>后受累</td><td>脱抑制、不修边幅</td></tr>\n<tr><td>NPH</td><td>步态异常</td><td>后受累</td><td>步态+尿失禁+痴呆三联征</td></tr>\n</tbody>\n</table>", "explanation": "<p>该案例以社会不适当行为为最令人担忧的主诉，而记忆未显著受累。在选项中，最符合的是额颞叶痴呆（Pick病）。该病中社会失礼是最早症状，记忆障碍和健忘随后出现。阿尔茨海默病以健忘为首发，路易体痴呆需波动认知+帕金森症+幻觉，假性痴呆罕见脱抑制，精神分裂症此年龄起病不典型。</p>", "references": "<ul>\n<li>UpToDate - Frontotemporal dementia: Clinical features and diagnosis</li>\n<li>Therapeutic guidelines - Psychotropics</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "额颞叶痴呆 — 早期社会失礼行为，记忆相对保留\n额颞叶痴呆 — 早期社会失礼行为，记忆相对保留\n accompanied by his wife, a 63-year-old man presents to your practice for consultation. she is concerned about her husband because he has been recently behaving childish and bizarre. last week he was dismissed from his job as a manager in a local restaurant, because of treating rude to customers and shouting at his colleagues. he does not shave, bathe or change his clothes as he did before and is disheveled and unkempt all the time. she denies any falls, gait abnormalities, or hallucinations in her husband. his memory is not significantly affected. which one of the following could be the  most likely diagnosis ? \n 该案例以社会不适当行为为最令人担忧的主诉，而记忆未显著受累。在选项中，最符合的是额颞叶痴呆（pick病）。该病中社会失礼是最早症状，记忆障碍和健忘随后出现。阿尔茨海默病以健忘为首发，路易体痴呆需波动认知+帕金森症+幻觉，假性痴呆罕见脱抑制，精神分裂症此年龄起病不典型。 "}, {"id": "AMC-Q1720", "type": "mcq", "qid": 1720, "title": "SSRI试验时间 — 治疗剂量后至少4-6周才考虑调整", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["抗抑郁药试验时间 — 达到治疗剂量后至少4-6周再调整"], "difficulty": 2, "correctAnswer": "A", "page": 1460, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1720-SSRI-Trial-Duration.md", "stem": "<p>John, 24 years, had a diagnosis of depression and was started on sertraline (Zoloft) 50 mg/day 23 days ago, and was given a mental health care plan to see a psychologist for cognitive behavioral therapy (CBT). He is in your office today for follow-up, and believes there has been no improvement whatsoever. Which one of the following is the <strong>most appropriate next step</strong> in management?</p>", "options": [{"letter": "A", "text": "Continue the same dose of sertraline."}, {"letter": "B", "text": "Increase the dose of sertraline."}, {"letter": "C", "text": "Switch to another SSRI."}, {"letter": "D", "text": "Switch to an SNRI."}, {"letter": "E", "text": "Add a different antidepressant medication to sertraline."}], "rationale": "<p>1. 题型识别：治疗 — 药物治疗时程判断 2. 关键数据：舍曲林50mg/天 × <strong>23天</strong>（约3周） 3. 治疗原则：</p>\n<ul>\n<li>SSRIs的起始剂量通常就是治疗剂量（舍曲林50mg）</li>\n<li>治疗反应通常延迟1-2周</li>\n<li><strong>所有抗抑郁药应至少试验4-6周再调整</strong></li>\n<p>4. 23天（~3周）< 4-6周 → 为时过早，应继续 5. 排除：</p>\n<li>B：增加剂量为时尚早</li>\n<li>C/D：换药为时尚早（除非不良反应无法耐受）</li>\n<li>E：联合使用两种抗抑郁药<strong>不推荐</strong></li>\n<p>6. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>患者感觉无效=立即换药</strong>误区：抗抑郁药起效需时间，不能过早判断无效</li>\n<li><strong>联合用药</strong>：同时使用两种抗抑郁药不推荐</li>\n</ul>", "summary": "<p><strong>抗抑郁药治疗时间线</strong>：</p>\n<ul>\n<li>SSRIs起始剂量通常=治疗剂量</li>\n<li>治疗反应延迟1-2周</li>\n<li><strong>规则</strong>：达到治疗剂量后至少试验<strong>4-6周</strong>才考虑变更</li>\n<li>变更情况：增加剂量、换药、换类别</li>\n<li><strong>禁忌</strong>：不推荐同时使用两种抗抑郁药</li>\n<li>密切监测不良反应和自杀倾向</li>\n</ul>\n<p><strong>常见抗抑郁药类别</strong>：</p>\n<ul>\n<li>SSRIs（一线）：安全性和耐受性优于TCAs</li>\n<li>SNRIs（如文拉法辛）</li>\n<li>可逆性MAOIs（如吗氯贝胺）</li>\n<li>非选择性MAOIs（如苯乙肼）</li>\n</ul>", "explanation": "<p>SSRIs和TCAs是抑郁症最常用的两类处方药。SSRIs不良反应更安全、脱落率更低。抗抑郁药从起始剂量开始逐步增加至治疗剂量。大多数SSRIs的起始剂量即为治疗剂量，舍曲林50mg/天即是起始剂量也是治疗剂量。治疗反应常延迟1-2周，原则上所有抗抑郁药在达到治疗剂量后应至少试验4-6周。John仅用药23天，应建议继续相同剂量至少满6周，同时密切监测不良反应和自杀倾向。</p>", "references": "<ul>\n<li>RACGP - use of antidepressant medications in the general practice setting</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "ssri试验时间 — 治疗剂量后至少4-6周才考虑调整\n抗抑郁药试验时间 — 达到治疗剂量后至少4-6周再调整\n john, 24 years, had a diagnosis of depression and was started on sertraline (zoloft) 50 mg/day 23 days ago, and was given a mental health care plan to see a psychologist for cognitive behavioral therapy (cbt). he is in your office today for follow-up, and believes there has been no improvement whatsoever. which one of the following is the  most appropriate next step  in management? \n ssris和tcas是抑郁症最常用的两类处方药。ssris不良反应更安全、脱落率更低。抗抑郁药从起始剂量开始逐步增加至治疗剂量。大多数ssris的起始剂量即为治疗剂量，舍曲林50mg/天即是起始剂量也是治疗剂量。治疗反应常延迟1-2周，原则上所有抗抑郁药在达到治疗剂量后应至少试验4-6周。john仅用药23天，应建议继续相同剂量至少满6周，同时密切监测不良反应和自杀倾向。 "}, {"id": "AMC-Q1728", "type": "mcq", "qid": 1728, "title": "性别焦虑 — 感觉被困在异性身体中", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["性别焦虑/易性癖 — 感觉被困在异性身体中"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1728-Gender-Dysphoria-Cross-Dressing.md", "stem": "<p>Janet presents to you concerned about her 15-year-old son, Joey, after she found out he had been wearing his older sister's underwear. She is a single parent as her husband left them after Joey was born. She works two jobs and has been under a lot of stress and has not had enough time to spend with her kids. She is quite frustrated and distressed with Joey's behaviour and believes there is something seriously wrong with him and wishes she has not given birth to him at all. Which of the following is the <strong>correct statement</strong> to share with Janet?</p>", "options": [{"letter": "A", "text": "Joey may feel as if he is a girl trapped in a boy's body."}, {"letter": "B", "text": "He is most likely doing it for fun."}, {"letter": "C", "text": "Not having a father figure in his life is the reason for this behavior."}, {"letter": "D", "text": "Janet's lifestyle may be the main reason for Joey's behavior."}, {"letter": "E", "text": "It is a part of normal development at this age."}], "rationale": "<p>1. 题型识别：沟通 — 向家属解释病情 2. 鉴别诊断：异装、异装障碍、性别焦虑、易性癖 3. 选项分析：</p>\n<ul>\n<li>A：准确描述性别焦虑/易性癖的核心体验 — 正确</li>\n<li>B：不恰当且无依据 — 增加母亲焦虑</li>\n<li>C/D：无足够证据将行为归因于父亲缺失或母亲生活方式</li>\n<li>E：错误 — 6-7岁后儿童已理解性别恒定性，15岁此行为非正常发育</li>\n<p>4. 正确沟通：解释+建议心理咨询+家庭洞察治疗 5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>正常发育 vs 病理</strong>：6-7岁后儿童理解性别是永久性的，15岁穿异性服装不是正常发育阶段</li>\n<li><strong>归因于家庭因素</strong>：题目信息不足以将行为归因于缺少父亲或母亲生活方式</li>\n<li><strong>\"只是好玩\"回应</strong>：母亲已很担忧，此回应无帮助</li>\n</ul>", "summary": "<p><strong>相关鉴别诊断</strong>：</p>\n<ul>\n<li><strong>异装（cross-dressing）</strong>：异性恋男性穿女装，与易性癖/同性恋无关联</li>\n<li><strong>异装障碍（transvestic disorder）</strong>：DSM-5中，异装伴随性兴奋时才视为精神障碍</li>\n<li><strong>易性癖/跨性别（transgender）</strong>：性别认同与出生性别不同，全天候以认同性别生活</li>\n<li><strong>性别焦虑（gender dysphoria）</strong>：因性别认同与出生性别不同而感到痛苦，影响学校/家庭生活</li>\n</ul>\n<p><strong>正常发育</strong>：儿童和青少年尝试性别角色实验是正常的，但大多数最终对出生性别感到舒适。性别焦虑在儿童青少年中<strong>不是阶段性的</strong>。</p>\n<p><strong>管理</strong>：心理咨询 + 家庭洞察治疗，鼓励母亲带Joey来咨询。</p>", "explanation": "<p>Joey对穿女性服装的兴趣提示异装、异装障碍、性别焦虑和易性癖等鉴别诊断。儿童和青少年尝试性别角色实验是正常的，但大多最终对出生性别感到舒适。性别焦虑在儿童青少年中非阶段性。应向Janet解释性别焦虑者的感受（感觉被困在异性身体中），同时讨论可能诊断。建议心理咨询和家庭洞察治疗。6-7岁后儿童已理解性别恒定性，15岁此行为不是正常发育的一部分。</p>", "references": "<ul>\n<li>RCH - Gender dysphoria</li>\n<li>American Psychiatric Association - Gender Dysphoria</li>\n<li>RACGP - AFP: Gender dysphoria</li>\n</ul>", "related": ["TR-Cross-Dressing-Transvestitism", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "性别焦虑 — 感觉被困在异性身体中\n性别焦虑/易性癖 — 感觉被困在异性身体中\n janet presents to you concerned about her 15-year-old son, joey, after she found out he had been wearing his older sister's underwear. she is a single parent as her husband left them after joey was born. she works two jobs and has been under a lot of stress and has not had enough time to spend with her kids. she is quite frustrated and distressed with joey's behaviour and believes there is something seriously wrong with him and wishes she has not given birth to him at all. which of the following is the  correct statement  to share with janet? \n joey对穿女性服装的兴趣提示异装、异装障碍、性别焦虑和易性癖等鉴别诊断。儿童和青少年尝试性别角色实验是正常的，但大多最终对出生性别感到舒适。性别焦虑在儿童青少年中非阶段性。应向janet解释性别焦虑者的感受（感觉被困在异性身体中），同时讨论可能诊断。建议心理咨询和家庭洞察治疗。6-7岁后儿童已理解性别恒定性，15岁此行为不是正常发育的一部分。 "}, {"id": "AMC-Q1730", "type": "mcq", "qid": 1730, "title": "正常悲伤反应 — 短程苯二氮䓬类+悲伤咨询", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["正常悲伤反应 — 短程苯二氮䓬类+悲伤咨询"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1730-Grief-Reaction-Benzodiazepines.md", "stem": "<p>Eve is 45 years old and has presented to your clinic for consultation in tears. Her only son died 6 weeks ago from a car accident, and since then she has been having difficulty sleeping and terrible headaches. She does not enjoy doing her life routines anymore and does not feel like eating. Further probing reveals that she hears her son speaking to her and calling her name and sometimes she feels his presence in her bedroom at night. She wants something to help her with her sleep. Which one of the following is the <strong>most appropriate action</strong> in this situation?</p>", "options": [{"letter": "A", "text": "Referral to hospital for admission, assessment, and treatment."}, {"letter": "B", "text": "Referral to a psychiatrist."}, {"letter": "C", "text": "A short course of benzodiazepines and referral for grief counselling."}, {"letter": "D", "text": "A short course of selective serotonin re-uptake inhibitors (SSRI) and referral for grief counselling."}, {"letter": "E", "text": "A short course of antipsychotics and referral for grief counselling."}], "rationale": "<p>1. 题型识别：治疗 — 管理策略选择 2. 识别诊断：<strong>正常悲伤反应</strong>（儿子6周前死亡，睡眠差、头痛、丧失兴趣、食欲减退） 3. 关键信息：</p>\n<ul>\n<li>听到儿子说话/叫名字 → <strong>正常悲伤反应中的简单幻视幻听</strong>（非精神病）</li>\n<li>感觉儿子在卧室 → 正常的悲伤体验</li>\n<li>持续时间：6周 → 正常悲伤反应在2个月内恢复社交功能</li>\n<p>4. 管理：短程苯二氮䓬类（<7天）解决睡眠 + 悲伤咨询 5. 排除：</p>\n<li>SSRI（D）：不符合重度抑郁诊断标准</li>\n<li>抗精神病药（E）：幻听是悲伤反应的一部分，非精神病</li>\n<li>精神科转诊（B）：当前不需要</li>\n<li>住院（A）：过度</li>\n<p>6. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>幻听 = 精神病？</strong>：悲伤反应中简单的视/听幻觉（听到逝者说话、感受其存在）是正常现象，会让人担心自己\"疯了\"但并非新发精神病</li>\n<li><strong>SSRI vs 苯二氮䓬类</strong>：患者主诉是<strong>睡眠</strong>，非抑郁症状；不符合重度抑郁则不用SSRI</li>\n</ul>", "summary": "<p><strong>正常悲伤反应（Normal Grief Reaction）</strong>：</p>\n<ul>\n<li>症状：悲伤、绝望、流泪、睡眠减少、食欲减退、对世界失去兴趣</li>\n<li>内疚和羞耻不常见但可能</li>\n<li><strong>时间线</strong>：2个月内恢复社会功能；症状可持续长达1年（时好时坏）</li>\n<li><strong>正常体验</strong>：逝者的简单视/听幻觉（感觉存在、听到叫名字）</li>\n<li>自杀倾向通常不是关注点（除非有意图和计划）</li>\n</ul>\n<p><strong>管理</strong>：</p>\n<ul>\n<li>无红旗警示 → 短程苯二氮䓬类（<7天）+ 悲伤咨询</li>\n<li>症状持续不缓解 → 考虑精神科转诊</li>\n<li>符合重度抑郁 → SSRIs</li>\n</ul>", "explanation": "<p>根据症状和持续时间，正常悲伤反应是最可能的解释。Eve在悲伤，影响多方面功能。患者主诉想帮助睡眠，在无自杀倾向等红旗警示下，最适当处理是短程苯二氮䓬类（<7天）治疗失眠+悲伤咨询帮助应对丧失。逝者的简单视/听幻觉是悲伤反应的结果，而非新发精神病。不符合重度抑郁诊断标准，SSRI不适用。如果悲伤咨询后症状持续，才需考虑精神科转诊。</p>", "references": "<ul>\n<li>RACGP - Theme: Grief and loss</li>\n<li>World Psychiatry - Grief and bereavement: what psychiatrists need to know</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["headache"], "search": "正常悲伤反应 — 短程苯二氮䓬类+悲伤咨询\n正常悲伤反应 — 短程苯二氮䓬类+悲伤咨询\n eve is 45 years old and has presented to your clinic for consultation in tears. her only son died 6 weeks ago from a car accident, and since then she has been having difficulty sleeping and terrible headaches. she does not enjoy doing her life routines anymore and does not feel like eating. further probing reveals that she hears her son speaking to her and calling her name and sometimes she feels his presence in her bedroom at night. she wants something to help her with her sleep. which one of the following is the  most appropriate action  in this situation? \n 根据症状和持续时间，正常悲伤反应是最可能的解释。eve在悲伤，影响多方面功能。患者主诉想帮助睡眠，在无自杀倾向等红旗警示下，最适当处理是短程苯二氮䓬类（ "}, {"id": "AMC-Q1732", "type": "mcq", "qid": 1732, "title": "防御机制 — 否认（Denial）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["防御机制 — 否认（Denial）"], "difficulty": 2, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1732-Defense-Mechanism-Denial.md", "stem": "<p>A middle-age farmer from Queensland presents with symptoms of poor sleep, lack of concentration and energy, decreased appetite, and low mood for the past few weeks. He believes that all these started after the drought and blames the government for being reckless and irresponsible. When you mention that his symptoms are of depressive nature, he objects it and says he is just exhausted and not depressed. Which one the following defense mechanisms is he using?</p>", "options": [{"letter": "A", "text": "Displacement."}, {"letter": "B", "text": "Projection."}, {"letter": "C", "text": "Denial."}, {"letter": "D", "text": "Rationalization."}, {"letter": "E", "text": "Reaction formation."}], "rationale": "<p>1. 题型识别：诊断 — 防御机制识别 2. 读题关键：医生指出症状是抑郁性质 → 患者<strong>直接拒绝接受</strong> → \"我只是疲惫\" 3. 各防御机制对比：</p>\n<ul>\n<li><strong>否认（C）</strong>：拒绝接受现实，以愿望幻想替代 — <strong>匹配</strong></li>\n<li>投射（B）：将自身感受归因于他人 — 骂政府是投射，但问题针对的是对诊断的反应</li>\n<li>置换（A）：将对一人的情感转向另一人/物</li>\n<li>合理化（D）：用理性解释为不可接受的行为辩护 — 如果他说\"当然我抑郁，干旱毁了一切\"才是合理化</li>\n<li>反向形成（E）：表达与真实感受相反的情感</li>\n<p>4. 注意：骂政府是<strong>投射</strong>，但题目问的是<strong>对被告知抑郁的反应</strong>→ 否认 5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>多重防御机制共存</strong>：患者同时使用了投射（骂政府）和否认（拒绝接受抑郁），需仔细辨别题目具体指向哪个行为</li>\n<li><strong>否认 vs 合理化</strong>：否认是完全拒绝承认（\"我没抑郁\"），合理化是承认但找借口（\"我抑郁是因为…\"）</li>\n</ul>", "summary": "<p><strong>常见防御机制</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>防御机制</th><th>定义</th><th>举例</th></tr></thead>\n<tbody>\n<tr><td><strong>否认（Denial）</strong></td><td>拒绝接受现实，以愿望幻想替代</td><td>\"我不是抑郁，我只是累了\"</td></tr>\n<tr><td><strong>投射（Projection）</strong></td><td>将自身冲动/感受归因于外界</td><td>责怪政府鲁莽和不负责任</td></tr>\n<tr><td><strong>置换（Displacement）</strong></td><td>将对一人的情感转向另一人/物</td><td>对老板不满回家对孩子发火</td></tr>\n<tr><td><strong>合理化（Rationalization）</strong></td><td>用理性解释为不可接受行为辩护</td><td>\"我抑郁是因为干旱毁了一切\"</td></tr>\n<tr><td><strong>反向形成（Reaction formation）</strong></td><td>表达与真实感受相反的情感</td><td>因诊断感到自卑却表现得过度好斗</td></tr>\n</tbody>\n</table>", "explanation": "<p>患者出现抑郁症状（睡眠差、注意力不集中、精力下降、食欲减退、情绪低落），由干旱带来的损失引发。当医生试图解释症状具有抑郁性质时，他拒绝接受并坚称只是疲惫。这是典型的否认防御机制——以愿望幻想替代外部现实。他责怪政府是投射的例子，但题目针对的是对被告知诊断的反应。如果他说\"当然我抑郁，干旱毁了一切\"，那才是合理化。</p>", "references": "<ul>\n<li>Simple Psychology - Defense Mechanisms</li>\n<li>Psychology Today - The Essential Guide to Defense Mechanisms</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "防御机制 — 否认（denial）\n防御机制 — 否认（denial）\n a middle-age farmer from queensland presents with symptoms of poor sleep, lack of concentration and energy, decreased appetite, and low mood for the past few weeks. he believes that all these started after the drought and blames the government for being reckless and irresponsible. when you mention that his symptoms are of depressive nature, he objects it and says he is just exhausted and not depressed. which one the following defense mechanisms is he using? \n 患者出现抑郁症状（睡眠差、注意力不集中、精力下降、食欲减退、情绪低落），由干旱带来的损失引发。当医生试图解释症状具有抑郁性质时，他拒绝接受并坚称只是疲惫。这是典型的否认防御机制——以愿望幻想替代外部现实。他责怪政府是投射的例子，但题目针对的是对被告知诊断的反应。如果他说\"当然我抑郁，干旱毁了一切\"，那才是合理化。 "}, {"id": "AMC-Q1734", "type": "mcq", "qid": 1734, "title": "脑震荡后综合征 — 头部外伤后症状持续>3个月", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["脑震荡后综合征 — 头部外伤后症状持续>3个月"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1734-Post-Concussion-Syndrome.md", "stem": "<p>Ali, 45 years old is in your office with his wife who is concerned about him and insisted that he sees a doctor because he seems to have been 'lost' and 'confused' since he had a severe car accident and lost one of his best friends who was in the car with him 5 months ago. He only sustained a head injury in the accident which was cleared as a minor one with no serious complications at that time. Which of the following could be the <strong>most likely cause</strong> to this presentation?</p>", "options": [{"letter": "A", "text": "Major depressive disorder."}, {"letter": "B", "text": "Post-traumatic stress disorder."}, {"letter": "C", "text": "Post-concussion syndrome."}, {"letter": "D", "text": "Late-onset schizophrenia."}, {"letter": "E", "text": "Dementia."}], "rationale": "<p>1. 题型识别：诊断 — 鉴别诊断 2. 关键线索：</p>\n<ul>\n<li>严重车祸 + 头部外伤 → 脑震荡</li>\n<li>症状持续<strong>5个月</strong> → >3个月 = PCS诊断标准</li>\n<li>症状：\"迷茫\"、\"困惑\"</li>\n<p>3. PCS症状包括：</p>\n<li><strong>认知</strong>：注意力不集中、记忆问题、脑雾</li>\n<li><strong>情绪</strong>：焦虑、抑郁、易激惹、精力低下</li>\n<li><strong>感觉</strong>：视物模糊、耳鸣、味/嗅觉改变</li>\n<li><strong>血管调节</strong>：头痛、疲劳、头晕、畏光畏声</li>\n<p>4. 排除：</p>\n<li>PTSD（B）：缺少闪回、噩梦、过度警觉等核心症状</li>\n<li>重度抑郁（A）：不符合DSM-5 5/9标准</li>\n<li>晚发精神分裂症（D）：无偏执、妄想、幻觉</li>\n<li>痴呆（E）：无记忆丧失、语言问题、认知缺陷</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>PTSD vs PCS</strong>：车祸+丧友 → 易倾向于PTSD，但缺少PTSD核心症状（闪回、噩梦、回避、过度警觉）</li>\n<li><strong>\"轻度\"头部外伤=没事？</strong>：即使是\"轻度\"脑震荡，症状也可能持续>3个月成为PCS</li>\n<li><strong>PCS在GP中常被漏诊/误治</strong></li>\n</ul>", "summary": "<p><strong>脑震荡后综合征（Post-Concussion Syndrome, PCS）</strong>：</p>\n<ul>\n<li><strong>定义</strong>：脑震荡症状持续 > 3个月</li>\n<li><strong>90%患者</strong>在数天至数周内快速恢复</li>\n<li><strong>症状分类</strong>：</li>\n<li>认知：注意力不集中、记忆问题、脑雾、易分心</li>\n<li>情绪：焦虑、抑郁、不堪重负感、易激惹、精力低下</li>\n<li>感觉：视物模糊、晕车/恶心、味/嗅觉改变、耳鸣</li>\n<li>血管调节：头痛、疲劳、恶心、头晕、畏光畏声、睡眠问题、颈痛</li>\n</ul>\n<p><strong>鉴别诊断要点</strong>：</p>\n<ul>\n<li><strong>PTSD</strong>：需症状持续≥1个月+闪回/噩梦/回避/过度警觉等20项DSM-5标准</li>\n<li><strong>晚发精神分裂症</strong>：≥45岁起病，偏执妄想和幻听为主，阴性症状和思维紊乱较少</li>\n<li><strong>重度抑郁</strong>：需符合DSM-5中9项标准中的≥5项</li>\n</ul>", "explanation": "<p>此案例代表了GP中常见但常被漏诊误治的脑震荡后综合征。脑震荡是头部外伤后脑功能的暂时性紊乱，约90%患者在数天至数周内恢复。症状持续超过3个月则定义为PCS。Ali在车祸中头部外伤已5个月，症状包括\"迷茫\"和\"困惑\"，最符合PCS。虽然PTSD也可能（因车祸中好友死亡），但Ali无PTSD核心症状。不符合重度抑郁、晚发精神分裂症或痴呆的诊断标准。</p>", "references": "<ul>\n<li>Medscape - Post-concussion Syndrome</li>\n<li>RACGP - News GP - The potentially long-lasting effects of concussion</li>\n<li>The American Journal of Psychiatry - Late-Onset Schizophrenia and Very-Late-Onset Schizophrenia-Like Psychosis</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "脑震荡后综合征 — 头部外伤后症状持续>3个月\n脑震荡后综合征 — 头部外伤后症状持续>3个月\n ali, 45 years old is in your office with his wife who is concerned about him and insisted that he sees a doctor because he seems to have been 'lost' and 'confused' since he had a severe car accident and lost one of his best friends who was in the car with him 5 months ago. he only sustained a head injury in the accident which was cleared as a minor one with no serious complications at that time. which of the following could be the  most likely cause  to this presentation? \n 此案例代表了gp中常见但常被漏诊误治的脑震荡后综合征。脑震荡是头部外伤后脑功能的暂时性紊乱，约90%患者在数天至数周内恢复。症状持续超过3个月则定义为pcs。ali在车祸中头部外伤已5个月，症状包括\"迷茫\"和\"困惑\"，最符合pcs。虽然ptsd也可能（因车祸中好友死亡），但ali无ptsd核心症状。不符合重度抑郁、晚发精神分裂症或痴呆的诊断标准。 "}, {"id": "AMC-Q1756", "type": "mcq", "qid": 1756, "title": "赘述（Circumstantiality）— 绕弯但最终回到主题", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["思维形式障碍 — 赘述（Circumstantiality）"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1756-Circumstantiality-Speech.md", "stem": "<p>During taking a history from a patient in a psychiatry ward, you ask him if there is any history of mental illnesses in the family. He answers: 'Good question. Now that you've asked, I must tell you something. Whales are good creatures. We take their oil and use it to light the world. My father hunted whales as did my grandpa. The business runs in the family and of course, we are all sane and sound. Do you think we are crazy?\" Which one of the following is present in this patient's speech?</p>", "options": [{"letter": "A", "text": "Flight of ideas."}, {"letter": "B", "text": "Word salad."}, {"letter": "C", "text": "Circumstantiality."}, {"letter": "D", "text": "Derailment."}, {"letter": "E", "text": "Tangentiality."}], "rationale": "<p>1. 题型识别：诊断 — 思维形式障碍/言语模式识别 2. 分析患者回答：</p>\n<ul>\n<li>起点：\"家族精神病史？\"</li>\n<li>弯路：鲸鱼 → 鲸油 → 父亲打鲸 → 祖父打鲸 → 家族生意</li>\n<li>终点：\"我们都精神正常\" → <strong>回答了问题</strong></li>\n<p>3. 关键特征：<strong>有弯路，但最终到达目的地</strong> = 赘述 4. 对比各选项：</p>\n<li>思维奔逸（A）：言语过多+快速跳跃，有主观思维加速感 → 不匹配</li>\n<li>语词杂拌（B）：词语无意义堆砌 → 不匹配</li>\n<li>赘述（C）：绕弯但回到主题 → <strong>匹配</strong></li>\n<li>脱轨（D）：永不回到起点 → 不匹配</li>\n<li>离题（E）：有连接提示但偏离到不同主题 → 不匹配</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>赘述 vs 离题/脱轨</strong>：三者都偏离主题，但<strong>赘述最终会回来</strong>，离题和脱轨不会</li>\n<li><strong>离题 vs 脱轨</strong>：离题各句间有提示词连接（较温和），脱轨完全没有连接</li>\n</ul>", "summary": "<p><strong>思维形式障碍对比</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>特征</th><th>是否回到主题？</th><th>连接性</th></tr></thead>\n<tbody>\n<tr><td><strong>赘述（Circumstantiality）</strong></td><td>绕弯但最终回到主题</td><td>是</td><td>有，以上句为线索</td></tr>\n<tr><td><strong>离题（Tangentiality）</strong></td><td>有连接提示但走向不同主题</td><td>否</td><td>有提示词连接</td></tr>\n<tr><td><strong>脱轨（Derailment）</strong></td><td>思维松散，各句无连接</td><td>否</td><td>无</td></tr>\n<tr><td><strong>思维奔逸（Flight of ideas）</strong></td><td>言语过多，快速切换话题</td><td>否</td><td>有，但过度</td></tr>\n<tr><td><strong>语词杂拌（Word salad）</strong></td><td>词语无意义堆砌</td><td>—</td><td>乱</td></tr>\n</tbody>\n</table>", "explanation": "<p>患者回答\"家族精神病史\"时以无关话题（鲸鱼）开始，每句以前一句的线索继续，经过多次弯绕后最终回答\"我们都精神正常\"。此模式最符合赘述。脱轨患者永不回到起点。离题是较温和的脱轨，各句间有连接提示但也不回到主题。思维奔逸表现为言语过多且快速切换。语词杂拌是词语无意义堆砌。</p>", "references": "<ul>\n<li>Doctors Lounge - Formal Thought Disorders</li>\n<li>Stat Pearls - Circumstantiality</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "赘述（circumstantiality）— 绕弯但最终回到主题\n思维形式障碍 — 赘述（circumstantiality）\n during taking a history from a patient in a psychiatry ward, you ask him if there is any history of mental illnesses in the family. he answers: 'good question. now that you've asked, i must tell you something. whales are good creatures. we take their oil and use it to light the world. my father hunted whales as did my grandpa. the business runs in the family and of course, we are all sane and sound. do you think we are crazy?\" which one of the following is present in this patient's speech? \n 患者回答\"家族精神病史\"时以无关话题（鲸鱼）开始，每句以前一句的线索继续，经过多次弯绕后最终回答\"我们都精神正常\"。此模式最符合赘述。脱轨患者永不回到起点。离题是较温和的脱轨，各句间有连接提示但也不回到主题。思维奔逸表现为言语过多且快速切换。语词杂拌是词语无意义堆砌。 "}, {"id": "AMC-Q1758", "type": "mcq", "qid": 1758, "title": "青少年精神评估 — 思维松散最有助于诊断早发精神分裂症", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["青少年精神评估 — 思维松散最有助于诊断早发精神分裂症"], "difficulty": 3, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-Q1758-Adolescent-Assessment-Schizophrenia.md", "stem": "<p>Jarred, 15 years old, is brought to you by his concerned parents for assessment. According to them, he recently has significantly declined school performance. He is quite withdrawn and barely leaves his room. He does not engage in social activities and even rarely talks with his parents. Which one of the following, if present in the history of the mental exam, is <strong>most likely to help reach a diagnosis</strong>?</p>", "options": [{"letter": "A", "text": "Sleep issues."}, {"letter": "B", "text": "Anxiety."}, {"letter": "C", "text": "Loosening of association."}, {"letter": "D", "text": "Use of recreational drugs."}, {"letter": "E", "text": "Shyness."}], "rationale": "<p>1. 题型识别：诊断 — 鉴别诊断中最具特异性的线索 2. 临床表现：社交退缩 + 学业下降 → 可能在心境障碍或精神病前驱期之间鉴别 3. <strong>思维松散（loosening of association）</strong>：精神病性障碍（如精神分裂症）的关键症状 4. 其他选项：</p>\n<ul>\n<li>睡眠问题（A）：多种精神疾病均有，非特异性</li>\n<li>焦虑（B）：指向焦虑障碍，与此临床表现不一致</li>\n<li>娱乐性药物使用（D）：可能是精神疾病的行为表现或完全无关，非特异性</li>\n<li>害羞（E）：正常儿童青少年行为，无诊断意义</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>非特异性症状 vs 特异性症状</strong>：睡眠问题、药物使用、害羞在多种情况中都可能出现；思维松散是精神病性障碍的高度特异性症状</li>\n<li><strong>社交退缩 ≠ 一定是抑郁</strong>：也可能是精神分裂症前驱期的阴性症状</li>\n</ul>", "summary": "<p><strong>早发精神分裂症（Early-Onset Schizophrenia）</strong>：</p>\n<ul>\n<li>定义为 <18岁起病</li>\n<li>儿童期起病（<13岁）和早发（<18岁）比成人起病更严重、更致残</li>\n<li><strong>前驱期</strong>：阴性症状和精神病症状（如社交退缩）先于阳性症状出现</li>\n</ul>\n<p><strong>早期征象</strong>：</p>\n<ul>\n<li><strong>思维</strong>：思维和推理问题、奇怪的想法或言语、混淆梦/电视与现实</li>\n<li><strong>行为</strong>：社交退缩、睡眠困难、动力缺乏（学业下降）、不洗澡/穿衣、怪异行为、暴力/激越</li>\n<li><strong>情绪</strong>：易激惹或抑郁情绪、缺乏情感、奇怪的焦虑和恐惧、过度怀疑他人</li>\n</ul>\n<p><strong>DSM-5精神分裂症诊断标准</strong>：需≥2项症状（至少1项为前3项）+ 持续≥6个月： 1. 妄想 2. 幻觉（几乎总是听幻觉） 3. 言语紊乱（如脱轨或不连贯） 4. 严重紊乱或紧张症行为 5. 阴性症状（情感平淡、失语症、意志缺乏）</p>", "explanation": "<p>此案例表现为社交退缩和学业显著下降。这种问题组合可能由心境障碍或早发精神分裂症的前驱期引起。在选项中，思维松散（loosening of association）的存在对精神分裂症具有高度预测性和提示性。睡眠问题、焦虑、药物使用和害羞均不具有诊断特异性。精神分裂症前驱期以阴性症状和精神病表现为特征，先于阳性精神病性症状（幻觉和奇怪妄想）出现。</p>", "references": "<ul>\n<li>Medscape - Schizophrenia</li>\n<li>UpToDate - Schizophrenia in children and adolescents: Epidemiology, pathogenesis, clinical manifestations, course, assessment, and diagnosis</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "青少年精神评估 — 思维松散最有助于诊断早发精神分裂症\n青少年精神评估 — 思维松散最有助于诊断早发精神分裂症\n jarred, 15 years old, is brought to you by his concerned parents for assessment. according to them, he recently has significantly declined school performance. he is quite withdrawn and barely leaves his room. he does not engage in social activities and even rarely talks with his parents. which one of the following, if present in the history of the mental exam, is  most likely to help reach a diagnosis ? \n 此案例表现为社交退缩和学业显著下降。这种问题组合可能由心境障碍或早发精神分裂症的前驱期引起。在选项中，思维松散（loosening of association）的存在对精神分裂症具有高度预测性和提示性。睡眠问题、焦虑、药物使用和害羞均不具有诊断特异性。精神分裂症前驱期以阴性症状和精神病表现为特征，先于阳性精神病性症状（幻觉和奇怪妄想）出现。 "}, {"id": "AMC-QNA-P1550", "type": "mcq", "qid": 0, "title": "身体畸形障碍 — 减少饮酒不是关联特征（否定型）", "department": "Mental Health", "subcategory": "Psychiatry", "rawSubcategory": "Psychiatry", "approach": [], "topic": ["身体畸形障碍 — 不相关的特征（否定型）"], "difficulty": 2, "correctAnswer": "E", "page": 1550, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychiatry/AMC-QNA-P1550-Body-Dysmorphic-Disorder.md", "stem": "<p>Which one of the following is not associated with body dysmorphic disorder?</p>", "options": [{"letter": "A", "text": "Anorexia nervosa."}, {"letter": "B", "text": "Delusional disorders."}, {"letter": "C", "text": "Social phobia."}, {"letter": "D", "text": "Depression."}, {"letter": "E", "text": "Decrease alcohol intake."}], "rationale": "<p>1. BDD 定义：坚信身体某部位异常/缺陷/畸形，对想象的外貌缺陷过度关注 2. 女性多于男性，好发 15-20 岁 3. 关联障碍：神经性厌食（A）、妄想性障碍（B）、社交恐惧（C）、抑郁（D）——<strong>共同点：对身体/形象的过度关注和回避</strong> 4. 减少饮酒（E）不是 BDD 关联特征 5. 锁定答案：E</p>", "traps": "<ul>\n<li><strong>BDD 常共病</strong>：抑郁、社交恐惧、强迫症、厌食——选\"不是\"时要找无共病关联的</li>\n<li><strong>\"减少饮酒\"方向性</strong>：BDD 患者可能酗酒（应对痛苦），而非\"减少饮酒\"</li>\n</ul>", "summary": "<p><strong>BDD 特征</strong>：</p>\n<ul>\n<li>关注想象的缺陷（面部最常）</li>\n<li>频繁照镜、试图隐藏、闭门不出、回避社交</li>\n<li>共病：抑郁、社交恐惧、OCD、厌食、妄想障碍</li>\n<li>女性多于男性，15-20 岁起病</li>\n</ul>", "explanation": "<p>BDD 以对身体外貌的想象缺陷为先占观念，造成显著痛苦或功能损害。与神经性厌食、妄想性障碍、社交恐惧和抑郁相关。<strong>减少饮酒不是 BDD 的关联特征</strong>。</p>", "references": "<ul>\n<li>AMedex Topic: Body Dysmorphic Disorder (page 1550)</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "身体畸形障碍 — 减少饮酒不是关联特征（否定型）\n身体畸形障碍 — 不相关的特征（否定型）\n which one of the following is not associated with body dysmorphic disorder? \n bdd 以对身体外貌的想象缺陷为先占观念，造成显著痛苦或功能损害。与神经性厌食、妄想性障碍、社交恐惧和抑郁相关。 减少饮酒不是 bdd 的关联特征 。 "}, {"id": "AMC-Q0466", "type": "mcq", "qid": 466, "title": "血清素综合征 — MAOI+SSRI联用应立即停用所有血清素能药物", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["血清素综合征 — MAOI+SSRI联用，立即停用所有血清素能药物"], "difficulty": 3, "correctAnswer": "E", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q0466-MAOI-SSRI-Serotonin-Syndrome.md", "stem": "<p>A 65-year-old man, who is on selegiline for treatment of Parkinson disease, recently has been started on sertraline after he was diagnosed with major depression. Today, he is brought to the Emergency Department with abdominal pain, diarrhea, and confusion. Which one of the following would be the <strong>most appropriate next step</strong> in management?</p>", "options": [{"letter": "A", "text": "Reduce sertraline."}, {"letter": "B", "text": "Reduce selegiline."}, {"letter": "C", "text": "Stop sertraline."}, {"letter": "D", "text": "Stop selegiline."}, {"letter": "E", "text": "Stop both sertraline and selegiline."}], "rationale": "<p>1. 题型识别：治疗 — 急症管理 2. 关键线索：司来吉兰（MAOI）+ 舍曲林（SSRI）+ 腹痛、腹泻、意识模糊 3. 识别诊断：<strong>血清素综合征</strong>（SSRI+MAOI联用是最常见原因） 4. 血清素综合征三联征：</p>\n<ul>\n<li><strong>认知</strong>：意识模糊、激越、轻躁狂</li>\n<li><strong>自主神经</strong>：高热、出汗、心动过速、高血压、瞳孔散大</li>\n<li><strong>神经肌肉</strong>：阵挛、反射亢进、肌张力增高、共济失调</li>\n<p>5. 核心管理：<strong>立即停用所有血清素能药物</strong> — 只停一个是不够的 6. 如果需要药物治疗：赛庚啶（cyproheptadine，5-HT2拮抗剂）为中重度一线药物 7. 锁定答案：E</p>\n</ul>", "traps": "<ul>\n<li><strong>\"只停一种\" vs \"全停\"</strong>：血清素综合征需停用<strong>所有</strong>血清素能药物，仅停SSRI或仅停MAOI都是不充分的</li>\n<li><strong>仅减量 vs 停药</strong>：减量（A、B）不够 — 需完全停药</li>\n<li><strong>识别诊断优先</strong>：先识别出这是血清素综合征，而非分别治疗腹痛、腹泻等症状</li>\n</ul>", "summary": "<p><strong>血清素综合征（Serotonin Syndrome）</strong>：</p>\n<ul>\n<li><strong>最常见原因</strong>：SSRI + MAOI联用</li>\n<li><strong>机制</strong>：CNS血清素能活性增高 → 危及生命</li>\n<li><strong>临床特征</strong>：</li>\n<li>认知：意识模糊、激越、轻躁狂、多动、不安</li>\n<li>自主神经：高热、出汗、心动过速、高血压、瞳孔散大、潮红、寒战</li>\n<li>神经肌肉：阵挛（自发性/诱导性/眼阵挛）、反射亢进、肌张力增高、共济失调、震颤</li>\n<li>注意：肌张力增高和阵挛<strong>总是对称</strong>，下肢更显著</li>\n<li><strong>管理</strong>：</li>\n<p>1. 停用所有血清素能药物 2. 细致支持治疗 3. 中重度：赛庚啶（cyproheptadine），5-HT2拮抗剂</p>\n</ul>\n<p><strong>可能引起血清素综合征的药物</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>机制</th></tr></thead>\n<tbody>\n<tr><td>L-色氨酸</td><td>5-HT前体</td></tr>\n<tr><td>SSRIs</td><td>抑制5-HT再摄取</td></tr>\n<tr><td>TCAs</td><td>抑制5-HT再摄取</td></tr>\n<tr><td>MAOIs (A>B)</td><td>抑制5-HT代谢</td></tr>\n<tr><td>哌替啶</td><td>5-HT激动剂</td></tr>\n<tr><td>曲马多</td><td>抑制5-HT再摄取</td></tr>\n<tr><td>LSD</td><td>部分5-HT激动剂</td></tr>\n<tr><td>丁螺环酮</td><td>部分5-HT激动剂</td></tr>\n<tr><td>苯丙胺/食欲抑制剂</td><td>增加5-HT释放+减少再摄取</td></tr>\n</tbody>\n</table>", "explanation": "<p>舍曲林是SSRI，司来吉兰是MAOI-B型。两者联用是血清素综合征最常见的原因。血清素综合征是一种可能危及生命的情况，与CNS血清素能活性增高有关。临床表现包括认知特征（意识模糊）、自主神经特征（高热、出汗）和神经肌肉特征（阵挛、反射亢进）。一旦怀疑血清素综合征，最重要的初始管理是立即停用所有血清素能药物。仅停一种药物不足够。细致支持治疗是治疗的基础，如需要药物治疗，赛庚啶（5-HT2拮抗剂）是中重度血清素综合征的一线药物。</p>", "references": "<ul>\n<li>MJA - Serotonin toxicity: a practical approach to diagnosis and treatment</li>\n<li>Australian Prescriber - Serotonin syndrome</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["abdominal pain", "confusion"], "search": "血清素综合征 — maoi+ssri联用应立即停用所有血清素能药物\n血清素综合征 — maoi+ssri联用，立即停用所有血清素能药物\n a 65-year-old man, who is on selegiline for treatment of parkinson disease, recently has been started on sertraline after he was diagnosed with major depression. today, he is brought to the emergency department with abdominal pain, diarrhea, and confusion. which one of the following would be the  most appropriate next step  in management? \n 舍曲林是ssri，司来吉兰是maoi-b型。两者联用是血清素综合征最常见的原因。血清素综合征是一种可能危及生命的情况，与cns血清素能活性增高有关。临床表现包括认知特征（意识模糊）、自主神经特征（高热、出汗）和神经肌肉特征（阵挛、反射亢进）。一旦怀疑血清素综合征，最重要的初始管理是立即停用所有血清素能药物。仅停一种药物不足够。细致支持治疗是治疗的基础，如需要药物治疗，赛庚啶（5-ht2拮抗剂）是中重度血清素综合征的一线药物。 "}, {"id": "AMC-Q0865", "type": "mcq", "qid": 865, "title": "拉莫三嗪皮疹 — 丙戊酸合用时风险增高", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["拉莫三嗪皮疹 — 与丙戊酸合用时风险增高"], "difficulty": 3, "correctAnswer": "B", "page": 1410, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q0865-Lamotrigine-Rash.md", "stem": "<p>A 16-year-old girl, who is a known case of epilepsy for 5 years, has been started on sodium valproate and lamotrigine 4 weeks ago after her previous medications failed to control her seizures. She also has the history of recurrent urinary tract infections (UTI) with last episode 6 weeks ago for which she received amoxicillin. Today, she has presented with a maculopapular rash and a fever of 38°C. Which one of the following is the most likely cause of her presentation?</p>", "options": [{"letter": "A", "text": "Adverse drug reaction to sodium valproate."}, {"letter": "B", "text": "Adverse drug reaction to lamotrigine."}, {"letter": "C", "text": "Adverse drug reaction to amoxicillin."}, {"letter": "D", "text": "Septicemia."}, {"letter": "E", "text": "Drug interaction between lamotrigine and sodium valproate."}], "rationale": "<p>1. 题型识别：诊断 — 药物不良反应归因 2. 关键线索：拉莫三嗪开始 <strong>4 周前</strong> + 斑丘疹 + 发热 38°C 3. 拉莫三嗪皮疹时间窗：用药后 <strong>5 天至 8 周（2 个月）</strong>，完全吻合 4. 丙戊酸增效：与丙戊酸合用 → 皮疹风险增加（但皮疹本身归因于拉莫三嗪，非\"相互作用\"本身） 5. 排除：</p>\n<ul>\n<li>阿莫西林（C）：<strong>已完成疗程且已停药</strong> → 不是当前皮疹的原因（虽青霉素是最常见过敏药物）</li>\n<li>丙戊酸（A）：皮疹作为其不良反应<strong>非常罕见</strong></li>\n<li>败血症（D）：无感染史线索，且败血症应有更高热</li>\n<li>药物相互作用（E）：皮疹归因于拉莫三嗪，丙戊酸只是<strong>增强</strong>其风险</li>\n<p>6. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>\"相互作用\" vs \"单药反应\"</strong>：E 选项是干扰——丙戊酸提高皮疹风险不是\"相互作用直接导致皮疹\"，皮疹本身是拉莫三嗪的不良反应</li>\n<li><strong>停药时间判断</strong>：已停药的药物通常不解释当前反应（阿莫西林 6 周前已停）</li>\n<li><strong>发热是警示信号</strong>：伴全身症状的皮疹要警惕 SJS/TEN/DRESS 等严重类型</li>\n</ul>", "summary": "<p><strong>拉莫三嗪皮疹</strong>：</p>\n<ul>\n<li>时间窗：用药后 5 天 - 8 周</li>\n<li>典型：斑丘疹，常不融合，压痛不明显但可瘙痒</li>\n<li>无全身症状（发热、不适）的皮疹意义不大；出现时间前后伴随全身症状则需警惕</li>\n<li><strong>严重类型</strong>：麻疹样皮疹迅速进展为弥漫融合、浸润性红斑伴毛囊突出（毛囊隆起）→ 可并发 <strong>SJS、TEN、DRESS</strong></li>\n<li><strong>处理</strong>：一旦发现皮疹<strong>立即停药</strong> + 仔细评估</li>\n<li>与丙戊酸合用时皮疹发生率增高</li>\n</ul>", "explanation": "<p>药物是过敏性不良反应最常见原因。<strong>拉莫三嗪以皮疹为已知不良反应</strong>（发生率 5 天至 8 周内出现），与丙戊酸同时使用时皮疹发生风险更高。本例用药 4 周后出现斑丘疹伴发热，最符合拉莫三嗪不良反应。丙戊酸皮疹极为罕见；阿莫西林已完成疗程停药 6 周，不是当前原因；败血症无证据且应有更高热。皮疹不是拉莫三嗪与丙戊酸的相互作用本身，而是拉莫三嗪不良反应被丙戊酸增强。</p>", "references": "<ul>\n<li>http://www.blackdoginstitute.org.au/docs/Lamotrigi</li>\n<li>https://www.nlm.nih.gov/medlineplus/druginfo/meds/</li>\n</ul>", "related": ["TR-DRESS-Syndrome", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["fever", "rash"], "search": "拉莫三嗪皮疹 — 丙戊酸合用时风险增高\n拉莫三嗪皮疹 — 与丙戊酸合用时风险增高\n a 16-year-old girl, who is a known case of epilepsy for 5 years, has been started on sodium valproate and lamotrigine 4 weeks ago after her previous medications failed to control her seizures. she also has the history of recurrent urinary tract infections (uti) with last episode 6 weeks ago for which she received amoxicillin. today, she has presented with a maculopapular rash and a fever of 38°c. which one of the following is the most likely cause of her presentation? \n 药物是过敏性不良反应最常见原因。 拉莫三嗪以皮疹为已知不良反应 （发生率 5 天至 8 周内出现），与丙戊酸同时使用时皮疹发生风险更高。本例用药 4 周后出现斑丘疹伴发热，最符合拉莫三嗪不良反应。丙戊酸皮疹极为罕见；阿莫西林已完成疗程停药 6 周，不是当前原因；败血症无证据且应有更高热。皮疹不是拉莫三嗪与丙戊酸的相互作用本身，而是拉莫三嗪不良反应被丙戊酸增强。 "}, {"id": "AMC-Q0965", "type": "mcq", "qid": 965, "title": "氯氮平 — 心动过速是常见不良反应", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["氯氮平 — 心动过速与心脏不良反应"], "difficulty": 2, "correctAnswer": "A", "page": 1414, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q0965-Clozapine-Tachycardia.md", "stem": "<p>A 24-year-old woman has been started on an antipsychotic drug due to poorly-controlled schizophrenia 3 weeks ago. She has now presented with complaint of palpitations. Which one of the following drug is more likely to have been prescribed for her?</p>", "options": [{"letter": "A", "text": "Clozapine."}, {"letter": "B", "text": "Mirtazapine."}, {"letter": "C", "text": "Olanzapine."}, {"letter": "D", "text": "Quetiapine."}, {"letter": "E", "text": "Venlafaxine."}], "rationale": "<p>1. 题型识别：诊断 — 药物不良反应归因 2. 关键线索：难治性精神分裂症 + 用药 3 周 + 心悸 3. 氯氮平不良反应特点：</p>\n<ul>\n<li><strong>心动过速：约 25% 患者</strong>，心律失常也可发生</li>\n<li>其他：镇静、体位性低血压、流涎、严重便秘、血脂异常、肌阵挛、癫痫</li>\n<li>严重：中性粒细胞减少（2-3%）、粒细胞缺乏（1%）、<strong>心肌炎</strong></li>\n<p>4. 排除：米氮平（B）、奥氮平（C）、喹硫平（D）为其他抗精神病药/抗抑郁药（米氮平、文拉法辛是抗抑郁药），无此突出的心动过速关联 5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>选项里的\"非抗精神病药\"</strong>：米氮平（B）和文拉法辛（E）是<strong>抗抑郁药</strong>——题干明确说抗精神病药，排除</li>\n<li><strong>氯氮平 vs 其他非典型</strong>：虽然喹硫平、奥氮平也有代谢不良反应，但<strong>心动过速 25%</strong> 是氯氮平的标志</li>\n<li><strong>心肌炎</strong>：氯氮平需密切监测——见关联笔记 Q966</li>\n</ul>", "summary": "<p><strong>氯氮平不良反应</strong>：</p>\n<ul>\n<li>常见：镇静、体位性低血压、流涎、严重便秘、血脂异常、肌阵挛、癫痫发作、体重增加、糖耐量异常（诱发 2 型糖尿病）</li>\n<li><strong>心动过速：25%</strong>；心律失常也可发生</li>\n<li><strong>严重</strong>：中性粒细胞减少（2-3%）、<strong>粒细胞缺乏（1%）</strong>、<strong>心肌炎</strong></li>\n<li>心电图改变：ST 段压低、T 波低平/倒置（停药后恢复）</li>\n</ul>", "explanation": "<p>氯氮平对难治性精神分裂症有效，但伴随严重不良反应：镇静、体位性低血压、流涎、严重便秘、血脂异常、肌阵挛和癫痫发作。体重过度增加和糖耐量异常可发生，诱发 2 型糖尿病。中性粒细胞减少（2-3%）和粒细胞缺乏（1%）是重大关切。<strong>心动过速是氯氮平常见不良反应（约 25%）</strong>，心律失常也可发生。选项中氯氮平与心动过速/心悸最相关。</p>", "references": "<ul>\n<li>https://www.mja.com.au/journal/2009/190/4/clozapin</li>\n<li>http://www.medsafe.govt.nz/profs/PUarticles/clozca</li>\n<li>Therapeutic Guidelines – Psychotropic; available from http://tg.org.au</li>\n</ul>", "related": ["AMC-Q0966-Clozapine-Myocarditis-Troponin", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["palpitations"], "search": "氯氮平 — 心动过速是常见不良反应\n氯氮平 — 心动过速与心脏不良反应\n a 24-year-old woman has been started on an antipsychotic drug due to poorly-controlled schizophrenia 3 weeks ago. she has now presented with complaint of palpitations. which one of the following drug is more likely to have been prescribed for her? \n 氯氮平对难治性精神分裂症有效，但伴随严重不良反应：镇静、体位性低血压、流涎、严重便秘、血脂异常、肌阵挛和癫痫发作。体重过度增加和糖耐量异常可发生，诱发 2 型糖尿病。中性粒细胞减少（2-3%）和粒细胞缺乏（1%）是重大关切。 心动过速是氯氮平常见不良反应（约 25%） ，心律失常也可发生。选项中氯氮平与心动过速/心悸最相关。 "}, {"id": "AMC-Q0966", "type": "mcq", "qid": 966, "title": "氯氮平心悸 — 肌钙蛋白是最重要检查", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["氯氮平心肌炎监测 — 肌钙蛋白最重要"], "difficulty": 3, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q0966-Clozapine-Myocarditis-Troponin.md", "stem": "<p>Which one of the following is the most important diagnostic test to consider for a patient on clozapine who has developed palpitation?</p>", "options": [{"letter": "A", "text": "Troponin."}, {"letter": "B", "text": "Echocardiography."}, {"letter": "C", "text": "Holter monitoring."}, {"letter": "D", "text": "Full blood count."}, {"letter": "E", "text": "Clozapine level."}], "rationale": "<p>1. 题型识别：检查 — 氯氮平心脏不良反应的监测 2. 核心：氯氮平最严重心脏并发症 = <strong>心肌炎</strong>（治疗早期最常见），可致命 3. 监测方案：</p>\n<ul>\n<li>基线：肌钙蛋白 I/T、CRP、ECG、超声心动图</li>\n<li>前 4 周：<strong>每周监测 CRP 和肌钙蛋白</strong></li>\n<li>有症状/心率异常增快/CRP >50 mg/L → <strong>每日测肌钙蛋白和 CRP</strong></li>\n<p>4. 逐项排除：</p>\n<li>超声心动（B）：用于基线和心衰症状时，非首选</li>\n<li>Holter（C）：不常规用于氯氮平相关心动过速评估</li>\n<li>血常规（D）：监测中性粒细胞减少/粒细胞缺乏，与本问题（心悸）无关</li>\n<li>氯氮平浓度（E）：不良反应管理无可靠 cutoff 值</li>\n<p>5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>粒细胞监测 ≠ 心肌炎监测</strong>：血常规用于粒细胞缺乏，心悸要查肌钙蛋白——别混淆两个监测方案</li>\n<li><strong>心肌炎时间窗</strong>：大部分心肌炎发生在<strong>第 3 周</strong>，故监测延长至第 28 天</li>\n<li><strong>阈值决策</strong>：肌钙蛋白 >2× 正常上限 或 CRP >100 mg/L → 停药 + 超声心动图；轻度升高可继续用药</li>\n</ul>", "summary": "<p><strong>氯氮平心肌炎监测方案</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>时间</th><th>措施</th></tr></thead>\n<tbody>\n<tr><td>基线</td><td>肌钙蛋白 I/T、CRP、ECG、超声心动图</td></tr>\n<tr><td>前 4 周</td><td>每周测 CRP + 肌钙蛋白</td></tr>\n<tr><td>前 4 周（住院）</td><td>生命体征 + 症状询问至少隔日一次；门诊每周</td></tr>\n<tr><td>有症状/心率增快/CRP>50</td><td>每日测肌钙蛋白 + CRP</td></tr>\n<tr><td>肌钙蛋白 <2×ULN 且 CRP<100</td><td>可继续氯氮平</td></tr>\n<tr><td>肌钙蛋白 >2×ULN 或 CRP>100</td><td><strong>停氯氮平 + 超声心动图</strong></td></tr>\n</tbody>\n</table>\n<p><strong>关键数字</strong>：</p>\n<ul>\n<li>心肌炎监测至第 <strong>28 天</strong>（旧指南至 14 天）</li>\n<li>大部分心肌炎发生在<strong>第 3 周</strong></li>\n<li>中性粒细胞减少 2-3%、粒细胞缺乏 1%</li>\n</ul>", "explanation": "<p>氯氮平可致心肌炎、心肌病甚至死亡，心肌炎最常见于治疗早期。心悸患者最合适的下一步是<strong>每日监测肌钙蛋白和 CRP</strong>。超声心动图用于基线评估或心衰症状出现时；Holter 不常规使用；血常规监测粒细胞减少/缺乏；氯氮平水平对不良反应管理无可靠 cutoff 值。</p>", "references": "<ul>\n<li>https://www.mja.com.au/journal/2009/190/4/clozapin</li>\n<li>http://www0.health.nsw.gov.au/policies/pd/2012/pdf</li>\n</ul>", "related": ["AMC-Q0965-Clozapine-Tachycardia", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": ["palpitations"], "search": "氯氮平心悸 — 肌钙蛋白是最重要检查\n氯氮平心肌炎监测 — 肌钙蛋白最重要\n which one of the following is the most important diagnostic test to consider for a patient on clozapine who has developed palpitation? \n 氯氮平可致心肌炎、心肌病甚至死亡，心肌炎最常见于治疗早期。心悸患者最合适的下一步是 每日监测肌钙蛋白和 crp 。超声心动图用于基线评估或心衰症状出现时；holter 不常规使用；血常规监测粒细胞减少/缺乏；氯氮平水平对不良反应管理无可靠 cutoff 值。 "}, {"id": "AMC-Q1007", "type": "mcq", "qid": 1007, "title": "锂盐不良反应 — 致畸性最少见（否定型）", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["锂盐不良反应 — 致畸性最少见"], "difficulty": 2, "correctAnswer": "E", "page": 1422, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q1007-Lithium-Side-Effects.md", "stem": "<p>Lithium is commonly used in treatment of bipolar disorder. Which one of the following is the least common side effect of lithium?</p>", "options": [{"letter": "A", "text": "Renal impairment."}, {"letter": "B", "text": "Hypothyroidism."}, {"letter": "C", "text": "Hyperparathyroidism."}, {"letter": "D", "text": "Weight gain."}, {"letter": "E", "text": "Teratogenicity."}], "rationale": "<p>1. 题型识别：否定型药理题 — 找<strong>最少见</strong>的不良反应 2. 锂盐常见不良反应分层：</p>\n<ul>\n<li>急性常见：恶心、震颤、多尿（肾源性尿崩症）、口渴、体重增加、稀便、认知损害</li>\n<li>慢性：<strong>肾</strong>（肾源性尿崩症→间质性肾炎/纤维化）、<strong>甲状腺</strong>（甲减最常见）、甲状旁腺（高钙）、心脏（罕见心律失常）</li>\n<p>3. 致畸性：虽然一般认为是致畸药物（胎儿心脏畸形风险 1:1000-2000 vs 普通人群 1:20000），但<strong>绝对风险低（0.05%）</strong> 4. 对比选项频率：肾损害、甲减、高钙、体重增加都比致畸常见 5. 锁定答案：E</p>\n</ul>", "traps": "<ul>\n<li><strong>\"致畸药物\"≠\"常见不良反应\"</strong>：锂盐虽被标记为致畸，但绝对风险仅 0.05%——题目问\"最少见\"，不是\"有没有\"</li>\n<li><strong>肾和甲状腺</strong>：是锂盐<strong>最常见的长期</strong>不良反应——记忆锚点</li>\n<li><strong>治疗窗内也可出现不良反应</strong>：即使血药浓度在治疗范围内，急慢性不良反应仍可发生</li>\n</ul>", "summary": "<p><strong>锂盐不良反应</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>表现</th></tr></thead>\n<tbody>\n<tr><td>急性常见</td><td>恶心、震颤、多尿（肾源性尿崩症）、口渴、体重增加、稀便、认知损害</td></tr>\n<tr><td>慢性-肾</td><td>肾源性尿崩症 → 间质性肾炎/纤维化 → 肌酐升高，罕见进行性肾衰</td></tr>\n<tr><td>慢性-甲状腺</td><td><strong>甲减最常见</strong>（也有甲状腺肿、慢性自身免疫性甲状腺炎）；TSH 定期监测，升高则补 T4 同时继续锂</td></tr>\n<tr><td>慢性-甲状旁腺</td><td>高甲状旁腺血症 + 高钙血症；血钙升高需测 PTH</td></tr>\n<tr><td>慢性-心脏</td><td>罕见心律失常；ECG 异常（T/ST 改变、病窦、Brugada 型）</td></tr>\n<tr><td>致畸性</td><td>胎儿心脏畸形风险 1:1000-2000（普通人群 1:20000），<strong>绝对风险 0.05%</strong></td></tr>\n</tbody>\n</table>\n<p><strong>关键</strong>：肾和甲状腺问题 = 最常见的长期不良反应</p>", "explanation": "<p>锂盐即使在治疗浓度范围内也可能引起多种急慢性不良反应。最常见急性反应包括恶心、震颤、多尿、口渴、体重增加、稀便和认知损害。慢性不良反应包括肾（肾源性尿崩症→间质性肾炎）、甲状腺（甲减最常见）、甲状旁腺（高钙）和心脏问题。虽然锂盐一般被视为致畸药物（胎儿心脏畸形风险增加），但绝对风险仅 0.05%——选项中<strong>致畸性是最少见的不良反应</strong>。</p>", "references": "<ul>\n<li>http://www.uptodate.com/contents/bipolar-disorder-</li>\n<li>https://www.drugs.com/sfx/lithium-side-effects.htm</li>\n<li>Therapeutic Guidelines – Psychotropics; available from http://tg.org.au</li>\n</ul>", "related": ["AMC-Q1676-Lithium-Hair-Loss", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "锂盐不良反应 — 致畸性最少见（否定型）\n锂盐不良反应 — 致畸性最少见\n lithium is commonly used in treatment of bipolar disorder. which one of the following is the least common side effect of lithium? \n 锂盐即使在治疗浓度范围内也可能引起多种急慢性不良反应。最常见急性反应包括恶心、震颤、多尿、口渴、体重增加、稀便和认知损害。慢性不良反应包括肾（肾源性尿崩症→间质性肾炎）、甲状腺（甲减最常见）、甲状旁腺（高钙）和心脏问题。虽然锂盐一般被视为致畸药物（胎儿心脏畸形风险增加），但绝对风险仅 0.05%——选项中 致畸性是最少见的不良反应 。 "}, {"id": "AMC-Q1119", "type": "mcq", "qid": 1119, "title": "摇头丸与 SSRI — 血清素协同作用", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["摇头丸与 SSRI — 血清素协同作用"], "difficulty": 2, "correctAnswer": "A", "page": 1424, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q1119-Ecstasy-Sertraline-Synergy.md", "stem": "<p>Janet, 32 years old, has been prescribed sertraline for treatment of her major depression. She comes to you for follow-up, and admits to taking ecstasy at occasions. She says that she take the pill because she wants to enjoy more from time to time. Which one of the following is a correct advice to give her in this regard?</p>", "options": [{"letter": "A", "text": "Sertraline and ecstasy are synergistic."}, {"letter": "B", "text": "Ecstasy is contraindicated in patients on sertraline."}, {"letter": "C", "text": "The combination can lead to irreversible psychosis."}, {"letter": "D", "text": "Ecstasy decreases the therapeutic effect of sertraline."}, {"letter": "E", "text": "Ecstasy and sertraline have no interactions."}], "rationale": "<p>1. 题型识别：治疗 — 药物相互作用咨询 2. 机制：MDMA（摇头丸）是独特的精神活性安非他命，通过<strong>增加血清素释放</strong>产生效应（比安非他命/甲基苯丙胺强） 3. SSRI 抑制 5-HT 再摄取 + MDMA 增加 5-HT 释放 → <strong>协同作用</strong> → 血清素毒性风险增加 4. 关键判断：</p>\n<ul>\n<li><strong>不是禁忌</strong>（B 错）：只有 MAOI 才是摇头丸禁忌；应建议避免合用而非绝对禁止</li>\n<li><strong>不可逆精神病</strong>（C 错）：无依据</li>\n<li><strong>降低疗效</strong>（D 错）：研究显示合用可能降低两者效应，但核心风险是血清素毒性——A 才是\"正确的建议\"</li>\n<li>无相互作用（E 错）：明显有相互作用</li>\n<p>5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"协同\" vs \"禁忌\"</strong>：协同（增加血清素毒性风险）≠ 绝对禁忌——只有 MAOI 才是摇头丸禁忌</li>\n<li><strong>CYP2D6 代谢</strong>：与经 CYP2D6 代谢的药物（利托那韦、可待因、右美沙芬）合用时风险增加</li>\n<li><strong>矛盾效应</strong>：虽有协同增加毒性风险，但同时使用反而可能<strong>降低</strong>摇头丸和 SSRI 两者的效果——但这不是给患者的正确建议核心</li>\n</ul>", "summary": "<p><strong>MDMA（摇头丸）</strong>：</p>\n<ul>\n<li>独特的致幻性安非他命，兼具兴奋、欣快和共情作用</li>\n<li>增加血清素释放（强于安非他命/甲基苯丙胺）</li>\n<li>与 SSRI 协同 → 血清素毒性风险增加</li>\n</ul>\n<p><strong>摇头丸禁忌</strong>：</p>\n<ul>\n<li><strong>MAOI</strong>（唯一抗抑郁药禁忌）</li>\n<li>经 CYP2D6 代谢的药物：利托那韦（蛋白酶抑制剂）、可待因及其他阿片类、右美沙芬（OTC 止咳药）</li>\n</ul>\n<p><strong>血清素毒性诱因</strong>：SSRI + 摇头丸/安非他命/甲基苯丙胺</p>", "explanation": "<p>SSRI 是抑郁症一线药物。血清素毒性发生于血清素超出治疗范围时，某些药物合用会增加其风险——摇头丸、安非他命、甲基苯丙胺等非法药物可增加体内血清素浓度。MDMA 对血清素的作用强于安非他命，与 SSRI 存在<strong>协同作用</strong>。虽然合用增加血清素毒性风险，但摇头丸对 SSRI 使用者<strong>并非禁忌</strong>（唯一禁忌是 MAOI）。应建议避免合用。</p>", "references": "<ul>\n<li>https://www.mja.com.au/journal/2007/187/6/serotoni</li>\n<li>https://dancesafe.org/drug-information/mdma-contra</li>\n</ul>", "related": ["AMC-QNA-P1402-Serotonin-Syndrome-SSRIs", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "摇头丸与 ssri — 血清素协同作用\n摇头丸与 ssri — 血清素协同作用\n janet, 32 years old, has been prescribed sertraline for treatment of her major depression. she comes to you for follow-up, and admits to taking ecstasy at occasions. she says that she take the pill because she wants to enjoy more from time to time. which one of the following is a correct advice to give her in this regard? \n ssri 是抑郁症一线药物。血清素毒性发生于血清素超出治疗范围时，某些药物合用会增加其风险——摇头丸、安非他命、甲基苯丙胺等非法药物可增加体内血清素浓度。mdma 对血清素的作用强于安非他命，与 ssri 存在 协同作用 。虽然合用增加血清素毒性风险，但摇头丸对 ssri 使用者 并非禁忌 （唯一禁忌是 maoi）。应建议避免合用。 "}, {"id": "AMC-Q1652", "type": "mcq", "qid": 1652, "title": "阿立哌唑不良反应 — 头晕目眩最常见", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["阿立哌唑不良反应 — 头晕目眩最常见"], "difficulty": 2, "correctAnswer": "A", "page": 0, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q1652-Aripiprazole-Side-Effects.md", "stem": "<p>Which one of the following is the most common adverse effect of aripiprazole?</p>", "options": [{"letter": "A", "text": "Light-headedness."}, {"letter": "B", "text": "Dizziness."}, {"letter": "C", "text": "Bloating."}, {"letter": "D", "text": "Sleepiness."}, {"letter": "E", "text": "Tiredness."}], "rationale": "<p>1. 题型识别：药理 — 药物不良反应患病率 2. 阿立哌唑不良反应排序（>10%）：体重增加（8-30%）、头痛（27%）、激越（19%）、<strong>失眠（18%）</strong>、焦虑（17%）、恶心呕吐（11-15%）、静坐不能（10-13%）、<strong>头晕目眩（11%）</strong>、便秘（10-11%） 3. 选项中比较：</p>\n<ul>\n<li><strong>头晕目眩（A）：11%</strong> → 最常用（选项中最常见）</li>\n<li>头晕（B）：10%</li>\n<li>嗜睡（D）：5-8%</li>\n<li>疲劳（E）：6%</li>\n<li>腹胀（C）：未列入常见反应</li>\n<p>4. 区分定义：头晕目眩 = 晕厥前状态；头晕 = 运动感/眩晕感 5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"非镇静\"抗精神病药</strong>：阿立哌唑不镇静——<strong>失眠（18%）</strong>是常见不良反应，嗜睡只 5-8%——别选\"嗜睡\"（D）</li>\n<li><strong>头晕目眩 vs 头晕</strong>：两个选项相似但患病率不同（11% vs 10%）——需精确记忆排序</li>\n<li><strong>常见 vs 严重</strong>：NMS、迟发性运动障碍、癫痫等是 <1% 严重反应，不是\"最常见\"</li>\n</ul>", "summary": "<p><strong>阿立哌唑不良反应（按患病率）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>患病率</th><th>不良反应</th></tr></thead>\n<tbody>\n<tr><td>>10%</td><td>体重增加（8-30%）、头痛（27%）、激越（19%）、失眠（18%）、焦虑（17%）、恶心呕吐（11-15%）、静坐不能（10-13%）、<strong>头晕目眩（11%）</strong>、便秘（10-11%）</td></tr>\n<tr><td>1-10%</td><td>头晕（10%）、消化不良、嗜睡（5-8%）、疲劳（6%）、坐立不安、震颤、口干、锥体外系障碍（5%）、体位性低血压（1-5%）等</td></tr>\n<tr><td><1%</td><td>NMS、癫痫、迟发性运动障碍等</td></tr>\n</tbody>\n</table>\n<p><strong>定义</strong>：头晕目眩（light-headedness）= 晕厥前状态；头晕（dizziness）= 运动/眩晕感</p>", "explanation": "<p>阿立哌唑是非典型抗精神病药，用于精神分裂症、双相障碍和伴精神病性症状的抑郁。选项中<strong>头晕目眩是最常见的（11%）</strong>，其次为头晕（10%）。头晕目眩定义为晕厥前状态，而头晕用于描述运动感甚至眩晕。阿立哌唑是非镇静性抗精神病药——失眠是常见不良反应（18%），嗜睡仅 5-8%。</p>", "references": "<ul>\n<li>Medscape – Drugs Reference – Aripiprazole</li>\n</ul>", "related": ["_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "阿立哌唑不良反应 — 头晕目眩最常见\n阿立哌唑不良反应 — 头晕目眩最常见\n which one of the following is the most common adverse effect of aripiprazole? \n 阿立哌唑是非典型抗精神病药，用于精神分裂症、双相障碍和伴精神病性症状的抑郁。选项中 头晕目眩是最常见的（11%） ，其次为头晕（10%）。头晕目眩定义为晕厥前状态，而头晕用于描述运动感甚至眩晕。阿立哌唑是非镇静性抗精神病药——失眠是常见不良反应（18%），嗜睡仅 5-8%。 "}, {"id": "AMC-Q1676", "type": "mcq", "qid": 1676, "title": "锂盐脱发 — 药物性休止期脱发", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["锂盐脱发 — 药物性休止期脱发"], "difficulty": 2, "correctAnswer": "B", "page": 1443, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "file": "04-Mental-Health/Psychopharmacology/AMC-Q1676-Lithium-Hair-Loss.md", "stem": "<p>Janet, 55 years of age, has presented to your GP clinic with complaint of recent-onset hair loss for the past few weeks. The hair loss is generalized and not local to a specific area. She has bipolar disorder and had been on lithium for a long time until recently when her psychiatrist increased the dose and added carbamazepine because she had an acute manic attack despite being on lithium. She also has migraine for which she takes sumatriptan. Her other medications are aspirin for coronary artery disease and prophylactic dose of enoxaparin after she had a deep vein thrombosis of her left lower leg. Which one of the following medications is more likely to have caused the hair loss?</p>", "options": [{"letter": "A", "text": "Aspirin."}, {"letter": "B", "text": "Lithium."}, {"letter": "C", "text": "Carbamazepine."}, {"letter": "D", "text": "Enoxaparin."}, {"letter": "E", "text": "Sumatriptan."}], "rationale": "<p>1. 题型识别：诊断 — 药物性脱发归因 2. 药物性脱发特点：弥漫性非瘢痕性脱发，开始新药或<strong>改变剂量后数天至数周</strong>出现 3. 时间线：<strong>锂盐最近加量</strong> + 新增卡马西平 → 脱发几周内出现 4. 各药关联度：</p>\n<ul>\n<li><strong>锂盐（B）：12-19%</strong> → 最高</li>\n<li>卡马西平（C）：最多 6%（1.6-6%）→ 次之</li>\n<li>依诺肝素（D）：罕见</li>\n<li>阿司匹林（A）/舒马曲坦（E）：无临床意义关联</li>\n<p>5. 虽然锂盐已用很久，但<strong>加量</strong>后更可能诱发脱发（比卡马西平更可能） 6. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>\"长期用锂盐 ≠ 不可能\"</strong>：药物性脱发可发生于剂量改变后——<strong>加量</strong>是关键时间线索</li>\n<li><strong>卡马西平是次选干扰</strong>：虽新增且可致脱发（6%），但锂盐关联度更高（12-19%）</li>\n<li><strong>两种脱发类型</strong>：生长期脱发（anagen effluvium，化疗药）vs <strong>休止期脱发</strong>（telogen effluvium，几乎所有其他药物）——锂盐属后者</li>\n</ul>", "summary": "<p><strong>药物性脱发</strong>：</p>\n<ul>\n<li>弥漫性非瘢痕性，新药/改变剂量后数天至数周出现</li>\n<li>类型：生长期脱发（化疗药、金、秋水仙碱、砷铋铊硼酸中毒）vs <strong>休止期脱发</strong>（几乎所有其他药物）</li>\n</ul>\n<p><strong>常见致脱发药物</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>关联度</th></tr></thead>\n<tbody>\n<tr><td><strong>锂盐</strong></td><td><strong>12-19%</strong></td></tr>\n<tr><td>丙戊酸</td><td>12-28%（剂量依赖）</td></tr>\n<tr><td>卡马西平</td><td>最多 6%</td></tr>\n<tr><td>苯妥英</td><td>—</td></tr>\n<tr><td>肝素/华法林</td><td>肝素、华法林</td></tr>\n<tr><td>β 阻滞剂、ACEI</td><td>—</td></tr>\n<tr><td>口服避孕药/HRT/雄激素</td><td>—</td></tr>\n<tr><td>维 A 酸类（阿维A > 异维A酸）</td><td>—</td></tr>\n<tr><td>抗甲状腺药、降脂药、干扰素</td><td>—</td></tr>\n<tr><td>NSAIDs、溴隐亭、左旋多巴</td><td>—</td></tr>\n<tr><td>部分抗精神病药/抗焦虑药；罕见 TCA（阿米替林）</td><td>—</td></tr>\n</tbody>\n</table>", "explanation": "<p>药物性脱发是弥漫性非瘢痕性脱发，在新药或改变剂量后数天至数周出现。该患者<strong>锂盐近期加量</strong>并新增卡马西平。选项中<strong>锂盐关联度最高（12-19%）</strong>，其次卡马西平（1.6-6%）。虽长期用锂盐，但加量后更可能诱发脱发。依诺肝素罕见，阿司匹林和舒马曲坦无临床意义关联。</p>", "references": "<ul>\n<li>DermNet NZ – Alopecia from drugs</li>\n</ul>", "related": ["AMC-Q1007-Lithium-Side-Effects", "_MOC-Mental-Health"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "锂盐脱发 — 药物性休止期脱发\n锂盐脱发 — 药物性休止期脱发\n janet, 55 years of age, has presented to your gp clinic with complaint of recent-onset hair loss for the past few weeks. the hair loss is generalized and not local to a specific area. she has bipolar disorder and had been on lithium for a long time until recently when her psychiatrist increased the dose and added carbamazepine because she had an acute manic attack despite being on lithium. she also has migraine for which she takes sumatriptan. her other medications are aspirin for coronary artery disease and prophylactic dose of enoxaparin after she had a deep vein thrombosis of her left lower leg. which one of the following medications is more likely to have caused the hair loss? \n 药物性脱发是弥漫性非瘢痕性脱发，在新药或改变剂量后数天至数周出现。该患者 锂盐近期加量 并新增卡马西平。选项中 锂盐关联度最高（12-19%） ，其次卡马西平（1.6-6%）。虽长期用锂盐，但加量后更可能诱发脱发。依诺肝素罕见，阿司匹林和舒马曲坦无临床意义关联。 "}, {"id": "AMC-QNA-P1402", "type": "mcq", "qid": 0, "title": "血清素综合征 — SSRI 合用的诱发药物（否定型）", "department": "Mental Health", "subcategory": "Psychopharmacology", "rawSubcategory": "Psychopharmacology", "approach": [], "topic": ["血清素综合征 — 哪些药物与 SSRI 合用不诱发"], "difficulty": 3, "correctAnswer": "D", "page": 1402, "tags": [], "cssclass": "mcq-mental-health", "color": "#bc8c2e", "fil   <script>
  // Global fallback for slash toggle — works even if IIFE crashes

  };
  (function () {
    "use strict";

    // ----- Load embedded data -----

    var DATA = JSON.parse(raw);
    var items = DATA.items;

    // ----- State -----
    var state = {

      approach: new Set(),
      difficulty: new Set(),
      favorite: new Set(),  // contains "on" when filter is active
      q: "",
      sort: "qid"
    };

    // ----- Favorites (persisted in localStorage) -----
    // We persist just the set of favorited item IDs, not the filter
    // state. The filter chip's "on/off" state is per-session so a fresh
    // open shows everything by default.
    var FAV_STORAGE_KEY = "amc-mcq-favs-v1";
    function loadFavs() {
      try {
        var raw = localStorage.getItem(FAV_STORAGE_KEY);
        if (!raw) return new Set();
        var arr = JSON.parse(raw);
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (e) { return new Set(); }
    }
    function saveFavs(set) {
      try { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(Array.from(set))); }
      catch (e) { /* quota or private mode — silently degrade */ }
    }
    var favIds = loadFavs();
    function isFav(id) { return favIds.has(id); }
    function toggleFav(id) {
      if (favIds.has(id)) favIds.delete(id); else favIds.add(id);
      saveFavs(favIds);
      // Re-render only the bits that depend on fav state — the star

      syncStarButtons();
      refreshChipCounts();
      // The grid itself only changes if the favorite filter is active.
      if (state.favorite.size > 0) render();
    }
    function syncStarButtons() {
      document.querySelectorAll(".card .star").forEach(function (el) {
        var id = el.dataset.id;
        if (favIds.has(id)) el.classList.add("on");

        el.title = favIds.has(id) ? "取消收藏" : "收藏";
      });

    // ----- Render sidebar -----
    // Chips are created ONCE on init. After that, ``refreshChipCounts``
    // updates each chip's count + visibility in place based on the
    // current filter state, so the sidebar shows the count of items
    // that match every other active filter (faceted drill-down).
    function makeChip(field, value) {
      var c = document.createElement("span");
      c.className = "chip";
      c.dataset.field = field;
      c.dataset.value = String(value);
      c.innerHTML = '<span class="label"></span><span class="count"></span>';
      c.querySelector(".label").textContent = value;
      c.addEventListener("click", function () { toggleFilter(field, value); });
      return c;
    }

    function renderFilterGroup(field, values) {
      var host = document.getElementById("f-" + field);
      if (!host) return;  // group was removed (e.g. difficulty)
      host.innerHTML = "";
      values.forEach(function (v) { host.appendChild(makeChip(field, v)); });
    }

    // Return the list of values that ``it`` contributes to ``field``.
    function getFieldValues(it, field) {
      if (field === "difficulty") {
        return it.difficulty > 0 ? [it.difficulty] : [];
      }
      if (field === "type") {
        return [it.type === "mcq" ? "MCQ" : "Topic Review"];
      }
      if (field === "subcategory") return [it.subcategory];
      if (field === "approach")    return it.approach || [];
      if (field === "disease")     return it.diseases || [];
      if (field === "complaint")   return it.complaints || [];
      return [];
    }

    // Recompute every chip's count + visibility based on current state.
    // The count for a chip answers: "if I added this chip to my selection,
    // how many items would I see?" — i.e. the count of items that match
    // all OTHER active filters AND (have this chip's value OR already

    //

    function chipMatches(it, field, value) {

      if (field !== "subcategory" && state.subcategory.size > 0 && !state.subcategory.has(it.subcategory)) return false;
      if (field !== "disease") {
        if (state.disease.size > 0) {
          var hasDz = (it.diseases || []).some(function (d) { return state.disease.has(d); });
          if (!hasDz) return false;
        }
      }
      if (field !== "complaint") {
        if (state.complaint.size > 0) {
          var hasCc = (it.complaints || []).some(function (c) { return state.complaint.has(c); });
          if (!hasCc) return false;

      }
      if (field !== "approach") {
        if (state.approach.size > 0) {
          var hasAp = (it.approach || []).some(function (a) { return state.approach.has(a); });
          if (!hasAp) return false;
        }
      }
      if (field !== "difficulty" && state.difficulty.size > 0 && !state.difficulty.has(it.difficulty)) return false;
      if (field !== "favorite" && state.favorite.size > 0 && !isFav(it.id)) return false;
      var q = state.q.trim().toLowerCase();
      if (q && it.search.indexOf(q) === -1) return false;

      // Within the same field, OR with the current selection (additive).
      // For "favorite" the field has a single value ("on") and the item

      if (field === "favorite") return isFav(it.id);
      var itemValues = getFieldValues(it, field);
      if (itemValues.indexOf(value) >= 0) return true;
      if (state[field].size > 0) {
        for (var i = 0; i < itemValues.length; i++) {
          if (state[field].has(itemValues[i])) return true;
        }
      }
      return false;
    }

    function refreshChipCounts() {
      var fields = ["favorite", "type", "subcategory", "disease", "complaint", "approach", "difficulty"];
      fields.forEach(function (field) {
        // For each chip value in this field, count items that would

        var host = document.getElementById("f-" + field);
        if (!host) return;
        var chips = host.querySelectorAll(".chip");
        chips.forEach(function (chip) {
          var v = chip.dataset.value;
          var n = 0;
          for (var i = 0; i < items.length; i++) {
            if (chipMatches(items[i], field, v)) n++;

          var key = (field === "type")
            ? normalizeTypeValue(v)
            : (field === "difficulty" ? parseInt(v, 10) : v);
          var isActive = state[field].has(key);
          chip.querySelector(".count").textContent = "(" + n + ")";
          // Hide if zero matches AND not currently selected (so the user

          chip.style.display = (n === 0 && !isActive) ? "none" : "";
          if (n === 0 && !isActive) chip.classList.add("empty");
          else chip.classList.remove("empty");
        });
      });

      // Auto-expand groups that have active filters, show indicator dots

        } else {
          g.classList.remove("has-active");

      });
    }

    function countField(field) {

        });

      return out;
    }

    var approachValues = Object.keys(stats.byApproach);

    var subcategoryValues = Object.keys(stats.bySubcategory);
    var typeValues = ["MCQ", "Topic Review"];
    var diseaseValues = Object.keys(stats.byDisease || {});
