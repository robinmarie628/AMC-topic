t": "Reassure and discharge him home"}, {"letter": "B", "text": "Book for an outpatient echocardiography"}, {"letter": "C", "text": "Admit him to coronary care unit (CCU), measure cardiac enzymes and repeat the ECG"}, {"letter": "D", "text": "Refer him for a stress ECG and echocardiography"}, {"letter": "E", "text": "Refer him to a gastroenterologist"}], "rationale": "<p>1. <strong>题型识别</strong>：典型 angina 病史 + 急诊 ECG 正常 → 走\"门诊负荷试验确诊\"路径。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>胸痛：中央、钝痛、< 20 min</li>\n<li><strong>可预测的活动量诱发</strong></li>\n<li><strong>休息或 GTN 缓解</strong> ← 教科书 stable angina</li>\n<li>ECG 正常</li>\n<li>患者自评与既往发作类似</li>\n<p>3. <strong>诊断路径</strong>：</p>\n<li>稳定型心绞痛 = 氧耗增加但冠脉狭窄不能跟上 → 缺血</li>\n<li>不稳定心绞痛 = 新发 / 模式改变 / 静息痛 / 加剧</li>\n<li>本例<strong>典型稳定型</strong></li>\n<p>4. <strong>处理</strong>：</p>\n<li>ECG 正常 / 不确定 → <strong>负荷试验</strong>（运动平板、药理、核素）</li>\n<li>阳性标准：复现胸痛、ST 段压低 > 2 mm、血压下降 > 10 mmHg</li>\n<li>阳性 → 冠脉造影 → PCI / CABG</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A：未充分评估就放走 = 不当</li>\n<li>B：单做 echo 不够（echo 评估结构和室壁运动，但不诱发缺血）</li>\n<li>C：CCU + 酶 + 复查 ECG 是 <em>不稳定 / 急性 MI</em> 路径，本例是稳定</li>\n<li>E：疼痛典型心源性，不转消化科</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"ECG 正常 = 没病\"陷阱</strong>：稳定型心绞痛发作间期 ECG 完全可以正常，<strong>正是负荷试验的指征</strong>。</li>\n<li><strong>CCU 收治陷阱</strong>：CCU 是 unstable / MI 路径；稳定型心绞痛走门诊路径（除非模式改变）。</li>\n<li><strong>Reassurance 陷阱</strong>：未完成 CAD 评估就放走 = 漏诊 + 风险。</li>\n<li><strong>Gastroenterologist 陷阱</strong>：中央、钝痛、休息缓解 → 教科书 cardiac，绝非 GERD。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>Central chest pain described as <strong>heaviness, dull and aching</strong> that may or may not radiate to the jaw, left arm, or epigastrium is more likely ischemic. The duration (< 20 min), being brought on by a <strong>predictable amount of exertion</strong> and <strong>relieved by rest or nitrates</strong> is characteristic of <strong>stable angina</strong> — a condition in which increased oxygen demand (induced by activity) cannot be met by stenotic coronary arteries.</p>\n<p>In contrast, <strong>unstable angina</strong> = any new ischemic chest pain, or one with deviation from typical pattern (duration, intensity, frequency, or decreased exertion threshold).</p>\n<p><strong>The characteristics</strong> of the pain (duration, reversibility, response to rest and nitrates), combined with a <strong>normal ECG</strong> in ED, establish the diagnosis of stable angina. The next best step is to <strong>urgently perform a stress test</strong> (conventional treadmill, chemical, or nuclear) to establish coronary stenosis.</p>\n<p><strong>Positive stress test criteria</strong>:</p>\n<ul>\n<li>Reproduction of chest pain</li>\n<li>ST segment depression > 2 mm</li>\n<li>Drop in blood pressure > 10 mmHg</li>\n</ul>\n<p><strong>Positive stress test</strong> → angiography → balloon ± stent or CABG.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Reassure and discharge): Not appropriate before full assessment.</li>\n<li><strong>B</strong> (Outpatient echo only): Echo doesn't provoke ischemia.</li>\n<li><strong>C</strong> (Admit to CCU): Reserved for unstable angina / MI (changes in intensity, duration, unresponsiveness to rest/nitrates).</li>\n<li><strong>E</strong> (Gastroenterologist): Pain pattern is classic cardiac ischemia.</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ANZ Cardiac Society 稳定型心绞痛指南）</li>\n</ul>", "related": ["AMC-Q0025-PCI-Antiplatelet-Duration", "AMC-Q0225-Inferior-STEMI-Reperfusion", "AMC-Q0224-Thrombolytics-Contraindications", "MOC-Cardiology", "Topic-Chest-Pain-Triage"], "bodyHtml": "", "diseases": ["Stable Angina"], "complaints": ["chest pain"], "search": "稳定型心绞痛 — 负荷试验确诊\nstable angina stress test investigation outpatient workup\ninvestigation diagnosis\n a 70-year-old man presents to the emergency department with complaint of chest pain starting 15 minutes ago, central in location, and dull and aching in nature. he is given aspirin, sublingual glyceryl trinitrate, and oral antacid, and is put on supplemental oxygen by nasal cannula. these measures ameliorate the pain to a significant extent. \n on examination, his blood pressure is 140/90 mmhg, pulse 110 bpm, and respiratory rate 20 breaths per minute. a 12-lead ecg strip reveals no abnormality. he mentions that he has had these pains every time he exceeded a certain amount of physical activity, and that each time the pain subsides with rest or sublingual glyceryl trinitrate. he rates this current episode no more than the previous ones. which one of the following is the most appropriate next step in management? \n correct answer is  d  \n central chest pain described as  heaviness, dull and aching  that may or may not radiate to the jaw, left arm, or epigastrium is more likely ischemic. the duration ( predictable amount of exertion  and  relieved by rest or nitrates  is characteristic of  stable angina  — a condition in which increased oxygen demand (induced by activity) cannot be met by stenotic coronary arteries. \n in contrast,  unstable angina  = any new ischemic chest pain, or one with deviation from typical pattern (duration, intensity, frequency, or decreased exertion threshold). \n  the characteristics  of the pain (duration, reversibility, response to rest and nitrates), combined with a  normal ecg  in ed, establish the diagnosis of stable angina. the next best step is to  urgently perform a stress test  (conventional treadmill, chemical, or nuclear) to establish coronary stenosis. \n  positive stress test criteria : \n \n reproduction of chest pain \n st segment depression > 2 mm \n drop in blood pressure > 10 mmhg \n \n  positive stress test  → angiography → balloon ± stent or cabg. \n  why not the others : \n \n  a  (reassure and discharge): not appropriate before full assessment. \n  b  (outpatient echo only): echo doesn't provoke ischemia. \n  c  (admit to ccu): reserved for unstable angina / mi (changes in intensity, duration, unresponsiveness to rest/nitrates). \n  e  (gastroenterologist): pain pattern is classic cardiac ischemia. \n "}, {"id": "AMC-QNA-P027", "type": "mcq", "qid": 27, "title": "GTN 失效 — 药物过期（reduced potency）最常见", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "complications", "prevention"], "topic": ["GTN", "Glyceryl Trinitrate", "Drug Expiration", "Stable Angina", "Patient Education"], "difficulty": 2, "correctAnswer": "C", "page": 27, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "angina", "gtn", "pharmacology", "patient-education", "approach-treatment", "approach-complications", "approach-prevention"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-QNA-P027-GTN-Expiration.md", "stem": "<p>A 70-year-old man, farmer by profession, presents to the Emergency Department after he experienced chest pain of 20 minutes duration following physical activity. When the pain started, he took 3 puffs of glyceryl trinitrate but there was no relief. In the Emergency Department though, the pain alleviated with oxygen. On further questioning, you realize that he is on aspirin, metoprolol and sublingual glyceryl trinitrate spray on an 'as needed' basis. During the past 6 months, he has had only 3 episodes of chest pain subsided just by rest. He saw his GP 6 months ago when he received his last prescription. Which one of the following is the most likely explanation of failure of glyceryl trinitrate to relieve his symptoms?</p>", "options": [{"letter": "A", "text": "Onset of unstable angina"}, {"letter": "B", "text": "Nitrate tolerance"}, {"letter": "C", "text": "Reduced drug potency"}, {"letter": "D", "text": "Poor absorption through the mouth"}, {"letter": "E", "text": "Onset of myocardial infarction"}], "rationale": "<p>1. <strong>题型识别</strong>：GTN 失效 = 找最常见原因 = <strong>过期</strong>。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>70 岁农民</li>\n<li>运动诱发胸痛</li>\n<li>3 喷 GTN 无效</li>\n<li><strong>ED 给氧后缓解</strong>（关键：仍对氧有反应，不是不稳定心绞痛 / MI）</li>\n<li>既往 6 个月 3 次发作均休息缓解 → <strong>稳定心绞痛</strong></li>\n<li>6 个月前最后一次开 GTN → <strong>GTN 已过期</strong></li>\n<p>3. <strong>GTN 药理常识</strong>：</p>\n<li>GTN 喷雾 / 药片<strong>保质期有限</strong>（通常 3-6 个月开封后）</li>\n<li>过期后<strong>效力下降</strong></li>\n<li>患者需要定期更换</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (unstable angina)：本例既往 6 月都是休息缓解的稳定模式，<strong>未升级</strong>，且 ED 给氧缓解了，<strong>非不稳定</strong></li>\n<li>B (nitrate tolerance)：本例 GTN 用得少（6 月 3 次，prn），<strong>不容易耐药</strong></li>\n<li>D (poor absorption)：GTN 舌下吸收良好，<strong>不是问题</strong></li>\n<li>E (MI)：ED 给氧缓解了 → 不太像 MI（MI 多需更强干预）</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"GTN 失效 = 病情加重\"陷阱</strong>：本例<strong>最常见原因是过期</strong>，不是 ACS。临床实务中考患者<strong>用药依从性 + 药物有效期</strong>。</li>\n<li><strong>\"Nitrate tolerance = 通用陷阱\"陷阱</strong>：耐药发生在<strong>长期规律使用</strong>的患者，本例 prn 用得少。</li>\n<li><strong>\"O2 缓解 = 非心源性\"陷阱</strong>：心绞痛也会被 O2 缓解（O2 是辅助治疗之一）。判断\"是否心源性\"看<strong>整体模式</strong>，不是单一症状反应。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The scenario is more likely due to <strong>expiration of the glyceryl trinitrate</strong>. It is important to remind patients to update their GTN sprays or pearls. <strong>Expired GTN has reduced potency and effect on relieving ischemic pain</strong>.</p>\n<p>Since this patient refilled his prescription <strong>6 months ago</strong>, it is likely the drug is past its expiry date and has lost the desired potency.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>B</strong> (Nitrate tolerance): A concern in patients taking GTN or other nitrates on a <strong>regular basis</strong>. Resistance develops and pain control diminishes. In this patient, tolerance is very unlikely as he has not been a regular user and has used GTN occasionally on an \"as-needed\" basis.</li>\n<li><strong>A, E</strong> (Unstable angina, MI): Pain may not respond to nitrates in these conditions. However, this patient is unlikely to have these because <strong>it is unlikely for UA or MI to respond to oxygen but not to nitrates</strong>.</li>\n<li><strong>D</strong> (Poor absorption): GTN <strong>adequately and effectively absorbs</strong> through the mouth.</li>\n</ul>", "references": "<ul>\n<li>（待补：TG Cardiovascular GTN 章节）</li>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n</ul>", "related": ["AMC-QNA-P015-Stable-Angina-Stress-Test", "AMC-Q0025-PCI-Antiplatelet-Duration", "MOC-Cardiology", "Topic-Angina-Management"], "bodyHtml": "", "diseases": ["Stable Angina"], "complaints": ["chest pain"], "search": "gtn 失效 — 药物过期（reduced potency）最常见\ngtn glyceryl trinitrate drug expiration stable angina patient education\ntreatment complications prevention\n a 70-year-old man, farmer by profession, presents to the emergency department after he experienced chest pain of 20 minutes duration following physical activity. when the pain started, he took 3 puffs of glyceryl trinitrate but there was no relief. in the emergency department though, the pain alleviated with oxygen. on further questioning, you realize that he is on aspirin, metoprolol and sublingual glyceryl trinitrate spray on an 'as needed' basis. during the past 6 months, he has had only 3 episodes of chest pain subsided just by rest. he saw his gp 6 months ago when he received his last prescription. which one of the following is the most likely explanation of failure of glyceryl trinitrate to relieve his symptoms? \n correct answer is  c  \n the scenario is more likely due to  expiration of the glyceryl trinitrate . it is important to remind patients to update their gtn sprays or pearls.  expired gtn has reduced potency and effect on relieving ischemic pain . \n since this patient refilled his prescription  6 months ago , it is likely the drug is past its expiry date and has lost the desired potency. \n  why not the others : \n \n  b  (nitrate tolerance): a concern in patients taking gtn or other nitrates on a  regular basis . resistance develops and pain control diminishes. in this patient, tolerance is very unlikely as he has not been a regular user and has used gtn occasionally on an \"as-needed\" basis. \n  a, e  (unstable angina, mi): pain may not respond to nitrates in these conditions. however, this patient is unlikely to have these because  it is unlikely for ua or mi to respond to oxygen but not to nitrates . \n  d  (poor absorption): gtn  adequately and effectively absorbs  through the mouth. \n "}, {"id": "AMC-Q0014", "type": "mcq", "qid": 14, "title": "Shoulder Tip Pain — Differential Diagnosis (否定型)", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": ["differential", "diagnosis"], "topic": ["Referred Pain", "Differential Diagnosis", "Shoulder Tip Pain", "Kehr Sign Variant"], "difficulty": 3, "correctAnswer": "C", "page": 1, "tags": ["mcq", "amc", "adult-internal-medicine", "referred-pain", "approach-differential", "approach-diagnosis"], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0014-Shoulder-Tip-Pain-DDx.md", "stem": "<p>Which one of the following is <strong>not</strong> a differential diagnosis of shoulder tip pain?</p>", "options": [{"letter": "A", "text": "Pulmonary embolism"}, {"letter": "B", "text": "Myocardial infarction"}, {"letter": "C", "text": "Emphysema"}, {"letter": "D", "text": "Pneumothorax"}, {"letter": "E", "text": "Peptic ulcer disease"}], "rationale": "<p>1. <strong>题型识别</strong>：否定型题（\"is <strong>not</strong>\"）。拿到题第一时间圈出 \"NOT\"，避免漏读。 2. <strong>机制先行</strong>：肩峰痛（shoulder-tip pain）= 膈肌受刺激 → 膈神经（C3-C5）→ 牵涉到肩部皮肤。理解机制后 DDx 才能立体化。 3. <strong>建立 DDx 清单（按解剖部位）</strong>：</p>\n<ul>\n<li>胸膜/胸腔内：PE、Pneumothorax、MI、膈肌胸膜刺激</li>\n<li>腹腔/膈下：Perforated peptic ulcer、膈下脓肿</li>\n<li>局部：MSK 创伤 / 炎症</li>\n<p>4. <strong>逐项排除</strong>：</p>\n<li>A PE → 经典 diaphragmatic irritation 源 ✔</li>\n<li>B MI → 膈面受刺激 ✔</li>\n<li>C Emphysema → 题目无 pneumothorax 语境 → ✘（答案）</li>\n<li>D Pneumothorax → 胸膜刺激 ✔</li>\n<li>E PUD → 严格说需要 \"perforation\" 才是 ✔（穿孔性）</li>\n<p>5. <strong>锁定答案 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>否定题型陷阱</strong>：漏读 \"NOT\"。考试时强烈建议在 \"is not\" 下划线，再开始做题。</li>\n<li><strong>Emphysema ≠ Pneumothorax</strong>：COPD 患者常自发气胸 → 学生过度联想 → 误以为 emphysema 本身也引起肩峰痛。</li>\n<li><strong>PUD 边界</strong>：单纯 PUD 不引起肩峰痛 —— <strong>perforation</strong> 才是。这是题目隐含的\"边界条件\"。</li>\n<li><strong>MI 不是唯一胸痛答案</strong>：MI 引起的牵涉痛通常是左臂/下颌，而 MI 引起的肩峰痛是 <em>膈面 MI</em> 的少见表现 —— 部分学生忽略这个细分而漏选 B。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Shoulder-tip pain is an important clinical sign and can be caused by local musculoskeletal trauma / inflammation <strong>or referral</strong> (referred pain).</p>\n<p><strong>Referred causes of shoulder-tip pain (DDx)：</strong></p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>病因</th></tr></thead>\n<tbody>\n<tr><td>呼吸</td><td>Pulmonary embolism</td></tr>\n<tr><td>呼吸</td><td>Pneumothorax</td></tr>\n<tr><td>心血管</td><td>Myocardial infarction</td></tr>\n<tr><td>消化</td><td>Perforation of peptic ulcer disease</td></tr>\n<tr><td>其他</td><td>Diaphragmatic irritation（任何膈下/膈面刺激）</td></tr>\n</tbody>\n</table>\n<p><strong>Emphysema</strong> is <strong>not</strong> a cause of shoulder-tip pain, <strong>unless a spontaneous pneumothorax occurs</strong>.</p>", "references": "<ul>\n<li>http://www.webmd.com/pain-management/tc/referred-shoulder-pain</li>\n<li>http://www.uptodate.com/contents/evaluation-of-the-patient-with-shoulder-pain</li>\n</ul>", "related": ["AMC-QNA-P006-Orthostatic-Hypotension", "TR-Tilt-Table-Test", "MOC-General", "Topic-Referred-Pain"], "bodyHtml": "", "diseases": ["Referred Pain"], "complaints": [], "search": "shoulder tip pain — differential diagnosis (否定型)\nreferred pain differential diagnosis shoulder tip pain kehr sign variant\ndifferential diagnosis\n which one of the following is  not  a differential diagnosis of shoulder tip pain? \n correct answer is  c  \n shoulder-tip pain is an important clinical sign and can be caused by local musculoskeletal trauma / inflammation  or referral  (referred pain). \n  referred causes of shoulder-tip pain (ddx)：  \n \n   类别  病因   \n \n  呼吸  pulmonary embolism  \n  呼吸  pneumothorax  \n  心血管  myocardial infarction  \n  消化  perforation of peptic ulcer disease  \n  其他  diaphragmatic irritation（任何膈下/膈面刺激）  \n \n \n  emphysema  is  not  a cause of shoulder-tip pain,  unless a spontaneous pneumothorax occurs . "}, {"id": "AMC-Q0273", "type": "mcq", "qid": 273, "title": "围手术期 VTE 最高风险 — 心衰（HF 本身）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["prevention", "definition", "risk-factors"], "topic": ["Venous Thromboembolism", "VTE Risk Stratification", "Peri-operative", "Heart Failure", "Thrombophilia"], "difficulty": 3, "correctAnswer": "E", "page": 64, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "vte", "dvt", "prophylaxis", "heart-failure", "approach-prevention", "approach-definition", "approach-risk-factors"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0273-VTE-Risk-Heart-Failure.md", "stem": "<p>You are assessing the risk of thromboembolism in a 75-year-old woman, who is booked for elective surgical replacement of her left knee joint. Which one of the following, if present in history, is the most significant risk factor for thromboembolism during her peri-operative stay?</p>", "options": [{"letter": "A", "text": "History of colon resection due to toxic megacolon"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Stage II kidney disease"}, {"letter": "D", "text": "Transient ischemic attack with full recovery three years ago"}, {"letter": "E", "text": "Heart failure"}], "rationale": "<p>1. <strong>题型识别</strong>：VTE 风险因素评估 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>75 岁女性</li>\n<li>择期<strong>左膝关节置换术</strong>（骨科大手术，<strong>本身</strong>是 VTE 高风险）</li>\n<li>评估<strong>叠加</strong>风险因素</li>\n<p>3. <strong>AMC 围手术期 VTE 风险分层</strong>（必背）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>风险等级</th><th>内科</th><th>外科</th></tr></thead>\n<tbody>\n<tr><td><strong>高</strong></td><td>Stroke、<strong>Age > 75</strong>、<strong>CHF</strong>、Shock、Cancer、<strong>History of DVT/PE</strong>、Thrombophilia</td><td><strong>骨科（盆/髋/下肢）</strong>、<strong>大手术 + 年龄 > 60</strong>、大手术 + 40-60 + cancer/DVT/PE 史</td></tr>\n<tr><td>中</td><td>Immobilized + active disease</td><td>大手术 40-60 + 其他风险；小手术 > 60 / 40-60 + 风险</td></tr>\n<tr><td>低</td><td>—</td><td>大手术 < 40；小内科病；小手术 < 60</td></tr>\n</tbody>\n</table>\n<p>4. <strong>本例：本身就高风险</strong>（骨科大手术）—— 题问<strong>叠加因素</strong> 5. <strong>选项逐一分析</strong>：</p>\n<ul>\n<li>A (Colon resection due to toxic megacolon)：是\"大手术史\"—— 不算慢性风险</li>\n<li>B (IBS)：<strong>不是</strong> VTE 风险</li>\n<li>C (Stage II kidney disease)：<strong>轻度</strong>，<strong>不是</strong> 显著 VTE 风险</li>\n<li>D (TIA 3 年前已恢复)：TIA <strong>不</strong>致 VTE 风险（与动脉粥样硬化相关）</li>\n<li>E (Heart failure)：<strong>CHF 明确是 VTE 独立强风险</strong>（Venous stasis + 凝血激活 + 内皮功能障碍）</li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Cancer = 最高 VTE 风险\"陷阱</strong>：Cancer 确实高，但本例<strong>没问 cancer</strong>。</li>\n<li><strong>\"Thrombophilia = 最高\"陷阱</strong>：Thrombophilia 确实高，但<strong>无症状</strong>患者通常不筛查。</li>\n<li><strong>\"TIA = 卒中 = 高 VTE\"陷阱</strong>：错。TIA 是<strong>动脉</strong>事件，与 VTE 关系小。</li>\n<li><strong>\"CrCl 低 = 高 VTE\"陷阱</strong>：Stage II CKD 较轻，<strong>不</strong>显著增加 VTE 风险。</li>\n<li><strong>\"既往大手术史 = 高 VTE\"陷阱</strong>：既往<strong>已恢复</strong>的手术不增加 VTE 风险（除非近期）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p><strong>Peri-hospital risk assessment of a venous thromboembolic events (VTE)</strong> such as deep vein thrombosis or pulmonary embolism is stratified according to the following table:</p>\n<p><strong>Stratification of DVT/PE during hospital stay</strong>:</p>\n<table class='md-table'>\n<thead><tr><th>Risk</th><th>Medical</th><th>Surgical</th></tr></thead>\n<tbody>\n<tr><td><strong>High</strong></td><td>Stroke, Age > 75, <strong>CHF</strong>, Shock, Cancer, History of DVT/PE, Thrombophilia</td><td>Orthopedic surgery (pelvis, hip, lower limb); major surgery + age > 60; major surgery 40-60 + cancer or DVT/PE history or other risk factors</td></tr>\n<tr><td>Moderate</td><td>Immobilized patients with active disease</td><td>Major surgery 40-60 + other risk factors; minor surgery age > 60 or 40-60 + DVT/PE history or estrogen or other risks</td></tr>\n<tr><td>Low</td><td>—</td><td>Major surgery age < 40; minor medical illness; minor surgery age < 60</td></tr>\n</tbody>\n</table>\n<p><strong>Among the options, congestive heart failure and the surgery are of the highest risk for venous thromboembolism. None of the other options are risk factors for VTE.</strong></p>\n<p><strong>Why HF increases VTE risk</strong> (Virchow's triad):</p>\n<ul>\n<li><strong>Venous stasis</strong> (decreased cardiac output → venous congestion)</li>\n<li><strong>Endothelial dysfunction</strong> (low flow, inflammation)</li>\n<li><strong>Hypercoagulability</strong> (neurohormonal activation, increased clotting factors)</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ASH 围手术期 VTE 预防指南）</li>\n</ul>", "related": ["AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0275-DVT-Treatment-Heparin", "AMC-Q0279-DVT-Wells-Score-Doppler", "MOC-Haematology", "Topic-VTE-Prophylaxis"], "bodyHtml": "", "diseases": ["DVT", "VTE", "Heart Failure"], "complaints": [], "search": "围手术期 vte 最高风险 — 心衰（hf 本身）\nvenous thromboembolism vte risk stratification peri-operative heart failure thrombophilia\nprevention definition risk-factors\n you are assessing the risk of thromboembolism in a 75-year-old woman, who is booked for elective surgical replacement of her left knee joint. which one of the following, if present in history, is the most significant risk factor for thromboembolism during her peri-operative stay? \n correct answer is  e  \n  peri-hospital risk assessment of a venous thromboembolic events (vte)  such as deep vein thrombosis or pulmonary embolism is stratified according to the following table: \n  stratification of dvt/pe during hospital stay : \n \n   risk  medical  surgical   \n \n   high   stroke, age > 75,  chf , shock, cancer, history of dvt/pe, thrombophilia  orthopedic surgery (pelvis, hip, lower limb); major surgery + age > 60; major surgery 40-60 + cancer or dvt/pe history or other risk factors  \n  moderate  immobilized patients with active disease  major surgery 40-60 + other risk factors; minor surgery age > 60 or 40-60 + dvt/pe history or estrogen or other risks  \n  low  —  major surgery age   \n \n \n  among the options, congestive heart failure and the surgery are of the highest risk for venous thromboembolism. none of the other options are risk factors for vte.  \n  why hf increases vte risk  (virchow's triad): \n \n  venous stasis  (decreased cardiac output → venous congestion) \n  endothelial dysfunction  (low flow, inflammation) \n  hypercoagulability  (neurohormonal activation, increased clotting factors) \n "}, {"id": "AMC-Q0274", "type": "mcq", "qid": 274, "title": "DVT 诊断 — Duplex Doppler USG（不是 CT / MRI / 静脉造影 / D-dimer）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["investigation", "diagnosis", "definition"], "topic": ["DVT Diagnosis", "Duplex Doppler Ultrasonography", "Post-Surgical", "Venography Criterion Standard"], "difficulty": 3, "correctAnswer": "E", "page": 65, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "diagnosis", "doppler-ultrasound", "approach-investigation", "approach-diagnosis", "approach-definition"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0274-DVT-Diagnosis-Doppler-USG.md", "stem": "<p>Five days after surgical resection of a colonic tumor, a 73-year-old man develops pain, swelling and tenderness in his right calf. Physical examination reveals swelling of the ankle and the calf and tenderness over the gastrocnemius muscle. Which one of the following is the most appropriate diagnostic tool to establish the diagnosis?</p>", "options": [{"letter": "A", "text": "CT angiography of the leg"}, {"letter": "B", "text": "MRI of the leg"}, {"letter": "C", "text": "Conventional venography of the leg"}, {"letter": "D", "text": "Serum D-dimer"}, {"letter": "E", "text": "Duplex Doppler ultrasonography"}], "rationale": "<p>1. <strong>题型识别</strong>：疑似 DVT → 选确诊工具 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>73 岁、结肠癌术后 5 天</li>\n<li>典型 DVT 表现：小腿痛、肿、压痛（gastrocnemius 压痛）</li>\n<p>3. <strong>DVT 诊断路径</strong>（按 Wells 评分）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>Wells 评分</th><th>路径</th></tr></thead>\n<tbody>\n<tr><td><strong>< 2 (低)</strong></td><td><strong>D-dimer</strong> → 阴性排除；阳性 → USG</td></tr>\n<tr><td><strong>≥ 2 (高)</strong></td><td><strong>直接 USG</strong></td></tr>\n</tbody>\n</table>\n<p>4. <strong>本例 Wells 评分</strong>（按题干信息估）：</p>\n<ul>\n<li>Cancer（active）= 1</li>\n<li>局部压痛 = 1</li>\n<li>可能有 calf swelling、immobilization</li>\n<li>总分大概 <strong>≥ 2</strong> → 直接 USG</li>\n<p>5. <strong>选项逐一分析</strong>：</p>\n<li>A (CT angio)：看<strong>动脉</strong>（不是静脉）</li>\n<li>B (MRI)：可用但<strong>不首选</strong>（贵、慢、不普及）</li>\n<li>C (Venography)：<strong>金标准</strong>但<strong>有创</strong>、<strong>不</strong>用做首选</li>\n<li>D (D-dimer)：<strong>低 Wells 评分</strong>才用；术后 D-dimer 本来就高（特异性差）</li>\n<li>E (Duplex USG)：<strong>正确</strong>（无创、敏感度 > 90%、特异性 > 95%）</li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Venography 是金标准 = 首选\"陷阱</strong>：金标准 ≠ 首选。金标准<strong>有创</strong>，<strong>Duplex USG 是首选</strong>（无创、敏感度足够）。</li>\n<li><strong>\"D-dimer 是确诊\"陷阱</strong>：错。D-dimer 是<strong>排除</strong>用（阴性排除），<strong>阳性不确诊</strong>。术后 D-dimer 本来就高。</li>\n<li><strong>\"CT angio 看血栓\"陷阱</strong>：CT angio 是<strong>动脉</strong>检查（动脉粥样硬化 / 夹层 / 栓塞），<strong>不</strong>是静脉。</li>\n<li><strong>\"MRI 总比 USG 好\"陷阱</strong>：MRI 在 DVT 是<strong>二线</strong>（髂 / 腔静脉首选，孕妇首选），<strong>不</strong>是一线。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p>With the clinical picture suggestive of deep vein thrombosis, <strong>Duplex Doppler ultrasonography should be used to confirm the diagnosis</strong>. Although pain, swelling, and tenderness are suggestive of DVT, <strong>but treatment should never be started solely on clinical basis</strong>.</p>\n<ul>\n<li>(Option A) <strong>CT angiography is used for visualization of clots in arteries, not veins</strong>.</li>\n<li>(Option B) <strong>MRI is being used increasingly for assessment of DVT</strong>, and probably is the preferred investigation for suspected <strong>caval and iliac venous thrombosis, particularly in pregnancy</strong>, but is expensive, time-consuming and not always available.</li>\n<li>(Option C) <strong>Conventional venography is the criterion standard for diagnosis of DVT, but is rarely used now</strong> because less invasive and convenient diagnostic modalities are widely available.</li>\n<li>(Option D) <strong>D-dimer assay, although sensitive, lacks specificity.</strong> Increased levels of D-dimer can be seen in several conditions, <strong>with post-surgery state as one</strong>. It is basically used to rule out DVT or PE in <strong>low-risk patients (Wells score < 2)</strong>. A positive test demands more specified evaluation, but a negative one excludes the possibility of DVT or PE.</li>\n</ul>\n<p><strong>Duplex USG accuracy for DVT</strong>:</p>\n<ul>\n<li>Sensitivity > 90% (femoral, popliteal)</li>\n<li>Specificity > 95%</li>\n<li>Less accurate for iliac or calf vein thromboses</li>\n</ul>", "references": "<ul>\n<li>AMC handbook multiple choice questions — page 173</li>\n<li>http://www.imagingpathways.health.wa.gov.au/index</li>\n<li>（待补：ASH 2024 DVT 诊断指南）</li>\n</ul>", "related": ["AMC-Q0273-VTE-Risk-Heart-Failure", "AMC-Q0275-DVT-Treatment-Heparin", "AMC-Q0279-DVT-Wells-Score-Doppler", "MOC-Haematology", "Topic-DVT-Diagnosis"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "dvt 诊断 — duplex doppler usg（不是 ct / mri / 静脉造影 / d-dimer）\ndvt diagnosis duplex doppler ultrasonography post-surgical venography criterion standard\ninvestigation diagnosis definition\n five days after surgical resection of a colonic tumor, a 73-year-old man develops pain, swelling and tenderness in his right calf. physical examination reveals swelling of the ankle and the calf and tenderness over the gastrocnemius muscle. which one of the following is the most appropriate diagnostic tool to establish the diagnosis? \n correct answer is  e  \n with the clinical picture suggestive of deep vein thrombosis,  duplex doppler ultrasonography should be used to confirm the diagnosis . although pain, swelling, and tenderness are suggestive of dvt,  but treatment should never be started solely on clinical basis . \n \n (option a)  ct angiography is used for visualization of clots in arteries, not veins . \n (option b)  mri is being used increasingly for assessment of dvt , and probably is the preferred investigation for suspected  caval and iliac venous thrombosis, particularly in pregnancy , but is expensive, time-consuming and not always available. \n (option c)  conventional venography is the criterion standard for diagnosis of dvt, but is rarely used now  because less invasive and convenient diagnostic modalities are widely available. \n (option d)  d-dimer assay, although sensitive, lacks specificity.  increased levels of d-dimer can be seen in several conditions,  with post-surgery state as one . it is basically used to rule out dvt or pe in  low-risk patients (wells score  . a positive test demands more specified evaluation, but a negative one excludes the possibility of dvt or pe. \n \n  duplex usg accuracy for dvt : \n \n sensitivity > 90% (femoral, popliteal) \n specificity > 95% \n less accurate for iliac or calf vein thromboses \n "}, {"id": "AMC-Q0275", "type": "mcq", "qid": 275, "title": "DVT 治疗 — Heparin 先（IV 或 LMWH）+ Warfarin 桥接 6 月", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "prevention", "complications"], "topic": ["DVT Treatment", "Heparin First", "Warfarin Bridge", "INR 2-3", "6 months", "Anticoagulation"], "difficulty": 3, "correctAnswer": "C", "page": 66, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "treatment", "heparin", "warfarin", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0275-DVT-Treatment-Heparin.md", "stem": "<p>A 73-year-old man presents with swelling of his left leg for the past three hours. Evaluation establishes the diagnosis of a deep vein thrombosis (DVT) in the left lower leg. A Doppler ultrasound reveals deep vein thrombosis in the calf as well as popliteal and femoral veins. His past medical history is negative for previous DVT. Which one of the following is the next best in management of this patient?</p>", "options": [{"letter": "A", "text": "Angiography"}, {"letter": "B", "text": "Angioplasty"}, {"letter": "C", "text": "Heparin"}, {"letter": "D", "text": "Warfarin"}, {"letter": "E", "text": "Aspirin"}], "rationale": "<p>1. <strong>题型识别</strong>：DVT 确诊 → 选起始治疗 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>73 岁、急性 DVT</li>\n<li>累及<strong>小腿 + 腘 + 股</strong>静脉（<strong>近端 DVT</strong>——高风险 → PE）</li>\n<li>无既往 DVT 史（<strong>首次发作</strong>、<strong>非复发</strong>）</li>\n<p>3. <strong>DVT 治疗路径</strong>：</p>\n<li><strong>第 1 步</strong>：<strong>Heparin</strong>（IV UFH 或 SC LMWH）—— 立即起效</li>\n<li><strong>第 2 步</strong>：24-48 h 内启动 <strong>Warfarin</strong></li>\n<li><strong>第 3 步</strong>：INR 达 2-3 后停 Heparin</li>\n<li><strong>第 4 步</strong>：Warfarin <strong>至少 6 月</strong>（首次、近端、无 cancer）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Angiography)：DVT <strong>不</strong>做动脉造影</li>\n<li>B (Angioplasty)：动脉用，<strong>不</strong>用于 DVT</li>\n<li>C (Heparin)：<strong>正确</strong>（一线）</li>\n<li>D (Warfarin alone)：错，warfarin 早期<strong>致凝</strong>（protein C/S ↓ 快）→ 需 heparin 桥接</li>\n<li>E (Aspirin)：<strong>抗血小板</strong>，<strong>不</strong>治 DVT</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Warfarin = 抗凝\"陷阱</strong>：Warfarin <strong>抗凝</strong>，但<strong>早期促凝</strong>（protein C/S 半衰期短）→ <strong>不能单用</strong>。</li>\n<li><strong>\"Aspirin 也抗血栓\"陷阱</strong>：Aspirin <strong>抗血小板</strong>（动脉血栓）；DVT 是<strong>静脉血栓</strong>→ 需<strong>抗凝</strong>。</li>\n<li><strong>\"Angioplasty 治一切\"陷阱</strong>：Angioplasty 是<strong>动脉</strong>介入治疗，<strong>不</strong>治 DVT。</li>\n<li><strong>\"DVT 不需急\"陷阱</strong>：错。<strong>近端 DVT（小腿以上）有 PE 风险</strong>→ 立即抗凝。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>All patients with DVT are initially managed by injectable heparin</strong> (either intravenous unfractionated or subcutaneous low molecular weight heparin). <strong>Warfarin can be started within 24-48 hours with close monitoring of INR</strong>. Once INR is in the therapeutic range of 2-3, heparin can be withheld. <strong>Warfarin should be continued for 6 months at least</strong>. Patients should see their GP on a regular basis for close monitoring of the INR.</p>\n<ul>\n<li>(Option A) DVT is the presence of clot in the deep veins. <strong>Arteriography evaluates arterial structure and thromboses within arteries</strong>.</li>\n<li>(Option B) Angioplasty is performed for revascularization in arterial problems with no role in DVT.</li>\n<li>(Option D) Warfarin is indicated in this patient <strong>after initial anticoagulation with heparin</strong>.</li>\n<li>(Option E) Antiplatelet therapy with aspirin or clopidogrel does not provide adequate anticoagulation for prevention of DVT.</li>\n</ul>\n<p><strong>DVT treatment duration</strong>:</p>\n<ul>\n<li><strong>First DVT, provoked</strong> (e.g., post-surgery): <strong>3 months</strong></li>\n<li><strong>First DVT, unprovoked</strong>: <strong>≥ 6 months</strong> (often longer)</li>\n<li><strong>Recurrent DVT</strong> or <strong>active cancer</strong>: <strong>indefinite / lifelong</strong></li>\n<li><strong>Catheter-associated</strong>: at least 3 months, remove catheter if possible</li>\n</ul>\n<p><strong>LMWH preferred over UFH in</strong>:</p>\n<ul>\n<li>Cancer-associated VTE</li>\n<li>Pregnancy</li>\n<li>Outpatient management (no need for infusion)</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ASH 2024 DVT 治疗指南）</li>\n</ul>", "related": ["AMC-Q0273-VTE-Risk-Heart-Failure", "AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0279-DVT-Wells-Score-Doppler", "AMC-QNA-P011-DVT-Pregnancy-LMWH", "MOC-Haematology", "Topic-DVT-Anticoagulation"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "dvt 治疗 — heparin 先（iv 或 lmwh）+ warfarin 桥接 6 月\ndvt treatment heparin first warfarin bridge inr 2-3 6 months anticoagulation\ntreatment prevention complications\n a 73-year-old man presents with swelling of his left leg for the past three hours. evaluation establishes the diagnosis of a deep vein thrombosis (dvt) in the left lower leg. a doppler ultrasound reveals deep vein thrombosis in the calf as well as popliteal and femoral veins. his past medical history is negative for previous dvt. which one of the following is the next best in management of this patient? \n correct answer is  c  \n  all patients with dvt are initially managed by injectable heparin  (either intravenous unfractionated or subcutaneous low molecular weight heparin).  warfarin can be started within 24-48 hours with close monitoring of inr . once inr is in the therapeutic range of 2-3, heparin can be withheld.  warfarin should be continued for 6 months at least . patients should see their gp on a regular basis for close monitoring of the inr. \n \n (option a) dvt is the presence of clot in the deep veins.  arteriography evaluates arterial structure and thromboses within arteries . \n (option b) angioplasty is performed for revascularization in arterial problems with no role in dvt. \n (option d) warfarin is indicated in this patient  after initial anticoagulation with heparin . \n (option e) antiplatelet therapy with aspirin or clopidogrel does not provide adequate anticoagulation for prevention of dvt. \n \n  dvt treatment duration : \n \n  first dvt, provoked  (e.g., post-surgery):  3 months  \n  first dvt, unprovoked :  ≥ 6 months  (often longer) \n  recurrent dvt  or  active cancer :  indefinite / lifelong  \n  catheter-associated : at least 3 months, remove catheter if possible \n \n  lmwh preferred over ufh in : \n \n cancer-associated vte \n pregnancy \n outpatient management (no need for infusion) \n "}, {"id": "AMC-Q0276", "type": "mcq", "qid": 276, "title": "静脉曲张溃疡 + ABI 0.7 — 弹力袜**不安全**", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "complications", "definition"], "topic": ["Venous Leg Ulcer", "Compression Stockings Contraindication", "ABI 0.7", "Diabetes", "Bisggard Regimen"], "difficulty": 3, "correctAnswer": "A", "page": 67, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "venous-ulcer", "compression-stockings", "dvt", "approach-treatment", "approach-complications", "approach-definition"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0276-Venous-Ulcer-Compression-Contra.md", "stem": "<p>An 82-year-old man presents to your office complaining of an ulcer over the medial side of his leg just above the internal malleolus. He mentions that the wound has been there for the past 6 months, and worsened recently. The examination confirms the diagnosis of a venous ulcer. The ipsilateral ankle-brachial index is 0.7. Which one of the following is correct regarding the management of this patient?</p>", "options": [{"letter": "A", "text": "Compression stockings are unsafe for this patient"}, {"letter": "B", "text": "Prescribe compression stockings and refer him to a vascular surgeon"}, {"letter": "C", "text": "Give antibiotics and review in two weeks"}, {"letter": "D", "text": "Check fasting glucose"}, {"letter": "E", "text": "Check HbA1C"}], "rationale": "<p>1. <strong>题型识别</strong>：静脉溃疡 + ABI 0.7 → 选安全治疗 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>82 岁</li>\n<li>溃疡在<strong>内踝上方内侧</strong>（经典<strong>静脉</strong>溃疡部位）</li>\n<li>6 月不愈（<strong>慢性</strong>）</li>\n<li><strong>ABI 0.7</strong>（<strong>< 0.8</strong> = 动脉供血不足）</li>\n<p>3. <strong>静脉溃疡 Bisggard 方案（4 联）</strong>： 1. 患者教育 2. <strong>抬高患肢</strong> 3. <strong>弹力压迫</strong>（核心） 4. 评估 4. <strong>弹力袜禁忌</strong>（重要！）：</p>\n<li><strong>ABI < 0.8</strong>（动脉供血不足）</li>\n<li><strong>糖尿病</strong>（常合并微血管病）</li>\n<li><strong>上述情况压迫 = 减少动脉灌注 → 加重缺血</strong></li>\n<p>5. <strong>本例</strong>：ABI 0.7 → 弹力袜<strong>不安全</strong>（会减少已不足的动脉血流） 6. <strong>选项排除</strong>：</p>\n<li>A (Compression unsafe)：<strong>正确</strong></li>\n<li>B (Compression + 外科)：错（不安全）</li>\n<li>C (Antibiotics)：无并发症的静脉溃疡<strong>不</strong>用抗生素</li>\n<li>D (Fasting glucose)：可考虑但<strong>非管理核心</strong></li>\n<li>E (HbA1C)：用于糖尿病<strong>监测</strong>（不是筛查）</li>\n<p>7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"静脉溃疡 = 弹力袜\"陷阱</strong>：通常对，但 <strong>ABI < 0.8 / 糖尿病禁忌</strong>。</li>\n<li><strong>\"糖尿病 = 测 HbA1C\"陷阱</strong>：HbA1C 是<strong>监测</strong>指标，<strong>不</strong>是筛查/诊断指标（筛查用 fasting glucose 或 OGTT）。</li>\n<li><strong>\"溃疡不愈 = 抗生素\"陷阱</strong>：无感染征象的<strong>慢性</strong>溃疡<strong>不</strong>用抗生素。</li>\n<li><strong>\"内踝上 = 动脉溃疡\"陷阱</strong>：错。<strong>内踝上方内侧 = 静脉溃疡</strong>（外踝 / 趾端 = 动脉溃疡）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p><strong>Venous leg ulcers are the most common chronic wounds seen in general practice.</strong> They account for 70-90% of chronic wounds. They tend to develop over the <strong>medial distal leg (just above the internal malleolus)</strong>, and are usually painful.</p>\n<p><strong>The most important risk factor for development of a venous ulcer is previous deep vein thrombosis (DVT)</strong> with consequent damage to venous structure and insufficiency.</p>\n<p><strong>Most venous ulcers respond adequately to a conservative management called Bisggard regimen.</strong> This regimen has four components: 1. Patient education 2. Elevation of the foot 3. <strong>Elastic compression</strong> 4. Evaluation</p>\n<p><strong>Elastic compression is considered for every patient UNLESS</strong>:</p>\n<ul>\n<li><strong>ABI is below 0.8</strong></li>\n<li>The patient is diabetic</li>\n</ul>\n<p>In the above situations, <strong>compression stocking causes more compromised arterial flow and makes the limb ischemia worse</strong>; therefore, specialist advice and close monitoring is strongly recommended.</p>\n<p><strong>Antibiotics are not indicated in uncomplicated venous ulcers.</strong> Diabetes is one of the most important predisposing factors in development of arterial ulcers. Although fasting glucose level may be considered for screening of diabetes, it is not a step in management here. <strong>HbA1C is used to monitor efficacy of or adherence to anti-hyperglycemic regimens, which is not the case here.</strong></p>\n<p><strong>Ulcer location by etiology</strong>:</p>\n<ul>\n<li><strong>Medial malleolus (gaiter area)</strong> → <strong>venous</strong> (most common)</li>\n<li><strong>Lateral malleolus, dorsum of foot, toes</strong> → <strong>arterial</strong></li>\n<li><strong>Pressure points (heel, malleoli)</strong> in immobilized → <strong>pressure</strong></li>\n</ul>", "references": "<ul>\n<li>http://www.racgp.org.au/afp/2012/may/venous-leg-ul</li>\n<li>http://www.racgp.org.au/afp/2014/september/managem</li>\n<li>http://www.awma.com.au/publications/2011_awma_vlug</li>\n<li>（待补：AWMA 静脉溃疡指南）</li>\n</ul>", "related": ["AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0271-PAD-Medical-Management", "AMC-Q0272-Critical-Limb-Ischemia-Referral", "MOC-Haematology", "Topic-Chronic-Wounds"], "bodyHtml": "", "diseases": ["DVT"], "complaints": [], "search": "静脉曲张溃疡 + abi 0.7 — 弹力袜**不安全**\nvenous leg ulcer compression stockings contraindication abi 0.7 diabetes bisggard regimen\ntreatment complications definition\n an 82-year-old man presents to your office complaining of an ulcer over the medial side of his leg just above the internal malleolus. he mentions that the wound has been there for the past 6 months, and worsened recently. the examination confirms the diagnosis of a venous ulcer. the ipsilateral ankle-brachial index is 0.7. which one of the following is correct regarding the management of this patient? \n correct answer is  a  \n  venous leg ulcers are the most common chronic wounds seen in general practice.  they account for 70-90% of chronic wounds. they tend to develop over the  medial distal leg (just above the internal malleolus) , and are usually painful. \n  the most important risk factor for development of a venous ulcer is previous deep vein thrombosis (dvt)  with consequent damage to venous structure and insufficiency. \n  most venous ulcers respond adequately to a conservative management called bisggard regimen.  this regimen has four components: 1. patient education 2. elevation of the foot 3.  elastic compression  4. evaluation \n  elastic compression is considered for every patient unless : \n \n  abi is below 0.8  \n the patient is diabetic \n \n in the above situations,  compression stocking causes more compromised arterial flow and makes the limb ischemia worse ; therefore, specialist advice and close monitoring is strongly recommended. \n  antibiotics are not indicated in uncomplicated venous ulcers.  diabetes is one of the most important predisposing factors in development of arterial ulcers. although fasting glucose level may be considered for screening of diabetes, it is not a step in management here.  hba1c is used to monitor efficacy of or adherence to anti-hyperglycemic regimens, which is not the case here.  \n  ulcer location by etiology : \n \n  medial malleolus (gaiter area)  →  venous  (most common) \n  lateral malleolus, dorsum of foot, toes  →  arterial  \n  pressure points (heel, malleoli)  in immobilized →  pressure  \n "}, {"id": "AMC-Q0279", "type": "mcq", "qid": 279, "title": "DVT + Wells 3 分（高）— 直接 Doppler（不先用 D-dimer）", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["investigation", "diagnosis", "definition"], "topic": ["DVT", "Modified Wells Score", "High Probability", "Doppler Ultrasound", "Post-Orthopedic Surgery"], "difficulty": 4, "correctAnswer": "A", "page": 69, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "wells-score", "doppler-ultrasound", "approach-investigation", "approach-diagnosis", "approach-definition"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-Q0279-DVT-Wells-Score-Doppler.md", "stem": "<p>A 79-year-old woman undergoes total hip replacement surgery. After 4 days, she develops a swollen right leg. The circumference of the right calf is 4 cm greater than that of the left leg. The right leg feels warm to touch and is slightly tender. Which one of the following is most appropriate diagnostic tool to use for a diagnosis?</p>", "options": [{"letter": "A", "text": "Duplex Doppler ultrasound"}, {"letter": "B", "text": "X-ray"}, {"letter": "C", "text": "Contrast venography"}, {"letter": "D", "text": "CT angiography"}, {"letter": "E", "text": "D-dimer assay"}], "rationale": "<p>1. <strong>题型识别</strong>：疑似 DVT + Wells 评分应用 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>79 岁、全髋置换术后 4 天（<strong>骨科术后 = VTE 高风险</strong>）</li>\n<li>患肢小腿围比健侧大 <strong>4 cm</strong>（> 3 cm = Wells 加分）</li>\n<li>患肢<strong>温热</strong> + 轻压痛</li>\n<p>3. <strong>Modified Wells Score for DVT</strong>（必背）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>临床特征</th><th>分</th></tr></thead>\n<tbody>\n<tr><td>Active cancer（6 月内治疗 / 姑息）</td><td>1</td></tr>\n<tr><td>Paralysis / paresis / 石膏固定</td><td>1</td></tr>\n<tr><td><strong>卧床 > 3 d / 大手术 12 周内</strong></td><td><strong>1</strong></td></tr>\n<tr><td>沿深静脉系统<strong>局部压痛</strong></td><td>1</td></tr>\n<tr><td><strong>整腿肿胀</strong></td><td>1</td></tr>\n<tr><td><strong>小腿围 > 健侧 3 cm</strong>（胫骨粗隆下 10 cm）</td><td><strong>1</strong></td></tr>\n<tr><td>患肢<strong>凹陷性水肿</strong></td><td>1</td></tr>\n<tr><td>浅表侧支（非曲张）</td><td>1</td></tr>\n<tr><td><strong>既往 DVT</strong></td><td>1</td></tr>\n<tr><td><strong>替代诊断 ≥ DVT 可能</strong></td><td>-2</td></tr>\n</tbody>\n</table>\n<ul>\n<li><strong>≥ 2：可能 DVT</strong></li>\n<li><strong>< 2：不太可能</strong></li>\n</ul>\n<p>4. <strong>本例评分</strong>：</p>\n<ul>\n<li>卧床 > 3 d（术后 4 d）= 1</li>\n<li>局部压痛 = 1</li>\n<li>小腿围 > 3 cm（4 cm）= 1</li>\n<li><strong>总计 = 3</strong>（<strong>高概率</strong>）</li>\n<p>5. <strong>处理路径</strong>：</p>\n<li><strong>Wells ≥ 2</strong> → <strong>直接 Doppler USG</strong></li>\n<li>Wells < 2 → 先 D-dimer，阴性排除</li>\n<p>6. <strong>选项排除</strong>：</p>\n<li>A (Doppler USG)：<strong>正确</strong></li>\n<li>B (X-ray)：看骨，<strong>不</strong>看血栓</li>\n<li>C (Venography)：金标准但<strong>有创</strong>，<strong>不</strong>是首选</li>\n<li>D (CT angio)：看<strong>动脉</strong>不是静脉</li>\n<li>E (D-dimer)：<strong>Wells 低</strong>才用；本例 Wells = 3（<strong>高</strong>）→ 不该先用</li>\n<p>7. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"D-dimer 总先用\"陷阱</strong>：错。<strong>Wells ≥ 2 直接 USG</strong>（D-dimer 在术后本来高，假阳性多）。</li>\n<li><strong>\"X-ray 看钙化\"陷阱</strong>：X-ray 看骨/钙化，<strong>不</strong>看软组织血栓。</li>\n<li><strong>\"Venography 总做\"陷阱</strong>：<strong>有创</strong>，<strong>不</strong>首选。</li>\n<li><strong>\"CT angio 看一切\"陷阱</strong>：CT angio 是<strong>动脉</strong>检查。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>This patient has suspected diagnosis of <strong>deep vein thrombosis (DVT) and requires urgent Doppler ultrasound</strong> to establish the diagnosis. <strong>Doppler ultrasound is more than 90% sensitive and more than 95% specific for thromboses within the femoral and popliteal veins</strong>, but less accurate for iliac or calf vein thromboses.</p>\n<p><strong>D-dimer is used for assessment of patients with Wells score of < 2.</strong></p>\n<p>A patient with symptoms and signs consistent with DVT should be assessed and the clinical (pretest) probability of acute DVT established by using a validated scoring system. If the clinical probability of DVT is low (< 2), a D-dimer assay should be performed; otherwise, the next step would be Doppler Duplex sonography.</p>\n<p><strong>Modified Wells' Score for DVT</strong>:</p>\n<table class='md-table'>\n<thead><tr><th>Clinical characteristic</th><th>Score</th></tr></thead>\n<tbody>\n<tr><td>Active cancer (treatment ongoing, administered within previous 6 months or palliative)</td><td>1</td></tr>\n<tr><td>Paralysis, paresis or recent plaster immobilization of the lower extremities</td><td>1</td></tr>\n<tr><td><strong>Recently bedridden > 3 days or major surgery within previous 12 weeks requiring general or regional anesthesia</strong></td><td><strong>1</strong></td></tr>\n<tr><td>Localized tenderness along the distribution of the deep venous system</td><td>1</td></tr>\n<tr><td>Swelling of entire leg</td><td>1</td></tr>\n<tr><td><strong>Calf swelling > 3 cm larger than asymptomatic side</strong> (measured 10 cm below tibial tuberosity)</td><td><strong>1</strong></td></tr>\n<tr><td>Pitting edema confined to the symptomatic leg</td><td>1</td></tr>\n<tr><td>Collateral superficial veins (non-varicose)</td><td>1</td></tr>\n<tr><td>Previously documented DVT</td><td>1</td></tr>\n<tr><td>Alternative diagnosis at least as likely as DVT</td><td>-2</td></tr>\n</tbody>\n</table>\n<p><strong>A score of ≥ 2 indicates that the probability of DVT is likely; a score of < 2 indicates that the probability of DVT is unlikely.</strong></p>\n<p><strong>This patient has been bedridden for more than 3 days (1 point), has localized tenderness (1 point) and the circumference of the affected leg is more than 3 cm greater than the unaffected leg (1 point). With a Wells' score of 3, she has high probability diagnosis of DVT and needs Doppler ultrasonography of the leg as the next step.</strong></p>\n<ul>\n<li>If the Wells' score was < 2 the next best step would have been <strong>D-dimer assay</strong> (option E). A negative D-dimer test excludes DVT (and pulmonary embolism), but positive values is only suggestive of DVT and further investigations would be needed.</li>\n<li>Previously, <strong>contrast venography (option C) was the definitive test</strong> for the diagnosis of DVT but has been largely replaced by ultrasonography, which is noninvasive, more readily available; however, <strong>it still remains the gold-standard for diagnosis of DVT</strong> (not in practice). While a Doppler ultrasound can establish the diagnosis, <strong>there is no need for CT angiography (option D) unless accurate anatomical site of the thrombus is required for surgical intervention</strong> (very rarely indicated).</li>\n</ul>", "references": "<ul>\n<li>http://www.racgp.org.au/download/documents/AFP/201</li>\n<li>http://emedicine.medscape.com/article/1911303-work</li>\n<li>http://www.emedicine.medscape.com/article/1911303-</li>\n<li>（待补：ASH 2024 DVT 诊断指南）</li>\n</ul>", "related": ["AMC-Q0274-DVT-Diagnosis-Doppler-USG", "AMC-Q0275-DVT-Treatment-Heparin", "AMC-Q0273-VTE-Risk-Heart-Failure", "MOC-Haematology", "Topic-Wells-Score"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "dvt + wells 3 分（高）— 直接 doppler（不先用 d-dimer）\ndvt modified wells score high probability doppler ultrasound post-orthopedic surgery\ninvestigation diagnosis definition\n a 79-year-old woman undergoes total hip replacement surgery. after 4 days, she develops a swollen right leg. the circumference of the right calf is 4 cm greater than that of the left leg. the right leg feels warm to touch and is slightly tender. which one of the following is most appropriate diagnostic tool to use for a diagnosis? \n correct answer is  a  \n this patient has suspected diagnosis of  deep vein thrombosis (dvt) and requires urgent doppler ultrasound  to establish the diagnosis.  doppler ultrasound is more than 90% sensitive and more than 95% specific for thromboses within the femoral and popliteal veins , but less accurate for iliac or calf vein thromboses. \n  d-dimer is used for assessment of patients with wells score of   \n a patient with symptoms and signs consistent with dvt should be assessed and the clinical (pretest) probability of acute dvt established by using a validated scoring system. if the clinical probability of dvt is low ( \n  modified wells' score for dvt : \n \n   clinical characteristic  score   \n \n  active cancer (treatment ongoing, administered within previous 6 months or palliative)  1  \n  paralysis, paresis or recent plaster immobilization of the lower extremities  1  \n   recently bedridden > 3 days or major surgery within previous 12 weeks requiring general or regional anesthesia    1   \n  localized tenderness along the distribution of the deep venous system  1  \n  swelling of entire leg  1  \n   calf swelling > 3 cm larger than asymptomatic side  (measured 10 cm below tibial tuberosity)   1   \n  pitting edema confined to the symptomatic leg  1  \n  collateral superficial veins (non-varicose)  1  \n  previously documented dvt  1  \n  alternative diagnosis at least as likely as dvt  -2  \n \n \n  a score of ≥ 2 indicates that the probability of dvt is likely; a score of   \n  this patient has been bedridden for more than 3 days (1 point), has localized tenderness (1 point) and the circumference of the affected leg is more than 3 cm greater than the unaffected leg (1 point). with a wells' score of 3, she has high probability diagnosis of dvt and needs doppler ultrasonography of the leg as the next step.  \n \n if the wells' score was  d-dimer assay  (option e). a negative d-dimer test excludes dvt (and pulmonary embolism), but positive values is only suggestive of dvt and further investigations would be needed. \n previously,  contrast venography (option c) was the definitive test  for the diagnosis of dvt but has been largely replaced by ultrasonography, which is noninvasive, more readily available; however,  it still remains the gold-standard for diagnosis of dvt  (not in practice). while a doppler ultrasound can establish the diagnosis,  there is no need for ct angiography (option d) unless accurate anatomical site of the thrombus is required for surgical intervention  (very rarely indicated). \n "}, {"id": "AMC-QNA-P009", "type": "mcq", "qid": 0, "title": "DVT 后管理 — Caval Filter 适用什么情况？", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "prevention", "complications"], "topic": ["Deep Vein Thrombosis", "Anticoagulation", "Inferior Vena Cava Filter", "Contraindications to Anticoagulation"], "difficulty": 4, "correctAnswer": "E", "page": 9, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "anticoagulation", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-QNA-P009-DVT-Management-With-IVC-Filter.md", "stem": "<p><strong>John, 35 years old</strong>, presents to the emergency department with <strong>pain and swelling of his left thigh</strong> since this morning. Investigations establish the diagnosis of <strong>deep venous thrombosis (DVT)</strong> for which he is started on <strong>heparin in hospital</strong>.</p>\n<p>He has <strong>diabetes</strong> and <strong>hypertension</strong>, and his wife mentions he is very busy and distracted and <strong>always forgets to take the drugs</strong> he is prescribed for his hypertension and diabetes.</p>\n<p>Which one of the following options would be the <strong>most appropriate management</strong> for him after the course of heparin is completed?</p>", "options": [{"letter": "A", "text": "No more treatment is needed"}, {"letter": "B", "text": "Warfarin for 6 months"}, {"letter": "C", "text": "Aspirin for 6 months"}, {"letter": "D", "text": "Surgical intervention"}, {"letter": "E", "text": "Caval filter"}], "rationale": "<p>1. <strong>题型识别</strong>：诊断已明（DVT，已用 heparin 急性处理）→ 问\"heparin 完成后\"的长期策略。 2. <strong>标准 DVT 管理路径</strong>：</p>\n<ul>\n<li><strong>急性</strong>：UFH 或 LMWH → Warfarin 重叠 5d，INR > 2 连两次后停肝素</li>\n<li><strong>长期</strong>：Warfarin ≥ 3 个月（按再发风险调整）</li>\n<p>3. <strong>本题关键差异化线索</strong>：妻子说他\"总忘记吃药\" → <strong>依从性差 → 不能可靠 long-term 抗凝</strong> 4. <strong>IVC filter 适用情境</strong>（interpretation 来源 explanation）：</p>\n<li><strong>抗凝禁忌</strong>：出血性卒中、近期神经手术/大手术、大创伤、活动出血、颅内肿瘤、出血体质、妊娠、易跌倒</li>\n<li><strong>抗凝依从性差</strong>：本题情境 ✔</li>\n<li><strong>抗凝失败</strong>：抗凝过程中复发</li>\n<p>5. <strong>逐项匹配</strong>：</p>\n<li>A 不治 → ✘ 标准必须 ≥ 3 月抗凝</li>\n<li>B Warfarin 6m → 标准，但是患者依从性差 → 风险高</li>\n<li>C Aspirin → ✘ DVT 后抗血小板不等于抗凝</li>\n<li>D 手术 → ✘ 极特殊例外，不在此题适用</li>\n<li><strong>E IVC filter → ✔</strong> 因为 <em>无法可靠抗凝</em></li>\n<p>6. <strong>锁定 E</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"标准答案\"陷阱</strong>：看到 DVT 直觉选 Warfarin，但 <em>忽略依从性</em> 提示 → 错选 B。</li>\n<li><strong>抗凝禁忌清单容易漏</strong>：出血体质、近期手术、怀孕、易跌倒都算禁忌。</li>\n<li><strong>IVC filter ≠ 治愈 DVT</strong>：它仅 <em>防 PE</em>，DVT 本身仍可能进展，需随访。</li>\n<li><strong>Aspirin ≠ Anticoagulant</strong>：抗血小板不等于抗凝 → 不能替代 Warfarin。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>E</strong></p>\n<p><strong>Treatment of DVT starts</strong>: 1. <strong>UFH or LMWH</strong> 2. Warfarin 同日（或 48h 内）启动 3. Heparin 在 INR > 2 连两次后停 4. <strong>Warfarin 持续 ≥ 3 个月</strong></p>\n<p><strong>Caval filters</strong> = systemic anticoagulation 的替代，适用于：</p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>具体条件</th></tr></thead>\n<tbody>\n<tr><td><strong>抗凝禁忌</strong></td><td>出血性卒中、近期神经/大手术、大或多发创伤、活动出血、颅内肿瘤、出血体质（ITP、血友病）、<strong>妊娠</strong>、易跌倒（卒中后、PD）</td></tr>\n<tr><td><strong>抗凝依从差</strong></td><td><strong>本题情境</strong></td></tr>\n<tr><td><strong>抗凝并发症</strong></td><td>抗凝中出血</td></tr>\n<tr><td><strong>抗凝失败</strong></td><td>充分抗凝仍发 PE</td></tr>\n</tbody>\n</table>\n<p><strong>Pre-heparin labs</strong> (出血 / 易栓筛查)：</p>\n<ul>\n<li>APTT、INR、Platelet count</li>\n<li>Thrombophilia screen：APC resistance、homocysteine、prothrombin G20210A、ATIII、protein C、protein S、lupus anticoagulant、anticardiolipin Ab</li>\n</ul>\n<p><strong>临床注意点</strong>：</p>\n<ul>\n<li>33% 患者在\"充分抗凝\"中仍发 PE</li>\n<li>IVC filter 是预防 PE，DVT 仍需处理</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/419796-overv</li>\n<li>http://www.ncbi.nlm.nih.gov/pubmed/22698970</li>\n</ul>", "related": ["AMC-QNA-P006-Orthostatic-Hypotension", "TR-DVT-Prophylaxis-Indications", "Topic-Anticoagulation-Management", "Topic-IVC-Filter-Indications"], "bodyHtml": "", "diseases": ["DVT"], "complaints": [], "search": "dvt 后管理 — caval filter 适用什么情况？\ndeep vein thrombosis anticoagulation inferior vena cava filter contraindications to anticoagulation\ntreatment prevention complications\n  john, 35 years old , presents to the emergency department with  pain and swelling of his left thigh  since this morning. investigations establish the diagnosis of  deep venous thrombosis (dvt)  for which he is started on  heparin in hospital . \n he has  diabetes  and  hypertension , and his wife mentions he is very busy and distracted and  always forgets to take the drugs  he is prescribed for his hypertension and diabetes. \n which one of the following options would be the  most appropriate management  for him after the course of heparin is completed? \n correct answer is  e  \n  treatment of dvt starts : 1.  ufh or lmwh  2. warfarin 同日（或 48h 内）启动 3. heparin 在 inr > 2 连两次后停 4.  warfarin 持续 ≥ 3 个月  \n  caval filters  = systemic anticoagulation 的替代，适用于： \n \n   类别  具体条件   \n \n   抗凝禁忌   出血性卒中、近期神经/大手术、大或多发创伤、活动出血、颅内肿瘤、出血体质（itp、血友病）、 妊娠 、易跌倒（卒中后、pd）  \n   抗凝依从差    本题情境   \n   抗凝并发症   抗凝中出血  \n   抗凝失败   充分抗凝仍发 pe  \n \n \n  pre-heparin labs  (出血 / 易栓筛查)： \n \n aptt、inr、platelet count \n thrombophilia screen：apc resistance、homocysteine、prothrombin g20210a、atiii、protein c、protein s、lupus anticoagulant、anticardiolipin ab \n \n  临床注意点 ： \n \n 33% 患者在\"充分抗凝\"中仍发 pe \n ivc filter 是预防 pe，dvt 仍需处理 \n "}, {"id": "AMC-QNA-P011", "type": "mcq", "qid": 11, "title": "孕妇 DVT — 治疗性 LMWH", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["treatment", "prevention", "complications"], "topic": ["DVT", "Pregnancy", "Anticoagulation", "LMWH", "Warfarin Embryopathy"], "difficulty": 4, "correctAnswer": "A", "page": 11, "tags": ["mcq", "amc", "haematology", "adult-internal-medicine", "dvt", "pregnancy", "anticoagulation", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-haematology", "color": "#9b3d62", "file": "01-Adult-Internal-Medicine/Haematology/AMC-QNA-P011-DVT-Pregnancy-LMWH.md", "stem": "<p>A 32-year-old pregnant woman presents to the Emergency Department at 32 weeks pregnancy with right calf swelling and tenderness which is diagnosed as deep vein thrombosis (DVT). Which one of the following is the most appropriate management?</p>", "options": [{"letter": "A", "text": "Therapeutic dose of low molecular weight heparin for 3 months"}, {"letter": "B", "text": "Prophylactic dose of low molecular weight heparin for 3 months"}, {"letter": "C", "text": "No treatment is needed"}, {"letter": "D", "text": "Termination of pregnancy"}, {"letter": "E", "text": "Start her on warfarin and continue for 6 months with strict INR monitoring"}], "rationale": "<p>1. <strong>题型识别</strong>：妊娠期 + 抗凝药选择 → 排除题（哪一项最合适）。 2. <strong>临床关键信息</strong>：</p>\n<ul>\n<li>32 周孕妇</li>\n<li>确诊 DVT</li>\n<p>3. <strong>治疗路径</strong>：</p>\n<li>妊娠期 DVT → 治疗剂量 LMWH（皮下注射）</li>\n<li>持续到分娩（约 8 周）+ 产后 6 周 ≥ 14 周</li>\n<li>总疗程 ≥ 3 个月（12 周）= 选项 A</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>B：预防剂量不够（已有 DVT 需治疗）</li>\n<li>C：DVT 不治 → PE 致死</li>\n<li>D：终止妊娠 — 无医学指征</li>\n<li>E：Warfarin 妊娠期<strong>致畸</strong>（6-13 周暴露 → 5% 胎儿 warfarin 综合征）</li>\n<p>5. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>E 看似合理但致命</strong>：Warfarin 6 个月 + INR 监测是 <em>非妊娠</em> DVT 的标准方案，但<strong>妊娠期绝对禁忌</strong>。容易中招因为其它抗凝细节（3 个月、INR 监测）都对。</li>\n<li><strong>A vs B</strong>：治疗剂量（1 mg/kg bid）vs 预防剂量（enoxaparin 40 mg qd）差 10 倍。已有血栓 → 治疗剂量。</li>\n<li><strong>产后处理</strong>：3 个月治疗期结束后，可考虑改预防剂量再 3 个月（解释里提到）。</li>\n<li><strong>PE 患者例外</strong>：血流动力学不稳的 PE → 起始用未分级肝素（UH），稳定后切换 LMWH。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>Current guidelines recommend that pregnant women with deep vein thrombosis (DVT) should be started on <strong>therapeutic dose of subcutaneous low molecular weight heparin (LMWH)</strong> for the remainder of their pregnancy and at least 6 weeks postpartum. A minimum of 3 months (12 weeks) of treatment with therapeutic dose must be provided.</p>\n<ul>\n<li><strong>PE 患者</strong>（无论是否妊娠）：起始用未分级肝素（UH），稳定后切 LMWH。</li>\n<li><strong>近端 DVT / PE</strong>：疗程最少 6 个月。</li>\n<li>本例 32 周起病，剩约 8 周孕期 + 6 周产后 = 14 周治疗，产后另加 3 个月预防剂量。</li>\n</ul>\n<p><strong>Warfarin 妊娠期禁忌</strong>：</p>\n<ul>\n<li><strong>Warfarin embryopathy (fetal warfarin syndrome / DiSala syndrome)</strong> 发生于孕 6-13 周暴露</li>\n<li>5% 胎儿受累</li>\n<li>表现：</li>\n<li>鼻梁发育不全（hypoplasia of nasal bridge）、鼻尖深沟</li>\n<li>喉软骨软化病（laryngomalacia）</li>\n<li>鸡胸（pectus carinatum）</li>\n<li>乳头间距过宽</li>\n<li>先天性心脏病</li>\n<li>脑室扩大、胼胝体发育不全</li>\n<li>点状骨骺（stippled epiphyses）</li>\n<li>短指（brachydactyly）、甲发育不全</li>\n<li>重度智力低下、耳聋、肌张力低、喂养困难</li>\n<li>低出生体重、生长迟缓</li>\n<li>孕中 / 晚期暴露：额外 5% 胎儿脑出血风险</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular (Per Page 11 PDF)</li>\n<li>（待补：ASH/ACOG 妊娠期 VTE 指南链接）</li>\n</ul>", "related": ["AMC-QNA-P009-DVT-Management-With-IVC-Filter", "TR-DVT-Prophylaxis-Indications", "MOC-Haematology", "Topic-VTE-in-Pregnancy"], "bodyHtml": "", "diseases": ["DVT"], "complaints": ["leg pain/swelling"], "search": "孕妇 dvt — 治疗性 lmwh\ndvt pregnancy anticoagulation lmwh warfarin embryopathy\ntreatment prevention complications\n a 32-year-old pregnant woman presents to the emergency department at 32 weeks pregnancy with right calf swelling and tenderness which is diagnosed as deep vein thrombosis (dvt). which one of the following is the most appropriate management? \n correct answer is  a  \n current guidelines recommend that pregnant women with deep vein thrombosis (dvt) should be started on  therapeutic dose of subcutaneous low molecular weight heparin (lmwh)  for the remainder of their pregnancy and at least 6 weeks postpartum. a minimum of 3 months (12 weeks) of treatment with therapeutic dose must be provided. \n \n  pe 患者 （无论是否妊娠）：起始用未分级肝素（uh），稳定后切 lmwh。 \n  近端 dvt / pe ：疗程最少 6 个月。 \n 本例 32 周起病，剩约 8 周孕期 + 6 周产后 = 14 周治疗，产后另加 3 个月预防剂量。 \n \n  warfarin 妊娠期禁忌 ： \n \n  warfarin embryopathy (fetal warfarin syndrome / disala syndrome)  发生于孕 6-13 周暴露 \n 5% 胎儿受累 \n 表现： \n 鼻梁发育不全（hypoplasia of nasal bridge）、鼻尖深沟 \n 喉软骨软化病（laryngomalacia） \n 鸡胸（pectus carinatum） \n 乳头间距过宽 \n 先天性心脏病 \n 脑室扩大、胼胝体发育不全 \n 点状骨骺（stippled epiphyses） \n 短指（brachydactyly）、甲发育不全 \n 重度智力低下、耳聋、肌张力低、喂养困难 \n 低出生体重、生长迟缓 \n 孕中 / 晚期暴露：额外 5% 胎儿脑出血风险 \n "}, {"id": "TR-Second-Degree-AV-Block", "type": "tr", "qid": 0, "title": "二度房室传导阻滞（Mobitz I & II）— 知识总结", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis", "physical-exam"], "topic": ["Second-Degree (Mobitz) Heart Block — 二度房室传导阻滞"], "difficulty": 0, "correctAnswer": "", "page": 0, "tags": ["topic-review", "amc", "cardiology", "av-block", "mobitz", "wenckebach", "ecg", "approach-investigation", "approach-diagnosis", "approach-physical-exam"], "cssclass": "tr-cardiology", "color": "#e05a6e", "file": "02-Topic-Reviews/Cardiology/TR-Second-Degree-AV-Block.md", "stem": "<p><strong>二度 AVB</strong> = 部分 P 波不下传（间断性 P 后无 QRS）。分两型，机制、ECG、预后、治疗<strong>完全不同</strong>。</p>\n<ul>\n<li><strong>Mobitz I (Wenckebach)</strong>：PR 逐渐延长直至脱落 → 多为 AV 结病变、良性</li>\n<li><strong>Mobitz II</strong>：PR 恒定、突发脱落 → His-Purkinje 系统病变、可进展为三度 → 高危</li>\n</ul>\n<hr>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p><strong>二度 AVB</strong> = 部分 P 波不下传（间断性 P 后无 QRS）。分两型，机制、ECG、预后、治疗<strong>完全不同</strong>。</p>\n<ul>\n<li><strong>Mobitz I (Wenckebach)</strong>：PR 逐渐延长直至脱落 → 多为 AV 结病变、良性</li>\n<li><strong>Mobitz II</strong>：PR 恒定、突发脱落 → His-Purkinje 系统病变、可进展为三度 → 高危</li>\n</ul>\n<hr>\n<h3>Mobitz I (Wenckebach) — ECG 特征</h3>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>说明</th></tr></thead>\n<tbody>\n<tr><td>PR 间期</td><td>逐搏<strong>逐渐延长</strong>直到 P 后无 QRS</td></tr>\n<tr><td>PR 增量</td><td>第一个增量最大，后续增量递减</td></tr>\n<tr><td>脱落后 PR</td><td><strong>缩短</strong>（回到基线，重新开始循环）</td></tr>\n<tr><td>漏搏间歇</td><td>< 漏搏前两个 RR 之和（典型的\"短长\"特征）</td></tr>\n<tr><td>长序列 (>6:5)</td><td>增量可能极微小直到最后一个 P 突然大脱漏</td></tr>\n<tr><td>关键诊断要点</td><td><strong>脱落后 PR 缩短</strong>（regardless of periodicity 典型与否）</td></tr>\n<tr><td>R-R 关系</td><td>R-R 随 PR 延长而<strong>缩短</strong>（反直觉）</td></tr>\n<tr><td>逸搏</td><td>可有 junctional escape beats 伴 non-conducted P</td></tr>\n</tbody>\n</table>\n<hr>\n<h3>Mobitz II — ECG 特征</h3>\n<table class='md-table'>\n<thead><tr><th>特征</th><th>说明</th></tr></thead>\n<tbody>\n<tr><td>PR 间期</td><td><strong>恒定</strong>（多个连续下传 P 的 PR 相同）</td></tr>\n<tr><td>脱落</td><td>突然一个 P 后<strong>无 QRS</strong></td></tr>\n<tr><td>脱落后 PR</td><td>与脱落前 PR <strong>相同</strong>（不像 Mobitz I 重置）</td></tr>\n<tr><td>漏搏间歇</td><td><strong>= 2× 窦性周期</strong>（精确双倍）</td></tr>\n<tr><td>QRS</td><td>常<strong>宽</strong>（阻滞在 His 以下）</td></tr>\n<tr><td>高危</td><td>可突然进展为<strong>完全性 AVB / 心脏停搏</strong></td></tr>\n</tbody>\n</table>\n<p>⚠️ Mobitz I vs II 的核心鉴别：<strong>PR 是否恒定</strong>。 恒定 → Mobitz II（高危） 渐变 → Mobitz I（多良性）</p>\n<hr>\n<h3>临床意义 / 处理</h3>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>临床意义</th><th>处理</th></tr></thead>\n<tbody>\n<tr><td><strong>Mobitz I</strong></td><td>多为 AV 结病变，迷走张力、缺血、药物（BB、CCB、地高辛）、下壁 MI</td><td>多数无需起搏；停用可疑药物；处理基础病</td></tr>\n<tr><td><strong>Mobitz II</strong></td><td>多为 His-Purkinje 系统病变，前壁 MI、传导系统退行性变</td><td><strong>临时起搏指征</strong>；之后<strong>永久起搏</strong></td></tr>\n</tbody>\n</table>\n<p><strong>临时起搏指征</strong>：</p>\n<ul>\n<li>Asystole 病史</li>\n<li><strong>Mobitz II AVB</strong></li>\n<li>完全性 AVB</li>\n<li>心室停搏 > 3 s</li>\n<li>症状性窦缓 / 窦停，阿托品失败后</li>\n</ul>\n<hr>\n<h3>阿托品位置</h3>\n<ul>\n<li>AV 结水平阻滞（如 Mobitz I）→ 阿托品可改善</li>\n<li>His-Purkinje 水平阻滞（Mobitz II）→ <strong>阿托品常无效</strong>（题中典型表述：\"atropine used but pulse remains the same\"）</li>\n<li>阿托品无效后 → 升级到临时起搏</li>\n</ul>\n<hr>\n<h3>常见考点（高频）</h3>\n<ul>\n<li><strong>\"PR 是否恒定\" → I vs II 鉴别核心</strong></li>\n<li>Mobitz II 几乎<strong>都需要</strong>起搏（临时 → 永久）</li>\n<li>Mobitz I 大多<strong>无需</strong>起搏</li>\n<li>漏搏间歇<strong>精确 2× 窦性周期</strong> = Mobitz II 标志</li>\n<li>漏搏间歇<strong>< 2× 窦性周期</strong> = Mobitz I（PR 增量递减）</li>\n<li>宽 QRS + 恒定 PR + 突发脱落 = Mobitz II（典型\"高危组合\"）</li>\n</ul>\n<hr>", "diseases": ["AV Block (2°)"], "complaints": [], "search": "二度房室传导阻滞（mobitz i & ii）— 知识总结\nsecond-degree (mobitz) heart block — 二度房室传导阻滞\ninvestigation diagnosis physical-exam\n  二度 avb  = 部分 p 波不下传（间断性 p 后无 qrs）。分两型，机制、ecg、预后、治疗 完全不同 。 \n \n  mobitz i (wenckebach) ：pr 逐渐延长直至脱落 → 多为 av 结病变、良性 \n  mobitz ii ：pr 恒定、突发脱落 → his-purkinje 系统病变、可进展为三度 → 高危 \n \n \n 概要 \n  二度 avb  = 部分 p 波不下传（间断性 p 后无 qrs）。分两型，机制、ecg、预后、治疗 完全不同 。 \n \n  mobitz i (wenckebach) ：pr 逐渐延长直至脱落 → 多为 av 结病变、良性 \n  mobitz ii ：pr 恒定、突发脱落 → his-purkinje 系统病变、可进展为三度 → 高危 \n \n \n mobitz i (wenckebach) — ecg 特征 \n \n   特征  说明   \n \n  pr 间期  逐搏 逐渐延长 直到 p 后无 qrs  \n  pr 增量  第一个增量最大，后续增量递减  \n  脱落后 pr   缩短 （回到基线，重新开始循环）  \n  漏搏间歇    \n  长序列 (>6:5)  增量可能极微小直到最后一个 p 突然大脱漏  \n  关键诊断要点   脱落后 pr 缩短 （regardless of periodicity 典型与否）  \n  r-r 关系  r-r 随 pr 延长而 缩短 （反直觉）  \n  逸搏  可有 junctional escape beats 伴 non-conducted p  \n \n \n \n mobitz ii — ecg 特征 \n \n   特征  说明   \n \n  pr 间期   恒定 （多个连续下传 p 的 pr 相同）  \n  脱落  突然一个 p 后 无 qrs   \n  脱落后 pr  与脱落前 pr  相同 （不像 mobitz i 重置）  \n  漏搏间歇   = 2× 窦性周期 （精确双倍）  \n  qrs  常 宽 （阻滞在 his 以下）  \n  高危  可突然进展为 完全性 avb / 心脏停搏   \n \n \n ⚠️ mobitz i vs ii 的核心鉴别： pr 是否恒定 。 恒定 → mobitz ii（高危） 渐变 → mobitz i（多良性） \n \n 临床意义 / 处理 \n \n   类型  临床意义  处理   \n \n   mobitz i   多为 av 结病变，迷走张力、缺血、药物（bb、ccb、地高辛）、下壁 mi  多数无需起搏；停用可疑药物；处理基础病  \n   mobitz ii   多为 his-purkinje 系统病变，前壁 mi、传导系统退行性变   临时起搏指征 ；之后 永久起搏   \n \n \n  临时起搏指征 ： \n \n asystole 病史 \n  mobitz ii avb  \n 完全性 avb \n 心室停搏 > 3 s \n 症状性窦缓 / 窦停，阿托品失败后 \n \n \n 阿托品位置 \n \n av 结水平阻滞（如 mobitz i）→ 阿托品可改善 \n his-purkinje 水平阻滞（mobitz ii）→  阿托品常无效 （题中典型表述：\"atropine used but pulse remains the same\"） \n 阿托品无效后 → 升级到临时起搏 \n \n \n 常见考点（高频） \n \n  \"pr 是否恒定\" → i vs ii 鉴别核心  \n mobitz ii 几乎 都需要 起搏（临时 → 永久） \n mobitz i 大多 无需 起搏 \n 漏搏间歇 精确 2× 窦性周期  = mobitz ii 标志 \n 漏搏间歇   = mobitz i（pr 增量递减） \n 宽 qrs + 恒定 pr + 突发脱落 = mobitz ii（典型\"高危组合\"） \n \n "}, {"id": "TR-Tilt-Table-Test", "type": "tr", "qid": 0, "title": "Tilt Table Test (倾斜试验) — 知识总结", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation"], "topic": ["Tilt Table Test — 倾斜试验 / Syncope 评估"], "difficulty": 0, "correctAnswer": "", "page": 7, "tags": ["topic-review", "amc", "cardiology", "syncope", "autonomic", "approach-investigation"], "cssclass": "tr-cardiology", "color": "#e05a6e", "file": "02-Topic-Reviews/Cardiology/TR-Tilt-Table-Test.md", "stem": "<p>Tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射，<strong>重现</strong> 患者症状 + 体征。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>概要</h3>\n<p>Tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射，<strong>重现</strong> 患者症状 + 体征。</p>\n<h3>原理</h3>\n<ul>\n<li>平卧位 → 60-80° 直立，监测 BP + HR + ECG + 症状</li>\n<li>持续 45 min</li>\n<li>可加 isoproterenol 等药物激发</li>\n<li>灵敏度 30-80%（依 protocol），假阳性 10-15%</li>\n</ul>\n<h3>反应模式 / 判读</h3>\n<table class='md-table'>\n<thead><tr><th>反应模式</th><th>提示病因</th></tr></thead>\n<tbody>\n<tr><td><strong>HR ↓ + BP ↓</strong></td><td><strong>Vasovagal / neurocardiogenic syncope</strong>（典型）</td></tr>\n<tr><td><strong>仅 HR ↓</strong></td><td>Cardioinhibitory type</td></tr>\n<tr><td><strong>仅 BP ↓</strong></td><td>Vasodepressor type</td></tr>\n<tr><td><strong>BP 缓慢下降，HR 几乎不变</strong></td><td><strong>Dysautonomic pattern</strong>（自主神经功能不全）</td></tr>\n<tr><td><strong>HR ↑ > 30 bpm，BP 几乎不变</strong></td><td><strong>POTS</strong>（Postural Orthostatic Tachycardia Syndrome）</td></tr>\n<tr><td><strong>报告 syncope，无血流动力学改变</strong></td><td><strong>Psychogenic syncope</strong></td></tr>\n</tbody>\n</table>\n<p>阳性判读：出现 syncope / presyncope + 与症状一致的 HR/BP 变化。<strong>单纯心率翻倍不算阳性</strong>。</p>\n<h3>相对禁忌</h3>\n<ul>\n<li><strong>Severe aortic / mitral stenosis</strong></li>\n<li><strong>Hypertrophic cardiomyopathy</strong></li>\n<li><strong>Severe CAD</strong></li>\n</ul>\n<p>Isoproterenol 禁忌在 HCM / 严重 CAD 中使用。</p>\n<h3>临床要点</h3>\n<ul>\n<li><strong>阳性 + 临床表现</strong> ⇒ Vasovagal syncope 可能性大</li>\n<li><strong>阴性</strong> <em>不</em> 排除 vasovagal（灵敏度有限）</li>\n<li><strong>不是诊断心律失常性 syncope 的可靠工具</strong> — 心律失常性需另查 Holter/EP</li>\n<li>评估 POTS 时是核心检查</li>\n</ul>\n<h3>共识管理（一线 → 二线）</h3>\n<table class='md-table'>\n<thead><tr><th>阶</th><th>措施</th></tr></thead>\n<tbody>\n<tr><td><strong>一</strong></td><td>↑ 钠 + 水摄入；physical counterpressure；起身缓慢</td></tr>\n<tr><td><strong>二</strong></td><td>Fludrocortisone（盐皮质激素 → 保钠扩容）</td></tr>\n<tr><td><strong>特殊</strong></td><td>Midodrine、pyridostigmine（autonomic failure）</td></tr>\n</tbody>\n</table>\n<h3>常见考点（高频）</h3>\n<ul>\n<li>直立性低血压 BP 标准：SBP ↓ ≥ 20 / DBP ↓ ≥ 10 mmHg</li>\n<li>Tilt test 不诊断 <em>心律失常</em> syncopes</li>\n<li>HCM + tilt test + isoproterenol → 风险高</li>\n<li>慢性直立性低血压病因：age、drugs、autonomic dysfunction</li>\n</ul>", "diseases": ["Syncope"], "complaints": [], "search": "tilt table test (倾斜试验) — 知识总结\ntilt table test — 倾斜试验 / syncope 评估\ninvestigation\n tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射， 重现  患者症状 + 体征。 \n 概要 \n tilt table testing 在可控条件下最大化下肢静脉池，触发 vasovagal (neurocardiogenic) 反射， 重现  患者症状 + 体征。 \n 原理 \n \n 平卧位 → 60-80° 直立，监测 bp + hr + ecg + 症状 \n 持续 45 min \n 可加 isoproterenol 等药物激发 \n 灵敏度 30-80%（依 protocol），假阳性 10-15% \n \n 反应模式 / 判读 \n \n   反应模式  提示病因   \n \n   hr ↓ + bp ↓    vasovagal / neurocardiogenic syncope （典型）  \n   仅 hr ↓   cardioinhibitory type  \n   仅 bp ↓   vasodepressor type  \n   bp 缓慢下降，hr 几乎不变    dysautonomic pattern （自主神经功能不全）  \n   hr ↑ > 30 bpm，bp 几乎不变    pots （postural orthostatic tachycardia syndrome）  \n   报告 syncope，无血流动力学改变    psychogenic syncope   \n \n \n 阳性判读：出现 syncope / presyncope + 与症状一致的 hr/bp 变化。 单纯心率翻倍不算阳性 。 \n 相对禁忌 \n \n  severe aortic / mitral stenosis  \n  hypertrophic cardiomyopathy  \n  severe cad  \n \n isoproterenol 禁忌在 hcm / 严重 cad 中使用。 \n 临床要点 \n \n  阳性 + 临床表现  ⇒ vasovagal syncope 可能性大 \n  阴性   不  排除 vasovagal（灵敏度有限） \n  不是诊断心律失常性 syncope 的可靠工具  — 心律失常性需另查 holter/ep \n 评估 pots 时是核心检查 \n \n 共识管理（一线 → 二线） \n \n   阶  措施   \n \n   一   ↑ 钠 + 水摄入；physical counterpressure；起身缓慢  \n   二   fludrocortisone（盐皮质激素 → 保钠扩容）  \n   特殊   midodrine、pyridostigmine（autonomic failure）  \n \n \n 常见考点（高频） \n \n 直立性低血压 bp 标准：sbp ↓ ≥ 20 / dbp ↓ ≥ 10 mmhg \n tilt test 不诊断  心律失常  syncopes \n hcm + tilt test + isoproterenol → 风险高 \n 慢性直立性低血压病因：age、drugs、autonomic dysfunction \n "}, {"id": "TR-DVT-Prophylaxis-Indications", "type": "tr", "qid": 0, "title": "VTE Prophylaxis 高危人群 + 抗凝替代 — 知识总结", "department": "Adult Internal Medicine", "subcategory": "Haematology", "rawSubcategory": "Haematology", "approach": ["prevention"], "topic": ["VTE Prophylaxis Indications — 高危人群 / 抗凝禁忌"], "difficulty": 0, "correctAnswer": "", "page": 10, "tags": ["topic-review", "amc", "haematology", "VTE", "prophylaxis", "approach-prevention"], "cssclass": "tr-haematology", "color": "#9b3d62", "file": "02-Topic-Reviews/Haematology/TR-DVT-Prophylaxis-Indications.md", "stem": "<p><!-- category-banner: tr-haematology --> 💉 <strong>Haematology (Topic Review)</strong> · CSS class: <code>tr-haematology</code></p>\n<p>考点类型（approach）：<strong>预防</strong></p>\n<p>颜色通过 <code>category-colors.css</code> 着色（<code>Settings → Appearance → CSS snippets</code> 启用）。 # VTE Prophylaxis 高危人群 + 抗凝替代 — 知识总结</p>\n<p>适用上下文：识别高 VTE 风险患者（cancer、trauma）；理解 <em>抗凝禁忌 / 依从性差</em> 时的替代方案（IVC filter）。</p>", "options": [], "rationale": "", "traps": "", "summary": "", "explanation": "", "references": "", "related": [], "bodyHtml": "<h3>高 VTE 风险人群（要点）</h3>\n<p>### 患者群体</p>\n<ul>\n<li><strong>Cancer 患者</strong>（尤其活动期 / 化疗）</li>\n<li><strong>Trauma 患者</strong>，包括：</li>\n<li>严重头部创伤 + 长期机械通气</li>\n<li>主要腹部/盆腔穿通性静脉伤</li>\n<li>脊髓损伤（伴或不伴瘫痪）</li>\n<li>严重头部创伤 + 多发下肢骨折</li>\n<li>骨盆骨折（伴或不伴下肢骨折）</li>\n</ul>\n<p>### 风险因素汇总</p>\n<ul>\n<li><strong>既往 VTE</strong></li>\n<li>长期制动 / ICU 长期卧床</li>\n<li>大手术（特别 orthopedic、neuro、oncology）</li>\n<li>高凝状态（cancer、thrombophilia）</li>\n<li>妊娠 / 产褥期</li>\n<li>OCP / HRT</li>\n</ul>\n<h3>抗凝禁忌（这些情况下考虑替代）</h3>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>具体</th></tr></thead>\n<tbody>\n<tr><td>神经</td><td>出血性卒中、近期神经手术</td></tr>\n<tr><td>外科</td><td>近期大手术</td></tr>\n<tr><td>创伤</td><td>大/多发创伤</td></tr>\n<tr><td>出血</td><td>活动性 GI 出血 / 血尿 / 胆道出血</td></tr>\n<tr><td>颅内</td><td>肿瘤（原发或转移）</td></tr>\n<tr><td>血液</td><td>出血体质（ITP、血友病）</td></tr>\n<tr><td>其他</td><td><strong>妊娠</strong>、易跌倒（PD、卒中后）、<strong>依从性差</strong></td></tr>\n</tbody>\n</table>\n<h3>替代方案：IVC Filter</h3>\n<p>### 核心适应证（AMC 高频）</p>\n<p>1. <strong>DVT or PE</strong> 患者存在 <em>抗凝禁忌</em> 2. 抗凝过程中 <em>出现并发症</em>（出血） 3. 充分抗凝后 <em>失败（仍发 PE）</em> 4. 患者 <em>依从性差</em>（无法可靠 long-term 抗凝） ← Q09 命中此点</p>\n<p>### 注意点</p>\n<ul>\n<li>IVC filter 是 <strong>预防 PE</strong>，<strong>不治疗 DVT 本体</strong></li>\n<li>仍需随访 DVT 是否进展</li>\n<li>临时 filter 可取出；永久 filter 长期并发症</li>\n</ul>\n<h3>标准化疗路径</h3>\n<table class='md-table'>\n<thead><tr><th>阶</th><th>措施</th></tr></thead>\n<tbody>\n<tr><td>急性</td><td>UFH 或 LMWH</td></tr>\n<tr><td>桥接</td><td>同日内启动 Warfarin</td></tr>\n<tr><td>维持</td><td>Heparin 至 INR > 2 连两次后停</td></tr>\n<tr><td>长程</td><td>Warfarin ≥ 3 个月（按再发风险）</td></tr>\n</tbody>\n</table>\n<h3>常见考点（AMC 高频对比）</h3>\n<table class='md-table'>\n<thead><tr><th>题眼</th><th>默认</th></tr></thead>\n<tbody>\n<tr><td>DVT 后 standard</td><td>Warfarin 3-6m</td></tr>\n<tr><td>抗凝禁忌时</td><td>IVC filter</td></tr>\n<tr><td>Cancer + DVT</td><td>LMWH 长程 / DOAC</td></tr>\n<tr><td>妊娠 + DVT</td><td>LMWH（<strong>不</strong>用 Warfarin = 致畸）</td></tr>\n<tr><td>易跌倒患者</td><td>IVC filter 或密切随访</td></tr>\n</tbody>\n</table>", "diseases": ["VTE"], "complaints": [], "search": "vte prophylaxis 高危人群 + 抗凝替代 — 知识总结\nvte prophylaxis indications — 高危人群 / 抗凝禁忌\nprevention\n   💉  haematology (topic review)  · css class:  tr-haematology  \n 考点类型（approach）： 预防  \n 颜色通过  category-colors.css  着色（ settings → appearance → css snippets  启用）。 # vte prophylaxis 高危人群 + 抗凝替代 — 知识总结 \n 适用上下文：识别高 vte 风险患者（cancer、trauma）；理解  抗凝禁忌 / 依从性差  时的替代方案（ivc filter）。 \n 高 vte 风险人群（要点） \n ### 患者群体 \n \n  cancer 患者 （尤其活动期 / 化疗） \n  trauma 患者 ，包括： \n 严重头部创伤 + 长期机械通气 \n 主要腹部/盆腔穿通性静脉伤 \n 脊髓损伤（伴或不伴瘫痪） \n 严重头部创伤 + 多发下肢骨折 \n 骨盆骨折（伴或不伴下肢骨折） \n \n ### 风险因素汇总 \n \n  既往 vte  \n 长期制动 / icu 长期卧床 \n 大手术（
