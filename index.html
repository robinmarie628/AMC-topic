</strong>：NSVT（短阵室速）+ 症状 → 选治疗 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>55 岁 + 心悸 + 头晕（<strong>症状性</strong>）</li>\n<li>Telemetry 抓到<strong>短阵</strong>VT（非持续）</li>\n<li><strong>夜间多发</strong></li>\n<p>3. <strong>NSVT 定义</strong>：</p>\n<li>连续 ≥ 3 个室性搏动</li>\n<li><strong>持续 < 30 秒</strong></li>\n<li>自动终止</li>\n<p>4. <strong>NSVT 处理</strong>：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>场景</th><th>一线</th></tr></thead>\n<tbody>\n<tr><td><strong>住院 / 急诊</strong> + 症状性</td><td><strong>Amiodarone</strong></td></tr>\n<tr><td>门诊 + 症状性</td><td><strong>β Blocker</strong>（bisoprolol / metoprolol / atenolol）</td></tr>\n<tr><td>门诊 + 持续 / 难治</td><td>Amiodarone, sotalol, flecainide</td></tr>\n<tr><td>持续 VT + 血流动力学不稳</td><td><strong>同步电复律</strong></td></tr>\n<tr><td>无脉 VT</td><td><strong>除颤</strong>（类似 VF）</td></tr>\n</tbody>\n</table>\n<p>5. <strong>选项排除</strong>：</p>\n<ul>\n<li>A (Amiodarone)：<strong>正确</strong>（住院症状性 NSVT）</li>\n<li>B (Bisoprolol)：BB 是<strong>门诊</strong>首选</li>\n<li>C (Verapamil)：<strong>禁用</strong>于 VT（可致低血压/心脏停搏）</li>\n<li>D (Cardioversion)：用于<strong>持续</strong>VT + 不稳定</li>\n<li>E (Digoxin)：<strong>不</strong>治 VT</li>\n<p>6. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"BB 治一切 VT\"陷阱</strong>：BB 是<strong>门诊</strong>NSVT 一线，<strong>住院</strong>症状性 → Amiodarone。</li>\n<li><strong>\"Verapamil 控心率\"陷阱</strong>：Verapamil <strong>对 VT 是禁忌</strong>（抑制心室收缩 → 休克）。</li>\n<li><strong>\"DC cardioversion 治 VT\"陷阱</strong>：Cardioversion 用于<strong>持续</strong>VT + 不稳定。NSVT < 30 s 自动终止，<strong>不需要</strong>电复律。</li>\n<li><strong>\"Digoxin 治心律失常\"陷阱</strong>：Digoxin <strong>不</strong>治 VT，且可<strong>促</strong>心律失常。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>For this patient with <strong>symptomatic non-sustained VTs</strong>, <strong>Amiodarone</strong> is the drug of choice. Amiodarone is considered <strong>first-line treatment option for those with sustained VT who are hemodynamically stable, or those with symptomatic non-sustained VT</strong>. Sotalol and lignocaine are second- and third-line medications, respectively.</p>\n<ul>\n<li>(Option D) <strong>Synchronized cardioversion</strong> is the next best in management of patients with <strong>sustained VT and consequent hemodynamic instability</strong> (chest pain, dyspnea, hypotension, perfusion-related confusion). <strong>Pulseless VT should be treated similar to ventricular fibrillation (VF) with defibrillation</strong>.</li>\n<li>(Option B) In <strong>outpatient setting</strong>, beta blockers (atenolol, bisoprolol, or metoprolol), orally, are used for nonsustained episodes of VT associated with symptoms as <strong>preferred options</strong>. Amiodarone, sotalol or flecainide, orally, are second-line options.</li>\n<li>(Options C, E) <strong>Calcium channel blockers (verapamil) or digoxin are not used for management of ventricular tachycardia</strong>.</li>\n</ul>\n<p><strong>NSVT management flow</strong>: 1. <strong>Assess hemodynamic stability</strong> → unstable → DC cardioversion 2. <strong>Stable</strong> → identify and treat underlying cause (ischemia, electrolyte, drugs) 3. <strong>Symptomatic</strong> → pharmacologic therapy 4. <strong>Inpatient</strong>: Amiodarone (IV) first-line 5. <strong>Outpatient</strong>: Beta-blocker first-line; amiodarone/sotalol/flecainide if BB fails</p>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：2022 ESC 室性心律失常指南）</li>\n</ul>", "related": ["AMC-Q0223-Unstable-VT-Cardioversion", "AMC-Q0249-Post-NSTEMI-VT", "AMC-Q0241-Third-Degree-AVB-Pacing", "MOC-Cardiology", "Topic-VT-Management"], "bodyHtml": "", "diseases": [], "complaints": ["dizziness", "palpitations"], "search": "症状性 nsvt（住院/急诊）— amiodarone 是一线\nnon-sustained vt nsvt amiodarone beta blocker outpatient sotalol lignocaine\ntreatment diagnosis definition\n a 55-year-old man presents to the emergency department with episodes of palpitation and light-headedness. an ecg is obtained and is inconclusive. he is placed on telemetry monitoring. evaluation of the records shows nonsustained paroxysms of ventricular tachycardia. there are many of these paroxysms during the night. which one of the following is the next best step in management? \n correct answer is  a  \n for this patient with  symptomatic non-sustained vts ,  amiodarone  is the drug of choice. amiodarone is considered  first-line treatment option for those with sustained vt who are hemodynamically stable, or those with symptomatic non-sustained vt . sotalol and lignocaine are second- and third-line medications, respectively. \n \n (option d)  synchronized cardioversion  is the next best in management of patients with  sustained vt and consequent hemodynamic instability  (chest pain, dyspnea, hypotension, perfusion-related confusion).  pulseless vt should be treated similar to ventricular fibrillation (vf) with defibrillation . \n (option b) in  outpatient setting , beta blockers (atenolol, bisoprolol, or metoprolol), orally, are used for nonsustained episodes of vt associated with symptoms as  preferred options . amiodarone, sotalol or flecainide, orally, are second-line options. \n (options c, e)  calcium channel blockers (verapamil) or digoxin are not used for management of ventricular tachycardia . \n \n  nsvt management flow : 1.  assess hemodynamic stability  → unstable → dc cardioversion 2.  stable  → identify and treat underlying cause (ischemia, electrolyte, drugs) 3.  symptomatic  → pharmacologic therapy 4.  inpatient : amiodarone (iv) first-line 5.  outpatient : beta-blocker first-line; amiodarone/sotalol/flecainide if bb fails "}, {"id": "AMC-Q0283", "type": "mcq", "qid": 283, "title": "地高辛 ECG 改变 — 不延长 QT（否定型）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["地高辛 ECG 改变 — 不延长 QT（否定型）"], "difficulty": 3, "correctAnswer": "A", "page": 1448, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0283-Digoxin-ECG.md", "stem": "<p>Which one of the following is not an ECG finding associated with digoxin use?</p>", "options": [{"letter": "A", "text": "Prolonged QT interval."}, {"letter": "B", "text": "Prolonged PR interval."}, {"letter": "C", "text": "Inverted T waves."}, {"letter": "D", "text": "Ventricular bigeminy."}, {"letter": "E", "text": "ST depression."}], "rationale": "<p>1. 题型识别：否定型题 — 找<strong>不是</strong>地高辛 ECG 改变的选项 2. 地高辛治疗剂量 4 种良性 ECG 改变：</p>\n<ul>\n<li>T 波改变（低平或倒置）</li>\n<li><strong>QT 间期缩短</strong></li>\n<li>ST 段\"勺形\"压低</li>\n<li>U 波振幅增大</li>\n<p>3. 中毒剂量 ECG 改变：</p>\n<li>频繁 PVC（最常见心律失常，尤其病态心脏）</li>\n<li>室上性心动过速</li>\n<li>AV 阻滞（一度 PR 延长）</li>\n<li>交界性逸搏心律</li>\n<li><strong>双向性室速</strong>（QRS 轴交替）——罕见但<strong>最特异</strong></li>\n<p>4. <strong>QT 延长不是地高辛使用或中毒的 ECG 特征</strong> 5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>QT 方向反了</strong>：地高辛是<strong>缩短</strong> QT——A 选项说\"延长\"，否定型题直接命中</li>\n<li><strong>PR 延长（B）</strong>：一度 AV 阻滞时 PR 延长——是地高辛相关改变（正确项）</li>\n<li><strong>双向性室速</strong>：最特异地高辛毒性 ECG 标志（罕见）——高频考点</li>\n<li><strong>与 TCA 对比</strong>：TCA 中毒 QRS 增宽；地高辛不宽 QRS</li>\n</ul>", "summary": "<p><strong>地高辛治疗剂量良性 ECG 改变</strong>： 1. T 波低平/倒置 2. <strong>QT 间期缩短</strong> 3. ST 段\"勺形\"压低 4. U 波振幅增大</p>\n<p><strong>地高辛中毒 ECG 改变</strong>：</p>\n<ul>\n<li>频繁 PVC（最常见心律失常）</li>\n<li>室上性心动过速</li>\n<li>AV 阻滞（PR 延长）</li>\n<li>交界性逸搏</li>\n<li><strong>双向性室速</strong>（最特异，罕见）</li>\n</ul>\n<p><strong>QT 延长不是地高辛特征</strong></p>", "explanation": "<p>地高辛治疗剂量的 4 种良性 ECG 改变包括：T 波低平/倒置、<strong>QT 间期缩短</strong>、ST 段\"勺形\"压低伴压低、U 波振幅增大。中毒剂量改变包括：频繁 PVC（最常见）、室上性心动过速、AV 阻滞、交界性逸搏和<strong>双向性室速</strong>（QRS 轴交替，罕见但最特异）。<strong>QT 间期延长不是地高辛使用或中毒的 ECG 特征</strong>。</p>", "references": "<ul>\n<li>GP Notebook – ECG changes in digoxin</li>\n<li>Medscape – Digitalis Toxicity</li>\n</ul>", "related": ["_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "地高辛 ecg 改变 — 不延长 qt（否定型）\n地高辛 ecg 改变 — 不延长 qt（否定型）\n which one of the following is not an ecg finding associated with digoxin use? \n 地高辛治疗剂量的 4 种良性 ecg 改变包括：t 波低平/倒置、 qt 间期缩短 、st 段\"勺形\"压低伴压低、u 波振幅增大。中毒剂量改变包括：频繁 pvc（最常见）、室上性心动过速、av 阻滞、交界性逸搏和 双向性室速 （qrs 轴交替，罕见但最特异）。 qt 间期延长不是地高辛使用或中毒的 ecg 特征 。 "}, {"id": "AMC-Q0922", "type": "mcq", "qid": 922, "title": "硝苯地平 — 二氢吡啶类 CCB 引起心动过速", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["硝苯地平 — 二氢吡啶类 CCB 反射性心动过速"], "difficulty": 2, "correctAnswer": "D", "page": 1412, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0922-Nifedipine-Tachycardia.md", "stem": "<p>Which one of the following medications can cause tachycardia?</p>", "options": [{"letter": "A", "text": "Propranolol."}, {"letter": "B", "text": "Verapamil."}, {"letter": "C", "text": "Diltiazem."}, {"letter": "D", "text": "Nifedipine."}, {"letter": "E", "text": "Metoprolol."}], "rationale": "<p>1. 题型识别：药理 — 药物对心率的影响 2. 逐项分析：</p>\n<ul>\n<li>普萘洛尔/美托洛尔（A/E）：β 阻滞剂 → 抑制心脏传导系统 → <strong>心动过缓</strong></li>\n<li>维拉帕米/地尔硫卓（B/C）：非二氢吡啶类 CCB → 作用于心脏传导系统 → 心肌抑制 + 心动过缓</li>\n<li>硝苯地平（D）：二氢吡啶类 CCB → <strong>对心脏无临床显著影响</strong>，主要扩血管 → 低血压 → <strong>反射性心动过速</strong></li>\n<p>3. 锁定答案：D</p>\n</ul>", "traps": "<ul>\n<li><strong>同为 CCB 但不同</strong>：二氢吡啶类（硝苯地平/氨氯地平/非洛地平）扩血管为主；非二氢吡啶类（维拉帕米/地尔硫卓）抑制心脏传导</li>\n<li><strong>反射性心动过速机制</strong>：过量时过度血管扩张和低血压 → 代偿性心动过速</li>\n<li><strong>β 阻滞剂停药勿骤停</strong>：本题虽只问心率，但 β 阻滞剂骤停有反跳风险</li>\n</ul>", "summary": "<p><strong>CCB 分类与效应</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>代表药物</th><th>对心脏</th><th>对外周血管</th></tr></thead>\n<tbody>\n<tr><td>二氢吡啶类</td><td>硝苯地平、氨氯地平</td><td>无明显抑制</td><td>显著扩张</td></tr>\n<tr><td>非二氢吡啶类</td><td>维拉帕米、地尔硫卓</td><td>心肌抑制 + 心动过缓</td><td>效应弱</td></tr>\n</tbody>\n</table>\n<p><strong>二氢吡啶类过量</strong>：过度血管扩张 → 低血压 → 反射性心动过速</p>", "explanation": "<p>普萘洛尔和美托洛尔是 β 阻滞剂，通过抑制心脏传导系统导致心动过缓。维拉帕米和地尔硫卓是非二氢吡啶类 CCB，对心脏传导系统作用明显，可致心肌抑制和心动过缓。硝苯地平是二氢吡啶类 CCB，对心脏无临床显著影响，但显著扩张血管致低血压（治疗效应）；过量时过度血管扩张和低血压可继发代偿性心动过速。</p>", "references": "<ul>\n<li>Therapeutic Guidelines – Cardiovascular; available from: http://tg.org.au</li>\n</ul>", "related": ["_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "硝苯地平 — 二氢吡啶类 ccb 引起心动过速\n硝苯地平 — 二氢吡啶类 ccb 反射性心动过速\n which one of the following medications can cause tachycardia? \n 普萘洛尔和美托洛尔是 β 阻滞剂，通过抑制心脏传导系统导致心动过缓。维拉帕米和地尔硫卓是非二氢吡啶类 ccb，对心脏传导系统作用明显，可致心肌抑制和心动过缓。硝苯地平是二氢吡啶类 ccb，对心脏无临床显著影响，但显著扩张血管致低血压（治疗效应）；过量时过度血管扩张和低血压可继发代偿性心动过速。 "}, {"id": "AMC-Q0955", "type": "mcq", "qid": 955, "title": "SSRI 与硝苯地平相互作用 — 减量处理", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["SSRI 抑制 CCB 肝代谢 — 硝苯地平血药浓度升高"], "difficulty": 3, "correctAnswer": "E", "page": 1413, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0955-Nifedipine-Fluoxetine-Interaction.md", "stem": "<p>A 54-year-old man presents to your GP clinic with complaints of light-headedness and palpitation for 3 days. He is hypertensive and has been on nifedipine and hydrochlorothiazide for the past 5 years. Recently, he was diagnosed with generalized anxiety disorder and started on fluoxetine. On examination, he has a blood pressure of 90/60 mmHg, heart rate of 110 bpm, respiratory rate of 14 breaths per minute, and temperature of 37.5°C. The rest of the exam is inconclusive. An ECG is obtained, which shows sinus tachycardia with no other arrhythmias. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Stop nifedipine."}, {"letter": "B", "text": "Stop fluoxetine."}, {"letter": "C", "text": "Stop both."}, {"letter": "D", "text": "Reduce fluoxetine."}, {"letter": "E", "text": "Reduce nifedipine."}], "rationale": "<p>1. 题型识别：治疗 — 药物相互作用的管理 2. 病生理链：加用氟西汀 → SSRI 抑制肝脏对 CCB 的代谢 → 硝苯地平血药浓度升高 → 扩血管过度 → <strong>低血压（90/60）+ 代偿性心动过速（110）</strong> 3. 处理原则：<strong>减少 CCB 剂量</strong>（心血管症状严重时暂时停药） 4. 氟西汀不需要停/减——它是触发因素但患者需要它治疗焦虑症 5. 锁定答案：E</p>", "traps": "<ul>\n<li><strong>停错药</strong>：患者需要氟西汀（焦虑症），问题出在硝苯地平浓度过高 → 减 CCB 而非停 SSRI</li>\n<li><strong>\"停药还是减量\"</strong>：症状严重（特别是心血管症状明显）才暂时停药，通常减量即可</li>\n<li><strong>头痛/潮红/踝部水肿/便秘</strong>：CCB 其他不良反应也会在此时出现或加重</li>\n</ul>", "summary": "<p><strong>SSRI–CCB 相互作用</strong>：</p>\n<ul>\n<li>SSRI（氟西汀等）抑制肝药酶对 CCB 的代谢 → CCB 血药浓度升高</li>\n<li>结果：低血压 + 反射性心动过速</li>\n<li>处理：减量或暂停 CCB</li>\n</ul>\n<p><strong>CCB 常见不良反应</strong>：头痛、潮红、踝部水肿、便秘</p>", "explanation": "<p>体检发现低血压和心动过速，可由硝苯地平血药浓度升高解释。硝苯地平是二氢吡啶类 CCB，降低外周血管阻力从而降压，通常无显著心脏作用。SSRI（如氟西汀）可抑制 CCB 的肝代谢，导致硝苯地平浓度升高、低血压及反射性心动过速。此时应<strong>减少 CCB 剂量</strong>；若心血管症状严重则暂时停药。</p>", "references": "<ul>\n<li>Drug Interactions in Psychiatry – Lippincott Williams & Wilkins – 3rd Edition – pages 105-106</li>\n<li>Therapeutic Guidelines – Cardiovascular; available from http://tg.org.au</li>\n</ul>", "related": ["AMC-Q0922-Nifedipine-Tachycardia", "AMC-Q0999-Sertraline-Nifedipine-Interaction", "_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": ["dizziness", "palpitations"], "search": "ssri 与硝苯地平相互作用 — 减量处理\nssri 抑制 ccb 肝代谢 — 硝苯地平血药浓度升高\n a 54-year-old man presents to your gp clinic with complaints of light-headedness and palpitation for 3 days. he is hypertensive and has been on nifedipine and hydrochlorothiazide for the past 5 years. recently, he was diagnosed with generalized anxiety disorder and started on fluoxetine. on examination, he has a blood pressure of 90/60 mmhg, heart rate of 110 bpm, respiratory rate of 14 breaths per minute, and temperature of 37.5°c. the rest of the exam is inconclusive. an ecg is obtained, which shows sinus tachycardia with no other arrhythmias. which one of the following is the most appropriate next step in management? \n 体检发现低血压和心动过速，可由硝苯地平血药浓度升高解释。硝苯地平是二氢吡啶类 ccb，降低外周血管阻力从而降压，通常无显著心脏作用。ssri（如氟西汀）可抑制 ccb 的肝代谢，导致硝苯地平浓度升高、低血压及反射性心动过速。此时应 减少 ccb 剂量 ；若心血管症状严重则暂时停药。 "}, {"id": "AMC-Q0999", "type": "mcq", "qid": 999, "title": "舍曲林加量 — 与硝苯地平的相互作用", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["舍曲林与硝苯地平相互作用 — 加量后发病"], "difficulty": 3, "correctAnswer": "C", "page": 1418, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0999-Sertraline-Nifedipine-Interaction.md", "stem": "<p>A 60-year-old woman is prescribed sertraline for management of depression. Her medical history includes hypertension that is well-controlled on nifedipine and atenolol. On review after 2 months, she feels better but her signs and symptoms of depression have not resolved completely; therefore, the dose of sertraline is increased. After 10 days, she presents again complaining of palpitations. On examination, she has a blood pressure of 100/78mmHg and heart rate of 110bpm. The rest of the examination is inconclusive. Which one of the following is most likely to have led to this presentation?</p>", "options": [{"letter": "A", "text": "Sertraline."}, {"letter": "B", "text": "Nifedipine."}, {"letter": "C", "text": "Interaction between sertraline and nifedipine."}, {"letter": "D", "text": "Increased metabolism of nifedipine."}, {"letter": "E", "text": "A new rhythm disturbance irrelevant to her current medications."}], "rationale": "<p>1. 题型识别：诊断 — 药物相互作用 2. 关键时间线：舍曲林<strong>加量 10 天后</strong>出现心悸 → 提示药物相互作用 3. 机制：SSRI（舍曲林）抑制 CCB（硝苯地平）肝代谢 → 硝苯地平血药浓度升高 → 低血压 + 反射性心动过速 4. 排除：</p>\n<ul>\n<li>舍曲林单独（A）：SSRI 不引起心动过速</li>\n<li>硝苯地平单独（B）：加量舍曲林前患者无症状</li>\n<li>硝苯地平代谢增加（D）：恰恰相反——是<strong>减少</strong>代谢</li>\n<li>新发心律异常（E）：已有明确药物相互作用可解释，不需另寻病因</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>\"增加代谢\" vs \"减少代谢\"</strong>：SSRI 是<strong>抑制</strong>（减少）CCB 代谢 → 浓度升高；D 选项方向相反</li>\n<li><strong>时间线是解题关键</strong>：舍曲林加量 10 天后发病，排除了硝苯地平单药解释</li>\n<li><strong>SSRI 本身无心动过速</strong>：心悸是 CCB 浓度升高所致，不是 SSRI 直接效应</li>\n</ul>", "summary": "<p><strong>SSRI–CCB 相互作用（同 Q955）</strong>：</p>\n<ul>\n<li>SSRI 抑制肝药酶对 CCB 的代谢</li>\n<li>→ CCB 浓度升高 → 低血压 + 反射性心动过速</li>\n<li>处理：减量或暂停 CCB</li>\n</ul>\n<p><strong>识别药物相互作用的线索</strong>：新药加用/加量后出现新症状、时间相关性强</p>", "explanation": "<p>硝苯地平是二氢吡啶类 CCB，降低外周阻力从而降压，通常无显著心脏作用。虽然硝苯地平可致代偿性心动过速，但患者在舍曲林加量前无症状。SSRI 可抑制 CCB 的肝代谢，导致硝苯地平浓度升高、低血压及代偿性心动过速。因此最可能的解释是<strong>两药相互作用</strong>。舍曲林单独不引起心动过速；SSRI 使硝苯地平代谢<strong>减少</strong>而非增加；既有明确相互作用解释症状，无需归因于新发心律异常。</p>", "references": "<ul>\n<li>Drug Interactions in Psychiatry – Lippincott Williams & Wilkins – 3rd Edition – pages 105-106</li>\n<li>Therapeutic Guidelines – Cardiovascular; available from http://tg.org.au</li>\n</ul>", "related": ["AMC-Q0955-Nifedipine-Fluoxetine-Interaction", "_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": ["palpitations"], "search": "舍曲林加量 — 与硝苯地平的相互作用\n舍曲林与硝苯地平相互作用 — 加量后发病\n a 60-year-old woman is prescribed sertraline for management of depression. her medical history includes hypertension that is well-controlled on nifedipine and atenolol. on review after 2 months, she feels better but her signs and symptoms of depression have not resolved completely; therefore, the dose of sertraline is increased. after 10 days, she presents again complaining of palpitations. on examination, she has a blood pressure of 100/78mmhg and heart rate of 110bpm. the rest of the examination is inconclusive. which one of the following is most likely to have led to this presentation? \n 硝苯地平是二氢吡啶类 ccb，降低外周阻力从而降压，通常无显著心脏作用。虽然硝苯地平可致代偿性心动过速，但患者在舍曲林加量前无症状。ssri 可抑制 ccb 的肝代谢，导致硝苯地平浓度升高、低血压及代偿性心动过速。因此最可能的解释是 两药相互作用 。舍曲林单独不引起心动过速；ssri 使硝苯地平代谢 减少 而非增加；既有明确相互作用解释症状，无需归因于新发心律异常。 "}, {"id": "AMC-Q1289", "type": "mcq", "qid": 1289, "title": "尖端扭转型室速 — 阿奇霉素 + 舍曲林累积致 QT 延长", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["尖端扭转型室速 — 阿奇霉素+舍曲林 QT 延长"], "difficulty": 4, "correctAnswer": "C", "page": 0, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q1289-Torsades-Azithromycin-Sertraline.md", "stem": "<p>A 72-year-old man is brought to the emergency department after he collapsed while walking back home from shopping. After administration of oxygen, an ECG strip is obtained emergently which is shown in the following photograph. He lost her wife 12 months ago and is currently on sertraline 100 mg/day due to depression as a result of complicated grief. One week ago, he was prescribed azithromycin for treatment of atypical pneumonia. His other medications include aspirin 80 mg/day for treatment of ischemic heart disease (IHD), atorvastatin 20 mg/day for hyperlipidemia and multivitamin. Which one of the following is most likely to have lead in such presentation?</p>", "options": [{"letter": "A", "text": "Interaction between aspirin and azithromycin."}, {"letter": "B", "text": "Sertraline."}, {"letter": "C", "text": "Azithromycin and sertraline."}, {"letter": "D", "text": "Azithromycin."}, {"letter": "E", "text": "Ischemic heart disease."}], "rationale": "<p>1. 题型识别：诊断 — 尖端扭转型室速的病因 2. 心电图判读：多形性室速，QRS 围绕等电位线\"扭转\" = <strong>TdP</strong>；需同时有 PVT + QT 延长 3. 关键诱因（QTc >500ms 是 TdP 必需前提）：</p>\n<ul>\n<li>电解质紊乱（低钾、低镁、罕见低钙）</li>\n<li><strong>合用 >1 种延长 QT 药物</strong></li>\n<li>先天性长 QT 综合征</li>\n<li>心脏病（心衰、心室肥厚、AF 转复后）</li>\n<li>甲状腺疾病（甲减常见）</li>\n<li>药物</li>\n<p>4. 时间线：舍曲林用药数月无碍，<strong>加用阿奇霉素 1 周后</strong>发病 → 累积效应 5. 排除：</p>\n<li>舍曲林单独（B）/阿奇霉素单独（D）：单一药物少见，需联合</li>\n<li>阿司匹林-阿奇霉素（A）：阿司匹林不影响 QT</li>\n<li>IHD（E）：虽有心脏病，但药物合用史更直接解释</li>\n<p>6. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>\"合用 >1 种延长 QT 药物\"是常见模式</strong>：单一药物少见，两种以上联合才显著延长 QT——本例 SSRI + 大环内酯</li>\n<li><strong>时间线</strong>：舍曲林长期无碍 + 阿奇霉素 1 周 → 累积效应</li>\n<li><strong>TdP 危险因素</strong>：女性、年龄 ≥65 岁（本例 72 岁男性，年龄是危险因素）</li>\n</ul>", "summary": "<p><strong>TdP 要点</strong>：</p>\n<ul>\n<li>多形性室速 + QT 延长（QTc >500ms 是关键前提）</li>\n<li>QRS 围绕等电位线扭转的形态学特征</li>\n</ul>\n<p><strong>延长 QT 的药物</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>药物</th></tr></thead>\n<tbody>\n<tr><td>抗生素</td><td><strong>大环内酯（阿奇霉素、克拉霉素、红霉素）</strong>、莫西沙星、酮康唑、氟康唑</td></tr>\n<tr><td>抗抑郁药</td><td>SSRI（西酞普兰、艾司西酞普兰、<strong>舍曲林</strong>）、TCA</td></tr>\n<tr><td>抗精神病药</td><td>氟哌啶醇、氯丙嗪、利培酮、匹莫齐特、喹硫平、氯氮平</td></tr>\n<tr><td>抗心律失常</td><td>索他洛尔、奎尼丁、氟卡尼、胺碘酮</td></tr>\n<tr><td>止吐药</td><td>昂丹司琼、多潘立酮</td></tr>\n<tr><td>其他</td><td>美沙酮、蛋白激酶抑制剂、鲁非曲林、抗疟药、抗逆转录病毒药</td></tr>\n</tbody>\n</table>\n<p><strong>危险因素</strong>：女性和年龄 ≥65 岁</p>", "explanation": "<p>ECG 特征为尖端扭转型室速（TdP）——QT 延长背景下的一种多形性室速。QTc >500ms 是 TdP 的必要前提。舍曲林（SSRI）和阿奇霉素（大环内酯）均能延长 QT 间期；该患者舍曲林数月无症状，加用阿奇霉素一周后发病，提示<strong>合用累积效应</strong>是最可能原因。阿司匹林不影响 QT。虽然 IHD 可致 QT 延长，但药物合用史更直接地解释了发病。</p>", "references": "<ul>\n<li>https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4110870/</li>\n<li>http://www.ggcprescribing.org.uk/media/uploads/ps_extra/pse_21.pdf</li>\n</ul>", "related": ["_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": ["syncope/collapse"], "search": "尖端扭转型室速 — 阿奇霉素 + 舍曲林累积致 qt 延长\n尖端扭转型室速 — 阿奇霉素+舍曲林 qt 延长\n a 72-year-old man is brought to the emergency department after he collapsed while walking back home from shopping. after administration of oxygen, an ecg strip is obtained emergently which is shown in the following photograph. he lost her wife 12 months ago and is currently on sertraline 100 mg/day due to depression as a result of complicated grief. one week ago, he was prescribed azithromycin for treatment of atypical pneumonia. his other medications include aspirin 80 mg/day for treatment of ischemic heart disease (ihd), atorvastatin 20 mg/day for hyperlipidemia and multivitamin. which one of the following is most likely to have lead in such presentation? \n ecg 特征为尖端扭转型室速（tdp）——qt 延长背景下的一种多形性室速。qtc >500ms 是 tdp 的必要前提。舍曲林（ssri）和阿奇霉素（大环内酯）均能延长 qt 间期；该患者舍曲林数月无症状，加用阿奇霉素一周后发病，提示 合用累积效应 是最可能原因。阿司匹林不影响 qt。虽然 ihd 可致 qt 延长，但药物合用史更直接地解释了发病。 "}, {"id": "AMC-Q1405", "type": "mcq", "qid": 1405, "title": "氢氯噻嗪 — 高剂量致血脂异常", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": [], "topic": ["氢氯噻嗪 — 高剂量致血脂异常"], "difficulty": 2, "correctAnswer": "C", "page": 1435, "tags": [], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q1405-Hydrochlorothiazide-Lipid-Profile.md", "stem": "<p>The laboratory test results of a 55-year-old man on polypharmacy shows a total cholesterol level of 4.5mmol/L and HDL of 0.8mmol/L. Which one of the following medications can be the cause of this lipid profile?</p>", "options": [{"letter": "A", "text": "Allopurinol."}, {"letter": "B", "text": "Aspirin."}, {"letter": "C", "text": "Hydrochlorothiazide."}, {"letter": "D", "text": "NSAIDs."}, {"letter": "E", "text": "Calcium channel blockers."}], "rationale": "<p>1. 题型识别：诊断 — 药物对血脂谱的影响 2. 判读血脂：总胆固醇 4.5 mmol/L（正常 <4）↑；HDL 0.8 mmol/L（男正常 1-1.3）↓ 3. 氢氯噻嗪剂量效应：</p>\n<ul>\n<li>6.25-12mg/天：无不良影响</li>\n<li>25mg/天：只升高 TG，不升高总胆固醇或影响 HDL</li>\n<li><strong>>25mg/天 或长期使用</strong>：总胆固醇和 TG 升高 + HDL 降低（<strong>尤其糖尿病患者</strong>）</li>\n<p>4. 排除：</p>\n<li>别嘌醇（A）：升高 TG、总胆固醇、LDL 和 HDL（HDL 3 个月后升高）——本例 HDL 低，不符合</li>\n<li>阿司匹林/NSAIDs（B/D）：无血脂影响</li>\n<li>CCB（E）：无血脂影响</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>剂量依赖</strong>：氢氯噻嗪 <12.5mg 无血脂影响，>25mg 才显著——选项直接问\"哪种药可致此血脂谱\"</li>\n<li><strong>别嘌醇 HDL 变化</strong>：别嘌醇 HDL <strong>升高</strong>（3 个月后）——本例 HDL 降低排除</li>\n<li><strong>CCB 是\"无影响\"组</strong>：与题目问\"可致异常\"的方向相反</li>\n</ul>", "summary": "<p><strong>心血管药物对血脂的影响（TR 详表见关联笔记）</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>血脂影响</th></tr></thead>\n<tbody>\n<tr><td>非选择性 β 阻滞剂（普萘洛尔）</td><td>↑TG、↓LDL</td></tr>\n<tr><td>选择性 β1 阻滞剂（阿替洛尔、美托洛尔）</td><td>↑TG</td></tr>\n<tr><td><strong>氢氯噻嗪</strong></td><td><strong>↑TG、↑总胆固醇、↓HDL（糖尿病或长期使用）</strong></td></tr>\n<tr><td>吲达帕胺</td><td>↑LDL</td></tr>\n<tr><td>氯噻酮</td><td>↑LDL</td></tr>\n<tr><td>CCB</td><td>无影响</td></tr>\n<tr><td>ACEI</td><td>不一致（通常 ↓TG、↓总胆固醇、↓LDL、↑HDL）</td></tr>\n</tbody>\n</table>\n<p><strong>参考范围</strong>：总胆固醇 <4 mmol/L；HDL 男 1-1.3、女 1.3-1.5 mmol/L</p>", "explanation": "<p>该患者总胆固醇升高（4.5 mmol/L，正常 <4）且 HDL 降低（0.8 mmol/L）。选项中只有<strong>氢氯噻嗪在 >25mg/天剂量或长期使用时</strong>能产生此血脂谱——升高总胆固醇和 TG、降低 HDL，尤其在糖尿病患者。25mg/天仅升高 TG。别嘌醇升高 HDL（3 个月后）不符合；阿司匹林/NSAIDs 和 CCB 无血脂影响。</p>", "references": "<ul>\n<li>Journal of the American Society Nephrology – Thiazide Diuretics in the Treatment of Hypertension: An Update</li>\n<li>PubMed – Dyslipidemia Induced by Drugs Used for the Prevention and Treatment of Vascular Diseases</li>\n</ul>", "related": ["TR-Lipid-Profile-Cardiovascular-Drugs", "_MOC-Cardiology"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "氢氯噻嗪 — 高剂量致血脂异常\n氢氯噻嗪 — 高剂量致血脂异常\n the laboratory test results of a 55-year-old man on polypharmacy shows a total cholesterol level of 4.5mmol/l and hdl of 0.8mmol/l. which one of the following medications can be the cause of this lipid profile? \n 该患者总胆固醇升高（4.5 mmol/l，正常  氢氯噻嗪在 >25mg/天剂量或长期使用时 能产生此血脂谱——升高总胆固醇和 tg、降低 hdl，尤其在糖尿病患者。25mg/天仅升高 tg。别嘌醇升高 hdl（3 个月后）不符合；阿司匹林/nsaids 和 ccb 无血脂影响。 "}, {"id": "AMC-QNA-P006", "type": "mcq", "qid": 0, "title": "Orthostatic Hypotension — 一线治疗是补液补盐，不是激素", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "investigation"], "topic": ["Orthostatic Hypotension", "Tilt Table Test", "Syncope Workup", "First-line Management"], "difficulty": 3, "correctAnswer": "D", "page": 6, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "syncope", "approach-treatment", "approach-diagnosis", "approach-investigation"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-QNA-P006-Orthostatic-Hypotension.md", "stem": "<p>A 65-year-old woman presents with several episodes of <strong>acute lightheadedness</strong>, especially <strong>shortly after getting off the bed or a chair</strong> for the past 3 months. Her medical history is otherwise unremarkable. A <strong>table tilt test is positive</strong>.</p>\n<p>Which one of the following would be the <strong>first-line management</strong> of this patient?</p>", "options": [{"letter": "A", "text": "Oral fludrocortisone"}, {"letter": "B", "text": "Oral hydrocortisone"}, {"letter": "C", "text": "Intravenous fluids"}, {"letter": "D", "text": "Increased salt and water intake"}, {"letter": "E", "text": "Indomethacin"}], "rationale": "<p>1. <strong>题型识别</strong>：诊断已明（orthostatic hypotension，由 tilt test 阳性支持）→ 问\"first-line\"。 2. <strong>核心知识</strong>：直立性低血压 <em>是血压调节异常的临床表现</em>，不是独立疾病 —— 所以 first-line 是 <strong>保守</strong> 措施而非药物。 3. <strong>保守 vs 药物</strong> 的层次：</p>\n<ul>\n<li><strong>一线</strong>：增加 sodium + 水的摄入（无 HF/HTN 禁忌） + 物理反压（穿弹力袜）+ 起身缓慢</li>\n<li><strong>二线</strong>：Fludrocortisone（盐皮质激素，保钠扩容）</li>\n<li><strong>特殊</strong>：合并 autonomic failure 才考虑 midodrine 等</li>\n<p>4. <strong>逐项匹配</strong>：</p>\n<li>A Fludrocortisone → 二线 ✔ 但不是 first-line</li>\n<li>B Hydrocortisone → Addison 病治疗 → 不对应</li>\n<li>C IV fluids → 急性失血时用 → 不符合</li>\n<li><strong>D Salt + water → ✔ 一线</strong></li>\n<li>E Indomethacin → NSAIDs，Prostaglandin 抑制 → 一般不用</li>\n<p>5. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>一线 vs 二线陷阱</strong>：fludrocortisone 是 <em>pharmacological</em> 治疗，但 AMC 强调 \"conservative first\"。</li>\n<li><strong>IV vs oral 陷阱</strong>：急性失血用 IV fluids；慢性 postural 不需要 IV。</li>\n<li><strong>Indomethacin 干扰项</strong>：NSAID 抑制 prostaglandin（部分患者用 NSAID 反而治疗血管扩张型低血压），但 AMC 不考这一细分。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Positive tilt table test</strong> 高度提示 orthostatic (postural) hypotension：</p>\n<ul>\n<li>定义：直立位后血压过度下降（共识：SBP ≥ 20 mmHg 或 DBP ≥ 10 mmHg 下降）</li>\n<li>急性 vs 慢性，机制各异</li>\n<li>是 <em>血压调节异常</em>，不是独立疾病</li>\n</ul>\n<p><strong>Work-up</strong>：</p>\n<ul>\n<li>仰卧位 5 min → BP/HR</li>\n<li>立位 1 min、3 min BP/HR</li>\n<li>HR 不变 → 自主神经病变</li>\n<li>HR ↑ (>30 bpm 或 >100 bpm) → 容量不足</li>\n<li>症状 + HR ↑ >30 bpm + 无低血压 → POTS</li>\n</ul>\n<p><strong>First-line (conservative)</strong>：</p>\n<ul>\n<li>↑ Sodium + 水的摄入</li>\n<li>Physical counterpressure (弹力袜)</li>\n<li>起身缓慢</li>\n<li>避免长时间站立</li>\n</ul>\n<p><strong>Pharmacologic (二线)</strong>：</p>\n<ul>\n<li>Fludrocortisone（盐皮质激素，保钠扩容）</li>\n<li>Midodrine、pyridostigmine 等（特殊病因）</li>\n</ul>", "references": "<ul>\n<li>http://www.merckmanuals.com/professional/cardiovascular</li>\n<li>（待补：Tilt table 测试专题）</li>\n</ul>", "related": ["AMC-Q0014-Shoulder-Tip-Pain-DDx", "TR-Tilt-Table-Test", "MOC-Cardiology"], "bodyHtml": "", "diseases": ["Syncope"], "complaints": ["dizziness"], "search": "orthostatic hypotension — 一线治疗是补液补盐，不是激素\northostatic hypotension tilt table test syncope workup first-line management\ntreatment diagnosis investigation\n a 65-year-old woman presents with several episodes of  acute lightheadedness , especially  shortly after getting off the bed or a chair  for the past 3 months. her medical history is otherwise unremarkable. a  table tilt test is positive . \n which one of the following would be the  first-line management  of this patient? \n correct answer is  d  \n  positive tilt table test  高度提示 orthostatic (postural) hypotension： \n \n 定义：直立位后血压过度下降（共识：sbp ≥ 20 mmhg 或 dbp ≥ 10 mmhg 下降） \n 急性 vs 慢性，机制各异 \n 是  血压调节异常 ，不是独立疾病 \n \n  work-up ： \n \n 仰卧位 5 min → bp/hr \n 立位 1 min、3 min bp/hr \n hr 不变 → 自主神经病变 \n hr ↑ (>30 bpm 或 >100 bpm) → 容量不足 \n 症状 + hr ↑ >30 bpm + 无低血压 → pots \n \n  first-line (conservative) ： \n \n ↑ sodium + 水的摄入 \n physical counterpressure (弹力袜) \n 起身缓慢 \n 避免长时间站立 \n \n  pharmacologic (二线) ： \n \n fludrocortisone（盐皮质激素，保钠扩容） \n midodrine、pyridostigmine 等（特殊病因） \n "}, {"id": "AMC-QNA-P015", "type": "mcq", "qid": 15, "title": "稳定型心绞痛 — 负荷试验确诊", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "diagnosis"], "topic": ["Stable Angina", "Stress Test", "Investigation", "Outpatient Workup"], "difficulty": 3, "correctAnswer": "D", "page": 15, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "stable-angina", "cad", "stress-test", "approach-investigation", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-QNA-P015-Stable-Angina-Stress-Test.md", "stem": "<p>A 70-year-old man presents to the Emergency Department with complaint of chest pain starting 15 minutes ago, central in location, and dull and aching in nature. He is given aspirin, sublingual glyceryl trinitrate, and oral antacid, and is put on supplemental oxygen by nasal cannula. These measures ameliorate the pain to a significant extent.</p>\n<p>On examination, his blood pressure is 140/90 mmHg, pulse 110 bpm, and respiratory rate 20 breaths per minute. A 12-lead ECG strip reveals no abnormality. He mentions that he has had these pains every time he exceeded a certain amount of physical activity, and that each time the pain subsides with rest or sublingual glyceryl trinitrate. He rates this current episode no more than the previous ones. Which one of the following is the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Reassure and discharge him home"}, {"letter": "B", "text": "Book for an outpatient echocardiography"}, {"letter": "C", "text": "Admit him to coronary care unit (CCU), measure cardiac enzymes and repeat the ECG"}, {"letter": "D", "text": "Refer him for a stress ECG and echocardiography"}, {"letter": "E", "text": "Refer him to a gastroenterologist"}], "rationale": "<p>1. <strong>题型识别</strong>：典型 angina 病史 + 急诊 ECG 正常 → 走\"门诊负荷试验确诊\"路径。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>胸痛：中央、钝痛、< 20 min</li>\n<li><strong>可预测的活动量诱发</strong></li>\n<li><strong>休息或 GTN 缓解</strong> ← 教科书 stable angina</li>\n<li>ECG 正常</li>\n<li>患者自评与既往发作类似</li>\n<p>3. <strong>诊断路径</strong>：</p>\n<li>稳定型心绞痛 = 氧耗增加但冠脉狭窄不能跟上 → 缺血</li>\n<li>不稳定心绞痛 = 新发 / 模式改变 / 静息痛 / 加剧</li>\n<li>本例<strong>典型稳定型</strong></li>\n<p>4. <strong>处理</strong>：</p>\n<li>ECG 正常 / 不确定 → <strong>负荷试验</strong>（运动平板、药理、核素）</li>\n<li>阳性标准：复现胸痛、ST 段压低 > 2 mm、血压下降 > 10 mmHg</li>\n<li>阳性 → 冠脉造影 → PCI / CABG</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A：未充分评估就放走 = 不当</li>\n<li>B：单做 echo 不够（echo 评估结构和室壁运动，但不诱发缺血）</li>\n<li>C：CCU + 酶 + 复查 ECG 是 <em>不稳定 / 急性 MI</em> 路径，本例是稳定</li>\n<li>E：疼痛典型心源性，不转消化科</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"ECG 正常 = 没病\"陷阱</strong>：稳定型心绞痛发作间期 ECG 完全可以正常，<strong>正是负荷试验的指征</strong>。</li>\n<li><strong>CCU 收治陷阱</strong>：CCU 是 unstable / MI 路径；稳定型心绞痛走门诊路径（除非模式改变）。</li>\n<li><strong>Reassurance 陷阱</strong>：未完成 CAD 评估就放走 = 漏诊 + 风险。</li>\n<li><strong>Gastroenterologist 陷阱</strong>：中央、钝痛、休息缓解 → 教科书 cardiac，绝非 GERD。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>Central chest pain described as <strong>heaviness, dull and aching</strong> that may or may not radiate to the jaw, left arm, or epigastrium is more likely ischemic. The duration (< 20 min), being brought on by a <strong>predictable amount of exertion</strong> and <strong>relieved by rest or nitrates</strong> is characteristic of <strong>stable angina</strong> — a condition in which increased oxygen demand (induced by activity) cannot be met by stenotic coronary arteries.</p>\n<p>In contrast, <strong>unstable angina</strong> = any new ischemic chest pain, or one with deviation from typical pattern (duration, intensity, frequency, or decreased exertion threshold).</p>\n<p><strong>The characteristics</strong> of the pain (duration, reversibility, response to rest and nitrates), combined with a <strong>normal ECG</strong> in ED, establish the diagnosis of stable angina. The next best step is to <strong>urgently perform a stress test</strong> (conventional treadmill, chemical, or nuclear) to establish coronary stenosis.</p>\n<p><strong>Positive stress test criteria</strong>:</p>\n<ul>\n<li>Reproduction of chest pain</li>\n<li>ST segment depression > 2 mm</li>\n<li>Drop in blood pressure > 10 mmHg</li>\n</ul>\n<p><strong>Positive stress test</strong> → angiography → balloon ± stent or CABG.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>A</strong> (Reassure and discharge): Not appropriate before full assessment.</li>\n<li><strong>B</strong> (Outpatient echo only): Echo doesn't provoke ischemia.</li>\n<li><strong>C</strong> (Admit to CCU): Reserved for unstable angina / MI (changes in intensity, duration, unresponsiveness to rest/nitrates).</li>\n<li><strong>E</strong> (Gastroenterologist): Pain pattern is classic cardiac ischemia.</li>\n</ul>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ANZ Cardiac Society 稳定型心绞痛指南）</li>\n</ul>", "related": ["AMC-Q0025-PCI-Antiplatelet-Duration", "AMC-Q0225-Inferior-STEMI-Reperfusion", "AMC-Q0224-Thrombolytics-Contraindications", "MOC-Cardiology", "Topic-Chest-Pain-Triage"], "bodyHtml": "", "diseases": ["Stable Angina"], "complaints": ["chest pain"], "search": "稳定型心绞痛 — 负荷试验确诊\nstable angina stress test investigation outpatient workup\ninvestigation diagnosis\n a 70-year-old man presents to the emergency department with complaint of chest pain starting 15 minutes ago, central in location, and dull and aching in nature. he is given aspirin, sublingual glyceryl trinitrate, and oral antacid, and is put on supplemental oxygen by nasal cannula. these measures ameliorate the pain to a significant extent. \n on examination, his blood pressure is 140/90 mmhg, pulse 110 bpm, and respiratory rate 20 breaths per minute. a 12-lead ecg strip reveals no abnormality. he mentions that he has had these pains every time he exceeded a certain amount of physical activity, and that each time the pain subsides with rest or sublingual glyceryl trinitrate. he rates this current episode no more than the previous ones. which one of the following is the most appropriate next step in management? \n correct answer is  d  \n central chest pain described as  heaviness, dull and aching  that may or may not radiate to the jaw, left arm, or epigastrium is more likely ischemic. the duration ( predictable amount of exertion  and  relieved by rest or nitrates  is characteristic of  stable angina  — a condition in which increased oxygen demand (induced by activity) cannot be met by stenotic coronary arteries. \n in contrast,  unstable angina  = any new ischemic chest pain, or one with deviation from typical pattern (duration, intensity, frequency, or decreased exertion threshold). \n  the characteristics  of the pain (duration, reversibility, response to rest and nitrates), combined with a  normal ecg  in ed, establish the diagnosis of stable angina. the next best step is to  urgently perform a stress test  (conventional treadmill, chemical, or nuclear) to establish coronary stenosis. \n  positive stress test criteria : \n \n reproduction of chest pain \n st segment depression > 2 mm \n drop in blood pressure > 10 mmhg \n \n  positive stress test  → angiography → balloon ± stent or cabg. \n  why not the others : \n \n  a  (reassure and discharge): not appropriate before full assessment. \n  b  (outpatient echo only): echo doesn't provoke ischemia. \n  c  (admit to ccu): reserved for unstable angina / mi (changes in intensity, duration, unresponsiveness to rest/nitrates). \n  e  (gastroenterologist): pain pattern is classic cardiac ischemia. \n "}, {"id": "AMC-QNA-P027", "type": "mcq", "qid": 27, "title": "GTN 失效 — 药物过期（reduced potency）最常见", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "complications", "prevention"], "topic": ["GTN", "Glyceryl Trinitrate", "Drug Expiration", "Stable Angina", "Patient Education"], "difficulty": 2, "correctAnswer": "C", "page": 27, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "angina", "gtn", "pharmacology", "patient-education", "approach-treatment", "approach-complications", "approach-prevention"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-QNA-P027-GTN-Expiration.md", "stem": "<p>A 70-year-old man, farmer by profession, presents to the Emergency Department after he experienced chest pain of 20 minutes duration following physical activity. When the pain started, he took 3 puffs of glyceryl trinitrate but there was no relief. In the Emergency Department though, the pain alleviated with oxygen. On further questioning, you realize that he is on aspirin, metoprolol and sublingual glyceryl trinitrate spray on an 'as needed' basis. During the past 6 months, he has had only 3 episodes of chest pain subsided just by rest. He saw his GP 6 months ago when he received his last prescription. Which one of the following is the most likely explanation of failure of glyceryl trinitrate to relieve his symptoms?</p>", "options": [{"letter": "A", "text": "Onset of unstable angina"}, {"letter": "B", "text": "Nitrate tolerance"}, {"letter": "C", "text": "Reduced drug potency"}, {"letter": "D", "text": "Poor absorption through the mouth"}, {"letter": "E", "text": "Onset of myocardial infarction"}], "rationale": "<p>1. <strong>题型识别</strong>：GTN 失效 = 找最常见原因 = <strong>过期</strong>。 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>70 岁农民</li>\n<li>运动诱发胸痛</li>\n<li>3 喷 GTN 无效</li>\n<li><strong>ED 给氧后缓解</strong>（关键：仍对氧有反应，不是不稳定心绞痛 / MI）</li>\n<li>既往 6 个月 3 次发作均休息缓解 → <strong>稳定心绞痛</strong></li>\n<li>6 个月前最后一次开 GTN → <strong>GTN 已过期</strong></li>\n<p>3. <strong>GTN 药理常识</strong>：</p>\n<li>GTN 喷雾 / 药片<strong>保质期有限</strong>（通常 3-6 个月开封后）</li>\n<li>过期后<strong>效力下降</strong></li>\n<li>患者需要定期更换</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (unstable angina)：本例既往 6 月都是休息缓解的稳定模式，<strong>未升级</strong>，且 ED 给氧缓解了，<strong>非不稳定</strong></li>\n<li>B (nitrate tolerance)：本例 GTN 用得少（6 月 3 次，prn），<strong>不容易耐药</strong></li>\n<li>D (poor absorption)：GTN 舌下吸收良好，<strong>不是问题</strong></li>\n<li>E (MI)：ED 给氧缓解了 → 不太像 MI（MI 多需更强干预）</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"GTN 失效 = 病情加重\"陷阱</strong>：本例<strong>最常见原因是过期</strong>，不是 ACS。临床实务中考患者<strong>用药依从性 + 药物有效期</strong>。</li>\n<li><strong>\"Nitrate tolerance = 通用陷阱\"陷阱</strong>：耐药发生在<strong>长期规律使用</strong>的患者，本例 prn 用得少。</li>\n<li><strong>\"O2 缓解 = 非心源性\"陷阱</strong>：心绞痛也会被 O2 缓解（O2 是辅助治疗之一）。判断\"是否心源性\"看<strong>整体模式</strong>，不是单一症状反应。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The scenario is more likely due to <strong>expiration of the glyceryl trinitrate</strong>. It is important to remind patients to update their GTN sprays or pearls. <strong>Expired GTN has reduced potency and effect on relieving ischemic pain</strong>.</p>\n<p>Since this patient refilled his prescription <strong>6 months ago</strong>, it is likely the drug is past its expiry date and has lost the desired potency.</p>\n<p><strong>Why not the others</strong>:</p>\n<ul>\n<li><strong>B</strong> (Nitrate tolerance): A concern in patients taking GTN or other nitrates on a <strong>regular basis</strong>. Resistance develops and pain control diminishes. In this patient, tolerance is very unlikely as he has not been a regular user and has used GTN occasionally on an \"as-needed\" basis.</li>\n<li><strong>A, E</strong> (Unstable angina, MI): Pain may not respond to nitrates in these conditions. However, this patient is unlikely to have these because <strong>it is unlikely for UA or MI to respond to oxygen but not to nitrates</strong>.</li>\n<li><strong>D</strong> (Poor absorption): GTN <strong>adequately and effectively absorbs</strong> through the mouth.</li>\n</ul>", "references": "<ul>\n<li>（待补：TG Cardiovascular GTN 章节）</li>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n</ul>", "related": ["AMC-QNA-P015-Stable-Angina-Stress-Test", "AMC-Q0025-PCI-Antiplatelet-Duration", "MOC-Cardiology", "Topic-Angina-Management"], "bodyHtml": "", "diseases": ["Stable Angina"], "complaints": ["chest pain"], "search": "gtn 失效 — 药物过期（reduced potency）最常见\ngtn glyceryl trinitrate drug expiration stable angina patient education\ntreatment complications prevention\n a 70-year-old man, farmer by profession, presents to the emergency department after he experienced chest pain of 20 minutes duration following physical activity. when the pain started, he took 3 puffs of glyceryl trinitrate but there was no relief. in the emergency department though, the pain alleviated with oxygen. on further questioning, you realize that he is on aspirin, metoprolol and sublingual glyceryl trinitrate spray on an 'as needed' basis. during the past 6 months, he has had only 3 episodes of chest pain subsided just by rest. he saw his gp 6 months ago when he received his last prescription. which one of the following is the most likely explanation of failure of glyceryl trinitrate to relieve his symptoms? \n correct answer is  c  \n the scenario is more likely due to  expiration of the glyceryl trinitrate . it is important to remind patients to update their gtn sprays or pearls.  expired gtn has reduced potency and effect on relieving ischemic pain . \n since this patient refilled his prescription  6 months ago , it is likely the drug is past its expiry date and has lost the desired potency. \n  why not the others : \n \n  b  (nitrate tolerance): a concern in patients taking gtn or other nitrates on a  regular basis . resistance develops and pain control diminishes. in this patient, tolerance is very unlikely as he has not been a regular user and has used gtn occasionally on an \"as-needed\" basis. \n  a, e  (unstable angina, mi): pain may not respond to nitrates in these conditions. however, this patient is unlikely to have these because  it is unlikely for ua or mi to respond to oxygen but not to nitrates . \n  d  (poor absorption): gtn  adequately and effectively absorbs  through the mouth. \n "}, {"id": "AMC-Q0014", "type": "mcq", "qid": 14, "title": "Shoulder Tip Pain — Differential Diagnosis (否定型)", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": ["differential", "diagnosis"], "topic": ["Referred Pain", "Differential Diagnosis", "Shoulder Tip Pain", "Kehr Sign Variant"], "difficulty": 3, "correctAnswer": "C", "page": 1, "tags": ["mcq", "amc", "adult-internal-medicine", "referred-pain", "approach-differential", "approach-diagnosis"], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0014-Shoulder-Tip-Pain-DDx.md", "stem": "<p>Which one of the following is <strong>not</strong> a differential diagnosis of shoulder tip pain?</p>", "options": [{"letter": "A", "text": "Pulmonary embolism"}, {"letter": "B", "text": "Myocardial infarction"}, {"letter": "C", "text": "Emphysema"}, {"letter": "D", "text": "Pneumothorax"}, {"letter": "E", "text": "Peptic ulcer disease"}], "rationale": "<p>1. <strong>题型识别</strong>：否定型题（\"is <strong>not</strong>\"）。拿到题第一时间圈出 \"NOT\"，避免漏读。 2. <strong>机制先行</strong>：肩峰痛（shoulder-tip pain）= 膈肌受刺激 → 膈神经（C3-C5）→ 牵涉到肩部皮肤。理解机制后 DDx 才能立体化。 3. <strong>建立 DDx 清单（按解剖部位）</strong>：</p>\n<ul>\n<li>胸膜/胸腔内：PE、Pneumothorax、MI、膈肌胸膜刺激</li>\n<li>腹腔/膈下：Perforated peptic ulcer、膈下脓肿</li>\n<li>局部：MSK 创伤 / 炎症</li>\n<p>4. <strong>逐项排除</strong>：</p>\n<li>A PE → 经典 diaphragmatic irritation 源 ✔</li>\n<li>B MI → 膈面受刺激 ✔</li>\n<li>C Emphysema → 题目无 pneumothorax 语境 → ✘（答案）</li>\n<li>D Pneumothorax → 胸膜刺激 ✔</li>\n<li>E PUD → 严格说需要 \"perforation\" 才是 ✔（穿孔性）</li>\n<p>5. <strong>锁定答案 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>否定题型陷阱</strong>：漏读 \"NOT\"。考试时强烈建议在 \"is not\" 下划线，再开始做题。</li>\n<li><strong>Emphysema ≠ Pneumothorax</strong>：COPD 患者常自发气胸 → 学生过度联想 → 误以为 emphysema 本身也引起肩峰痛。</li>\n<li><strong>PUD 边界</strong>：单纯 PUD 不引起肩峰痛 —— <strong>perforation</strong> 才是。这是题目隐含的\"边界条件\"。</li>\n<li><strong>MI 不是唯一胸痛答案</strong>：MI 引起的牵涉痛通常是左臂/下颌，而 MI 引起的肩峰痛是 <em>膈面 MI</em> 的少见表现 —— 部分学生忽略这个细分而漏选 B。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Shoulder-tip pain is an important clinical sign and can be caused by local musculoskeletal trauma / inflammation <strong>or referral</strong> (referred pain).</p>\n<p><strong>Referred causes of shoulder-tip pain (DDx)：</strong></p>\n<table class='md-table'>\n<thead><tr><th>类别</th><th>病因</th></tr></thead>\n<tbody>\n<tr><td>呼吸</td><td>Pulmonary embolism</td></tr>\n<tr><td>呼吸</td><td>Pneumothorax</td></tr>\n<tr><td>心血管</td><td>Myocardial infarction</td></tr>\n<tr><td>消化</td><td>Perforation of peptic ulcer disease</td></tr>\n<tr><td>其他</td><td>Diaphragmatic irritation（任何膈下/膈面刺激）</td></tr>\n</tbody>\n</table>\n<p><strong>Emphysema</strong> is <strong>not</strong> a cause of shoulder-tip pain, <strong>unless a spontaneous pneumothorax occurs</strong>.</p>", "references": "<ul>\n<li>http://www.webmd.com/pain-management/tc/referred-shoulder-pain</li>\n<li>http://www.uptodate.com/contents/evaluation-of-the-patient-with-shoulder-pain</li>\n</ul>", "related": ["AMC-QNA-P006-Orthostatic-Hypotension", "TR-Tilt-Table-Test", "MOC-General", "Topic-Referred-Pain"], "bodyHtml": "", "diseases": ["Referred Pain"], "complaints": [], "search": "shoulder tip pain — differential diagnosis (否定型)\nreferred pain differential diagnosis shoulder tip pain kehr sign variant\ndifferential diagnosis\n which one of the following is  not  a differential diagnosis of shoulder tip pain? \n correct answer is  c  \n shoulder-tip pain is an important clinical sign and can be caused by local musculoskeletal trauma / inflammation  or referral  (referred pain). \n  referred causes of shoulder-tip pain (ddx)：  \n \n   类别  病因   \n \n  呼吸  pulmonary embolism  \n  呼吸  pneumothorax  \n  心血管  myocardial infarction  \n  消化  perforation of peptic ulcer disease  \n  其他  diaphragmatic irritation（任何膈下/膈面刺激）  \n \n \n  emphysema  is  not  a cause of shoulder-tip pain,  unless a spontaneous pneumothorax occurs . "}, {"id": "AMC-Q0371", "type": "mcq", "qid": 371, "title": "吸入性糖皮质激素 — 骨软化症不是不良反应（否定型）", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["吸入性糖皮质激素不良反应 — 骨软化症不是"], "difficulty": 2, "correctAnswer": "E", "page": 1451, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0371-Inhaled-Corticosteroid-Adverse-Effects.md", "stem": "<p>A mother brings her 5-year-old boy to your practice for consultation. He has recently been started on Flixotide (fluticasone propionate) inhaler, 4-hourly. She wants to know about the adverse effects of this drug. Which one of the following is not an adverse effect?</p>", "options": [{"letter": "A", "text": "Linear growth retardation."}, {"letter": "B", "text": "Candidiasis."}, {"letter": "C", "text": "Osteoporosis."}, {"letter": "D", "text": "Weight gain."}, {"letter": "E", "text": "Osteomalacia."}], "rationale": "<p>1. 吸入性糖皮质激素不良反应分两类：</p>\n<ul>\n<li><strong>局部（最常见）</strong>：口咽念珠菌病、发声困难 → 漱口/漱喉预防</li>\n<li><strong>全身（少见）</strong>：肾上腺抑制、骨丢失（骨量减少/骨质疏松）、皮肤变薄、白内障、体重增加、代谢异常、儿童线性生长减慢、精神效应</li>\n<p>2. 骨软化症（E）不在不良反应列表中 3. 锁定答案：E</p>\n</ul>", "traps": "", "summary": "<p><strong>ICS 局部不良反应</strong>：口咽念珠菌病、发声困难 → 用后漱口</p>\n<p><strong>ICS 全身不良反应</strong>（长程高剂量）：肾上腺抑制、骨丢失（骨量减少/骨质疏松）、皮肤变薄、白内障、体重增加、代谢异常、儿童生长减慢、精神效应</p>", "explanation": "<p>长期吸入糖皮质激素可引起局部和全身不良反应。局部反应包括口咽念珠菌病和发声困难，用后漱口可轻松管理。全身反应少见，见于长程高剂量使用。<strong>骨软化症不是 ICS 已知不良反应</strong>。</p>", "references": "<ul>\n<li>UpToDate – Major side effects of inhaled glucocorticoids</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "吸入性糖皮质激素 — 骨软化症不是不良反应（否定型）\n吸入性糖皮质激素不良反应 — 骨软化症不是\n a mother brings her 5-year-old boy to your practice for consultation. he has recently been started on flixotide (fluticasone propionate) inhaler, 4-hourly. she wants to know about the adverse effects of this drug. which one of the following is not an adverse effect? \n 长期吸入糖皮质激素可引起局部和全身不良反应。局部反应包括口咽念珠菌病和发声困难，用后漱口可轻松管理。全身反应少见，见于长程高剂量使用。 骨软化症不是 ics 已知不良反应 。 "}, {"id": "AMC-Q0395", "type": "mcq", "qid": 395, "title": "ACE抑制剂绝对禁忌证 — 既往血管神经性水肿", "department": "General", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["ACE抑制剂绝对禁忌证 — 既往血管神经性水肿史"], "difficulty": 2, "correctAnswer": "A", "page": 1453, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0395-ACEI-Angioedema-Contraindication.md", "stem": "<p>During a routine visit, a 50-year-old woman with a 10-year history of type 2 diabetes mellitus is found to have a blood pressure of 145/90 mmHg. Further assessment reveals microalbuminuria. The patient is planned to be started on ACE inhibitors. Which one of the following would be an <strong>absolute contraindication</strong> to use of an ACE inhibitor in this patient?</p>", "options": [{"letter": "A", "text": "A previous history of angioneurotic edema."}, {"letter": "B", "text": "Renal insufficiency."}, {"letter": "C", "text": "Asthma."}, {"letter": "D", "text": "A history of recent myocardial infarction."}, {"letter": "E", "text": "A cardiac ejection fraction of <25%."}], "rationale": "<p>1. 题型识别：治疗 — 药物禁忌证判断 2. 场景：糖尿病+高血压+微量白蛋白尿 → ACE抑制剂是指征 3. ACE抑制剂绝对禁忌证只有三个：</p>\n<ul>\n<li><strong>妊娠</strong></li>\n<li><strong>既往ACE抑制剂相关血管性水肿</strong>（A）</li>\n<li>对特定ACE抑制剂过敏</li>\n<p>4. 排除其他选项：</p>\n<li>肾功能不全（B）：<strong>相对</strong>禁忌，长期获益大于风险</li>\n<li>哮喘（C）：不是禁忌</li>\n<li>近期心梗（D）：恰是ACE抑制剂的<strong>适应证</strong></li>\n<li>EF<25%（E）：心力衰竭是ACE抑制剂的<strong>适应证</strong></li>\n<p>5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>肾功能不全 = 相对禁忌非绝对</strong>：ACE抑制剂可导致GFR下降，但延缓肾病进展的长期获益超过暂时性GFR下降</li>\n<li><strong>心梗/心衰是适应证不是禁忌</strong>：ACE抑制剂是心梗后和心衰的标准治疗</li>\n</ul>", "summary": "<p><strong>ACE抑制剂在糖尿病肾病中的应用</strong>：</p>\n<ul>\n<li>糖尿病合并高血压 → ACE抑制剂或ARB是首选</li>\n<li>血压正常的糖尿病患者出现微量白蛋白尿 → 仍强烈推荐ACE抑制剂/ARB</li>\n<li>机制：抑制ACE → 血管扩张 → 降低肾小球毛细血管静水压 → 减少蛋白外渗 → 延缓糖尿病肾病进展</li>\n</ul>\n<p><strong>绝对禁忌证</strong>： 1. 妊娠 2. 既往ACE抑制剂相关血管性水肿 3. 对特定ACE抑制剂过敏</p>\n<p><strong>相对禁忌</strong>：显著GFR下降（原有或ACE抑制剂所致）</p>", "explanation": "<p>ACE抑制剂是糖尿病合并高血压患者的首选药物，也推荐用于伴微量白蛋白尿的血压正常糖尿病患者。唯一的绝对禁忌证是妊娠、既往血管性水肿史和对特定ACE抑制剂过敏。肾功能不全为相对禁忌，长期获益大于暂时性GFR下降。哮喘非禁忌，心梗和心衰恰为主要适应证。</p>", "references": "<ul>\n<li>RXmed.com - ACE Inhibitors</li>\n<li>Medscape - Medication Update - Angiotensin Converting Enzyme (ACE) Inhibitors</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "ace抑制剂绝对禁忌证 — 既往血管神经性水肿\nace抑制剂绝对禁忌证 — 既往血管神经性水肿史\n during a routine visit, a 50-year-old woman with a 10-year history of type 2 diabetes mellitus is found to have a blood pressure of 145/90 mmhg. further assessment reveals microalbuminuria. the patient is planned to be started on ace inhibitors. which one of the following would be an  absolute contraindication  to use of an ace inhibitor in this patient? \n ace抑制剂是糖尿病合并高血压患者的首选药物，也推荐用于伴微量白蛋白尿的血压正常糖尿病患者。唯一的绝对禁忌证是妊娠、既往血管性水肿史和对特定ace抑制剂过敏。肾功能不全为相对禁忌，长期获益大于暂时性gfr下降。哮喘非禁忌，心梗和心衰恰为主要适应证。 "}, {"id": "AMC-Q0504", "type": "mcq", "qid": 504, "title": "万古霉素红人综合征 — 特异质输注反应", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["万古霉素红人综合征 — 特异质输注反应"], "difficulty": 3, "correctAnswer": "A", "page": 1405, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0504-Red-Man-Syndrome.md", "stem": "<p>A 56-year-old man is admitted to the hospital for treatment of methicillin resistant staphylococcus aureus (MRSA) pneumonia. He is a known case of hypertension and on amilodipine and hydrochlorothiazide. You decide to start him on vancomycin. Twenty minutes after intravenous infusion of vancomycin is started, he develops a generalized erythematous rash all over his body. There is no respiratory symptom and the vitals are within the normal range. Which one of the following is the most likely cause of this presentation?</p>", "options": [{"letter": "A", "text": "Idiosyncratic drug reaction."}, {"letter": "B", "text": "Toxic shock syndrome."}, {"letter": "C", "text": "Stevens-Johnson syndrome."}, {"letter": "D", "text": "Anaphylaxis."}, {"letter": "E", "text": "Fixed drug eruption."}], "rationale": "<p>1. 题型识别：诊断 — 药物不良反应类型鉴别 2. 关键线索：万古霉素输注开始 20 分钟后全身红斑；<strong>无呼吸症状、生命体征正常</strong> 3. 红人综合征（RMS）要点：</p>\n<ul>\n<li>最常报告的万古霉素不良反应</li>\n<li><strong>速率依赖性</strong>输注反应（idiosyncratic/red neck syndrome）</li>\n<li>病因不明（特发性），<strong>不涉及药物特异性抗体</strong></li>\n<li>与过敏反应不同，<strong>首次给药即可发生</strong></li>\n<p>4. 鉴别排除：</p>\n<li>过敏性休克（D）：IgE 介导，<strong>不会</strong>在首次给药出现（需既往致敏）；喘鸣/呼吸窘迫更常见</li>\n<li>SJS（C）：迟发性、黏膜受累、表皮剥脱，20 分钟不符</li>\n<li>中毒性休克（B）：发热、低血压、多器官受累</li>\n<li>固定性药疹（E）：局限、反复同一部位</li>\n<p>5. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>红人综合征 vs 过敏性休克</strong>：临床难以区分时应按过敏性休克处理（以防万一）。喘鸣/呼吸窘迫更倾向过敏，胸痛更倾向 RMS</li>\n<li><strong>首次给药可发生</strong>：RMS 与过敏反应的关键区别——不需既往致敏</li>\n<li><strong>药物相互作用</strong>：阿片类、造影剂增加万古霉素不良反应风险；硝苯地平（非氨氯地平）可能增加风险</li>\n</ul>", "summary": "<p><strong>红人综合征（RMS）</strong>：</p>\n<ul>\n<li>特征：潮红、红斑、瘙痒，<strong>上肢、颈部、面部重于下肢</strong></li>\n<li>可伴背/胸痛和肌肉痉挛、呼吸困难、低血压</li>\n<li>很少致命，但严重心血管毒性甚至心脏骤停可发生</li>\n<li>治疗：停/减慢输注 + 抗组胺药（苯海拉明）+ 必要时西咪替丁；严重者按过敏处理</li>\n</ul>\n<p><strong>万古霉素其他不良反应</strong>：</p>\n<ul>\n<li>斑丘疹、线性 IgA 大疱性皮病</li>\n<li>白细胞增多、嗜酸性粒细胞增多、中性粒细胞减少（长疗程，需每周查血常规）、免疫性血小板减少</li>\n<li>药物热</li>\n<li>肾毒性（合用肾毒性药/肾功能不全/血流动力学改变）、间质性肾炎</li>\n</ul>", "explanation": "<p>万古霉素可引起多种超敏反应，从局限皮肤反应到全身心血管衰竭。<strong>红人综合征是最常见的报告不良反应</strong>，为速率依赖的输注反应，病因不明，不涉及药物特异性抗体，首次给药即可发生。本例在输注 20 分钟后出现全身红斑、无呼吸症状、生命体征正常，最符合 RMS。IgE 介导的过敏性休克不会在首次给药出现（需既往致敏），且喘鸣/呼吸窘迫更常见于过敏。</p>", "references": "<ul>\n<li>http://www.medsafe.govt.nz/profs/datasheet/v/Vanco</li>\n<li>AMedex Topic: Vancomycin (page 1405)</li>\n</ul>", "related": ["AMC-Q0505-Red-Man-Syndrome-Management", "_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "万古霉素红人综合征 — 特异质输注反应\n万古霉素红人综合征 — 特异质输注反应\n a 56-year-old man is admitted to the hospital for treatment of methicillin resistant staphylococcus aureus (mrsa) pneumonia. he is a known case of hypertension and on amilodipine and hydrochlorothiazide. you decide to start him on vancomycin. twenty minutes after intravenous infusion of vancomycin is started, he develops a generalized erythematous rash all over his body. there is no respiratory symptom and the vitals are within the normal range. which one of the following is the most likely cause of this presentation? \n 万古霉素可引起多种超敏反应，从局限皮肤反应到全身心血管衰竭。 红人综合征是最常见的报告不良反应 ，为速率依赖的输注反应，病因不明，不涉及药物特异性抗体，首次给药即可发生。本例在输注 20 分钟后出现全身红斑、无呼吸症状、生命体征正常，最符合 rms。ige 介导的过敏性休克不会在首次给药出现（需既往致敏），且喘鸣/呼吸窘迫更常见于过敏。 "}, {"id": "AMC-Q0505", "type": "mcq", "qid": 505, "title": "红人综合征的管理 — 减慢输注再继续", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["红人综合征管理 — 减慢输注速率再继续"], "difficulty": 2, "correctAnswer": "B", "page": 1407, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0505-Red-Man-Syndrome-Management.md", "stem": "<p>During hospital stay of a 62-year-old woman, she develops pneumonia. Since methicillin resistant staphylococcus aureus (MRSA) is highly suspected, intravenous vancomycin is started. After 20 minutes of infusion, the patient develops a generalized pruritic erythematous rash all over her face, torso and arms. She also complains of chest tightness. The infusion is stopped immediately, and within few minutes the rash resolves. A quick drug history reveals that he is on aspirin and amilodipine for treatment of her hypertension. Which one of the following is correct regarding continuation of vancomycin?</p>", "options": [{"letter": "A", "text": "Change the concentration of vancomycin."}, {"letter": "B", "text": "Restart the infusion at a slower rate."}, {"letter": "C", "text": "Switch to another antibiotic."}, {"letter": "D", "text": "Never give her vancomycin again."}, {"letter": "E", "text": "Give vancomycin along with prednisolone."}], "rationale": "<p>1. 题型识别：治疗 — 药物不良反应的管理 2. 判断反应类型：红斑 + 瘙痒 + <strong>胸部紧压感</strong>，无喘鸣/喉头水肿 → <strong>红人综合征（中重度）</strong>而非过敏性休克 3. 管理流程：</p>\n<ul>\n<li>停止输注</li>\n<li>苯海拉明 50mg IV + 雷尼替丁 50mg IV</li>\n<li>症状缓解后以<strong>初始速率的一半或 10mg/min（取较慢者）</strong>重新开始</li>\n<li>本例有胸痛 → 输注时间延长至 <strong>≥4 小时</strong> + 以后每次给药前抗组胺预处理</li>\n<p>4. 排除：</p>\n<li>若为过敏性休克（喘鸣、喉头水肿、荨麻疹）→ 肌注肾上腺素，<strong>永不再用万古霉素</strong>（除非脱敏）</li>\n<li>泼尼松不能降低 RMS 复发风险</li>\n<p>5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>区分 RMS 与过敏</strong>：胸痛/胸部紧压感更常见于 RMS；喘鸣、呼吸窘迫、血管性水肿更常见于过敏</li>\n<li><strong>不因 RMS 停用万古霉素</strong>：MRSA 肺炎需要万古霉素，RMS 可通过减慢输注解决；只有过敏性反应才永不再用</li>\n<li><strong>泼尼松无效</strong>：激素不能预防 RMS 复发</li>\n<li><strong>\"永远不再给药\"（D）仅适用于真正的过敏反应</strong></li>\n</ul>", "summary": "<p><strong>RMS 管理分级</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>严重度</th><th>处理</th></tr></thead>\n<tbody>\n<tr><td>轻中度（潮红/瘙痒，无血流动力学不稳）</td><td>中断输注 + 苯海拉明 50mg PO/IV + 雷尼替丁 50mg IV → 以 1/2 初始速率或 10mg/min（较慢者）重新开始</td></tr>\n<tr><td>严重（肌痉挛、胸痛、低血压）</td><td>中断 + 苯海拉明 50mg IV + 雷尼替丁 50mg IV + 低血压时补液 → 症状缓解后 ≥4 小时输注；以后每次给药前抗组胺预处理 + 4 小时输注</td></tr>\n<tr><td>过敏性反应</td><td>肌注肾上腺素，永不再用（除非脱敏）</td></tr>\n</tbody>\n</table>\n<p><strong>可加重因素</strong>：阿片类、造影剂（促组胺释放）；硝苯地平可能增加万古霉素不良反应风险</p>", "explanation": "<p>该患者为典型 RMS 伴胸痛（中重度）。胸痛的存在提示需减慢输注速率（4 小时以上）重新开始，并给予抗组胺药和雷尼替丁预处理。与抗组胺药不同，泼尼松并未显示能降低 RMS 复发风险。若为过敏反应（有荨麻疹、喉头水肿、喘鸣），则应肌注肾上腺素且永不再用万古霉素，除非进行脱敏。</p>", "references": "<ul>\n<li>http://www.medsafe.govt.nz/profs/datasheet/v/Vanco</li>\n</ul>", "related": ["AMC-Q0504-Red-Man-Syndrome", "_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": ["chest pain"], "search": "红人综合征的管理 — 减慢输注再继续\n红人综合征管理 — 减慢输注速率再继续\n during hospital stay of a 62-year-old woman, she develops pneumonia. since methicillin resistant staphylococcus aureus (mrsa) is highly suspected, intravenous vancomycin is started. after 20 minutes of infusion, the patient develops a generalized pruritic erythematous rash all over her face, torso and arms. she also complains of chest tightness. the infusion is stopped immediately, and within few minutes the rash resolves. a quick drug history reveals that he is on aspirin and amilodipine for treatment of her hypertension. which one of the following is correct regarding continuation of vancomycin? \n 该患者为典型 rms 伴胸痛（中重度）。胸痛的存在提示需减慢输注速率（4 小时以上）重新开始，并给予抗组胺药和雷尼替丁预处理。与抗组胺药不同，泼尼松并未显示能降低 rms 复发风险。若为过敏反应（有荨麻疹、喉头水肿、喘鸣），则应肌注肾上腺素且永不再用万古霉素，除非进行脱敏。 "}, {"id": "AMC-Q0548", "type": "mcq", "qid": 548, "title": "遗传性乳腺-卵巢癌综合征 — 风险指标（否定型）", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["遗传性乳腺-卵巢癌综合征 — 风险指标（否定型）"], "difficulty": 3, "correctAnswer": "A", "page": 1420, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0548-HBOC-Risk-Factors.md", "stem": "<p>A 25-year-old woman comes to your clinic concerned about a breast lump in her left breast. She says that the lump is mobile and tender to palpation. You find out that the lump is benign and is due to hormonal changes. She is concerned about her risk of having breast cancer. Her mother died of breast cancer at 45 years of age, and one of her aunts died of ovarian cancer. Which one of the following is not a risk indicator of familial breast-ovarian cancer in her?</p>", "options": [{"letter": "A", "text": "Onset of the cancer > 50 years old."}, {"letter": "B", "text": "Two first-degree or second-degree relatives on one side of family with ovarian or breast cancer."}, {"letter": "C", "text": "Individuals with ovarian cancer."}, {"letter": "D", "text": "Breast cancer in a male relative."}, {"letter": "E", "text": "Bilateral or multifocal breast cancer."}], "rationale": "<p>1. 题型识别：否定型题 — 找出<strong>不是</strong>风险指标的选项 2. HBOC 风险指标（BRCA1/BRCA2 突变相关）：</p>\n<ul>\n<li>一侧家族中有 <strong>2 名</strong>一级或二级亲属患卵巢癌或乳腺癌</li>\n<li>受累亲属<strong><50 岁</strong>发病</li>\n<li>一名亲属患两种癌（乳腺癌+卵巢癌，或两个独立乳腺癌）</li>\n<li><strong>双侧或多灶</strong>乳腺癌</li>\n<li>卵巢癌（尤其 <50 岁）</li>\n<li><strong>男性亲属乳腺癌</strong></li>\n<li>阿什肯纳兹犹太血统（风险加倍）</li>\n<p>3. 逐项检查：B/C/D/E 都是风险指标；A（>50 岁发病）<strong>不是</strong>——风险指标要求 <50 岁 4. 锁定答案：A</p>\n</ul>", "traps": "<ul>\n<li><strong>\"<50 岁\" 与 \">50 岁\"</strong>：这是否定型题的经典陷阱——风险指标是<strong>早发</strong>（<50），A 选项把方向反了</li>\n<li><strong>男性乳腺癌</strong>：罕见但<strong>是</strong>风险指标（BRCA2 尤其相关）——别误以为男性乳腺癌不算</li>\n<li><strong>本病例背景</strong>：母亲 45 岁乳腺癌 + 姑姑卵巢癌 → 本例患者本人其实<strong>符合</strong>风险指标（有家族史），题目问的是\"哪项不是\"</li>\n</ul>", "summary": "<p><strong>HBOC（遗传性乳腺-卵巢癌综合征）风险指标</strong>：</p>\n<ul>\n<li>一侧家族 ≥2 名一级/二级亲属患卵巢癌或乳腺癌</li>\n<li>受累亲属 <strong><50 岁</strong>发病</li>\n<li>1 名亲属患两种癌（乳腺+卵巢 或 两个独立乳腺）</li>\n<li>双侧/多灶乳腺癌</li>\n<li>卵巢癌（尤其 <50 岁）</li>\n<li>男性亲属乳腺癌</li>\n<li>阿什肯纳兹犹太血统</li>\n</ul>\n<p><strong>BRCA1/BRCA2 终身风险</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>癌症</th><th>风险</th></tr></thead>\n<tbody>\n<tr><td>乳腺癌</td><td>40-80%（约 50%）</td></tr>\n<tr><td>卵巢癌</td><td>11-40%</td></tr>\n<tr><td>男性乳腺癌</td><td>1-10%</td></tr>\n<tr><td>前列腺癌</td><td>高达 39%</td></tr>\n<tr><td>胰腺癌</td><td>1-7%</td></tr>\n</tbody>\n</table>\n<p><strong>其他相关综合征</strong>：共济失调-毛细血管扩张症、Cowden 综合征、Peutz-Jeghers 综合征、遗传性弥漫性胃癌（CDH1）、Lynch 综合征（HNPCC）、PALB2 突变</p>", "explanation": "<p>HBOC 综合征主要由 BRCA1 或 BRCA2 致病突变引起，强遗传倾向乳腺、卵巢、前列腺和胰腺癌。选项中，<strong>癌症 >50 岁发病不是 HBOC 风险指标</strong>——风险指标要求受累亲属 <50 岁发病。两项以上一级/二级亲属患乳腺/卵巢癌、卵巢癌个体、男性亲属乳腺癌、双侧/多灶乳腺癌都是风险指标。</p>", "references": "<ul>\n<li>http://canceraustralia.gov.au/sites/default/files/</li>\n<li>http://emedicine.medscape.com/article/1947145-over</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "遗传性乳腺-卵巢癌综合征 — 风险指标（否定型）\n遗传性乳腺-卵巢癌综合征 — 风险指标（否定型）\n a 25-year-old woman comes to your clinic concerned about a breast lump in her left breast. she says that the lump is mobile and tender to palpation. you find out that the lump is benign and is due to hormonal changes. she is concerned about her risk of having breast cancer. her mother died of breast cancer at 45 years of age, and one of her aunts died of ovarian cancer. which one of the following is not a risk indicator of familial breast-ovarian cancer in her? \n hboc 综合征主要由 brca1 或 brca2 致病突变引起，强遗传倾向乳腺、卵巢、前列腺和胰腺癌。选项中， 癌症 >50 岁发病不是 hboc 风险指标 ——风险指标要求受累亲属  "}, {"id": "AMC-Q0650", "type": "mcq", "qid": 650, "title": "副肿瘤性低钾 — 小细胞肺癌异位 ACTH", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["副肿瘤综合征 — 肺癌低钾（异位 ACTH）"], "difficulty": 2, "correctAnswer": "C", "page": 1437, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0650-Lung-Cancer-Hypokalemia.md", "stem": "<p>Which one of the following malignancies is most likely to have hypokalemia as an associated feature?</p>", "options": [{"letter": "A", "text": "Colon cancer."}, {"letter": "B", "text": "Breast cancer."}, {"letter": "C", "text": "Lung cancer."}, {"letter": "D", "text": "Renal cell carcinoma."}, {"letter": "E", "text": "Cancer of the pancreas."}], "rationale": "<p>1. 题型识别：诊断 — 副肿瘤综合征与肿瘤关联 2. 核心机制：ACTH 或 ACTH 样物质分泌的肿瘤 → <strong>低钾性肾病</strong>（24h 尿钾丢失 >20 mEq） 3. 发生人群：<strong>ACTH 分泌型肺肿瘤（小细胞癌）的 50%</strong> 4. Cushing 综合征：异位 ACTH 也是副肿瘤内分泌综合征之一 5. 锁定答案：C</p>", "traps": "<ul>\n<li><strong>\"小细胞肺癌\"是异位 ACTH 王牌</strong>：选项中肺癌（C）直接对应</li>\n<li><strong>低钾机制</strong>：ACTH → 皮质醇 → 矿物皮质激素样效应 → 尿钾丢失——不是肿瘤直接耗钾</li>\n<li><strong>副肿瘤综合征可以是癌症的首发表现</strong>：无已知癌症的患者出现副肿瘤综合征 → 应积极排查</li>\n</ul>", "summary": "<p><strong>副肿瘤综合征</strong>：</p>\n<ul>\n<li>定义：肿瘤的非转移性全身效应，由肿瘤远处产生的物质引起</li>\n<li>表现可涉及：内分泌、肾、神经肌肉、骨骼肌、皮肤、血液、胃肠</li>\n<li>可为癌症的首发或最突出表现 → 需积极排查</li>\n</ul>\n<p><strong>低钾相关</strong>：</p>\n<ul>\n<li>低钾性肾病：24h 尿钾丢失 >20 mEq</li>\n<li>见于分泌 ACTH/ACTH 样物质的肿瘤</li>\n<li><strong>ACTH 分泌型肺肿瘤（小细胞癌）50% 发生</strong></li>\n</ul>\n<p><strong>Cushing 综合征</strong>：由小细胞肺癌产生的 ACTH 或 ACTH 样物质引起</p>", "explanation": "<p>副肿瘤综合征是肿瘤引发的免疫异常反应，表现为伴随恶性疾病的非转移性全身效应。低钾性肾病（24h 尿钾丢失 >20 mEq）可见于分泌 ACTH 或 ACTH 样物质的肿瘤——<strong>50% 的 ACTH 分泌型肺肿瘤（小细胞癌）发生</strong>。Cushing 综合征也是可由小细胞肺癌异位 ACTH 引起的副肿瘤内分泌综合征。选项中肺癌与低钾关联最强。</p>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/280744-clini</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "副肿瘤性低钾 — 小细胞肺癌异位 acth\n副肿瘤综合征 — 肺癌低钾（异位 acth）\n which one of the following malignancies is most likely to have hypokalemia as an associated feature? \n 副肿瘤综合征是肿瘤引发的免疫异常反应，表现为伴随恶性疾病的非转移性全身效应。低钾性肾病（24h 尿钾丢失 >20 meq）可见于分泌 acth 或 acth 样物质的肿瘤—— 50% 的 acth 分泌型肺肿瘤（小细胞癌）发生 。cushing 综合征也是可由小细胞肺癌异位 acth 引起的副肿瘤内分泌综合征。选项中肺癌与低钾关联最强。 "}, {"id": "AMC-Q0691", "type": "mcq", "qid": 691, "title": "感染性蛋白引起的CNS疾病 — 克雅病（Creutzfeldt-Jakob Disease）", "department": "General", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["CNS感染性疾病 — 朊蛋白引起的克雅病"], "difficulty": 2, "correctAnswer": "B", "page": 1487, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0691-CJD-Prion-CNS-Infection.md", "stem": "<p>Which one of the following diseases of the central nervous system is caused by <strong>infectious proteins</strong>?</p>", "options": [{"letter": "A", "text": "Alzheimer's disease."}, {"letter": "B", "text": "Creutzfeldt-Jakob disease."}, {"letter": "C", "text": "Parkinson's disease."}, {"letter": "D", "text": "Pick's disease."}, {"letter": "E", "text": "Guillain-Barre syndrome."}], "rationale": "<p>1. 题型识别：诊断 — 病因学判断 2. 关键词：\"infectious proteins\" = prion 朊蛋白 3. 各选项病因：</p>\n<ul>\n<li>阿尔茨海默病（A）：β淀粉样蛋白和tau蛋白沉积 — 非感染性</li>\n<li>克雅病（B）：<strong>朊蛋白</strong> — 唯一的感染性蛋白疾病</li>\n<li>帕金森病（C）：α-突触核蛋白聚集 — 非感染性</li>\n<li>皮克病（D）：额颞叶痴呆的一种，tau蛋白病变 — 非感染性</li>\n<li>吉兰-巴雷综合征（E）：免疫介导的周围神经脱髓鞘 — 非感染性蛋白</li>\n<p>4. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>\"感染性蛋白\" vs 普通感染</strong>：CJD由朊蛋白（无核酸的感染性蛋白颗粒）引起，不同于细菌/病毒/真菌感染</li>\n<li><strong>Alzheimer与CJD</strong>：两者均表现为痴呆，但病因完全不同（淀粉样蛋白沉积 vs 朊蛋白感染）</li>\n</ul>", "summary": "<p><strong>克雅病（Creutzfeldt-Jakob Disease, CJD）</strong>：</p>\n<ul>\n<li>病因：感染性蛋白颗粒 — <strong>朊蛋白（prion）</strong></li>\n<li>发病年龄：约70余岁</li>\n<li>临床表现：<strong>痴呆 + 肌阵挛</strong></li>\n<li>病程：进展迅速，一年内死亡</li>\n<li>诊断：快速进展性痴呆 + 肌阵挛 + CSF中14-3-3蛋白阳性</li>\n</ul>", "explanation": "<p>克雅病由称为朊蛋白的感染性蛋白颗粒引起。该病通常在70余岁发病，表现为痴呆和肌阵挛，病程进展，一年内死亡。阿尔茨海默病、帕金森病和皮克病均为神经退行性疾病（非感染性蛋白引起），吉兰-巴雷综合征是免疫介导的周围神经病。</p>", "references": "<ul>\n<li>Medscape - Prion-Related Diseases</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "感染性蛋白引起的cns疾病 — 克雅病（creutzfeldt-jakob disease）\ncns感染性疾病 — 朊蛋白引起的克雅病\n which one of the following diseases of the central nervous system is caused by  infectious proteins ? \n 克雅病由称为朊蛋白的感染性蛋白颗粒引起。该病通常在70余岁发病，表现为痴呆和肌阵挛，病程进展，一年内死亡。阿尔茨海默病、帕金森病和皮克病均为神经退行性疾病（非感染性蛋白引起），吉兰-巴雷综合征是免疫介导的周围神经病。 "}, {"id": "AMC-Q0693", "type": "mcq", "qid": 693, "title": "小肠淋巴瘤 — 乳糜泻是最重要危险因素", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["小肠淋巴瘤 — 乳糜泻是最重要危险因素"], "difficulty": 2, "correctAnswer": "C", "page": 1445, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0693-Celiac-Small-Bowel-Lymphoma.md", "stem": "<p>A 45-year-old man is diagnosed with a primary lymphoma of the small bowel. In check for predisposing factors, which one of the following risk factors is most likely to be present?</p>", "options": [{"letter": "A", "text": "Crohn disease."}, {"letter": "B", "text": "Peutz-Jeghers syndrome."}, {"letter": "C", "text": "Celiac disease."}, {"letter": "D", "text": "Familial adenomatous polyposis."}, {"letter": "E", "text": "Previous gastrectomy."}], "rationale": "<p>1. 题型识别：诊断 — 小肠肿瘤危险因素 2. 关键区分：题目问<strong>淋巴瘤</strong>（不是腺癌） 3. 小肠恶性肿瘤分布：约 50% 为腺癌；其余为类癌、淋巴瘤、GIST、转移灶 4. 危险因素匹配：</p>\n<ul>\n<li><strong>乳糜泻（C）→ 小肠淋巴瘤</strong> ✓</li>\n<li>克罗恩病（A）→ 小肠腺癌（远端回肠，风险增 100 倍）</li>\n<li>Peutz-Jeghers 综合征（B）→ 错构瘤恶性变 → 腺癌</li>\n<li>FAP（D）→ 结直肠癌为主，十二指肠/小肠腺癌可发生</li>\n<li>胃切除（E）→ 胃残端腺癌（>25 年）</li>\n<p>5. 锁定答案：C</p>\n</ul>", "traps": "<ul>\n<li><strong>腺癌 vs 淋巴瘤的危险因素不同</strong>：克罗恩、PJS、FAP、胃切除 → 腺癌；乳糜泻 → 淋巴瘤（也是腺癌风险因素之一，但题目问淋巴瘤）</li>\n<li><strong>\"小肠腺癌\"干扰</strong>：选项 A/B/D/E 都是小肠<strong>腺癌</strong>的危险因素——读到\"淋巴瘤\"是关键</li>\n<li><strong>FAP</strong>：虽以结直肠癌为主，十二指肠和小肠腺癌也可发生</li>\n</ul>", "summary": "<p><strong>小肠恶性肿瘤分布</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>比例</th></tr></thead>\n<tbody>\n<tr><td>腺癌</td><td>约 50%</td></tr>\n<tr><td>类癌</td><td>—</td></tr>\n<tr><td>淋巴瘤</td><td>—</td></tr>\n<tr><td>GIST</td><td>—</td></tr>\n<tr><td>转移灶</td><td>—</td></tr>\n</tbody>\n</table>\n<p><strong>危险因素</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>肿瘤</th><th>危险因素</th></tr></thead>\n<tbody>\n<tr><td><strong>小肠淋巴瘤</strong></td><td><strong>乳糜泻</strong></td></tr>\n<tr><td>小肠腺癌</td><td>克罗恩病（远端回肠，风险 ×100）、Peutz-Jeghers 综合征、FAP、乳糜泻</td></tr>\n<tr><td>胃残端腺癌</td><td>胃切除 >25 年</td></tr>\n</tbody>\n</table>", "explanation": "<p>约 50% 小肠恶性肿瘤为腺癌，其余包括类癌、淋巴瘤、GIST 和转移灶。<strong>小肠淋巴瘤最重要的危险因素是乳糜泻</strong>。克罗恩病与受累区域（尤其远端回肠）小肠腺癌风险增加 100 倍相关；Peutz-Jeghers 综合征的错构瘤可恶性变，增加腺癌风险；FAP 患者除结直肠癌外，十二指肠和小肠腺癌也可发生；胃切除 >25 年患者胃残端腺癌风险增加。</p>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pubmed/11903028</li>\n<li>AMC Handbook of Multiple Choice Questions – pages 450-451</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "小肠淋巴瘤 — 乳糜泻是最重要危险因素\n小肠淋巴瘤 — 乳糜泻是最重要危险因素\n a 45-year-old man is diagnosed with a primary lymphoma of the small bowel. in check for predisposing factors, which one of the following risk factors is most likely to be present? \n 约 50% 小肠恶性肿瘤为腺癌，其余包括类癌、淋巴瘤、gist 和转移灶。 小肠淋巴瘤最重要的危险因素是乳糜泻 。克罗恩病与受累区域（尤其远端回肠）小肠腺癌风险增加 100 倍相关；peutz-jeghers 综合征的错构瘤可恶性变，增加腺癌风险；fap 患者除结直肠癌外，十二指肠和小肠腺癌也可发生；胃切除 >25 年患者胃残端腺癌风险增加。 "}, {"id": "AMC-Q0811", "type": "mcq", "qid": 811, "title": "澳大利亚最常见癌症 — 皮肤癌（非黑色素瘤）", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["澳大利亚最常见癌症 — 皮肤癌"], "difficulty": 1, "correctAnswer": "B", "page": 1450, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0811-Common-Cancer-Australia.md", "stem": "<p>Which one of the following is the most common cancer in Australia?</p>", "options": [{"letter": "A", "text": "Lung cancer."}, {"letter": "B", "text": "Skin cancer."}, {"letter": "C", "text": "Breast cancer."}, {"letter": "D", "text": "Prostate cancer."}, {"letter": "E", "text": "Colorectal cancer."}], "rationale": "<p>1. 题型识别：流行病学 — 癌症患病率排序 2. 核心：<strong>非黑色素瘤皮肤癌</strong>（基底细胞癌、皮肤鳞癌）是澳大利亚最常见癌症 3. 排除非黑色素瘤皮肤癌后的前五（患病率排序）： 1. 前列腺癌 2. 乳腺癌（女性） 3. 皮肤黑色素瘤 4. 结直肠癌 5. 肺癌 4. 若包括非黑色素瘤皮肤癌 → 皮肤癌仍然最常见 5. 锁定答案：B</p>", "traps": "<ul>\n<li><strong>\"非黑色素瘤皮肤癌\"是关键限定</strong>：BCC + 皮肤鳞癌 > 黑色素瘤——皮肤癌大类包含黑色素瘤</li>\n<li><strong>前列腺 vs 乳腺</strong>：排除皮肤癌后前列腺第 1、乳腺第 2（女性）——但皮肤癌（含非黑色素瘤）整体仍第一</li>\n<li><strong>肺癌不是最常见</strong>：澳洲肺癌患病率第五——别被常见认知带偏</li>\n</ul>", "summary": "<p><strong>澳大利亚癌症患病率</strong>：</p>\n<ul>\n<li><strong>第 1 位：皮肤癌（非黑色素瘤：基底细胞癌 + 皮肤鳞癌）</strong></li>\n<li>排除皮肤癌后：</li>\n<p>1. 前列腺癌 2. 乳腺癌（女性） 3. 皮肤黑色素瘤 4. 结直肠癌 5. 肺癌</p>\n</ul>", "explanation": "<p>非黑色素瘤皮肤癌（基底细胞癌和皮肤鳞状细胞癌）是澳大利亚最常见癌症。排除非黑色素瘤皮肤癌后，按患病率排序前五为前列腺癌、乳腺癌（女性）、皮肤黑色素瘤、结直肠癌和肺癌。然而，一旦将非黑色素瘤皮肤癌（鳞癌和基底细胞癌）包括在内，<strong>皮肤癌仍然是澳大利亚最常见的癌症</strong>。</p>", "references": "<ul>\n<li>Cancer Australia – Cancer in Australia statistics</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "澳大利亚最常见癌症 — 皮肤癌（非黑色素瘤）\n澳大利亚最常见癌症 — 皮肤癌\n which one of the following is the most common cancer in australia? \n 非黑色素瘤皮肤癌（基底细胞癌和皮肤鳞状细胞癌）是澳大利亚最常见癌症。排除非黑色素瘤皮肤癌后，按患病率排序前五为前列腺癌、乳腺癌（女性）、皮肤黑色素瘤、结直肠癌和肺癌。然而，一旦将非黑色素瘤皮肤癌（鳞癌和基底细胞癌）包括在内， 皮肤癌仍然是澳大利亚最常见的癌症 。 "}, {"id": "AMC-Q0816", "type": "mcq", "qid": 816, "title": "酒精相关痴呆 — 占澳洲所有痴呆病例的5%", "department": "General", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["酒精相关痴呆 — 占澳洲所有痴呆病例的5%"], "difficulty": 2, "correctAnswer": "B", "page": 1493, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0816-Alcohol-Dementia-Percentage.md", "stem": "<p>Alcohol-related dementia accounts for what percent of all cases of dementia in Australia?</p>", "options": [{"letter": "A", "text": "10%."}, {"letter": "B", "text": "5%."}, {"letter": "C", "text": "90%."}, {"letter": "D", "text": "80%."}, {"letter": "E", "text": "35%."}], "rationale": "<p>1. 题型识别：诊断 — 流行病学/统计分析 2. 关键数据记忆：</p>\n<ul>\n<li>阿尔茨海默病：<strong>80-85%</strong></li>\n<li>血管性痴呆：<strong>10%</strong></li>\n<li>酒精相关痴呆：<strong>5%</strong></li>\n<p>3. 排除明显不合理的选项：90%（C）、80%（D）、35%（E）都过高 4. 10%（A）是血管性痴呆的比例，非酒精相关 5. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>酒精 vs 血管性痴呆</strong>：10%是血管性痴呆的比例，易与酒精相关痴呆（5%）混淆</li>\n<li><strong>数据绝对值记忆</strong>：关键是将5%与其他常见痴呆百分比区分</li>\n</ul>", "summary": "<p><strong>澳大利亚痴呆病因分布</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>类型</th><th>占比</th></tr></thead>\n<tbody>\n<tr><td>阿尔茨海默病</td><td>80-85%</td></tr>\n<tr><td>血管性痴呆</td><td>10%</td></tr>\n<tr><td>酒精相关痴呆</td><td>5%（5.4%）</td></tr>\n</tbody>\n</table>\n<p>来源：Panegyres and Frencham (2000)，Australian Institute of Health and Welfare</p>", "explanation": "<p>根据澳大利亚健康与福利研究所数据，酒精相关痴呆约占所有痴呆病例的5%。血管性痴呆占约10%，阿尔茨海默病占80-85%。该数据来自Panegyres和Frencham（2000）的研究，报告酒精相关痴呆发病率为5.4%。</p>", "references": "<ul>\n<li>Australian Institute of Health and Welfare</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "酒精相关痴呆 — 占澳洲所有痴呆病例的5%\n酒精相关痴呆 — 占澳洲所有痴呆病例的5%\n alcohol-related dementia accounts for what percent of all cases of dementia in australia? \n 根据澳大利亚健康与福利研究所数据，酒精相关痴呆约占所有痴呆病例的5%。血管性痴呆占约10%，阿尔茨海默病占80-85%。该数据来自panegyres和frencham（2000）的研究，报告酒精相关痴呆发病率为5.4%。 "}, {"id": "AMC-Q0831", "type": "mcq", "qid": 831, "title": "阿片过量 — 纳洛酮需重复给药", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["阿片过量 — 纳洛酮重复给药"], "difficulty": 2, "correctAnswer": "B", "page": 1409, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0831-Opioid-Overdose-Naloxone.md", "stem": "<p>Catherine, 76 years old, is rushed to the Emergency Department of the local hospital you work at after she was found drowsy. She has end-stage ovarian cancer and is on methadone, codeine, paracetamol, naproxen, and diazepam for pain control. On her way to the hospital, she was given naloxone 0.4 mg intravenously because she has pinpoint pupils. On examination, you notice that her pupils are still pin-point sized, but she is less drowsy and able to communicate. The first thing she says to you is that she is still in severe pain. Which one of the following would be the most appropriate next step in management?</p>", "options": [{"letter": "A", "text": "Give her naproxen."}, {"letter": "B", "text": "Give her another dose of naloxone."}, {"letter": "C", "text": "Give her diazepam."}, {"letter": "D", "text": "Give her more methadone for adequate pain control."}, {"letter": "E", "text": "Give her morphine, intravenously."}], "rationale": "<p>1. 题型识别：治疗 — 阿片过量的急诊管理 2. 关键判断：患者服用美沙酮 + 可待因 → 嗜睡 + 针尖样瞳孔 = 阿片过量（除外其他原因前均按此处理） 3. 现状评估：给了纳洛酮 0.4mg IV，但<strong>瞳孔仍针尖样 + 仍嗜睡</strong> → 阿片毒性未完全逆转 4. 处理：<strong>重复给予纳洛酮</strong> 5. 排除：</p>\n<ul>\n<li>阿片过量时再给任何阿片类（美沙酮/吗啡）→ 加重病情</li>\n<li>地西泮 → 更多 CNS 抑制，抑制呼吸驱动</li>\n<li>萘普生 → 对阿片过量患者无止痛意义</li>\n<li>疼痛控制需在脱离急诊危险后谨慎规划</li>\n<p>6. 锁定答案：B</p>\n</ul>", "traps": "<ul>\n<li><strong>针尖样瞳孔</strong>：阿片过量的标志，纳洛酮后仍存在 = 未完全逆转</li>\n<li><strong>\"患者说痛\"是干扰项</strong>：不能因主诉疼痛而给阿片——现在首要目标是逆转过量，止痛后续再处理</li>\n<li><strong>半衰期差异</strong>：美沙酮半衰期长，纳洛酮作用时间短，常需重复或持续输注</li>\n</ul>", "summary": "<p><strong>阿片过量处理</strong>：</p>\n<ul>\n<li>诊断线索：嗜睡/意识障碍 + 针尖样瞳孔 + 呼吸抑制</li>\n<li>纳洛酮：0.4mg IV，可重复；长半衰期阿片（美沙酮）需重复给药或持续输注</li>\n<li>目标：逆转呼吸抑制和意识障碍</li>\n<li>疼痛控制：急诊期后谨慎规划（阿片过量逆转后疼痛管理是复杂平衡）</li>\n</ul>\n<p><strong>纳洛酮重复指征</strong>：给药后瞳孔仍针尖样、仍嗜睡、呼吸仍受抑 → 未完全逆转 → 重复给药</p>", "explanation": "<p>患者药物清单含美沙酮和可待因，嗜睡 + 针尖样瞳孔在除外其他原因前都应按阿片过量处理。救护车上已给纳洛酮 0.4mg，但瞳孔仍针尖样、仍嗜睡，提示阿片毒性未完全逆转——此时需重复给予纳洛酮。萘普生对过量服用阿片的患者无止痛意义；地西泮加重 CNS 抑制并抑制呼吸驱动；给过量患者再给任何阿片类都是不合适的。</p>", "references": "<ul>\n<li>Medscape – Opioid Toxicity</li>\n</ul>", "related": ["_MOC-General"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "阿片过量 — 纳洛酮需重复给药\n阿片过量 — 纳洛酮重复给药\n catherine, 76 years old, is rushed to the emergency department of the local hospital you work at after she was found drowsy. she has end-stage ovarian cancer and is on methadone, codeine, paracetamol, naproxen, and diazepam for pain control. on her way to the hospital, she was given naloxone 0.4 mg intravenously because she has pinpoint pupils. on examination, you notice that her pupils are still pin-point sized, but she is less drowsy and able to communicate. the first thing she says to you is that she is still in severe pain. which one of the following would be the most appropriate next step in management? \n 患者药物清单含美沙酮和可待因，嗜睡 + 针尖样瞳孔在除外其他原因前都应按阿片过量处理。救护车上已给纳洛酮 0.4mg，但瞳孔仍针尖样、仍嗜睡，提示阿片毒性未完全逆转——此时需重复给予纳洛酮。萘普生对过量服用阿片的患者无止痛意义；地西泮加重 cns 抑制并抑制呼吸驱动；给过量患者再给任何阿片类都是不合适的。 "}, {"id": "AMC-Q0967", "type": "mcq", "qid": 967, "title": "ACEI 血管性水肿 — 无皮疹的舌肿胀", "department": "Adult Internal Medicine", "subcategory": "General", "rawSubcategory": "General", "approach": [], "topic": ["ACEI 血管性水肿 — 舌肿胀无皮疹"], "difficulty": 3, "correctAnswer": "D", "page": 1417, "tags": [], "cssclass": "mcq-general", "color": "#5e7a8e", "file": "01-Adult-Internal-Medicine/General/AMC-Q0967-ACEI-Angioedema.md", "stem": "<p>A 61-year-old man is brought to your clinic by his wife with complaint of sudden-onset tongue swelling. He is diabetic and is on treatment with metformin and chlorpropramide, has hypercholesterolemia for which he takes simvastatin, and also suffers from hypertension that is controlled with ramipril. Four weeks ago, he presented to his GP with complaints of fever and productive c
