25%)：低估</li>\n<li>C (50%)：低估</li>\n<li>D (80%)：<strong>正确</strong></li>\n<li>E (100%)：错（不是必死，少数抢救成功）</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"破裂 = 必死\"陷阱</strong>：错。<strong>80-90%</strong>（不是 100%），有抢救窗口。</li>\n<li><strong>\"数字 = 50%\"陷阱</strong>：50% 是一些心脏急症的数字（如院外 CA 抢救成功率），<strong>不是</strong>破裂 AAA。</li>\n<li><strong>\"手术死亡率\"陷阱</strong>：题问的是<strong>破裂 AAA 总体死亡率</strong>（包含院前+术后），不是<strong>手术死亡率</strong>（择期 AAA 手术死亡率 ~5%，急诊手术 ~50%）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Rupture of an AAA into the peritoneal cavity is often usually rapidly fatal</strong>, whereas, <strong>retroperitoneal rupture often stabilizes transiently</strong> providing a window of opportunity for life-saving surgical intervention and repair. Collectively, <strong>a ruptured AAA is catastrophic and carries a mortality risk of 80-90%</strong>.</p>\n<p><strong>Distinction worth noting</strong>:</p>\n<ul>\n<li><strong>Ruptured AAA overall mortality</strong>: <strong>80-90%</strong> (this question)</li>\n<li><strong>Elective AAA surgical mortality</strong>: ~5% (planned repair)</li>\n<li><strong>Emergency AAA surgical mortality</strong>: ~50% (but selected survivors)</li>\n</ul>\n<p><strong>Clinical pearl</strong>: A 10.5 cm AAA is <strong>well above</strong> the surgical threshold (5.5 cm in men, 5.0 cm in women) and has a <strong>very high annual rupture risk</strong>. Surgical repair is strongly recommended <strong>before</strong> rupture occurs.</p>", "references": "<ul>\n<li>RACGP — Aortic aneurysms Screening, surveillance and referral</li>\n<li>（待补：2020 SVS 腹主动脉瘤指南）</li>\n</ul>", "related": ["AMC-Q0258-AAA-Repair-Indication", "AMC-Q0259-Ruptured-AAA-Bedside-USG", "MOC-Cardiology", "Topic-AAA-Prognosis"], "bodyHtml": "", "diseases": ["AAA"], "complaints": ["dyspnea", "weakness"], "search": "破裂 aaa 死亡率 — 80-90%（不是 100%）\nruptured aaa mortality overall mortality surgical risk patient counseling\ndefinition complications treatment\n you are called to see a 58-year-old patient, who has presented with complaints of weakness and shortness of breath. a blood test reveals hemoglobin of 85 g/l (120-160). as a part of the workup for finding the cause of his anemia, an abdominal ct scan is performed showing a 10.5 cm infra-renal abdominal aortic aneurysm as an incidental finding. you tell the patient that he needs surgery for treatment of his aneurysm. he wants to know how dangerous it could be if he does not have the surgery. which one of the following is the mortality rate of a ruptured abdominal aortic aneurysm? \n correct answer is  d  \n  rupture of an aaa into the peritoneal cavity is often usually rapidly fatal , whereas,  retroperitoneal rupture often stabilizes transiently  providing a window of opportunity for life-saving surgical intervention and repair. collectively,  a ruptured aaa is catastrophic and carries a mortality risk of 80-90% . \n  distinction worth noting : \n \n  ruptured aaa overall mortality :  80-90%  (this question) \n  elective aaa surgical mortality : ~5% (planned repair) \n  emergency aaa surgical mortality : ~50% (but selected survivors) \n \n  clinical pearl : a 10.5 cm aaa is  well above  the surgical threshold (5.5 cm in men, 5.0 cm in women) and has a  very high annual rupture risk . surgical repair is strongly recommended  before  rupture occurs. "}, {"id": "AMC-Q0261", "type": "mcq", "qid": 261, "title": "A 型主动脉夹层 — Morphine + BB + TEE（绝对禁溶栓 / 抗凝）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "complications"], "topic": ["Aortic Dissection", "Type A vs B", "Management", "Beta Blocker", "Pain Control", "TEE", "CT Angiography"], "difficulty": 5, "correctAnswer": "C", "page": 50, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "aortic-dissection", "type-a", "beta-blocker", "tees", "approach-treatment", "approach-diagnosis", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0261-Aortic-Dissection-Type-A.md", "stem": "<p>A 72-year-old man is brought to emergency department with ambulance after he sustained a sudden severe chest pain radiating to his back. On auscultation there is a diastolic murmur best heard over the left sternal border in the second intercostal space. ECG shows ST elevation in leads II, III and aVF. A CXR is remarkable for a widened mediastinum. Which one of the following is the most appropriate management?</p>", "options": [{"letter": "A", "text": "Give alteplase"}, {"letter": "B", "text": "Give aspirin, intravenous morphine, and beta blockers"}, {"letter": "C", "text": "Give morphine and beta blockers and arrange for emergency trans-esophageal sonography"}, {"letter": "D", "text": "Refer the patient to cardiology clinic"}, {"letter": "E", "text": "Arrange for emergency angiography"}], "rationale": "<p>1. <strong>题型识别</strong>：突发胸痛放射背 + 主动脉瓣反流杂音 + 下壁 STEMI + 纵隔增宽 → <strong>A 型主动脉夹层</strong> 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>72 岁 + 突发撕裂样胸痛<strong>放射背</strong>（夹层经典）</li>\n<li>胸骨左缘第 2 肋间<strong>舒张期杂音</strong> = <strong>主动脉瓣反流</strong>（夹层累及升主动脉根部）</li>\n<li>ECG：II, III, aVF ST 抬高 = <strong>下壁 STEMI</strong>（夹层累及右冠状动脉开口）</li>\n<li>CXR：<strong>纵隔增宽</strong>（夹层典型）</li>\n<p>3. <strong>A 型 vs B 型夹层</strong>：</p>\n<li><strong>A 型</strong>（Stanford）：累及升主动脉 → <strong>手术</strong></li>\n<li><strong>B 型</strong>：仅降主动脉 → 药物控制</li>\n<li>本例：累及升主动脉（主动脉瓣反流 + 冠脉受累）→ <strong>A 型</strong></li>\n<p>4. <strong>A 型夹层处理</strong>：</p>\n<li><strong>吗啡</strong>：镇痛（部分降压作用）</li>\n<li><strong>β 受体阻滞剂</strong>（艾司洛尔、拉贝洛尔）：<strong>降心率到 60 bpm</strong>、降 SBP < 120 mmHg（<strong>减低剪切力</strong>，防夹层扩展）——<strong>首选</strong></li>\n<li><strong>TEE / CTA</strong>：确诊 + 评估范围</li>\n<li><strong>绝对禁忌</strong>：溶栓、抗凝、抗血小板（→ 致夹层扩展 / 出血）</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Alteplase)：<strong>绝对禁忌</strong>（溶栓致死）</li>\n<li>B (Aspirin + 吗啡 + BB)：<strong>Aspirin 禁忌</strong>（抗血小板加重夹层出血）</li>\n<li>C (吗啡 + BB + TEE)：<strong>正确</strong></li>\n<li>D (Cardiology clinic)：<strong>患者是急症</strong>，不能门诊转诊</li>\n<li>E (Emergency angiography)：CTA 可用，但 TEE 更快（床旁、可在 ICU/ED 做）—— TEE 不可用时 CTA 替代</li>\n<p>6. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"STEMI = 溶栓\"陷阱</strong>：本例 ECG 是下壁 STEMI，但<strong>真因是夹层累及右冠</strong>（不是冠脉血栓）。<strong>溶栓致死</strong>。</li>\n<li><strong>\"Aspirin 是 ACS 标配\"陷阱</strong>：本例<strong>不是 ACS</strong>，是<strong>夹层</strong>。Aspirin / 抗凝 / 抗血小板<strong>全部禁忌</strong>（加重夹层出血）。</li>\n<li><strong>\"BB 治 MI\"陷阱</strong>：BB 在本例<strong>不是治 MI</strong>——是<strong>降心率、减剪切力、防夹层扩展</strong>。</li>\n<li><strong>\"Angiography = 确诊金标准\"陷阱</strong>：TEE（食道超声）更快、<strong>床旁</strong>可做、不需造影剂。CTA 是 TEE 不可用时的替代。</li>\n<li><strong>\"Type B = 不急\"陷阱</strong>：Type A 是真急症，Type B 可药物。本例是 Type A，<strong>必须手术</strong>。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>The clinical findings of <strong>abrupt chest pain radiating to back</strong> and a <strong>widened mediastinum on CXR</strong> are consistent with diagnosis <strong>aortic dissection</strong>. The <strong>diastolic murmur</strong> signifies involvement of the proximal aorta resulting in <strong>aortic regurgitation</strong> and decreased blood flow to the <strong>coronary arteries</strong> and a consequent <strong>myocardial infarction (MI)</strong>.</p>\n<p><strong>Critical contraindications</strong>:</p>\n<ul>\n<li><strong>Thrombolytics (e.g. alteplase) (option A) are absolutely contraindicated</strong> when aortic dissection is suspected.</li>\n<li><strong>Aspirin (option B), clopidogrel and other anticoagulation medications are contraindicated</strong> as well due to increased risk of deterioration of the dissection.</li>\n</ul>\n<p><strong>The cornerstone of initial therapy</strong>:</p>\n<ul>\n<li><strong>Morphine for pain control</strong> (and its partial effect on lowering blood pressure)</li>\n<li><strong>Beta blockers</strong> to maintain the systolic blood pressure below 120 mmHg</li>\n<li><strong>Trans-esophageal sonography (TEE)</strong> to confirm the diagnosis emergently</li>\n</ul>\n<p><strong>Angiography using CT angiogram (CTA) (option E)</strong> is the preferred method <strong>if TEE is not available</strong>.</p>\n<p><strong>Stanford classification</strong>:</p>\n<ul>\n<li><strong>Type A</strong> (ascending aorta involved) → <strong>surgical emergency</strong></li>\n<li><strong>Type B</strong> (descending only) → medical management</li>\n</ul>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC186140</li>\n<li>http://www.ecinsw.com.au/aortic-dissection</li>\n<li>（待补：2022 ACC/AHA 主动脉疾病指南）</li>\n</ul>", "related": ["AMC-Q0259-Ruptured-AAA-Bedside-USG", "AMC-Q0248-AS-Syncope-Monitoring", "AMC-Q0224-Thrombolytics-Contraindications", "MOC-Cardiology", "Topic-Aortic-Dissection"], "bodyHtml": "", "diseases": ["Aortic Dissection"], "complaints": ["chest pain"], "search": "a 型主动脉夹层 — morphine + bb + tee（绝对禁溶栓 / 抗凝）\naortic dissection type a vs b management beta blocker pain control tee ct angiography\ntreatment diagnosis complications\n a 72-year-old man is brought to emergency department with ambulance after he sustained a sudden severe chest pain radiating to his back. on auscultation there is a diastolic murmur best heard over the left sternal border in the second intercostal space. ecg shows st elevation in leads ii, iii and avf. a cxr is remarkable for a widened mediastinum. which one of the following is the most appropriate management? \n correct answer is  c  \n the clinical findings of  abrupt chest pain radiating to back  and a  widened mediastinum on cxr  are consistent with diagnosis  aortic dissection . the  diastolic murmur  signifies involvement of the proximal aorta resulting in  aortic regurgitation  and decreased blood flow to the  coronary arteries  and a consequent  myocardial infarction (mi) . \n  critical contraindications : \n \n  thrombolytics (e.g. alteplase) (option a) are absolutely contraindicated  when aortic dissection is suspected. \n  aspirin (option b), clopidogrel and other anticoagulation medications are contraindicated  as well due to increased risk of deterioration of the dissection. \n \n  the cornerstone of initial therapy : \n \n  morphine for pain control  (and its partial effect on lowering blood pressure) \n  beta blockers  to maintain the systolic blood pressure below 120 mmhg \n  trans-esophageal sonography (tee)  to confirm the diagnosis emergently \n \n  angiography using ct angiogram (cta) (option e)  is the preferred method  if tee is not available . \n  stanford classification : \n \n  type a  (ascending aorta involved) →  surgical emergency  \n  type b  (descending only) → medical management \n "}, {"id": "AMC-Q0262", "type": "mcq", "qid": 262, "title": "急性肢体缺血最常见原因 — 血栓形成（不是栓塞）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "differential", "complications"], "topic": ["Acute Limb Ischemia", "Etiology", "Thrombosis vs Embolism", "Atrial Fibrillation", "Epidemiology"], "difficulty": 3, "correctAnswer": "B", "page": 52, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "limb-ischemia", "thrombosis", "embolism", "approach-definition", "approach-differential", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0262-Limb-Ischemia-Thrombosis.md", "stem": "<p>Which one of the following is the most common cause of acute limb ischemia?</p>", "options": [{"letter": "A", "text": "Congestive heart failure"}, {"letter": "B", "text": "Thrombosis"}, {"letter": "C", "text": "Vasculitis"}, {"letter": "D", "text": "Embolism"}, {"letter": "E", "text": "Smoking"}], "rationale": "<p>1. <strong>题型识别</strong>：急性肢体缺血的<strong>最常见病因</strong> 2. <strong>关键数字</strong>：</p>\n<ul>\n<li><strong>血栓形成：> 80%</strong>（基础是动脉粥样硬化斑块破裂 → 局部血栓）</li>\n<li>栓塞：< 20%（其中 2/3 来自房颤）</li>\n<p>3. <strong>为什么血栓多、栓塞少</strong>：</p>\n<li>现代动脉粥样硬化治疗进步（statin、抗血小板）</li>\n<li><strong>风湿性心脏病减少</strong>（传统栓塞来源 ↓）</li>\n<li>房颤抗凝普及（栓塞 ↓）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (CHF)：致慢性缺血，不致急性肢体缺血</li>\n<li>B (Thrombosis)：<strong>正确</strong></li>\n<li>C (Vasculitis)：罕见</li>\n<li>D (Embolism)：<strong>少数</strong>（< 20%）</li>\n<li>E (Smoking)：<strong>风险因素</strong>，不是直接病因</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"栓塞 = 急性肢体缺血最常见\"陷阱</strong>：错。<strong>血栓 > 80%</strong>。栓塞是 2/3 来自房颤的少数原因。</li>\n<li><strong>\"Smoking = 病因\"陷阱</strong>：Smoking 是<strong>风险因素</strong>（致动脉粥样硬化），不是急性发作的<strong>直接病因</strong>。</li>\n<li><strong>\"CHF = 肢体缺血\"陷阱</strong>：CHF 致水肿、淤血，不致急性肢体缺血。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Thrombotic occlusion</strong> is the <strong>most common cause of acute lower limb ischemia</strong> accounting for <strong>more than 80% of cases</strong>.</p>\n<ul>\n<li>(Option D) Occlusion from embolus is not as common, <strong>partly due to decline in rheumatic heart disease and prompt management of patients with atrial fibrillation with prophylactic anticoagulation</strong>. <strong>Atrial fibrillation accounts for two-thirds of acute limb ischemias due to embolism</strong> (i.e., only ~6-7% of all acute limb ischemia).</li>\n<li>(Options A, C and E) Congestive heart failure, vasculitis and smoking are <strong>less common</strong> risk factors of acute limb ischemia.</li>\n</ul>\n<p><strong>Clinical teaching point</strong>:</p>\n<ul>\n<li>The 6 P's of acute limb ischemia: <strong>P</strong>ain, <strong>P</strong>allor, <strong>P</strong>ulselessness, <strong>P</strong>aresthesia, <strong>P</strong>aralysis, <strong>P</strong>oikilothermia (cold)</li>\n</ul>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC11177</li>\n<li>（待补：2024 ESVS 急性肢体缺血指南）</li>\n</ul>", "related": ["AMC-Q0263-Limb-Ischemia-Emergency-Surgery", "AMC-Q0264-Acute-Limb-Ischemia-Heparin-Embolectomy", "AMC-Q0245-AF-HF-Metoprolol", "MOC-Cardiology", "Topic-Acute-Limb-Ischemia"], "bodyHtml": "", "diseases": ["Acute Limb Ischemia", "AF"], "complaints": [], "search": "急性肢体缺血最常见原因 — 血栓形成（不是栓塞）\nacute limb ischemia etiology thrombosis vs embolism atrial fibrillation epidemiology\ndefinition differential complications\n which one of the following is the most common cause of acute limb ischemia? \n correct answer is  b  \n  thrombotic occlusion  is the  most common cause of acute lower limb ischemia  accounting for  more than 80% of cases . \n \n (option d) occlusion from embolus is not as common,  partly due to decline in rheumatic heart disease and prompt management of patients with atrial fibrillation with prophylactic anticoagulation .  atrial fibrillation accounts for two-thirds of acute limb ischemias due to embolism  (i.e., only ~6-7% of all acute limb ischemia). \n (options a, c and e) congestive heart failure, vasculitis and smoking are  less common  risk factors of acute limb ischemia. \n \n  clinical teaching point : \n \n the 6 p's of acute limb ischemia:  p ain,  p allor,  p ulselessness,  p aresthesia,  p aralysis,  p oikilothermia (cold) \n "}, {"id": "AMC-Q0263", "type": "mcq", "qid": 263, "title": "急性肢体缺血的\"手术强指征\" — 瘫痪（不是苍白 / 冷）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["physical-exam", "diagnosis", "treatment"], "topic": ["Acute Limb Ischemia", "Emergency Surgery Indication", "Paralysis", "6 P's", "Paresthesia"], "difficulty": 3, "correctAnswer": "C", "page": 53, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "limb-ischemia", "paralysis", "6-ps", "emergency", "approach-physical-exam", "approach-diagnosis", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0263-Limb-Ischemia-Emergency-Surgery.md", "stem": "<p>Which one of the following signs mandates emergency surgical intervention in acute limb ischemia?</p>", "options": [{"letter": "A", "text": "Pallor"}, {"letter": "B", "text": "Coldness"}, {"letter": "C", "text": "Paralysis"}, {"letter": "D", "text": "Pain at rest"}, {"letter": "E", "text": "Pulselessness"}], "rationale": "<p>1. <strong>题型识别</strong>：急性肢体缺血 6 P's 中，<strong>哪个最要求立即手术</strong>？ 2. <strong>6 P's 记忆</strong>：</p>\n<ul>\n<li><strong>P</strong>ain</li>\n<li><strong>P</strong>allor</li>\n<li><strong>P</strong>ulselessness</li>\n<li><strong>P</strong>aresthesia</li>\n<li><strong>P</strong>aralysis</li>\n<li><strong>P</strong>oikilothermia (cold)</li>\n<p>3. <strong>哪个最可靠</strong>：</p>\n<li><strong>Pallor</strong>：受光线影响 → 不可靠</li>\n<li><strong>Coldness</strong>：受环境温度影响 → 不可靠</li>\n<li><strong>Pain at rest / 苍白</strong>：也见于<strong>慢性</strong>缺血</li>\n<li><strong>Pulselessness</strong>：可作参考，但<strong>非最关键</strong></li>\n<li><strong>Paralysis</strong>：神经肌肉失功能 → <strong>最可靠</strong>的晚期体征</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Pallor)：<strong>不可靠</strong></li>\n<li>B (Coldness)：<strong>不可靠</strong>（环境温度）</li>\n<li>C (Paralysis)：<strong>正确</strong>（最关键）</li>\n<li>D (Pain at rest)：慢性缺血也有</li>\n<li>E (Pulselessness)：可靠但<strong>非最关键</strong></li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"Pain 最严重 = 最早手术\"陷阱</strong>：pain 是早期体征；<strong>瘫痪 = 晚期</strong>、<strong>最严重</strong>、<strong>最关键</strong>。</li>\n<li><strong>\"Pulselessness = 最严重\"陷阱</strong>：pulselessness 重要但<strong>不一定</strong>意味着立即手术（慢性闭塞也可无脉搏）。</li>\n<li><strong>\"Coldness = 急性\"陷阱</strong>：环境温度低也会冷。</li>\n<li><strong>\"Pallor = 急性\"陷阱</strong>：贫血、休克也可苍白。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p><strong>Paralysis</strong> is present when a patient with acute limb ischemia is <strong>unable to wriggle the toes or fingers</strong>. It is the <strong>most reliable sign</strong> indicating acute limb ischemia <strong>requiring emergency surgical intervention</strong>. <strong>Paresthesia of the affected limb is another indicator</strong> of acute limb ischemia and can be used in the absence of paralysis.</p>\n<ul>\n<li>(Option A) <strong>Pallor</strong> is among the signs suggesting acute limb ischemia; however, the color of the limb may be affected by the <strong>ambient light</strong>.</li>\n<li>(Option B) <strong>Coldness</strong> of the limb is the <strong>least reliable</strong> sign as it can be due to <strong>decreased body temperature of the patient to cold weather</strong>.</li>\n<li>(Option D) <strong>Pain (either with exertion or at rest) and pallor can be caused by chronic ischemia as well</strong>, and are not reliable indicators of the need for emergency surgical treatment.</li>\n<li>(Option E) <strong>Pulselessness</strong> can be a sign of acute limb ischemia, but <strong>paralysis remains the most critical indicator</strong>.</li>\n</ul>\n<p><strong>6 P's of acute limb ischemia</strong> (in order of severity): 1. Pain (earliest) 2. Pallor 3. Pulselessness 4. Paresthesia 5. Paralysis (most critical → surgery) 6. Poikilothermia (cold)</p>\n<p><strong>Golden time for surgery: 4 hours</strong> (irreversible damage after 6 hours).</p>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC111776</li>\n<li>（待补：2024 ESVS 急性肢体缺血指南）</li>\n</ul>", "related": ["AMC-Q0262-Limb-Ischemia-Thrombosis", "AMC-Q0264-Acute-Limb-Ischemia-Heparin-Embolectomy", "MOC-Cardiology", "Topic-Acute-Limb-Ischemia"], "bodyHtml": "", "diseases": ["Acute Limb Ischemia"], "complaints": [], "search": "急性肢体缺血的\"手术强指征\" — 瘫痪（不是苍白 / 冷）\nacute limb ischemia emergency surgery indication paralysis 6 p's paresthesia\nphysical-exam diagnosis treatment\n which one of the following signs mandates emergency surgical intervention in acute limb ischemia? \n correct answer is  c  \n  paralysis  is present when a patient with acute limb ischemia is  unable to wriggle the toes or fingers . it is the  most reliable sign  indicating acute limb ischemia  requiring emergency surgical intervention .  paresthesia of the affected limb is another indicator  of acute limb ischemia and can be used in the absence of paralysis. \n \n (option a)  pallor  is among the signs suggesting acute limb ischemia; however, the color of the limb may be affected by the  ambient light . \n (option b)  coldness  of the limb is the  least reliable  sign as it can be due to  decreased body temperature of the patient to cold weather . \n (option d)  pain (either with exertion or at rest) and pallor can be caused by chronic ischemia as well , and are not reliable indicators of the need for emergency surgical treatment. \n (option e)  pulselessness  can be a sign of acute limb ischemia, but  paralysis remains the most critical indicator . \n \n  6 p's of acute limb ischemia  (in order of severity): 1. pain (earliest) 2. pallor 3. pulselessness 4. paresthesia 5. paralysis (most critical → surgery) 6. poikilothermia (cold) \n  golden time for surgery: 4 hours  (irreversible damage after 6 hours). "}, {"id": "AMC-Q0264", "type": "mcq", "qid": 264, "title": "急性肢体缺血 — 立即肝素 + 紧急取栓（4 小时黄金期）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "complications", "definition"], "topic": ["Acute Limb Ischemia", "Management", "Heparin", "Emergency Embolectomy", "4-hour Golden Time"], "difficulty": 3, "correctAnswer": "A", "page": 54, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "limb-ischemia", "heparin", "embolectomy", "approach-treatment", "approach-complications", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0264-Acute-Limb-Ischemia-Heparin-Embolectomy.md", "stem": "<p>A 65-year-old man presents to the emergency department with sudden onset right-sided leg pain and paresthesia. On physical examination, the distal pulses of the right leg are absent and the limb is cold. A CT angiography is arranged showing thrombotic occlusion of the right femoral artery. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Intravenous infusion of heparin and emergency embolectomy"}, {"letter": "B", "text": "Intravenous infusion of heparin for 24 hours and review"}, {"letter": "C", "text": "Complete bed rest with compression bandage and leg elevation"}, {"letter": "D", "text": "Start the patient on warfarin"}, {"letter": "E", "text": "Start the patient on aspirin and clopidogrel"}], "rationale": "<p>1. <strong>题型识别</strong>：急性肢体缺血 + CT 证实股动脉血栓闭塞 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>65 岁男性</li>\n<li>突发右腿痛 + 感觉异常</li>\n<li>远端脉搏消失 + 肢体冷</li>\n<li>CTA：右股动脉<strong>血栓</strong>闭塞</li>\n<li><strong>关键</strong>：有 paresthesia（感觉异常）→ 6 P's 之一 → <strong>手术指征</strong></li>\n<p>3. <strong>处理算法</strong>：</p>\n<li><strong>第一步：IV heparin</strong>（立即抗凝，防血栓扩展）</li>\n<li><strong>第二步：emergency embolectomy</strong>（4 小时黄金期）</li>\n<li><strong>第三步</strong>：长期抗凝（见 Q0267）</li>\n<p>4. <strong>黄金期</strong>：</p>\n<li><strong>4 h 内</strong>手术 → 可逆</li>\n<li><strong>6 h 以上</strong> → 不可逆损害</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Heparin + embolectomy)：<strong>正确</strong></li>\n<li>B (Heparin 24h only)：延误手术</li>\n<li>C (Bed rest + 弹力袜 + 抬高)：<strong>错</strong>——压迫缺血肢体=加重</li>\n<li>D (Warfarin alone)：warfarin 早期<strong>致凝</strong>（protein C/S ↓ 快），<strong>不</strong>单独用</li>\n<li>E (Aspirin + clopidogrel)：急性期<strong>不</strong>用抗血小板（手术需停）</li>\n<p>6. <strong>锁定 A</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"先抗凝观察\"陷阱</strong>：错。<strong>有手术指征</strong>（paresthesia = 6 P's 之一）就要立即手术，<strong>不能\"先观察\"</strong>。</li>\n<li><strong>\"抬高肢体改善灌注\"陷阱</strong>：错。抬高=减灌注=加重缺血。</li>\n<li><strong>\"Warfarin 一线\"陷阱</strong>：Warfarin 在急性期<strong>有短暂促凝</strong>（protein C/S 下降快）→ <strong>必须先用 heparin 桥接</strong>。</li>\n<li><strong>\"抗血小板 = 抗凝\"陷阱</strong>：错。两者机制不同，急性肢体缺血是<strong>血栓</strong>（需要抗凝），不是<strong>血小板聚集</strong>（需要抗血小板）。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>A</strong></p>\n<p>The clinical and imaging findings are quite consistent with <strong>acute limb ischemia</strong>. <strong>Paralysis, paresthesia and compartment syndrome are ominous signs that demand emergency surgical intervention after heparin has been started</strong>.</p>\n<p><strong>The golden time for surgical intervention is 4 hours</strong>. Signs of ischemia are reversible if prompt action is taken within this period. <strong>Prolonged acute ischemia (>6 hours) leaves irreversible and permanent deficits</strong>.</p>\n<p><strong>Heparin cover</strong> should be maintained and warfarin started. Heparin then can be safely withheld once the INR is 2-3. <strong>Warfarin alone is not recommended as it is pro-coagulation at the beginning</strong>.</p>\n<p><strong>Acute limb ischemia management flow</strong>: 1. <strong>IV heparin bolus + infusion</strong> (immediate) 2. <strong>Imaging</strong> (CTA or angiography) 3. <strong>Revascularization</strong> within 4-6 hours:</p>\n<ul>\n<li><strong>Embolectomy</strong> (Fogarty catheter)</li>\n<li><strong>Thrombolysis</strong> (catheter-directed, if no surgery)</li>\n<li><strong>Bypass</strong> (if endovascular fails)</li>\n<p>4. <strong>Long-term anticoagulation</strong> (warfarin 3-6 months or lifelong if cardioembolic)</p>\n</ul>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC111776</li>\n<li>（待补：2024 ESVS 急性肢体缺血指南）</li>\n</ul>", "related": ["AMC-Q0263-Limb-Ischemia-Emergency-Surgery", "AMC-Q0267-Limb-Ischemia-Warfarin-3-6mo", "AMC-Q0265-Reperfusion-Injury-Hypokalemia", "MOC-Cardiology"], "bodyHtml": "", "diseases": ["Acute Limb Ischemia"], "complaints": ["leg pain/swelling", "paresthesia"], "search": "急性肢体缺血 — 立即肝素 + 紧急取栓（4 小时黄金期）\nacute limb ischemia management heparin emergency embolectomy 4-hour golden time\ntreatment complications definition\n a 65-year-old man presents to the emergency department with sudden onset right-sided leg pain and paresthesia. on physical examination, the distal pulses of the right leg are absent and the limb is cold. a ct angiography is arranged showing thrombotic occlusion of the right femoral artery. which one of the following is the next best step in management? \n correct answer is  a  \n the clinical and imaging findings are quite consistent with  acute limb ischemia .  paralysis, paresthesia and compartment syndrome are ominous signs that demand emergency surgical intervention after heparin has been started . \n  the golden time for surgical intervention is 4 hours . signs of ischemia are reversible if prompt action is taken within this period.  prolonged acute ischemia (>6 hours) leaves irreversible and permanent deficits . \n  heparin cover  should be maintained and warfarin started. heparin then can be safely withheld once the inr is 2-3.  warfarin alone is not recommended as it is pro-coagulation at the beginning . \n  acute limb ischemia management flow : 1.  iv heparin bolus + infusion  (immediate) 2.  imaging  (cta or angiography) 3.  revascularization  within 4-6 hours: \n \n  embolectomy  (fogarty catheter) \n  thrombolysis  (catheter-directed, if no surgery) \n  bypass  (if endovascular fails) \n 4.  long-term anticoagulation  (warfarin 3-6 months or lifelong if cardioembolic) \n "}, {"id": "AMC-Q0265", "type": "mcq", "qid": 265, "title": "再灌注损伤 NOT 特征 — 低钾（其他都对）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["definition", "complications", "diagnosis"], "topic": ["Reperfusion Injury", "Compartment Syndrome", "Metabolic Acidosis", "Hyperkalemia", "Myoglobinuria", "CK"], "difficulty": 3, "correctAnswer": "B", "page": 55, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "reperfusion-injury", "compartment-syndrome", "rhabdomyolysis", "approach-definition", "approach-complications", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0265-Reperfusion-Injury-Hypokalemia.md", "stem": "<p>A 70-year-old man presents with acute pain and paralysis of the right leg diagnosed to have been caused by acute leg ischemia. Heparin is started immediately. After emergency imaging, he is transferred to the operating room for embolectomy. Surgical intervention successfully restored blood supply to the affected limb after 3 hours. This patient is at risk of developing reperfusion injury as a result of prolonged ischemia. Which one of the following is not a characteristic feature of reperfusion injury?</p>", "options": [{"letter": "A", "text": "Hyperkalemia"}, {"letter": "B", "text": "Hypokalemia"}, {"letter": "C", "text": "Metabolic acidosis"}, {"letter": "D", "text": "Myoglobinuria"}, {"letter": "E", "text": "Elevated creatine kinase"}], "rationale": "<p>1. <strong>题型识别</strong>：再灌注损伤的<strong>反向题</strong>（找 NOT）。 2. <strong>再灌注损伤机制</strong>：</p>\n<ul>\n<li>缺血时细胞<strong>无氧代谢</strong> → 乳酸堆积</li>\n<li>细胞膜 Na/K-ATPase 失活 → 细胞内 Na、Ca 升、K 外流</li>\n<li>缺血细胞死亡 → 细胞内<strong>K</strong>、肌红蛋白、CK 释放</li>\n<li>再灌注时所有缺血产物<strong>一次性入血</strong></li>\n<p>3. <strong>特征表现</strong>：</p>\n<li><strong>高钾</strong>（不是低钾）</li>\n<li>代谢性酸中毒（乳酸）</li>\n<li>肌红蛋白尿（<strong>急性肾损伤</strong>风险）</li>\n<li><strong>CK 升高</strong>（肌细胞破坏）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Hyperkalemia)：<strong>是</strong>特征</li>\n<li>B (Hypokalemia)：<strong>不是</strong>特征 ← NOT</li>\n<li>C (Metabolic acidosis)：<strong>是</strong>特征</li>\n<li>D (Myoglobinuria)：<strong>是</strong>特征</li>\n<li>E (Elevated CK)：<strong>是</strong>特征</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"缺血 = 钾降\"陷阱</strong>：错。缺血 = <strong>细胞内钾外流</strong> → <strong>高钾</strong>。再灌注 = 高钾入血<strong>进一步加重</strong>。</li>\n<li><strong>\"CK 升高 = 心梗\"陷阱</strong>：CK 也可源于骨骼肌（再灌注时骨骼肌细胞破坏 → CK）。</li>\n<li><strong>\"肌红蛋白 = 肾毒性\"陷阱</strong>：肌红蛋白经肾排出可致<strong>急性肾损伤</strong>（肌红蛋白管型），需水化 + 碱化尿液。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p><strong>Reperfusion injury</strong> is a complication of blood restoration to a limb, which has been ischemic for a while. Characteristic features are all related to ischemia and its impacts on tissue (especially muscle cells).</p>\n<p><strong>Features of reperfusion syndrome</strong>:</p>\n<ul>\n<li><strong>Metabolic acidosis</strong> (lactic acidosis)</li>\n<li><strong>Elevated creatine kinase</strong></li>\n<li><strong>Hyperkalemia</strong></li>\n<li><strong>Myoglobinemia and myoglobinuria</strong></li>\n</ul>\n<p><strong>Hypokalemia is not a characteristic feature of reperfusion injury.</strong></p>\n<p><strong>Extent of reperfusion injury depends on</strong>:</p>\n<ul>\n<li>Duration and site of arterial blockage</li>\n<li>Extent of collateral flow</li>\n<li>Previous health of the affected limb</li>\n</ul>\n<p><strong>Approximately one-third of all deaths from arterial occlusions are due to metabolic complications after revascularization.</strong></p>\n<p><strong>Clinical management</strong>:</p>\n<ul>\n<li>IV fluids (aggressive hydration)</li>\n<li>Alkalinize urine (prevent myoglobin precipitation)</li>\n<li>Treat hyperkalemia</li>\n<li>Monitor for compartment syndrome → fasciotomy</li>\n</ul>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC111776</li>\n<li>（待补：2024 ESVS 急性肢体缺血指南）</li>\n</ul>", "related": ["AMC-Q0264-Acute-Limb-Ischemia-Heparin-Embolectomy", "AMC-Q0262-Limb-Ischemia-Thrombosis", "MOC-Cardiology", "Topic-Reperfusion-Injury"], "bodyHtml": "", "diseases": [], "complaints": ["paralysis", "leg pain/swelling"], "search": "再灌注损伤 not 特征 — 低钾（其他都对）\nreperfusion injury compartment syndrome metabolic acidosis hyperkalemia myoglobinuria ck\ndefinition complications diagnosis\n a 70-year-old man presents with acute pain and paralysis of the right leg diagnosed to have been caused by acute leg ischemia. heparin is started immediately. after emergency imaging, he is transferred to the operating room for embolectomy. surgical intervention successfully restored blood supply to the affected limb after 3 hours. this patient is at risk of developing reperfusion injury as a result of prolonged ischemia. which one of the following is not a characteristic feature of reperfusion injury? \n correct answer is  b  \n  reperfusion injury  is a complication of blood restoration to a limb, which has been ischemic for a while. characteristic features are all related to ischemia and its impacts on tissue (especially muscle cells). \n  features of reperfusion syndrome : \n \n  metabolic acidosis  (lactic acidosis) \n  elevated creatine kinase  \n  hyperkalemia  \n  myoglobinemia and myoglobinuria  \n \n  hypokalemia is not a characteristic feature of reperfusion injury.  \n  extent of reperfusion injury depends on : \n \n duration and site of arterial blockage \n extent of collateral flow \n previous health of the affected limb \n \n  approximately one-third of all deaths from arterial occlusions are due to metabolic complications after revascularization.  \n  clinical management : \n \n iv fluids (aggressive hydration) \n alkalinize urine (prevent myoglobin precipitation) \n treat hyperkalemia \n monitor for compartment syndrome → fasciotomy \n "}, {"id": "AMC-Q0267", "type": "mcq", "qid": 267, "title": "急性肢体缺血取栓后 — Warfarin 3-6 月（不是终身）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "prevention", "complications"], "topic": ["Acute Limb Ischemia", "Post-Embolectomy", "Anticoagulation", "Warfarin 3-6 months", "Heparin Bridge"], "difficulty": 3, "correctAnswer": "C", "page": 56, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "limb-ischemia", "warfarin", "anticoagulation", "approach-treatment", "approach-prevention", "approach-complications"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0267-Limb-Ischemia-Warfarin-3-6mo.md", "stem": "<p>A 55-year-old man presents to the emergency department after sudden onset of pain and paresthesia in his left leg. On examination, the distal pulses of the left lower limb are absent and the limb is cold and painful. A CT angiogram is performed and establishes the presence of femoral artery embolism. The patient was started on intravenous heparin and embolectomy was carried out. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Aspirin and warfarin for 6 months"}, {"letter": "B", "text": "Lifelong aspirin"}, {"letter": "C", "text": "Warfarin for 3-6 months"}, {"letter": "D", "text": "Low molecular weight heparin for six months and lifelong warfarin afterwards"}, {"letter": "E", "text": "Heparin for one week"}], "rationale": "<p>1. <strong>题型识别</strong>：股动脉<strong>栓塞</strong> + 取栓术后 → 长期抗凝 2. <strong>关键决策点</strong>：栓子来源？</p>\n<ul>\n<li>本例：femoral artery <strong>embolism</strong>（栓塞）—— 但<strong>没说心源性</strong></li>\n<li>房颤 → <strong>终身</strong>华法林</li>\n<li>非心源性（动脉粥样硬化等）→ <strong>3-6 月</strong></li>\n<p>3. <strong>处理算法</strong>：</p>\n<li>急性期：IV heparin</li>\n<li>过渡：heparin + warfarin → INR 2-3 后停 heparin</li>\n<li>维持：<strong>warfarin 3-6 月</strong>（非心源性）或<strong>终身</strong>（心源性）</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (Aspirin + warfarin 6mo)：<strong>不联用</strong>（出血风险 ↑，无额外获益）</li>\n<li>B (Lifelong aspirin)：<strong>急性期不用 aspirin</strong></li>\n<li>C (Warfarin 3-6 mo)：<strong>正确</strong>（非心源性）</li>\n<li>D (LMWH 6mo + lifelong warfarin)：<strong>过度</strong></li>\n<li>E (Heparin 1 week)：<strong>不足</strong>（heparin 短期桥接，不长期用）</li>\n<p>5. <strong>锁定 C</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"栓塞 = 终身抗凝\"陷阱</strong>：错。<strong>看栓子来源</strong>——心源性（房颤）才终身；非心源性 3-6 月。</li>\n<li><strong>\"Aspirin + warfarin 联用 = 更佳\"陷阱</strong>：错。<strong>联用不优于单用</strong>（出血风险 ↑）。</li>\n<li><strong>\"LMWH 长期代替 warfarin\"陷阱</strong>：错。LMWH 是桥接，<strong>不</strong>长期使用（贵 + 注射）。</li>\n<li><strong>\"Heparin 长期用\"陷阱</strong>：错。Heparin 长期用会<strong>致 HIT</strong>（肝素诱导血小板减少），<strong>必须</strong>过渡到 warfarin。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>C</strong></p>\n<p>Every patient with acute limb ischemia must be started on anticoagulation therapy with warfarin after embolectomy is performed. <strong>Heparin cover should not be withheld until the INR is in the therapeutic range of 2-3</strong>.</p>\n<ul>\n<li><strong>Long-term warfarin</strong> should be considered following embolism from a cardiac source; otherwise <strong>3-6 months warfarin may suffice</strong>.</li>\n<li><strong>Aspirin is indicated in patients with atherosclerotic changes of the peripheral arteries and chronic limb ischemia</strong>. It has <strong>no role in management of acute limb ischemia</strong>.</li>\n<li><strong>Combination of aspirin and warfarin is not shown to benefit the patient more than warfarin alone</strong> in terms of preventing further thromboembolic events. Furthermore using these two drugs in combination <strong>increases the risk of bleeding</strong>.</li>\n<li>Heparin is only used until the INR is in the therapeutic range and withheld afterwards. This goal is usually achieved in <strong>2-3 days</strong>.</li>\n</ul>\n<p><strong>Clinical pearls</strong>:</p>\n<ul>\n<li>Embolic source not cardiac → warfarin 3-6 months</li>\n<li>Embolic source = AF (cardioembolic) → <strong>lifelong</strong> warfarin (or DOAC)</li>\n<li>Add <strong>statin</strong> for all PAD patients (atherosclerosis)</li>\n<li><strong>Smoking cessation</strong> is critical</li>\n</ul>", "references": "<ul>\n<li>http://www.ncbi.nlm.nih.gov/pmc/articles/PMC111776</li>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：2024 ESVS 急性肢体缺血指南）</li>\n</ul>", "related": ["AMC-Q0264-Acute-Limb-Ischemia-Heparin-Embolectomy", "AMC-Q0262-Limb-Ischemia-Thrombosis", "AMC-Q0245-AF-HF-Metoprolol", "MOC-Cardiology", "Topic-PAD-Anticoagulation"], "bodyHtml": "", "diseases": ["Acute Limb Ischemia"], "complaints": ["paresthesia", "leg pain/swelling"], "search": "急性肢体缺血取栓后 — warfarin 3-6 月（不是终身）\nacute limb ischemia post-embolectomy anticoagulation warfarin 3-6 months heparin bridge\ntreatment prevention complications\n a 55-year-old man presents to the emergency department after sudden onset of pain and paresthesia in his left leg. on examination, the distal pulses of the left lower limb are absent and the limb is cold and painful. a ct angiogram is performed and establishes the presence of femoral artery embolism. the patient was started on intravenous heparin and embolectomy was carried out. which one of the following is the next best step in management? \n correct answer is  c  \n every patient with acute limb ischemia must be started on anticoagulation therapy with warfarin after embolectomy is performed.  heparin cover should not be withheld until the inr is in the therapeutic range of 2-3 . \n \n  long-term warfarin  should be considered following embolism from a cardiac source; otherwise  3-6 months warfarin may suffice . \n  aspirin is indicated in patients with atherosclerotic changes of the peripheral arteries and chronic limb ischemia . it has  no role in management of acute limb ischemia . \n  combination of aspirin and warfarin is not shown to benefit the patient more than warfarin alone  in terms of preventing further thromboembolic events. furthermore using these two drugs in combination  increases the risk of bleeding . \n heparin is only used until the inr is in the therapeutic range and withheld afterwards. this goal is usually achieved in  2-3 days . \n \n  clinical pearls : \n \n embolic source not cardiac → warfarin 3-6 months \n embolic source = af (cardioembolic) →  lifelong  warfarin (or doac) \n add  statin  for all pad patients (atherosclerosis) \n  smoking cessation  is critical \n "}, {"id": "AMC-Q0268", "type": "mcq", "qid": 268, "title": "Heparin 监测 — aPTT（不是 PT / INR / BT）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["investigation", "definition", "treatment"], "topic": ["Heparin Monitoring", "aPTT", "Coagulation Pathways", "Intrinsic", "PT", "INR", "BT"], "difficulty": 3, "correctAnswer": "D", "page": 57, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "heparin", "aptt", "coagulation", "monitoring", "approach-investigation", "approach-definition", "approach-treatment"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0268-Heparin-aPTT-Monitoring.md", "stem": "<p>A 55-year-old man is on heparin after he developed an acute limb ischemia. Which one of the following tests is used for monitoring the response to anticoagulation therapy with heparin?</p>", "options": [{"letter": "A", "text": "Fibrinogen level"}, {"letter": "B", "text": "Prothrombin time (PT)"}, {"letter": "C", "text": "INR"}, {"letter": "D", "text": "Activated partial thromboplastin time (aPTT)"}, {"letter": "E", "text": "Bleeding time (BT)"}], "rationale": "<p>1. <strong>题型识别</strong>：抗凝药与监测的对应 2. <strong>抗凝药 × 监测对应</strong>：</p>\n<table class='md-table'>\n<thead><tr><th>药物</th><th>监测</th></tr></thead>\n<tbody>\n<tr><td><strong>Heparin</strong>（UFH）</td><td><strong>aPTT</strong></td></tr>\n<tr><td>LMWH</td><td>一般不需常规监测（必要时 anti-Xa）</td></tr>\n<tr><td><strong>Warfarin</strong></td><td><strong>PT / INR</strong></td></tr>\n<tr><td>DOAC</td><td>不需常规监测</td></tr>\n<tr><td>Aspirin / Clopidogrel</td><td>临床 / BT（间接）</td></tr>\n<tr><td>Fibrinogen 水平</td><td>DIC 监测</td></tr>\n</tbody>\n</table>\n<p>3. <strong>aPTT 反映的通路</strong>：</p>\n<ul>\n<li><strong>内源性</strong>（intrinsic）通路：prekallikrein, HMW kininogen, factors <strong>VIII, IX, XI, XII</strong></li>\n<li><strong>共同</strong>通路：factors II, V, X, fibrinogen</li>\n<p>4. <strong>aPTT 目标（heparin 治疗）</strong>：</p>\n<li>维持 aPTT 在<strong>基线 1.5-2.5 倍</strong></li>\n<li>治疗范围：<strong>65-100 秒</strong></li>\n<li>起始时<strong>每 6 小时</strong>测，达标后<strong>每 24 小时</strong></li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (Fibrinogen)：用于 DIC 监测</li>\n<li>B (PT)：<strong>外源性</strong>通路 → 反映 warfarin</li>\n<li>C (INR)：<strong>标准化 PT</strong> → 反映 warfarin</li>\n<li>D (aPTT)：<strong>正确</strong></li>\n<li>E (BT)：血小板功能，<strong>不</strong>监测抗凝</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"PT/INR = 万能\"陷阱</strong>：PT/INR 只反映 <strong>warfarin</strong>（外源性通路），<strong>不</strong>反映 heparin。</li>\n<li><strong>\"aPTT = 凝血全套\"陷阱</strong>：aPTT 只反映<strong>内源性 + 共同</strong>通路，<strong>不</strong>反映外源性（PT）和血小板（BT）。</li>\n<li><strong>\"BT 监测抗凝\"陷阱</strong>：BT 是<strong>血小板功能</strong>测试，反映<strong>抗血小板</strong>（Aspirin），<strong>不</strong>反映抗凝。</li>\n<li><strong>\"Fibrinogen = 抗凝监测\"陷阱</strong>：Fibrinogen 用于 <strong>DIC</strong> 监测，不常规用于抗凝监测。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p><strong>Activated partial thromboplastin time (aPTT)</strong> is used to assess the integrity of the following coagulation pathways:</p>\n<ul>\n<li><strong>Intrinsic pathway</strong> that includes prekallikrein, high molecular weight kininogen and factors <strong>VIII, IX, XI, and XII</strong></li>\n<li><strong>Common pathway</strong> including factors <strong>II, V, X, and fibrinogen</strong></li>\n</ul>\n<p><strong>aPTT is also used for monitoring the effects of maintenance therapy with heparin</strong>. Usually the goal of heparin maintenance therapy is to keep aPTT level <strong>1.5-2.5 times above patient's aPTT baseline</strong>. When starting heparin therapy, aPTT is measured <strong>6-hourly</strong> until it is within therapeutic range of 65-100 seconds, and <strong>24 hourly</strong> afterwards.</p>\n<p><strong>INR is used for monitoring warfarin therapy</strong>. It assesses extrinsic coagulation pathway, as does PT. Normal range of PT in an individual not on blood thinners is 11-13.5 seconds. PT and INR are prolonged if the patient is on warfarin, or deficient in factors II (prothrombin), III, IX, X, or fibrinogen, or has vitamin K deficiency.</p>\n<p><strong>BT is used as a platelet function test</strong> with a normal range of 1-9 minutes. It is prolonged if the patient is on <strong>antiplatelet</strong> medications (aspirin, clopidogrel), has thrombocytopenia, or in those with platelet aggregation disorders e.g. Von-Willebrand disease. <strong>BT is not used routinely anymore</strong>.</p>", "references": "<ul>\n<li>Therapeutic Guidelines — Cardiovascular</li>\n<li>（待补：ASH 抗凝监测指南）</li>\n</ul>", "related": ["AMC-Q0264-Acute-Limb-Ischemia-Heparin-Embolectomy", "AMC-Q0267-Limb-Ischemia-Warfarin-3-6mo", "MOC-Cardiology", "Topic-Anticoagulation-Monitoring"], "bodyHtml": "", "diseases": [], "complaints": [], "search": "heparin 监测 — aptt（不是 pt / inr / bt）\nheparin monitoring aptt coagulation pathways intrinsic pt inr bt\ninvestigation definition treatment\n a 55-year-old man is on heparin after he developed an acute limb ischemia. which one of the following tests is used for monitoring the response to anticoagulation therapy with heparin? \n correct answer is  d  \n  activated partial thromboplastin time (aptt)  is used to assess the integrity of the following coagulation pathways: \n \n  intrinsic pathway  that includes prekallikrein, high molecular weight kininogen and factors  viii, ix, xi, and xii  \n  common pathway  including factors  ii, v, x, and fibrinogen  \n \n  aptt is also used for monitoring the effects of maintenance therapy with heparin . usually the goal of heparin maintenance therapy is to keep aptt level  1.5-2.5 times above patient's aptt baseline . when starting heparin therapy, aptt is measured  6-hourly  until it is within therapeutic range of 65-100 seconds, and  24 hourly  afterwards. \n  inr is used for monitoring warfarin therapy . it assesses extrinsic coagulation pathway, as does pt. normal range of pt in an individual not on blood thinners is 11-13.5 seconds. pt and inr are prolonged if the patient is on warfarin, or deficient in factors ii (prothrombin), iii, ix, x, or fibrinogen, or has vitamin k deficiency. \n  bt is used as a platelet function test  with a normal range of 1-9 minutes. it is prolonged if the patient is on  antiplatelet  medications (aspirin, clopidogrel), has thrombocytopenia, or in those with platelet aggregation disorders e.g. von-willebrand disease.  bt is not used routinely anymore . "}, {"id": "AMC-Q0269", "type": "mcq", "qid": 269, "title": "臀/腿间歇性跛行 — 髂总动脉狭窄（Leriche 综合征）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "differential", "definition"], "topic": ["Buttock Claudication", "Peripheral Arterial Disease", "Common Iliac Artery Stenosis", "Leriche Syndrome"], "difficulty": 3, "correctAnswer": "B", "page": 58, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pad", "claudication", "iliac-artery", "approach-diagnosis", "approach-differential", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0269-Buttock-Claudication-Iliac.md", "stem": "<p>A 65-year-old man comes to your practice with complaint of pain in buttock and leg. He has the pain for the past three months, and describes it as cramping felt in the left buttock. The pain is only present when he starts walking and comes on after five minutes or so every time. It radiates to the left thigh and goes away few minutes after he stops walking. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Neurogenic claudication resulting from spinal canal stenosis"}, {"letter": "B", "text": "Stenosis of his left common iliac artery"}, {"letter": "C", "text": "Stenosis of the left superficial femoral artery"}, {"letter": "D", "text": "Osteoarthritis of the right hip joint"}, {"letter": "E", "text": "L4/L5 disc prolapse"}], "rationale": "<p>1. <strong>题型识别</strong>：跛行（claudication）部位 → 定位血管病变 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>65 岁、3 月病史</li>\n<li>疼痛 = 痛性<strong>痉挛</strong>（cramping）—— 提示肌肉缺血</li>\n<li><strong>左臀部痛</strong> → 放射左大腿</li>\n<li><strong>运动诱发，休息缓解</strong>（5 min）—— 经典<strong>间歇性跛行</strong></li>\n<p>3. <strong>跛行定位</strong>（必背）：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th>疼痛部位</th><th>受累动脉</th></tr></thead>\n<tbody>\n<tr><td><strong>臀部 / 大腿</strong></td><td><strong>髂总动脉</strong>（或髂外）</td></tr>\n<tr><td><strong>大腿</strong></td><td>股总动脉</td></tr>\n<tr><td><strong>小腿</strong></td><td>股浅动脉</td></tr>\n<tr><td>足</td><td>胫/腓动脉</td></tr>\n</tbody>\n</table>\n<p>4. <strong>本例</strong>：臀部 + 大腿 → 髂总动脉 5. <strong>Leriche 综合征</strong>：</p>\n<ul>\n<li>髂总动脉闭塞 / 狭窄</li>\n<li>临床三联：<strong>臀肌跛行 + 阳痿 + 下肢远端缺血</strong></li>\n<p>6. <strong>选项排除</strong>：</p>\n<li>A (Neurogenic claudication)：脊髓狭窄 → 站立加重、<strong>弯腰缓解</strong>（与本例\"运动诱发休息缓解\"不符）</li>\n<li>B (Left common iliac stenosis)：<strong>正确</strong></li>\n<li>C (Superficial femoral stenosis)：致<strong>小腿</strong>跛行</li>\n<li>D (Right hip OA)：右髋（与左侧症状不符）+ 部位不符</li>\n<li>E (L4/L5 disc prolapse)：神经根性，<strong>咳嗽 / 喷嚏</strong>加重，<strong>不</strong>随运动规律</li>\n<p>7. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"跛行 = 神经\"陷阱</strong>：神经性跛行（脊髓狭窄）的特点与血管性<strong>不同</strong>——前者<strong>站立 / 行走</strong>痛，<strong>坐 / 弯腰</strong>缓解；后者<strong>行走</strong>痛，<strong>站立休息</strong>缓解。</li>\n<li><strong>\"跛行 = 小腿 / 股浅动脉\"陷阱</strong>：错。<strong>跛行部位 = 病变近端</strong>。<strong>臀</strong>跛行 = 髂总。</li>\n<li><strong>\"L4/L5 致跛行\"陷阱</strong>：L4/L5 椎间盘突出是<strong>神经根性</strong>，<strong>咳嗽加重、卧位缓解</strong>，<strong>不</strong>与行走规律。</li>\n<li><strong>\"OA 致跛行\"陷阱</strong>：OA 是<strong>关节痛</strong>，关节活动诱发，<strong>不</strong>是\"运动 → 肌肉痛 → 休息缓解\"模式。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>The nature of the pain (<strong>cramping</strong>) and its pattern (<strong>brought on by walking, relieved by rest</strong>) is characteristic of <strong>chronic limb ischemia</strong>. Exertional buttock pain that is ischemic in nature (<strong>buttock claudication</strong>) is due to obstruction of either <strong>common iliac or external iliac artery</strong>. <strong>Stenosis of superficial femoral artery leads to ischemic pain of lower leg on walking (calf claudication), not the buttock</strong>.</p>\n<ul>\n<li>(Option A) <strong>Spinal canal stenosis</strong> usually affects the mid or lower lumbar spine and can cause nerve root impingement presentation, which is pain brought on by <strong>standing and relieved by recumbency</strong>. Pain distribution is related to the nerve root distribution rather than muscle groups supplied by an involved artery.</li>\n<li>(Option C) Stenosis of the superficial femoral artery gives rise to leg rather than buttock claudication.</li>\n<li>(Option D) Osteoarthritis of the hip is associated with pain on activity and relief by rest. The pain is felt in the hip and can radiate to the knee. Buttock pain is not common.</li>\n<li>(Option E) L4/L5 disc prolapse can result in unilateral nerve root entrapment leading to neurological findings, not necessarily related to walking. The pain of L4/L5 disc prolapse is <strong>worse on lifting heavy objects, coughing, sneezing or straining at stool</strong>. Numbness and paresthesia are features that are commonly present in nerve root impingement, but not in chronic limb ischemia.</li>\n</ul>\n<p><strong>Leriche syndrome</strong> (aortoiliac occlusive disease):</p>\n<ul>\n<li>Buttock claudication</li>\n<li>Erectile dysfunction</li>\n<li>Absent femoral pulses</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/460178-clinical</li>\n<li>http://www.racgp.org.au/afp/2013/june/peripheral-a</li>\n<li>http://www.awma.com.au/publications/2011_awma_vlug</li>\n<li>（待补：2024 ESVS PAD 指南）</li>\n</ul>", "related": ["AMC-Q0270-Chronic-Limb-Ischemia-COAD", "AMC-Q0271-PAD-Medical-Management", "MOC-Cardiology", "Topic-PAD-Localization"], "bodyHtml": "", "diseases": ["PAD"], "complaints": [], "search": "臀/腿间歇性跛行 — 髂总动脉狭窄（leriche 综合征）\nbuttock claudication peripheral arterial disease common iliac artery stenosis leriche syndrome\ndiagnosis differential definition\n a 65-year-old man comes to your practice with complaint of pain in buttock and leg. he has the pain for the past three months, and describes it as cramping felt in the left buttock. the pain is only present when he starts walking and comes on after five minutes or so every time. it radiates to the left thigh and goes away few minutes after he stops walking. which one of the following is the most likely diagnosis? \n correct answer is  b  \n the nature of the pain ( cramping ) and its pattern ( brought on by walking, relieved by rest ) is characteristic of  chronic limb ischemia . exertional buttock pain that is ischemic in nature ( buttock claudication ) is due to obstruction of either  common iliac or external iliac artery .  stenosis of superficial femoral artery leads to ischemic pain of lower leg on walking (calf claudication), not the buttock . \n \n (option a)  spinal canal stenosis  usually affects the mid or lower lumbar spine and can cause nerve root impingement presentation, which is pain brought on by  standing and relieved by recumbency . pain distribution is related to the nerve root distribution rather than muscle groups supplied by an involved artery. \n (option c) stenosis of the superficial femoral artery gives rise to leg rather than buttock claudication. \n (option d) osteoarthritis of the hip is associated with pain on activity and relief by rest. the pain is felt in the hip and can radiate to the knee. buttock pain is not common. \n (option e) l4/l5 disc prolapse can result in unilateral nerve root entrapment leading to neurological findings, not necessarily related to walking. the pain of l4/l5 disc prolapse is  worse on lifting heavy objects, coughing, sneezing or straining at stool . numbness and paresthesia are features that are commonly present in nerve root impingement, but not in chronic limb ischemia. \n \n  leriche syndrome  (aortoiliac occlusive disease): \n \n buttock claudication \n erectile dysfunction \n absent femoral pulses \n "}, {"id": "AMC-Q0270", "type": "mcq", "qid": 270, "title": "慢性肢体缺血临床表现 — 间歇性跛行 + 慢性体征（皮肤/毛发/肌萎）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["diagnosis", "physical-exam", "definition"], "topic": ["Chronic Limb Ischemia", "Chronic Obstructive Arterial Disease", "Clinical Features", "6 P's Chronic", "PAD"], "difficulty": 2, "correctAnswer": "D", "page": 59, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pad", "chronic-limb-ischemia", "claudication", "approach-diagnosis", "approach-physical-exam", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0270-Chronic-Limb-Ischemia-COAD.md", "stem": "<p>A 76-year-old man comes to your office for evaluation. He mentions that he has difficulty walking because of the left leg pain. The pain is brought on after walking two blocks and gets better when he stops to rest. On examination, the leg skin is shiny and dark. The legs hair is lost and the muscles are atrophied. Distal pulses are difficult to palpate. Which one of the following is the most likely diagnosis?</p>", "options": [{"letter": "A", "text": "Acute limb ischemia"}, {"letter": "B", "text": "Deep vein thrombosis"}, {"letter": "C", "text": "Superficial vein thrombosis"}, {"letter": "D", "text": "Chronic obstructive arterial disease"}, {"letter": "E", "text": "Spinal canal stenosis"}], "rationale": "<p>1. <strong>题型识别</strong>：慢性 vs 急性肢体缺血鉴别 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>76 岁、走路 2 个 block 痛、休息缓解 = <strong>间歇性跛行</strong></li>\n<li>皮肤<strong>光亮 + 深色</strong>（色素沉着）</li>\n<li><strong>毛发脱落</strong>（hair loss）</li>\n<li><strong>肌肉萎缩</strong>（atrophy）</li>\n<li>远端脉搏难以触及</li>\n<p>3. <strong>慢性肢体缺血临床特征</strong>（必背）：</p>\n<li><strong>弱或无远端脉搏</strong>（hallmark）</li>\n<li>皮肤光亮 + 色素沉着</li>\n<li>毛发脱落 + 溃疡</li>\n<li>指甲增厚</li>\n<li>肌肉萎缩</li>\n<li>血管杂音</li>\n<p>4. <strong>关键鉴别：慢性 vs 急性</strong>：</p>\n</ul>\n<table class='md-table'>\n<thead><tr><th></th><th>急性</th><th>慢性</th></tr></thead>\n<tbody>\n<tr><td>起病</td><td>突发</td><td>渐进</td></tr>\n<tr><td>6 P's</td><td>6 个全有</td><td>部分</td></tr>\n<tr><td>皮肤改变</td><td>无（短期）</td><td>光亮/色素/毛发脱失</td></tr>\n<tr><td>肌萎</td><td>无</td><td>有</td></tr>\n<tr><td>治疗</td><td>急诊手术</td><td>内科 + 必要时手术</td></tr>\n</tbody>\n</table>\n<p>5. <strong>选项排除</strong>：</p>\n<ul>\n<li>A (Acute limb ischemia)：<strong>起病急 + 6 P's 全部</strong>——本例慢性体征不符</li>\n<li>B (DVT)：肿、痛、皮温高，<strong>无</strong>皮肤萎缩</li>\n<li>C (Superficial thrombophlebitis)：浅表静脉红、痛、条索</li>\n<li>D (COAD)：<strong>正确</strong></li>\n<li>E (Spinal canal stenosis)：神经性跛行，<strong>站立</strong>加重、<strong>弯腰</strong>缓解</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"跛行 = 急性\"陷阱</strong>：错。<strong>跛行 = 慢性</strong>缺血典型表现。急性缺血是<strong>6 P's 突然出现</strong>。</li>\n<li><strong>\"DVT 致跛行\"陷阱</strong>：DVT 是<strong>静脉</strong>疾病，肿胀、疼痛、皮温高；<strong>不</strong>致皮肤萎缩、毛发脱失。</li>\n<li><strong>\"跛行 = 椎管狭窄\"陷阱</strong>：椎管狭窄是<strong>神经性</strong>，<strong>站立/行走</strong>加重、<strong>弯腰</strong>缓解；<strong>不</strong>致皮肤改变。</li>\n<li><strong>\"肌萎缩 = 神经\"陷阱</strong>：肌萎缩也见于<strong>慢性缺血</strong>（肌肉长期低灌注）—— 不仅限于神经病变。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>Leg pain brought up by walking and relieved by rest and weak or absent distal pulses are characteristic of <strong>chronic limb ischemia</strong> as a result of <strong>chronic obstructive arterial disease</strong>. <strong>Atrophied muscles and shiny hairless skin</strong> supports the diagnosis.</p>\n<p><strong>The clinical findings in chronic limb ischemia include</strong>:</p>\n<ul>\n<li><strong>Weak or absent distal pulses</strong> – the hallmark finding</li>\n<li>Shiny and hyperpigmented skin</li>\n<li>Hair loss and leg ulcers</li>\n<li>Thickened nails</li>\n<li>Muscular atrophy</li>\n<li>Vascular bruits</li>\n</ul>\n<ul>\n<li>(Option A) <strong>Acute limb ischemia</strong> presents with <strong>sudden onset</strong> pain, pallor, paralysis, paresthesia, pulselessness and poikilothermia. This patient has features of chronic limb ischemia.</li>\n<li>(Option B) Leg pain due to <strong>deep vein thrombosis</strong> can be brought on by walking and relieved by rest (similar to chronic limb ischemia), but <strong>other features such as sparse leg hair, pigmentation, muscle atrophy, etc are not features of DVT</strong>. DVT presents with leg pain and tenderness, swelling and warmth.</li>\n<li>(Option C) <strong>Superficial thrombophlebitis</strong> presents with pain, erythema, induration and tenderness along the course of a superficial vein.</li>\n<li>(Option E) Leg pain caused by <strong>neurogenic claudication</strong> due to spinal canal stenosis tends to <strong>get worse with erect posture and relieved by recumbency</strong>. Absence of neurological deficits makes this diagnosis less likely.</li>\n</ul>", "references": "<ul>\n<li>http://emedicine.medscape.com/article/460178-clinical</li>\n<li>http://www.racgp.org.au/afp/2013/june/peripheral-a</li>\n<li>http://www.awma.com.au/publications/2011_awma_vlug</li>\n<li>（待补：2024 ESVS PAD 指南）</li>\n</ul>", "related": ["AMC-Q0269-Buttock-Claudication-Iliac", "AMC-Q0271-PAD-Medical-Management", "AMC-Q0263-Limb-Ischemia-Emergency-Surgery", "MOC-Cardiology", "Topic-Chronic-PAD"], "bodyHtml": "", "diseases": [], "complaints": ["leg pain/swelling"], "search": "慢性肢体缺血临床表现 — 间歇性跛行 + 慢性体征（皮肤/毛发/肌萎）\nchronic limb ischemia chronic obstructive arterial disease clinical features 6 p's chronic pad\ndiagnosis physical-exam definition\n a 76-year-old man comes to your office for evaluation. he mentions that he has difficulty walking because of the left leg pain. the pain is brought on after walking two blocks and gets better when he stops to rest. on examination, the leg skin is shiny and dark. the legs hair is lost and the muscles are atrophied. distal pulses are difficult to palpate. which one of the following is the most likely diagnosis? \n correct answer is  d  \n leg pain brought up by walking and relieved by rest and weak or absent distal pulses are characteristic of  chronic limb ischemia  as a result of  chronic obstructive arterial disease .  atrophied muscles and shiny hairless skin  supports the diagnosis. \n  the clinical findings in chronic limb ischemia include : \n \n  weak or absent distal pulses  – the hallmark finding \n shiny and hyperpigmented skin \n hair loss and leg ulcers \n thickened nails \n muscular atrophy \n vascular bruits \n \n \n (option a)  acute limb ischemia  presents with  sudden onset  pain, pallor, paralysis, paresthesia, pulselessness and poikilothermia. this patient has features of chronic limb ischemia. \n (option b) leg pain due to  deep vein thrombosis  can be brought on by walking and relieved by rest (similar to chronic limb ischemia), but  other features such as sparse leg hair, pigmentation, muscle atrophy, etc are not features of dvt . dvt presents with leg pain and tenderness, swelling and warmth. \n (option c)  superficial thrombophlebitis  presents with pain, erythema, induration and tenderness along the course of a superficial vein. \n (option e) leg pain caused by  neurogenic claudication  due to spinal canal stenosis tends to  get worse with erect posture and relieved by recumbency . absence of neurological deficits makes this diagnosis less likely. \n "}, {"id": "AMC-Q0271", "type": "mcq", "qid": 271, "title": "PAD 治疗 — 戒烟 + Statin + ACEI（不需 Aspirin / Metoprolol）", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "prevention", "definition"], "topic": ["Peripheral Arterial Disease", "Medical Management", "Smoking Cessation", "Statin", "ACE Inhibitor", "ABI"], "difficulty": 3, "correctAnswer": "B", "page": 60, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pad", "smoking-cessation", "statin", "ace-inhibitor", "approach-treatment", "approach-prevention", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0271-PAD-Medical-Management.md", "stem": "<p>A 60-year-old man presents with leg pain for the past 6 months. The pain becomes worse with walking and is relieved when he rests. There is no pain at rest. He has smoked 20 cigarettes per day for the past 30 years. On examination, he is obese with a BMI of 31 and has a blood pressure of 160/110 mmHg on two readings 20 minutes apart. Distal pulses of the left lower limb, including dorsal pedis, are barely perceptible. The skin of the legs is shiny and hairless. Mild muscular atrophy of the leg is noted. Ankle-brachial index (ABI) is 0.7. Which one of the following would be the most appropriate management and advice?</p>", "options": [{"letter": "A", "text": "Smoking cessation, exercise and follow-up in three months"}, {"letter": "B", "text": "Smoking cessation, statins and ACE inhibitors"}, {"letter": "C", "text": "Duplex Doppler venous ultrasonography"}, {"letter": "D", "text": "Aspirin, metoprolol and statins"}, {"letter": "E", "text": "Referral for vascular surgery"}], "rationale": "<p>1. <strong>题型识别</strong>：典型慢性 PAD（ABI 0.7）→ 内科治疗 2. <strong>临床线索</strong>：</p>\n<ul>\n<li>60 岁、吸烟 30 年</li>\n<li>间歇性跛行（运动痛、休息缓解）</li>\n<li>高血压 160/110</li>\n<li>远端脉搏弱 + 皮肤光亮 + 毛发脱失 + 肌萎缩</li>\n<li><strong>ABI 0.7</strong> → <strong>PAD 确诊</strong>（< 0.9 即诊断）</li>\n<p>3. <strong>PAD 治疗三联</strong>：</p>\n<li><strong>戒烟</strong>：最强可改变因素，<strong>5 年生存率翻倍</strong></li>\n<li><strong>运动</strong>：改善 pain-free walking distance</li>\n<li><strong>Statin</strong>：改善血供 + 减低死亡率（<strong>唯一</strong>证明减低血管病死亡率的降脂药）</li>\n<li><strong>ACEI</strong>（特别是 <strong>ramipril</strong>）：改善跛行距离</li>\n<p>4. <strong>选项排除</strong>：</p>\n<li>A (戒烟 + 运动 + 3 mo follow-up)：<strong>缺 Statin + ACEI</strong>（不充分）</li>\n<li>B (戒烟 + Statin + ACEI)：<strong>正确</strong></li>\n<li>C (Duplex Doppler venous USG)：<strong>静脉</strong>检查，PAD 是<strong>动脉</strong>病</li>\n<li>D (Aspirin + Metoprolol + Statin)：<strong>无 Metoprolol 指征</strong>（无心脏病）</li>\n<li>E (Vascular surgery referral)：<strong>ABI 0.7 = 轻-中度</strong>，不需手术（< 0.4 或 critical 才转）</li>\n<p>5. <strong>锁定 B</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"ABI 0.7 = 手术\"陷阱</strong>：错。<strong>ABI 0.4</strong> 以下才是 critical limb ischemia（紧急手术指征）。0.7 = 轻-中度 → 内科。</li>\n<li><strong>\"Metoprolol 治 PAD\"陷阱</strong>：错。BB <strong>不</strong>治 PAD，且对跛行<strong>无获益</strong>（除非有心脏病）。</li>\n<li><strong>\"Aspirin 治 PAD 跛行\"陷阱</strong>：Aspirin 减低 MI / 卒中风险，<strong>不</strong>改善 PAD 症状。</li>\n<li><strong>\"Duplex USG = PAD 检查\"陷阱</strong>：Duplex USG 主要查<strong>静脉</strong>（DVT）；PAD 用 <strong>ABI + 动脉多普勒 / CTA</strong>。</li>\n<li><strong>\"3 月随访足够\"陷阱</strong>：错。<strong>必须 Statin + ACEI</strong> 控制多重风险因素。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>B</strong></p>\n<p>With intermittent calf claudication, presence of the risk factors and an <strong>ABI of 0.7</strong>, the diagnosis of <strong>chronic peripheral arterial disease is almost established</strong>.</p>\n<p><strong>Management of peripheral arterial disease</strong>:</p>\n<ul>\n<li><strong>Smoking cessation</strong> — smoking is the most important predisposing factor for PAD. Smoking cessation alone is associated with improvement in pain-free walk distance, <strong>doubled 5-year survival</strong> and better post-op outcomes.</li>\n<li><strong>Exercise</strong> — improves pain-free walking distance/time, advised for all patients.</li>\n<li><strong>ACE inhibitors</strong> — may improve walking ability in intermittent claudication. The ACE inhibitor with <strong>greatest evidence is ramipril</strong>. ABI does not seem to improve.</li>\n<li><strong>Statins</strong> — improve revascularization, pain-free walking distance and survival. <strong>Of all lipid-lowering agents, only statins have been proved to lower mortality in patients with vascular diseases due to atherosclerotic changes.</strong> Indicated for CAD, PAD, aortic disease (AAA), carotid disease, diabetes.</li>\n<li><strong>Clopidogrel and aspirin</strong> — reduce MI/stroke risk but <strong>not associated with improvement of PAD symptoms</strong>.</li>\n<li><strong>Beta blockers</strong> — <strong>not indicated in absence of cardiac disease</strong>. Have no effect on PAD.</li>\n</ul>\n<p><strong>ABI interpretation</strong>:</p>\n<table class='md-table'>\n<thead><tr><th>ABI</th><th>Interpretation</th><th>Action</th></tr></thead>\n<tbody>\n<tr><td>>1.4</td><td>Abnormal vessel stiffness</td><td>Refer</td></tr>\n<tr><td>1.0-1.4</td><td>Normal</td><td>—</td></tr>\n<tr><td>0.9</td><td>Borderline</td><td>Manage risk factors</td></tr>\n<tr><td><strong><0.9</strong></td><td><strong>Abnormal, diagnostic of PAD</strong></td><td>Manage risk factors; specialist referral if < 0.8</td></tr>\n<tr><td><0.4</td><td><strong>Critical limb ischemia</strong></td><td><strong>Urgent specialist referral</strong></td></tr>\n</tbody>\n</table>\n<p><strong>This patient (ABI 0.7) has mild-to-moderate PAD</strong> → manage medically first.</p>", "references": "<ul>\n<li>http://www.bpac.org.nz/BPJ/2014/April/ankle-brachi</li>\n<li>http://www.awma.com.au/publications/2011_awma_vlug</li>\n<li>（待补：2024 ESVS / AHA PAD 指南）</li>\n</ul>", "related": ["AMC-Q0270-Chronic-Limb-Ischemia-COAD", "AMC-Q0269-Buttock-Claudication-Iliac", "AMC-Q0258-AAA-Repair-Indication", "MOC-Cardiology", "Topic-PAD-Management"], "bodyHtml": "", "diseases": ["PAD"], "complaints": ["leg pain/swelling"], "search": "pad 治疗 — 戒烟 + statin + acei（不需 aspirin / metoprolol）\nperipheral arterial disease medical management smoking cessation statin ace inhibitor abi\ntreatment prevention definition\n a 60-year-old man presents with leg pain for the past 6 months. the pain becomes worse with walking and is relieved when he rests. there is no pain at rest. he has smoked 20 cigarettes per day for the past 30 years. on examination, he is obese with a bmi of 31 and has a blood pressure of 160/110 mmhg on two readings 20 minutes apart. distal pulses of the left lower limb, including dorsal pedis, are barely perceptible. the skin of the legs is shiny and hairless. mild muscular atrophy of the leg is noted. ankle-brachial index (abi) is 0.7. which one of the following would be the most appropriate management and advice? \n correct answer is  b  \n with intermittent calf claudication, presence of the risk factors and an  abi of 0.7 , the diagnosis of  chronic peripheral arterial disease is almost established . \n  management of peripheral arterial disease : \n \n  smoking cessation  — smoking is the most important predisposing factor for pad. smoking cessation alone is associated with improvement in pain-free walk distance,  doubled 5-year survival  and better post-op outcomes. \n  exercise  — improves pain-free walking distance/time, advised for all patients. \n  ace inhibitors  — may improve walking ability in intermittent claudication. the ace inhibitor with  greatest evidence is ramipril . abi does not seem to improve. \n  statins  — improve revascularization, pain-free walking distance and survival.  of all lipid-lowering agents, only statins have been proved to lower mortality in patients with vascular diseases due to atherosclerotic changes.  indicated for cad, pad, aortic disease (aaa), carotid disease, diabetes. \n  clopidogrel and aspirin  — reduce mi/stroke risk but  not associated with improvement of pad symptoms . \n  beta blockers  —  not indicated in absence of cardiac disease . have no effect on pad. \n \n  abi interpretation : \n \n   abi  interpretation  action   \n \n  >1.4  abnormal vessel stiffness  refer  \n  1.0-1.4  normal  —  \n  0.9  borderline  manage risk factors  \n       abnormal, diagnostic of pad   manage risk factors; specialist referral if   \n     critical limb ischemia    urgent specialist referral   \n \n \n  this patient (abi 0.7) has mild-to-moderate pad  → manage medically first. "}, {"id": "AMC-Q0272", "type": "mcq", "qid": 272, "title": "Critical Limb Ischemia（ABI 0.4 + 静息痛）— 紧急血管外科", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "complications", "diagnosis"], "topic": ["Critical Limb Ischemia", "ABI 0.4", "Rest Pain", "Gangrene Risk", "Urgent Vascular Referral"], "difficulty": 4, "correctAnswer": "D", "page": 62, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "pad", "critical-limb-ischemia", "vascular-surgery", "approach-treatment", "approach-complications", "approach-diagnosis"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0272-Critical-Limb-Ischemia-Referral.md", "stem": "<p>A 56-year-old man comes to your practice with an eight-month history of left leg pain, which is brought on by walking, and used to be relieved with rest. Recently, he gets the pain even at rest, particularly at night. He has to dangle his leg for relative pain relief. He has smoked for the past 30 years and been on hydrochlorothiazide for the past 10 years. On examination, he is an overweight man with a BMI of 29, blood pressure of 145/100 mmHg and pulse of 98 bpm. His left leg is hairless with shiny and hyper-pigmented skin. The left femoral pulse is barely perceptible and the right dorsal pedis pulse cannot be felt. He has an ankle-brachial index (ABI) of 0.4 on the left side. Which one of the following is the most appropriate management?</p>", "options": [{"letter": "A", "text": "Advise him to stop smoking, do more exercise and review in three months"}, {"letter": "B", "text": "Advise him to stop smoking, do more exercise and start him on statin"}, {"letter": "C", "text": "Arrange Duplex Doppler ultrasonography and review"}, {"letter": "D", "text": "Urgent referral for vascular surgery"}, {"letter": "E", "text": "Arrange for arteriography and review"}], "rationale": "<p>1. <strong>题型识别</strong>：典型慢性 PAD 已进展到 critical limb ischemia 2. <strong>关键临床线索</strong>：</p>\n<ul>\n<li>8 月跛行史 → 近期<strong>静息痛</strong> + <strong>夜间痛</strong></li>\n<li><strong>悬腿缓解</strong>（dependency relief）—— 抬高=缺血加重，放低=借重力增加灌注（典型 CLI 体征）</li>\n<li>慢性体征：毛发脱失 + 皮肤光亮 + 色素沉着</li>\n<li><strong>ABI 0.4</strong>（< 0.4 = critical）</li>\n<p>3. <strong>Critical Limb Ischemia 诊断标准</strong>：</p>\n<li><strong>静息痛 > 2 周</strong> 和/或</li>\n<li><strong>组织丧失</strong>（溃疡 / 坏疽）</li>\n<li><strong>ABI < 0.4</strong>（或踝压 < 50 mmHg）</li>\n<p>4. <strong>CLI 处理</strong>：</p>\n<li><strong>不是</strong> \"3 月后复查\"或\"再加 statin\"（来不及）</li>\n<li><strong>紧急</strong>血管外科评估</li>\n<li>治疗选择：<strong>血管重建</strong>（旁路 / 腔内）</li>\n<li><strong>不重建</strong> → 坏疽 → 截肢</li>\n<p>5. <strong>选项排除</strong>：</p>\n<li>A (戒烟 + 运动 + 3mo)：CLI <strong>不能等</strong></li>\n<li>B (戒烟 + 运动 + Statin)：同样延误</li>\n<li>C (Duplex + 复查)：Duplex 不能定位动脉病变<strong>解剖</strong>（不能给手术地图）</li>\n<li>D (Urgent vascular referral)：<strong>正确</strong></li>\n<li>E (Arteriography + 复查)：Arteriography 是<strong>有创</strong>，不是初筛；CLI 需<strong>多学科</strong>评估</li>\n<p>6. <strong>锁定 D</strong>。</p>\n</ul>", "traps": "<ul>\n<li><strong>\"ABI 0.4 = 还能保守\"陷阱</strong>：错。<strong>ABI < 0.4 = critical</strong>，需紧急手术。</li>\n<li><strong>\"Duplex 可定位\"陷阱</strong>：错。Duplex 看血流和静脉，<strong>不能</strong>给手术用的解剖图。</li>\n<li><strong>\"静息痛 = 慢病\"陷阱</strong>：静息痛是<strong>晚 期</strong>PAD 体征（<strong>不是</strong>早期），<strong>必须</strong>紧急处理。</li>\n<li><strong>\"Statin 治 CLI\"陷阱</strong>：Statin 减低死亡率，但<strong>不能逆转</strong>已建立的 CLI。</li>\n<li><strong>\"Arteriography = 必做\"陷阱</strong>：Arteriography 由<strong>血管外科</strong>决定，不是首诊就做。</li>\n</ul>", "summary": "", "explanation": "<p>Correct Answer Is <strong>D</strong></p>\n<p>The clinical picture is consistent with <strong>chronic peripheral artery disease (PAD) and limb ischemia</strong> suggested by calf claudication and the presence of risk factors (hypertension, smoking and obesity). The <strong>rest pain and ABI of 0.4 suggests a critical ischemia</strong>, for which surgical intervention is required to be planned; otherwise he will end up gangrene and amputation. <strong>This patient should be urgently referred to a vascular surgeon</strong> for assessment and treatment.</p>\n<ul>\n<li>(Options A and B) Smoking cessation is the most appropriate advice that should be given to patients with PAD. <strong>It increases the exercise tolerance and walking distance and slows progression to more advanced disease.</strong> Statins should be started for patients with PAD as well as those with coronary artery disease, diabetes mellitus, aortic diseases due to atherosclerosis, and carotid artery disease.</li>\n<li>(Option C) <strong>Duplex Doppler ultrasonography has already been used for determination of the ABI.</strong> It is unable to locate the anatomy of the lesion and a road map for surgery.</li>\n<li>(Option E) Once surgical intervention is considered by a surgeon, the presence and site of occlusion should be identified and documented prior to the surgery. This is achieved by either less invasive CT angiography or MRI angiography, or through more invasive procedure of conventional arteriography.</li>\n</ul>\n<p><strong>Critical limb ischemia (CLI) criteria</strong>:</p>\n<ul>\n<li>Rest pain > 2 weeks, AND/OR</li>\n<li>Tissue loss (ulcer/gangrene)</li>\n<li>ABI < 0.4 (or ankle pressure < 50 mmHg)</li>\n<li><strong>Urgent revascularization</strong> needed to avoid amputation</li>\n</ul>", "references": "<ul>\n<li>http://www.imagingpathways.health.wa.gov.au/index</li>\n<li>http://www.bpac.org.nz/BPJ/2014/April/ankle-brachi</li>\n<li>（待补：2024 ESVS PAD 指南）</li>\n</ul>", "related": ["AMC-Q0270-Chronic-Limb-Ischemia-COAD", "AMC-Q0271-PAD-Medical-Management", "AMC-Q0269-Buttock-Claudication-Iliac", "MOC-Cardiology", "Topic-CLI-Revascularization"], "bodyHtml": "", "diseases": ["CLI"], "complaints": ["leg pain/swelling"], "search": "critical limb ischemia（abi 0.4 + 静息痛）— 紧急血管外科\ncritical limb ischemia abi 0.4 rest pain gangrene risk urgent vascular referral\ntreatment complications diagnosis\n a 56-year-old man comes to your practice with an eight-month history of left leg pain, which is brought on by walking, and used to be relieved with rest. recently, he gets the pain even at rest, particularly at night. he has to dangle his leg for relative pain relief. he has smoked for the past 30 years and been on hydrochlorothiazide for the past 10 years. on examination, he is an overweight man with a bmi of 29, blood pressure of 145/100 mmhg and pulse of 98 bpm. his left leg is hairless with shiny and hyper-pigmented skin. the left femoral pulse is barely perceptible and the right dorsal pedis pulse cannot be felt. he has an ankle-brachial index (abi) of 0.4 on the left side. which one of the following is the most appropriate management? \n correct answer is  d  \n the clinical picture is consistent with  chronic peripheral artery disease (pad) and limb ischemia  suggested by calf claudication and the presence of risk factors (hypertension, smoking and obesity). the  rest pain and abi of 0.4 suggests a critical ischemia , for which surgical intervention is required to be planned; otherwise he will end up gangrene and amputation.  this patient should be urgently referred to a vascular surgeon  for assessment and treatment. \n \n (options a and b) smoking cessation is the most appropriate advice that should be given to patients with pad.  it increases the exercise tolerance and walking distance and slows progression to more advanced disease.  statins should be started for patients with pad as well as those with coronary artery disease, diabetes mellitus, aortic diseases due to atherosclerosis, and carotid artery disease. \n (option c)  duplex doppler ultrasonography has already been used for determination of the abi.  it is unable to locate the anatomy of the lesion and a road map for surgery. \n (option e) once surgical intervention is considered by a surgeon, the presence and site of occlusion should be identified and documented prior to the surgery. this is achieved by either less invasive ct angiography or mri angiography, or through more invasive procedure of conventional arteriography. \n \n  critical limb ischemia (cli) criteria : \n \n rest pain > 2 weeks, and/or \n tissue loss (ulcer/gangrene) \n abi  \n  urgent revascularization  needed to avoid amputation \n "}, {"id": "AMC-Q0277", "type": "mcq", "qid": 277, "title": "症状性 NSVT（住院/急诊）— Amiodarone 是一线", "department": "Adult Internal Medicine", "subcategory": "Cardiology", "rawSubcategory": "Cardiology", "approach": ["treatment", "diagnosis", "definition"], "topic": ["Non-Sustained VT", "NSVT", "Amiodarone", "Beta Blocker Outpatient", "Sotalol", "Lignocaine"], "difficulty": 4, "correctAnswer": "A", "page": 68, "tags": ["mcq", "amc", "cardiology", "adult-internal-medicine", "nsvt", "vt", "amiodarone", "approach-treatment", "approach-diagnosis", "approach-definition"], "cssclass": "mcq-cardiology", "color": "#e05a6e", "file": "01-Adult-Internal-Medicine/Cardiology/AMC-Q0277-NSVT-Amiodarone.md", "stem": "<p>A 55-year-old man presents to the Emergency Department with episodes of palpitation and light-headedness. An ECG is obtained and is inconclusive. He is placed on telemetry monitoring. Evaluation of the records shows nonsustained paroxysms of ventricular tachycardia. There are many of these paroxysms during the night. Which one of the following is the next best step in management?</p>", "options": [{"letter": "A", "text": "Amiodarone"}, {"letter": "B", "text": "Bisoprolol"}, {"letter": "C", "text": "Verapamil"}, {"letter": "D", "text": "Synchronized DC cardioversion"}, {"letter": "E", "text": "Digoxin"}], "rationale": "<p>1. <strong>题型识别
